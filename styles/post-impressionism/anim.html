<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── post-impressionism · from sun to stars over a wheat field ──────────────────────────────────
// Bare primed linen with its weave in plain view → a Prussian-blue brush lays the outlines down on a
// drum beat (the hills, a fan of furrows, a winding path, two haystacks, the sun as one swoosh, guide
// arcs for a turning sky) → the colour goes in coarse to fine, every stroke thick and directional: the
// sun in concentric dabs, rings of white, lemon and orange round it against a violet seam, a sky of
// wobbling, spiralling bands, the field combed along its furrows with violet in the troughs, poppies in
// the green wheat → the outlines are struck again over the colour → the picture breathes: the bands
// turn against each other, rings of light pulse out of the sun, a gust runs through the wheat → the sun
// sinks behind the hills in an afterglow and the night repaints the sky band by band, stars igniting in
// rings of yellow and orange against the violet-blue while the haystacks keep burning orange on a blue
// field → the movement's name is painted into the night letter by letter → fade.
// Every stroke is a sprite cut from one atlas of pre-lit brush marks (a loaded head, bristle grooves, a
// ridge of pushed paint, a dry-brush tail and a cast shadow), bowed either way, one per pigment and
// shape. Stroke lists, contours, the weave and the title masks are built once in `ready`; a frame only
// places sprites. The painted world advances on a 15 fps cadence, like painted frame-by-frame animation
// (10 and 7.5 fps while the finished picture only breathes); the outline beats and the fades run at the full rate.
const W = 1920, H = 1080, DUR = 10, TAU = Math.PI * 2;
const CADENCE = 15, LAND_T = 0.2;        // painted-world frame rate; how long one stroke takes to land
const cv = document.getElementById('c');
let ctx = cv.getContext('2d');   // swapped briefly for an offscreen layer while a cache is painted

// ── numbers ──
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const lerp = (a, b, k) => a + (b - a) * k;
const span = (t, a, b) => clamp01((t - a) / (b - a));
const sstep = k => { k = clamp01(k); return k * k * (3 - 2 * k); };
const inOut = k => { k = clamp01(k); return k < 0.5 ? 4 * k * k * k : 1 - 4 * (1 - k) ** 3; };
const easeOut = k => 1 - (1 - clamp01(k)) ** 3;
const overshoot = k => { const d = clamp01(k) - 1; return 1 + d * d * (2.6 * d + 1.6); };   // 0 → ~1.09 → 1
const bump = (x, c, w) => Math.exp(-(((x - c) / w) ** 2));
const wrap01 = a => (((a % TAU) + TAU) % TAU) / TAU;
// while the finished picture only breathes (no stroke is landing) it moves on a slower step
const BREATH = [[3.4, 5.4, 10], [8.45, 10, 7.5]];
const quant = t => {
  const w = BREATH.find(([a, b]) => t >= a && t < b), c = w ? w[2] : CADENCE;
  return Math.floor(t * c + 1e-6) / c;
};
const canvasOf = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const wpick = (r, opts) => {
  let tot = 0; for (const o of opts) tot += o[1];
  let v = r() * tot; for (const o of opts) { v -= o[1]; if (v <= 0) return o[0]; }
  return opts[opts.length - 1][0];
};
function rng(seed) {   // splitmix-style generator: every random choice in the film comes from one of these
  let s = seed >>> 0;
  return () => {
    s = (s + 0x9E3779B9) >>> 0;
    let z = Math.imul(s ^ (s >>> 16), 0x21F0AAAD);
    z = Math.imul(z ^ (z >>> 15), 0x735A2D97);
    return ((z ^ (z >>> 15)) >>> 0) / 4294967296;
  };
}
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(TAU * r());
const logn = (r, med, sig, lo, hi) => Math.min(hi, Math.max(lo, med * Math.exp(sig * gauss(r))));   // brush sizes: mostly medium, a few long
function hash3(i, j, k) {
  let h = (Math.imul(i, 0x27D4EB2F) ^ Math.imul(j, 0x165667B1) ^ Math.imul(k, 0x61C88647)) | 0;
  h = Math.imul(h ^ (h >>> 15), 0x2C1B3C6D);
  h = Math.imul(h ^ (h >>> 12), 0x297A2D39);
  return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
}
function noise(x, y, k = 0) {   // smooth value noise in [0, 1]
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash3(ix, iy, k), b = hash3(ix + 1, iy, k), c = hash3(ix, iy + 1, k), d = hash3(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// ── pigments: [body, the second colour some bristles carry] ──
const PAL = {
  prussian: ['#1c3566', '#2a4579'],
  sunCore: ['#fff3c0', '#ffffff'], sunChrome: ['#f7c31a', '#ffe36e'], sunDeep: ['#ef9f14', '#f9d03c'], sunOrange: ['#ea841e', '#f7bf38'],
  haloWhite: ['#fff2b8', '#ffffff'], haloLemon: ['#f3de3a', '#fff3a8'], haloOrange: ['#ee8a22', '#f8b847'],
  haloViolet: ['#4b3a9e', '#6f5cc4'], haloUltra: ['#2f3f9e', '#5466c4'],
  dLemon: ['#d6ea94', '#f6f8cc'], dTurq: ['#4cc0bb', '#a2e3d5'], dCerul: ['#3393d4', '#8ccbef'], dCobalt: ['#2052b3', '#4f87da'],
  dViridian: ['#29947a', '#6fc5a2'], dPale: ['#b2e0eb', '#ffffff'], dDeep: ['#1c3c94', '#3b6dca'],
  hLilac: ['#9886c7', '#c6b8e2'], hViolet: ['#6755a5', '#9a86cf'], hUltra: ['#3646a2', '#6b76c9'], hDeep: ['#28307e', '#4a4fa2'],
  fOchre: ['#d6a03e', '#f1ca6c'], fChrome: ['#f0ba28', '#fbe17c'], fOrange: ['#e3842a', '#f3b655'], fGold: ['#e8b847', '#fff0a2'],
  fViolet: ['#694d9d', '#8d76c0'], fBlue: ['#3a4ca1', '#6d80cb'],
  wGreen: ['#79a436', '#c4d75c'], wViridian: ['#2a855a', '#6db47b'], wEmerald: ['#4a9641', '#a8ca5c'],
  poppy: ['#e3301c', '#ff6c3c'], poppyDeep: ['#b01e18', '#e4361f'],
  pCream: ['#efdcab', '#fff6da'], pPink: ['#e4b69d', '#f7dac2'], pLilac: ['#b6a0cd', '#e1d4eb'],
  hsGold: ['#efa538', '#fcd46c'], hsOrange: ['#dd7820', '#f5a842'], hsRim: ['#c26616', '#e99c3c'], hsBlue: ['#374b9c', '#6c70c0'], hsViolet: ['#5a4393', '#8a70c0'],
  nUltra: ['#212f8c', '#3b4db9'], nPrussian: ['#132858', '#25447c'], nViolet: ['#392875', '#5a44a2'], nCobalt: ['#2d5cbb', '#6e97e2'],
  nCrest: ['#8aafe8', '#dce8ff'], nDeep: ['#0f1b47', '#1f3070'], nUnder: ['#16255f', '#22347b'],
  sWhite: ['#fffbe2', '#ffffff'], sLemon: ['#f7eb58', '#fffbe0'], sYellow: ['#f5c834', '#f8ec5a'], sOrange: ['#ee8c28', '#f6c936'],
  nfBlue: ['#3c4394', '#5f60b6'], nfIndigo: ['#212a6a', '#363f90'], nfViolet: ['#493b8a', '#6c58ae'], nfGold: ['#c99539', '#ebc262'],
  nhDeep: ['#1a205d', '#2c3482'], nhViolet: ['#33286b', '#4c3e8e'], nPath: ['#7c83c0', '#a7afe2'], nhsBlue: ['#1d2a6d', '#34418f'],
  nPoppy: ['#8a2a3a', '#a5404c'], nGreen: ['#1f4d55', '#23406a'], nGreen2: ['#23406a', '#2c5868'],
  gust: ['#f6e49a', '#fff6d0'],
  tChrome: ['#f5c11a', '#ffe47c'], tOrange: ['#ef871c', '#f8b142'], tLemon: ['#f8e558', '#fffbd2'],
  tHaloO: ['#f29a2e', '#f7b34a'], tHaloY: ['#f7c843', '#fbe28a'],
};
const rgbOf = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));

// ── the stroke atlas: one row per pigment, 16 brush shapes, pre-lit, in 3 sizes ──
// shapes 0–5 are drags bowing one way, 6–11 the same drags bowing the other way, 12–13 round dabs, 14–15 washes
const SW = 128, SH = 52, MID = 26, HALF = 15, NSHAPE = 16, BX0 = 5, BX1 = 123;
const KX = SW / (BX1 - BX0), KY = SH / (2 * HALF);   // sprite cell over the paint body it holds
const DRAGS = 6, DAB = 12, WASH = 14;
const KEYS = Object.keys(PAL), KIDX = Object.fromEntries(KEYS.map((k, i) => [k, i]));
const pig = key => {
  if (!(key in KIDX)) throw new Error('no pigment ' + key);
  return KIDX[key];
};
const LX = -0.55, LY = -0.83;            // the studio light, from the upper left
const SHADOW_RGB = [24, 20, 36];
let ATLAS;

// coverage, relief, two-colour streaks and bristle tone of one brush mark. kind: 0 loaded drag that tapers,
// 1 dry drag whose bristles run out, 2 drag lifted off square with a ridge where the paint piles, 3 round dab,
// 4 thin broad wash for the underpainting. bow: which way the drag curves (its middle pushed to -y or +y)
function shapeField(seed, kind, bow) {
  const r = rng(seed), n = SW * SH;
  const a = new Float32Array(n), h = new Float32Array(n), mix = new Float32Array(n), tone = new Float32Array(n), dryness = new Float32Array(n);
  const dab = kind === 3, wash = kind === 4;
  const head = 0.12 + 0.08 * r(), taper = kind === 2 ? 0.94 : 0.5 + 0.15 * r();
  const bendPx = dab || wash ? 0 : bow * (4.5 + 1.8 * r());
  const nb = (dab ? 9 : wash ? 20 : 11) + Math.floor(r() * 6), blob = 0.3 + 0.3 * r();
  const dry = kind === 1 ? 0.55 + 0.25 * r() : kind === 0 ? 0.2 + 0.2 * r() : wash ? 0.5 : 0.1;
  const side = r() < 0.5;   // some brushes carry the second colour along one side
  const ns = 1 + Math.floor(r() * 9999);
  const bTone = [], bLoad = [], bMix = [];
  for (let b = 0; b < nb; b++) {
    bTone.push((r() - 0.5) * (wash ? 0.08 : 0.16)); bLoad.push(0.7 + 0.6 * r());
    bMix.push(wash ? 0 : side && b < nb * 0.35 ? 0.55 + 0.45 * r() : r() < 0.22 ? 0.4 + 0.5 * r() : 0);
  }
  for (let py = 0; py < SH; py++) for (let px = 0; px < SW; px++) {
    const i = py * SW + px, u = (px + 0.5 - BX0) / (BX1 - BX0);
    if (u <= 0 || u >= 1) continue;
    let hw;
    if (dab) hw = HALF * Math.pow(1 - (2 * u - 1) ** 2, 0.6) * (1 + 0.1 * Math.sin(u * 7 + ns));
    else {
      hw = HALF * (wash ? 1 - 0.1 * u : 1.04 - 0.36 * u);
      if (u < head) hw *= Math.pow(1 - (1 - u / head) ** 2, 0.5) * (1 + 0.1 * Math.sin(Math.PI * u / head));
      if (u > taper) hw *= kind === 2 ? Math.sqrt(1 - ((u - taper) / (1 - taper)) ** 2) : Math.pow((1 - u) / (1 - taper), 0.85);
    }
    const yc = MID - bendPx * (1 - 4 * (u - 0.5) ** 2);
    const vr = py + 0.5 - yc, edge = noise(u * (wash ? 6 : 11), vr < 0 ? 1.5 : 7.5, ns) - 0.5;
    const hwE = Math.max(0.01, hw * (1 + (wash ? 0.34 : 0.24) * edge)), vn = vr / hwE, av = Math.abs(vn);
    if (av >= 1.05) continue;
    const edgeA = clamp01((1 - av) * hwE / (wash ? 5 : 1.1) + 0.05);
    const bc = (vn + 1) * 0.5 * nb, b = Math.min(nb - 1, Math.max(0, Math.floor(bc))), fb = bc - Math.floor(bc);
    // dry brush: bristles run out of paint toward the tail (a wash is scrubbed thin at both ends)
    const dk = dab ? 0 : wash ? Math.max(clamp01((u - 0.62) / 0.38), clamp01((0.16 - u) / 0.16)) : clamp01((u - taper + 0.3) / (1.05 - taper + 0.3));
    const th = dk * dry * 1.4 + 0.03, nz = noise(b * 2.3 + 0.5, u * (10 + 6 * dry), ns + 1);
    let cov = sstep((nz - th + 0.05) / 0.1);
    if (wash) cov *= 0.72 + 0.28 * noise(b * 1.9, u * 5, ns + 5);           // streaky, thin paint
    if (noise(px * 0.45, py * 0.6, ns + 2) < 0.02 + 0.04 * u) cov *= 0.5;   // the brush skipping over the canvas tooth
    a[i] = edgeA * cov * (wash ? 0.95 : 1);
    dryness[i] = dk;
    const body = 0.45 * clamp01((1 - av) * 3.2);
    const lip = 0.26 * Math.exp(-(((av - 0.8) / 0.13) ** 2));
    const groove = 0.3 * (0.5 - 0.5 * Math.cos(TAU * fb)) * bLoad[b];
    const load = dab ? 0.4 * (1 - vn * vn) : blob * Math.exp(-(((u - head * 0.8) / 0.09) ** 2)) * (1 - vn * vn);
    const pile = kind === 2 ? 0.45 * Math.exp(-(((u - 0.93) / 0.035) ** 2)) * (1 - vn * vn) : 0;
    h[i] = wash ? (0.25 * body + 0.12 * groove) * cov
      : (body + lip + groove + load + pile) * (dab ? 1 : 1.05 - 0.45 * u) * (0.4 + 0.6 * cov) * (1 - 0.55 * dk);   // dry bristles carry little relief
    mix[i] = bMix[b] * (0.55 + 0.45 * noise(b * 1.7, u * 4, ns + 3));
    tone[i] = bTone[b] + 0.06 * (noise(px * 0.2, py * 0.7, ns + 4) - 0.5);
  }
  return { a, h, mix, tone, dryness };
}
const shapeSpec = i => (i < 12 ? { seed: 4100 + 131 * (i % 6), kind: [0, 1, 2, 0, 1, 0][i % 6], bow: i < 6 ? 1 : -1 }
  : i < 14 ? { seed: 5100 + i, kind: 3, bow: 0 } : { seed: 5200 + i, kind: 4, bow: 0 });

function buildAtlas() {
  const base = canvasOf(NSHAPE * SW, KEYS.length * SH), bg = base.getContext('2d');
  const img = bg.createImageData(base.width, base.height), D = img.data, BW = base.width;
  const ll = Math.hypot(-0.35, -0.8, 0.55), L = [-0.35 / ll, -0.8 / ll, 0.55 / ll];
  const hl = Math.hypot(L[0], L[1], L[2] + 1), Hv = [L[0] / hl, L[1] / hl, (L[2] + 1) / hl];
  const cols = KEYS.map(k => PAL[k].map(rgbOf)), n = SW * SH;
  for (let s = 0; s < NSHAPE; s++) {
    const sp = shapeSpec(s), f = shapeField(sp.seed, sp.kind, sp.bow);
    const shade = new Float32Array(n), gloss = new Float32Array(n), shad = new Float32Array(n);
    for (let y = 1; y < SH - 1; y++) for (let x = 1; x < SW - 1; x++) {
      const i = y * SW + x;
      const gx = (f.h[i + 1] - f.h[i - 1]) * 1.25, gy = (f.h[i + SW] - f.h[i - SW]) * 1.25;
      const nl = Math.hypot(gx, gy, 1), nx = -gx / nl, ny = -gy / nl, nz = 1 / nl;
      const dif = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
      shade[i] = (1 + 0.8 * (dif - L[2])) * (0.86 + 0.14 * Math.min(1, f.h[i] * 1.5));
      gloss[i] = Math.pow(Math.max(0, nx * Hv[0] + ny * Hv[1] + nz * Hv[2]), 26) * 0.36 * Math.min(1, f.h[i] * 2);
      if (y >= 3 && x >= 2) {   // paint up and to the left casts a soft shadow here; dry bristles barely cast one
        let sa = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) sa += f.a[(y - 2 + dy) * SW + x - 1 + dx];
        shad[i] = 0.3 * (sa / 9) * (1 - 0.7 * f.dryness[(y - 2) * SW + x - 1]);
      }
    }
    for (let c = 0; c < KEYS.length; c++) {
      const [A, B] = cols[c], ox = s * SW, oy = c * SH;
      for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
        const i = y * SW + x, pa = f.a[i], sa = shad[i] * (1 - pa), oa = pa + sa;
        if (oa < 0.004) continue;
        const m = f.mix[i], k = (1 + f.tone[i]) * shade[i], gl = gloss[i] * 255, o = ((oy + y) * BW + ox + x) * 4;
        for (let ch = 0; ch < 3; ch++) {
          const pc = Math.min(255, (A[ch] + (B[ch] - A[ch]) * m) * k + gl);
          D[o + ch] = (pc * pa + SHADOW_RGB[ch] * sa) / oa;
        }
        D[o + 3] = oa * 255;
      }
    }
  }
  bg.putImageData(img, 0, 0);
  const half = src => {
    const c = canvasOf(src.width / 2, src.height / 2), g = c.getContext('2d');
    g.imageSmoothingQuality = 'high'; g.drawImage(src, 0, 0, c.width, c.height); return c;
  };
  const l1 = half(base);
  ATLAS = [base, l1, half(l1)];
}

// One brush mark of pigment p, shape v, centred on (x, y) in picture space, running head → tail along `ang`.
// A drag (v < 6) bows toward `side` (+1: away from the +y side of its unflipped frame, i.e. away from a
// curvature centre lying there). `grow` < 1 while it lands: the brush drags the mark out from its head, a
// little past full length, wider at first contact.
const CAM = { z: 1, ox: 0, oy: 0 };
function stamp(g, p, v, x, y, ang, len, wid, grow = 1, side = 1) {
  if (grow <= 0) return;
  const z = CAM.z, rl = len * KX, rw = wid * KY, sl = rl * z;
  const lvl = sl > 92 ? 0 : sl > 46 ? 1 : 2, sc = 1 / (1 << lvl), A = ATLAS[lvl];
  const c = Math.cos(ang), s = Math.sin(ang), f = s * LX - c * LY >= 0 ? 1 : -1;   // keep each mark's lit ridge toward the light
  const shape = v < DRAGS ? v + (side * f > 0 ? 0 : DRAGS) : v;
  g.setTransform(z * c, z * s, -z * s * f, z * c * f, z * x + CAM.ox, z * y + CAM.oy);
  const sx = shape * SW * sc, sy = p * SH * sc;
  if (grow >= 1) { g.drawImage(A, sx, sy, SW * sc, SH * sc, -rl / 2, -rw / 2, rl, rw); return; }
  const k = overshoot(grow), kc = Math.min(1, k), sq = 1 + 0.3 * (1 - grow);
  g.drawImage(A, sx, sy, SW * sc * kc, SH * sc, -rl / 2, -rw * sq / 2, rl * k, rw * sq);
}
const growOf = (tau, born) => (tau - born) / LAND_T + 0.34;
const washAlpha = (tau, born) => 0.45 + 0.55 * span(tau - born, 0, 0.45);   // a wash goes on thin, then thickens
// which way a mark at (x, y) heading `ang` should bow so that it curves round the centre (cx, cy)
const bowAway = (x, y, ang, cx, cy) => ((cx - x) * -Math.sin(ang) + (cy - y) * Math.cos(ang) >= 0 ? 1 : -1);

// ── the picture's geometry ──
const DC = { x: 1180, y: 470 }, SUN_R = 95;          // the day swirl turns round the sun
const NC = { x: 1198, y: 446 };                        // the night swirl: just above where the sun goes down
const VP = { x: 990, y: 598 }, BEND = 120, DEPTH = 482, FIELD_Y = 610;
const ridgeFar = x => 580 - 34 * bump(x, 380, 300) - 26 * bump(x, 820, 220) - 20 * bump(x, 1600, 280) - 30 * bump(x, 1960, 220) + 4 * Math.sin(x * 0.021 + 0.5);
const ridgeNear = x => 601 - 16 * bump(x, 140, 260) - 12 * bump(x, 1020, 300) - 15 * bump(x, 1760, 240) + 2.5 * Math.sin(x * 0.033 + 1.1);
const SKY_FLOOR = x => ridgeFar(x) + 14;              // the sky is clipped a little below the far ridge
// the furrows fan out from the vanishing point, bending to the right as they near us and rolling with the
// ground: a sideways sway shared by every furrow (and the path), strongest mid-field
const ROLL = 95;
const sway = g => BEND * g * g + ROLL * g * Math.sin(2.6 * g + 0.4);
const swayD = g => 2 * BEND * g + ROLL * (Math.sin(2.6 * g + 0.4) + 2.6 * g * Math.cos(2.6 * g + 0.4));   // d sway / dg
const furrowX = (s, y) => VP.x + s * (y - VP.y) + sway((y - VP.y) / DEPTH);
const furrowS = (x, y) => { const d = Math.max(2, y - VP.y); return (x - VP.x - sway(d / DEPTH)) / d; };
const furrowAng = (x, y) => { const d = Math.max(2, y - VP.y); return Math.atan2(1, furrowS(x, y) + swayD(d / DEPTH) / DEPTH); };
const FURROW = 0.16;                                    // furrow period in furrow units
const pathS = y => { const g = clamp01((y - VP.y) / DEPTH); return 0.04 - 0.42 * g + 0.25 * Math.sin(g * 4.2 + 0.6) * g; };
const PATH_HALF = 0.2;
const STACKS = [   // the far, smaller stack first; both crowns sit well below the hills
  { cx: 1462, by: 718, half: 84, h: 93, lit: -1 },
  { cx: 520, by: 795, half: 128, h: 155, lit: 1 },
];
const DOME_P = 1.8;
// half-width of a stack at height fraction q: a rounded dome whose base flares a little
const domeHalf = (k, q) => k.half * Math.sqrt(Math.max(0, 1 - Math.pow(Math.max(0, q), DOME_P))) * (1 + 0.07 * Math.max(0, 1 - Math.max(0, q) / 0.2) ** 2);
const inDome = (k, x, y) => { const q = (k.by - y) / k.h; return q >= -0.03 && q <= 1 && Math.abs(x - k.cx) <= domeHalf(k, q); };
const shadowOf = k => ({ cx: k.cx - k.lit * k.half * 0.9, cy: k.by - 2, rx: k.half * 1.08, ry: k.h * 0.14 });
const greenZone = (x, y) => y > 872 + 30 * noise(x * 0.01, 3, 5) && (x < 560 + 90 * noise(y * 0.012, 1, 6) || x > 1250 - 90 * noise(y * 0.012, 2, 6));

// ── timeline ──
const BEAT0 = 0.15, BEAT = 0.1, REASSERT0 = 2.55;      // outline beats; outlines struck again over the colour
const PULSES = [3.25, 4.05, 4.85];                       // rings of light out of the sun
const GUST = [3.3, 4.95];
const SINK = [5.4, 7.0];
const NIGHT0 = 5.45, NIGHT_SPREAD = 0.9, NIGHT_SWEEP = 0.36;
const TT0 = 7.12, TSTEP = 0.052;                         // title letters
const CLOSE = 9.35;
const spinClock = tau => (tau < 3.0 ? 0 : tau < 3.8 ? (tau - 3) ** 2 / 1.6 : tau - 3.4);   // the sky starts turning gently
const nightClock = tau => Math.max(0, tau - NIGHT0);
const sunDy = tau => 330 * sstep(span(tau, SINK[0], SINK[1]));
const haloSwell = tau => { let s = 0; for (const p of PULSES) s += Math.exp(-(((tau - p - 0.08) / 0.14) ** 2)); return s; };
const CAM_Z = 1.06;
function setCamera(tau) {   // a slow push toward the sun
  const z = 1 + (CAM_Z - 1) * inOut(span(tau, 3.45, 4.45));
  CAM.z = z; CAM.ox = DC.x * (1 - z); CAM.oy = DC.y * (1 - z);
}
const toWorld = (sx, sy) => [DC.x + (sx - DC.x) / CAM_Z, DC.y + (sy - DC.y) / CAM_Z];   // a point of the final, pushed-in frame

// ── the swirl's bands ──
// Each band is a closed curve round its own slightly off-centre middle: it wobbles (3 and 7 lobes) and,
// further out, opens into a spiral whose seam sits low, behind the land. A band turns rigidly.
const BANDS = [], NBANDS = [];
function makeBand(c, k, r0, bw, omega, wobble, pitch, ph7, offset = true) {
  const off = offset ? 18 * Math.min(1, 0.25 + k / 3) : 0, oa = 0.45 * k + 0.6;
  return { cx: c.x + off * Math.cos(oa), cy: c.y + off * 0.8 * Math.sin(oa), r0, bw, omega, dir: omega >= 0 ? 1 : -1,
    a3: wobble, a7: wobble * 0.45, p3: 0.7 + 0.38 * k, p7: ph7 + 0.55 * k, pitch };
}
const bandR = (b, th) => b.r0 + b.pitch * wrap01(th - Math.PI / 2) + b.a3 * Math.sin(3 * th + b.p3) + b.a7 * Math.sin(7 * th + b.p7);
const bandDR = (b, th) => b.pitch / TAU + 3 * b.a3 * Math.cos(3 * th + b.p3) + 7 * b.a7 * Math.cos(7 * th + b.p7);
// a mark on band b at band angle th, lo px out from its inner edge: offset from the band's middle and the
// curve's tangent there (pointing the way th grows)
// a band that `follow`s another starts on a plain circle and ends on that band's inner curve, closing the gap
// between the round halo and the swirl
function bandPoint(b, th, lo) {
  const f = lo / b.bw, rho = b.follow ? b.r0 + f * (bandR(b.follow, th) - b.r0) : bandR(b, th) + lo;
  const dr = b.follow ? f * bandDR(b.follow, th) : bandDR(b, th), c = Math.cos(th), s = Math.sin(th);
  return { dx: rho * c, dy: rho * s, tan: Math.atan2(dr * s + rho * c, dr * c - rho * s), rho };
}
const onSky = (x, y, m = 80) => x > -m && x < W + m && y > -m && y < 650;
function everVisible(b, dx, dy, turn) {   // is a mark ever on screen while its band turns by up to `turn`?
  for (let i = 0; i <= 6; i++) {
    const a = turn * i / 6, c = Math.cos(a), s = Math.sin(a);
    if (onSky(b.cx + dx * c - dy * s, b.cy + dx * s + dy * c)) return true;
  }
  return false;
}
const DAY_R0 = 222, DAY_BW = 66, NBW = 72, NK = 18;
const nightDir = k => (k % 2 ? -1 : 1);
const arrivalKT = (k, th) => NIGHT0 + (NK - 1 - Math.min(k, NK - 1)) / (NK - 1) * NIGHT_SPREAD + wrap01(nightDir(k) * (th + Math.PI / 2)) * NIGHT_SWEEP;
const nightArrival = (x, y) => arrivalKT(Math.floor(Math.hypot(x - NC.x, y - NC.y) / NBW), Math.atan2(y - NC.y, x - NC.x));
function makeBands(r) {
  for (let k = 0; DAY_R0 + k * DAY_BW < 1360; k++) {
    const r0 = DAY_R0 + k * DAY_BW;
    BANDS.push(makeBand(DC, k, r0, DAY_BW, (k % 2 ? -1 : 1) * (15 + 7 * ((k * 7) % 3)) / (r0 + DAY_BW / 2), 10 + 8 * clamp01(r0 / 700), DAY_BW * 0.5, 1.3));
  }
  const b1 = BANDS[1];   // the first band hugs the halo and turns with the band outside it
  Object.assign(BANDS[0], { r0: 210, cx: b1.cx, cy: b1.cy, omega: b1.omega, dir: b1.dir, follow: b1 });
  for (let k = 0; k <= NK; k++) {
    const r0 = k * NBW;
    NBANDS.push(makeBand(NC, k, r0, NBW, k === 0 ? 0.26 : nightDir(k) * (14 + 5 * (k % 3)) / (r0 + NBW / 2),
      k < 2 ? 3 : 9 + 8 * clamp01(r0 / 650), k >= 3 ? NBW * 0.5 : 0, 2.1, k > 0));
  }
}
// rotation of every band at tau, once per frame
const turnOf = (bands, clock) => bands.map(b => { const a = b.omega * clock; return [a, Math.cos(a), Math.sin(a)]; });

// ── stroke lists ──
const DAY = [], SUN = [], AFTER = [], NIGHT = [], LAND = [], STARS = [], TFILL = [], HALO = [];
let CONTOURS = [], WEAVE, RELIEF, MASK, MASKG, GLOW, TT, TTG, TITLE_ART;

// marks laid along a lane of a band, end to end; gapK < 1 overlaps them, > 1 leaves canvas between
function lane(r, b, bi, lo, o, list) {
  const turn = b.omega * o.spin;
  let th = r() * TAU;
  const end = th + TAU, rho0 = b.follow ? b.r0 + lo * 1.4 : b.r0 + lo + b.pitch / 2;
  while (th < end) {
    const len = o.len(), step = len * o.gapK / Math.max(20, rho0), thc = th + step / 2;
    th += step * (0.85 + 0.3 * r());
    if (o.skip && r() < o.skip) continue;
    const pt = bandPoint(b, thc, lo + (o.jit ?? 5) * (r() - 0.5) * 2);
    if (!everVisible(b, pt.dx, pt.dy, turn)) continue;
    const ang = pt.tan + (b.dir > 0 ? Math.PI : 0) + (o.off ?? 0.08) + (r() - 0.5) * (o.angJit ?? 0.2);
    const key = o.key(pt, thc), v = o.v ?? (r() * DRAGS) | 0;
    list.push(Object.assign({ b: bi, dx: pt.dx, dy: pt.dy, rho: pt.rho, th: thc, a0: ang, side: bowAway(pt.dx, pt.dy, ang, 0, 0),
      len, wid: o.wid(len), p: pig(key), v, born: o.born(thc, pt) }, o.extra ? o.extra(key, pt, thc) : {}));
  }
}
const skyLen = (r, med = 55) => () => logn(r, med, 0.38, 25, 120);
const skyWid = (r, med = 17) => len => Math.min(28, Math.max(10, logn(r, med, 0.22, 10, 28) * Math.pow(len / 55, 0.25)));

function buildSun(r) {
  const DUSK = { sunCore: 'sunChrome', sunChrome: 'sunDeep', sunDeep: 'sunOrange', sunOrange: 'hsRim', haloWhite: 'haloLemon', haloLemon: 'haloOrange',
    haloOrange: 'poppy', haloViolet: 'nViolet', haloUltra: 'nUltra' };
  const put = (rad, th, len, wid, key, v, born, ring, spin, halo) => {
    const ang = th + Math.PI / 2 + (r() - 0.5) * (v >= WASH ? 0.25 : 0.5);
    SUN.push({ r: rad, th, da: ang - th, len: len * (v >= WASH ? 1 : 0.75 + 0.5 * r()), wid, p: pig(key), pd: pig(DUSK[key]), v, side: 1,
      born, dusk: 5.5 + ring * 0.04 + r() * 0.05, spin, halo });
  };
  const wv = () => WASH + ((r() * 2) | 0);
  // underpainting: thin chrome over the disc, then white, lemon, orange and the violet seam where the halo goes
  put(0, r() * TAU, 92, 84, 'sunChrome', wv(), 0.7, 0, 0.05, false);
  [[40, 6, 62, 46, 'sunChrome'], [74, 10, 60, 36, 'sunDeep']].forEach(([rad, n, len, wid, key]) => {
    for (let j = 0; j < n; j++) put(rad, j * TAU / n + r() * 0.3, len, wid, key, wv(), 0.7 + j / n * 0.05, 1, 0.05, false);
  });
  [[113, 12, 'haloWhite', 30], [139, 14, 'haloLemon', 30], [166, 16, 'haloOrange', 30], [200, 18, 'haloViolet', 42]].forEach(([rad, n, key, wid], li) => {
    for (let j = 0; j < n; j++) put(rad, j * TAU / n + r() * 0.2, TAU * rad / n * 1.35, wid, key, wv(), 0.98 + li * 0.07 + j / n * 0.1, 7 + li * 2, (li % 2 ? -1 : 1) * 0.07, true);
  });
  // the disc: concentric rings of dabs, white-hot in the middle, deep chrome at the rim
  const disc = [[0, 1, 'sunCore'], [15, 5, 'sunCore'], [30, 9, 'sunChrome'], [45, 13, 'sunChrome'], [60, 17, 'sunDeep'], [75, 21, 'sunChrome'], [89, 25, 'sunOrange']];
  disc.forEach(([rad, n, key], ring) => {
    for (let j = 0; j < n; j++) {
      put(rad + (r() - 0.5) * 7, (j + 0.4 * r()) * TAU / n + ring * 0.7, rad ? Math.min(36, TAU * rad / n * 1.55) : 34, rad ? logn(r, 15, 0.15, 11, 20) : 30, key,
        rad ? (r() * DRAGS) | 0 : DAB, 0.72 + ring * 0.055 + j / n * 0.06, ring, (ring % 2 ? -1 : 1) * 0.12, false);
    }
  });
  // the halo: rings of pure colour, white-yellow, lemon, orange, then a solid violet and ultramarine band against the blue
  const halo = [[107, 'haloWhite', 16], [119, 'haloWhite', 16], [133, 'haloLemon', 16], [145, 'haloLemon', 16], [159, 'haloOrange', 16], [172, 'haloOrange', 16],
    [189, 'haloViolet', 18], [204, 'haloUltra', 18], [216, 'haloViolet', 13]];
  halo.forEach(([rad, key, wid], li) => {
    const n = Math.round(TAU * rad / 27), th0 = r() * TAU;
    for (let j = 0; j < n; j++) put(rad + (r() - 0.5) * 6, th0 + (j + 0.35 * r()) * TAU / n, TAU * rad / n * 1.45, logn(r, wid, 0.15, 10, 22),
      key === 'haloUltra' && r() < 0.3 ? 'haloViolet' : key, (r() * DRAGS) | 0, 1.02 + li * 0.065 + j / n * 0.1, 7 + li, (li % 2 ? -1 : 1) * 0.07, true);
  });
}

function buildDaySky(r) {
  const BKEYS = [['dLemon', 'dPale'], ['dTurq', 'dLemon'], ['dPale', 'dCerul'], ['dCobalt', 'dDeep'], ['dTurq', 'dViridian'], ['dCerul', 'dPale'],
    ['dPale', 'dTurq'], ['dCobalt', 'dCerul'], ['dViridian', 'dTurq'], ['dCerul', 'dCobalt'], ['dPale', 'dCerul'], ['dDeep', 'dCobalt'],
    ['dTurq', 'dCerul'], ['dCerul', 'dPale'], ['dCobalt', 'dDeep'], ['dViridian', 'dCerul'], ['dCerul', 'dCobalt'], ['dDeep', 'dCobalt']];
  const LIGHT = new Set(['dLemon', 'dPale', 'dTurq']);
  const washes = [], strokes = [], fine = [], spin = DUR - 3.4;
  const sweepBorn = (b, start, sweep) => th => start + wrap01(b.dir * (th + Math.PI / 2)) * sweep + r() * 0.04;
  const extra = bi => key => ({ pN: pig('nUnder'), pS: pig(bi % 2 ? 'haloLemon' : 'haloWhite'), sw: 0 });
  BANDS.forEach((b, k) => {
    const r0 = b.r0, [main, alt] = BKEYS[k % BKEYS.length], next = BKEYS[(k + 1) % BKEYS.length][0], start = 1.15 + k * 0.075;
    // coarse: a thin wash of the band's colour; the outermost bands are left with bare canvas showing
    for (const lo of b.follow ? [0.25 * DAY_BW, 0.75 * DAY_BW] : [DAY_BW / 2]) {
      lane(r, b, k, lo, { spin, len: () => 140, wid: () => 64, gapK: 0.6, v: undefined, key: () => main, born: sweepBorn(b, start - 0.1, 0.55),
        skip: clamp01((r0 - 640) / 520) * 0.9, extra: extra(k), jit: 3 }, washes);
    }
    for (const s of washes) if (s.b === k && s.v < WASH) s.v = WASH + ((r() * 2) | 0);
    const outer = clamp01((r0 - 500) / 700), nl = b.follow ? 5 : 4;
    for (let l = 0; l < nl; l++) {
      lane(r, b, k, -4 + (l + 0.5) * (DAY_BW + 8) / nl, { spin, len: skyLen(r), wid: skyWid(r, 17 - 2 * outer), gapK: 0.68 + 0.42 * outer, key: () => wpick(r, [[main, 64], [alt, 26], [next, 10]]),
        born: sweepBorn(b, start, 0.55), extra: extra(k), jit: 6 }, strokes);
    }
    // fine: thinner crests along the band edges
    const crest = LIGHT.has(main) ? 'dPale' : main === 'dDeep' || main === 'dCobalt' ? 'dCerul' : 'dPale';
    lane(r, b, k, DAY_BW * (k % 2 ? 0.1 : 0.9), { spin, len: skyLen(r, 46), wid: skyWid(r, 11), gapK: 1.5, key: () => (r() < 0.75 ? crest : 'haloWhite'),
      born: sweepBorn(b, 2.3 + k * 0.042, 0.3), extra: extra(k) }, fine);
  });
  // the sky behind the sun, only seen as it sets: dusk colours by height, deep orange low down, violet higher up
  const inner = BANDS.length;
  BANDS.push(makeBand(DC, 0, 0, 120, 0.08, 3, 0, 0, false), makeBand(DC, 1, 110, 112, -0.06, 4, 0, 1, false));
  const dusk = pt => {   // warm near the horizon, violet higher up, blending out into the lemon of the first band
    const y = DC.y + pt.dy;
    if (r() < clamp01((pt.rho - 125) / 80)) return wpick(r, [['dLemon', 3], ['dPale', 1], ['haloWhite', 1]]);
    return y > 520 ? wpick(r, [['poppy', 3], ['hsOrange', 3], ['sunOrange', 2]]) : y > 395 ? wpick(r, [['haloOrange', 3], ['sunDeep', 2], ['haloLemon', 1]])
      : wpick(r, [['hViolet', 3], ['haloViolet', 2], ['dCobalt', 1]]);
  };
  const under = [];
  [[0, 40, 90], [0, 92, 100], [1, 40, 110], [1, 88, 120]].forEach(([j, lo, len]) =>
    lane(r, BANDS[inner + j], inner + j, lo, { spin, len: () => len, wid: () => 74, gapK: 0.55, v: WASH, key: dusk, born: () => 1.9, extra: extra(inner + j), jit: 4 }, under));
  [[0, 18], [0, 44], [0, 70], [0, 96], [1, 16], [1, 42], [1, 68], [1, 94], [1, 114]].forEach(([j, lo]) =>
    lane(r, BANDS[inner + j], inner + j, lo, { spin, len: skyLen(r, 46), wid: skyWid(r, 18), gapK: 0.7, key: dusk, born: () => 1.95, extra: extra(inner + j), angJit: 0.5 }, under));
  under.forEach((s, i) => { s.flatAt = 5.5 + 0.25 * hash3(i, 1, 608); });   // laid flat into sunset layers as the halo goes
  DAY.push(...under, ...washes, ...strokes, ...fine);
  // under the night each day stroke is repainted dark as the night's own strokes land over it
  for (const s of DAY) {
    const b = BANDS[s.b], a = b.omega * spinClock(6.3), c = Math.cos(a), sn = Math.sin(a);
    s.sw = nightArrival(b.cx + s.dx * c - s.dy * sn, b.cy + s.dx * sn + s.dy * c) - 0.1;
  }
}

// the afterglow: vermilion and orange laid along the ridge as the sun goes down, then cooled to violet
function buildAfterglow(r) {
  for (let x = 760; x < 1640; x += 18 + 8 * r()) {
    const near = 1 - Math.abs(x - DC.x) / 460;
    if (near <= 0) continue;
    for (let y = ridgeFar(x) + 6; y > ridgeFar(x) - 46; y -= 8 + 3 * r()) {
      if (r() > Math.pow(near, 0.7)) continue;
      const hh = (ridgeFar(x) + 6 - y) / 52, xx = x + (r() - 0.5) * 10;
      const key = hh < 0.35 ? wpick(r, [['poppy', 3], ['poppyDeep', 1], ['hsOrange', 1]]) : hh < 0.7 ? wpick(r, [['hsOrange', 2], ['sunOrange', 2], ['poppy', 1]]) : wpick(r, [['haloOrange', 2], ['sunDeep', 1]]);
      const ang = Math.atan((ridgeFar(xx + 10) - ridgeFar(xx - 10)) / 20) + (r() - 0.5) * 0.16 + (r() < 0.5 ? Math.PI : 0);
      AFTER.push({ x: xx, y, ang, len: logn(r, 50, 0.3, 26, 90), wid: logn(r, 14, 0.15, 10, 19), p: pig(key), pN: pig(r() < 0.6 ? 'nViolet' : 'hViolet'),
        v: (r() * DRAGS) | 0, side: r() < 0.5 ? 1 : -1, born: 5.72 + 0.32 * (1 - near) + 0.08 * r(), sw: 6.42 + 0.3 * (1 - near) + 0.1 * r() });
    }
  }
}

function buildNightSky(r) {
  const NKEYS = [['nCobalt', 'nCrest'], ['nUltra', 'nCobalt'], ['nCobalt', 'nUltra'], ['nPrussian', 'nUltra'], ['nViolet', 'nUltra'], ['nUltra', 'nPrussian'],
    ['nCobalt', 'nUltra'], ['nDeep', 'nPrussian'], ['nViolet', 'nDeep'], ['nUltra', 'nCobalt'], ['nPrussian', 'nDeep'], ['nCobalt', 'nUltra'],
    ['nDeep', 'nViolet'], ['nViolet', 'nUltra'], ['nUltra', 'nPrussian'], ['nPrussian', 'nViolet'], ['nDeep', 'nUltra'], ['nViolet', 'nDeep']];
  const WKEY = { nCobalt: 'nUltra', nUltra: 'nUltra', nPrussian: 'nPrussian', nViolet: 'nViolet', nDeep: 'nDeep' };
  const washes = [], strokes = [], fine = [], spin = DUR - NIGHT0;
  NBANDS.forEach((b, k) => {
    const [main, alt] = NKEYS[k % NKEYS.length];
    if (k === 0) {
      // the eye of the night swirl: a dark bed, then two pale arms wound into it
      const put = (list, rho, th, ang, len, wid, key, born, v) => list.push({ b: 0, dx: rho * Math.cos(th), dy: rho * Math.sin(th), rho, th, a0: ang,
        side: bowAway(rho * Math.cos(th), rho * Math.sin(th), ang, 0, 0), len, wid, p: pig(key), v: v ?? (r() * DRAGS) | 0, born });
      for (let i = 0; i < 7; i++) { const th = i * TAU / 7; put(washes, 30, th, th + Math.PI / 2, 70, 56, 'nUltra', 6.42 + 0.03 * i, WASH + (i % 2)); }
      for (let i = 0; i < 22; i++) { const rho = 10 + 58 * Math.sqrt(r()), th = r() * TAU; put(strokes, rho, th, th + Math.PI / 2 + (r() - 0.5) * 0.4, logn(r, 34, 0.25, 22, 50), 20, wpick(r, [['nUltra', 3], ['nCobalt', 2]]), 6.45 + 0.2 * r()); }
      const TURN = 1.7 * TAU, R1 = 104;
      for (let arm = 0; arm < 2; arm++) for (let lanes = 0; lanes < 2; lanes++) for (let a = 0.02 + 0.03 * r(); a < 1; ) {
        const rho = 10 + R1 * a + lanes * 9 - 4, th = arm * Math.PI + a * TURN + lanes * 0.12;
        const dr = R1 / TURN, tan = Math.atan2(dr * Math.sin(th) + rho * Math.cos(th), dr * Math.cos(th) - rho * Math.sin(th));
        const len = Math.min(logn(r, 30 + 34 * a, 0.2, 22, 70), 14 + rho * 1.1);   // short marks at the heart, where the curve is tight
        const key = a < 0.18 ? (r() < 0.7 ? 'nCrest' : 'nCobalt') : a < 0.5 ? wpick(r, [['nCobalt', 3], ['nCrest', 1]]) : wpick(r, [['nCobalt', 2], ['nUltra', 1]]);
        put(fine, rho, th, tan + Math.PI + (r() - 0.5) * 0.12, len, 11 + 6 * a + 2 * r(), key, 6.85 - 0.3 * a + 0.03 * r());
        a += len * 0.62 / Math.max(25, rho * TURN);
      }
      return;
    }
    const born = (d = 0) => th => arrivalKT(k, th) + d + r() * 0.04;
    // a dark wash first, so the gaps between the night's strokes stay night; it fills in just behind the strokes
    lane(r, b, k, NBW / 2, { spin, len: () => 150, wid: () => 74, gapK: 0.58, key: () => WKEY[main], born: born(0.1), jit: 3 }, washes);
    for (const s of washes) if (s.b === k && s.v < WASH) s.v = WASH + ((r() * 2) | 0);
    for (let l = 0; l < 4; l++) {
      lane(r, b, k, -4 + (l + 0.5) * (NBW + 8) / 4, { spin, len: skyLen(r, 60), wid: skyWid(r, 19), gapK: 0.7, key: () => wpick(r, [[main, 66], [alt, 34]]), born: born(), jit: 6 }, strokes);
    }
    // lighter cobalt crests riding the band edges
    lane(r, b, k, NBW * (k % 2 ? 0.12 : 0.88), { spin, len: skyLen(r, 46), wid: skyWid(r, 11), gapK: 1.6, skip: 0.25,
      key: () => (k < 7 ? wpick(r, [['nCrest', 2], ['nCobalt', 3]]) : 'nCobalt'), born: born(0.16) }, fine);
  });
  NIGHT.push(...washes, ...strokes, ...fine);
}

function buildStars(r) {
  // placed in the final, pushed-in frame, clear of the title and its dates and well inside the edges:
  // one hero star near the swirl's eye, three medium, five small
  const SPOTS = [[1525, 455, 90, 3], [340, 445, 62, 3], [840, 492, 52, 2], [1690, 122, 50, 2],
    [232, 116, 36, 2], [640, 114, 30, 1], [1092, 112, 32, 1], [1350, 124, 34, 2], [592, 506, 32, 1]];
  const RINGS = { 3: [[1.45, 'sLemon', 0.78, 0.93], [2.2, 'sYellow', 0.68, 0.85], [2.95, 'sOrange', 0.6, 0.65]], 2: [[1.45, 'sLemon', 0.8, 0.92], [2.2, 'sOrange', 0.66, 0.66]], 1: [[1.5, 'sYellow', 0.8, 0.7]] };
  const list = SPOTS.map(([sx, sy, out, rings]) => {
    const [x, y] = toWorld(sx, sy), spec = RINGS[rings], last = spec[spec.length - 1];
    return { x, y, out: out / CAM_Z, R: out / CAM_Z / (last[0] + last[2] * 0.5), spec, at: nightArrival(x, y) + 0.22, dabs: [], ph: r() * TAU };
  });
  list.sort((a, b) => a.at - b.at);
  for (let i = 1; i < list.length; i++) list[i].at = Math.max(list[i].at, list[i - 1].at + 0.14);
  for (const st of list) {
    const R = st.R, dab = (ring, d, th, len, wid, key, born, radial, v) => st.dabs.push({ ring, d, th, len, wid, p: pig(key), born, radial,
      v: v ?? (r() * DRAGS) | 0, side: radial ? (r() < 0.5 ? 1 : -1) : 1 });
    // the rings first, outermost first, so the white-hot core sits on top; each ring is wound as a short spiral
    for (let j = st.spec.length - 1; j >= 0; j--) {
      const [k, key, w, cover] = st.spec[j], n = Math.max(6, Math.round((8 + 3 * j) * Math.sqrt(R / 18))), th0 = r() * TAU, gap = r();
      for (let i = 0; i < n; i++) {
        const f = i / n;

    if (wash || fade < 1) ctx.globalAlpha = (wash ? washAlpha(tau, s.born) : 1) * fade;
    stamp(ctx, tau >= s.dusk ? s.pd : s.p, s.v, x, y, ang, s.settle && tau >= s.melt ? s.len * 0.85 : s.len, s.wid, growOf(tau, s.born), s.side);

  }

  for (const K of CONTOURS) if (K.group === 'sun') {
    if (t < K.t1 + 0.16) showContour(K, K.under, underProg(K, t), tau);
    showContour(K, K.over, overProg(K, t), tau);

}
function drawNightSky(tau) {
  if (tau < NIGHT0) return;
  const turns = turnOf(NBANDS, nightClock(tau));
  const x0 = -CAM.ox / CAM.z - 70, x1 = (W - CAM.ox) / CAM.z + 70, y0 = -CAM.oy / CAM.z - 70;
  for (const s of NIGHT) {
    if (tau < s.born) continue;
    const b = NBANDS[s.b], [a, c, sn] = turns[s.b];
    const x = b.cx + s.dx * c - s.dy * sn, y = b.cy + s.dx * sn + s.dy * c;
    if (x < x0 || x > x1 || y < y0 || y > 645) continue;
    const wash = s.v >= WASH;
    if (wash) ctx.globalAlpha = washAlpha(tau, s.born);
    stamp(ctx, s.p, s.v, x, y, s.a0 + a, s.len, s.wid, growOf(tau, s.born), s.side);
    if (wash) ctx.globalAlpha = 1;
  }
}
// the stars step back a little while the title is painted, then come forward again
const starDim = t => 1 - 0.18 * (sstep(span(t, TT0 - 0.02, TT0 + 0.4)) - sstep(span(t, 8.6, 9.0)));
function drawStars(tau, t) {
  const dim = starDim(t);
  for (const st of STARS) {
    const a = tau - st.at;
    if (a < 0) continue;
    const ign = easeOut(a / 0.35), tw = 1 + 0.035 * Math.sin(tau * 5.3 + st.ph);
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = 0.85 * ign * dim;
    const gs = st.out * 1.45 * tw * CAM.z;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(GLOW, CAM.z * st.x + CAM.ox - gs, CAM.z * st.y + CAM.oy - gs, gs * 2, gs * 2);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = dim;
    for (const d of st.dabs) {
      if (a < d.born) continue;
      let rad = d.d, th = d.th;
      if (d.ring >= 0) {
        rad *= overshoot(span(a, d.born, d.born + 0.3)) * (1 + 0.04 * Math.sin(tau * 4.1 + st.ph + d.ring * 1.7));
        th += (d.ring % 2 ? -1 : 1) * 0.22 * (tau - st.at);
        if (rad < 1) continue;
      }
      const x = st.x + rad * Math.cos(th), y = st.y + rad * Math.sin(th);
      stamp(ctx, d.p, d.v, x, y, d.radial ? th : th + Math.PI / 2, d.len, d.wid, growOf(tau, st.at + d.born), d.side);
    }
    ctx.globalAlpha = 1;

}
// Once the night has reached every stroke the camera is still, so the land is painted once into a
// screen-space layer (the same marks in the same order) and reused.
let LAND_NIGHT_AT = 0, LAND_DONE = null, DAY_GONE = 0, AFTER_FIRST = 0;
function drawLand(tau) {
  if (tau >= LAND_NIGHT_AT) {
    if (!LAND_DONE) {
      LAND_DONE = canvasOf(W, H);
      paintLand(LAND_DONE.getContext('2d'), LAND_NIGHT_AT);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(LAND_DONE, 0, 0);
    return;
  }
  paintLand(ctx, tau);
}
function paintLand(g, tau) {
  const gf = tau >= GUST[0] && tau <= GUST[1] ? -320 + 2560 * (tau - GUST[0]) / (GUST[1] - GUST[0]) : null, gp = pig('gust');
  for (const s of LAND) {
    if (tau < s.born) continue;
    let ang = s.ang, x = s.x, y = s.y, lift = 0;
    if (s.gk && gf !== null) {
      const d = (s.x - gf) / 260, b = Math.exp(-d * d) * s.gk;
      if (b > 0.01) {
        const db = 0.62 * b;
        if (s.pivot) {   // a blade bends from its foot
          const hx = x - Math.cos(ang) * s.len / 2, hy = y - Math.sin(ang) * s.len / 2;
          ang += db; x = hx + Math.cos(ang) * s.len / 2; y = hy + Math.sin(ang) * s.len / 2;
        } else ang += db;
        lift = b;
      }
    }
    const wash = s.v >= WASH;
    if (tau < s.sw) {
      if (wash) g.globalAlpha = washAlpha(tau, s.born);
      stamp(g, s.p, s.v, x, y, ang, s.len, s.wid, growOf(tau, s.born), s.side);
      if (wash) g.globalAlpha = 1;
      if (lift > 0.06) { g.globalAlpha = Math.min(0.75, 0.7 * lift); stamp(g, gp, s.v, x, y, ang, s.len, s.wid, 1, s.side); g.globalAlpha = 1; }
    } else {
      const gn = growOf(tau, s.sw);
      if (gn < 1) stamp(g, s.p, s.v, x, y, ang, s.len, s.wid, 1, s.side);
      stamp(g, s.pN, s.v, x, y, ang, s.len, s.wid, gn, s.side);

}
function skyClip() {
  ctx.save();
  ctx.setTransform(CAM.z, 0, 0, CAM.z, CAM.ox, CAM.oy);
  ctx.beginPath(); ctx.moveTo(-200, -400); ctx.lineTo(W + 200, -400);
  for (let x = W + 200; x >= -200; x -= 20) ctx.lineTo(x, SKY_FLOOR(x));
  ctx.closePath(); ctx.clip();
}
function drawTitle(t, tau) {
  if (t < TT0) return;
  const A = TITLE_ART, nL = TITLE.length, xs = A.xs;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const g = TTG, keep = { z: CAM.z, ox: CAM.ox, oy: CAM.oy };
  // the halo of warm dabs round each painted letter, in pure colour against the night
  CAM.z = 1; CAM.ox = TB.x; CAM.oy = TB.y;
  for (const s of HALO) { if (tau < s.born) break; stamp(ctx, s.p, s.v, s.x, s.y, s.ang, s.len, s.wid, growOf(tau, s.born), s.side); }
  // impasto fill, held inside the letters
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, TB.w, TB.h);
  CAM.z = 1; CAM.ox = 0; CAM.oy = 0;
  for (const s of TFILL) { if (tau < s.born) break; stamp(g, s.p, s.v, s.x, s.y, s.ang, s.len, s.wid, growOf(tau, s.born), s.side); }
  Object.assign(CAM, keep);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-in'; g.drawImage(A.fat, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(TT, TB.x, TB.y);
  // the cloisonné outline: each letter's contour is brushed down as it starts
  for (let i = 0; i < nL; i++) {
    const p = span(t, TT0 + i * TSTEP, TT0 + i * TSTEP + 0.1);
    if (p <= 0) continue;
    const a = i === 0 ? 0 : xs[i], b = i === nL - 1 ? W : xs[i + 1], hh = TB.h * easeOut(p);
    ctx.drawImage(A.cont, a, 0, b - a, hh, TB.x + a, TB.y, b - a, hh);
  }
  // the dates
  const s0 = SUB_T0(), sp = span(t, s0, s0 + 0.32);
  if (sp > 0) {
    const wx = W * 0.5 - 220 + 440 * easeOut(sp), rise = 7 * (1 - easeOut(span(t, s0, s0 + 0.45)));
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, wx, H); ctx.clip();
    ctx.globalAlpha = sstep(span(t, s0, s0 + 0.2));
    ctx.drawImage(A.sub, TB.x, TB.y + rise);
    ctx.restore(); ctx.globalAlpha = 1;
  }
}

function frame(t) {
  const tau = quant(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(WEAVE, 0, 0);
  setCamera(tau);
  for (const K of CONTOURS) if (K.group === 'land') showContour(K, K.under, underProg(K, t), tau);
  skyClip();
  for (const K of CONTOURS) if (K.group === 'sky') showContour(K, K.under, underProg(K, t), tau);
  drawDaySky(tau);
  drawAfterglow(tau);
  drawSun(tau, t);
  for (const K of CONTOURS) if (K.group === 'sky') showContour(K, K.over, overProg(K, t), tau);
  drawNightSky(tau);
  drawStars(tau, t);
  ctx.restore();
  drawLand(tau);
  for (const K of CONTOURS) if (K.group === 'land') showContour(K, K.over, overProg(K, t), tau);
  drawTitle(t, tau);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'soft-light'; ctx.globalAlpha = 0.1; ctx.drawImage(RELIEF, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const dark = sstep(span(t, CLOSE, DUR));   // the film opens on the bare canvas and closes into the dark
  if (dark > 0) { ctx.fillStyle = `rgba(9,14,34,${dark})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = ({ t }) => { frame(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const pan = x => +Math.max(-1, Math.min(1, x / W * 2 - 1)).toFixed(3);
  const ev = [{ k: 'bed', t: 0, d: DUR }];
  CONTOURS.forEach((K, i) => ev.push({ k: 'contour', t: K.t0, d: K.dur, pan: pan(K.cx), i, hero: K.group === 'sun' ? 1 : 0 }));
  CONTOURS.forEach((K, i) => ev.push({ k: 'reassert', t: K.t1, pan: pan(K.cx), i }));
  // paint landing: one cue per painted frame of the lay-in, weighted by how many strokes land in it
  const bins = new Map(), seen = (born, px) => { const b = Math.floor(born * CADENCE); const e = bins.get(b) || { n: 0, x: 0 }; e.n++; e.x += px; bins.set(b, e); };
  for (const s of SUN) seen(s.born, DC.x);
  for (const s of DAY) { const b = BANDS[s.b], x = b.cx + s.dx, y = b.cy + s.dy; if (x > 0 && x < W && y < 620 && s.born < 3.5) seen(s.born, x); }
  for (const s of LAND) if (s.x > 0 && s.x < W) seen(s.born, s.x);
  [...bins.entries()].sort((a, b) => a[0] - b[0]).forEach(([b, e]) => ev.push({ k: 'dabs', t: +(b / CADENCE).toFixed(3), n: e.n, pan: pan(e.x / e.n) }));
  ev.push({ k: 'day', t: 0.7 });
  PULSES.forEach(p => ev.push({ k: 'pulse', t: p, pan: pan(DC.x) }));
  ev.push({ k: 'gust', t: GUST[0], d: GUST[1] - GUST[0] });
  ev.push({ k: 'sunset', t: SINK[0], d: SINK[1] - SINK[0] });
  ev.push({ k: 'afterglow', t: AFTER_FIRST, d: 0.8 });
  ev.push({ k: 'night', t: NIGHT0, d: NIGHT_SPREAD + NIGHT_SWEEP });
  STARS.forEach((s, i) => ev.push({ k: 'star', t: +s.at.toFixed(3), pan: pan(DC.x + (s.x - DC.x) * CAM_Z), size: +(s.out * CAM_Z).toFixed(0), i }));
  for (let i = 0; i < TITLE.length; i++) {
    const x = (TITLE_ART.xs[i] + TITLE_ART.xs[i + 1]) / 2;
    ev.push({ k: 'letter', t: +(TT0 + i * TSTEP).toFixed(3), pan: pan(x), i });
  }
  ev.push({ k: 'title', t: TT0, n: TITLE.length, step: TSTEP, end: +TITLE_ART.end.toFixed(3) });
  ev.push({ k: 'subtitle', t: +SUB_T0().toFixed(3) });
  ev.push({ k: 'close', t: CLOSE });
  return ev;
};
window.ready = (async () => {
  await Promise.all(['900 160px Fraunces', 'italic 500 56px Fraunces'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  buildAtlas();
  buildWeave();
  makeBands(rng(1887));
  buildContours(rng(1891));
  buildSun(rng(95));
  planHaloBreak();
  buildDaySky(rng(1888));
  buildAfterglow(rng(1892));
  buildNightSky(rng(1889));
  buildStars(rng(1890));
  buildLand(rng(1886));
  buildTitle();
  LAND_NIGHT_AT = Math.max(5.0, quant(Math.max(...LAND.map(s => s.sw)) + LAND_T) + 2 / CADENCE);
  DAY_GONE = quant(Math.max(...DAY.map(s => s.sw), ...AFTER.map(s => s.sw)) + LAND_T) + 2 / CADENCE;
  AFTER_FIRST = Math.min(...AFTER.map(s => s.born));
})();
</script>
