// A broadsheet on a desk. The camera glides over the blackletter masthead and pushes in while the banner headline
// sets letter by letter → a yellow highlighter swipes "A GOOD STORY" → push-in on the deck, a red pen circles
// "22x more memorable" → the classic spinning-newspaper transition reveals the EXTRA edition → a red EXTRA stamp

// ── generic helpers for page layout (world units, ink layer) ──
function txt(k, s, x, y, font, align = 'left', ls = 0) { k.font = font; k.textAlign = align; k.letterSpacing = ls + 'px'; k.fillText(s, x, y); k.letterSpacing = '0px'; k.textAlign = 'left'; }

function condLine(k, s, cx, y, size, cond = COND, weight = 900, fam = HEAD) {

// justified column text flowing through a list of rects
function flow(k, list, rects, size = 15.5, lead = 19.4) {

  let ri = 0, r = rects[0], y = r.y + size;
  const next = () => { y += lead; if (y > r.y + r.h) { ri++; if (ri >= rects.length) return false; r = rects[ri]; y = r.y + size; } return true; };
  for (const p of list) {
    const words = p.split(' '); let line = [], lw = 0, first = true;
    const emit = last => {
      const ind = first ? size * 1.3 : 0, avail = r.w - ind, wsum = line.reduce((a, w) => a + M(w), 0);
      const gap = last || line.length < 2 ? sp : Math.min(sp * 3, (avail - wsum) / (line.length - 1));
      let xx = r.x + ind; for (const w of line) { k.fillText(w, xx, y); xx += M(w) + gap; }
      first = false; return next();
    };
    for (const w of words) {
      const ww = M(w), ind = first ? size * 1.3 : 0;
      if (line.length && lw + sp + ww > r.w - ind) { if (!emit(false)) return; line = [w]; lw = ww; }

}
function noiseCanvas(w, h, seed, lo, hi) {

  for (let i = 0; i < c.width * c.height; i++) { const v = lo + (hi - lo) * (r() + r()) / 2; id.data[i * 4] = v; id.data[i * 4 + 1] = v * .99; id.data[i * 4 + 2] = v * .96; id.data[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0); return c;
}
function alphaNoise(w, h, seed, fn) {             // black pixels with alpha from fn(r)
  const c = mk(w, h), x = c.getContext('2d'), id = x.createImageData(c.width, c.height), r = rng(seed);
  for (let i = 0; i < c.width * c.height; i++) id.data[i * 4 + 3] = fn(r);
  x.putImageData(id, 0, 0); return c;
}
// printed-ink treatment: bleed, uneven density, pinholes
function inkify(c, seed, bleed = 1.0, holes = 1) {

  const tmp = mk(w, h), tx = tmp.getContext('2d'); tx.filter = `blur(${bleed}px)`; tx.drawImage(c, 0, 0);
  x.globalAlpha = .5; x.drawImage(tmp, 0, 0); x.globalAlpha = 1;
  x.globalCompositeOperation = 'destination-out';
  x.drawImage(alphaNoise(Math.max(2, w / 36), Math.max(2, h / 36), seed + 1, r => r() * 80), 0, 0, w, h);
  x.drawImage(alphaNoise(Math.max(2, w / 2), Math.max(2, h / 2), seed + 2, r => r() < .04 * holes ? 110 + r() * 145 : 0), 0, 0, w, h);
  x.drawImage(alphaNoise(w, h, seed + 3, r => r() * 40), 0, 0);
  x.restore();
}
function paperize(x, w, h, seed, strength = 1) {    // newsprint mottling + fibres, in device px
  const r = rng(seed);

  x.globalAlpha = .6 * strength; x.drawImage(noiseCanvas(w / 110, h / 110, seed + 1, 205, 255), 0, 0, w, h);
  x.globalAlpha = .45 * strength; x.drawImage(noiseCanvas(w / 16, h / 16, seed + 2, 220, 255), 0, 0, w, h);
  x.globalAlpha = .55 * strength; x.drawImage(noiseCanvas(w / 2, h / 2, seed + 3, 212, 255), 0, 0, w, h);
  x.restore();
  x.save(); x.lineCap = 'round';
  const nf = Math.round(w * h / 500 * strength);
  for (let i = 0; i < nf; i++) {
    const px = r() * w, py = r() * h, a = r() * TAU, l = 3 + r() * 16, bend = (r() - .5) * 6;

  }

// ── halftone: grayscale source canvas → rotated dot screen (black ink) ──
function halftone(k, src, X, Y, w, h, cell = 6.4, ang = deg(45), gain = 1) {
  const g = src.getContext('2d').getImageData(0, 0, src.width, src.height).data, gw = src.width, gh = src.height;
  const p = new Path2D(), ca = Math.cos(ang), sa = Math.sin(ang), R = Math.hypot(w, h) / 2 + cell, cx = X + w / 2, cy = Y + h / 2;
  for (let i = -R; i <= R; i += cell) for (let j = -R; j <= R; j += cell) {
    const px = cx + i * ca - j * sa, py = cy + i * sa + j * ca;
    if (px < X || py < Y || px >= X + w || py >= Y + h) continue;
    const sx = Math.min(gw - 1, Math.floor((px - X) / w * gw)), sy = Math.min(gh - 1, Math.floor((py - Y) / h * gh));
    const d = clamp((1 - g[(sy * gw + sx) * 4] / 255) * gain);

}
function gray(w, h) { const c = mk(w, h), x = c.getContext('2d'); return [c, x]; }
const L = v => `rgb(${v},${v},${v})`;

    const px = cx + Math.cos(th) * rx * v, py = cy + Math.sin(th) * ry * v; i ? x.lineTo(px, py) : x.moveTo(px, py); } x.closePath();

const INFO = {};

function buildTable() {
  const w = 1600, h = 1300, c = mk(w, h), x = c.getContext('2d'), r = rng(7);

  for (let i = 0; i < 520; i++) { const y0 = r() * h, a = (r() - .5) * 12, ph = r() * TAU; x.strokeStyle = r() < .5 ? `rgba(80,55,35,${.12 + r() * .2})` : `rgba(15,9,5,${.15 + r() * .25})`;

  x.globalCompositeOperation = 'multiply'; x.drawImage(noiseCanvas(w / 8, h / 8, 9, 170, 255), 0, 0, w, h);
  x.globalCompositeOperation = 'source-over';

}
function buildShadow() { const c = mk(460, 580), x = c.getContext('2d'); x.filter = 'blur(14px)'; x.fillStyle = 'rgba(0,0,0,0.85)'; x.fillRect(30, 30, 400, 520); return c; }
function buildGrain() {
  for (let i = 0; i < 8; i++) { const c = mk(960, 540), x = c.getContext('2d'), id = x.createImageData(960, 540), r = rng(40 + i);
    for (let j = 0; j < 960 * 540; j++) { const v = 128 + (r() + r() + r() - 1.5) * 70; id.data[j * 4] = id.data[j * 4 + 1] = id.data[j * 4 + 2] = v; id.data[j * 4 + 3] = 255; }
    x.putImageData(id, 0, 0); GRAIN.push(c); }
  VIG = mk(W, H); const v = VIG.getContext('2d'); v.fillStyle = '#fff'; v.fillRect(0, 0, W, H);
  const g = v.createRadialGradient(W * .46, H * .44, H * .35, W / 2, H / 2, H * 1.12); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(70,58,46,1)'); v.fillStyle = g; v.fillRect(0, 0, W, H);

// ── drawing ──
function redPen(x) {                               // a red felt pen resting on the desk (world coords)
  x.save(); x.translate(-300, 1480); x.rotate(deg(-28));
  x.fillStyle = 'rgba(0,0,0,0.35)'; x.filter = 'blur(8px)'; x.fillRect(-250, -2, 520, 36); x.filter = 'none';
  const g = x.createLinearGradient(0, -16, 0, 16); g.addColorStop(0, '#e2574c'); g.addColorStop(.35, '#b3221b'); g.addColorStop(1, '#5e0f0b');

  const g2 = x.createLinearGradient(0, -18, 0, 18); g2.addColorStop(0, '#444'); g2.addColorStop(.3, '#222'); g2.addColorStop(1, '#0b0b0b');
  x.fillStyle = g2; x.beginPath(); x.roundRect(150, -18, 120, 36, 10); x.fill(); x.fillRect(170, -26, 90, 8);
  x.fillStyle = '#d8d0c0'; x.fillRect(-150, -16, 60, 32); x.fillStyle = '#8a1510'; x.font = `700 13px ${BODY}`; x.fillText('FINE', -140, 5);
  x.fillStyle = '#222'; x.beginPath(); x.moveTo(-240, -12); x.lineTo(-280, -4); x.lineTo(-290, 0); x.lineTo(-280, 4); x.lineTo(-240, 12); x.fill();

}

  const r = rng(seed), pts = [], n = 90, w1 = r() * TAU, w2 = r() * TAU;
  for (let i = 0; i <= n; i++) { const u = i / n, a = a0 - u * turns * TAU, k = 1 + .05 * Math.sin(a * 2 + w1) + .03 * Math.sin(a * 3 + w2) + u * .07;

}
function penStroke(x, pts, u, w, col) {

}
let CIRC;
function page1Overlays(x, t) {
  x.save(); x.globalCompositeOperation = 'multiply';
  for (const L0 of LETTERS) {
    const u = (t - L0.t) / .13; if (u <= 0) continue; const v = clamp(u);
    const s = 1 + .55 * (1 - eOutBack(v, 2.2)), a = clamp(u * 3), dy = -10 * (1 - eOut(v));

  }
  x.globalAlpha = 1;
  const hu = eInOut(seg(t, T.hiA, T.hiB));
  if (hu > 0) { const xm = lerp(HIGHL.x0 - 30, HIGHL.x1 + 30, hu); x.save(); x.beginPath(); x.rect(HIGHL.x, HIGHL.y, xm - HIGHL.x, HIGHL.h); x.clip(); x.drawImage(HIGHL.c, HIGHL.x, HIGHL.y, HIGHL.w, HIGHL.h); x.restore(); }
  const cu = seg(t, T.circA, T.circB);
  if (cu > 0) penStroke(x, CIRC, eInOut(cu), 6.4, RED);
  x.restore();
}
function stampState(t) {
  if (t < T.stampA) return null;
  if (t < T.stampHit) { const u = seg(t, T.stampA, T.stampHit); return { s: lerp(2.3, 1, eIn(u)), air: 1 - eIn(u), a: clamp(u * 4) }; }
  const d = t - T.stampHit; return { s: 1 - .045 * Math.exp(-d * 18) * Math.cos(d * 40), air: 0, a: 1 };
}
function page2Overlays(x, t, z) {
  const st = stampState(t);
  if (st) {
    x.save(); x.translate(STAMP.x, STAMP.y); x.rotate(STAMP.rot + st.air * deg(-6)); x.scale(st.s, st.s);
    if (st.air > 0) { x.globalAlpha = .35 * st.a * st.air; x.fillStyle = '#000'; x.filter = `blur(${10 * st.air}px)`; x.fillRect(-STAMP.w / 2 + 40 * st.air, -STAMP.h / 2 + 50 * st.air, STAMP.w, STAMP.h); x.filter = 'none'; }
    x.globalAlpha = st.a * (st.air > 0 ? .9 : .92); x.globalCompositeOperation = st.air > 0 ? 'source-over' : 'multiply';
    x.drawImage(STAMP.c, -STAMP.w / 2, -STAMP.h / 2, STAMP.w, STAMP.h); x.restore();
  }
  // cut line
  const cu = seg(t, T.cutA, T.cutB);
  const L = liftAmt(t);
  if (cu > 0 && L <= 0) {
    const len = eInOut(cu) * CLIP.total; x.save(); x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); let i = 0; x.moveTo(CLIP.pts[0][0], CLIP.pts[0][1]); let hx = CLIP.pts[0][0], hy = CLIP.pts[0][1];
    for (i = 1; i < CLIP.pts.length && CLIP.acc[i] <= len; i++) { x.lineTo(CLIP.pts[i][0], CLIP.pts[i][1]); hx = CLIP.pts[i][0]; hy = CLIP.pts[i][1]; }
    if (i < CLIP.pts.length) { const f = (len - CLIP.acc[i - 1]) / (CLIP.acc[i] - CLIP.acc[i - 1]); hx = lerp(CLIP.pts[i - 1][0], CLIP.pts[i][0], f); hy = lerp(CLIP.pts[i - 1][1], CLIP.pts[i][1], f); x.lineTo(hx, hy); }

    x.drawImage(P2, bx * BS, by * BS, bw * BS, bh * BS, bx, by, bw, bh);
    x.fillStyle = `rgba(255,248,230,${.07 * clamp(L)})`; x.fillRect(bx, by, bw, bh);

}
const liftAmt = t => t < T.liftA ? 0 : eOutBack(seg(t, T.liftA, T.liftB), 1.3);

// camera keys [t, x, y, zoom, rotDeg]
let CAM1, CAM2;
function camKeys() {
  const c = INFO.circle, ccx = c.x + c.w / 2 + 40, ccy = c.y + c.h / 2 + 30, sb = INFO.sb;
  const hy = (INFO.head1.lines[0].y + INFO.head1.lines[1].y) / 2 - INFO.head1.S * .3;
  CAM1 = [[0.0, 470, 150, 1.34, -4.2], [1.15, 800, hy - 40, 1.06, -1.4], [2.3, 800, hy + 8, 1.1, -.6], [2.62, 810, hy + 14, 1.12, -.4], [3.25, ccx, ccy, 1.58, .9], [4.25, ccx + 18, ccy + 6, 1.66, 1.2]];
  const h2 = INFO.head2.lines[0].y - 40;
  CAM2 = [[T.spinB, 800, h2, .84, 0], [6.45, 790, h2 + 22, .9, .5], [7.1, sb.x + sb.w / 2 - 70, sb.y + sb.h / 2 - 10, 1.28, -1.0], [8.0, sb.x + sb.w / 2 - 90, sb.y + sb.h / 2 - 34, 1.34, -1.3], [9.35, 830, 1050, .5, .4], [10.0, 830, 1050, .485, .55]];
}
function camAt(K, t) {
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const [t0, x0, y0, z0, r0] = K[i], [t1, x1, y1, z1, r1] = K[i + 1], u = eInOut(seg(t, t0, t1));
  return { x: lerp(x0, x1, u), y: lerp(y0, y1, u), z: Math.exp(lerp(Math.log(z0), Math.log(z1), u)), r: deg(lerp(r0, r1, u)) };
}
const PC = { x: PW / 2, y: PH / 2, z: .5, r: 0 };
function mixCam(a, b, u) { return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)), r: lerp(a.r, b.r, u) }; }
// spin transition: returns {page, cam, s (extra scale), rot (extra rotation)}
const S_MIN = .09;
function spinState(t) {
  if (t < T.spinA) return { page: 1, cam: camAt(CAM1, t), s: 1, rot: 0 };
  if (t < T.spinM) { const u = seg(t, T.spinA, T.spinM); return { page: 1, cam: mixCam(camAt(CAM1, T.spinA), PC, eInOut(u)), s: Math.exp(Math.log(S_MIN) * eIn(u)), rot: -TAU * 1.35 * Math.pow(u, 2.2) }; }
  if (t < T.spinB) { const u = seg(t, T.spinM, T.spinB); const k = eOutBack(u, 1.25);
    return { page: 2, cam: mixCam(PC, camAt(CAM2, T.spinB), eOut(u)), s: Math.exp(Math.log(S_MIN) * (1 - k)), rot: -TAU * 1.6 * Math.pow(1 - u, 2.2) }; }
  return { page: 2, cam: camAt(CAM2, t), s: 1, rot: 0 };
}
function shake(t) {
  let ax = 1.4 * Math.sin(t * 1.3) + .9 * Math.sin(t * 2.9 + 1), ay = 1.2 * Math.sin(t * 1.1 + 2) + .8 * Math.sin(t * 2.3), ar = deg(.05 * Math.sin(t * .8));
  for (const [ti, amp] of [[landT, 7], [T.stampHit, 11]]) { const d = t - ti; if (d > 0 && d < .6) { const e = Math.exp(-d * 11); ax += amp * e * Math.sin(d * 55); ay += amp * 1.3 * e * Math.sin(d * 47 + 1); ar += deg(.2) * e * Math.sin(d * 40); } }
  return { x: ax, y: ay, r: ar };
}
let landT = 5.3;
function pageShadow(x, z, lift = 0) { x.globalAlpha = .6; x.drawImage(SHADOW, -30 * PW / 400 + 10 + lift * 30, -30 * PH / 520 + 16 + lift * 50, 460 * PW / 400, 580 * PH / 520); x.globalAlpha = 1; }
function render(t) {
  const x = ctx; x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  x.fillStyle = '#120c08'; x.fillRect(0, 0, W, H);
  const sp = spinState(t), cam = sp.cam, sh = shake(t);
  const camT = () => { x.setTransform(1, 0, 0, 1, 0, 0); x.translate(W / 2 + sh.x, H / 2 + sh.y); x.rotate(sh.r + cam.r); x.scale(cam.z, cam.z); x.translate(-cam.x, -cam.y); };
  // desk, pen, inside page
  camT(); x.drawImage(TABLE, -2200, -1400, 6000, 4875); redPen(x);
  x.save(); x.translate(PW / 2 + 290, PH / 2 + 120); x.rotate(deg(6.5)); x.translate(-PW / 2, -PH / 2); pageShadow(x, cam.z); x.drawImage(P3, 0, 0, PW, PH); x.restore();
  { const u = seg(t, T.spinA - .1, T.spinB + .15), dk = .9 * Math.pow(Math.sin(Math.PI * u), 1.2);   // stage darkens around the spinning paper
    if (dk > 0) { x.setTransform(1, 0, 0, 1, 0, 0); const g = x.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * .6); g.addColorStop(0, `rgba(34,25,18,${dk * .88})`); g.addColorStop(1, `rgba(6,4,3,${dk})`); x.fillStyle = g; x.fillRect(0, 0, W, H); } }

  const eff = cam.z * sp.s, full = eff > .62 || sp.s > .97;

  const sp2 = spinState(t - 1 / 60), dr = sp.rot - sp2.rot, ds = Math.log(sp.s) - Math.log(sp2.s);
  const N = (Math.abs(dr) > .015 || Math.abs(ds) > .05) ? 7 : 1;
  for (let k = 0; k < N; k++) {
    const f = N === 1 ? 0 : k / (N - 1); const rot = sp.rot - dr * f, sc = Math.exp(Math.log(sp.s) - ds * f);
    x.setTransform(1, 0, 0, 1, 0, 0); x.translate(W / 2 + sh.x, H / 2 + sh.y); x.rotate(rot); x.scale(sc, sc); x.rotate(sh.r + cam.r); x.scale(cam.z, cam.z); x.translate(-cam.x, -cam.y);
    x.globalAlpha = 1 / (k + 1);
    if (N > 1 || !full) { if (k === 0) { x.save(); x.globalAlpha = 1; pageShadow(x, cam.z, 1 - sp.s); x.restore(); } x.globalAlpha = 1 / (k + 1); x.drawImage(sp.page === 1 ? COMP1 : COMP2, 0, 0, PW, PH); }
    else {

  x.globalCompositeOperation = 'overlay'; x.globalAlpha = .22; x.drawImage(GRAIN[Math.floor(t * 30 + 1e-4) % 8], 0, 0, W, H); x.globalAlpha = 1;

}
function buildComp(which) {
  const s = .75, c = mk(PW * s, PH * s), x = c.getContext('2d'); x.scale(s, s);
  x.drawImage(which === 1 ? P1 : P2, 0, 0, PW, PH);
  if (which === 1) page1Overlays(x, T.spinA);
  return c;
}

window.ready = (async () => {
  await Promise.all([`400 100px ${MAST}`, `900 100px ${HEAD}`, `700 100px ${HEAD}`, `italic 700 40px ${HEAD}`, `400 40px ${BODY}`, `700 40px ${BODY}`, `italic 400 40px ${BODY}`, `400 60px ${STAMPF}`]
    .map(f => document.fonts.load(f, 'The Daily Ledger ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789 “”’—·&.,;:!?')));
  await document.fonts.ready;
  P1 = buildPage(1, BS); P2 = buildPage(2, BS); P3 = buildPage(3, .55);
  buildLetters(); buildHighlight(); buildStamp(); buildClip(); camKeys();
  const c = INFO.circle; CIRC = handEllipse(c.x + c.w / 2, c.y + c.h / 2 + 2, c.w / 2 + 26, c.h / 2 + 14, 33);
  TABLE = buildTable(); SHADOW = buildShadow(); buildGrain();
  COMP1 = buildComp(1); COMP2 = buildComp(2);
  // first frame after the spin where the page is back at full size → landing thud
  for (let tt = T.spinM; tt < T.spinB; tt += 1 / 120) if (spinState(tt).s >= 1) { landT = tt; break; }
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [{ t: .05, k: 'glide', d: 1.2 }, { t: T.hiA, k: 'marker', d: T.hiB - T.hiA }, { t: T.circA, k: 'pen', d: T.circB - T.circA },
    { t: T.spinA, k: 'spin', d: T.spinB - T.spinA }, { t: landT, k: 'thud', v: 1 }, { t: T.stampA, k: 'air' }, { t: T.stampHit, k: 'stamp' },
    { t: T.liftA, k: 'lift' }, { t: 6.45, k: 'glide', d: .7 }, { t: 8.0, k: 'glide', d: 1.4 }, { t: 8.15, k: 'chord' }];
  for (const L0 of LETTERS) ev.push({ t: L0.t + .07, k: 'clack', v: L0.li ? 1.1 : 1 });
  for (let i = 0; i < 7; i++) ev.push({ t: T.cutA + (i + .3) * (T.cutB - T.cutA) / 7, k: 'snip' });

};
