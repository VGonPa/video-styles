<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#EFEADD;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// Tonal Manga: a quiet two-tone manga reel. Bone paper and matte ink only; every mid-tone is a 45-degree
// round-dot screen, a dot field graded by dot size, or ruled line tone. A residential lane at noon opens as line
// art and lays its tones in up the ladder (light dots, mid dots, solid ink) while the camera drifts in whole
// pixels; a crow crouches on the top wire and climbs out of the frame, and the wire wobbles. A diagonal band of
// growing dots passes through ink onto laundry swaying on a balcony, whose ink then breaks up into paper.
// Evening rooftops ink in and lay their tones under a dotted dusk sky with a thin crescent; the title lands
// through one shared screen and a single marker stroke underlines it. The ladder then runs back down until only
// the town's brush contours, the title and the marker remain, held to the end. Frames depend only on t.
const W = 1920, H = 1080, DUR = 10.0, FPS = 30;
const PAPER = '#EFEADD', INK = '#141311', MARKER = '#F4E23A';
const CELL = 12;                       // dot tile: dots on its corners and centre make a 45-degree screen of pitch 8.5 px
const FULL = CELL / 2 * 1.06;          // dot radius at which neighbours fuse into solid ink
const T1 = 1.62, T2 = 2.62, T3 = 3.56; // the tone ladder: ~11 %, ~30 %, ~55 % ink
const HATCH = 10;                      // line-tone tile: 45-degree rules at a pitch of 7.07 px
const WEIGHT = 1.15;                   // every brush line is this much heavier than its nominal width
const TITLE = 'Tonal Manga', SERIF = '"Shippori Mincho"';
const TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });

// Every moment of the film, in seconds. events() reads the same table.
const TL = {
  lay: [[0.04, 0.34], [0.30, 0.62], [0.58, 0.90]],  // shot 1 tone groups: light dots, mid dots + rules, solid ink
  crouch: [1.70, 2.00], lift: 2.00, fly: 1.12, beat: 0.22,
  front: [3.15, 3.95], two: 3.50,                    // ink front from the lane into the balcony
  paper: [6.42, 6.70], three: 6.70,                  // the balcony breaks up into paper
  lines: [6.70, 6.80], rise: [6.80, 7.18],           // the dusk contours ink in, then the tones lay in
  title: [7.28, 7.58], swipe: [8.10, 8.46],          // the title lands, then the marker underlines it
  fall: [9.10, 9.65],                                // back down the ladder to the outlines, held to the end
};

/* ------------------------------------------------------------ numbers */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const mix = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - (1 - k) ** 3;
const frameOf = t => Math.round(t * FPS);
function xorshift(seed) {
  let s = (seed * 2654435761) >>> 0 || 7;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function sheet(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ------------------------------------------------------------ tone kit */
const tones = new Map();
// A flat field of round dots of radius r on the 45-degree screen, anchored to the user-space origin.
function dots(r, color = INK) {
  if (r < 0.2) return null;
  if (r >= FULL) return color;
  const key = color + Math.round(r * 40);
  if (!tones.has(key)) {
    const c = sheet(CELL, CELL), g = c.getContext('2d');
    g.fillStyle = color; g.beginPath();
    for (const [x, y] of [[0, 0], [CELL, 0], [0, CELL], [CELL, CELL], [CELL / 2, CELL / 2]]) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
    g.fill();
    tones.set(key, ctx.createPattern(c, 'repeat'));
  }
  return tones.get(key);
}
// Paper dots centred in the gaps of the same screen: they eat ink from the paper side.
function holes(r) {
  if (r < 0.2) return null;
  if (r >= FULL) return PAPER;
  const key = 'h' + Math.round(r * 40);
  if (!tones.has(key)) {
    const c = sheet(CELL, CELL), g = c.getContext('2d'), m = CELL / 2;
    g.fillStyle = PAPER; g.beginPath();
    for (const [x, y] of [[m, 0], [0, m], [CELL, m], [m, CELL]]) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
    g.fill();
    tones.set(key, ctx.createPattern(c, 'repeat'));
  }
  return tones.get(key);
}
// Ruled line tone: rules falling left to right at 45 degrees, w px thick; crossed adds the other diagonal.
function rules(w, crossed = false) {
  if (w < 0.3) return null;
  const key = 'l' + Math.round(w * 20) + (crossed ? 'x' : '');
  if (!tones.has(key)) {
    const c = sheet(HATCH, HATCH), g = c.getContext('2d');
    g.strokeStyle = INK; g.lineWidth = w; g.beginPath();
    for (let k = -2; k <= 2; k++) {
      g.moveTo(k * HATCH - 2, -2); g.lineTo(k * HATCH + HATCH + 2, HATCH + 2);
      if (crossed) { g.moveTo(k * HATCH - 2, HATCH + 2); g.lineTo(k * HATCH + HATCH + 2, -2); }
    }
    g.stroke();
    tones.set(key, ctx.createPattern(c, 'repeat'));
  }
  return tones.get(key);
}
// Per-dot field on the same lattice; radius(x, y) sets every dot. Paths stay under ~1500 contours.
function field(g, box, radius, color = INK) {
  const [x0, y0, x1, y1] = box, half = CELL / 2;
  g.fillStyle = color;
  let p = new Path2D(), n = 0;
  for (let j = Math.floor(y0 / half) - 1; j * half <= y1 + half; j++) {
    const y = j * half, off = (j & 1) ? half : 0;
    for (let x = Math.floor(x0 / CELL) * CELL - CELL + off; x <= x1 + CELL; x += CELL) {
      const r = radius(x, y);
      if (!(r >= 0.2)) continue;
      p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU);
      if (++n === 1200) { g.fill(p); p = new Path2D(); n = 0; }
    }
  }
  if (n) g.fill(p);
}

// How far the tones have come in. Shot 1 lays in by group (g1 light dots, g2 mid dots and rules,
// g3 solid ink); the evening shot uses one ladder radius R that clamps every dot, so solids break
// into dots first and the lightest tones go last.
class Ink {
  constructor(k = { g1: 1, g2: 1, g3: 1 }, R = Infinity) { this.k = k; this.R = R; }
  rad(r, grp) { return Math.min(r * this.k[grp || (r <= T1 + 0.01 ? 'g1' : r < FULL ? 'g2' : 'g3')], this.R); }
  tone(r) { return dots(this.rad(r)); }
  solid() { return dots(this.rad(FULL, 'g3')); }
  line() { return this.R >= FULL ? INK : dots(this.R); }
  rules(w, crossed) { return this.R < FULL ? null : rules(w * this.k.g2, crossed); }
}
const DONE = new Ink();

/* ------------------------------------------------------------ geometry and brush */
function bez(a, b, c, d, n = 18) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, v = 1 - u, A = v * v * v, B = 3 * v * v * u, C = 3 * v * u * u, D = u * u * u;
    out.push([A * a[0] + B * b[0] + C * c[0] + D * d[0], A * a[1] + B * b[1] + C * c[1] + D * d[1]]);
  }
  return out;
}
function curve(a, b, c, n = 12) {
  const out = [];
  for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u; out.push([v * v * a[0] + 2 * v * u * b[0] + u * u * c[0], v * v * a[1] + 2 * v * u * b[1] + u * u * c[1]]); }
  return out;
}
function straight(a, b, n = 6) { const out = []; for (let i = 0; i <= n; i++) out.push([mix(a[0], b[0], i / n), mix(a[1], b[1], i / n)]); return out; }
function oval(cx, cy, rx, ry, a0 = 0, a1 = TAU, n = 40) {
  const out = [];
  for (let i = 0; i <= n; i++) { const a = mix(a0, a1, i / n); out.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); }
  return out;
}
// Concatenate point runs, dropping a run's first point when it repeats the previous run's last.
function join(...parts) {
  const out = [];
  for (const p of parts) {
    const last = out[out.length - 1], same = last && Math.abs(last[0] - p[0][0]) + Math.abs(last[1] - p[0][1]) < 0.01;
    out.push(...(same ? p.slice(1) : p));
  }
  return out;
}
function region(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
function paint(g, path, style) { if (!style) return; g.fillStyle = style; g.fill(path); }
// A solid-ink shape that keeps its contour from the first frame, while its fill lays in through the dots.
function solidShape(g, ink, pts, w = 1.8) {
  paint(g, region(pts), ink.solid());
  outline(g, [...pts, pts[0]], w, { every: 1, tip: 0.8, taper: 6 });
}

// A brush contour: a filled ribbon along pts, w px wide, tapering to tip*w over the first and last few px.
function brush(g, pts, w, o = {}) {
  const n = pts.length;
  if (n < 2 || w <= 0) return;
  const tip = o.tip ?? 0.35, acc = [0];
  w *= WEIGHT;
  for (let i = 1; i < n; i++) acc.push(acc[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const len = acc[n - 1] || 1, tl = Math.min(len * 0.35, o.taper ?? 24), L = [], R = [];
  let w0 = 0, w1 = 0;
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const s = acc[i], k = tip + (1 - tip) * ease(clamp(Math.min(s, len - s) / tl));
    const hw = (o.width ? o.width(s / len) * WEIGHT : w) * k / 2;
    if (i === 0) w0 = hw; if (i === n - 1) w1 = hw;
    L.push([pts[i][0] - dy * hw, pts[i][1] + dx * hw]); R.push([pts[i][0] + dy * hw, pts[i][1] - dx * hw]);
  }
  const p = new Path2D();
  p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < n; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath();
  p.moveTo(pts[0][0] + w0, pts[0][1]); p.arc(pts[0][0], pts[0][1], w0, 0, TAU);
  p.moveTo(pts[n - 1][0] + w1, pts[n - 1][1]); p.arc(pts[n - 1][0], pts[n - 1][1], w1, 0, TAU);
  g.fillStyle = o.color || INK; g.fill(p);
}
// Outline a closed point loop as separate strokes, each with its own taper, the way an inker goes round a shape.
function outline(g, pts, w, o = {}) {
  const every = o.every ?? 14;
  for (let i = 0; i < pts.length - 1; i += every) brush(g, pts.slice(i, Math.min(pts.length, i + every + 1)), w, o);
}
// Foliage, drawn the manga way: masses whose edges break into pointed leaf tips (never arcs), toned by the light.
// A wobbly closed outline around (cx, cy), sampled finely.
function blob(cx, cy, rx, ry, seed, n = 140, wild = 1) {
  const rnd = xorshift(seed), p = [rnd() * TAU, rnd() * TAU, rnd() * TAU];
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * TAU, k = 1 + wild * (0.13 * Math.sin(2 * a + p[0]) + 0.08 * Math.sin(3 * a + p[1]) + 0.04 * Math.sin(5 * a + p[2]));
    out.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
  }
  return out;
}
// Serrate a line into leaf tips: every few px a pointed leaf stands off it, leaning a little, now and then a
// deeper notch. Closed loops put the tips outward (side 1) or inward (side -1); open lines put them on the
// left of travel (side 1) or the right (side -1). `size` may be a number or a function of the point.
function leaves(base, size, seed, closed = true, side = 1) {
  const rnd = xorshift(seed), n = base.length, segs = closed ? n : n - 1, acc = [0];
  for (let i = 1; i <= segs; i++) acc.push(acc[i - 1] + Math.hypot(base[i % n][0] - base[i - 1][0], base[i % n][1] - base[i - 1][1]));
  const total = acc[segs];
  let area = 0;
  for (let i = 0; i < n; i++) { const q = base[(i + 1) % n]; area += base[i][0] * q[1] - q[0] * base[i][1]; }
  const turn = closed ? Math.sign(area) * side : -side;
  const at = d => {
    d = clamp(d, 0, total);
    let i = 1; while (i < segs && acc[i] < d) i++;
    const p0 = base[i - 1], p1 = base[i % n], f = (d - acc[i - 1]) / Math.max(1e-6, acc[i] - acc[i - 1]), tl = Math.hypot(p1[0] - p0[0], p1[1] - p0[1]) || 1;
    return [[mix(p0[0], p1[0], f), mix(p0[1], p1[1], f)], [(p1[0] - p0[0]) / tl, (p1[1] - p0[1]) / tl]];
  };
  const out = [];
  for (let d = 0; d < total - 2;) {
    const [p0] = at(d), sz = typeof size === 'function' ? size(p0) : size;
    const step = Math.min(total - d, sz * (0.8 + 0.5 * rnd()));
    const h = sz * (0.32 + 0.3 * rnd()) * (rnd() < 0.08 ? -0.7 : 1), apex = 0.5 + 0.18 * rnd();
    out.push(p0);
    // each leaf is an almond profile: it swells off the line, comes to a point past its middle, and tucks back
    for (const [f, k] of [[apex * 0.45, 0.62], [apex, 1], [apex + (1 - apex) * 0.5, 0.42]]) {
      const [q, t] = at(d + step * f);
      out.push([q[0] + t[1] * turn * h * k, q[1] - t[0] * turn * h * k]);
    }
    d += step;
  }
  out.push(closed ? out[0] : at(total)[0]);
  return out;
}
// Round-cornered pen line for leaf edges (tips stay sharp, joints stay clean).
function pen(g, pts, w, color = INK) {
  if (!color || pts.length < 2) return;
  g.save(); g.strokeStyle = color; g.lineWidth = w * WEIGHT; g.lineJoin = 'round'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const q of pts.slice(1)) g.lineTo(q[0], q[1]); g.stroke();
  g.restore();
}
const tri = x => Math.abs(((x % 2) + 2) % 2 - 1);
// One mass of leaves: paper, then dots stepped by the light (T1 sunlit top edge, T2 body, T3 underside and
// shadow side, and a band of T3 under each inner chain of leaves), then the leaf-tip edges.
function leafMass(m, seed) {
  const base = blob(m.cx, m.cy, m.rx, m.ry, seed), edge = leaves(base, m.size, seed + 1);
  const chains = (m.chains || []).map(([x0, x1, yb, depth], i) => {
    const pts = [];
    for (let k = 0; k <= 24; k++) pts.push([mix(x0, x1, k / 24), yb + depth * Math.sin(Math.PI * k / 24)]);
    return { x0, x1, yb, depth, edge: leaves(pts, m.size * 0.8, seed + 10 + i, false, -1) };
  });
  return { ...m, edge, chains, path: region(edge) };
}
function massTone(m, x, y) {
  const v = (y - m.cy) / m.ry, u = (x - m.cx) / m.rx;
  let s = 0.4 + 0.52 * v + 0.26 * u + 0.1 * tri((x * 0.7 + y) / 13);
  for (const c of m.chains) {
    if (x < c.x0 || x > c.x1) continue;
    const yc = c.yb + c.depth * Math.sin(Math.PI * (x - c.x0) / (c.x1 - c.x0));
    if (y > yc && y < yc + 34) s += 0.45 * (1 - (y - yc) / 34);
  }
  return s < 0.24 ? T1 : s < 0.7 ? T2 : T3;
}
function paintMass(g, ink, m, tone = massTone) {
  paint(g, m.path, PAPER);
  g.save(); g.clip(m.path);
  field(g, [m.cx - m.rx * 1.5, m.cy - m.ry * 1.5, m.cx + m.rx * 1.5, m.cy + m.ry * 1.5], (x, y) => ink.rad(tone(m, x, y), 'g2'));
  g.restore();
  for (const c of m.chains) pen(g, c.edge, 1.8);
  pen(g, m.edge, 2.2);
}

/* ------------------------------------------------------------ shot 1: the lane at noon */
const VP = [980, 640];
// The point at x on the line from p to the vanishing point.
const toVP = (p, x) => [x, p[1] + (VP[1] - p[1]) * (x - p[0]) / (VP[0] - p[0])];
const LANE_W = W + 140;                 // background layer, drifting 1 px a frame
const POLE_X = 1545, POLE_W = 640;      // near pole at t = 0, its layer drifting 2 px a frame
const WALL = { top: [0, 352], base: [0, 1110], end: 770 };
const wallZ = x => 2940 / (980 - x), wallX = z => 980 - 2940 / z;
const wallPt = (x, f) => [x, mix(toVP(WALL.top, x)[1], toVP(WALL.base, x)[1], f)];
const RWALL = { top: [2040, 712], base: [2040, 1140], hedge: [2040, 400], end: 1205 };
const HOUSE = { ridge: [300, 40], tiles: [300, 82], eave: [300, 98], soffit: [300, 128], cast: [300, 176], x0: 300, x1: 760 };
const FARPOLE = { x: 885, top: 366, foot: 712 };
const FAR_UP = [[851, 384], [872, 384], [898, 384], [919, 384]], FAR_LOW = [[884, 424]];

function paintFarHouse(g, ink) {
  const roof = region([[776, 471], [1204, 471], [1152, 428], [828, 428]]);
  paint(g, roof, ink.tone(T2));
  for (const y of [440, 452, 462]) brush(g, [[828 - (y - 428) * 1.2, y], [1152 + (y - 428) * 1.2, y]], 1.5, { tip: 0.6 });
  brush(g, join([[776, 471]], [[828, 428]], [[1152, 428]], [[1204, 471]]), 2.4, { tip: 0.5 });
  solidShape(g, ink, [[776, 471], [1204, 471], [1204, 479], [776, 479]]);
  for (const x of [846, 1066]) {
    solidShape(g, ink, [[x, 502], [x + 66, 502], [x + 66, 544], [x, 544]]);
    brush(g, [[x + 33, 502], [x + 33, 544]], 2.2, { tip: 1, color: ink.solid() === INK ? PAPER : INK });
  }
  solidShape(g, ink, [[792, 590], [1188, 590], [1188, 598], [792, 598]]);
  for (const x of [792, 1188]) brush(g, [[x, 479], [x, 704]], 2.2, { tip: 0.6 });
  brush(g, [[930, 612], [930, 704]], 1.8, { tip: 0.6 }); brush(g, [[1050, 612], [1050, 704]], 1.8, { tip: 0.6 });
  brush(g, [[930, 612], [1050, 612]], 1.8, { tip: 0.6 });
  brush(g, [[770, 706], [1210, 704]], 2, { tip: 0.5 });
}
function paintFarPole(g, ink) {
  const { x, top, foot } = FARPOLE, hw = y => mix(4.5, 6.5, (y - top) / (foot - top));
  const body = region([[x - hw(top), top], [x + hw(top), top], [x + hw(foot), foot], [x - hw(foot), foot]]);
  paint(g, body, PAPER);
  paint(g, region([[x + hw(top) * 0.2, top], [x + hw(top), top], [x + hw(foot), foot], [x + hw(foot) * 0.2, foot]]), ink.solid());
  brush(g, [[x - hw(top), top], [x - hw(foot), foot]], 1.8, { tip: 0.6 });
  brush(g, [[x + hw(top), top], [x + hw(foot), foot]], 1.8, { tip: 0.6 });
  solidShape(g, ink, [[846, 384], [924, 384], [924, 390], [846, 390]]);
  solidShape(g, ink, [[878, 422], [892, 422], [892, 427], [878, 427]]);
  for (const [px, py] of FAR_UP) brush(g, [[px, py], [px, py - 7]], 3, { tip: 1 });
}
let HEDGE = null;
function hedgeShape(x0, x1) {
  const top = [], rnd = xorshift(311);
  // gentle domes, one per shrub, shrinking toward the far end
  for (let x = x1 + 20; x >= x0 - 6; x -= 4) {
    const k = (x - 980) / 1060, w = 150 * k, ph = ((x1 - x) % w) / w;
    top.push([x, toVP(RWALL.hedge, x)[1] + 26 * k - 18 * k * Math.sin(Math.PI * ph)]);
  }
  const bottom = [toVP(RWALL.top, x0 - 6), toVP(RWALL.top, x1 + 20)].map(([x, y]) => [x, y + 6]);
  const base = [...top, ...bottom];
  const size = ([x]) => 3 + 13 * clamp((x - 1100) / 940);
  const edge = leaves(base, size, 312);
  const chains = [3.5, 4.8, 6.6, 9.4].map((z, i) => {
    const x = 980 + 3150 / z, t = toVP(RWALL.hedge, x)[1] + 20, b = toVP(RWALL.top, x)[1];
    const pts = []; for (let k = 0; k <= 12; k++) pts.push([x - 6 * Math.sin(Math.PI * k / 12) * (x - 980) / 1060, mix(t, b, k / 12)]);
    return { x0: 0, x1: -1, edge: leaves(pts, size, 320 + i, false, 1) };
  });
  return { cx: (x0 + x1) / 2, cy: 560, rx: (x1 - x0) / 2 + 40, ry: 200, edge, chains, path: region(edge) };
}
// Hedge light: sunlit crown, dotted body, dense dots where it meets the fence.
function hedgeTone(m, x, y) {
  const t = toVP(RWALL.hedge, x)[1] + 10, b = toVP(RWALL.top, x)[1], v = (y - t) / (b - t);
  const s = 0.12 + 0.95 * v + 0.1 * tri((x * 0.6 + y) / 11);
  return s < 0.24 ? T1 : s < 0.72 ? T2 : T3;
}
function paintRightSide(g, ink) {
  const x0 = RWALL.end, x1 = LANE_W + 10;
  const face = region([toVP(RWALL.top, x0), toVP(RWALL.top, x1), toVP(RWALL.base, x1), toVP(RWALL.base, x0)]);
  // the hedge behind the low wall: one long row of shrubs, flat-topped, leaf tips along its crown, dark at its foot
  HEDGE ||= hedgeShape(x0, x1);

// Through ink: a soft diagonal front of dots on the screen grid, eased in and out. Ahead of it the lane,

// and the nearer roofs picked out by thin paper rims. Under the ink every shape is also drawn as a brush
// contour, so when the ink recedes at the end the town is left as line art.
const SKYLINE = [[-20, 612], [-10, 604], [20, 584], [146, 486], [142, 476], [156, 466], [170, 476], [166, 486], [296, 584], [326, 604], [334, 612],
  [318, 612], [318, 700], [346, 700], [412, 668], [600, 668], [664, 700], [652, 706], [720, 676], [880, 676], [940, 708], [930, 708], [930, 694],
  [1040, 694], [1040, 682], [1090, 682], [1090, 694], [1160, 694], [1160, 712], [1148, 716], [1290, 686], [1432, 716], [1420, 716],
  [1420, 724], [1700, 724], [1700, 500], [1792, 500], [1792, 492], [ROOF_W + 10, 492], [ROOF_W + 10, H + 10], [-20, H + 10]];
const RIMS = [
  [[-20, 842], [96, 790], [520, 790], [644, 846]], [[602, 884], [770, 800], [938, 884]], [[900, 826], [1316, 826], [1400, 858]],
  [[1296, 914], [1500, 846], [1716, 914]], [[1700, 500], [1700, 830]],
];
const INNER = [
  [[-10, 612], [334, 612]], [[318, 700], [318, 790]], [[30, 612], [30, 820]],
  [[346, 700], [664, 700]], [[364, 700], [364, 790]], [[648, 700], [648, 862]],
  [[652, 708], [940, 708]], [[930, 708], [930, 826]], [[930, 704], [1160, 704]],
  [[1148, 716], [1432, 716]], [[1172, 716], [1172, 826]], [[1408, 716], [1408, 838]], [[1420, 734], [1700, 734]],
  [[1700, 540], [ROOF_W + 10, 540]], [[1700, 640], [ROOF_W + 10, 640]], [[1700, 740], [ROOF_W + 10, 740]],
  [[150, 818], [150, H + 10]], [[500, 790], [500, H + 10]], [[700, 842], [700, H + 10]], [[860, 842], [860, H + 10]],
  [[1150, 826], [1150, H + 10]], [[1380, 873], [1380, H + 10]], [[1640, 893], [1640, H + 10]],
];
const LIT = [[84, 628, 66, 50, 1], [500, 718, 40, 30, 0], [990, 742, 56, 38, 0], [1900, 560, 48, 54, 0], [1080, 900, 60, 40, 1]];
const POLE3 = 1640;
function paintRoofs(g, ink, line) {
  const fill = ink.solid(), P = POLE3;
  // the ink masses: the town, the pole, its crossarm and drum, the water tank
  const land = region(SKYLINE);
  paint(g, land, PAPER);
  paint(g, land, fill);
  const pole = [[P - 6, 356], [P + 6, 356], [P + 9, H + 10], [P - 9, H + 10]], arm = [[P - 60, 386], [P + 60, 386], [P + 60, 394], [P - 60, 394]];
  const drum = join(oval(P + 30, 450, 20, 5, Math.PI, TAU, 10), oval(P + 30, 500, 20, 5, 0, Math.PI, 10));
  const tank = join(oval(1910, 390, 70, 12, Math.PI, TAU, 16), oval(1910, 442, 70, 12, 0, Math.PI, 16));
  for (const shape of [pole, arm, drum, tank]) paint(g, region(shape), fill);
  for (const [x, y, w, h, curtain] of LIT) {
    paint(g, region([[x, y], [x + w, y], [x + w, y + h], [x, y + h]]), PAPER);
    if (curtain) paint(g, region([[x, y], [x + w * 0.46, y], [x + w * 0.38, y + h], [x, y + h]]), ink.tone(T1));
  }
  // the nearer roofs catch the last light just above their edges
  if (fill) {
    for (const r of RIMS) brush(g, r.map(([x, y]) => [x + 3, y - 4]), 2.4, { tip: 0.4, taper: 50, color: PAPER });
    for (let x = 140; x < 500; x += 46) brush(g, [[x, 800], [x - 16, 860]], 1.8, { tip: 0.3, taper: 20, color: PAPER });
  }
  if (!line) return;
  // the contours
  outline(g, SKYLINE.slice(0, -2), 4, { every: 1, tip: 0.55, taper: 14, color: line });
  for (const l of INNER) brush(g, l, 2.8, { tip: 0.35, taper: 40, color: line });
  for (const r of RIMS) brush(g, r, 3.4, { tip: 0.4, taper: 50, color: line });
  outline(g, join(pole, [pole[0]]), 3, { every: 1, tip: 0.6, color: line });
  outline(g, join(arm, [arm[0]]), 2.6, { every: 1, tip: 0.7, color: line });
  brush(g, join(drum, [drum[0]]), 2.2, { tip: 1, color: line });
  brush(g, join(tank, [tank[0]]), 2.6, { tip: 1, color: line });
  brush(g, oval(1910, 390, 70, 12, 0, Math.PI, 16), 2, { tip: 0.5, color: line });
  for (const x of [1850, 1874, 1946, 1970]) brush(g, [[x, 492], [x + (x < 1910 ? 6 : -6), 450]], 3.6, { tip: 1, color: line });
  brush(g, [[1862, 466], [1958, 466]], 2.6, { tip: 1, color: line });
  // antenna on the gable: a mast, a boom and its row of elements
  brush(g, [[200, 500], [200, 352]], 3.4, { tip: 1, color: line });
  brush(g, [[136, 376], [270, 376]], 3, { tip: 1, color: line });
  for (let x = 142; x <= 266; x += 13) brush(g, [[x - 4, 368], [x + 4, 384]], 2.4, { tip: 1, color: line });
  brush(g, [[170, 414], [230, 414]], 2.6, { tip: 1, color: line });
  // wires sweeping off to the right
  for (const [a, b, sag] of [[[P - 54, 382], [ROOF_W + 20, 330], 46], [[P + 54, 382], [ROOF_W + 20, 370], 30]]) brush(g, wirePath(a, b, sag), 2.6, { tip: 1, color: line });
  for (const [x, y, w, h, curtain] of LIT) {
    outline(g, [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]], 2.2, { every: 1, tip: 0.7, color: line });
    if (curtain) brush(g, [[x + w * 0.46, y], [x + w * 0.38, y + h]], 2, { tip: 0.6, color: line });
    const m = x + w / 2 + (curtain ? 6 : 0);
    brush(g, [[m, y], [m, y + h]], 2.4, { tip: 1, color: line });
  }
}
// The ladder radius of the evening shot: up as it lays in, then down to nothing for the final outlines.
const RMAX = FULL * 1.1;
function duskR(t) { return t < TL.fall[0] ? RMAX * ease(ramp(t, ...TL.rise)) : RMAX * (1 - ease(ramp(t, ...TL.fall))); }
const lineR = t => RMAX * ease(ramp(t, ...TL.lines));
const titleR = t => RMAX * ease(ramp(t, ...TL.title));
// The accent: one low marker stroke under the words, from just above the baseline into the descender zone,
// tilted 1.5 degrees down to the right. It lands on a small pooled blob, runs flat, and runs dry into a few
// broken, tapering streaks; while it is being drawn its front is the slanted, slightly rounded chisel nib.
let STROKE = null;
function markerStroke(x0, x1, top, h) {
  const rnd = xorshift(29), a = 1.5 * Math.PI / 180, L = x1 - x0, ca = Math.cos(a), sa = Math.sin(a);
  const at = (u, v) => [x0 + u * ca - v * sa, top + u * sa + v * ca];
  const wob = [rnd() * TAU, rnd() * TAU];
  const edgeV = (u, side) => side ? h + 1.2 * Math.sin(u / 47 + wob[1]) : 1.2 * Math.sin(u / 61 + wob[0]);
  const p = new Path2D(), poly = pts => { const q = pts.map(([u, v]) => at(u, v)); p.moveTo(...q[0]); for (const r of q.slice(1)) p.lineTo(...r); p.closePath(); };
  // the pooled start
  const egg = [];
  for (let i = 0; i < 32; i++) { const a = i / 32 * TAU; egg.push([h * 0.52 + h * 0.62 * Math.cos(a), h * 0.5 + h * 0.545 * Math.sin(a) * (1 - 0.18 * Math.cos(a))]); }
  poly(egg);
  // the body, ending in a chisel edge where the felt starts to run dry
  const end = L * 0.8, upper = [], bot = [];
  for (let i = 0; i <= 40; i++) { const u = mix(h * 0.3, end, i / 40); upper.push([u, edgeV(u, 0)]); bot.push([u, edgeV(u, 1)]); }
  poly([...upper, [end + h * 0.18, edgeV(end, 0) + 2], [end - h * 0.18, edgeV(end, 1)], ...bot.reverse()]);
  // the dry finish: four streaks of unequal length, some broken, each tapering to a point
  for (const [vc, th, len, gap] of [[0.13, 0.17, 0.91, 0], [0.38, 0.24, 0.97, 0.88], [0.63, 0.2, 0.86, 0], [0.87, 0.15, 0.93, 0.84]]) {
    const u0 = end - h * 0.2, u1 = L * len, c = vc * h, t2 = th * h / 2;
    const dashes = gap ? [[u0, L * gap], [L * gap + 9 + rnd() * 8, u1]] : [[u0, u1]];
    for (const [s0, s1] of dashes) poly([[s0, c - t2], [mix(s0, s1, 0.7), c - t2 * 0.8], [s1, c + t2 * 0.1], [mix(s0, s1, 0.7), c + t2 * 0.8], [s0, c + t2]]);
  }
  // the nib's front at reveal position u: slanted about 20 degrees, its two corners rounded off
  const nib = u => {
    const pts = [[-200, -60]];
    for (let v = -60; v <= h + 60; v += 3) {
      const corner = Math.min(Math.abs(v), Math.abs(v - h)), round = v < 0 || v > h ? 6 : 6 * (1 - ease(clamp(corner / 7)));
      pts.push([u + (v - h / 2) * Math.tan(20 * Math.PI / 180) - round, v]);
    }
    pts.push([-200, h + 60]);
    return region(pts.map(([uu, vv]) => at(uu, vv)));
  };
  return { x0, x1, L, h, path: p, nib };
}
let TEXT = null, MARK = null, SCRATCH = null;
// Draw `layer` through the shared title screen of radius r; `op` is how it lands on the frame.
function throughScreen(g, layer, r, op = 'source-over') {
  if (r < 0.2) return;
  let src = layer;
  if (r < FULL) {
    const s = SCRATCH.getContext('2d');
    s.globalCompositeOperation = 'copy'; s.drawImage(layer, 0, 0);
    s.globalCompositeOperation = 'destination-in'; s.fillStyle = dots(r); s.fillRect(0, 0, W, H);
    s.globalCompositeOperation = 'source-over';
    src = SCRATCH;
  }
  g.save(); g.globalCompositeOperation = op; g.drawImage(src, 0, 0); g.restore();
}
let SKY = null, ROOFS = null;
function shotThree(g, t) {
  // the drift stops when the ink has gone and the outlines hold
  const n = Math.min(frameOf(t), frameOf(TL.fall[1])) - frameOf(TL.three), skyOff = Math.floor(n / 6), roofOff = Math.floor(n / 3);
  const R = duskR(t), lr = lineR(t);
  if (R >= RMAX - 1e-6) { g.drawImage(SKY, -skyOff, 0); g.drawImage(ROOFS, -roofOff, 0); }
  else {
    const ink = new Ink(undefined, R), line = lr >= RMAX - 1e-6 ? INK : dots(lr);
    g.save(); g.translate(-skyOff, 0); paintSky(g, ink, line); g.restore();
    g.save(); g.translate(-roofOff, 0); paintRoofs(g, ink, line); g.restore();
  }
  // the marker stroke under the words, then the words over it
  const k = ease(ramp(t, ...TL.swipe));
  if (k > 0) {
    const m = MARK.getContext('2d');
    m.clearRect(0, 0, W, H);
    m.save();
    if (k < 1) m.clip(STROKE.nib(-STROKE.h + k * (STROKE.L + 2 * STROKE.h)));
    m.fillStyle = MARKER; m.globalAlpha = 0.9; m.fill(STROKE.path);
    m.restore();
    g.save(); g.globalCompositeOperation = 'multiply'; g.drawImage(MARK, 0, 0); g.restore();
  }
  throughScreen(g, TEXT, titleR(t));
}

/* ------------------------------------------------------------ shot drawing */
let LANE = null, POLE = null;
function laneState(t) { return new Ink({ g1: ease(ramp(t, ...TL.lay[0])), g2: ease(ramp(t, ...TL.lay[1])), g3: ease(ramp(t, ...TL.lay[2])) }); }
function shotOne(g, t) {
  const n = frameOf(t), laneOff = n, poleOff = 2 * n;
  const ink = t < TL.lay[2][1] ? laneState(t) : DONE;
  if (ink === DONE) g.drawImage(LANE, -laneOff, 0);
  else { g.save(); g.translate(-laneOff, 0); paintLane(g, ink); g.restore(); }
  const list = wires(t, poleOff, laneOff);
  drawWires(g, list);
  const px = POLE_X - POLE_W / 2;
  if (ink === DONE) g.drawImage(POLE, px - poleOff, 0);
  else { g.save(); g.translate(-poleOff, 0); paintPole(g, ink); g.restore(); }
  // the crow rides the perch wire until it lifts off
  const wire = list[PERCH.wire], perch = wire[Math.round(PERCH.at * 40)], SC = 0.9;
  const flick = Math.sin(Math.PI * ramp(t, 1.08, 1.3)) * 0.05;
  if (t < TL.lift) crowPerched(g, ink, perch[0], perch[1] - 1, SC, ease(ramp(t, ...TL.crouch)), flick);
  else if (t < TL.lift + TL.fly) {
    const lift = wires(TL.lift, 2 * frameOf(TL.lift), frameOf(TL.lift))[PERCH.wire][Math.round(PERCH.at * 40)];
    const f = crowFlight(t, [lift[0] - (poleOff - 2 * frameOf(TL.lift)) * 0.7, lift[1]]);
    crowFlying(g, f.x, f.y, SC, f.flap, f.pitch);
  }
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  if (t < TL.front[0]) shotOne(ctx, t);
  else if (t < TL.front[1]) inkFront(ctx, t);
  else if (t < TL.paper[0]) shotTwo(ctx, t);
  else if (t < TL.three) paperBreak(ctx, t);
  else shotThree(ctx, t);
}

window.draw = function ({ t }) { render(t); const u = cv.toDataURL('image/jpeg', 0.92); return u.slice(u.indexOf(',') + 1); };

window.events = function () {
  const r3 = v => Math.round(v * 1000) / 1000, pan = x => r3(clamp((x - W / 2) / (W / 2), -1, 1)), ev = [];
  ev.push({ k: 'bed', t: 0, end: DUR });
  // the lane's tones burnished in, light dots, mid dots and rules, then solid ink
  TL.lay.forEach(([a, b], i) => ev.push({ k: 'lay', t: a, d: r3(b - a), v: [0.55, 0.8, 1][i], p: [-0.35, 0.05, 0.3][i] }));
  // the crow: the wire creaks as it crouches, one whoosh per downstroke, then the wire hums as it wobbles
  const n0 = frameOf(TL.lift), perch = wires(TL.lift, 2 * n0, n0)[PERCH.wire][Math.round(PERCH.at * 40)];
  ev.push({ k: 'creak', t: TL.crouch[0], d: r3(TL.crouch[1] - TL.crouch[0]), p: pan(perch[0]) });
  for (let i = 0; i < 4; i++) {
    const t = TL.lift + i * TL.beat + 0.03, f = crowFlight(t, perch);
    ev.push({ k: 'wing', t: r3(t), d: r3(TL.beat * 0.5), v: r3(1 - 0.16 * i), p: pan(f.x) });
  }
  ev.push({ k: 'thrum', t: TL.lift, d: 1.5, hz: 2.7, p: pan(perch[0]) });
  ev.push({ k: 'swell', t: TL.front[0], d: r3(TL.front[1] - TL.front[0]), dark: 1 });
  // the breeze in the laundry: how hard the cloth is moving, frame by frame
  const env = [];
  for (let n = frameOf(TL.front[0]); n <= frameOf(TL.paper[1]); n++) {
    const t = n / FPS;
    let m = 0;
    for (const it of LAUNDRY) m += Math.abs(sway(it, t + 1 / 60) - sway(it, t - 1 / 60)) * FPS / (TAU * it.freq * it.amp);
    env.push(r3(gust(t) * (0.45 + 0.55 * m / LAUNDRY.length)));
  }
  ev.push({ k: 'cloth', t: r3(frameOf(TL.front[0]) / FPS), rate: FPS, env });
  ev.push({ k: 'swell', t: TL.paper[0], d: r3(TL.paper[1] - TL.paper[0]), dark: 0 });
  ev.push({ k: 'lay', t: TL.lines[0], d: r3(TL.rise[1] - TL.lines[0]), v: 0.9, p: 0 });
  ev.push({ k: 'drone', t: TL.rise[0], end: DUR });
  ev.push({ k: 'bell', t: r3(TL.title[0] + 0.05), p: pan(LAYOUT.x + 560) });
  ev.push({ k: 'marker', t: TL.swipe[0], d: r3(TL.swipe[1] - TL.swipe[0]), p0: pan(STROKE.x0), p1: pan(STROKE.x1) });
  ev.push({ k: 'unlay', t: TL.fall[0], d: r3(TL.fall[1] - TL.fall[0]) });
  ev.push({ k: 'fade', t: TL.fall[0], end: DUR });
  return ev.sort((a, b) => a.t - b.t);
};

window.ready = (async () => {
  await document.fonts.load(`600 150px ${SERIF}`);
  await document.fonts.ready;
  LANE = sheet(LANE_W, H); paintLane(LANE.getContext('2d'), DONE);
  POLE = sheet(POLE_W, H);
  { const g = POLE.getContext('2d'); g.translate(-(POLE_X - POLE_W / 2), 0); POLE_ENDS = paintPole(g, DONE); }
  BACK = sheet(W, H); paintBalconyBack(BACK.getContext('2d'));
  FRONT = sheet(W, H); paintRailing(FRONT.getContext('2d'));
  SKY = sheet(SKY_W, H); paintSky(SKY.getContext('2d'), DONE, INK);
  ROOFS = sheet(ROOF_W, H); paintRoofs(ROOFS.getContext('2d'), DONE, INK);
  // the title, set once; the swipe sits behind its lowercase band
  TEXT = sheet(W, H); MARK = sheet(W, H); SCRATCH = sheet(W, H);
  const tg = TEXT.getContext('2d');
  tg.font = `600 ${LAYOUT.size}px ${SERIF}`; tg.fillStyle = INK; tg.textBaseline = 'alphabetic';
  tg.fillText(TITLE, LAYOUT.x, LAYOUT.base);
  const m = tg.measureText(TITLE), x0 = LAYOUT.x + m.actualBoundingBoxLeft * -1, x1 = LAYOUT.x + m.actualBoundingBoxRight;
  STROKE = markerStroke(x0 - 4, x1 + 26, LAYOUT.base + 3, 45);
})();
