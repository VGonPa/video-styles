  const lk = sm(span(t, T.light[0], T.light[1]));
  cx.setTransform(1, 0, 0, 1, 0, 0);
  if (lk > 0) {
    camXf(cx, c);
    cx.globalCompositeOperation = 'multiply'; cx.globalAlpha = lk; cx.drawImage(LIGHT, 0, 0, W, H);
    cx.globalCompositeOperation = 'screen'; cx.globalAlpha = lk * 0.35; cx.drawImage(SHAFT, 0, 0, W, H);
    cx.globalCompositeOperation = 'source-over'; cx.globalAlpha = 1;
  }
  const ck = (1 - sm(span(t, T.title[0] - 0.45, T.title[0] - 0.05))) * sm(span(t, T.color[0], T.color[1]));
  if (ck > 0) {
    camXf(cx, c); cx.globalCompositeOperation = 'multiply';
    const gr = cx.createRadialGradient(CART.x, CART.y + 20, 60, CART.x, CART.y + 20, 420);
    gr.addColorStop(0, `rgba(104,74,48,${0.55 * ck})`); gr.addColorStop(1, 'rgba(104,74,48,0)');
    cx.fillStyle = gr; cx.fillRect(CART.x - 440, CART.y - 420, 880, 840); cx.globalCompositeOperation = 'source-over';
  }
  // 7. glints: a raking sheen across the punched gold, sparks where it catches a punch
  const sweep = (k, amp) => {
    if (k <= 0 || k >= 1) return;
    const g = tg; g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, W, H);
    camXf(g, c); g.drawImage(GOLDS, 0, 0, W, H);
    const s = mix(-500, 2300, k), dir = [0.86, 0.5], p0 = [dir[0] * (s - 240), dir[1] * (s - 240)], p1 = [dir[0] * (s + 240), dir[1] * (s + 240)];
    g.globalCompositeOperation = 'destination-in';
    g.fillStyle = lin(g, p0[0], p0[1], p1[0], p1[1], [[0, 'rgba(0,0,0,0)'], [0.5, `rgba(0,0,0,${amp})`], [1, 'rgba(0,0,0,0)']]); g.fillRect(-W, -H, 3 * W, 3 * H);
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalCompositeOperation = 'lighter'; cx.drawImage(TMP, 0, 0);
    camXf(cx, c);
    for (const [x, y, w] of SPARKS) {
      const e = (x * dir[0] + y * dir[1] - s) / 70, a = amp * w * Math.exp(-e * e) * (0.5 + 0.5 * hash2(x | 0, y | 0, 9));
      if (a < 0.08) continue;
      const rr = 5 + 9 * a;
      cx.fillStyle = `rgba(255,244,214,${0.8 * a})`;
      cx.fillRect(x - rr, y - 0.6, rr * 2, 1.2); cx.fillRect(x - 0.6, y - rr, 1.2, rr * 2);
      cx.beginPath(); cx.arc(x, y, 1.6 + a, 0, TAU); cx.fill();
    }
    cx.globalCompositeOperation = 'source-over';
  };
  sweep(inOut(span(t, T.glint[0], T.glint[1])), 1);
  sweep(span(t, T.push[0] + 0.3, T.tilt[0]), 0.4);
  sweep(span(t, T.glow[0] - 0.1, T.glow[1] + 0.2), 0.55);
  // 9. varnish: a warm tint and glow; the vignette closes and the panel sinks into the dark
  cx.setTransform(1, 0, 0, 1, 0, 0);
  const vk = sm(span(t, T.light[0], T.light[1] + 0.6)), glow = Math.sin(PI * span(t, T.glow[0], T.glow[1] + 0.3)), end = sm(span(t, T.close[0], DUR));
  if (vk > 0) { cx.globalCompositeOperation = 'multiply'; cx.fillStyle = `rgba(255,236,204,${0.35 * vk})`; cx.fillRect(0, 0, W, H); }
  cx.globalCompositeOperation = 'multiply'; cx.globalAlpha = 0.7; cx.drawImage(VIG, 0, 0, W, H);
  if (glow > 0) { cx.globalCompositeOperation = 'screen'; cx.globalAlpha = 0.22 * glow; cx.drawImage(SHAFT, 0, 0, W, H); }
  cx.globalAlpha = 1;
  if (end > 0) {   // the window light dies: shadows deepen first, the lit pools contract, the panel sinks
    camXf(cx, c); cx.globalCompositeOperation = 'multiply';
    for (let k = 0; k < 3; k++) { cx.globalAlpha = cl(end * 3 - k); if (cx.globalAlpha > 0) cx.drawImage(LIGHT, 0, 0, W, H); }
    cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = end; cx.drawImage(VIG, 0, 0, W, H); cx.globalAlpha = 1;
  }
  cx.globalCompositeOperation = 'source-over';
  const fade = Math.max(1 - sm(span(t, T.open[0], T.open[1])), 0.92 * sm(span(t, 9.45, 9.98)) ** 1.3);
  if (fade > 0) { cx.fillStyle = `rgba(12,7,4,${fade})`; cx.fillRect(0, 0, W, H); }
}

window.draw = ({ t }) => { frame(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const ev = [{ k: 'vp', t: T.vp }];
  ORTH.forEach((t, i) => ev.push({ k: 'line', t, i, d: T.orth.d }));
  TRANS.forEach((t, i) => ev.push({ k: 'step', t, i, d: T.trans.d }));
  ev.push({ k: 'diag', t: T.diag[0], d: T.diag[1] - T.diag[0] });
  DOTS.forEach(d => ev.push({ k: 'tick', t: d.t }));
  ev.push({ k: 'sinopia', t: T.draw[0], d: T.draw[1] - T.draw[0] });
  ev.push({ k: 'under', t: T.under[0], d: T.under[1] - T.under[0] }, { k: 'glaze', t: T.color[0], d: T.color[1] - T.color[0] });
  // loaded-brush and glaze strokes, binned per 1/15 s, panned where they land
  [[SU, 'brush'], [SC, 'wash']].forEach(([list, k]) => {
    const bins = {};
    list.forEach(q => { const f = Math.round(q.t0 * 15); (bins[f] = bins[f] || []).push(q); });
    Object.keys(bins).forEach(f => { const b = bins[f], x = b.reduce((a, q) => a + q.x + Math.cos(q.a) * q.l / 2, 0) / b.length; ev.push({ k, t: f / 15, v: b.length, pan: +cl((x - W / 2) / (W / 2), -1, 1).toFixed(2) }); });
  });
  ev.push({ k: 'light', t: T.light[0], d: T.light[1] - T.light[0] });
  ev.push({ k: 'bole', t: T.bole[0], d: T.bole[1] - T.bole[0] });
  // gold leaf landing, binned per frame
  const bins = {}; CELLS.forEach(q => { const f = Math.round(q.t * 30); bins[f] = (bins[f] || 0) + 1; });
  Object.keys(bins).forEach(f => ev.push({ k: 'leaf', t: f / 30, v: bins[f] }));
  ev.push({ k: 'glint', t: T.glint[0], d: T.glint[1] - T.glint[0] });
  ev.push({ k: 'push', t: T.push[0], d: T.push[1] - T.push[0] });
  ev.push({ k: 'turn', t: T.turn[0], d: T.turn[1] - T.turn[0] });
  let last = Math.floor(sphereTurn(T.turn[0]) / (PI / 6));
  for (let x = T.turn[0]; x < T.turn[1] + 0.5; x += 1 / 240) { const n = Math.floor(sphereTurn(x) / (PI / 6)); if (n !== last) { ev.push({ k: 'click', t: +x.toFixed(4), v: n > last ? 1 : -1 }); last = n; } }
  ev.push({ k: 'settle', t: T.turn[1] });
  GLYPHS.forEach((gl, i) => ev.push({ k: 'letter', t: letterT(i) + 0.2, i }));
  ev.push({ k: 'motto', t: T.motto[0], d: T.motto[1] - T.motto[0] }, { k: 'glow', t: T.glow[0] }, { k: 'close', t: T.close[0] });
  return ev;
};
window.ready = (async () => {
  await document.fonts.load('700 34px Cinzel'); await document.fonts.load('italic 500 20px "Cormorant Garamond"'); await document.fonts.ready;
  build();
})();
</script>
