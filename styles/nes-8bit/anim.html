<script>
// ── 8-Bit Console · "Monday Quest" ─────────────────────────────────────
// Everything is drawn on a 256×240 virtual screen (8×8 tile grid, third-generation console
// resolution) and enlarged 4× with nearest neighbour into the 1920×1080 frame (pillarboxed like
// a console on a widescreen TV). Colours come only from the classic 64-entry console palette
// (16 of them are used); sprites have 3 colours + transparency; no dithering, no blending.
// Title (palette fade-in) → vertical scroll → Stage 1 office: run, jump, coffee, emails, hit +
// flicker → full-screen flip scroll → boss "THE INBOX" → caffeinated power run → stomp → explosion
// → weekend flag → "LEVEL CLEAR!" → palette-step fade to black.
const W = 1920, H = 1080, VW = 256, VH = 240, SC = 4, OX = (W - VW * SC) / 2, OY = (H - VH * SC) / 2, DUR = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; };
const VC = mk(VW, VH), V = VC.getContext('2d'), BUF_A = mk(VW, VH), BUF_B = mk(VW, VH);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const R = Math.round, F = Math.floor;

// ── the console's 64-colour master palette (index = hardware colour number) ──
const NESPAL = [
  '#7C7C7C', '#0000FC', '#0000BC', '#4428BC', '#940084', '#A80020', '#A81000', '#881400', '#503000', '#007800', '#006800', '#005800', '#004058', '#000000', '#000000', '#000000',
  '#BCBCBC', '#0078F8', '#0058F8', '#6844FC', '#D800CC', '#E40058', '#F83800', '#E45C10', '#AC7C00', '#00B800', '#00A800', '#00A844', '#008888', '#000000', '#000000', '#000000',
  '#F8F8F8', '#3CBCFC', '#6888FC', '#9878F8', '#F878F8', '#F85898', '#F87858', '#FCA044', '#F8B800', '#B8F818', '#58D854', '#58F898', '#00E8D8', '#787878', '#000000', '#000000',
  '#FCFCFC', '#A4E4FC', '#B8B8F8', '#D8B8F8', '#F8B8F8', '#F8A4C0', '#F0D0B0', '#FCE0A8', '#F8D878', '#D8F878', '#B8F8B8', '#B8F8D8', '#00FCFC', '#F8D8F8', '#000000', '#000000'];
// the 16 colours this cartridge uses
const P = { k: 0x0F, w: 0x30, cr: 0x37, sky: 0x21, bl: 0x12, sk: 0x27, or: 0x17, br: 0x07, rd: 0x16, gd: 0x28, gn: 0x1A, lg: 0x2A, gy: 0x00, lgy: 0x10, lc: 0x31, db: 0x02 };

// palette fade: every step subtracts one brightness row (0x10); below row 0 → black
const FADE = [0, 1, 2, 3, 4].map(f => { const m = new Map(); for (let i = 0; i < 64; i++) { const j = i - 16 * f; const a = parseInt(NESPAL[i].slice(1), 16), b = parseInt(NESPAL[j < 0 ? 0x0F : j].slice(1), 16); if (!m.has(a)) m.set(a, b); } return m; });

const rect = (x, y, w, h, ci) => { V.fillStyle = hex(ci); V.fillRect(R(x), R(y), w, h); };
// sprite from a character grid: map char → palette index ('.' transparent)
function grid(rows, map) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length)), c = mk(w, h), x = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, i) => { if (map[ch] !== undefined) { x.fillStyle = hex(map[ch]); x.fillRect(i, y, 1, 1); } }));
  return c;
}
const spr = (c, x, y, flip = false) => { if (!flip) V.drawImage(c, R(x), R(y)); else { V.save(); V.translate(R(x) + c.width, R(y)); V.scale(-1, 1); V.drawImage(c, 0, 0); V.restore(); } };

// ── text: 8×8 pixel font, thresholded to hard pixels and tinted with one palette colour ──
const TX = {};
function textCan(s, ci) {

function txt(s, x, y, ci, sc = 1, sh = -1, sho = 1) {

const txtC = (s, cx, y, ci, sc = 1, sh = -1, sho = 1) => txt(s, cx - s.length * 4 * sc, y, ci, sc, sh, sho);

// ── hero: 18×24 office worker, built from a pose skeleton (head, torso, jointed limbs, hands) ──
const HEAD = [

  '.kkkkssssk.',

  '..kssssss..',
  '...ksssk...',
  '....sss....'];

  run1: { fa: [[9, 10], [7, 12], [5, 13]], ba: [[8, 10], [11, 12], [13, 11]], fl: [[9, 16], [12, 18], [13, 22]], bl: [[7, 16], [6, 19], [3, 20]] },
  run2: { fa: [[9, 10], [9, 12], [10, 14]], ba: [[7, 10], [7, 12], [7, 14]], fl: [[9, 16], [10, 19], [9, 22]], bl: [[7, 16], [9, 18], [6, 20]] },
  run3: { fa: [[9, 10], [11, 12], [13, 10]], ba: [[7, 10], [5, 12], [3, 13]], fl: [[9, 16], [8, 19], [5, 21]], bl: [[7, 16], [10, 18], [12, 22]] },

function makeHero(pose, pal) {
  const GW = 18, GH = 25, g = Array.from({ length: GH }, () => new Array(GW).fill(0));
  const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < GW && y < GH) g[y][x] = v; };
  const box = (x, y, w, h, v) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, v); };

    const o = -F((th - 1) / 2); for (;;) { box(x0 + o, y0 + o, th, th, v); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } };

const HPALS = [[P.k, P.sk, P.bl], [P.k, P.w, P.rd], [P.br, P.gd, P.w], [P.bl, P.sk, P.gd]];  // normal + 3 "caffeinated" cycles
const HERO = {}; for (const k in POSES) HERO[k] = HPALS.map(pl => makeHero(k, pl));

// ── other sprites ──

  'kkkkkkkk..',

const MAIL = [0, 1].map(f => grid(f ? [
  '..................',
  '...kkkkkkkkkkkk...',

  'kkkkkk..',
  'knnnnk..',
  'kwwwwkkk',
  'kwwwwk.k',
  'kwwwwkkk',
  '.kkkk...'], { k: P.lgy, w: P.w, n: P.br });
function puff(f) { // explosion frames 0..3, 16×16
  const c = mk(16, 16), x = c.getContext('2d'); const r = (a, b, w, h, ci) => { x.fillStyle = hex(ci); x.fillRect(a, b, w, h); };

const PUFF = [0, 1, 2, 3].map(puff);

// ── timeline (seconds) ──
const T_SCROLL = 1.5, L0 = 1.95, VRUN = 140;
const J1 = [2.822, 3.322], T_FALL = 3.4, J2 = [3.85, 4.35], J3 = [4.45, 4.95], T_HIT = 4.62, T_LAND = 4.99, T_RES = 5.05;
const T_FLIP = 5.41, T_ROOM = 5.91, LVLW = 448;
const T_DROP = 6.0, T_BLAND = 6.35, T_HP = 6.4, T_FIRE = 6.75, T_POW = 6.95, T_DASH = 7.0, J5 = [7.4, 7.72], J6 = [7.72, 8.1], T_BOOM = 7.95, T_GONE = 8.3;
const T_POLE = 8.3, T_RUN2 = 8.35, T_TOUCH = 8.82, T_CLEAR = 8.9, T_WKND = 9.1, T_TALLY = [9.1, 9.45], T_FADE = 9.5;
const jumpY = (s, y0, y1, h) => y0 + (y1 - y0) * s - h * 4 * s * (1 - s);
const xHit = 24 + VRUN * (T_HIT - L0);
function heroLevelX(t) {

function heroLevelY(t) {

// flying emails in the office: [x at time tRef, tRef, speed, top y]
const LMAIL = [[325, 4.1, 110, 190], [409, 4.7, 110, 192], [xHit + 6, T_HIT, 130, 150]];

// coffee cups (world x, y top); collection time = hero centre passes cup centre
const CUPS = [[100, 197], [182, 134], [420, 197]];

const BMAIL = [0, 1, 2, 3, 4].map(i => ({ te: T_FIRE + 0.05 * i, y: [182, 170, 192, 176, 186][i] }));
const heroDashX = t => 8 + 180 * (t - T_DASH);

// ── scenery ──

}

function drawOffice(camX, oy, t) {

function heroPose(t) {

  const f = R(t * 30), pw = t >= T_POW && t < J5[1] + 0.1 ? 1 + f % 3 : 0;
  if (t < T_ROOM) return [run, 0];
  if (t < T_DASH) return ['stand', pw];
  if (t < J5[0]) return [run, pw];
  if (t < J6[1]) return ['jump', pw];

function heroRoomXY(t) {

    } else if (t < T_ROOM) {

      BMAIL.forEach(m => { const u = t - m.tb; if (u >= 0 && u < 0.2) spr(PUFF[F(u / 0.05)], 170 - 150 * (m.tb - m.te) - 1, m.y - 3 + oy); });
