<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── synthwave · "NIGHT DRIVE" title sequence ─────────────────────────────────────────────────────────
// CRT powers on → fast drive over an endless neon grid toward a banded sun, palms whipping past, wireframe
// mountains, "MIDNIGHT ARCADE PRESENTS" → twin laser lines open from the horizon onto the title view →
// the chrome, extruded "NIGHT DRIVE" logo slams in (flash, shake, grid pulse), star glints, a light sweep,
// the cyan neon script "The Long Way Home" writes itself on → the script flickers out, the logo rises, the sun
// sets behind the horizon, "ALL NEW · FRIDAYS 11 PM" types on over a laser underline → CRT powers off.
// Post chain: bloom (threshold-ish blurred copies), RGB split, scanlines, VHS grain + tracking glitch, vignette.
// Every frame depends only on t (seeded RNG).
const W = 1920, H = 1080, DUR = 10, TAU = Math.PI * 2;
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const sc = mk(W, H), ctx = sc.getContext('2d', { willReadFrequently: true });
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const spring = (u, f = 2, z = 0.4) => { if (u <= 0) return 0; const w = TAU * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u)); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, u) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], u))).join(',')})`; };
const FT = '"Exo 2"', FS = '"Mr Dafoe"', FO = 'Orbitron';

// ── timeline ──
const T = { on: 0.0, onEnd: 0.5, pres: 0.8, presOut: 2.2, wipe: 2.52, wipeEnd: 2.98, slam: 3.0, glint: 3.42, sweep: 3.78,
  sub: 4.55, subEnd: 5.55, glint2: 6.1, outro: 7.0, rise: 7.15, sunset: 7.0, tag: 7.75, tagEnd: 8.45, glint3: 8.7,
  off: 9.3, offEnd: 9.78 };
const BEAT = 0.6, M0 = 0.6;            // music: 100 bpm, bar 1 starts at 0.6 s → the slam (3.0 s) lands on bar 2 downbeat

// camera / world per phase. A = drive, B = title view (after the laser wipe)
function camA(t) { return { HY: 560, F: 520, h: 1, z: 7.2 * t + 0.6 * t * t, x: 0.12 * Math.sin(t * 1.3), sunR: lerp(235, 285, eInOut(seg(t, 0, 2.8))), sunLift: 140, mtn: 0.8, dusk: 0 }; }
function camB(t) {
  const u = t - T.wipe;
  const v = Math.max(0, t - T.outro);
  const z = 60 + 3.4 * u - 0.9 * v * v * 0.5;          // eases down in the outro
  const set = eInOut(seg(t, T.sunset, 9.25));
  return { HY: 690, F: 390, h: 1, z, x: 0, sunR: 330, sunLift: lerp(175, -350, set), mtn: 1.0, dusk: set, pw: 1.9 };
}

// ── precomputed assets ──
const R0 = rng(1984);
const STARS = Array.from({ length: 420 }, () => ({ x: R0() * W, y: Math.pow(R0(), 1.4) * 700, s: R0() < .08 ? 2.4 + R0() * 1.6 : 0.7 + R0() * 1.3, a: .35 + R0() * .65, w: 1 + R0() * 4, p: R0() * TAU }));
function ridge(seed, n, amp, base) {
  const r = rng(seed); const pts = [];
  for (let i = 0; i <= n; i++) {
    const x = -120 + (W + 240) * i / n, d = Math.abs(x - W / 2) / (W / 2);
    const env = Math.pow(clamp(d * 1.25 - .18), 1.1);
    pts.push([x, (base + amp * env * (0.45 + 0.55 * r())) * (i % 2 ? 1 : 0.72 + r() * .2)]);
  }
  return pts;
}
const MTN_FAR = ridge(7, 36, 210, 12), MTN_NEAR = ridge(21, 22, 260, 0);
const PALMS = (() => { const r = rng(77), a = []; let z = 3.2;
  for (let i = 0; i < 70; i++) { a.push({ z, x: (i % 2 ? 1 : -1) * (2.3 + r() * .7), s: 2.3 + r() * .7, f: r() < .5 ? 1 : -1, v: (r() * 3) | 0 }); z += 1.6 + r() * 1.4; }
  return a; })();
let PALM = [], TITLE, TMASK, TGEO, SCRIPT, SCRIPTW, SCAN, VIG, NOISE = [];

function buildPalms() {
  // three silhouette variants: curved segmented trunk + drooping fronds with leaflets
  for (let v = 0; v < 3; v++) {
    const c = mk(700, 1100), g = c.getContext('2d'), r = rng(300 + v);
    const bx = 350, by = 1090, lean = [60, -40, 110][v], top = [150, 190, 130][v];
    const tx = bx + lean, ty = top;
    const P = u => { const cx = bx + lean * 0.2, cy = 600; const a = (1 - u) * (1 - u), b = 2 * u * (1 - u), d = u * u; return [a * bx + b * cx + d * tx, a * by + b * cy + d * ty]; };
    g.fillStyle = '#07010f';
    for (let i = 0; i < 40; i++) { const u = i / 40, [x, y] = P(u), w = lerp(26, 13, u); g.beginPath(); g.ellipse(x, y, w, 16, 0, 0, TAU); g.fill(); }
    const fr = 9;
    for (let k = 0; k < fr; k++) {
      // solid drooping blade: spine curve, tapered width, serrated lower edge
      const side = k < fr / 2 ? -1 : 1, ang = -Math.PI / 2 + (k / (fr - 1) - .5) * 3.3 + (r() - .5) * .2, len = 250 + r() * 80;
      const sp = []; for (let i = 0; i <= 24; i++) { const u = i / 24, a = ang + side * u * u * 0.75 * (Math.abs(Math.cos(ang)) + .25); sp.push([tx + Math.cos(a) * len * u, ty + Math.sin(a) * len * u + u * u * 55 * Math.abs(Math.cos(ang))]); }
      const up = [], dn = [];
      for (let i = 0; i <= 24; i++) {
        const [x0, y0] = sp[i], [x1, y1] = sp[Math.min(24, i + 1)], [xa, ya] = sp[Math.max(0, i - 1)], dx = x1 - xa, dy = y1 - ya, dl = Math.hypot(dx, dy) || 1, nx = -dy / dl, ny = dx / dl;
        const u = i / 24, wv = 34 * Math.pow(Math.sin(Math.PI * Math.min(1, u * 1.08)), .8) + 2, saw = i % 2 ? 1 : .45;
        up.push([x0 + nx * wv * .45, y0 + ny * wv * .45]); dn.push([x0 - nx * wv * saw, y0 - ny * wv * saw + (i % 2 ? 10 * u : 0)]);
      }
      g.beginPath(); up.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); for (let i = dn.length - 1; i >= 0; i--) g.lineTo(dn[i][0], dn[i][1]); g.closePath(); g.fill();
    }
    g.beginPath(); g.arc(tx, ty + 8, 20, 0, TAU); g.fill();
    PALM.push(c);
  }
}

function buildTitle() {
  const fs = 238, font = `italic 900 ${fs}px ${FT}`, text = 'NIGHT DRIVE';
  const m0 = mk(10, 10).getContext('2d'); m0.font = font; m0.letterSpacing = '6px';
  const mt = m0.measureText(text), tw = mt.width, asc = mt.actualBoundingBoxAscent, pad = 110, depth = 30;
  const c = mk(Math.ceil(tw + pad * 2 + depth), Math.ceil(asc + pad * 2 + depth)), g = c.getContext('2d');
  g.font = font; g.letterSpacing = '6px'; g.textBaseline = 'alphabetic';
  const x0 = pad, y0 = pad + asc;
  // dark silhouette edge behind the extrusion
  g.lineJoin = 'round'; g.strokeStyle = '#0a0118'; g.lineWidth = 16;
  g.strokeText(text, x0 + depth * .55, y0 + depth);
  g.strokeText(text, x0, y0);
  for (let i = depth; i >= 1; i--) { g.fillStyle = mix('#ff3fcf', '#1b0436', Math.pow(i / depth, .7)); g.fillText(text, x0 + i * .55, y0 + i); }
  // chrome face: sky-blue top, white horizon line, dark band, sunset bottom
  const gr = g.createLinearGradient(0, y0 - asc, 0, y0);
  [[0, '#16236b'], [.16, '#2f68d6'], [.38, '#98d8ff'], [.485, '#ffffff'], [.5, '#fbf0ff'], [.512, '#16041f'], [.58, '#380c40'], [.74, '#a82a72'], [.9, '#ff94b8'], [1, '#ffe8ef']].forEach(([o, col]) => gr.addColorStop(o, col));
  g.fillStyle = '#ffffff'; g.fillText(text, x0 - 2.5, y0 - 2.5);                 // bright bevel rim (top-left)
  g.fillStyle = '#ff7ad9'; g.fillText(text, x0 + 2, y0 + 2);                     // pink rim (bottom-right)
  g.fillStyle = gr; g.fillText(text, x0, y0);
  TITLE = c;
  const mc = mk(c.width, c.height), mg = mc.getContext('2d'); mg.font = font; mg.letterSpacing = '6px'; mg.fillStyle = '#fff'; mg.fillText(text, x0, y0); TMASK = mc;
  // glint anchors (sprite coords): top-left of N, right end of the T bar, bottom right of E, top of V
  const w = s => m0.measureText(s).width;
  TGEO = { w: c.width, h: c.height, x0, y0, asc, glints: [
    [x0 + asc * .2 + 4, y0 - asc + 4], [x0 + w('NIGHT') + asc * .2 - 10, y0 - asc + 6], [x0 + w('NIGHT DRIVE') - 12, y0 - 4], [x0 + w('NIGHT DRI') + asc * .12, y0 - asc * .55]] };
}

function buildScript() {
  const fs = 148, font = `${fs}px ${FS}`, text = 'The Long Way Home';
  const m = mk(10, 10).getContext('2d'); m.font = font; const tw = m.measureText(text).width;
  const pad = 90, c = mk(Math.ceil(tw + pad * 2), fs * 1.5 + pad * 2), g = c.getContext('2d');
  g.font = font; g.textBaseline = 'middle'; const y = c.height / 2;
  g.shadowColor = 'rgba(8,0,24,.95)'; g.shadowBlur = 26; g.shadowOffsetY = 6; g.strokeStyle = 'rgba(8,0,24,.9)'; g.lineWidth = 14; g.lineJoin = 'round'; g.strokeText(text, pad, y); g.shadowOffsetY = 0;
  g.shadowColor = '#00d9ff'; g.shadowBlur = 26; g.fillStyle = '#18c8f0'; g.fillText(text, pad, y);
  g.shadowBlur = 8; g.fillStyle = '#7ff3ff'; g.fillText(text, pad, y);
  g.shadowBlur = 0; g.lineWidth = 1.5; g.strokeStyle = '#f2ffff'; g.fillStyle = '#e9ffff'; g.fillText(text, pad, y);
  SCRIPT = c; SCRIPTW = [pad, pad + tw];
}

function buildPost() {
  SCAN = mk(W, H); const s = SCAN.getContext('2d');
  for (let y = 0; y < H; y += 3) { s.fillStyle = 'rgba(0,0,0,.26)'; s.fillRect(0, y + 2, W, 1); }
  VIG = mk(W, H); const v = VIG.getContext('2d'); const vg = v.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.02);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.72)'); v.fillStyle = vg; v.fillRect(0, 0, W, H);
  for (let k = 0; k < 4; k++) {
    const n = mk(480, 270), g = n.getContext('2d'), id = g.createImageData(480, 270), r = rng(900 + k);
    for (let i = 0; i < id.data.length; i += 4) { const q = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = q; id.data[i + 3] = 255; }
    g.putImageData(id, 0, 0); NOISE.push(n);
  }
}
const BL1 = mk(480, 270), bl1 = BL1.getContext('2d'), BL2 = mk(240, 135), bl2 = BL2.getContext('2d');
const SW = mk(10, 10), swc = SW.getContext('2d');

// ── world ──
function drawSky(P, t) {
  const HY = P.HY, d = P.dusk;
  const g = ctx.createLinearGradient(0, 0, 0, HY);
  g.addColorStop(0, mix('#08011c', '#030010', d)); g.addColorStop(.45, mix('#1f0746', '#0b0228', d));
  g.addColorStop(.78, mix('#5a1370', '#2a0a4f', d)); g.addColorStop(.95, mix('#c2307f', '#6a1a6e', d)); g.addColorStop(1, mix('#ff6f91', '#c93f86', d));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HY + 2);
  for (const s of STARS) {
    if (s.y > HY - 30) continue;
    const fade = clamp((HY - 60 - s.y) / 260) * (0.55 + 0.45 * d);
    const a = s.a * fade * (0.6 + 0.4 * Math.sin(t * s.w + s.p));
    if (a <= 0.02) continue;
    ctx.fillStyle = `rgba(255,236,255,${a})`;
    ctx.fillRect(s.x - s.s / 2, s.y - s.s / 2, s.s, s.s);
    if (s.s > 2.4) { ctx.fillStyle = `rgba(190,230,255,${a * .5})`; ctx.fillRect(s.x - s.s * 2.2, s.y - .5, s.s * 4.4, 1); ctx.fillRect(s.x - .5, s.y - s.s * 2.2, 1, s.s * 4.4); }
  }
}
function drawSun(P, t) {
  const R = P.sunR, cx = W / 2, cy = P.HY - P.sunLift, d = P.dusk;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, P.HY); ctx.clip();
  const gl = ctx.createRadialGradient(cx, cy, R * .6, cx, cy, R * 2.3);
  gl.addColorStop(0, `rgba(255,70,150,${.55 * (1 - d * .5)})`); gl.addColorStop(.4, `rgba(255,40,140,${.16 * (1 - d * .4)})`); gl.addColorStop(1, 'rgba(255,40,140,0)');
  ctx.fillStyle = gl; ctx.fillRect(cx - R * 2.4, cy - R * 2.4, R * 4.8, R * 4.8);
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  const g = ctx.createLinearGradient(0, cy - R, 0, Math.min(cy + R, P.HY));
  g.addColorStop(0, '#fff3a0'); g.addColorStop(.25, '#ffd24a'); g.addColorStop(.5, '#ff9038'); g.addColorStop(.75, '#ff3f73'); g.addColorStop(1, '#e0147f');
  ctx.fillStyle = g; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  // horizontal slices: gaps scroll downward and thicken toward the bottom
  const sky = ctx.createLinearGradient(0, cy - R, 0, cy + R);
  sky.addColorStop(0, mix('#2a0a52', '#140434', d)); sky.addColorStop(1, mix('#a82a7c', '#4a1260', d));
  ctx.fillStyle = sky;
  const ph = (t * 0.55) % 1;
  for (let i = 0; i < 9; i++) {
    const top = cy - R * .22, span = Math.min(cy + R, P.HY) - top; const u = (i + ph) / 9; const y = top + u * span, hgt = 2.5 + u * u * span * .1;
    ctx.fillRect(cx - R, y, 2 * R, hgt);
  }
  ctx.restore(); ctx.restore();
}
function drawMountains(P) {
  const HY = P.HY, s = P.mtn;
  for (const [pts, fill, line, lw, sy] of [[MTN_FAR, '#1a0638', 'rgba(170,80,255,.55)', 1.2, .8], [MTN_NEAR, '#0d0322', 'rgba(60,235,255,.85)', 1.8, 1]]) {
    const Y = p => HY - p[1] * s * sy;
    ctx.beginPath(); ctx.moveTo(pts[0][0], HY + 2); pts.forEach(p => ctx.lineTo(p[0], Y(p))); ctx.lineTo(pts[pts.length - 1][0], HY + 2); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = lw * .55; ctx.beginPath();
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0] = pts[i], [x1] = pts[i + 1], y0 = Y(pts[i]), y1 = Y(pts[i + 1]);
      if (HY - y0 < 4 && HY - y1 < 4) continue;
      const mx = (x0 + x1) / 2, my = lerp((y0 + y1) / 2, HY, .45);
      ctx.moveTo(x0, y0); ctx.lineTo(mx, my); ctx.lineTo(x1, y1); ctx.moveTo(mx, my); ctx.lineTo(mx, HY); ctx.moveTo(x0, y0); ctx.lineTo(x0, HY);
      ctx.moveTo(lerp(x0, mx, .5), lerp(y0, my, .5)); ctx.lineTo(lerp(mx, x1, .5), lerp(my, y1, .5));
    }
    ctx.stroke();
    ctx.lineWidth = lw; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], Y(p)) : ctx.moveTo(p[0], Y(p))); ctx.stroke();
  }
}
function drawGround(P, t, pulse) {
  const HY = P.HY, F = P.F, hc = P.h, d = P.dusk;
  const g = ctx.createLinearGradient(0, HY, 0, H);
  g.addColorStop(0, mix('#3a0b52', '#1c0536', d)); g.addColorStop(.25, '#12032a'); g.addColorStop(1, '#070113');
  ctx.fillStyle = g; ctx.fillRect(0, HY, W, H - HY);
  const S = 0.45, zN = 0.28, zF = 46, px = z => F / z;
  const col = (a) => `rgba(255,${Math.round(lerp(56, 90, d))},${Math.round(lerp(214, 255, d))},${a})`;
  const bright = 1 - d * .35;
  // horizontal lines (scroll toward camera)
  const off = P.z % S;
  for (let k = 1; k < zF / S; k++) {
    const z = k * S - off; if (z < zN) continue;
    const y = HY + hc * px(z); if (y > H + 4) continue;
    const fog = Math.pow(clamp(1 - z / zF), 3.2);
    const pl = pulse ? pulse(y) : 0;
    const a = (fog * .95 + pl) * bright, lw = clamp(5.5 / z, .6, 5);
    ctx.strokeStyle = col(a * .25); ctx.lineWidth = lw * 4; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.strokeStyle = col(Math.min(1, a)); ctx.lineWidth = lw; ctx.stroke();
  }
  // converging lines, split into z-bands so they fade toward the horizon
  const bands = [[zN, 1.2, 1], [1.2, 3, .9], [3, 7, .65], [7, 15, .38], [15, 30, .16]];
  for (let k = -44; k <= 44; k++) {
    const wx = k * S - P.x;
    for (const [za, zb, a] of bands) {
      const x0 = W / 2 + wx * px(za), x1 = W / 2 + wx * px(zb), y0 = HY + hc * px(za), y1 = HY + hc * px(zb);
      if ((x0 < -400 && x1 < -400) || (x0 > W + 400 && x1 > W + 400)) continue;
      const lw = clamp(5.5 / za, .6, 5);
      ctx.strokeStyle = col(a * .22 * bright); ctx.lineWidth = lw * 3.5; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      ctx.strokeStyle = col(a * bright); ctx.lineWidth = lw; ctx.stroke();
    }
  }
  // horizon: hot haze + a thin bright line
  const hz = ctx.createLinearGradient(0, HY - 36, 0, HY + 80);
  hz.addColorStop(0, 'rgba(255,90,170,0)'); hz.addColorStop(.3, `rgba(255,110,180,${.42 * (1 - d * .5)})`); hz.addColorStop(.32, `rgba(255,150,200,${.45 * (1 - d * .4)})`); hz.addColorStop(1, 'rgba(120,20,120,0)');
  ctx.fillStyle = hz; ctx.fillRect(0, HY - 36, W, 116);
  ctx.fillStyle = `rgba(255,220,240,${.9 - d * .3})`; ctx.fillRect(0, HY - 1, W, 2);
}
function drawPalms(P) {
  const list = [];
  for (const p of PALMS) { const z = p.z - P.z; if (z > 0.35 && z < 16) list.push([z, p]); }
  list.sort((a, b) => b[0] - a[0]);
  for (const [z, p] of list) {
    const sc_ = P.F / z, x = W / 2 + (p.x * (P.pw || 1) - P.x) * sc_, y = P.HY + P.h * sc_, hh = p.s * sc_, ww = hh * 700 / 1100;
    if (x + ww < -50 || x - ww > W + 50) continue;
    ctx.save(); ctx.globalAlpha = clamp((16 - z) / 5); ctx.translate(x, y); ctx.scale(p.f, 1);
    ctx.drawImage(PALM[p.v], -ww / 2, -hh * 1090 / 1100, ww, hh); ctx.restore();
  }
}
function drawWorld(P, t, pulse) { drawSky(P, t); drawSun(P, t); drawMountains(P); drawGround(P, t, pulse); drawPalms(P); }

// ── text layers ──
function glint(x, y, s, a) {
  if (a <= 0 || s <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y);
  const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 40 * s); rg.addColorStop(0, `rgba(255,255,255,${a})`); rg.addColorStop(.3, `rgba(200,240,255,${a * .35})`); rg.addColorStop(1, 'rgba(200,240,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(-40 * s, -40 * s, 80 * s, 80 * s);
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  for (const [L, w, r] of [[95, 3.2, 0], [55, 2.2, Math.PI / 4]]) {
    ctx.save(); ctx.rotate(r);
    for (let k = 0; k < 2; k++) { ctx.rotate(k * Math.PI / 2); ctx.beginPath(); ctx.moveTo(-L * s, 0); ctx.lineTo(0, -w * s); ctx.lineTo(L * s, 0); ctx.lineTo(0, w * s); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  ctx.restore();
}
function titleState(t) {
  const u = t - T.slam;
  if (u < -0.2) return null;
  let s, a = 1;
  if (u < 0) { s = lerp(2.9, 1, eIn(seg(u, -0.2, 0))); a = seg(u, -0.2, -0.1); }   // falls toward the screen, accelerating
  else s = 1 + 0.07 * Math.exp(-u * 6) * Math.sin(u * 30) * -1;                        // impact squash + ring
  const r = eInOut(seg(t, T.rise, T.rise + 0.85));
  const drift = 1 + 0.035 * eInOut(seg(t, T.slam + .4, T.outro + .2));
  return { s: s * drift * lerp(1, 0.64, r), y: lerp(430, 285, r), u };
}
function drawTitle(t) {

    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.45, 'rgba(255,255,255,.95)'); g.addColorStop(.55, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');

// neon flicker helper: deterministic on/off pattern
const flick = (t, t0, dur, seed) => { const u = t - t0; if (u < 0) return 0; if (u > dur) return 1; const r = rng(seed + Math.floor(u * 30))(); return r < .35 + .6 * u / dur ? 1 : .15; };

  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.07);

function spaced(txt, x, y, font, sp, fill, glow, a, n = txt.length) {

function drawPresents(t) {

}

  const lz = eOut(seg(t, T.tag - .1, T.tag + .35));

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const lw = 760 * lz; const lg = ctx.createLinearGradient(W / 2 - lw / 2, 0, W / 2 + lw / 2, 0);
  lg.addColorStop(0, 'rgba(0,229,255,0)'); lg.addColorStop(.5, 'rgba(180,250,255,1)'); lg.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = lg; ctx.fillRect(W / 2 - lw / 2, y + 42, lw, 3);
  ctx.shadowColor = '#00e5ff'; ctx.shadowBlur = 18; ctx.fillRect(W / 2 - lw / 2, y + 42, lw, 3);

  if (n > 0) { ctx.save(); ctx.font = `700 38px ${FO}`; ctx.letterSpacing = '12px'; const fw = ctx.measureText(txt).width; ctx.restore();
    const bg = ctx.createLinearGradient(W / 2 - fw / 2 - 80, 0, W / 2 + fw / 2 + 80, 0); bg.addColorStop(0, 'rgba(8,0,24,0)'); bg.addColorStop(.2, 'rgba(8,0,24,.45)'); bg.addColorStop(.8, 'rgba(8,0,24,.45)'); bg.addColorStop(1, 'rgba(8,0,24,0)');
    ctx.fillStyle = bg; ctx.fillRect(W / 2 - fw / 2 - 80, y - 34, fw + 160, 68);

}

// ── frame ──
function render(t) {
  const shake = t > T.slam ? Math.exp(-(t - T.slam) * 9) * 16 : 0;
  const sx = shake * Math.sin(t * 91.3), sy = shake * Math.cos(t * 77.7);
  ctx.save(); ctx.translate(sx, sy);

  const A = camA(t);

    const B = camB(t), q = eInOut(seg(t, T.wipe, T.wipeEnd)), top = lerp(B.HY, -20, q), bot = lerp(B.HY, H + 20, q);
    ctx.save(); if (t < T.wipeEnd) { ctx.beginPath(); ctx.rect(0, top, W, bot - top); ctx.clip(); }

      ctx.save(); ctx.globalCompositeOperation = 'lighter';

        ctx.fillStyle = g; ctx.fillRect(0, yy - 30, W, 60); ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, yy - 2, W, 4);
      }
      ctx.restore();
    }
  } else if (t > T.wipe - .3) { // pre-wipe: laser ignites on the horizon
    const a = seg(t, T.wipe - .3, T.wipe);
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const lw = W * eIn(a);
    ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(W / 2 - lw / 2, 690 - 2, lw, 4); ctx.restore();
  }
  // impact: horizontal laser burst through the logo + white flash
  if (t > T.slam && t < T.slam + .5) {
    const u = (t - T.slam) / .5; ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createLinearGradient(0, 430 - 90, 0, 430 + 90); g.addColorStop(0, 'rgba(255,80,220,0)'); g.addColorStop(.5, `rgba(255,200,250,${.8 * (1 - u)})`); g.addColorStop(1, 'rgba(255,80,220,0)');

}
function post(t) {

  bl2.clearRect(0, 0, 240, 135); bl2.filter = 'blur(7px)'; bl2.drawImage(BL1, 0, 0, 240, 135); bl2.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .34; ctx.drawImage(BL1, 0, 0, W, H); ctx.globalAlpha = .42; ctx.drawImage(BL2, 0, 0, W, H); ctx.restore();

window.ready = (async () => {
  await Promise.all([document.fonts.load(`italic 900 100px ${FT}`, 'NIGHT DRIVE'), document.fonts.load(`100px ${FS}`, 'The Long Way Home'),
    document.fonts.load(`500 40px ${FO}`, 'MIDNIGHT ARCADE PRESENTS ALL NEW FRIDAYS 11 PM ·'), document.fonts.load(`700 40px ${FO}`, 'MIDNIGHT ARCADE ALL NEW FRIDAYS 11 PM')]);

})();
window.draw = ({ t }) => { render(t); return out.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const ev = [{ t: 0.05, k: 'crton' }, { t: T.pres, k: 'zap', f: 1 }, { t: T.wipe - .3, k: 'charge' }, { t: T.wipe, k: 'laser' },

    { t: T.sweep, k: 'sweep' }, { t: T.sub, k: 'neon' }, { t: T.glint2, k: 'glint' }, { t: T.glint2 + .22, k: 'glint' },
    { t: T.outro, k: 'flickoff' }, { t: T.rise, k: 'whoosh', d: .8 }, { t: T.tag - .1, k: 'laser2' }, { t: T.glint3 - .35, k: 'sweep' },
    { t: T.glint3, k: 'glint' }, { t: T.glint3 + .18, k: 'glint' }, { t: T.off, k: 'crtoff' }];

  for (let i = 0; i < 90; i++) { const t = T.tag + (T.tagEnd - T.tag) * i / 89, n = Math.round(txt.length * seg(t, T.tag, T.tagEnd)); if (n > prev) { if (txt[n - 1] !== ' ') ev.push({ t, k: 'tick' }); prev = n; } }

  for (const p of PALMS) {
    let pz = null;
    for (let t = 0; t < DUR; t += 1 / 60) {
      const P = t < T.wipe ? camA(t) : camB(t), z = p.z - P.z;

};
window.MUSIC = { BEAT, M0, T };
