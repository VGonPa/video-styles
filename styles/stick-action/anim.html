<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── stick-action · stick-figure action short on plain paper ──────────────────────────────────
// Two original stick figures (orange "near", blue "far") drop onto a hand-drawn ground line, spot a falling star
// and race for it: orange flings a ramp line across the gap and sprints up it, blue draws a high bar in mid-air,
// giant-swings and back-flips onto the ledge. They tug the star until it squirts away, draw swords out of thin air
// and duel (block → impact frame, low sweep / tuck jump, slash / back-flip, charge → big impact, swords shatter).
// The star drifts back down between them; they lift it together and toss it up where it lights a sky of little
// stars, fist-bump, caption, fade to paper.
// Rig: forward-kinematic torso + 2-bone IK limbs; poses are keyframed tracks (tweens + procedural run / jump / swing
// segments) so every frame depends only on t. Smears = limb trails, sword arcs and ghost multiples sampled from the
// same tracks at earlier times; impact frames invert the picture; camera shake decays after hits.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eIn2 = u => u * u;
const eSm = u => u * u * (3 - 2 * u);
const eOutBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const eOutExpo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const FONT = '"Caveat Brush"';
const PAPER = '#f6f2e9', INK = '#1d1b19', GOLD = '#ffc52b', GOLD_D = '#df8f10';
const COL = { O: { c: '#f25a28', d: '#c9441a' }, B: { c: '#2d7fe6', d: '#1e5fb6' } };

// ── world geometry ──
const G0 = 800, LY = 560, EDGE = 1250, LEDGE = 2050;
const RA = [EDGE, G0], RB = [LEDGE, LY];                 // ramp flung by orange
const rampY = x => G0 + (x - EDGE) * (LY - G0) / (LEDGE - EDGE);
const gFlat0 = () => G0, gLedge = () => LY;
const gO = x => x < EDGE ? G0 : x < LEDGE ? rampY(x) : LY;
const T = { rampA: 1.86, rampB: 2.0, barA: 1.82, barB: 1.96, grab: 1.98, rel: 2.30, C1: 4.70, C2: 5.80, bump: 8.28, cap: 8.62, fade: 9.35 };
function groundAt(x, t) {
  if (x <= EDGE + 4) return G0;
  if (x >= LEDGE - 4) return LY;
  if (t >= T.rampB) return rampY(x);
  return null;
}

// ── pose system ──
const KEYS = ['x', 'y', 'lean', 'spin', 'hx', 'hy', 'lhx', 'lhy', 'rhx', 'rhy', 'lfx', 'lfy', 'rfx', 'rfy', 'sw', 'sL'];
const BASE = { x: 0, y: 0, lean: .04, spin: 0, hx: 0, hy: 0, lhx: -10, lhy: 86, rhx: 10, rhy: 86, lfx: -15, lfy: 102, rfx: 15, rfy: 102, sw: -.7, sL: 0, f: 1 };
function norm(o) { const r = {}; for (const k in o) { const v = o[k]; if (Array.isArray(v)) { r[k + 'x'] = v[0]; r[k + 'y'] = v[1]; } else r[k] = v; } return r; }
const full = o => Object.assign({}, BASE, norm(o));
function apply(from, o) { const r = Object.assign({}, from); for (const k in o) { if (k === 'dx') r.x += o.dx; else if (k === 'dy') r.y += o.dy; else r[k] = o[k]; } return r; }
function mix(a, b, u) { const r = {}; for (const k of KEYS) r[k] = a[k] + (b[k] - a[k]) * u; r.f = u < .5 ? a.f : b.f; return r; }
class Track {
  constructor(p) { this.it = [{ t: -1e9, k: 'set', p: full(p) }]; this.cache = []; }
  set(t, p) { this.it.push({ t, k: 'set', p: full(p) }); return this; }
  mod(t, o) { this.it.push({ t, k: 'mod', o: norm(o) }); return this; }
  tw(t, d, o, e = eInOut) { this.it.push({ t, k: 'tw', d, o: typeof o === 'function' ? o : norm(o), e }); return this; }
  fn(t, f, bl = 0) { this.it.push({ t, k: 'fn', f, bl }); return this; }
  start(i) { if (!this.cache[i]) this.cache[i] = this.value(i - 1, this.it[i].t); return this.cache[i]; }
  value(i, t) {
    const it = this.it[i];
    if (it.k === 'set') return it.p;
    const s = this.start(i);
    if (it.k === 'mod') return apply(s, it.o);
    if (it.k === 'tw') { const to = apply(s, typeof it.o === 'function' ? norm(it.o(s)) : it.o); return mix(s, to, it.e(clamp((t - it.t) / it.d))); }
    let v = it.f(t, s); if (it.bl) v = mix(s, v, eSm(clamp((t - it.t) / it.bl))); return v;
  }
  at(t) { let i = 0; while (i + 1 < this.it.length && this.it[i + 1].t <= t) i++; return this.value(i, t); }
}
function shoulderOf(p) { return [p.x + 70 * Math.sin(p.lean) * p.f, p.y - 70 * Math.cos(p.lean)]; }
function reachTo(p, limb, pt) { const S = shoulderOf(p); p[limb + 'x'] = (pt[0] - S[0]) * p.f; p[limb + 'y'] = pt[1] - S[1]; return p; }
function ik(r, t, L1, L2, bend) {
  const dx = t[0] - r[0], dy = t[1] - r[1]; const a = Math.atan2(dy, dx);
  const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1, L1 + L2 - .5);
  const al = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [[r[0] + L1 * Math.cos(a + bend * al), r[1] + L1 * Math.sin(a + bend * al)], [r[0] + d * Math.cos(a), r[1] + d * Math.sin(a)]];
}
const PTS = ['H', 'N', 'S', 'C', 'le', 'lh', 're', 'rh', 'lk', 'lf', 'rk', 'rf', 'tip', 'pom'];
const SWL = 178;
function geom(p) {
  const f = p.f, d = [Math.sin(p.lean) * f, -Math.cos(p.lean)];
  const Hp = [p.x, p.y], N = [p.x + 80 * d[0], p.y + 80 * d[1]], S = [p.x + 70 * d[0], p.y + 70 * d[1]];
  const C = [N[0] + 31 * d[0] + p.hx * f, N[1] + 31 * d[1] + p.hy];
  const [le, lh] = ik(S, [S[0] + p.lhx * f, S[1] + p.lhy], 46, 44, f);
  const [re, rh] = ik(S, [S[0] + p.rhx * f, S[1] + p.rhy], 46, 44, f);
  const [lk, lf] = ik(Hp, [p.x + p.lfx * f, p.y + p.lfy], 54, 54, -f);
  const [rk, rf] = ik(Hp, [p.x + p.rfx * f, p.y + p.rfy], 54, 54, -f);
  let sv = [Math.cos(p.sw) * f, Math.sin(p.sw)];
  const g = { H: Hp, N, S, C, le, lh, re, rh, lk, lf, rk, rf, tip: [rh[0] + sv[0] * SWL * p.sL, rh[1] + sv[1] * SWL * p.sL], pom: [rh[0] - sv[0] * 16, rh[1] - sv[1] * 16], sL: p.sL, f };
  if (p.spin) {
    const a = p.spin * f, ca = Math.cos(a), sa = Math.sin(a), pv = [p.x + 40 * d[0], p.y + 40 * d[1]];
    for (const k of PTS) { const q = g[k], x = q[0] - pv[0], y = q[1] - pv[1]; g[k] = [pv[0] + x * ca - y * sa, pv[1] + x * sa + y * ca]; }
    sv = [sv[0] * ca - sv[1] * sa, sv[0] * sa + sv[1] * ca];
  }
  g.sv = sv; return g;
}
function anchorShift(p, limb, pt) { const g = geom(p); p.x += pt[0] - g[limb][0]; p.y += pt[1] - g[limb][1]; return p; }

// procedural run / walk (forward-local offsets; feet planted on ground function g)
function runPose(x, f, ph, g, lean, o = {}) {
  const amp = o.amp ?? 1, liftK = o.lift ?? 1, hipH = o.hipH ?? 86;
  const s = ph * TAU, slope = -(g(x + 20 * f) - g(x - 20 * f)) / 40;
  const hipY = g(x) - hipH - 4 * Math.abs(Math.cos(s));
  const leg = a => { const fx = 50 * amp * Math.cos(a) + 8 * amp; const lift = 58 * liftK * Math.max(0, -Math.sin(a)); return [fx, g(x + fx * f) - hipY - lift]; };
  const [rfx, rfy] = leg(s), [lfx, lfy] = leg(s + Math.PI);
  return { x, y: hipY, lean: lean + .45 * slope, rfx, rfy, lfx, lfy, rhx: -50 * amp * Math.cos(s) + 14, rhy: 44 + 16 * amp * Math.cos(s), lhx: 50 * amp * Math.cos(s) + 14, lhy: 44 - 16 * amp * Math.cos(s), hx: 2, hy: 0, spin: 0 };
}
function runner(t0, xf, g, o = {}) {
  const stride = o.stride || 300, lean = o.lean ?? .4, ph0 = o.ph0 || 0;
  return (t, s) => { const x = xf(Math.max(0, t - t0)); return Object.assign({}, s, runPose(x, s.f, ph0 + (x - xf(0)) / stride, g, lean, o), o.extra || {}); };
}
function jumper(t0, t1, p0, p1, h, poseF) {
  return (t, s) => {
    const u = clamp((t - t0) / (t1 - t0)), a = p0 || [s.x, s.y];
    const q = poseF ? norm(poseF(u, s)) : {};
    return Object.assign({}, s, q, { x: lerp(a[0], p1[0], u), y: lerp(a[1], p1[1], u) - 4 * h * u * (1 - u) });
  };
}
const mixL = (a, b, u) => { a = norm(a); b = norm(b); const r = {}; for (const k in a) r[k] = lerp(a[k], b[k] ?? a[k], u); return r; };

// ── the star ──
const SR = 40;
function starAt(t) {
  if (t < .45) return null;
  if (t < .8) { const u = seg(t, .45, .72); return { x: 1400, y: 235, s: eOutBack(u), sx: 1, sy: 1, rot: .6 * (1 - eOut(u)) + .05 * Math.sin(t * 9), glow: u }; }
  if (t < 2.9) { const u = (t - .8) / 2.1; return { x: 1400 + 1300 * u + 36 * Math.sin(u * TAU * 1.25) * (1 - u), y: 235 + 291 * Math.pow(u, 1.7), s: 1, sx: 1, sy: 1, rot: .05 * Math.sin(.8 * 9) + u * 4.4, glow: 1 }; }
  const rest = 526;
  if (t < 3.44) {
    const k = t - 2.9; let y = rest, sq = 0;
    if (k < .24) { const u = k / .24; y = rest - 50 * 4 * u * (1 - u); } else if (k < .38) { const u = (k - .24) / .14; y = rest - 13 * 4 * u * (1 - u); }
    sq = .22 * Math.exp(-k / .035) + .1 * Math.exp(-Math.max(0, k - .24) / .03) * (k > .24 ? 1 : 0);
    return { x: 2700, y, s: 1, sx: 1 + sq, sy: 1 - sq, rot: 4.4 + .5 * eOut(clamp(k / .38)), glow: 1 };
  }
  if (t < 3.78) {
    const u = eOut(seg(t, 3.44, 3.54)), pull = seg(t, 3.5, 3.78);
    return { x: 2700 + 7 * Math.sin(t * 64) * pull, y: lerp(rest, 455, u), s: 1, sx: 1 + .38 * eSm(pull), sy: 1 - .17 * eSm(pull), rot: 4.9 + .03 * Math.sin(t * 50) * pull, glow: 1 };
  }
  if (t < 4.35) { const k = t - 3.78; const w = Math.exp(-k / .07) * Math.cos(k * 55);
    return { x: 2700 + 60 * k, y: 455 - 2900 * k + 900 * k * k, s: 1, sx: 1 + .38 * w, sy: 1 - .25 * w, rot: 4.9 + 22 * k, glow: 1 }; }
  if (t < 6.0) return null;
  const hover = u => 2865;
  if (t < 7.2) {
    const u = seg(t, 6.0, 6.8);
    const y = lerp(-300, 380, eOut(u)) + (t > 6.8 ? 7 * Math.sin((t - 6.8) * 5.5) : 0);
    return { x: hover() + 46 * Math.sin(u * TAU) * (1 - u), y, s: 1, sx: 1, sy: 1, rot: 1.6 * (1 - eOut(u)) + .06 * Math.sin(t * 3), glow: 1 };
  }
  const yb = 380 + 7 * Math.sin((7.2 - 6.8) * 5.5);
  if (t < 7.55) { const u = eInOut(seg(t, 7.2, 7.55)); return { x: 2865, y: lerp(yb, 292, u), s: 1 + .06 * u, sx: 1, sy: 1, rot: .06 * Math.sin(t * 3), glow: 1 + .3 * u }; }
  const u = eOut(seg(t, 7.55, 8.05));
  const pulse = 1 + .05 * Math.sin((t - 7.55) * 7);
  return { x: 2865, y: lerp(292, 96, u), s: lerp(1.06, 1.3, u) * pulse, sx: 1, sy: 1, rot: .06 * Math.sin(t * 3) + .5 * u, glow: 1.3 + .7 * u };
}
const starTip = (st, side) => [st.x + side * SR * st.s * st.sx * .9, st.y];

// ── choreography ──
const STANDL = { lean: .04, hx: 0, hy: 0, lh: [-10, 86], rh: [10, 86], lf: [-15, 102], rf: [15, 102] };
const SQUASH = { lean: .32, lh: [-45, 55], rh: [-35, 60], lf: [-20, 74], rf: [24, 74] };
const CROUCH = { lean: .6, lh: [-70, 25], rh: [-60, 35], lf: [-30, 69], rf: [35, 69] };
const LOOKUP = { lean: -.2, hx: 4, hy: -4, lh: [-35, 72], rh: [30, 66] };
const READY = { lean: .14, hx: 0, hy: 0, lh: [-35, 58], rh: [40, 40], lf: [-42, 86], rf: [42, 86], sw: -.7 };
const TUCK = { lh: [40, 20], rh: [50, 10], lf: [30, 50], rf: [45, 40] };
const LUNGE = { rh: [80, -15], sw: -.6, lean: .5, y: 482, lf: [-80, 62], rf: [55, 75] };
const ARMSUP = { lh: [-30, -70], rh: [35, -72] };
const Y0 = G0 - 102, YL = LY - 86;

// sword drawing: the hand sweeps an arc (fn), its trail then straightens into a sword
function swordDraw(t0, t1) {
  return (t, s) => { const u = eInOut(seg(t, t0, t1)); const th = lerp(2.25, -.62, u);
    return Object.assign({}, s, { rhx: 84 * Math.cos(th), rhy: 84 * Math.sin(th), sw: th, sL: 0, lean: .14 + .12 * Math.sin(u * Math.PI) }); };
}
function tugPose(side) { // side -1 = orange (left of star), +1 = blue
  return (t, s) => {
    const st = starAt(t), pull = seg(t, 3.5, 3.78);
    const p = Object.assign({}, s, { x: st.x + side * (92 + 14 * pull), y: 480 + 4 * Math.sin(t * 40) * pull, lean: -.18 - .17 * pull + .03 * Math.sin(t * 64 + side), lfx: 58, lfy: 80, rfx: 84, rfy: 62, hx: 0, hy: 0, spin: 0 });
    const tip = starTip(st, side);
    reachTo(p, 'lh', [tip[0], tip[1] - 9]); reachTo(p, 'rh', [tip[0] - side * 4, tip[1] + 9]); return p;
  };
}
function holdStar(side, both) {
  return (t, s) => {
    const st = starAt(t), p = Object.assign({}, s); if (!st) return p;
    const tip = starTip(st, side); const up = clamp((380 - st.y) / 90);
    p.y = YL - 12 * up; p.lean = .06 - .1 * up;
    reachTo(p, 'rh', [tip[0], tip[1] + 6]);
    if (both) reachTo(p, 'lh', [tip[0] - side * 2, tip[1] - 10]); return p;
  };
}

const O = new Track({ ...STANDL, x: 560, y: -190, lh: [-40, -60], rh: [42, -66], lf: [-4, 80], rf: [22, 72], f: 1 });
O.tw(.08, .22, { y: Y0, lf: [-15, 102], rf: [15, 102] }, eIn2)
 .tw(.30, .07, { ...SQUASH, y: G0 - 74 }, eOut)
 .tw(.37, .22, { ...STANDL, y: Y0 }, eOutBack)
 .tw(.62, .18, LOOKUP, eOutBack)
 .tw(.88, .12, { lean: -.04, hx: 0, hy: 0 })
 .tw(1.0, .15, { ...CROUCH, y: G0 - 69 }, eOut)
 .fn(1.15, runner(1.15, k => 560 + 1400 * k * k / (k + .12), gFlat0, { lean: .42 }), .06)
 .tw(1.632, .2, { x: 1195, y: 745, lean: 1.0, hx: 0, lh: [-45, 45], rh: [-6, 90], lf: [-38, 55], rf: [48, 55] }, eOut)
 .tw(1.84, .1, { x: 1212, y: 694, lean: .12, lh: [-50, 40], rh: [70, -62], lf: [-15, 103], rf: [22, 101] }, eOutBack)
 .fn(1.97, runner(1.97, k => 1212 + 1350 * k * k / (k + .08), gO, { lean: .45, ph0: .25 }), .07)
 .tw(2.95, .25, { x: 2585, y: 474, lean: -.3, hx: 0, lh: [-60, 20], rh: [30, 40], lf: [45, 86], rf: [70, 72] }, eOut)
 .tw(3.2, .12, s => { const p = apply(s, { x: 2612, y: 500, lean: .7, lf: [-40, 58], rf: [30, 60] }); reachTo(p, 'lh', [2664, 520]); reachTo(p, 'rh', [2667, 534]); return p; }, eOut)
 .fn(3.34, (t, s) => { const st = starAt(t); const p = Object.assign({}, s); const tip = starTip(st, -1); reachTo(p, 'lh', [tip[0], tip[1] - 8]); reachTo(p, 'rh', [tip[0] + 3, tip[1] + 8]); return p; })
 .fn(3.46, tugPose(-1), .06)
 .tw(3.78, .2, { dx: -72, y: 470, lean: -.55, lh: [-20, -80], rh: [15, -84], lf: [60, 82], rf: [22, 96] }, eOut)
 .tw(3.98, .16, { ...READY, x: 2540, y: YL }, eOutBack)
 .fn(4.1, swordDraw(4.1, 4.3))
 .mod(4.42, { sL: 1 })
 .tw(4.5, .12, { rh: [-58, -62], sw: -2.35, lean: -.14, y: 464, lf: [-30, 96], rf: [45, 90] }, eOut)
 .tw(4.62, .08, { x: 2650, rh: [80, -10], sw: .38, lean: .45, y: 490, lf: [-80, 68], rf: [60, 70] }, eIn)
 .tw(4.72, .18, { ...READY, x: 2580, y: YL, sw: -.9 }, eOut)
 .tw(4.9, .06, { y: 502, lean: .3, lf: [-32, 58], rf: [36, 58], rh: [30, 30] }, eOut)
 .fn(4.96, jumper(4.96, 5.22, [2580, 502], [2600, 500], 205, u => mixL({ lf: [-32, 58], rf: [36, 58], lh: [-40, 20], rh: [30, 10], lean: .3, sw: -.9 },
      { lf: [20, 48], rf: [40, 40], lh: [-50, -30], rh: [35, -40], lean: .2, sw: -1.3 }, Math.sin(Math.PI * u))))
 .tw(5.22, .06, { y: 504, lf: [-38, 56], rf: [40, 56], lean: .3 }, eOut)
 .tw(5.26, .06, { rh: [-58, 8], sw: 3.1, lean: -.1, y: 494 })
 .tw(5.32, .1, { x: 2690, rh: [86, -18], sw: -.2, lean: .5, y: 486, lf: [-78, 70], rf: [55, 74] }, eIn)
 .tw(5.44, .18, { ...READY, x: 2520, y: YL, sw: -.6 }, eOut)
 .tw(5.66, .14, { x: 2700, ...LUNGE }, eIn)
 .tw(5.8, .3, { x: 2600, y: 516, lean: .85, lh: [-8, 90], rh: [30, 55], lf: [-66, 44], rf: [40, 44], sL: 0 }, eOut)
 .tw(6.28, .24, { y: YL - 2, lean: -.2, hx: 4, hy: -4, lh: [-32, 74], rh: [26, 70], lf: [-30, 94], rf: [25, 96] }, eOutBack)
 .tw(6.6, .14, { lean: .03, hx: 0, hy: 0 })
 .fn(6.8, runner(6.8, k => lerp(2600, 2782, eInOut(clamp(k / .34))), gLedge, { lean: .08, amp: .55, lift: .45, hipH: 94, stride: 170, extra: { sL: 0 } }), .05)
 .fn(7.12, holdStar(-1, false), .1)
 .fn(7.24, holdStar(-1, true), .1)
 .tw(7.55, .16, { ...ARMSUP, lean: -.12, y: YL - 12 }, eOut)
 .tw(7.95, .2, { lh: [-20, 78], rh: [20, 72], lean: .05, y: LY - 101, hx: 0, lf: [-16, 100], rf: [16, 100] })
 .tw(8.15, .13, { rh: [74, -6], lean: .12 }, eOutBack)
 .tw(8.36, .16, { rh: [40, 40] }, eOut)
 .tw(8.52, .3, { lean: -.14, hx: 3, hy: -4, rh: [18, 72], lh: [-18, 76] })
 .fn(8.82, (t, s) => apply(s, { y: s.y + 2.5 * Math.sin((t - 8.82) * 4) }));

// blue: running jump off the edge, right hand drawing the high bar on the way up, then grabbing it
const barJump = jumper(1.80, 1.98, null, [1366, 660], 60, u => ({ lean: .1, lh: [lerp(14, -4, u), lerp(44, -88, u)], lf: [lerp(-20, -18, u), lerp(96, 100, u)], rf: [lerp(40, -10, u), lerp(70, 98, u)] }));
function barDrawJump(t, s) {
  const q = barJump(t, s);

function drawFrags(t) {

// sky stars that burst out of the tossed star

// ── caption ──
const CAP = 'SHARE THE SPARK';
