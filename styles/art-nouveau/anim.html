<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#efe4cc}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── art-nouveau · "Lys d'Or — Eau de Parfum, Maison Aubelle, Paris 1900" ─────────────────────────────
// Close on the halo: a mosaic halo lays itself tile by tile, the arched frame draws symmetrically, whiplash
// vines grow and curl, a lily stem rises and the lily blooms (petals open with overshoot, stamens pop).
// The camera pulls back: the lily lifts and shrinks into the glass stopper of a perfume bottle that is
// revealed beneath it, side panels and borders assemble, lily stalks grow and bloom, peacock feathers fan
// out behind the arch, the ring of lettering appears along the arch, the title flows in letter by letter.
// A gleam passes over the gold, petals drift, and the poster fades to cream paper.
// Every frame depends only on t (seeded RNG); textures are precomputed once.
const W = 1920, H = 1080, TAU = Math.PI * 2, PI = Math.PI;
const out = document.getElementById('c'), g = out.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eSine = u => 0.5 - 0.5 * Math.cos(PI * u);
const back = (u, s = 1.7) => { if (u <= 0) return 0; if (u >= 1) return 1; const c3 = s + 1; return 1 + c3 * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const spring = (u, f = 1.6, z = 0.45) => { if (u <= 0) return 0; const w = TAU * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u)); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FT = '"Cinzel Decorative"', FI = 'Italiana', FF = 'Federo';

// palette: cream paper, sage, dusty rose, gold, sepia line
const PAPER = '#efe4cc', CREAM = '#f7eedb', SEPIA = '#4a3a2a', SEPIA2 = '#6b5440';
const SAGE = '#9fae8f', SAGE_D = '#6f8466', SAGE_L = '#c3ccb0', ROSE = '#d9aba0', ROSE_D = '#b8847a', ROSE_L = '#ecd0c6';
const GOLD_C = '#c9a45c', GOLD_D = '#9a7838', TEAL = '#5f8583', TEAL_D = '#3f5c60';

// ── timeline (s) ──
const T = {
  fadeIn: [0, .55], disc: [.1, .9], tiles: [.3, 1.9], arch: [.3, 2.2], dots: [1.3, 2.3],
  stem: [.55, 1.5], bloom: [1.45, 2.9], stamen: [2.25, 3.0], vinesA: [.7, 3.2],
  pull: [3.25, 5.0], stemFade: [3.4, 4.2], morph: [3.5, 4.8], bottle: [3.9, 5.0], liquid: [4.5, 5.6],
  sideBorder: [3.7, 5.0], outer: [4.0, 5.3], stalks: [4.2, 5.5], stalkBloom: [5.1, 6.4], feathers: [4.8, 6.3],
  arcText: [5.3, 6.3], plaque: [5.5, 6.1], title: [5.8, 6.9], sub: [6.6, 7.3],
  gleam: [7.7, 8.7], fade: [9.2, 10.0],
};

// ── layout (poster space) ──
const CX = 960, HALO_Y = 440, R_ARCH = 380, AX0 = 580, AX1 = 1340, BOT = 1010;
const SP = [{ x0: 70, x1: 545 }, { x0: 1375, x1: 1850 }], SP_Y0 = 70, SP_Y1 = 1010;

let GOLDPAT, GRAIN, VIG, TILES = [], VINES = [], FEATH = [], PETALS = [], ARC = [], TITLE_LAY = [], SUB_W = 0;

// ── textures ──
function goldTex() {
  const c = mk(512, 512), x = c.getContext('2d'), r = rng(11);
  // seamless (periodic) sheen so the pattern tiles without seams
  const id = x.createImageData(512, 512), d = id.data, lo = [141, 106, 46], hi = [240, 218, 160];
  for (let y = 0; y < 512; y++) for (let xx = 0; xx < 512; xx++) { const v = .5 + .5 * Math.sin(TAU * (xx + y) / 512 * 2) * Math.cos(TAU * (xx - y) / 512), k = Math.pow(v, 1.4), o = (y * 512 + xx) * 4;
    for (let c = 0; c < 3; c++) d[o + c] = lo[c] + (hi[c] - lo[c]) * k; d[o + 3] = 255; }
  x.putImageData(id, 0, 0);
  for (let i = 0; i < 900; i++) { x.fillStyle = r() < .5 ? `rgba(255,240,200,${.05 + r() * .07})` : `rgba(80,55,20,${.04 + r() * .06})`; x.fillRect(r() * 512, r() * 512, 1 + r() * 2, 1 + r() * 2); }
  return g.createPattern(c, 'repeat');
}
function grainTex() {
  const c = mk(W, H), x = c.getContext('2d'), r = rng(5);
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  // lithograph mottling: soft blotches
  for (let i = 0; i < 260; i++) {
    const px = r() * W, py = r() * H, rad = 40 + r() * 180, a = .025 + r() * .04;
    const rg = x.createRadialGradient(px, py, 0, px, py, rad);
    rg.addColorStop(0, `rgba(150,120,85,${a})`); rg.addColorStop(1, 'rgba(150,120,85,0)');
    x.fillStyle = rg; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
  }
  const id = x.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 26 + (r() < .004 ? -60 : 0); d[i] += n; d[i + 1] += n; d[i + 2] += n * .9; }
  x.putImageData(id, 0, 0);
  // fibres
  for (let i = 0; i < 1400; i++) { x.strokeStyle = `rgba(120,95,60,${.04 + r() * .05})`; x.lineWidth = .7; const px = r() * W, py = r() * H, a = r() * TAU, l = 6 + r() * 18;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .5 + r() * 4, py + Math.sin(a) * l * .5 + r() * 4, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  return c;
}
function vigTex() {
  const c = mk(W, H), x = c.getContext('2d');
  const rg = x.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1150);
  rg.addColorStop(0, 'rgba(70,45,25,0)'); rg.addColorStop(1, 'rgba(70,45,25,.30)');
  x.fillStyle = rg; x.fillRect(0, 0, W, H); return c;
}

// ── polyline helpers ──
function bez(p0, p1, p2, p3, n, arr) { for (let i = arr.length ? 1 : 0; i <= n; i++) { const u = i / n, v = 1 - u;
  arr.push([v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]); } return arr; }
function withLen(pts) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, len: L[L.length - 1] }; }
function curl(pts, dir, r0, turns) { // append a tightening spiral from the end tangent
  const n = pts.length, a = pts[n - 2], b = pts[n - 1]; let h = Math.atan2(b[1] - a[1], b[0] - a[0]), x = b[0], y = b[1];
  const steps = Math.round(turns * 64); for (let i = 1; i <= steps; i++) { const u = i / steps, r = r0 * (1 - .78 * u), dt = TAU * turns / steps; h += dir * dt; x += Math.cos(h) * r * dt; y += Math.sin(h) * r * dt; pts.push([x, y]); }
  return pts;
}
function partial(P, f) { // points up to fraction f of length
  const target = P.len * f, res = []; for (let i = 0; i < P.pts.length; i++) { if (P.L[i] <= target) res.push(P.pts[i]); else { const a = P.pts[i - 1], b = P.pts[i], u = (target - P.L[i - 1]) / (P.L[i] - P.L[i - 1] || 1); res.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); break; } }
  return res;
}
function strokePart(P, f, w, col, outline) {
  if (f <= 0) return; const pts = partial(P, f); if (pts.length < 2) return;
  const run = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
  g.lineCap = 'round'; g.lineJoin = 'round';
  if (outline) { run(); g.strokeStyle = SEPIA; g.lineWidth = w + outline; g.stroke(); }
  run(); g.strokeStyle = col; g.lineWidth = w; g.stroke();
}
function pointAt(P, f) { const pts = partial(P, clamp(f, .0005, 1)); const b = pts[pts.length - 1], a = pts[Math.max(0, pts.length - 2)]; return { x: b[0], y: b[1], a: Math.atan2(b[1] - a[1], b[0] - a[0]) }; }
// tapered ribbon with a pointed growing tip
function ribbon(P, f, w0, w1, fill) {
  if (f <= 0) return; const pts = partial(P, f), n = pts.length; if (n < 2) return;
  const Ls = [0]; for (let i = 1; i < n; i++) Ls.push(Ls[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const tot = Ls[n - 1], Lf = [], Rt = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const u = Ls[i] / P.len, tip = clamp((tot - Ls[i]) / 40), w = lerp(w0, w1, u) * (.25 + .75 * tip) * .5;
    Lf.push([pts[i][0] - Math.sin(ang) * w, pts[i][1] + Math.cos(ang) * w]); Rt.push([pts[i][0] + Math.sin(ang) * w, pts[i][1] - Math.cos(ang) * w]);
  }
  const path = () => { g.beginPath(); g.moveTo(Lf[0][0], Lf[0][1]); for (const p of Lf) g.lineTo(p[0], p[1]); for (let i = n - 1; i >= 0; i--) g.lineTo(Rt[i][0], Rt[i][1]); g.closePath(); };
  path(); g.lineJoin = 'round'; g.strokeStyle = SEPIA; g.lineWidth = 3; g.stroke(); g.fillStyle = fill; g.fill();
}
function leaf(x, y, a, len, s, col) {
  if (s <= 0) return; g.save(); g.translate(x, y); g.rotate(a); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(len * .3, -len * .32, len * .75, -len * .22, len, 0); g.bezierCurveTo(len * .7, len * .2, len * .3, len * .26, 0, 0);
  const lg = g.createLinearGradient(0, 0, len, 0); lg.addColorStop(0, SAGE_D); lg.addColorStop(1, col);
  g.fillStyle = lg; g.fill(); g.strokeStyle = SEPIA; g.lineWidth = 2.4 / s; g.stroke();
  g.beginPath(); g.moveTo(len * .08, 0); g.quadraticCurveTo(len * .5, -len * .05, len * .9, 0); g.strokeStyle = 'rgba(74,58,42,.55)'; g.lineWidth = 1.3 / s; g.stroke();
  g.restore();
}

// ── lily (front view, 6 tepals) ── open: 0 = closed bud, 1 = open
const LILY_OPEN = [-60, -120, 0, 180, 60, 120].map(d => d * PI / 180);
const SPOTS = (() => { const r = rng(21), a = []; for (let i = 0; i < 6; i++) { const s = []; for (let k = 0; k < 9; k++) s.push([.14 + r() * .3, (r() - .5) * .5, 1.2 + r() * 2]); a.push(s); } return a; })();
function petal(len, wid, k, alpha) {
  g.beginPath(); g.moveTo(0, 0);
  g.bezierCurveTo(len * .22, -wid, len * .68, -wid * .95, len, wid * .08);
  g.bezierCurveTo(len * .72, wid * .55, len * .28, wid * .95, 0, 0);
  const lg = g.createLinearGradient(0, 0, len, 0); lg.addColorStop(0, ROSE_D); lg.addColorStop(.32, ROSE_L); lg.addColorStop(.7, CREAM); lg.addColorStop(1, '#fbf5e8');
  g.fillStyle = lg; g.fill(); g.strokeStyle = SEPIA; g.lineWidth = 2.6; g.stroke();
  g.beginPath(); g.moveTo(len * .05, 0); g.quadraticCurveTo(len * .55, -wid * .08, len * .93, wid * .06); g.strokeStyle = 'rgba(184,132,122,.8)'; g.lineWidth = 1.6; g.stroke();
  for (const [u, v, r] of SPOTS[k]) { g.beginPath(); g.arc(len * u, wid * v, r, 0, TAU); g.fillStyle = 'rgba(150,80,75,.6)'; g.fill(); }
}
function lily(x, y, s, open, stam, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  const o = open, L = 150 * (.72 + .28 * clamp(o)), Wd = 44 * (.42 + .58 * clamp(o));
  const order = [1, 0, 3, 2, 5, 4]; // back tepals first (upper pair behind)
  const drawSet = idx => { for (const i of idx) { const bud = -PI / 2 + (i % 2 ? -1 : 1) * (.05 + .03 * (i >> 1)); const a = lerp(bud, LILY_OPEN[i] + (i === 3 ? 0 : 0), o);
    g.save(); g.rotate(a); petal(L * (i >= 4 ? .95 : 1), Wd, i); g.restore(); } };
  // inner layer (upper and lower) then outer side tepals on top
  drawSet([3, 0, 1]); drawSet([2, 4, 5]);
  // stamens
  if (stam > 0) for (let i = 0; i < 6; i++) {
    const a = -PI / 2 + (i - 2.5) * .42, l = 95 * back(seg(stam, i * .06, .6 + i * .06), 2.2);
    if (l <= 0) continue; const ex = Math.cos(a) * l, ey = Math.sin(a) * l * .9 - l * .12;
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(ex * .4, ey * .6 - 10, ex, ey); g.strokeStyle = '#8c9a6c'; g.lineWidth = 2.6; g.stroke();
    g.save(); g.translate(ex, ey); g.rotate(a + PI / 2); g.beginPath(); g.ellipse(0, 0, 4.2, 10, 0, 0, TAU); g.fillStyle = '#a0522d'; g.fill(); g.strokeStyle = SEPIA; g.lineWidth = 1.5; g.stroke(); g.restore();
  }
  // throat
  const rg = g.createRadialGradient(0, 0, 0, 0, 0, 26); rg.addColorStop(0, 'rgba(160,170,100,.9)'); rg.addColorStop(1, 'rgba(160,170,100,0)');
  g.fillStyle = rg; g.globalAlpha = clamp(o * 1.5); g.beginPath(); g.arc(0, 0, 26, 0, TAU); g.fill(); g.globalAlpha = 1;
  g.restore();
}

// ── peacock feather ──
function feather(px, py, ang, len, s) {
  if (s <= 0) return; g.save(); g.translate(px, py); g.rotate(ang); g.scale(s, s);
  const bend = 18;
  // barbs
  for (let i = 0; i < 44; i++) { const u = .12 + i / 44 * .74, x = u * len, y = Math.sin(u * PI) * bend, bl = 16 + 30 * Math.sin(u * PI * .95);
    for (const sd of [-1, 1]) { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + bl * .5, y + sd * bl * .6, x + bl * .95, y + sd * bl * .85); g.strokeStyle = i % 3 ? 'rgba(111,132,102,.75)' : 'rgba(95,133,131,.8)'; g.lineWidth = 1.6; g.stroke(); } }
  // shaft
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(len * .5, bend * 2, len * .94, 0); g.strokeStyle = SEPIA2; g.lineWidth = 3; g.stroke();
  // eye
  const ex = len * .92, ey = 0;
  const ring = (rx, ry, col) => { g.beginPath(); g.ellipse(ex, ey, rx, ry, 0, 0, TAU); g.fillStyle = col; g.fill(); g.strokeStyle = SEPIA; g.lineWidth = 2; g.stroke(); };
  ring(44, 31, SAGE_L); ring(35, 24, GOLD_C); ring(25, 18, TEAL); ring(15, 11, '#c79a55'); ring(8, 6.5, TEAL_D);
  g.restore();
}

// ── mosaic halo ──
function buildTiles() {
  const r = rng(77), rings = [[230, 252, 44], [255, 276, 52], [279, 300, 60]];
  const pal = [[GOLD_C, ROSE, CREAM, SAGE], [SAGE, GOLD_C, SAGE_L, TEAL], [ROSE, GOLD_C, ROSE_L, CREAM]];
  rings.forEach(([r0, r1, n], ri) => { for (let i = 0; i < n; i++) {
    const a0 = i / n * TAU, a1 = (i + 1) / n * TAU, am = (a0 + a1) / 2;
    const fromBottom = Math.abs(((am - PI / 2 + PI) % TAU + TAU) % TAU - PI) / PI; // 0 at bottom, 1 at top
    const col = ri === 0 ? (i % 4 === 0 ? ROSE : GOLD_C) : ri === 1 ? (i % 2 ? SAGE : TEAL) : (i % 5 === 0 ? GOLD_C : i % 2 ? ROSE : CREAM);
    TILES.push({ ri, r0, r1, a0: a0 + .012, a1: a1 - .012, am, col, j: (r() - .5) * .16, d: fromBottom * .75 + ri * .1 + r() * .06 });
  } });
}
function drawHalo(t) {
  const disc = eOut(seg(t, ...T.disc));
  if (disc > 0) {
    g.save(); g.globalAlpha = disc;
    const rg = g.createRadialGradient(CX, HALO_Y, 10, CX, HALO_Y, 228); rg.addColorStop(0, '#fbf4e2'); rg.addColorStop(.7, '#f1e2bd'); rg.addColorStop(1, '#e2c98e');
    g.beginPath(); g.arc(CX, HALO_Y, 228 * lerp(.6, 1, disc), 0, TAU); g.fillStyle = rg; g.fill();
    // fine concentric rings and rays
    g.strokeStyle = 'rgba(154,120,56,.35)'; g.lineWidth = 1.2;
    for (const rr of [90, 200]) { g.beginPath(); g.arc(CX, HALO_Y, rr * disc, 0, TAU); g.stroke(); }
    for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; g.beginPath(); g.moveTo(CX + Math.cos(a) * 60, HALO_Y + Math.sin(a) * 60); g.lineTo(CX + Math.cos(a) * 224 * disc, HALO_Y + Math.sin(a) * 224 * disc); g.stroke(); }
    g.restore();
  }
  const tp = seg(t, ...T.tiles);
  const drift = Math.pow(seg(t, 1.9, 10), 1.3) * .16;
  for (const q of TILES) { const k = back(seg(tp, q.d, q.d + .22), 2.0); if (k <= 0) continue;
    const rm = (q.r0 + q.r1) / 2, hw = (q.r1 - q.r0) / 2 * k, ha = (q.a1 - q.a0) / 2 * k, am = q.am + (q.ri === 1 ? -drift : drift);
    g.beginPath(); g.arc(CX, HALO_Y, rm + hw, am - ha, am + ha); g.arc(CX, HALO_Y, rm - hw, am + ha, am - ha, true); g.closePath();
    g.fillStyle = q.col === GOLD_C ? GOLDPAT : q.col; g.fill(); g.fillStyle = q.j > 0 ? `rgba(255,250,235,${q.j})` : `rgba(60,40,20,${-q.j})`; g.fill(); g.strokeStyle = 'rgba(74,58,42,.7)'; g.lineWidth = 1.3; g.stroke(); }
  // outline rings
  const ol = eOut(seg(t, .5, 1.6));
  if (ol > 0) { g.lineWidth = 3.5; g.strokeStyle = SEPIA;
    for (const rr of [228, 302]) { g.beginPath(); g.arc(CX, HALO_Y, rr, PI / 2 - PI * ol, PI / 2 + PI * ol); g.stroke(); } }

  const dp = seg(t, ...T.dots);
  for (let i = 0; i < 48; i++) { const a = PI / 2 + (i % 2 ? 1 : -1) * Math.ceil(i / 2) / 48 * TAU; const k = back(seg(dp, i / 48 * .7, i / 48 * .7 + .3));
    if (k <= 0) continue; g.beginPath(); g.arc(CX + Math.cos(a) * 318, HALO_Y + Math.sin(a) * 318, 5.5 * k, 0, TAU); g.fillStyle = GOLDPAT; g.fill(); g.strokeStyle = SEPIA; g.lineWidth = 1.5; g.stroke(); }
}

// ── frames ──
function archHalf(sd, inset) { // bottom centre → side → arc to apex
  const x = CX + sd * (R_ARCH - inset), pts = [[CX, BOT - inset], [x, BOT - inset], [x, HALO_Y]];
  for (let i = 1; i <= 60; i++) { const a = sd > 0 ? -i / 60 * PI / 2 : PI + i / 60 * PI / 2; pts.push([CX + Math.cos(a) * (R_ARCH - inset), HALO_Y + Math.sin(a) * (R_ARCH - inset)]); }
  return withLen(pts);
}
let ARCH = [];
function archPath(inset) { g.beginPath(); const r = R_ARCH - inset; g.moveTo(CX - r, BOT - inset); g.lineTo(CX - r, HALO_Y); g.arc(CX, HALO_Y, r, PI, 0); g.lineTo(CX + r, BOT - inset); g.closePath(); }
function rrect(x0, y0, x1, y1, r) { g.beginPath(); g.moveTo(x0 + r, y0); g.arcTo(x1, y0, x1, y1, r); g.arcTo(x1, y1, x0, y1, r); g.arcTo(x0, y1, x0, y0, r); g.arcTo(x0, y0, x1, y0, r); g.closePath(); }
function rrectHalves(x0, y0, x1, y1, r) { // two halves from bottom centre up to top centre
  const cx = (x0 + x1) / 2, mk2 = sd => { const xs = sd > 0 ? x1 : x0, pts = [[cx, y1], [xs - sd * r, y1]];
    for (let i = 1; i <= 12; i++) { const a = sd > 0 ? PI / 2 - i / 12 * PI / 2 : PI / 2 + i / 12 * PI / 2; pts.push([xs - sd * r + Math.cos(a) * r, y1 - r + Math.sin(a) * r]); }
    pts.push([xs, y0 + r]); for (let i = 1; i <= 12; i++) { const a = sd > 0 ? -i / 12 * PI / 2 : PI + i / 12 * PI / 2; pts.push([xs - sd * r + Math.cos(a) * r, y0 + r + Math.sin(a) * r]); }
    pts.push([cx, y0]); return withLen(pts); };
  return [mk2(-1), mk2(1)];
}
let SIDEB = [], OUTERB = [];

// ── vines (whiplash, with curl terminals) ──
function buildVines() {

    { p: [[112, 1000], [120, 860], [470, 860], [440, 700], [410, 540], [120, 560], [150, 400], [175, 260], [400, 300], [420, 200]], dir: -1, r0: 42, turns: 1.3, w: [15, 5], leaves: [.2, .36, .52, .66], t: [4.0, 5.8] },
    { p: [[503, 1000], [495, 860], [145, 860], [175, 700], [205, 540], [495, 560], [465, 400], [440, 260], [215, 300], [195, 200]], dir: 1, r0: 42, turns: 1.3, w: [15, 5], leaves: [.24, .4, .56, .7], t: T.vinesA },
  ];
  for (const sd of [-1, 1]) for (const d of defs) {
    const P = d.p.map(([x, y]) => sd < 0 ? [x, y] : [W - x, y]);
    const pts = []; for (let k = 0; k + 3 < P.length; k += 3) bez(P[k], P[k + 1], P[k + 2], P[k + 3], 40, pts); curl(pts, sd < 0 ? d.dir : -d.dir, d.r0, d.turns);

      leaf(p.x, p.y, p.a + side * 1.0, 62 - i * 5, k, SAGE_L); });

}

// ── lily stalks in side panels ──
let STALKS = [];
function buildStalks() {
  for (const sd of [-1, 1]) { const x = sd < 0 ? 310 : W - 310, pts = []; bez([x, 1000], [x - sd * 10, 800], [x + sd * 30, 500], [x + sd * 8, 250], 60, pts); STALKS.push({ P: withLen(pts), sd }); }
}
function drawStalks(t) {

// ── bottle ──
function bottlePath() {
  g.beginPath(); g.moveTo(CX - 26, 368); g.lineTo(CX - 26, 402);

  g.beginPath(); g.ellipse(CX, 548, 38, 48, 0, 0, TAU); g.strokeStyle = 'rgba(154,120,56,.8)'; g.lineWidth = 1.2; g.stroke();

// ── lettering ──

    for (const c of TITLE_LAY) { const k = seg(p, c.d, c.d + .45); if (k <= 0) continue; const y = 912 + (1 - eOut(k)) * 26, s = lerp(.7, 1, back(k, 2.2));

// ── drifting petals (screen space) ──
function buildPetals() { const r = rng(1900); for (let i = 0; i < 34; i++) PETALS.push({ t0: 2.4 + r() * 6.4, x: r() * W * 1.1 - 100, y: -60 - r() * 200, vx: 50 + r() * 60, vy: 70 + r() * 50, sw: 30 + r() * 40, f: .6 + r() * .8, ph: r() * TAU, s: .9 + r() * .7, rose: r() < .75 }); }

}

// ── camera ──
function camera(t) {
  const u = eInOut(seg(t, ...T.pull)), push = eSine(seg(t, T.pull[1], 10));
  const z = lerp(1.45, 1.0, u) * (1 + .03 * push) * (1 + .035 * eSine(seg(t, 0, T.pull[0] + .4)) * (1 - u)), cy = lerp(452, 540, u) - 6 * push;
  return { z, cx: CX, cy };
}

function render(t) {
  const cam = camera(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  g.setTransform(cam.z, 0, 0, cam.z, W / 2 - cam.cx * cam.z, H / 2 - cam.cy * cam.z);

    for (const f of FEATH.filter(f => f.sp === s).sort((a, b) => Math.abs(b.o) - Math.abs(a.o))) { const k = back(seg(fp, f.d, f.d + .5), 1.4); if (k <= 0) continue; feather(f.x, f.y, lerp(-PI / 2, f.a, k), f.len * lerp(.6, 1, clamp(k)), clamp(k * 1.4)); }
    g.restore(); }

  // arch panel
  archPath(0); const ag = g.createLinearGradient(0, 60, 0, BOT); ag.addColorStop(0, '#b7c2a2'); ag.addColorStop(1, '#93a384'); g.fillStyle = ag; g.fill();
  g.save(); archPath(0); g.clip(); g.strokeStyle = 'rgba(111,132,102,.22)'; g.lineWidth = 2; for (let x = AX0 + 10; x < AX1; x += 20) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, BOT); g.stroke(); } g.restore();

  const ob = eInOut(seg(t, ...T.outer)); for (const P of OUTERB) strokePart(P, ob, 3, GOLD_D, 0);
  for (const [sx, sy, t0] of [[CX + 74, 470, 8.05], [CX - 190, 850, 8.35], [CX + 330, 410, 8.6]]) { const k = seg(t, t0, t0 + .55); if (k <= 0 || k >= 1) continue;
    const a = Math.sin(PI * k), r = 34 * a; g.save(); g.translate(sx, sy); g.rotate(k * .8); g.fillStyle = `rgba(255,250,230,${.95 * a})`;
    g.beginPath(); for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * .16 : r, an = i / 8 * TAU; g.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } g.closePath(); g.fill(); g.restore(); }

    lg.addColorStop(0, 'rgba(255,245,215,0)'); lg.addColorStop(.5, 'rgba(255,245,215,.34)'); lg.addColorStop(1, 'rgba(255,245,215,0)');
    g.globalCompositeOperation = 'screen'; g.fillStyle = lg; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over'; }

window.ready = (async () => {
  await Promise.all([document.fonts.load(`700 112px ${FT}`, "Lys d'Or L"), document.fonts.load(`30px ${FI}`, SUB), document.fonts.load(`30px ${FF}`, ARC_TXT)]);
  await document.fonts.ready;

  buildTiles(); buildVines(); buildStalks(); buildPetals();

  SIDEB = SP.flatMap(s => rrectHalves(s.x0 + 14, SP_Y0 + 14, s.x1 - 14, SP_Y1 - 14, 20).concat(rrectHalves(s.x0, SP_Y0, s.x1, SP_Y1, 28)));
  OUTERB = rrectHalves(34, 34, W - 34, H - 34, 14);
  const sp = []; bez([CX, 790], [CX + 6, 690], [CX - 10, 560], [CX, 452], 50, sp); STEM = withLen(sp);
  for (const s of SP) for (let i = 0; i < 7; i++) { const o = i - 3; FEATH.push({ x: (s.x0 + s.x1) / 2, y: SP_Y1 + 20, a: -PI / 2 + o * .29, len: 340 - Math.abs(o) * 20, d: Math.abs(o) * .14, o, sp: s }); }
  // title layout (centred, proportional)
  g.font = `700 112px ${FT}`; const ws = [...TITLE].map(ch => g.measureText(ch).width), tot = ws.reduce((a, b) => a + b, 0); let x = CX - tot / 2;
  const n = TITLE.length; TITLE_LAY = [...TITLE].map((ch, i) => { const o = { ch, x, w: ws[i], d: Math.abs(i - (n - 1) / 2) / ((n - 1) / 2) * .5 }; x += ws[i]; return o; }).filter(c => c.ch !== ' ');
  g.font = `30px ${FF}`; const R = 342, cw = [...ARC_TXT].map(ch => g.measureText(ch).width + 5), ct = cw.reduce((a, b) => a + b, 0); let acc = 0;
  ARC = [...ARC_TXT].map((ch, i) => { const off = (acc + cw[i] / 2 - ct / 2) / R; acc += cw[i]; return { ch, a: -PI / 2 + off, d: Math.abs(off) / (ct / 2 / R) * .6 }; }).filter(c => c.ch !== ' ');
})();
window.draw = ({ t }) => { render(t); return out.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const ev = [];
  // tiles: glassy ticks sweeping up both sides
  for (let i = 0; i < 14; i++) ev.push({ t: T.tiles[0] + (T.tiles[1] - T.tiles[0]) * i / 14 * .9, k: 'tick', v: .5 + .5 * (i / 14) });
  ev.push({ t: .15, k: 'swell', d: 1.2 }, { t: T.arch[0], k: 'harp', n: 8, d: 1.4 }, { t: T.stem[0], k: 'grow', d: 1.0 },
    { t: T.bloom[0], k: 'bloom' }, { t: T.stamen[0], k: 'pluck', f: 0 }, { t: T.stamen[0] + .15, k: 'pluck', f: 1 },
    { t: T.pull[0], k: 'whoosh', d: 1.7 }, { t: T.bottle[0] + .2, k: 'glass' }, { t: T.liquid[0], k: 'pour', d: 1.1 },
    { t: T.stalkBloom[0], k: 'bloom2' }, { t: T.arcText[0], k: 'harp', n: 10, d: .9 }, { t: T.title[0], k: 'reveal' }, { t: T.sub[0], k: 'chime' },
    { t: T.gleam[0] + .3, k: 'gleam' }, { t: T.fade[0] - .1, k: 'final' });
  for (let i = 0; i < 5; i++) ev.push({ t: T.feathers[0] + i * .1 * (T.feathers[1] - T.feathers[0]) + .1, k: 'fwip' });
  return ev.sort((a, b) => a.t - b.t);
};
window.T = T;
