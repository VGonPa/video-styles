const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const MW = 2400, MH = 1350, BS = 2;               // map world size and backing-store scale

// ── procedural coastlines (star-shaped radial functions → any point with frac<1 is on land) ──
function radial(seed, K, amp, rough) {
  const r = rng(seed), hs = [];
  for (let k = 1; k <= K; k++) hs.push([k, Math.pow(k, -rough) * (0.35 + r()), r() * TAU]);
  const raw = (th, km) => { let v = 0; for (const [k, a, p] of hs) { if (k > km) break; v += a * Math.sin(k * th + p); } return v; };
  let m = 0; for (let i = 0; i < 720; i++) m = Math.max(m, Math.abs(raw(i / 720 * TAU, K)));
  const sc = amp / m;
  return (th, km = K) => 1 + raw(th, km) * sc;
}
function landmass(cx, cy, rx, ry, seed, amp = 0.32, K = 110, rough = 1.12, lobes = []) {
  const fb = radial(seed, 8, amp, 1.0), fd = radial(seed + 100, K, .045, .7);
  const lob = th => { let v = 0; for (const [a, d, w] of lobes) { let e = Math.abs(((th - deg(d)) % TAU + TAU + Math.PI) % TAU - Math.PI); v += a * Math.exp(-(e / w) * (e / w)); } return v; };

  const pt = (th, s = 1, km = K) => { const v = f(th, km) * s; return [cx + Math.cos(th) * rx * v, cy + Math.sin(th) * ry * v]; };
  const path = (s = 1, km = K, add = 0) => { const p = new Path2D(); const n = 1100;
    for (let i = 0; i <= n; i++) { const th = i / n * TAU; const v = Math.max(f(th, km) * s, f(th) + add);
      const x = cx + Math.cos(th) * rx * v, y = cy + Math.sin(th) * ry * v; i ? p.lineTo(x, y) : p.moveTo(x, y); }

// ── textures ──
let BASE, GRAIN = [], VIG, PHOTO, TITLECARD, ENDCARD, PAPERPAT, TL = {};
function noiseCanvas(w, h, seed, lo, hi) {
  const c = mk(w, h), x = c.getContext('2d'), id = x.createImageData(w, h), r = rng(seed);

  x.putImageData(id, 0, 0); return c;
}

  const r = rng(seed);

  x.globalAlpha = .55 * strength; x.drawImage(noiseCanvas(Math.ceil(w / 90), Math.ceil(h / 90), seed + 1, 200, 255), 0, 0, w, h);
  x.globalAlpha = .45 * strength; x.drawImage(noiseCanvas(Math.ceil(w / 14), Math.ceil(h / 14), seed + 2, 215, 255), 0, 0, w, h);
  x.globalAlpha = .5 * strength; x.drawImage(noiseCanvas(Math.ceil(w / 2), Math.ceil(h / 2), seed + 3, 205, 255), 0, 0, w, h);

    x.strokeStyle = r() < .5 ? `rgba(120,95,60,${.05 + r() * .07})` : `rgba(255,252,240,${.08 + r() * .1})`;
    x.lineWidth = .4 + r() * .7; x.beginPath(); x.moveTo(px, py);

  }

}

  for (const [L, a, fr, nm] of [[WEST, 230, .5, 'Dunmere'], [WEST, 300, .72, 'Holt'], [WEST, 25, .42, 'Carrow'], [WEST, 128, .78, 'Ebbin'], [WEST, 262, .85, 'Saltby'],
    [EAST, 240, .55, 'Quell'], [EAST, 140, .62, 'Anzar'], [EAST, 92, .82, 'Brisk'], [EAST, 350, .3, 'Oran'], [EAST, 305, .82, 'Temmet']]) {
    const [px, py] = L.pt(deg(a), fr); x.fillStyle = 'rgba(43,38,32,0.75)'; x.beginPath(); x.arc(px, py, 3.2, 0, TAU); x.fill();

// camera: [t, x, y, zoom]
const CAM = [
