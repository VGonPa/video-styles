<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── pointillism · neo-impressionist riverside afternoon, painted one dot at a time ─────────────────
// A smooth "study" of the scene is painted offscreen, then re-sampled as tens of thousands of pure-pigment
// dabs: each dab picks one of two palette colours whose optical mix matches the study, plus the occasional
// complementary accent (orange in blue water, violet in sunlit grass). The canvas starts close on a woman
// with a parasol over a conté underdrawing; dabs fill outward, the camera pulls out until the dots merge into
// a park by the river, a painted dotted border frames it, the sailboat drifts, the water shimmers (colour
// cycling at 12 fps), the title is dotted in, and at the end the dabs lift off back to the bare sketch.
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const smooth = u => { u = clamp(u); return u * u * (3 - 2 * u); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(a, b) { let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) | 0; h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }

  const a = hash(xi + o, yi), b = hash(xi + 1 + o, yi), c = hash(xi + o, yi + 1), d = hash(xi + 1 + o, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const SHIM = 12;                                   // water colour-cycling rate (steps per second)

// ── pigments: pure colours only, the eye does the mixing ───────────────────────────────────────────
const PAL = ['#FBF7EC', '#F4E3A8', '#F3D23B', '#EE8A2C', '#D9472B', '#E58FA6', '#9A2F5E', '#7B5CB0', '#2E3E9E',
             '#3F78C9', '#7FB3E0', '#BBD6EF', '#2E9A62', '#1D5E4E', '#A3C845', '#C79A45', '#1E1E44', '#8A4A30'];
const COMP = [11, 5, 7, 9, 12, 14, 14, 2, 3, 3, 3, 1, 4, 6, 7, 7, 17, 9];   // complementary accent per pigment
const PRGB = PAL.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));
const NP = PAL.length, WR = 0.9, WG = 1.2, WB = 0.8;
let LUT_I, LUT_J, LUT_A;
function buildLUT() {                              // 32³ colour cube → best two-pigment optical mix
  const pairs = []; for (let i = 0; i < NP; i++) for (let j = i; j < NP; j++) pairs.push([i, j]);
  LUT_I = new Uint8Array(32768); LUT_J = new Uint8Array(32768); LUT_A = new Float32Array(32768);
  for (let q = 0; q < 32768; q++) {
    const T = [((q >> 10) & 31) * 8.2 + 4, ((q >> 5) & 31) * 8.2 + 4, (q & 31) * 8.2 + 4];
    let best = 1e18, bi = 0, bj = 0, ba = 1;
    for (const [i, j] of pairs) {
      const P = PRGB[i], Q = PRGB[j];
      const dr = P[0] - Q[0], dg = P[1] - Q[1], db = P[2] - Q[2];
      const dd = WR * dr * dr + WG * dg * dg + WB * db * db;
      let a = 1;
      if (dd > 0) a = clamp((WR * (T[0] - Q[0]) * dr + WG * (T[1] - Q[1]) * dg + WB * (T[2] - Q[2]) * db) / dd);
      const er = T[0] - Q[0] - a * dr, eg = T[1] - Q[1] - a * dg, eb = T[2] - Q[2] - a * db;
      const err = WR * er * er + WG * eg * eg + WB * eb * eb + 0.1 * a * (1 - a) * dd;
      if (err < best) { best = err; bi = i; bj = j; ba = a; }
    }
    LUT_I[q] = bi; LUT_J[q] = bj; LUT_A[q] = ba;
  }
}
const qix = (r, g, b) => (clamp(r >> 3, 0, 31) << 10) | (clamp(g >> 3, 0, 31) << 5) | clamp(b >> 3, 0, 31);
function pick(q, r1, r2, accent) {               // one dab's pigment
  const i = LUT_I[q], j = LUT_J[q], a = LUT_A[q], dom = a >= .5 ? i : j;
  if (r1 < accent) return COMP[dom];
  return r2 < a ? i : j;
}

// ── scene layout (world = 1920×1080, the painting itself) ──────────────────────────────────────────
const SHORE = [[520, 1090], [700, 905], [900, 742], [1080, 622], [1250, 538], [1450, 506], [1930, 492]];
const HORIZ = 452;
function inGrass(x, y) {                           // right of the shoreline
  for (let k = 0; k < SHORE.length - 1; k++) {
    const [x0, y0] = SHORE[k], [x1, y1] = SHORE[k + 1];
    if (y <= y0 && y >= y1) { const sx = x0 + (x1 - x0) * (y - y0) / (y1 - y0); return x > sx; }
  }
  return y > 1090;
}
const isWater = (x, y) => y > HORIZ + 2 && !inGrass(x, y);

// MODE 'fill' paints the colour study; 'sketch' strokes the same shapes as a conté underdrawing
let MODE = 'fill';
let CONTOUR = null, CW = 3.4;                                // dark rim so profiles and hands read through the dots
function P(g, fn, col, rim) { g.beginPath(); fn(); if (MODE === 'fill') { g.fillStyle = col; g.fill(); if (rim && CONTOUR) { g.strokeStyle = CONTOUR; g.lineWidth = CW; g.lineJoin = 'round'; g.stroke(); } } else g.stroke(); }
function limb(g, pts, w0, w1, col) {             // tapered limb through joints (round caps = elbows/knees)
  if (MODE === 'sketch') { g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.stroke(); return; }
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [c, add] of CONTOUR ? [[CONTOUR, CW * 1.8], [col, 0]] : [[col, 0]]) for (let k = 0; k < pts.length - 1; k++) { g.strokeStyle = c;
    g.lineWidth = lerp(w0, w1, k / Math.max(1, pts.length - 2)) + add;
    g.beginPath(); g.moveTo(...pts[k]); g.lineTo(...pts[k + 1]); g.stroke();
  }
}
// profile head facing left, centre (cx,cy), ~66 px tall
function head(g, cx, cy, o) {
  P(g, () => { g.moveTo(cx + 10, cy - 33); g.bezierCurveTo(cx - 10, cy - 36, cx - 24, cy - 26, cx - 25, cy - 10);
    g.quadraticCurveTo(cx - 26, cy - 4, cx - 34, cy + 5); g.lineTo(cx - 25, cy + 9);
    g.quadraticCurveTo(cx - 28, cy + 13, cx - 26, cy + 16); g.quadraticCurveTo(cx - 28, cy + 20, cx - 24, cy + 24);
    g.quadraticCurveTo(cx - 24, cy + 32, cx - 12, cy + 33); g.quadraticCurveTo(cx + 4, cy + 31, cx + 12, cy + 20);
    g.bezierCurveTo(cx + 28, cy + 14, cx + 32, cy - 14, cx + 24, cy - 26); g.quadraticCurveTo(cx + 19, cy - 33, cx + 10, cy - 33); g.closePath(); }, o.skin, 1);
  if (MODE === 'fill') {
    P(g, () => { g.moveTo(cx + 12, cy + 20); g.bezierCurveTo(cx + 28, cy + 14, cx + 32, cy - 14, cx + 24, cy - 26); g.lineTo(cx + 2, cy - 4); g.closePath(); }, o.skinShade);
    P(g, () => g.ellipse(cx + 6, cy + 2, 6, 9, 0, 0, TAU), o.skinShade);           // ear
    P(g, () => g.ellipse(cx - 16, cy - 7, 3.2, 2.2, 0, 0, TAU), '#2A1E2A');          // eye
  }
}
function woman(g, o) {                            // feet at (0,0), facing left, ~560 px to the hat
  // skirt with bustle
  P(g, () => { g.moveTo(-40, -330); g.bezierCurveTo(-60, -250, -85, -120, -94, -4); g.lineTo(100, -4);
    g.bezierCurveTo(95, -120, 110, -200, 120, -240); g.bezierCurveTo(126, -278, 90, -312, 40, -330); g.closePath(); }, o.dress);
  if (MODE === 'fill') {
    P(g, () => { g.moveTo(-40, -330); g.bezierCurveTo(-60, -250, -85, -120, -94, -4); g.lineTo(-34, -4); g.bezierCurveTo(-30, -120, -22, -250, -12, -330); g.closePath(); }, o.dressLit);
    P(g, () => { g.moveTo(40, -330); g.bezierCurveTo(90, -312, 126, -278, 120, -240); g.bezierCurveTo(110, -200, 95, -120, 100, -4); g.lineTo(60, -4); g.bezierCurveTo(60, -140, 80, -260, 40, -330); g.closePath(); }, o.dressShade);
  }
  P(g, () => g.ellipse(-100, -6, 16, 6, 0, 0, TAU), '#1E1A2A');                       // shoe tip
  // bodice
  P(g, () => { g.moveTo(-30, -325); g.bezierCurveTo(-34, -360, -54, -380, -48, -410); g.bezierCurveTo(-44, -432, -34, -446, -14, -452);
    g.lineTo(18, -452); g.bezierCurveTo(36, -440, 40, -400, 34, -370); g.bezierCurveTo(30, -350, 32, -335, 36, -325); g.closePath(); }, o.bodice);
  if (MODE === 'fill') P(g, () => { g.rect(-31, -334, 68, 12); }, o.sash);            // waist sash
  // neck + head
  P(g, () => { g.moveTo(-12, -448); g.lineTo(-11, -478); g.lineTo(9, -482); g.lineTo(13, -448); g.closePath(); }, o.skinShade, 1);
  head(g, -2, -508, o);
  P(g, () => { g.moveTo(-20, -532); g.bezierCurveTo(-4, -546, 22, -544, 28, -522); g.bezierCurveTo(32, -506, 26, -492, 16, -486);
    g.bezierCurveTo(14, -500, 6, -512, -2, -516); g.bezierCurveTo(-10, -522, -16, -526, -20, -532); g.closePath(); }, o.hair);
  P(g, () => g.ellipse(26, -500, 13, 14, 0, 0, TAU), o.hair);                         // bun
  // boater hat
  P(g, () => g.ellipse(0, -538, 40, 8, -0.08, 0, TAU), o.hat, 1);
  P(g, () => { g.rect(-20, -560, 40, 22); }, o.hat, 1);
  if (MODE === 'fill') P(g, () => { g.rect(-20, -546, 40, 7); }, o.ribbon);
  // arm: shoulder → elbow → hand gripping the parasol
  limb(g, [[6, -436], [-18, -372], [-50, -404]], 24, 18, o.sleeve);
  // parasol shaft, then the fist around it
  if (MODE === 'fill') { g.strokeStyle = '#4A3428'; g.lineWidth = 5; g.lineCap = 'round'; } else g.lineWidth = 2;
  g.beginPath(); g.moveTo(-58, -352); g.lineTo(-46, -640); g.stroke();
  P(g, () => g.ellipse(-55, -406, 11, 13, -0.2, 0, TAU), o.skin, 1);                     // fist
  P(g, () => g.ellipse(-63, -412, 5, 7, -0.5, 0, TAU), o.skinShade);                  // thumb over the shaft
  // parasol canopy (dome, lit top, dark underside)
  P(g, () => { g.moveTo(-182, -592); g.quadraticCurveTo(-150, -700, -46, -712); g.quadraticCurveTo(64, -704, 90, -604);
    g.quadraticCurveTo(-46, -626, -182, -592); g.closePath(); }, o.parasol);
  if (MODE === 'fill') {
    P(g, () => { g.moveTo(-182, -592); g.quadraticCurveTo(-46, -626, 90, -604); g.quadraticCurveTo(-46, -610, -182, -592); g.closePath(); }, o.parasolShade);
    P(g, () => { g.moveTo(-160, -620); g.quadraticCurveTo(-120, -690, -50, -700); g.quadraticCurveTo(-110, -670, -130, -610); g.closePath(); }, o.parasolLit);
    P(g, () => g.ellipse(-46, -716, 4, 7, 0, 0, TAU), '#4A3428');
  }
}

  limb(g, [[14, -300], [18, -150], [14, -14]], 36, 30, o.legBack);
  limb(g, [[-8, -300], [-24, -150], [-30, -14]], 38, 31, o.leg);

  P(g, () => g.ellipse(-48, -8, 28, 9, 0, 0, TAU), '#15131E');

  P(g, () => { g.moveTo(-40, -468); g.bezierCurveTo(-48, -420, -44, -360, -38, -320); g.lineTo(-30, -250); g.lineTo(30, -240);
    g.lineTo(58, -228); g.bezierCurveTo(50, -300, 48, -360, 44, -420); g.bezierCurveTo(40, -452, 26, -472, 6, -476); g.closePath(); }, o.coat);

    g.bezierCurveTo(-26, -340, -30, -420, -24, -470); g.closePath(); }, o.coatLit);

  if (MODE === 'fill') P(g, () => { g.moveTo(-22, -466); g.lineTo(-18, -488); g.lineTo(-4, -480); g.lineTo(-6, -462); g.closePath(); }, '#FBF7EC');   // collar
  head(g, -4, -532, o);
  if (MODE === 'fill') {
    P(g, () => { g.moveTo(-22, -555); g.bezierCurveTo(-4, -566, 20, -562, 24, -548); g.bezierCurveTo(30, -530, 26, -512, 18, -504);
      g.bezierCurveTo(14, -520, 4, -534, -6, -538); g.closePath(); }, o.hair);
    P(g, () => { g.moveTo(-34, -525); g.quadraticCurveTo(-26, -532, -16, -524); g.quadraticCurveTo(-24, -520, -34, -525); g.closePath(); }, o.hair);   // moustache
  }

  P(g, () => g.ellipse(-2, -560, 42, 8, -0.04, 0, TAU), o.hat);
  if (MODE === 'fill') P(g, () => { g.moveTo(-26, -575); g.lineTo(-27, -588); g.lineTo(23, -589); g.lineTo(22, -576); g.closePath(); }, '#3E3C6A');
  // arm to the cane
  limb(g, [[6, -458], [-12, -374], [-36, -322]], 26, 20, o.sleeve);
  if (MODE === 'fill') { g.strokeStyle = '#5A3A28'; g.lineWidth = 6; } else g.lineWidth = 2;
  g.beginPath(); g.moveTo(-40, -322); g.lineTo(-96, -6); g.stroke();
  P(g, () => g.ellipse(-40, -318, 12, 11, 0.3, 0, TAU), o.skin, 1);                     // hand on the knob
  P(g, () => g.ellipse(-48, -314, 5, 7, 0.4, 0, TAU), o.skinShade);
}
const WOMAN = { dress: '#3A3470', dressLit: '#6A5FA8', dressShade: '#24204A', bodice: '#2E2A5C', sleeve: '#5B52A6', sash: '#E0703A',
  skin: '#EDB08A', skinShade: '#C08070', hair: '#4A2E2A', hat: '#F2E2B0', ribbon: '#D9472B',
  parasol: '#E8803A', parasolLit: '#F6C25A', parasolShade: '#9A3A3A' };
const MAN = { leg: '#2E2C4C', legBack: '#232140', coat: '#23223C', coatLit: '#45437A', sleeve: '#3E3C74', skin: '#EBAE88',
  skinShade: '#C08870', hair: '#3A2622', hat: '#1A1928' };
const WALKER = { dress: '#EEE9DC', dressLit: '#FBF7EE', dressShade: '#B9B6D2', bodice: '#F4EFE2', sleeve: '#CFC8E2', sash: '#3F78C9',
  skin: '#F0C29C', skinShade: '#C98F78', hair: '#5A3A2A', hat: '#F2E2B0', ribbon: '#2E3E9E',
  parasol: '#4F7FD0', parasolLit: '#9CC2EA', parasolShade: '#2E3E8E' };

function sailboat(g) {                             // waterline at y=0, bow to the left
  P(g, () => { g.moveTo(4, -246); g.lineTo(6, -34); g.quadraticCurveTo(60, -40, 104, -36); g.quadraticCurveTo(70, -120, 4, -246); g.closePath(); }, '#FBF7EC');
  if (MODE === 'fill') P(g, () => { g.moveTo(6, -200); g.lineTo(6, -34); g.quadraticCurveTo(30, -38, 40, -37); g.quadraticCurveTo(26, -120, 6, -200); g.closePath(); }, '#C8C0E0');
  P(g, () => { g.moveTo(-4, -232); g.lineTo(-6, -36); g.lineTo(-86, -32); g.quadraticCurveTo(-40, -120, -4, -232); g.closePath(); }, '#F2E4C4');
  if (MODE === 'fill') { g.strokeStyle = '#3A2A28'; g.lineWidth = 4; } else g.lineWidth = 2;
  g.beginPath(); g.moveTo(0, -24); g.lineTo(0, -258); g.stroke();
  P(g, () => { g.moveTo(0, -258); g.lineTo(-26, -250); g.lineTo(0, -242); g.closePath(); }, '#D9472B');
  P(g, () => { g.moveTo(-108, -30); g.lineTo(112, -32); g.quadraticCurveTo(100, 2, 80, 6); g.lineTo(-76, 6); g.quadraticCurveTo(-96, -2, -108, -30); g.closePath(); }, '#7A3B34');
  if (MODE === 'fill') P(g, () => { g.moveTo(-104, -30); g.lineTo(110, -32); g.lineTo(106, -24); g.lineTo(-100, -22); g.closePath(); }, '#F4E3A8');
}

function paintBG(g) {

  let gr = g.createLinearGradient(0, 0, 0, HORIZ); gr.addColorStop(0, '#93B8E2'); gr.addColorStop(.55, '#C3D8EC'); gr.addColorStop(1, '#F3E3BC');

  for (const [x, h] of [[70, 120], [104, 100], [930, 110], [962, 130], [996, 96]]) { g.fillStyle = '#4E8070'; g.beginPath(); g.ellipse(x, HORIZ - h / 2 - 10, 15, h / 2, 0, 0, TAU); g.fill();
    g.fillStyle = '#7FAF86'; g.beginPath(); g.ellipse(x - 5, HORIZ - h / 2 - 16, 7, h / 2.6, 0, 0, TAU); g.fill(); }
  for (const [x, w, h] of [[330, 70, 40], [410, 50, 50], [470, 80, 34], [560, 46, 42]]) {
    g.fillStyle = '#EEDDB6'; g.fillRect(x, HORIZ - h, w, h); g.fillStyle = '#B7A6A8'; g.fillRect(x + w * .65, HORIZ - h, w * .35, h);
    g.fillStyle = '#C8673F'; g.beginPath(); g.moveTo(x - 6, HORIZ - h); g.lineTo(x + w / 2, HORIZ - h - 24); g.lineTo(x + w + 6, HORIZ - h); g.fill(); }
  g.fillStyle = '#A7BC7C'; g.fillRect(0, HORIZ - 8, W, 12);

  for (let x = 0; x < 1300; x += 6) { const h = 30 + 50 * vnoise(x / 70, 0, 7); g.fillStyle = 'rgba(70,112,120,.55)'; g.fillRect(x, HORIZ + 4, 6, h * (0.6 + .4 * vnoise(x / 9, 3, 2))); }
  for (let k = 0; k < 40; k++) { const y = 540 + r() * 380, x = r() * 900, w = 40 + r() * 160;     // light on the ripples
    g.fillStyle = `rgba(232,240,246,${.25 + r() * .3})`; g.beginPath(); g.ellipse(x, y, w, 2.5 + r() * 3, 0, 0, TAU); g.fill(); }
  g.save(); g.translate(828, 486); g.scale(.18, .18); sailboat(g); g.restore();     // far sail
  // moored rowboat by the near shore
  g.save(); g.translate(600, 900); g.rotate(-.22);

function sketchBG(g) {                            // conté crayon lay-in: horizon, shore, tree, boat path

// ── dabs ─────────────────────────────────────────────────────────────────────────────────────────
const C0 = [1390, 470];                            // where the first dabs land (the woman's face)

let SCENE_COUNT = 0;

  const tl = mk(W, 420); { const g = tl.getContext('2d'); g.textAlign = 'center'; g.textBaseline = 'alphabetic';

  LAYERS.title = dabify(tl, 3.3, { seed: 17, rad: .66, jit: .22, noise: 8, accent: .16, t0: ttT, te: (x, y, r) => 9.1 + .4 * clamp((x - TB[0]) / (TB[1] - TB[0])) + .1 * r });
})();
const TITLE = 'Afternoon at Willow Bend', TX = 760; let TB = [0, W];

// ── frame ─────────────────────────────────────────────────────────────────────────────────────────
function cam(t) {
  const u = eInOut(clamp((t - 2.0) / 2.9)), z = Math.exp(lerp(Math.log(3.2), 0, u));

  return { z, cx: clamp(lerp(C0[0], 960, u), hw, W - hw), cy: clamp(lerp(C0[1], 540, u), hh, H - hh) };
}
function scl(t, t0, te) {                          // dab pop (overshoot) and lift-off
  if (t < t0) return 0; const u = (t - t0) / .2;

}
// dab sprites: per pigment, NV irregular brush dabs with a faint paint ridge and a sheen streak
const NV = 8, SPR = 64, DR = 24;                   // sprite size, blob radius inside the sprite
let DAB;
function buildDabs() {
  DAB = PAL.map((col, c) => Array.from({ length: NV }, (_, v) => {
    const cv2 = mk(SPR, SPR), g = cv2.getContext('2d'), r = rng(100 + c * 31 + v);
    g.translate(SPR / 2, SPR / 2); g.rotate(v / NV * Math.PI + r() * .3);

    g.beginPath(); for (let k = 0; k <= 28; k++) { const a = k / 28 * TAU, rr = DR * (1 + .1 * (vnoise(Math.cos(a) * 1.6 + ph, Math.sin(a) * 1.6, c + v) - .5) * 2);
      const x = Math.cos(a) * rr * ex, y = Math.sin(a) * rr * ey; k ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.closePath(); g.fillStyle = col; g.fill(); g.save(); g.clip();
    for (let k = 0; k < 5; k++) { const y = (r() - .5) * DR * 1.5; g.strokeStyle = r() < .5 ? 'rgba(255,255,255,.07)' : 'rgba(0,0,0,.06)'; g.lineWidth = 1 + r() * 2;
      g.beginPath(); g.moveTo(-DR * 1.3, y); g.quadraticCurveTo(0, y + (r() - .5) * 6, DR * 1.3, y + (r() - .5) * 4); g.stroke(); }
    const hl = g.createRadialGradient(-DR * .35, -DR * .3, 0, -DR * .35, -DR * .3, DR * .8); hl.addColorStop(0, 'rgba(255,255,255,.2)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hl; g.fillRect(-SPR, -SPR, 2 * SPR, 2 * SPR);
    g.restore(); g.strokeStyle = 'rgba(0,0,0,.14)'; g.lineWidth = 1.6; g.stroke();
    return cv2; }));
}
function drawDots(dots, t, view, tf, wob) {
  const st = Math.floor(t * SHIM + 1e-4);
  for (const d of dots) {
    const s = scl(t, d.t0, d.te); if (s <= 0.02) continue;
    let x = d.x, y = d.y;
    if (tf) { const c = Math.cos(tf.a), sn = Math.sin(tf.a), lx = x - tf.px, ly = y - tf.py; x = tf.x + lx * c - ly * sn; y = tf.y + lx * sn + ly * c; }
    if (wob) x += 5 * Math.sin(d.y * .16 + (st >> 1) * 1.5);
    if (x < view[0] || x > view[2] || y < view[1] || y > view[3]) continue;
    let c = d.c;
    if (d.w) {                                     // water: each dab re-picks its pigment every 6 steps (staggered), glints ride the ripples
      const k = Math.floor((st + (d.id % 6)) / 6);
      const rip = .5 + .5 * Math.sin(x * .012 + y * .1 - k * .9) * Math.sin(x * .004 - y * .02 + k * .35);

    const k = d.r * s * (SPR / 2) / DR;

}
function render(t) {
  const { z, cx, cy } = cam(t);

  ctx.setTransform(z, 0, 0, z, 960 - cx * z, 540 - cy * z);
  ctx.drawImage(ground, 0, 0);
  const sa = .62 * (1 - smooth((t - 1.2) / 3)) + .5 * smooth((t - 8.9) / .8);
  if (sa > .01) { ctx.globalAlpha = sa; ctx.drawImage(sketch, 0, 0); ctx.globalAlpha = 1; }
  const m = 12, view = [cx - 960 / z - m, cy - 540 / z - m, cx + 960 / z + m, cy + 540 / z + m];
  const b = boatPos(t), wk = walkPos(t);
  drawDots(LAYERS.bg, t, view);
  drawDots(LAYERS.refl, t, view, { x: b.x, y: b.y, a: 0, px: BOAT_O[0], py: 0 }, true);
  drawDots(LAYERS.boat, t, view, { x: b.x, y: b.y, a: b.a, px: BOAT_O[0], py: BOAT_O[1] });
  drawDots(LAYERS.walk, t, view, { x: wk.x, y: wk.y, a: 0, px: WALK_O[0], py: WALK_O[1] });
  drawDots(LAYERS.fig, t, view);
  drawDots(LAYERS.border, t, view);

window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// sound cues: dab taps (density per 1/30 s), the pull-out air, title notes, birds, lift-off, closing chord
window.events = () => {
  const ev = [], bins = new Array(320).fill(0);
  for (const k of ['bg', 'fig', 'boat', 'walk', 'border', 'title']) for (const d of LAYERS[k]) { const i = Math.floor(d.t0 * 30); if (i >= 0 && i < 320) bins[i]++; }
