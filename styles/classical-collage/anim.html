// melts into "Stars." through a signed-distance morph (its dot slides off as the terracotta period), a
// planisphere pops small then big and the camera punches into a ringed star; "Bones." comes with a skull in
// side view, "Lines." with a compass-and-square construction of a capital C that fills with ink; six
// cut-outs land on eighth notes, the camera dives into the engraved rhombicuboctahedron, the engraving
// dissolves into a plaster solid that turns and settles beside "Form.", and the word melts into the title
// while the solid shrinks into the lockup mark. Every plate is drawn here from seeded numbers as swelling

const W = 1920, H = 1080, DUR = 10.08;

/* ------------------------------------------------------------ numbers */

/* ------------------------------------------------------------ distance fields */

// A raster in plate units (1 px per unit) with bilinear lookups.

// Depth inside a mask (distance to its outline, 0 outside).

  const P = [[POLY_TARGET.x, POLY_TARGET.y, Math.log(s0)], [1040, 232, Math.log(s0 * 0.38)], [214, 250, Math.log(L.sc * 1.2)], [L.mx, L.my, Math.log(L.sc)]];
  const u = sine(prog(t, TL.fly[0], TL.fly[1])) * 3, i = Math.min(2, Math.floor(u)), f = u - i;
  const at = j => P[Math.max(0, Math.min(3, j))];
  const q = [0, 1, 2].map(c => {
    const a = at(i - 1)[c], b = at(i)[c], d = at(i + 1)[c], e = at(i + 2)[c];
    return 0.5 * (2 * b + (d - a) * f + (2 * a - 5 * b + 4 * d - e) * f * f + (3 * b - a - 3 * d + e) * f * f * f);
  });
  return { x: q[0], y: q[1], sc: Math.exp(q[2]) };
}
// From the dissolve on: the engraving turns to plaster in place, the solid turns and settles beside "Form.", then
// flies into the mark while the word melts into the title.
function actFive(t) {
  const d = smooth(prog(t, TL.dis[0], TL.dis[1])), f = solidFlight(t);
  if (t < TL.m4[0]) { const fa = smooth(prog(t, TL.formIn[0], TL.formIn[1])); if (fa > 0) drawWord(FL, 1, fa, FL.x, FL.y, 0, 12 * (1 - fa)); }
  else if (t < TL.m4[1]) { const e = sine(prog(t, TL.m4[0], TL.m4[1])); morph(FL, CC, e); slideDot(FL, CC, e); }
  else drawWord(CC);
  if (d > 0) drawSolid(poseAt(t), f.x, f.y, f.sc, 1, d);
  if (d < 1) drawPolyPlate(f.x, f.y, f.sc, 1 - d, 1 - d);
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if (t < TL.z1[0]) actOne(t);
  else if (t < TL.back) zoomOne(t);
  else if (t < TL.m3[0]) actTwo(t);
  else if (t < TL.pops) actThree(t);
  else if (t < TL.dis[0]) {
    if (t < TL.z2[1]) actFour(t);
    else drawPolyPlate(POLY_TARGET.x, POLY_TARGET.y, POLY_SC_T());
  }
  else actFive(t);
  const f = smooth(prog(t, TL.fade[0], TL.fade[1]));
  if (f > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(255,255,255,${f})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = function ({ t }) { render(t); const u = cv.toDataURL('image/jpeg', 0.92); return u.slice(u.indexOf(',') + 1); };

window.events = function () {
  const r3 = v => Math.round(v * 1000) / 1000, pan = x => r3(fit((x - W / 2) / (W / 2), -1, 1)), ev = [];
  ev.push({ k: 'bed', t: 0.48, end: 7.68, bpm: 125 });
  ev.push({ k: 'pop', t: TL.qIn, p: 0, v: 1 });
  ev.push({ k: 'glide', t: TL.m1[0], d: r3(TL.m1[1] - TL.m1[0]), m0: 67, m1: 74, p: 0 });
  ev.push({ k: 'snap', t: TL.jump, p: pan(SL.x + 200), v: 0.7 });
  ev.push({ k: 'pop', t: TL.chartIn, p: pan(CHART_SMALL.x), v: 0.9 });
  ev.push({ k: 'snap', t: TL.big, p: pan(CHART_BIG.x), v: 1 });
  ev.push({ k: 'scratch', t: TL.lines, d: r3(CH.links.length * 0.0075 + 0.1), p: pan(CHART_BIG.x), v: 0.8 });
  ev.push({ k: 'brush', t: TL.ring[0], d: r3(TL.ring[1] - TL.ring[0]), p: pan(1170) });
  ev.push({ k: 'whoosh', t: TL.z1[0], d: r3(TL.z1[1] - TL.z1[0]), p: 0.15, up: 1 });
  ev.push({ k: 'pop', t: TL.back, p: pan(SL.x + 250), v: 0.7 }, { k: 'pop', t: TL.back + 0.02, p: pan(SKULL_SMALL.x), v: 0.9 });
  ev.push({ k: 'glide', t: TL.m2[0], d: r3(TL.m2[1] - TL.m2[0]), m0: 74, m1: 69, p: -0.5 });
  ev.push({ k: 'snap', t: TL.big2, p: pan(SKULL_BIG.x), v: 1 });
  ev.push({ k: 'tick', t: TL.aster, p: pan(1150), v: 0.8 });
  ev.push({ k: 'cut', t: 3.84, p: pan(CARD.x), v: 0.9 });
  ev.push({ k: 'glide', t: TL.m3[0], d: r3(TL.m3[1] - TL.m3[0]), m0: 69, m1: 72, p: -0.5 });
  for (const [a, b, kind] of CBUILD) ev.push({ k: 'scratch', t: r3(3.84 + a), d: r3(b - a), p: pan(CARD.x), v: kind === 'line' ? 0.45 : 0.6 });
  for (const [a, x] of CDOTS) ev.push({ k: 'tick', t: r3(3.84 + a), p: pan(CARD.x + x * 0.78), v: 0.5 });
  ev.push({ k: 'fill', t: TL.fill[0], d: r3(TL.fill[1] - TL.fill[0]), p: pan(CARD.x) });
  ev.push({ k: 'whoosh', t: TL.out[0], d: r3(TL.out[1] - TL.out[0]), p: 0.2, up: 0 });
  COLLAGE.forEach((c, i) => ev.push({ k: 'pop', t: r3(TL.pops + i * 0.12), p: pan(c[1]), v: 0.75 + 0.05 * i }));
  ev.push({ k: 'whoosh', t: TL.z2[0], d: r3(TL.z2[1] - TL.z2[0]), p: 0.1, up: 1 });
  ev.push({ k: 'snap', t: TL.z2[1], p: pan(POLY_TARGET.x), v: 0.8 });
  ev.push({ k: 'shimmer', t: TL.dis[0], d: r3(TL.dis[1] - TL.dis[0]), p: pan(POLY_TARGET.x) });
  ev.push({ k: 'turn', t: TL.turn[0], d: r3(TL.turn[1] - TL.turn[0]), p: pan(POLY_TARGET.x) });
  ev.push({ k: 'turn', t: TL.fly[0], d: r3(TL.fly[1] - TL.fly[0]), p: 0 });
  ev.push({ k: 'riser', t: 6.92, d: r3(TL.m4[0] - 6.92) });
  ev.push({ k: 'glide', t: TL.m4[0], d: r3(TL.m4[1] - TL.m4[0]), m0: 72, m1: 79, p: 0 });
  ev.push({ k: 'chord', t: r3(TL.m4[1] - 0.02) });
  ev.push({ k: 'fade', t: TL.fade[0], d: r3(TL.fade[1] - TL.fade[0]) });
  return ev.sort((a, b) => a.t - b.t);
};

window.ready = (async () => {
  await Promise.all([document.fonts.load(fontOf(200)), document.fonts.load(`italic 400 34px ${ITALIC}`)]);
  await document.fonts.ready;
  const dg = glyph('.', 400);
  DOTK = { x: (dg.dot.x - dg.ox) / 400, y: (dg.dot.y - dg.oy) / 400, r: dg.dot.r / 400 };
  // words: centred question mark, centred then left "Stars", the left words, and the title
  const qg = glyph('?', 590);
  Q = at('?', 590, 960 - ((qg.box.x0 + qg.box.x1) / 2 - qg.ox), 540 + 0.355 * 590);
  { const g = glyph('Stars', 377), wd = g.adv + (DOTK.x + DOTK.r) * 377 - (g.box.x0 - g.ox); SC = at('Stars', 377, 960 - wd / 2 - (g.box.x0 - g.ox), 540 + 0.345 * 377); }
  const left = text => { const g = glyph(text, 290); return at(text, 290, 150 - (g.box.x0 - g.ox), 540 + 0.345 * 290); };
  SL = left('Stars'); BL = left('Bones'); LL = left('Lines'); FL = left('Form');
  {
    const fs = 182, g = glyph("Classical Collage", fs), mark = 230, gap = 72;
    const wordW = g.adv + (DOTK.x + DOTK.r) * fs - (g.box.x0 - g.ox), total = mark + gap + wordW, x0 = (W - total) / 2 + 30;
    const base = 540 + 0.345 * fs;
    CC = at('Classical Collage', fs, x0 + mark + gap - (g.box.x0 - g.ox), base);
    CC_LAYOUT = { mx: x0 + mark / 2, my: 540 - 4, sc: mark / 5.6 };
  }
  PL.chart = buildChart(); PL.skull = buildSkull(); PL.skull.small = buildSkull(1.75, 0.66); PL.skull.small.useBelow = 0.66; PL.nautilus = buildNautilus(); PL.doric = buildDoric();
  PL.poly = buildPoly(); CPATH = cPath(); PL.cplate = buildCPlate();
})();
