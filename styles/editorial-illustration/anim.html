<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── editorial-illustration · contemporary op-ed conceptual illustration ─────────────────────
// "The Attention Economy", an invented opinion page from THE MERIDIAN REVIEW. One surreal visual
// metaphor at a time: a slender man balances on a giant smartphone that tips like a seesaw on an
// hourglass fulcrum. Notifications keep landing on the far end; he backs away to keep the balance,
// until the last one catapults him off. Mid-flight the metaphor morphs: the phone thins into the
// beam of a balance scale, the hourglass stretches into its column, the pile of notifications
// fuses into one red dot. He lands in one pan, the dot in the other, and the dot outweighs him.
// He doesn't notice: he's scrolling. Flat shapes, riso grain, a four-ink palette, serif headline.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), MAIN = cv.getContext('2d');
const LAY = document.createElement('canvas'); LAY.width = W; LAY.height = H;
let ctx = LAY.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = u => u * u * (3 - 2 * u);
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const backOut = (u, c = 1.7) => u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── four inks + tints ──
const CREAM = '#f2e8d5', NAVY = '#1f2a44', NAVY_D = '#141c31', TEAL = '#5e8f8a', TEAL_L = '#a9c7bf', TEAL_P = '#c9ddd5';
const CORAL = '#e46f55', CORAL_D = '#b9533f', SKIN = '#eebfa6', SKIN_D = '#d69f86', CARD = '#7ea9a2';
const SERIF = '"DM Serif Display"', TEXT = '"Newsreader"';

// ── timeline ──
const T_SLAM = 4.30, T_LAUNCH = 4.42, M0 = 4.62, M1 = 5.62, T_SEAT = 5.75, T_DOT = 6.02, T_TWO = 8.45;
const PX = 1340, GROUND = 900, PIV_A = 762, PIV_B = 330, HANG = 270, FS = 0.8;

// ── notifications (phone-local: x along the top edge, y above it) ──
const BUBS = [
  { x: 300, y: -34, r: 34, m: 1, tl: 1.00, g: 'heart' },
  { x: 366, y: -30, r: 30, m: 1, tl: 2.35, g: 'bell' },
  { x: 238, y: -28, r: 28, m: 1, tl: 2.70, g: 'chat' },
  { x: 334, y: -88, r: 30, m: 1, tl: 3.25, g: 'plus' },
  { x: 268, y: -82, r: 26, m: 1, tl: 3.70, g: 'heart' },
  { x: 304, y: -162, r: 48, m: 4, tl: T_SLAM, g: 'bell' },
];
// ── his position along the phone (walking backwards, eyes on the pile) ──
function figX(t) {
  let x = 0;
  x = lerp(x, -100, eInOut(seg(t, 1.30, 1.95)));
  x = lerp(x, -300, eInOut(seg(t, 2.80, 3.35)));
  x = lerp(x, -385, eInOut(seg(t, 3.42, 3.82)));
  return x;
}
function torqueA(t) {
  let q = 0; for (const b of BUBS) if (t >= b.tl) q += b.m * b.x;
  if (t < T_LAUNCH) q += 3 * figX(t);
  return q;
}
// seesaw angle: spring toward the torque balance, hard stop when the end hits the ground
const SIM_A = [], SIM_B = [], SDT = 1 / 240;
function buildSims() {
  let th = 0, v = 0; const w = 7.5, z = 0.26;
  for (let i = 0; i <= Math.ceil(M1 / SDT) + 2; i++) {
    const t = i * SDT; SIM_A.push(th);
    for (const b of BUBS) if (b.tl > t - SDT && b.tl <= t) v += b.m * b.x * 0.0032;
    const tgt = 0.34 * Math.tanh(0.00036 * torqueA(t) / 0.34);
    v += (w * w * (tgt - th) - 2 * z * w * v) * SDT; th += v * SDT;
    if (th > 0.345) { th = 0.345; v = -v * 0.28; }
  }
  th = 0; v = 0; const w2 = 5.2, z2 = 0.3;
  for (let i = 0; i <= Math.ceil((DUR - M0) / SDT) + 2; i++) {
    const t = M0 + i * SDT; SIM_B.push(th);
    if (T_SEAT > t - SDT && T_SEAT <= t) v -= 0.9;
    if (T_DOT > t - SDT && T_DOT <= t) v += 2.6;
    if (T_TWO > t - SDT && T_TWO <= t) v += 0.9;
    const tgt = t < T_SEAT ? 0 : t < T_DOT ? -0.1 : t < T_TWO ? 0.3 : 0.4;
    v += (w2 * w2 * (tgt - th) - 2 * z2 * w2 * v) * SDT; th += v * SDT;
  }
}
const simAt = (arr, t0, t) => { const f = (t - t0) / SDT, i = clamp(Math.floor(f), 0, arr.length - 2), u = clamp(f - i); return lerp(arr[i], arr[i + 1], u); };
// the structure: phone → beam, hourglass fulcrum → column
function struct(t) {
  const m = eInOut(seg(t, M0, M1));
  const thA = simAt(SIM_A, 0, Math.min(t, M1)), thB = t < M0 ? 0 : simAt(SIM_B, M0, t);
  const th = lerp(thA, thB, m);
  const py = lerp(PIV_A, PIV_B, m);
  return { m, th, px: PX, py, PW: lerp(860, 790, m), PH: lerp(262, 26, m), rad: lerp(50, 13, m), gap: lerp(7, 0, m) };
}
function toWorld(S, x, y) { const c = Math.cos(S.th), s = Math.sin(S.th); return [S.px + x * c - y * s, S.py + x * s + y * c]; }
const topEdge = S => -S.PH - S.gap;
function beamEnd(S, side) { return toWorld(S, side * (S.PW / 2 - 12), -S.gap - S.PH / 2); }
function panK(t) { return eOut(seg(t, 5.0, 5.55)); }
function panPos(S, side, t) { const [ex, ey] = beamEnd(S, side); return [ex, ey + 18 + (HANG - 18) * panK(t)]; }

// ── textures (built once) ──
let SPECK, PAPERTEX, STIP;
function buildTextures() {
  const r = rng(64);
  SPECK = document.createElement('canvas'); SPECK.width = W; SPECK.height = H;
  let g = SPECK.getContext('2d');
  for (let i = 0; i < 26; i++) {                               // ink starvation: soft uneven zones
    const x = r() * W, y = r() * H, rr = 120 + r() * 380, gr = g.createRadialGradient(x, y, 0, x, y, rr);
    gr.addColorStop(0, 'rgba(0,0,0,0.13)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  for (let i = 0; i < 52000; i++) {                            // riso pinholes
    const s = r() < 0.85 ? 1.2 + r() * 0.8 : 2 + r() * 1.6;
    g.globalAlpha = 0.15 + r() * 0.45; g.fillStyle = '#000';
    g.beginPath(); g.arc(r() * W, r() * H, s / 2 + 0.2, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  PAPERTEX = document.createElement('canvas'); PAPERTEX.width = W; PAPERTEX.height = H;
  g = PAPERTEX.getContext('2d');
  const id = g.createImageData(W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = 238 + r() * 17; d[i] = n; d[i + 1] = n - 1; d[i + 2] = n - 4; d[i + 3] = 255; }
  g.putImageData(id, 0, 0);
  g.globalAlpha = 0.05; g.strokeStyle = '#6b5a3e'; g.lineWidth = 1;
  for (let i = 0; i < 1400; i++) { const x = r() * W, y = r() * H, a = r() * TAU, l = 6 + r() * 22; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 0.6) * l / 2, y + Math.sin(a + 0.6) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  g.globalAlpha = 1;
  STIP = document.createElement('canvas'); STIP.width = 140; STIP.height = 140;
  g = STIP.getContext('2d'); g.fillStyle = NAVY;
  for (let i = 0; i < 520; i++) { g.beginPath(); g.arc(r() * 140, r() * 140, 0.9 + r() * 1.1, 0, TAU); g.fill(); }
  STIP = ctx.createPattern(STIP, 'repeat');
}
function stipple(path, a = 0.5) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = STIP; ctx.fill(path); ctx.restore(); }
function rr(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); return p; }

// ── background: big flat circle, ground line, shadow ──
function background(t, S) {
  const cr = 410 + 12 * Math.sin(t * 0.5);
  const cy = lerp(520, 470, S.m);
  const c = new Path2D(); c.arc(PX + 10, cy, cr, 0, TAU);
  ctx.fillStyle = TEAL_P; ctx.fill(c);
  ctx.save(); ctx.clip(c);                                       // stippled crescent inside the circle
  const sh = new Path2D(); sh.arc(PX - 120, cy - 110, cr * 1.05, 0, TAU); sh.rect(PX + 1400, cy - 1400, -2800, 2800);
  stipple(sh, 0.18); ctx.restore();
  // ground
  ctx.fillStyle = NAVY; ctx.fillRect(PX - 510, GROUND, 1030, 4);
  const shw = new Path2D(); shw.ellipse(PX, GROUND + 22, 250, 12, 0, 0, TAU); stipple(shw, 0.55);
}

// ── hourglass fulcrum / column ──
function hourglass(t, S) {
  const top = S.py + 16, bot = GROUND, hh = bot - top, w = lerp(118, 128, S.m), mid = top + hh / 2;
  // plates and posts
  ctx.fillStyle = NAVY;
  ctx.fill(rr(PX - w / 2 - 18, top - 2, w + 36, 16, 5)); ctx.fill(rr(PX - w / 2 - 18, bot - 16, w + 36, 16, 5));
  ctx.fillRect(PX - w / 2 - 12, top + 10, 7, hh - 22); ctx.fillRect(PX + w / 2 + 5, top + 10, 7, hh - 22);
  // glass
  const gT = top + 14, gB = bot - 16, gm = (gT + gB) / 2, nk = 6;
  const glass = new Path2D();
  glass.moveTo(PX - w / 2, gT); glass.lineTo(PX + w / 2, gT);
  glass.bezierCurveTo(PX + w / 2, gm - (gm - gT) * 0.25, PX + nk, gm - (gm - gT) * 0.18, PX + nk, gm);
  glass.bezierCurveTo(PX + nk, gm + (gB - gm) * 0.18, PX + w / 2, gB - (gB - gm) * 0.25, PX + w / 2, gB);
  glass.lineTo(PX - w / 2, gB);
  glass.bezierCurveTo(PX - w / 2, gB - (gB - gm) * 0.25, PX - nk, gm + (gB - gm) * 0.18, PX - nk, gm);
  glass.bezierCurveTo(PX - nk, gm - (gm - gT) * 0.18, PX - w / 2, gm - (gm - gT) * 0.25, PX - w / 2, gT);
  ctx.fillStyle = CREAM; ctx.fill(glass); ctx.globalAlpha = 0.55; ctx.fillStyle = TEAL_P; ctx.fill(glass); ctx.globalAlpha = 1;
  // sand: top drains, bottom grows
  const f = 0.78 - 0.5 * (t / DUR);
  ctx.save(); ctx.clip(glass); ctx.fillStyle = CORAL;
  const topLevel = lerp(gm, gT, f * 0.9);
  ctx.beginPath(); ctx.moveTo(PX - w, topLevel + 6); ctx.quadraticCurveTo(PX, topLevel + 20, PX + w, topLevel + 6); ctx.lineTo(PX + w, gm); ctx.lineTo(PX - w, gm); ctx.fill();
  const moundH = (gB - gm) * (1 - f) * 0.75 + 8;
  ctx.beginPath(); ctx.moveTo(PX - w, gB); ctx.lineTo(PX - w, gB - moundH * 0.45); ctx.quadraticCurveTo(PX, gB - moundH * 1.35, PX + w, gB - moundH * 0.45); ctx.lineTo(PX + w, gB); ctx.fill();
  ctx.fillRect(PX - 1.5, gm - 2, 3, gB - gm - moundH * 0.8);
  const shade = new Path2D(); shade.rect(PX + w * 0.12, gT, w, gB - gT); stipple(shade, 0.35);
  ctx.restore();
  // fulcrum wedge
  ctx.fillStyle = NAVY; ctx.beginPath(); ctx.moveTo(PX - 26, top + 2); ctx.lineTo(PX, S.py - 1); ctx.lineTo(PX + 26, top + 2); ctx.closePath(); ctx.fill();
}

// ── the phone (then the beam) ──
const FEED = (() => { const r = rng(7), a = []; for (let i = 0; i < 40; i++) a.push({ c: r() < 0.28, l1: 0.45 + r() * 0.45, l2: 0.3 + r() * 0.4, h: r() < 0.5 ? 1 : 0 }); return a; })();
function phone(t, S) {
  ctx.save(); ctx.translate(S.px, S.py); ctx.rotate(S.th);
  const x0 = -S.PW / 2, y0 = topEdge(S);
  const body = rr(x0, y0, S.PW, S.PH, S.rad);
  ctx.fillStyle = NAVY; ctx.fill(body);
  const ins = lerp(15, 7, S.m), bez = lerp(34, 7, S.m);
  const scr = rr(x0 + bez, y0 + ins, S.PW - bez * 2, S.PH - ins * 2, Math.max(2, S.rad - ins));
  ctx.fillStyle = TEAL; ctx.fill(scr);
  ctx.save(); ctx.clip(scr);
  // an endless feed scrolling up, three columns of cards
  const sx = x0 + bez + 22, sw = S.PW - bez * 2 - 44, cw = (sw - 2 * 20) / 3, chH = 118, off = (t * 70) % (chH + 18);
  for (let col = 0; col < 3; col++) {
    for (let row = -1; row < 4; row++) {
      const k = (row + Math.floor(t * 70 / (chH + 18)) + col * 7 + 40) % 40, it = FEED[k];
      const cx = sx + col * (cw + 20), cy = y0 + ins + 18 + row * (chH + 18) - off + col * 34;
      ctx.fillStyle = CARD; ctx.fill(rr(cx, cy, cw, chH, 12));
      ctx.fillStyle = it.c ? CORAL : TEAL_P; ctx.beginPath(); ctx.arc(cx + 22, cy + 24, 11, 0, TAU); ctx.fill();
      ctx.fillStyle = CREAM; ctx.globalAlpha = 0.85;
      ctx.fill(rr(cx + 42, cy + 17, (cw - 60) * it.l1, 7, 4)); ctx.fill(rr(cx + 16, cy + 50, (cw - 32) * it.l2 + 30, 6, 3));
      ctx.fill(rr(cx + 16, cy + 66, (cw - 32) * 0.8, 6, 3)); ctx.globalAlpha = 0.5; ctx.fill(rr(cx + 16, cy + 88, (cw - 32) * 0.5, 16, 5)); ctx.globalAlpha = 1;
    }
  }
  const sh = new Path2D(); sh.rect(x0, y0 + S.PH * 0.62, S.PW, S.PH); stipple(sh, 0.3);
  ctx.restore();
  // camera + side buttons fade as it becomes a beam
  const a = 1 - S.m;
  if (a > 0.01) {
    ctx.globalAlpha = a; ctx.fillStyle = NAVY_D; ctx.beginPath(); ctx.arc(x0 + S.PW - bez / 2, y0 + S.PH / 2, 6, 0, TAU); ctx.fill();
    ctx.fillStyle = NAVY; ctx.fill(rr(x0 + 150, y0 + S.PH - 4, 70, 8, 4)); ctx.fill(rr(x0 + 240, y0 + S.PH - 4, 44, 8, 4));
    ctx.globalAlpha = 1;
  }
  // beam end hooks appear
  if (S.m > 0.5) {
    ctx.globalAlpha = seg(S.m, 0.5, 0.9); ctx.fillStyle = NAVY;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * (S.PW / 2 - 12), -S.gap - S.PH / 2, 9, 0, TAU); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// ── pans ──
const PAN_W = 124, PAN_D = 60;
function panBack(t, S, side) {
  const k = panK(t); if (k <= 0) return; const [ex, ey] = beamEnd(S, side), [cx, cy] = panPos(S, side, t);
  const w = PAN_W * (0.4 + 0.6 * k);
  ctx.globalAlpha = seg(t, 5.0, 5.2);
  ctx.strokeStyle = NAVY; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - w + 6, cy); ctx.lineTo(ex, ey); ctx.lineTo(cx + w - 6, cy); ctx.stroke();
  ctx.fillStyle = NAVY_D; ctx.beginPath(); ctx.ellipse(cx, cy, w, 15 * k + 2, 0, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}
function panFront(t, S, side) {
  const k = panK(t); if (k <= 0) return; const [cx, cy] = panPos(S, side, t);
  const w = PAN_W * (0.4 + 0.6 * k);
  ctx.globalAlpha = seg(t, 5.0, 5.2);
  const p = new Path2D(); p.ellipse(cx, cy, w, PAN_D * k + 3, 0, 0, Math.PI); p.ellipse(cx, cy, w, 15 * k + 2, 0, Math.PI, 0, true);
  ctx.fillStyle = NAVY; ctx.fill(p);
  ctx.fillStyle = TEAL; ctx.fill(rr(cx - w * 0.72, cy + 22 * k, w * 1.44, 5, 3));
  stipple(p, 0.35);
  ctx.globalAlpha = 1;
}

// ── notification bubbles ──
function glyph(g, x, y, r) {
  ctx.save(); ctx.translate(x, y); ctx.scale(r / 30, r / 30); ctx.fillStyle = CREAM; ctx.strokeStyle = CREAM; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath();
  if (g === 'heart') { ctx.moveTo(0, 12); ctx.bezierCurveTo(-24, -2, -12, -20, 0, -8); ctx.bezierCurveTo(12, -20, 24, -2, 0, 12); ctx.fill(); }
  else if (g === 'bell') { ctx.moveTo(-13, 8); ctx.quadraticCurveTo(-12, -14, 0, -14); ctx.quadraticCurveTo(12, -14, 13, 8); ctx.lineTo(16, 11); ctx.lineTo(-16, 11); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0, 15, 4.5, 0, TAU); ctx.fill(); }
  else if (g === 'chat') { ctx.fill(rr(-16, -12, 32, 21, 8)); ctx.beginPath(); ctx.moveTo(-8, 7); ctx.lineTo(-12, 16); ctx.lineTo(2, 8); ctx.fill(); }
  else { ctx.moveTo(-11, 0); ctx.lineTo(11, 0); ctx.moveTo(0, -11); ctx.lineTo(0, 11); ctx.stroke(); }
  ctx.restore();
}
function bubblePos(b, t, S) {
  const top = topEdge(S);
  const [lx, ly] = toWorld(S, b.x, top + b.y);
  if (t < b.tl) return [lx, ly - 2000 * (b.tl - t) ** 2, 1, 1];
  const u = t - b.tl, sq = u < 0.3 ? Math.exp(-u * 14) * Math.cos(u * 40) * 0.22 : 0;
  return [lx, ly + b.r * sq * 0.5, 1 + sq, 1 - sq];
}
function gatherPt(S, t) { const [ex, ey] = beamEnd(S, 1); return [ex, ey - 150 + 8 * Math.sin((t - 5.3) * 5) * seg(t, 5.3, 5.5)]; }
const DOT_R = 46;
function dotPos(t, S) {
  const [gx, gy] = gatherPt(S, t), [cx, cy] = panPos(S, 1, t);
  const tgtY = cy + 10 - DOT_R + 8;
  if (t < 5.78) return [gx, gy, 1, 1];
  if (t < T_DOT) { const u = eIn(seg(t, 5.78, T_DOT)); return [lerp(gx, cx, u), lerp(gy, tgtY, u), 1 - 0.12 * u, 1 + 0.14 * u]; }
  const u = t - T_DOT, sq = Math.exp(-u * 9) * Math.cos(u * 30) * 0.24;
  return [cx, tgtY + DOT_R * sq * 0.5, 1 + sq, 1 - sq];
}
function bubbles(t, S) {
  if (t < M0) {
    for (const b of BUBS) {
      const [x, y, sx, sy] = bubblePos(b, t, S); if (y < -100) continue;
      ctx.save(); ctx.translate(x, y + b.r * (1 - sy)); ctx.scale(sx, sy);
      ctx.fillStyle = CORAL; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.fill();
      ctx.restore(); glyph(b.g, x, y + b.r * (1 - sy), b.r * 0.95);
    }
    return;
  }
  if (t < 5.32) {                                                         // the pile fuses into one dot
    const u = eInOut(seg(t, M0, 5.32)), [gx, gy] = gatherPt(S, t);
    for (const b of BUBS) {
      const [x, y] = bubblePos(b, t, S), d = BUBS.indexOf(b) * 0.04, uu = eInOut(seg(t, M0 + d, 5.32));
      const px = lerp(x, gx, uu) + Math.sin(uu * Math.PI) * (b.x - 300) * 0.6, py = lerp(y, gy, uu) - Math.sin(uu * Math.PI) * 50;
      ctx.fillStyle = CORAL; ctx.beginPath(); ctx.arc(px, py, lerp(b.r, DOT_R, uu), 0, TAU); ctx.fill();
      if (uu < 0.5) { ctx.globalAlpha = 1 - uu * 2; glyph(b.g, px, py, b.r * 0.95); ctx.globalAlpha = 1; }
    }
    if (u > 0.8) numberDot(gx, gy, 1, 1, seg(u, 0.8, 1));
    return;
  }
  const [x, y, sx, sy] = dotPos(t, S);
  numberDot(x, y, sx, sy, 1);
}
function numberDot(x, y, sx, sy, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, sy);
  const pop = backOut(seg(TT, T_TWO, T_TWO + 0.35), 2.4), grow = TT > T_TWO ? 1 + 0.1 * pop : 1;
  ctx.scale(grow, grow);
  ctx.fillStyle = CORAL; ctx.beginPath(); ctx.arc(0, 0, DOT_R, 0, TAU); ctx.fill();
  const sh = new Path2D(); sh.arc(0, 0, DOT_R, 0.1, Math.PI * 0.9); sh.arc(-8, -12, DOT_R * 0.95, Math.PI * 0.9, 0.1, true); stipple(sh, 0.35);
  ctx.globalAlpha = a; ctx.fillStyle = CREAM; ctx.font = `58px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  if (TT < T_TWO) ctx.fillText('1', 0, 20);
  else {                                                                  // the count ticks over
    const u = seg(TT, T_TWO, T_TWO + 0.22);
    ctx.save(); ctx.beginPath(); ctx.rect(-40, -34, 80, 64); ctx.clip();
    ctx.fillText('1', 0, 20 - 70 * eInOut(u)); ctx.fillText('2', 0, 90 - 70 * eInOut(u)); ctx.restore();
  }
  ctx.restore(); ctx.globalAlpha = 1;
  if (TT > T_TWO && TT < T_TWO + 0.6) {                                  // a quiet ping
    const u = seg(TT, T_TWO, T_TWO + 0.6);

// ── the man: a slender flat figure, simple rig (hip-rooted, angles from vertical, + = forward) ──
const L = { th: 84, sh: 82, torso: 104, neck: 15, ua: 64, fa: 58 };
const P = {
  STAND: { lean: 0.03, head: -0.12, fl: [0.10, 0.08], bl: [-0.08, 0.05], fa: [0.18, 0.35], ba: [-0.12, 0.25] },
  BAL:   { lean: -0.02, head: -0.2, fl: [0.14, 0.18], bl: [-0.12, 0.14], fa: [1.55, 0.12], ba: [-1.55, -0.12] },
  CROUCH:{ lean: 0.32, head: -0.35, fl: [0.95, 1.7], bl: [0.7, 1.45], fa: [1.9, 0.3], ba: [-1.3, 0.35] },
  AIR:   { lean: -0.12, head: -0.25, fl: [0.75, 1.25], bl: [0.25, 0.8], fa: [2.4, 0.25], ba: [2.0, -0.2] },
  PRE:   { lean: -0.08, head: 0.05, fl: [1.9, 2.2], bl: [1.72, 2.1], fa: [1.2, 0.5], ba: [-0.6, 0.5] },
  REST:  { lean: -0.14, head: 0.15, fl: [1.95, 2.25], bl: [1.78, 2.15], fa: [0.55, 0.55], ba: [0.35, 0.5] },
  SEAT:  { lean: -0.1, head: 0.5, fl: [1.95, 2.25], bl: [1.78, 2.15], fa: [0.78, 1.02], ba: [0.62, 1.12] },
};
function mix(a, b, u) { const o = {}; for (const k in a) o[k] = Array.isArray(a[k]) ? [lerp(a[k][0], b[k][0], u), lerp(a[k][1], b[k][1], u)] : lerp(a[k], b[k], u); return o; }
const dirv = a => [Math.sin(a), Math.cos(a)];
function fk(p) {

  const ha = p.lean + p.head;
  const nk = [sh[0] + Math.sin(p.lean + p.head * 0.4) * L.neck, sh[1] - Math.cos(p.lean + p.head * 0.4) * L.neck];
  const hc = [nk[0] + Math.sin(ha) * 20 + Math.cos(ha) * 3, nk[1] - Math.cos(ha) * 20 + Math.sin(ha) * 3];

  return { hip, sh, nk, hc, ha, fl: leg(p.fl), bl: leg(p.bl), fa: arm(p.fa), ba: arm(p.ba) };
}
function lowestFoot(p) { const k = fk(p); return Math.max(k.fl.an[1], k.bl.an[1]) + 9; }
function limb(a, b, c, w1, w2, col) {
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = w1; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  ctx.lineWidth = w2; ctx.beginPath(); ctx.moveTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.stroke();
}
function shoe(an, b, col) {

  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(8, -7); ctx.quadraticCurveTo(26, -3, 27, 6); ctx.lineTo(-9, 7); ctx.quadraticCurveTo(-12, 0, -8, -6); ctx.fill();

}
function hand(wr, f, col) {

  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(0, 7, 7, 10, 0, 0, TAU); ctx.fill();

function drawFigure(o) {

  limb(k.hip, k.bl.kn, k.bl.an, 22, 17, NAVY_D); shoe(k.bl.an, k.bl.b, '#0f1526');

  ctx.fillStyle = SKIN;
  ctx.beginPath(); ctx.ellipse(-1, 0, 18, 24, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -8); ctx.quadraticCurveTo(25, 1, 26, 5); ctx.lineTo(16, 6); ctx.fill();          // nose
  ctx.beginPath(); ctx.moveTo(8, 14); ctx.quadraticCurveTo(15, 23, 5, 25); ctx.lineTo(-4, 22); ctx.fill();         // chin
  ctx.fillStyle = NAVY;                                                                                           // hair
  ctx.beginPath(); ctx.moveTo(15, -14); ctx.quadraticCurveTo(10, -30, -6, -27); ctx.quadraticCurveTo(-24, -22, -20, 2);
  ctx.quadraticCurveTo(-17, 10, -13, 12); ctx.quadraticCurveTo(-12, -6, -3, -14); ctx.quadraticCurveTo(6, -18, 15, -14); ctx.fill();
  ctx.fillStyle = SKIN_D; ctx.beginPath(); ctx.ellipse(-4, 2, 4.5, 7, 0.1, 0, TAU); ctx.fill();                   // ear
  ctx.fillStyle = NAVY_D; ctx.beginPath(); ctx.ellipse(10, -3, 2.4, 2.8, 0, 0, TAU); ctx.fill();                    // eye

    ctx.save(); ctx.globalAlpha = o.phoneA * 0.55; ctx.fillStyle = '#e4f0ea';
    ctx.beginPath(); ctx.moveTo(hp[0] - 4, hp[1] - 8); ctx.lineTo(k.hc[0] + 20, k.hc[1] - 26); ctx.lineTo(k.hc[0] + 8, k.hc[1] + 30); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = o.phoneA; ctx.translate(hp[0], hp[1]); ctx.rotate(-0.9);
    ctx.fillStyle = NAVY_D; ctx.fill(rr(-11, -18, 22, 36, 5)); ctx.fillStyle = '#e4f0ea'; ctx.fill(rr(-8, -15, 16, 30, 3));
    ctx.fillStyle = CORAL; ctx.beginPath(); ctx.arc(3, -8, 2.2, 0, TAU); ctx.fill();
    ctx.restore();

}
function walkPose(t, base) {
  const x = figX(t), phi = (-x / 42) * Math.PI;                        // one stride per 84 px, walking backwards
  const moving = Math.abs(figX(t + 0.02) - figX(t - 0.02)) > 0.4;
  const amp = moving ? 1 : 0, s = Math.sin(phi);
  const p = JSON.parse(JSON.stringify(base));
  p.fl[0] = base.fl[0] + 0.3 * s * amp; p.bl[0] = base.bl[0] - 0.3 * s * amp;
  p.fl[1] = base.fl[1] + 0.35 * Math.max(0, Math.cos(phi)) * amp; p.bl[1] = base.bl[1] + 0.35 * Math.max(0, -Math.cos(phi)) * amp;

}
function figure(t, S) {
  if (t < T_LAUNCH) {
    let p = mix(P.STAND, P.BAL, eOut(seg(t, 1.02, 1.4)));
    p = walkPose(t, p);
    const wob = seg(t, 3.7, 3.8) * (1 - seg(t, 4.2, 4.3));                  // windmilling at the very end
    if (wob > 0) { const w = Math.sin((t - 3.7) * 16) * 0.55 * wob; p.fa[0] += w; p.ba[0] += w; p.lean += 0.06 * Math.sin((t - 3.7) * 9) * wob; }
    p.lean -= S.th * 0.25;
    if (t > T_SLAM - 0.02) p = mix(p, P.CROUCH, eOut(seg(t, T_SLAM - 0.02, T_LAUNCH)));
    const [x, y] = toWorld(S, figX(t), topEdge(S));
    drawFigure({ x, y, pose: p, anchor: 'feet' });
    return;
  }
  // in the air: a ballistic arc from the tipping phone to the scale pan
  const S0 = struct(T_LAUNCH), [lx, ly] = toWorld(S0, figX(T_LAUNCH), topEdge(S0));
  const hy0 = ly - lowestFoot(P.CROUCH) * FS;
  if (t < T_SEAT) {
    const S1 = struct(T_SEAT), [sx, sy] = panPos(S1, -1, T_SEAT), tx = sx - 26, ty = sy + 8;
    const u = seg(t, T_LAUNCH, T_SEAT), apex = 178, UA = 0.38;       // fast catapult rise, slower fall
    const xo = tx - 108;                                               // pass outside the beam end, then settle in

    const y = u < UA ? lerp(hy0, apex, 1 - Math.pow(1 - u / UA, 2)) : lerp(apex, ty, Math.pow((u - UA) / (1 - UA), 2));

    p.fa[0] += Math.sin((t - T_LAUNCH) * 13) * 0.25; p.ba[0] -= Math.sin((t - T_LAUNCH) * 11) * 0.3;

    return;
  }
  const [cx, cy] = panPos(S, -1, t), u = t - T_SEAT;
  const bounce = Math.exp(-u * 8) * Math.sin(u * 22) * 7;
  let p = mix(P.PRE, P.REST, eOut(seg(t, T_SEAT, T_SEAT + 0.2)));
  p = mix(p, P.SEAT, eInOut(seg(t, 6.45, 6.95)));
  if (t > T_DOT && t < T_DOT + 0.5) p.head -= 0.35 * Math.sin(Math.PI * seg(t, T_DOT, T_DOT + 0.5)) * (1 - seg(t, 6.3, 6.6)); // a glance, then back to the screen
  drawFigure({ x: cx - 26, y: cy + 8 + bounce, pose: p, anchor: 'hip', phoneA: eOut(seg(t, 6.55, 6.8)) });
}

// ── type ──
function wrap(txt, font, maxW) { ctx.font = font; const words = txt.split(' '), lines = []; let cur = '';
  for (const w of words) { const s = cur ? cur + ' ' + w : w; if (ctx.measureText(s).width > maxW && cur) { lines.push(cur); cur = w; } else cur = s; }
  if (cur) lines.push(cur); return lines; }
const X0 = 124;
let DECK, PUNCH;
function typeLayer(t) {
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  // masthead
  const a0 = eOut(seg(t, 0.15, 0.7));
  ctx.globalAlpha = a0; ctx.fillStyle = NAVY; ctx.font = `600 21px ${TEXT}`; ctx.letterSpacing = '6px';
  ctx.fillText('THE MERIDIAN REVIEW', X0, 128);
  ctx.fillStyle = CORAL; ctx.fillText('OPINION', X0, 170); ctx.letterSpacing = '0px';
  ctx.fillStyle = NAVY; ctx.fillRect(X0, 142, 560 * eInOut(seg(t, 0.2, 0.9)), 2);
  ctx.globalAlpha = 1;
  // headline, word by word from behind a mask
  ctx.font = `104px ${SERIF}`; ctx.fillStyle = NAVY;
  const HL = [["The", 0, 306, 0.28], ["Attention", 1, 306, 0.4], ["Economy", 0, 412, 0.52]];
  let xa = X0;
  for (const [w, sameLine, y, d] of HL) {
    const x = sameLine ? xa : X0; const ww = ctx.measureText(w).width;
    const u = eOut(seg(t, d, d + 0.7));
    ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - 115, ww + 30, 146); ctx.clip();

  ctx.font = `italic 40px ${TEXT}`; ctx.fillStyle = NAVY;
  DECK.forEach((ln, i) => {

  ctx.letterSpacing = '0px'; ctx.font = `italic 22px ${TEXT}`; ctx.globalAlpha *= 0.8; ctx.fillText('On the price of looking away', X0, 936);
  ctx.globalAlpha = 1;
}

let TT = 0;
window.draw = ({ t }) => {
  TT = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  const S = struct(t);
  background(t, S);
  hourglass(t, S);
  const flying = false;
  if (flying) figure(t, S);                        // mid-flight he passes behind the rising beam
  phone(t, S);
  panBack(t, S, -1); panBack(t, S, 1);
  if (!flying) figure(t, S);
  bubbles(t, S);
  panFront(t, S, -1); panFront(t, S, 1);
  typeLayer(t);
  // riso ink: pinholes and uneven coverage punched out of every ink layer
  ctx.globalCompositeOperation = 'destination-out'; ctx.drawImage(SPECK, 0, 0); ctx.globalCompositeOperation = 'source-over';
  MAIN.globalCompositeOperation = 'source-over'; MAIN.globalAlpha = 1;
  MAIN.drawImage(PAPERTEX, 0, 0);
  MAIN.globalCompositeOperation = 'multiply'; MAIN.fillStyle = CREAM; MAIN.fillRect(0, 0, W, H);
  MAIN.globalCompositeOperation = 'source-over';
  MAIN.drawImage(LAY, 0, 0);
  const fade = Math.max(1 - eOut(seg(t, 0, 0.45)), eInOut(seg(t, 9.35, 10.0)));
  if (fade > 0) { MAIN.globalAlpha = fade; MAIN.drawImage(PAPERTEX, 0, 0); MAIN.globalCompositeOperation = 'multiply'; MAIN.fillStyle = CREAM; MAIN.fillRect(0, 0, W, H); MAIN.globalCompositeOperation = 'source-over'; MAIN.globalAlpha = 1; }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.events = () => {
  const ev = [];
  BUBS.forEach((b, i) => ev.push({ k: b.m > 1 ? 'slam' : 'land', t: b.tl, v: i, pan: 0.35 }));
  // footsteps while he backs away
  let last = null;
  for (let t = 1.0; t < 4.0; t += 1 / 120) { const s = Math.floor(-figX(t) / 42); if (last !== null && s !== last) ev.push({ k: 'step', t: +t.toFixed(3) }); last = s; }
  ev.push({ k: 'whoosh', t: T_LAUNCH }, { k: 'morph', t: M0 }, { k: 'fuse', t: 5.3 }, { k: 'pan', t: T_SEAT }, { k: 'dong', t: T_DOT }, { k: 'ding', t: T_TWO });

};
window.ready = (async () => {
  await document.fonts.load(`112px ${SERIF}`); await document.fonts.load(`italic 46px ${SERIF}`);

  buildTextures(); buildSims();
