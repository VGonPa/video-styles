<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── documentary-16mm · 1930s newsreel "The Night Mail Takes to the Air" ───────────────
// Leader (3, 2 + pop) → title card → splice → mail biplane on a night airfield, propeller coughs and spins up, rolls off →
// frameshift → take-off over moonlit fields (parallax) → splice → map insert, route draws north → "THE END" card with
// changeover cue marks → reel run-out (loop lost, clear leader flapping, lamp dies).
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const S = mk(W, H), sx = S.getContext('2d');
const S2 = mk(W, H), sx2 = S2.getContext('2d');
let GRAIN = [], VIG, TITLE, FIN, PLANE, AIRFIELD, SKY2, HILLS, FIELDS, NEAR, MAP;
const INK = '#e9e7df', DARK = '#0e0e0d';
const SERIF = '"Old Standard TT"', MONO = '"Courier Prime"';
// edit (seconds)
const T = { lead0: 0.1, lead2: 0.62, leadEnd: 1.12, t1: 1.2, air: 2.95, cough: 3.4, catch: 3.75, full: 4.5, roll: 4.6,
  slip: 5.3, slipEnd: 5.52, map: 7.0, fin: 8.3, cue1: 8.95, cue2: 9.2, run: 9.4, dark: 9.62, end: 10.0 };

// ── cards ──
function ornament(x, cx, cy, w) {
  x.save(); x.strokeStyle = INK; x.fillStyle = INK; x.lineWidth = 2;
  x.beginPath(); x.moveTo(cx - w / 2, cy); x.lineTo(cx - 22, cy); x.moveTo(cx + 22, cy); x.lineTo(cx + w / 2, cy); x.stroke();
  x.beginPath(); x.moveTo(cx, cy - 11); x.lineTo(cx + 11, cy); x.lineTo(cx, cy + 11); x.lineTo(cx - 11, cy); x.closePath(); x.fill();
  [-1, 1].forEach(s => { x.beginPath(); x.arc(cx + s * (w / 2 + 8), cy, 4, 0, Math.PI * 2); x.fill(); });
  x.restore();
}
function cardFrame(x, fill = DARK) {
  x.fillStyle = fill; x.fillRect(0, 0, W, H);
  x.strokeStyle = INK; x.lineWidth = 3; x.strokeRect(120, 90, W - 240, H - 180);
  x.lineWidth = 1.5; x.strokeRect(138, 108, W - 276, H - 216);
  [[120, 90, 1, 1], [W - 120, 90, -1, 1], [120, H - 90, 1, -1], [W - 120, H - 90, -1, -1]].forEach(([px, py, sx_, sy]) => {
    x.save(); x.translate(px, py); x.scale(sx_, sy); x.fillStyle = INK;
    x.fillRect(-8, -8, 34, 5); x.fillRect(-8, -8, 5, 34); x.fillRect(30, 16, 22, 3); x.fillRect(16, 30, 3, 22);
    x.beginPath(); x.moveTo(34, 34); x.lineTo(42, 42); x.lineTo(34, 50); x.lineTo(26, 42); x.closePath(); x.fill();
    x.restore();
  });
}
function buildTitle() {
  const c = mk(W, H), x = c.getContext('2d'); cardFrame(x);
  x.fillStyle = INK; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = `400 36px ${SERIF}`; x.letterSpacing = '14px'; x.fillText('WEEKLY PICTORIAL NEWS · No. 47', 967, 300);
  ornament(x, 960, 356, 560);
  x.letterSpacing = '3px'; x.font = `700 176px ${SERIF}`; x.fillText('The Night Mail', 960, 560);
  x.font = `italic 400 96px ${SERIF}`; x.letterSpacing = '2px'; x.fillText('Takes to the Air', 960, 690);
  ornament(x, 960, 770, 380);
  x.font = `400 30px ${SERIF}`; x.letterSpacing = '10px'; x.fillText('— MCMXXXIV —', 965, 870);
  return c;
}
function buildFin() {
  const c = mk(W, H), x = c.getContext('2d'); cardFrame(x);
  x.fillStyle = INK; x.textAlign = 'center';
  x.font = `700 200px ${SERIF}`; x.letterSpacing = '28px'; x.fillText('THE END', 974, 590);
  ornament(x, 960, 675, 460);
  x.font = `italic 400 48px ${SERIF}`; x.letterSpacing = '2px'; x.fillText('A Weekly Pictorial News reel', 960, 790);
  return c;
}

// ── the mail biplane, side view facing right (local coords ~1000×460, wheels touch y≈424, propeller hub at 822,203) ──
function airfoil(x, x0, x1, y, th) {
  const L = x1 - x0;
  x.beginPath(); x.moveTo(x0, y);
  x.bezierCurveTo(x0 + L * 0.4, y - th * 0.9, x1 - th * 0.3, y - th * 1.1, x1, y - th * 0.25);
  x.bezierCurveTo(x1 + 3, y + th * 0.35, x0 + L * 0.5, y + th * 0.35, x0, y);
  x.closePath();
}
function buildPlane() {
  const c = mk(1000, 460), x = c.getContext('2d');
  const skin = (y0, y1) => { const g = x.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, '#eceae0'); g.addColorStop(0.45, '#b4b2a9'); g.addColorStop(1, '#3e3d3a'); return g; };
  const strut = (x0, y0, x1, y1, w) => { x.strokeStyle = '#1e1e1c'; x.lineWidth = w; x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
    x.strokeStyle = 'rgba(240,238,228,0.55)'; x.lineWidth = w * 0.3; x.beginPath(); x.moveTo(x0 - w * 0.2, y0); x.lineTo(x1 - w * 0.2, y1); x.stroke(); };
  // landing gear (behind fuselage)
  strut(560, 258, 612, 376, 10); strut(692, 254, 626, 376, 10);
  x.strokeStyle = '#1e1e1c'; x.lineWidth = 6; x.beginPath(); x.moveTo(100, 212); x.lineTo(78, 248); x.stroke(); // tail skid
  // wheel
  x.fillStyle = '#161615'; x.beginPath(); x.arc(618, 380, 44, 0, Math.PI * 2); x.fill();
  x.strokeStyle = 'rgba(220,218,208,0.35)'; x.lineWidth = 3; x.beginPath(); x.arc(618, 380, 36, Math.PI * 1.05, Math.PI * 1.6); x.stroke();
  const hg = x.createRadialGradient(612, 374, 2, 618, 380, 18); hg.addColorStop(0, '#f0eee4'); hg.addColorStop(1, '#6c6b65');
  x.fillStyle = hg; x.beginPath(); x.arc(618, 380, 17, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#222'; x.beginPath(); x.arc(618, 380, 4, 0, Math.PI * 2); x.fill();
  // interplane struts + flying wires
  strut(452, 256, 442, 68, 8); strut(652, 254, 662, 66, 8);
  x.strokeStyle = 'rgba(20,20,18,0.8)'; x.lineWidth = 1.6;
  x.beginPath(); x.moveTo(452, 256); x.lineTo(662, 66); x.moveTo(652, 254); x.lineTo(442, 68); x.stroke();
  strut(530, 152, 560, 64, 6); strut(612, 150, 640, 62, 6); // cabane
  // tail fin + rudder
  x.fillStyle = skin(80, 210); x.beginPath(); x.moveTo(68, 198); x.lineTo(92, 96); x.quadraticCurveTo(108, 74, 142, 90); x.lineTo(196, 182); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(0,0,0,0.55)'; x.lineWidth = 2; x.stroke();
  x.beginPath(); x.moveTo(118, 84); x.lineTo(104, 198); x.stroke();
  // fuselage
  x.fillStyle = skin(148, 268); x.beginPath(); x.moveTo(68, 198);
  x.bezierCurveTo(250, 178, 480, 150, 760, 148); x.lineTo(760, 260); x.bezierCurveTo(520, 270, 260, 240, 68, 214); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(0,0,0,0.7)'; x.lineWidth = 2.5; x.stroke();
  x.save(); x.clip();
  x.fillStyle = '#2a2a27'; x.fillRect(0, 196, 800, 9); // cheat line
  x.strokeStyle = 'rgba(0,0,0,0.3)'; x.lineWidth = 1.5; [300, 440, 700].forEach(px => { x.beginPath(); x.moveTo(px, 140); x.lineTo(px, 270); x.stroke(); });
  x.fillStyle = 'rgba(255,255,250,0.35)'; x.fillRect(0, 158, 800, 4);
  x.restore();
  x.fillStyle = '#1c1c1a'; x.font = `700 30px ${SERIF}`; x.letterSpacing = '5px'; x.textAlign = 'center'; x.fillText('AIR MAIL', 560, 244);
  x.font = `700 22px ${SERIF}`; x.letterSpacing = '3px'; x.fillText('N·47', 215, 230);
  // horizontal stabiliser
  x.fillStyle = skin(190, 220); airfoil(x, 40, 200, 206, 14); x.fill(); x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 1.5; x.stroke();
  // cockpit + windscreen
  x.fillStyle = '#121211'; x.beginPath(); x.ellipse(372, 162, 40, 9, -0.05, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(230,230,222,0.45)'; x.beginPath(); x.moveTo(404, 158); x.lineTo(418, 134); x.lineTo(428, 134); x.lineTo(420, 157); x.closePath(); x.fill();
  // cowling (radial engine)
  const cg = x.createLinearGradient(0, 138, 0, 268); cg.addColorStop(0, '#f4f2e8'); cg.addColorStop(0.35, '#8e8c85'); cg.addColorStop(0.7, '#505049'); cg.addColorStop(1, '#1c1c1a');
  x.fillStyle = cg; x.beginPath(); x.roundRect(752, 138, 58, 130, 16); x.fill();
  x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 2; x.stroke();
  x.strokeStyle = 'rgba(0,0,0,0.45)'; for (let i = 0; i < 3; i++) { x.beginPath(); x.moveTo(766 + i * 14, 142); x.lineTo(766 + i * 14, 264); x.stroke(); }
  // exhaust stub
  x.strokeStyle = '#262624'; x.lineWidth = 9; x.lineCap = 'round'; x.beginPath(); x.moveTo(748, 262); x.lineTo(702, 276); x.stroke();
  // wings last (in front)
  const wing = (x0, x1, y, th) => { x.fillStyle = skin(y - th, y + th * 0.4); airfoil(x, x0, x1, y, th); x.fill(); x.strokeStyle = 'rgba(0,0,0,0.65)'; x.lineWidth = 2; x.stroke();
    x.strokeStyle = 'rgba(255,255,250,0.45)'; x.lineWidth = 2; x.beginPath(); x.moveTo(x0 + (x1 - x0) * 0.2, y - th * 0.55); x.quadraticCurveTo(x0 + (x1 - x0) * 0.6, y - th * 0.95, x1 - th * 0.6, y - th * 0.7); x.stroke(); };
  wing(398, 712, 64, 26); wing(418, 700, 264, 22);
  // spinner
  const sg = x.createLinearGradient(0, 178, 0, 230); sg.addColorStop(0, '#f2f0e6'); sg.addColorStop(1, '#3a3a36');
  x.fillStyle = sg; x.beginPath(); x.ellipse(818, 203, 18, 26, 0, 0, Math.PI * 2); x.fill();
  return c;
}
// propeller in slight perspective: angle a from integrated spin, omega (rad/s) drives the motion blur / disc
function propeller(x, a, om) {
  const cx = 826, cy = 203, rx = 30, ry = 152;
  const spread = Math.min(Math.PI, om / 30), n = om > 1 ? 10 : 1;
  const disc = clamp((om - 18) / 45);
  if (disc > 0) {
    const g = x.createRadialGradient(cx, cy, 10, cx, cy, ry);
    g.addColorStop(0, `rgba(30,30,28,${0.35 * disc})`); g.addColorStop(0.8, `rgba(70,70,66,${0.42 * disc})`); g.addColorStop(1, `rgba(220,220,210,${0.4 * disc})`);
    x.save(); x.translate(cx, cy); x.scale(rx / ry, 1); x.fillStyle = g; x.beginPath(); x.arc(0, 0, ry, 0, Math.PI * 2); x.fill();
    x.strokeStyle = `rgba(245,245,235,${0.5 * disc})`; x.lineWidth = 7; x.beginPath(); x.arc(0, 0, ry - 4, -2.2, -1.0); x.stroke(); x.restore();
  }
  const bladeAlpha = n === 1 ? 1 : lerp(1.6 / n, 0.5 / n, disc);
  for (let k = 0; k < n; k++) {
    const aa = a - (n === 1 ? 0 : spread * k / (n - 1));
    for (const s of [0, Math.PI]) {
      const ex = cx + rx * Math.cos(aa + s), ey = cy + ry * Math.sin(aa + s);
      x.strokeStyle = `rgba(22,22,20,${bladeAlpha})`; x.lineCap = 'round';
      x.lineWidth = 20; x.beginPath(); x.moveTo(cx, cy); x.lineTo(lerp(cx, ex, 0.55), lerp(cy, ey, 0.55)); x.stroke();
      x.lineWidth = 14; x.beginPath(); x.moveTo(lerp(cx, ex, 0.5), lerp(cy, ey, 0.5)); x.lineTo(ex, ey); x.stroke();
    }
  }
  x.fillStyle = '#d9d7cc'; x.beginPath(); x.ellipse(cx - 2, cy, 9, 16, 0, 0, Math.PI * 2); x.fill();
}
function omega(t) {
  if (t < T.cough) return 0;
  if (t < T.catch) { const u = (t - T.cough) / (T.catch - T.cough); return 14 * Math.exp(-u * 4) + 2; }
  if (t < T.full) return lerp(3, 72, eIn(seg(t, T.catch, T.full)));
  return 72;
}
function spin(t) { let a = 0.35; const dt = 1 / 600; for (let s = T.cough; s < t; s += dt) a += omega(s) * dt; return a; }

// ── night airfield (static layer) ──
function buildAirfield() {
  const c = mk(W, H), x = c.getContext('2d'), r = rng(41);
  const sky = x.createLinearGradient(0, 0, 0, 700); sky.addColorStop(0, '#121211'); sky.addColorStop(0.55, '#34342f'); sky.addColorStop(1, '#6a6963');
  x.fillStyle = sky; x.fillRect(0, 0, W, 700);
  for (let i = 0; i < 90; i++) { x.fillStyle = `rgba(240,240,232,${0.2 + r() * 0.5})`; x.beginPath(); x.arc(r() * W, r() * 480, 0.8 + r() * 1.6, 0, Math.PI * 2); x.fill(); }
  // moon + halo + a lit cloud bank
  const mh = x.createRadialGradient(1560, 190, 40, 1560, 190, 360); mh.addColorStop(0, 'rgba(255,255,250,0.35)'); mh.addColorStop(1, 'rgba(255,255,250,0)');
  x.fillStyle = mh; x.fillRect(1100, 0, 820, 600);
  x.fillStyle = '#efede3'; x.beginPath(); x.arc(1560, 190, 58, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(120,120,112,0.35)'; [[1540, 175, 14], [1580, 210, 10], [1552, 214, 6]].forEach(([a, b, rr]) => { x.beginPath(); x.arc(a, b, rr, 0, Math.PI * 2); x.fill(); });
  for (let i = 0; i < 26; i++) { const cx = 900 + r() * 1100, cy = 300 + r() * 60; x.fillStyle = `rgba(${90 + r() * 40},${90 + r() * 40},${86 + r() * 40},0.5)`; x.beginPath(); x.ellipse(cx, cy, 80 + r() * 120, 14 + r() * 14, 0, 0, Math.PI * 2); x.fill(); }
  // distant tree line
  x.fillStyle = '#1a1a19'; x.beginPath(); x.moveTo(0, 712);
  for (let px = 0; px <= W; px += 18) x.lineTo(px, 700 - 8 - r() * 22 - (px > 1200 && px < 1500 ? 20 : 0)); x.lineTo(W, 720); x.lineTo(0, 720); x.fill();
  // grass field
  const gg = x.createLinearGradient(0, 700, 0, H); gg.addColorStop(0, '#34342f'); gg.addColorStop(1, '#0f0f0e');
  x.fillStyle = gg; x.fillRect(0, 708, W, H - 708);
  for (let i = 0; i < 2600; i++) { const py = 710 + Math.pow(r(), 0.7) * 380, s = (py - 700) / 380; x.fillStyle = `rgba(${r() < 0.5 ? '0,0,0' : '200,200,190'},${0.08 + r() * 0.12})`; x.fillRect(r() * W, py, 1 + s * 3, 1 + s * 5); }
  // runway: pale mown strip receding to the right
  x.fillStyle = 'rgba(160,158,150,0.13)'; x.beginPath(); x.moveTo(0, 1080); x.lineTo(0, 880); x.lineTo(1920, 735); x.lineTo(1920, 790); x.lineTo(900, 1080); x.fill();
  // hangar: arched roof, open lit door
  x.fillStyle = '#171716'; x.beginPath(); x.moveTo(-20, 730); x.lineTo(-20, 420); x.quadraticCurveTo(220, 290, 470, 420); x.lineTo(470, 730); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(120,120,112,0.18)'; x.lineWidth = 2; for (let px = 10; px < 470; px += 34) { x.beginPath(); x.moveTo(px, 400); x.lineTo(px, 730); x.stroke(); }
  x.strokeStyle = 'rgba(220,220,210,0.5)'; x.lineWidth = 5; x.beginPath(); x.moveTo(-20, 420); x.quadraticCurveTo(220, 290, 470, 420); x.stroke();
  const dg = x.createLinearGradient(0, 470, 0, 730); dg.addColorStop(0, '#bdbbb2'); dg.addColorStop(1, '#f2f0e6');
  x.fillStyle = dg; x.fillRect(90, 480, 290, 250);
  x.fillStyle = 'rgba(40,40,38,0.6)'; for (let i = 0; i < 4; i++) x.fillRect(110 + i * 72, 500, 6, 230); x.fillRect(90, 560, 290, 4);
  x.fillStyle = '#2a2a28'; x.fillRect(70, 470, 30, 262); x.fillRect(370, 470, 30, 262); // door leaves
  // mail sacks on a trolley in the doorway
  x.fillStyle = '#1b1b1a'; x.fillRect(150, 690, 170, 12); [[170, 720], [300, 720]].forEach(([a, b]) => { x.beginPath(); x.arc(a, b, 12, 0, Math.PI * 2); x.fill(); });
  [[185, 650, 36, 44], [240, 645, 38, 50], [292, 655, 32, 40]].forEach(([a, b, w, h]) => { x.fillStyle = '#3c3b37'; x.beginPath(); x.ellipse(a, b, w * 0.8, h * 0.8, 0, 0, Math.PI * 2); x.fill(); x.fillStyle = '#1b1b1a'; x.fillRect(a - 6, b - h * 0.85, 12, 10); });
  // light spilling from the door onto the grass
  x.globalCompositeOperation = 'screen';
  const sp = x.createLinearGradient(0, 730, 0, 1080); sp.addColorStop(0, 'rgba(255,255,248,0.45)'); sp.addColorStop(1, 'rgba(255,255,248,0)');
  x.filter = 'blur(40px)'; x.fillStyle = sp; x.beginPath(); x.moveTo(90, 730); x.lineTo(380, 730); x.lineTo(1150, 1080); x.lineTo(-200, 1080); x.closePath(); x.fill(); x.filter = 'none';
  const hl = x.createRadialGradient(235, 610, 40, 235, 610, 520); hl.addColorStop(0, 'rgba(255,255,248,0.22)'); hl.addColorStop(1, 'rgba(255,255,248,0)');
  x.fillStyle = hl; x.fillRect(0, 200, 900, 880);
  x.globalCompositeOperation = 'source-over';
  // lamp over the door
  x.fillStyle = '#f8f6ee'; x.beginPath(); x.arc(235, 455, 9, 0, Math.PI * 2); x.fill();
  // windsock pole
  x.strokeStyle = '#161615'; x.lineWidth = 7; x.beginPath(); x.moveTo(1700, 760); x.lineTo(1700, 505); x.stroke();
  return c;
}
function flares(x, t) { // runway flare pots along the mown strip
  const r = rng(Math.floor(t * 15) * 7 + 3);
  for (let i = 0; i < 9; i++) {
    const u = i / 8, px = lerp(1000, 1900, Math.pow(u, 0.8)), py = lerp(965, 742, Math.pow(u, 0.8)), s = lerp(1.0, 0.35, u);
    const f = 0.75 + 0.25 * r();
    const g = x.createRadialGradient(px, py, 1, px, py, 42 * s); g.addColorStop(0, `rgba(255,255,248,${0.8 * f})`); g.addColorStop(0.25, `rgba(255,255,248,${0.28 * f})`); g.addColorStop(1, 'rgba(255,255,248,0)');
    x.fillStyle = g; x.fillRect(px - 45 * s, py - 45 * s, 90 * s, 90 * s);
    x.fillStyle = '#fbfaf4'; x.beginPath(); x.ellipse(px, py, 7 * s, 4 * s, 0, 0, Math.PI * 2); x.fill();
  }
}
function windsock(x, t) {
  const px = 1700, py = 512, L = 150;
  for (let i = 0; i < 4; i++) {
    const u0 = i / 4, u1 = (i + 1) / 4;
    const y = u => py + 14 + u * 22 + Math.sin(t * 7 - u * 6) * 7 * u, h = u => lerp(24, 11, u);
    x.fillStyle = i % 2 ? '#8e8c85' : '#e4e2d8'; x.strokeStyle = 'rgba(10,10,10,0.7)'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(px + u0 * L, y(u0) - h(u0)); x.lineTo(px + u1 * L, y(u1) - h(u1)); x.lineTo(px + u1 * L, y(u1) + h(u1)); x.lineTo(px + u0 * L, y(u0) + h(u0)); x.closePath(); x.fill(); x.stroke();
  }
}
function caption(x, t, text, t0, t1) {
  const n = Math.floor(seg(t, t0 + 0.25, t0 + 0.25 + text.length * 0.045) * text.length);
  if (n <= 0) return;
  const a = 1 - seg(t, t1 - 0.3, t1 - 0.05);
  x.save(); x.globalAlpha = a; x.font = `400 40px ${MONO}`; x.fillStyle = INK; x.textAlign = 'left'; x.textBaseline = 'alphabetic';
  x.shadowColor = 'rgba(0,0,0,0.9)'; x.shadowBlur = 8;
  x.fillText(text.slice(0, n), 170, 980);
  x.fillRect(170, 998, 60 * seg(t, t0, t0 + 0.3), 3);
  x.restore();
}
function airfield(x, t) {
  const u = seg(t, T.air, T.slip);
  const roll = eIn(seg(t, T.roll, T.slip + 0.3));
  const z = lerp(1.04, 1.1, eInOut(u)), pan = roll * 90;
  x.save(); x.translate(960, 640); x.scale(z, z); x.translate(-960 - pan, -640);
  x.drawImage(AIRFIELD, 0, 0);
  flares(x, t); windsock(x, t);
  const om = omega(t), run = clamp(om / 72);

  const flash = [[T.leadEnd, 0.6], [T.air, 0.85], [T.map, 0.85], [T.fin, 0.6]].find(([a]) => t >= a && t < a + 1 / 30);
  if (flash) {
    ctx.fillStyle = `rgba(255,255,250,${flash[1]})`; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, H * 0.18, W, 5);
  }
  ctx.drawImage(VIG, 0, 0);
  // projector lamp dies after the run-out
  const lamp = eInOut(seg(t, T.dark, T.end - 0.06));
  if (lamp > 0) { ctx.fillStyle = `rgba(0,0,0,${lamp})`; ctx.fillRect(0, 0, W, H); }
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgb(${Math.round(14 * (1 - lamp))},${Math.round(14 * (1 - lamp))},${Math.round(13 * (1 - lamp))})`; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}

// ── film texture ──
function buildGrain(seed) {
  const w = 960, h = 540, c = mk(w, h), x = c.getContext('2d'), d = x.createImageData(w, h), r = rng(seed);
  for (let i = 0; i < w * h; i++) { const v = 128 + (r() + r() + r() + r() - 2) * 170; d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = v; d.data[i * 4 + 3] = 255; }
  x.putImageData(d, 0, 0); return c;
}
function buildVig() {
  const c = mk(W, H), x = c.getContext('2d');
  const g = x.createRadialGradient(W / 2, H / 2, H * 0.28, W / 2, H / 2, H * 1.02);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.7, 'rgba(0,0,0,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0.88)');
  x.fillStyle = g; x.fillRect(0, 0, W, H); return c;
}
function noise1(t, seed) {
  const i = Math.floor(t), f = t - i, a = rng(i * 131 + seed)(), b = rng((i + 1) * 131 + seed)();
  return lerp(a, b, f * f * (3 - 2 * f)) * 2 - 1;
}

window.ready = (async () => {
  const sample = 'The Night Mail Takes to the Air WEEKLY PICTORIAL NEWS No. 47 MCMXXXIV THE END HARWICK PORT ELDEN 0123456789 ·—,.';
  await Promise.all([`700 100px ${SERIF}`, `400 100px ${SERIF}`, `italic 400 100px ${SERIF}`, `400 40px ${MONO}`].map(f => document.fonts.load(f, sample)));
  await document.fonts.ready;
  for (let i = 0; i < 8; i++) GRAIN.push(buildGrain(i * 37 + 5));
  VIG = buildVig(); TITLE = buildTitle(); FIN = buildFin(); PLANE = buildPlane(); AIRFIELD = buildAirfield();
  SKY2 = buildSky2(); HILLS = buildHills(); FIELDS = buildFields(); NEAR = buildNear(); MAP = buildMap();
  return true;
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => [{ t: T.lead2, k: 'pop' }, { t: T.t1 + 0.1, k: 'motif' }, { t: T.air, k: 'splice' }, { t: T.cough, k: 'cough' },
  { t: T.catch, k: 'engine', a: T.catch, b: T.full, e: T.map }, { t: T.slip, k: 'slip' }, { t: T.map, k: 'splice' }, { t: T.map + 0.05, k: 'chord' },
  { t: T.fin + 0.05, k: 'low' }, { t: T.run, k: 'runout', e: T.end }];
</script>
