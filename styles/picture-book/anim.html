<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="lib.js"></script>
<script src="chars.js"></script>
<script src="scenes.js"></script>
<script>
// ── picture-book · a children's picture book, gouache + colored pencil on toothy paper ─────────────
// Spread 1: dawn meadow, a little fox wakes (squash → rise with overshoot, ears perk), spots a glinting blue button,
// trots over and picks it up. Page turn (corner peel: the leaf folds across the spine, its back is the next left page).
// Spread 2: parallax woods slide past as she trots on the spot; Bear by a log is missing the middle button of his vest;
// she tosses it, it pops into place, Bear cheers up. Page turn to "The End": both asleep in a sunset vignette. Fade.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BX = 80, BY = 70;                                    // spread position on screen
const T1 = [2.95, 3.8], T2 = [7.6, 8.45], DUR = 10;
const cols = { table: '#6e5242', cover: '#3f5957' };
let BG, OVER, GUT, SA, SB, IL;

function buildBG() {
  BG = mk(W, H); const g = BG.getContext('2d');
  paint(g, poly([[-10, -10], [W + 10, -10], [W + 10, H + 10], [-10, H + 10]]), cols.table, 1, { edge: 0, mottle: 0.5, tsc: 2, ssc: 3, streak: 0.5 });
  // soft drop shadow of the open book
  g.save(); g.shadowColor = 'rgba(25,15,8,0.55)'; g.shadowBlur = 60; g.shadowOffsetY = 22;
  g.fillStyle = cols.cover; g.beginPath(); g.roundRect(BX - 26, BY - 20, SW + 52, SH + 46, 14); g.fill(); g.restore();
  const cover = new Path2D(); cover.roundRect(BX - 26, BY - 20, SW + 52, SH + 46, 14);
  paint(g, cover, cols.cover, 2, { edge: 8, mottle: 0.45 });
  // page-block edges (a stack of leaves seen at the fore-edges)
  for (let i = 5; i >= 1; i--) { g.fillStyle = i % 2 ? '#e2d6bd' : '#efe4cc';
    g.beginPath(); g.moveTo(BX - i * 2.6, BY + i * 1.2); g.lineTo(BX + GX, BY + i * 2.2); g.lineTo(BX + SW + i * 2.6, BY + i * 1.2);
    g.lineTo(BX + SW + i * 2.6, BY + SH + i * 2.4); g.lineTo(BX + GX, BY + SH + i * 3.2); g.lineTo(BX - i * 2.6, BY + SH + i * 2.4); g.closePath(); g.fill(); }
  // vignette on the table
  const v = g.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250); v.addColorStop(0, 'rgba(20,10,5,0)'); v.addColorStop(1, 'rgba(20,10,5,0.45)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}
function buildOverlays() {
  // paper tooth + fibres (static, so nothing boils)
  OVER = mk(SW, SH); { const g = OVER.getContext('2d'), im = g.createImageData(SW, SH), d = im.data, r = rng(99);
    const lo = fbm(512, 91, 8, 3);
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) { const i = (y * SW + x) * 4, n = lo[(y & 511) * 512 + (x & 511)], v = r();
      if (v < 0.03) { d[i] = 255; d[i + 1] = 250; d[i + 2] = 236; d[i + 3] = 30 + v * 800; }          // tooth tops catching light
      else if (v > 0.93) { d[i] = 90; d[i + 1] = 62; d[i + 2] = 40; d[i + 3] = 26 + (v - 0.93) * 500; }   // tooth pits
      else { d[i] = 120; d[i + 1] = 90; d[i + 2] = 60; d[i + 3] = Math.max(0, (n - 0.5) * 34); } }
    g.putImageData(im, 0, 0);
    g.globalAlpha = 0.12; g.strokeStyle = '#8a6a4a'; g.lineWidth = 0.8;
    for (let i = 0; i < 500; i++) { const x = r() * SW, y = r() * SH, a = r() * TAU, l = 6 + r() * 16; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * 0.5, y + Math.sin(a + 1) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); } }
  // gutter: pages dip into the spine and swell towards the fore-edge
  GUT = mk(SW, SH); { const g = GUT.getContext('2d'); const gr = g.createLinearGradient(0, 0, SW, 0);
    const st = [[0, 'rgba(60,40,22,0.16)'], [0.03, 'rgba(60,40,22,0.0)'], [0.36, 'rgba(255,248,230,0.05)'], [0.44, 'rgba(60,40,22,0.05)'], [0.485, 'rgba(60,40,22,0.26)'], [0.5, 'rgba(45,28,15,0.42)'],
      [0.515, 'rgba(60,40,22,0.26)'], [0.56, 'rgba(60,40,22,0.05)'], [0.64, 'rgba(255,248,230,0.05)'], [0.97, 'rgba(60,40,22,0.0)'], [1, 'rgba(60,40,22,0.16)']];
    for (const [o, c] of st) gr.addColorStop(o, c); g.fillStyle = gr; g.fillRect(0, 0, SW, SH); }
  SA = mk(SW, SH); SB = mk(SW, SH); IL = mk(SW, SH);
}
function renderScene(k, cnv, t) { const g = cnv.getContext('2d'); if (k === 0) scene1(g, IL, t); else if (k === 1) scene2(g, IL, t); else scene3(g, IL, t); }

// ── page turn: corner peel across the spine ──
function clipHalf(pts, f) { const out = [];
  for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], fa = f(a), fb = f(b);
    if (fa >= 0) out.push(a); if ((fa >= 0) !== (fb >= 0)) { const u = fa / (fa - fb); out.push([a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]); } }
  return out; }
function turn(g, A, B, p) {
  const e = eInOut(p);
  const C0 = [SW, SH], Pc = [lerp(SW, 0, e), SH - Math.sin(Math.PI * e) * 330 - Math.sin(Math.PI * clamp(e * 3)) * 30];
  const dx = C0[0] - Pc[0], dy = C0[1] - Pc[1], dl = Math.hypot(dx, dy);
  if (dl < 1) { g.drawImage(A, 0, 0); return; }
  const n = [dx / dl, dy / dl], M0 = [(C0[0] + Pc[0]) / 2, (C0[1] + Pc[1]) / 2];
  const sd = q => (q[0] - M0[0]) * n[0] + (q[1] - M0[1]) * n[1];
  const rect = [[GX, 0], [SW, 0], [SW, SH], [GX, SH]];
  const removed = clipHalf(rect, q => sd(q)), kept = clipHalf(rect, q => -sd(q));
  const refl = q => { const d = 2 * sd(q); return [q[0] - d * n[0], q[1] - d * n[1]]; };
  const flap = removed.map(refl);
  // left page and the still-flat part of the right page
  g.drawImage(A, 0, 0, GX, SH, 0, 0, GX, SH);
  if (kept.length > 2) { g.save(); g.clip(poly(kept)); g.drawImage(A, 0, 0); g.restore(); }
  if (removed.length > 2) {
    const rp = poly(removed);
    g.save(); g.clip(rp); g.drawImage(B, 0, 0);
    const sg = g.createLinearGradient(M0[0], M0[1], M0[0] + n[0] * 110, M0[1] + n[1] * 110);
    sg.addColorStop(0, 'rgba(45,28,14,0.38)'); sg.addColorStop(1, 'rgba(45,28,14,0)'); g.fillStyle = sg; g.fillRect(0, 0, SW, SH); g.restore();
    // flap casts a soft shadow, then shows the back of the leaf = next spread's left page
    const fp = poly(flap);
    g.save(); g.shadowColor = 'rgba(40,24,10,0.42)'; g.shadowBlur = 36; g.shadowOffsetX = -n[0] * 14; g.shadowOffsetY = -n[1] * 14 + 6;
    g.fillStyle = C.paper; g.fill(fp); g.restore();
    g.save(); g.clip(fp);
    const R = new DOMMatrix([1 - 2 * n[0] * n[0], -2 * n[0] * n[1], -2 * n[0] * n[1], 1 - 2 * n[1] * n[1], 0, 0]);
    const k = 2 * (M0[0] * n[0] + M0[1] * n[1]); R.e = k * n[0]; R.f = k * n[1];
    const T = R.multiply(new DOMMatrix([-1, 0, 0, 1, 2 * GX, 0]));
    g.save(); g.transform(T.a, T.b, T.c, T.d, T.e, T.f); g.drawImage(B, 0, 0, GX, SH, 0, 0, GX, SH); g.drawImage(OVER, 0, 0, GX, SH, 0, 0, GX, SH); g.restore();
    // curl: bright rolled edge at the fold, fading into a soft shadow across the leaf
    const L0 = dl / 2, fg = g.createLinearGradient(M0[0], M0[1], M0[0] - n[0] * L0, M0[1] - n[1] * L0);
    fg.addColorStop(0, 'rgba(60,38,20,0.30)'); fg.addColorStop(Math.min(0.5, 14 / L0), 'rgba(255,250,236,0.55)'); fg.addColorStop(Math.min(0.7, 60 / L0), 'rgba(255,250,236,0.0)');
    fg.addColorStop(Math.min(0.9, 200 / L0), 'rgba(60,38,20,0.06)'); fg.addColorStop(1, 'rgba(60,38,20,0.14)');
    g.fillStyle = fg; g.fillRect(-SW, -SH, SW * 3, SH * 3);
    g.restore();
    g.save(); g.strokeStyle = 'rgba(90,64,40,0.35)'; g.lineWidth = 1.5; g.stroke(fp); g.restore();
  }
}

window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const z = 1 + 0.022 * eSine(t / DUR); ctx.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z));
  ctx.drawImage(BG, 0, 0);
  ctx.save(); ctx.translate(BX, BY);
  if (t < T1[0]) { renderScene(0, SA, t); ctx.drawImage(SA, 0, 0); }
  else if (t < T1[1]) { renderScene(0, SA, t); renderScene(1, SB, t); turn(ctx, SA, SB, seg(t, T1[0], T1[1])); }
  else if (t < T2[0]) { renderScene(1, SA, t); ctx.drawImage(SA, 0, 0); }
  else if (t < T2[1]) { renderScene(1, SA, t); renderScene(2, SB, t); turn(ctx, SA, SB, seg(t, T2[0], T2[1])); }
  else { renderScene(2, SA, t); ctx.drawImage(SA, 0, 0); }
  // paper tooth over the flat pages (the turning leaf carries its own), then the gutter
  ctx.drawImage(OVER, 0, 0);
  ctx.drawImage(GUT, 0, 0);
  ctx.restore();
  // fade in / out through warm dark
  const f = Math.max(1 - eSine(seg(t, 0, 0.7)), eSine(seg(t, 9.35, 10)));
  if (f > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(34,24,18,${f})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};

// sound cues for audio.py
window.events = () => {
  const ev = [];
  for (const t of [0.55, 0.8, 1.35, 2.3]) ev.push({ k: 'bird', t });
  ev.push({ k: 'wake', t: 1.22 }, { k: 'glint', t: 1.8 }, { k: 'pick', t: 2.83 });
  ev.push({ k: 'turn', t: T1[0], d: T1[1] - T1[0] }, { k: 'turn', t: T2[0], d: T2[1] - T2[0] });
  // footsteps: each time a leg passes through contact (phase multiple of π)
  const steps = (f, a, b) => { let prev = null; for (let t = a; t <= b; t += 1 / 120) { const k = Math.floor(f(t) / Math.PI); if (prev !== null && k !== prev) ev.push({ k: 'step', t }); prev = k; } };
  steps(t => (lerp(1100, 1285, eInOut(seg(t, 2.05, 2.6))) - 1100) / 100 * TAU, 2.05, 2.6);
  steps(t => s2scroll(t) / 150 * TAU, S2.t0, S2.t1 + 0.1);
  ev.push({ k: 'toss', t: 5.82 }, { k: 'pop', t: 6.22 }, { k: 'happy', t: 6.3 }, { k: 'end', t: 8.6 });
  return ev;
};
window.ready = (async () => {
  await document.fonts.load('400 44px "Alegreya"'); await document.fonts.load('italic 400 44px "Alegreya"'); await document.fonts.load('700 150px "Alegreya"');
  await document.fonts.ready;
  initTextures(); initScenes(); buildBG(); buildOverlays();
})();
</script>
</body></html>
