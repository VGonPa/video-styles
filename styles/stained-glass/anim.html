<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── stained-glass · "Morning Light" — a leaded rose window of a sunrise over hills ─────────────────────────
// A dark stone wall with an empty round opening and the maker's chalk cartoon inside it. The window assembles
// piece by piece: green hills slide up, the sun rises in four strips, ray wedges fly in from the rim, the petal
// ring spins open like a mandala, the outer band closes around; each piece clinks in and its lead came traces
// around it. Then the sun comes up behind the glass: the hotspot climbs, colours intensify, bloom grows, and
// coloured beams sweep across the frame through drifting dust. The camera pushes through the sun's glass into a
// gold flash and lands in the hall: the window's coloured light pools on the flagstones, beams cross the frame,
// the title's glass letters drop in and light up one by one. The light fades as a cloud passes.
const W = 1920, H = 1080, TAU = Math.PI * 2, PI = Math.PI;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eSine = u => .5 - .5 * Math.cos(PI * u);
const eBack = (u, c1 = 1.5) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const SERIF = '"Cinzel"', ITAL = '"Cormorant Garamond"';

// ── timeline ─────────────────────────────────────────────────────────────────────────────────────────────
const T = {
  fade0: 0, fade1: .6,
  hills: .45, sun: 1.0, river: 1.2, wedgeIn: 1.3, wedgeOut: 1.55, ring0: 2.0, ring1: 2.95, band: 2.55, jewel: 2.95,
  cart1: 3.3,
  rise0: 3.25, rise1: 5.35, beam0: 3.55,
  push0: 5.3, push1: 6.2, flash: 6.15, b0: 6.13, b1: 6.42,
  let0: 6.6, lit0: 7.25, sub: 8.05,
  end0: 9.15, end1: 9.97
};
const WC = [960, 520];                          // window centre on screen (scene A)
const R0 = 300, R1 = 368, R2 = 400;             // inner scene | petal ring | outer band
const HY = 70, SUN = [0, 82], SR = 94;          // horizon, sun centre and radius (window-local)

// ── geometry helpers ─────────────────────────────────────────────────────────────────────────────────────
const polar = (a, r, c = [0, 0]) => [c[0] + Math.cos(a) * r, c[1] + Math.sin(a) * r];
const arcPts = (c, r, a0, a1, n) => { const o = []; for (let i = 0; i <= n; i++) o.push(polar(lerp(a0, a1, i / n), r, c)); return o; };
const area = P => { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
function clipConvex(subj, clip) {             // Sutherland–Hodgman against a convex polygon
  const sg = Math.sign(area(clip)); let out = subj;
  for (let i = 0; i < clip.length && out.length; i++) {
    const a = clip[i], b = clip[(i + 1) % clip.length], inp = out; out = [];
    const ins = p => ((b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0])) * sg >= 0;
    const X = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1], ex = b[0] - a[0], ey = b[1] - a[1];
      const den = dx * ey - dy * ex, u = ((a[0] - p[0]) * ey - (a[1] - p[1]) * ex) / den; return [p[0] + dx * u, p[1] + dy * u]; };
    for (let j = 0; j < inp.length; j++) {
      const p = inp[j], q = inp[(j + 1) % inp.length], pi = ins(p), qi = ins(q);
      if (pi) { out.push(p); if (!qi) out.push(X(p, q)); } else if (qi) out.push(X(p, q));
    }
  }
  return out;
}
const disc = (r, n = 200) => arcPts([0, 0], r, 0, TAU * (1 - 1 / n), n - 1);
const rect = (x0, y0, x1, y1) => [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
const perim = P => { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += Math.hypot(b[0] - a[0], b[1] - a[1]); } return s; };
const centroid = P => { let x = 0, y = 0; for (const p of P) { x += p[0]; y += p[1]; } return [x / P.length, y / P.length]; };

// ── the window: pieces in z-order ─────────────────────────────────────────────────────────────────────────
const PIECES = [];
const prnd = rng(7);
function addPiece(pts, col, o) {
  if (!pts || pts.length < 3 || Math.abs(area(pts)) < 60) return null;
  const c = centroid(pts);
  const p = Object.assign({ pts, col: hex(col), c, len: perim(pts), kind: 'slide', dur: .5,
    from: [0, 0], rot: 0, vary: .9 + prnd() * .2, tex: [prnd() * 512, prnd() * 512, prnd() * TAU, .7 + prnd() * .6] }, o);
  const path = new Path2D(); path.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) path.lineTo(pts[i][0], pts[i][1]); path.closePath();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const q of pts) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
  const ga = prnd() * TAU, gr = Math.max(x1 - x0, y1 - y0) / 2, gx = Math.cos(ga) * gr, gy = Math.sin(ga) * gr;
  p.grad = ctx.createLinearGradient(c[0] - gx, c[1] - gy, c[0] + gx, c[1] + gy);
  p.grad.addColorStop(0, 'rgba(255,248,230,.16)'); p.grad.addColorStop(.55, 'rgba(0,0,0,0)'); p.grad.addColorStop(1, 'rgba(0,0,0,.24)');
  p.path = path; PIECES.push(p); return p;
}
function buildWindow() {
  const D0 = disc(R0);
  // sky wedges fanning out of the sun: gold / amber rays alternate with ruby / cobalt sky
  const sky = clipConvex(D0, rect(-500, -500, 500, HY + 30));
  const NW = 14;
  for (let i = 0; i < NW; i++) {
    const a0 = PI + PI * i / NW, a1 = PI + PI * (i + 1) / NW, am = (a0 + a1) / 2, ray = i % 2 === 0;
    const dir = [Math.cos(am), Math.sin(am)], rot = (i < NW / 2 ? -1 : 1) * .35;
    const inner = [...arcPts(SUN, 80, a0, a1, 6), ...arcPts(SUN, 188, a1, a0, 10)];
    const outer = clipConvex([...arcPts(SUN, 188, a0, a1, 10), polar(a1, 900, SUN), polar(a0, 900, SUN)], sky);
    const dly = Math.abs(i - (NW - 1) / 2) / NW * .5;
    addPiece(clipConvex(inner, sky), ray ? '#f7c948' : '#c42a3c', { from: [dir[0] * 420, dir[1] * 420], rot, ta: T.wedgeIn + dly, g: 'wedge' });
    addPiece(outer, ray ? '#f09a26' : (i % 4 === 1 ? '#1d49b0' : '#2b3a9e'), { from: [dir[0] * 520, dir[1] * 520], rot: rot * 1.2, ta: T.wedgeOut + dly, g: 'wedge' });
  }
  // the sun, cut into four horizontal strips, rising from behind the hills
  const cut = [-SR, -54, -20, 14, SR]; const sc = ['#fff1a8', '#ffd84e', '#ffb62e', '#ff9420'];
  const SD = arcPts(SUN, SR, 0, TAU * (1 - 1 / 90), 89);
  for (let k = 0; k < 4; k++) addPiece(clipConvex(SD, rect(-200, SUN[1] + cut[k], 200, SUN[1] + cut[k + 1])), sc[k],
    { from: [0, 260], rot: 0, ta: T.sun + k * .08, g: 'sun', dur: .55 });
  // hills: three wavy bands cut into slanted columns
  const hl = [x => HY - 6 + 16 * Math.sin(x * .012 + .8) + 10 * Math.sin(x * .027 + 2.1),
              x => HY + 88 + 18 * Math.sin(x * .010 + 2.6) + 8 * Math.sin(x * .031),
              x => HY + 166 + 16 * Math.sin(x * .013 + 4.0) + 7 * Math.sin(x * .029 + 1),
              x => 430];
  const cols = [[-420, -200, -55, 105, 250, 420], [-420, -245, -95, 60, 210, 420], [-420, -150, 15, 175, 420]];
  const pal = [['#46a65e', '#6aae48', '#3c9466', '#5aa652', '#4a9c60'], ['#237a4a', '#338c44', '#1d6f54', '#2c8248', '#247c50'], ['#155c3a', '#1f6c36', '#124f42', '#1b6538']];
  for (let b = 2; b >= 0; b--) {                        // near band first (they stack up from the bottom)
    const top = hl[b], bot = hl[b + 1], cx = cols[b];
    for (let j = 0; j < cx.length - 1; j++) {
      const xl = cx[j], xr = cx[j + 1], sl = j === 0 ? 0 : 28, sr = j === cx.length - 2 ? 0 : 28, pts = [];
      for (let k = 0; k <= 16; k++) { const x = lerp(xl, xr, k / 16); pts.push([x, top(x)]); }
      for (let k = 0; k <= 16; k++) { const x = lerp(xr + sr, xl + sl, k / 16); pts.push([x, bot(x)]); }
      const p = addPiece(clipConvex(pts, D0), pal[b][j % pal[b].length],
        { from: [(j - 2) * 30, 330], rot: (j - 2) * .08, ta: T.hills + (2 - b) * .16 + j * .045, g: 'hill', z: b });
    }
  }
  // hills must sit above the sky and sun in z-order: move them after (they were added last anyway), then the river
  const rv = (y0, y1) => { const L = [], Rr = [];
    for (let k = 0; k <= 20; k++) { const y = lerp(y0, y1, k / 20), d = y - HY, x = -10 + 38 * Math.sin(d * .02 + .3) - d * .12, w = 4 + Math.max(0, d - 50) * .2;
      L.push([x - w, y]); Rr.push([x + w, y]); }
    return [...L, ...Rr.reverse()]; };
  addPiece(clipConvex(rv(HY + 52, HY + 168), D0), '#8cc4ee', { from: [0, 300], ta: T.river, g: 'river' });
  addPiece(clipConvex(rv(HY + 168, 430), D0), '#5e9fe0', { from: [0, 300], ta: T.river + .07, g: 'river' });
  // petal ring: 16 pointed petals (ruby / cobalt) with emerald spandrels between them
  const NP = 16, hw = PI / NP;
  const edge = (a0, am) => { const o = []; for (let k = 0; k <= 12; k++) { const u = k / 12; o.push(polar(a0 + (am - a0) * u * u, R0 + (R1 - R0) * u)); } return o; };
  for (let i = 0; i < NP; i++) {
    const a0 = -PI / 2 + i * 2 * hw, am = a0 + hw, a1 = a0 + 2 * hw;
    const petal = [...edge(a0, am), ...edge(a1, am).reverse().slice(1), ...arcPts([0, 0], R0, a1, a0, 8).slice(1, -1)];
    addPiece(petal, i % 2 ? '#2450b8' : '#b81f3c', { kind: 'ring', idx: i, ta: T.ring0 + i * .03, dur: .7, g: 'petal' });
  }
  for (let i = 0; i < NP; i++) {
    const b = -PI / 2 + i * 2 * hw, amL = b - hw, amR = b + hw;
    const sp = [...edge(b, amL).reverse(), ...edge(b, amR).slice(1), ...arcPts([0, 0], R1, amR, amL, 8).slice(1, -1)];
    addPiece(sp, i % 2 ? '#2a9a5e' : '#1f8455', { kind: 'ring', idx: i, ta: T.ring0 + .12 + i * .03, dur: .7, g: 'spandrel' });
  }
  // outer band: 32 segments closing around the rim, cobalt / amethyst
  for (let i = 0; i < 32; i++) {
    const a0 = -PI / 2 + i * TAU / 32, a1 = a0 + TAU / 32, am = (a0 + a1) / 2;
    addPiece([...arcPts([0, 0], R1, a0, a1, 6), ...arcPts([0, 0], R2, a1, a0, 6)], i % 2 ? '#6b2f90' : '#1b3c9c',
      { from: [Math.cos(am) * 90, Math.sin(am) * 90], ta: T.band + i * .018, dur: .35, g: 'band' });
  }
  // amber jewels set in each petal
  for (let i = 0; i < NP; i++) {
    const am = -PI / 2 + i * 2 * hw + hw, c = polar(am, 331);
    addPiece(arcPts(c, 14, 0, TAU * 23 / 24, 23), i % 2 ? '#f4b632' : '#ffd65a', { kind: 'pop', ta: T.jewel + i * .02, dur: .35, g: 'jewel' });
  }
}
// z-order: sky, sun, hills, river, ring … (hills were pushed after the sun, as built)

// ── textures ─────────────────────────────────────────────────────────────────────────────────────────────
const L = {};
function tileNoise(n, cells, r) {             // periodic value noise, 0..1
  const g = []; for (let i = 0; i < cells * cells; i++) g.push(r());
  const at = (i, j) => g[((j % cells + cells) % cells) * cells + ((i % cells + cells) % cells)];
  const out = new Float32Array(n * n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const fx = x / n * cells, fy = y / n * cells, i = Math.floor(fx), j = Math.floor(fy), u = eSine(fx - i), v = eSine(fy - j);
    out[y * n + x] = lerp(lerp(at(i, j), at(i + 1, j), u), lerp(at(i, j + 1), at(i + 1, j + 1), u), v);
  }
  return out;
}
function buildGlass() {                        // grey overlay texture: thickness, streaks, bubbles (tileable)
  const n = 512, c = mk(n, n), x = c.getContext('2d'), r = rng(11);
  const a = tileNoise(n, 4, r), b = tileNoise(n, 12, r), d = tileNoise(n, 32, r);
  const im = x.createImageData(n, n);
  for (let i = 0; i < n * n; i++) {
    const yy = Math.floor(i / n), xx = i % n;
    const streak = Math.sin((yy + 18 * Math.sin(xx / n * TAU * 2 + a[i] * 3)) / n * TAU * 26) * .5 + Math.sin((yy + 9 * Math.sin(xx / n * TAU * 3)) / n * TAU * 61) * .3;
    const v = 128 + (a[i] - .5) * 96 + (b[i] - .5) * 46 + (d[i] - .5) * 18 + streak * 14;
    im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = clamp(v, 0, 255); im.data[i * 4 + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  for (let k = 0; k < 150; k++) {              // seed bubbles: bright core, dark rim
    const bx = r() * n, by = r() * n, br = .8 + Math.pow(r(), 3) * 5;
    for (const ox of [-n, 0, n]) for (const oy of [-n, 0, n]) {
      x.beginPath(); x.arc(bx + ox, by + oy, br, 0, TAU); x.strokeStyle = 'rgba(40,40,40,.5)'; x.lineWidth = .9; x.stroke();
      x.beginPath(); x.arc(bx + ox - br * .3, by + oy - br * .3, br * .45, 0, TAU); x.fillStyle = 'rgba(255,255,255,.55)'; x.fill();
    }
  }
  L.glass = c; L.pat = ctx.createPattern(c, 'repeat');
}
function stone(x, r, x0, y0, w, h, base, var_, mortar) {   // one ashlar block with chips and mottling
  const t = base + (r() - .5) * var_;
  x.fillStyle = `rgb(${t * 1.05 | 0},${t | 0},${t * .9 | 0})`; x.fillRect(x0, y0, w, h);
  const g = x.createLinearGradient(x0, y0, x0, y0 + h); g.addColorStop(0, 'rgba(255,240,220,.06)'); g.addColorStop(1, 'rgba(0,0,0,.14)');
  x.fillStyle = g; x.fillRect(x0, y0, w, h);
  for (let k = 0; k < w * h / 900; k++) { x.fillStyle = r() < .5 ? 'rgba(0,0,0,.08)' : 'rgba(255,245,230,.05)'; x.beginPath(); x.arc(x0 + r() * w, y0 + r() * h, 1 + r() * 7, 0, TAU); x.fill(); }
  x.strokeStyle = mortar; x.lineWidth = 2.5; x.strokeRect(x0 + 1, y0 + 1, w - 2, h - 2);
}
function speckle(c, amt, seed) {
  const x = c.getContext('2d'), im = x.getImageData(0, 0, c.width, c.height), r = rng(seed);
  for (let i = 0; i < im.data.length; i += 4) { const v = (r() - .5) * amt; im.data[i] += v; im.data[i + 1] += v; im.data[i + 2] += v; }
  x.putImageData(im, 0, 0);
}
function buildWall() {                         // scene A: ashlar wall with a moulded round opening
  const c = mk(W, H), x = c.getContext('2d'), r = rng(21);
  x.fillStyle = '#1a1714'; x.fillRect(0, 0, W, H);
  for (let y = -40, row = 0; y < H; y += 92, row++) for (let xx = -r() * 200; xx < W;) { const w = 150 + r() * 130; stone(x, r, xx, y, w, 92, 46, 12, '#231e19'); xx += w; }
  speckle(c, 18, 3);
  // voussoirs + moulding around the opening
  x.save(); x.translate(WC[0], WC[1]);
  x.beginPath(); x.arc(0, 0, 505, 0, TAU); x.fillStyle = '#1a1714'; x.fill();
  for (let i = 0; i < 28; i++) {
    const a0 = i * TAU / 28, a1 = a0 + TAU / 28, t = 72 + (r() - .5) * 14;
    x.beginPath(); x.arc(0, 0, 500, a0 + .004, a1 - .004); x.arc(0, 0, 440, a1 - .005, a0 + .005, true); x.closePath();
    x.fillStyle = `rgb(${t * 1.05 | 0},${t | 0},${t * .9 | 0})`; x.fill();
  }
  const ring = (r0, r1, c0, c1) => { const g = x.createRadialGradient(0, 0, r0, 0, 0, r1); g.addColorStop(0, c0); g.addColorStop(1, c1);
    x.beginPath(); x.arc(0, 0, r1, 0, TAU); x.arc(0, 0, r0, 0, TAU, true); x.fillStyle = g; x.fill(); };
  ring(430, 442, '#2a241f', '#5a5046'); ring(414, 430, '#6e6256', '#3c342d'); ring(400, 414, '#231e1a', '#4a4038');
  x.beginPath(); x.arc(0, 0, R2 + 1, 0, TAU); x.fillStyle = '#070912'; x.fill();   // the empty opening before dawn
  const og = x.createRadialGradient(0, 120, 20, 0, 0, R2); og.addColorStop(0, 'rgba(40,52,96,.55)'); og.addColorStop(1, 'rgba(10,12,30,0)');
  x.fillStyle = og; x.fill();
  x.restore();
  // soft darkness toward the corners
  const v = x.createRadialGradient(WC[0], WC[1], 380, WC[0], WC[1], 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  L.wall = c;
  // the maker's chalk cartoon of every piece, drawn in the opening
  const k = mk(W, H), y = k.getContext('2d'); y.translate(WC[0], WC[1]);
  y.strokeStyle = 'rgba(214,205,186,.5)'; y.lineWidth = 1.4; y.setLineDash([7, 5]);
  for (const p of PIECES) y.stroke(p.path);
  y.setLineDash([]); y.beginPath(); y.arc(0, 0, R2, 0, TAU); y.stroke();
  L.cartoon = k;
}
function floorPath(x, r, bright) {             // scene B: back wall + flagstone floor in perspective
  const VP = [960, 300], FY = 540;
  x.fillStyle = '#16130f'; x.fillRect(0, 0, W, H);
  for (let y = -30; y < FY; y += 86) for (let xx = -r() * 200; xx < W;) { const w = 140 + r() * 120; stone(x, r, xx, y, w, 86, bright ? 170 : 40, bright ? 26 : 10, bright ? '#6a5e50' : '#1d1915'); xx += w; }
  x.fillStyle = bright ? '#5a5046' : '#0d0b09'; x.fillRect(0, FY - 10, W, 14);
  // flagstones: rows by depth, columns converging on the vanishing point
  const rows = []; for (let z = 1; z < 14; z++) rows.push(FY + (H - FY) * (1 / (1 + (14 - z) * .45)));
  const ys = [FY, ...rows, H + 40];
  for (let j = 0; j < ys.length - 1; j++) {
    const y0 = ys[j], y1 = ys[j + 1], off = (j % 2) * .5;
    for (let i = -14; i <= 14; i++) {
      const u0 = (i + off) * 150, u1 = (i + 1 + off) * 150;
      const px = (u, y) => VP[0] + u * (y - VP[1]) / (H - VP[1]);
      x.beginPath(); x.moveTo(px(u0, y0), y0); x.lineTo(px(u1, y0), y0); x.lineTo(px(u1, y1), y1); x.lineTo(px(u0, y1), y1); x.closePath();
      const t = (bright ? 176 : 46) + (r() - .5) * (bright ? 40 : 14);
      x.fillStyle = `rgb(${t * 1.04 | 0},${t | 0},${t * .9 | 0})`; x.fill();
      x.strokeStyle = bright ? '#6a5e50' : '#0c0a08'; x.lineWidth = 1 + (y0 - FY) / 90; x.stroke();
    }
  }
}
function buildHall() {
  const a = mk(W, H); floorPath(a.getContext('2d'), rng(31), false); speckle(a, 16, 5);
  const ax = a.getContext('2d'), fl = ax.createLinearGradient(0, 520, 0, H); fl.addColorStop(0, 'rgba(0,0,0,.35)'); fl.addColorStop(1, 'rgba(0,0,0,0)');
  ax.fillStyle = fl; ax.fillRect(0, 520, W, H - 520);
  L.hall = a;
  const b = mk(W, H); floorPath(b.getContext('2d'), rng(31), true); speckle(b, 30, 6);
  // the rose window's coloured light projected onto the floor (lead lines cast soft shadows)
  const win = mk(900, 900), wx = win.getContext('2d'); wx.translate(450, 450); drawWindowPieces(wx, 99, true);

  const lands = PIECES.map(p => ({ t: +(p.ta + p.dur * .7).toFixed(3), g: p.g })).sort((a, b) => a.t - b.t);
  let last = -1;
  for (const l of lands) if (l.t - last > .05) { ev.push({ t: l.t, k: 'clink', g: l.g }); last = l.t; }
  ev.push({ t: T.ring0, k: 'spin' }, { t: T.ring1 + .05, k: 'chord', n: 0 }, { t: T.rise0, k: 'swell' });
  ev.push({ t: T.push0, k: 'rise' }, { t: T.flash - .03, k: 'flash' }, { t: T.b0 + .2, k: 'chord', n: 1 });
  for (let i = 0; i < 12; i++) ev.push({ t: T.let0 + i * .06 + .3, k: 'tick', i });
  for (let i = 0; i < 12; i++) ev.push({ t: T.lit0 + i * .075 + .15, k: 'bell', i });
  ev.push({ t: T.sub, k: 'chime' }, { t: T.end0, k: 'fall' });
  return ev;
};
