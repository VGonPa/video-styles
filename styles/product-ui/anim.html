<html lang="en"><head><meta charset="utf-8">

<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── product-ui · SaaS / app launch product demo ─────────────────────────────────────────
// A fictional habit & workout planner ("Weekflow"). Headline → the desktop app rises in on a soft gradient →
// the cursor drags a "Strength" session into Wednesday (lift, shrink-to-slot, snap) → the weekly-goal ring completes →
// camera zooms onto "Reminders" with depth-of-field, the toggle flips, a "Smart reminders" callout pops →
// the cursor opens the Streak card, which morphs (shared element) into a detail view; counters tick up, the streak
// rolls 11 → 12, "Personal best" checks in → the whole window morphs into a phone, a reminder banner drops in,
// logo lockup + tagline → clean fade. Everything is vector, redrawn per t (crisp under zoom); shadows are cached 9-slice sprites.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eOut5 = u => 1 - Math.pow(1 - u, 5);
const eIn = u => u * u * u;
const eBack = (u, s = 1.70158) => { const v = u - 1; return 1 + (s + 1) * v * v * v + s * v * v; };
const spring = (u, k = 7, w = 13) => u <= 0 ? 0 : u >= 1 ? 1 : 1 - Math.exp(-k * u) * Math.cos(w * u) * (1 - u) - 0 * u;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

const F = '"Plus Jakarta Sans"';
const INK = '#15162B', SUB = '#686C85', MUTED = '#9C9FB4', LINE = '#E8E9F1', FAINT = '#F6F6FA';
const ACC = '#5B4CF0', ACC_D = '#4436D6', ACC_L = '#EEEBFF', ACC_M = '#C9C2FF';
const RUN = '#F28A55', YOGA = '#2DB894', SWIM = '#4AA8E8', FLAME = '#FF7A45';

// ── timeline ──
const T = {
  badge: .12, h1: .32, h1Up: 1.0, h1UpEnd: 1.6, win: 1.28, winEnd: 2.15,
  cur0: 1.98, grab: 2.5, press: 2.56, drop: 3.38, ring: 3.52, ringEnd: 4.05,
  h1Out: 3.75, zoomA: 3.85, zoomAEnd: 4.45, tog: 4.36, callout: 4.58, calloutOut: 5.12,
  toStreak: 5.15, streakClick: 5.74, morph: 5.8, morphEnd: 6.35,
  zoomB: 6.42, zoomBEnd: 7.0, roll: 6.78, best: 7.02, pull: 7.42, pullEnd: 7.92,
  phone: 7.9, phoneEnd: 8.7, lock: 8.3, notif: 8.78, fadeA: 9.35, fadeB: 10.0,
};
const WX = 240, WY = 210, WW = 1440, WH = 820;          // desktop window (world coords)
const PH = { x: 1210, y: 107, w: 400, h: 866, r: 62 };  // phone rect
// layout (window-relative)
const LIB = { x: 272, y: 206, w: 300, h: 76, gap: 90 };
const CAL = { x0: 640, x1: 1408, top: 236, rowH: 118, rows: 3 };
const colW = (CAL.x1 - CAL.x0) / 7;
const block = (col, row) => ({ x: CAL.x0 + col * colW + 6, y: CAL.top + row * CAL.rowH + 6, w: colW - 12, h: CAL.rowH - 12 });
const GOAL = { x: 272, y: 640, w: 400, h: 150 }, REM = { x: 696, y: 640, w: 340, h: 150 }, STK = { x: 1060, y: 640, w: 348, h: 150 };
const TOG = { x: REM.x + REM.w - 88, y: REM.y + 24, w: 62, h: 34 };
const MAIN = { x: 240, y: 52, w: 1200, h: 768 };
const SESS = [
  { name: 'Morning run', short: 'Run', dur: '30 min', col: RUN, g: 'run' },
  { name: 'Yoga flow', short: 'Yoga', dur: '20 min', col: YOGA, g: 'yoga' },
  { name: 'Strength', short: 'Strength', dur: '45 min', col: ACC, g: 'lift' },
  { name: 'Swim', short: 'Swim', dur: '40 min', col: SWIM, g: 'swim' },
];
const PLANNED = [[0, 0, 0, true], [1, 1, 1, true], [4, 0, 3, false]]; // col,row,session,done
const TARGET = block(2, 2);
const GRAB = { x: LIB.x + 58, y: LIB.y + 2 * LIB.gap + 38 };

// ── helpers ──
function rr(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.roundRect(x, y, w, h, r); }
function tx(g, s, x, y, size, weight = 600, color = INK, align = 'left', ls = 0) {
  g.font = `${weight} ${size}px ${F}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic';
  g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.letterSpacing = '0px';
}
function tw(g, s, size, weight = 600, ls = 0) { g.font = `${weight} ${size}px ${F}`; g.letterSpacing = ls + 'px'; const w = g.measureText(s).width; g.letterSpacing = '0px'; return w; }
// cached 9-slice soft shadows (blur is computed once per radius/blur pair)
const SHC = {};
function shadowSprite(r, b) {
  const k = r + '_' + b; if (SHC[k]) return SHC[k];
  const p = Math.ceil(b * 2.4), core = 2 * r + 4, s = core + 2 * p, c = mk(s, s), g = c.getContext('2d');
  g.shadowColor = 'rgb(28,24,78)'; g.shadowBlur = b; g.shadowOffsetX = 4000; g.fillStyle = '#000';
  rr(g, p - 4000, p, core, core, r); g.fill();
  return SHC[k] = { c, p, r, s };
}
function shadow(g, x, y, w, h, r, b, a, dy = 0) {
  if (a <= 0.002) return;
  r = Math.round(Math.min(r, w / 2, h / 2)); const S = shadowSprite(r, b), p = S.p, cs = p + r + 1;
  const X = x - p, Y = y - p + dy, Wd = w + 2 * p, Hd = h + 2 * p, mw = Math.max(0, Wd - 2 * cs), mh = Math.max(0, Hd - 2 * cs);
  const src = [0, cs, S.s - cs], srw = [cs, S.s - 2 * cs, cs], dx = [X, X + cs, X + cs + mw], dw = [cs, mw, cs], dyy = [Y, Y + cs, Y + cs + mh], dh = [cs, mh, cs];
  g.save(); g.globalAlpha *= a;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (dw[i] > 0 && dh[j] > 0) g.drawImage(S.c, src[i], src[j], srw[i], srw[j], dx[i], dyy[j], dw[i], dh[j]);
  g.restore();
}
const elev = (g, x, y, w, h, r, k = 1) => { shadow(g, x, y, w, h, r, 36, .10 * k, 18 * k); shadow(g, x, y, w, h, r, 6, .07 * k, 2); };
function check(g, cx, cy, s, u, color, lw) { // drawn checkmark, u = 0..1
  if (u <= 0) return; const P = [[-.42, .02], [-.12, .32], [.44, -.3]];
  const l1 = Math.hypot(P[1][0] - P[0][0], P[1][1] - P[0][1]), l2 = Math.hypot(P[2][0] - P[1][0], P[2][1] - P[1][1]), L = (l1 + l2) * u;
  g.save(); g.strokeStyle = color; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); g.moveTo(cx + P[0][0] * s, cy + P[0][1] * s);
  if (L <= l1) { const f = L / l1; g.lineTo(cx + lerp(P[0][0], P[1][0], f) * s, cy + lerp(P[0][1], P[1][1], f) * s); }
  else { g.lineTo(cx + P[1][0] * s, cy + P[1][1] * s); const f = (L - l1) / l2; g.lineTo(cx + lerp(P[1][0], P[2][0], f) * s, cy + lerp(P[1][1], P[2][1], f) * s); }
  g.stroke(); g.restore();
}
function flame(g, cx, cy, s, color) {
  g.save(); g.translate(cx, cy); g.scale(s / 100, s / 100); g.fillStyle = color; g.beginPath();
  g.moveTo(0, -50); g.bezierCurveTo(10, -22, 40, -12, 38, 16); g.bezierCurveTo(36, 40, 18, 50, 0, 50); g.bezierCurveTo(-20, 50, -38, 38, -38, 14);
  g.bezierCurveTo(-38, -4, -26, -14, -18, -26); g.bezierCurveTo(-14, -10, -6, -6, -2, -8); g.bezierCurveTo(-2, -24, -6, -38, 0, -50); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(2, 4); g.bezierCurveTo(10, 16, 20, 22, 18, 34); g.bezierCurveTo(16, 44, 6, 48, 0, 48);
  g.bezierCurveTo(-10, 48, -18, 40, -17, 30); g.bezierCurveTo(-16, 20, -6, 16, 2, 4); g.fill(); g.restore();
}
function glyph(g, kind, cx, cy, s, color) {
  g.save(); g.translate(cx, cy); g.strokeStyle = color; g.fillStyle = color; g.lineWidth = s * .13; g.lineCap = 'round'; g.lineJoin = 'round';
  if (kind === 'run') { g.beginPath(); g.moveTo(-s * .32, -s * .28); g.lineTo(0, 0); g.lineTo(-s * .32, s * .28); g.moveTo(s * .02, -s * .28); g.lineTo(s * .34, 0); g.lineTo(s * .02, s * .28); g.stroke(); }
  else if (kind === 'yoga') { g.beginPath(); g.arc(0, -s * .2, s * .12, 0, TAU); g.fill(); g.beginPath(); g.moveTo(-s * .36, s * .26); g.quadraticCurveTo(0, s * .02, s * .36, s * .26); g.moveTo(0, -s * .04); g.lineTo(0, s * .14); g.stroke(); }
  else if (kind === 'lift') { g.beginPath(); g.moveTo(-s * .24, 0); g.lineTo(s * .24, 0); g.stroke(); rr(g, -s * .4, -s * .2, s * .12, s * .4, s * .04); g.fill(); rr(g, s * .28, -s * .2, s * .12, s * .4, s * .04); g.fill(); }
  else if (kind === 'swim') { g.beginPath(); for (let k = 0; k < 2; k++) { const yy = -s * .1 + k * s * .24; g.moveTo(-s * .36, yy); g.bezierCurveTo(-s * .2, yy - s * .14, -s * .06, yy + s * .14, s * .06, yy); g.bezierCurveTo(s * .18, yy - s * .14, s * .3, yy + s * .1, s * .38, yy); } g.stroke(); }
  else if (kind === 'bell') { g.beginPath(); g.moveTo(-s * .3, s * .18); g.quadraticCurveTo(-s * .26, -s * .36, 0, -s * .36); g.quadraticCurveTo(s * .26, -s * .36, s * .3, s * .18); g.closePath(); g.fill(); g.beginPath(); g.arc(0, s * .28, s * .08, 0, TAU); g.fill(); }
  else if (kind === 'today') { g.beginPath(); g.arc(0, 0, s * .32, 0, TAU); g.stroke(); g.beginPath(); g.moveTo(0, -s * .16); g.lineTo(0, 0); g.lineTo(s * .12, s * .08); g.stroke(); }
  else if (kind === 'plan') { rr(g, -s * .34, -s * .28, s * .68, s * .6, s * .1); g.stroke(); g.beginPath(); g.moveTo(-s * .34, -s * .08); g.lineTo(s * .34, -s * .08); g.moveTo(-s * .16, -s * .4); g.lineTo(-s * .16, -s * .2); g.moveTo(s * .16, -s * .4); g.lineTo(s * .16, -s * .2); g.stroke(); }
  else if (kind === 'stats') { g.beginPath(); g.moveTo(-s * .26, s * .3); g.lineTo(-s * .26, s * .02); g.moveTo(0, s * .3); g.lineTo(0, -s * .3); g.moveTo(s * .26, s * .3); g.lineTo(s * .26, -s * .1); g.stroke(); }
  else if (kind === 'lib') { rr(g, -s * .32, -s * .3, s * .64, s * .24, s * .06); g.stroke(); rr(g, -s * .32, s * .06, s * .64, s * .24, s * .06); g.stroke(); }
  else if (kind === 'gear') { g.beginPath(); g.arc(0, 0, s * .14, 0, TAU); g.stroke(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6; g.beginPath(); g.moveTo(Math.cos(a) * s * .24, Math.sin(a) * s * .24); g.lineTo(Math.cos(a) * s * .34, Math.sin(a) * s * .34); g.stroke(); } }
  g.restore();
}
function logoMark(g, x, y, s) {
  const gr = g.createLinearGradient(x, y, x + s, y + s); gr.addColorStop(0, '#7A6BFF'); gr.addColorStop(1, ACC_D);
  rr(g, x, y, s, s, s * .28); g.fillStyle = gr; g.fill();
  g.save(); g.strokeStyle = '#fff'; g.lineWidth = s * .12; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  g.moveTo(x + s * .22, y + s * .36); g.lineTo(x + s * .36, y + s * .68); g.lineTo(x + s * .5, y + s * .44); g.lineTo(x + s * .64, y + s * .68); g.lineTo(x + s * .78, y + s * .36); g.stroke(); g.restore();
}
function avatar(g, cx, cy, r, ini, bg, fg) { g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fillStyle = bg; g.fill(); tx(g, ini, cx, cy + r * .36, r * .9, 700, fg, 'center'); }
function toggle(g, x, y, w, h, u) {
  const on = u; rr(g, x, y, w, h, h / 2);
  g.fillStyle = on > 0 ? mixHex('#DADCE6', ACC, on) : '#DADCE6'; g.fill();
  const r = h / 2 - 4, kx = lerp(x + 4 + r, x + w - 4 - r, eBack(clamp(on), 1.4)), stretch = Math.sin(Math.PI * clamp(on)) * 8;
  shadow(g, kx - r - stretch / 2, y + 4, 2 * r + stretch, 2 * r, r, 4, .25, 1.5);
  rr(g, kx - r - stretch / 2, y + 4, 2 * r + stretch, 2 * r, r); g.fillStyle = '#fff'; g.fill();
}
function mixHex(a, b, u) { const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], u))).join(',')})`; }

// ── background (precomputed) ──
let BG = null;
function buildBG() {
  const c = mk(W, H), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, '#F5F3FF'); gr.addColorStop(.55, '#F7F8FC'); gr.addColorStop(1, '#EAF1FF');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // dotted grid with radial falloff
  const d = mk(W, H), dg = d.getContext('2d'); dg.fillStyle = 'rgba(80,80,140,.16)';
  for (let y = 18; y < H; y += 36) for (let x = 18; x < W; x += 36) { dg.beginPath(); dg.arc(x, y, 1.4, 0, TAU); dg.fill(); }
  dg.globalCompositeOperation = 'destination-in'; const rg = dg.createRadialGradient(W / 2, H * .45, 100, W / 2, H * .45, 1000);
  rg.addColorStop(0, 'rgba(0,0,0,.9)'); rg.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = rg; dg.fillRect(0, 0, W, H);
  g.drawImage(d, 0, 0);
  return c;
}
function drawBG(g, t) {
  g.drawImage(BG, 0, 0);
  const blob = (x, y, r, col, a) => { const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, col.replace('A', a)); rg.addColorStop(1, col.replace('A', 0)); g.fillStyle = rg; g.fillRect(x - r, y - r, 2 * r, 2 * r); };
  blob(420 + 60 * Math.sin(t * .5), 260 + 30 * Math.cos(t * .4), 620, 'rgba(124,108,255,A)', .20);
  blob(1560 - 50 * Math.sin(t * .45), 820 + 30 * Math.sin(t * .6), 700, 'rgba(90,170,255,A)', .16);
  blob(1500 + 40 * Math.cos(t * .3), 180, 420, 'rgba(255,140,190,A)', .08);
}

// ── desktop app ──
function libCard(g, x, y, w, h, s, lift = 0) {
  if (lift > 0) { shadow(g, x, y, w, h, 14, 34, .24 * lift, 22 * lift); shadow(g, x, y, w, h, 14, 8, .1 * lift, 4); }
  elev(g, x, y, w, h, 14, .35 * (1 - lift));
  rr(g, x, y, w, h, 14); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = lift > 0 ? mixHex('#E8E9F1', ACC, lift * .6) : LINE; g.lineWidth = lift > 0 ? 1.5 : 1; g.stroke();
  rr(g, x + 14, y + 14, 48, 48, 12); g.fillStyle = s.col + '22'; g.fill(); glyph(g, s.g, x + 38, y + 38, 26, s.col);
  tx(g, s.name, x + 78, y + 35, 18, 700, INK); tx(g, s.dur, x + 78, y + 58, 14, 500, SUB);
  // drag handle
  g.fillStyle = '#C5C8D6'; for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { g.beginPath(); g.arc(x + w - 30 + j * 8, y + 30 + i * 8, 1.8, 0, TAU); g.fill(); }
}
function calBlock(g, b, s, done, a = 1, glow = 0) {
  g.save(); g.globalAlpha *= a;
  rr(g, b.x, b.y, b.w, b.h, 12); g.fillStyle = mixHex('#FFFFFF', s.col, .12); g.fill();
  rr(g, b.x, b.y, 4, b.h, 2); g.save(); rr(g, b.x, b.y, b.w, b.h, 12); g.clip(); g.fillStyle = s.col; g.fillRect(b.x, b.y, 4, b.h); g.restore();
  tx(g, s.short, b.x + 14, b.y + 30, 15, 700, INK); tx(g, s.dur, b.x + 14, b.y + 50, 13, 500, SUB);
  glyph(g, s.g, b.x + 26, b.y + b.h - 26, 20, s.col);
  if (done) { g.beginPath(); g.arc(b.x + b.w - 20, b.y + 20, 9, 0, TAU); g.fillStyle = s.col; g.fill(); check(g, b.x + b.w - 20, b.y + 20, 11, 1, '#fff', 2.2); }
  if (glow > 0) { rr(g, b.x - 4 * glow, b.y - 4 * glow, b.w + 8 * glow, b.h + 8 * glow, 14); g.strokeStyle = `rgba(91,76,240,${.5 * (1 - glow)})`; g.lineWidth = 3; g.stroke(); }
  g.restore();
}
function ring(g, cx, cy, r, lw, p) {
  g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.strokeStyle = '#EDEBFA'; g.lineWidth = lw; g.stroke();
  if (p > 0) { g.save(); g.lineCap = 'round'; const gr = g.createLinearGradient(cx - r, cy - r, cx + r, cy + r); gr.addColorStop(0, '#8A7CFF'); gr.addColorStop(1, ACC_D);
    g.strokeStyle = gr; g.lineWidth = lw; g.beginPath(); g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + TAU * p); g.stroke(); g.restore(); }
}
function card(g, b, r = 18) { elev(g, b.x, b.y, b.w, b.h, r, .45); rr(g, b.x, b.y, b.w, b.h, r); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = LINE; g.lineWidth = 1; g.stroke(); }

function drawDesktop(g, t, S) {
  // S: state { drag, ringP, planned4, tog, morph }
  g.save(); rr(g, 0, 0, WW, WH, 20); g.clip();
  drawDesktopChrome(g);
  drawDesktopMain(g, t, S);
  g.restore();
}
function drawDesktopChrome(g) {
  g.fillStyle = '#fff'; g.fillRect(0, 0, WW, WH);
  // title bar
  g.fillStyle = '#FBFBFD'; g.fillRect(0, 0, WW, 52); g.fillStyle = LINE; g.fillRect(0, 51, WW, 1);
  for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(26 + i * 22, 26, 6.5, 0, TAU); g.fillStyle = '#E1E2EA'; g.fill(); }
  rr(g, WW / 2 - 150, 13, 300, 26, 8); g.fillStyle = '#F0F1F6'; g.fill(); tx(g, 'weekflow.app/plan', WW / 2, 31, 13, 500, MUTED, 'center');
  // sidebar
  g.fillStyle = FAINT; g.fillRect(0, 52, 240, WH - 52); g.fillStyle = LINE; g.fillRect(239, 52, 1, WH - 52);
  logoMark(g, 26, 78, 34); tx(g, 'Weekflow', 72, 102, 20, 800, INK, 'left', -.3);
  const nav = [['today', 'Today'], ['plan', 'Plan'], ['stats', 'Stats'], ['lib', 'Library'], ['gear', 'Settings']];
  nav.forEach(([k, l], i) => { const y = 150 + i * 50; const act = i === 1;
    if (act) { rr(g, 16, y - 4, 208, 42, 11); g.fillStyle = ACC_L; g.fill(); }
    glyph(g, k, 44, y + 17, 22, act ? ACC : '#8F92A8'); tx(g, l, 68, y + 23, 16, act ? 700 : 500, act ? ACC_D : '#50546C'); });
  rr(g, 16, WH - 170, 208, 88, 14); g.fillStyle = '#fff'; g.fill(); g.strokeStyle = LINE; g.stroke();
  tx(g, 'Pro tip', 32, WH - 140, 13, 700, ACC); tx(g, 'Plan on Sunday,', 32, WH - 118, 13, 500, SUB); tx(g, 'win the week.', 32, WH - 100, 13, 500, SUB);
  avatar(g, 40, WH - 40, 18, 'MR', '#FFD9C7', '#B4542B'); tx(g, 'Maya Reyes', 68, WH - 44, 14, 700, INK); tx(g, 'Pro plan', 68, WH - 26, 12, 500, MUTED);
}
function drawDesktopMain(g, t, S) {
  // header
  tx(g, 'This week', 272, 112, 34, 800, INK, 'left', -.6);
  const pl = S.planned4 ? '4 of 4 sessions planned' : '3 of 4 sessions planned';
  tx(g, 'Sep 28 – Oct 4  ·  ' + pl, 272, 142, 16, 500, SUB);
  rr(g, 1030, 84, 176, 42, 12); g.fillStyle = '#F2F2F7'; g.fill(); rr(g, 1034, 88, 84, 34, 9); g.fillStyle = '#fff'; g.fill();
  shadow(g, 1034, 88, 84, 34, 9, 4, .08, 1); rr(g, 1034, 88, 84, 34, 9); g.fillStyle = '#fff'; g.fill();
  tx(g, 'Week', 1076, 111, 14, 700, INK, 'center'); tx(g, 'Month', 1162, 111, 14, 600, MUTED, 'center');
  shadow(g, 1224, 84, 184, 42, 12, 10, .22, 5); rr(g, 1224, 84, 184, 42, 12); g.fillStyle = ACC; g.fill();
  tx(g, '+  New session', 1316, 111, 15, 700, '#fff', 'center');
  // library
