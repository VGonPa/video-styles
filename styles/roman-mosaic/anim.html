<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── roman-mosaic · a Roman floor mosaic laid tessera by tessera ─────────────────────────────
// Bare mortar bed with a red-ochre sinopia underdrawing → black tesserae fall in and write SALVE, the
// fine emblema background flows in rows (andamento) that hug the letters → laurel wreath and rings close
// the medallion → the camera rises: two dolphins are laid head to tail and start to "swim" by re-tiling,
// the field, the guilloche and the meander border race around the floor → a raking light sweeps the whole
// pavement and makes the glass and gold tesserae glint → hold, fade out.
// The layout is procedural: a label image of the design → distance field → tesserae placed along its
// iso-lines (opus vermiculatum / andamento), plain grids in the borders (opus tessellatum), small cut
// tesserae fill the gaps. Everything is seeded; each frame depends only on t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const WW = 3200, WH = 1800, CX = 1600, CY = 900;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = u => u * u * (3 - 2 * u);
const smoother = u => { u = clamp(u); return u * u * u * (u * (u * 6 - 15) + 10); };
const eOut = u => 1 - Math.pow(1 - u, 3);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

// ── palette (label index → stone / glass colour) ──
const PAL = [
  [236, 229, 212], // 0 white marble (field)
  [40, 36, 33],    // 1 black limestone
  [176, 80, 47],   // 2 terracotta
  [204, 156, 60],  // 3 ochre / gold glass
  [33, 64, 108],   // 4 deep blue glass
  [84, 124, 164],  // 5 mid blue
  [88, 96, 50],    // 6 olive
  [146, 152, 92],  // 7 sage
  [226, 212, 181], // 8 cream (emblema ground)
  [178, 186, 190], // 9 pale grey (dolphin belly)

const NL = PAL.length, NV = 12;
const hex = c => 'rgb(' + c.map(v => Math.round(clamp(v, 0, 255))).join(',') + ')';
const LAB = PAL.map((c, i) => `rgb(${i * 3 + 1},${i * 7 + 2},${i * 11 + 3})`);   // exact label colours on the design canvas
const BUCKET = [];                                  // NL*NV fill colours: tone variants per label
for (let l = 0; l < NL; l++) for (let v = 0; v < NV; v++) {
  const k = 0.84 + 0.3 * v / (NV - 1), warm = (v % 3 - 1) * 4;
  const c = PAL[l]; BUCKET.push(hex([c[0] * k + warm, c[1] * k, c[2] * k - warm]));

// zones: s = tessera size, K = number of andamento rows hugging the edges (99 = everything follows the edges)
const ZONES = [
  null,
  { s: 25, K: 0, ox: 0, oy: 0 },      // 1 outer margin (grid)
  { s: 20, K: 0, ox: 50, oy: 50 },    // 2 meander band (grid, the key is drawn on the grid)
  { s: 10, K: 99 },                   // 3 guilloche band
  { s: 14, K: 3, ox: 400, oy: 400 },  // 4 field
  { s: 10, K: 99 },                   // 5 emblema rings + laurel
  { s: 7, K: 99 },                    // 6 emblema disc (finest, vermiculatum)

function zoneAt(x, y) {
  const r = Math.hypot(x - CX, y - CY);
  if (r < 322) return 6; if (r < 482) return 5;
  if (x < 50 || y < 50 || x >= 3150 || y >= 1750) return 1;
  if (x < 230 || y < 230 || x >= 2970 || y >= 1570) return 2;
  if (x < 400 || y < 400 || x >= 2800 || y >= 1400) return 3;
  return 4;
}

// ── dolphins: a parametric body evaluated per point (used for the design AND for re-tiling) ──
const DL = 520;
const wProf = u => {
  if (u < 0.07) return 22 + 6 * (u / 0.07);
  if (u < 0.16) return 28 + 28 * sstep((u - 0.07) / 0.09);
  if (u < 0.36) return 56 + 16 * sstep((u - 0.16) / 0.2);

  const bob = amp * 9 * Math.sin(TAU * 0.55 * t + (side > 0 ? 1.7 : 0));
  const surge = amp * 10 * Math.sin(TAU * 0.55 * t + (side > 0 ? 1.7 : 0) + 1.2);
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const lx = (0.5 - u) * DL + surge;                     // head at +x (local)
    let ly = -86 * Math.sin(Math.PI * u) + 40 * (u - 0.5) + bob;
    ly += amp * 22 * Math.pow(u, 1.6) * Math.sin(TAU * (1.05 * u - 1.25 * t) + (side > 0 ? 1.7 : 0));
    P.push([cx - side * lx, cy + ly]);

    let tx = b[0] - a[0], ty = b[1] - a[1]; const l = Math.hypot(tx, ty); tx /= l; ty /= l;
    T.push([tx, ty]); let nx = -ty, ny = tx; if (ny > 0) { nx = -nx; ny = -ny; }  // normal points "up" (dorsal)
    Nn.push([nx, ny]);

    const x = lerp(P[i][0], P[i + 1][0], r), y = lerp(P[i][1], P[i + 1][1], r);
    const nx = lerp(Nn[i][0], Nn[i + 1][0], r), ny = lerp(Nn[i][1], Nn[i + 1][1], r);

  return { P, T, Nn, N, w, polys: [dorsal, pect, flukeU, flukeD], eye, bb: [x0 - 70, y0 - 70, x1 + 70, y1 + 70] };
}
function inPoly(x, y, poly) { let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }

  return [Math.hypot(x - a[0] - dx * u, y - a[1] - dy * u), u]; }

  if (x < D.bb[0] || x > D.bb[2] || y < D.bb[1] || y > D.bb[3]) return -1;
  let best = 1e9, bu = 0, bi = 0;
  for (let i = 0; i < D.N; i++) { const [d, u] = segD(x, y, D.P[i], D.P[i + 1]); if (d < best) { best = d; bu = (i + u) / D.N; bi = i; } }

    if (sd > 0 && best > 0.4 * w) return 4;                             // dark back

const swimAmp = t => sstep(seg(t, 4.4, 5.3));

// ── design (label image) ──

let SALVE_BOX;

  g.fillStyle = LAB[0]; g.fillRect(50, 50, WW - 100, WH - 100);

    for (let u = 0; u < len; u++) for (let r = 0; r < 7; r++) {

    g.fillStyle = LAB[2]; g.fillRect(x + 40, y + 40, 100, 100);
    g.fillStyle = LAB[3]; g.fillRect(x + 60, y + 60, 60, 60);

  g.fillRect(230, 386, 2740, 14); g.fillRect(230, 1400, 2740, 14); g.fillRect(386, 386, 14, 1028); g.fillRect(2800, 386, 14, 1028);

  }
  // scattered crosslets on the field grid (kept clear of the big motifs)
  const cross = (cx, cy) => { const s = 14, gx = 400 + Math.round((cx - 400) / s) * s, gy = 400 + Math.round((cy - 400) / s) * s;
    g.fillStyle = LAB[1]; for (const [i, j] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) g.fillRect(gx + i * s, gy + j * s, s, s);
    g.fillStyle = LAB[2]; g.fillRect(gx, gy, s, s); };

    const x = 500 + gx * 200 + (gy % 2) * 100, y = 500 + gy * 200;

// ── texture helpers ──
function noiseCanvas(n, seed, fn) { const c = mk(n, n), g = c.getContext('2d'), id = g.createImageData(n, n), r = rng(seed);
  const G = 64, grid = new Float32Array(G * G); for (let i = 0; i < G * G; i++) grid[i] = r();

    return lerp(lerp(q(x0, y0), q(x0 + 1, y0), fx), lerp(q(x0, y0 + 1), q(x0 + 1, y0 + 1), fx), fy); };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const [R, Gc, B, A] = fn(x, y, vn, r); const i = (y * n + x) * 4; id.data[i] = R; id.data[i + 1] = Gc; id.data[i + 2] = B; id.data[i + 3] = A; }
  g.putImageData(id, 0, 0); return c; }

const FD = 0.3;          // fall duration

function build() {
  // 1. design → label image

      const v = (t - ta) / 0.14, sc = 1 - 0.07 * Math.sin(Math.PI * v) * (1 - v);
      const p = new Path2D(); quad(p, n, 0, 0, sc + 0.02 * (1 - v), 0);
      const sp = new Path2D(); quad(sp, n, 1.3, 1.6); ctx.fillStyle = 'rgba(52,40,28,0.55)'; ctx.fill(sp);
      ctx.fillStyle = BUCKET[TBK[n]]; ctx.fill(p);
    }
  }
  // stone speckle in world space
  stonePat.setTransform(new DOMMatrix([1, 0, 0, 1, 0, 0]));
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.28; ctx.fillStyle = stonePat; ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;

  // raking light sweep with glints on glass and gold tesserae
  const sw = seg(t, 6.75, 8.85);
  if (sw > 0 && sw < 1) {
    const p = lerp(-500, WW + 0.55 * WH + 500, sstep(sw));
    const G = [new Path2D(), new Path2D(), new Path2D(), new Path2D()], stars = [];
    for (let n = 0; n < NT; n++) { if (t < TA[n] + 0.14) continue; const d = (TX[n] + 0.55 * TY[n] - p) / 170; if (d < -2.5 || d > 2.5) continue;
      const gI = TSPEC[n] * Math.exp(-d * d); if (gI < 0.08) continue;
      const lvl = Math.min(3, Math.floor(gI * 4.5)); quad(G[lvl], n); if (gI > 0.62 && TLAB[n] === 3) stars.push([TX[n], TY[n], gI]); }
    ctx.globalCompositeOperation = 'screen';
    G.forEach((pp, i) => { ctx.fillStyle = `rgba(255,238,196,${0.3 + i * 0.22})`; ctx.fill(pp); });
    ctx.globalCompositeOperation = 'lighter';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const [x, y, gI] of stars) { const X = M[0] * x + M[2] * y + M[4], Y = M[1] * x + M[3] * y + M[5]; const L = 9 + 16 * gI;
      const gr = ctx.createRadialGradient(X, Y, 0, X, Y, L); gr.addColorStop(0, 'rgba(255,245,210,0.9)'); gr.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = gr; ctx.fillRect(X - L, Y - 1.2, 2 * L, 2.4); ctx.fillRect(X - 1.2, Y - L, 2.4, 2 * L); }
    // broad warm band
    ctx.setTransform(...M); ctx.globalCompositeOperation = 'soft-light';
    const k = 1 / Math.hypot(1, 0.55), gx0 = p * k * k, gy0 = p * 0.55 * k * k;   // gradient across the band
    const gr = ctx.createLinearGradient(gx0 - 520 * k, gy0 - 520 * 0.55 * k, gx0 + 520 * k, gy0 + 520 * 0.55 * k);
    gr.addColorStop(0, 'rgba(255,220,160,0)'); gr.addColorStop(0.5, `rgba(255,228,176,${0.85 * Math.sin(Math.PI * sw)})`); gr.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.fillStyle = gr; ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
    ctx.globalCompositeOperation = 'source-over';
  }

  // screen-space finish: warm light from the top left, vignette, grain, fades
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const lg = ctx.createLinearGradient(0, 0, W, H); lg.addColorStop(0, 'rgba(255,236,200,0.10)'); lg.addColorStop(1, 'rgba(40,20,0,0.12)');
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = lg; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(vign, 0, 0);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.05; ctx.drawImage(grains[0], 0, 0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const fade = Math.max(1 - seg(t, 0, 0.55), seg(t, 9.25, 9.97));
  if (fade > 0) { ctx.fillStyle = `rgba(14,9,5,${sstep(fade)})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};

// sound cues: tessera clicks (binned), camera rise, lyre phrases, glints, dolphin swishes
window.events = () => {
  const ev = [], bins = new Map();
  for (let n = 0; n < NT; n++) { const b = Math.round(TA[n] * 60); bins.set(b, (bins.get(b) || 0) + 1); }
  for (const [b, c] of [...bins.entries()].sort((a, b) => a[0] - b[0])) if (b / 60 < DUR) ev.push({ k: 'tick', t: b / 60, v: c });
  ev.push({ k: 'lyre', t: 2.05, v: 0 }, { k: 'lyre', t: 3.35, v: 1 }, { k: 'whoosh', t: 2.6, d: 4.2 },
    { k: 'swish', t: 4.5 }, { k: 'swish', t: 6.3 }, { k: 'swish', t: 8.1 }, { k: 'glint', t: 6.8, d: 2.1 }, { k: 'chord', t: 8.55 });
  return ev;
};
window.ready = (async () => { await document.fonts.load('700 150px Cinzel'); await document.fonts.ready; build(); window.NT = NT; })();
</script>
