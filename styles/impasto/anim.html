<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── impasto · post-impressionist thick oil paint (WebGL2) ──────────────────────────────
// A primed linen canvas with a loose umber underdrawing → the sky is laid in with directional
// strokes that keep flowing as currents (two whorls orbit, the rest drifts in wave bands) →
// hills, a night village (windows light up one by one), a flame-like cypress pair → crescent moon
// and stars pulse with rings → slow camera push → a hand-painted title and signature → hold → fade.
// Every stroke is an instanced quad that writes colour + height into two float targets; a final
// pass derives normals from the height field and lights the ridges (diffuse + oil gloss).
// The painted world advances on a 12 fps cadence, like frame-by-frame painted animation; fades stay smooth.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(1889);
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const mixc = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const jit = (c, k) => { const d = (R() - .5) * k; return [clamp(c[0] + d + (R() - .5) * k * .5), clamp(c[1] + d + (R() - .5) * k * .5), clamp(c[2] + d + (R() - .5) * k * .5)]; };
const pick = a => a[Math.floor(R() * a.length)];
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ── timeline ──────────────────────────────────────────────────────────────────────────
const T_SKY0 = 0.45, T_SKY1 = 3.0, T_LAND0 = 1.7, T_VIL0 = 2.7, T_CYP0 = 3.3, T_STAR0 = 4.3;
const T_PUSH0 = 4.7, T_PUSH1 = 8.0, T_TITLE0 = 7.0, T_TITLE1 = 8.0, T_SIGN0 = 7.95, T_SIGN1 = 8.35;
const T_FADE0 = 9.35;
const ZOOM1 = 1.14, FX = 860, FY = 560;           // camera push: focus on the village
const cam = t => lerp(1, ZOOM1, eInOut(seg(t, T_PUSH0, T_PUSH1)));

// ── landscape geometry (world = 1920×1080 at zoom 1) ────────────────────────────────────
const yF = x => 636 + 26 * Math.sin(x * 0.0045 + 0.6) + 14 * Math.sin(x * 0.013 + 2.0);   // far hills
const yM = x => 728 + 32 * Math.sin(x * 0.0032 + 2.2) + 11 * Math.sin(x * 0.017);          // village slope
const yG = x => 912 + 22 * Math.sin(x * 0.004 + 0.3) + 8 * Math.sin(x * 0.019 + 1);        // foreground field
const VORT = [{ x: 1060, y: 330, r: 240, w: 0.23, dir: 1 }, { x: 455, y: 470, r: 120, w: 0.30, dir: -1 }];
const MOON = { x: 300, y: 200, r: 58 };
const STARS = [[640, 138, 1.0], [180, 410, .8], [520, 300, .75], [1420, 140, 1.0], [1360, 470, .85], [1760, 160, .9], [1860, 360, .7], [1150, 610, .55], ];
const CYP = [{ x: 1580, base: 1110, top: 120, hw: 92, ph: 0 }, { x: 1775, base: 1110, top: 400, hw: 58, ph: 1.7 }];
// houses: x, base, w, wall h, roof h, roof kind, wall tint, windows
const HOUSES = [
  [372, 806, 92, 62, 40, 0, 0, 2], [470, 792, 74, 54, 34, 1, 1, 1], [552, 800, 110, 66, 44, 0, 2, 3], [835, 786, 86, 58, 36, 1, 0, 2],
  [932, 778, 96, 60, 40, 0, 1, 2], [1040, 784, 80, 54, 34, 1, 2, 1], [1128, 796, 70, 52, 32, 0, 0, 1],
  [420, 880, 104, 70, 46, 1, 2, 2], [540, 886, 86, 60, 38, 0, 0, 2], [880, 876, 112, 68, 44, 0, 1, 3], [1002, 870, 82, 56, 36, 1, 2, 1], [1096, 884, 96, 64, 42, 0, 0, 2]];
const CHURCH = { x: 700, base: 820, w: 84, h: 92, sx: 726, sw: 34, stop: 498 };
const PAL = {
  skyTop: hex('#11245e'), skyMid: hex('#1f3f96'), skyLow: hex('#3a6bb4'), skyHor: hex('#6d97c2'),
  pale: hex('#c4d9ec'), cobalt: hex('#2c55ad'), light: hex('#86acd9'), deep: hex('#162c72'), teal: hex('#3f7f9a'),
  far: [hex('#29336e'), hex('#3a478a'), hex('#21295a'), hex('#4c5c9c')], mid: [hex('#2b5266'), hex('#3a6870'), hex('#24465a'), hex('#4d7a72')],
  field: [hex('#4a5a2c'), hex('#6c7234'), hex('#2f3f28'), hex('#8a7a3c'), hex('#3c5a46'), hex('#5f6a3a')],
  wall: [[hex('#7086ac'), hex('#9aa8c0')], [hex('#8c8a78'), hex('#b4ab88')], [hex('#5f7398'), hex('#8195b6')]],
  roof: [hex('#2a2c58'), hex('#5a3b40')], outline: hex('#101a3c'), win: hex('#f7c843'), win2: hex('#ee8f2a'),
  cyp: [hex('#10241a'), hex('#1d3b26'), hex('#2c5230'), hex('#173020')], cypHi: [hex('#4c7a3c'), hex('#6f8d3c'), hex('#3d6a4a')], cypDk: hex('#0b1530'),
  moon: [hex('#f3c13a'), hex('#f8de70'), hex('#e99a2a')], star: [hex('#fff6c8'), hex('#f6e27a'), hex('#f2c84b')], halo: hex('#d9d48a'), halo2: hex('#a9c3b0'),
};
function skyCol(x, y) {
  const u = clamp(y / 640);
  let c = u < .45 ? mixc(PAL.skyTop, PAL.skyMid, u / .45) : u < .8 ? mixc(PAL.skyMid, PAL.skyLow, (u - .45) / .35) : mixc(PAL.skyLow, PAL.skyHor, (u - .8) / .2);
  return c;
}
// flow field of the sky (unit angle) for static strokes
function vortexAt(x, y) { for (const v of VORT) { const d = Math.hypot(x - v.x, y - v.y); if (d < v.r) return v; } return null; }
function bandY(x, y0, t) { return y0 + 16 * Math.sin(x * 0.0062 + y0 * 0.021) + 6 * Math.sin(x * 0.017 + y0 * 0.05 + t * 0.6); }
function bandAng(x, y0, t) { const dy = 16 * 0.0062 * Math.cos(x * 0.0062 + y0 * 0.021) + 6 * 0.017 * Math.cos(x * 0.017 + y0 * 0.05 + t * 0.6); return Math.atan(dy); }

// ── strokes ───────────────────────────────────────────────────────────────────────────
// static: {x,y,a,len,wid,c,c2,thick,seed,tb,gd, kind}  — per frame positions for moving kinds
const S = [];
function add(o) { o.seed = o.seed ?? R() * 100; o.c2 = o.c2 ?? jit(o.c, .12); o.thick = o.thick ?? (0.7 + R() * .5); o.gd = o.gd ?? (0.22 + R() * .14); o.alpha = o.alpha ?? 1; S.push(o); return o; }
function genSky() {
  // 1) static underlayer
  for (let y = -10; y < 700; y += 19) for (let x = -20; x < W + 20; x += 21) {
    const px = x + (R() - .5) * 18, py = y + (R() - .5) * 16; if (py > yF(px) + 30) continue;
    const v = vortexAt(px, py); let a;
    if (v) a = Math.atan2(py - v.y, px - v.x) + v.dir * (Math.PI / 2 + 0.22); else a = bandAng(px, py, 0);
    a += (R() - .5) * .3;
    const c = jit(mixc(skyCol(px, py), PAL.deep, .25), .06);
    add({ x: px, y: py, a, len: 56 + R() * 34, wid: 22 + R() * 7, c, tb: T_SKY0 + 1.3 * clamp(px / W * .65 + py / 700 * .2 + R() * .15), kind: 0 });
  }
  // 2) moving currents: band strokes (drift right along wave rows) and whorl strokes (orbit)
  for (let pass = 0; pass < 2; pass++) for (let y0 = 8 + pass * 12; y0 < 690; y0 += 24) {
    const row = Math.floor(y0 / 24), light = (row * 7 + pass * 3) % 5 === 0 || (row % 3 === 1 && pass);
    for (let x0 = -160; x0 < W + 160; x0 += 30 + R() * 14) {
      const base = skyCol(x0, y0);
      const c = light ? jit(mixc(base, PAL.pale, .45 + R() * .2), .05) : jit(mixc(base, pick([PAL.cobalt, PAL.light, PAL.deep, PAL.teal]), .35), .07);
      add({ x0, y0, len: 40 + R() * 44, wid: 13 + R() * 6, c, c2: light ? jit(PAL.pale, .05) : jit(mixc(base, PAL.light, .3), .08),
        tb: T_SKY0 + 0.7 + 1.5 * clamp((x0 + 160) / (W + 320) * .7 + y0 / 700 * .15 + R() * .15), kind: 1, sp: (light || R() < .2) ? 38 + R() * 16 : 0, aj: (R() - .5) * .22 });
    }
  }
  for (const v of VORT) {
    const n = Math.floor(v.r * v.r * Math.PI / 260);
    for (let i = 0; i < n; i++) {
      const r = v.r * Math.sqrt(.03 + .97 * (i + R()) / n) * 1.06, th = R() * TAU;
      const band = .5 + .5 * Math.sin(th * 2 * v.dir - r * 0.045);
      const core = 1 - clamp(r / (v.r * .45));
      let c = mixc(mixc(PAL.deep, PAL.cobalt, band), PAL.light, band * band * .8);
      c = mixc(c, PAL.pale, core * .8 + (band > .85 ? .35 : 0));
      if (i < 60) {   // pale eye of the whorl
        const rc = v.r * .22 * Math.sqrt(R()), cc = jit(mixc(PAL.pale, PAL.light, R() * .5), .05);
        add({ vr: rc, th0: R() * TAU, v, len: 18 + R() * 16, wid: 11 + R() * 5, c: cc, tb: T_SKY0 + 1.1 + R() * .8, kind: 2 });
      }
      add({ vr: r, th0: th, v, len: 30 + R() * 38 * Math.min(1, r / 80 + .3), wid: 12 + R() * 6, c: jit(c, .06), c2: jit(mixc(c, PAL.pale, .3), .05),
        tb: T_SKY0 + 1.0 + 1.6 * clamp((th / TAU) * .5 + r / v.r * .3 + R() * .2), kind: 2 });
    }
  }
}
function genLand() {
  // far hills: strokes along contour
  for (let y = 560; y < 800; y += 11) for (let x = -10; x < W + 10; x += 24) {
    const px = x + (R() - .5) * 20, py = y + (R() - .5) * 10; if (py < yF(px) + 4 || py > yM(px) + 30) continue;
    const a = Math.atan(26 * .0045 * Math.cos(px * .0045 + .6) + 14 * .013 * Math.cos(px * .013 + 2)) * (1 - (py - yF(px)) / 140);
    add({ x: px, y: py, a, len: 36 + R() * 26, wid: 13 + R() * 5, c: jit(pick(PAL.far), .06), tb: T_LAND0 + .9 * clamp(px / W * .8 + R() * .2), kind: 0 });
  }
  // village slope
  for (let y = 680; y < 960; y += 9) for (let x = -10; x < W + 10; x += 20) {
    const px = x + (R() - .5) * 18, py = y + (R() - .5) * 10; if (py < yM(px) - 4 || py > yG(px) + 16) continue;
    const a = Math.atan(32 * .0032 * Math.cos(px * .0032 + 2.2) + 11 * .017 * Math.cos(px * .017)) * .8 + (R() - .5) * .25;
    add({ x: px, y: py, a, len: 30 + R() * 24, wid: 14 + R() * 5, c: jit(pick(PAL.mid), .06), tb: T_LAND0 + .3 + .9 * clamp(px / W * .8 + R() * .2), kind: 0 });
  }
  // dark ridge contours along the far hills
  for (let x = -20; x < W + 20; x += 26) line(x, yF(x) + 2, x + 26, yF(x + 26) + 2, PAL.outline, 6, T_LAND0 + .4 + x / W * .8, .18);
  // foreground field: curving windswept strokes (sway as currents)
  for (let y = 860; y < 1100; y += 13) for (let x = -20; x < W + 20; x += 24) {
    const px = x + (R() - .5) * 20, py = y + (R() - .5) * 12; if (py < yG(px) + 2) continue;
    const a = -0.35 + 0.5 * Math.sin(px * 0.006 + py * 0.02) + (R() - .5) * .3;
    add({ x: px, y: py, a, len: 36 + R() * 34, wid: 14 + R() * 6, c: jit(pick(PAL.field), .07), tb: T_LAND0 + .5 + 1.0 * clamp(px / W * .7 + R() * .3), kind: 3 });
  }
}
function quadStrokes(x0, y0, x1, y1, a, cols, step, len, wid, tb0, span, extra = {}) {
  for (let y = y0; y < y1; y += step) for (let x = x0; x < x1; x += step * 1.4) {
    add(Object.assign({ x: x + (R() - .5) * step * .6 + step * .5, y: y + (R() - .5) * step * .4 + step * .4, a: a + (R() - .5) * .25, len: len * (.8 + R() * .4), wid: wid * (.8 + R() * .4),
      c: jit(pick(cols), .05), tb: tb0 + span * R(), kind: 0, gd: .16 }, extra));
  }
}
function line(xa, ya, xb, yb, c, wid, tb, gd = .14) {
  const L = Math.hypot(xb - xa, yb - ya), n = Math.max(1, Math.round(L / 26));
  for (let i = 0; i < n; i++) { const u0 = i / n, u1 = (i + 1) / n;
    add({ x: lerp(xa, xb, (u0 + u1) / 2), y: lerp(ya, yb, (u0 + u1) / 2), a: Math.atan2(yb - ya, xb - xa), len: L / n + 6, wid: wid * (.85 + R() * .3), c: jit(c, .04), c2: jit(c, .06), tb: tb + i * .03, gd, kind: 0, thick: .9 }); }
}
const WINDOWS = [];
function genVillage() {
  const all = HOUSES.map(h => ({ h, x: h[0] })).sort((a, b) => a.h[1] - b.h[1]);
  let k = 0;
  for (const { h } of all) {
    const [x, b, w, wh, rh, kind, tint, nw] = h; const tb = T_VIL0 + k * .07 + (h[1] > 850 ? .3 : 0); k++;
    const wc = PAL.wall[tint];
    quadStrokes(x - w / 2 + 4, b - wh + 2, x + w / 2 - 8, b - 6, (R() - .5) * .3, wc, 8, 16, 11, tb, .35);
    // roof: strokes along the slopes
    const rc = PAL.roof[kind];
    for (let i = 0; i < Math.ceil(w / 9); i++) {
      const u = (i + .5) / Math.ceil(w / 9), px = x - w / 2 - 4 + u * (w + 8), py = b - wh - rh * (1 - Math.abs(u - .5) * 2) * .55;
      add({ x: px, y: py, a: (u < .5 ? -1 : 1) * Math.atan2(rh, w / 2) + Math.PI / 2 * 0, len: 22, wid: 8, c: jit(rc, .06), tb: tb + .3 + u * .15, kind: 0, gd: .15 });
      add({ x: px, y: py + rh * .22 * (1 - Math.abs(u - .5) * 2), a: (u < .5 ? -1 : 1) * Math.atan2(rh, w / 2), len: 18, wid: 7, c: jit(rc, .08), tb: tb + .32 + u * .15, kind: 0, gd: .15 });
    }
    // dark contours
    const oc = PAL.outline, top = b - wh;
    line(x - w / 2, b, x - w / 2, top, oc, 6, tb + .45); line(x + w / 2, b, x + w / 2, top, oc, 6, tb + .5);
    line(x - w / 2 - 6, top + 2, x, top - rh, oc, 7, tb + .55); line(x, top - rh, x + w / 2 + 6, top + 2, oc, 7, tb + .6);
    line(x - w / 2, b, x + w / 2, b, oc, 4, tb + .5);
    // windows
    for (let j = 0; j < nw; j++) {
      const wx = x - w / 2 + (j + .5) * w / nw, wy = b - wh * .52 + (j % 2 ? 4 : -2);
      WINDOWS.push({ x: wx, y: wy, tb: T_VIL0 + 1.1 + WINDOWS.length * 0.045 + R() * .06 });
    }
  }
  // church
  const c = CHURCH, tb = T_VIL0 + .2;
  quadStrokes(c.x - c.w / 2 + 4, c.base - c.h + 2, c.x + c.w / 2 - 8, c.base - 6, 0, PAL.wall[0], 8, 16, 11, tb, .3);
  quadStrokes(c.sx - c.sw / 2 + 3, c.stop + 60, c.sx + c.sw / 2 - 6, c.base - c.h, Math.PI / 2, PAL.wall[2], 7, 16, 9, tb + .2, .3);
  for (let i = 0; i < 6; i++) { const u = (i + .5) / 6; add({ x: c.sx + (u - .5) * c.sw * (1 - u * .2) * .6, y: lerp(c.stop + 60, c.stop + 6, u), a: -Math.PI / 2, len: 22, wid: 7 * (1 - u * .6), c: jit(PAL.roof[0], .05), tb: tb + .4 + u * .1, kind: 0, gd: .15 }); }
  const oc = PAL.outline;
  line(c.x - c.w / 2, c.base, c.x - c.w / 2, c.base - c.h, oc, 4.5, tb + .5); line(c.x + c.w / 2, c.base, c.x + c.w / 2, c.base - c.h, oc, 4.5, tb + .5);
  line(c.x - c.w / 2 - 6, c.base - c.h, c.x + c.w / 2 + 6, c.base - c.h, oc, 5, tb + .55);
  line(c.sx - c.sw / 2, c.base - c.h, c.sx - c.sw / 2, c.stop + 60, oc, 4, tb + .6); line(c.sx + c.sw / 2, c.base - c.h, c.sx + c.sw / 2, c.stop + 60, oc, 4, tb + .6);
  line(c.sx - c.sw / 2 - 4, c.stop + 62, c.sx, c.stop, oc, 4.5, tb + .7); line(c.sx, c.stop, c.sx + c.sw / 2 + 4, c.stop + 62, oc, 4.5, tb + .72);
  WINDOWS.push({ x: c.x - 18, y: c.base - c.h * .5, tb: T_VIL0 + 1.2, tall: 1 }, { x: c.x + 18, y: c.base - c.h * .5, tb: T_VIL0 + 1.35, tall: 1 });
  WINDOWS.push({ x: c.sx, y: c.stop + 92, tb: T_VIL0 + 1.5, tall: 1 });
}
// cypress: flame silhouette, licking strokes
// flame tongues travel upward: phase within the current tongue
const tongue = (cy, s, t) => { const f = s * 8 - t * .45 + cy.ph; return f - Math.floor(f); };
function cypHalf(cy, s, t = 0) {   // columnar body, rounded base, long flame tip; lobes ride the travelling tongues
  const f = tongue(cy, s, t), prof = s < .22 ? .78 + .22 * Math.sin(s / .22 * Math.PI / 2) : 1 - .94 * Math.pow((s - .22) / .78, 1.7);
  return cy.hw * prof * (.86 + .22 * Math.sin(Math.PI * f) ** 1.5); }
function cypCx(cy, s, t) { return cy.x + 22 * Math.sin(s * 4.5 + cy.ph) + 9 * s * s * Math.sin(t * 1.3 + cy.ph); }
const CYPS = [];
function genCypress() {
  for (const cy of CYP) {
    const hgt = cy.base - cy.top, n = Math.floor(hgt * cy.hw * 1.5 / 110);
    for (let i = 0; i < n; i++) {
      const s = Math.pow(R(), 1.05), side = (R() * 2 - 1);
      const hi = side < -.45 && R() < .6;
      const o = add({ cy, s, side, len: 40 + R() * 34 * (1 - s * .5), wid: 11 + R() * 6 * (1 - s * .5), c: hi ? jit(pick(PAL.cypHi), .05) : jit(pick(PAL.cyp), .04),
        tb: T_CYP0 + 1.4 * clamp(s * .85 + R() * .15) + (cy.ph ? .25 : 0), kind: 4, ap: (R() - .5) * .5, gd: .2 });
      CYPS.push(o);
    }
    // dark crevices + contour
    for (let i = 0; i < 110; i++) { const s = i / 110, side = i % 2 ? 1 : -1;
      add({ cy, s, side: side * 1.0, len: 26, wid: 7, c: jit(PAL.cypDk, .03), c2: jit(PAL.cypDk, .04), tb: T_CYP0 + 1.4 * s + .2 + (cy.ph ? .25 : 0), kind: 4, ap: side * .35, gd: .18, thick: .8 }); }
  }
}
function ringStrokes(cx, cy, r, n, len, wid, c, extra) {
  const out = [];
  for (let i = 0; i < n; i++) { const th = (i + R() * .3) / n * TAU; out.push(add(Object.assign({ cx, cy, rr: r * (1 + (R() - .5) * .08), th, len: len * (.85 + R() * .3), wid, c: jit(c, .05), kind: 5 }, extra))); }
  return out;
}
function genSkyLights() {
  // moon: crescent + halo rings
  const m = MOON, tb = T_STAR0 - .2;
  for (const [rr, cc, n] of [[m.r * 2.3, PAL.halo2, 34], [m.r * 1.88, mixc(PAL.halo2, PAL.halo, .5), 28], [m.r * 1.5, PAL.halo, 24], [m.r * 1.18, mixc(PAL.halo, PAL.moon[1], .5), 20]]) ringStrokes(m.x, m.y, rr, n, TAU * rr / n * 1.5, 22, cc, { tb: tb + rr / 600, gd: .3, pulse: .03, ph: 0 });
  for (let i = 0; i < 220; i++) {
    const r = m.r * Math.sqrt(R()), th = R() * TAU, px = m.x + r * Math.cos(th), py = m.y + r * Math.sin(th);
    const crescent = Math.hypot(px - (m.x + 30), py - (m.y - 18)) > m.r * .86;
    add({ cx: m.x, cy: m.y, rr: r, th, len: 20 + R() * 16, wid: 8 + R() * 4, c: crescent ? jit(pick(PAL.moon), .05) : jit(mixc(PAL.cobalt, PAL.halo2, .38), .05), tb: tb + .1 + R() * .5, kind: 5, gd: .22, pulse: 0, ph: 0, thick: 1.2 });
  }
  STARS.forEach(([x, y, s], k) => {
    const tb = T_STAR0 + k * .09, ph = k * 1.37;

  for (let i = 0; i < 700; i++) { tx.fillStyle = pick2(r, ['#f7d35a', '#fff3cf', '#e9c46a', '#f4e9c2']); tx.globalAlpha = .3; tx.save(); tx.translate(r() * 1500, 910 + r() * 130); tx.rotate(-.5 + r() * .3); tx.fillRect(0, 0, 18 + r() * 26, 5 + r() * 5); tx.restore(); }
  tx.globalAlpha = 1; tx.fillStyle = '#d2452a'; tx.fillRect(1600, 980, 320, 100);
  x.drawImage(t, 0, 0);

  return [c, hc];
}
function pick2(r, a) { return a[Math.floor(r() * a.length)]; }

let texLin, texSk, texTC, texTH;
window.ready = (async () => {
  await document.fonts.load('400 96px "Kaushan Script"'); await document.fonts.load('400 74px "Caveat Brush"'); await document.fonts.ready;
  texLin = imgTex(makeLinen()); texSk = imgTex(makeSketch());
  const [tc, th] = makeTitle(); texTC = imgTex(tc); texTH = imgTex(th);
})();

// ── frame ─────────────────────────────────────────────────────────────────────────────
const STEP = 12;                                   // painted-animation cadence: the canvas changes 12×/s
window.draw = ({ t: tr }) => {
  const t = Math.floor(tr * STEP + 1e-4) / STEP, z = cam(t);
  const n = fillInstances(t);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo); gl.viewport(0, 0, W, H);
  gl.clearBufferfv(gl.COLOR, 0, [0, 0, 0, 0]); gl.clearBufferfv(gl.COLOR, 1, [0, 0, 0, 0]);
  gl.enable(gl.BLEND); gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  if (n) {
    gl.useProgram(pS); gl.uniform1f(gl.getUniformLocation(pS, 'zoom'), z); gl.uniform2f(gl.getUniformLocation(pS, 'focus'), FX, FY);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst, 0, n * NF);

  }
  if (t > T_TITLE0) {
    gl.useProgram(pT); gl.bindVertexArray(vaoF);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texTC); gl.uniform1i(gl.getUniformLocation(pT, 'tcol'), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texTH); gl.uniform1i(gl.getUniformLocation(pT, 'thgt'), 1);
    gl.uniform2f(gl.getUniformLocation(pT, 'rev'), lerp(40, 1560, eInOut(seg(t, T_TITLE0, T_TITLE1))), 0);
    gl.uniform2f(gl.getUniformLocation(pT, 'rev2'), lerp(1600, 1900, eOut(seg(t, T_SIGN0, T_SIGN1))), 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);

  gl.uniform1f(gl.getUniformLocation(pC, 'sketchA'), .55 * (1 - seg(t, 1.2, 3.5) * .4));
  gl.uniform1f(gl.getUniformLocation(pC, 'fade'), Math.min(eOut(seg(tr, 0, .45)), 1 - Math.pow(seg(tr, T_FADE0, DUR - .04), 1.4)));
  gl.uniform1f(gl.getUniformLocation(pC, 'zoom'), z); gl.uniform2f(gl.getUniformLocation(pC, 'focus'), FX, FY);

};
// sound cues for audio.py
window.events = () => {
  const ev = [], tb = S.map(o => o.tb).sort((a, b) => a - b);
  // brush swishes: density of stroke births per 70 ms bucket
  for (let b = 0; b < DUR / .07; b++) { const a = b * .07, cnt = tb.filter(x => x >= a && x < a + .07).length; if (cnt > 2) ev.push({ k: 'brush', t: a, v: Math.min(1, cnt / 120) }); }
  WINDOWS.forEach(w => ev.push({ k: 'lamp', t: w.tb, v: .7 }));
  STARS.forEach((s, i) => ev.push({ k: 'star', t: T_STAR0 + i * .09, v: s[2], f: [880, 988, 1175, 1319, 1480, 1760][i % 6] }));
  ev.push({ k: 'push', t: T_PUSH0, d: T_PUSH1 - T_PUSH0 });
  ev.push({ k: 'title', t: T_TITLE0, d: T_TITLE1 - T_TITLE0 }, { k: 'sign', t: T_SIGN0, d: T_SIGN1 - T_SIGN0 }, { k: 'chord', t: T_SIGN1 });
  return ev;
};
