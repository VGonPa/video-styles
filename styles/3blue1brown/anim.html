<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── 3blue1brown · Manim-style math explainer ─────────────────────────────────────────
// A visual proof that 1 + 3 + 5 + … + (2n − 1) = n². The title is Written (outline, then fill); unit squares
// DrawBorderThenFill layer by layer (each odd L-shaped layer its own colour, the matching term written in that
// colour); braces grow and label the side 5; the equation morphs glyph by glyph (TransformMatchingTex: matching
// symbols glide, the rest fade); a SurroundingRectangle draws around the result; the square's grid becomes a
// NumberPlane, basis vectors grow, a shear ApplyMatrix warps everything (area stays n²); FadeOut of all mobjects.
// Everything is a pure function of t, all motion uses Manim's `smooth` rate function (no overshoot).
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const smooth = u => { u = clamp(u); return u * u * u * (u * (6 * u - 15) + 10); };
const seg = (t, a, d) => clamp((t - a) / d);
const sm = (t, a, d) => smooth(seg(t, a, d));
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
const mix = (a, b, u) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], u))).join(',')})`; };

// ── palette (Manim colour constants) ──
const BG = '#1a1a1a', WHITE = '#FFFFFF', GREY = '#888888';
const BLUE = '#58C4DD', BLUE_D = '#29ABCA', BLUE_E = '#236B8E', TEAL = '#5CD0B3', GREEN = '#83C167';
const GOLD = '#E1A158', BROWN = '#A0785A', YELLOW = '#FFFF00', RED = '#FC6255';
const LAYER = [BLUE, TEAL, GREEN, GOLD, BROWN];   // 1, 3, 5, 7, 9
const NCOL = YELLOW;                                // n is always yellow
const MAIN = 'KaTeX_Main', MATH = 'KaTeX_Math';

// ── timeline (s) ──
const T = {
  title: 0.2, layer: [0.85, 1.45, 2.05, 2.65, 3.25], layerDur: 0.62,
  brace: 3.95, eqEnd: 4.2, morph: 5.05, morphDur: 1.05, box: 6.25, boxDur: 0.55,
  tr: 7.0, trDur: 0.85, plane: 7.05, planeDur: 0.95, vec: 7.8, vecDur: 0.38, warp: 8.2, warpDur: 0.85,
  out: 9.3, outDur: 0.55,
};

// ── square geometry ──
const CS = 96, N = 5, O0 = [214, 812], O1 = [470, 862]; // cell size (px); square's bottom-left corner before/after the transition
let O = [...O0];                                    // current origin (the square + plane glide to the centre as the plane appears)
const CELLS = [];                                   // layer k = cells with max(i,j) == k, walked along the L
for (let k = 0; k < N; k++) {
  const L = [];
  for (let j = 0; j <= k; j++) L.push([k, j]);
  for (let i = k - 1; i >= 0; i--) L.push([i, k]);
  L.forEach(([i, j], q) => CELLS.push({ i, j, k, q, n: L.length }));
}

// ── typesetting: tokens → measured glyph positions (TeX spacing: bin 4mu, rel 5mu) ──
const fontOf = (f, px) => f === 'math' ? `italic 400 ${px}px ${MATH}` : `400 ${px}px ${MAIN}`;
function layout(toks, size, cx, by) {
  const out = []; let x = 0;
  for (const tk of toks) {
    const s = tk.s || 1, px = size * s;
    ctx.font = fontOf(tk.f, px);
    const w = tk.c === ' ' ? size * 0.28 : ctx.measureText(tk.c).width;
    const sp = tk.sp === 'bin' ? size * 4 / 18 : tk.sp === 'rel' ? size * 5 / 18 : 0;
    x += sp + (tk.pre || 0) * size;
    out.push({ ...tk, x, w, y: -(tk.dy || 0) * size, sz: px, col: tk.col || WHITE });
    x += w + sp;
  }
  const off = cx - x / 2;
  for (const g of out) { g.x += off; g.y += by; }
  out.width = x; out.left = off; out.right = off + x; return out;
}
const tk = (k, c, col, o = {}) => ({ k, c, col, ...o });
const EQ_SIZE = 70, EQ_CX = 1300, EQ_BY = 592;
const EQA_T = [tk('t1', '1', LAYER[0]), tk('p1', '+', 0, { sp: 'bin' }), tk('t3', '3', LAYER[1]), tk('p2', '+', 0, { sp: 'bin' }),
  tk('t5', '5', LAYER[2]), tk('p3', '+', 0, { sp: 'bin' }), tk('t7', '7', LAYER[3], { grp: 1 }), tk('p4', '+', 0, { sp: 'bin' }),
  tk('t9', '9', LAYER[4], { grp: 1 }), tk('eq', '=', 0, { sp: 'rel' }), tk('b5', '5', NCOL, { grp: 2 }), tk('sq', '2', 0, { s: .7, dy: .38, pre: .03 })];
const EQB_T = [tk('t1', '1', LAYER[0]), tk('p1', '+', 0, { sp: 'bin' }), tk('t3', '3', LAYER[1]), tk('p2', '+', 0, { sp: 'bin' }),
  tk('t5', '5', LAYER[2]), tk('p3', '+', 0, { sp: 'bin' }), tk('dots', '⋯', 0, { grp: 1 }), tk('p4', '+', 0, { sp: 'bin' }),
  tk('lp', '(', LAYER[4], { grp: 1 }), tk('two', '2', LAYER[4], { grp: 1 }), tk('nn', 'n', NCOL, { f: 'math', grp: 1 }), tk('mi', '−', LAYER[4], { sp: 'bin', grp: 1 }),
  tk('one', '1', LAYER[4], { grp: 1 }), tk('rp', ')', LAYER[4], { grp: 1 }), tk('eq', '=', 0, { sp: 'rel' }), tk('bn', 'n', NCOL, { f: 'math', grp: 2 }),
  tk('sq', '2', 0, { s: .7, dy: .38, pre: .07 })];
// Write order for equation A (term i arrives with layer i)
const EQA_GROUPS = [['t1'], ['p1', 't3'], ['p2', 't5'], ['p3', 't7'], ['p4', 't9'], ['eq', 'b5', 'sq']];
const TITLE_T = [...'Sum of the first '].map((c, i) => tk('a' + i, c, WHITE)).concat([tk('n', 'n', NCOL, { f: 'math' })],
  [...' odd numbers'].map((c, i) => tk('b' + i, c, WHITE)));
let EQA, EQB, TITLE, LBL5, LBLN, LBL5L, LBLNL;

// ── drawing primitives ──
// Manim "Write" on a glyph: outline strokes on (dash), fill fades in, outline fades away.
function glyph(x, g, a = 1, w = 1, dx = 0, dy = 0, sc = 1) {
  if (a <= 0.002 || w <= 0 || g.c === ' ') return;
  const px = g.sz * sc;
  x.save(); x.font = fontOf(g.f, px); x.textBaseline = 'alphabetic';
  const gx = g.x + dx + g.w * (1 - sc) / 2, gy = g.y + dy;
  if (w >= 1) { x.globalAlpha = a; x.fillStyle = g.col; x.fillText(g.c, gx, gy); }
  else {
    const sp = smooth(w / 0.62), fp = smooth((w - 0.38) / 0.62), L = px * 4.2;
    x.lineJoin = 'round'; x.lineCap = 'round';
    x.setLineDash([L * sp + 0.01, L * 3]); x.lineWidth = Math.max(1.4, px * 0.022);
    x.strokeStyle = g.col; x.globalAlpha = a * (1 - fp * fp); x.strokeText(g.c, gx, gy);
    x.setLineDash([]); x.globalAlpha = a * fp; x.fillStyle = g.col; x.fillText(g.c, gx, gy);
  }
  x.restore();
}
// Write a list of glyphs with a lagged start: total span d, each glyph run r of it
function writeGlyphs(x, gs, t, t0, d, a = 1, r = 0.5) {
  const n = gs.filter(g => g.c !== ' ').length; let q = 0;
  for (const g of gs) { if (g.c === ' ') continue; const st = t0 + (n > 1 ? q / (n - 1) : 0) * d * (1 - r); glyph(x, g, a, seg(t, st, d * r)); q++; }
}
// polyline with partial "Create" (0..1 of its length)
function partialPath(x, pts, u, close = false) {
  if (u <= 0) return;
  const P = close ? [...pts, pts[0]] : pts; let tot = 0; const ls = [];
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); ls.push(l); tot += l; }
  let rem = tot * clamp(u); x.beginPath(); x.moveTo(P[0][0], P[0][1]);
  for (let i = 1; i < P.length && rem > 0; i++) {
    const l = ls[i - 1], f = Math.min(1, rem / l); x.lineTo(lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)); rem -= l;
  }
  if (u >= 1 && close) x.closePath();
  x.stroke();
}
// Manim Brace: a filled, tapered curly brace. Local frame: spans x ∈ [0,w] at y=0, tip pointing +y.
function bracePoly(w) {
  const r = 15, nArc = 14, half = [];
  // left end curls from (0,0) down to (r,r), runs flat, then curls down into the tip at (w/2, 2r)
  for (let i = 0; i <= nArc; i++) { const a = Math.PI - i / nArc * (Math.PI / 2); half.push([r + r * Math.cos(a), r * Math.sin(a)]); }
  const mid = w / 2;
  for (let i = 1; i <= 20; i++) half.push([lerp(r, mid - r, i / 20), r]);
  for (let i = 1; i <= nArc; i++) { const a = -Math.PI / 2 + i / nArc * (Math.PI / 2); half.push([mid - r + r * Math.cos(a), 2 * r + r * Math.sin(a)]); }
  // tapered thickness along the half, offset both sides along the normal
  let tot = 0; const cum = [0];
  for (let i = 1; i < half.length; i++) { tot += Math.hypot(half[i][0] - half[i - 1][0], half[i][1] - half[i - 1][1]); cum.push(tot); }
  const A = [], B = [];
  for (let i = 0; i < half.length; i++) {
    const p = half[i], q = half[Math.min(half.length - 1, i + 1)], o = half[Math.max(0, i - 1)];
    let tx = q[0] - o[0], ty = q[1] - o[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const v = cum[i] / tot, h = 0.6 + 3.1 * Math.pow(Math.sin(Math.PI * v), 0.7);
    A.push([p[0] - ty * h, p[1] + tx * h]); B.push([p[0] + ty * h, p[1] - tx * h]);
  }
  const left = [...A, ...B.reverse()];
  const right = left.map(([px, py]) => [w - px, py]);
  return [left, right];
}
function drawBrace(x, cx, cy, w, rot, sc, a) {
  if (a <= 0 || sc <= 0) return;
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc); x.translate(-w / 2, 0);
  x.globalAlpha = a; x.fillStyle = WHITE;
  for (const poly of bracePoly(w)) { x.beginPath(); poly.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py)); x.closePath(); x.fill(); }
  x.restore();
}
function arrow(x, p0, p1, col, a, width = 6) {
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], L = Math.hypot(dx, dy); if (L < 1 || a <= 0) return;
  const ux = dx / L, uy = dy / L, tipL = Math.min(34, L * 0.45), tipW = tipL * 0.62;
  const bx = p1[0] - ux * tipL, by = p1[1] - uy * tipL;
  x.save(); x.globalAlpha = a; x.strokeStyle = col; x.fillStyle = col; x.lineWidth = width; x.lineCap = 'butt';
  x.beginPath(); x.moveTo(p0[0], p0[1]); x.lineTo(bx + ux, by + uy); x.stroke();
  x.beginPath(); x.moveTo(p1[0], p1[1]); x.lineTo(bx - uy * tipW, by + ux * tipW); x.lineTo(bx + uy * tipW, by - ux * tipW); x.closePath(); x.fill();
  x.restore();
}

// ── plane coordinates (unit = one cell), with a linear map M = [[a,b],[c,d]] ──
const toS = (M, px, py) => [O[0] + (M[0] * px + M[1] * py) * CS, O[1] - (M[2] * px + M[3] * py) * CS];

function render(t) {
  const x = ctx;
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  x.fillStyle = BG; x.fillRect(0, 0, W, H);
  const FO = 1 - sm(t, T.out, T.outDur);                  // final FadeOut of every mobject
  if (FO <= 0) return;
  const tr = sm(t, T.tr, T.trDur);                        // transition: eq to top, title/braces out
  const wu = sm(t, T.warp, T.warpDur);                    // ApplyMatrix progress
  const M = [1, wu * 1.0, 0, 1];
  const mv = sm(t, T.tr + 0.3, 0.75);                    // square + plane glide to the centre after the equation has lifted
  O = [lerp(O0[0], O1[0], mv), lerp(O0[1], O1[1], mv)];                          // shear [[1,1],[0,1]] (det = 1: area stays n²)

  // ── stationary ghost grid (appears as the warp starts, like Manim's background copy) ──
  if (t >= T.warp) {
    x.save(); x.globalAlpha = FO * 0.35 * clamp((t - T.warp) / 0.15); x.strokeStyle = GREY; x.lineWidth = 1;
    x.beginPath();
    for (let k = -6; k <= 16; k++) { const a = toS([1, 0, 0, 1], k, -4), b = toS([1, 0, 0, 1], k, 10); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); }
    for (let k = -3; k <= 9; k++) { const a = toS([1, 0, 0, 1], -7, k), b = toS([1, 0, 0, 1], 18, k); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); }
    x.stroke(); x.restore();
  }

  // ── NumberPlane: Create with lag (axes first, then lines outward from the square) ──
  if (t >= T.plane) {
    const lines = [];
    for (let k = -30; k <= 30; k++) { if (k === 0) continue; lines.push({ v: 1, k, o: Math.abs(k - 2.5) }); }
    for (let k = -12; k <= 12; k++) { if (k === 0) continue; lines.push({ v: 0, k, o: Math.abs(k - 2.5) }); }
    const drawLine = (ln, u, col, wd, a) => {
      if (u <= 0) return; x.globalAlpha = a * FO; x.strokeStyle = col; x.lineWidth = wd;
      const R = u >= 1 ? 40 : 1;                          // while drawing, sweep the on-screen span; afterwards full length
      const pts = ln.v ? [toS(M, ln.k, -3 * R), toS(M, ln.k, 9.2 * R)] : [toS(M, -5.2 * R, ln.k), toS(M, 18 * R, ln.k)];
      partialPath(x, pts, u);
    };
    x.save(); x.lineCap = 'butt';
    for (const ln of lines) {
      const st = T.plane + 0.12 + Math.min(1, ln.o / 16) * T.planeDur * 0.45, u = sm(t, st, T.planeDur * 0.5);
      // faded half-unit lines
      if (Math.abs(ln.k) < 30) drawLine({ v: ln.v, k: ln.k + 0.5 }, u, BLUE_D, 1, 0.3);
      drawLine(ln, u, BLUE_D, 2, 1);
    }
    drawLine({ v: 0, k: -0.5 }, sm(t, T.plane + .12, T.planeDur * .5), BLUE_D, 1, .3); drawLine({ v: 1, k: -0.5 }, sm(t, T.plane + .12, T.planeDur * .5), BLUE_D, 1, .3);
    const ua = sm(t, T.plane, T.planeDur * 0.6);
    drawLine({ v: 0, k: 0 }, ua, WHITE, 2.5, 1); drawLine({ v: 1, k: 0 }, ua, WHITE, 2.5, 1);
    x.restore();
  }

  // ── the square: DrawBorderThenFill per cell, lagged along each L ──
  const fillOp = lerp(0.82, 0.5, sm(t, T.plane, T.planeDur));
  for (const c of CELLS) {
    const t0 = T.layer[c.k] + (c.n > 1 ? c.q / (c.n - 1) : 0) * T.layerDur * 0.55, u = seg(t, t0, T.layerDur * 0.5);
    if (u <= 0) continue;
    const pts = [toS(M, c.i, c.j + 1), toS(M, c.i + 1, c.j + 1), toS(M, c.i + 1, c.j), toS(M, c.i, c.j)];
    const bu = smooth(u / 0.6), fu = smooth((u - 0.45) / 0.55), col = LAYER[c.k];
    x.save();
    if (fu > 0) { x.globalAlpha = fillOp * fu * FO; x.fillStyle = col; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill(); }
    x.lineJoin = 'miter'; x.lineWidth = 2.6; x.globalAlpha = FO; x.strokeStyle = fu < 1 ? mix(col, WHITE, fu) : WHITE;
    partialPath(x, pts, bu, true);
    x.restore();
  }

  // ── basis vectors î (green) and ĵ (red): GrowArrow, then carried by the matrix ──
  if (t >= T.vec) {
    const g = sm(t, T.vec, T.vecDur), o = toS(M, 0, 0);
    const pi = toS(M, g, 0), pj = toS(M, 0, g);
    arrow(x, o, pi, GREEN, FO); arrow(x, o, pj, RED, FO);
  }

  // ── braces with labels (GrowFromCenter + Write); label 5 → n during the morph ──
  const bo = 1 - sm(t, T.tr, T.trDur * 0.6);
  if (t >= T.brace && bo > 0) {
    const gs = sm(t, T.brace, 0.5), a = bo * FO;
    drawBrace(x, O[0] + N * CS / 2, O[1] + 14, N * CS, 0, gs, a);
    drawBrace(x, O[0] - 14, O[1] - N * CS / 2, N * CS, Math.PI / 2, gs, a);
    const mu = sm(t, T.morph, T.morphDur), lw = seg(t, T.brace + 0.2, 0.5);
    for (const [L5, LN] of [[LBL5, LBLN], [LBL5L, LBLNL]]) {
      const m1 = smooth(mu / 0.55), m2 = smooth((mu - 0.3) / 0.55);    // 5 fades up and out, n fades up and in
      const ox = O[0] - O0[0], oy = O[1] - O0[1];
      glyph(x, L5, a * (1 - m1), lw, ox, oy - 14 * m1);
      if (m2 > 0) glyph(x, LN, a * m2, 1, ox, oy + 14 * (1 - m2));
    }
  }

  // ── title: Write, then FadeOut shifting up ──
  if (t >= T.title) {
    const to = sm(t, T.tr, 0.5), a = (1 - to) * FO;
    x.save(); x.translate(0, -50 * to); writeGlyphs(x, TITLE, t, T.title, 1.05, a, 0.42); x.restore();
  }

  // ── equation (in a group that later moves to the top) ──
  const tx = sm(t, T.tr + 0.2, T.trDur), ty = sm(t, T.tr, T.trDur * 0.75);   // lift first, then slide left (clears the square)
  const eqS = lerp(1, 0.8, ty), ex = lerp(0, 960 - EQ_CX, tx), ey = lerp(0, 158 - EQ_BY, ty);
  x.save(); x.translate(EQ_CX + ex, EQ_BY + ey); x.scale(eqS, eqS); x.translate(-EQ_CX, -EQ_BY);
  const mu = sm(t, T.morph, T.morphDur);
  const bx0 = EQB.left - 30, bx1 = EQB.right + 30, by0 = EQ_BY - EQ_SIZE * 0.98, by1 = EQ_BY + EQ_SIZE * 0.42;
  if (tr > 0) {                                          // BackgroundRectangle so the plane doesn't cross the text
    x.globalAlpha = 0.88 * tr * FO; x.fillStyle = BG; x.fillRect(bx0 - 6, by0 - 6, bx1 - bx0 + 12, by1 - by0 + 12); x.globalAlpha = 1;
  }
  if (t < T.morph) {
    EQA_GROUPS.forEach((grp, gi) => {
      const t0 = gi < 5 ? T.layer[gi] + 0.12 : T.eqEnd;
      const gs = grp.map(k => EQA.find(g => g.k === k));
      writeGlyphs(x, gs, t, t0, gi < 5 ? 0.55 : 0.7, FO, gi < 5 ? 0.8 : 0.6);
    });
  } else {
    // TransformMatchingTex: matched keys glide from layout A to layout B; each unmatched group
    // (7 + 9 ↔ ⋯ + (2n − 1), 5 ↔ n) cross-fades while travelling towards the other group's place.
    const cen = (lay, gr) => { const gs = lay.filter(g => g.grp === gr); return gs.reduce((s, g) => s + g.x + g.w / 2, 0) / gs.length; };
    for (const g of EQA) {
      const m = EQB.find(o => o.k === g.k);
      if (m) glyph(x, { ...g, x: lerp(g.x, m.x, mu), y: lerp(g.y, m.y, mu), sz: lerp(g.sz, m.sz, mu), w: lerp(g.w, m.w, mu), col: g.col === m.col ? g.col : mix(g.col, m.col, mu) }, FO);
      else glyph(x, g, FO * (1 - smooth(mu / 0.62)), 1, (cen(EQB, g.grp) - cen(EQA, g.grp)) * mu, 0);
    }
    for (const g of EQB) {
      if (EQA.find(o => o.k === g.k)) continue;
      glyph(x, g, FO * smooth((mu - 0.3) / 0.62), 1, (cen(EQA, g.grp) - cen(EQB, g.grp)) * (1 - mu), 0);
    }
  }
  // SurroundingRectangle: Create (stroke travels around from the top-left corner)
  if (t >= T.box) {
    const u = sm(t, T.box, T.boxDur);
    x.save(); x.strokeStyle = YELLOW; x.lineWidth = 4 / eqS; x.lineJoin = 'miter'; x.globalAlpha = FO;
    partialPath(x, [[bx0, by0], [bx1, by0], [bx1, by1], [bx0, by1]], u, true); x.restore();
  }
  x.restore();
}

window.ready = (async () => {
  await Promise.all([`400 80px ${MAIN}`, `italic 400 80px ${MATH}`].map(f => document.fonts.load(f, '0123456789+=()n−⋯Sumoftherdb')));
  await document.fonts.ready;
  EQA = layout(EQA_T, EQ_SIZE, EQ_CX, EQ_BY); EQB = layout(EQB_T, EQ_SIZE, EQ_CX, EQ_BY);
  TITLE = layout(TITLE_T, 58, 960, 128);
  const bcx = O[0] + N * CS / 2;
  LBL5 = layout([tk('l', '5', NCOL)], 62, bcx, O[1] + 100)[0]; LBLN = layout([tk('l', 'n', NCOL, { f: 'math' })], 62, bcx, O[1] + 100)[0];
  const lcy = O[1] - N * CS / 2 + 21;
  LBL5L = layout([tk('l', '5', NCOL)], 62, O[0] - 72, lcy)[0]; LBLNL = layout([tk('l', 'n', NCOL, { f: 'math' })], 62, O[0] - 72, lcy)[0];
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [];
  T.layer.forEach((lt, k) => ev.push({ t: lt, k: 'note', n: k }));
  for (const c of CELLS) ev.push({ t: T.layer[c.k] + (c.n > 1 ? c.q / (c.n - 1) : 0) * T.layerDur * 0.55 + T.layerDur * 0.3, k: 'tick', v: 0.5 + 0.1 * c.k });
  ev.push({ t: T.brace, k: 'soft' }, { t: T.morph, k: 'morph', d: T.morphDur }, { t: T.box, k: 'chord' },
    { t: T.plane, k: 'swell', d: 1.2 }, { t: T.warp, k: 'swell', d: 1.1 }, { t: T.out, k: 'end' });
  return ev.sort((a, b) => a.t - b.t);
};
