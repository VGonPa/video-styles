<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3blue1brown</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}#c{display:block}</style>
</head>
<body>
<canvas id="c" height="1080" width="1920"></canvas>
<script>
'use strict';
/*
 * 3blue1brown — Manim-style math on black.
 *
 * Story (10 s): a number plane draws itself and a unit circle is created; the identity
 * e^{iθ} = cos θ + i sin θ is written in Computer Modern; a yellow vector sweeps once around
 * the circle with its blue cos and red sin projections; the camera pans left, the grid dims,
 * a θ-axis is created and the "sin θ" glyphs fly out of the equation onto the graph; the sin
 * projection then unrolls into a red curve as the dot goes round again; a passing flash runs
 * along the curve and everything fades to black.
 *
 * Contract: window.ready settles once the KaTeX faces are loaded and the formulas measured;
 * window.draw({t}) paints time t and returns base64 JPEG; window.events() returns the cue list.
 * Frames depend on t only: there is no clock and no randomness anywhere.
 */
const W = 1920, H = 1080, DUR = 10, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const g = cv.getContext('2d');

// Manim's palette: the blues of the plane, the yellow vector, the red sine.
const C = {
  blue: '#58C4DD', blueD: '#29ABCA', blueE: '#1C758A',
  yellow: '#FFFF00', red: '#FC6255', axis: '#E8E8E8',
  white: '#FFFFFF', grey: '#8A8A8A', lgrey: '#BBBBBB', flash: '#FFF9C4',
};

// --- easing -------------------------------------------------------------------------------
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const span = (t, a, b) => clamp01((t - a) / (b - a));              // 0 → 1 across [a, b]
const smooth = u => u * u * u * (u * (u * 6 - 15) + 10);           // Manim's quintic "smooth"
const mix = (a, b, k) => a + (b - a) * k;
const easeOut = u => 1 - (1 - u) * (1 - u) * (1 - u);
const backOut = u => { const c = 1.70158, v = u - 1; return 1 + (c + 1) * v * v * v + c * v * v; };
const traceRate = u => 0.72 * u + 0.28 * smooth(u);                // near-linear with soft ends

// --- timeline (seconds) ---------------------------------------------------------------------
const T = {
  plane: [0.00, 1.05],
  coords: [0.70, 1.10],
  circle: [0.90, 1.90],
  write: [1.55, 3.05],
  arrow: [2.45, 2.85],
  spin: [2.90, 5.05],
  angle: [3.00, 3.30],
  angleLabel: [3.35, 3.65],
  proj: [3.15, 3.55],
  pan: [5.10, 6.10],
  out: [5.10, 5.45],
  move: [5.50, 6.35],
  axis: [5.60, 6.40],
  ticks: [6.00, 6.70],
  trace: [6.50, 8.80],
  flash: [8.80, 9.45],
  fade: [9.30, 10.0],
};
const GX = 2.0;                                                     // graph origin, world x
const X_END = GX + TAU + 0.35;                                      // graph θ-axis tip, world x
const WRITE_DUR = 0.5;                                              // one glyph's Write time

// --- camera: world (unit = one grid cell) → screen ----------------------------------------
const CAM_A = { ox: 960, oy: 590, s: 240 };
const CAM_B = { ox: 380, oy: 570, s: 170 };
function camera(t) {
  const k = smooth(span(t, T.pan[0], T.pan[1]));
  return { ox: mix(CAM_A.ox, CAM_B.ox, k), oy: mix(CAM_A.oy, CAM_B.oy, k), s: mix(CAM_A.s, CAM_B.s, k) };
}
const sx = (cam, x) => cam.ox + x * cam.s;
const sy = (cam, y) => cam.oy - y * cam.s;

// --- typography: KaTeX_Math for variables, KaTeX_Main for operators and words --------------
const MATH = px => `italic 400 ${px}px 'KaTeX_Math'`;
const ROMAN = px => `400 ${px}px 'KaTeX_Main'`;

// A formula is a list of runs {s, f: 'M'|'R', col, sup, gap, after}. layout() splits the runs
// into glyphs with offsets from the formula's left edge at the given pixel size, measuring the
// ink box of every glyph so Write can sweep across it.
function layout(runs, size) {
  const glyphs = [];
  let x = 0;
  for (const r of runs) {
    const px = r.sup ? size * 0.7 : size, dy = r.sup ? -size * 0.44 : 0;
    g.font = r.f === 'M' ? MATH(px) : ROMAN(px);
    if (r.gap) x += r.gap * size;
    for (const ch of r.s) {
      const m = g.measureText(ch);
      glyphs.push({
        ch, f: r.f, px, x, dy, col: r.col || C.white,
        l: m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight,
        a: m.actualBoundingBoxAscent, d: m.actualBoundingBoxDescent,
      });
      x += m.width;
    }
    if (r.after) x += r.after * size;
  }
  return { glyphs, w: x, size };
}

const B = C.blue, R = C.red;
const RUNS = {
  eq: [
    { s: 'e', f: 'M' }, { s: 'iθ', f: 'M', sup: true },
    { s: '=', f: 'R', gap: 0.3, after: 0.3 },
    { s: 'cos', f: 'R', col: B, after: 0.17 }, { s: 'θ', f: 'M', col: B },
    { s: '+', f: 'R', gap: 0.24, after: 0.24 },
    { s: 'i', f: 'M', col: R, after: 0.14 }, { s: 'sin', f: 'R', col: R, after: 0.17 }, { s: 'θ', f: 'M', col: R },
  ],
  cos: [{ s: 'cos', f: 'R', col: B, after: 0.17 }, { s: 'θ', f: 'M', col: B }],
  sin: [{ s: 'sin', f: 'R', col: R, after: 0.17 }, { s: 'θ', f: 'M', col: R }],
  theta: [{ s: 'θ', f: 'M', col: C.yellow }],
  thetaAxis: [{ s: 'θ', f: 'M', col: C.axis }],
  one: [{ s: '1', f: 'R', col: C.lgrey }],
  mone: [{ s: '−', f: 'R', col: C.lgrey }, { s: '1', f: 'R', col: C.lgrey }],
  i: [{ s: 'i', f: 'M', col: C.lgrey }],
  mi: [{ s: '−', f: 'R', col: C.lgrey }, { s: 'i', f: 'M', col: C.lgrey }],
  halfPi: [{ s: 'π', f: 'M', col: C.lgrey }, { s: '/', f: 'R', col: C.lgrey }, { s: '2', f: 'R', col: C.lgrey }],
  pi: [{ s: 'π', f: 'M', col: C.lgrey }],
  threeHalfPi: [{ s: '3', f: 'R', col: C.lgrey }, { s: 'π', f: 'M', col: C.lgrey }, { s: '/', f: 'R', col: C.lgrey }, { s: '2', f: 'R', col: C.lgrey }],
  twoPi: [{ s: '2', f: 'R', col: C.lgrey }, { s: 'π', f: 'M', col: C.lgrey }],
};
const F = {};                                                      // measured formulas (setup)
const SIN_IN_EQ = [10, 11, 12, 13];                                 // glyph indices of "sin θ" in eq

function setup() {
  F.eq = layout(RUNS.eq, 78);
  F.cos = layout(RUNS.cos, 46);
  F.sin = layout(RUNS.sin, 46);
  F.sinLabel = layout(RUNS.sin, 50);
  F.theta = layout(RUNS.theta, 46);
  F.thetaAxis = layout(RUNS.thetaAxis, 40);
  for (const k of ['one', 'mone', 'i', 'mi']) F[k] = layout(RUNS[k], 34);
  for (const k of ['halfPi', 'pi', 'threeHalfPi', 'twoPi']) F[k] = layout(RUNS[k], 36);
}

// Draws a measured formula centred on cx with its baseline on by. opts.prog(i) gives the Write
// progress of glyph i (absent = finished); opts.alpha scales everything; opts.scale resizes.
function formula(Fm, cx, by, opts = {}) {
  const alpha = opts.alpha === undefined ? 1 : opts.alpha;
  if (alpha <= 0) return;
  const k = opts.scale || 1, x0 = cx - Fm.w * k / 2;
  for (let i = 0; i < Fm.glyphs.length; i++) {
    const q = Fm.glyphs[i];
    const p = opts.prog ? opts.prog(i) : 1;
    if (p <= 0) continue;
    const gx = x0 + q.x * k, gy = by + q.dy * k;
    g.font = (q.f === 'M' ? MATH : ROMAN)(q.px * k);
    g.fillStyle = q.col;
    g.strokeStyle = q.col;
    if (p >= 1) {
      g.globalAlpha = alpha;
      g.fillText(q.ch, gx, gy);
      continue;
    }
    // DrawBorderThenFill: the outline is swept across the ink box, then the fill comes up.
    const border = span(p, 0, 0.55), fill = span(p, 0.55, 1);
    if (border < 1) {
      const left = gx - q.l * k - 2, wid = (q.l + q.r) * k + 4;
      const top = gy - q.a * k - 3, hgt = (q.a + q.d) * k + 6;
      g.save();
      g.beginPath();
      g.rect(left, top, wid * border, hgt);
      g.clip();
    }
    g.globalAlpha = alpha * (1 - fill);
    g.lineWidth = 1.7;
    g.lineJoin = 'round';
    g.strokeText(q.ch, gx, gy);
    if (border < 1) g.restore();
    if (fill > 0) {
      g.globalAlpha = alpha * fill;
      g.fillText(q.ch, gx, gy);
    }
  }
  g.globalAlpha = 1;
}

// Write timing: glyph i of n starts at t0 + i * step and takes WRITE_DUR.
function writeStart(i, n, t0, t1) { return t0 + i * (t1 - t0 - WRITE_DUR) / Math.max(1, n - 1); }

// --- primitives ---------------------------------------------------------------------------
function line(cam, x0, y0, x1, y1, col, width, alpha = 1, dash = null) {
  g.globalAlpha = alpha;
  g.strokeStyle = col;
  g.lineWidth = width;
  g.lineCap = 'butt';
  g.setLineDash(dash || []);
  g.beginPath();
  g.moveTo(sx(cam, x0), sy(cam, y0));
  g.lineTo(sx(cam, x1), sy(cam, y1));
  g.stroke();
  g.setLineDash([]);
  g.globalAlpha = 1;
}

function dot(cam, x, y, radius, col, alpha = 1) {
  g.globalAlpha = alpha;
  g.fillStyle = col;
  g.beginPath();
  g.arc(sx(cam, x), sy(cam, y), radius * cam.s, 0, TAU);
  g.fill();
  g.globalAlpha = 1;
}

// A vector from (x0,y0) to (x1,y1) with Manim's filled triangular tip (tip length in units).
function arrow(cam, x0, y0, x1, y1, col, width, tip, alpha = 1) {
  const X0 = sx(cam, x0), Y0 = sy(cam, y0), X1 = sx(cam, x1), Y1 = sy(cam, y1);
  const dx = X1 - X0, dy = Y1 - Y0, len = Math.hypot(dx, dy);
  if (len < 0.5) return;
  const ux = dx / len, uy = dy / len;
  const tl = Math.min(tip * cam.s, len * 0.7), hw = tl * 0.4;
  const bx = X1 - ux * tl, by = Y1 - uy * tl;
  g.globalAlpha = alpha;
  g.strokeStyle = col;
  g.fillStyle = col;
  g.lineWidth = width;
  g.lineCap = 'butt';
  g.beginPath();
  g.moveTo(X0, Y0);
  g.lineTo(bx, by);
  g.stroke();
  g.beginPath();
  g.moveTo(X1, Y1);
  g.lineTo(bx - uy * hw, by + ux * hw);
  g.lineTo(bx + uy * hw, by - ux * hw);
  g.closePath();
  g.fill();
  g.globalAlpha = 1;
}

// --- the number plane -----------------------------------------------------------------------
// k is the pan progress: the plane dims as the graph scene takes over and the circle keeps a
// short local axis cross of its own.
function plane(t, cam, k) {
  const t0 = T.plane[0];
  const dim = mix(1, 0.28, k);
  // Grid lines: minor at every half unit, major at integers; each grows out of its axis with a
  // stagger that follows its distance from the origin, as Create(NumberPlane) does.
  const xMin = Math.floor((0 - cam.ox) / cam.s) - 1, xMax = Math.ceil((W - cam.ox) / cam.s) + 1;
  const yMin = Math.floor((cam.oy - H) / cam.s) - 1, yMax = Math.ceil(cam.oy / cam.s) + 1;
  const growth = (c, minor) => {
    const start = t0 + 0.08 + Math.min(Math.abs(c), 6) * 0.075 + (minor ? 0.05 : 0);
    return smooth(span(t, start, start + 0.45));
  };
  g.lineCap = 'butt';
  for (let c = xMin; c <= xMax; c += 0.5) {
    if (c === 0) continue;
    const minor = c % 1 !== 0, p = growth(c, minor);
    if (p <= 0) continue;
    const X = sx(cam, c), Y = cam.oy;
    g.globalAlpha = (minor ? 0.34 : 0.62) * dim;
    g.strokeStyle = minor ? C.blueE : C.blueD;
    g.lineWidth = minor ? 1.3 : 2;
    g.beginPath();
    g.moveTo(X, Y - Y * p);
    g.lineTo(X, Y + (H - Y) * p);
    g.stroke();
  }
  for (let c = yMin; c <= yMax; c += 0.5) {
    if (c === 0) continue;
    const minor = c % 1 !== 0, p = growth(c, minor);
    if (p <= 0) continue;
    const Y = sy(cam, c), X = cam.ox;
    g.globalAlpha = (minor ? 0.34 : 0.62) * dim;
    g.strokeStyle = minor ? C.blueE : C.blueD;
    g.lineWidth = minor ? 1.3 : 2;
    g.beginPath();
    g.moveTo(X - X * p, Y);
    g.lineTo(X + (W - X) * p, Y);
    g.stroke();
  }
  // Axes grow out of the origin first.
  const pa = smooth(span(t, t0, t0 + 0.55));
  if (pa > 0) {
    g.globalAlpha = mix(1, 0.3, k);
    g.strokeStyle = C.axis;
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(cam.ox - cam.ox * pa, cam.oy);
    g.lineTo(cam.ox + (W - cam.ox) * pa, cam.oy);
    g.moveTo(cam.ox, cam.oy - cam.oy * pa);
    g.lineTo(cam.ox, cam.oy + (H - cam.oy) * pa);
    g.stroke();
  }
  g.globalAlpha = 1;
  // The circle's own short axes, which take over from the plane's during the pan.
  if (k > 0) {
    line(cam, -1.45, 0, 1.45, 0, C.axis, 2.4, k);
    line(cam, 0, -1.45, 0, 1.45, C.axis, 2.4, k);
  }
  // Complex-plane coordinates: 1, −1, i, −i, each fading in with a small upward drift.
  const labels = [
    ['one', 1.16, -0.2], ['mone', -1.18, -0.2], ['i', -0.2, 1.16], ['mi', -0.24, -1.16],
  ];
  labels.forEach(([k, x, y], i) => {
    const s0 = T.coords[0] + i * 0.08, p = easeOut(span(t, s0, s0 + 0.3));
    if (p <= 0) return;
    const by = sy(cam, y) + 12 + (1 - p) * 10;
    formula(F[k], sx(cam, x), by, { alpha: p });
  });
}

// --- the angle --------------------------------------------------------------------------------
function theta(t) {
  if (t < T.spin[0]) return 0;
  if (t < T.trace[0]) return TAU * smooth(span(t, T.spin[0], T.spin[1]));
  return TAU * traceRate(span(t, T.trace[0], T.trace[1]));
}

// --- scene pieces ---------------------------------------------------------------------------
function unitCircle(t, cam) {
  const p = smooth(span(t, T.circle[0], T.circle[1]));
  if (p <= 0) return;
  g.strokeStyle = C.blue;
  g.lineWidth = 4;
  g.lineCap = 'butt';
  g.beginPath();
  g.arc(sx(cam, 0), sy(cam, 0), cam.s, 0, -TAU * p, true);
  g.stroke();
}

function equation(t, cam) {
  const n = F.eq.glyphs.length;
  const cx = 960, by = 170;
  const gone = easeOut(span(t, T.move[0], T.move[0] + 0.4));       // non-matching glyphs fade
  const fly = smooth(span(t, T.move[0], T.move[1]));               // "sin θ" travels to the graph
  if (t < T.move[0]) {
    formula(F.eq, cx, by, { prog: i => span(t, writeStart(i, n, T.write[0], T.write[1]), writeStart(i, n, T.write[0], T.write[1]) + WRITE_DUR) });
    return;
  }
  if (gone < 1) formula(F.eq, cx, by, { alpha: 1 - gone, prog: i => SIN_IN_EQ.includes(i) ? 0 : 1 });
  // TransformMatchingTex: each "sin θ" glyph is interpolated from its place in the equation
  // to its place in the graph label, in position and size.
  const lab = F.sinLabel, tx = sx(cam, GX + Math.PI / 2), ty = sy(cam, 1.32);
  const x0 = cx - F.eq.w / 2, lx0 = tx - lab.w / 2;
  SIN_IN_EQ.forEach((gi, j) => {
    const a = F.eq.glyphs[gi], b = lab.glyphs[j];
    const X = mix(x0 + a.x, lx0 + b.x, fly), Y = mix(by + a.dy, ty + b.dy, fly), px = mix(a.px, b.px, fly);
    g.font = (a.f === 'M' ? MATH : ROMAN)(px);
    g.fillStyle = a.col;
    g.fillText(a.ch, X, Y);
  });
}

function vector(t, cam, th) {
  const grow = easeOut(span(t, T.arrow[0], T.arrow[1]));
  if (grow <= 0) return;
  const r = grow, px = Math.cos(th) * r, py = Math.sin(th) * r;
  arrow(cam, 0, 0, px, py, C.yellow, 4, 0.22);
  const pop = backOut(span(t, T.arrow[0] + 0.1, T.arrow[1] + 0.1));
  if (pop > 0) dot(cam, px, py, 0.055 * pop, C.yellow);
}

function angleMark(t, cam, th) {
  const a = easeOut(span(t, T.angle[0], T.angle[1])) * (1 - easeOut(span(t, T.out[0], T.out[1])));
  if (a <= 0 || th <= 0.01) return;
  g.globalAlpha = a;
  g.strokeStyle = C.yellow;
  g.lineWidth = 3;
  g.beginPath();
  g.arc(sx(cam, 0), sy(cam, 0), 0.42 * cam.s, 0, -th, true);
  g.stroke();
  g.globalAlpha = 1;
  // the label sits on the bisector once the wedge is wide enough to hold it, and is nudged off
  // the vector while the angle is still thin
  const la = easeOut(span(t, T.angleLabel[0], T.angleLabel[1])) * (1 - easeOut(span(t, T.out[0], T.out[1])));
  if (la <= 0) return;
  const lr = 0.6, lift = 0.12 * (1 - clamp01(th / 1.2));
  const lx = Math.cos(th / 2) * lr, ly = Math.sin(th / 2) * lr + lift;
  formula(F.theta, sx(cam, lx), sy(cam, ly) + 14, { alpha: la });
}

function projections(t, cam, th) {
  const create = smooth(span(t, T.proj[0], T.proj[1]));
  const out = easeOut(span(t, T.out[0], T.out[1]));
  if (create <= 0) return;
  const cx = Math.cos(th), sn = Math.sin(th);
  // cos θ: a blue segment along the real axis, created from the origin.
  if (out < 1) {
    line(cam, 0, 0, cx * create, 0, C.blue, 6, 1 - out);
    const show = clamp01((Math.abs(cx) - 0.3) / 0.2) * (1 - out) * create;
    // The label hangs under the segment while the vector is above the axis; once the vector
    // swings below, it hangs under the vector instead, clear of the arc and the dashed drop.
    const lx = sn >= 0 ? cx / 2 : cx * 0.45, ly = sn >= 0 ? -0.25 : sn / 2 - 0.34;
    formula(F.cos, sx(cam, lx), sy(cam, ly) + 12, { alpha: show });
  }
  // sin θ: a red dashed drop from the point to the real axis; it stays for the graph scene.
  line(cam, cx, 0, cx, sn * create, C.red, 3, 1, [14, 10]);
  if (out < 1) {
    // beside the point, outside the circle; it fades across cos θ = 0, where it changes side
    const show = clamp01((Math.abs(sn) - 0.42) / 0.15) * clamp01((Math.abs(cx) - 0.12) / 0.12) * (1 - out) * create;
    const side = cx >= 0 ? 1 : -1;
    formula(F.sin, sx(cam, cx + side * 0.38), sy(cam, sn) + 16, { alpha: show });
  }
}

function graphAxes(t, cam) {
  const px = smooth(span(t, T.axis[0], T.axis[1]));
  if (px <= 0) return;
  const py = smooth(span(t, T.axis[0] + 0.2, T.axis[1]));
  const xEnd = X_END;
  arrow(cam, GX, 0, GX + (xEnd - GX) * px, 0, C.axis, 2.4, 0.2);
  if (py > 0) arrow(cam, GX, -1.4 * py, GX, 1.4 * py, C.axis, 2.4, 0.2);
  // ticks and labels at multiples of π/2, staggered FadeIn
  const names = ['halfPi', 'pi', 'threeHalfPi', 'twoPi'];
  names.forEach((k, i) => {
    const s0 = T.ticks[0] + i * 0.15, p = easeOut(span(t, s0, s0 + 0.3));
    if (p <= 0) return;
    const x = GX + (i + 1) * Math.PI / 2;
    line(cam, x, -0.08, x, 0.08, C.axis, 2.4, p);
    formula(F[k], sx(cam, x), sy(cam, -0.3) + 12 + (1 - p) * 8, { alpha: p });
  });
  [[1, 'one'], [-1, 'mone']].forEach(([y, k], i) => {
    const s0 = T.ticks[0] + 0.1 + i * 0.12, p = easeOut(span(t, s0, s0 + 0.3));
    if (p <= 0) return;
    line(cam, GX - 0.08, y, GX + 0.08, y, C.axis, 2.4, p);
    formula(F[k], sx(cam, GX - 0.28), sy(cam, y) + 12, { alpha: p });
  });
  const pl = easeOut(span(t, T.ticks[0] + 0.6, T.ticks[0] + 0.9));
  if (pl > 0) formula(F.thetaAxis, sx(cam, xEnd + 0.22), sy(cam, 0) + 14, { alpha: pl });
}

function sinePath(cam, a, b) {
  const steps = Math.max(2, Math.ceil((b - a) * cam.s / 3));
  g.beginPath();
  for (let i = 0; i <= steps; i++) {
    const th = a + (b - a) * i / steps;
    const X = sx(cam, GX + th), Y = sy(cam, Math.sin(th));
    if (i === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
  }
}

function sineTrace(t, cam, th) {
  if (t < T.trace[0]) return;
  const link = easeOut(span(t, T.trace[0], T.trace[0] + 0.25)) * (1 - easeOut(span(t, T.flash[0], T.flash[0] + 0.3)));
  const cx = Math.cos(th), sn = Math.sin(th);
  // dashed guide from the point on the circle across to the point on the graph; it has done
  // its job once the curve is complete and leaves with the flash
  if (link > 0) line(cam, cx, sn, GX + th, sn, C.grey, 2, 0.75 * link, [12, 9]);
  if (th > 0.002) {
    g.strokeStyle = C.red;
    g.lineWidth = 4;
    g.lineJoin = 'round';
    g.lineCap = 'round';
    sinePath(cam, 0, th);
    g.stroke();
  }
  dot(cam, GX + th, sn, 0.05, C.red, link);
  // ShowPassingFlash: a bright comet runs the length of the curve once it is complete
  const f = span(t, T.flash[0], T.flash[1]);
  if (f > 0 && f < 1) {
    const tail = 1.5, head = f * (TAU + tail), segs = 14;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    for (let i = 0; i < segs; i++) {
      const a = Math.max(0, head - tail + tail * i / segs), b = Math.min(TAU, head - tail + tail * (i + 1) / segs);
      if (b <= a) continue;
      const k = (i + 1) / segs;
      g.globalAlpha = 0.18 * k;
      g.strokeStyle = C.yellow;
      g.lineWidth = 14;
      sinePath(cam, a, b);
      g.stroke();
      g.globalAlpha = k;
      g.strokeStyle = C.flash;
      g.lineWidth = 6;
      sinePath(cam, a, b);
      g.stroke();
    }
    g.globalAlpha = 1;
  }
}

// --- the frame ------------------------------------------------------------------------------
function frame(t) {
  const cam = camera(t);
  const th = theta(t);
  const panK = smooth(span(t, T.pan[0], T.pan[1]));
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#000';
  g.fillRect(0, 0, W, H);
  g.textBaseline = 'alphabetic';
  g.textAlign = 'left';
  plane(t, cam, panK);
  graphAxes(t, cam);
  unitCircle(t, cam);
  projections(t, cam, th);
  sineTrace(t, cam, th);
  vector(t, cam, th);
  angleMark(t, cam, th);
  equation(t, cam);
  // FadeOut to black at the end
  const fade = smooth(span(t, T.fade[0], T.fade[1]));
  if (fade > 0) {
    g.globalAlpha = fade;
    g.fillStyle = '#000';
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;
  }
}

window.draw = ({ t }) => {
  frame(Math.max(0, Math.min(DUR, t)));
  const data = cv.toDataURL('image/jpeg', 0.92);
  return data.slice(data.indexOf(',') + 1);
};

// Sound cues for audio.py: every Write glyph, the Creates, the vector pop, the sweep, the pan,
// the matching-tex move, the axis and tick FadeIns, the sine trace, the flash and the fade.
window.events = () => {
  const ev = [];
  const push = (t, k, extra = {}) => ev.push({ t: +t.toFixed(4), k, ...extra });
  push(T.plane[0], 'plane', { d: T.plane[1] - T.plane[0] });
  push(T.circle[0], 'circle', { d: T.circle[1] - T.circle[0] });
  const n = F.eq.glyphs.length;
  for (let i = 0; i < n; i++) push(writeStart(i, n, T.write[0], T.write[1]), 'glyph', { v: i / (n - 1) });
  push(T.arrow[0], 'pop');
  push(T.spin[0], 'spin', { d: T.spin[1] - T.spin[0] });
  push(T.angle[0], 'show');
  push(T.proj[0], 'show');
  push(T.pan[0], 'pan', { d: T.pan[1] - T.pan[0] });
  push(T.move[0], 'move', { d: T.move[1] - T.move[0] });
  push(T.axis[0], 'axis', { d: T.axis[1] - T.axis[0] });
  for (let i = 0; i < 4; i++) push(T.ticks[0] + i * 0.15, 'tick', { v: i / 3 });
  push(T.trace[0], 'trace', { d: T.trace[1] - T.trace[0] });
  push(T.flash[0], 'flash', { d: T.flash[1] - T.flash[0] });
  push(T.fade[0], 'end', { d: T.fade[1] - T.fade[0] });
  return ev.sort((a, b) => a.t - b.t);
};

window.ready = document.fonts.ready
  .then(() => Promise.all([
    document.fonts.load(MATH(40), 'eiθπxy'),
    document.fonts.load(ROMAN(40), 'cosin=+−/0123'),
  ]))
  .then(setup);
</script>
