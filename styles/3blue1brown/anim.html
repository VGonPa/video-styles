const DET_HEAD = [['rd', W_], ['re', W_], ['rt', W_], ['r(', W_], ['mA', W_], ['r)', W_], ['r=', W_, 'rel']];
const DET = setLine([...DET_HEAD, ['r2', HUE.green], ['r⋅', W_, 'bin'], ['r2', HUE.red], ['r−', W_, 'bin'],
  ['r1', HUE.red], ['r⋅', W_, 'bin'], ['r1', HUE.green]]);
DET.top = -0.75; DET.bot = 0.25;
const RES = setLine([...DET_HEAD, ['r3', HUE.yellow]]);
const HEAD_N = DET_HEAD.length;
// i-hat and j-hat: dotless italic letters under the roman circumflex, placed as TeX centres an accent (with skew)
const IHAT = { gl: [{ k: 'mı', colour: HUE.green, x: 0, y: 0 }, { k: 'rˆ', colour: HUE.green, x: -0.05, y: 0 }], w: 0.345, cy: -0.35 };
const JHAT = { gl: [{ k: 'mȷ', colour: HUE.red, x: 0, y: 0 }, { k: 'rˆ', colour: HUE.red, x: 0.04, y: 0 }], w: 0.412, cy: -0.25 };

// ---------------- painting ----------------
// One glyph at progress a of Manim's Write: first half traces every contour, second half fills it
// while the tracing stroke thins away. sy lets a FadeTransform stretch a glyph non-uniformly.
function paintGlyph(k, x, y, s, colour, a, alpha = 1, sy = s) {
  if (a <= 0 || alpha <= 0.003) return;
  const g = GL[k], trace = smooth(Math.min(1, a * 2)), fill = smooth(Math.max(0, a * 2 - 1));
  ctx.save(); ctx.translate(x, y); ctx.scale(s, sy);
  if (fill > 0) { ctx.globalAlpha = alpha * fill; ctx.fillStyle = colour; ctx.fill(g.full); }
  const lw = 2.2 * (1 - fill);
  if (lw > 0.02) {
    ctx.globalAlpha = alpha; ctx.strokeStyle = colour; ctx.lineWidth = lw / s; ctx.lineJoin = 'round';
    for (const c of g.parts) {
      if (trace < 1) { const L = c.n * trace; if (L < 1e-4) continue; ctx.setLineDash([L, c.n + 1]); } else ctx.setLineDash([]);
      ctx.stroke(c.p);
    }
    ctx.setLineDash([]);
  }
  ctx.restore();
}
// Write a whole formula: p runs 0→1 linearly over the beat, glyphs stagger with the given lag.
function writeFormula(f, X, Y, S, p, alpha = 1, lag = 0.22, from = 0, to = f.gl.length) {
  for (let i = from; i < to; i++) {
    const g = f.gl[i];
    paintGlyph(g.k, X + g.x * S, Y + g.y * S, S, g.colour, piece(p, i, f.gl.length, lag), alpha);
  }
}
function backdrop(x, y, w, h, alpha) {             // Manim's BackgroundRectangle: black at 75 % opacity
  if (alpha <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${0.78 * alpha})`; ctx.fillRect(x, y, w, h);
}

// ---------------- the plane ----------------
const UNIT = 160, OX = 880, OY = 744;
const M = [[2, 1], [1, 2]];
const toX = x => OX + UNIT * x, toY = y => OY - UNIT * y;
// the linear interpolation ApplyMatrix uses: (1 − a)·I + a·M
const matAt = a => [[1 + a * (M[0][0] - 1), a * M[0][1]], [a * M[1][0], 1 + a * (M[1][1] - 1)]];
const apply = (m, p) => [m[0][0] * p[0] + m[0][1] * p[1], m[1][0] * p[0] + m[1][1] * p[1]];

const VIEW = { x0: (0 - OX) / UNIT - 0.3, x1: (W - OX) / UNIT + 0.3, y0: (OY - H) / UNIT - 0.3, y1: OY / UNIT + 0.3 };
const LINES = [];                                    // {p, q, vp, vq, kind, level}
for (let i = -20; i <= 20; i++) {
  const k = i / 2, kind = i === 0 ? 'axis' : i % 2 ? 'faded' : 'main', level = Math.min(Math.abs(i), 14);
  // each line grows out of the axis it crosses, towards both edges of the view
  LINES.push({ p: [k, -12], q: [k, 12], c: [k, 0], vp: [k, VIEW.y0], vq: [k, VIEW.y1], kind, level });   // verticals
  LINES.push({ p: [-12, k], q: [12, k], c: [0, k], vp: [VIEW.x0, k], vq: [VIEW.x1, k], kind, level });   // horizontals
}
const LEVELS = 15;
const STYLE = {
  ghost: { colour: 'rgba(255,255,255,0.17)', width: 1.4 },
  faded: { colour: 'rgba(41,171,202,0.42)', width: 1.2 },
  main: { colour: HUE.blue, width: 2.2 },
  axis: { colour: HUE.white, width: 2.6 },
};
function strokeLines(kinds, st, m, created, moving) {
  ctx.strokeStyle = st.colour; ctx.lineWidth = st.width; ctx.lineCap = 'butt';
  ctx.beginPath();
  for (const L of LINES) {
    if (!kinds.includes(L.kind)) continue;
    const f = smooth(piece(created, L.level, LEVELS, 0.07));
    if (f <= 0) continue;
    let a, b;
    if (f < 1) { a = [mix(L.c[0], L.vp[0], f), mix(L.c[1], L.vp[1], f)]; b = [mix(L.c[0], L.vq[0], f), mix(L.c[1], L.vq[1], f)]; }
    else { a = L.p; b = L.q; }
    if (moving) { a = apply(m, a); b = apply(m, b); }
    ctx.moveTo(toX(a[0]), toY(a[1])); ctx.lineTo(toX(b[0]), toY(b[1]));
  }
  ctx.stroke();
}
// Manim's Vector: a 6 px shaft and a filled triangular tip; GrowArrow scales it out of the origin
function vector(end, colour, grow) {
  if (grow <= 0) return;
  const ex = end[0] * UNIT, ey = end[1] * UNIT, len = Math.hypot(ex, ey);
  const tip = Math.min(0.34 * UNIT, 0.3 * len) * grow, ux = ex / len, uy = ey / len;
  const tx = OX + ex * grow, ty = OY - ey * grow;
  const bx = tx - ux * tip, by = ty + uy * tip;
  ctx.strokeStyle = colour; ctx.lineWidth = 6.5; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(OX, OY); ctx.lineTo(tx - ux * tip * 0.6, ty + uy * tip * 0.6); ctx.stroke();
  const hw = tip * 0.5;
  ctx.fillStyle = colour; ctx.beginPath();
  ctx.moveTo(tx, ty); ctx.lineTo(bx - uy * hw, by - ux * hw); ctx.lineTo(bx + uy * hw, by + ux * hw); ctx.closePath(); ctx.fill();
}
// label sits just off the vector's tip, on its clockwise (i-hat) or counter-clockwise (j-hat) side
function labelSpot(end, side) {
  const len = Math.hypot(end[0], end[1]), ux = end[0] / len, uy = end[1] / len;
  const px = side > 0 ? uy : -uy, py = side > 0 ? -ux : ux;
  return [end[0] + 0.46 * px - 0.08 * ux, end[1] + 0.46 * py - 0.08 * uy];
}
function paintLabel(f, spot, S, p, alpha = 1) {
  writeFormula(f, toX(spot[0]) - f.w * S / 2, toY(spot[1]) - f.cy * S, S, p, alpha, 0.4);
}
// a polygon traced from its first vertex (Create), with fill fading in afterwards (DrawBorderThenFill)
function tracePolygon(pts, trace, fill, colour, fillAlpha, width) {
  const P = pts.map(p => [toX(p[0]), toY(p[1])]);
  if (fill > 0) {
    ctx.globalAlpha = fillAlpha * fill; ctx.fillStyle = colour;
    ctx.beginPath(); P.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if (trace <= 0) return;
  let per = 0; const seg = P.map((p, i) => { const q = P[(i + 1) % P.length]; const l = Math.hypot(q[0] - p[0], q[1] - p[1]); per += l; return l; });
  ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]);
  let left = per * trace;
  for (let i = 0; i < P.length && left > 0; i++) {
    const q = P[(i + 1) % P.length], k = Math.min(1, left / seg[i]);
    ctx.lineTo(mix(P[i][0], q[0], k), mix(P[i][1], q[1], k)); left -= seg[i];
  }
  if (trace >= 1) ctx.closePath();
  ctx.stroke();
}

// ---------------- panel layout (top left) ----------------
const TEX = 72, PX = 96, MAT_Y = 200, DET_Y = 392, BUFF = 18;
const AREA_S = 76;
const RES3 = RES.gl[HEAD_N];                          // the yellow 3 at the end of det(A) = 3

// ---------------- one frame ----------------
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const created = span(t, B.grid[0], B.grid[1]);
  const a = smooth(span(t, B.apply[0], B.apply[1])), m = matAt(a);

  // static ghost of the original grid, then the moving plane: faded half-unit lines, unit lines, axes
  strokeLines(['main', 'axis'], STYLE.ghost, m, created, false);
  strokeLines(['faded'], STYLE.faded, m, created, true);
  strokeLines(['main'], STYLE.main, m, created, true);
  strokeLines(['axis'], STYLE.axis, m, created, true);

  // unit square → parallelogram
  const sq = span(t, B.sq[0], B.sq[1]);
  if (sq > 0) {
    const pts = [[0, 0], [1, 0], [1, 1], [0, 1]].map(p => apply(m, p));
    tracePolygon(pts, smooth(Math.min(1, sq * 2)), smooth(Math.max(0, sq * 2 - 1)), HUE.yellow, 0.32, 3);
  }

  // basis vectors and their labels
  const iEnd = apply(m, [1, 0]), jEnd = apply(m, [0, 1]);
  vector(iEnd, HUE.green, smooth(span(t, B.iv[0], B.iv[1])));
  vector(jEnd, HUE.red, smooth(span(t, B.jv[0], B.jv[1])));
  paintLabel(IHAT, labelSpot(iEnd, 1), 80, span(t, B.ilab[0], B.ilab[1]));
  paintLabel(JHAT, labelSpot(jEnd, -1), 80, span(t, B.jlab[0], B.jlab[1]));

  // area label riding at the square's centre: "1", later replaced by the 3 carried over from the panel
  const centre = apply(m, [0.5, 0.5]);
  const cx = toX(centre[0]), cy = toY(centre[1]);
  const cd = B.copy[1] - B.copy[0];
  const oneOut = smooth(span(t, B.copy[0] + 0.45 * cd, B.copy[0] + 0.9 * cd));   // gives way as the 3 arrives
  const oneS = AREA_S * (1 - 0.5 * oneOut);
  paintGlyph('r1', cx - GL.r1.w * oneS / 2, cy + 0.333 * oneS, oneS, W_, span(t, B.one[0], B.one[1]), 1 - oneOut);

  // panel: the matrix, with an Indicate pulse (there and back) as the anticipation before it acts
  const pu = span(t, B.pulse[0], B.pulse[1]), k = 1 + 0.12 * smooth(pu < 0.5 ? pu * 2 : 2 - pu * 2);
  const mcx = PX + MAT.w * TEX / 2, mcy = MAT_Y + (MAT.top + MAT.bot) / 2 * TEX;
  const mx = mcx + (PX - mcx) * k, my = mcy + (MAT_Y - mcy) * k, ms = TEX * k;
  backdrop(mx - BUFF * k, my + MAT.top * ms - BUFF * k, MAT.w * ms + 2 * BUFF * k, (MAT.bot - MAT.top) * ms + 2 * BUFF * k, smooth(span(t, B.matBg[0], B.matBg[1])));
  writeFormula(MAT, mx, my, ms, span(t, B.mat[0], B.mat[1]), 1, 0.3);

  // panel: det(A) = 2·2 − 1·1, then the right-hand side folds into 3
  const mo = smooth(span(t, B.morph[0], B.morph[1]));
  const detW = mix(DET.w, RES.w, mo);
  backdrop(PX - BUFF, DET_Y + DET.top * TEX - BUFF, detW * TEX + 2 * BUFF, (DET.bot - DET.top) * TEX + 2 * BUFF, smooth(span(t, B.detBg[0], B.detBg[1])));
  const dp = span(t, B.det[0], B.det[1]);
  writeFormula(DET, PX, DET_Y, TEX, dp, 1, 0.2, 0, HEAD_N);
  if (t < B.morph[0]) {
    writeFormula(DET, PX, DET_Y, TEX, dp, 1, 0.2, HEAD_N, DET.gl.length);
  } else {
    // the unmatched right-hand side collapses into the 3: its pieces slide together, shrink and fade
    // while the 3 grows out of the spot where they meet (matching det(A) = stays where it is)
    const c3 = RES3.x + GL.r3.w / 2, gone = smooth(Math.min(1, mo * 1.25));
    for (let i = HEAD_N; i < DET.gl.length; i++) {
      const g = DET.gl[i], w = GL[g.k].w, c = mix(g.x + w / 2, c3, mo), s = TEX * mix(1, 0.45, mo);
      paintGlyph(g.k, PX + c * TEX - w * s / 2, DET_Y + 0.3 * (s - TEX), s, g.colour, 1, 1 - gone);
    }
    const s3 = TEX * mix(0.45, 1, mo);
    paintGlyph('r3', PX + c3 * TEX - GL.r3.w * s3 / 2, DET_Y + 0.333 * (s3 - TEX), s3, HUE.yellow, 1, smooth(span(mo, 0.15, 1)));
  }
  // the 3 copied out of the panel (TransformFromCopy), lifted over j-hat and dropped into the
  // parallelogram through its top edge: a quadratic curve whose control point sits above the target
  const cp = smooth(span(t, B.copy[0], B.copy[1]));
  if (cp > 0) {
    const sx0 = PX + RES3.x * TEX + GL.r3.w * TEX / 2, sy0 = DET_Y - 0.333 * TEX;
    const kx = cx + 90, ky = cy - 330, u = cp, v = 1 - cp;
    const x = v * v * sx0 + 2 * v * u * kx + u * u * cx, y = v * v * sy0 + 2 * v * u * ky + u * u * cy, s = mix(TEX, AREA_S, cp);
    const col = cp < 1 ? `rgb(255,255,${Math.round(255 * cp)})` : W_;
    paintGlyph('r3', x - GL.r3.w * s / 2, y + 0.333 * s, s, col, 1, 1);
  }
  // final emphasis: a yellow SurroundingRectangle drawn around det(A) = 3
  const bx = span(t, B.box[0], B.box[1]);
  if (bx > 0) {
    const pad = 11, x0 = PX - pad, x1 = PX + RES.w * TEX + pad, y0 = DET_Y + DET.top * TEX - pad, y1 = DET_Y + DET.bot * TEX + pad;
    const pts = [[x1, y0], [x0, y0], [x0, y1], [x1, y1]].map(p => [(p[0] - OX) / UNIT, (OY - p[1]) / UNIT]);
    tracePolygon(pts, smooth(bx), 0, HUE.yellow, 0, 3);
  }

  // close: everything fades out to black
  const out = smooth(span(t, B.out[0], B.out[1]));
  if (out > 0) { ctx.globalAlpha = out; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------------- sound cues ----------------
function cues() {
  const ev = [{ t: B.grid[0], k: 'open', d: B.grid[1] - B.grid[0] }];
  ev.push({ t: B.iv[0], k: 'vector', v: 0 }, { t: B.jv[0], k: 'vector', v: 1 });
  ev.push({ t: B.ilab[0], k: 'label', v: 0 }, { t: B.jlab[0], k: 'label', v: 1 });
  ev.push({ t: B.sq[0], k: 'square', d: B.sq[1] - B.sq[0] }, { t: B.one[0], k: 'label', v: 2 });
  const glyphStarts = (beat, n, lag) => { const d = 1 / (1 + lag * (n - 1)); return Array.from({ length: n }, (_, i) => beat[0] + (beat[1] - beat[0]) * i * lag * d); };
  glyphStarts(B.mat, MAT.gl.length, 0.3).forEach((t0, i) => ev.push({ t: +t0.toFixed(4), k: 'glyph', v: i }));
  ev.push({ t: B.pulse[0], k: 'pulse', d: B.pulse[1] - B.pulse[0] }, { t: B.apply[0], k: 'apply', d: B.apply[1] - B.apply[0] });
  glyphStarts(B.det, DET.gl.length, 0.2).forEach((t0, i) => ev.push({ t: +t0.toFixed(4), k: 'glyph', v: i }));
  ev.push({ t: B.morph[0], k: 'morph', d: B.morph[1] - B.morph[0] });
  ev.push({ t: B.copy[0], k: 'copy', d: B.copy[1] - B.copy[0] });
  ev.push({ t: B.box[0], k: 'box', d: B.box[1] - B.box[0] });
  ev.push({ t: B.out[0], k: 'out', d: B.out[1] - B.out[0] });
  for (const e of ev) { e.t = +e.t.toFixed(4); if (e.d !== undefined) e.d = +e.d.toFixed(4); }
  return ev.sort((p, q) => p.t - q.t);
}

window.ready = Promise.resolve().then(() => { frame(0); return true; });
window.draw = ({ t }) => {
  frame(t);
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.events = () => cues();
</script>
</body>
</html>
