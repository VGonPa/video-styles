<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── vhs-camcorder · a 1996 backyard birthday tape played back on a VCR ─────────────────────────
// VCR blue screen "PLAY ▶" → picture rolls and locks (B&W first, colour pops in) → handheld wide shot of a garden party
// (bunting, balloons, gingham table, cake, a dog in a party hat) → rocker zoom onto the cake, the optical range runs out
// and D.ZOOM kicks in (blocky) → ▶▶ FF (picture search bars, pitched-up audio) → PLAY: candles are blown out, smoke,
// confetti, the dog hops → ◀◀ REW (smoke flows back into the candles, they relight) → PLAY → the tape breaks up into
// snow → blue "NO SIGNAL" → fade to black.
// The scene lives in *tape time* τ(t): every recorded thing (camera, handheld shake, flames, dog, burned-in camcorder OSD)
// is a function of τ, so FF/REW genuinely scrub it. The camcorder picture is drawn at 640×480, then degraded per frame
// (YIQ split, luma ringing, chroma bleed + delay, per-line jitter, tracking band, head-switching, dropouts, snow) and
// scaled into a 4:3 window. The VCR's own OSD and blue screen are crisp overlays, untouched by the tape.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const IX = 240, IW = 1440, IH = 1080;            // 4:3 picture area, pillarboxed
const SW = 640, SH = 480, NPX = SW * SH;          // tape resolution
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const sInOut = u => u * u * (3 - 2 * u);
const bump = (t, c, w) => { const u = (t - c) / w; return Math.abs(u) >= 1 ? 0 : 0.5 + 0.5 * Math.cos(Math.PI * u); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => { let u = r() || 1e-9, v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const VCR = '"VT323"', FUN = '"Chewy"';

// ── deck timeline: [t0, t1, mode, tape speed] ───────────────────────────────────────────────
const SEGS = [[0, 0.62, 'blue', 0], [0.62, 1.05, 'lock', 1], [1.05, 4.6, 'play', 1], [4.6, 5.2, 'ff', 5.2],
  [5.2, 6.8, 'play', 1], [6.8, 7.75, 'rew', -3.6], [7.75, 8.3, 'play', 1], [8.3, 9.0, 'snow', 1], [9.0, 10.5, 'end', 0]];
const modeAt = t => { for (const s of SEGS) if (t < s[1]) return s; return SEGS[SEGS.length - 1]; };
const TD = 1000, TN = Math.ceil(10.5 * TD);        // τ(t) table at 1 ms (capstan spin-up/down smoothed over 120 ms)
const TAUT = new Float32Array(TN + 1);
{ const raw = new Float32Array(TN + 1); for (let i = 0; i <= TN; i++) raw[i] = modeAt(i / TD)[3];
  const K = 60; let acc = 0;
  for (let i = 0; i <= TN; i++) { let s = 0, n = 0; for (let j = i - K; j <= i + K; j++) { if (j >= 0 && j <= TN) { s += raw[j]; n++; } } acc += s / n / TD; TAUT[i] = acc; } }
const tauAt = t => { const x = clamp(t, 0, 10.5) * TD, i = Math.floor(x), f = x - i; return i >= TN ? TAUT[TN] : lerp(TAUT[i], TAUT[i + 1], f); };

// ── recorded story (tape time) ────────────────────────────────────────────────────────────
const TB = 7.45;                                   // candles blown out
const TJ = TB + 0.32;                              // dog hops, confetti pops
const ZOPT = 2.6;                                  // optical zoom limit → digital beyond
function cam(tau) {
  const u1 = eInOut(seg(tau, 1.5, 3.3)), u2 = eInOut(seg(tau, 4.75, 6.35));
  let z = 1.06 * Math.pow(6.0 / 1.06, u1); z *= Math.pow(1.6 / 6.0, u2);
  let cx = lerp(316, 334, sInOut(seg(tau, 0, 1.5))), cy = lerp(246, 250, seg(tau, 0, 1.5));
  cx = lerp(cx, 425, u1); cy = lerp(cy, 283, u1); cx = lerp(cx, 362, u2); cy = lerp(cy, 296, u2);
  const amp = 1.5 + 1.1 * Math.log(z);
  const hx = amp * (0.62 * Math.sin(tau * 1.7 + .3) + 0.3 * Math.sin(tau * 3.3 + 1.2) + 0.14 * Math.sin(tau * 7.9 + 2.1));
  const hy = amp * (0.55 * Math.sin(tau * 1.3 + 2.0) + 0.32 * Math.sin(tau * 2.9 + .4) + 0.12 * Math.sin(tau * 8.7 + .9));
  const rot = 0.006 * Math.sin(tau * 1.1 + .5) + 0.003 * Math.sin(tau * 2.7 + 1.9);
  const blur = 2.4 * bump(tau, 3.3, 0.34) + 2.0 * bump(tau, 6.4, 0.36) + 1.2 * bump(tau, 1.6, 0.2);
  return { z, cx, cy, hx, hy, rot, blur };
}

// ── precomputed textures ──────────────────────────────────────────────────────────────────
const BS = 3, BX0 = -90, BY0 = -70, BWW = 820, BWH = 620;     // background world rect, at 3× res
const BG = mk(BWW * BS, BWH * BS);
const NZN = 1024, NZ = new Float32Array(NZN * NZN);           // luma noise, lightly h-correlated
const CNN = 512, CNI = new Float32Array(CNN * CNN), CNQ = new Float32Array(CNN * CNN);   // chroma noise, smeared
const SCAN = mk(IW, IH);
let GING;
function buildNoise() {
  const r = rng(901);
  const tmp = new Float32Array(NZN * NZN); for (let i = 0; i < tmp.length; i++) tmp[i] = gauss(r);
  for (let y = 0; y < NZN; y++) for (let x = 0; x < NZN; x++) { const i = y * NZN + x; NZ[i] = 0.6 * tmp[i] + 0.4 * tmp[y * NZN + ((x + 1) & (NZN - 1))]; }
  for (const A of [CNI, CNQ]) {
    const t2 = new Float32Array(CNN * CNN); for (let i = 0; i < t2.length; i++) t2[i] = gauss(r);
    for (let y = 0; y < CNN; y++) { let s = 0; const R = 14;
      for (let x = -R; x <= R; x++) s += t2[y * CNN + ((x + CNN) % CNN)];
      for (let x = 0; x < CNN; x++) { A[y * CNN + x] = s / Math.sqrt(2 * R + 1); s += t2[y * CNN + ((x + R + 1) % CNN)] - t2[y * CNN + ((x - R + CNN) % CNN)]; } }
  }
  const g = SCAN.getContext('2d'), id = g.createImageData(IW, IH);
  for (let y = 0; y < IH; y++) { const f = (y / 2.25) % 1, a = Math.round(255 * 0.2 * Math.pow(Math.sin(Math.PI * f), 6));
    for (let x = 0; x < IW; x++) { const i = (y * IW + x) * 4; id.data[i + 3] = a; } }
  g.putImageData(id, 0, 0);
}
function blob(g, x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function buildBG() {
  const g = BG.getContext('2d'), r = rng(77);
  g.setTransform(BS, 0, 0, BS, -BX0 * BS, -BY0 * BS);
  // sky: hazy, slightly blown-out camcorder sky
  let gr = g.createLinearGradient(0, BY0, 0, 240); gr.addColorStop(0, '#6fa6de'); gr.addColorStop(0.55, '#a9cbe9'); gr.addColorStop(1, '#e6eef0');
  g.fillStyle = gr; g.fillRect(BX0, BY0, BWW, 330);
  for (let i = 0; i < 7; i++) { const cx = BX0 + r() * BWW, cy = -30 + r() * 90;
    for (let k = 0; k < 9; k++) { const rr = 14 + r() * 26; const q = g.createRadialGradient(cx + (k - 4) * 16, cy + r() * 12, 0, cx + (k - 4) * 16, cy + r() * 12, rr);
      q.addColorStop(0, 'rgba(255,255,255,.75)'); q.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = q; g.fillRect(cx - 120, cy - 60, 240, 120); } }
  // sun bloom, top right
  gr = g.createRadialGradient(600, 10, 0, 600, 10, 260); gr.addColorStop(0, 'rgba(255,253,235,1)'); gr.addColorStop(0.18, 'rgba(255,248,215,.85)'); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(BX0, BY0, BWW, 360);
  // trees: far row, then near hedge
  const tree = (x, y, s, dark, mid, lite) => {
    for (let k = 0; k < 26; k++) { const a = r() * TAU, d = r() * s; blob(g, x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8, s * (0.35 + r() * 0.3), k < 10 ? dark : (k < 20 ? mid : lite)); }
  };
  for (let x = BX0; x < 740; x += 46 + r() * 30) tree(x, 150 + r() * 25, 34 + r() * 22, '#2f5a31', '#3f6f38', '#5b8a45');
  g.fillStyle = '#35602f'; g.fillRect(BX0, 175, BWW, 60);
  for (let x = BX0; x < 740; x += 20 + r() * 14) tree(x, 196 + r() * 14, 16 + r() * 10, '#2c5a2c', '#3f7536', '#6a9b4c');
  // flowering shrubs in front of the fence, behind? no: fence first, shrubs in front
  // picket fence
  const FT = 214, FB = 302;
  g.fillStyle = '#c9c2b0'; g.fillRect(BX0, FT + 18, BWW, 8); g.fillRect(BX0, FB - 30, BWW, 8);
  for (let x = BX0; x < 740; x += 21) {
    const top = FT + (r() - .5) * 2;
    gr = g.createLinearGradient(x, 0, x + 15, 0); gr.addColorStop(0, '#fbf8ef'); gr.addColorStop(0.7, '#eee8da'); gr.addColorStop(1, '#bdb5a2');
    g.fillStyle = gr; g.beginPath(); g.moveTo(x, top + 8); g.lineTo(x + 7.5, top); g.lineTo(x + 15, top + 8); g.lineTo(x + 15, FB); g.lineTo(x, FB); g.closePath(); g.fill();
    g.fillStyle = 'rgba(80,70,50,.18)'; g.fillRect(x + 15, FT + 10, 6, FB - FT - 10);
  }
  // shrubs with flowers along the fence foot
  for (let x = BX0; x < 740; x += 26 + r() * 20) {
    const y = FB - 6, s = 14 + r() * 12;
    for (let k = 0; k < 12; k++) blob(g, x + (r() - .5) * s * 2, y - r() * s, s * (0.4 + r() * 0.3), k < 5 ? '#2f6a2e' : (k < 10 ? '#46853a' : '#6aa24c'));
    const fc = ['#ff7eb6', '#ffd23f', '#ffffff', '#ff5a5f', '#c98bff'][Math.floor(r() * 5)];
    for (let k = 0; k < 7; k++) blob(g, x + (r() - .5) * s * 1.8, y - r() * s * 1.3, 2 + r() * 1.6, fc);
  }
  // lawn with mowing stripes and blades
  gr = g.createLinearGradient(0, FB, 0, 560); gr.addColorStop(0, '#8cc152'); gr.addColorStop(0.5, '#6aa63d'); gr.addColorStop(1, '#4b8a2c');
  g.fillStyle = gr; g.fillRect(BX0, FB, BWW, 560 - FB + 20);
  g.save(); g.beginPath(); g.rect(BX0, FB, BWW, 300); g.clip();
  for (let k = -12; k < 20; k++) { g.fillStyle = k % 2 ? 'rgba(255,255,200,.07)' : 'rgba(0,40,0,.06)';
    g.beginPath(); const x0 = k * 60; g.moveTo(x0, FB); g.lineTo(x0 + 60, FB); g.lineTo(x0 + 60 + 220, 560); g.lineTo(x0 + 220, 560); g.fill(); }
  g.restore();
  for (let i = 0; i < 5000; i++) { const x = BX0 + r() * BWW, y = FB + 2 + Math.pow(r(), 0.8) * 250, l = 1.5 + (y - FB) * 0.03;
    g.strokeStyle = r() < .5 ? 'rgba(40,90,25,.55)' : 'rgba(170,215,110,.5)'; g.lineWidth = 0.4 + (y - FB) * 0.004;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - .5) * 1.5, y - l); g.stroke(); }
  for (let i = 0; i < 40; i++) { const x = BX0 + r() * BWW, y = FB + 10 + r() * 230; blob(g, x, y, 1.2 + (y - FB) * 0.008, r() < .6 ? '#fff6c0' : '#ffffff'); }
  // table shadow on the grass
  g.fillStyle = 'rgba(20,50,10,.35)'; g.beginPath(); g.ellipse(440, 428, 150, 16, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(20,50,10,.3)'; g.beginPath(); g.ellipse(222, 410, 46, 8, 0, 0, TAU); g.fill();
  // gingham pattern
  const P = mk(40, 40), p = P.getContext('2d');
  p.fillStyle = '#fbf6ee'; p.fillRect(0, 0, 40, 40); p.fillStyle = 'rgba(214,40,52,.55)'; p.fillRect(0, 0, 20, 40); p.fillRect(0, 0, 40, 20);
  p.fillStyle = 'rgba(190,20,36,.5)'; p.fillRect(0, 0, 20, 20);
  GING = ctx.createPattern(P, 'repeat'); GING.setTransform(new DOMMatrix().scale(0.25));
}

// ── scene drawing (world coords: the 640×480 wide frame) ───────────────────────────────────
const SC = mk(SW, SH), sg = SC.getContext('2d', { willReadFrequently: true });
const SC2 = mk(SW, SH), sg2 = SC2.getContext('2d');
const SC3 = mk(SW, SH), sg3 = SC3.getContext('2d', { willReadFrequently: true });
const PEN = ['#e8352e', '#ffc93c', '#2f7fe0', '#34b86a', '#ff8a2a', '#b25de0'];
function bunting(g, tau) {
  const txt = 'HAPPY BIRTHDAY', sway = Math.sin(tau * 1.3) * 1.2;
  const yAt = x => 122 + 24 * (1 - Math.pow((x - 291) / 250, 2));
  g.strokeStyle = '#6b5a45'; g.lineWidth = 1.1; g.beginPath();
  for (let x = 20; x <= 562; x += 6) { const y = yAt(x); x === 20 ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke();
  for (let i = 0; i < 14; i++) {
    const x = 70 + i * 34, y = yAt(x), a = Math.sin(tau * 2.1 + i * 0.9) * 0.05 + sway * 0.02;
    g.save(); g.translate(x, y); g.rotate(a);
    g.fillStyle = PEN[i % 6]; g.beginPath(); g.moveTo(-15, 0); g.lineTo(15, 0); g.lineTo(0, 40); g.closePath(); g.fill();
    g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.moveTo(3, 0); g.lineTo(15, 0); g.lineTo(0, 40); g.closePath(); g.fill();
    if (txt[i] !== ' ') { g.fillStyle = '#fffdf5'; g.font = `21px ${FUN}`; g.textAlign = 'center'; g.fillText(txt[i], 0, 20); }
    g.restore();
  }
}
function balloon(g, x, y, col, tau, ph, ax, ay) {
  const bx = x + Math.sin(tau * 1.4 + ph) * 3, by = y + Math.sin(tau * 1.9 + ph * 2) * 2.5;
  g.strokeStyle = 'rgba(245,245,245,.85)'; g.lineWidth = 0.8; g.beginPath(); g.moveTo(bx, by + 28);
  g.quadraticCurveTo(bx + (ax - bx) * 0.3 + Math.sin(tau * 2 + ph) * 6, (by + ay) / 2, ax, ay); g.stroke();
  g.save(); g.translate(bx, by); g.rotate(Math.sin(tau * 1.4 + ph) * 0.06);
  const q = g.createRadialGradient(-8, -10, 2, 0, 0, 30); q.addColorStop(0, '#ffffffcc'); q.addColorStop(0.18, col); q.addColorStop(1, shade(col, -0.45));
  g.fillStyle = q; g.beginPath(); g.ellipse(0, 0, 21, 26, 0, 0, TAU); g.fill();
  g.fillStyle = shade(col, -0.3); g.beginPath(); g.moveTo(-3, 28); g.lineTo(3, 28); g.lineTo(0, 24); g.fill();
  g.restore();
}
function shade(hex, k) { const n = parseInt(hex.slice(1, 7), 16); let r = n >> 16, gg = n >> 8 & 255, b = n & 255;
  const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k); return `rgb(${f(r)},${f(gg)},${f(b)})`; }
function table(g) {
  // legs
  g.fillStyle = '#6b4526'; g.fillRect(318, 392, 8, 38); g.fillRect(552, 392, 8, 38); g.fillStyle = '#4e3119'; g.fillRect(344, 392, 6, 30); g.fillRect(530, 392, 6, 30);
  // top (perspective trapezoid)
  g.save(); g.beginPath(); g.moveTo(318, 314); g.lineTo(546, 314); g.lineTo(572, 338); g.lineTo(296, 338); g.closePath(); g.clip();
  g.save(); g.transform(1, 0, -0.35, 0.55, 110, 150); g.fillStyle = GING; g.fillRect(200, 250, 500, 200); g.restore();
  g.fillStyle = 'rgba(255,250,230,.12)'; g.fillRect(290, 314, 290, 24); g.restore();
  // drape with scalloped hem
  g.save(); g.beginPath(); g.moveTo(296, 338); g.lineTo(572, 338); g.lineTo(574, 392);
  for (let x = 574; x >= 294; x -= 14) g.quadraticCurveTo(x - 7, 400, x - 14, 392); g.closePath(); g.clip();
  g.fillStyle = GING; g.fillRect(290, 336, 290, 70);
  const gr = g.createLinearGradient(0, 338, 0, 400); gr.addColorStop(0, 'rgba(60,20,20,.25)'); gr.addColorStop(1, 'rgba(60,20,20,.05)'); g.fillStyle = gr; g.fillRect(290, 336, 290, 70);
  for (let x = 310; x < 570; x += 38) { g.fillStyle = 'rgba(80,20,20,.12)'; g.fillRect(x, 338, 5, 62); }
  g.restore();
}
function hat(g, x, y, s, rot, c1, c2) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  g.fillStyle = c1; g.beginPath(); g.moveTo(-11, 0); g.lineTo(11, 0); g.lineTo(0, -30); g.closePath(); g.fill();
  g.save(); g.clip(); g.strokeStyle = c2; g.lineWidth = 3.5; for (let k = -2; k < 4; k++) { g.beginPath(); g.moveTo(-14, -k * 9); g.lineTo(14, -k * 9 - 9); g.stroke(); } g.restore();
  g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.moveTo(2, 0); g.lineTo(11, 0); g.lineTo(0, -30); g.fill();
  blob(g, 0, -31, 4, '#ffffff'); blob(g, -1, -32, 1.6, '#fff9c8');
  g.restore();
}
function items(g, tau) {
  // present
  g.fillStyle = '#2f7fe0'; g.fillRect(500, 290, 42, 32); g.fillStyle = '#2465b8'; g.fillRect(530, 290, 12, 32);
  g.fillStyle = '#3c93f0'; g.beginPath(); g.moveTo(500, 290); g.lineTo(542, 290); g.lineTo(548, 285); g.lineTo(506, 285); g.fill();
  g.fillStyle = '#ffd23f'; g.fillRect(517, 285, 7, 37); g.fillRect(500, 302, 42, 6);
  g.fillStyle = '#ffc21a'; g.beginPath(); g.ellipse(514, 280, 9, 5, -0.4, 0, TAU); g.ellipse(528, 280, 9, 5, 0.4, 0, TAU); g.fill();
  // paper cups
  const cup = (x, y, c) => { g.fillStyle = c; g.beginPath(); g.moveTo(x - 7, y - 20); g.lineTo(x + 7, y - 20); g.lineTo(x + 5, y); g.lineTo(x - 5, y); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)'; g.fillRect(x - 6, y - 14, 12, 3); g.fillStyle = '#fff'; g.beginPath(); g.ellipse(x, y - 20, 7, 2, 0, 0, TAU); g.fill(); };
  cup(356, 328, '#e8352e'); cup(482, 330, '#34b86a');
  hat(g, 332, 326, 0.8, -0.2, '#b25de0', '#ffd23f'); hat(g, 560, 332, 0.7, 0.35, '#ff8a2a', '#2f7fe0');
}
function cake(g, tau) {
  const cx = 425;
  g.fillStyle = 'rgba(40,30,20,.25)'; g.beginPath(); g.ellipse(cx, 322, 56, 7, 0, 0, TAU); g.fill();
  g.fillStyle = '#f4f4f0'; g.beginPath(); g.ellipse(cx, 318, 54, 9, 0, 0, TAU); g.fill(); g.fillStyle = '#d9dad6'; g.beginPath(); g.ellipse(cx, 319, 54, 7, 0, 0, Math.PI); g.fill();
  // body
  let gr = g.createLinearGradient(cx - 40, 0, cx + 40, 0); gr.addColorStop(0, '#f39ab8'); gr.addColorStop(0.45, '#ffc4d6'); gr.addColorStop(1, '#d9759a');
  g.fillStyle = gr; g.beginPath(); g.moveTo(cx - 40, 281); g.lineTo(cx - 40, 312); g.ellipse(cx, 312, 40, 8, 0, Math.PI, 0, true); g.lineTo(cx + 40, 281); g.closePath(); g.fill();
  // piped bottom border
  for (let a = 0; a <= 12; a++) { const x = cx - 38 + a * 6.33, y = 312 + Math.sin(Math.PI * a / 12) * 7; blob(g, x, y, 3.1, '#fff6f0'); blob(g, x - 0.8, y - 0.9, 1.2, '#ffffff'); }
  // top + drips
  g.fillStyle = '#fffaf2'; g.beginPath(); g.ellipse(cx, 281, 40, 9, 0, 0, TAU); g.fill();
  g.beginPath(); for (let a = 0; a <= 16; a++) { const u = a / 16, x = cx - 40 + u * 80, y = 281 + Math.sin(Math.PI * u) * 9; const d = [5, 9, 4, 11, 6, 8, 3, 10, 5, 7, 12, 4, 8, 6, 10, 5, 4][a];
    g.moveTo(x - 2.4, y - 2); g.lineTo(x + 2.4, y - 2); g.lineTo(x + 2.4, y + d); g.arc(x, y + d, 2.4, 0, Math.PI); g.closePath(); } g.fill();
  // sprinkles
  const r = rng(5); for (let k = 0; k < 40; k++) { const a = r() * TAU, d = Math.sqrt(r()); const x = cx + Math.cos(a) * d * 36, y = 281 + Math.sin(a) * d * 7.5;
    g.strokeStyle = PEN[k % 6]; g.lineWidth = 1; g.beginPath(); const o = r() * TAU; g.moveTo(x, y); g.lineTo(x + Math.cos(o) * 2.2, y + Math.sin(o) * 1.2); g.stroke(); }
  // candles
  const C = candlePos();
  for (let i = 0; i < C.length; i++) { const [x, y] = C[i];
