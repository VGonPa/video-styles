<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── atomic-wasteland · retro-futurist post-apocalypse, deadpan corporate optimism ─────────────────────────
// Register 1: a chunky invented wrist computer ("Wrist-o-Matic 3000") with a green phosphor CRT: turn-on, boot
// checks ("OUTSIDE CHECK ... ON FIRE"), cursor tabs STAT / INV / DATA / MAP / RADIO, a crackly 50s jingle.
// A white bloom cuts the jingle → Register 2: a 1950s safety filmstrip poster — original mascot ATOM ANDY
// (square-jawed atomic robot) pops up, thumbs up + wink, "DUCK AND COVER! (Duck not included.)" while the
// city burns behind; a perk card flips in: "PERK UNLOCKED: OPTIMISM". The poster shrinks back into the CRT,
// turns green, and the device powers down to a dot.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eBack = (u, s = 1.9) => { u = clamp(u); const c = s + 1; return 1 + c * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = n => { let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); x ^= x >>> 13; x = Math.imul(x, 0xc2b2ae35); x ^= x >>> 16; return (x >>> 0) / 4294967296; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

const VT = '"VT323"', SLAB = '"Alfa Slab One"', SCRIPT = '"Yellowtail"', OSW = '"Oswald"';
// phosphor
const P0 = '#03150a', PD = '#12592b', PM = '#3fdc6e', PH = '#b4ffc9';
// 1950s print palette
const CREAM = '#f1e4c3', MUST = '#e2a93b', TEAL = '#2f7f7b', RED = '#c8412e', INK = '#2a211c', PAPER = '#efe0bb';

// ── timeline ──
const T = {
  on: 0.30, boot: 0.75, stat: 1.60, inv: 2.60, data: 3.52, map: 3.62, radio: 4.12, jingle: 4.36, flash: 5.38,
  poster: 5.62, pop: 5.72, word1: 6.02, word2: 6.20, arm: 6.30, wink: 6.62, script: 6.76, card: 7.05, fanfare: 7.45,
  zoom: 8.70, zoomEnd: 9.25, off: 9.35,
};
const INV_SEL = [2.62, 2.86, 3.08, 3.30];

// ── geometry ──
const SX0 = 300, SY0 = 170, SW = 960, SH = 660, SCX = SX0 + SW / 2, SCY = SY0 + SH / 2;
const BTN = ['STAT', 'INV', 'DATA', 'MAP', 'RADIO'];

// ════════════════════════════════════════ ATOM ANDY (original mascot) ════════════════════════════════════════
const COLOR = { cream: CREAM, teal: TEAL, must: MUST, red: RED, ink: INK, white: '#fbf6e8', steel: '#c9c2a8', cheek: 'rgba(200,65,46,.55)' };
const MONO = { cream: '#0b3a1a', teal: '#062a12', must: '#0d4520', red: '#1f7d3c', ink: PM, white: '#7dffa6', steel: '#0b3a1a', cheek: 'rgba(0,0,0,0)' };
function quadPts(a, b, h) { // curve through a → b(elbow) → h
  const cx = 2 * b[0] - (a[0] + h[0]) / 2, cy = 2 * b[1] - (a[1] + h[1]) / 2; return [a, [cx, cy], h];
}
function hose(c, P, a, b, h, lw) {
  const [p0, p1, p2] = quadPts(a, b, h);
  c.beginPath(); c.moveTo(p0[0], p0[1]); c.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]);
  c.strokeStyle = P.ink; c.lineWidth = 58 + lw * 2; c.stroke();
  c.strokeStyle = P.must; c.lineWidth = 58; c.stroke();
  c.strokeStyle = P.ink; c.lineWidth = lw * 0.55;
  for (let i = 1; i < 12; i++) {
    const u = i / 12, x = (1 - u) * (1 - u) * p0[0] + 2 * u * (1 - u) * p1[0] + u * u * p2[0], y = (1 - u) * (1 - u) * p0[1] + 2 * u * (1 - u) * p1[1] + u * u * p2[1];
    const dx = 2 * (1 - u) * (p1[0] - p0[0]) + 2 * u * (p2[0] - p1[0]), dy = 2 * (1 - u) * (p1[1] - p0[1]) + 2 * u * (p2[1] - p1[1]);
    const l = Math.hypot(dx, dy) || 1, nx = -dy / l * 27, ny = dx / l * 27;
    c.beginPath(); c.moveTo(x - nx, y - ny); c.quadraticCurveTo(x + dx / l * 6, y + dy / l * 6, x + nx, y + ny); c.stroke();
  }
}
function fist(c, P, x, y, rot, lw, thumb) {
  c.save(); c.translate(x, y); c.rotate(rot);
  if (thumb) { rr(c, -44, -104, 36, 76, 18); c.fillStyle = P.cream; c.fill(); c.strokeStyle = P.ink; c.lineWidth = lw; c.stroke(); }
  rr(c, -50, -44, 100, 88, 26); c.fillStyle = P.cream; c.fill(); c.strokeStyle = P.ink; c.lineWidth = lw; c.stroke();
  c.lineWidth = lw * 0.7;
  for (const fy of [-16, 6, 26]) { c.beginPath(); c.moveTo(-50, fy); c.quadraticCurveTo(-12, fy - 5, 18, fy + 1); c.stroke(); }
  if (thumb) { c.beginPath(); c.moveTo(-40, -40); c.quadraticCurveTo(-26, -24, -8, -34); c.stroke(); }
  c.restore();
}
// local coords: waist at (0,0), head top ≈ -610; o = {arm 0..1 (thumb up), wink 0..1, lw, ant (orbit angle), grin}
function drawAndy(c, P, o) {
  const lw = o.lw || 7, ink = P.ink;
  c.lineJoin = 'round'; c.lineCap = 'round';
  // torso
  c.beginPath(); c.moveTo(-138, 0); c.lineTo(-172, -288); c.quadraticCurveTo(-174, -334, -128, -336); c.lineTo(128, -336);
  c.quadraticCurveTo(174, -334, 172, -288); c.lineTo(138, 0); c.closePath();
  c.fillStyle = P.teal; c.fill(); c.strokeStyle = ink; c.lineWidth = lw; c.stroke();
  // chest panel + atom
  rr(c, -98, -296, 196, 176, 22); c.fillStyle = P.cream; c.fill(); c.stroke();
  c.save(); c.translate(0, -208); c.strokeStyle = P.red; c.lineWidth = lw * 0.8;
  for (let k = 0; k < 3; k++) { c.beginPath(); c.ellipse(0, 0, 70, 22, k * Math.PI / 3 + (o.ant || 0) * 0.15, 0, TAU); c.stroke(); }
  c.beginPath(); c.arc(0, 0, 15, 0, TAU); c.fillStyle = P.must; c.fill(); c.strokeStyle = ink; c.lineWidth = lw * 0.7; c.stroke(); c.restore();
  // rivets
  c.fillStyle = ink; for (const rx of [-140, -110, 110, 140]) { c.beginPath(); c.arc(rx, -312, 5.5, 0, TAU); c.fill(); }
  // belt
  c.beginPath(); c.moveTo(-141, -44); c.lineTo(141, -44); c.lineTo(138, 0); c.lineTo(-138, 0); c.closePath();
  c.fillStyle = P.must; c.fill(); c.strokeStyle = ink; c.lineWidth = lw; c.stroke();
  rr(c, -26, -40, 52, 36, 6); c.fillStyle = P.steel; c.fill(); c.stroke();
  // neck
  rr(c, -46, -376, 92, 48, 8); c.fillStyle = P.steel; c.fill(); c.stroke();
  c.lineWidth = lw * 0.55; for (const ny of [-362, -348]) { c.beginPath(); c.moveTo(-40, ny); c.lineTo(40, ny); c.stroke(); }
  // antenna
  c.lineWidth = lw; c.beginPath(); c.moveTo(0, -606); c.lineTo(0, -676); c.stroke();
  c.beginPath(); c.arc(0, -694, 19, 0, TAU); c.fillStyle = P.red; c.fill(); c.stroke();
  c.save(); c.translate(0, -694); c.rotate(-0.35); c.lineWidth = lw * 0.55; c.beginPath(); c.ellipse(0, 0, 40, 11, 0, 0, TAU); c.stroke();
  const ea = o.ant || 0; c.beginPath(); c.arc(Math.cos(ea) * 40, Math.sin(ea) * 11, 5.5, 0, TAU); c.fillStyle = ink; c.fill(); c.restore();
  // ear bolts
  for (const s of [-1, 1]) { c.beginPath(); c.arc(s * 142, -486, 24, 0, TAU); c.fillStyle = P.must; c.fill(); c.lineWidth = lw; c.stroke();
    c.beginPath(); c.arc(s * 142, -486, 8, 0, TAU); c.fillStyle = ink; c.fill(); }
  // head: square jaw (wider at the bottom)
  c.beginPath(); c.moveTo(-78, -612); c.lineTo(78, -612); c.quadraticCurveTo(118, -612, 120, -572); c.lineTo(136, -400);
  c.quadraticCurveTo(138, -364, 100, -364); c.lineTo(-100, -364); c.quadraticCurveTo(-138, -364, -136, -400); c.lineTo(-120, -572);
  c.quadraticCurveTo(-118, -612, -78, -612); c.closePath();
  c.fillStyle = P.cream; c.fill(); c.lineWidth = lw; c.strokeStyle = ink; c.stroke();
  // shine
  c.strokeStyle = P.white; c.lineWidth = lw * 1.1; c.beginPath(); c.moveTo(-96, -560); c.quadraticCurveTo(-94, -590, -62, -594); c.stroke();
  // cheeks
  c.fillStyle = P.cheek; for (const s of [-1, 1]) { c.beginPath(); c.arc(s * 90, -440, 22, 0, TAU); c.fill(); }
  // eyes
  const wk = clamp(o.wink || 0);
  c.strokeStyle = ink; c.lineWidth = lw;
  c.beginPath(); c.arc(-56, -500, 27, 0, TAU); c.fillStyle = P.white; c.fill(); c.stroke();
  c.beginPath(); c.arc(-50, -497, 11, 0, TAU); c.fillStyle = ink; c.fill();
  if (wk < 0.55) {
    const sy = 1 - wk / 0.55;
    c.save(); c.translate(58, -500); c.scale(1, Math.max(0.08, sy)); c.beginPath(); c.arc(0, 0, 27, 0, TAU); c.fillStyle = P.white; c.fill(); c.lineWidth = lw / Math.max(0.3, sy); c.stroke();
    c.beginPath(); c.arc(6, 3, 11, 0, TAU); c.fillStyle = ink; c.fill(); c.restore();
  } else {
    c.lineWidth = lw * 1.25; c.beginPath(); c.moveTo(30, -494); c.quadraticCurveTo(58, -526, 86, -494); c.stroke();
    c.lineWidth = lw * 0.6; c.beginPath(); c.moveTo(88, -498); c.lineTo(100, -506); c.stroke();
  }
  // brows
  c.lineWidth = lw * 1.5; c.strokeStyle = ink;
  c.beginPath(); c.moveTo(-88, -542); c.quadraticCurveTo(-60, -560, -30, -552); c.stroke();
  const bl = wk * 10; c.beginPath(); c.moveTo(30, -556 + bl); c.quadraticCurveTo(60, -572 + bl * 0.6, 88, -548 + bl * 1.2); c.stroke();
  // grin
  const gr = o.grin == null ? 1 : o.grin;
  c.beginPath(); c.moveTo(-88, -452); c.quadraticCurveTo(0, -438 + 6 * (1 - gr), 88, -452); c.quadraticCurveTo(80, -372, 0, -372 - 16 * (1 - gr)); c.quadraticCurveTo(-80, -372, -88, -452); c.closePath();
  c.fillStyle = P.white; c.fill();
  c.save(); c.clip(); c.lineWidth = lw * 0.6; c.strokeStyle = ink;
  for (const tx of [-54, -18, 18, 54]) { c.beginPath(); c.moveTo(tx, -460); c.lineTo(tx, -360); c.stroke(); }
  c.beginPath(); c.moveTo(-90, -420); c.quadraticCurveTo(0, -410, 90, -420); c.stroke(); c.restore();
  c.lineWidth = lw; c.strokeStyle = ink;
  c.beginPath(); c.moveTo(-88, -452); c.quadraticCurveTo(0, -438 + 6 * (1 - gr), 88, -452); c.quadraticCurveTo(80, -372, 0, -372 - 16 * (1 - gr)); c.quadraticCurveTo(-80, -372, -88, -452); c.closePath(); c.stroke();
  // dimples
  c.lineWidth = lw * 0.6; for (const s of [-1, 1]) { c.beginPath(); c.moveTo(s * 94, -462); c.quadraticCurveTo(s * 104, -452, s * 96, -440); c.stroke(); }
  // chin cleft (square jaw)
  c.beginPath(); c.moveTo(0, -364); c.lineTo(0, -352); c.stroke();
  // left arm: hand on hip
  hose(c, P, [-160, -296], [-262, -176], [-150, -74], lw);
  fist(c, P, -150, -74, 0.5, lw, false);
  // right arm: rest → thumbs up
  const a = o.arm || 0;
  const el = [lerp(252, 300, a), lerp(-150, -222, a)], hd = [lerp(236, 318, a), lerp(-40, -410, a)];
  hose(c, P, [160, -296], el, hd, lw);
  fist(c, P, hd[0], hd[1], lerp(0.9, -0.05, clamp(a)), lw, true);
}

// ════════════════════════════════════════ precomputed textures ════════════════════════════════════════
const SC = mk(SW, SH), g = SC.getContext('2d');           // screen content
const WA = mk(SW, SH), wa = WA.getContext('2d');          // warp pass A
const WB = mk(SW, SH), wb = WB.getContext('2d');          // warp pass B
const BL = mk(240, 165), bl = BL.getContext('2d');        // bloom
const TMP = mk(960, 540), tmp = TMP.getContext('2d');     // poster → phosphor
const P = mk(W, H), pc = P.getContext('2d');              // poster frame
let DEV, SCAN, GLASS, VIG, GRAIN = [], SKY, CITY, PAPERM, PAPERL, PVIG, OFFGLASS;

function buildScan() {
  SCAN = mk(SW, SH); const c = SCAN.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, SW, SH);
  for (let y = 0; y < SH; y += 3) { c.fillStyle = '#8c8c8c'; c.fillRect(0, y + 2, SW, 1); c.fillStyle = '#d0d0d0'; c.fillRect(0, y, SW, 1); }
}
function buildGlass() {
  GLASS = mk(SW, SH); let c = GLASS.getContext('2d');
  let gr = c.createRadialGradient(SW / 2, SH / 2, SH * 0.3, SW / 2, SH / 2, SW * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.7, 'rgba(0,0,0,.18)'); gr.addColorStop(1, 'rgba(0,0,0,.75)');
  c.fillStyle = gr; c.fillRect(0, 0, SW, SH);
  c.save(); c.beginPath(); c.ellipse(250, 120, 420, 150, -0.28, 0, TAU); c.clip();
  gr = c.createLinearGradient(0, 0, 400, 300); gr.addColorStop(0, 'rgba(255,255,255,.07)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = gr; c.fillRect(0, 0, SW, SH); c.restore();
  c.strokeStyle = 'rgba(255,255,255,.06)'; c.lineWidth = 6; c.beginPath(); c.moveTo(60, SH - 60); c.quadraticCurveTo(40, SH / 2, 90, 70); c.stroke();
  // unpowered glass: grey-green phosphor, same reflections
  OFFGLASS = mk(SW, SH); c = OFFGLASS.getContext('2d');
  gr = c.createRadialGradient(SW * 0.45, SH * 0.42, 50, SW / 2, SH / 2, SW * 0.6);
  gr.addColorStop(0, '#1d241d'); gr.addColorStop(1, '#0a0d0a'); c.fillStyle = gr; c.fillRect(0, 0, SW, SH);
  c.drawImage(GLASS, 0, 0); c.globalCompositeOperation = 'lighter'; c.globalAlpha = 1.4; c.drawImage(GLASS, 0, 0, SW, SH);
}
function buildGrain() {
  const r = rng(77);
  for (let k = 0; k < 4; k++) {
    const c = mk(960, 540), x = c.getContext('2d'), im = x.createImageData(960, 540);
    for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - 0.5) * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    x.putImageData(im, 0, 0); GRAIN.push(c);
  }
  VIG = mk(W, H); const v = VIG.getContext('2d'); const gr = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.72)'); v.fillStyle = gr; v.fillRect(0, 0, W, H);
}
function speck(c, r, n, cols, x0, y0, w, h, s0, s1) {
  for (let i = 0; i < n; i++) { c.fillStyle = cols[(r() * cols.length) | 0]; const s = lerp(s0, s1, r()); c.globalAlpha = 0.25 + r() * 0.5; c.fillRect(x0 + r() * w, y0 + r() * h, s, s); }
  c.globalAlpha = 1;
}
function buildDevice() {
  DEV = mk(W, H); const c = DEV.getContext('2d'), r = rng(5);
  // backdrop: dim bunker table, warm dust
  let gr = c.createRadialGradient(900, 480, 100, 900, 520, 1300); gr.addColorStop(0, '#2c231a'); gr.addColorStop(1, '#070504');
  c.fillStyle = gr; c.fillRect(0, 0, W, H); speck(c, r, 5000, ['#3a2e22', '#15100b', '#4a3a2a'], 0, 0, W, H, 1, 3);
  // leather strap across the frame (it's a wrist device)
  gr = c.createLinearGradient(0, 300, 0, 780); gr.addColorStop(0, '#6a4428'); gr.addColorStop(0.15, '#553520'); gr.addColorStop(0.85, '#3e2616'); gr.addColorStop(1, '#24160c');
  c.fillStyle = gr; c.fillRect(0, 300, W, 480); speck(c, r, 9000, ['#2a190e', '#7a5232', '#4a2d1a'], 0, 300, W, 480, 1, 3);
  c.strokeStyle = '#c29a64'; c.lineWidth = 3; c.setLineDash([16, 10]); for (const y of [326, 754]) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); } c.setLineDash([]);
  for (const x of [52, 118]) { c.beginPath(); c.ellipse(x, 540, 11, 15, 0, 0, TAU); c.fillStyle = '#140c06'; c.fill(); }
  // body shadow
  c.save(); c.shadowColor = 'rgba(0,0,0,.8)'; c.shadowBlur = 60; c.shadowOffsetY = 26; rr(c, 180, 80, 1560, 920, 84); c.fillStyle = '#3d4430'; c.fill(); c.restore();
  // body: olive enamel over steel
  c.save(); rr(c, 180, 80, 1560, 920, 84); c.clip();
  gr = c.createLinearGradient(0, 80, 0, 1000); gr.addColorStop(0, '#7a8255'); gr.addColorStop(0.45, '#5c6541'); gr.addColorStop(1, '#383f28');
  c.fillStyle = gr; c.fillRect(180, 80, 1560, 920);
  gr = c.createLinearGradient(180, 0, 1740, 0); gr.addColorStop(0, 'rgba(255,250,220,.10)'); gr.addColorStop(0.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.22)');
  c.fillStyle = gr; c.fillRect(180, 80, 1560, 920);
  speck(c, r, 14000, ['#6b7349', '#4a5234', '#2f3522', '#848b62'], 180, 80, 1560, 920, 1, 2.5);
  // paint chips (bare steel) near the edges
  for (let i = 0; i < 46; i++) {
    const side = r(), t = Math.pow(r(), 2.2) * (r() < 0.5 ? 1 : -1) * 0.5 + (r() < 0.5 ? 0 : 1); let x, y;
    if (side < 0.25) { x = 180 + t * 1560; y = 84 + r() * 26; } else if (side < 0.5) { x = 180 + t * 1560; y = 996 - r() * 26; }
    else if (side < 0.75) { x = 184 + r() * 26; y = 80 + t * 920; } else { x = 1736 - r() * 26; y = 80 + t * 920; }
    c.beginPath(); const n = 7, rad = 2 + r() * 6; for (let k = 0; k < n; k++) { const a = k / n * TAU, rr2 = rad * (0.5 + r() * 0.7); c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); } c.closePath();
    c.fillStyle = '#7f7d6c'; c.fill(); c.strokeStyle = 'rgba(30,25,15,.5)'; c.lineWidth = 1.2; c.stroke();
  }
  // rust streaks under screws
  for (const [x, y] of [[244, 144], [1676, 144], [244, 936], [1676, 936]]) {
    gr = c.createLinearGradient(0, y, 0, y + 70); gr.addColorStop(0, 'rgba(120,60,20,.55)'); gr.addColorStop(1, 'rgba(120,60,20,0)'); c.fillStyle = gr; c.fillRect(x - 5, y, 10, 70);
  }
  c.restore();
  // bevel
  c.save(); rr(c, 180, 80, 1560, 920, 84); c.clip();
  c.strokeStyle = 'rgba(255,248,210,.32)'; c.lineWidth = 6; rr(c, 183, 83, 1560, 920, 84); c.stroke();
  c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = 10; rr(c, 175, 75, 1560, 920, 84); c.stroke(); c.restore();
  // screws
  for (const [x, y] of [[244, 144], [1676, 144], [244, 936], [1676, 936]]) screw(c, x, y, 17, r() * 3);
  // engraved top line
  c.font = `500 20px ${OSW}`; c.textAlign = 'left'; c.letterSpacing = '4px';
  const eng = 'MODEL 3000  ·  SERIAL 0000001  ·  DO NOT SUBMERGE IN LAVA';
  c.fillStyle = 'rgba(255,245,200,.22)'; c.fillText(eng, 302, 119); c.fillStyle = '#262b1b'; c.fillText(eng, 300, 117); c.letterSpacing = '0px';
  // bezel
  gr = c.createLinearGradient(0, 132, 0, 868); gr.addColorStop(0, '#15180f'); gr.addColorStop(1, '#262a1d');
  rr(c, 262, 132, 1036, 736, 66); c.fillStyle = gr; c.fill();
  c.strokeStyle = 'rgba(0,0,0,.7)'; c.lineWidth = 4; c.stroke();
  c.strokeStyle = 'rgba(255,248,210,.18)'; c.lineWidth = 3; rr(c, 263, 136, 1034, 732, 64); c.stroke();
  rr(c, 288, 158, 984, 684, 52); c.fillStyle = '#060805'; c.fill();
  // brand plate

function drawPoster(t) {

    c.fillStyle = col; c.beginPath();

      const rad = (14 + kk * 4.2) * s.s * fade * (off ? 0.5 : 1); if (rad < 2) continue;
      const xx = s.x + (kk * 34 + Math.max(0, kk - 9) ** 2 * 7) * s.s, yy = s.b - Math.sqrt(kk) * 62 * s.s + Math.sin(kk * 0.9 + s.p) * 10 + Math.max(0, kk - 9) * 9 * s.s, yo = off ? rad * 0.45 : 0;

    star(c, 0, 0, 34 * k, 8 * k); c.fillStyle = '#fffaf0'; c.fill(); c.lineWidth = 3; c.strokeStyle = INK; c.stroke(); c.restore(); }

}

// ════════════════════════════════════════ main ════════════════════════════════════════
window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const posterMode = t >= T.poster && t < T.zoom;
  if (posterMode) {
    drawPoster(t); ctx.drawImage(P, 0, 0);
    const wh = 1 - eOut(seg(t, T.poster, T.poster + 0.33));
    if (wh > 0) { ctx.fillStyle = `rgba(255,253,244,${wh})`; ctx.fillRect(0, 0, W, H); }
  } else {
    let z = 1 + 0.035 * eInOut(seg(t, 0.2, T.flash));
    if (t >= T.zoom) { const u = seg(t, T.zoom, T.zoomEnd); z = lerp(2, 1, eInOut(u)) - 0.03 * seg(t, T.zoomEnd, DUR); drawPoster(t); }
    // screen content
    if (t >= T.zoom) {
      const u = seg(t, T.zoom, T.zoomEnd);
      posterOnScreen(t, 0);
    } else screenContent(t);
    // CRT effects ramp back in during the zoom
    drawDevice(t, z);
    const s = screenState(t), lit = s.sx * s.sy * s.bright;
    const fxa = t >= T.zoom ? eInOut(seg(t, T.zoom, T.zoomEnd)) : 1;
    if (fxa > 0.01) { ctx.globalAlpha = 1; atmos(t, lit * fxa); }
    ctx.globalAlpha = fxa; ctx.drawImage(VIG, 0, 0); ctx.globalAlpha = 1;
    grain(t, 0.12 * fxa);
    // whiteout flash: screen overexposes, bloom swallows the frame
    if (t >= T.flash - 0.02 && t < T.poster) {
      const a = seg(t, T.flash, T.flash + 0.08), b = seg(t, T.flash + 0.05, T.flash + 0.2);
      if (a > 0) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(230,255,235,${a})`; screenPath(ctx); ctx.fill(); ctx.restore();
        const rad = lerp(300, 2300, eIn(b)); const gr = ctx.createRadialGradient(SCX, SCY, rad * 0.35, SCX, SCY, rad);
        gr.addColorStop(0, `rgba(255,253,244,${Math.max(a * 0.6, b)})`); gr.addColorStop(1, 'rgba(255,253,244,0)');
        ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

};

// ════════════════════════════════════════ sound events ════════════════════════════════════════
window.events = () => {
  const E = [];
  E.push({ k: 'toggle', t: T.on - 0.1 }, { k: 'on', t: T.on });
  E.push({ k: 'chirp', t: T.boot, v: 0 });
  for (let i = 1; i < 4; i++) { const ti = T.boot + 0.12 + i * 0.2; E.push({ k: 'chirp', t: ti, v: i }); E.push({ k: 'chirp', t: ti + 0.28, v: i + 4 }); }
  [T.stat, T.inv, T.data, T.map, T.radio].forEach((tt, i) => E.push({ k: 'tab', t: tt, v: i }));
  E.push({ k: 'type', t: T.stat + 0.32, d: 0.42 });
  INV_SEL.slice(1).forEach(tt => E.push({ k: 'tick', t: tt }));
  E.push({ k: 'error', t: INV_SEL[3] + 0.05 });
  for (let tt = T.map; tt < T.radio; tt += 0.2) E.push({ k: 'blip', t: tt });
  E.push({ k: 'knob', t: T.radio + 0.02, d: T.jingle - T.radio }, { k: 'tick', t: T.jingle - 0.06 });
  E.push({ k: 'static', t: T.radio, d: T.jingle - T.radio + 0.05 });
  E.push({ k: 'jingle', t: T.jingle, d: T.flash - T.jingle });
  E.push({ k: 'flash', t: T.flash });
  E.push({ k: 'music', t: T.pop - 0.02, d: T.off - T.pop + 0.02, z: T.zoom });
  E.push({ k: 'pop', t: T.pop + 0.02 }, { k: 'slam', t: T.word1 + 0.05 }, { k: 'slam', t: T.word2 + 0.05 });
  E.push({ k: 'swish', t: T.arm }, { k: 'ding', t: T.wink + 0.02 }, { k: 'pen', t: T.script, d: 0.35 });
  E.push({ k: 'flip', t: T.card }, { k: 'fanfare', t: T.fanfare });
