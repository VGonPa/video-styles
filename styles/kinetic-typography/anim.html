<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kinetic-typography</title>
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #ebe5d7; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * kinetic-typography: a clip made of words only. window.draw({t}) returns a JPEG (base64).
 * Phrase: "Start before you're ready."
 *   1. "Start" drops in, squashes, stretches; "before" and "you're" stack under it.
 *   2. The stack swings 90 degrees into a vertical column on the left.
 *   3. "ready" types itself in, thin and shaky, and doubts itself with a "?".
 *   4. "Start" breaks out of the column and shoves "ready" off to the right.
 *   5. Lockup "Start / before you're ready." with a red full stop, then a crush exit.
 */

// canvas, palette, type families
const W = 1920;
const H = 1080;
const DUR = 9.5;
const g2d = document.querySelector('#c').getContext('2d');
const PAPER_TONE = '#ebe5d7';
const INK = '#15130f';
const RED = '#d8402f';
const GRO = '"Bricolage Grotesque", sans-serif';
const SER = '"Instrument Serif", serif';
const DEG = Math.PI / 180;

// small math kit
const unit = v => (v < 0 ? 0 : v > 1 ? 1 : v);                 // clamp to [0, 1]
const span = (t, from, to) => unit((t - from) / (to - from));   // progress of t through [from, to]
const mix = (from, to, k) => from * (1 - k) + to * k;
const cubicIn = k => k ** 3;
const cubicOut = k => { const u = 1 - k; return 1 - u * u * u; };
const quintOut = k => 1 - (1 - k) ** 5;
const cubicInOut = k => (k < 0.5 ? cubicIn(2 * k) / 2 : 1 - cubicIn(2 - 2 * k) / 2);
// overshooting ease-out; `pull` sets how far past 1 it swings
function backOut(k, pull = 1.7) {
  if (k <= 0) return 0;
  if (k >= 1) return 1;
  const u = k - 1;
  return 1 + u * u * ((pull + 1) * u + pull);
}
// damped spring kick starting at t0: rings at `hz` and decays by `damp`
const ring = (t, t0, hz = 3.2, damp = 5) => {
  if (t < t0) return 0;
  const dt = t - t0;
  return Math.exp(-damp * dt) * Math.sin(2 * Math.PI * hz * dt);
};
// seeded xorshift32 stream in [0, 1)
function stream(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >>> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

// timeline (beat = 0.5 s; the beat drops out while "ready" hesitates, returns with the push)
const T = { land: 0.4, stretch: 0.9, stack: 1.3, before: 1.4, youre: 1.9, rot0: 2.4, rot1: 2.95,
  rd: [3.15, 3.27, 3.39, 3.82, 4.12], wob0: 4.1, q: 4.45, itch: 4.62, colOut: 4.78, free0: 5.0, free1: 5.42,
  hit: 5.65, settle: 6.0, up: 6.15, bef: 6.65, you: 6.9, ready: 7.15, dot: 7.4, out: 8.6, end: 9.45 };

// ── word plotter: pose = visual centre (x, y), rotation r, scale s·sx/sy ─────
const F = {  // font presets
  start: { fam: GRO, w: 800, size: 300, ls: -12 },
  before: { fam: SER, it: true, size: 170 },
  youre: { fam: GRO, w: 460, size: 180, ls: -5 },
  thin: { fam: GRO, w: 240, size: 250, ls: -2 },
};
// type preset → canvas font state
function setType(spec) {
  const style = spec.it ? 'italic' : 'normal';
  g2d.font = [style, String(Math.round(spec.w ?? 400)), spec.size + 'px', spec.fam].join(' ');
  g2d.letterSpacing = `${spec.ls ?? 0}px`;
}
const textWidth = (text, spec) => (setType(spec), g2d.measureText(text).width);
function word(str, o, p) {
  const a = p.a === undefined ? 1 : p.a; if (a <= 0.003) return;
  setType(o); const w = g2d.measureText(str).width;
  g2d.save(); g2d.globalAlpha *= a; g2d.fillStyle = p.col || INK; g2d.textAlign = 'left'; g2d.textBaseline = 'alphabetic';
  g2d.translate(p.x, p.y); g2d.rotate(p.r || 0); const s = p.s === undefined ? 1 : p.s;
  // pivot: visual centre by default, baseline when p.base (crush onto the floor)
  const py = p.base ? o.size * 0.35 : 0; g2d.translate(0, py); g2d.scale(s * (p.sx || 1), s * (p.sy || 1)); g2d.translate(0, -py);
  g2d.fillText(str, -w / 2, o.size * 0.35); g2d.restore(); return w;
}
// compose a group-local offset into a group pose (x, y, r, s)
function inGroup(g, lx, ly) { const c = Math.cos(g.r), s = Math.sin(g.r);
  return { x: g.x + (lx * c - ly * s) * g.s, y: g.y + (lx * s + ly * c) * g.s, r: g.r, s: g.s }; }
const mixPose = (A, B, p) => ({ x: mix(A.x, B.x, p), y: mix(A.y, B.y, p), r: mix(A.r, B.r, p), s: mix(A.s, B.s, p) });

// ── scene 1: land, stretch, stack, rotate into a column ──────────────────────
const SLOT = { start: -205, before: 10, youre: 205 };            // stack rows (group-local y)
function stackGroup(t) {
  const p = span(t, T.rot0, T.rot1), e = backOut(p, 1.25);
  return { x: mix(960, 330, cubicInOut(p)), y: mix(560, 540, cubicInOut(p)), r: mix(0, -90, e) * DEG, s: mix(1, 0.72, cubicInOut(p)) };
}
function colGroup(t) {   // the column drops out of Start's way before it breaks loose
  const g = stackGroup(t), q = cubicIn(span(t, T.colOut, T.colOut + 0.32)); g.y += q * 950; g.r += q * 10 * DEG; return g;
}
// Start alone: drop (stretched) → squash → elastic stretch → rise into its stack slot
function startSolo(t) {
  const fall = span(t, T.land - 0.22, T.land); const y = mix(-260, 540, fall * fall);
  let sx = 1, sy = 1;
  if (t < T.land) { sy = mix(1, 1.35, fall); sx = mix(1, 0.84, fall); }
  else { const k = ring(t, T.land, 2.6, 7); sx = 1 + 0.2 * k; sy = 1 - 0.26 * k; }
  const sp = span(t, T.stretch, T.stretch + 0.22), st = sp > 0 && sp < 1 ? Math.sin(Math.PI * sp) : 0;
  const sn = ring(t, T.stretch + 0.22, 3, 6);
  sx *= 1 + 0.38 * st + 0.08 * sn; sy *= 1 - 0.12 * st - 0.04 * sn;
  const u = backOut(span(t, T.stack, T.stack + 0.32), 1.4);
  const b = 1 + 0.05 * Math.max(0, ring(t, T.before + 0.05, 3, 9)) + 0.05 * Math.max(0, ring(t, T.youre + 0.05, 3, 9));  // nods as the stack grows
  return { x: 960, y: mix(y, 560 + SLOT.start, u), r: 0, s: 1, sx: sx * b, sy: sy * b, a: t < T.land - 0.22 ? 0 : 1 };
}
// Start breaks loose: impatient itch in the column → upright → pull back → shove → settle → rise
const PUSH = { x: 470, y: 540, s: 0.84 }, CENTER = { x: 960, y: 540, s: 1.05 };
let LOCK, READY_X0 = 1190, READY_W = 700, PUSH_HALF = 400;
const contactX = () => READY_X0 - READY_W / 2 - 8 - PUSH_HALF;
function startFree(t) {
  if (t < T.free0) { const q = inGroup(stackGroup(t), 0, SLOT.start); const k = ring(t, T.itch, 7, 5); q.x += 10 * k; q.r += 3 * k * DEG; return q; }
  const A = inGroup(stackGroup(T.free0), 0, SLOT.start);
  let P = mixPose(A, { x: PUSH.x, y: PUSH.y, r: 0, s: PUSH.s }, backOut(span(t, T.free0, T.free1), 1.5)); let sx = 1, sy = 1;
  if (t < T.hit) {
    const back = cubicOut(span(t, T.free1, T.hit - 0.1)), dash = span(t, T.hit - 0.1, T.hit);
    P.x += -70 * back * (1 - dash) + dash * (contactX() - PUSH.x);
    sx = 1 - 0.1 * back * (1 - dash) + 0.22 * dash; sy = 1 + 0.06 * back * (1 - dash) - 0.08 * dash;
  } else if (t < T.up) {
    const c = span(t, T.hit, T.settle + 0.1);
    P.x = mix(contactX(), CENTER.x, backOut(c, 1.6)); P.s = mix(PUSH.s, CENTER.s, cubicOut(c));
    const k = ring(t, T.hit, 3.2, 7); sx = 1 - 0.14 * k; sy = 1 + 0.1 * k;
  } else {
    P = mixPose({ x: CENTER.x, y: CENTER.y, r: 0, s: CENTER.s }, { x: LOCK.start.x, y: LOCK.start.y, r: 0, s: LOCK.start.s }, backOut(span(t, T.up, T.up + 0.38), 1.3));
  }
  P.sx = sx; P.sy = sy; return P;
}
function startWord(t, ex) {
  const P = t < T.rot0 ? startSolo(t) : startFree(t);
  exitMod(P, ex, 0); word('Start', F.start, P);
}
// ── partner words (before / you're): rise into the stack, ride the column, swing back ─
function partner(t, key, str, o, tIn, lock, tBack, ex, idx) {
  if (t < tIn - 0.1) return;
  let P;
  if (t < tBack - 0.34) {
    if (t >= T.colOut + 0.32) return;
    const g = t < T.colOut ? stackGroup(t) : colGroup(t); P = inGroup(g, 0, SLOT[key]);
    const r = span(t, tIn - 0.1, tIn + 0.3); P.a = unit(r * 3); P.y += (1 - backOut(r, 1.6)) * 60 * g.s; P.sy = mix(1.25, 1, cubicOut(r)); P.sx = 1;
  } else {
        const p = span(t, tBack - 0.34, tBack), e = backOut(p, 1.5);
    P = key === 'before'   // before swings in from the left, you're rises from below (no crossing)
      ? { x: mix(-300, lock.x, quintOut(p)), y: mix(lock.y + 120, lock.y, cubicOut(p)), r: mix(-90, 0, e) * DEG, s: lock.s, a: unit(p * 4) }
      : { x: lock.x + mix(90, 0, cubicOut(p)), y: mix(H + 260, lock.y, quintOut(p)), r: mix(70, 0, e) * DEG, s: lock.s, a: unit(p * 4) };
    const k = ring(t, tBack, 3, 8); P.sx = 1 + 0.08 * k; P.sy = 1 - 0.1 * k;
  }
  exitMod(P, ex, idx); word(str, o, P);
}
// ── ready: letter by letter, thin, trembling; later bold and sure ─────────────
const RD = [...'ready'];
function readyWord(t, ex) {
  if (t >= T.ready - 0.35) {
    const L = LOCK.ready, p = span(t, T.ready - 0.35, T.ready), wgt = mix(300, 800, cubicOut(span(t, T.ready - 0.3, T.ready + 0.1)));
    const P = { x: mix(W + 500, L.x, quintOut(p)), y: L.y, r: mix(14, 0, backOut(p, 1.8)) * DEG, s: L.s, a: unit(p * 4) };
    const k = ring(t, T.ready, 3, 7); P.sx = 1 - 0.1 * k; P.sy = 1 + 0.12 * k;
    exitMod(P, ex, 3); word('ready', { ...F.youre, w: wgt, ls: -6 }, P); return;
  }
  if (t < T.rd[0] - 0.05 || t > T.hit + 0.7) return;
  const o = F.thin; setType(o);
  const adv = []; let acc = 0; for (let i = 0; i < RD.length; i++) { const wi = g2d.measureText(RD.slice(0, i + 1).join('')).width; adv.push(wi - acc); acc = wi; }
  // hesitation: sways, steps back and leans away, shrinks a little
  const wob = span(t, T.wob0, T.wob0 + 0.6), back = cubicInOut(span(t, T.q + 0.1, T.q + 0.6));
  const sway = Math.sin((t - T.wob0) * 2 * Math.PI * 1.7) * 3.2 * wob;
  let cx = READY_X0 + 28 * back, cy = 560, rot = (sway - 5 * back) * DEG; const sc = 1 - 0.05 * cubicInOut(span(t, T.q, T.q + 0.6));
  if (t >= T.hit) {  // shoved: accelerates off to the right, tumbling, never behind Start's edge
    const p = span(t, T.hit, T.hit + 0.55), S = startFree(t), edge = S.x + PUSH_HALF * S.s / PUSH.s;
    cx = Math.max(cx + 1500 * cubicIn(p) + 420 * p, edge + 8 + READY_W / 2); rot += 38 * cubicIn(p) * DEG; cy -= 90 * p;
  }
  g2d.save(); g2d.translate(cx, cy); g2d.rotate(rot); g2d.scale(sc, sc); g2d.fillStyle = INK; g2d.textBaseline = 'alphabetic';
  let x = -READY_W / 2;
  RD.forEach((c, i) => { const p = span(t, T.rd[i] - 0.04, T.rd[i] + 0.34);
    if (p > 0) { const shake = span(t, T.wob0 + i * 0.05, T.wob0 + 0.4);
      const jr = (Math.sin(t * 17 + i * 2.1) * 3 + Math.sin(t * 29.3 + i * 5.7) * 1.5) * shake, jy = Math.sin(t * 13.7 + i * 1.3) * 5 * shake;
      g2d.save(); g2d.globalAlpha = unit(p * 2.5) * 0.9;
      g2d.translate(x + adv[i] / 2, -o.size * 0.35 + (1 - backOut(p, 1.1)) * 70 + jy); g2d.rotate(jr * DEG);
      g2d.fillText(c, -adv[i] / 2, o.size * 0.35); g2d.restore(); }
    x += adv[i]; });
  const qp = span(t, T.q, T.q + 0.3);   // the doubtful question mark
  if (qp > 0) { setType({ fam: SER, it: true, size: 170 }); g2d.save();
    g2d.globalAlpha = unit(qp * 3) * 0.55; g2d.translate(READY_W / 2 + 70, -60 + (1 - backOut(qp, 2)) * 40); g2d.rotate((12 + 8 * Math.sin(t * 5)) * DEG);
    g2d.fillText('?', -30, 60); g2d.restore(); }
  g2d.restore();
}
// exit: words crush onto their baseline, left to right
function exitMod(P, ex, i) { if (ex <= 0) return; const q = cubicIn(span(ex, i * 0.09, i * 0.09 + 0.36)); P.base = true; P.sy = (P.sy || 1) * (1 - q); P.sx = (P.sx || 1) * (1 + 0.1 * q); P.a = (P.a === undefined ? 1 : P.a) * (1 - q * q); }
// red full stop: pops in, survives the exit, shrinks to the centre and fades (back to silence)
function redDot(t) {
  const dp = span(t, T.dot - 0.05, T.dot + 0.35); if (dp <= 0) return;
  const m = cubicInOut(span(t, T.out + 0.45, T.out + 0.8)), f = span(t, T.out + 0.7, T.end);
  const r = LOCK.dot.r * backOut(dp, 3) * mix(1, 0.4, m) * (1 - cubicOut(f) * 0.7);
  const x = mix(LOCK.dot.x, 960, m), y = mix(LOCK.dot.y, 540, m) - Math.max(0, ring(t, T.dot, 2.5, 6)) * 26;
  g2d.save(); g2d.globalAlpha = 1 - cubicOut(f); g2d.fillStyle = RED; g2d.beginPath(); g2d.arc(x, y, Math.max(0, r), 0, 7); g2d.fill(); g2d.restore();
}

// paper backdrop, built once: flat tone, fine seeded grain, warm darkening at the corners
let PAPER = null;
function buildPaper() {
  const sheet = new OffscreenCanvas(W, H);
  const p = sheet.getContext('2d');
  const base = [0xeb, 0xe5, 0xd7];
  const img = p.createImageData(W, H);
  const px = img.data;
  const noise = stream(20);
  for (let o = 0; o < px.length; o += 4) {
    const n = 9 * noise() - 4.5;
    px[o] = base[0] + n;
    px[o + 1] = base[1] + n;
    px[o + 2] = base[2] + 0.9 * n;
    px[o + 3] = 255;
  }
  p.putImageData(img, 0, 0);
  const shade = p.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1150);
  shade.addColorStop(0, 'rgba(60, 45, 25, 0)');
  shade.addColorStop(1, 'rgba(60, 45, 25, 0.16)');
  p.fillStyle = shade;
  p.fillRect(0, 0, W, H);
  return sheet;
}

// final lockup:        Start
//               before you're ready.
function layout() {
  const kB = 165 / 170, kG = 165 / 180, row = 700, gap = 46, dotR = 21;
  const boldReady = { ...F.youre, w: 800, ls: -6 };
  const widths = [textWidth('before', F.before) * kB, textWidth("you're", F.youre) * kG, textWidth('ready', boldReady) * kG];
  const total = widths[0] + widths[1] + widths[2] + 2 * gap + 2 * dotR + 12;
  let cursor = W / 2 - total / 2;
  const place = (w, s) => { const pose = { x: cursor + w / 2, y: row, s }; cursor += w; return pose; };
  LOCK = { start: { x: W / 2, y: 420, s: 1.12 } };
  LOCK.before = place(widths[0], kB); cursor += gap;
  LOCK.youre = place(widths[1], kG); cursor += gap;
  LOCK.ready = place(widths[2], kG); cursor += 12;
  LOCK.dot = { x: cursor + dotR, y: row + 165 * 0.35 - dotR - 1, r: dotR };
  READY_W = textWidth('ready', F.thin);
  PUSH_HALF = 0.5 * PUSH.s * textWidth('Start', F.start);
}

// sound cues (events.mjs writes them to events.json, audio.py synthesises them)
window.events = () => {
  const cues = [];
  const add = (t, k, extra) => cues.push({ t, k, ...extra });
  const beats = [0.4, 0.9, 1.4, 1.9, 2.4, 2.9, 5.65, 6.15, 6.65, 7.15, 7.65, 8.15];
  beats.forEach((t, n) => add(t, 'beat', { v: n }));
  add(T.land, 'knock'); add(T.stretch, 'stretch');
  add(T.before, 'wood', { v: 0 }); add(T.youre, 'wood', { v: 1 });
  add(T.rot0, 'whoosh', { d: 0.55 });
  T.rd.forEach((t, n) => add(t, 'tick', { v: n }));
  const jitter = stream(7);
  for (let n = 0; n < 9; n++) add(T.wob0 + 0.12 + 0.16 * n + 0.05 * jitter(), 'tremble', { v: n });
  add(T.q, 'soft'); add(T.itch, 'rattle'); add(T.free0, 'whoosh', { d: 0.4 });
  add(T.hit, 'knock'); add(T.hit, 'whoosh', { d: 0.5 });
  add(T.up, 'wood', { v: 2 }); add(T.bef, 'wood', { v: 0 }); add(T.you, 'wood', { v: 1 });
  add(T.ready, 'knock'); add(T.dot, 'pop');
  add(T.out, 'swish'); add(T.out + 0.8, 'tink');
  return cues.sort((a, b) => a.t - b.t);
};

// one frame: back to front, so Start always sits on top of the words it pushes
function frame(t) {
  const exit = t - T.out;
  g2d.globalAlpha = 1;
  g2d.drawImage(PAPER, 0, 0);
  partner(t, 'before', 'before', F.before, T.before, LOCK.before, T.bef, exit, 1);
  partner(t, 'youre', "you're", F.youre, T.youre, LOCK.youre, T.you, exit, 2);
  readyWord(t, exit);
  startWord(t, exit);
  redDot(t);
}

async function boot() {
  await document.fonts.ready;
  const needs = [
    ['240 100px', GRO, 'ready'], ['460 100px', GRO, "you're"], ['800 100px', GRO, 'Start ready'],
    ['italic 400 80px', SER, 'before ?'],
  ];
  await Promise.all(needs.map(([spec, fam, glyphs]) => document.fonts.load(`${spec} ${fam}`, glyphs)));
  layout();
  PAPER = buildPaper();
}
window.ready = boot();
window.draw = ({ t, q }) => {
  frame(t);
  const url = g2d.canvas.toDataURL('image/jpeg', q ?? 0.92);
  return url.slice(url.indexOf(',') + 1);
};
</script>
</body>
</html>
