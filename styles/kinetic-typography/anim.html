<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head>
<body style="margin:0;background:#ebe5d7"><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  kinetic-typography — words alone. window.draw({t}) → JPEG base64
//  "Start before you're ready."
//  Start lands and stretches, the words stack, the stack turns into a column.
//  "ready" arrives thin and hesitant, wobbles; Start breaks loose and shoves it
//  off screen. Then the phrase resolves: Start / before you're ready. (red dot)
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, DUR = 9.5;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = x => 1 - Math.pow(1 - x, 3), eOut5 = x => 1 - Math.pow(1 - x, 5), eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x, s = 1.7) => x <= 0 ? 0 : x >= 1 ? 1 : 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2);
// damped spring impulse: 0 at t0, rings and dies out
const ring = (t, t0, f = 3.2, d = 5) => t < t0 ? 0 : Math.sin((t - t0) * f * 2 * Math.PI) * Math.exp(-(t - t0) * d);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let x = s; x = Math.imul(x ^ (x >>> 15), x | 1); x ^= x + Math.imul(x ^ (x >>> 7), x | 61); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
const BG = '#ebe5d7', INK = '#15130f', RED = '#d8402f';
const GRO = "'Bricolage Grotesque', sans-serif", SER = "'Instrument Serif', serif";
const D2R = Math.PI / 180;

// timeline (beat = 0.5 s; the beat drops out while "ready" hesitates, returns with the push)
const T = { land: 0.4, stretch: 0.9, stack: 1.3, before: 1.4, youre: 1.9, rot0: 2.4, rot1: 2.95,
  rd: [3.15, 3.27, 3.39, 3.82, 4.12], wob0: 4.1, q: 4.45, itch: 4.62, colOut: 4.78, free0: 5.0, free1: 5.42,
  hit: 5.65, settle: 6.0, up: 6.15, bef: 6.65, you: 6.9, ready: 7.15, dot: 7.4, out: 8.6, end: 9.45 };

// ── word plotter: pose = visual centre (x, y), rotation r, scale s·sx/sy ─────
const F = {  // font presets
  start: { fam: GRO, w: 800, size: 300, ls: -12 },
  before: { fam: SER, it: true, size: 170 },
  youre: { fam: GRO, w: 460, size: 180, ls: -5 },
  thin: { fam: GRO, w: 240, size: 250, ls: -2 },
};
function font(o) { ctx.font = `${o.it ? 'italic ' : ''}${Math.round(o.w || 400)} ${o.size}px ${o.fam}`; ctx.letterSpacing = (o.ls || 0) + 'px'; }
function measure(str, o) { font(o); return ctx.measureText(str).width; }
function word(str, o, p) {
  const a = p.a === undefined ? 1 : p.a; if (a <= 0.003) return;
  font(o); const w = ctx.measureText(str).width;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = p.col || INK; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.translate(p.x, p.y); ctx.rotate(p.r || 0); const s = p.s === undefined ? 1 : p.s;
  // pivot: visual centre by default, baseline when p.base (crush onto the floor)
  const py = p.base ? o.size * 0.35 : 0; ctx.translate(0, py); ctx.scale(s * (p.sx || 1), s * (p.sy || 1)); ctx.translate(0, -py);
  ctx.fillText(str, -w / 2, o.size * 0.35); ctx.restore(); return w;
}
// compose a group-local offset into a group pose (x, y, r, s)
function inGroup(g, lx, ly) { const c = Math.cos(g.r), s = Math.sin(g.r);
  return { x: g.x + (lx * c - ly * s) * g.s, y: g.y + (lx * s + ly * c) * g.s, r: g.r, s: g.s }; }
const mixPose = (A, B, p) => ({ x: lerp(A.x, B.x, p), y: lerp(A.y, B.y, p), r: lerp(A.r, B.r, p), s: lerp(A.s, B.s, p) });

// ── scene 1: land, stretch, stack, rotate into a column ──────────────────────
const SLOT = { start: -205, before: 10, youre: 205 };            // stack rows (group-local y)
function stackGroup(t) {
  const p = seg(t, T.rot0, T.rot1), e = eBack(p, 1.25);
  return { x: lerp(960, 330, eIO(p)), y: lerp(560, 540, eIO(p)), r: lerp(0, -90, e) * D2R, s: lerp(1, 0.72, eIO(p)) };
}
function colGroup(t) {   // the column drops out of Start's way before it breaks loose
  const g = stackGroup(t), q = eIn(seg(t, T.colOut, T.colOut + 0.32)); g.y += q * 950; g.r += q * 10 * D2R; return g;
}
// Start alone: drop (stretched) → squash → elastic stretch → rise into its stack slot
function startSolo(t) {
  const fall = seg(t, T.land - 0.22, T.land); const y = lerp(-260, 540, fall * fall);
  let sx = 1, sy = 1;
  if (t < T.land) { sy = lerp(1, 1.35, fall); sx = lerp(1, 0.84, fall); }
  else { const k = ring(t, T.land, 2.6, 7); sx = 1 + 0.2 * k; sy = 1 - 0.26 * k; }
  const sp = seg(t, T.stretch, T.stretch + 0.22), st = sp > 0 && sp < 1 ? Math.sin(Math.PI * sp) : 0;
  const sn = ring(t, T.stretch + 0.22, 3, 6);
  sx *= 1 + 0.38 * st + 0.08 * sn; sy *= 1 - 0.12 * st - 0.04 * sn;
  const u = eBack(seg(t, T.stack, T.stack + 0.32), 1.4);
  const b = 1 + 0.05 * Math.max(0, ring(t, T.before + 0.05, 3, 9)) + 0.05 * Math.max(0, ring(t, T.youre + 0.05, 3, 9));  // nods as the stack grows
  return { x: 960, y: lerp(y, 560 + SLOT.start, u), r: 0, s: 1, sx: sx * b, sy: sy * b, a: t < T.land - 0.22 ? 0 : 1 };
}
// Start breaks loose: impatient itch in the column → upright → pull back → shove → settle → rise
const PUSH = { x: 470, y: 540, s: 0.84 }, CENTER = { x: 960, y: 540, s: 1.05 };
let LOCK, READY_X0 = 1190, READY_W = 700, PUSH_HALF = 400;
const contactX = () => READY_X0 - READY_W / 2 - 8 - PUSH_HALF;
function startFree(t) {
  if (t < T.free0) { const q = inGroup(stackGroup(t), 0, SLOT.start); const k = ring(t, T.itch, 7, 5); q.x += 10 * k; q.r += 3 * k * D2R; return q; }
  const A = inGroup(stackGroup(T.free0), 0, SLOT.start);
  let P = mixPose(A, { x: PUSH.x, y: PUSH.y, r: 0, s: PUSH.s }, eBack(seg(t, T.free0, T.free1), 1.5)); let sx = 1, sy = 1;
  if (t < T.hit) {
    const back = eOut(seg(t, T.free1, T.hit - 0.1)), dash = seg(t, T.hit - 0.1, T.hit);
    P.x += -70 * back * (1 - dash) + dash * (contactX() - PUSH.x);
    sx = 1 - 0.1 * back * (1 - dash) + 0.22 * dash; sy = 1 + 0.06 * back * (1 - dash) - 0.08 * dash;
  } else if (t < T.up) {
    const c = seg(t, T.hit, T.settle + 0.1);
    P.x = lerp(contactX(), CENTER.x, eBack(c, 1.6)); P.s = lerp(PUSH.s, CENTER.s, eOut(c));
    const k = ring(t, T.hit, 3.2, 7); sx = 1 - 0.14 * k; sy = 1 + 0.1 * k;
  } else {
    P = mixPose({ x: CENTER.x, y: CENTER.y, r: 0, s: CENTER.s }, { x: LOCK.start.x, y: LOCK.start.y, r: 0, s: LOCK.start.s }, eBack(seg(t, T.up, T.up + 0.38), 1.3));
  }
  P.sx = sx; P.sy = sy; return P;
}
function startWord(t, ex) {
  const P = t < T.rot0 ? startSolo(t) : startFree(t);
  exitMod(P, ex, 0); word('Start', F.start, P);
}
// ── partner words (before / you're): rise into the stack, ride the column, swing back ─
function partner(t, key, str, o, tIn, lock, tBack, ex, idx) {
  if (t < tIn - 0.1) return;
  let P;
  if (t < tBack - 0.34) {
    if (t >= T.colOut + 0.32) return;
    const g = t < T.colOut ? stackGroup(t) : colGroup(t); P = inGroup(g, 0, SLOT[key]);
    const r = seg(t, tIn - 0.1, tIn + 0.3); P.a = clamp(r * 3); P.y += (1 - eBack(r, 1.6)) * 60 * g.s; P.sy = lerp(1.25, 1, eOut(r)); P.sx = 1;
  } else {
        const p = seg(t, tBack - 0.34, tBack), e = eBack(p, 1.5);
    P = key === 'before'   // before swings in from the left, you're rises from below (no crossing)
      ? { x: lerp(-300, lock.x, eOut5(p)), y: lerp(lock.y + 120, lock.y, eOut(p)), r: lerp(-90, 0, e) * D2R, s: lock.s, a: clamp(p * 4) }
      : { x: lock.x + lerp(90, 0, eOut(p)), y: lerp(H + 260, lock.y, eOut5(p)), r: lerp(70, 0, e) * D2R, s: lock.s, a: clamp(p * 4) };
    const k = ring(t, tBack, 3, 8); P.sx = 1 + 0.08 * k; P.sy = 1 - 0.1 * k;
  }
  exitMod(P, ex, idx); word(str, o, P);
}
// ── ready: letter by letter, thin, trembling; later bold and sure ─────────────
const RD = [...'ready'];
function readyWord(t, ex) {
  if (t >= T.ready - 0.35) {
    const L = LOCK.ready, p = seg(t, T.ready - 0.35, T.ready), wgt = lerp(300, 800, eOut(seg(t, T.ready - 0.3, T.ready + 0.1)));
    const P = { x: lerp(W + 500, L.x, eOut5(p)), y: L.y, r: lerp(14, 0, eBack(p, 1.8)) * D2R, s: L.s, a: clamp(p * 4) };
    const k = ring(t, T.ready, 3, 7); P.sx = 1 - 0.1 * k; P.sy = 1 + 0.12 * k;
    exitMod(P, ex, 3); word('ready', { ...F.youre, w: wgt, ls: -6 }, P); return;
  }
  if (t < T.rd[0] - 0.05 || t > T.hit + 0.7) return;
  const o = F.thin; font(o);
  const adv = []; let acc = 0; for (let i = 0; i < RD.length; i++) { const wi = ctx.measureText(RD.slice(0, i + 1).join('')).width; adv.push(wi - acc); acc = wi; }
  // hesitation: sways, steps back and leans away, shrinks a little
  const wob = seg(t, T.wob0, T.wob0 + 0.6), back = eIO(seg(t, T.q + 0.1, T.q + 0.6));
  const sway = Math.sin((t - T.wob0) * 2 * Math.PI * 1.7) * 3.2 * wob;
  let cx = READY_X0 + 28 * back, cy = 560, rot = (sway - 5 * back) * D2R; const sc = 1 - 0.05 * eIO(seg(t, T.q, T.q + 0.6));
  if (t >= T.hit) {  // shoved: accelerates off to the right, tumbling, never behind Start's edge
    const p = seg(t, T.hit, T.hit + 0.55), S = startFree(t), edge = S.x + PUSH_HALF * S.s / PUSH.s;
    cx = Math.max(cx + 1500 * eIn(p) + 420 * p, edge + 8 + READY_W / 2); rot += 38 * eIn(p) * D2R; cy -= 90 * p;
  }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc); ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic';
  let x = -READY_W / 2;
  RD.forEach((c, i) => { const p = seg(t, T.rd[i] - 0.04, T.rd[i] + 0.34);
    if (p > 0) { const shake = seg(t, T.wob0 + i * 0.05, T.wob0 + 0.4);
      const jr = (Math.sin(t * 17 + i * 2.1) * 3 + Math.sin(t * 29.3 + i * 5.7) * 1.5) * shake, jy = Math.sin(t * 13.7 + i * 1.3) * 5 * shake;
      ctx.save(); ctx.globalAlpha = clamp(p * 2.5) * 0.9;
      ctx.translate(x + adv[i] / 2, -o.size * 0.35 + (1 - eBack(p, 1.1)) * 70 + jy); ctx.rotate(jr * D2R);
      ctx.fillText(c, -adv[i] / 2, o.size * 0.35); ctx.restore(); }
    x += adv[i]; });
  const qp = seg(t, T.q, T.q + 0.3);   // the doubtful question mark
  if (qp > 0) { font({ fam: SER, it: true, size: 170 }); ctx.save();
    ctx.globalAlpha = clamp(qp * 3) * 0.55; ctx.translate(READY_W / 2 + 70, -60 + (1 - eBack(qp, 2)) * 40); ctx.rotate((12 + 8 * Math.sin(t * 5)) * D2R);
    ctx.fillText('?', -30, 60); ctx.restore(); }
  ctx.restore();
}
// exit: words crush onto their baseline, left to right
function exitMod(P, ex, i) { if (ex <= 0) return; const q = eIn(seg(ex, i * 0.09, i * 0.09 + 0.36)); P.base = true; P.sy = (P.sy || 1) * (1 - q); P.sx = (P.sx || 1) * (1 + 0.1 * q); P.a = (P.a === undefined ? 1 : P.a) * (1 - q * q); }
// red full stop: pops in, survives the exit, shrinks to the centre and fades (back to silence)
function redDot(t) {
  const dp = seg(t, T.dot - 0.05, T.dot + 0.35); if (dp <= 0) return;
  const m = eIO(seg(t, T.out + 0.45, T.out + 0.8)), f = seg(t, T.out + 0.7, T.end);
  const r = LOCK.dot.r * eBack(dp, 3) * lerp(1, 0.4, m) * (1 - eOut(f) * 0.7);
  const x = lerp(LOCK.dot.x, 960, m), y = lerp(LOCK.dot.y, 540, m) - Math.max(0, ring(t, T.dot, 2.5, 6)) * 26;
  ctx.save(); ctx.globalAlpha = 1 - eOut(f); ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); ctx.restore();
}

let PAPER;
function prep() {
  // final lockup:        Start
  //               before you're ready.
  const l2 = 165 / 170, l2g = 165 / 180, rdF = { ...F.youre, w: 800, ls: -6 };
  const wB = measure('before', F.before) * l2, wY = measure("you're", F.youre) * l2g, wR = measure('ready', rdF) * l2g;
  const gap = 46, dotR = 21, tot = wB + wY + wR + gap * 2 + dotR * 2 + 12; let x = 960 - tot / 2; const y2 = 700;
  LOCK = { start: { x: 960, y: 420, s: 1.12 }, before: { x: x + wB / 2, y: y2, s: l2 } }; x += wB + gap;
  LOCK.youre = { x: x + wY / 2, y: y2, s: l2g }; x += wY + gap;
  LOCK.ready = { x: x + wR / 2, y: y2, s: l2g }; x += wR + 12;
  LOCK.dot = { x: x + dotR, y: y2 + 165 * 0.35 - dotR - 1, r: dotR };
  READY_W = measure('ready', F.thin);
  PUSH_HALF = measure('Start', F.start) / 2 * PUSH.s;
  // paper: seeded grain + warm vignette
  PAPER = mk(W, H); const g = PAPER.getContext('2d'); g.fillStyle = BG; g.fillRect(0, 0, W, H);
  const R = rng(20); const im = g.getImageData(0, 0, W, H); for (let i = 0; i < im.data.length; i += 4) { const n = (R() - 0.5) * 9; im.data[i] += n; im.data[i + 1] += n; im.data[i + 2] += n * 0.9; }
  g.putImageData(im, 0, 0);
  const v = g.createRadialGradient(960, 540, 300, 960, 540, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(60,45,25,0.16)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}
// sound events (events.mjs → events.json → audio.py)
window.events = () => {
  const E = [];
  [0.4, 0.9, 1.4, 1.9, 2.4, 2.9].forEach((t, i) => E.push({ t, k: 'beat', v: i }));
  [5.65, 6.15, 6.65, 7.15, 7.65, 8.15].forEach((t, i) => E.push({ t, k: 'beat', v: i + 6 }));
  E.push({ t: T.land, k: 'knock' }, { t: T.stretch, k: 'stretch' }, { t: T.before, k: 'wood', v: 0 }, { t: T.youre, k: 'wood', v: 1 });
  E.push({ t: T.rot0, k: 'whoosh', d: 0.55 });
  T.rd.forEach((t, i) => E.push({ t, k: 'tick', v: i }));
  for (let i = 0; i < 9; i++) E.push({ t: T.wob0 + 0.12 + i * 0.16 + hash(i) * 0.05, k: 'tremble', v: i });
  E.push({ t: T.q, k: 'soft' }, { t: T.itch, k: 'rattle' }, { t: T.free0, k: 'whoosh', d: 0.4 }, { t: T.hit, k: 'knock' }, { t: T.hit, k: 'whoosh', d: 0.5 });
  E.push({ t: T.up, k: 'wood', v: 2 }, { t: T.bef, k: 'wood', v: 0 }, { t: T.you, k: 'wood', v: 1 }, { t: T.ready, k: 'knock' }, { t: T.dot, k: 'pop' });
  E.push({ t: T.out, k: 'swish' }, { t: T.out + 0.8, k: 'tink' });
  return E.sort((a, b) => a.t - b.t);
};
function render(t) {
  ctx.globalAlpha = 1; ctx.drawImage(PAPER, 0, 0);
  const ex = t - T.out;
  partner(t, 'before', 'before', F.before, T.before, LOCK.before, T.bef, ex, 1);
  partner(t, 'youre', "you're", F.youre, T.youre, LOCK.youre, T.you, ex, 2);
  readyWord(t, ex);
  startWord(t, ex);
  redDot(t);
}
window.draw = function (job) { render(job.t); return cv.toDataURL('image/jpeg', job.q || 0.92).split(',')[1]; };
window.ready = document.fonts.ready.then(() => Promise.all([
  ...[240, 460, 800].map(w => document.fonts.load(`${w} 100px 'Bricolage Grotesque'`, "Start you're ready")),
  document.fonts.load(`italic 400 80px 'Instrument Serif'`, 'before ?')])).then(prep);
</script></body></html>
