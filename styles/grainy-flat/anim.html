<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── grainy-flat · "Grow slow" — a 2020s grainy flat vector illustration that moves ─────────────────────────
// Outline-free flat shapes whose shading and light are made of stipple grain: every shape is baked once in
// `ready` into a sprite (flat fill + a seeded speckle of darker dots on its shadow side and a few lighter ones on
// its lit side), so the grain is static and travels with the shape. Pastel blobs dissolve into grain, a window
// throws a sun-beam made only of dots, and confetti doodles drift around.
// Film: a cosy room, a figure waters a monstera → it grows absurdly and one huge split leaf sweeps across the
// frame → a pastel street, a courier pedals a cargo bike with a parcel → a pink grain blob irises back to the
// room, the parcel drops in, a "Delivered" card pops up, the figure hops → settle → fade to cream.
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let X = ctx;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eSine = u => .5 - .5 * Math.cos(Math.PI * clamp(u));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eBack = (u, s = 1.8) => { u = clamp(u); return 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const eElastic = u => u <= 0 ? 0 : u >= 1 ? 1 : Math.pow(2, -9 * u) * Math.sin((u * 10 - .75) * TAU / 3) + 1;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const FONT = 'Outfit';

const P = {
  wall: '#f6eee2', floor: '#ecdec8', floorD: '#ddcbb0',
  coral: '#e9604f', coralD: '#c94c40', pink: '#f4b5ab', pinkL: '#f8d2ca', blush: '#f2878a',
  mustard: '#f1b43e', mustardL: '#f7d27a', lilac: '#9d87e9', lilacD: '#8169d6', lilacL: '#ddd3f7', peri: '#8b96e8',
  navy: '#24264f', navyL: '#3b3f78', sage: '#8cc29e', green: '#3e8e65', forest: '#2b6a4e', mint: '#c2e5d3',
  sky: '#bfe0f1', skyL: '#e0f0f5', white: '#fffaf1', kraft: '#e3ab6c', road: '#cbc4e3', walk: '#f0e4cf', grey: '#8e8ab4'
};

// ───────────────────────── grain engine (all of it runs once, in ready) ─────────────────────────
function boxBlur(f, w, h, r) {
  const t = new Float32Array(f.length), n = 2 * r + 1;
  for (let pass = 0; pass < 3; pass++) {
    for (let y = 0; y < h; y++) {
      const row = y * w; let acc = 0;
      for (let x = 0; x <= r && x < w; x++) acc += f[row + x];
      for (let x = 0; x < w; x++) { t[row + x] = acc / n; const xa = x - r, xb = x + r + 1; if (xa >= 0) acc -= f[row + xa]; if (xb < w) acc += f[row + xb]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = 0; y <= r && y < h; y++) acc += t[y * w + x];
      for (let y = 0; y < h; y++) { f[y * w + x] = acc / n; const ya = y - r, yb = y + r + 1; if (ya >= 0) acc -= t[ya * w + x]; if (yb < h) acc += t[yb * w + x]; }
    }
  }
}
// coverage field of a sprite at 1/4 resolution, box-blurred (≈ gaussian) — used as "distance to the edge"
function fieldOf(d, w, h, soft) {
  const F = 4, r = Math.max(1, Math.round(soft / F)), pad = 2 * r + 2;
  const fw = Math.ceil(w / F) + 2 * pad, fh = Math.ceil(h / F) + 2 * pad, f = new Float32Array(fw * fh);
  for (let y = 0; y < h; y++) { const row = (((y / F) | 0) + pad) * fw + pad; for (let x = 0; x < w; x++) { const a = d[(y * w + x) * 4 + 3]; if (a) f[row + ((x / F) | 0)] += a; } }
  const k = 1 / (F * F * 255); for (let i = 0; i < f.length; i++) f[i] *= k;
  boxBlur(f, fw, fh, r);
  return { f, fw, fh, F, pad };
}
function samp(fd, x, y) {
  const gx = x / fd.F + fd.pad - .5, gy = y / fd.F + fd.pad - .5, i = Math.floor(gx), j = Math.floor(gy);
  if (i < 0 || j < 0 || i >= fd.fw - 1 || j >= fd.fh - 1) return 0;
  const u = gx - i, v = gy - j, f = fd.f, w = fd.fw, o = j * w + i;
  return (f[o] * (1 - u) + f[o + 1] * u) * (1 - v) + (f[o + w] * (1 - u) + f[o + w + 1] * u) * v;
}
// Stipple shading of an already-painted sprite: darker speckle on the shadow side (where the coverage field,
// sampled a little way along the light direction, falls off), lighter speckle on the lit side.
function shade(c, o = {}) {
  o = Object.assign({ dir: [-.7, .7], reach: 22, soft: 14, s: .9, gamma: 1.5, base: 0, rim: 0, hi: .14, hiReach: null, dot: 2,
    tint: [.84, .7, .8], deep: .3, hiCol: [255, 250, 240], hiMix: .3, seed: 1, grad: null }, o);
  const w = c.width, h = c.height, g = c.getContext('2d'), id = g.getImageData(0, 0, w, h), d = id.data;
  const fd = fieldOf(d, w, h, o.soft), R = rng(o.seed), S = o.dot;
  let [dx, dy] = o.dir; const nn = Math.hypot(dx, dy); dx /= nn; dy /= nn;
  const hr = o.hiReach == null ? o.reach : o.hiReach, [tr, tg, tb] = o.tint, [hr0, hg0, hb0] = o.hiCol;
  for (let y = 0; y < h; y += S) for (let x = 0; x < w; x += S) {
    const cx = Math.min(w - 1, x + (S >> 1)), cy = Math.min(h - 1, y + (S >> 1));
    if (d[(cy * w + cx) * 4 + 3] < 10) continue;
    const sh = 1 - samp(fd, cx + dx * o.reach, cy + dy * o.reach);
    let dens = o.base + o.s * Math.pow(clamp(sh), o.gamma);
    if (o.rim) dens += o.rim * Math.pow(clamp(1 - samp(fd, cx, cy)) * 2, 2);
    if (o.grad) dens += o.grad(cx, cy);
    let mode = 0;
    if (R() < dens) mode = R() < o.deep * dens ? 2 : 1;
    else if (o.hi > 0) { const lt = 1 - samp(fd, cx - dx * hr, cy - dy * hr); if (R() < o.hi * clamp(lt * 1.4)) mode = 3; }
    if (!mode) continue;
    const kr = mode === 2 ? tr * tr : tr, kg = mode === 2 ? tg * tg : tg, kb = mode === 2 ? tb * tb : tb;
    for (let yy = y; yy < Math.min(h, y + S); yy++) for (let xx = x; xx < Math.min(w, x + S); xx++) {
      const i = (yy * w + xx) * 4; if (!d[i + 3]) continue;
      if (mode === 3) { d[i] += (hr0 - d[i]) * o.hiMix; d[i + 1] += (hg0 - d[i + 1]) * o.hiMix; d[i + 2] += (hb0 - d[i + 2]) * o.hiMix; }
      else { d[i] *= kr; d[i + 1] *= kg; d[i + 2] *= kb; }
    }
  }
  g.putImageData(id, 0, 0); return c;
}
// a sprite: paint with fn(g) around the anchor, then optionally stipple-shade it
function art(w, h, ax, ay, fn, sh) {
  const c = mk(w, h), g = c.getContext('2d'); g.translate(ax, ay); fn(g); g.setTransform(1, 0, 0, 1, 0, 0);
  if (sh) shade(c, sh); return { c, ax, ay };
}
// pure stipple field (light beams, ground shadows): dots of the given colours with density dens(x,y)
function stip(w, h, ax, ay, dens, cols, o = {}) {
  const c = mk(w, h), g = c.getContext('2d'), id = g.createImageData(c.width, c.height), d = id.data, R = rng(o.seed || 5), S = o.dot || 2;
  const C = cols.map(hex), A = o.alpha == null ? 255 : o.alpha;
  for (let y = 0; y < c.height; y += S) for (let x = 0; x < c.width; x += S) {
    const p = dens(x + S / 2 - ax, y + S / 2 - ay); if (p <= 0 || R() >= p) continue;
    const col = C[(R() * C.length) | 0];
    for (let yy = y; yy < Math.min(c.height, y + S); yy++) for (let xx = x; xx < Math.min(c.width, x + S); xx++) { const i = (yy * c.width + xx) * 4; d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; d[i + 3] = A; }
  }
  g.putImageData(id, 0, 0); return { c, ax, ay };
}
// a blob whose rim dissolves into grain (solid core → speckled fringe), with darker speckle on its shadow side
function gblob(w, h, ax, ay, pathFn, col, o = {}) {
  o = Object.assign({ soft: 40, e0: .18, e1: .78, s: 0, reach: 60, dir: [-.6, .8], tint: [.9, .78, .82], dot: 2, seed: 9 }, o);
  const m = mk(w, h), mg = m.getContext('2d'); mg.translate(ax, ay); mg.fillStyle = '#000'; pathFn(mg);
  const md = mg.getImageData(0, 0, m.width, m.height).data, fd = fieldOf(md, m.width, m.height, o.soft);
  const c = mk(w, h), g = c.getContext('2d'), id = g.createImageData(c.width, c.height), d = id.data, R = rng(o.seed), S = o.dot;
  const C = hex(col), D = [C[0] * o.tint[0], C[1] * o.tint[1], C[2] * o.tint[2]];
  let [dx, dy] = o.dir; const nn = Math.hypot(dx, dy); dx /= nn; dy /= nn;
  for (let y = 0; y < c.height; y += S) for (let x = 0; x < c.width; x += S) {
    const cx = x + S / 2, cy = y + S / 2, p = sstep(o.e0, o.e1, samp(fd, cx, cy));
    if (p <= 0 || R() >= p) continue;
    let rgb = C;
    if (o.s) { const sh = 1 - samp(fd, cx + dx * o.reach, cy + dy * o.reach); if (R() < o.s * Math.pow(clamp(sh), 1.4)) rgb = D; }
    for (let yy = y; yy < Math.min(c.height, y + S); yy++) for (let xx = x; xx < Math.min(c.width, x + S); xx++) { const i = (yy * c.width + xx) * 4; d[i] = rgb[0]; d[i + 1] = rgb[1]; d[i + 2] = rgb[2]; d[i + 3] = 255; }
  }
  g.putImageData(id, 0, 0); return { c, ax, ay };
}
// soft grain shadow cast by a shape (dots of col, density = k · blurred coverage of the shape)
function gshadow(w, h, ax, ay, pathFn, col, o = {}) {
  o = Object.assign({ soft: 24, k: .6, g: 1.2, seed: 21, dot: 2 }, o);
  const m = mk(w, h), mg = m.getContext('2d'); mg.translate(ax, ay); mg.fillStyle = '#000'; pathFn(mg);
  const fd = fieldOf(mg.getImageData(0, 0, m.width, m.height).data, m.width, m.height, o.soft);
  const s = stip(w, h, 0, 0, (x, y) => o.k * Math.pow(samp(fd, x, y), o.g), [col], { seed: o.seed, dot: o.dot }); s.ax = ax; s.ay = ay; return s;
}
function put(s, x, y, r = 0, sx = 1, sy = sx, a = 1) {
  X.save(); X.translate(x, y); if (r) X.rotate(r); if (sx !== 1 || sy !== 1) X.scale(sx, sy); if (a !== 1) X.globalAlpha *= a;
  X.drawImage(s.c, -s.ax, -s.ay); X.restore();
}
const ellipseShadow = (rx, ry, col, k, seed) => stip(rx * 2 + 8, ry * 2 + 8, rx + 4, ry + 4, (x, y) => { const q = 1 - (x * x) / (rx * rx) - (y * y) / (ry * ry); return q > 0 ? k * Math.pow(q, .9) : 0; }, [col], { seed });

// ── shape helpers ──
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function capsule(g, len, w0, w1) { // from (0,0) down to (0,len), rounded both ends
  g.beginPath(); g.moveTo(-w0 / 2, 0); g.lineTo(-w1 / 2, len); g.arc(0, len, w1 / 2, Math.PI, 0, true); g.lineTo(w0 / 2, 0); g.arc(0, 0, w0 / 2, 0, Math.PI, true); g.closePath();
}
function wobble(g, r, seed, a1 = .06, a2 = .04, n = 90) {
  const R = rng(seed), p1 = R() * TAU, p2 = R() * TAU, p3 = R() * TAU;
  g.beginPath();
  for (let i = 0; i <= n; i++) { const a = i / n * TAU, k = 1 + a1 * Math.sin(2 * a + p1) + a2 * Math.sin(3 * a + p2) + .02 * Math.sin(5 * a + p3); const x = Math.cos(a) * r * k, y = Math.sin(a) * r * k; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.closePath();
}
function ik(a, b, l1, l2, bend) { // two-bone IK → joint position
  let dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy); d = clamp(d, Math.abs(l1 - l2) + .01, l1 + l2 - .01);
  const ang = Math.atan2(dy, dx), k = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1)) * bend;
  return [a[0] + l1 * Math.cos(ang + k), a[1] + l1 * Math.sin(ang + k)];
}
const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) - Math.PI / 2;   // rotation of a sprite that points down
const reach = (j, target, l) => { const dx = target[0] - j[0], dy = target[1] - j[1], d = Math.hypot(dx, dy) || 1; return [j[0] + dx / d * l, j[1] + dy / d * l]; };   // where the bone really ends
function limb(s, a, b, extra = 0) { put(s, a[0], a[1], ang(a, b) + extra); }

// ── monstera leaf: heart blade, deep splits from the margin, small holes, a straight midrib ──
function leafPath(g, L) {
  g.beginPath(); g.moveTo(0, -.03 * L);
  g.bezierCurveTo(.12 * L, .11 * L, .44 * L, .1 * L, .5 * L, -.22 * L);
  g.bezierCurveTo(.57 * L, -.54 * L, .36 * L, -.88 * L, .02 * L, -L);
  g.bezierCurveTo(-.34 * L, -.9 * L, -.56 * L, -.56 * L, -.5 * L, -.22 * L);
  g.bezierCurveTo(-.44 * L, .1 * L, -.12 * L, .11 * L, 0, -.03 * L); g.closePath();
}
function leafArt(L, col, seed, shOpt = {}) {
  const R = rng(seed);
  return art(L * 1.26, L * 1.24, L * .63, L * 1.08, g => {
    leafPath(g, L); g.fillStyle = col; g.fill();
    g.globalCompositeOperation = 'destination-out';
    for (const s of [-1, 1]) {
      const vs = [.16, .36, .55, .73];
      vs.forEach((v0, k) => {
        const v = v0 + (R() - .5) * .04, yi = -v * L, xi = s * .085 * L, xo = s * .7 * L, yo = -(v + .2 + .03 * k) * L;
        const cx = s * .36 * L, cy = -(v + .045) * L, w0 = .006 * L, w1 = (.045 - k * .006) * L;
        g.beginPath(); g.moveTo(xi, yi - w0); g.quadraticCurveTo(cx, cy - (w0 + w1) * .5, xo, yo - w1); g.lineTo(xo, yo + w1);
        g.quadraticCurveTo(cx, cy + (w0 + w1) * .5, xi, yi + w0); g.closePath(); g.fill();
        if (k < 3 && R() < .8) { g.beginPath(); g.ellipse(s * .2 * L, -(v + .1) * L, .034 * L, .014 * L, -s * .5, 0, TAU); g.fill(); }
      });
    }
    g.globalCompositeOperation = 'source-atop';
    g.strokeStyle = 'rgba(190,235,200,.55)'; g.lineCap = 'round';
    g.lineWidth = .016 * L; g.beginPath(); g.moveTo(0, -.02 * L); g.lineTo(0, -.94 * L); g.stroke();
    g.globalCompositeOperation = 'source-over';
  }, Object.assign({ dir: [-.75, .55], reach: .075 * L, soft: .05 * L, s: .95, gamma: 1.6, tint: [.66, .78, .72], deep: .35, hi: .22, hiCol: [205, 240, 210], hiMix: .35, seed: seed + 7, dot: 2 }, shOpt));
}

// ───────────────────────── timeline ─────────────────────────
const T = {
  pour0: 1.3, pour1: 2.45, grow0: 2.55, sw0: 3.12, sw1: 4.3,
  bell: 5.6, stop: 6.85, pop: 7.0, ir0: 7.06, irM: 7.4, ir1: 7.85, land: 8.0, card: 8.25, hop: 8.22, f0: 9.02, f1: 9.5
};
const PIV = [960, 1480];                       // giant-leaf pivot (below the frame)
const sweepAng = t => { const u = seg(t, T.sw0, T.sw1); return lerp(-2.1, 2.1, .62 * u + .38 * eSine(u)); };

// ───────────────────────── sprites ─────────────────────────
const S = {};
let ROOM_BACK, ROOM_FRONT, SKY, ROAD, SHEET, SHG;

function buildRoom() {
  // back layer: wall + floor
  ROOM_BACK = mk(W, H); X = ROOM_BACK.getContext('2d');
  X.fillStyle = P.wall; X.fillRect(0, 0, W, H);
  X.fillStyle = P.floor; X.fillRect(0, 872, W, H - 872);
  put(stip(W, 220, 0, 0, (x, y) => .55 * Math.pow(1 - clamp(y / 90), 2.2) + .05, [P.floorD], { seed: 31 }), 0, 872);
  put(stip(W, 40, 0, 40, (x, y) => .3 * Math.pow(1 - clamp(-y / 36), 2), ['#ece2d2'], { seed: 32 }), 0, 832);
  // front layer: window + city, sill, mug, snake plant
  ROOM_FRONT = mk(W, H); X = ROOM_FRONT.getContext('2d');
  const wx = 1300, wy = 130, ww = 440, wh = 430;
  put(gshadow(ww + 160, wh + 160, 80, 80, g => { rr(g, -16, 22, ww, wh + 24, 48); g.fill(); }, '#e7dac6', { soft: 30, k: .75, seed: 41 }), wx, wy);
  // glass: sky, clouds, city — painted on its own canvas and clipped to the inner pane
  const gw = ww - 44, gh = wh - 44, glass = mk(gw, gh), gg = glass.getContext('2d');
  const sky = gg.createLinearGradient(0, 0, 0, gh); sky.addColorStop(0, '#a9d6ee'); sky.addColorStop(1, '#d9eef3'); gg.fillStyle = sky; gg.fillRect(0, 0, gw, gh);
  shade(glass, { s: 0, hi: .35, hiCol: [255, 255, 255], hiMix: .55, reach: 1, soft: 4, grad: (x, y) => 0, seed: 42 });
  const GX = X; X = gg;
  put(stip(gw, gh, 0, 0, (x, y) => .32 * Math.pow(1 - y / gh, 2), ['#ffffff', '#eef8fb'], { seed: 43 }), 0, 0);
  const cloud = (sc, seed) => art(220 * sc, 110 * sc, 110 * sc, 80 * sc, g => { g.fillStyle = P.white; g.beginPath(); g.arc(-40 * sc, -6 * sc, 32 * sc, 0, TAU); g.arc(6 * sc, -26 * sc, 42 * sc, 0, TAU); g.arc(48 * sc, -4 * sc, 30 * sc, 0, TAU); g.fill(); rr(g, -72 * sc, -14 * sc, 150 * sc, 40 * sc, 20 * sc); g.fill(); },
    { dir: [0, 1], reach: 16 * sc, soft: 10 * sc, s: .7, tint: [.86, .9, .97], hi: 0, seed });
  put(cloud(1, 44), 92, 92); put(cloud(.7, 45), 300, 150);
  const bld = (w, h, col, top, win, seed) => art(w + 20, h + 60, 10, h + 50, g => {
    g.fillStyle = col; g.beginPath();
    if (top === 'dome') { g.moveTo(0, 0); g.lineTo(0, -h + w / 2); g.arc(w / 2, -h + w / 2, w / 2, Math.PI, 0); g.lineTo(w, 0); }
    else if (top === 'gable') { g.moveTo(0, 0); g.lineTo(0, -h + 26); g.lineTo(w / 2, -h - 8); g.lineTo(w, -h + 26); g.lineTo(w, 0); }
    else { g.roundRect(0, -h, w, h + 4, [10, 10, 0, 0]); }
    g.closePath(); g.fill();
    g.fillStyle = win; const cols = Math.max(2, Math.floor(w / 26)), sp = w / cols;
    for (let r = 0; r < 12; r++) for (let c = 0; c < cols; c++) { const y = -h + 34 + r * 30; if (y > -26) continue; rr(g, c * sp + sp / 2 - 6, y, 12, 15, 4); g.fill(); }
  }, { dir: [-.8, .4], reach: 12, soft: 8, s: .9, tint: [.86, .76, .84], hi: .1, seed });
  put(bld(78, 150, P.lilac, 'flat', P.lilacL, 50), 6, gh + 2);
  put(bld(70, 210, P.coral, 'flat', P.pinkL, 51), 86, gh + 2);
  put(bld(86, 120, P.mint, 'dome', P.white, 52), 160, gh + 2);
  put(bld(64, 176, P.mustard, 'gable', P.white, 53), 248, gh + 2);
  put(bld(84, 136, P.navy, 'flat', P.mustardL, 54), 314, gh + 2);
  const bush = (r, seed) => art(r * 2 + 10, r * 2 + 10, r + 5, r + 5, g => { g.fillStyle = P.green; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); }, { reach: r * .5, soft: r * .3, tint: [.7, .8, .74], seed });
  put(bush(30, 55), 70, gh); put(bush(24, 56), 228, gh + 2); put(bush(28, 57), 380, gh);
  X = GX;
  const gm = glass.getContext('2d'); gm.globalCompositeOperation = 'destination-in'; rr(gm, 0, 0, gw, gh, 26); gm.fill();
  X.drawImage(glass, wx + 22, wy + 22);
  // frame + mullions + sill (cream white, gently grain-shaded)

// ───────────────────────── the street (scene B) ─────────────────────────
const V = 700;
const vb = t => V * (1 - sstep(6.1, T.stop, t));
const vc = t => V * sstep(4.25, 5.5, t) * (1 - sstep(6.0, 6.7, t));
function integ(f, a, b, n = 160) { if (b <= a) return 0; const h = (b - a) / n; let s = 0; for (let i = 0; i < n; i++) s += f(a + (i + .5) * h); return s * h; }
const street = t => { const t0 = 3.45, cam = integ(vc, t0, t), bw = -360 + integ(vb, t0, t); return { cam, bw, bx: bw - cam }; };
const BS = 1.15, GY = 930;   // bike scale, road contact line
// the parcel leaves the box: a squash, then it flies up out of the frame (drawn over the iris)
function flyingParcel(t) {
  const u = seg(t, T.pop, T.irM); if (u <= 0 || u >= 1) return;
  const { bx } = street(T.stop + .6), x0 = bx + 380 * BS, y0 = GY - 196 * BS;
  const y = lerp(y0, -260, eOut(u) * .35 + u * u * .65), x = x0 - 120 * u, s = BS * .82 * (1 + .5 * u);
  put(S.parcel, x, y, -.6 * u, s * (1 - .1 * Math.sin(u * 9)), s * (1 + .12 * Math.sin(u * 9)));
}
function sceneB(t) {
  const { cam, bw, bx } = street(t);   // bike rear-contact screen x

  put(S.cloud[0], Math.round(380 - cam * .06 + t * 8), 200); put(S.cloud[1], Math.round(1100 - cam * .06 + t * 6), 120, 0, .8);
  put(S.far, Math.round(-200 - cam * .3), 762);
  X.drawImage(ROAD, 0, 750);
  // lane dashes scroll with the camera
  X.fillStyle = '#ece4f4'; const off = ((cam % 170) + 170) % 170; for (let x = -170; x < W + 170; x += 170) { rr(X, Math.round(x - off), 990, 96, 12, 6); X.fill(); }
  for (const tr of TREES) { const x = Math.round(tr.x - cam); if (x > -300 && x < W + 300) put(S.treeShadow, x, 774); }
  for (const b of BLD) {
    const x = Math.round(b.x - cam); if (x < -700 || x > W + 100) continue;
    put(b.s, x, 760);
    if (b.home) {   // the leaf poking out of the home window sways
      X.save(); X.beginPath(); X.rect(x + 64, 760 - 316, 172, 142); X.clip(); put(S.homeLeaf, x + 150, 760 - 168, -.5 + .06 * Math.sin(t * 1.5), .55); X.restore();
    }
  }
  for (const tr of TREES) { const x = Math.round(tr.x - cam); if (x > -300 && x < W + 300) put(S.trees[tr.v], x, 772); }
  // lamp posts
  X.fillStyle = P.navy; for (const lx of [420, 1380, 3420]) { const x = Math.round(lx - cam); if (x < -50 || x > W + 50) continue; rr(X, x - 6, 430, 12, 340, 6); X.fill(); rr(X, x - 30, 410, 60, 26, 13); X.fill(); X.fillStyle = P.mustardL; rr(X, x - 22, 432, 44, 12, 6); X.fill(); X.fillStyle = P.navy; }
  for (const c of CONF_ST) doodle(c, t, eBack(seg(t, 3.5 + c.d * .8, 3.85 + c.d * .8), 2));

}
function bike(t, bx, bw) {
  const s = BS, gy = GY, crank = bw / 66 * .5 + 1.2;
  const stopU = seg(t, T.stop - .1, T.stop + .5), pitch = -.035 * Math.sin(stopU * Math.PI) * (1 - stopU) * (stopU > 0 ? 1 : 0);
  put(S.bikeShadow, bx + 300 * s, gy + 4);
  X.save(); X.translate(bx + 560 * s, gy); X.rotate(pitch); X.translate(-560 * s, 0); X.scale(s, s);
  const LX = X, Rw = [0, -66], Fw = [560, -50], BB = [110, -64];
  const wheel = (c, r, a) => {
    X.save(); X.translate(c[0], c[1]); X.fillStyle = P.navy; X.beginPath(); X.arc(0, 0, r, 0, TAU); X.fill(); X.fillStyle = P.white; X.beginPath(); X.arc(0, 0, r - 11, 0, TAU); X.fill();
    X.strokeStyle = P.grey; X.lineWidth = 3; X.lineCap = 'round'; X.rotate(a); X.beginPath(); for (let i = 0; i < 6; i++) { X.moveTo(0, 0); X.lineTo(Math.cos(i * TAU / 6) * (r - 12), Math.sin(i * TAU / 6) * (r - 12)); } X.stroke();
    X.fillStyle = P.navy; X.beginPath(); X.arc(0, 0, 8, 0, TAU); X.fill(); X.restore();

  const tube = (pts, w = 12, c = P.mustard) => { X.strokeStyle = c; X.lineWidth = w; X.lineCap = 'round'; X.lineJoin = 'round'; X.beginPath(); X.moveTo(...pts[0]); for (const p of pts.slice(1)) X.lineTo(...p); X.stroke(); };
  // pedalling geometry
  const pedal = a => [BB[0] + 30 * Math.cos(a), BB[1] + 30 * Math.sin(a)];
  const pN = pedal(crank), pF = pedal(crank + Math.PI);
  const lean = .5 + .1 * Math.sin(stopU * Math.PI) * (stopU > 0 && stopU < 1 ? 1 : 0) * (1 - stopU);
  const hip = [60, -252], grip = [226, -278];

  const sqU = seg(t, T.pop - .16, T.pop);
  const parcel = () => {
    if (t >= T.pop) return;
    const sy = 1 - .18 * Math.sin(sqU * Math.PI / 2);
    put(S.parcel, 380, -196, 0, .82 / Math.sqrt(sy), .82 * sy);

  drawPerson(COUR, {
    hip, tl: lean, ht: -.38 + .05 * Math.sin(t * 3), ankN: [pN[0] - 8, pN[1] - 16], ankF: [pF[0] - 8, pF[1] - 16], footAN: -.1, footAF: -.1,
    handN: grip, handF: [grip[0] - 8, grip[1] + 4], wristN: -1.2, wristF: -1.2, armBend: 1,
    face: { mouth: bell ? 2 : (t > T.stop ? 2 : 0), eye: 1, blink: (t > 4.8 && t < 4.95) ? Math.sin((t - 4.8) / .15 * Math.PI) : 0 },
    between: () => {
      // frame + wheels drawn between the far and the near leg
      wheel(Rw, 66, bw / 66); wheel(Fw, 50, bw / 50);
      tube([Rw, BB, [66, -226]]); tube([Rw, [64, -214]]); tube([[64, -206], [240, -206]]); tube([[240, -196], [252, -268]], 13);
      tube([[252, -270], [236, -284], [214, -280]], 9, P.navy); tube([BB, [280, -70], [540, -70], Fw]); tube([[540, -150], Fw], 12);
      tube([[52, -244], [80, -244]], 14, P.coral); tube([[66, -232], [64, -244]], 8);
      X.fillStyle = P.navy; X.beginPath(); X.arc(BB[0], BB[1], 18, 0, TAU); X.fill();
      X.save(); X.translate(232, -290); X.rotate(ringA); X.fillStyle = P.mustard; X.beginPath(); X.arc(0, 0, 10, Math.PI, 0); X.closePath(); X.fill(); X.restore();
      if (bell) { X.strokeStyle = P.navy; X.lineWidth = 4; X.lineCap = 'round'; for (let i = 0; i < 3; i++) { const a = -2.2 + i * .45, r0 = 22, r1 = 36 + 6 * Math.sin((t - T.bell) * 20); X.beginPath(); X.moveTo(232 + Math.cos(a) * r0, -292 + Math.sin(a) * r0); X.lineTo(232 + Math.cos(a) * r1, -292 + Math.sin(a) * r1); X.stroke(); } }
      // crank arms

}

// ───────────────────────── frame ─────────────────────────
function halfPlane(theta, side) {   // the region already swept (side=-1) or still to sweep (side=+1) by the leaf's midrib
  const u = [Math.sin(theta), -Math.cos(theta)], n = [u[1] * side * -1, -u[0] * side * -1], F = 6000;
  X.beginPath(); X.moveTo(PIV[0] - u[0] * F, PIV[1] - u[1] * F); X.lineTo(PIV[0] + u[0] * F, PIV[1] + u[1] * F);
  X.lineTo(PIV[0] + u[0] * F + n[0] * F, PIV[1] + u[1] * F + n[1] * F); X.lineTo(PIV[0] - u[0] * F + n[0] * F, PIV[1] - u[1] * F + n[1] * F); X.closePath(); X.clip();
}
function giantLeaf(theta) {
  const u = [Math.sin(theta), -Math.cos(theta)], base = [PIV[0] + u[0] * 320, PIV[1] + u[1] * 320];
  X.strokeStyle = P.forest; X.lineWidth = 44; X.lineCap = 'round'; X.beginPath(); X.moveTo(PIV[0], PIV[1]); X.lineTo(base[0], base[1]); X.stroke();
  put(S.giant, base[0], base[1], theta, 1.3, 1.3);
}
function render(t) {   // every frame starts from the pristine context state, so no stroke/fill setting leaks between frames

  if (t < T.sw0) sceneA(t);

    X.save(); halfPlane(th, -1); sceneB(t); X.restore();
    giantLeaf(th);
  } else if (t < T.irM) {
    sceneB(t);
    const u = seg(t, T.ir0, T.irM); if (u > 0) { const { bx } = street(T.stop + .6), s = 1.6 * eIn(u) + .03; put(S.iris, bx + 380 * BS, GY - 300 * BS, 0, s); }
    flyingParcel(t);
  } else {
    sceneC(t);
    const u = seg(t, T.irM, T.ir1);
    if (u < 1) {
      SHG.setTransform(1, 0, 0, 1, 0, 0); SHG.globalCompositeOperation = 'source-over'; SHG.fillStyle = P.pink; SHG.fillRect(0, 0, W, H);
      SHG.globalCompositeOperation = 'destination-out'; const s = 1.55 * eOut(u) + .001;

  X.restore();
}

window.ready = (async () => {

window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// sound cues (events.mjs → events.json → audio.py); a 100 bpm grid (beat = 0.6 s) that the picture is cut to
window.events = () => {
