<html lang="en"><head><meta charset="utf-8">

</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── relatable-webcomic · "making plans: a love story" ─────────────────────────────────────────────
// A soft pastel four-panel webcomic about an original messy-bun self-insert ("me"):
//  2:00 PM a text asks "Drinks tonight?" → "YES!! I love people!" (hearts) · 6:45 PM slumped, eyes drift to the
//  clock: "why did I say yes" · 6:52 PM the phone buzzes: "so sorry!! rain check?" → sparkly gasp ·
//  6:53 PM tea, blanket, hearts: "Best plans I've ever had." The camera pushes into the last panel, a sip,
//  and a heart iris closes the strip. Loose wobbly line boils at 8 fps; everything is deterministic from t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eSm = u => u * u * (3 - 2 * u);
const eOutBack = u => { const c = 1.9; return u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
const lp = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
const hash = (a, b = 0) => { let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FH = 'Gaegu';
const INK = '#3d3142', LW = 4.2;
const C = {
  paper: '#f8f2ea', p1: '#fde3d2', p2: '#dfdaf0', p3: '#fbefc0', p4: '#f9d7e2',
  skin: '#fdeadf', blush: '#f5a3b6', hair: '#5d4157', sweater: '#c8b8ee', sweaterD: '#ab98dc', pants: '#8e98cc', shoe: '#fffaf4',
  couch: '#9fd5cd', couchD: '#86c3ba', heart: '#f48aae', spark: '#ffd46a', phone: '#6f6a8e', glow: '#fff7c9', msg: '#c3def8',
  white: '#fffdf9', mug: '#f6a97f', blanket: '#fbe9a8', blanketD: '#f2d27a', gloom: '#bdb8d2', mouth: '#6e3a4c', tongue: '#f58ea4',
  wood: '#e7c39d', iris: '#f4b8c9'
};
let BOIL = 0;   // hand-drawn line "boil" step (8 fps)

// ── timeline ──
const T = { title: .12, p1: .42, msg1: .95, jump: 1.32, yes: 1.5, hearts1: 1.58,
  p2: 2.55, look0: 3.05, sigh: 3.2, why: 3.35, look1: 3.75, blink2: 4.05,
  p3: 4.55, buzz: 4.92, msg3: 5.08, gasp: 5.5, bang: 5.58,
  p4: 6.35, bub4: 6.85, zoom0: 7.55, zoom1: 8.35, sip0: 8.45, sip1: 9.0, iris0: 9.1, iris1: 9.62, end: 9.66 };
const P = [{ x: 66, y: 104 }, { x: 974, y: 104 }, { x: 66, y: 580 }, { x: 974, y: 580 }].map(p => ({ ...p, w: 880, h: 448 }));
const PT = [T.p1, T.p2, T.p3, T.p4], PBG = [C.p1, C.p2, C.p3, C.p4];

// ── wobbly-line primitives ──
function sn(id, x, K) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); const a = K ? ((i % K) + K) % K : i, b = K ? (((i + 1) % K) + K) % K : i + 1;
  return lerp(hash(id * 7919 + a, BOIL * 31 + 7), hash(id * 7919 + b, BOIL * 31 + 7), u) * 2 - 1; }
function jitter(pts, id, closed, amp = 1.3) {
  let per = 0; for (let i = 1; i < pts.length; i++) per += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const K = Math.max(3, Math.round(per / 55)), n = pts.length;
  return pts.map((p, i) => { const u = closed ? i / n * K : i / Math.max(1, n - 1) * K; return [p[0] + sn(id * 2, u, closed ? K : 0) * amp, p[1] + sn(id * 2 + 1, u, closed ? K : 0) * amp]; });
}
function poly(pts, closed) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); if (closed) ctx.closePath(); }
function shape(pts, id, fill, lw = LW, col = INK, closed = true, amp = 1.3) {
  const q = jitter(pts, id, closed, amp); poly(q, closed); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (lw) { ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.stroke(); }
}
const line = (pts, id, lw = LW, col = INK, amp = 1.2) => shape(pts, id, null, lw, col, false, amp);
function ellP(cx, cy, rx, ry, n = 28, rot = 0, a0 = 0, a1 = TAU) { const o = []; const cl = a1 - a0 >= TAU - 1e-6;
  for (let i = 0; i < (cl ? n : n + 1); i++) { const a = a0 + (a1 - a0) * i / n, x = Math.cos(a) * rx, y = Math.sin(a) * ry; o.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); } return o; }
function rrP(x, y, w, h, r, per = 9) { const o = [], cs = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of cs) for (let i = 0; i <= per; i++) { const a = a0 + Math.PI / 2 * i / per; o.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return o; }
function quadP(a, c, b, n = 14) { const o = []; for (let i = 0; i <= n; i++) { const u = i / n, v = 1 - u; o.push([v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]); } return o; }
function chaikin(p, it = 2) { for (let k = 0; k < it; k++) { const o = []; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; o.push(lp(a, b, .25), lp(a, b, .75)); } p = o; } return p; }
function densify(pts, step = 14) { const o = []; for (let i = 0; i < pts.length - 1; i++) { const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
  for (let k = 0; k < n; k++) o.push(lp(a, b, k / n)); } o.push(pts[pts.length - 1]); return o; }
// tube: outlined limb through joints (visible elbow/knee bend)
function tube(pts, w, col, id) { const q = jitter(densify(pts, 10), id, false, 1.0); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  poly(q, false); ctx.strokeStyle = INK; ctx.lineWidth = w + LW * 2; ctx.stroke(); poly(q, false); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); }
function heartP(cx, cy, s, n = 40) { const o = []; for (let i = 0; i < n; i++) { const a = i / n * TAU, x = 16 * Math.pow(Math.sin(a), 3), y = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)); o.push([cx + x * s / 16, cy + y * s / 16]); } return o; }
function starP(cx, cy, r, rot = 0) { const o = []; for (let i = 0; i < 8; i++) { const a = rot + i / 8 * TAU - Math.PI / 2, rr = i % 2 ? r * .32 : r; o.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } return o; }
function heart(cx, cy, s, id, k = 1, rot = 0) { if (k <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(k, k); shape(heartP(0, 0, s), id, C.heart, 3.4); ctx.restore(); }
function sparkle(cx, cy, r, id, k = 1, rot = 0) { if (k <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); shape(starP(0, 0, r, rot), id, C.spark, 3.2, INK, true, .8); ctx.restore(); }
function text(s, x, y, size, col = INK, align = 'center', wt = 700) { ctx.font = `${wt} ${size}px ${FH}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); }

// speech bubble (rounded box with a sharp tail merged into one outline), pops from its centre with overshoot
function bubble(bx, by, bw, bh, lines, size, tail, k, id, fill = C.white, typed = 1) {
  if (k <= 0) return;
  let mw = 0; lines.forEach((ln, i) => { ctx.font = `700 ${Array.isArray(size) ? size[i] : size}px ${FH}`; mw = Math.max(mw, ctx.measureText(ln).width); });
  if (mw + 64 > bw) { const nw = mw + 64; bx = clamp(bx - (nw - bw) / 2, 14, 866 - nw); bw = nw; }
  const cx = bx + bw / 2, cy = by + bh / 2, s = lerp(.4, 1, eOutBack(clamp(k))), a = clamp(k * 3);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  let pts = densify([...rrP(bx, by, bw, bh, Math.min(bh / 2, 46), 10), rrP(bx, by, bw, bh, Math.min(bh / 2, 46), 10)[0]], 12).slice(0, -1);
  if (tail) { let bi = 0, bd = 1e9; pts.forEach((p, i) => { const d = Math.hypot(p[0] - tail[0], p[1] - tail[1]); if (d < bd) { bd = d; bi = i; } });
    const n = pts.length, sh = (bi + Math.floor(n / 2)) % n, rp = [...pts.slice(sh), ...pts.slice(0, sh)], m = (bi - sh + n) % n;
    pts = [...rp.slice(0, m - 1), ...densify([rp[m - 2], tail, rp[m + 2]], 12).slice(1, -1), ...rp.slice(m + 2)]; }
  shape(pts, id, fill, LW);
  const all = lines.join('\n'), shown = Math.floor(all.length * typed + 1e-6); let used = 0;
  lines.forEach((ln, i) => { const vis = ln.slice(0, clamp(shown - used, 0, ln.length)); used += ln.length + 1;
    const fs = Array.isArray(size) ? size[i] : size, ly = cy + (i - (lines.length - 1) / 2) * (Array.isArray(size) ? (size[0] + size[1]) / 2 * .98 : size * 1.02) + 2;
    ctx.font = `700 ${fs}px ${FH}`; const full = ctx.measureText(ln).width; text(vis, cx - full / 2, ly, fs, INK, 'left'); });
  ctx.restore();
}
function captionBox(s, x, y, k, id) { if (k <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(k * 3); const dy = (1 - eOutBack(k)) * -18;
  ctx.font = `700 34px ${FH}`; const w = ctx.measureText(s).width + 30; shape(rrP(x, y + dy, w, 50, 6, 3), id, C.white, 3.4); text(s, x + w / 2, y + dy + 27, 34); ctx.restore(); }

// ═══════════════════════ THE SELF-INSERT ("me") ═══════════════════════
// Drawn front-on in panel coords. o: hip centre (hx,hy), shoulder y (sy), shoulder centre x (sx), head [x,y], r, tilt,
// expr ('calm'|'joy'|'dread'|'gasp'|'bliss'), look [dx,dy], blink, arms {L:[s,e,h], R:[s,e,h]}, legs, mess (hair).
function drawLegs(o, id) {
  const { hx, hy } = o;
  for (const sd of [-1, 1]) { const hip = [hx + sd * 24, hy - 4], knee = [hx + sd * 40, hy + 28], foot = [hx + sd * 36, hy + 80];
    tube([hip, knee, foot], 38, C.pants, id + sd * 3);
    shape(ellP(foot[0] + sd * 6, foot[1] + 8, 27, 14, 20), id + 10 + sd, C.shoe, LW); }
}
function drawTorso(o, id) {
  const { hx, hy, sy } = o, sx = o.sx ?? hx;
  // neck
  shape([[sx - 13, sy - 34], [sx + 13, sy - 34], [sx + 14, sy + 4], [sx - 14, sy + 4]], id + 1, C.skin, LW);
  const pts = [...quadP([sx - 70, sy + 14], [sx - 64, sy - 12], [sx - 22, sy - 12], 6), ...quadP([sx - 22, sy - 12], [sx, sy + 8], [sx + 22, sy - 12], 6).slice(1),
    ...quadP([sx + 22, sy - 12], [sx + 64, sy - 12], [sx + 70, sy + 14], 6).slice(1), [lerp(sx + 72, hx + 68, .5), lerp(sy, hy, .5)], [hx + 66, hy + 2],
    ...quadP([hx + 66, hy + 2], [hx, hy + 18], [hx - 66, hy + 2], 8).slice(1), [lerp(sx - 72, hx - 68, .5), lerp(sy, hy, .5)]];
  shape(pts, id, C.sweater, LW);
  // collar + hem stripe + tiny heart on the sweater
  line(quadP([sx - 22, sy - 11], [sx, sy + 9], [sx + 22, sy - 11], 8), id + 2, 3.2);
  line(quadP([hx - 60, hy - 16], [hx, hy - 4], [hx + 60, hy - 16], 10), id + 3, 3, C.sweaterD);
  shape(heartP(lerp(sx, hx, .45) + 30, lerp(sy, hy, .45), 10, 24), id + 4, C.heart, 2.6);
}
function hand(h, dir, id, thumb = 1) {
  const a = Math.atan2(dir[1], dir[0]);
  shape(ellP(h[0], h[1], 16, 14.5, 18, a), id, C.skin, LW);
  if (thumb) { const ta = a + thumb * 1.35; shape(ellP(h[0] + Math.cos(ta) * 12, h[1] + Math.sin(ta) * 12, 6, 4.5, 12, ta), id + 1, C.skin, 3.2); }
}
function arm(A, id, thumb = 1) {
  const [s, e, h] = A, wr = lp(e, h, .86);
  tube([s, e, wr], 30, C.sweater, id);
  hand(h, [h[0] - e[0], h[1] - e[1]], id + 5, thumb);
  // cuff
  const d = Math.atan2(h[1] - e[1], h[0] - e[0]) + Math.PI / 2, c = lp(e, h, .74);
  line([[c[0] + Math.cos(d) * 17, c[1] + Math.sin(d) * 17], [c[0] - Math.cos(d) * 17, c[1] - Math.sin(d) * 17]], id + 9, 3, C.sweaterD, .6);
}
function drawHead(o, t, id) {
  const [x, y] = o.head, r = o.r, mess = o.mess ?? 1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt || 0); if (o.hs) ctx.scale(o.hs, o.hs);
  // back hair (to the jaw) + bun
  shape([...ellP(0, -2, r * 1.1, r * 1.04, 30, 0, Math.PI * .92, Math.PI * 2.08), [r * 1.06, r * .52], [r * .7, r * .6], [-r * .7, r * .6], [-r * 1.06, r * .52]], id, C.hair, LW);
  shape(ellP(r * .12, -r * 1.12, r * .44, r * .38, 20, .2), id + 1, C.hair, LW);
  line(quadP([-r * .02, -r * 1.2], [r * .15, -r * 1.34], [r * .3, -r * 1.14], 8), id + 2, 3, '#7c5e76');
  // flyaway strands (sway)
  const sw = Math.sin(t * 2.3) * .12 * mess, sw2 = Math.sin(t * 1.7 + 1) * .14 * mess;
  const fly = [[[r * .44, -r * 1.24], [r * .66, -r * 1.46 + sw * 26], [r * .8, -r * 1.3 + sw * 20]], [[-r * .1, -r * 1.4], [-r * .2, -r * 1.64 + sw2 * 24], [-r * .38, -r * 1.56 + sw2 * 26]],
    [[r * .94, -r * .46], [r * 1.16, -r * .58 + sw2 * 20], [r * 1.2, -r * .4 + sw2 * 16]], [[-r * .96, -r * .42], [-r * 1.16, -r * .6 + sw * 20], [-r * 1.2, -r * .38 + sw * 16]]];
  const nf = mess > 1.3 ? 4 : 2; for (let i = 0; i < nf; i++) line(quadP(...fly[i], 10), id + 3 + i, 3.6, C.hair, .6);
  // ears + face
  for (const sd of [-1, 1]) shape(ellP(sd * r * .97, r * .12, r * .15, r * .2, 14), id + 8 + sd, C.skin, LW);
  shape(ellP(0, 0, r, r * .96, 32), id + 11, C.skin, LW);
  face(o, t, r, id + 20);
  // front hair cap with messy fringe
  const cap = [...ellP(0, -2, r * 1.04, r * 1.0, 26, 0, Math.PI * 1.02, Math.PI * 1.98)];
  const fr = [[r * .98, -r * .12], [r * .62, -r * .5], [r * .42, -r * .22], [r * .12, -r * .55], [-r * .12, -r * .3], [-r * .42, -r * .6], [-r * .62, -r * .28], [-r * .98, -r * .1]];
  shape([...cap, ...fr], id + 12, C.hair, LW);
  line(quadP([-r * .5, -r * .88], [-r * .2, -r * .98], [r * .05, -r * .82], 8), id + 13, 3, '#7c5e76');
  ctx.restore();
}
function face(o, t, r, id) {
  const e = o.expr || 'calm', lk = o.look || [0, 0], ex = lk[0] * r * .09, ey = lk[1] * r * .07, blink = o.blink;
  for (const sd of [-1, 1]) shape(ellP(sd * r * .55, r * .36, r * .15, r * .085, 14), id + sd, C.blush, 0);
  const E = [[-r * .34 + ex, r * .1 + ey], [r * .34 + ex, r * .1 + ey]];
  if (e === 'bliss') {
    E.forEach((p, i) => line(quadP([p[0] - r * .13, p[1] + r * .04], [p[0], p[1] - r * .14], [p[0] + r * .13, p[1] + r * .04], 8), id + 4 + i, 4));
    line(quadP([-r * .14, r * .4], [0, r * .54], [r * .14, r * .4], 8), id + 7, 3.6);
  } else if (blink) {
    E.forEach((p, i) => line([[p[0] - r * .1, p[1] + r * .02], [p[0] + r * .1, p[1] + r * .02]], id + 4 + i, 4));
  } else if (e === 'gasp') {
    E.forEach((p, i) => { shape(ellP(p[0], p[1], r * .16, r * .2, 20), id + 4 + i, INK, 0);
      ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(p[0] + r * .05, p[1] - r * .07, r * .06, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(p[0] - r * .06, p[1] + r * .07, r * .028, 0, TAU); ctx.fill(); });
  } else {
    const big = e === 'joy' ? 1.25 : 1;
    E.forEach((p, i) => { shape(ellP(p[0], p[1], r * .085 * big, r * .12 * big, 16), id + 4 + i, INK, 0);
      if (e === 'joy') { ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(p[0] + r * .03, p[1] - r * .05, r * .035, 0, TAU); ctx.fill(); }
      if (e === 'dread') { const lid = o.lid ?? .55; ctx.save(); ctx.beginPath(); ctx.rect(p[0] - r * .2, p[1] - r * .25, r * .4, r * .25 * lid * 1.5 + r * .02); ctx.fillStyle = C.skin; ctx.fill(); ctx.restore();
        line([[p[0] - r * .15, p[1] - r * .19 + r * .37 * lid], [p[0] + r * .15, p[1] - r * .19 + r * .37 * lid]], id + 30 + i, 3.6); } });
  }
  if (e === 'joy') { const m = [...quadP([-r * .24, r * .34], [0, r * .36], [r * .24, r * .34], 8), ...quadP([r * .24, r * .34], [r * .2, r * .72], [0, r * .72], 8).slice(1), ...quadP([0, r * .72], [-r * .2, r * .72], [-r * .24, r * .34], 8).slice(1)];
    shape(m, id + 8, C.mouth, 3.6); ctx.save(); poly(m, true); ctx.clip(); shape(ellP(0, r * .7, r * .15, r * .1, 14), id + 9, C.tongue, 0); ctx.restore(); }
  else if (e === 'gasp') shape(ellP(0, r * .5, r * .08, r * .1, 14), id + 8, C.mouth, 3.4);
  else if (e === 'dread') line([[-r * .16, r * .5], [-r * .08, r * .46], [0, r * .5], [r * .08, r * .46], [r * .16, r * .5]], id + 8, 3.4, INK, .6);
  else if (e === 'calm') line(quadP([-r * .12, r * .42], [0, r * .52], [r * .12, r * .42], 8), id + 8, 3.6);
}
function me(o, t, id, extra) {
  if (o.legs !== false) drawLegs(o, id + 100);
  if (o.under) o.under();
  drawTorso(o, id + 200);
  if (o.behindArms) o.behindArms();
  arm(o.arms.L, id + 300, o.thumbL ?? 1); arm(o.arms.R, id + 320, o.thumbR ?? -1);
  if (o.front) o.front();
  drawHead(o, t, id + 400);
  if (o.hands) o.hands();
}

// ═══════════════════════ SET PIECES ═══════════════════════
function couch(id, lean = 0) {
  shape(rrP(196, 238, 428, 118, 34, 6), id, C.couch, LW);
  line([[410, 250], [410, 334]], id + 1, 3, C.couchD);
  shape(rrP(190, 322, 440, 66, 20, 5), id + 2, C.couch, LW);
  for (const x of [158, 588]) shape(rrP(x, 276, 74, 118, 30, 6), id + 3 + x, C.couchD, LW);
  for (const x of [196, 610]) shape(rrP(x, 390, 16, 22, 4, 2), id + 7 + x, C.wood, 3.4);
}
function floorLine(id, col) { line([[0, 414], [880, 414]], id, 3.4, col, 1.5); }
function wallArt(id) { // tiny framed doodle of a cloud + sun
  shape(rrP(690, 96, 116, 90, 6, 2), id, C.white, LW); shape(ellP(724, 128, 13, 13, 14), id + 1, C.spark, 3);
  shape([...ellP(760, 150, 24, 12, 16, 0, Math.PI, TAU), [784, 158], [736, 158]], id + 2, C.msg, 3);

function phoneAt(x, y, rot, id, lit = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot);

// ── static paper grain (precomputed once) ──
let GRAIN;
function makeGrain() { const g = document.createElement('canvas'); g.width = W; g.height = H; const gx = g.getContext('2d'), id = gx.createImageData(W, H), r = rng(92);
  for (let i = 0; i < W * H; i++) { const v = r(); const o = i * 4; if (v < .5) { id.data[o] = 60; id.data[o + 1] = 40; id.data[o + 2] = 60; id.data[o + 3] = Math.floor(r() * 16); } else { id.data[o] = 255; id.data[o + 1] = 250; id.data[o + 2] = 240; id.data[o + 3] = Math.floor(r() * 14); } }
