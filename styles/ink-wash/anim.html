<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── ink-wash · sumi-e ink blended with watercolor on cold-press paper ────────────────────────────
// Scene 1: a loaded brush paints a bamboo stalk segment by segment (pressure, dry-brush streaks), a pale
// back stalk grows in diluted ink, nodes and leaves flick in, a mist wash blooms across the paper, the title
// "Stillness" is brushed on and a vermilion seal is pressed. The brush hovers, a single drop falls and
// blooms through the wet paper (pigment pushed to a dark rim) revealing Scene 2: a pale sun, three mountain
// ranges laid as washes that spread, granulate and dry with hard edges, dry-brush ridge lines, a heron
// flying across. The brush draws a last water line, lifts away; the seal is pressed and the painting settles.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const HW = 960, HH = 540;                           // wash / bloom simulation resolution (half)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u;
const eBack = u => { const c = 1.6; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const TITLE = '"Cormorant Garamond"', SANS = '"Jost"';
const INK = [24, 22, 27], PAPER = [245, 241, 232];

// ── seeded value noise + fbm ──
function makeNoise(seed) {
  const r = rng(seed), P = new Uint8Array(512), G = new Float32Array(256);

  for (let i = 0; i < 512; i++) P[i] = p[i & 255];
  for (let i = 0; i < 256; i++) G[i] = r();
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const X = xi & 255, Y = yi & 255;
    const a = G[P[P[X] + Y]], b = G[P[P[X + 1] + Y]], c = G[P[P[X] + Y + 1]], d = G[P[P[X + 1] + Y + 1]];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
const N1 = makeNoise(11), N2 = makeNoise(23), N3 = makeNoise(37), N4 = makeNoise(51);
const fbm = (n, x, y, o = 4) => { let s = 0, a = .5, f = 1, m = 0; for (let i = 0; i < o; i++) { s += a * n(x * f + i * 17.3, y * f - i * 9.1); m += a; a *= .5; f *= 2.03; } return s / m; };

// ── paper: cold-press tooth (height map, lit from top-left), fibres, warm tone drift ──
let PAPERCV, HP;                                    // HP: full-res paper height 0..1
function buildPaper() {
  HP = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const h = .55 * fbm(N1, x / 7.5, y / 7.5, 3) + .3 * fbm(N2, x / 22, y / 22, 2) + .15 * N3(x / 2.2, y / 2.2);
    HP[y * W + x] = h;
  }
  let mn = 1, mx = 0; for (let i = 0; i < HP.length; i += 7) { mn = Math.min(mn, HP[i]); mx = Math.max(mx, HP[i]); }
  for (let i = 0; i < HP.length; i++) HP[i] = clamp((HP[i] - mn) / (mx - mn));
  const c = mk(W, H), g = c.getContext('2d'), im = g.createImageData(W, H), d = im.data, r = rng(5);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, h = HP[i];
    const hx = HP[i + (x < W - 1 ? 1 : 0)] - HP[i - (x > 0 ? 1 : 0)], hy = HP[i + (y < H - 1 ? W : 0)] - HP[i - (y > 0 ? W : 0)];
    const shade = (-hx - hy) * 34 + (h - .5) * 7;
    const tone = (fbm(N4, x / 420, y / 420, 2) - .5) * 9;
    const vx = (x - W / 2) / W, vy = (y - H / 2) / H, vig = (vx * vx + vy * vy) * 16;
    const k = shade + tone - vig + (r() - .5) * 2.2;
    d[i * 4] = PAPER[0] + k; d[i * 4 + 1] = PAPER[1] + k * .98; d[i * 4 + 2] = PAPER[2] + k * .9 - tone * .3; d[i * 4 + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  // faint fibres
  g.globalAlpha = .05; g.strokeStyle = '#8a7f6c'; g.lineWidth = .7;
  for (let i = 0; i < 380; i++) { const x = r() * W, y = r() * H, a = r() * TAU, l = 6 + r() * 22; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + .6) * l * .5, y + Math.sin(a + .6) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  g.globalAlpha = 1; PAPERCV = c;
}
const hpAt = (x, y) => HP[clamp(Math.round(y), 0, H - 1) * W + clamp(Math.round(x), 0, W - 1)];

// ── brush strokes: pre-rendered with bristles, pressure profile and dry-brush dropout; revealed by a mask ──
// path(s) → [x,y] for s∈[0,1]; width(s) → px
function makeStroke(path, width, o = {}) {
  const tone = o.tone ?? .9, dryStart = o.dryStart ?? .6, dryAmt = o.dryAmt ?? .5, seed = o.seed ?? 1, ink = o.ink ?? INK;
  const raw = []; let L = 0, prev = null;

  const m = Math.max(3, Math.ceil(L / 1.4)), pts = []; let k = 0;
  for (let j = 0; j < m; j++) {
    const l = L * j / (m - 1); while (k < raw.length - 2 && raw[k + 1][2] < l) k++;
    const a = raw[k], b = raw[k + 1], u = (l - a[2]) / Math.max(1e-6, b[2] - a[2]);
    const s = clamp(lerp(a[3], b[3], clamp(u))); pts.push({ x: lerp(a[0], b[0], clamp(u)), y: lerp(a[1], b[1], clamp(u)), s, w: Math.max(0, width(s) || 0) });
  }
  for (let j = 0; j < m; j++) { const a = pts[Math.max(0, j - 2)], b = pts[Math.min(m - 1, j + 2)]; const dx = b.x - a.x, dy = b.y - a.y, dl = Math.hypot(dx, dy) || 1; pts[j].nx = -dy / dl; pts[j].ny = dx / dl; }
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9, maxW = 0;
  for (const p of pts) { x0 = Math.min(x0, p.x - p.w); y0 = Math.min(y0, p.y - p.w); x1 = Math.max(x1, p.x + p.w); y1 = Math.max(y1, p.y + p.w); maxW = Math.max(maxW, p.w); }
  const pad = 14; x0 = Math.floor(x0 - pad); y0 = Math.floor(y0 - pad); x1 = Math.ceil(x1 + pad); y1 = Math.ceil(y1 + pad);
  const c = mk(x1 - x0, y1 - y0), g = c.getContext('2d'); g.translate(-x0, -y0);
  const r = rng(seed * 7919 + 13), nz = makeNoise(seed * 31 + 7);
  const col = a => `rgba(${ink[0]},${ink[1]},${ink[2]},${a})`;
  // body underlayer (solid ink where the brush is still wet)
  const pe = pts[m - 1], gr = g.createLinearGradient(pts[0].x, pts[0].y, pe.x, pe.y);
  gr.addColorStop(0, col(tone * .8)); gr.addColorStop(clamp(dryStart), col(tone * .72)); gr.addColorStop(clamp(dryStart + .32), col(0)); gr.addColorStop(1, col(0));
  g.fillStyle = gr; g.beginPath();
  for (let j = 0; j < m; j++) { const p = pts[j]; g.lineTo(p.x + p.nx * p.w * .42, p.y + p.ny * p.w * .42); }
  for (let j = m - 1; j >= 0; j--) { const p = pts[j]; g.lineTo(p.x - p.nx * p.w * .42, p.y - p.ny * p.w * .42); }
  g.closePath(); g.fill();

  const n = o.bristles ?? clamp(Math.round(maxW / 1.1), 7, 46);
  g.lineCap = 'butt'; g.lineJoin = 'round';
  for (let b = 0; b < n; b++) {
    const FL = 14 + (b % 5) * 5;

    const load = (.62 + .38 * r()) * (.86 + .28 * Math.abs(off));
    g.strokeStyle = col(clamp(tone * load * .72));
    let run = false, cnt = 0, ws = 0;
    const flush = () => { if (cnt > 0) { g.lineWidth = Math.max(.7, ws / cnt / n * 2.3); g.stroke(); } };
    for (let j = 0; j < m; j++) {
      const p = pts[j], s = p.s, ao = Math.abs(off);
      const v = clamp((fbm(nz, b * 3.7, j * 1.4 / 26, 2) - .22) / .56);
      const thr = dryAmt * smooth(dryStart, 1.02, s) * (.5 + .75 * ao) + .5 * Math.pow(ao, 7) + .25 * (1 - smooth(0, .05, s)) * ao;
      const on = v > thr && p.w > .3;
      if (on) {
        const x = p.x + p.nx * off * p.w * .5, y = p.y + p.ny * off * p.w * .5;
        if (!run) { g.beginPath(); g.moveTo(x, y); run = true; cnt = 0; ws = 0; }
        else { g.lineTo(x, y); cnt++; ws += p.w; if (cnt >= FL) { flush(); g.beginPath(); g.moveTo(x, y); cnt = 0; ws = 0; } }
      } else if (run) { flush(); run = false; }
    }
    if (run) flush();
  }
  // ink catches on the paper tooth: peaks lose a little ink
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data, tk = o.tooth ?? .45;
  for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
    const i = (y * c.width + x) * 4; if (!d[i + 3]) continue;
    const h = hpAt(x + x0, y + y0); d[i + 3] *= 1 - tk * clamp((h - .5) * 2.4);
  }
  g.putImageData(im, 0, 0);

  if (o.halo) { halo = mk(c.width, c.height); const hg = halo.getContext('2d'); hg.filter = `blur(${o.halo}px)`; hg.globalAlpha = .75; hg.drawImage(c, 0, 0); hg.drawImage(c, 0, 0); }
  return { cv: c, halo, x0, y0, pts, maxW, t0: o.t0 ?? 0, t1: o.t1 ?? 1, ease: o.ease ?? (u => u), brush: !!o.brush, kind: o.kind || 'stroke', haloA: o.haloA ?? .5 };
}
const SCR = mk(W, H), sctx = SCR.getContext('2d');
function strokeHead(S, u) { const j = Math.min(S.pts.length - 1, Math.floor(u * (S.pts.length - 1))); return S.pts[j]; }
function drawStroke(g, S, t) {
  const u0 = seg(t, S.t0, S.t1); if (u0 <= 0) return;
  const u = S.ease(u0);

// ── watercolor washes: per-pixel arrival map (spreading), pigment density, dried hard edge, granulation ──
function makeWash(o) {
  const idx = [], A = [], D = [], E = [], G = [];
  for (let y = 0; y < HH; y++) {
    const col = o.row ? o.row(y) : null;
    for (let x = 0; x < HW; x++) {
      const r = o.fn(x * 2 + 1, y * 2 + 1, x); if (!r) continue;
      const [dd, ee, aa] = r; if (dd < .003 && ee < .01) continue;
      if (aa >= 1) continue;
      const hp = hpAt(x * 2 + 1, y * 2 + 1);
      idx.push(y * HW + x); D.push(dd); E.push(ee); A.push(clamp(aa, 0, .999));
      G.push((o.gran ?? .25) * dd * (clamp((.62 - hp) * 2.2) + .35 * (N3(x / 1.3, y / 1.3) - .5)));
    }

}
const DR = new Float32Array(HW * HH), DG = new Float32Array(HW * HH), DB = new Float32Array(HW * HH);
function washFrame(list, t, canvas) {
  DR.fill(0); DG.fill(0); DB.fill(0); let any = false;
  for (const w of list) {
    const s = (t - w.t0) / w.dur; if (s <= 0) continue; any = true;
    const u = s >= 1 ? 1 : 1 - (1 - s) * (1 - s);
    const [ar, ag, ab] = w.absorb, fe = w.feather ?? .035, ek = w.edgeK ?? .6, dry = w.dry ?? 1.0, dd0 = w.dryDelay ?? .25;
    const { idx, A, D, E, G } = w;
    for (let k = 0; k < idx.length; k++) {
      const a = A[k]; if (a >= u) continue;
      const ta = w.t0 + w.dur * (1 - Math.sqrt(1 - a));
      const dr = clamp((t - ta - dd0) / dry), f = Math.min(1, (u - a) / fe);
      const d = D[k] * f * (1.18 - .3 * dr) + (E[k] * ek + G[k]) * dr * f;
      const i = idx[k]; DR[i] += d * ar; DG[i] += d * ag; DB[i] += d * ab;
    }
  }
  const g = canvas.getContext('2d');
  if (!canvas._im) canvas._im = g.createImageData(HW, HH);
  const px = canvas._im.data;
  for (let i = 0, j = 0; i < DR.length; i++, j += 4) { px[j] = 255 * Math.exp(-DR[i]); px[j + 1] = 255 * Math.exp(-DG[i]); px[j + 2] = 255 * Math.exp(-DB[i]); px[j + 3] = 255; }
  g.putImageData(canvas._im, 0, 0);

}
const WC1 = mk(HW, HH), WC2 = mk(HW, HH);

// ── timeline ──
const T = {
  brushIn: .15, stalk0: .55, segDur: .2, segGap: .05,
  mist: .9, title: 2.95, sub: 3.35, seal1: 3.62,
  hover: 3.95, dropForm: 4.05, dropFall: 4.3, impact: 4.5, bloomDur: 1.25,
  sun: 4.75, far: 4.95, mid: 5.35, near: 5.8, heron0: 5.35, heron1: 9.7,
  shore0: 7.95, shore1: 8.55, lift: 8.7, seal2: 9.0, fade: 9.35
};
const DROP = [1010, 650];

// ── scene 1 composition ──
let S1 = [], S2 = [], MIST, WASH2 = [];
function buildScene1() {
  // front stalk: 8 segments bottom → top, painted by the visible brush
  const fx = y => 548 + (1120 - y) * .075, J = [1130, 948, 776, 614, 466, 330, 206, 92, -40];
  let t = T.stalk0; const FW = 40;
  for (let i = 0; i < J.length - 1; i++) {
    const yb = J[i] - 5, yt = J[i + 1] + 6, bend = (i % 2 ? 1 : -1) * 3;
    const segW = FW * (1 - i * .025);
    S1.push(makeStroke(s => [fx(lerp(yb, yt, s)) + Math.sin(Math.PI * s) * bend, lerp(yb, yt, s)],
      s => segW * (1.08 - .14 * Math.sin(Math.PI * clamp(s * 1.1)) + .08 * smooth(.86, 1, s) - .1 * (1 - smooth(0, .04, s))),
      { tone: .92 - (i === 0 ? .25 : 0), dryStart: .45, dryAmt: .62, seed: 100 + i, t0: t, t1: t + T.segDur, ease: eInOut, brush: true, kind: 'seg' }));
    t += T.segDur + T.segGap;
  }
  const stalkEnd = t;
  // nodes (quick flat flicks over each joint)
  for (let i = 1; i < J.length - 1; i++) {
    const y = J[i], x = fx(y), w = 30;
    const tt = stalkEnd + .02 + (i - 1) * .045;
    S1.push(makeStroke(s => [x - w + 2 * w * s, y - 1 - 5 * Math.sin(Math.PI * s) + 3 * s], s => 9 * Math.sin(Math.PI * clamp(s * 1.05)) ** .6 + 1.2,
      { tone: .97, dryStart: .7, dryAmt: .5, seed: 200 + i, t0: tt, t1: tt + .09, kind: 'node' }));
  }
  // back stalk (diluted ink, wet halo) grows alongside
  const bx = y => 318 - (1120 - y) * .045, JB = [1120, 900, 700, 520, 360, 220, 90, -40];
  for (let i = 0; i < JB.length - 1; i++) {
    const yb = JB[i] - 5, yt = JB[i + 1] + 6, tt = .95 + i * .2;
    S1.push(makeStroke(s => [bx(lerp(yb, yt, s)), lerp(yb, yt, s)], s => 27 * (1.06 - .12 * Math.sin(Math.PI * s)),
      { tone: .34, dryStart: .55, dryAmt: .5, seed: 300 + i, t0: tt, t1: tt + .19, ease: eInOut, halo: 7, haloA: .45, ink: [52, 56, 66], kind: 'back' }));
    if (i > 0) { const y = JB[i], x = bx(y), tn = tt + .02; S1.push(makeStroke(s => [x - 21 + 42 * s, y - 4 * Math.sin(Math.PI * s)], s => 6.5 * Math.sin(Math.PI * s) ** .6 + 1, { tone: .45, seed: 350 + i, t0: tn, t1: tn + .08, ink: [52, 56, 66], halo: 4, kind: 'node' })); }
  }
  // twigs from the upper front joints
  const twig = (j, dir, len, ang, tt) => { const y = J[j], x = fx(y) + dir * 12; const a = ang;
    const pts = s => [x + Math.cos(a) * len * s + Math.sin(s * 3) * 6, y + Math.sin(a) * len * s - 10 * Math.sin(Math.PI * s)];
    S1.push(makeStroke(pts, s => 6 * (1 - .6 * s) + .8, { tone: .9, dryStart: .5, dryAmt: .5, seed: 400 + j * 3 + dir, t0: tt, t1: tt + .16, kind: 'twig' }));
    return pts(1); };
  const tw1 = twig(4, 1, 250, -.42, 2.35), tw2 = twig(3, 1, 190, -.12, 2.4), tw3 = twig(5, 1, 170, -.95, 2.45);
  // leaves: press → swell → taper to a sharp dry tip

    len *= 1.12; w *= 1.32;
    const nx = Math.cos(ang), ny = Math.sin(ang);
    S1.push(makeStroke(s => { const c = Math.sin(Math.PI * s) * curve * len; return [x + nx * len * s - ny * c, y + ny * len * s + nx * c]; },
      s => w * (s < .3 ? Math.sin(Math.PI * .5 * s / .3) ** .75 : Math.pow((1 - s) / .7, 1.05)) + .4,
      { tone, dryStart: .62, dryAmt: .7, seed: 500 + seed, t0: tt, t1: tt + .15, ease: eOut, ink, halo, haloA: .35, kind: 'leaf' }));
  };

  L(tw1[0], tw1[1], .95, 190, 27, lt, .9, -.1, 2);
  L(tw1[0], tw1[1], -.25, 170, 25, lt, .85, .15, 3);
  L(tw2[0], tw2[1], .7, 230, 31, lt, .95, -.14, 4);
  L(tw2[0], tw2[1], 1.25, 180, 26, lt, .88, .08, 5);
  L(tw3[0], tw3[1], -.2, 180, 24, lt, .92, .16, 6);
  L(tw3[0], tw3[1], .45, 200, 27, lt, .9, -.08, 7);
  L(tw3[0], tw3[1], -.75, 150, 21, lt, .82, .12, 8);
  // pale leaves behind (back stalk)
  const by = JB[4], bxx = bx(by);
  L(bxx - 10, by, Math.PI + .5, 170, 23, lt - .3, .36, -.12, 9, [52, 56, 66], 5);
  L(bxx - 10, by, Math.PI + 1.0, 150, 21, lt - .2, .33, .1, 10, [52, 56, 66], 5);
  L(bxx - 8, JB[5], Math.PI + .25, 160, 21, lt - .1, .34, .14, 11, [52, 56, 66], 5);
  // mist wash across the lower third
  const mtop = x => 800 + 30 * Math.sin(x / 300 + 1) + 70 * (fbm(N2, x / 240, 3.3, 3) - .5);

    m[j + 3] = dd > 0 ? 255 * smooth(0, .012, dd) : 0;
    const ring = dd > -.003 ? .88 * depl * Math.exp(-Math.max(0, dd) / .016) * smooth(-.003, .002, dd) : 0;
    rr[j] = INK[0]; rr[j + 1] = INK[1]; rr[j + 2] = INK[2] + 6; rr[j + 3] = 255 * ring;
  }
  gm.putImageData(MC._im, 0, 0); gr.putImageData(RC._im, 0, 0);
  return u;
}

// ── scene rendering ──
const L1 = mk(W, H), l1 = L1.getContext('2d'), B2 = mk(W, H), b2 = B2.getContext('2d');
let SEAL, SEAL2;
function scene1(g, t) {
  g.drawImage(PAPERCV, 0, 0);
  if (washFrame([MIST], t, WC1)) { g.save(); g.globalCompositeOperation = 'multiply'; g.imageSmoothingQuality = 'high'; g.drawImage(WC1, 0, 0, W, H); g.restore(); }
  l1.clearRect(0, 0, W, H);
  for (const S of S1) drawStroke(l1, S, t);
  // stalk bases dissolve into the mist
  l1.save(); l1.globalCompositeOperation = 'destination-out'; const fg = l1.createLinearGradient(0, 860, 0, 1080);
  fg.addColorStop(0, 'rgba(0,0,0,0)'); fg.addColorStop(.55, 'rgba(0,0,0,.55)'); fg.addColorStop(1, 'rgba(0,0,0,.93)'); l1.fillStyle = fg; l1.fillRect(0, 860, W, 220); l1.restore();
  g.drawImage(L1, 0, 0);
  drawTitle(g, t);
  drawSeal(g, SEAL, 1768, 452, t, T.seal1);
  // splatter from the drop impact
  if (t >= T.impact) { g.fillStyle = `rgb(${INK})`; for (const [x, y, r] of SPLAT) { const k = eOut(seg(t, T.impact, T.impact + .08)); g.beginPath(); g.ellipse(x, y, r * k, r * .8 * k, 0, 0, TAU); g.fill(); } }
}
function scene2(g, t) {
  g.drawImage(PAPERCV, 0, 0);
  const z = 1 + .022 * eInOut(seg(t, T.impact, DUR));
  g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  if (washFrame(WASH2, t, WC2)) { g.save(); g.globalCompositeOperation = 'multiply'; g.imageSmoothingQuality = 'high'; g.drawImage(WC2, 0, 0, W, H); g.restore(); }
  for (const S of S2) if (S.kind !== 'shore' && S.kind !== 'ripple') drawStroke(g, S, t);
  if (t > T.heron0 && t < T.heron1) { const [x, y] = heronPos(t); drawHeron(g, x, y, t, 1); }
  for (const S of S2) if (S.kind === 'shore' || S.kind === 'ripple') drawStroke(g, S, t);
  g.restore();
  drawSeal(g, SEAL2, 1768, 900, t, T.seal2);
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (t < T.impact) scene1(ctx, t);
  else {
    const s = seg(t, T.impact, T.impact + T.bloomDur);
    if (s < 1) {
      scene1(ctx, t); const u = bloomFrame(t);
      b2.setTransform(1, 0, 0, 1, 0, 0); b2.globalCompositeOperation = 'source-over'; scene2(b2, t);
      b2.globalCompositeOperation = 'destination-in'; b2.imageSmoothingQuality = 'high'; b2.drawImage(MC, 0, 0, W, H); b2.globalCompositeOperation = 'source-over';
      ctx.drawImage(B2, 0, 0); ctx.imageSmoothingQuality = 'high'; ctx.drawImage(RC, 0, 0, W, H);
    } else scene2(ctx, t);
  }
  // falling drop (from the brush tip to the paper)
  if (t >= T.dropForm && t < T.impact) {
    const tip = [DROP[0] - 190 * .08, DROP[1] - 190 * .62];
    let x = tip[0], y = tip[1], r = 11 * eOut(seg(t, T.dropForm, T.dropFall)), st = 1;
    if (t >= T.dropFall) { const u = eIn(seg(t, T.dropFall, T.impact)); x = lerp(tip[0], DROP[0], u); y = lerp(tip[1], DROP[1], u); r = 11; st = 1 + .5 * u; }
    const sa = .25 * seg(t, T.dropFall, T.impact); ctx.fillStyle = `rgba(40,34,30,${sa})`; ctx.beginPath(); ctx.ellipse(DROP[0] + 6, DROP[1] + 3, 9, 6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = `rgb(${INK})`; ctx.beginPath(); ctx.ellipse(x, y, r * .82, r * st, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(x - r * .3, y - r * .35, r * .18, r * .25, 0, 0, TAU); ctx.fill();
  }
  // the brush
  const b = brushAt(t); drawBrush(ctx, b.x, b.y, b.h, b.press);
  // settle: the painting recedes into the paper
  const f = eInOut(seg(t, T.fade, DUR));
  if (f > 0) { ctx.globalAlpha = f; ctx.drawImage(PAPERCV, 0, 0); ctx.globalAlpha = 1; }
}

window.ready = (async () => {
  await Promise.all([`italic 500 176px ${TITLE}`, `300 25px ${SANS}`].map(f => document.fonts.load(f, 'Stillness A STUDY IN INK AND WATER')));
  await document.fonts.ready;
  buildPaper(); buildScene1(); buildScene2(); buildTitle(); buildBloom(); buildBrush();
  SEAL = buildSeal(92, 5); SEAL2 = buildSeal(70, 6);
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [];
  for (const S of [...S1, ...S2]) {
    const d = S.t1 - S.t0;
    if (S.kind === 'seg' || S.kind === 'shore' || S.kind === 'ridge') ev.push({ t: S.t0, k: 'swish', d, v: S.kind === 'ridge' ? .6 : 1 });
    else if (S.kind === 'back' || S.kind === 'ripple') ev.push({ t: S.t0, k: 'swish', d, v: .35 });
    else ev.push({ t: S.t0, k: 'flick', d, v: S.kind === 'leaf' ? .8 : .5 });
  }
  ev.push({ t: T.mist, k: 'wet', d: 1.8 }, { t: T.far, k: 'wet', d: 1.4 }, { t: T.near, k: 'wet', d: 1.3 });
  ev.push({ t: T.title, k: 'pluck', n: 69 }, { t: T.title + .2, k: 'pluck', n: 76 }, { t: T.seal1, k: 'seal' }, { t: T.seal2, k: 'seal' });
  ev.push({ t: T.impact, k: 'drop' }, { t: T.impact, k: 'pluck', n: 64 }, { t: T.impact + .3, k: 'pluck', n: 71 });
  ev.push({ t: T.lift, k: 'air', d: .8 }, { t: T.seal2 + .05, k: 'pluck', n: 62 }, { t: T.seal2 + .25, k: 'pluck', n: 69 }, { t: T.seal2 + .45, k: 'pluck', n: 74 });
  for (let tt = T.heron0 + .5; tt < T.heron1; tt += 1.05) if (tt > T.impact + .8) ev.push({ t: tt, k: 'wing', pan: clamp(heronPos(tt)[0] / W * 2 - 1, -1, 1) });
  return ev.sort((a, b) => a.t - b.t);
};
</script>
