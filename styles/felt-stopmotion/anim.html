<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── felt-stopmotion · needle-felt wool diorama shot at 12 fps ─────────────────────────────────────
// A felt sheep and a felt bird build a tiny nest on a felt hillside: the bird flies in twigs of brown
// yarn, the sheep plucks tufts of its own wool for the lining → a cotton-wool rain cloud drifts over,
// the sheep leans its head over the nest like an umbrella → the cloud passes, a felt sun pops out and
// a rainbow of twisted yarn is laid across the sky → the bird hops onto the sheep's back and the felt
// title "Woolly Weather" pops in. Everything moves on held 12 fps steps; stray fibres boil per step
// (3 pre-baked fuzz variants per piece). Everything is drawn from t alone (seeded RNG, precomputed felt).
const W = 1920, H = 1080, DUR = 10.0, FPS = 12;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const backOut = (u, c = 1.70158) => u <= 0 ? 0 : u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hstr = s => { let h = 2166136261; for (const ch of s) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const tint = ([r, g, b], k, a = 1) => { const f = v => Math.round(clamp(k >= 1 ? v + (255 - v) * (k - 1) : v * k, 0, 255)); return `rgba(${f(r)},${f(g)},${f(b)},${a})`; };
const shade = (h, k, a = 1) => tint(rgb(h), k, a);
// keyframes: [[t, v0, v1, ...], ...] → values at t
function kf(t, keys, ease = eInOut) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const a = keys[i - 1], b = keys[i], u = ease((t - a[0]) / (b[0] - a[0] || 1));
    return a.slice(1).map((v, j) => lerp(v, b[j + 1], u));
  }
  return keys[keys.length - 1].slice(1);
}
const FONT = 'Fredoka';
let STEP = 0;  // current 12 fps step: drives the fibre boil

// ── palette ──
const C = {
  sky: '#a9d5e8', far: '#9dc48f', mid: '#79b066', front: '#a9c95b', pond: '#5c9fc9',
  wool: '#f4eee0', woolDark: '#d9cfbb', face: '#3d3734', ear: '#4a4240', pink: '#e79aa3',
  bird: '#e8713c', birdDark: '#b9512a', belly: '#f6dfb8', beak: '#f2b53b',
  twig: ['#94653a', '#7b5130', '#ad7d4a', '#86603e'], nest: '#8a5b36', cavity: '#43291a',
  cloud: '#e3e5ec', drop: '#5d9fd8', sun: '#f6c845', ray: '#ef9b34', tree: '#4f8a49', trunk: '#7a5232',
  yarnDark: '#4b2f22', tag: '#f6efdf',
  rainbow: ['#d94b3b', '#ec8a33', '#f2c84c', '#6cb35b', '#4a8fd1', '#8a60b8'],
};

// ── felt material: a tileable fibre texture per colour ──
const TILES = {};
function feltTile(color) {
  if (TILES[color]) return TILES[color];
  const S = 256, c = mk(S, S), x = c.getContext('2d'), r = rng(hstr(color)), base = rgb(color);
  x.fillStyle = color; x.fillRect(0, 0, S, S);
  const wrap = (px, py, ext, fn) => { for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
    if (px + ox < -ext || px + ox > S + ext || py + oy < -ext || py + oy > S + ext) continue; fn(px + ox, py + oy); } };
  for (let i = 0; i < 70; i++) {  // soft mottling of denser / thinner felt
    const px = r() * S, py = r() * S, rad = 12 + r() * 46, k = r() < .5 ? .9 : 1.08;
    wrap(px, py, rad, (X, Y) => { const g = x.createRadialGradient(X, Y, 0, X, Y, rad); g.addColorStop(0, tint(base, k, .4)); g.addColorStop(1, tint(base, k, 0)); x.fillStyle = g; x.fillRect(X - rad, Y - rad, rad * 2, rad * 2); });
  }
  x.lineCap = 'round';
  for (let i = 0; i < 3000; i++) {  // matted fibres
    const px = r() * S, py = r() * S, a = r() * Math.PI * 2, l = 4 + r() * 15, b = (r() - .5) * l * .7;
    x.strokeStyle = tint(base, .76 + r() * .52, .18 + r() * .26); x.lineWidth = .5 + r() * .9;
    wrap(px, py, l, (X, Y) => { const ex = X + Math.cos(a) * l, ey = Y + Math.sin(a) * l;
      x.beginPath(); x.moveTo(X, Y); x.quadraticCurveTo((X + ex) / 2 - Math.sin(a) * b, (Y + ey) / 2 + Math.cos(a) * b, ex, ey); x.stroke(); });
  }
  for (let i = 0; i < 500; i++) { x.fillStyle = tint(base, r() < .5 ? .7 : 1.3, .25); x.fillRect(r() * S, r() * S, 1.2, 1.2); }
  return TILES[color] = c;
}
const pat = (x, color) => x.createPattern(feltTile(color), 'repeat');

// ── felt piece: mask → felt texture → soft matte shading → fuzzy fibre edge (3 boil variants) ──
let SPR_ID = 0;
function makeFelt(w, h, mask, o = {}) {
  const fz = o.fuzz ?? 8, pad = Math.ceil(fz * 2.8 + 8), CW = Math.ceil(w + 2 * pad), CH = Math.ceil(h + 2 * pad);
  const m = mk(CW, CH), mx = m.getContext('2d'); mx.translate(pad, pad); mx.fillStyle = '#fff'; mx.strokeStyle = '#fff'; mask(mx);
  const base = mk(CW, CH), bx = base.getContext('2d');
  bx.fillStyle = pat(bx, o.color); bx.fillRect(0, 0, CW, CH);
  if (o.detail) { bx.save(); bx.translate(pad, pad); o.detail(bx); bx.restore(); }
  bx.globalCompositeOperation = 'destination-in'; bx.drawImage(m, 0, 0);
  bx.globalCompositeOperation = 'source-atop';
  const sr = o.shadeR ?? clamp(Math.min(w, h) * .14, 5, 40);
  const sh = mk(CW, CH), sx = sh.getContext('2d');
  sx.fillStyle = 'rgb(34,20,12)'; sx.fillRect(0, 0, CW, CH); sx.globalCompositeOperation = 'destination-out';
  sx.filter = `blur(${sr}px)`; sx.drawImage(m, -sr * .35, -sr * .5);
  bx.globalAlpha = o.shade ?? .5; bx.drawImage(sh, 0, 0); bx.globalAlpha = 1;
  if ((o.hi ?? .16) > 0) {
    const g = bx.createRadialGradient(pad + w * .32, pad + h * .26, 0, pad + w * .4, pad + h * .4, Math.max(w, h) * .75);
    g.addColorStop(0, `rgba(255,250,238,${o.hi ?? .16})`); g.addColorStop(1, 'rgba(255,250,238,0)'); bx.fillStyle = g; bx.fillRect(0, 0, CW, CH);
  }
  bx.globalCompositeOperation = 'source-over';
  // edge points with outward normals, and the colour just inside each one
  const md = mx.getImageData(0, 0, CW, CH).data, bd = bx.getImageData(0, 0, CW, CH).data;
  const A = (x, y) => (x < 0 || y < 0 || x >= CW || y >= CH) ? 0 : md[(y * CW + x) * 4 + 3];
  const E = [];
  for (let y = 2; y < CH - 2; y += 2) for (let x = 2; x < CW - 2; x += 2) {
    if (A(x, y) < 128 || !(A(x - 2, y) < 128 || A(x + 2, y) < 128 || A(x, y - 2) < 128 || A(x, y + 2) < 128)) continue;
    const nx = A(x - 3, y) - A(x + 3, y), ny = A(x, y - 3) - A(x, y + 3), l = Math.hypot(nx, ny) || 1;
    const ix = clamp(Math.round(x - nx / l * 3), 0, CW - 1), iy = clamp(Math.round(y - ny / l * 3), 0, CH - 1), ci = (iy * CW + ix) * 4;
    E.push([x, y, nx / l, ny / l, [bd[ci], bd[ci + 1], bd[ci + 2]]]);
  }
  const out = [], nV = o.variants ?? 3;
  for (let v = 0; v < nV; v++) {
    const c = mk(CW, CH), x = c.getContext('2d'); x.drawImage(base, 0, 0); x.lineCap = 'round';
    const r = rng((o.seed ?? 7) * 977 + v * 131 + SPR_ID * 17);
    const fibre = (e, l, spread, curl, alpha, lw, k) => {
      const a = Math.atan2(e[3], e[2]) + (r() - .5) * spread, sx0 = e[0] - e[2] * 2.5, sy0 = e[1] - e[3] * 2.5;
      const ex = sx0 + Math.cos(a) * l, ey = sy0 + Math.sin(a) * l, b = (r() - .5) * l * curl;
      x.strokeStyle = tint(e[4], k, alpha); x.lineWidth = lw;
      x.beginPath(); x.moveTo(sx0, sy0); x.quadraticCurveTo((sx0 + ex) / 2 - Math.sin(a) * b, (sy0 + ey) / 2 + Math.cos(a) * b, ex, ey); x.stroke();
    };
    if (E.length) {
      const n = Math.round(E.length * (o.density ?? .7));
      for (let i = 0; i < n; i++) fibre(E[(r() * E.length) | 0], fz * (.3 + r() * .9), 1.8, .8, .4 + r() * .45, .5 + r() * .8, .82 + r() * .4);
      const ns = o.stray ?? Math.max(2, Math.round(E.length / 120));
      for (let i = 0; i < ns; i++) fibre(E[(r() * E.length) | 0], fz * (1.6 + r() * 1.8), 1.2, 1.6, .45 + r() * .3, .5 + r() * .5, .85 + r() * .35);
    }
    const nsurf = o.surf ?? Math.round(w * h / 700);
    for (let i = 0; i < nsurf; i++) {  // loose fibres lying on the surface
      const px = (r() * CW) | 0, py = (r() * CH) | 0; if (A(px, py) < 250) continue;
      const ci = (py * CW + px) * 4, a = r() * Math.PI * 2, l = 4 + r() * 9;
      x.strokeStyle = tint([bd[ci], bd[ci + 1], bd[ci + 2]], r() < .5 ? .8 : 1.22, .5); x.lineWidth = .6 + r() * .6;
      x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 1) * l * .5, py + Math.sin(a + 1) * l * .5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
    }
    out.push(c);
  }
  const s = { c: out, pad, w, h, id: SPR_ID++, mask: m };
  if (o.shadow) { const b = o.shadow, c = mk(CW + b * 4, CH + b * 4), x = c.getContext('2d');
    x.filter = `blur(${b}px)`; x.drawImage(m, b * 2, b * 2); x.filter = 'none'; x.globalCompositeOperation = 'source-in'; x.fillStyle = 'rgb(30,20,14)'; x.fillRect(0, 0, c.width, c.height);
    s.sh = c; s.shb = b * 2; }
  return s;
}
// draw a piece with its box point (ax, ay) at (x, y)
function put(x, s, X, Y, ax = s.w / 2, ay = s.h / 2, sc = 1, rot = 0, alpha = 1) {
  const v = s.c[(STEP + s.id) % s.c.length];
  x.save(); x.translate(X, Y); if (rot) x.rotate(rot); if (sc !== 1) x.scale(sc, sc); if (alpha < 1) x.globalAlpha = alpha;
  x.drawImage(v, -ax - s.pad, -ay - s.pad); x.restore();
}
function putShadow(x, s, X, Y, ax, ay, sc, rot, dx, dy, a) {
  x.save(); x.translate(X + dx, Y + dy); if (rot) x.rotate(rot); if (sc !== 1) x.scale(sc, sc); x.globalAlpha = a;
  x.drawImage(s.sh, -ax - s.pad - s.shb, -ay - s.pad - s.shb); x.restore();
}

// ── yarn: a twisted ply strand along a polyline (diagonal twist bands + boiling hairs) ──
function walk(pts, sp, cb) {
  let acc = sp * .5;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], L = Math.hypot(x1 - x0, y1 - y0); if (!L) continue;
    const tx = (x1 - x0) / L, ty = (y1 - y0) / L;
    while (acc <= L) { cb(x0 + tx * acc, y0 + ty * acc, tx, ty); acc += sp; }
    acc -= L;
  }
}
function yarn(x, pts, w, col, seed, o = {}) {
  if (pts.length < 2) return;
  const base = rgb(col), path = () => { x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]); };
  x.save(); x.lineCap = 'round'; x.lineJoin = 'round';
  if (o.shadow !== false) { x.save(); x.translate(w * .2 + 1, w * .35 + 1.5); path(); x.strokeStyle = 'rgba(30,18,10,.26)'; x.lineWidth = w * 1.08; x.stroke(); x.restore(); }
  path(); x.strokeStyle = col; x.lineWidth = w; x.stroke();
  const dk = new Path2D(), lt = new Path2D(), sp = Math.max(3, w * .62);
  walk(pts, sp, (px, py, tx, ty) => { const nx = -ty, ny = tx;
    dk.moveTo(px + nx * w * .44 - tx * w * .24, py + ny * w * .44 - ty * w * .24); dk.lineTo(px - nx * w * .44 + tx * w * .24, py - ny * w * .44 + ty * w * .24);
    const qx = px + tx * sp * .45, qy = py + ty * sp * .45;
    lt.moveTo(qx + nx * w * .32 - tx * w * .14, qy + ny * w * .32 - ty * w * .14); lt.lineTo(qx - nx * w * .02 + tx * w * .02, qy - ny * w * .02 + ty * w * .02); });
  x.lineCap = 'butt'; x.strokeStyle = tint(base, .7, .75); x.lineWidth = Math.max(1, w * .17); x.stroke(dk);
  x.strokeStyle = tint(base, 1.3, .5); x.lineWidth = Math.max(.8, w * .12); x.stroke(lt);
  // hairs: re-seeded every step so they boil
  const r = rng(seed * 31 + (o.still ? 0 : STEP) * 7 + 3), hp = new Path2D(); x.lineCap = 'round';
  walk(pts, o.hairEvery ?? Math.max(6, w * 1.2), (px, py, tx, ty) => { if (r() < .35) return;
    const sd = r() < .5 ? -1 : 1, nx = -ty * sd, ny = tx * sd, l = w * (.25 + r() * .6) + 1.5, a = (r() - .5) * 1.2;
    const sx0 = px + nx * w * .4, sy0 = py + ny * w * .4, dx = nx * Math.cos(a) - ny * Math.sin(a), dy = nx * Math.sin(a) + ny * Math.cos(a);
    hp.moveTo(sx0, sy0); hp.quadraticCurveTo(sx0 + dx * l * .5 + tx * l * .4, sy0 + dy * l * .5 + ty * l * .4, sx0 + dx * l, sy0 + dy * l); });
  x.strokeStyle = tint(base, 1.1, .55); x.lineWidth = .8; x.stroke(hp);
  x.restore();
}
const ellPts = (cx, cy, rx, ry, a0, a1, n = 60, wob = 0, ph = 0) => Array.from({ length: n + 1 }, (_, i) => {
  const a = lerp(a0, a1, i / n), k = 1 + wob * Math.sin(a * 5 + ph); return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]; });
// partial polyline (first fraction u of its length)
function partial(pts, u) {
  if (u >= 1) return pts; if (u <= 0) return [];
  let tot = 0; const L = [0]; for (let i = 1; i < pts.length; i++) { tot += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); L.push(tot); }
  const tgt = tot * u, out = [pts[0]];
  for (let i = 1; i < pts.length; i++) { if (L[i] <= tgt) { out.push(pts[i]); continue; }
    const f = (tgt - L[i - 1]) / (L[i] - L[i - 1]); out.push([lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)]); break; }
  return out;
}

// ── shapes ──
function bumpy(x, cx, cy, rx, ry, n, amp, ph = 0) {
  x.beginPath();
  for (let i = 0; i <= 240; i++) { const a = i / 240 * Math.PI * 2, k = 1 - amp + amp * 2 * Math.pow(Math.abs(Math.sin(a * n / 2 + ph)), .55);
    const px = cx + Math.cos(a) * rx * k, py = cy + Math.sin(a) * ry * k; i ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.closePath(); x.fill();
}
const ell = (x, cx, cy, rx, ry, rot = 0) => { x.beginPath(); x.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); x.fill(); };
function curls(x, cx, cy, rx, ry, n, col, seed, lw = 3) {  // wool curls stitched on a fleece
  const r = rng(seed); x.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()) * .82, px = cx + Math.cos(a) * rx * d, py = cy + Math.sin(a) * ry * d, rr = 7 + r() * 8, a0 = r() * 6;
    x.beginPath(); for (let k = 0; k <= 26; k++) { const q = a0 + k / 26 * Math.PI * 3.2, rad = rr * (1 - k / 34); const X = px + Math.cos(q) * rad, Y = py + Math.sin(q) * rad * .85; k ? x.lineTo(X, Y) : x.moveTo(X, Y); }
    x.strokeStyle = r() < .6 ? shade(col, .84, .55) : shade(col, 1.12, .7); x.lineWidth = lw; x.stroke();
  }

// ── scene constants ──
const GY = 852, SX = 720, NX = 1035, NY = 812;          // sheep ground line & x, nest centre
const PIV = [SX + 115, GY - 195];                         // sheep neck pivot
const RIM = [NX + 82, NY - 60], NESTIN = [NX + 4, NY - 14], BACK = [SX - 10, GY - 312];
const farY = x => 598 - 44 * Math.sin(x / 420 + 2) - 20 * Math.sin(x / 150 + .4);
const midY = x => 706 - 58 * Math.sin(x / 330 + .3) - 14 * Math.sin(x / 97);
const frontY = x => 778 + 16 * Math.sin(x / 210 + .5) + 36 * Math.pow((x - 1000) / 1000, 2);
const POND = [1520, 962, 270, 70];
const RB = [980, 985, 610, 27];                           // rainbow centre, outer radius, strand pitch
const SUN = [1738, 318, 60];

let SKY = [], LAND = [], VIG, SP = {}, TITLE = {};

function buildPieces() {
  const tw = (w, h, fn, o) => makeFelt(w, h, fn, o);
  SP.body = tw(316, 214, x => bumpy(x, 158, 107, 158, 107, 13, .07), { color: C.wool, fuzz: 11, density: .9, shade: .42, shadeR: 30,
    detail: x => curls(x, 158, 107, 150, 98, 26, C.wool, 11) });
  SP.collar = tw(118, 104, x => bumpy(x, 59, 52, 59, 52, 8, .09, 1), { color: C.wool, fuzz: 10, density: .9, detail: x => curls(x, 59, 52, 50, 44, 5, C.wool, 12) });
  SP.tail = tw(56, 50, x => bumpy(x, 28, 25, 28, 25, 6, .1), { color: C.wool, fuzz: 9, detail: x => curls(x, 28, 25, 22, 20, 2, C.wool, 13) });
  SP.tuft = tw(58, 50, x => bumpy(x, 29, 25, 29, 25, 7, .12, .5), { color: C.wool, fuzz: 10, density: 1, detail: x => curls(x, 29, 25, 22, 18, 2, C.wool, 14, 2.5) });
  SP.headTuft = tw(78, 46, x => bumpy(x, 39, 23, 39, 23, 7, .12), { color: C.wool, fuzz: 9, detail: x => curls(x, 39, 23, 30, 16, 3, C.wool, 15, 2.5) });
  SP.head = tw(104, 124, x => { x.beginPath(); x.moveTo(52, 0); x.bezierCurveTo(98, 0, 106, 52, 96, 82); x.bezierCurveTo(86, 114, 70, 124, 52, 124);
    x.bezierCurveTo(34, 124, 18, 114, 8, 82); x.bezierCurveTo(-2, 52, 6, 0, 52, 0); x.fill(); },
    { color: C.face, fuzz: 6, shade: .55, hi: .2, detail: x => {
      x.fillStyle = pat(x, '#57504c'); ell(x, 52, 96, 34, 24);
      x.fillStyle = 'rgba(25,18,16,.85)'; ell(x, 40, 92, 4.5, 3.2, -.4); ell(x, 64, 92, 4.5, 3.2, .4);
      x.strokeStyle = C.pink; x.lineWidth = 3.2; x.lineCap = 'round'; x.beginPath(); x.moveTo(42, 104); x.quadraticCurveTo(47, 110, 52, 104); x.quadraticCurveTo(57, 110, 62, 104); x.stroke(); } });
  SP.ear = tw(64, 30, x => { x.beginPath(); x.moveTo(0, 15); x.quadraticCurveTo(26, -4, 64, 12); x.quadraticCurveTo(30, 34, 0, 15); x.fill(); },
    { color: C.ear, fuzz: 5, detail: x => { x.fillStyle = pat(x, C.pink); x.beginPath(); x.moveTo(14, 15); x.quadraticCurveTo(32, 6, 54, 13); x.quadraticCurveTo(32, 23, 14, 15); x.fill(); } });
  SP.eye = tw(26, 28, x => ell(x, 13, 14, 13, 14), { color: '#faf6ec', fuzz: 3, shade: .3, hi: 0 });
  SP.leg = tw(36, 96, x => { x.beginPath(); x.roundRect(0, 0, 36, 96, 17); x.fill(); }, { color: C.face, fuzz: 5, shade: .45 });
  SP.legFar = tw(36, 92, x => { x.beginPath(); x.roundRect(0, 0, 36, 92, 17); x.fill(); }, { color: '#2c2725', fuzz: 5, shade: .45 });
  // bird (drawn facing left)
  SP.bBody = tw(116, 96, x => { x.beginPath(); x.moveTo(40, 2); x.bezierCurveTo(78, -4, 112, 30, 116, 52); x.bezierCurveTo(106, 84, 74, 96, 50, 94);

const bez = (p0, c, p1, u) => [lerp(lerp(p0[0], c[0], u), lerp(c[0], p1[0], u), u), lerp(lerp(p0[1], c[1], u), lerp(c[1], p1[1], u), u)];

function birdState(t) {

  const fly = (p) => Object.assign(s, { x: p[0], y: p[1], wing: flap, legs: false });

  if (t < 1.25) { fly(bez([2140, 250], [1520, 120], RIM, eInOut(seg(t, .35, 1.25)))); s.carry = true; return s; }
  if (t < 1.75) { Object.assign(s, { x: RIM[0], y: RIM[1] }); s.squash = t < 1.34 ? 1 : 0; s.carry = t < DROP1; if (t >= DROP1 - .09 && t < DROP1 + .1) { s.y += 7; s.tip = .35; } return s; }

  if (t < 2.95) { fly(bez([2150, 300], [1560, 170], RIM, eOut(seg(t, 2.3, 2.95)))); s.carry = true; return s; }
  if (t < 3.5) { Object.assign(s, { x: RIM[0], y: RIM[1] }); s.squash = t < 3.04 ? 1 : 0; s.carry = t < DROP2; if (t >= DROP2 - .09 && t < DROP2 + .1) { s.y += 7; s.tip = .35; } return s; }

const cloudX = t => kf(t, [[T.cloudIn, -360], [4.55, 760], [5.7, 900], [6.6, 2260]], eInOut)[0];

function drawSheep(x, t) {

  if (s.tip) x.rotate(-s.tip);
  if (s.squash) x.scale(1.08, .9), x.translate(0, 5);
  if (s.legs && !s.inNest) { for (const lx of [-6, 12]) yarn(x, [[lx, 36], [lx - 3, 58], [lx - 12, 60]], 4, '#a5562e', 70 + lx, { shadow: false }); }
  put(x, SP.tailF, 46, -6, 4, 23, 1, -.35);
  put(x, SP.bBody, 0, 0, 58, 48);
  put(x, SP.beak, -56, -8, 30, 11);
  if (s.carry) { yarn(x, [[-62, -4], [-84, 2], [-112, 14]], 6, C.twig[1], 90); yarn(x, [[-84, 2], [-98, -12]], 4.5, C.twig[2], 91, { shadow: false }); }
  x.fillStyle = '#17110f'; ell(x, -26 + s.look[0], -18 + s.look[1], 6.5, 7); x.fillStyle = 'rgba(255,255,255,.9)'; ell(x, -28 + s.look[0], -21 + s.look[1], 2.2, 2.2);
  put(x, SP.wing, 4, -6, 6, 14, 1, s.wing);
  x.restore();
}

function drawNest(x, t, phase, bird) {
  const strand = (st, j) => { const t0 = strandT(j); if (t < t0) return; const dy = -36 * (1 - seg(t, t0, t0 + 2 / FPS));
    x.save(); x.translate(NX, NY + dy); yarn(x, st.pts, st.w, st.col, st.seed); x.restore(); };
  if (phase === 'back') {
    put(x, SP.cavity, NX, NY + 4, 97, 20);
    STRANDS.forEach((st, j) => st.back && strand(st, j));
    for (const tf of TUFTS) if (t >= tf.rel) { const u = seg(t, tf.rel, tf.rel + 2 / FPS); put(x, SP.tuft, tf.slot[0], lerp(tf.slot[1] - 40, tf.slot[1], u), 29, 25, .95); }
  } else {
    put(x, SP.bowl, NX, NY, 107, 4);
    STRANDS.forEach((st, j) => !st.back && strand(st, j));
  }
}

function drawRainbow(x, t) {
  RB_PTS.forEach((pts, i) => {
    const u = eInOut(seg(t, T.rb0 + i * .08, T.rb0 + i * .08 + .95)); if (u <= 0) return;
    yarn(x, partial(pts, u), RB[3] - 1, C.rainbow[i], 600 + i);
  });
}
const RB_PTS = C.rainbow.map((_, i) => ellPts(RB[0], RB[1], RB[2] - i * RB[3], RB[2] - i * RB[3], Math.PI, Math.PI * 2, 120, .004, i));

function drawSun(x, t) {
  const u = seg(t, T.sun, T.sun + .42); if (u <= 0) return;
  const sc = backOut(u, 2.2), rot = STEP * .03;
  x.save(); x.translate(SUN[0], SUN[1]); x.scale(sc, sc);
  for (let i = 0; i < 12; i++) { const a = rot + i / 12 * Math.PI * 2; yarn(x, [[Math.cos(a) * 76, Math.sin(a) * 76], [Math.cos(a) * 104, Math.sin(a) * 104]], 9, C.ray, 700 + i); }
  put(x, SP.sun, 0, 0, SUN[2], SUN[2]);
  x.restore();
}

function drawRain(x, t) {
  for (const d of DROPS) {
    if (t < d.t0) continue;
    const y0 = CLOUD_Y + 200, yEnd = landY(d), tEnd = d.t0 + (yEnd - y0) / d.vy;
    if (t < tEnd) { put(x, SP.drop, d.x, y0 + (t - d.t0) * d.vy, 8, 26, 1.1 + d.k * .35); continue; }
    const age = t - tEnd;
    if (inPond(d.x, yEnd)) { if (age < .5) { const rr = 10 + age * 110; x.save(); x.globalAlpha = 1 - age / .5;
      yarn(x, ellPts(d.x, yEnd, rr, rr * .26, 0, Math.PI * 2, 30), 3.5, '#b6dcef', 900 + (d.k * 99 | 0), { shadow: false }); x.restore(); } }
    else if (age < 2 / FPS) { x.fillStyle = shade(C.drop, 1.2, .9); for (const s of [-1, 1]) ell(x, d.x + s * (6 + age * 90), yEnd - 6 - age * 40, 3.5, 3.5); }
  }
}

function drawTitle(x, t) {
  const pop = (it, t0, rot) => {
    const u = seg(t, t0, t0 + .5); if (u <= 0) return;
    const sc = Math.min(1.08, backOut(u, 1.2)), r = (1 - eOut(u)) * rot;
    putShadow(x, it.sp, it.cx, it.cy, it.w / 2, it.h / 2, sc, r, 7, 10, .38);
    put(x, it.sp, it.cx, it.cy, it.w / 2, it.h / 2, sc, r);
  };
  pop(TITLE.words[0], T.w1, -.12); pop(TITLE.words[1], T.w2, .1); pop(TITLE.tag, T.tag, -.06);
}

let lastStep = -1;
function render(t) {
  const tq = Math.floor(t * FPS + 1e-6) / FPS, step = Math.round(tq * FPS);
  if (step === lastStep) return; lastStep = step; STEP = step;
  const x = ctx, bv = (step >> 1) % 3;   // set pieces boil every other step, characters every step
  x.save();
  const jx = (rng(step * 13 + 1)() - .5) * 2, jy = (rng(step * 17 + 2)() - .5) * 2;  // the camera nudged between exposures
  x.translate(jx, jy);
  x.drawImage(SKY[bv], -2, -2, W + 4, H + 4);
  drawSun(x, tq); drawRainbow(x, tq);
  x.drawImage(LAND[bv], 0, 0);
  const bird = birdState(tq);
  drawNest(x, tq, 'back', bird);
  if (bird.inNest) drawBird(x, bird);
  drawNest(x, tq, 'front', bird);
  const head = drawSheep(x, tq);
  // tufts carried in the sheep's mouth
  for (const tf of TUFTS) if (tq >= tf.grab && tq < tf.rel) { const [mx, my] = mouthOf(head); put(x, SP.tuft, mx, my, 29, 18, .95, head.tilt); }
  // shake-off droplets
  if (tq > SHAKE[0] && tq < SHAKE[1]) { const r = rng(step * 7 + 5); x.fillStyle = shade(C.drop, 1.1, .9);
    for (let i = 0; i < 10; i++) { const a = -Math.PI * (.1 + r() * .8), d = 170 + r() * 70 + (tq - SHAKE[0]) * 160; ell(x, SX + Math.cos(a) * d, GY - 150 + Math.sin(a) * d * .7, 4.5, 6); } }
  if (!bird.inNest) drawBird(x, bird);
  // the cloud dims the set as it passes in front of the lamp
  const dim = seg(tq, 3.8, 4.55) - seg(tq, 5.65, 6.35);
  if (dim > 0) { x.fillStyle = `rgba(38,50,82,${.3 * dim})`; x.fillRect(-4, -4, W + 8, H + 8); }
  const cx = cloudX(tq); if (cx > -340 && cx < 2240) { putShadow(x, SP.cloud, cx, CLOUD_Y, 0, 0, 1, 0, 14, 22, .2); put(x, SP.cloud, cx, CLOUD_Y, 0, 0); }
  drawRain(x, tq);
  drawTitle(x, tq);
  x.restore();
  // exposure flicker, vignette, fades (all on the held steps)
  const fl = rng(step * 29 + 9)(); x.fillStyle = fl < .5 ? `rgba(0,0,0,${fl * .05})` : `rgba(255,240,215,${(fl - .5) * .04})`; x.fillRect(0, 0, W, H);
  x.drawImage(VIG, 0, 0);
  const fade = Math.max(1 - seg(tq, 0, T.fadeIn), seg(tq, T.fade0, T.fade1));
  if (fade > 0) { x.fillStyle = `rgba(16,11,8,${fade})`; x.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  await document.fonts.load(`600 100px ${FONT}`, 'Woolly Weather a little story in wool'); await document.fonts.ready;
  buildPieces(); buildBackdrops(); buildTitle();
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.titleCheck = () => TITLE.check;
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [{ t: .35, k: 'flap', d: .9 }, { t: 1.25, k: 'land' }, { t: 1.26, k: 'chirp', v: 1 }, { t: 1.75, k: 'flap', d: .55 }, { t: 2.3, k: 'flap', d: .65 },
    { t: 2.95, k: 'land' }, { t: 3.0, k: 'chirp', v: .8 }, { t: 3.5, k: 'hop' }, { t: 3.8, k: 'puff', v: .7 }, { t: 3.86, k: 'chirp', v: .6 },
    { t: T.cloudIn + .3, k: 'wind', d: 2.6 }, { t: T.rain0 - .1, k: 'rain', d: T.rain1 - T.rain0 + .6 }, { t: SHAKE[0], k: 'shake', d: SHAKE[1] - SHAKE[0] },
    { t: T.sun, k: 'shine' }, { t: 6.45, k: 'flap', d: .55 }, { t: 7.0, k: 'land' }, { t: 7.1, k: 'chirp', v: 1 },
    { t: T.w1 + 1 / FPS, k: 'pop', f: 392 }, { t: T.w2 + 1 / FPS, k: 'pop', f: 523 }, { t: T.tag + 1 / FPS, k: 'pop', f: 659, v: .7 }, { t: T.tag + .3, k: 'chord' }];
  for (const d of [DROP1, DROP2]) ev.push({ t: d, k: 'twig' });
  for (let j = 5; j < STRANDS.length; j += 2) ev.push({ t: strandT(j) + 2 / FPS, k: 'puff', v: .45 });
  for (const tf of TUFTS) { ev.push({ t: tf.grab, k: 'pluck' }); ev.push({ t: tf.rel + 2 / FPS, k: 'puff', v: .9 }); }
  for (let i = 0; i < 6; i++) ev.push({ t: T.rb0 + i * .08 + .1, k: 'note', i });
  for (const d of DROPS) { const tEnd = d.t0 + (landY(d) - CLOUD_Y - 200) / d.vy; ev.push({ t: Math.ceil(tEnd * FPS) / FPS, k: inPond(d.x, landY(d)) ? 'plink' : 'pat', v: d.k }); }
  return ev.sort((a, b) => a.t - b.t);
};
</script>
