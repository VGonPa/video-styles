const YH = 0.05 * S, inWing = pc => !pc.ops.includes(CF.neck) && !pc.ops.includes(CF.tail);
const wingLines = { a: [-3 * S, YH], b: [3 * S, YH], side: [0, 3 * S],
  extra: [{ a: NP, b: dirPt(NP, 35), side: [0, 0.25 * S] }, { a: TP, b: dirPt(TP, 152.5), side: [0, 0.25 * S] }] };
const paperSide = pc => centroid(pc.p)[1] > 0 ? 1 : -1;
// stack order after k5: paper v<0 lies on top (it was folded over)
CF.wingTop = crane.fold({ ...wingLines, filter: pc => inWing(pc) && paperSide(pc) < 0, full: 0, dir: 1 });
CF.wingBot = crane.fold({ ...wingLines, filter: pc => inWing(pc) && paperSide(pc) > 0, full: 0, dir: -1 });
const T_OPEN = 3.36, T_FLY = 3.86;
function wingAngle(t) {
  if (t < T_OPEN) return 0;
  const open = 72 * backOut((t - T_OPEN) / 0.5, 1.4);
  if (t < T_FLY) return open * DEG;
  const w = TAU * 2.7, ph = -1.628, u = t - T_FLY;
  return (70 - 36 * Math.cos(w * u + ph)) * DEG;
}
CF.wingTop.t0 = CF.wingBot.t0 = T_OPEN; CF.wingTop.t1 = CF.wingBot.t1 = T_OPEN + 0.5;
CF.wingTop.crease = CF.wingBot.crease = t => sstep(T_OPEN, T_OPEN + 0.3, t);
for (const op of crane.ops) op.angle = op.full === PI ? t => PI * op.amt(t) : wingAngle;
const craneMat = paperMaterial({ front: '#f4ecdc', back: '#d9432b', crease: creaseTexture(crane), half: [S, S], shape: 0 });
const craneMesh = sheetMesh(crane, craneMat);

/* ================================================= sheet 2: the sailboat
 * Portrait sheet: folded in half, top corners folded down to the centre
 * line (the sail), the band folded up (the hull), hull corners folded in. */
const BA = 1.15, BH = 1.633;   // half width, half height (BH - BA = band height)
const boat = new Sheet([[-BA, -BH], [BA, -BH], [BA, BH], [-BA, BH]], [BA, BH]);
const BF = {};
BF.b1 = boat.fold({ a: [-3, 0], b: [3, 0], side: [0, 3], full: true, ...fl(5.02, 5.46) });
BF.b2 = boat.fold({ a: [0, 0], b: [-BA, -BA], side: [-2 * BA, 0], full: true, ...fl(5.40, 5.80) });
BF.b3 = boat.fold({ a: [0, 0], b: [BA, -BA], side: [2 * BA, 0], full: true, ...fl(5.62, 6.02) });
BF.b4 = boat.fold({ a: [-3, -BA], b: [3, -BA], side: [0, -3], full: true, ...fl(5.98, 6.38) });
const HK = 0.62 * BA;
BF.b5 = boat.fold({ a: [-HK, -BA], b: [-BA, -HK], side: [-2 * BA, -2 * BA], full: true, ...fl(6.30, 6.62) });
BF.b6 = boat.fold({ a: [HK, -BA], b: [BA, -HK], side: [2 * BA, -2 * BA], full: true, ...fl(6.42, 6.74) });
const T_UNF = 7.8;
const UNF = { b6: [T_UNF, 0.34], b5: [T_UNF + 0.04, 0.34], b4: [T_UNF + 0.20, 0.36], b3: [T_UNF + 0.36, 0.36], b2: [T_UNF + 0.40, 0.36], b1: [T_UNF + 0.56, 0.40] };
for (const [k, op] of Object.entries(BF)) {
  const [u0, ud] = UNF[k], f = op.amt; op.u0 = u0; op.u1 = u0 + ud;
  op.angle = t => PI * (f(t) - easeInOut((t - u0) / ud));
}
const T_TITLE = T_UNF + 0.9;
const textCanvas = document.createElement('canvas'); textCanvas.width = 2048; textCanvas.height = Math.round(2048 * BA / BH);
const textTex = new THREE.CanvasTexture(textCanvas); textTex.flipY = false; textTex.colorSpace = THREE.NoColorSpace;
const boatMat = paperMaterial({ front: '#faf5ea', back: '#e8a92e', crease: creaseTexture(boat), half: [BA, BH], shape: 1, text: textTex, ink: '#232845' });
const boatMesh = sheetMesh(boat, boatMat);

/* ================================================= pleated paper water */
const X2 = 20, WX0 = X2 - 9.5, WX1 = X2 + 9.5, WZ0 = -17, WZ1 = 4.6, PLEAT = 0.34, NXW = 150;
const NZW = Math.round((WZ1 - WZ0) / PLEAT);
const waterGeo = new THREE.BufferGeometry();
{
  const idx = [], pos = new Float32Array((NXW + 1) * (NZW + 1) * 3), pap = new Float32Array((NXW + 1) * (NZW + 1) * 2);
  for (let j = 0; j <= NZW; j++) for (let i = 0; i <= NXW; i++) { const k = j * (NXW + 1) + i, x = lerp(WX0, WX1, i / NXW), z = WZ0 + j * PLEAT;
    pos[3 * k] = x; pos[3 * k + 2] = z; pap[2 * k] = x; pap[2 * k + 1] = z; }
  for (let j = 0; j < NZW; j++) for (let i = 0; i < NXW; i++) { const a = j * (NXW + 1) + i, b = a + 1, c = a + NXW + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
  waterGeo.setIndex(idx); waterGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); waterGeo.setAttribute('aPaper', new THREE.BufferAttribute(pap, 2));
}
const waterMat = paperMaterial({ front: '#3f6fa8', back: '#2c4f80', fibScale: 0.22, half: [99, 99], shape: 1 });
const water = new THREE.Mesh(waterGeo, waterMat); water.receiveShadow = true; water.castShadow = false; water.frustumCulled = false; scene.add(water);
const T_WATER = 6.35, T_FLAT = 8.2;
function pleatAmp(x, t) { return 0.13 * sstep(0, 1, (t - T_WATER - (x - WX0) * 0.035) / 0.55) * (1 - sstep(T_FLAT, T_FLAT + 0.75, t)); }
function waterH(x, j, t) {
  const A = pleatAmp(x, t) * (0.72 + 0.28 * Math.sin(1.25 * x - 2.6 * t + 0.85 * j)), s = j % 2 ? 1 : -1;
  return A * (1 + s) + 0.002;
}
function poseWater(t) {
  const p = waterGeo.attributes.position.array;
  for (let j = 0; j <= NZW; j++) for (let i = 0; i <= NXW; i++) { const k = j * (NXW + 1) + i; p[3 * k + 1] = waterH(p[3 * k], j, t); }
  waterGeo.attributes.position.needsUpdate = true;
}

/* ================================================= poses */
const BZ = 0.9;   // boat sheet lies a little in front of the water centre
const _q = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _e = new THREE.Euler();
const qAxis = (ax, a) => new THREE.Quaternion().setFromAxisAngle(ax, a);
const XA = V3(1, 0, 0), YA = V3(0, 1, 0), ZA = V3(0, 0, 1);
function cranePose(t) {
  const M = new THREE.Matrix4();
  // glide in and settle
  const u = clamp01(t / 0.55), e = easeOut(u);
  let pos = V3(lerp(-1.6, 0, e), 1.7 * (1 - easeOut(u * 1.05)) + 0.04 * Math.sin(u * PI) * (1 - u), lerp(-2.2, 0, e));
  let q = qAxis(YA, (1 - e) * -28 * DEG).multiply(qAxis(XA, (1 - easeInOut(u)) * PI + (1 - e) * 10 * DEG * Math.sin(u * 5))).multiply(qAxis(ZA, (1 - e) * 7 * DEG * Math.cos(u * 4)));
  // stand up on the keel
  const st = t < 3.12 ? 0 : backOut((t - 3.12) / 0.46, 1.5);
  q = qAxis(YA, -24 * DEG * easeInOut((t - 3.1) / 0.7)).multiply(q).multiply(qAxis(XA, 90 * DEG * st));
  pos.y += 0.1 * Math.sin(PI * clamp01((t - 3.12) / 0.46));
  // take-off: rise, bank toward the camera and away to the right
  if (t > T_FLY + 0.08) {
    const f = t - T_FLY - 0.08;
    pos.add(V3(2.2 * f * f + 0.5 * f + 0.92 * (camPose(t).l.x - camPose(T_FLY).l.x), 2.3 * Math.pow(f, 1.1) + 1.4 * f * f + 0.06 * Math.sin(TAU * 2.7 * f), 2.4 * f * f));
    const yaw = -22 * DEG * sstep(0, 0.9, f), pitch = 12 * DEG * Math.sin(PI * clamp01(f / 1.1)), roll = -8 * DEG * sstep(0.1, 0.8, f);
    q = qAxis(YA, yaw).multiply(qAxis(ZA, pitch)).multiply(qAxis(XA, roll)).multiply(q);
  }
  return M.compose(pos, q, V3(1, 1, 1));
}
function camPose(t) {
  const c1 = { p: V3(0.6, 3.4, 4.5), l: V3(0.3, 0.55, 0.0) }, c2 = { p: V3(X2, 4.0, 6.2), l: V3(X2, 0.55, 1.05) };
  const c0 = { p: V3(0.2, 5.4, 4.6), l: V3(0.1, 0.1, 0.1) };
  const d = easeInOut((t - 2.85) / 0.9), u = easeInOut((t - 4.35) / 0.95);
  const p = c0.p.clone().lerp(c1.p, d).lerp(c2.p, u), l = c0.l.clone().lerp(c1.l, d).lerp(c2.l, u);
  p.y += 0.35 * Math.sin(PI * u);                                  // lift slightly over the pan
  p.add(V3(0.12 * Math.sin(t * 0.5), 0.05 * Math.sin(t * 0.7), -0.25 * t / DUR));   // slow breathing drift
  return { p, l };
}
function camMatrix(t) { const c = camPose(t), m = new THREE.Matrix4().lookAt(c.p, c.l, YA); return { c, m }; }
// title pose: sheet square to the camera at T_TITLE, landscape (paper long side along screen x)
const titlePose = (() => {
  const { c, m } = camMatrix(T_TITLE + 0.6);
  const Rv = V3().setFromMatrixColumn(m, 0), Uv = V3().setFromMatrixColumn(m, 1), Fv = V3().setFromMatrixColumn(m, 2);
  const basis = new THREE.Matrix4().makeBasis(Uv.clone().negate(), Fv, Rv.clone().negate());
  const pos = c.p.clone().sub(Fv.clone().multiplyScalar(4.7)).add(Uv.clone().multiplyScalar(0.02));
  return { pos, q: new THREE.Quaternion().setFromRotationMatrix(basis) };
})();
function boatFloatPose(t) {
  const st = t < 6.72 ? 0 : backOut((t - 6.72) / 0.45, 1.6);
  const bob = sstep(6.8, 7.3, t);
  const y = 0.012 + lerp(0, 0.1, sstep(6.6, 7.0, t)) + bob * 0.035 * Math.sin(TAU * 0.95 * (t - 6.8));
  const x = X2 + 0.3 * sstep(6.8, 8.0, t);
  const pos = V3(x, y, BZ);
  const q = qAxis(ZA, bob * 3.2 * DEG * Math.sin(TAU * 0.8 * (t - 6.9))).multiply(qAxis(YA, bob * 4 * DEG * Math.sin(TAU * 0.45 * (t - 6.9))));
  // pivot about the hull bottom (model z = +BA after folding)
  const M = new THREE.Matrix4().compose(pos, q, V3(1, 1, 1));
  M.multiply(new THREE.Matrix4().makeTranslation(0, 0, BA)).multiply(new THREE.Matrix4().makeRotationX(90 * DEG * st)).multiply(new THREE.Matrix4().makeTranslation(0, 0, -BA));
  return M;
}
function boatPose(t) {
  const u = easeInOut((t - T_UNF - 0.05) / 0.95);
  const M = boatFloatPose(Math.min(t, T_UNF + 0.05));
  if (u <= 0) return M;
  const p0 = V3(), q0 = new THREE.Quaternion(), s0 = V3(); M.decompose(p0, q0, s0);
  const p = p0.clone().lerp(titlePose.pos, u); p.y += 0.7 * Math.sin(PI * u);
  const q = q0.clone().slerp(titlePose.q, u);
  // settle: tiny paper float after landing in front of the lens
  const s = clamp01((t - T_UNF - 1.0) / 1.2);
  q.multiply(qAxis(XA, 1.2 * DEG * Math.sin(TAU * 0.5 * s) * (1 - s)));
  return new THREE.Matrix4().compose(p, q, V3(1, 1, 1));
}

/* ================================================= title ink */
const TITLE_1 = 'Every idea', TITLE_2 = 'starts flat.';
function drawTitle(t) {
  const g = textCanvas.getContext('2d'), w = textCanvas.width, h = textCanvas.height;
  g.clearRect(0, 0, w, h);
  const words = [[TITLE_1.split(' ')[0], 0, "normal"], [TITLE_1.split(' ')[1], 0, "normal"], ['starts', 1, "normal"], ['flat.', 1, "italic"]];
  const fs = 250, lh = 262, y0 = h / 2 - lh / 2 + 88;
  g.textBaseline = 'alphabetic'; g.fillStyle = '#000';
  const lines = [[], []]; words.forEach((wd, i) => lines[wd[1]].push({ s: wd[0], st: wd[2], i }));
  lines.forEach((ln, li) => {
    const parts = ln.map(p => { g.font = `${p.st} 400 ${fs}px 'DM Serif Display'`; return { ...p, w: g.measureText(p.s).width }; });
    const sp = fs * 0.24, tw = parts.reduce((a, p) => a + p.w, 0) + sp * (parts.length - 1);
    let x = w / 2 - tw / 2;
    for (const p of parts) {
      const lt = t - T_TITLE - p.i * 0.11, a = easeOut(lt / 0.32);
      if (a > 0) {
        g.save(); g.font = `${p.st} 400 ${fs}px 'DM Serif Display'`;
        // ink soaks in: a soft bleed first, then the sharp letter
        g.globalAlpha = a * 0.35; g.filter = `blur(${(1 - a) * 14 + 2}px)`; g.fillText(p.s, x, y0 + li * lh);
        g.filter = 'none'; g.globalAlpha = a; g.fillText(p.s, x, y0 + li * lh + (1 - a) * 10);
        g.restore();
      }
      x += p.w + sp;
    }
  });
  // hairline rule and folio
  const ra = easeOut((t - T_TITLE - 0.62) / 0.4);
  if (ra > 0) { g.globalAlpha = ra * 0.8; g.fillRect(w / 2 - 150 * ra, y0 + lh + 92, 300 * ra, 4); g.globalAlpha = 1; }
  textTex.needsUpdate = true;
}

/* ================================================= compositing */
const out = document.getElementById('out'), octx = out.getContext('2d');
const grain = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), img = g.createImageData(W, H), r = mulberry32(7);
  for (let i = 0; i < img.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 44; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c; })();
const vignette = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const gr = g.createRadialGradient(W / 2, H * 0.48, H * 0.35, W / 2, H / 2, H * 1.1); gr.addColorStop(0, 'rgba(60,40,20,0)'); gr.addColorStop(1, 'rgba(60,40,20,0.30)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); return c; })();

function setScene(t) {
  const { c } = camMatrix(t);
  camera.position.copy(c.p); camera.lookAt(c.l); camera.updateMatrixWorld();
  sun.target.position.copy(c.l); sun.position.copy(c.l).add(SUN_DIR.clone().multiplyScalar(18));
  poseSheet(craneMesh, t, (op, tt) => op.angle(tt)); craneMesh.matrix.copy(cranePose(t)); craneMesh.visible = t < 5.6;
  poseSheet(boatMesh, t, (op, tt) => op.angle(tt)); boatMesh.matrix.copy(boatPose(t)); boatMesh.visible = t > 3.5;
  poseWater(t);
  if (t > T_TITLE - 0.05) drawTitle(t);
  boatMat.userData.U.uHasText.value = t > T_TITLE - 0.05 ? 1 : 0;
}
function composite(t) {
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.drawImage(glc, 0, 0);
  octx.globalCompositeOperation = 'multiply'; octx.drawImage(vignette, 0, 0);
  octx.globalCompositeOperation = 'overlay'; octx.globalAlpha = 0.10; octx.drawImage(grain, 0, 0);
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1;
  const fin = clamp01(t / 0.25), fo = sstep(9.7, 10, t);
  if (fin < 1 || fo > 0) { octx.fillStyle = '#efe9dd'; octx.globalAlpha = Math.max(1 - fin, fo); octx.fillRect(0, 0, W, H); octx.globalAlpha = 1; }
}

window.ready = (async () => {
  await document.fonts.load("250px 'DM Serif Display'", TITLE_1 + TITLE_2);
  await document.fonts.load("italic 250px 'DM Serif Display'", TITLE_2);
  await document.fonts.ready;
  setScene(0); renderer.render(scene, camera); renderer.getContext().finish();
})();

window.draw = ({ t }) => {
  setScene(t); renderer.render(scene, camera); composite(t);
  return out.toDataURL('image/jpeg', 0.92).split(',')[1];
};

window.events = () => {
  const ev = [{ k: 'land', t: 0.5 }];
  const folds = [...crane.ops.filter(o => o.full === PI), ...boat.ops];
  folds.forEach((o, i) => { ev.push({ k: 'fold', t: o.t0, d: o.t1 - o.t0, i }); ev.push({ k: 'crease', t: o.t0 + (o.t1 - o.t0) * FOLD_LAND, i }); });
  ev.push({ k: 'stand', t: 3.14 }, { k: 'open', t: T_OPEN });
  for (let k = 0; k < 5; k++) ev.push({ k: 'flap', t: T_FLY + (k + 0.3) / 2.7, i: k });
  ev.push({ k: 'takeoff', t: T_FLY + 0.1 }, { k: 'water', t: T_WATER }, { k: 'standboat', t: 6.74 }, { k: 'splash', t: 7.0 });
  Object.values(BF).forEach((o, i) => ev.push({ k: 'unfold', t: o.u0, i }));
  ev.push({ k: 'flatten', t: T_UNF + 0.95 });
  [0, 1, 2, 3].forEach(i => ev.push({ k: 'word', t: T_TITLE + i * 0.11, i }));
  return ev.sort((a, b) => a.t - b.t);
};
