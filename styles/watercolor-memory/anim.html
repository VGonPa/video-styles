<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watercolor Memory</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#f4ecdf;overflow:hidden}canvas{display:block}</style>
<!-- Rough.js 4.6.6 (MIT, Preet Shihn), vendored: no CDN at render time -->
<script src="vendor/rough.min.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ======================================================================
 * Watercolor Memory: a lighthouse, a cottage and a small boat at dusk.
 * A pencil sketch (Rough.js, fixed seeds) is washed by a GPU pigment-
 * transport simulation (raw WebGL2, RGBA16F ping-pong), then fades.
 *
 * Techniques adapted from "Memory Fading Into Watercolor" by Techartist
 * (MIT, https://github.com/iamtechartist/memory-fading-into-watercolor):
 * noise-weighted max-dilation of wet fronts over paper "thirst", the
 * pigment() edge-pooling / back-run / granulation model and Beer-Lambert
 * compositing over paper. See THIRD_PARTY_NOTICES.md.
 *
 * Determinism: the simulation is path dependent, so draw({t}) steps it
 * forward at a FIXED 60 steps/s from its last state, and resets and
 * re-simulates from t=0 whenever t goes backwards.
 * ====================================================================== */
const W = 1920, H = 1080, SW = 960, SH = 540, STEPS = 60, DUR = 10;
const HY = 600, SUN = [560, 452], LX = 1470, LANTERN = [1470, 271], BOAT = [742, 700];
const ON = [1.45, 2.25, 2.95, 3.55];           // sky, sea, land, objects: wash onsets
const FRONT = [1.9, 1.6, 1.3, 1.25];           // how long each wash takes to reach its far edge
const FADE = 6.3;                              // the memory starts to fade
const CAP = [7.35, 8.75];                      // caption is written
const clamp01 = x => Math.min(1, Math.max(0, x));
const smoother = x => { x = clamp01(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------------------------------------------------------- line art
 * R = graphite intensity, G = draw order (the sketch appears stroke by stroke), B = caption ink */
function drawLineArt() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const rc = rough.canvas(c), rnd = mulberry32(90817);
  const ops = []; let seed = 11;
  // op(fn): fn(stroke colour) draws one stroke; order is assigned from list position
  const op = (v, fn) => ops.push({ v, fn, seed: seed++ });
  const S = (col, sd, o = {}) => ({ stroke: col, strokeWidth: 2.6, roughness: 1.0, bowing: 1.1, seed: sd, ...o });
  const hatch = (col, sd, o = {}) => ({ stroke: 'none', fill: col, fillStyle: 'hachure', fillWeight: 1.3, hachureGap: 8,
                                        hachureAngle: -50, roughness: 1.2, seed: sd, ...o });
  // horizon, broken behind the headland
  op(215, (k, sd) => rc.curve([[92, HY], [300, HY + 1], [560, HY - 1], [800, HY + 1], [1040, HY]], S(k, sd, { strokeWidth: 2.2 })));
  // sun
  op(170, (k, sd) => rc.circle(SUN[0], SUN[1], 116, S(k, sd, { strokeWidth: 1.8, roughness: 0.8 })));
  // distant island
  op(190, (k, sd) => rc.curve([[118, HY], [170, 586], [232, 573], [300, 578], [362, 567], [432, 582], [504, HY]], S(k, sd, { strokeWidth: 2.0 })));
  // headland: cliff top, cliff base, rocks
  const cliff = [[1052, 744], [1120, 700], [1170, 652], [1215, 606], [1262, 574], [1330, 556], [1450, 548], [1600, 546], [1760, 552], [1846, 558]];
  op(235, (k, sd) => rc.curve(cliff, S(k, sd, { strokeWidth: 3.0 })));
  op(200, (k, sd) => rc.curve([[1052, 744], [1030, 790], [1046, 840], [1020, 880], [1034, 918]], S(k, sd, { strokeWidth: 2.4 })));
  const face = [[1086, 752], [1150, 702], [1210, 654], [1270, 620], [1340, 606], [1460, 601], [1620, 600], [1770, 606], [1846, 612]];
  op(160, (k, sd) => rc.curve(face, S(k, sd, { strokeWidth: 1.8, roughness: 1.4 })));
  op(205, (k, sd) => rc.ellipse(998, 800, 92, 34, S(k, sd, { strokeWidth: 2.2 })));
  op(190, (k, sd) => rc.ellipse(950, 834, 50, 20, S(k, sd, { strokeWidth: 2.0 })));
  // lighthouse tower (tapered), bands, gallery, lantern, roof
  const tw = y => 56 - (552 - y) / 234 * 18;
  op(245, (k, sd) => rc.line(LX - 56, 552, LX - 38, 318, S(k, sd, { strokeWidth: 3.0, roughness: 0.7 })));
  op(245, (k, sd) => rc.line(LX + 56, 552, LX + 38, 318, S(k, sd, { strokeWidth: 3.0, roughness: 0.7 })));
  for (const y of [376, 435, 493]) op(200, (k, sd) => rc.curve([[LX - tw(y), y], [LX, y + 6], [LX + tw(y), y]], S(k, sd, { strokeWidth: 2.0, roughness: 0.6 })));
  op(235, (k, sd) => rc.rectangle(LX - 62, 304, 124, 14, S(k, sd, { strokeWidth: 2.4, roughness: 0.6 })));
  op(215, (k, sd) => rc.line(LX - 58, 292, LX + 58, 292, S(k, sd, { strokeWidth: 2.0, roughness: 0.5 })));
  for (let x = -56; x <= 56; x += 14) op(170, (k, sd) => rc.line(LX + x, 292, LX + x, 304, S(k, sd, { strokeWidth: 1.4, roughness: 0.3 })));
  op(240, (k, sd) => rc.rectangle(LX - 32, 250, 64, 42, S(k, sd, { strokeWidth: 2.4, roughness: 0.6 })));
  for (const x of [-11, 11]) op(170, (k, sd) => rc.line(LX + x, 252, LX + x, 290, S(k, sd, { strokeWidth: 1.5, roughness: 0.4 })));
  op(245, (k, sd) => rc.polygon([[LX - 44, 250], [LX + 44, 250], [LX, 210]], S(k, sd, { strokeWidth: 2.6, roughness: 0.7 })));
  op(220, (k, sd) => rc.circle(LX, 204, 11, S(k, sd, { strokeWidth: 1.8, roughness: 0.4 })));
  op(200, (k, sd) => rc.line(LX, 198, LX, 184, S(k, sd, { strokeWidth: 1.6, roughness: 0.3 })));
  op(215, (k, sd) => rc.path(`M${LX - 12} 552 L${LX - 12} 528 Q${LX} 512 ${LX + 12} 528 L${LX + 12} 552`, S(k, sd, { strokeWidth: 2.0, roughness: 0.5 })));
  op(190, (k, sd) => rc.rectangle(LX - 7, 398, 12, 18, S(k, sd, { strokeWidth: 1.6, roughness: 0.4 })));
  op(190, (k, sd) => rc.rectangle(LX + 3, 458, 11, 16, S(k, sd, { strokeWidth: 1.6, roughness: 0.4 })));
  // keeper's cottage
  op(230, (k, sd) => rc.rectangle(1562, 502, 138, 50, S(k, sd, { strokeWidth: 2.4, roughness: 0.8 })));
  op(235, (k, sd) => rc.polygon([[1548, 504], [1714, 504], [1632, 462]], S(k, sd, { strokeWidth: 2.4, roughness: 0.8 })));
  op(210, (k, sd) => rc.rectangle(1668, 452, 14, 28, S(k, sd, { strokeWidth: 1.8, roughness: 0.5 })));
  op(200, (k, sd) => rc.rectangle(1584, 516, 20, 36, S(k, sd, { strokeWidth: 1.8, roughness: 0.5 })));
  op(190, (k, sd) => rc.rectangle(1636, 514, 26, 20, S(k, sd, { strokeWidth: 1.6, roughness: 0.5 })));
  // fence along the path
  for (let i = 0; i < 6; i++) { const x = 1262 + i * 30, y = 578 - i * 3.2;
    op(185, (k, sd) => rc.line(x, y, x + 1, y - 22, S(k, sd, { strokeWidth: 1.6, roughness: 0.5 }))); }
  op(170, (k, sd) => rc.curve([[1258, 566], [1340, 560], [1418, 553]], S(k, sd, { strokeWidth: 1.4, roughness: 0.6 })));
  // the boat
  op(240, (k, sd) => rc.polygon([[672, 700], [812, 700], [794, 721], [690, 721]], S(k, sd, { strokeWidth: 2.6, roughness: 0.7 })));
  op(235, (k, sd) => rc.line(BOAT[0], 700, BOAT[0], 556, S(k, sd, { strokeWidth: 2.2, roughness: 0.4 })));
  op(225, (k, sd) => rc.path(`M${BOAT[0] + 4} 566 Q${BOAT[0] + 40} 630 ${BOAT[0] + 64} 694 L${BOAT[0] + 4} 694 Z`, S(k, sd, { strokeWidth: 2.2, roughness: 0.6 })));
  op(215, (k, sd) => rc.path(`M${BOAT[0] - 4} 580 Q${BOAT[0] - 24} 640 ${BOAT[0] - 50} 694 L${BOAT[0] - 4} 694 Z`, S(k, sd, { strokeWidth: 2.0, roughness: 0.6 })));
  op(200, (k, sd) => rc.polygon([[BOAT[0], 556], [BOAT[0] + 18, 561], [BOAT[0], 566]], S(k, sd, { strokeWidth: 1.4, roughness: 0.4 })));
  // birds
  for (const [bx, by, s] of [[905, 352, 1], [958, 386, 0.8], [1012, 344, 0.6]])
    op(200, (k, sd) => rc.path(`M${bx - 16 * s} ${by} Q${bx - 8 * s} ${by - 10 * s} ${bx} ${by} Q${bx + 8 * s} ${by - 10 * s} ${bx + 16 * s} ${by}`, S(k, sd, { strokeWidth: 1.8, roughness: 0.5 })));
  // cloud streaks
  op(125, (k, sd) => rc.curve([[210, 304], [280, 292], [360, 298], [450, 286], [540, 292]], S(k, sd, { strokeWidth: 1.4, roughness: 1.3 })));
  op(115, (k, sd) => rc.curve([[1000, 180], [1080, 170], [1180, 176], [1300, 164]], S(k, sd, { strokeWidth: 1.3, roughness: 1.3 })));
  // sea: ripples, reflections
  for (let i = 0; i < 20; i++) {
    const y = HY + 26 + Math.pow(rnd(), 1.2) * 290, x = 130 + rnd() * 860, w = 22 + (y - HY) * 0.16 + rnd() * 20;
    op(120 + rnd() * 50, (k, sd) => rc.curve([[x, y], [x + w * 0.5, y - 3], [x + w, y]], S(k, sd, { strokeWidth: 1.3, roughness: 0.5 })));
  }
  for (let i = 0; i < 5; i++) { const y = 732 + i * 9, w = 60 - i * 9;
    op(150, (k, sd) => rc.curve([[BOAT[0] - w, y], [BOAT[0] - w / 3, y + 2], [BOAT[0] + w / 3, y - 2], [BOAT[0] + w, y]], S(k, sd, { strokeWidth: 1.3, roughness: 0.6 }))); }
  // grass tufts on the headland
  for (const gx of [1150, 1205, 1290, 1400, 1540, 1730, 1800]) {
    const gy = gx < 1330 ? 574 + (1330 - gx) * 0.55 : 551, n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) { const x = gx + (i - n / 2) * 6, h = 12 + rnd() * 14, lean = (rnd() - 0.4) * 12;
      op(175, (k, sd) => rc.curve([[x, gy], [x + lean * 0.4, gy - h * 0.55], [x + lean, gy - h]], S(k, sd, { strokeWidth: 1.4, roughness: 0.4 }))); }
  }
  // shading (hachure) last
  op(120, (k, sd) => rc.polygon([[LX + 14, 552], [LX + 56, 552], [LX + 38, 318], [LX + 8, 318]], hatch(k, sd, { hachureAngle: -65, hachureGap: 7 })));
  for (let i = 0; i < 22; i++) {           // rock strata and cracks
    const x = 1090 + rnd() * 740, top = x < 1340 ? 752 - (x - 1086) * 0.58 : 606, y = top + 20 + rnd() * (880 - top - 40);
    const l = 40 + rnd() * 70, a = x < 1340 ? -0.45 + rnd() * 0.2 : -0.06 + rnd() * 0.12;
    op(115 + rnd() * 40, (k, sd) => rc.curve([[x, y], [x + l * 0.5, y + l * a * 0.5 + 4], [x + l, y + l * a]], S(k, sd, { strokeWidth: 1.3, roughness: 0.9 })));
  }
  op(115, (k, sd) => rc.polygon([[1632, 462], [1714, 504], [1640, 504]], hatch(k, sd, { hachureAngle: -30, hachureGap: 7 })));
  op(110, (k, sd) => rc.polygon([[742, 704], [812, 704], [794, 719], [742, 719]], hatch(k, sd, { hachureAngle: 20, hachureGap: 5 })));
  op(105, (k, sd) => rc.ellipse(998, 806, 80, 20, hatch(k, sd, { hachureAngle: -20, hachureGap: 6 })));
  const n = ops.length;
  ops.forEach((o, i) => o.fn(`rgb(${Math.round(o.v)},${Math.round(8 + 240 * i / (n - 1))},0)`, o.seed));

  // caption, into the blue channel (added, so the pencil channels are untouched)
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgb(0,0,235)';
  ctx.font = "50px 'Homemade Apple'"; ctx.textBaseline = 'alphabetic';
  ctx.fillText('some days stay', 128, 1008);
  const cw = ctx.measureText('some days stay').width;
  const rc2 = rough.canvas(c);
  rc2.curve([[136, 1032], [136 + cw * 0.5, 1026], [136 + cw + 10, 1034]], { stroke: 'rgb(0,0,150)', strokeWidth: 1.6, roughness: 0.8, seed: 999 });
  return { canvas: c, capW: cw + 30 };
}

/* ---------------------------------------------------------------- region masks (half res)
 * A: R sky, G sea, B land, A objects.  B: colour hints (R red, G gold, B dark, A haze) */
function drawMasks() {
  const layer = fn => { const c = document.createElement('canvas'); c.width = SW; c.height = SH;
    const x = c.getContext('2d'); x.fillStyle = '#000'; x.fillRect(0, 0, SW, SH); x.scale(SW / W, SH / H);
    x.fillStyle = x.strokeStyle = '#fff'; x.lineJoin = x.lineCap = 'round'; fn(x); return x.getImageData(0, 0, SW, SH).data; };
  const poly = (x, pts, lw = 0) => { x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); if (lw) { x.lineWidth = lw; x.stroke(); } };
  const cliffTop = [[1052, 744], [1120, 700], [1170, 652], [1215, 606], [1262, 574], [1330, 556], [1450, 548], [1600, 546], [1760, 552], [1846, 558]];
  const headland = [...cliffTop, [1866, 640], [1858, 720], [1870, 800], [1860, 880], [1864, 930],
    ...Array.from({ length: 21 }, (_, i) => [1830 - i * 39, 932 + 12 * Math.sin(i * 1.7) + 8 * Math.sin(i * 0.6)]), [1020, 880], [1046, 840], [1030, 790]];
  const tower = [[LX - 58, 554], [LX + 58, 554], [LX + 40, 318], [LX - 40, 318]];
  const objs = x => {
    poly(x, tower, 6); x.fillRect(LX - 64, 290, 128, 30); x.fillRect(LX - 34, 248, 68, 46);
    poly(x, [[LX - 46, 252], [LX + 46, 252], [LX, 206]], 6);
    x.fillRect(1560, 500, 142, 54); poly(x, [[1546, 506], [1716, 506], [1632, 460]], 6); x.fillRect(1666, 450, 18, 34);
    poly(x, [[670, 698], [814, 698], [795, 723], [689, 723]], 6);
    poly(x, [[BOAT[0] + 4, 564], [BOAT[0] + 66, 696], [BOAT[0] + 4, 696]], 6);
    poly(x, [[BOAT[0] - 4, 578], [BOAT[0] - 52, 696], [BOAT[0] - 4, 696]], 6);
    x.lineWidth = 7; x.beginPath(); x.moveTo(BOAT[0], 700); x.lineTo(BOAT[0], 556); x.stroke();
  };
  const land = x => { poly(x, headland, 8);
    x.beginPath(); x.moveTo(118, HY + 3); [[170, 586], [232, 573], [300, 578], [362, 567], [432, 582], [504, HY + 3]].forEach(p => x.lineTo(...p)); x.closePath(); x.fill();
    x.beginPath(); x.ellipse(998, 800, 48, 19, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(950, 834, 27, 11, 0, 0, 7); x.fill(); };
  const wob = (a, f1, f2, ph) => v => a * (Math.sin(v * f1 + ph) * 0.6 + Math.sin(v * f2 + ph * 2.3) * 0.4);
  const wT = wob(16, 0.011, 0.037, 1.3), wL = wob(22, 0.017, 0.043, 0.4), wR = wob(20, 0.013, 0.051, 2.2), wB = wob(18, 0.012, 0.033, 0.9);
  const sky = layer(x => { x.beginPath(); x.moveTo(96, HY - 4);
    for (let Y = HY - 4; Y >= 96; Y -= 20) x.lineTo(96 + wL(Y), Y);
    for (let X = 96; X <= 1830; X += 20) x.lineTo(X, 96 + wT(X));
    for (let Y = 96; Y <= HY - 4; Y += 20) x.lineTo(1830 + wR(Y), Y);
    x.closePath(); x.fill(); x.globalCompositeOperation = 'destination-out'; land(x); objs(x); });
  const sea = layer(x => { x.beginPath(); x.moveTo(96 + wL(HY + 2), HY + 2);
    for (let X = 96; X <= 1830; X += 20) x.lineTo(X, HY + 2);
    for (let Y = HY + 2; Y <= 915; Y += 20) x.lineTo(1830 + wR(Y), Y);
    for (let X = 1830; X >= 96; X -= 20) x.lineTo(X, 915 + wB(X));
    for (let Y = 915; Y >= HY + 2; Y -= 20) x.lineTo(96 + wL(Y), Y);
    x.closePath(); x.fill(); x.globalCompositeOperation = 'destination-out'; land(x); objs(x); x.fillRect(1060, 770, 900, 400); });
  const lnd = layer(x => { land(x); x.globalCompositeOperation = 'destination-out'; objs(x); });
  const obj = layer(objs);
  const red = layer(x => { const band = (y0, y1) => { const w = y => 58 - (554 - y) / 236 * 18;
    poly(x, [[LX - w(y1), y1], [LX + w(y1), y1], [LX + w(y0), y0], [LX - w(y0), y0]]); };
    band(318, 378); band(437, 495); });
  const gold = layer(x => { x.fillRect(LX - 30, 252, 60, 38); x.fillRect(1638, 516, 22, 16); });
  const dark = layer(x => { poly(x, [[LX - 46, 252], [LX + 46, 252], [LX, 206]]); x.fillRect(LX - 64, 290, 128, 30);
    poly(x, [[1546, 506], [1716, 506], [1632, 460]]); poly(x, [[670, 698], [814, 698], [795, 723], [689, 723]]);
    x.fillRect(LX - 12, 522, 24, 32); x.fillRect(1582, 514, 24, 40);
    // rock face below the grass band, and the sea rocks
    poly(x, [[1086, 758], [1150, 708], [1210, 660], [1270, 626], [1340, 612], [1460, 607], [1620, 606], [1770, 612], [1920, 618], [1920, 1080], [990, 1080], [990, 880], [1016, 840], [1000, 780], [1060, 762]]);
    x.beginPath(); x.ellipse(998, 800, 80, 40, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(950, 834, 55, 30, 0, 0, 7); x.fill(); });
  const haze = layer(x => { x.beginPath(); x.moveTo(118, HY + 3); [[170, 586], [232, 573], [300, 578], [362, 567], [432, 582], [504, HY + 3]].forEach(p => x.lineTo(...p)); x.closePath(); x.fill(); });
  // pack into RGBA, flipping rows so texture v=0 is the bottom of the art (GL convention)
  const pack = chans => { const out = new Uint8Array(SW * SH * 4);
    for (let y = 0; y < SH; y++) for (let xx = 0; xx < SW; xx++) { const s = ((SH - 1 - y) * SW + xx) * 4, d = (y * SW + xx) * 4;
      for (let k = 0; k < 4; k++) out[d + k] = chans[k][s]; } return out; };
  return { A: pack([sky, sea, lnd, obj]), B: pack([red, gold, dark, haze]) };
}

/* ---------------------------------------------------------------- tileable fBm noise (seeded)
 * R low, G mid, B fine, A low (decorrelated) */
function makeNoise(size = 256) {
  const rnd = mulberry32(1337), P = 512, g = new Float32Array(P * 2);
  for (let i = 0; i < P; i++) { const a = rnd() * Math.PI * 2; g[i * 2] = Math.cos(a); g[i * 2 + 1] = Math.sin(a); }
  const hash = (x, y, s) => (((x * 73856093) ^ (y * 19349663) ^ (s * 83492791)) >>> 0) % P;
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const pn = (x, y, per, s) => { const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
    const gr = (ix, iy, dx, dy) => { const h = hash(((ix % per) + per) % per, ((iy % per) + per) % per, s); return g[h * 2] * dx + g[h * 2 + 1] * dy; };
    const u = fade(fx), v = fade(fy);
    const a = gr(x0, y0, fx, fy), b = gr(x0 + 1, y0, fx - 1, fy), c = gr(x0, y0 + 1, fx, fy - 1), d = gr(x0 + 1, y0 + 1, fx - 1, fy - 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  const chans = [{ f: 3, o: 5 }, { f: 6, o: 4 }, { f: 24, o: 3 }, { f: 4, o: 4 }];
  const raw = new Float32Array(size * size * 4), lo = [1e9, 1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9, -1e9];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) for (let c = 0; c < 4; c++) {
    let v = 0, amp = 0.5, f = chans[c].f;
    for (let k = 0; k < chans[c].o; k++) { v += amp * pn(x / size * f, y / size * f, f, c * 17 + k); amp *= 0.5; f *= 2; }
    raw[(y * size + x) * 4 + c] = v; lo[c] = Math.min(lo[c], v); hi[c] = Math.max(hi[c], v);
  }
  const data = new Uint8Array(size * size * 4);
  for (let i = 0; i < raw.length; i++) { const c = i & 3; data[i] = Math.round(255 * (raw[i] - lo[c]) / (hi[c] - lo[c])); }
  return data;
}

/* ---------------------------------------------------------------- WebGL2 */
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
gl.getExtension('EXT_color_buffer_float'); gl.getExtension('EXT_color_buffer_half_float');
const VERT = `#version 300 es
in vec2 p; out vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`;
function prog(fs) {
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, VERT)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name.replace('[0]', '')] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
function tex(w, h, data, { wrap = gl.CLAMP_TO_EDGE, mip = false, internal = gl.RGBA8, type = gl.UNSIGNED_BYTE, src = null } = {}) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if (src) { gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true); gl.texImage2D(gl.TEXTURE_2D, 0, internal, gl.RGBA, type, src); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false); }
  else gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}
function rt() { const t = tex(SW, SH, null, { internal: gl.RGBA16F, type: gl.HALF_FLOAT });
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0); return { t, f }; }

/* ---------------------------------------------------------------- simulation shader
 * One step of pigment transport: a noise-weighted max-dilation, so each wet front follows
 * the paper's uneven thirst (fingers, tide lines, drips). Injection follows a per-region
 * front; during the fade injection stops and the washes recede and bleed out. */
const SIM = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uPrev, uMask, uNoise;
uniform vec2 uTexel; uniform vec4 uInject, uK, uFront, uDecay; uniform float uAngle;
const float ASPECT = 16.0 / 9.0;
void main() {
  vec2 sp = vUv * vec2(ASPECT, 1.0);
  float nL = texture(uNoise, sp * 1.3 + vec2(0.11, 0.53)).r;
  float nM = texture(uNoise, sp * 4.7 + vec2(0.37, 0.19)).g;
  float nH = texture(uNoise, sp * 13.0 + vec2(0.71, 0.83)).b;
  float tn = smoothstep(0.28, 0.72, 0.5 * nL + 0.3 * nM + 0.2 * nH);
  float thirst = mix(0.45, 2.0, tn);
  vec4 f = texture(uPrev, vUv);
  for (int i = 0; i < 8; i++) {
    float a = uAngle + float(i) * 0.78539816;
    vec2 d = vec2(cos(a), sin(a));
    vec4 grav = 1.0 - vec4(0.12, 0.30, 0.22, 0.25) * d.y;     // pigment runs downhill a little
    vec4 nb = texture(uPrev, vUv + d * uTexel);
    f = max(f, nb * exp(-uK * thirst * grav));
  }
  vec2 ap = vec2(vUv.x * 1920.0, (1.0 - vUv.y) * 1080.0);
  float jag = (nM - 0.5) * 0.12 + (nH - 0.5) * 0.05;
  vec4 ord;
  ord.x = length((ap - vec2(${SUN[0]}.0, ${SUN[1]}.0)) * vec2(1.0, 1.25)) / 1400.0 + jag;   // sky blooms out of the sun
  ord.y = (ap.y - ${HY}.0) / 330.0 * 0.8 + abs(ap.x - ${SUN[0]}.0) / 5000.0 + jag;        // sea runs down from the horizon
  ord.z = ((1900.0 - ap.x) * 0.55 + (940.0 - ap.y)) / 780.0 + jag;                         // land climbs up the cliff
  ord.w = (ap.y - 190.0) / 560.0 + jag * 0.6;                                              // objects: top down
  vec4 m = texture(uMask, vUv);
  vec4 wetting = 0.35 + 0.65 * vec4(smoothstep(0.3, 0.7, nL), smoothstep(0.35, 0.65, nH), smoothstep(0.35, 0.65, nM), smoothstep(0.3, 0.7, nM));
  vec4 src = m * (1.0 - smoothstep(uFront - 0.05, uFront, ord));
  f = max(f, uInject * src * wetting);
  float hold = smoothstep(0.3, 0.7, 0.6 * nL + 0.4 * nM);
  f *= 1.0 - uDecay * mix(0.45, 1.6, 1.0 - hold);             // thirsty paper holds its colour longest
  o = min(f, vec4(1.0));
}`;

/* ---------------------------------------------------------------- composite shader */
const COMP = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uState, uMaskA, uMaskB, uLines, uNoise;
uniform vec2 uSimTexel; uniform float uZoom; uniform vec2 uFocus, uDrift;
uniform vec4 uAmount, uWet;
uniform float uSketch, uLineAmt, uCaption, uCapW, uGlow, uLantern, uBeamPh, uEnd, uT, uFade;
const float ASPECT = 16.0 / 9.0;
const vec3 PAPER   = vec3(0.957, 0.927, 0.878);
const vec3 GOLD    = vec3(0.960, 0.760, 0.260);
const vec3 PEACH   = vec3(0.970, 0.600, 0.420);
const vec3 ROSE    = vec3(0.880, 0.430, 0.540);
const vec3 VIOLET  = vec3(0.560, 0.410, 0.700);
const vec3 BLUEV   = vec3(0.330, 0.360, 0.720);
const vec3 TURQ    = vec3(0.180, 0.580, 0.660);
const vec3 ULTRA   = vec3(0.200, 0.270, 0.760);
const vec3 MAUVE   = vec3(0.720, 0.520, 0.700);
const vec3 SAP     = vec3(0.420, 0.580, 0.250);
const vec3 OCHRE   = vec3(0.860, 0.700, 0.340);
const vec3 SIENNA  = vec3(0.720, 0.390, 0.230);
const vec3 HAZE    = vec3(0.600, 0.560, 0.760);
const vec3 WARMW   = vec3(0.945, 0.860, 0.760);
const vec3 CADRED  = vec3(0.860, 0.220, 0.190);
const vec3 INDIGO  = vec3(0.220, 0.230, 0.440);
const vec3 GRAPHITE = vec3(0.235, 0.225, 0.225);
vec3 ab(vec3 c) { return max(-log(c / PAPER), 0.0); }        // Beer-Lambert absorbance over paper

// adapted from Techartist's pigment(): body, pooling at the drying edge, back-runs, granulation
float pigment(float f, float g, float thr, float soft, float poolW, float poolAmt, float flow, float bn, float tooth) {
  float dist = (f - thr) / g;
  float body = smoothstep(-soft, soft, dist);
  float pool = body * exp(-max(dist, 0.0) / poolW);
  float d = 0.32 + 0.55 * flow * flow;
  d += pool * poolAmt;
  d += smoothstep(0.75, 1.0, f) * 0.16;
  float lvl = 0.745;
  float bIn  = smoothstep(lvl, lvl + 0.012, bn);
  float bRim = bIn * (1.0 - smoothstep(lvl + 0.012, lvl + 0.045, bn));
  d = d * (1.0 - 0.35 * bIn) + bRim * 0.5;
  d *= mix(1.3, 0.75, tooth);
  return body * d;
}
vec3 skyPal(float r) {
  vec3 c = mix(GOLD, PEACH, smoothstep(0.05, 0.28, r));
  c = mix(c, ROSE, smoothstep(0.25, 0.50, r));
  c = mix(c, VIOLET, smoothstep(0.48, 0.75, r));
  return mix(c, BLUEV, smoothstep(0.72, 1.05, r));
}
void main() {
  vec2 s0 = vUv;
  vec2 suv = uFocus + (s0 - uFocus) / uZoom + uDrift;
  vec2 ap = vec2(suv.x * 1920.0, (1.0 - suv.y) * 1080.0);
  vec2 sp = suv * vec2(ASPECT, 1.0);
  vec2 gp = ap / uZoom;

  // ------------------------------------------------ cold-press paper
  float t1  = texture(uNoise, ap / 83.0).b;
  float t1s = texture(uNoise, (ap + vec2(-1.2, 1.2)) / 83.0).b;
  float t2  = texture(uNoise, ap / 211.0 + 0.5).g;
  float t3  = texture(uNoise, ap / 37.0 + 0.21).b;
  float mot = texture(uNoise, ap / 1300.0 + 0.7).r;
  float tooth = clamp(t1 * 0.55 + t2 * 0.25 + t3 * 0.2, 0.0, 1.0);
  vec3 paper = PAPER * (1.0 + (tooth - 0.5) * 0.06 + (mot - 0.5) * 0.05);
  paper *= 1.0 + (t1 - t1s) * 0.22;

  // ------------------------------------------------ pigment field
  vec2 tx = vec2(uSimTexel.x, 0.0), ty = vec2(0.0, uSimTexel.y);
  vec4 f  = texture(uState, suv);
  vec4 gx = texture(uState, suv + tx) - texture(uState, suv - tx);
  vec4 gy = texture(uState, suv + ty) - texture(uState, suv - ty);
  float pxPerTexel = 2.0 * uZoom;
  vec4 g = sqrt(gx * gx + gy * gy) / (2.0 * pxPerTexel) + 1e-5;
  vec4 mA = texture(uMaskA, suv), mB = texture(uMaskB, suv);

  vec2 warp = (texture(uNoise, sp * 0.8 + 0.3).ra - 0.5) * 0.35;
  float edgeN = texture(uNoise, sp * 9.0 + warp).b * 0.7 + texture(uNoise, sp * 31.0).b * 0.3 - 0.5;
  float fl0 = texture(uNoise, sp * 2.2 + warp).r;
  float fl1 = texture(uNoise, sp * 1.7 + warp + 0.41).a;
  float bnA = texture(uNoise, sp * 1.5 + warp * 0.6 + 0.17).g;
  float vg  = texture(uNoise, sp * 1.2 + 0.4).a;
  float gran = texture(uNoise, ap / 19.0 + 0.63).b;

  vec4 dry = 1.0 - uWet;
  vec4 soft = mix(vec4(0.9), vec4(3.0), max(uWet, vec4(uFade)));
  dry *= 1.0 - 0.6 * uFade;
  vec4 d;
  d.x = pigment(f.x, g.x, 0.26 + edgeN * 0.10, soft.x, 2.6, 1.0 * (0.4 + 0.6 * dry.x), fl0, bnA, tooth);
  d.y = pigment(f.y, g.y, 0.27 + edgeN * 0.10, soft.y, 2.4, 1.05 * (0.4 + 0.6 * dry.y), fl1, bnA, tooth);
  d.z = pigment(f.z, g.z, 0.25 + edgeN * 0.09, soft.z, 2.2, 1.1 * (0.4 + 0.6 * dry.z), fl0, bnA, tooth);
  d.w = pigment(f.w, g.w, 0.24 + edgeN * 0.07, soft.w, 1.8, 1.0 * (0.4 + 0.6 * dry.w), fl1, bnA, tooth);
  d *= uAmount;
  // reserved whites: the painter washed around the drawing
  d.x *= 1.0 - 0.88 * clamp(mA.z + mA.w, 0.0, 1.0);
  d.y *= 1.0 - 0.88 * clamp(mA.z + mA.w, 0.0, 1.0);
  d.z *= 1.0 - 0.85 * mA.w;

  // sky: sunset gradient out of a paper-white sun
  vec2 sq = (ap - vec2(${SUN[0]}.0, ${SUN[1]}.0)) * vec2(1.0, 1.3);
  float sr = length(sq);
  float r = clamp(sr / 1250.0 + (vg - 0.5) * 0.18 + (${HY}.0 - ap.y) / 2600.0, 0.0, 1.1);
  float skyD = d.x * (0.12 + 0.88 * smoothstep(58.0, 190.0, sr + (edgeN) * 30.0)) * mix(0.8, 1.15, smoothstep(0.2, 0.9, r));
  vec3 A = ab(skyPal(r)) * skyD;

  // sea: reflected rose near the horizon, turquoise, ultramarine deep; a broken gold path under the sun
  float y01 = clamp((ap.y - ${HY}.0) / 320.0, 0.0, 1.0);
  vec3 seaC = mix(MAUVE, TURQ, smoothstep(0.02, 0.35, y01 + (vg - 0.5) * 0.2));
  seaC = mix(seaC, ULTRA, smoothstep(0.35, 0.95, y01 + (fl1 - 0.5) * 0.25));
  float sx = abs(ap.x - ${SUN[0]}.0) / (48.0 + 150.0 * y01);
  float dash = smoothstep(0.52, 0.66, texture(uNoise, vec2(ap.x / 260.0, ap.y / 7.0)).g);
  float path = exp(-sx * sx) * (0.35 + 0.65 * dash) * (1.0 - smoothstep(0.55, 1.0, y01));
  float seaD = d.y * (1.0 - 0.8 * path) * mix(1.4, 0.65, gran);       // ultramarine granulates
  A += ab(seaC) * seaD + ab(GOLD) * d.y * path * 0.55;

  // land: sap green and ochre on top, sienna rock face, violet haze for the far island
  vec3 landC = mix(SAP, OCHRE, smoothstep(0.35, 0.75, fl0));
  vec3 rock = mix(SIENNA, OCHRE, 0.35 * smoothstep(0.3, 0.8, fl0));
  rock = mix(rock, VIOLET, 0.45 * smoothstep(0.45, 0.85, fl1));
  landC = mix(landC, rock, mB.z);
  landC = mix(landC, HAZE, mB.w);
  A += ab(landC) * d.z * mix(1.0, 0.55, mB.w) * mix(1.0, 0.72, mB.z);

  // objects: warm white, cadmium bands, gold lantern, indigo roofs and hull
  vec3 objC = WARMW;
  objC = mix(objC, CADRED, mB.x);
  objC = mix(objC, GOLD, mB.y);
  objC = mix(objC, INDIGO, mB.z);
  float objD = d.w * mix(0.55, 1.15, max(max(mB.x, mB.y), mB.z));
  objD *= mix(1.0, max(mB.x, mB.y) * 1.3, uFade * 0.85);            // only the red bands and the lamp linger
  A += ab(objC) * objD;

  // ------------------------------------------------ warm light: the sun, the lantern and its beam.
  // The beam is 'lifted' out of the wet wash (pigment blotted back to paper) and glazed gold.
  float sunL = exp(-sr / 380.0) * uGlow;
  vec2 lv = ap - vec2(${LANTERN[0]}.0, ${LANTERN[1]}.0);
  float cp = cos(uBeamPh), sgn = sign(cp);
  float along = lv.x * sgn;
  float len = 1350.0 * abs(cp);
  float wdt = 6.0 + 0.075 * max(along, 0.0);
  float by = lv.y + along * 0.03;
  float beam = smoothstep(20.0, 90.0, along) * exp(-by * by / (2.0 * wdt * wdt))
             * (1.0 - smoothstep(len * 0.5, len, along)) * (0.55 + 0.45 * texture(uNoise, vec2(along / 700.0 - uT * 0.05, lv.y / 90.0)).r);
  float flare = pow(max(sin(uBeamPh), 0.0), 6.0);
  float lamp = exp(-length(lv) / (38.0 + 50.0 * flare)) * (0.8 + 0.8 * flare);
  float light = sunL * 0.55 + (beam * 0.25 + lamp * 0.6) * uLantern;
  float lift = clamp((beam * 0.85 + lamp * 0.9) * uLantern, 0.0, 0.92);
  A *= 1.0 - lift;
  A += ab(GOLD) * lift * 0.28;
  vec3 col = paper * exp(-A);

  // wet sheen: light catching the meniscus of fresh pigment
  vec2 grad = vec2(dot(gx, uWet * uAmount), dot(gy, uWet * uAmount));
  vec3 nrm = normalize(vec3(-grad * 20.0, 1.0));
  float spec = pow(max(dot(nrm, normalize(vec3(0.55, 0.6, 0.75))), 0.0), 40.0);
  col += vec3(1.0, 0.96, 0.88) * spec * 0.2 * clamp(dot(d, vec4(1.0)), 0.0, 1.0);

  col = 1.0 - (1.0 - col) * (1.0 - vec3(1.0, 0.84, 0.55) * clamp(light, 0.0, 1.2) * 0.62);
  col *= mix(vec3(1.0), vec3(1.035, 0.965, 0.87), uGlow * 0.5);

  // ------------------------------------------------ graphite
  vec4 L = texture(uLines, suv);
  float reveal = smoothstep(L.g - 0.035, L.g, uSketch + (t2 - 0.5) * 0.02);
  float grain = mix(0.5, 1.0, smoothstep(0.2, 0.75, tooth));
  float line = L.r * reveal * grain * uLineAmt;
  col = mix(col, GRAPHITE, clamp(line * 1.25, 0.0, 1.0) * 0.82);
  // caption, written left to right
  float cx = ap.x - 125.0 + (texture(uNoise, vec2(ap.y / 60.0, 0.3)).r - 0.5) * 18.0;
  float capR = 1.0 - smoothstep(uCaption * uCapW - 16.0, uCaption * uCapW, cx);
  col = mix(col, GRAPHITE, clamp(L.b * 1.3 * capR * grain, 0.0, 1.0) * 0.85);

  // ------------------------------------------------ vignette, end, dither
  vec2 q = s0 - 0.5; q.x *= ASPECT;
  float v = smoothstep(0.45, 1.2, length(q));
  col *= 1.0 - v * (0.13 + 0.07 * uGlow);
  col = mix(col, paper * (1.0 - v * 0.13), uEnd);
  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;

let simP, compP, texNoise, texLines, texMA, texMB, A, B, capW = 400, stepsDone = 0;
const K_BASE = [0.085, 0.095, 0.11, 0.13];
function setTex(p, name, unit, t) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.uniform1i(p.u[name], unit); }
function clearSim() {
  for (const r of [A, B]) { gl.bindFramebuffer(gl.FRAMEBUFFER, r.f); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
  stepsDone = 0;
}
function simStep(step) {
  const ts = step / STEPS, u = simP.u;
  gl.useProgram(simP.p); gl.viewport(0, 0, SW, SH);
  const since = i => ts - ON[i];
  const fadeOn = smoother((ts - FADE) / 0.6);
  const inj = ON.map((o, i) => since(i) < 0 ? 0 : (0.8 + 0.2 * easeOut(since(i) / 1.2)) * (1 - fadeOn));
  const k = K_BASE.map((kb, i) => kb * (1 + 1.4 * (1 - easeOut(since(i) / FRONT[i]))) * (1 - 0.4 * fadeOn));
  const fr = FRONT.map((d, i) => since(i) < 0 ? -1 : 1.15 * easeInOut(since(i) / d));
  const dec = 0.021 * smoother((ts - FADE) / 0.7);
  gl.uniform4f(u.uInject, ...inj); gl.uniform4f(u.uK, ...k); gl.uniform4f(u.uFront, ...fr);
  gl.uniform4f(u.uDecay, dec, dec * 1.05, dec * 0.9, dec * 0.22);
  gl.uniform1f(u.uAngle, step * 2.39996323);
  gl.uniform2f(u.uTexel, 1 / SW, 1 / SH);
  setTex(simP, 'uPrev', 0, A.t); setTex(simP, 'uMask', 1, texMA); setTex(simP, 'uNoise', 2, texNoise);
  gl.bindFramebuffer(gl.FRAMEBUFFER, B.f);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  [A, B] = [B, A];
}
function composite(t) {
  const u = compP.u;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H); gl.useProgram(compP.p);
  setTex(compP, 'uState', 0, A.t); setTex(compP, 'uMaskA', 1, texMA); setTex(compP, 'uMaskB', 2, texMB);
  setTex(compP, 'uLines', 3, texLines); setTex(compP, 'uNoise', 4, texNoise);
  gl.uniform2f(u.uSimTexel, 1 / SW, 1 / SH);
  const zoom = 1 + 0.055 * easeInOut(t / DUR);
  gl.uniform1f(u.uZoom, zoom);
  gl.uniform2f(u.uFocus, 0.56, 0.5);
  gl.uniform2f(u.uDrift, 0.003 * Math.sin(2 * Math.PI * t / 13), 0.002 * Math.sin(2 * Math.PI * t / 9));
  const deepen = 1 + 0.32 * smoother((t - 4.0) / 1.8);
  const fadeAmt = 1 - 0.9 * smoother((t - FADE) / 2.3);
  const keep = 1 - 0.78 * smoother((t - FADE) / 2.6);             // 'some days stay': the lighthouse keeps a trace
  gl.uniform4f(u.uAmount, ...ON.map((o, i) => easeOut((t - o) / 0.9) * deepen * (i === 3 ? keep : fadeAmt)));
  gl.uniform4f(u.uWet, ...ON.map(o => t < o ? 1 : 1 - clamp01((t - o) / 3.2)));
  gl.uniform1f(u.uSketch, 1.04 * easeInOut((t - 0.2) / 1.7));
  gl.uniform1f(u.uLineAmt, 1 - 0.08 * smoother((t - FADE) / 2));
  gl.uniform1f(u.uCaption, easeInOut((t - CAP[0]) / (CAP[1] - CAP[0])));
  gl.uniform1f(u.uCapW, capW);
  gl.uniform1f(u.uGlow, smoother((t - 4.0) / 1.6) * (1 - smoother((t - FADE) / 1.6)));
  gl.uniform1f(u.uLantern, smoother((t - 4.3) / 0.5) * (1 - smoother((t - 7.0) / 1.0)));
  gl.uniform1f(u.uBeamPh, Math.PI * 0.5 + (t - 5.0) / 3.2 * Math.PI * 2);   // faces us at 5.0 s, then sweeps left across the sky
  gl.uniform1f(u.uEnd, 0.22 * smoother((t - 9.3) / 0.7));
  gl.uniform1f(u.uT, t);
  gl.uniform1f(u.uFade, smoother((t - FADE) / 2));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

window.ready = (async () => {
  await document.fonts.load("50px 'Homemade Apple'", 'some days stay');
  await document.fonts.ready;
  simP = prog(SIM); compP = prog(COMP);
  texNoise = tex(256, 256, makeNoise(256), { wrap: gl.REPEAT, mip: true });
  const la = drawLineArt(); capW = la.capW;
  texLines = tex(0, 0, null, { src: la.canvas });
  const m = drawMasks();
  texMA = tex(SW, SH, m.A); texMB = tex(SW, SH, m.B);
  A = rt(); B = rt(); clearSim();
})();

window.draw = ({ t }) => {
  const target = Math.round(t * STEPS);
  if (target < stepsDone) clearSim();
  while (stepsDone < target) { stepsDone++; if (stepsDone / STEPS >= ON[0]) simStep(stepsDone); }
  composite(t);
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};

window.events = () => [
  { k: 'pencil', t: 0.2, d: 1.7 },
  ...ON.map((t, i) => ({ k: 'wash', t, v: [1, 0.9, 0.75, 0.6][i], pan: [-0.35, -0.1, 0.3, 0.25][i] })),
  { k: 'glow', t: 4.3 },
  { k: 'fade', t: FADE },
  { k: 'pencil', t: CAP[0], d: CAP[1] - CAP[0] },
];
</script>
