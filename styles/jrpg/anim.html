// ── jrpg · 16-bit JRPG battle ──────────────────────────────────────────

// swirl → battle against THE DEADLINE (portrait dialogue, FIGHT, CRUNCH TIME, MAGIC › SAY NO, 9999) →

const W = 1920, H = 1080, K = 5, LW = 384, LH = 216, DUR = 10.0;
const FONT = '"Press Start 2P"';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return c; };
const LO = mk(LW, LH), L = LO.getContext('2d');
const MOS = mk(LW, LH), MG = MOS.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eback = x => { const c = 2.2; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const dith = (x, y, f) => f * 16 > BAY[(y & 3) * 4 + (x & 3)] + 0.5;
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// ── pixel primitives (integer coordinates only → no anti-aliasing) ─────
const R = (g, x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const disc = (g, cx, cy, r, c) => { g.fillStyle = c; for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.35); g.fillRect(cx - w, cy + dy, 2 * w + 1, 1); } };
const line = (g, x0, y0, x1, y1, c, pw = 1) => {
  g.fillStyle = c; x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1, dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1; let err = dx + dy;
  const o = pw >> 1;
  for (;;) { g.fillRect(x0 - o, y0 - o, pw, pw); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
};

const sparkle = (g, x, y, s, c) => { x = Math.round(x); y = Math.round(y); R(g, x, y - s, 1, 2 * s + 1, c); R(g, x - s, y, 2 * s + 1, 1, c); if (s > 1) R(g, x - 1, y - 1, 3, 3, c); };

// ── outlined sprite helper ─────────────────────────────────────────────
const SPR = mk(64, 64), SG = SPR.getContext('2d'), OUT = mk(66, 66), OG = OUT.getContext('2d');
const SPR2 = mk(128, 128), SG2 = SPR2.getContext('2d'), OUT2 = mk(130, 130), OG2 = OUT2.getContext('2d');
const TINT = mk(136, 136), TG = TINT.getContext('2d');
// s = 2 draws the sprite at double size but keeps a crisp 1-px outline on the native grid
function outlined(fn, oc = '#140c1c', s = 1) {

  let src = SPR, o = OUT, og = OG, n = 66;
  if (s === 2) { SG2.clearRect(0, 0, 128, 128); SG2.drawImage(SPR, 0, 0, 64, 64, 0, 0, 128, 128); src = SPR2; o = OUT2; og = OG2; n = 130; }
  og.globalCompositeOperation = 'source-over'; og.clearRect(0, 0, n, n);
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) og.drawImage(src, 1 + dx, 1 + dy);
  og.globalCompositeOperation = 'source-in'; og.fillStyle = oc; og.fillRect(0, 0, n, n);
  og.globalCompositeOperation = 'source-over'; og.drawImage(src, 1, 1);
  return o;
}
// draw a canvas onto L, optionally mirrored and tinted (white flash / red glow)
function blit(src, x, y, flip = false, tint = null, ta = 0) {
  let s = src;
  if (tint && ta > 0) {
    TG.globalCompositeOperation = 'source-over'; TG.clearRect(0, 0, 136, 136); TG.drawImage(src, 0, 0);
    TG.globalCompositeOperation = 'source-atop'; TG.globalAlpha = ta; TG.fillStyle = tint; TG.fillRect(0, 0, 136, 136);
    TG.globalAlpha = 1; TG.globalCompositeOperation = 'source-over'; s = TINT;
  }
  x = Math.round(x); y = Math.round(y);
  if (flip) { L.save(); L.translate(x + src.width, y); L.scale(-1, 1); L.drawImage(s, 0, 0, src.width, src.height, 0, 0, src.width, src.height); L.restore(); }
  else L.drawImage(s, 0, 0, src.width, src.height, x, y, src.width, src.height);
}

// ── palette ────────────────────────────────────────────────────────────
const INK = '#140c1c', WHITE = '#ffffff', GOLD = '#f0b830', GOLD_L = '#fce27a', YEL = '#fff070';

// ── party sprites (64×64 local, facing left, feet at y≈57, centre x=32) ─
function kafe(g, pose, ph) {
  const bx = 26, by = 35;
  const lift = pose === 'win' ? 0 : 0;

    R(g, bx, by + 10, 2, 1, '#f08a9a'); R(g, bx + 10, by + 10, 2, 1, '#f08a9a');

const PARTY = [
  { name: 'KAFE', fn: kafe, x: 258, y: 94, hp: [340, 303], mp: [22, 22], hurt: 37 },
  { name: 'POSTY', fn: posty, x: 342, y: 114, hp: [188, 146], mp: [64, 56], hurt: 42 },

// ── THE DEADLINE (alarm-clock monster) ─────────────────────────────────
const EW = 112, EH = 124, ECX = 56, ECY = 62;
const EB = mk(EW, EH), EBG = EB.getContext('2d');
const EC = mk(EW, EH), ECG = EC.getContext('2d');
function buildEnemy() {
  const g = EBG;
  // legs
  line(g, 42, 94, 36, 112, INK, 6); line(g, 70, 94, 76, 112, INK, 6);
  line(g, 42, 94, 36, 112, '#4a2438', 4); line(g, 70, 94, 76, 112, '#4a2438', 4);
  R(g, 25, 110, 16, 7, INK); R(g, 71, 110, 16, 7, INK); R(g, 26, 111, 14, 5, '#4a2438'); R(g, 72, 111, 14, 5, '#4a2438'); R(g, 27, 111, 8, 1, '#7a4a60'); R(g, 73, 111, 8, 1, '#7a4a60');
  // hammer + bells
  R(g, 51, 4, 10, 14, INK); R(g, 52, 5, 8, 12, '#b08020'); R(g, 53, 5, 2, 12, '#e0b848');
  for (const bx of [30, 82]) {
    disc(g, bx, 22, 14, INK); disc(g, bx, 22, 13, '#d09820');
    for (let y = -13; y <= 13; y++) for (let x = -13; x <= 13; x++) { if (x * x + y * y > 169) continue; const f = (x + y) / 18; if (f > 0.25 && dith(bx + x, 22 + y, clamp(f))) R(g, bx + x, 22 + y, 1, 1, '#9a6a10'); if (-f > 0.45 && dith(bx + x, 22 + y, clamp(-f * 1.2 - .3))) R(g, bx + x, 22 + y, 1, 1, '#f8e080'); }
    R(g, bx - 3 + (bx < 56 ? 0 : 0), 15, 3, 3, WHITE);
  }
  // body
  disc(g, ECX, ECY, 39, INK); disc(g, ECX, ECY, 38, '#b82838');
  for (let y = -38; y <= 38; y++) for (let x = -38; x <= 38; x++) {
    const d = Math.sqrt(x * x + y * y); if (d > 38.4) continue;
    const f = (x + y) / 38 / 1.41;
    if (f > 0.2 && dith(ECX + x, ECY + y, clamp((f - 0.2) * 2.2))) R(g, ECX + x, ECY + y, 1, 1, '#801828');
    if (f < -0.35 && d > 30 && dith(ECX + x, ECY + y, clamp((-f - 0.35) * 2.5))) R(g, ECX + x, ECY + y, 1, 1, '#e8606c');
  }
  // face
  disc(g, ECX, ECY, 30, INK); disc(g, ECX, ECY, 29, '#f6eedc');
  for (let y = -29; y <= 29; y++) for (let x = -29; x <= 29; x++) {
    if (x * x + y * y > 29 * 29) continue; const f = (x + y) / 29 / 1.41;

    const a = i / 12 * Math.PI * 2 - Math.PI / 2, big = i % 3 === 0;
    line(g, ECX + Math.cos(a) * (big ? 21 : 23), ECY + Math.sin(a) * (big ? 21 : 23), ECX + Math.cos(a) * 26, ECY + Math.sin(a) * 26, '#3a2030', big ? 2 : 1);
  }
}
// state: {min, hr, mood:'idle'|'angry'|'hurt'}
function drawEnemyTo(g, st) {

// ── backdrops (precomputed) ────────────────────────────────────────────
const BG = mk(LW, LH), BGG = BG.getContext('2d');
const OW = mk(LW, LH), OWG = OW.getContext('2d');
function gradFill(img, x0, y0, w, h, stops, fn) {
  const cs = stops.map(hex), d = img.data;
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    const v = clamp(fn(x, y)) * (cs.length - 1), i = Math.min(cs.length - 2, Math.floor(v)), f = v - i;
    const c = dith(x, y, f) ? cs[i + 1] : cs[i], o = (y * LW + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
  }
}
function buildBattleBG() {
  const g = BGG, img = g.createImageData(LW, LH), r = rnd(7);

  g.putImageData(img, 0, 0);

  const u = seg(t, T.cast, T.stamp), p = PARTY[1];
  for (let k = 0; k < 7; k++) {
    const a = k / 7 * Math.PI * 2 + u * 9, r = 22 - u * 10;
    sparkle(L, p.x - 28 + Math.cos(a) * r * 1.4, p.y - 70 + Math.sin(a) * r - u * 8, ((k + Math.floor(u * 12)) % 3 === 0) ? 2 : 1, k & 1 ? GOLD_L : '#b8f0ff');
  }

  if (u > 0.55) { const v = (u - 0.55) / 0.45; const x = p.x - 36 + (EX - p.x + 36) * v, y = p.y - 92 + (EY - 70 - p.y + 92) * v - Math.sin(v * Math.PI) * 20; disc(L, Math.round(x), Math.round(y), 3, WHITE); ring(L, Math.round(x), Math.round(y), 5, '#ff8090', 1); }
}
function stampFx(t) {
  // big red "NO" stamp slams onto the clock face (scale steps 6×→3× on the pixel grid)
  const u = t - T.stamp; if (u < 0) return;
  const sz = u < 0.03 ? 6 : u < 0.06 ? 5 : u < 0.09 ? 4 : 3;
  const vis = t < T.hit2 + 0.06 || (t < T.hit2 + 0.16 && (Math.floor(t * 30) & 1));
  if (!vis) return;
  TX.push({ fn: (dx, dy) => {
    const cx = (EX + dx) * K, cy = (EY - 60 + dy) * K, fs = 8 * K * sz;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.0);
    ctx.font = `${fs}px ${FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    const bw = fs * 2 + 4 * K * sz, bh = fs + 4 * K * sz;
    ctx.fillStyle = '#0c0818'; ctx.fillRect(-bw / 2 - K * sz, -bh / 2 - K * sz, bw + 2 * K * sz, bh + 2 * K * sz);
    ctx.fillStyle = '#e02838'; ctx.fillRect(-bw / 2, -bh / 2, bw, bh);
    ctx.fillStyle = '#fff4f0'; ctx.fillRect(-bw / 2 + K * sz, -bh / 2 + K * sz, bw - 2 * K * sz, bh - 2 * K * sz);
    ctx.fillStyle = '#e02838'; ctx.fillText('NO', K * sz * 0.5, K * sz * 0.5);
    ctx.restore(); ctx.textAlign = 'left';

}
// boss dissolve: pixels turn red, then drift up and sideways, top to bottom
let DIS = null;
function dissolve(t) {
  if (!DIS) {
    drawEnemyTo(ECG, { min: 59 / 60 + 3, hr: 4.98 / 12 + 0.6, mood: 'hurt' });
    const src = ECG.getImageData(0, 0, EW, EH), r = rnd(99), th = new Float32Array(EW * EH);
    for (let i = 0; i < th.length; i++) th[i] = (Math.floor(i / EW) / EH) * 0.75 + r() * 0.25;
    DIS = { src, th, cv: mk(EW + 40, EH + 40), dir: Float32Array.from({ length: EW * EH }, () => r() * 2 - 1) };
  }
  const u = seg(t, T.die, T.dieEnd), g = DIS.cv.getContext('2d');
  const out = g.createImageData(EW + 40, EH + 40), s = DIS.src.data, d = out.data;
  for (let y = 0; y < EH; y++) for (let x = 0; x < EW; x++) {
    const i = y * EW + x, o = i * 4; if (s[o + 3] < 128) continue;
    const e = u * 1.25 - DIS.th[i];
    let px = x + 20, py = y + 20, rr = s[o], gg = s[o + 1], bb = s[o + 2];
    // red tint sweeping down
    const redf = clamp((u * 1.6 - y / EH) * 2);
    rr = rr + (255 - rr) * redf * 0.8; gg *= 1 - redf * 0.75; bb *= 1 - redf * 0.6;
    if (e > 0) {

      rr = 255; gg = 120 + 100 * (e / 0.25); bb = 140;
    }
    if (px < 0 || py < 0 || px >= EW + 40 || py >= EH + 40) continue;
    const q = (py * (EW + 40) + px) * 4; d[q] = rr; d[q + 1] = gg; d[q + 2] = bb; d[q + 3] = 255;
  }
  g.putImageData(out, 0, 0);

}

// ── battle UI ──────────────────────────────────────────────────────────
const CMDS = ['FIGHT', 'MAGIC', 'ITEM', 'RUN'];
const SPELLS = [['SNOOZE', 2], ['SAY NO', 8], ['DELEGATE', 6]];
function battleUI(t) {
  // intro dialogue with portrait

    const o = t < T.dlgClose ? seg(t, T.dlgOpen, T.dlgOpen + 0.1) : 1 - seg(t, T.dlgClose, T.dlgClose + 0.08);
    if (win(4, 152, 376, 60, o)) {
      portraitDeadline(12, 160);
      txt('THE DEADLINE', 66, 160, '#ff9090');
      typed(DLG1, T.dlgType, t).forEach((s, j) => txt(s, 66, 174 + j * 14));
    }

  }
  if (t < T.ui) return;

        const cj = t < T.toSayNo ? 0 : 1 - (t < T.toSayNo + 0.05 ? (1 - seg(t, T.toSayNo, T.toSayNo + 0.05)) : 0);
        const blink = t > T.sel3 && (Math.floor(t * 30) & 1);
        if (!blink) cursor(112, 159 + cj * 14, t);
      }
    } else if (win(100, 152, 280, 60, oUI)) partyRows(t);
  }
  if (cmdOpen > 0 && win(4, 152, 92, 60, cmdOpen)) {
    CMDS.forEach((c, j) => txt(c, 30, 157 + j * 13, WHITE));
    let cj = 0; if (t > T.toMagic) cj = eback(seg(t, T.toMagic, T.toMagic + 0.08));
    const blink = (t > T.sel1 && t < T.atk) || (t > T.sel2 && t < T.sub + 0.02);
    if (!inSub && !(blink && (Math.floor(t * 30) & 1))) cursor(12, 157 + cj * 13, t);
    if (inSub) R(L, 12, 157 + 13 + 2, 0, 0, INK);
  }
  // top message window: skill names / victory
  let msg = null, mcol = WHITE;
  if (t > T.eTurn && t < T.eEnd) { msg = 'CRUNCH TIME'; mcol = '#ff9090'; }
  if (t > T.cast && t < T.die) msg = 'SAY NO';
  if (t > T.win && t < T.lvl) { msg = 'VICTORY!'; mcol = YEL; }
  if (t > T.lvl && t < T.fade + 1) { msg = 'LEVEL UP!'; mcol = YEL; }
  if (msg) {
    const t0 = msg === 'CRUNCH TIME' ? T.eTurn : msg === 'SAY NO' ? T.cast : msg === 'VICTORY!' ? T.win : T.lvl;
    const w = msg.length * 8 + 32;
    if (win(192 - w / 2, 6, w, 24, seg(t, t0, t0 + 0.08))) txt(msg, 192, 14, mcol, 1, 'center');
  }
  // EXP tally
  if (t > T.exp && t < T.lvl) {
    if (win(40, 38, 160, 42, seg(t, T.exp, T.exp + 0.08))) {
      const u = seg(t, T.exp + 0.12, T.exp + 0.55);
      txt('EXP', 52, 46); txt(String(Math.round(1200 * u)), 188, 46, WHITE, 1, 'right');
      txt('GOLD', 52, 60); txt(String(Math.round(45 * u)), 188, 60, GOLD_L, 1, 'right');
    }
  }
  // level-up stats
  if (t > T.lvl) {
    if (win(32, 36, 200, 106, seg(t, T.lvl, T.lvl + 0.08))) {
      txt('KAFE', 44, 44, YEL); txt('LV 11', 100, 44); R(L, 148, 47, 6, 2, '#c0c8e8'); R(L, 152, 45, 2, 6, '#c0c8e8'); R(L, 154, 46, 1, 4, '#c0c8e8'); txt('12', 180, 44, t > T.lvl + 0.14 ? YEL : WHITE, 1, 'right');
      R(L, 44, 56, 168, 1, '#9ca4c8');
      const ST = [['ATK', 34, 36], ['DEF', 21, 24], ['FOCUS', 9, 15], ['CALM', 3, 11]];
      ST.forEach(([n, a, b], j) => {
        const y = 62 + j * 18, tj = T.lvl + 0.16 + j * 0.1, on = t > tj;
        txt(n, 44, y); txt(String(a), 140, y, '#c0c8e8', 1, 'right');
        R(L, 148, y + 3, 6, 2, '#c0c8e8'); R(L, 152, y + 1, 2, 6, '#c0c8e8'); R(L, 154, y + 2, 1, 4, '#c0c8e8');
        if (on) { const pop = t < tj + 0.08 ? -2 : 0; txt(String(b), 180, y + pop, YEL, 1, 'right'); txt('+' + (b - a), 212, y + pop, '#80ff90', 1, 'right'); }

}
function partyRows(t) {

    const d = seg(t, T.eHit + 0.05, T.eHit + 0.45), hp = Math.round(p.hp[0] + (p.hp[1] - p.hp[0]) * d);
    txt(String(hp), 198, y, WHITE, 1, 'right');
    const bw = 64, f = hp / p.hp[0];
    R(L, 204, y + 2, bw + 2, 5, INK); R(L, 205, y + 3, bw, 3, '#2a2040');
    R(L, 205, y + 3, Math.round(bw * f), 3, f > 0.5 ? '#58e070' : '#f0d040'); R(L, 205, y + 3, Math.round(bw * f), 1, '#b8ffc0');
    const md = seg(t, T.stamp, T.stamp + 0.3), mp = Math.round(p.mp[0] + (p.mp[1] - p.mp[0]) * md);
    txt(String(mp), 300, y, WHITE, 1, 'right');
    const mw = 64, mf = mp / p.mp[0];
    R(L, 306, y + 2, mw + 2, 5, INK); R(L, 307, y + 3, mw, 3, '#2a2040');
    R(L, 307, y + 3, Math.round(mw * mf), 3, '#58a8ff'); R(L, 307, y + 3, Math.round(mw * mf), 1, '#c0e0ff');
  });
}

// ── frame ──────────────────────────────────────────────────────────────
function render(t) {
  TX = [];
  L.fillStyle = '#000'; L.fillRect(0, 0, LW, LH);
  const inOW = t < T.black;
  if (inOW) overworld(t); else battle(t);
  // encounter: three inverted flashes, then a pixel swirl to black
  if (t > T.flash && t < T.swirl) { const k = Math.floor((t - T.flash) / 0.053); if (k % 2 === 0) { L.globalCompositeOperation = 'difference'; L.fillStyle = WHITE; L.fillRect(0, 0, LW, LH); L.globalCompositeOperation = 'source-over'; } }
  let mosaic = 1;
  if (t > T.swirl && t < T.black) {
    const u = seg(t, T.swirl, T.black - 0.02);
    mosaic = 1 + Math.floor(u * 6) * 2;
    L.fillStyle = '#000';
    for (let cy = 0; cy < LH; cy += 8) for (let cx = 0; cx < LW; cx += 8) {
      const dx = cx + 4 - 192, dy = cy + 4 - 108, a = (Math.atan2(dy, dx) / (Math.PI * 2) + 1.25) % 1, rr = Math.hypot(dx, dy) / 220;
      if (u * 1.35 > a * 0.75 + (1 - rr) * 0.25 + 0.05) L.fillRect(cx, cy, 8, 8);
    }
    TX = [];
  }
  if (t >= T.black && t < T.reveal) { L.fillStyle = '#000'; L.fillRect(0, 0, LW, LH); TX = []; }
  if (t >= T.reveal && t < T.revealEnd) mosaic = [12, 10, 8, 6, 4, 3, 2, 1][Math.min(7, Math.floor(seg(t, T.reveal, T.revealEnd) * 8))];
  if (mosaic > 1) {
    MG.clearRect(0, 0, LW, LH); const w = Math.ceil(LW / mosaic), h = Math.ceil(LH / mosaic);
    MG.drawImage(LO, 0, 0, LW, LH, 0, 0, w, h); L.drawImage(MOS, 0, 0, w, h, 0, 0, w * mosaic, h * mosaic);
  }
  // screen shake (low-res pixels)
  let sx = 0, sy = 0;
  if (t > T.eHit && t < T.eHit + 0.22) { const k = Math.floor(t * 30); sx = [2, -2, 1, -1, 2, 0][k % 6]; sy = [1, -1, 0, 1, -1, 0][k % 6]; }
  if (t > T.stamp && t < T.stamp + 0.2) { const k = Math.floor(t * 30); sx = [-3, 3, -2, 2, -1, 1][k % 6]; sy = [2, -2, 1, -1, 0, 0][k % 6]; }
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(LO, 0, 0, LW, LH, sx * K, sy * K, W, H);
  flushText(sx, sy);
  // stepped fades (8 brightness levels, like hardware fades)
  let fa = 0;
  if (t < 0.24) fa = 1 - seg(t, 0, 0.24);
  if (t >= T.reveal && t < T.revealEnd) fa = Math.max(fa, 1 - seg(t, T.reveal, T.revealEnd));
  if (t > T.fade) fa = seg(t, T.fade, DUR - 0.12);
  if (fa > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.ceil(fa * 8) / 8})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  await document.fonts.load(`40px ${FONT}`); await document.fonts.load(`80px ${FONT}`); await document.fonts.ready;
  buildEnemy(); buildBattleBG(); buildOverworld();
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const ev = [];
  ev.push({ t: T.strike, k: 'bell' }, { t: T.bang, k: 'alert' }, { t: T.flash, k: 'encounter' }, { t: T.swirl, k: 'swirl' }, { t: T.reveal, k: 'bgm' });
  ev.push({ t: T.dlgOpen, k: 'open' });
  typeTimes(DLG1, T.dlgType).forEach(x => ev.push({ t: x, k: 'blip', v: 0 }));
  ev.push({ t: T.ui, k: 'open' }, { t: T.sel1, k: 'select' });
  ev.push({ t: T.atk, k: 'step' }, { t: T.slash, k: 'slash' }, { t: T.hit1, k: 'hit' });
  ev.push({ t: T.eTurn, k: 'charge' }, { t: T.eWave, k: 'wave' }, { t: T.eHit, k: 'crunch' });
  ev.push({ t: T.toMagic, k: 'move' }, { t: T.sel2, k: 'select' }, { t: T.sub, k: 'open' }, { t: T.toSayNo, k: 'move' }, { t: T.sel3, k: 'select' });
  ev.push({ t: T.cast, k: 'cast' }, { t: T.stamp, k: 'stamp' }, { t: T.hit2, k: 'bighit' }, { t: T.die, k: 'die' });
  ev.push({ t: T.win, k: 'fanfare' });
  for (let i = 0; i < 12; i++) ev.push({ t: T.exp + 0.12 + i * 0.036, k: 'tick' });
  ev.push({ t: T.lvl, k: 'levelup' });
  for (let j = 0; j < 4; j++) ev.push({ t: T.lvl + 0.16 + j * 0.1, k: 'stat', v: j });
  ev.push({ t: T.learn, k: 'open' });
  typeTimes(DLG2, T.learnType).forEach(x => ev.push({ t: x, k: 'blip', v: 1 }));
  ev.push({ t: T.learnType + 0.02, k: 'learn' });
  return ev.sort((a, b) => a.t - b.t);
};
