// ── absurd-webcomic · "How I feel when the Wi-Fi drops for one second" ─────────────────────────
// Chunky flat-color webcomic: an original goat ("the narrator") sips coffee at 7:02 AM; the camera pushes into
// the laptop as the Wi-Fi bars vanish, whips back to a twitching eye, then SMASH: a red ray-burst, bulging eyes
// and a gigantic mouth screaming "NOOOOOO!". The camera pulls back out of the room, through the house window,
// to a tiny planet with shockwaves, where a smug narwhal floats by: "It's back." The letters fall; the camera
// dives back into the wrecked room, 7:03 AM, the frazzled goat sips from a broken mug: "I'm a very calm person."

const eSm = u => u * u * (3 - 2 * u);
const eOutBack = u => { const c = 2.2; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

const FT = '"Titan One"', FH = '"Gochi Hand"';
const INK = '#1a1320', OL = 7;

  goat: '#fbf5e8', goatS: '#eadfca', muzzle: '#f6c9c0', horn: '#e2c28e', hornD: '#b8935c', hoof: '#4b3d44',

// ── timeline ──
const T = { title: .35, cap1: .75, push: 2.2, onScreen: 2.5, bar1: 2.56, bar2: 2.64, bar3: 2.72, drop: 2.8, cap2: 2.55,
  whip: 2.95, face: 3.2, inhale: 3.28, boom: 3.45, out0: 4.9, out1: 5.65, orbit: 5.8, narw: 5.8, back: 6.3, fall: 6.4,
  in0: 6.9, in1: 7.45, cap3: 7.65, blink1: 7.78, bub: 8.0, blink2: 8.72, sip: 8.85, iris0: 9.2, iris1: 9.5, iris2: 9.72, iris3: 9.86 };

// ── geometry ──
const GX = 1060, GY = 450;                           // goat head centre (room coords)
const LAP = { x: 530, y: 600, w: 400, h: 260 };      // laptop screen
const WIN = { x: 1420, y: 150, w: 380, h: 410 };     // room window
const HW = { x: 952, y: 660, w: 16, h: 9 };          // house window in space coords (the room lives inside it)

// ── helpers ──
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// tapered tube polygon along a cubic

function wrapText(txt, font, maxW) { ctx.font = font; const words = txt.split(' '), lines = []; let cur = '';

// ═══════════════════════════ GOAT ═══════════════════════════
// local coords: head centre (0,0); head ≈ 390 tall. g = pose.
function headPath() {
  ctx.beginPath(); ctx.moveTo(0, -175);
  ctx.bezierCurveTo(95, -178, 158, -130, 155, -40); ctx.bezierCurveTo(152, 40, 120, 120, 88, 175);
  ctx.bezierCurveTo(60, 215, -60, 215, -88, 175); ctx.bezierCurveTo(-120, 120, -152, 40, -155, -40);

    ctx.beginPath(); ctx.moveTo(p[0] - dy / l * w, p[1] + dx / l * w); ctx.lineTo(p[0] + dy / l * w, p[1] - dx / l * w); ctx.stroke(); }
  if (g.char && side > 0) { ctx.save(); taper([48, -150], [62, -262], [150, -318], [196, -246], 44, 8); ctx.clip(); ell(190, -262, 50, 40); ctx.fillStyle = '#3a2d2d'; ctx.fill(); ctx.restore(); taper([48, -150], [62, -262], [150, -318], [196, -246], 44, 8); fs(null, OL); }
  ctx.restore();

}

  ctx.beginPath(); ctx.moveTo(14, -10); ctx.bezierCurveTo(50, -22, 90, -12, 98, 0); ctx.bezierCurveTo(90, 12, 50, 18, 14, 10); ctx.closePath(); fs(C.pink, 0);

}

  if (b > .05) { ctx.strokeStyle = '#ff4a4a'; ctx.lineWidth = 3.5; ctx.globalAlpha = b; const r = rng(side * 17 + 3);
    for (let i = 0; i < 9; i++) { const a = r() * TAU, x0 = ex + Math.cos(a) * rx, y0 = ey + Math.sin(a) * ry; ctx.beginPath(); ctx.moveTo(x0, y0);
      let x = x0, y = y0; for (let k = 0; k < 3; k++) { x = lerp(x, ex, .22) + (r() - .5) * 14; y = lerp(y, ey, .22) + (r() - .5) * 14; ctx.lineTo(x, y); } ctx.stroke(); }

function arm(side, g, hand) {
  const sh = [side * 190, 238 - (g.shrug || 0) * 30], hx = hand[0], hy = hand[1];
  const mx = (sh[0] + hx) / 2, my = (sh[1] + hy) / 2, dx = hx - sh[0], dy = hy - sh[1], l = Math.hypot(dx, dy) || 1;

function mugAt(x, y, a, g, broken) {

// ═══════════════════════════ CAMERA ═══════════════════════════

}
const toScreen = (cam, x, y) => [960 + (x - cam.x) * cam.z, 540 + (y - cam.y) * cam.z];

// ═══════════════════════════ OVERLAYS ═══════════════════════════
function captionBox(txt, x, y, p, rot, size, maxW, bg = '#fff', font = FH) {

// ═══════════════════════════ FRAME ═══════════════════════════
function render(t) {

  await document.fonts.load(`190px ${FT}`, 'NOOOOOO!HOW I FEEL WHEN THE WI-FI DROPS FOR ONE SECOND'); await document.fonts.load(`60px ${FH}`, "7:02 AM. Coffee. It's back. I'm a very calm person.()"); await document.fonts.ready;
