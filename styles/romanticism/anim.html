<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── romanticism · the watcher on the headland ──────────────────────────────────────────────────
// A storm painted in Goya's darks: three great cloud masses with bone-black bellies, their undersides
// caught by a sour ochre break low on the horizon, dirty bone for the foam. Close on a lantern-bearer at
// the edge of a sea cliff → the camera pulls back until the figure is tiny under an enormous sky (the
// Sublime) while a swell bursts against the cliff foot → the watcher raises the lantern, the sky
// darkens, lightning strikes the sea → a thin crack of light opens along the belly of the darkest cloud
// and the cloud deck is torn back from it: open sky goes first, the masses last, their edges catching
// fire, the light spilling down past the low bank into the fog and onto the sea (a glitter path, a
// foundering ship); a small wave breaks; the lantern is lowered → the movement's name is set letter by
// letter in the dark sky → a slow push toward the light.
// Every painted surface is a procedural colour field laid down once, coarse to fine, with seeded
// bristle strokes that follow the cloud forms. The tear is a stack of precomputed masks built from
// strokes, each with the moment it opens. Frames composite those canvases plus a few hundred sprites
// and strokes; each frame depends on t alone.
const W = 1920, H = 1080, DUR = 10, TAU = Math.PI * 2;
const PS = 1.5;   // painted layers are rasterised above frame resolution so the opening close-up keeps its brushwork
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

// ── numbers ──
const cl = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const mix = (a, b, k) => a + (b - a) * k;
const win = (t, a, b) => cl((t - a) / (b - a));
const smooth = k => { k = cl(k); return k * k * (3 - 2 * k); };
const inOut = k => { k = cl(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(2 - 2 * k, 3) / 2; };
const easeOut = k => 1 - Math.pow(1 - cl(k), 3);
// fast start, a little past 1, then settles back (the overshoot half of anticipation)
const settle = (k, s = 1.6) => { const d = cl(k) - 1; return 1 + (s + 1) * d * d * d + s * d * d; };
function xorshift(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
const layer = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

// ── value noise ──
const LAT = (() => { const r = xorshift(166), v = new Float32Array(65536); for (let i = 0; i < v.length; i++) v[i] = r(); return v; })();
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const a = xi & 255, b = yi & 255, a1 = (a + 1) & 255, b1 = (b + 1) & 255;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const p = LAT[b * 256 + a], q = LAT[b * 256 + a1], r = LAT[b1 * 256 + a], s = LAT[b1 * 256 + a1];
  const top = p + (q - p) * ux, bot = r + (s - r) * ux;
  return top + (bot - top) * uy;
}
function fbm(x, y, oct = 5) {
  let sum = 0, amp = 0.5, f = 1, tot = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f + i * 19.7, y * f - i * 7.3); tot += amp; amp *= 0.5; f *= 2.02; }
  return sum / tot;
}

// ── palette: the Black Paintings' earths, and the light that breaks them ──
const C = {
  black: [7, 6, 5], umber: [30, 24, 17], bistre: [49, 40, 27], olive: [66, 63, 45], ochre: [136, 113, 50],
  bone: [196, 183, 146], pale: [224, 212, 178], cream: [240, 228, 192], white: [255, 247, 226], gold: [212, 170, 92],
  amber: [140, 102, 52], slate: [30, 35, 30], deep: [12, 15, 12], foam: [206, 199, 174], cold: [196, 202, 204],
};
const rgb = (c, a = 1) => (a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`);
const mixC = (a, b, k) => [mix(a[0], b[0], k), mix(a[1], b[1], k), mix(a[2], b[2], k)];
function ramp(stops, k) {
  k = cl(k);
  for (let i = 1; i < stops.length; i++) if (k <= stops[i][0]) {
    const [k0, c0] = stops[i - 1], [k1, c1] = stops[i];
    return mixC(c0, c1, (k - k0) / (k1 - k0));
  }
  return stops[stops.length - 1][1];
}
// a bristle carries a little more white or a little more black than the load it came from
const tint = (c, k) => (k >= 0 ? mixC(c, C.bone, k) : mixC(c, C.black, -k));
const SKY_RAMP = [[0, C.black], [0.16, C.umber], [0.32, C.bistre], [0.48, C.olive], [0.66, C.ochre], [0.84, C.bone], [1, C.pale]];
const LIT_RAMP = [[0, C.bistre], [0.22, [124, 106, 74]], [0.42, C.amber], [0.6, C.gold], [0.8, C.cream], [1, C.white]];
const LIGHT_RAMP = [[0, C.umber], [0.16, C.bistre], [0.32, C.amber], [0.5, C.gold], [0.72, C.cream], [1, C.white]];
const SEA_RAMP = [[0, C.black], [0.14, C.deep], [0.3, C.slate], [0.48, [62, 63, 48]], [0.68, [120, 114, 88]], [1, C.bone]];
const ROCK_RAMP = [[0, C.black], [0.2, C.umber], [0.4, C.bistre], [0.62, [100, 82, 46]], [1, C.bone]];

// ── the brush ──
// One loaded stroke: a curved body of paint, then bristles that drag lighter and darker pigment and
// lift off raggedly at both ends. `bias` bows every stroke the same way (strokes laid along an arc).
// Always consumes the same number of random draws for a given width.
function brush(g, R, x, y, ang, len, wid, col, alpha = 0.9, bend = 0.22, bias = 0) {
  const ca = Math.cos(ang), sa = Math.sin(ang), nx = -sa, ny = ca;
  const b = ((R() - 0.5) * 2 * bend + bias) * len;
  const x0 = x - ca * len / 2, y0 = y - sa * len / 2, x1 = x + ca * len / 2, y1 = y + sa * len / 2;
  const mx = x + nx * b, my = y + ny * b;
  g.lineCap = 'round';
  g.globalAlpha = alpha * 0.8; g.strokeStyle = rgb(col); g.lineWidth = wid;
  g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(mx, my, x1, y1); g.stroke();
  const n = 3 + Math.min(7, wid / 5 | 0);
  g.lineCap = 'butt';
  for (let i = 0; i < n; i++) {
    const o = ((i + 0.5) / n - 0.5) * wid * 0.95, u0 = R() * 0.2, u1 = 1 - R() * 0.25, um = (u0 + u1) / 2;
    const at = u => { const v = 1 - u; return [v * v * x0 + 2 * v * u * mx + u * u * x1 + nx * o, v * v * y0 + 2 * v * u * my + u * u * y1 + ny * o]; };
    const p = at(u0), q = at(u1), m = at(um);
    g.globalAlpha = alpha * (0.2 + R() * 0.5);
    g.strokeStyle = rgb(tint(col, (R() - 0.5) * 0.26));
    g.lineWidth = Math.max(0.7, wid / n * (0.45 + R() * 0.7));
    g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo(2 * m[0] - (p[0] + q[0]) / 2, 2 * m[1] - (p[1] + q[1]) / 2, q[0], q[1]); g.stroke();
  }
}

// Lays a smooth version of a colour field first, so gaps between strokes show paint, not canvas.
function underpaint(cvs, rect, colour, inside, step = 8) {
  const w = Math.ceil(rect.w / step) + 1, h = Math.ceil(rect.h / step) + 1;
  const sm = layer(w, h), sg = sm.getContext('2d'), img = sg.createImageData(w, h);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const x = rect.x + i * step, y = rect.y + j * step;
    if (inside && !inside(x, y)) continue;
    const c = colour(x, y, 0), o = (j * w + i) * 4;
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  sg.putImageData(img, 0, 0);
  const g = cvs.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.imageSmoothingQuality = 'high';
  g.drawImage(sm, -step / 2 * rect.ps, -step / 2 * rect.ps, w * step * rect.ps, h * step * rect.ps);
}

// Covers a layer with strokes, coarse to fine. Field functions work in scene units (frame pixels at
// zoom 1); the canvas holds `rect` at rect.ps× resolution. A pass can keep its strokes to some places.
function paint(cvs, rect, f) {
  const g = cvs.getContext('2d'), R = xorshift(f.seed);
  g.setTransform(rect.ps, 0, 0, rect.ps, -rect.x * rect.ps, -rect.y * rect.ps);
  for (const p of f.passes) for (let i = 0; i < p.n; i++) {
    const x = rect.x + R() * rect.w, y = rect.y + R() * rect.h, j = R() * 2 - 1, aj = (R() - 0.5) * p.jit, lk = R(), wk = R();
    if (f.inside && !f.inside(x, y)) continue;
    if (p.keep && !p.keep(x, y)) continue;
    const s = f.size ? f.size(x, y) : 1, len = mix(p.len[0], p.len[1], lk) * s;
    brush(g, R, x, y, f.angle(x, y) + aj, len, mix(p.wid[0], p.wid[1], wk) * s,
      f.colour(x, y, j), p.alpha ?? 0.9, p.bend ?? 0.22, f.curve ? f.curve(x, y) * len : 0);
  }
  g.globalAlpha = 1;
}

// ── the scene, in frame pixels at zoom 1 ──
const HZ = 772;                       // horizon: the sky fills more than 70 % of the wide frame
const SUN = { x: 1400, y: 338 };      // where the storm tears open
const FIG = { x: 598, y: 800 };       // the watcher's back foot, on the ledge
const FS = 1.24;                      // the watcher is ~97 units tall: ~120 px at the widest framing
// the headland's skyline, left to right: the ledge, the cliff edge, the sea face, the foot running into the water
const CLIFF = [[-130, 797], [-70, 791], [-20, 788], [30, 795], [80, 792], [130, 800], [180, 803], [232, 807], [280, 810], [326, 805],
  [370, 808], [412, 803], [450, 803], [478, 795], [500, 791], [522, 798], [560, 799], [600, 800], [636, 801], [664, 807], [686, 820],
  [697, 843], [706, 874], [718, 903], [736, 928], [762, 944], [796, 956], [836, 971], [884, 993], [944, 1024], [1012, 1061], [1084, 1102], [1150, 1144]];
const CLIFF_PATH = (() => { const p = new Path2D(); p.moveTo(-130, 1144); for (const [x, y] of CLIFF) p.lineTo(x, y); p.closePath(); return p; })();
function cliffTop(x) {
  if (x <= CLIFF[0][0]) return CLIFF[0][1];
  for (let i = 1; i < CLIFF.length; i++) if (x <= CLIFF[i][0]) {
    const [x0, y0] = CLIFF[i - 1], [x1, y1] = CLIFF[i];
    return mix(y0, y1, (x - x0) / (x1 - x0));
  }
  return 1e9;
}
const SKY_RECT = { x: -170, y: -130, w: 2260, h: 1000, ps: PS };
const SCUD_RECT = { x: -560, y: -130, w: 3040, h: 760, ps: 1 };
const LIGHT_RECT = { x: 300, y: -170, w: 1950, h: 1000, ps: PS };
const SEA_RECT = { x: -70, y: HZ - 80, w: W + 140, h: H - HZ + 160, ps: PS };
const ROCK_RECT = { x: -140, y: 775, w: 1300, h: 380, ps: 2 };

// ── the vortex's own frame: centred on the tear, tilted, squashed ──
const TILT = -0.2, SQ = 0.66, CT = Math.cos(TILT), ST = Math.sin(TILT);
function vloc(x, y) { const dx = x - SUN.x, dy = y - SUN.y; return [dx * CT + dy * ST, (-dx * ST + dy * CT) / SQ]; }
function vworld(u, v) { v *= SQ; return [SUN.x + u * CT - v * ST, SUN.y + u * ST + v * CT]; }
function vdir(a) { const ux = Math.cos(a), uy = Math.sin(a) * SQ; return Math.atan2(ux * ST + uy * CT, ux * CT - uy * ST); }
const SPILL = 1.98;   // the side the light pours out of, in the tear's frame: down toward the sea, a little toward the watcher

// ── sky: three great cloud masses with bone-black bellies; their undersides catch the horizon light ──
const MASSES = [
  { x: 360, y: 90, rx: 700, ry: 270, rot: 0.08 },     // over the upper left, behind the title
  { x: 1440, y: 200, rx: 640, ry: 150, rot: TILT },  // the belly the light tears along its lower edge
  { x: 640, y: 630, rx: 560, ry: 95, rot: -0.04 },   // a low bank over the sea, ending where the light falls to the water
  { x: 1920, y: 560, rx: 380, ry: 190, rot: -0.6 },  // a dark shoulder of cloud biting into the far side of the gap
];
function massField(x, y) {
  let m = 0;
  for (let i = 0; i < MASSES.length; i++) {
    const M = MASSES[i], c = Math.cos(M.rot), s = Math.sin(M.rot), dx = x - M.x, dy = y - M.y;
    const a = (dx * c + dy * s) / M.rx, b = (-dx * s + dy * c) / M.ry;
    const d = Math.hypot(a, b) + 0.45 * (fbm(x / 240 + i * 17, y / 170 - i * 5, 4) - 0.5);
    m = Math.max(m, smooth((1 - d) / 0.4));
  }
  return m;
}
function cloud(x, y) {   // smaller billows inside the masses and the gaps
  const u = x / 420, v = y / 240;
  const wx = fbm(u * 0.9 + 3.1, v * 0.9 - 1.7, 3), wy = fbm(u * 0.9 - 5.2, v * 0.9 + 2.3, 3);
  return cl((fbm(u + 1.7 * wx, v + 1.3 * wy, 4) - 0.3) / 0.4);
}
function skyColour(x, y, j) {
  const h = cl((y + 130) / (HZ + 130)), m = massField(x, y), d = cloud(x, y);
  const under = cl((m - massField(x, y + 34)) * 3), over = cl((m - massField(x, y - 34)) * 3);
  const band = Math.exp(-(((HZ - 60 - y) / 95) ** 2)), brk = cl((fbm(x / 340 + 2, y / 90, 3) - 0.3) * 2.5);
  const behind = Math.exp(-(((x - 650) / 280) ** 2) - (((y - (HZ - 95)) / 80) ** 2));   // a break in the cloud behind the watcher
  let v = mix(0.17 + 0.2 * h - 0.08 * d, 0.004 + 0.05 * (1 - m) + 0.03 * d, m);
  v += (0.42 * band * brk + 0.22 * behind) * (1 - 0.7 * m);
  v += 0.55 * under * (0.35 + 0.65 * h) * (0.6 + 0.4 * d) + 0.1 * over + 0.03 * j;
  return ramp(SKY_RAMP, v);
}
// the same clouds struck from behind by the breaking light: edges that face the tear catch fire
function litColour(x, y, j) {
  const [u, v] = vloc(x, y), r = Math.hypot(u, v) + 1, dx = (SUN.x - x) / r, dy = (SUN.y - y) / r;
  const d = cloud(x, y), rim = cl((d - cloud(x + 24 * dx, y + 24 * dy)) * 5);
  return ramp(LIT_RAMP, 0.06 + 0.26 * Math.exp(-r / 380) + 0.62 * rim + 0.1 * (1 - d) + 0.15 * j);
}
// strokes have no head or tail, so directions are blended as doubled angles; around the tear they fan
// outward (cloud pushed back), and nothing stands more than ~30° off the horizontal
function skyAngle(x, y) {
  const e = 8, mx = massField(x + e, y) - massField(x - e, y), my = massField(x, y + e) - massField(x, y - e);
  const gx = cloud(x + e, y) - cloud(x - e, y), gy = cloud(x, y + e) - cloud(x, y - e);
  const form = Math.atan2(mx, -my), billow = Math.atan2(gx, -gy);
  const wind = -0.12 + 0.5 * (fbm(x / 500 + 9, y / 500, 2) - 0.5);
  const fm = cl(Math.hypot(mx, my) * 10), gb = 0.5 * cl(Math.hypot(gx, gy) * 10) * (1 - fm), wr = 1 - fm - gb;
  const out = Math.atan2(y - SUN.y, x - SUN.x), ko = 0.45 * Math.exp(-Math.hypot(x - SUN.x, (y - SUN.y) * 1.6) / 260);
  const vx = (1 - ko) * (fm * Math.cos(2 * form) + gb * Math.cos(2 * billow) + wr * Math.cos(2 * wind)) + ko * Math.cos(2 * out);
  const vy = (1 - ko) * (fm * Math.sin(2 * form) + gb * Math.sin(2 * billow) + wr * Math.sin(2 * wind)) + ko * Math.sin(2 * out);
  return cl(Math.atan2(vy, vx) / 2, -0.55, 0.55);
}
const nearEdge = (x, y) => { const m = massField(x, y); return (m > 0.05 && m < 0.95) || y > HZ - 190; };

// ── the light behind the storm ──
// A soft field (a small white-hot core, gold, amber, reaching furthest down toward the sea) under long
// translucent sweeps that follow the sky's flow. The crack line itself burns cream, so the first sliver
// of the tear is hot.
const crackV = u => 5 * Math.sin(u / 140 + 0.6) + 3 * Math.sin(u / 23 + 2.1) + 12 * (fbm(u / 110 + 5, 0.5, 3) - 0.5);
function lightColour(x, y, j) {
  const [u, v] = vloc(x, y), th = Math.atan2(v, u), r = Math.hypot(u * 0.8, v);
  const re = r / (1 + 1.3 * Math.max(0, Math.cos(th - SPILL)) ** 2);
  const crack = Math.exp(-(((v - crackV(u)) / 10) ** 2)) * cl(1 - Math.abs(u) / 420);
  return ramp(LIGHT_RAMP, 0.07 + 0.95 * Math.exp(-re / 160) + 0.27 * Math.exp(-re / 450) + 0.3 * crack + 0.05 * j);
}
// ── sea: swells grow toward us; crests break pale ──
function seaColour(x, y, j) {
  const d = cl((y - HZ) / (H - HZ)), p = 0.25 + 1.6 * d;
  const swell = fbm(x / (150 * p) + 4, (y - HZ) / (22 * p), 4);
  const v = mix(0.42, 0.1, Math.pow(d, 0.5)) + (swell - 0.5) * 0.42 + 0.035 * j;
  const cap = cl((swell - 0.68) * 7) * (0.4 + 0.5 * d);
  return mixC(ramp(SEA_RAMP, v), C.foam, cap * 0.6);
}
const seaAngle = (x, y) => -0.05 + 0.3 * (fbm(x / 300, y / 60, 2) - 0.5);
const seaSize = (x, y) => 0.3 + 1.25 * cl((y - HZ) / (H - HZ));
// ── rock: chunky facets, the skyline catching what light there is, the sea face in its own shadow ──
function rockColour(variant) {
  return (x, y, j) => {
    const rim = Math.exp(-(y - cliffTop(x)) / 16), face = cl((x - 650) / 60) * cl((970 - y) / 140);
    const f = fbm(x / 80 + 11, y / 60 - 4, 3), plane = Math.floor(f * 5) / 5, grain = fbm(x / 18, y / 18, 2);
    let c = ramp(ROCK_RAMP, 0.012 + 0.12 * plane + 0.06 * (grain - 0.5) + 0.03 * j + 0.16 * rim - 0.05 * face);
    if (variant === 'warm') c = mixC(c, mixC(C.amber, C.gold, rim), cl(0.6 * rim * rim + 0.12 * plane * Math.max(0, Math.cos(f * 9)) + 0.2 * face));
    return c;
  };
}
const rockAngle = (x, y) => -0.9 + Math.floor(fbm(x / 90 - 3, y / 90 + 8, 2) * 6) * 0.55;

let SKY, SKY_LIT, SCUD, LIGHT, RAYS, SPILLC, FOGLIT, CORE, SEA, GLIT, ROCK, ROCK_WARM, FOGS, WEAVE, VIG, PUFF, DABS, SCR, FIGC, PLUMEC, TXTPAT, STAGES, HALOS;
const mkLayer = r => layer(r.w * r.ps, r.h * r.ps);

function buildSky() {
  const passes = [
    { n: 520, len: [140, 320], wid: [40, 110], jit: 0.22, bend: 0.25 },
    { n: 1400, len: [60, 160], wid: [16, 40], jit: 0.2 },
    { n: 1700, len: [24, 70], wid: [5, 12], jit: 0.16, alpha: 0.75, keep: nearEdge }];
  SKY = mkLayer(SKY_RECT);
  underpaint(SKY, SKY_RECT, skyColour);
  paint(SKY, SKY_RECT, { seed: 11, colour: skyColour, angle: skyAngle, passes });
  // identical strokes (same seed, same widths), lit: shown only around the tear
  SKY_LIT = mkLayer(SKY_RECT);
  underpaint(SKY_LIT, SKY_RECT, (x, y) => mixC(skyColour(x, y, 0), litColour(x, y, -1), 0.5));
  paint(SKY_LIT, SKY_RECT, { seed: 11, colour: litColour, angle: skyAngle, passes });
  // broad scud fragments racing low across the sky (kept where a noise field allows, so they come in rags)
  SCUD = mkLayer(SCUD_RECT);
  const scudR = xorshift(516);
  paint(SCUD, SCUD_RECT, { seed: 515,
    colour: (x, y, j) => ramp(SKY_RAMP, 0.02 + 0.07 * cl((y + 130) / 700) + 0.03 * j),
    angle: (x, y) => -0.08 + 0.4 * (fbm(x / 300, y / 200, 2) - 0.5),
    inside: (x, y) => scudR() < cl((fbm(x / 420 + 7, y / 120 - 2, 4) - 0.52) * 7) * 0.8,
    passes: [{ n: 1100, len: [150, 330], wid: [12, 30], jit: 0.2, alpha: 0.3, bend: 0.3 }] });
}

// A long stroke carried along the sky's flow from (x, y) for `len` px: a translucent tapered body, then
// bristle streaks dragged along it.
function flowLine(x, y, len) {
  const P = [[x, y]]; let a0 = null;
  for (let s = 0; s < len; s += 12) {
    let a = skyAngle(x, y);
    if (a0 !== null && Math.cos(a - a0) < 0) a += Math.PI;
    a0 = a; x += Math.cos(a) * 12; y += Math.sin(a) * 12; P.push([x, y]);
  }
  return P;
}
function sweep(g, R, P, wid, col, alpha) {
  const n = P.length - 1, Nm = [];
  for (let i = 0; i <= n; i++) {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(n, i + 1)], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
    Nm.push([-(b[1] - a[1]) / l, (b[0] - a[0]) / l]);
  }
  const wAt = u => wid * Math.pow(Math.sin(Math.PI * cl(u)), 0.5);
  g.globalAlpha = alpha * 0.7; g.fillStyle = rgb(col);
  g.beginPath();

const RAIN = (() => { const R = xorshift(7), a = []; for (let i = 0; i < 230; i++) a.push({ x: R() * (W + 400), y: R() * (H + 200), sp: 1300 + 700 * R(), len: 40 + 60 * R(), al: 0.05 + 0.11 * R(), wd: 0.8 + 1.4 * R() }); return a; })();

// ── the title ──
const TITLE = 'ROMANTICISM', SUB = 'Europe, 1800–1850';
const TX = 132, TY = 206, TRACK = 15;

  if (t < 6.5) return;
  ctx.font = '400 84px "Playfair Display"'; ctx.textBaseline = 'alphabetic';
  let x = TX;
  for (let i = 0; i < TITLE.length; i++) {
    const ch = TITLE[i], cw = ctx.measureText(ch).width, t0 = 6.55 + i * 0.075, k = win(t, t0, t0 + 0.65);
    if (k > 0) {
      ctx.globalAlpha = smooth(k * 1.6);
      ctx.shadowColor = 'rgba(8,6,4,0.85)'; ctx.shadowBlur = 24;
      ctx.fillStyle = TXTPAT; ctx.fillText(ch, x, TY + (1 - settle(k, 1.5)) * 22);
    }

  const full = x - TRACK - TX, rk = easeOut(win(t, 7.1, 7.9));

    brush(ctx, R, TX + len / 2, TY + 30, 0.004, len, 4, C.ochre, 0.8, 0.02);
  }

  }

}

function frame(t) {
  const cam = camera(t), f = flash(t), lk = lightK(t), dx = skyDrift(t);
  const vSky = view(cam, 0.6), vScud = view(cam, 0.7), vSea = view(cam, 0.85), vNear = view(cam, 1);
  reset(); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  blit(SKY, SKY_RECT, vSky, 1, 'source-over', dx);
  if (f > 0.01) drawFlash(vSky, dx, f);
  blit(SCUD, SCUD_RECT, vScud, 1 - 0.6 * lk, 'source-over', -48 * t);
  drawOpening(t, vSky, dx);
  if (f > 0.3) drawBolt(vSky, dx, f);
  blit(RAYS, LIGHT_RECT, vSky, 0.55 * smooth(win(t, 5.3, 7.3)), 'screen', dx);
  blit(SEA, SEA_RECT, vSea);
  blit(GLIT, SEA_RECT, vSea, lk * (0.82 + 0.18 * Math.sin(t * 9)), 'lighter');
  drawCaps(t, vSea, lk);
  drawShip(t, vSea, lk);
  const fog = zone => { for (const fg of FOGS) if (fg.zone === zone) {
    const v = view(cam, fg.d);
    blit(fg.cold, fg.rect, v, fg.alpha * (1 - lk), 'source-over', -fg.speed * t);
    blit(fg.warm, fg.rect, v, fg.alpha * lk, 'source-over', -fg.speed * t);
  } };
  fog('far');
  const sp = smooth(win(t, 5.0, 7.0));
  if (sp > 0) {
    blit(SPILLC, LIGHT_RECT, vSky, 0.75 * sp, 'screen', dx);
    blit(FOGLIT, { x: SUN.x - 640, y: HZ - 100, w: 1000, h: 160, ps: 1 }, view(cam, 0.82), 0.9 * sp, 'screen');
  }
  toScene(ctx, vNear); for (const c of CRASHES) drawSwell(t, c); reset();
  fog('mid');
  blit(ROCK, ROCK_RECT, vNear);
  blit(ROCK_WARM, ROCK_RECT, vNear, 0.7 * lk);
  const lantern = drawWatcher(t, vNear, lk);
  drawLanternGlow(lantern, vNear.z);
  toScene(ctx, vNear); for (const c of CRASHES) drawSpray(t, c, vNear); reset();
  fog('near');
  drawRain(t, 1 - smooth(win(t, 5.0, 6.6)));

  if (gl > 0) { ctx.fillStyle = rgb(C.black, gl); ctx.fillRect(0, 0, W, H); }
  if (lk > 0) {   // the light warms what it reaches, most near the tear
    const sx = vSky.ox + (SUN.x + dx) * vSky.z, sy = vSky.oy + SUN.y * vSky.z, gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 1300);
    gr.addColorStop(0, rgb(C.gold, 0.26 * lk)); gr.addColorStop(0.5, rgb(C.amber, 0.12 * lk)); gr.addColorStop(1, rgb(C.amber, 0.03 * lk));
    ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); reset();
  }
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.13; ctx.drawImage(WEAVE, 0, 0); reset();
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(VIG, 0, 0); reset();
  const ck = smooth(win(t, 4.3, 5.4));
  if (ck > 0) {   // the white-hot core, laid on above the varnish so it is the brightest thing in the film
    const sx = vSky.ox + (SUN.x + dx) * vSky.z, sy = vSky.oy + SUN.y * vSky.z;
    ctx.setTransform(vSky.z, 0, 0, vSky.z, sx, sy); ctx.rotate(TILT * 0.8);
    ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = ck; ctx.drawImage(CORE, -210, -90); ctx.drawImage(CORE, -150, -64, 300, 128); reset();
  }

  if (dark > 0) { ctx.fillStyle = rgb(C.black, dark); ctx.fillRect(0, 0, W, H); }
}

window.draw = ({ t }) => { frame(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const pan = (x, t) => { const cam = camera(t), v = view(cam, 1); return +cl((v.ox + x * v.z) / W * 2 - 1, -1, 1).toFixed(3); };
  const ev = [{ k: 'storm', t: 0, d: DUR }];
  for (const c of CRASHES) ev.push({ k: 'swell', t: c.t - 0.8, v: c.s, pan: pan(c.x, c.t) }, { k: 'crash', t: c.t, v: c.s, pan: pan(c.x, c.t) });
  ev.push({ k: 'raise', t: 2.3 }, { k: 'gloom', t: 3.2 });
  for (const [t0, a] of FLASHES) ev.push({ k: 'strike', t: t0, v: a, pan: pan(1200, t0) });
  ev.push({ k: 'thunder', t: 3.68, pan: pan(1200, 3.68) }, { k: 'tear', t: 4.0, d: 0.65 }, { k: 'break', t: 4.55, d: 2.55 },
    { k: 'lower', t: 5.7 }, { k: 'title', t: 6.55, n: TITLE.length, step: 0.075 }, { k: 'subtitle', t: 7.35 }, { k: 'close', t: 9.25 });
  return ev;
};
window.ready = (async () => {
  await Promise.all(['400 84px "Playfair Display"', 'italic 400 34px "Playfair Display"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  buildSprites(); buildSky(); buildLight(); buildStages(); buildSea(); buildRock(); buildFog(); buildSurface();
})();
</script>
