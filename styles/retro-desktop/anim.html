let MENUICON = [];
function cursor(t, [x, y]) {

function safeScreen(t) {

// ── CRT pass ──
function crt(t) {
  const x = ctx; x.setTransform(1, 0, 0, 1, 0, 0); x.fillStyle = '#000'; x.fillRect(0, 0, W, H);

    sy = lerp(1, .003, eIn(a)); sx = lerp(1, .004, eIn(b)); flash = .06 + a * .7;
  }
  x.save(); x.globalAlpha = 1; x.translate(W / 2, H / 2); x.scale(sx, Math.max(sy, .003)); x.drawImage(S, -W / 2, -H / 2); x.restore();

}

window.ready = (async () => {
