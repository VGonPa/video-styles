<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── dada · cut-up photomontage on newsprint ────────────────────────────────────────────────────────
// A tidy front page, THE ORDERLY GAZETTE: "ALL IS IN ORDER" over a gear, a bowler hat, a soap ad and
// an optician's eye. Giant halftone scissors slide in and cut it twice; the page falls apart and its
// pictures and words stay behind as cut-outs. They are pasted back wrong: the headline at fighting
// angles, the gear, eye and hat assembled into one machine head, "BUY" from the soap ad pasted onto
// "NOTHING". The scissors return to snip the D out of ORDER, the letters shuffle and a red R drops in:
// ALL IS IN ERROR. The head tips its hat, a red DADA stamp lands, and the film fades out.
// Pictures are greyscale drawings screened into dots on one 45° grid anchored to the page, so a
// cut-out lines up dot for dot with the page it came from. Everything is drawn from t alone.
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3), eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eBack = (u, s = 1.7) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
const deg = d => d * Math.PI / 180;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

const F = { frak: '"UnifrakturMaguntia"', play: '"Playfair Display"', old: '"Old Standard TT"', anton: '"Anton"', slab: '"Alfa Slab One"', arch: '"Archivo Black"' };
const C = { news: '#e4dcc5', ink: '#151211', red: '#c8371f', gloss: '#ebe7dd', ground: '#2e2a26' };

// ── page: placed at (PX, PY) in world pixels, 1 page unit = 1 px ──
const PX = 60, PY = 12, PW = 1800, PH = 1180;
const HT = 7;                                                  // halftone cell, page units
const SNAP = 2.6;                                              // the page falls apart

// ── texture helpers ──
function grain(g, w, h, amt, seed) {
  const id = g.getImageData(0, 0, w, h), d = id.data, r = rng(seed);
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
}
function fibers(g, w, h, r, density, alpha = 1) {
  g.lineCap = 'round';
  for (let i = 0, n = w * h / density; i < n; i++) {
    const x = r() * w, y = r() * h, a = r() * Math.PI, l = 3 + r() * 10;
    g.strokeStyle = r() < 0.55 ? `rgba(95,72,40,${(0.05 + 0.07 * r()) * alpha})` : `rgba(255,252,240,${0.12 * alpha})`;
    g.lineWidth = 0.5 + r() * 0.7; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
}
function blotches(g, w, h, r, n, a0) {
  for (let i = 0; i < n; i++) {
    const x = r() * w, y = r() * h, rad = 60 + r() * 260, a = a0 * r(), dark = r() < 0.6;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, dark ? `rgba(125,92,45,${a})` : `rgba(255,250,236,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
}
// ink speckle: knocked out of every printed layer so type and dots look pressed, not drawn
let SPECK;
function buildSpeckle() {
  const S = 256, c = mk(S, S), g = c.getContext('2d'), r = rng(5);
  for (let i = 0; i < 1000; i++) { g.fillStyle = `rgba(0,0,0,${0.15 + 0.4 * r()})`; g.beginPath(); g.arc(r() * S, r() * S, 0.3 + r() * 1.0, 0, 7); g.fill(); }
  for (let i = 0; i < 30; i++) { g.fillStyle = `rgba(0,0,0,${0.04 + 0.07 * r()})`; g.beginPath(); g.arc(r() * S, r() * S, 2 + r() * 4, 0, 7); g.fill(); }
  SPECK = c;
}
function knock(g, w, h, R) {
  const p = g.createPattern(SPECK, 'repeat'); p.setTransform(new DOMMatrix().scale(Math.sqrt(R) * 0.8));
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-out'; g.fillStyle = p; g.fillRect(0, 0, w, h); g.restore();
}

// ── halftone: dots on a 45° screen anchored at the origin of the picture's coordinate space ──
// gray: greyscale picture covering [x0, x0+w) × [y0, y0+h). Returns flat [x, y, r, ...] in those coords.
function screenDots(gray, x0, y0, cell = HT, seed = 7, gain = 1.22) {
  const w = gray.width, h = gray.height, s = mk(w, h), sg = s.getContext('2d');
  sg.filter = `blur(${cell * 0.28}px)`; sg.drawImage(gray, 0, 0);
  const d = sg.getImageData(0, 0, w, h).data, r = rng(seed);
  const ux = Math.SQRT1_2 * cell, uy = Math.SQRT1_2 * cell, vx = -uy, vy = ux, c2 = cell * cell;
  let i0 = 1e9, i1 = -1e9, j0 = 1e9, j1 = -1e9;
  for (const [px, py] of [[x0, y0], [x0 + w, y0], [x0, y0 + h], [x0 + w, y0 + h]]) {
    const i = (px * ux + py * uy) / c2, j = (px * vx + py * vy) / c2;
    i0 = Math.min(i0, i); i1 = Math.max(i1, i); j0 = Math.min(j0, j); j1 = Math.max(j1, j);
  }
  const out = [];
  for (let i = Math.floor(i0); i <= Math.ceil(i1); i++) for (let j = Math.floor(j0); j <= Math.ceil(j1); j++) {
    const px = i * ux + j * vx, py = i * uy + j * vy, lx = px - x0, ly = py - y0;
    if (lx < 0 || ly < 0 || lx >= w || ly >= h) continue;
    const k = ((ly | 0) * w + (lx | 0)) * 4, a = d[k + 3] / 255;
    if (a < 0.05) continue;
    const dark = (1 - (d[k] * 0.3 + d[k + 1] * 0.59 + d[k + 2] * 0.11) / 255) * a;
    if (dark < 0.035) continue;
    out.push(px, py, cell * 0.5 * Math.sqrt(dark) * gain * (0.93 + 0.14 * r()));
  }
  return out;
}
function drawDots(g, dots, color, dx = 0, dy = 0) {
  g.fillStyle = color; g.beginPath();
  for (let i = 0; i < dots.length; i += 3) { const x = dots[i] + dx, y = dots[i + 1] + dy; g.moveTo(x + dots[i + 2], y); g.arc(x, y, dots[i + 2], 0, 6.2832); }
  g.fill();
}
// greyscale picture of a page-space box, drawn by fn(g) in page coordinates
function grayBox(box, fn) { const c = mk(box.w, box.h), g = c.getContext('2d'); g.translate(-box.x, -box.y); fn(g); return c; }
// grow a silhouette by m px (union of shifted copies), filled with colour
function dilate(sil, m, color = '#000') {
  const c = mk(sil.width, sil.height), g = c.getContext('2d');
  for (let k = 0; k < 20; k++) { const a = k / 20 * Math.PI * 2; g.drawImage(sil, Math.cos(a) * m, Math.sin(a) * m); }
  g.drawImage(sil, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function shadowOf(sprite, blur) {
  const pad = Math.ceil(blur * 2.5), c = mk(sprite.width + pad * 2, sprite.height + pad * 2), g = c.getContext('2d');
  g.filter = `blur(${blur}px)`; g.drawImage(sprite, pad, pad); g.filter = 'none';
  g.globalCompositeOperation = 'source-in'; g.fillStyle = 'rgb(18,10,4)'; g.fillRect(0, 0, c.width, c.height);
  return c;
}

// ── the pictures (greyscale, page coordinates) ──
const GEAR = { box: { x: 58, y: 600, w: 414, h: 296 }, cx: 265, cy: 748, R: 118, n: 14, depth: 19, Ri: 80, Rh: 34 };
const HAT = { box: { x: 518, y: 558, w: 626, h: 396 }, cx: 830, cy: 760 };
const EYE = { box: { x: 1486, y: 868, w: 250, h: 156 }, cx: 1611, cy: 948 };

function gearOutline(g, cx, cy, R, n, depth) {
  const p = 2 * Math.PI / n, Rr = R - depth;
  for (let k = 0; k < n; k++) {
    const a = k * p;
    g.arc(cx, cy, Rr, a - 0.5 * p, a - 0.25 * p); g.arc(cx, cy, R, a - 0.14 * p, a + 0.14 * p); g.arc(cx, cy, Rr, a + 0.25 * p, a + 0.5 * p);
  }
  g.closePath();
}
function gearWindows(g, cx, cy) {
  const { Ri, Rh } = GEAR, n = 5, half = deg(9);
  for (let k = 0; k < n; k++) {
    const a0 = k * 2 * Math.PI / n + half + deg(-90), a1 = (k + 1) * 2 * Math.PI / n - half + deg(-90);
    g.moveTo(cx + Math.cos(a0) * (Rh + 12), cy + Math.sin(a0) * (Rh + 12));
    g.arc(cx, cy, Ri, a0 + deg(3), a1 - deg(3)); g.arc(cx, cy, Rh + 12, a1, a0, true); g.closePath();
  }
  g.moveTo(cx + 11, cy); g.arc(cx, cy, 11, 0, Math.PI * 2);
}
function gearShape(g) { const { cx, cy, R, n, depth } = GEAR; g.beginPath(); gearOutline(g, cx, cy, R, n, depth); gearWindows(g, cx, cy); g.fill('evenodd'); }
function gearPhoto(g) {
  const { box, cx, cy, R, n, depth, Ri, Rh } = GEAR;
  const bg = g.createRadialGradient(cx - 60, cy - 50, 20, cx, cy, 300); bg.addColorStop(0, '#7a7a7a'); bg.addColorStop(1, '#1e1e1e');
  g.fillStyle = bg; g.fillRect(box.x, box.y, box.w, box.h);
  g.save(); g.filter = 'blur(10px)'; g.fillStyle = 'rgba(0,0,0,0.75)'; g.translate(14, 18); gearShape(g); g.restore();
  const body = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R); body.addColorStop(0, '#f2f2f2'); body.addColorStop(0.55, '#a9a9a9'); body.addColorStop(1, '#5b5b5b');
  g.fillStyle = body; gearShape(g);
  g.save(); g.beginPath(); gearOutline(g, cx, cy, R, n, depth); gearWindows(g, cx, cy); g.clip('evenodd');
  // rim and hub bevels catch the light top-left and fall into shadow bottom-right
  for (const [r0, wd] of [[R - depth - 3, 7], [Ri + 2, 5], [Rh + 2, 6]]) {
    const gl = g.createLinearGradient(cx - r0, cy - r0, cx + r0, cy + r0); gl.addColorStop(0, '#ffffff'); gl.addColorStop(0.5, '#8d8d8d'); gl.addColorStop(1, '#2e2e2e');
    g.strokeStyle = gl; g.lineWidth = wd; g.beginPath(); g.arc(cx, cy, r0, 0, Math.PI * 2); g.stroke();
  }
  const hub = g.createRadialGradient(cx - 12, cy - 12, 2, cx, cy, Rh + 8); hub.addColorStop(0, '#f4f4f4'); hub.addColorStop(1, '#6a6a6a');
  g.fillStyle = hub; g.beginPath(); g.arc(cx, cy, Rh + 8, 0, Math.PI * 2); g.arc(cx, cy, 11, 0, Math.PI * 2, true); g.fill();
  g.strokeStyle = 'rgba(30,30,30,0.7)'; g.lineWidth = 3; g.beginPath(); gearWindows(g, cx, cy); g.stroke();
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3 + 0.3; g.fillStyle = '#3a3a3a'; g.beginPath(); g.arc(cx + Math.cos(a) * (Rh - 4), cy + Math.sin(a) * (Rh - 4), 3.2, 0, 7); g.fill(); }
  g.restore();
  g.strokeStyle = 'rgba(25,25,25,0.8)'; g.lineWidth = 2; g.beginPath(); gearOutline(g, cx, cy, R, n, depth); g.stroke();
}

function hatCrown(g) {
  const { cx } = HAT;
  g.beginPath(); g.moveTo(cx - 146, 822);
  g.bezierCurveTo(cx - 160, 700, cx - 110, 618, cx, 616);
  g.bezierCurveTo(cx + 110, 618, cx + 160, 700, cx + 146, 822);
  g.closePath();
}
function hatShape(g) { g.beginPath(); g.ellipse(HAT.cx, 830, 212, 54, 0, 0, Math.PI * 2); g.fill(); hatCrown(g); g.fill(); }
function hatPhoto(g) {
  const { box, cx } = HAT;
  const bg = g.createLinearGradient(0, box.y, 0, box.y + box.h); bg.addColorStop(0, '#dedede'); bg.addColorStop(1, '#9a9a9a');
  g.fillStyle = bg; g.fillRect(box.x, box.y, box.w, box.h);
  g.save(); g.filter = 'blur(16px)'; g.fillStyle = 'rgba(0,0,0,0.55)'; g.beginPath(); g.ellipse(cx + 30, 880, 240, 34, 0, 0, Math.PI * 2); g.fill(); g.restore();
  // brim, seen from just above: felt top surface, rolled edge
  const br = g.createLinearGradient(cx - 212, 0, cx + 212, 0); br.addColorStop(0, '#3a3a3a'); br.addColorStop(0.35, '#1a1a1a'); br.addColorStop(1, '#101010');
  g.fillStyle = br; g.beginPath(); g.ellipse(cx, 830, 212, 54, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#4c4c4c'; g.lineWidth = 6; g.beginPath(); g.ellipse(cx, 832, 206, 49, 0, deg(10), deg(170)); g.stroke();
  // crown
  const cr = g.createRadialGradient(cx - 62, 680, 10, cx - 20, 720, 210); cr.addColorStop(0, '#8a8a8a'); cr.addColorStop(0.35, '#3e3e3e'); cr.addColorStop(1, '#0e0e0e');
  g.fillStyle = cr; hatCrown(g); g.fill();
  // ribbon band with a small bow on the left
  g.save(); hatCrown(g); g.clip();
  g.fillStyle = '#0b0b0b'; g.beginPath(); g.ellipse(cx, 812, 160, 30, 0, Math.PI, 0); g.lineTo(cx + 160, 832); g.ellipse(cx, 832, 160, 30, 0, 0, Math.PI, false); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(150,150,150,0.55)'; g.lineWidth = 2.5; g.beginPath(); g.ellipse(cx, 784, 150, 26, 0, deg(200), deg(330)); g.stroke();
  g.restore();
  g.fillStyle = '#121212'; g.beginPath(); g.ellipse(cx - 118, 806, 16, 11, -0.4, 0, 7); g.fill();
  g.strokeStyle = '#555'; g.lineWidth = 2; g.beginPath(); g.ellipse(cx - 118, 806, 12, 7, -0.4, deg(200), deg(320)); g.stroke();
  // near lip of the brim, lit
  const lip = g.createLinearGradient(0, 850, 0, 884); lip.addColorStop(0, '#2a2a2a'); lip.addColorStop(1, '#6a6a6a');
  g.strokeStyle = lip; g.lineWidth = 9; g.beginPath(); g.ellipse(cx, 830, 207, 50, 0, deg(20), deg(160)); g.stroke();
}

// eye: local coordinates around (EYE.cx, EYE.cy); opening is the almond between the lids
function eyeOpening(g, ox = EYE.cx, oy = EYE.cy) {
  g.moveTo(ox - 92, oy + 2);
  g.bezierCurveTo(ox - 40, oy - 50, ox + 38, oy - 52, ox + 94, oy - 4);
  g.bezierCurveTo(ox + 44, oy + 36, ox - 36, oy + 40, ox - 92, oy + 2);
  g.closePath();
}
function eyeContour(g, ox = EYE.cx, oy = EYE.cy) { g.ellipse(ox, oy - 10, 124, 74, 0, 0, Math.PI * 2); }
function eyeBaseGray(g) {
  const { cx, cy, box } = EYE;
  const sk = g.createRadialGradient(cx - 20, cy - 30, 10, cx, cy, 170); sk.addColorStop(0, '#d2c9c0'); sk.addColorStop(1, '#8f857c');
  g.fillStyle = sk; g.fillRect(box.x, box.y, box.w, box.h);
  // brow
  const r = rng(77);
  g.lineCap = 'round';
  for (let i = 0; i < 90; i++) {
    const u = r(), x = cx - 98 + u * 186, y = cy - 58 - Math.sin(u * Math.PI) * 14 + (r() - 0.5) * 10;
    g.strokeStyle = `rgba(40,34,30,${0.5 + 0.4 * r()})`; g.lineWidth = 2 + r() * 2.2 * Math.sin(u * Math.PI + 0.3);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 14 + r() * 8, y - 3 - r() * 4); g.stroke();
  }
  // lid crease and its shadow
  g.save(); g.filter = 'blur(6px)'; g.strokeStyle = 'rgba(70,60,52,0.6)'; g.lineWidth = 10;
  g.beginPath(); g.moveTo(cx - 92, cy - 4); g.bezierCurveTo(cx - 40, cy - 62, cx + 40, cy - 64, cx + 96, cy - 10); g.stroke(); g.restore();
  g.strokeStyle = '#5c5048'; g.lineWidth = 3; g.beginPath(); g.moveTo(cx - 88, cy - 8); g.bezierCurveTo(cx - 40, cy - 60, cx + 40, cy - 62, cx + 92, cy - 12); g.stroke();
  // white of the eye, shaded into the corners
  g.save(); g.beginPath(); eyeOpening(g); g.clip();
  const sc = g.createRadialGradient(cx, cy - 6, 14, cx, cy, 110); sc.addColorStop(0, '#f7f7f7'); sc.addColorStop(0.7, '#d6d6d6'); sc.addColorStop(1, '#8e8e8e');
  g.fillStyle = sc; g.fillRect(cx - 100, cy - 60, 200, 110);
  const top = g.createLinearGradient(0, cy - 50, 0, cy - 14); top.addColorStop(0, 'rgba(60,60,60,0.75)'); top.addColorStop(1, 'rgba(60,60,60,0)');
  g.fillStyle = top; g.fillRect(cx - 100, cy - 60, 200, 50);
  g.restore();
  // lower lid
  g.strokeStyle = '#7a6d64'; g.lineWidth = 3; g.beginPath(); g.moveTo(cx - 90, cy + 4); g.bezierCurveTo(cx - 36, cy + 42, cx + 44, cy + 38, cx + 94, cy - 2); g.stroke();
  // upper lashes, outside the opening
  g.strokeStyle = '#141414';
  for (let i = 0; i <= 22; i++) {
    const u = i / 22, x = cx - 86 + u * 176, y = cy + 2 - Math.sin(u * Math.PI) * 44 - u * 4;
    g.lineWidth = 2.6; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 4 + u * 8, y - 9, x + 9 + u * 12, y - 14 + u * 2); g.stroke();
  }
  g.lineWidth = 5; g.beginPath(); g.moveTo(cx - 92, cy + 2); g.bezierCurveTo(cx - 40, cy - 50, cx + 38, cy - 52, cx + 94, cy - 4); g.stroke();
}
const IRIS = { r: 32, dy: -6 };
function irisGray(g) {
  const { cx, cy } = EYE, x = cx, y = cy + IRIS.dy, r = rng(88);
  const ir = g.createRadialGradient(x, y, 6, x, y, IRIS.r); ir.addColorStop(0, '#9d9d9d'); ir.addColorStop(0.7, '#6c6c6c'); ir.addColorStop(1, '#2c2c2c');
  g.fillStyle = ir; g.beginPath(); g.arc(x, y, IRIS.r, 0, 7); g.fill();
  g.lineWidth = 1.6;
  for (let i = 0; i < 46; i++) { const a = i / 46 * Math.PI * 2 + r() * 0.08; g.strokeStyle = `rgba(35,35,35,${0.25 + 0.35 * r()})`; g.beginPath(); g.moveTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); g.lineTo(x + Math.cos(a) * (IRIS.r - 3), y + Math.sin(a) * (IRIS.r - 3)); g.stroke(); }
  g.strokeStyle = '#1c1c1c'; g.lineWidth = 3.5; g.beginPath(); g.arc(x, y, IRIS.r - 1.5, 0, 7); g.stroke();
  g.fillStyle = '#080808'; g.beginPath(); g.arc(x, y, 13, 0, 7); g.fill();
  g.fillStyle = '#ffffff'; g.beginPath(); g.arc(x - 10, y - 12, 6.5, 0, 7); g.fill(); g.beginPath(); g.arc(x + 9, y + 7, 2.5, 0, 7); g.fill();
}
// upper lid: a skin flap whose lower edge carries the lash line; drawn closed, slid up when open
const LID = { h: 96 };
function lidPath(g) {
  const { cx, cy } = EYE;
  g.beginPath(); g.moveTo(cx - 110, cy - 70); g.lineTo(cx + 110, cy - 70); g.lineTo(cx + 110, cy + 4);
  g.bezierCurveTo(cx + 44, cy + 40, cx - 36, cy + 44, cx - 110, cy + 8); g.closePath();
}
function lidGray(g) {
  const { cx, cy } = EYE;
  const sk = g.createLinearGradient(0, cy - 60, 0, cy + 40); sk.addColorStop(0, '#b9afa6'); sk.addColorStop(1, '#988d84');
  g.fillStyle = sk; lidPath(g); g.fill();
  g.strokeStyle = '#141414'; g.lineWidth = 5; g.beginPath(); g.moveTo(cx - 92, cy + 4); g.bezierCurveTo(cx - 36, cy + 40, cx + 44, cy + 36, cx + 94, cy - 2); g.stroke();
}

// ── giant scissors: two halves on a pivot at the origin, blades along +x (blade length SL) ──
const SK = 1.32, SL = 470 * SK, SMARGIN = 9;   // SL: blade length in world px
function scissorHalfGray(g, sign) {
  g.save(); g.scale(1, sign);
  // blade (above the axis for sign = 1)
  const bl = g.createLinearGradient(0, 2, 0, -50); bl.addColorStop(0, '#ffffff'); bl.addColorStop(0.14, '#cdcdcd'); bl.addColorStop(0.34, '#333333'); bl.addColorStop(0.6, '#767676'); bl.addColorStop(1, '#c6c6c6');
  g.fillStyle = bl; g.beginPath(); g.moveTo(-30, 6); g.lineTo(470, 1); g.quadraticCurveTo(400, -18, 300, -30); g.quadraticCurveTo(140, -46, 30, -50); g.quadraticCurveTo(-20, -50, -36, -24); g.closePath(); g.fill();
  const dk = g.createLinearGradient(-40, 0, 200, 0); dk.addColorStop(0, 'rgba(20,20,20,0.55)'); dk.addColorStop(1, 'rgba(20,20,20,0)'); g.fillStyle = dk; g.fill();
  g.strokeStyle = 'rgba(30,30,30,0.6)'; g.lineWidth = 2; g.stroke();

    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 24 * CAM.z; ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fill(); ctx.restore();
    polyPath(ctx, pc.poly.map(([x, y]) => [x + PX, y + PY])); ctx.clip(); ctx.drawImage(PAGEH, PX, PY);
    ctx.restore();
  }
}
function drawScissors(t) {
  const s = scissors(t); if (!s) return;
  for (const [half, a] of [[SCI.dn, s.ang + s.th / 2], [SCI.up, s.ang - s.th / 2]]) {
    ctx.save(); setCam(); ctx.translate(s.x + 34 * s.z, s.y + 50 * s.z); ctx.rotate(a); ctx.globalAlpha = 0.34;
    const pad = (half.shadow.width - half.sprite.width) / 2; ctx.drawImage(half.shadow, -half.ox - pad, -half.oy - pad); ctx.restore();
  }
  for (const [half, a] of [[SCI.dn, s.ang + s.th / 2], [SCI.up, s.ang - s.th / 2]]) {
    ctx.save(); setCam(); ctx.translate(s.x, s.y); ctx.rotate(a); ctx.drawImage(half.sprite, -half.ox, -half.oy); ctx.restore();
  }
}

window.ready = (async () => {
  await Promise.all([`400 100px ${F.frak}`, `900 100px ${F.play}`, `400 20px ${F.old}`, `italic 400 20px ${F.old}`, `700 20px ${F.old}`, `400 100px ${F.anton}`, `400 100px ${F.slab}`, `400 100px ${F.arch}`].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  buildSpeckle(); layoutPage(); buildPictures(); buildPage(); buildItems(); buildCuts(); buildScissors(); buildStamp(); buildBoard(); buildScreen();
})();

window.draw = ({ t }) => {
  CAM = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  setCam(); ctx.drawImage(BOARD, -BM, -BM);
  if (t < SNAP) drawPage(t);
  else {
    drawPieces(t);
    // hovering cut-outs first, then those already pasted down, then whatever is in the air
    const order = ['PRICE', ...Object.keys(FLY)];
    const layers = order.map(id => {
      if (id === 'PRICE') { const it = ITEMS.PRICE, h = hover(it, t, 2.2), u = seg(t, PRICE_DROP, PRICE_DROP + 0.3); return { id, z: 0, draw: () => drawItem(it, u <= 0 ? h : { x: h.x + 40 * eOut(u), y: h.y + 22 * eOut(u), r: lerp(h.r, deg(11), eBack(u)), s: 1, z: lerp(h.z, 0.1, u) }) }; }
      const [t0, d] = FLY[id], rank = t < t0 ? 0 : t < t0 + d ? 2 : 1;
      if (id === 'ORDER') return { id, rank: t >= GAG.snip ? 3 : rank, k: t0, draw: () => { for (let i = 0; i < 5; i++) drawItem(LET[i], letterPose(i, t)); } };
      if (id === 'eye') return { id, rank, k: t0, draw: () => drawEye(flown('eye', t, 0.9), t) };
      if (id === 'gear') return { id, rank, k: t0, draw: () => { const p = flown('gear', t, 0.4); p.r += gearAngle(t); drawItem(ITEMS.gear, p); } };
      if (id === 'hat') return { id, rank, k: t0, draw: () => { const p = flown('hat', t, 1.7), tip = hatTip(t); drawItem(ITEMS.hat, { ...p, y: p.y + tip.dy, r: p.r + tip.r, z: p.z + Math.abs(tip.dy) / 200 }); } };
      return { id, rank, k: t0, draw: () => drawItem(ITEMS[id], flown(id, t, id.length * 0.7)) };
    });
    layers.sort((a, b) => (a.rank ?? 0) - (b.rank ?? 0) || (a.k ?? 0) - (b.k ?? 0)).forEach(l => l.draw());
    const rp = redRPose(t); if (rp) drawSprite(REDR.sprite, REDR.shadow, REDR.R, rp, REDR.w, REDR.h);
  }
  drawScissors(t);
  // the stamp: its shadow closes in, then the impression lands and the frame jumps
  if (t >= ST.t - 0.2) {
    ctx.save(); setCam(); ctx.translate(ST.x, ST.y); ctx.rotate(deg(ST.r));
    if (t < ST.t) { const u = seg(t, ST.t - 0.2, ST.t); ctx.globalAlpha = 0.45 * u; ctx.filter = `blur(${lerp(40, 6, u)}px)`; ctx.fillStyle = '#000'; const s = lerp(1.5, 1.02, eIn(u)); ctx.fillRect(-300 * s + 30 * (1 - u), -128 * s + 40 * (1 - u), 600 * s, 256 * s); ctx.filter = 'none'; }
    else { const v = t - ST.t, s = 1 + 0.07 * Math.exp(-v * 30); ctx.scale(s, s); ctx.globalAlpha = 0.95; ctx.drawImage(STAMP, -STAMP.width / 2, -STAMP.height / 2); }
    ctx.restore();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(LIGHT, 0, 0);
  ctx.fillStyle = GRAIN;   // static: paper does not boil, and a still grain costs the encoder nothing ctx.globalCompositeOperation = 'overlay'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  const fi = 1 - seg(t, 0, 0.45), fo = seg(t, 9.35, 9.98), f = Math.max(eInOut(fi), eInOut(fo));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};

// sound cues for audio.py
window.events = () => {
  const ev = [{ k: 'slide', t: 0.25, d: 0.6 }];
  for (let i = 0; i < S1.n; i++) ev.push({ k: 'snip', t: S1.t0 + i * S1.per + S1.close * 0.8, v: 1 });
  ev.push({ k: 'swish', t: S1.t0 + S1.n * S1.per, d: S2.t0 - S1.t0 - S1.n * S1.per });
  for (let i = 0; i < S2.n; i++) ev.push({ k: 'snip', t: S2.t0 + i * S2.per + S2.close * 0.8, v: 1 });
  ev.push({ k: 'swish', t: S2.t0 + S2.n * S2.per, d: 0.3 });
  ev.push({ k: 'rip', t: SNAP }, { k: 'flutter', t: SNAP, d: 0.9 });
  for (const [id, [t0, d]] of Object.entries(FLY)) ev.push({ k: id === 'gear' ? 'clank' : id === 'hat' ? 'thud' : 'slap', t: t0 + d, v: id === 'BUY' || id === 'NOTHING' ? 1.2 : id === 'eye' ? 0.6 : 1 });
  ev.push({ k: 'slap', t: PRICE_DROP + 0.3, v: 0.5 });
  ev.push({ k: 'swish', t: GAG.in0, d: GAG.in1 - GAG.in0 }, { k: 'snip', t: GAG.snip + GAG.close * 0.8, v: 1.2 }, { k: 'fall', t: GAG.snip + GAG.close, d: 0.6 });
  for (let k = 0; k < 5; k++) if (k !== 2) ev.push({ k: 'hop', t: ERR.t0 + k * ERR.stag + ERR.hop, v: 0.7 });
  ev.push({ k: 'drop', t: ERR.redIn, d: ERR.redD }, { k: 'slap', t: ERR.redIn + ERR.redD, v: 1 });
  for (const [b] of BLINKS) ev.push({ k: 'blink', t: b });
  ev.push({ k: 'whistle', t: 7.35, d: 0.3, up: 1 }, { k: 'whistle', t: 7.66, d: 0.29, up: 0 });
  // gear ratchet: one click per tooth that passes
  let last = 0; for (let x = 4.3; x < 9.6; x += 1 / 240) { const a = gearAngle(x), n = Math.floor(a / (2 * Math.PI / GEAR.n)); if (n > last) { ev.push({ k: 'tick', t: +x.toFixed(4) }); last = n; } }
  ev.push({ k: 'stamp', t: ST.t });
  return ev;
};
</script>
