<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#efe4d6}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Isometric miniature world: the journey of a parcel. It is packed in a tiny workshop, rides a truck along the road,
// gets scanned at the sorting hub, hops into a delivery van and lands on a doorstep; then the camera pulls back over the whole world.
const W = 1920, H = 1080, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DUR = 10, FF = "'Space Grotesk', sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x, s = 1.7) => { const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
function off(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function hexRgb(h) { if (h[0] !== '#') return h.match(/[\d.]+/g).slice(0, 3).map(Number); const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, k) { const A = hexRgb(a), B = hexRgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; }
const DARK = '#3b2946';
const sh = (c, k) => mix(c, DARK, k);

const PAL = { bg: '#efe4d6', wood: '#e9b07c', slab: '#d69a68', grass: '#9fcf8c', grassD: '#b5dc8f', concrete: '#ddd6cd', road: '#5d6178',
  wallA: '#86c3c3', wallB: '#a9d7cf', hubA: '#9aaee3', hubB: '#b3c3ee', kraft: '#d9a066', tape: '#f3d49a', cream: '#fff6ea', ink: '#23263b',
  coral: '#ff7b6b', yellow: '#f2b544', teal: '#86c3c3', green: '#5fb07a', blue: '#6d8bd8', plant: '#5fb07a', pot: '#e7d6c3', belt: '#3b3f58', steel: '#c9ccd8' };

// ---------- iso camera ----------
let S = 60, OX = 960, OY = 540; const CAM = { x: 5, y: 5, z: 1.5 };
let OT = null, TILE = { ox: 0, oy: 0, dz: 0 }, GA = 1;
const CS = 0.8660254;
function P(x, y, z) {
  if (OT) { x = OT.cx + (x - OT.cx) * OT.sxy; y = OT.cy + (y - OT.cy) * OT.sxy; z = OT.zb + (z - OT.zb) * OT.sz + OT.dz; }
  x += TILE.ox - CAM.x; y += TILE.oy - CAM.y; z += TILE.dz - CAM.z;
  return [OX + (x - y) * CS * S, OY + (x + y) * 0.5 * S - z * S];
}
function poly(pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => { const q = P(...p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.closePath(); ctx.fill(); }
function edge(pts) { ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1, scl() * 0.03); ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach((p, i) => { const q = P(...p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); }
function box(x0, y0, z0, x1, y1, z1, c, faces = {}) {
  const top = faces.top || c, left = faces.left || sh(c, 0.16), right = faces.right || sh(c, 0.34);
  poly([[x0, y1, z1], [x1, y1, z1], [x1, y1, z0], [x0, y1, z0]], left);   // +y face
  poly([[x1, y0, z1], [x1, y1, z1], [x1, y1, z0], [x1, y0, z0]], right);  // +x face
  poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], top);
  if (!faces.noEdge) edge([[x0, y1, z1], [x1, y1, z1], [x1, y0, z1]]); // crisp light bevel: the "maquette" look
}
// oriented box: centre (cx,cy), heading th; u = forward, v = left. deco.{front,back,left,right,top}(w,h) draw 2D on a face (100 px = 1 unit)
function obox(cx, cy, th, u0, u1, v0, v1, z0, z1, c, deco = {}) {
  const cs = Math.cos(th), sn = Math.sin(th);
  const Wp = (u, v, z) => [cx + u * cs - v * sn, cy + u * sn + v * cs, z];
  const faces = [{ n: [cs, sn], a: [u1, v0], b: [u1, v1], k: 'front' }, { n: [-cs, -sn], a: [u0, v1], b: [u0, v0], k: 'back' },
    { n: [-sn, cs], a: [u1, v1], b: [u0, v1], k: 'left' }, { n: [sn, -cs], a: [u0, v0], b: [u1, v0], k: 'right' }];
  const vis = [];
  for (const f of faces) {
    if (f.n[0] + f.n[1] <= 1e-4) continue;
    let A = Wp(f.a[0], f.a[1], z1), B = Wp(f.b[0], f.b[1], z1);
    poly([A, B, [B[0], B[1], z0], [A[0], A[1], z0]], deco[f.k + 'C'] || sh(c, 0.25 + 0.09 * (f.n[0] - f.n[1])));
    vis.push([A, B]);
    if (deco[f.k]) { if ((B[0] - A[0]) - (B[1] - A[1]) < 0) [A, B] = [B, A];
      const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
      onFace(A, [(B[0] - A[0]) / L, (B[1] - A[1]) / L, 0], [0, 0, -1], () => deco[f.k](L * 100, (z1 - z0) * 100)); }
  }
  poly([Wp(u0, v0, z1), Wp(u1, v0, z1), Wp(u1, v1, z1), Wp(u0, v1, z1)], deco.topC || c);
  if (deco.top) onFace(Wp(u0, v0, z1), [cs, sn, 0], [-sn, cs, 0], () => deco.top((u1 - u0) * 100, (v1 - v0) * 100));
  if (!deco.noEdge) for (const [A, B] of vis) edge([A, B]);
}
function scl() { return S * (OT ? OT.sxy : 1); }
function cyl(cx, cy, z0, z1, r, c) {
  const k = scl(), rx = r * k * 1.2247, ry = r * k * 0.7071;
  const b = P(cx, cy, z0), tp = P(cx, cy, z1);
  const g = ctx.createLinearGradient(b[0] - rx, 0, b[0] + rx, 0); g.addColorStop(0, sh(c, 0.1)); g.addColorStop(1, sh(c, 0.4));
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(tp[0] - rx, tp[1]); ctx.lineTo(b[0] - rx, b[1]); ctx.ellipse(b[0], b[1], rx, ry, 0, Math.PI, 0, true); ctx.lineTo(tp[0] + rx, tp[1]); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(tp[0], tp[1], rx, ry, 0, 0, 7); ctx.fill();
}
function sphere(x, y, z, r, c) {
  const p = P(x, y, z), R = r * scl() * 1.2247;
  ctx.fillStyle = c; ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(p[0], p[1], R, 0, 7); ctx.clip();
  ctx.fillStyle = sh(c, 0.3); ctx.beginPath(); ctx.rect(p[0] - R, p[1] - R, 2 * R, 2 * R); ctx.moveTo(p[0] - R * 0.25 + R * 1.05, p[1] - R * 0.3); ctx.arc(p[0] - R * 0.25, p[1] - R * 0.3, R * 1.05, 0, Math.PI * 2, true); ctx.fill('evenodd');
  ctx.restore();
}
function cone(cx, cy, z0, z1, r, c) {
  const k = scl(), rx = r * k * 1.2247, ry = r * k * 0.7071, b = P(cx, cy, z0), tp = P(cx, cy, z1);
  ctx.fillStyle = sh(c, 0.3); ctx.beginPath(); ctx.moveTo(tp[0], tp[1]); ctx.lineTo(b[0] - rx, b[1]); ctx.ellipse(b[0], b[1], rx, ry, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(tp[0], tp[1]); ctx.lineTo(b[0] - rx, b[1]); ctx.ellipse(b[0], b[1], rx, ry, 0, Math.PI, Math.PI * 0.62, true); ctx.closePath(); ctx.fill();
}
// draw 2D content onto a plane: origin o, unit vectors u (right), v (down) in world coords; 100 local px = 1 world unit
function onFace(o, u, v, fn) {
  const p0 = P(...o), pu = P(o[0] + u[0], o[1] + u[1], o[2] + u[2]), pv = P(o[0] + v[0], o[1] + v[1], o[2] + v[2]);
  ctx.save(); ctx.transform((pu[0] - p0[0]) / 100, (pu[1] - p0[1]) / 100, (pv[0] - p0[0]) / 100, (pv[1] - p0[1]) / 100, p0[0], p0[1]); fn(); ctx.restore();
}
function shadow(x0, y0, x1, y1, h, z = 0, a = 0.16) { // crisp floor shadow, light from upper-left
  const L = h * 0.42;
  poly([[x0 + 0.1, y0 + 0.15, z], [x1 + 0.1, y0 + 0.15, z], [x1 + L, y0 + 0.15 + L * 0.35, z], [x1 + L, y1 + 0.15 + L * 0.35, z], [x0 + L, y1 + 0.15 + L * 0.35, z], [x0 + 0.1, y1 + 0.15, z]], `rgba(70,40,60,${a})`);
}
function oshadow(cx, cy, th, u0, u1, v0, v1, h, a = 0.16) { // footprint ∪ footprint pushed along the light
  const cs = Math.cos(th), sn = Math.sin(th), L = h * 0.42;
  ctx.fillStyle = `rgba(70,40,60,${a})`; ctx.beginPath();
  for (const [dx, dy] of [[0.08, 0.12], [L, 0.12 + L * 0.35]]) {
    [[u0, v0], [u1, v0], [u1, v1], [u0, v1]].forEach(([u, v], i) => { const q = P(cx + u * cs - v * sn + dx, cy + u * sn + v * cs + dy, 0.01); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath(); }
  ctx.fill('nonzero');
}
// per-object drop animation: falls from above, squashes on landing, settles
function drop(t, t0, o, dur = 0.42) {
  const p = seg(t, t0, t0 + dur); if (p <= 0) return null;
  const land = t - (t0 + dur); let dz = (1 - p * p) * 6, sq = 0;
  if (land > 0) sq = Math.exp(-land * 9) * Math.sin(land * 26) * 0.16;
  return { cx: o[0], cy: o[1], zb: o[2], dz, sxy: 1 + sq * 0.5, sz: 1 - sq, alpha: clamp(p * 4) };
}
function withOT(o, fn) { if (!o) return; const prev = OT; OT = o; ctx.globalAlpha = GA * (o.alpha ?? 1); fn(); ctx.globalAlpha = GA; OT = prev; }
const ALWAYS = { cx: 0, cy: 0, zb: 0, dz: 0, sxy: 1, sz: 1, alpha: 1 };

// ---------- the parcel ----------
const PH = 0.42, PZ = 0.62; // half footprint, height
function parcelBox(x, y, z, th = 0, o = {}) {
  const sq = o.sq || 0; // squash on landing
  const h = PH * (1 + sq * 0.5), hz = PZ * (1 - sq);
  obox(x, y, th, -h, h, -h, h, z, z + hz, PAL.kraft, {
    top: (w, d) => { if (o.tape === 0) return; ctx.fillStyle = PAL.tape; ctx.fillRect(0, d / 2 - 9, w * (o.tape ?? 1), 18); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, d / 2 - 9, w * (o.tape ?? 1), 5); },
    left: (w, hh) => { const s = o.label ?? 1; if (s <= 0) return; ctx.save(); ctx.translate(w * 0.5, hh * 0.52); ctx.scale(s, s);
      ctx.fillStyle = PAL.cream; ctx.beginPath(); ctx.roundRect(-30, -20, 60, 40, 5); ctx.fill();
      ctx.fillStyle = PAL.ink; for (let i = 0; i < 9; i++) ctx.fillRect(-23 + i * 5.2, -13, i % 3 ? 2.2 : 3.4, 17);
      ctx.fillStyle = PAL.coral; ctx.fillRect(-23, 8, 46, 5); ctx.restore(); },
  });
}
// open box being packed on the bench: four flaps fold shut, tape runs across, label is stamped
function packing(t, x, y, z) {
  const T0 = TL.flaps, flap = i => eBack(seg(t, T0 + i * 0.1, T0 + i * 0.1 + 0.2), 1.2); // 0 open → 1 closed
  if (t >= T0 + 0.5) { const tp = eOut(seg(t, TL.tape, TL.tape + 0.25)); parcelBox(x, y, z, 0, { tape: tp, label: eBack(seg(t, TL.label, TL.label + 0.25), 2.4) });
    if (tp > 0 && tp < 1) { const gx = x - PH + 2 * PH * tp; box(gx - 0.12, y - 0.2, z + PZ, gx + 0.14, y + 0.2, z + PZ + 0.32, PAL.coral); }
    return; }
  const x0 = x - PH, x1 = x + PH, y0 = y - PH, y1 = y + PH, zt = z + PZ;
  box(x0, y0, z, x1, y1, zt, PAL.kraft, { top: sh(PAL.kraft, 0.45) });
  const F = (hA, hB, dir, i, c) => { const phi = (1 - flap(i)) * 2.0, L = PH;
    const d = [dir[0] * Math.cos(phi), dir[1] * Math.cos(phi), Math.sin(phi)];
    poly([hA, hB, [hB[0] + d[0] * L, hB[1] + d[1] * L, hB[2] + d[2] * L], [hA[0] + d[0] * L, hA[1] + d[1] * L, hA[2] + d[2] * L]], c); };
  F([x0, y0, zt], [x0, y1, zt], [1, 0], 0, sh(PAL.kraft, 0.08));
  F([x0, y0, zt], [x1, y0, zt], [0, 1], 2, sh(PAL.kraft, 0.04));
  F([x1, y0, zt], [x1, y1, zt], [-1, 0], 1, sh(PAL.kraft, 0.22));
  F([x0, y1, zt], [x1, y1, zt], [0, -1], 3, sh(PAL.kraft, 0.1));
}
// hop along an arc between two points; returns position + landing squash
function hop(t, t0, t1, a, b, hgt) {
  const p = seg(t, t0, t1), e = eInOut(p);
  return { x: lerp(a[0], b[0], e), y: lerp(a[1], b[1], e), z: lerp(a[2], b[2], e) + Math.sin(Math.PI * p) * hgt, zg: lerp(a[2], b[2], e), p,
    sq: t > t1 ? Math.exp(-(t - t1) * 10) * Math.sin((t - t1) * 30) * 0.22 : (p < 0.15 && p > 0 ? 0.18 * Math.sin(p / 0.15 * Math.PI) : 0) };
}

// ---------- timeline ----------
const TL = { box: 0.85, flaps: 1.02, tape: 1.55, label: 1.82, hop1: [1.98, 2.34], truck: [2.42, 4.2], hop2: [4.26, 4.56], belt1: [4.56, 5.42], belt2: [5.42, 5.72],
  hop3: [5.76, 6.06], van: [6.14, 7.02], hop4: [7.08, 7.44], done: 7.5, leave: [7.62, 8.35], pull: [7.45, 8.35], title: 8.05, sink: 9.3 };
const TO = { A: [0, 0], B: [12, 0], C: [12, -12], D: [24, -12] }; // tile origins (10×10 slabs, 2-unit gaps)
const RISE = { A: 0.02, B: 1.15, C: 2.05, D: 4.7 };

// ---------- routes ----------
function mkRoute(pts) { const L = [0]; for (let i = 1; i < pts.length; i++) L.push(L[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return { pts, L, len: L[L.length - 1] }; }
function along(r, s) { s = clamp(s, 0, r.len); let i = 1; while (i < r.L.length - 1 && r.L[i] < s) i++;
  const k = (s - r.L[i - 1]) / (r.L[i] - r.L[i - 1] || 1), a = r.pts[i - 1], b = r.pts[i]; return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; }
function pose(r, s) { const p = along(r, s), q = along(r, s + 0.25), q0 = along(r, s - 0.25); return { x: p[0], y: p[1], th: Math.atan2(q[1] - q0[1], q[0] - q0[0]) }; }
const truckPts = [[7.8, 6.5], [12.5, 6.5]]; for (let i = 1; i <= 16; i++) { const a = Math.PI / 2 * (1 - i / 16); truckPts.push([12.5 + 2 * Math.cos(a), 4.5 + 2 * Math.sin(a)]); }
truckPts.push([14.5, -5.4]);
const TRUCK = mkRoute(truckPts), VAN = mkRoute([[20.5, -4.5], [26.5, -4.5]]), VAN2 = mkRoute([[26.5, -4.5], [32.3, -4.5]]);
function truckAt(t) { const p = seg(t, ...TL.truck); const s = TRUCK.len * eInOut(p); const o = pose(TRUCK, s);
  o.bump = p > 0 && p < 1 ? Math.abs(Math.sin(t * 38)) * 0.035 : 0; o.moving = p > 0 && p < 1;
  const land = t - TL.truck[1]; o.rock = land > 0 ? Math.exp(-land * 7) * Math.sin(land * 20) * 0.05 : 0; return o; }
function vanAt(t) { let o;
  if (t < TL.leave[0]) { const p = seg(t, ...TL.van); o = pose(VAN, VAN.len * eInOut(p)); o.moving = p > 0 && p < 1; const land = t - TL.van[1]; o.rock = land > 0 ? Math.exp(-land * 7) * Math.sin(land * 20) * 0.05 : 0; }
  else { const p = seg(t, ...TL.leave); o = pose(VAN2, VAN2.len * eInOut(p)); o.moving = p > 0 && p < 1; const land = t - TL.leave[1]; o.rock = land > 0 ? Math.exp(-land * 7) * Math.sin(land * 20) * 0.05 : 0; }
  o.bump = o.moving ? Math.abs(Math.sin(t * 36)) * 0.03 : 0; return o; }

// ---------- vehicles (parts are pushed to the painter list individually) ----------
const BED_U = -0.5;
function wheelParts(o, us, push) { for (const u of us) for (const v of [-0.62, 0.62]) { const cx = o.x + u * Math.cos(o.th) - v * Math.sin(o.th), cy = o.y + u * Math.sin(o.th) + v * Math.cos(o.th);
  push(cx + cy - 0.3, () => obox(cx, cy, o.th, -0.24, 0.24, -0.1, 0.1, 0, 0.46, '#2b2d3c', { noEdge: true })); } }
function truckParts(t, o, cargo, push) {
  const cs = Math.cos(o.th), sn = Math.sin(o.th), z = o.bump, at = (u, v) => [o.x + u * cs - v * sn, o.y + u * sn + v * cs];
  const part = (u, v, key, fn) => { const c = at(u, v); push(c[0] + c[1] + key, fn); };
  push(o.x + o.y - 9, () => oshadow(o.x, o.y, o.th, -1.5, 1.5, -0.68, 0.68, 1.6, 0.15));
  wheelParts(o, [-0.95, 0.95], push);
  part(0, 0, -0.2, () => obox(o.x, o.y, o.th, -1.48, 1.48, -0.6, 0.6, 0.26 + z, 0.5 + z, '#4a4e66', { noEdge: true }));
  part(-0.52, 0, -0.1, () => obox(o.x, o.y, o.th, -1.48, 0.42, -0.64, 0.64, 0.5 + z, 0.64 + z, PAL.wood));
  part(-1.42, 0, 0, () => { const c = at(-1.42, 0); obox(c[0], c[1], o.th, -0.06, 0.06, -0.64, 0.64, 0.64 + z, 1.02 + z, sh(PAL.wood, 0.1)); });
  for (const v of [-0.58, 0.58]) part(-0.52, v, 0, () => { const c = at(-0.52, v); obox(c[0], c[1], o.th, -0.96, 0.94, -0.06, 0.06, 0.64 + z, 1.02 + z, sh(PAL.wood, 0.1)); });
  if (cargo) part(BED_U, 0, 0.02, () => { const c = at(BED_U, 0); parcelBox(c[0], c[1], 0.64 + z, o.th); });
  part(0.95, 0, 0.05, () => { const c = at(0.95, 0); obox(c[0], c[1], o.th, -0.52, 0.52, -0.64, 0.64, 0.5 + z, 1.62 + z + o.rock, PAL.yellow, {
    front: (w, h) => { ctx.fillStyle = '#2c3350'; ctx.beginPath(); ctx.roundRect(10, 12, w - 20, h * 0.42, 10); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(22, 18, 16, h * 0.34);
      ctx.fillStyle = PAL.cream; ctx.beginPath(); ctx.arc(20, h - 22, 8, 0, 7); ctx.arc(w - 20, h - 22, 8, 0, 7); ctx.fill(); },
    left: (w, h) => { ctx.fillStyle = '#2c3350'; ctx.beginPath(); ctx.roundRect(w * 0.5, 12, w * 0.42, h * 0.4, 8); ctx.fill(); },
    right: (w, h) => { ctx.fillStyle = '#2c3350'; ctx.beginPath(); ctx.roundRect(w * 0.08, 12, w * 0.42, h * 0.4, 8); ctx.fill(); } }); });
  if (o.moving) puffs(t, TL.truck[0], o, -1.6, push);
}
function vanParts(t, o, push) {
  const cs = Math.cos(o.th), sn = Math.sin(o.th), z = o.bump + o.rock, at = (u, v) => [o.x + u * cs - v * sn, o.y + u * sn + v * cs];
  push(o.x + o.y - 9, () => oshadow(o.x, o.y, o.th, -1.3, 1.3, -0.68, 0.68, 1.8, 0.15));
  wheelParts(o, [-0.78, 0.8], push);
  const side = flip => (w, h) => { // coral stripe, parcel emblem, side window near the cab
    ctx.fillStyle = PAL.coral; ctx.fillRect(0, h * 0.62, w, 16);
    const wx = flip ? w * 0.06 : w * 0.72; ctx.fillStyle = '#2c3350'; ctx.beginPath(); ctx.roundRect(wx, 14, w * 0.22, h * 0.34, 8); ctx.fill();
    const ex = flip ? w * 0.62 : w * 0.34; ctx.fillStyle = PAL.kraft; ctx.beginPath(); ctx.roundRect(ex - 22, h * 0.2, 44, 38, 4); ctx.fill(); ctx.fillStyle = PAL.tape; ctx.fillRect(ex - 22, h * 0.2 + 15, 44, 8); };
  push(o.x + o.y, () => obox(o.x, o.y, o.th, -1.25, 0.72, -0.64, 0.64, 0.28 + z, 1.72 + z, PAL.cream, { left: side(false), right: side(true),

    for (let y = 4.8; y < 6.6; y += 0.45) ground([[2.1, y, 0.02], [2.9, y, 0.02], [2.9, y + 0.05, 0.02], [2.1, y + 0.05, 0.02]], '#e2cfb3');
    ground([[5.3, 0.5], [9.4, 0.5], [9.4, 4.4], [5.3, 4.4]], '#a6d27f'); }, true);
  const d = (t0, o, f, k) => push(k ?? o[0] + o[1], () => withOT(drop(t, t0, o), f));
  const glow = seg(t, TL.done, TL.done + 0.2);
  d(5.2, [2.5, 2.6, 0], () => house(0.8, 0.8, 4.2, 4.4, 2.5, '#ffe3c7', PAL.coral, true, glow));
  d(5.36, [7.3, 2.4, 0], () => house(5.8, 1.0, 8.9, 3.9, 2.2, '#bfe3dc', PAL.blue, false, 0));
  d(5.3, [2.5, 4.75, 0], () => box(2.0, 4.4, 0, 3.0, 5.15, 0.16, '#e2cfb3'), 7.2);
  d(5.5, [4.9, 5.4, 0], () => tree(4.9, 5.2, 0.8));
  d(5.58, [9.3, 5.4, 0], () => pine(9.3, 5.3, 0.9));
  d(5.44, [7.3, 5.8, 0], () => { for (let x = 5.6; x < 8.9; x += 0.45) box(x, 5.75, 0, x + 0.12, 5.87, 0.7, PAL.cream, { noEdge: true }); box(5.6, 5.74, 0.45, 8.85, 5.88, 0.55, PAL.cream, { noEdge: true }); }, 13.1);
  d(5.64, [1.4, 6.25, 0], () => { box(1.36, 6.21, 0, 1.44, 6.29, 0.9, '#7f89a8', { noEdge: true }); box(1.15, 6.05, 0.9, 1.65, 6.45, 1.25, PAL.blue); box(1.65, 6.05, 1.0, 1.7, 6.12, 1.35, PAL.coral, { noEdge: true }); });
  // the delivered parcel waits on the doorstep
  if (t >= TL.hop4[1]) push(2.5 + 4.75 + 0.1, () => { const sq = Math.exp(-(t - TL.hop4[1]) * 10) * Math.sin((t - TL.hop4[1]) * 30) * 0.22; parcelBox(2.5, 4.75, 0.16, 0, { sq }); });
}
function house(x0, y0, x1, y1, h, wall, roof, main, glow) {
  shadow(x0, y0, x1, y1, h + 1.2, 0, 0.13);
  box(x0, y0, 0, x1, y1, h, wall, { noEdge: true });
  const ym = (y0 + y1) / 2, rh = 1.5;
  poly([[x0 - 0.15, y0 - 0.15, h], [x1 + 0.04, y0 - 0.15, h], [x1 + 0.04, ym, h + rh], [x0 - 0.15, ym, h + rh]], sh(roof, 0.05));
  poly([[x1, y0, h], [x1, ym, h + rh], [x1, y1, h]], sh(wall, 0.34));
  poly([[x0 - 0.15, ym, h + rh], [x1 + 0.04, ym, h + rh], [x1 + 0.04, y1 + 0.15, h], [x0 - 0.15, y1 + 0.15, h]], roof);
  edge([[x0 - 0.15, ym, h + rh], [x1 + 0.04, ym, h + rh]]);
  const win = (c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(0, 0, 60, 60, 8); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(27, 0, 6, 60); ctx.fillRect(0, 27, 60, 6); };
  const lit = mix('#8fb5d6', '#ffd36b', glow);
  if (main) {
    onFace([x0 + 1.35, y1 + 0.01, 1.7], [1, 0, 0], [0, 0, -1], () => { ctx.fillStyle = PAL.blue; ctx.beginPath(); ctx.roundRect(0, 0, 80, 170, [12, 12, 0, 0]); ctx.fill(); ctx.fillStyle = PAL.yellow; ctx.beginPath(); ctx.arc(64, 90, 6, 0, 7); ctx.fill(); });
    onFace([x0 + 0.35, y1 + 0.01, 1.85], [1, 0, 0], [0, 0, -1], () => win(lit));
    onFace([x0 + 2.55, y1 + 0.01, 1.85], [1, 0, 0], [0, 0, -1], () => win(lit));
    onFace([x1 + 0.01, y1 - 0.6, 1.85], [0, -1, 0], [0, 0, -1], () => { win(lit); ctx.translate(-130, 0); win(lit); });
  } else {
    onFace([x0 + 0.5, y1 + 0.01, 1.6], [1, 0, 0], [0, 0, -1], () => { win('#8fb5d6'); ctx.translate(120, 0); win('#8fb5d6'); ctx.translate(-20, 0); });
    onFace([x1 + 0.01, y1 - 0.8, 1.6], [0, -1, 0], [0, 0, -1], () => win('#8fb5d6'));
  }
}

// ---------- camera ----------
const CK = [ // t, x, y, z, S, stop
  [0, 5.5, 4.6, 2.3, 60, 1], [0.95, 5.3, 4.3, 2.25, 64, 0], [1.75, 5.0, 3.9, 2.1, 76, 1], [2.35, 6.6, 5.0, 1.8, 66, 0], [3.3, 13.4, 3.0, 1.6, 60, 0], [4.45, 16.6, -6.2, 1.3, 62, 1],
  [6.05, 19.8, -6.2, 1.4, 62, 0], [7.15, 27.4, -7.4, 1.7, 64, 1], [7.45, 27.4, -7.4, 1.7, 64, 1], [8.4, 15.4, -3.4, 1.2, 33.5, 1], [10, 15.4, -3.4, 1.2, 32.5, 1]];
function camAt(t) {
  let i = 0; while (i < CK.length - 2 && t >= CK[i + 1][0]) i++;
  const a = CK[i], b = CK[i + 1], dt = b[0] - a[0], u = clamp((t - a[0]) / dt);
  const tan = (j, c) => { const k = CK[j]; if (k[5] || j === 0 || j === CK.length - 1) return 0; const p = CK[j - 1], n = CK[j + 1]; return (val(n, c) - val(p, c)) / (n[0] - p[0]); };
  const val = (k, c) => c === 4 ? Math.log(k[4]) : k[c];
  const h00 = 2 * u ** 3 - 3 * u ** 2 + 1, h10 = u ** 3 - 2 * u ** 2 + u, h01 = -2 * u ** 3 + 3 * u ** 2, h11 = u ** 3 - u ** 2;
  const f = c => h00 * val(a, c) + h10 * dt * tan(i, c) + h01 * val(b, c) + h11 * dt * tan(i + 1, c);
  return { x: f(1), y: f(2), z: f(3), S: Math.exp(f(4)) };
}

// ---------- background ----------
let BG;
function buildBG() {
  BG = off(W, H); const g = BG.getContext('2d');
  g.fillStyle = PAL.bg; g.fillRect(0, 0, W, H);
  const r = g.createRadialGradient(960, 480, 100, 960, 540, 1150); r.addColorStop(0, 'rgba(255,250,242,0.9)'); r.addColorStop(1, 'rgba(214,190,170,0.5)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
}
function lattice(alpha) {
  ctx.save(); ctx.strokeStyle = `rgba(120,90,80,${alpha})`; ctx.lineWidth = 1.5;
  const step = 2.4, N = 40;
  for (let i = -N; i <= N; i++) { const v = i * step + 11;
    let a = P(v, -N * step, -0.8), b = P(v, N * step, -0.8); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    a = P(-N * step, v - 22, -0.8); b = P(N * step, v - 22, -0.8); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  ctx.restore();
}

// ---------- screen-space tags ----------
function tag(p, s, text, col) {
  if (s <= 0) return;
  ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(s, s); ctx.font = `700 30px ${FF}`; const w = ctx.measureText(text).width + 86;
  ctx.fillStyle = 'rgba(59,41,70,0.22)'; ctx.beginPath(); ctx.roundRect(-w / 2 + 5, -30, w, 54, 27); ctx.fill();
  ctx.fillStyle = PAL.cream; ctx.beginPath(); ctx.roundRect(-w / 2, -36, w, 54, 27); ctx.moveTo(-9, 16); ctx.lineTo(0, 32); ctx.lineTo(11, 16); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(-w / 2 + 30, -9, 15, 0, 7); ctx.fill();
  ctx.strokeStyle = PAL.cream; ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-w / 2 + 23, -9); ctx.lineTo(-w / 2 + 28, -3); ctx.lineTo(-w / 2 + 37, -15); ctx.stroke();
  ctx.fillStyle = PAL.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, -w / 2 + 56, -8);
  ctx.restore();
}

function tileState(name, t) {
  const r = RISE[name], p = seg(t, r, r + 0.5);
  const order = { A: 0, B: 1, C: 2, D: 3 }[name], q0 = TL.sink + order * 0.08, q = seg(t, q0, q0 + 0.45);
  const dz = -(1 - eBack(p, 1.3)) * 9 + (q > 0 ? (q < 0.25 ? Math.sin(q / 0.25 * Math.PI) * 0.8 : -Math.pow((q - 0.25) / 0.75, 2) * 16) : 0);
  return { ox: TO[name][0], oy: TO[name][1], dz, alpha: clamp(p * 3) * (1 - seg(q, 0.55, 1)) };
}

function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; GA = 1; ctx.drawImage(BG, 0, 0);
  const c = camAt(t); S = c.S; CAM.x = c.x; CAM.y = c.y; CAM.z = c.z;
  TILE = { ox: 0, oy: 0, dz: 0 };
  lattice(0.07 * seg(t, 0, 0.8) * (1 - seg(t, 9.3, 9.8)));
  const ST = {}; for (const k of 'ABCD') ST[k] = tileState(k, t);
  const ground_ = [], items = [];
  const inTile = (k, fn) => () => { const s = ST[k]; if (s.alpha <= 0) return; const pT = TILE, pG = GA; TILE = s; GA = s.alpha; ctx.globalAlpha = GA; fn(); TILE = pT; GA = pG; ctx.globalAlpha = GA; };
  const tiles = { A: tileA, B: tileB, C: tileC, D: tileD };
  for (const k of ['A', 'C', 'B', 'D']) tiles[k](t, (key, fn, isGround) => (isGround ? ground_ : items).push({ k: key + TO[k][0] + TO[k][1], f: inTile(k, fn) }));
  // bridges across the gaps (grow out once both neighbours stand)
  const bridge = (k, x0, y0, x1, y1, t0) => { const p = eOut(seg(t, t0, t0 + 0.3)); if (p <= 0) return;
    const s = ST[k]; if (s.alpha <= 0) return; ground_.push({ k: 50, f: () => { const pT = TILE; TILE = { ox: 0, oy: 0, dz: s.dz }; GA = s.alpha; ctx.globalAlpha = GA;
      const X1 = lerp(x0, x1, x1 - x0 > y1 - y0 ? p : 1), Y1 = lerp(y0, y1, x1 - x0 > y1 - y0 ? 1 : p);
      box(x0, y0, -0.35, X1, Y1, 0, PAL.road, { noEdge: true }); TILE = pT; GA = 1; ctx.globalAlpha = 1; } }); };
  bridge('B', 10, 5.7, 12, 7.3, 1.5); bridge('C', 13.7, -2, 15.3, 0, 2.4); bridge('D', 22, -5.3, 24, -3.7, 5.0);
  // vehicles and the flying parcel (world coordinates)
  const push = (k, fn) => items.push({ k, f: fn });
  const inWorld = (k, fn) => () => { const s = ST[k], pT = TILE; TILE = { ox: 0, oy: 0, dz: s.dz }; GA = s.alpha; ctx.globalAlpha = GA; if (GA > 0) fn(); TILE = pT; GA = 1; ctx.globalAlpha = 1; };
  const tr = truckAt(t), tTile = t < TL.truck[0] ? 'A' : (t < TL.truck[1] ? 'B' : 'C');
  const truckDrop = drop(t, 0.75, [7.8, 6.5, 0], 0.4);
  if (truckDrop) truckParts(t, tr, t >= TL.hop1[1] && t < TL.hop2[0], (k, fn) => push(k, inWorld(tTile, () => withOT(t < 1.6 ? truckDrop : ALWAYS, fn))));
  const vn = vanAt(t), vTile = t < TL.van[1] ? 'C' : 'D';
  const vanDrop = drop(t, 3.1, [20.5, -4.5, 0], 0.4);
  if (vanDrop) vanParts(t, vn, (k, fn) => push(k, inWorld(vTile, () => withOT(t < 4 ? vanDrop : ALWAYS, fn))));
  const flyer = (h, th = 0) => { if (h.p <= 0 || h.p >= 1) return; push(h.x + h.y + 0.05, inWorld('A', () => {
    const g = P(h.x, h.y, h.zg), k = S * (1 - clamp((h.z - h.zg) / 4) * 0.45); // ground shadow anchors the hop in depth
    ctx.fillStyle = 'rgba(70,40,60,0.18)'; ctx.beginPath(); ctx.ellipse(g[0], g[1], k * 0.62, k * 0.36, 0, 0, 7); ctx.fill();
    parcelBox(h.x, h.y, h.z, th, { sq: h.sq }); })); };
  if (t >= TL.hop1[0] && t < TL.hop1[1]) flyer(hop(t, ...TL.hop1, [4.6, 3.4, 1.55], [7.8 + BED_U, 6.5, 0.64], 1.6));
  if (t >= TL.hop2[0] && t < TL.hop2[1]) { const e = TRUCK.pts[TRUCK.pts.length - 1]; flyer(hop(t, ...TL.hop2, [e[0], e[1] - BED_U, 0.64], [16.1, -7.8, 0.95], 1.3), -Math.PI / 2 * (1 - seg(t, ...TL.hop2))); }
  if (t >= TL.hop3[0] && t < TL.hop3[1]) flyer(hop(t, ...TL.hop3, [20.5, -6.05, 0.95], [20.3, -4.6, 0.6], 1.1));
  if (t >= TL.hop4[0] && t < TL.hop4[1]) flyer(hop(t, ...TL.hop4, [26.5, -4.6, 0.6], [26.5, -7.25, 0.16], 2.0));
  ground_.sort((a, b) => a.k - b.k).forEach(it => it.f());
  items.sort((a, b) => a.k - b.k).forEach(it => it.f());
  // tags: scanned + delivered
  TILE = { ox: 0, oy: 0, dz: 0 };
  const sT = seg(t, 5.05, 5.35) * (1 - seg(t, 6.2, 6.45)); if (sT > 0) { const p = P(18.22, -7.8, 3.3); tag([p[0], p[1] - (1 - eOut(seg(t, 5.05, 5.35))) * 20], eBack(seg(t, 5.05, 5.35), 2.4) * (1 - seg(t, 6.2, 6.45)), 'Scanned', '#4fbf78'); }
  const dT = seg(t, TL.done, TL.done + 0.32); if (dT > 0 && t < TL.pull[1]) { const p = P(26.5, -9.4, 5.6 + ST.D.dz); const fo = 1 - seg(t, 7.95, 8.2); tag(p, eBack(dT, 2.4) * fo, 'Delivered', '#4fbf78'); }
  // title over the whole world
  const tp = seg(t, TL.title, TL.title + 0.5), to = seg(t, 9.2, 9.5);
  if (tp > 0 && to < 1) { ctx.save(); ctx.globalAlpha = eOut(tp) * (1 - to); ctx.translate(960, 150 + (1 - eOut(tp)) * 30);
    ctx.font = `700 76px ${FF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = PAL.ink; ctx.letterSpacing = '-1px'; ctx.fillText('The journey of a parcel', 0, 0);
    ctx.font = `500 30px ${FF}`; ctx.letterSpacing = '6px'; ctx.fillStyle = sh(PAL.coral, 0.25); ctx.fillText('PACKED  ·  CARRIED  ·  SORTED  ·  DELIVERED', 0, 72); ctx.restore(); }
  const fade = Math.max(1 - seg(t, 0, 0.25), seg(t, 9.8, 10));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ---------- sound events (read by events.mjs → audio.py) ----------
window.events = function () {
  const E = [], add = (t, k, o = {}) => E.push({ t: +t.toFixed(3), k, ...o });
  add(0.1, 'thud', { f: 90, v: 0.4 }); add(0.35, 'bloop', { f: 300, v: 0.18 });
  for (const [t0, f] of [[0.45, 700], [0.5, 760], [0.6, 820], [0.62, 640], [0.7, 900], [0.72, 860], [0.8, 780], [0.75, 520]]) add(t0 + 0.42, 'clack', { f, v: 0.22 });
  add(TL.box + 0.34, 'thud', { f: 160, v: 0.3 });
  for (let i = 0; i < 4; i++) add(TL.flaps + i * 0.1 + 0.18, 'clack', { f: 1100 + i * 90, v: 0.2 });
  add(TL.tape, 'zip', { d: 0.25, v: 0.35 }); add(TL.label, 'pop', { f: 1200, v: 0.3 });
  add(TL.hop1[0], 'boing', { f: 280, v: 0.3 }); add(TL.hop1[1], 'thud', { f: 150, v: 0.3 });
  add(RISE.B, 'thud', { f: 80, v: 0.25 }); for (let i = 0; i < 7; i++) add(1.92 + i * 0.07, 'pop', { f: 700 + i * 60, v: 0.12 });
  add(TL.truck[0] - 0.05, 'engine', { d: TL.truck[1] - TL.truck[0] + 0.1, f: 62, v: 0.3 });
  add(RISE.C, 'thud', { f: 80, v: 0.25 }); for (let i = 0; i < 6; i++) add(3.0 + i * 0.1, 'clack', { f: 600 + i * 70, v: 0.16 });
  add(TL.truck[1], 'thud', { f: 120, v: 0.2 });
  add(TL.hop2[0], 'boing', { f: 320, v: 0.3 }); add(TL.hop2[1], 'thud', { f: 160, v: 0.28 });
  add(TL.belt1[0], 'belt', { d: TL.belt2[1] - TL.belt1[0], v: 0.25 });
  add(4.86, 'scan', { v: 0.3 }); add(5.05, 'blip', { f: 1760, v: 0.3 }); add(5.12, 'blip', { f: 2350, v: 0.25 });
  add(TL.hop3[0], 'boing', { f: 360, v: 0.28 }); add(TL.hop3[1], 'thud', { f: 140, v: 0.22 });
  add(RISE.D, 'thud', { f: 80, v: 0.22 });
  add(TL.van[0] - 0.05, 'engine', { d: TL.van[1] - TL.van[0] + 0.1, f: 74, v: 0.26 });
  add(TL.hop4[0], 'boing', { f: 400, v: 0.3 }); add(TL.hop4[1], 'thud', { f: 170, v: 0.3 });
  add(TL.done, 'ding', { v: 0.35 });
  add(TL.leave[0], 'engine', { d: TL.leave[1] - TL.leave[0], f: 74, v: 0.16 });
  add(TL.pull[0], 'whoosh', { d: 1.0, v: 0.18 });
  add(TL.title, 'chime', { f: 784, v: 0.25 }); add(TL.title + 0.08, 'chime', { f: 1175, v: 0.16 });
  for (let i = 0; i < 4; i++) add(TL.sink + i * 0.08 + 0.12, 'bloopdn', { f: 700 - i * 60, v: 0.14 });
  return E.sort((a, b) => a.t - b.t);
};
window.draw = function (job) { frame(job.t); return cv.toDataURL('image/jpeg', job.q || 0.92).split(',')[1]; };
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`700 60px 'Space Grotesk'`, 'The journey of a parcel WORKSHOP SORTING HUB Scanned Delivered'),
  document.fonts.load(`500 30px 'Space Grotesk'`, 'PACKED CARRIED SORTED DELIVERED ·')])).then(buildBG);
</script></body></html>
