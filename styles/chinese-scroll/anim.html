<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── chinese-scroll · a blue-green silk handscroll unrolled right to left ─────────────────────────────
// A rolled silk handscroll lies on a lacquer table → it unrolls right to left: brocade cover, the vertical title
// UPRIVER with an abstract cinnabar seal, then a river mouth where a battened-sail boat waits → the camera pushes in
// and travels along the scroll in the reading direction (right to left): azurite and malachite peaks with hemp-fibre
// texture strokes and moss dots, a waterfall, pines, drifting mist; red-crowned cranes overtake the camera; the boat
// sails upriver → the painted sky turns to dusk, the pavilion lantern flickers and lights as the boat reaches its
// landing → the camera pulls back as the last of the scroll unrolls onto the table, a seal is pressed beside the
// colophon, fade out.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eSine = u => 0.5 - 0.5 * Math.cos(Math.PI * u);
const eOut = u => 1 - Math.pow(1 - u, 3);
const smooth = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
function hash2(x, y, s) { let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(s, 982451653); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, o = 4) { let sum = 0, amp = .5, f = 1, n = 0; for (let i = 0; i < o; i++) { sum += amp * vnoise(x * f, y * f, s + i * 17); n += amp; f *= 2.03; amp *= .5; } return sum / n; }
const rgba = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];

const FONT = '"Yuji Syuku"';
// mineral palette
const INK = [30, 25, 22], AZ = [38, 92, 124], AZL = [86, 138, 158], MAL = [52, 122, 92], MALL = [108, 156, 116],
  OCH = [178, 136, 82], SIEN = [142, 92, 58], CIN = [176, 48, 30], SILK = [214, 190, 142], SILKL = [232, 218, 184];

// ── scroll geometry (painting space: 5200 × 1080, the whole scroll height fills the frame at scale 1) ──
const PW = 5200, SH = 1080, BT = 34, BB = 1046;
const X_COVER = 5080, X_TITLE0 = 4560, X_SEP_R = 4520, X_PAINT0 = 700, X_SEP_L = 660, X_COL0 = 120;
const FGY = 300;                                 // foreground layer canvas starts at this y

// ── timeline ──
const T = { unroll0: 0.35, unroll1: 2.9, cam0: 2.4, cam1: 9.4, zoom0: 2.4, zoom1: 3.9, pull0: 8.3, pull1: 9.45,
  sail0: 2.6, sail1: 8.1, crane0: 3.9, crane1: 7.9, dusk0: 7.1, dusk1: 8.6, lamp: 7.72, boatLamp: 8.15, stamp: 9.1, fade0: 9.45 };
const CX0 = 4061, CX1 = 1133, S0 = 0.72;
function cam(t) {
  const cx = lerp(CX0, CX1, eSine(seg(t, T.cam0, T.cam1)));
  const s = S0 + (1 - S0) * smooth(T.zoom0, T.zoom1, t) - (1 - S0) * smooth(T.pull0, T.pull1, t);
  return { cx, s };
}
const viewLeft = t => { const c = cam(t); return c.cx - 960 / c.s; };
// unroll front: the left roller, always kept just outside the view until the scroll is fully open
function frontCand(t) { return Math.max(0, Math.min(X_COVER - (X_COVER - 2500) * eSine(seg(t, T.unroll0, T.unroll1)), t >= T.unroll1 ? viewLeft(t) - 150 : 1e9)); }
function front(t) { let m = frontCand(0); for (let u = 0; u < t; u += 1 / 60) m = Math.min(m, frontCand(u)); return Math.min(m, frontCand(t)); }

// boat path (upriver = right → left)
const BOAT0 = 4050, BOAT1 = 1880;
const boatY = x => 792 + (x - BOAT1) / (BOAT0 - BOAT1) * 70;
function boatAt(t) { const u = eInOut(seg(t, T.sail0, T.sail1)); const x = lerp(BOAT0, BOAT1, u); return { x, y: boatY(x), sc: lerp(1, .82, u), v: u }; }

// ── textures ──
let TABLE, WEAVE_PAT, PC, FG, MIST = [], GRAIN = [], VIG, SEAL, SEAL_S, LAMP_GLOW;
function buildTable() {
  TABLE = mk(W, H); const g = TABLE.getContext('2d');
  const lw = 480, lh = 270, c = mk(lw, lh), cg = c.getContext('2d'), id = cg.createImageData(lw, lh);
  for (let y = 0; y < lh; y++) for (let x = 0; x < lw; x++) {
    const warp = fbm(x / 90, y / 40, 3, 3) * 6;
    const grain = fbm(x / 70, y / 2.2 + warp, 11, 4), fine = vnoise(x / 3, y * 1.3, 5);
    const l = .75 + .5 * (grain - .5) + .06 * (fine - .5);
    const dx = (x / lw - .45), dy = (y / lh - .4), pool = Math.exp(-(dx * dx * 2.2 + dy * dy * 3.5) * 2.2);
    const k = l * (0.55 + 0.9 * pool), i = (y * lw + x) * 4;
    id.data[i] = 44 * k + 6; id.data[i + 1] = 20 * k + 3; id.data[i + 2] = 14 * k + 3; id.data[i + 3] = 255;
  }
  cg.putImageData(id, 0, 0); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, W, H);
  const gr = g.createLinearGradient(0, 0, W, H * .6); gr.addColorStop(0, 'rgba(255,220,180,.07)'); gr.addColorStop(.4, 'rgba(255,220,180,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function buildWeave() {
  const n = 96, c = mk(n, n), g = c.getContext('2d'), id = g.createImageData(n, n), R = rng(17);
  const row = Array.from({ length: n }, () => R()), col = Array.from({ length: n }, () => R());
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const gapY = (y % 3 === 2) ? 1 : 0, gapX = (x % 3 === 2) ? 1 : 0;
    const v = 244 - 14 * gapY - 12 * gapX + 10 * (row[y] - .5) + 8 * (col[x] - .5) + 6 * (hash2(x, y, 3) - .5);
    const i = (y * n + x) * 4; id.data[i] = v; id.data[i + 1] = v - 2; id.data[i + 2] = v - 6; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0); WEAVE_PAT = ctx.createPattern(c, 'repeat');
  return c;
}
function brocadeTile(base, line, seed) {
  const n = 44, c = mk(n, n), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, n, n);
  g.strokeStyle = line; g.lineWidth = 1.3;
  g.beginPath(); g.moveTo(n / 2, 0); g.lineTo(n, n / 2); g.lineTo(n / 2, n); g.lineTo(0, n / 2); g.closePath(); g.stroke();
  g.fillStyle = line;
  for (const [x, y] of [[n / 2, n / 2], [0, 0], [n, 0], [0, n], [n, n]]) {
    for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; g.beginPath(); g.ellipse(x + Math.cos(a) * 3.2, y + Math.sin(a) * 3.2, 2.2, 1.3, a, 0, TAU); g.fill(); }
  }
  const id = g.getImageData(0, 0, n, n); for (let i = 0; i < id.data.length; i += 4) { const v = (hash2(i, seed, 9) - .5) * 14; id.data[i] += v; id.data[i + 1] += v; id.data[i + 2] += v; }
  g.putImageData(id, 0, 0); return c;
}

// ── mountain / rock builder: silhouette + stacked mineral ridges + hemp-fibre strokes + moss dots, mist-faded base ──
function profile(pk) {
  const N = 90, pts = [], s = pk.seed;
  for (let i = 0; i <= N; i++) {
    const u = i / N, q = Math.abs(2 * u - 1);
    let sh = Math.pow(Math.max(0, 1 - Math.pow(q, pk.p)), 1 / pk.p);
    sh *= 1 + (pk.rough ?? .24) * (fbm(u * 5.5, 1.3, s, 3) - .5) * 2 * (0.3 + 0.7 * sh);
    sh = Math.max(0, sh);
    pts.push([pk.cx + (u - .5) * pk.w + (pk.lean || 0) * pk.h * sh * sh * .25, pk.base - pk.h * sh, sh]);
  }
  return pts;
}
function drawPeak(g, pk) {
  const pts = profile(pk), R = rng(pk.seed * 13 + 1);
  let minX = 1e9, maxX = -1e9, minY = 1e9; for (const p of pts) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); }
  minX -= 14; maxX += 14; const top = minY - 14, bot = pk.base + 6;
  const c = mk(maxX - minX, bot - top), q = c.getContext('2d'); q.translate(-minX, -top);
  const outline = (P) => { q.beginPath(); P.forEach((p, i) => i ? q.lineTo(p[0], p[1]) : q.moveTo(p[0], p[1])); };
  const shape = (P) => { outline(P); q.lineTo(P[P.length - 1][0], pk.base + 6); q.lineTo(P[0][0], pk.base + 6); q.closePath(); };
  const pal = pk.pal, low = pal.low || OCH;
  let gr = q.createLinearGradient(0, pk.base - pk.h, 0, pk.base);
  gr.addColorStop(0, rgba(pal.top)); gr.addColorStop(.38, rgba(pal.mid)); gr.addColorStop(.75, rgba(low)); gr.addColorStop(1, rgba(low));
  shape(pts); q.fillStyle = gr; q.fill();
  q.save(); shape(pts); q.clip();
  // volume: shadowed left flank, light right
  const hg = q.createLinearGradient(pk.cx - pk.w / 2, 0, pk.cx + pk.w / 2, 0);
  hg.addColorStop(0, 'rgba(30,26,20,.28)'); hg.addColorStop(.45, 'rgba(30,26,20,0)'); hg.addColorStop(1, 'rgba(255,245,220,.10)');
  q.fillStyle = hg; q.fillRect(pk.cx - pk.w, pk.base - pk.h - 20, pk.w * 2, pk.h + 40);
  // stacked inner ridges
  const inner = [];
  for (let k = 0; k < (pk.nIn || 0); k++) {
    const w = pk.w * (0.28 + 0.34 * R()), h = pk.h * (0.3 + 0.5 * R());
    inner.push({ cx: pk.cx + (R() - .5) * (pk.w - w) * .95, base: pk.base + 4, w, h, p: 1.7 + R() * 1.6, lean: (R() - .5) * .8, rough: .2, seed: pk.seed * 7 + k * 3 + 1 });
  }
  inner.sort((a, b) => b.h - a.h);
  const curves = [pts];
  for (const ip of inner) {
    const ipts = profile(ip); curves.push(ipts);
    const m = R() < .5 ? pal.top : pal.mid, lit = mixc(m, [235, 235, 210], .18);
    const ig = q.createLinearGradient(0, ip.base - ip.h, 0, ip.base);
    ig.addColorStop(0, rgba(lit, .95)); ig.addColorStop(.3, rgba(m, .92)); ig.addColorStop(.72, rgba(low, .9)); ig.addColorStop(1, rgba(low, .9));
    // soft shadow cast by the ridge on what is behind it
    q.save(); q.translate(-5, -4); outline(ipts); q.strokeStyle = 'rgba(25,30,28,.18)'; q.lineWidth = 9; q.stroke(); q.restore();
    shape(ipts); q.fillStyle = ig; q.fill();
    outline(ipts); q.strokeStyle = rgba(INK, .55 * (pk.inkA ?? 1)); q.lineWidth = (pk.lw || 2.2) * .7; q.stroke();
  }
  // hemp-fibre texture strokes (pima cun)
  const nC = Math.round(pk.w * pk.h / 650 * (pk.cun ?? 1));
  for (let i = 0; i < nC; i++) {
    const cvv = curves[Math.floor(R() * curves.length)], u = .06 + .88 * R(), p = cvv[Math.round(u * 90)];
    if (p[2] < .08) continue;
    const side = u < .5 ? -1 : 1, x0 = p[0] + (R() - .5) * 8, y0 = p[1] + 3 + R() * 26;
    const len = 18 + R() * Math.min(140, pk.h * .3), dx = side * len * (.18 + R() * .32);
    q.beginPath(); q.moveTo(x0, y0); q.quadraticCurveTo(x0 + dx * .2 + side * 6, y0 + len * .55, x0 + dx, y0 + len);
    q.strokeStyle = rgba(INK, (.14 + R() * .2) * (pk.inkA ?? 1)); q.lineWidth = .7 + R() * 1.0; q.stroke();
  }
  // mineral granularity
  for (let i = 0; i < pk.w * pk.h / 90; i++) {
    const x = pk.cx + (R() - .5) * pk.w, y = pk.base - R() * pk.h;
    q.fillStyle = R() < .5 ? 'rgba(255,250,230,.10)' : 'rgba(20,40,40,.10)'; q.fillRect(x, y, 1.6, 1.6);
  }
  // moss dots along ridges (dian)
  if (pk.dots) for (let i = 0; i < pk.dots; i++) {
    const cvv = curves[Math.floor(R() * curves.length)], u = .1 + .8 * R(), p = cvv[Math.round(u * 90)];
    if (p[2] < .25) continue;
    const n = 2 + Math.floor(R() * 4);
    for (let k = 0; k < n; k++) { q.beginPath(); q.ellipse(p[0] + (R() - .5) * 16, p[1] + R() * 7 - 1, 1.4 + R() * 2.2, 1.1 + R() * 1.5, R() * 3, 0, TAU); q.fillStyle = `rgba(22,34,24,${.7 + R() * .25})`; q.fill(); }
  }
  q.restore();
  // contour line
  outline(pts); q.strokeStyle = rgba(INK, .85 * (pk.inkA ?? 1)); q.lineWidth = pk.lw || 2.2; q.lineJoin = 'round'; q.stroke();
  // base dissolves into mist
  if (pk.fade > 0) {
    q.setTransform(1, 0, 0, 1, 0, 0); q.globalCompositeOperation = 'destination-in';
    const y0 = pk.base - pk.h * pk.fade - top, y1 = pk.base - top;
    const fg = q.createLinearGradient(0, y0, 0, y1); fg.addColorStop(0, 'rgba(0,0,0,1)'); fg.addColorStop(.6, 'rgba(0,0,0,.35)'); fg.addColorStop(1, 'rgba(0,0,0,0)');
    q.fillStyle = fg; q.fillRect(0, 0, c.width, c.height);
  }
  g.globalAlpha = pk.alpha ?? 1; g.drawImage(c, minX, top); g.globalAlpha = 1;
}
const PAL_FAR = { top: [118, 148, 158], mid: [146, 160, 150], low: [190, 172, 136] };
const PAL_A = { top: AZ, mid: MAL, low: OCH }, PAL_B = { top: MAL, mid: AZ, low: OCH }, PAL_ROCK = { top: MAL, mid: [140, 132, 92], low: SIEN };

// ── pine: scaly cinnabar-brown trunk, fans of needles over malachite washes ──
function drawPine(g, x, y, h, lean, seed) {
  const R = rng(seed), pts = [];
  for (let i = 0; i <= 20; i++) { const u = i / 20; pts.push([x + lean * h * u + Math.sin(u * 3.1 + seed) * h * .05 * u, y - h * u]); }
  const w0 = h * .05;
  const side = (sgn) => pts.map((p, i) => { const u = i / 20, w = w0 * (1 - .65 * u); return [p[0] + sgn * w, p[1]]; });
  const L = side(-1), Rr = side(1).reverse();
  g.beginPath(); [...L, ...Rr].forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
  g.fillStyle = rgba([112, 70, 44]); g.fill(); g.strokeStyle = rgba(INK, .85); g.lineWidth = 1.5; g.stroke();
  for (let i = 0; i < h / 7; i++) {           // bark scales
    const u = R() * .9, p = pts[Math.round(u * 20)], w = w0 * (1 - .65 * u);
    g.beginPath(); g.arc(p[0] + (R() - .5) * w, p[1], w * .35, .2, Math.PI - .2); g.strokeStyle = rgba(INK, .5); g.lineWidth = 1; g.stroke();
  }
  const clusters = [];
  const nb = 5 + Math.floor(R() * 3);
  for (let b = 0; b < nb; b++) {
    const u = .34 + .62 * (b / (nb - 1)), p = pts[Math.round(u * 20)], dir = (b % 2 ? 1 : -1) * (R() < .2 ? -1 : 1);
    const len = h * (.18 + .22 * R()) * (1 - .45 * u);
    const ex = p[0] + dir * len, ey = p[1] - len * (.05 + .2 * R());
    g.beginPath(); g.moveTo(p[0], p[1]); g.quadraticCurveTo(p[0] + dir * len * .5, p[1] + len * .12, ex, ey);
    g.strokeStyle = rgba([80, 52, 34]); g.lineWidth = Math.max(1.5, w0 * .5 * (1 - .5 * u)); g.stroke();
    g.strokeStyle = rgba(INK, .6); g.lineWidth = 1; g.stroke();
    clusters.push([ex, ey], [lerp(p[0], ex, .55), lerp(p[1], ey, .5) - 4]);
  }
  clusters.push([pts[20][0], pts[20][1]]);
  const r0 = h * .105;
  for (const [cx, cy] of clusters) {
    g.beginPath(); g.ellipse(cx, cy - r0 * .15, r0 * 1.35, r0 * .62, 0, 0, TAU); g.fillStyle = rgba(MAL, .55); g.fill();
    for (let f = 0; f < 3; f++) {
      const fx = cx + (f - 1) * r0 * .8, fy = cy + (f === 1 ? -r0 * .25 : 0), n = 17;
      for (let k = 0; k < n; k++) {
        const a = Math.PI + .25 + (Math.PI - .5) * k / (n - 1);
        g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + Math.cos(a) * r0 * .9, fy + Math.sin(a) * r0 * .75);
        g.strokeStyle = 'rgba(18,40,28,.8)'; g.lineWidth = .9; g.stroke();
      }
    }
  }
}
function drawWillow(g, x, y, h, seed) {
  const R = rng(seed), tx = x + h * .06, ty = y - h * .52;
  g.beginPath(); g.moveTo(x - h * .07, y); g.bezierCurveTo(x - h * .03, y - h * .25, x + h * .1, y - h * .3, tx - h * .03, ty);
  g.lineTo(tx + h * .05, ty + 4); g.bezierCurveTo(x + h * .15, y - h * .3, x + h * .04, y - h * .2, x + h * .08, y); g.closePath();
  g.fillStyle = rgba([96, 70, 48]); g.fill(); g.strokeStyle = rgba(INK, .85); g.lineWidth = 1.5; g.stroke();
  for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + (i - 3) * .32, l = h * (.18 + .1 * R()); g.beginPath(); g.moveTo(tx, ty); g.quadraticCurveTo(tx + Math.cos(a) * l * .5, ty + Math.sin(a) * l * .9, tx + Math.cos(a) * l, ty + Math.sin(a) * l * .7); g.strokeStyle = rgba([80, 58, 40]); g.lineWidth = 2.2; g.stroke(); }
  for (let i = 0; i < 90; i++) {
    const a = -Math.PI / 2 + (R() - .5) * 2.2, r = h * (.08 + .2 * R());
    const sx = tx + Math.cos(a) * r * 1.2, sy = ty + Math.sin(a) * r * .8, len = h * (.25 + .4 * R()), sw = (R() - .5) * 14;
    g.beginPath(); g.moveTo(sx, sy); g.quadraticCurveTo(sx + Math.cos(a) * 14, sy - 6, sx + Math.cos(a) * 16 + sw, sy + len);
    g.strokeStyle = `rgba(${46 + R() * 30},${88 + R() * 30},${48 + R() * 16},${.55 + R() * .35})`; g.lineWidth = 1; g.stroke();
    for (let k = 1; k < 8; k++) { const u = k / 8; g.fillStyle = 'rgba(66,112,58,.55)'; g.fillRect(sx + (Math.cos(a) * 16 + sw) * u * u - 1, sy + len * u, 2, 4); }
  }
}
function drawReeds(g, x0, x1, y, seed) {
  const R = rng(seed);
  for (let x = x0; x < x1; x += 3 + R() * 6) {
    const h = 30 + R() * 70, bend = (R() - .3) * 22;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + bend * .3, y - h * .6, x + bend, y - h);
    g.strokeStyle = `rgba(${60 + R() * 30},${80 + R() * 30},50,${.5 + R() * .4})`; g.lineWidth = .8 + R(); g.stroke();
  }
}
// ── pavilion, ruled-line (jiehua) manner ──
const PAV = { x: 1508, y: 646 };
const LAMP = { x: PAV.x, y: PAV.y - 74 };
function drawPavilion(g) {
  const { x, y } = PAV;
  g.lineJoin = 'round';
  // stone plinth
  g.fillStyle = rgba([196, 184, 156]); g.fillRect(x - 100, y, 200, 24); g.strokeStyle = rgba(INK, .85); g.lineWidth = 1.5; g.strokeRect(x - 100, y, 200, 24);
  for (let i = 1; i < 8; i++) { g.beginPath(); g.moveTo(x - 100 + i * 25, y + (i % 2 ? 0 : 12)); g.lineTo(x - 100 + i * 25, y + (i % 2 ? 12 : 24)); g.moveTo(x - 100, y + 12); g.lineTo(x + 100, y + 12); g.lineWidth = .8; g.stroke(); }
  // steps
  for (let k = 0; k < 3; k++) { g.fillStyle = rgba([186, 174, 146]); g.fillRect(x + 100, y + 6 + k * 6, 16 + k * 8, 6); g.strokeRect(x + 100, y + 6 + k * 6, 16 + k * 8, 6); }
  // back wall shade between columns
