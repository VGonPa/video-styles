<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Low-Poly 3D</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#1a1b4d;overflow:hidden}canvas{display:block}</style>
<!-- three.js r159 (MIT), vendored: no CDN at render time -->
<script src="vendor/three.min.js"></script>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ======================================================================
 * Low-Poly 3D: "Skyhaven", a floating low-poly island.
 * Every mesh is built procedurally and coloured per triangle (one flat
 * colour per face, small seeded tint variation) and lit flat-shaded by a
 * moving sun + hemisphere ambient, with soft shadows and distance fog.
 * The camera orbits while the day turns to dusk; the windmill spins,
 * clouds drift, a balloon inflates and rises; then the whole island
 * shrinks and snaps into a faceted gem under the title.
 * Deterministic: every frame is a pure function of t (seeded RNG only).
 * ====================================================================== */
const W = 1920, H = 1080, PI = Math.PI, TAU = 2 * PI;
const clamp01 = x => Math.min(1, Math.max(0, x)), lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = x => { x = clamp01(x); return x * x * x; };
const backOut = (x, s = 1.7) => { x = clamp01(x) - 1; return 1 + (s + 1) * x * x * x + s * x * x; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* --------------------------------------------------------------- timeline */
const INFLATE = 0.7, BURN = 1.85, LIFT = 2.3;      // balloon
const WINDOWS = [6.15, 6.45, 6.75];                 // windows light up at dusk
const SHRINK0 = 6.95, SHRINK1 = 7.95;                 // island -> gem
const GEM = 7.8, TITLE = 8.25, SUB = 8.65, FADE0 = 9.5, DUR = 10;
const GLINTS = [8.55, 9.1];

/* ------------------------------------------------------------ palettes */
const KEYS = [0, 3.2, 5.9, 7.7, 10];
const PAL = {
  top:  ['#56a6f0', '#6a9ee8', '#6874c6', '#2e2f7c', '#1b1c52'],
  hor:  ['#d2efff', '#fff0d4', '#ffc79c', '#ff9d92', '#7a5aa6'],
  sun:  ['#fff6e8', '#fff1d4', '#ffc98e', '#ff9670', '#ff9ab0'],
  hsky: ['#d4ecff', '#eee6ff', '#dcbde4', '#9c88d4', '#7a6cc4'],
  hgnd: ['#8c8060', '#8e7060', '#7c5474', '#4c3c6e', '#342c60'],
};
const SUNI = [2.3, 2.25, 2.05, 1.7, 0.9], HEMI = [1.35, 1.35, 1.35, 1.35, 1.1];
const SUNEL = [52, 44, 26, 9, 9];
const _ca = new THREE.Color(), _cb = new THREE.Color();
function seg(t) { let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1]) i++; return [i, sstep(0, 1, (t - KEYS[i]) / (KEYS[i + 1] - KEYS[i]))]; }
function palAt(name, t, out) { const [i, u] = seg(t); const ks = PAL[name]; return out.copy(_ca.set(ks[i])).lerp(_cb.set(ks[i + 1]), u); }
function numAt(arr, t) { const [i, u] = seg(t); return lerp(arr[i], arr[i + 1], u); }
const cssAt = (name, t) => '#' + palAt(name, t, new THREE.Color()).getHexString();

/* ------------------------------------------------------------ camera path */
const A0 = -0.35;                                     // orbit start azimuth
const camAz = t => A0 + 0.2 * t;
const camDist = t => lerp(lerp(42, 37, easeInOut(t / 4)), 29, easeInOut((t - 7.3) / 1.3));
const camH = t => lerp(lerp(18, 13.5, easeInOut(t / 5)), 5.2, easeInOut((t - 7.3) / 1.3));
const camTY = t => lerp(-3.4, -2.9, easeInOut((t - 7.3) / 1.3));
// sun: front-left at noon, swings behind the island at sunset
const sunAz = t => lerp(A0 + 0.9, camAz(7.5) + PI - 0.35, easeInOut(t / 8));

/* ------------------------------------------------------------- renderer */
const glc = document.createElement('canvas'); glc.width = W; glc.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, alpha: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd2efff, 60, 170);
const camera = new THREE.PerspectiveCamera(31, W / H, 0.5, 400);

const hemi = new THREE.HemisphereLight(0xd4ecff, 0x8c8060, 1.3); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 110 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 3;
scene.add(sun); scene.add(sun.target);
// gem lights (only at the end)
const gemKey = new THREE.DirectionalLight(0xfff3e6, 0); scene.add(gemKey); scene.add(gemKey.target);
const gemRim = new THREE.DirectionalLight(0xff8ad8, 0); scene.add(gemRim); scene.add(gemRim.target);
const gemFill = new THREE.DirectionalLight(0x7ad8ff, 0); scene.add(gemFill); scene.add(gemFill.target);

/* ------------------------------------------------ flat per-face colouring */
const RNG = mulberry32(51);
function tint(hex, amt, rng = RNG) {   // hex -> THREE.Color with seeded lightness jitter
  const c = new THREE.Color(hex); const hsl = {}; c.getHSL(hsl);
  c.setHSL(hsl.h + (rng() - .5) * amt * 0.08, clamp01(hsl.s + (rng() - .5) * amt * 0.2), clamp01(hsl.l + (rng() - .5) * amt * 0.16)); return c;
}
// jitter vertices (shared positions move together), then split into flat faces coloured by pick(face)
function jitter(g, amt, rng = RNG, keepY = false) {
  const p = g.attributes.position, map = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = p.getX(i).toFixed(3) + ',' + p.getY(i).toFixed(3) + ',' + p.getZ(i).toFixed(3);
    if (!map.has(k)) map.set(k, [(rng() - .5) * amt, keepY ? 0 : (rng() - .5) * amt, (rng() - .5) * amt]);
    const d = map.get(k); p.setXYZ(i, p.getX(i) + d[0], p.getY(i) + d[1], p.getZ(i) + d[2]);
  }
  return g;
}
function faceted(g, pick) {
  if (g.index) g = g.toNonIndexed();
  const p = g.attributes.position, n = p.count / 3, col = new Float32Array(p.count * 3);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), cen = new THREE.Vector3(), nrm = new THREE.Vector3();
  for (let f = 0; f < n; f++) {
    a.fromBufferAttribute(p, 3 * f); b.fromBufferAttribute(p, 3 * f + 1); c.fromBufferAttribute(p, 3 * f + 2);
    cen.copy(a).add(b).add(c).multiplyScalar(1 / 3);
    nrm.subVectors(c, b).cross(new THREE.Vector3().subVectors(a, b)).normalize();
    const cc = pick(f, cen, nrm);
    for (let k = 0; k < 3; k++) { col[9 * f + 3 * k] = cc.r; col[9 * f + 3 * k + 1] = cc.g; col[9 * f + 3 * k + 2] = cc.b; }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals(); return g;
}
const MAT = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.92, metalness: 0 });
function mesh(g, mat = MAT, cast = true, recv = true) { const m = new THREE.Mesh(g, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
const solid = (hexes, amt = 1) => (f) => tint(hexes[f % hexes.length], amt);

/* --------------------------------------------------------------- terrain */
const R = 10, K = 11;
const rimR = th => R * (1 + 0.045 * Math.sin(3 * th + 0.4) + 0.03 * Math.sin(7 * th + 1.3));
const RIV = [[-1.7, -0.3], [0.1, 0.9], [2.2, 1.5], [4.4, 1.8], [6.6, 2.8], [8.4, 3.8], [11.5, 5.2]];
function riverDist(x, z) {
  let d = 1e9;
  for (let i = 0; i < RIV.length - 1; i++) {
    const [ax, az] = RIV[i], [bx, bz] = RIV[i + 1], vx = bx - ax, vz = bz - az;
    const u = clamp01(((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz));
    d = Math.min(d, Math.hypot(x - ax - u * vx, z - az - u * vz));
  }
  return d;
}
const HILL = [-4.3, -3.3], KNOLL = [3.7, -3.9], POND = [-2.1, -0.3], MEADOW = [-3.0, 3.9], HOUSE = [5.9, -1.7];
function hTerrain(x, z) {
  const r = Math.hypot(x, z);
  let h = 0.6 + 0.26 * Math.sin(1.1 * x + 0.3) * Math.cos(0.9 * z - 0.5) + 0.16 * Math.sin(2.3 * x - 1.7 * z);
  h += 3.6 * Math.exp(-((x - HILL[0]) ** 2 + (z - HILL[1]) ** 2) / 8.5);
  h += 0.8 * Math.exp(-((x - KNOLL[0]) ** 2 + (z - KNOLL[1]) ** 2) / 5);
  h = lerp(h, 0.55, 0.8 * Math.exp(-((x - MEADOW[0]) ** 2 + (z - MEADOW[1]) ** 2) / 5));   // flat meadow for the balloon
  const carve = Math.max(sstep(1.3, 0.45, riverDist(x, z)), sstep(2.3, 1.25, Math.hypot(x - POND[0], z - POND[1])));
  h = lerp(h, -0.5, carve);
  return h - 0.4 * sstep(0.78, 1.0, r / R);
}
const island = new THREE.Group(); scene.add(island);
const world = new THREE.Group(); island.add(world);   // everything that shrinks into the gem

function ringStitch(A, B, tris) {   // A, B: arrays of {i, a}; merge-walk by angle
  const na = A.length, nb = B.length; let i = 0, j = 0;
  const angA = k => A[k % na].a + (k >= na ? TAU : 0), angB = k => B[k % nb].a + (k >= nb ? TAU : 0);
  while (i < na || j < nb) {
    if (i < na && (j >= nb || angA(i + 1) < angB(j + 1))) { tris.push([A[i % na].i, B[j % nb].i, A[(i + 1) % na].i]); i++; }
    else { tris.push([A[i % na].i, B[j % nb].i, B[(j + 1) % nb].i]); j++; }
  }
}
function buildPolys(verts, tris, pick, up) {
  const pos = [];
  for (const [a, b, c] of tris) {
    if (a === b || b === c || a === c) continue;
    const A = verts[a], B = verts[b], C = verts[c];
    const nrm = new THREE.Vector3().subVectors(C, B).cross(new THREE.Vector3().subVectors(A, B));
    const cen = A.clone().add(B).add(C).multiplyScalar(1 / 3);
    const flip = up ? nrm.y < 0 : nrm.dot(V3(cen.x, 0, cen.z)) < 0;
    const o = flip ? [A, C, B] : [A, B, C];
    for (const v of o) pos.push(v.x, v.y, v.z);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return faceted(g, pick);
}
// top surface
const tv = [], rings = [];
for (let k = 0; k <= K; k++) {
  const n = k === 0 ? 1 : 6 * k, ring = [];
  for (let i = 0; i < n; i++) {
    let th = (i + 0.5 * (k % 2) + (k > 0 && k < K ? (RNG() - .5) * 0.45 : 0)) / n * TAU;
    const rr = k === 0 ? 0 : k === K ? rimR(th) : (k + (RNG() - .5) * 0.5) / K * rimR(th);
    const x = Math.cos(th) * rr, z = Math.sin(th) * rr;
    ring.push({ i: tv.length, a: th }); tv.push(V3(x, hTerrain(x, z), z));
  }
  rings.push(ring);
}
const ttris = []; for (let k = 0; k < K; k++) ringStitch(rings[k], rings[k + 1], ttris);
const GRASS = ['#7cc86a', '#6cb85e', '#8ed472', '#62ab58', '#86c965'];
const terrainG = buildPolys(tv, ttris, (f, c, nrm) => {
  const y = c.y;
  if (y < -0.05) return tint('#5c9fb0', .5);
  if (y < 0.28) return tint(RNG() < .5 ? '#ecd9a2' : '#e2cc92', .6);
  if (y > 2.2 && nrm.y < 0.82) return tint(RNG() < .6 ? '#a8a296' : '#948d84', .8);
  if (y > 2.6) return tint('#a8d46a', .9);
  return tint(GRASS[Math.floor(RNG() * GRASS.length)], .8);
}, true);
world.add(mesh(terrainG, MAT, true, true));

// rocky underside: strata rings down to a tip
const rim = rings[K];
const LV = [[-0.9, 0.96, 0.25], [-2.4, 0.86, 0.35], [-4.3, 0.69, 0.45], [-6.6, 0.47, 0.5], [-9.0, 0.24, 0.45]];
const sv = rim.map(r => tv[r.i].clone()), srows = [rim.map((r, k) => k)];
for (const [y0, rf, jj] of LV) {
  const row = [];
  for (const r of rim) {
    const th = r.a + (RNG() - .5) * 0.06, rr = rf * rimR(th) * (1 + (RNG() - .5) * 0.12);
    row.push(sv.length); sv.push(V3(Math.cos(th) * rr, y0 + (RNG() - .5) * jj * 2, Math.sin(th) * rr));
  }
  srows.push(row);
}
const tip = sv.length; sv.push(V3(0.4, -11.8, -0.3));
const stris = [], SN = rim.length;
for (let L = 0; L < srows.length - 1; L++) for (let i = 0; i < SN; i++) {
  const a = srows[L][i], b = srows[L][(i + 1) % SN], c = srows[L + 1][i], d = srows[L + 1][(i + 1) % SN];
  stris.push([a, c, b], [b, c, d]);
}
for (let i = 0; i < SN; i++) stris.push([srows[srows.length - 1][i], tip, srows[srows.length - 1][(i + 1) % SN]]);
const STRATA = ['#a8764e', '#8e5f40', '#b08158', '#7a5140', '#6a4838', '#5a3e36'];
const skirtG = buildPolys(sv, stris, (f, c) => {
  const band = Math.min(5, Math.floor(-c.y / 2.1 + (RNG() - .5) * 0.5));
  if (RNG() < 0.12) return tint('#9a938c', .8);
  return tint(STRATA[Math.max(0, band)], .9);
}, false);
world.add(mesh(skirtG, MAT, true, true));

// water: faceted disc under the terrain, visible in river + pond; vertices ripple with t
const WK = 9, wv = [], wr = [];
for (let k = 0; k <= WK; k++) {
  const n = k === 0 ? 1 : 6 * k, ring = [];
  for (let i = 0; i < n; i++) {
    const th = (i + 0.5 * (k % 2)) / n * TAU, rr = k / WK * R * 0.93;
    ring.push({ i: wv.length, a: th }); wv.push(V3(Math.cos(th) * rr, 0, Math.sin(th) * rr));
  }
  wr.push(ring);
}
const wtris = []; for (let k = 0; k < WK; k++) ringStitch(wr[k], wr[k + 1], wtris);
const waterG = buildPolys(wv, wtris, () => tint(['#4bb4e6', '#3aa2d8', '#5ec2ee', '#46addf'][Math.floor(RNG() * 4)], .6), true);
const waterBase = Float32Array.from(waterG.attributes.position.array);
const WMAT = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.28, metalness: 0.05 });
world.add(mesh(waterG, WMAT, false, true));
function updWater(t) {
  const p = waterG.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    p[i + 1] = 0.03 + 0.07 * Math.sin(1.3 * x + 2.2 * t) * Math.cos(1.1 * z - 1.8 * t) + 0.03 * Math.sin(2.7 * z + x + 3.1 * t);
  }
  waterG.attributes.position.needsUpdate = true; waterG.computeVertexNormals();
}

// waterfall: a faceted ribbon over the rim, colours scroll downward
const WFdir = V3(Math.cos(0.43), 0, Math.sin(0.43)), WFside = V3(-WFdir.z, 0, WFdir.x);
const WFP = [[9.2, 0.03], [10.5, 0.0], [11.2, -0.45], [11.6, -1.5], [11.85, -3.2], [12.0, -5.2], [12.1, -7.4], [12.15, -9.6]];
const wfRows = [];
for (let s = 0; s <= 21; s++) {
  const u = s / 21 * (WFP.length - 1), i = Math.min(WFP.length - 2, Math.floor(u)), f = u - i;
  const d = lerp(WFP[i][0], WFP[i + 1][0], f), y = lerp(WFP[i][1], WFP[i + 1][1], f);
  const wdt = lerp(0.85, 0.6, s / 21);
  wfRows.push([-1, 0, 1].map(k => WFdir.clone().multiplyScalar(d).add(WFside.clone().multiplyScalar(k * wdt + (s % 2) * 0.12)).setY(y)));
}
const wfPos = [];
for (let s = 0; s < 21; s++) for (let k = 0; k < 2; k++) {
  const a = wfRows[s][k], b = wfRows[s][k + 1], c = wfRows[s + 1][k], d = wfRows[s + 1][k + 1];
  wfPos.push(a.x, a.y, a.z, c.x, c.y, c.z, b.x, b.y, b.z, b.x, b.y, b.z, c.x, c.y, c.z, d.x, d.y, d.z);
}
const wfG = new THREE.BufferGeometry(); wfG.setAttribute('position', new THREE.Float32BufferAttribute(wfPos, 3));
wfG.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(wfPos.length), 3)); wfG.computeVertexNormals();
const WFMAT = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.4, side: THREE.DoubleSide, emissive: 0x2a5a7a, emissiveIntensity: 0.35 });
world.add(mesh(wfG, WFMAT, false, false));
const WFC = ['#5ec4f0', '#8fd8f6', '#c8f0fc', '#4ab0e2'].map(h => new THREE.Color(h));
function updFall(t) {
  const c = wfG.attributes.color.array;
  for (let f = 0; f < c.length / 9; f++) {
    const s = Math.floor(f / 4), k = Math.floor(f / 2) % 2, tri = f % 2;
    const ph = Math.floor(s - t * 9 + k * 1.5 + tri * 0.5);
    const cc = WFC[((ph % 4) + 4) % 4];
    for (let v = 0; v < 3; v++) { c[9 * f + 3 * v] = cc.r; c[9 * f + 3 * v + 1] = cc.g; c[9 * f + 3 * v + 2] = cc.b; }
  }
  wfG.attributes.color.needsUpdate = true;
}

/* ------------------------------------------------------------ props */
const ground = (x, z) => hTerrain(x, z);
const sways = [];
function pine(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, ground(x, z) - 0.1, z);
  const tr = mesh(faceted(new THREE.CylinderGeometry(0.12 * s, 0.17 * s, 0.7 * s, 5), solid(['#7a5238', '#6a4630'])));
  tr.position.y = 0.35 * s; g.add(tr);
  const greens = [['#2f8a58', '#3a9a62', '#2a7a4e'], ['#3f9a5a', '#4aa866', '#358a50']][RNG() < .5 ? 0 : 1];
  [[1.05, 1.5, 1.05], [0.8, 1.25, 1.65], [0.55, 1.0, 2.2]].forEach(([r, h, y], k) => {
    const cg = jitter(new THREE.ConeGeometry(r * s, h * s, 6, 1), 0.12 * s); cg.rotateY(RNG() * TAU);
    const m = mesh(faceted(cg, () => tint(greens[k], 1))); m.position.y = y * s; g.add(m);
  });
  g.userData.ph = RNG() * TAU; sways.push(g); world.add(g); return g;
}
function roundTree(x, z, s, hex) {
  const g = new THREE.Group(); g.position.set(x, ground(x, z) - 0.1, z);
  const tr = mesh(faceted(new THREE.CylinderGeometry(0.11 * s, 0.16 * s, 1.1 * s, 5), solid(['#7a5238', '#6a4630'])));
  tr.position.y = 0.55 * s; g.add(tr);
  const cg = jitter(new THREE.IcosahedronGeometry(0.85 * s, 0), 0.25 * s);
  const m = mesh(faceted(cg, () => tint(hex, 1.2))); m.position.y = 1.55 * s; m.scale.set(1, 1.12, 1); m.rotation.set(RNG() * 3, RNG() * 3, 0); g.add(m);
  g.userData.ph = RNG() * TAU; sways.push(g); world.add(g); return g;
}
// place trees: avoid river, pond, windmill, house, meadow
const avoid = [[KNOLL, 2.0], [HOUSE, 1.9], [MEADOW, 2.6], [POND, 2.6]];
let placed = 0, tries = 0; const treePts = [];
while (placed < 36 && tries < 4000) {
  tries++;
  const a = RNG() * TAU, r = Math.sqrt(RNG()) * 8.6, x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (riverDist(x, z) < 1.7) continue;
  if (avoid.some(([p, d]) => Math.hypot(x - p[0], z - p[1]) < d)) continue;
  if (treePts.some(([px, pz]) => Math.hypot(x - px, z - pz) < 1.25)) continue;
  treePts.push([x, z]); placed++;
  const s = 0.75 + RNG() * 0.5;
  const nearHill = Math.hypot(x - HILL[0], z - HILL[1]) < 3.4;
  if (nearHill || RNG() < 0.45) pine(x, z, s * 1.05);
  else roundTree(x, z, s, ['#7ccc4e', '#98d450', '#f0a44a', '#e8c65a', '#6cbf52', '#ec7f4e'][Math.floor(RNG() * 6)]);
}
// rocks and flowers
for (let i = 0; i < 9; i++) {

    octx.save(); octx.globalAlpha = 0.8 * su; octx.fillStyle = '#ffd9a8';
    octx.beginPath(); octx.moveTo(W / 2 - w, Y0 + 266); octx.lineTo(W / 2, Y0 + 261); octx.lineTo(W / 2 + w, Y0 + 266); octx.lineTo(W / 2, Y0 + 271); octx.closePath(); octx.fill(); octx.restore();
  }
}

/* ------------------------------------------------------------ scene state */
function setScene(t) {
  // island entrance: rises into place with overshoot
  const e = backOut(t / 1.5, 1.2);
  let s = 1, spin = 0, lift = 0;
  const a = sstep(SHRINK0, SHRINK0 + 0.35, t), b = easeIn((t - SHRINK0 - 0.3) / (SHRINK1 - SHRINK0 - 0.3));
  s = (1 + 0.05 * a) * (1 - b); spin = 1.8 * b * b + 0.12 * a; lift = GEM_C.y * b;
  island.visible = s > 0.002;
  island.position.set(0, lerp(-7, 0, e) + lift, 0);
  island.scale.setScalar(Math.max(s, 0.001)); island.rotation.y = spin + 0.04 * Math.sin(t * 0.6);
  island.rotation.z = 0.015 * Math.sin(t * 0.8); island.rotation.x = 0.012 * Math.cos(t * 0.7);
  updWater(t); updFall(t); updBalloon(t); updClouds(t);
  mill.userData.blades.rotation.z = -(1.2 * t + 0.15 * t * t);
  for (const g of sways) g.rotation.z = 0.025 * Math.sin(t * 1.7 + g.userData.ph);
  const wl = [0, 1, 2].map(i => sstep(WINDOWS[i], WINDOWS[i] + 0.25, t) * 4);
  houseWin[0].emissiveIntensity = wl[0]; houseWin[1].emissiveIntensity = wl[1]; mill.userData.win[0].emissiveIntensity = wl[2];
  for (const g of islets) g.position.y = g.userData.y + 0.4 * Math.sin(t * 0.8 + g.userData.ph);
  // gem
  const gp = backOut((t - GEM) / 0.6, 2.0);
  gem.visible = t > GEM; gem.scale.setScalar(Math.max(0.001, gp));
  gem.rotation.set(0.28 + 0.05 * Math.sin(t * 1.3), 0.9 * t + 2.2 * (1 - easeOut((t - GEM) / 0.9)), 0.08 * Math.sin(t));
  gem.position.set(0, GEM_C.y + 0.25 * Math.sin((t - GEM) * 1.8) * sstep(GEM, GEM + 0.8, t), 0);
  for (const m of shards) {
    const u = (t - GEM + 0.02) / m.userData.life; m.visible = u > 0 && u < 1;
    if (!m.visible) continue;
    const d = m.userData.sp * (1 - Math.pow(1 - u, 2.5)) * 0.9;
    m.position.copy(GEM_C).addScaledVector(m.userData.d, 1.2 + d); m.position.y -= 3 * u * u;
    m.rotation.set(m.userData.rot.x * u, m.userData.rot.y * u, m.userData.rot.z * u); m.scale.setScalar(1 - u * u);
  }
  // camera orbit
  const az = camAz(t), D = camDist(t);
  camera.position.set(Math.cos(az) * D, camH(t) + camTY(t), Math.sin(az) * D);
  camera.lookAt(0, camTY(t), 0);
  // light
  const sa = sunAz(t), el = numAt(SUNEL, t) * PI / 180;
  const dir = V3(Math.cos(sa) * Math.cos(el), Math.sin(el), Math.sin(sa) * Math.cos(el));
  sun.position.copy(dir).multiplyScalar(50); sun.target.position.set(0, 0, 0);
  palAt('sun', t, sun.color); sun.intensity = numAt(SUNI, t);
  palAt('hsky', t, hemi.color); palAt('hgnd', t, hemi.groundColor); hemi.intensity = numAt(HEMI, t);
  palAt('hor', t, scene.fog.color); CLOUDMAT.emissive.copy(scene.fog.color);
  sunMesh.position.copy(dir).multiplyScalar(180); palAt('sun', t, sunMat.color); sunMat.color.lerp(new THREE.Color(0xffffff), 0.35);
  sunMesh.scale.setScalar(1 + 0.3 * sstep(4, 8, t));
  const gl = sstep(GEM - 0.2, GEM + 0.4, t);
  const camDir = camera.position.clone().normalize();
  gemKey.position.copy(camDir).add(V3(0.3, 0.9, 0)).multiplyScalar(30); gemKey.intensity = 2.2 * gl;
  gemRim.position.set(-camDir.x * 30, 10, -camDir.z * 30).add(V3(camDir.z * 20, 0, -camDir.x * 20)); gemRim.intensity = 2.6 * gl;
  gemFill.position.set(camDir.z * 30, -6, -camDir.x * 30); gemFill.intensity = 1.6 * gl;
}

function renderGL() { renderer.render(scene, camera); }

window.ready = (async () => {
  await document.fonts.load("800 184px 'Outfit'", TITLE_TXT);
  await document.fonts.load("300 44px 'Outfit'", SUB_TXT);
  await document.fonts.ready;
  setScene(0); renderGL(); renderer.getContext().finish();
})();

window.draw = ({ t }) => {
  setScene(t); renderGL();
  drawSky(t);
  octx.drawImage(glc, 0, 0);
  // snap flash
  const fl = Math.max(0, 1 - Math.abs(t - GEM - 0.03) / 0.18);
  if (fl > 0) {
    const [x, y] = screenOf(GEM_C); const rg = octx.createRadialGradient(x, y, 0, x, y, 700);
    rg.addColorStop(0, `rgba(255,250,235,${0.95 * fl})`); rg.addColorStop(0.3, `rgba(255,236,210,${0.45 * fl})`); rg.addColorStop(1, 'rgba(255,236,210,0)');
    octx.fillStyle = rg; octx.fillRect(0, 0, W, H);
  }
  // glints on the gem
  if (t > GEM + 0.4) {
    const g1 = gem.localToWorld(V3(0.56 * GEM_R * Math.cos(0.8), 0.42 * GEM_R, 0.56 * GEM_R * Math.sin(0.8)));
    const [x1, y1] = screenOf(g1);
    glint(x1, y1, 70, Math.max(0, 1 - Math.abs(t - GLINTS[0]) / 0.22));
    const [x2, y2] = screenOf(gem.localToWorld(V3(-GEM_R, 0, 0.1)));
    glint(x2, y2, 55, Math.max(0, 1 - Math.abs(t - GLINTS[1]) / 0.2));
  }
  titleLayer(t);
  // graceful fade-out
  const fo = sstep(FADE0, DUR - 0.02, t);
  if (fo > 0) { octx.fillStyle = `rgba(20,18,52,${fo.toFixed(3)})`; octx.fillRect(0, 0, W, H); }
  // fade-in
  const fi = 1 - sstep(0, 0.5, t);
  if (fi > 0) { octx.fillStyle = `rgba(210,239,255,${fi.toFixed(3)})`; octx.fillRect(0, 0, W, H); }
  return out.toDataURL('image/jpeg', 0.92).split(',')[1];
};

window.events = () => [
  { k: 'start', t: 0.0 },
  { k: 'rise', t: 0.05 },
  { k: 'inflate', t: INFLATE },
  { k: 'burn', t: BURN - 0.2, d: 0.6 },
  { k: 'lift', t: LIFT - 0.1, d: 1.0 },
  { k: 'burn', t: 4.1, d: 0.5 },
  ...WINDOWS.map((t, i) => ({ k: 'win', t, i })),
  { k: 'shrink', t: SHRINK0 },
  { k: 'gem', t: GEM },
  ...GLINTS.map(t => ({ k: 'glint', t: t - 0.05 })),
  ...[...TITLE_TXT].map((c, i) => ({ k: 'letter', t: TITLE + i * 0.055, i })),
  { k: 'sub', t: SUB },
];
</script>
</body>
