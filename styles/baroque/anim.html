<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>

<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── baroque · one hard light out of the dark ───────────────────────────────────────────────────
// Black. A hard beam from a high window stutters on and carves a wedge of crimson velvet out of the
// dark, dust turning inside it → the curtain is hauled up into a diagonal swag (a dip of
// anticipation, a heavy spring, overshoot, settle) and its tassels swing in → behind it a vanitas
// on a stone ledge: linen spilling over the edge, a tipped pewter ewer, grapes, a lemon shedding its
// peel, a running hourglass, a candle just snuffed. The camera creeps in while the beam swings
// right and narrows, so the highlights travel across the objects → a gold silk whirls across on the
// diagonal and leaves a gilded title behind it, the light raking its letters → the light irises
// down and the picture fades to black.
// The still life and the title card are G-buffers (albedo, normal, material, light visibility)
// painted once in window.ready. Each frame relights them per pixel under the moving beam, so form
// shadows, speculars and reflected light all answer to the one source. Everything is seeded.
const W = 1920, H = 1080, LEN = 10, PI = Math.PI;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const cl = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const mix = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => cl((t - a) / (b - a));
const ease = k => { k = cl(k); return k * k * (3 - 2 * k); };
const easeIO = k => { k = cl(k); return k < 0.5 ? 4 * k * k * k : 1 - 4 * (1 - k) ** 3; };
const sineIO = k => 0.5 - 0.5 * Math.cos(PI * cl(k));
const newCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const unit = (x, y, z) => { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; };

// sfc32, seeded through a few warm-up rounds
function rng(seed) {
  let a = seed >>> 0, b = 0x85ebca6b, c = 0xc2b2ae35, d = 1;
  const next = () => {
    const t = (((a + b) | 0) + d) | 0;
    d = (d + 1) | 0; a = b ^ (b >>> 9); b = (c + (c << 3)) | 0; c = (c << 21) | (c >>> 11); c = (c + t) | 0;
    return (t >>> 0) / 4294967296;
  };
  for (let i = 0; i < 15; i++) next();
  return next;
}

// smooth value noise on a shuffled lattice, with an fbm helper
function valueNoise(seed) {
  const r = rng(seed), perm = new Uint16Array(512), val = new Float32Array(256);
  for (let i = 0; i < 256; i++) { perm[i] = i; val[i] = r(); }
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)), s = perm[i]; perm[i] = perm[j]; perm[j] = s; }
  for (let i = 0; i < 256; i++) perm[i + 256] = perm[i];
  const n = (x, y) => {
    const xf = Math.floor(x), yf = Math.floor(y), fx = x - xf, fy = y - yf, X = xf & 255, Y = yf & 255;
    const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10), v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const p0 = perm[X] + Y, p1 = perm[X + 1] + Y;
    const a = val[perm[p0]], b = val[perm[p1]], c = val[perm[p0 + 1]], d = val[perm[p1 + 1]];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  n.fbm = (x, y, oct = 4) => {
    let s = 0, amp = 0.5, f = 1, tot = 0;
    for (let i = 0; i < oct; i++) { s += amp * n(x * f + i * 17.3, y * f - i * 9.1); tot += amp; amp *= 0.5; f *= 2.07; }
    return s / tot;
  };
  return n;
}
const hash2 = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ── timeline (seconds) ──
const TL = {
  lift: [0.85, 1.2],      // anticipation, then the curtain is hauled up on a heavy spring
  push: [1.8, 6.6],       // slow dolly into the still life, following the light
  turn: [3.2, 5.6],       // the beam swings right and narrows
  silk: [5.7, 8.5],       // gold silk whirls across, the title behind it
  glint: [7.2, 9.2],      // the light turns over the gilding
  sheen: [7.8, 8.75],     // and one raking highlight runs across the word
  iris: [8.7, 9.55], out: [9.25, 9.97],
};

// ── light: lookup tables shared by the relighting pass and everything drawn by hand ──
const LIN = new Float32Array(256);
for (let i = 0; i < 256; i++) LIN[i] = Math.pow(i / 255, 2.2);
// linear 0..8 → display with a soft shoulder; indexed by √v so the deep shadows keep their gradations
const TONE = new Float32Array(4096), TQ = 4095 / Math.sqrt(8);
for (let i = 0; i < 4096; i++) { const x = (i / TQ) ** 2, m = x * (1 + x / 7.5) / (1 + x); TONE[i] = 255 * Math.pow(Math.min(1, m), 1 / 2.2); }

for (let i = 0; i < 1024; i++) {
  const d = i / 511.5 - 1, w = cl((d + 0.1) / 1.1);
  DIF[i] = ease(w / 0.4) * (0.32 + 0.68 * w);       // a soft terminator, then a long fall-off
  BNC[i] = cl(-d - 0.12) * 0.9;                     // reflected light finds the shadow side
}
const SPEC = new Float32Array(16 * 1024);
for (let l = 0; l < 16; l++) { const e = 3 + (l / 15) ** 2 * 260; for (let j = 0; j < 1024; j++) SPEC[l * 1024 + j] = Math.pow(j / 1023, e); }
const ENV = new Float32Array(256);                   // metals see the lit table below their horizon
for (let i = 0; i < 256; i++) { const ry = i / 127.5 - 1; ENV[i] = 0.05 + 0.3 * Math.exp(-(((ry - 0.42) / 0.12) ** 2)) + 0.06 * Math.exp(-(((ry + 0.55) / 0.2) ** 2)); }
const LC = [2.5, 2.08, 1.55];                        // warm window light (linear)
const AMB = [0.0011, 0.0009, 0.0008];                // the dark is nearly dead
const FILL = [0.03, 0.019, 0.009];                   // a whisper of warm light thrown back by whatever the pool hits
const BOUNCE = [0.11, 0.075, 0.045];
const toByte = v => Math.round(TONE[v >= 8 ? 4095 : v <= 0 ? 0 : (Math.sqrt(v) * TQ) | 0]);
// ±½ LSB ordered dither (4×4 Bayer), added before the 8-bit store so slow falloffs into black don't band
const BAYER = Float32Array.from([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5], v => (v + 0.5) / 16 - 0.5);
const css = (r, g2, b, a = 1) => `rgba(${toByte(r)},${toByte(g2)},${toByte(b)},${a})`;

// a beam: origin, unit axis, half-width (as tan of the half angle), softness, intensity, and the
// matching directional light vector (it comes back up the beam, tilted toward the viewer)
function makeLight(O, T, tw, soft, I, opt = {}) {
  const dx = T[0] - O[0], dy = T[1] - O[1], len = Math.hypot(dx, dy), ax = dx / len, ay = dy / len;
  const rot = opt.az || 0, c = Math.cos(rot), s = Math.sin(rot);
  const fx = -ax * 0.8, fy = -ay * 0.8;
  const [lx, ly, lz] = unit(fx * c - fy * s, fx * s + fy * c, opt.lz || 0.6);
  const [hx, hy, hz] = unit(lx, ly, lz + 1);
  const pc = opt.pc || T;
  return { ox: O[0], oy: O[1], ax, ay, tw, soft, I, lx, ly, lz, hx, hy, hz, px: pc[0], py: pc[1], pr: opt.pr || 760, pool: opt.pool ?? 0.45 };
}
function beamProfile(q, L) {
  const t1 = L.tw + L.soft; if (q >= t1) return 0;
  let k = q <= L.tw - L.soft ? 1 : (t1 - q) / (2 * L.soft);
  k = k * k * (3 - 2 * k);
  return k * (1 - 0.3 * q * q / (L.tw * L.tw));
}
function beamAt(L, x, y) {
  const dx = x - L.ox, dy = y - L.oy, al = dx * L.ax + dy * L.ay;
  if (al <= 0) return 0;
  const q = Math.abs(dy * L.ax - dx * L.ay) / al, px = x - L.px, py = y - L.py, u = (px * px + py * py) / (L.pr * L.pr);
  const spot = 1 / (1 + u * u);
  return beamProfile(q, L) * L.I * (1 - L.pool + L.pool * spot) * Math.max(0.6, 1.2 - al * 1e-4);
}
// the shaft in the air (no pool on a surface): what dust, smoke and the flying silk see
function shaftAt(L, x, y) {
  const dx = x - L.ox, dy = y - L.oy, al = dx * L.ax + dy * L.ay;
  if (al <= 0) return 0;
  return beamProfile(Math.abs(dy * L.ax - dx * L.ay) / al, L) * L.I * Math.max(0.55, 1.15 - al * 1.5e-4);
}
// the same beam in screen space, under a camera that scales by s about (fx, fy)
function camLight(L, cam) {
  return Object.assign({}, L, { ox: (L.ox - cam.fx) * cam.s + cam.fx, oy: (L.oy - cam.fy) * cam.s + cam.fy, px: (L.px - cam.fx) * cam.s + cam.fx, py: (L.py - cam.fy) * cam.s + cam.fy, pr: L.pr * cam.s });
}

// ── G-buffer stages ──
function makeStage() {
  const st = {};
  for (const k of ['A', 'N', 'M', 'S', 'F']) { st[k] = newCanvas(W, H); st[k + 'c'] = st[k].getContext('2d', { willReadFrequently: true }); }
  st.Fc.fillStyle = '#fff'; st.Fc.fillRect(0, 0, W, H);           // F: how much bounce fill a surface takes
  st.Ac.fillStyle = '#000'; st.Ac.fillRect(0, 0, W, H);
  st.Nc.fillStyle = 'rgb(128,128,255)'; st.Nc.fillRect(0, 0, W, H);
  st.Mc.fillStyle = '#000'; st.Mc.fillRect(0, 0, W, H);
  st.Sc.fillStyle = '#fff'; st.Sc.fillRect(0, 0, W, H);
  return st;
}
// brushwork: short strokes laid along a slowly turning flow; the light catches their ridges
function brushField(seed) {
  const c = newCanvas(W, H), x = c.getContext('2d', { willReadFrequently: true }), r = rng(seed), nf = valueNoise(seed + 1);
  x.fillStyle = '#808080'; x.fillRect(0, 0, W, H); x.lineCap = 'round';
  for (let i = 0; i < 14000; i++) {
    const px = r() * W, py = r() * H, a = nf(px / 380, py / 380) * 5 + 0.4, len = 10 + r() * 34, v = 128 + (r() - 0.5) * 120;
    x.strokeStyle = `rgba(${v},${v},${v},0.22)`; x.lineWidth = 2 + r() * 7;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a + 0.3) * len * 0.5, py + Math.sin(a + 0.3) * len * 0.5, px + Math.cos(a) * len, py + Math.sin(a) * len); x.stroke();
  }
  x.filter = 'blur(0.8px)'; x.drawImage(c, 0, 0);
  return x.getImageData(0, 0, W, H).data;
}
// brush dabs: pixels fall into elongated, flow-aligned cells (an anisotropic Voronoi) and each
// cell's albedo and normal are pulled toward its mean, so the light lands in brush-sized patches.
// Pixels unlike the cell's seed (another object) keep their own values.
function dabs(st, seed, cell, kA, kN) {
  const r = rng(seed), nf = valueNoise(seed + 9), gw = Math.ceil(W / cell) + 5, gh = Math.ceil(H / cell) + 5, n = gw * gh;
  const sx = new Float32Array(n), sy = new Float32Array(n), ca = new Float32Array(n), sa = new Float32Array(n), il = new Float32Array(n), iw = new Float32Array(n);
  for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++) {
    const k = j * gw + i, x = (i - 2 + r()) * cell, y = (j - 2 + r()) * cell, a = nf(x / 320, y / 320) * 6 + (r() - 0.5) * 0.7;
    const len = cell * (1.3 + r() * 1.2), wid = cell * (0.5 + r() * 0.25);
    sx[k] = x; sy[k] = y; ca[k] = Math.cos(a); sa[k] = Math.sin(a); il[k] = 1 / (len * len); iw[k] = 1 / (wid * wid);
  }
  const A = st.a, N = st.n, lab = new Int32Array(W * H), sum = new Float32Array(n * 7), ref = new Int32Array(n);
  for (let k = 0; k < n; k++) { const x = Math.min(W - 1, Math.max(0, sx[k] | 0)), y = Math.min(H - 1, Math.max(0, sy[k] | 0)), p = (y * W + x) * 4; ref[k] = p; }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ci = Math.floor(x / cell) + 2, cj = Math.floor(y / cell) + 2;
    let best = 1e9, bk = 0;
    for (let j = cj - 2; j <= cj + 2; j++) for (let i = ci - 2; i <= ci + 2; i++) {
      const k = j * gw + i, dx = x - sx[k], dy = y - sy[k], u = dx * ca[k] + dy * sa[k], v = dy * ca[k] - dx * sa[k], d = u * u * il[k] + v * v * iw[k];
      if (d < best) { best = d; bk = k; }
    }
    const p = (y * W + x) * 4, q = ref[bk];

    lab[y * W + x] = bk;
    const o = bk * 7; sum[o] += A[p]; sum[o + 1] += A[p + 1]; sum[o + 2] += A[p + 2]; sum[o + 3] += N[p]; sum[o + 4] += N[p + 1]; sum[o + 5] += N[p + 2]; sum[o + 6]++;

    const nx = mix(N[p], sum[o + 3] * c, kN) / 127.5 - 1, ny = mix(N[p + 1], sum[o + 4] * c, kN) / 127.5 - 1, nz = mix(N[p + 2], sum[o + 5] * c, kN) / 127.5 - 1, l = 1 / Math.hypot(nx, ny, nz);
    N[p] = (nx * l + 1) * 127.5; N[p + 1] = (ny * l + 1) * 127.5; N[p + 2] = (nz * l + 1) * 127.5;
  }
}
// opt: kA / kN how far brush dabs pull albedo / normals to their cell mean (no dabs at all with kA = 0),
// kB how strongly the brush strokes tilt the normals
function sealStage(st, seed, { kA = 0.5, kN = 0.12, kB = 1.3 } = {}) {
  st.a = st.Ac.getImageData(0, 0, W, H).data; st.m = st.Mc.getImageData(0, 0, W, H).data; st.s = st.Sc.getImageData(0, 0, W, H).data;
  st.f = st.Fc.getImageData(0, 0, W, H).data;
  st.n = st.Nc.getImageData(0, 0, W, H).data;
  if (kA > 0) dabs(st, seed + 3, 8, kA, kN);
  const B = brushField(seed), A = st.a, N = st.n, n = W * H;
  // normals go to float and get a 1 px blur, so smooth metal and cloth shade without 8-bit steps
  const X = new Float32Array(n), Y = new Float32Array(n), Z = new Float32Array(n);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, p = i * 4;
    let nx = N[p] / 127.5 - 1, ny = N[p + 1] / 127.5 - 1, nz = N[p + 2] / 127.5 - 1;
    if (x > 0 && y > 0 && x < W - 1 && y < H - 1) {
      const b = B[p] / 255 - 0.5, gx = (B[p + 4] - B[p - 4]) / 255, gy = (B[p + W * 4] - B[p - W * 4]) / 255, k = 1 + 0.16 * b;
      A[p] *= k; A[p + 1] *= k; A[p + 2] *= k;
      if (st.m[p + 1] < 220) { nx -= gx * kB; ny -= gy * kB; }
    }
    X[i] = nx; Y[i] = ny; Z[i] = nz;
  }
  const blur = F => {
    const T = new Float32Array(n);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; T[i] = (F[x > 0 ? i - 1 : i] + 2 * F[i] + F[x < W - 1 ? i + 1 : i]) * 0.25; }
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; F[i] = (T[y > 0 ? i - W : i] + 2 * T[i] + T[y < H - 1 ? i + W : i]) * 0.25; }

  st.out = new ImageData(W, H); for (let i = 3; i < W * H * 4; i += 4) st.out.data[i] = 255;
  st.view = newCanvas(W, H); st.vc = st.view.getContext('2d');
  for (const k of ['A', 'N', 'M', 'S', 'F']) { st[k].width = 1; delete st[k + 'c']; }
}
// paint one object: fn(x, y, o) fills o for each pixel centre: coverage a, albedo r g b (display
// 0..1), normal nx ny nz, specular sp, gloss gl, metal mt. Optional clip path. Returns the
// object's coverage as a canvas, for casting its shadow.
const PX = { a: 0, r: 0, g: 0, b: 0, nx: 0, ny: 0, nz: 1, sp: 0, gl: 0, mt: 0 };
function paint(st, x0, y0, w, h, fn, clip) {
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  w = Math.min(W - x0, Math.ceil(w)); h = Math.min(H - y0, Math.ceil(h));
  const ia = new ImageData(w, h), inn = new ImageData(w, h), im = new ImageData(w, h);
  const A = ia.data, N = inn.data, M = im.data, o = PX;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    o.a = 0; fn(x0 + i + 0.5, y0 + j + 0.5, o);
    if (!(o.a > 0)) continue;
    const p = (j * w + i) * 4, al = o.a >= 1 ? 255 : o.a * 255, nl = 1 / Math.hypot(o.nx, o.ny, o.nz);
    A[p] = o.r * 255; A[p + 1] = o.g * 255; A[p + 2] = o.b * 255; A[p + 3] = al;
    N[p] = (o.nx * nl * 0.5 + 0.5) * 255; N[p + 1] = (o.ny * nl * 0.5 + 0.5) * 255; N[p + 2] = (o.nz * nl * 0.5 + 0.5) * 255; N[p + 3] = al;
    M[p] = o.sp * 255; M[p + 1] = o.gl * 255; M[p + 2] = o.mt * 255; M[p + 3] = al;

  st.Ac.drawImage(layers[0], x0, y0); st.Nc.drawImage(layers[1], x0, y0); st.Mc.drawImage(layers[2], x0, y0);

  st.Fc.save(); st.Fc.filter = 'brightness(0) invert(1)'; st.Fc.drawImage(layers[0], x0, y0); st.Fc.restore();

// darken the light-visibility layer with a transformed, blurred silhouette
function castShadow(st, sil, m, blur, alpha, clip) {
  const c = st.Sc; c.save();

  c.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
  c.drawImage(sil.c, sil.x, sil.y);

// a shadow laid flat on a horizontal surface, anchored at the object's foot line yb
const flatShadow = (yb, kx, ky, dx = 0, dy = 0) => [1, 0, -kx, ky, kx * yb + dx, yb * (1 - ky) + dy];

// surface of revolution about an axis in the picture plane: R = {x, y, c, s, len, r(a)}
function revAt(R, x, y, o) {
  const dx = x - R.x, dy = y - R.y, a = dx * R.c + dy * R.s, b = -dx * R.s + dy * R.c;
  if (a < -1 || a > R.len + 1) return 0;

  if (cov <= 0) return 0;

}
// a tube following a polyline: T = {pts, r}
function tubeAt(T, x, y, o) {

// ── the still life ──
// stone ledge: the front arris climbs from lower left to mid right; the top recedes behind it
const yF = x => 965 - 0.1875 * (x + 40);

const LEDGE_R = 1560, LEDGE_BR = 1630;

const CLIP_WALL = pathOf([[-10, -10], [W + 10, -10], [W + 10, yB(W + 10)], [-10, yB(-10)]]);

const HG = { x: 300, top: 486, glass0: 514, glass1: 846, rx: 96, ry: 20, th: 28 };   // hourglass
const hgGlass = yy => {                       // two lobes and a pinched waist
  const yn = (yy - HG.glass0) / (HG.glass1 - HG.glass0);
  const lobe = (c, hl) => Math.sqrt(Math.max(0, 1 - ((yn - c) / hl) ** 2));
  return Math.max(5, 62 * Math.max(lobe(0.27, 0.25), lobe(0.73, 0.25)) ** 0.9 + 5 * (1 - Math.abs(yn - 0.5) * 2) ** 8);
};
const EWER = { x: 590, y: 722, ang: -0.21, len: 432 };
const CANDLE = { x: 1452, top: 398, dish: 602 };

function buildStillLife() {
  const st = makeStage();
  const nW = valueNoise(11), nS = valueNoise(23), nL = valueNoise(37), nE = valueNoise(41), nG = valueNoise(53);

  // the back wall: dark umber plaster, mottled, lit only where the beam falls
  paint(st, 0, 0, W, H, (x, y, o) => {
    const f = nW.fbm(x / 240, y / 240, 4), f2 = nW(x / 36 + 50, y / 36), v = (0.6 + 0.65 * f + 0.1 * f2) * (0.25 + 0.75 * cl(y / 900));
    o.a = 1; o.r = 0.25 * v; o.g = 0.19 * v; o.b = 0.135 * v;
    o.nx = (f2 - 0.5) * 0.16; o.ny = (nW(x / 36, y / 36 + 70) - 0.5) * 0.16; o.nz = 1;
    o.sp = 0.02; o.gl = 0.1; o.mt = 0;
  });
  // the wall stands far back from the light: almost none of it reaches there
  st.Sc.fillStyle = 'rgba(0,0,0,0.955)'; st.Sc.fillRect(0, 0, W, H);
  st.Sc.fillStyle = 'rgba(0,0,0,0.97)'; st.Sc.fill(pathOf([[LEDGE_BR, yB(LEDGE_BR) - 4], [W + 10, yB(W + 10) - 4], [W + 10, H + 10], [LEDGE_BR, H + 10]]));

  // the ledge
  paint(st, 0, yB(LEDGE_BR) - 2, LEDGE_BR + 2, H, (x, y, o) => {
    const cov = cl(y - yB(x) + 0.5) * cl(LEDGE_BR + 0.5 - x);
    if (cov <= 0) return;
    o.a = cov;
    let n, shade = 1;
    if (x <= LEDGE_R) {
      const s = (y - yF(x)) / 5;
      n = s < -1 ? N_TOP : s > 1 ? N_FRONT : blendN(N_TOP, N_FRONT, ease((s + 1) / 2));
      if (s > 1) shade = 0.42 - 0.2 * ramp(y - yF(x), 0, 200);
      if (s > 0 && x > LEDGE_R - 5) n = blendN(n, N_END, ease((x - LEDGE_R + 5) / 10));
    } else {
      const s = (y - yRidge(x)) / 2.63 / 4;
      n = s < -1 ? N_TOP : s > 1 ? N_END : blendN(N_TOP, N_END, ease((s + 1) / 2));
      if (s > 0) { n = blendN(N_FRONT, n, ease((x - LEDGE_R + 5) / 10)); shade = 0.75; }
    }
    const f = nS.fbm(x / 80, y / 80, 5), vein = Math.abs(nS(x / 210 + 9, y / 60 - 3) - 0.5) < 0.012 ? 0.8 : 1;
    const v = (0.72 + 0.48 * f) * shade * vein;
    o.r = 0.36 * v; o.g = 0.315 * v; o.b = 0.255 * v;
    const fb = nS.fbm(x / 22, y / 22, 2);
    o.nx = n[0] + (nS.fbm((x + 2) / 22, y / 22, 2) - fb) * 1.1; o.ny = n[1] + (nS.fbm(x / 22, (y + 2) / 22, 2) - fb) * 1.1; o.nz = n[2];
    o.sp = 0.07; o.gl = 0.15; o.mt = 0;
  });

  // the linen: laid on the ledge, its corner spilling over the arris in heavy tubular folds
  {
    const LX = 372, LY = 560, LWd = 900, LHt = 520, CX = 700;
    // fold height across the hang: irregular ridges that spread apart as they fall toward the corner
    const fold = (x, y) => {
      const yy = Math.max(0, y - yF(x)), sp = 1 + 0.5 * yy / 300, xe = CX + (x - CX) / sp;
      const a = 22 * ease(yy / 70) + 14 * ease(yy / 240);
      return a * (Math.sin(xe / 25 + 1.2 * Math.sin(xe / 97) + 0.4) * 0.8 + 0.25 * Math.sin(xe / 13 + 2.1) * ease(yy / 120));
    };
    const hemBase = x => { const u = (x - 458) / (1214 - 458); return mix(yF(458) + 40, yF(1214) + 30, u) + 175 * Math.sin(PI * Math.pow(u, 0.62)) ** 1.4 + 40 * Math.exp(-(((u - 0.25) / 0.12) ** 2)); };

    cloth.moveTo(432, yB(432) + 22);
    cloth.bezierCurveTo(640, yB(640) + 12, 930, yB(930) + 22, 1168, yB(1168) + 26);
    cloth.lineTo(1214, yF(1214) + 1);
    for (let x = 1214; x >= 458; x -= 3) cloth.lineTo(x, hemBase(x) + 0.55 * fold(x, hemBase(x)));
    cloth.lineTo(458, yF(458) + 1);

    castShadow(st, { c: silC, x: 0, y: 0 }, offShadow(28, 18), 10, 0.88, CLIP_FRONT);
    const N_HANG = unit(-0.14, 0.1, 0.98);
    paint(st, LX, LY, LWd, LHt, (x, y, o) => {
      const s = (y - yF(x)) / 15;
      const n = s < -1 ? N_TOP : s > 1 ? N_HANG : blendN(N_TOP, N_HANG, ease((s + 1) / 2));
      o.a = 1;
      let gx = 0, gy = 0, cav = 0, crest = 0;
      if (s > -1) {

      } else {   // flat on the ledge: a few soft rumples and one sharp crease from the press
        const f = nL.fbm(x / 120, y / 60, 3);
        gx = (nL.fbm((x + 2) / 120, y / 60, 3) - f) * 9; gy = (nL.fbm(x / 120, (y + 2) / 60, 3) - f) * 9;
        const dc = y - mix(yF(x) - 46, yF(x) - 40, (x - 500) / 700);

      }

      const v = (0.95 + 0.05 * (nL(x / 2.2, y / 2.2) - 0.5) + 0.04 * (nL.fbm(x / 70, y / 70, 3) - 0.5)) * (1 - 0.1 * cav);

      o.sp = 0.12 + 0.2 * crest; o.gl = 0.32 + 0.12 * crest; o.mt = 0;      // a little sheen along the crests
    }, cloth);
  }

  // the hourglass, standing at the left end
  {
    const wood = (x, y, o, shade) => {
      const gr = 0.82 + 0.18 * Math.sin(x * 0.11 + nG(x / 30, y / 6) * 9);
      o.r = 0.40 * gr * shade; o.g = 0.24 * gr * shade; o.b = 0.12 * gr * shade; o.sp = 0.35; o.gl = 0.42; o.mt = 0;
    };
    const disk = (cy) => (x, y, o) => {
      const dx = (x - HG.x) / HG.rx; if (Math.abs(dx) > 1.02) return;
      const e = Math.sqrt(Math.max(0, 1 - dx * dx)) * HG.ry, top0 = cy - e, top1 = cy + e, bot = top1 + HG.th;
      const cov = cl((1 - Math.abs(dx)) * HG.rx + 0.5) * cl(y - top0 + 0.5) * cl(bot - y + 0.5);

      if (y < top1 - 1.5) { o.nx = 0; o.ny = N_TOP[1]; o.nz = N_TOP[2]; wood(x, y, o, 0.95); }
      else {
        const bead = Math.sin(((y - top1) / HG.th) * PI);
        o.nx = dx; o.ny = (0.5 - (y - top1) / HG.th) * 0.9 * bead; o.nz = Math.sqrt(Math.max(0.02, 1 - dx * dx)); wood(x, y, o, 0.85);

    };
    const spindleR = yy => { const yn = (yy - HG.glass0) / (HG.glass1 - HG.glass0); return 7.5 + 5 * Math.exp(-(((yn - 0.06) / 0.035) ** 2)) + 5 * Math.exp(-(((yn - 0.94) / 0.035) ** 2)) + 4 * Math.exp(-(((yn - 0.5) / 0.06) ** 2)) + 1.5 * Math.sin(yn * PI); };
    const spindle = sx => { const R = { x: sx, y: HG.glass0, c: 0, s: 1, len: HG.glass1 - HG.glass0, r: a => spindleR(HG.glass0 + a) }; return (x, y, o) => { const cov = revAt(R, x, y, o); if (!cov) return; o.a = cov; wood(x, y, o, 0.9); }; };
    const box = [HG.x - 110, HG.top - 30, 230, HG.glass1 - HG.top + 90];
    const all = [];
    all.push(paint(st, ...box, spindle(HG.x + 8)));
    const GR = { x: HG.x, y: HG.glass0, c: 0, s: 1, len: HG.glass1 - HG.glass0, r: a => hgGlass(HG.glass0 + a) };
    all.push(paint(st, ...box, (x, y, o) => {

    }));
    all.push(paint(st, ...box, spindle(HG.x - 78)), paint(st, ...box, spindle(HG.x + 78)));
    all.push(paint(st, ...box, disk(HG.glass1)), paint(st, ...box, disk(HG.top)));

    const sil = newCanvas(W, H), sx = sil.getContext('2d'); for (const s of all) sx.drawImage(s.c, s.x, s.y);

    castShadow(st, { c: sil, x: 0, y: 0 }, flatShadow(foot, 0.85, 0.2, 6, -4), 7, 0.9, CLIP_TOP);

  }

  // the ewer: pewter, tipped on its side, mouth toward the right
  {
    const E = EWER, c = Math.cos(E.ang), s = Math.sin(E.ang);
    const prof = profile([[0, 52], [16, 58], [24, 50], [34, 46], [62, 80], [110, 107], [160, 111], [212, 96], [256, 62], [292, 40], [330, 31], [378, 35], [408, 45], [426, 54], [432, 51]]);
    const R = { x: E.x, y: E.y, c, s, len: E.len, r: prof };
    const toS = (a, b) => [E.x + a * c - b * s, E.y + a * s + b * c];
    const handle = { pts: bez([[300, -26], [338, -132], [228, -206], [146, -102]].map(([a, b]) => toS(a, b)), 44), r: k => 14 - 4 * Math.sin(k * PI) + 6 * Math.exp(-(((k - 0.08) / 0.05) ** 2)) };
    const box = [E.x - 70, E.y - 260, E.len + 140, 400];

      o.nx += (nE.fbm((x + 2) / 34, y / 34, 2) - f) * 1.2; o.ny += (nE.fbm(x / 34, (y + 2) / 34, 2) - f) * 1.2;

    const sil = newCanvas(W, H), sx = sil.getContext('2d');

    castShadow(st, { c: sil, x: 0, y: 0 }, offShadow(110, 66), 14, 0.8, CLIP_WALL);

  }

  // grapes: a dark bunch hanging over the arris
  {

    for (let tries = 0; grapes.length < 38 && tries < 6000; tries++) {

      const shape = new Path2D(), lr = th => lf.R * (0.62 + 0.38 * Math.abs(Math.cos(2.5 * th)) ** 0.7) * (1 + 0.05 * Math.sin(th * 34)) * (1 - 0.55 * Math.exp(-(((PI - Math.abs(th)) / 0.14) ** 2)));
      const toW = (th, rr) => { const lx = Math.cos(th) * rr, ly = Math.sin(th) * rr * lf.sq * 0.95; return [lf.x + lx * Math.cos(lf.ang) - ly * Math.sin(lf.ang) * (lf.sq < 1 ? 1 : 1), lf.y + (lx * Math.sin(lf.ang) + ly * Math.cos(lf.ang)) * (lf.sq < 1 ? lf.sq : 1)]; };

window.events = function () {
