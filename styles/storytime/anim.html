  const ph = Math.floor(t * 8) * 1.7, r = rnd(Math.floor(t * 8) + 5);
  const pts = []; const x0 = inset, y0 = inset * 0.8, x1 = W - inset, y1 = H - inset * 0.8;
  const N = 18;
  const side = (ax, ay, bx, by, nx, ny) => { for (let i = 0; i < N; i++) { const k = i / N, w = amp * (Math.sin(k * 7 + ph) * 0.6 + (r() - 0.5) * 0.8); pts.push([lerp(ax, bx, k) + nx * w, lerp(ay, by, k) + ny * w]); } };
  side(x0, y0, x1, y0, 0, -1); side(x1, y0, x1, y1, 1, 0); side(x1, y1, x0, y1, 0, 1); side(x0, y1, x0, y0, -1, 0);
  g.beginPath(); for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; if (i === 0) g.moveTo(mx, my); else g.quadraticCurveTo(p[0], p[1], mx, my); }
  const p = pts[0], q = pts[1]; g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); g.closePath();
}
let GRAIN = null;
function buildGrain() {
  const c = mk(480, 270), x = c.getContext('2d'), id = x.createImageData(480, 270), r = rnd(4242);
  for (let i = 0; i < id.data.length; i += 4) { const v = 110 + r() * 110; id.data[i] = v; id.data[i + 1] = v * 0.92; id.data[i + 2] = v * 0.8; id.data[i + 3] = 255; }
  x.putImageData(id, 0, 0); GRAIN = c;

  x.fillStyle = 'rgba(40,25,15,0.7)'; for (let i = 0; i < 40; i++) { x.fillRect(r() * 480, r() * 270, 1 + r() * 1.5, 1 + r() * 1.5); }
}
function flashbackScene(g, t) {
  FG.setTransform(1, 0, 0, 1, 0, 0); flashContent(FG, t);
  SG.setTransform(1, 0, 0, 1, 0, 0); SG.filter = 'sepia(1) saturate(0.75) contrast(0.92) brightness(1.03)'; SG.drawImage(FBC, 0, 0); SG.filter = 'none';
  g.fillStyle = '#3b2a1d'; g.fillRect(0, 0, W, H);

  g.save(); wobblePath(g, t, 70, 12); g.save(); g.clip();
  g.translate(W / 2, H / 2); g.scale(zz, zz); g.translate(-W / 2, -H / 2); g.drawImage(SEP, 0, 0);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'multiply'; g.globalAlpha = 0.28; g.drawImage(GRAIN, (gs % 4) * -30, (gs % 3) * -24, W + 160, H + 120);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  const vg = g.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1100); vg.addColorStop(0, 'rgba(60,35,15,0)'); vg.addColorStop(1, 'rgba(60,35,15,0.55)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  g.restore();
  wobblePath(g, t, 70, 12); g.strokeStyle = '#f1e2c2'; g.lineWidth = 14; g.lineJoin = 'round'; g.stroke(); g.strokeStyle = '#2a1c12'; g.lineWidth = 4; g.stroke();
  g.restore();
}

// ── smoke-alarm cutaway ────────────────────────────────────────────────
const BEEPS = []; for (let i = 0; i < 4; i++) BEEPS.push(T.alarm + 0.1 + i * 0.3);
function alarmScene(g, t) {
  const tq = TW(t);
  let last = -1; for (let i = 0; i < BEEPS.length; i++) if (t >= BEEPS[i]) last = i;
  const on = last >= 0 && t - BEEPS[last] < 0.15;
  g.fillStyle = on ? '#f2554a' : '#d23a38'; g.fillRect(0, 0, W, H);
  // warning stripes rotating behind
  g.save(); g.translate(960, 330); g.rotate(tq * 0.8); g.fillStyle = on ? '#ff7063' : '#df4944';
  for (let i = 0; i < 12; i++) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 2000, i * Math.PI / 6, i * Math.PI / 6 + Math.PI / 12); g.closePath(); g.fill(); }
  g.restore();
  // ceiling
  g.fillStyle = '#f4e4cf'; g.fillRect(0, 0, W, 170); g.strokeStyle = INK; g.lineWidth = 7; g.beginPath(); g.moveTo(0, 170); g.lineTo(W, 170); g.stroke();
  // detector body (shakes on each beep)
  const sh = on ? [[10, 0], [-9, 2], [7, -2], [-6, 1]][Math.floor(t * 30) % 4] : [0, 0];
  g.save(); g.translate(960 + sh[0], sh[1]);
  g.beginPath(); g.roundRect(-300, 170, 600, 34, [0, 0, 14, 14]); sf(g, '#dcd3c6', 7);
  g.beginPath(); g.moveTo(-340, 204); g.lineTo(340, 204); g.quadraticCurveTo(330, 420, 0, 430); g.quadraticCurveTo(-330, 420, -340, 204); g.closePath(); sf(g, '#fbf8f2', 8);
  for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(-260 + k * 40, 250 + k * 34); g.quadraticCurveTo(0, 262 + k * 44, 260 - k * 40, 250 + k * 34); g.strokeStyle = '#cfc6b8'; g.lineWidth = 6; g.stroke(); }
  for (let k = -3; k <= 3; k++) { g.beginPath(); g.roundRect(k * 44 - 8, 330, 16, 50, 8); sf(g, '#d7cebf', 4); }
  // LED + glow
  if (on) { const gr = g.createRadialGradient(230, 250, 0, 230, 250, 110); gr.addColorStop(0, 'rgba(255,60,50,0.9)'); gr.addColorStop(1, 'rgba(255,60,50,0)'); g.fillStyle = gr; g.fillRect(120, 140, 220, 220); }
  ell(g, 230, 250, 18, 18); sf(g, on ? '#ff2d2d' : '#8a2020', 6);
  // vibration marks
  if (on) { g.strokeStyle = INK; g.lineWidth = 9; g.lineCap = 'round'; for (const s of [-1, 1]) for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(s * 330, 290, 60 + k * 40, s > 0 ? -0.5 : Math.PI - 0.5, s > 0 ? 0.5 : Math.PI + 0.5); g.stroke(); } }
  g.restore();
  // drifting smoke along the ceiling
  smoke(g, t, T.alarm - 1.2, 150, 520, 0.16, 16, -20, 30, 91);
  for (let i = 0; i <= last; i++) {
    const pos = [[470, 560, -0.14], [1440, 600, 0.12], [640, 750, 0.08], [1290, 790, -0.1]][i];
    const age = t - BEEPS[i]; const s = eob(seg(age, 0, 0.12)) * (i < last - 1 ? 0.9 : 1);
    outlinedText(g, 'BEEP!', pos[0], pos[1], 190, SFX, i === last ? '#ffe14d' : '#ffd0b0', 16, pos[2], s);
  }
  thought(g, t, 'The smoke alarm had waited its whole life for this.', 960, 955, 62, T.capAl, null, { rot: 0.01 });
}

// ── embarrassed ending ─────────────────────────────────────────────────
function endMe(t) {
  const tq = TW(t);
  const P = { x: 640, y: 960, s: 2.1, face: 'awkward', look: -0.4, tilt: 0.08 + 0.02 * Math.sin(tq * 3), sq: 0.006 * Math.sin(tq * 4), legs: 'knock', soot: true, holdPot: true, pose: POSES.endp };
  // arrival: small settle overshoot after the cut
  const k = seg(tq, T.end, T.end + 0.3); P.sq += -0.05 * Math.sin(k * Math.PI * 2) * (1 - k);
  // scratch the head (hand moves up and down on twos)
  const sc = Math.floor(tq * 6) % 2; P.pose = { ...POSES.endp, L: [POSES.endp.L[0] + sc * 4, POSES.endp.L[1] + sc * 8] };
  if ((tq >= 8.95 && tq < 9.04) || (tq >= T.irisHold + 0.02 && tq < T.irisHold + 0.1)) P.blink = true;
  return P;
}
function endScene(g, t) {
  const tq = TW(t);
  kitchenBG(g, BG.end, true);
  stove(g, 980, 700, 0, tq, true);
  smoke(g, t, T.end - 1.4, 1210, 660, 0.6, 5, 60, 16, 55, '#9b98a2');
  const P = endMe(t); drawMe(g, P);
  // a last sad wisp from the charred brick
  smoke(g, t, T.end + 0.2, P.x + (40 + 50) * 2.1, 960 - (100 + 46 + 40) * 2.1 + 40, 0.55, 3, 60, 12, 66, '#9b98a2');
  smoke(g, t, T.end - 0.3, P.x + 20, 960 - 330 * 2.1, 0.5, 4, 50, 10, 71, '#9b98a2');
  thought(g, t, 'Anyway. I order takeout now.', 1230, 150, 80, T.capE, [P.x + 90, 330]);
  // iris out onto the face, pause, close
  if (t >= T.iris) {
    const fx = P.x - 10, fy = 960 - 238 * 2.1;
    const r = t < T.irisHold ? lerp(1300, 230, eio(seg(t, T.iris, T.irisHold))) : t < T.irisClose ? 230 : lerp(230, 0, eio(seg(t, T.irisClose, T.irisEnd)));
    g.fillStyle = '#16111a'; g.beginPath(); g.rect(0, 0, W, H); if (r > 0.5) g.arc(fx, fy, r, 0, Math.PI * 2, true); g.fill('evenodd');
  }
}

// ── transitions ────────────────────────────────────────────────────────
function wobble(g, src, amp, ph, alpha) {
  g.globalAlpha = alpha; const sh = 8;
  for (let y = 0; y < H; y += sh) { const dx = amp * Math.sin(y / 60 + ph) + amp * 0.4 * Math.sin(y / 23 - ph * 1.7); g.drawImage(src, 0, y, W, sh, dx, y, W, sh); }
  g.globalAlpha = 1;
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (t < T.z1) kitchenScene(ctx, t);
  else if (t < T.fbIn) zoomScene(ctx, t);
  else if (t < T.fb) {                                    // ripple dissolve into the memory
    const p = seg(t, T.fbIn, T.fb), amp = 70 * Math.sin(p * Math.PI);
    B1.setTransform(1, 0, 0, 1, 0, 0); zoomScene(B1, t); B2.setTransform(1, 0, 0, 1, 0, 0); flashbackScene(B2, t);

  }
  else if (t < T.fbOut) flashbackScene(ctx, t);
  else if (t < T.alarm) {                                 // ripple back out, straight into the alarm

  }
  else if (t < T.end) alarmScene(ctx, t);
  else endScene(ctx, t);

  if (t < 0.12) { ctx.fillStyle = `rgba(255,253,245,${1 - t / 0.12})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  await document.fonts.load(`60px ${HAND}`); await document.fonts.load(`60px ${SFX}`); await document.fonts.ready;
  buildGrain();
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const ev = [];
  const cap = (text, t0) => wordTimes(text, t0).forEach(x => ev.push({ t: x, k: 'word' }));
  ev.push({ t: T.pop, k: 'pop' }, { t: T.label, k: 'scribble' }, { t: T.capA, k: 'bubble' }, { t: T.ding, k: 'ding' });
  cap('How hard can pasta be?', T.capA);
  ev.push({ t: T.b, k: 'cut' }, { t: T.b, k: 'sizzle' }, { t: T.b + 0.02, k: 'sniff' }, { t: T.capB, k: 'bubble' });
  cap('...is pasta supposed to smell like a campfire?', T.capB);
  ev.push({ t: T.conf, k: 'huh' }, { t: T.real, k: 'gasp' }, { t: T.z1, k: 'scratch' }, { t: T.z1, k: 'zoom' }, { t: T.z2, k: 'zoom' }, { t: T.z2, k: 'sting' }, { t: T.capZ, k: 'shake' });
  ev.push({ t: T.fbIn, k: 'harpUp' }, { t: T.fb, k: 'memory' }, { t: T.capFB, k: 'bubble' }, { t: T.pour, k: 'rattle' });
  cap('Water is for soup, right?', T.capFB);
  ev.push({ t: T.fbOut, k: 'harpDown' });
  BEEPS.forEach(b => ev.push({ t: b, k: 'beep' }));
  ev.push({ t: T.capAl, k: 'bubble' });
  ev.push({ t: T.end, k: 'cut' }, { t: T.end + 0.05, k: 'womp' }, { t: T.capE, k: 'bubble' });
  cap('Anyway. I order takeout now.', T.capE);
  ev.push({ t: T.iris, k: 'iris' }, { t: T.irisClose, k: 'irisClose' });
  return ev.sort((a, b) => a.t - b.t);
};
