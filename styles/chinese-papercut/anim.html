<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── chinese-papercut · jianzhi window flower, cut live ──────────────────────────────────────
// A folded sheet of red paper lies on a gold card → a craft knife cuts the lace live (every cut-out
// piece is a real connected hole of the design, found by flood fill, traced along its contour and
// then fluttering away) → the waste frame drops off, the sheet unfolds to reveal the mirror symmetry
// → the camera pushes into the wave band, the layers separate and two paper koi swim in and out under
// the cut waves → pull back: lanterns drop in, a banner is cut with GOOD FORTUNE → hold, fade.
// Everything is seeded; each frame depends only on t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const smoother = u => { u = clamp(u); return u * u * u * (u * (u * 6 - 15) + 10); };
const eOut = u => 1 - Math.pow(1 - clamp(u), 3);
const eIn = u => Math.pow(clamp(u), 3);
const backOut = (u, k = 1.7) => { u = clamp(u) - 1; return 1 + u * u * ((k + 1) * u + k); };
const spring = (u, f = 2.2, d = 5) => { u = Math.max(0, u); return 1 - Math.exp(-d * u) * Math.cos(TAU * f * u); };

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };

// ── palette ──
const C_RED = [176, 22, 30], C_RED2 = [196, 34, 36], C_GOLD = [214, 170, 84], C_CREAM = [238, 226, 199], C_IVORY = [247, 238, 219];

// ── paper textures (fibres + mottling), built once ──
function paperTex(w, h, base, seed, opt = {}) {
  const c = mk(w, h), g = c.getContext('2d'), R = rng(seed);
  const id = g.createImageData(w, h), d = id.data;
  // low-frequency mottling on a coarse grid, bilinear
  const GS = 48, gw = Math.ceil(w / GS) + 2, gh = Math.ceil(h / GS) + 2, grid = new Float32Array(gw * gh).map(() => R() - 0.5);
  const mott = opt.mott ?? 10, grain = opt.grain ?? 7;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const gx = x / GS, gy = y / GS, ix = gx | 0, iy = gy | 0, fx = gx - ix, fy = gy - iy;
    const a = grid[iy * gw + ix], b = grid[iy * gw + ix + 1], cc = grid[(iy + 1) * gw + ix], dd = grid[(iy + 1) * gw + ix + 1];
    const m = lerp(lerp(a, b, fx), lerp(cc, dd, fx), fy) * mott + (R() - 0.5) * grain;
    const i = (y * w + x) * 4;
    d[i] = base[0] + m; d[i + 1] = base[1] + m * 0.8; d[i + 2] = base[2] + m * 0.6; d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  // fibres: short curved hairs, light and dark
  const nf = Math.round(w * h / (opt.fibreDen ?? 900));
  g.lineCap = 'round';
  for (let i = 0; i < nf; i++) {
    const x = R() * w, y = R() * h, a = R() * TAU, L = 6 + R() * 26, bend = (R() - 0.5) * 0.9;
    const light = R() < 0.6;
    g.strokeStyle = light ? `rgba(255,${opt.fl ?? 235},${opt.fl2 ?? 210},${0.05 + R() * 0.08})` : `rgba(40,10,0,${0.03 + R() * 0.05})`;
    g.lineWidth = 0.6 + R() * 0.9;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + bend) * L * 0.5, y + Math.sin(a + bend) * L * 0.5, x + Math.cos(a) * L, y + Math.sin(a) * L);
    g.stroke();
  }
  return c;
}

// ── design geometry helpers (units; the window has radius 400) ──
const DS = 1.5, WC = 1320, C0 = 660;         // window canvas: 1.5 px per unit, centre at 660
function circ(g, x, y, r) { g.moveTo(x + r, y); g.arc(x, y, r, 0, TAU); }
function fillPath(g, fn, hole = false) { g.globalCompositeOperation = hole ? 'destination-out' : 'source-over'; g.beginPath(); fn(g); g.fill(); g.globalCompositeOperation = 'source-over'; }
function strokePath(g, fn, w, hole = false, cap = 'round') { g.globalCompositeOperation = hole ? 'destination-out' : 'source-over'; g.lineWidth = w; g.lineCap = cap; g.lineJoin = 'round'; g.beginPath(); fn(g); g.stroke(); g.globalCompositeOperation = 'source-over'; }
// ruyi cloud head at (x,y), pointing along angle a, size s
function ruyi(g, x, y, a, s) {
  const ca = Math.cos(a), sa = Math.sin(a), P = (u, v) => [x + ca * u - sa * v, y + sa * u + ca * v];
  let p = P(s * 0.25, -s * 0.42); circ(g, p[0], p[1], s * 0.36);
  p = P(s * 0.25, s * 0.42); circ(g, p[0], p[1], s * 0.36);

// spiral curl (stroke) centred at x,y
function curl(g, x, y, r, turns = 1.4, a0 = 0, dir = 1) {
  const n = 40; for (let i = 0; i <= n; i++) { const u = i / n, a = a0 + dir * u * turns * TAU, rr = r * (1 - u * 0.8); const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? g.lineTo(px, py) : g.moveTo(px, py); }
}
// auspicious cloud: cluster of lobes with curls cut into them, and a tapering tail
function cloudPos(g, x, y, s, flip = 1) {
  circ(g, x, y, 30 * s); circ(g, x + 34 * s * flip, y + 8 * s, 22 * s); circ(g, x - 30 * s * flip, y + 10 * s, 20 * s);
  circ(g, x + 8 * s * flip, y + 22 * s, 20 * s);
  g.moveTo(x - 40 * s * flip, y + 18 * s); g.quadraticCurveTo(x - 90 * s * flip, y + 40 * s, x - 118 * s * flip, y + 24 * s);
  g.quadraticCurveTo(x - 86 * s * flip, y + 30 * s, x - 40 * s * flip, y + 30 * s); g.closePath();
}
function cloudHoles(g, x, y, s, flip = 1) {
  curl(g, x + 2 * s * flip, y + 2 * s, 20 * s, 1.3, 0.5, flip);
}

// ── the window flower (drawn in units; right half is authoritative, mirrored at build) ──
function drawWindow(g) {
  g.fillStyle = '#000'; g.strokeStyle = '#000';
  // outer ring with scalloped edge
  fillPath(g, q => { circ(q, 0, 0, 392); for (let k = 0; k < 24; k++) { const a = k * TAU / 24; circ(q, Math.cos(a) * 392, Math.sin(a) * 392, 17); } });
  fillPath(g, q => circ(q, 0, 0, 334), true);
  fillPath(g, q => { for (let k = 0; k < 48; k++) { const a = (k + 0.5) * TAU / 48; circ(q, Math.cos(a) * 334, Math.sin(a) * 334, 8); } });
  // lace in the ring: ruyi heads pointing out, paired drops between
  fillPath(g, q => { for (let k = 0; k < 24; k++) { const a = (k + 0.5) * TAU / 24; ruyi(q, Math.cos(a) * 361, Math.sin(a) * 361, a, 18);
    const b = a + TAU / 48; circ(q, Math.cos(b) * 351, Math.sin(b) * 351, 4.5); circ(q, Math.cos(b) * 372, Math.sin(b) * 372, 5.5); } }, true);

  g.restore();

  strokePath(g, q => { for (let k = -5; k <= 5; k++) { const x = k * 64 + 32; q.moveTo(x - 9, 199); q.quadraticCurveTo(x, 206, x + 9, 199); } }, 3.5, true);
  for (let r = 0; r < 7; r++) {

    const segL = 104, gap = 12, off = (r % 2) * 58 - 30;

      }

  const FY = -18;

  strokePath(g, q => { for (let k = 0; k < 8; k++) { const a = k * TAU / 8; q.moveTo(Math.cos(a) * 80, FY + Math.sin(a) * 80); q.lineTo(Math.cos(a) * 110, FY + Math.sin(a) * 110); } }, 5, true);
  strokePath(g, q => { for (let k = 0; k < 8; k++) { const a = (k + 0.5) * TAU / 8; q.moveTo(Math.cos(a) * 62, FY + Math.sin(a) * 62); q.lineTo(Math.cos(a) * 88, FY + Math.sin(a) * 88);
    for (const s of [-1, 1]) { const b = a + s * 0.2; q.moveTo(Math.cos(b) * 70, FY + Math.sin(b) * 70); q.lineTo(Math.cos(b + s * 0.12) * 90, FY + Math.sin(b + s * 0.12) * 90); } } }, 3.2, true);
  strokePath(g, q => { for (let k = 0; k < 8; k++) { const a0 = k * TAU / 8 + 0.12, a1 = (k + 1) * TAU / 8 - 0.12; q.moveTo(Math.cos(a0) * 48, FY + Math.sin(a0) * 48); q.arc(0, FY, 48, a0, a1); } }, 4, true);
  fillPath(g, q => { for (let k = 0; k < 6; k++) { const a = k * TAU / 6 + TAU / 12; const px = Math.cos(a) * 30, py = FY + Math.sin(a) * 30; q.moveTo(px, py); q.ellipse(px, py, 9, 4.5, a, 0, TAU); } circ(q, 0, FY, 7); }, true);
  strokePath(g, q => { q.moveTo(0, FY + 100); q.lineTo(0, 196); }, 12);
  for (const s of [-1, 1]) {
    fillPath(g, q => { q.moveTo(0, 150); q.quadraticCurveTo(s * 30, 120, s * 58, 116); q.quadraticCurveTo(s * 90, 112, s * 112, 124); q.quadraticCurveTo(s * 80, 148, s * 48, 150); q.quadraticCurveTo(s * 20, 152, 0, 162); q.closePath(); });
    strokePath(g, q => { q.moveTo(s * 20, 146); q.quadraticCurveTo(s * 60, 128, s * 100, 124); }, 3, true);
    strokePath(g, q => { for (let i = 0; i < 3; i++) { const x = s * (40 + i * 20); q.moveTo(x, 138 - i * 3); q.lineTo(x + s * 12, 124 - i * 2); q.moveTo(x, 139 - i * 3); q.lineTo(x + s * 10, 147 - i * 3); } }, 2.4, true);
  }
  // ── clouds hanging from the ring (top) ──
  for (const s of [-1, 1]) {
    fillPath(g, q => { cloudPos(q, s * 150, -282, 1.0, -s); });
    strokePath(g, q => cloudHoles(q, s * 150, -282, 1.0, -s), 4, true);
  }
  fillPath(g, q => { circ(q, 0, -318, 24); circ(q, -26, -312, 16); circ(q, 26, -312, 16); });
  strokePath(g, q => { curl(q, 0, -316, 14, 1.2, 0.3, 1); }, 3.5, true);
  // ── cranes in flight (right one drawn; the fold mirrors it): neck stretched forward, legs trailing ──
  fillPath(g, q => { q.moveTo(262, -112); q.ellipse(214, -118, 50, 18, -0.12, 0, TAU); });
  strokePath(g, q => { q.moveTo(176, -116); q.bezierCurveTo(152, -118, 142, -134, 116, -134); }, 9);
  fillPath(g, q => { q.ellipse(112, -135, 13, 9.5, -0.1, 0, TAU); q.moveTo(104, -140); q.lineTo(62, -132); q.lineTo(104, -130); q.closePath(); });
  // main wing: fanned primaries rising from the shoulder, tips reaching the cloud
  fillPath(g, q => { q.moveTo(188, -126); q.lineTo(172, -200); q.lineTo(252, -170); q.lineTo(240, -124); q.closePath();
    for (let i = 0; i < 6; i++) { const u = i / 5, a = lerp(-1.98, -0.92, u), L = lerp(150, 92, u), rx = 206 + u * 18, ry = -134;
      const ex = rx + Math.cos(a) * L, ey = ry + Math.sin(a) * L, nx = -Math.sin(a), ny = Math.cos(a), wdt = 15;
      q.moveTo(rx + nx * wdt, ry + ny * wdt); q.quadraticCurveTo(rx + Math.cos(a) * L * 0.7 + nx * wdt * 1.2, ry + Math.sin(a) * L * 0.7 + ny * wdt * 1.2, ex, ey);
      q.quadraticCurveTo(rx + Math.cos(a) * L * 0.7 - nx * wdt * 1.2, ry + Math.sin(a) * L * 0.7 - ny * wdt * 1.2, rx - nx * wdt, ry - ny * wdt); q.closePath(); } });
  strokePath(g, q => { for (let i = 0; i < 5; i++) { const u = (i + 0.5) / 5, a = lerp(-1.98, -0.92, u), L = lerp(150, 92, u) * 0.93, rx = 206 + u * 18, ry = -134;
    q.moveTo(rx + Math.cos(a) * L * 0.52, ry + Math.sin(a) * L * 0.52); q.lineTo(rx + Math.cos(a) * L, ry + Math.sin(a) * L); } }, 3.2, true);
  // covert feathers: a row of little scallop cuts across the wing base
  fillPath(g, q => { for (let i = 0; i < 5; i++) { const x = 190 + i * 12, y = -150 + i * 3; q.moveTo(x + 5, y); q.arc(x, y, 5, 0, Math.PI); } }, true);
  // tail tuft and trailing legs (the legs tie the crane to the ring)
  fillPath(g, q => { q.moveTo(252, -114); q.lineTo(292, -104); q.lineTo(276, -114); q.lineTo(296, -120); q.lineTo(256, -126); q.closePath(); });
  strokePath(g, q => { q.moveTo(244, -110); q.lineTo(334, -70); q.moveTo(240, -106); q.lineTo(330, -58); }, 3.6);
  strokePath(g, q => { q.moveTo(334, -70); q.lineTo(342, -62); q.moveTo(330, -58); q.lineTo(338, -48); }, 3.6);
  fillPath(g, q => { circ(q, 113, -141, 3.4); circ(q, 108, -134, 2.0); }, true);
  strokePath(g, q => { q.moveTo(186, -116); q.quadraticCurveTo(214, -108, 246, -114); }, 2.8, true);

  strokePath(g, q => { q.moveTo(336, 70); q.quadraticCurveTo(290, 60, 252, 18); q.moveTo(292, 58); q.quadraticCurveTo(280, 90, 246, 104); }, 8);
  for (const [bx, by, br] of [[246, 12, 15], [238, 106, 13], [296, 22, 9]]) {
    fillPath(g, q => { for (let k = 0; k < 5; k++) { const a = k * TAU / 5 - Math.PI / 2; circ(q, bx + Math.cos(a) * br * 0.8, by + Math.sin(a) * br * 0.8, br * 0.62); } });
    fillPath(g, q => { circ(q, bx, by, br * 0.26); for (let k = 0; k < 5; k++) { const a = k * TAU / 5 - Math.PI / 2 + TAU / 10; circ(q, bx + Math.cos(a) * br * 0.55, by + Math.sin(a) * br * 0.55, br * 0.1); } }, true);

// ── build: crisp design → mirrored sheet → rough fibre edges → cut pieces (flood fill + contours) ──
function mirrorHalf(src) {   // right half of src (x ≥ C0) is copied, mirrored, onto the left
  const c = mk(WC, WC), g = c.getContext('2d');
  g.drawImage(src, C0, 0, WC - C0, WC, C0, 0, WC - C0, WC);
  g.save(); g.translate(C0, 0); g.scale(-1, 1); g.drawImage(src, C0, 0, WC - C0, WC, 0, 0, WC - C0, WC); g.restore();
  return c;
}
function hashN(x, y, s) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function roughen(c, amt = 0.34, seed = 5) {   // blur the edge a little, then threshold against fibre noise
  const w = c.width, h = c.height, b = mk(w, h), g = b.getContext('2d');
  g.filter = 'blur(1.1px)'; g.drawImage(c, 0, 0); g.filter = 'none';
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4 + 3, a = d[i]; if (a === 0 || a === 255) continue;
    const n = 0.55 * hashN(x, y, seed) + 0.45 * hashN(x >> 1, y >> 2, seed + 1);
    const v = a / 255 + (n - 0.5) * amt; d[i] = clamp((v - 0.5) * 3.2 + 0.5) * 255;
  }

}

  const c = mk(mask.width, mask.height), g = c.getContext('2d');
  g.drawImage(mask, 0, 0); g.globalCompositeOperation = 'source-in'; g.drawImage(tex, -tx, -ty);
  const r = mk(mask.width, mask.height), rg = r.getContext('2d');
  rg.drawImage(mask, 0, 0); rg.globalCompositeOperation = 'destination-out'; rg.drawImage(mask, 1.6, 1.6);
  rg.globalCompositeOperation = 'source-in'; rg.fillStyle = 'rgba(255,225,200,0.38)'; rg.fillRect(0, 0, r.width, r.height);

  kg.globalCompositeOperation = 'source-in'; kg.fillStyle = 'rgba(60,0,0,0.35)'; kg.fillRect(0, 0, k.width, k.height);

// label the holes inside the sheet region and trace each contour (Moore neighbour tracing)

    let x0 = w, y0 = h, x1 = 0, y1 = 0, n = 0, sx = 0, sy = 0;
    while (sp) {

      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      if (x > 0 && lab[i - 1] === -1 && hole(i - 1)) { lab[i - 1] = id; st[sp++] = i - 1; }
      if (x < w - 1 && lab[i + 1] === -1 && hole(i + 1)) { lab[i + 1] = id; st[sp++] = i + 1; }
      if (y > 0 && lab[i - w] === -1 && hole(i - w)) { lab[i - w] = id; st[sp++] = i - w; }
      if (y < h - 1 && lab[i + w] === -1 && hole(i + w)) { lab[i + w] = id; st[sp++] = i + w; }

  for (const p of pieces) {

    let x = p.start % w, y = (p.start / w) | 0; const sx0 = x, sy0 = y; let dir = 7; const pts = [];

function pieceImage(lab, p, w, tex, pad = 2, rim = true) {
