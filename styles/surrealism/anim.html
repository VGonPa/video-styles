<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── surrealism · the melting hour, the wrong shadow, the empty horizon ─────────────────────────
// One continuous world in cold, low daylight, painted like a 1930s veristic canvas: a licked ochre plain
// that pales and cools toward a razor-straight horizon, a thin icy lemon band above it, then cerulean
// deepening to ultramarine; every shadow long, hard, cool and transparent, thrown to the right.
// Beat 1, the melting hour: the picture fades up on a tall pale stone pillar at the centre of the plain.
// A gold pocket watch lies on its top, the front third over the edge, its blued second hand ticking.
// The camera creeps in; the watch stiffens for an instant (its front lifts a hair and holds), then
// softens and slides, and its front half rolls over the edge in one soft fold like warm wax: a thick
// rounded lip, the flap bellied away from the stone and resting on it lower down, the enamel dial
// stretching while the second hand keeps ticking. It stretches a touch too far, springs back, sways.
// Beat 2, the wrong shadow: in one eased move the camera cranes up over the pillar (it sinks out of the
// bottom of the frame), trucks right along its long shadow and settles on an egg standing on the bare
// plain. Its shadow is a bird with spread wings. The shadow beats its wings and slides away across the
// ground and out of frame, leaving the egg with no shadow at all. Far off on the horizon, small and pale,
// a tall-case clock strides on impossibly long, thin, backward-jointed legs.
// Beat 3, the empty horizon: the camera rises and turns so the empty plain and the empty sky take the
// frame. The long cast shadow of the word SURREALISM appears on the plain first, whole;
// then the stone letters that cast it fade in on top, whole; then the caption "Paris · from 1924".
// A hold, a settle, a fade to black.
// The sky, the plain and the composite of all ground shadows are painted in a 2D canvas; the objects
// are drawn with WebGL2 into a second canvas and laid over it. Every ground shadow is the exact
// projection of its object along the one light direction. The watch is a closed mesh of its enamel dial,
// bezel, band and back, bent over the edge every frame (arc length kept, then stretched), its normals
// recomputed from the bent mesh, shadowed by a shadow map; a second map along the face normal gives the
// tight contact shadow where it rests on the stone. The canvas weave is painted once. Frames depend on t.
'use strict';
const W = 1920, H = 1080, DUR = 10.4, PI = Math.PI, DEG = PI / 180;
const out = document.getElementById('c'), ctx = out.getContext('2d');

// ── maths ──
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, u) => a + (b - a) * u;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const sstep = u => (u = clamp(u), u * u * (3 - 2 * u));
const sine = u => 0.5 - 0.5 * Math.cos(PI * clamp(u));
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const mixc = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const css = (c, a = 1) => `rgba(${Math.round(clamp(c[0]) * 255)},${Math.round(clamp(c[1]) * 255)},${Math.round(clamp(c[2]) * 255)},${a})`;
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function noiseGen(seed) {                      // xorshift32 behind a multiplicative scramble of the seed
  let s = Math.imul(seed ^ 0x5bd1e995, 0x27d4eb2d) >>> 0 || 7;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
// damped spring response to a unit step that starts at time 0: overshoots once, settles
const spring = (x, zeta = 0.42, w = 11) => {
  if (x <= 0) return 0;
  const wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * x) * (Math.cos(wd * x) + zeta * w / wd * Math.sin(wd * x));
};
const smax = (a, b, k) => 0.5 * (a + b + Math.sqrt((a - b) * (a - b) + k * k));   // a soft maximum

// ── timeline (seconds) ──
const T = {
  fadeIn: [0, 0.7],
  tick0: 0.3,                  // the second hand jumps on the second from here
  lift: [0.78, 1.18],          // anticipation: the overhang rises a hair and holds stiff
  sag: [1.18, 2.45],           // the soft roll
  settle: 2.45,
  egg: 4.62,                   // the bird shadow starts to beat its wings
  birdGo: 4.95,                // and slides away
  walk: 3.0,                   // the far walker, standing still until now, takes its first stride
  shadowIn: [6.65, 7.1],       // the title's cast shadow, whole word
  lettersIn: [7.45, 7.8],      // the letters, whole word
  subIn: [8.05, 8.38],         // the caption, whole string
  fadeOut: [9.9, 10.4],
};

// ── light: one low sun from the left; every shadow falls along +x. Faces are shaded by a light a little
// higher and a little more frontal than the one that throws the shadows, as a painter would cheat it ──
const SUN_AZ = 0;                                                 // shadows point this far from +x toward +z
const SHADOW_EL = 8 * DEG, SHADE_EL = 25 * DEG, SHADE_AZ = 22 * DEG;
const toSun = (el, az) => norm([-Math.cos(el) * Math.cos(az), Math.sin(el), -Math.cos(el) * Math.sin(az)]);
const LS = toSun(SHADOW_EL, SUN_AZ), LSH = toSun(SHADE_EL, SHADE_AZ);

// ── palette: the sky by elevation (degrees), the plain by view depth (metres) ──
const SKY = [[0, [0.95, 0.93, 0.77]], [0.7, [0.91, 0.93, 0.86]], [2.0, [0.69, 0.81, 0.91]], [5, [0.43, 0.63, 0.87]],
  [10, [0.24, 0.45, 0.80]], [18, [0.13, 0.29, 0.69]], [30, [0.07, 0.17, 0.53]], [50, [0.04, 0.10, 0.38]]];
const GROUND = [[2, [0.58, 0.385, 0.215]], [5, [0.615, 0.415, 0.235]], [8, [0.64, 0.44, 0.25]], [11, [0.745, 0.535, 0.315]],
  [16, [0.77, 0.57, 0.34]], [25, [0.80, 0.62, 0.39]], [45, [0.81, 0.66, 0.46]], [90, [0.80, 0.69, 0.53]],
  [170, [0.79, 0.71, 0.59]], [400, [0.77, 0.72, 0.64]], [1500, [0.76, 0.72, 0.67]]];
const AER = [0.80, 0.79, 0.80], AER_D = 110;      // objects pale and cool toward this with distance
const aerAt = z => 1 - Math.exp(-Math.max(z - 6, 0) / AER_D);
const SHADE_MUL = [0.64, 0.64, 0.81];             // shadows multiply the plain by this: cool, transparent
const GLAZE = [0.28, 0.34, 0.62];                 // and a thin blue-violet glaze over them
function stops(list, x) {
  if (x <= list[0][0]) return list[0][1];
  for (let i = 1; i < list.length; i++) if (x <= list[i][0]) return mixc(list[i - 1][1], list[i][1], (x - list[i - 1][0]) / (list[i][0] - list[i - 1][0]));
  return list[list.length - 1][1];
}
const groundAt = z => stops(GROUND, z);
const shadeAt = z => mixc(SHADE_MUL, [1, 1, 1], 0.8 * aerAt(z));

// ── the world ──
const PED = { x: 0, z: 0, rot: 1.2, top: 1.75, hz: 0.46 };   // a pillar on a two-step plinth
const EGG = { x: 13.6, z: -0.25, h: 0.98, r: 0.335 };
const WALKER = { at: 4.0, sx: 330, dist: 52, speed: 3.0, period: 1.35, s: 0.52 };  // on screen at `at`
const TITLE = { text: 'SURREALISM', cap: 1.3, depth: 0.34, dist: 12, at: 9.4 };

// ── camera: a level view camera (verticals stay vertical) with yaw, lens shift and focal length ──
const KEYS = [                                                      // [time, pose], and when each move starts
  [0, { x: -2.50, y: 2.75, z: -2.04, yaw: 0.85, f: 1450, hy: 150 }, 0],
  [2.6, { x: -2.18, y: 2.15, z: -1.72, yaw: 0.85, f: 1450, hy: 330 }, 0],        // creep in and down to the watch
  [3.5, { x: -2.10, y: 3.50, z: -1.62, yaw: 0.855, f: 1450, hy: 320 }, 2.58],    // crane up: the pillar sinks away
  [4.6, { x: 4.38, y: 4.10, z: -8.79, yaw: 0.92, f: 1450, hy: 280 }, 3.18],      // truck right along the shadow
  [5.9, { x: 4.62, y: 4.10, z: -8.90, yaw: 0.945, f: 1450, hy: 280 }, 4.55],     // a slow drift on the egg
  [7.05, { x: 9.00, y: 6.00, z: -11.0, yaw: 1.45, f: 1150, hy: 240 }, 5.45],     // rise and turn: plain and sky
  [DUR, { x: 9.06, y: 6.03, z: -11.1, yaw: 1.453, f: 1150, hy: 242 }, 6.9],      // the settle under the hold
];
function camera(t) {
  const c = { ...KEYS[0][1] };
  for (let i = 1; i < KEYS.length; i++) {
    const e = sine(ramp(t, KEYS[i][2], KEYS[i][0]));
    for (const k in c) c[k] += (KEYS[i][1][k] - KEYS[i - 1][1][k]) * e;
  }
  c.cy = Math.cos(c.yaw); c.sy = Math.sin(c.yaw);
  return c;
}
const view = (c, p) => {                      // world → [x right, y up, z ahead] in camera space
  const dx = p[0] - c.x, dz = p[2] - c.z;
  return [dx * c.cy - dz * c.sy, p[1] - c.y, dx * c.sy + dz * c.cy];
};
const toScreen = (c, p) => { const v = view(c, p); return [W / 2 + c.f * v[0] / v[2], c.hy - c.f * v[1] / v[2], v[2]]; };

// ═════════════════════════════════════════ WebGL ═══════════════════════════════════════════════
const glc = mkCanvas(W, H);
const gl = glc.getContext('webgl2', { antialias: true, premultipliedAlpha: true, preserveDrawingBuffer: true, alpha: true });

const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos; layout(location=1) in vec3 aNrm; layout(location=2) in vec2 aUv; layout(location=3) in float aMat;
uniform vec3 uCam; uniform vec2 uYaw; uniform vec2 uLens; uniform int uFlat; uniform vec3 uLs;
out vec3 vPos; out vec3 vNrm; out vec2 vUv; flat out int vMat; out float vZ; out float vRay;
void main() {
  vec3 p = aPos;
  vRay = p.y / uLs.y;                                // how far the ray runs from here to the plain
  if (uFlat == 1) p -= uLs * vRay;                   // slide along it down onto the plain
  vec3 d = p - uCam;
  float xv = d.x * uYaw.x - d.z * uYaw.y, zv = d.x * uYaw.y + d.z * uYaw.x;
  const float n = 0.05, f = 3000.0;
  gl_Position = vec4(2.0 * uLens.x / ${W}.0 * xv, 2.0 * uLens.x / ${H}.0 * d.y + (1.0 - 2.0 * uLens.y / ${H}.0) * zv,
                     (f + n) / (f - n) * zv - 2.0 * f * n / (f - n), zv);
  vPos = p; vNrm = aNrm; vUv = aUv; vMat = int(aMat + 0.5); vZ = zv;
}`;

const FS_MASK = `#version 300 es
precision highp float;
in vec3 vPos; in vec3 vNrm; in vec2 vUv; flat in int vMat; in float vZ; in float vRay;
uniform sampler2D uGlyph; uniform float uAlpha, uUmbra;
out vec4 o;
void main() {
  float a = uAlpha * (1.0 - smoothstep(uUmbra * 0.35, uUmbra, vRay));   // a thin caster's umbra runs out
  if (vMat == 5 || vMat == 6) a *= smoothstep(0.38, 0.62, texture(uGlyph, vUv).r);
  o = vec4(a);
}`;

const VS_DEPTH = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
uniform vec3 uLO, uLR, uLU, uLF; uniform vec2 uLExt;
void main() { vec3 q = aPos - uLO; gl_Position = vec4(dot(q, uLR) / uLExt.x, dot(q, uLU) / uLExt.x, dot(q, uLF) / uLExt.y, 1.0); }`;
const FS_DEPTH = `#version 300 es
precision highp float;
void main() {}`;

// materials: 0 stone, 1 enamel dial, 2 gold, 3 egg, 4 clock case, 5 letter face, 6 letter return,
// 7 thin legs, 8 the walker's dial
const FS_OBJ = `#version 300 es
precision highp float; precision highp sampler2DShadow;
in vec3 vPos; in vec3 vNrm; in vec2 vUv; flat in int vMat; in float vZ;
uniform vec3 uCam, uSun, uSunCol, uAer, uSkyHor, uSkyMid, uSkyZen, uGndFar, uGndNear;
uniform float uAerD, uPedTop, uCap, uContactK; uniform vec2 uPedAx;
uniform sampler2D uDial, uGlyph, uFM;
uniform sampler2DShadow uSM; uniform int uUseSM;
uniform vec3 uLO, uLR, uLU, uLF; uniform vec2 uLExt;
uniform vec3 uFO, uFR, uFN; uniform vec2 uFExt;
uniform vec3 uLetR; uniform vec2 uTexel;
out vec4 o;
vec3 env(vec3 r) {
  if (r.y > 0.0) return mix(mix(uSkyHor, uSkyMid, smoothstep(0.0, 0.1, r.y)), uSkyZen, smoothstep(0.1, 0.7, r.y));
  return mix(uGndFar, uGndNear, smoothstep(0.0, -0.35, r.y));
}
float lit(vec3 p, vec3 n) {
  if (uUseSM == 0) return 1.0;
  vec3 q = p + n * 0.004 - uLO;
  vec3 l = vec3(dot(q, uLR) / uLExt.x, dot(q, uLU) / uLExt.x, dot(q, uLF) / uLExt.y) * 0.5 + 0.5;
  if (l.x < 0.0 || l.y < 0.0 || l.x > 1.0 || l.y > 1.0) return 1.0;
  float s = 0.0;
  for (int i = -1; i <= 1; i++) for (int j = -1; j <= 1; j++)
    s += texture(uSM, vec3(l.xy + vec2(float(i), float(j)) * 0.6 / 2048.0, l.z - 0.0004));
  return s / 9.0;
}
// how closely the melted watch lies over this point of the pillar's front face (0 none, 1 touching)
float contact(vec3 p, vec3 n) {
  if (uUseSM == 0 || dot(n, uFN) < 0.8) return 0.0;
  vec3 q = p - uFO;
  if (abs(dot(q, uFN)) > 0.03) return 0.0;
  vec2 c = vec2(dot(q, uFR), q.y) / uFExt.x * 0.5 + 0.5;
  float occ = 0.0;
  for (int i = 0; i < 16; i++) {
    float a = float(i) * 2.39996, r = sqrt((float(i) + 0.5) / 16.0) * 0.028 / uFExt.x * 0.5;
    float d = texture(uFM, c + r * vec2(cos(a), sin(a))).r * uFExt.y;
    occ += exp(-d / 0.045);
  }
  return occ / 16.0;
}
void main() {
  vec3 N = normalize(vNrm), V = normalize(uCam - vPos);
  float alpha = 1.0;
  if (vMat == 5 || vMat == 6) {
    float m = texture(uGlyph, vUv).r;
    // the face keeps a soft edge; each return slab is solid where the next one in front stops, so the
    // stacked slivers of the return never let the ground show through
    alpha = vMat == 5 ? smoothstep(0.4, 0.6, m) : smoothstep(0.25, 0.5, m);
    if (alpha < 0.02) discard;
    if (vMat == 6) {                                   // the return: its normal is the glyph edge's outward direction
      vec2 e = uTexel * 3.0;
      vec2 g = vec2(texture(uGlyph, vUv + vec2(e.x, 0.0)).g - texture(uGlyph, vUv - vec2(e.x, 0.0)).g,
                    texture(uGlyph, vUv + vec2(0.0, e.y)).g - texture(uGlyph, vUv - vec2(0.0, e.y)).g);
      vec2 d = g / max(length(g), 1e-5);
      N = normalize(uLetR * d.x - vec3(0.0, 1.0, 0.0) * d.y);
    }
  }
  float sh = (vMat <= 2) ? lit(vPos, N) : 1.0;
  float ndl = max(dot(N, uSun), 0.0);
  vec3 Hh = normalize(uSun + V);
  float ndh = max(dot(N, Hh), 0.0);
  vec3 R = reflect(-V, N);
  // the cool sky fills the shade from above; the ochre plain throws warm light back up onto low faces
  vec3 skyFill = mix(vec3(0.30, 0.33, 0.42), vec3(0.42, 0.48, 0.63), 0.5 + 0.5 * N.y);
  vec3 bounce = vec3(0.66, 0.46, 0.25) * 0.5 * (1.0 - smoothstep(0.0, 1.4, vPos.y)) * (1.0 - max(N.y, 0.0)) * (0.6 + 0.4 * max(-dot(N.xz, uSun.xz), 0.0));
  vec3 col;
  if (vMat == 0) {
    // cold pale stone, painted: the sunlit face falls off from its top edge downward, the shade face is a
    // cool slate that warms toward the ground with light thrown up by the plain, and the rounded vertical
    // edges catch a thin pale line of light
    float y = vPos.y, pillar = step(0.295, y);
    float b0 = y < 0.165 ? 0.0 : 0.16, b1 = y < 0.165 ? 0.16 : 0.29;
    float down = clamp((uPedTop - y) / 1.1, 0.0, 1.0);
    float grad = mix(mix(0.5, 0.58, clamp((y - b0) / (b1 - b0), 0.0, 1.0)), mix(1.0, 0.5, pow(down, 0.85)), pillar);
    float warm = mix(1.0, smoothstep(0.3, 1.1, uPedTop - y), pillar);
    vec3 alb = vec3(0.86, 0.855, 0.84);
    float sun = ndl * sh;
    vec3 cool = skyFill * (0.3 + 0.55 * (1.0 - sun)) * (1.0 - 0.6 * warm * (1.0 - sun)) * mix(1.0, grad, sun);
    col = alb * (uSunCol * sun * 1.12 * grad + cool + vec3(0.66, 0.46, 0.25) * 0.54 * warm * (1.0 - sun));
    vec3 ax = vec3(uPedAx.x, 0.0, -uPedAx.y), az = vec3(uPedAx.y, 0.0, uPedAx.x);
    float faceness = max(max(abs(dot(N, ax)), abs(N.y)), abs(dot(N, az)));
    col += vec3(0.95, 0.93, 0.88) * 0.32 * (1.0 - smoothstep(0.9, 0.99, faceness)) * max(dot(N, uSun), 0.0) * sh * pillar;
    col *= 1.0 - min(1.6 * contact(vPos, N), 0.8) * uContactK;
  } else if (vMat == 1) {
    vec3 alb = texture(uDial, vUv).rgb * vec3(0.95, 0.935, 0.9);
    col = alb * (uSunCol * ndl * sh * 0.9 + skyFill * 0.95 + bounce * 0.6) + uSunCol * 0.14 * pow(ndh, 90.0) * sh + 0.03 * env(R);
  } else if (vMat == 2) {
    vec3 g = vec3(0.86, 0.64, 0.30);
    vec3 e = env(R);
    e = mix(e, vec3(dot(e, vec3(0.33))), 0.35);
    float fres = 0.55 + 0.45 * pow(1.0 - max(dot(N, V), 0.0), 3.0);
    col = g * (e * 1.05 * fres + 0.35 * (uSunCol * ndl * sh + skyFill * 0.5))
        + vec3(1.0, 0.95, 0.82) * (1.6 * pow(max(dot(R, uSun), 0.0), 160.0) + 0.22 * pow(max(dot(R, uSun), 0.0), 18.0)) * sh;
  } else if (vMat == 3) {
    vec3 alb = vec3(0.95, 0.915, 0.85);
    float wrap = max((dot(N, uSun) + 0.15) / 1.15, 0.0);
    vec3 under = vec3(0.66, 0.46, 0.26) * max(-N.y, 0.0) * 0.55;
    col = alb * (uSunCol * wrap * 0.9 + skyFill * 0.95 + under + bounce * 0.5) + uSunCol * 0.16 * pow(ndh, 45.0);
  } else if (vMat == 4) {
    col = vec3(0.58, 0.49, 0.42) * (uSunCol * ndl + skyFill) + uSunCol * 0.1 * pow(ndh, 40.0);
  } else if (vMat == 5 || vMat == 6) {
    // matte painted stone: warm ivory in the light, a cool grey-violet in the shade, the tops pale with the
    // sky; a little lighter toward the top, darker in a tight band where each letter meets the ground
    float v = clamp(vPos.y / uCap, 0.0, 1.0);
    vec3 alb = vec3(0.945, 0.92, 0.80) * mix(0.93, 1.02, v) * mix(0.8, 1.0, smoothstep(0.0, 0.025, vPos.y));
    col = alb * (vec3(0.50, 0.48, 0.58) * (1.0 - 0.44 * ndl) + uSunCol * ndl + vec3(0.17, 0.18, 0.2) * max(N.y, 0.0));
  } else if (vMat == 7) {
    col = vec3(0.40, 0.39, 0.40) * (uSunCol * ndl + skyFill);
  } else {
    col = vec3(0.92, 0.90, 0.84) * (uSunCol * ndl + skyFill);
  }
  col = mix(col, 0.8 + 0.2 * (1.0 - exp(-(col - 0.8) / 0.2)), step(0.8, col));   // a soft shoulder, no clipped whites
  col = mix(col, uAer, 1.0 - exp(-max(vZ - 6.0, 0.0) / uAerD));                   // aerial perspective
  o = vMat >= 5 && vMat <= 6 ? vec4(col, alpha) : vec4(col * alpha, alpha);   // letters: alpha only drives coverage
}`;

// a full-frame quad at the far plane: with depth test GREATER it touches exactly the samples something
// covered, and sets their alpha to one (alpha-to-coverage also stores the fragment's partial alpha)
const VS_FULL = `#version 300 es
layout(location=0) in vec3 aPos;
void main() { gl_Position = vec4(aPos.xy, 1.0, 1.0); }`;
const FS_ONE = `#version 300 es
precision highp float;
out vec4 o;
void main() { o = vec4(0.0, 0.0, 0.0, 1.0); }`;

function compile(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const loc = {};
  p.u = name => (name in loc ? loc[name] : (loc[name] = gl.getUniformLocation(p, name)));
  return p;
}
let P_OBJ, P_MASK, P_DEPTH, P_ONE, MESH_FULL;

// interleaved vertices: position 3, normal 3, uv 2, material 1
class Mesh {
  constructor(data, idx, dynamic = false) {
    this.vao = gl.createVertexArray(); gl.bindVertexArray(this.vao);
    this.vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, this.vbo);

  gl.uniform3fv(p.u('uFO'), FM.o); gl.uniform3fv(p.u('uFR'), FM.r); gl.uniform3fv(p.u('uFN'), FM.n); gl.uniform2f(p.u('uFExt'), FM.ext, FM.dmax);
  gl.uniform3fv(p.u('uLetR'), TITLE_R); gl.uniform2f(p.u('uTexel'), 1 / GW, 1 / GH);
}
// the objects themselves
function glObjects(t, c) {
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
  gl.useProgram(P_OBJ); setObjUniforms(P_OBJ, c, LSH);
  gl.uniform1i(P_OBJ.u('uUseSM'), pedOn(t) ? 1 : 0);
  gl.uniform1f(P_OBJ.u('uContactK'), sstep(ramp(t, T.sag[0] + 0.4, T.sag[1])));
  if (pedOn(t)) MESH_PED.draw();
  if (watchOn(t)) MESH_WATCH.draw();
  gl.uniform1i(P_OBJ.u('uUseSM'), 0);
  MESH_EGG.draw();
  if (walkOn(t)) MESH_WALK.draw();
}
// the letters, alone, so the whole word can fade as one
function glTitle(t, c) {
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.disable(gl.BLEND);
  gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  gl.useProgram(P_OBJ); setObjUniforms(P_OBJ, c, LSH_T); gl.uniform1i(P_OBJ.u('uUseSM'), 0);
  MESH_TITLE.draw();
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
  gl.colorMask(false, false, false, true); gl.depthMask(false); gl.depthFunc(gl.GREATER);
  gl.useProgram(P_ONE); MESH_FULL.draw();
  gl.colorMask(true, true, true, true); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
}

// ── 2D: the sky and the plain, as gradients in screen rows (the camera never rolls or pitches) ──
function paintWorld(c) {
  const hy = c.hy;
  if (hy > 0) {
    const g = ctx.createLinearGradient(0, 0, 0, hy);
    for (let i = 0; i <= 40; i++) {
      const u = 1 - (1 - i / 40) ** 2, y = hy * u, el = Math.atan((hy - y) / c.f) / DEG;
      g.addColorStop(u, css(stops(SKY, el)));
    }
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, Math.ceil(hy));
    // the low sky is a touch paler on the side of the sun (off frame, to the left)
    const rel = Math.atan2(-Math.cos(SUN_AZ), -Math.sin(SUN_AZ)) - c.yaw;
    const k = clamp(-Math.sin(rel)) * 0.18;
    if (k > 0.01) {
      ctx.save(); ctx.translate(-300, hy); ctx.scale(1, 0.22);
      const r = ctx.createRadialGradient(0, 0, 0, 0, 0, 1600);
      r.addColorStop(0, `rgba(250,246,228,${k})`); r.addColorStop(1, 'rgba(250,246,228,0)');
      ctx.fillStyle = r; ctx.fillRect(0, -hy / 0.22, 2300, hy / 0.22); ctx.restore();
    }
  }
  ctx.fillStyle = groundGradient(c, groundAt); ctx.fillRect(0, Math.ceil(hy), W, H - Math.ceil(hy));
}
function groundGradient(c, colour) {              // a vertical gradient of colour(view depth) below the horizon
  const hy = Math.ceil(c.hy), g = ctx.createLinearGradient(0, hy, 0, H);
  for (let i = 0; i <= 40; i++) {
    const u = (i / 40) ** 2.4, y = hy + u * (H - hy), z = y - c.hy < 0.5 ? 2e3 : c.f * c.y / (y - c.hy);
    const col = colour(z);
    g.addColorStop(u, css(col, col.length > 3 ? col[3] : 1));
  }
  return g;
}

// the bird: a plan silhouette (head +x, right wing +y) for a wing beat at phase ph, its wings folded
// against the body at open = 0 and spread at open = 1
function birdOutline(ph, open) {
  const sp = (0.74 + 0.26 * Math.cos(ph)) * lerp(0.16, 1, open), sw = 0.06 * Math.sin(ph);
  const right = [[0.5, 0], [0.47, 0.035], [0.39, 0.068], [0.29, 0.095],
    [0.27 + sw, 0.25 * sp], [0.23 + sw * 1.5, 0.5 * sp], [0.14 + sw * 2, 0.8 * sp], [0.01 + sw * 2.5, 1.03 * sp],
    [-0.06 + sw * 2.4, 0.98 * sp], [-0.02 + sw * 2.2, 0.91 * sp], [-0.1 + sw * 2, 0.87 * sp], [-0.06 + sw * 1.8, 0.79 * sp],
    [-0.14 + sw * 1.4, 0.69 * sp], [-0.16 + sw, 0.46 * sp], [-0.14 + sw * 0.5, 0.23 * sp], [-0.13, 0.105],
    [-0.23, 0.09], [-0.3, 0.08], [-0.45, 0.15], [-0.52, 0.09], [-0.535, 0.0]];
  // smooth the outline with a Catmull-Rom through the points (right side, then mirrored)
  const pts = [...right, ...right.slice(1, -1).reverse().map(([x, y]) => [x, -y])];
  const outp = [], n = pts.length;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let s = 0; s < 4; s++) {
      const u = s / 4, u2 = u * u, u3 = u2 * u;
      outp.push([0, 1].map(k => 0.5 * ((2 * p1[k]) + (-p0[k] + p2[k]) * u + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * u2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * u3)));
    }
  }
  return outp;
}
// the shadow's tail starts under the egg's foot; its body points a little toward the viewer's side of
// the sun line so that, seen from here, the whole bird lies to the right of the egg
const BIRD = { len: 3.2, wing: 0.81, flap: 0.46, yaw: -0.15 };
function birdState(t) {
  const go = Math.max(0, t - T.birdGo);
  const flapping = t > T.egg;
  const ph = flapping ? (t - T.egg) / BIRD.flap * 2 * PI : 0;
  // it slides off gathering speed, wheeling round to swoop past the viewer's right
  const dist = 7.5 * go * go + 2.4 * go, turnOver = 4, steps = 48;
  const heading = s => BIRD.yaw - 1.2 * sstep(s / turnOver);
  const pos = [EGG.x + Math.cos(BIRD.yaw) * EGG.r * 0.9, EGG.z + Math.sin(BIRD.yaw) * EGG.r * 0.9];
  for (let i = 0; i < steps; i++) {
    const a = heading(dist * (i + 0.5) / steps);
    pos[0] += Math.cos(a) * dist / steps; pos[1] += Math.sin(a) * dist / steps;
  }
  return { pos, ang: heading(dist), ph, open: sstep(ramp(t, T.egg - 0.45, T.egg)) };
}
function birdPoints(t) {                          // the outline on the ground, in world x, z
  const B = birdState(t), ca = Math.cos(B.ang), sa = Math.sin(B.ang), L = BIRD.len;
  return birdOutline(B.ph, B.open).map(([x, y]) => {
    const lx = (x + 0.535) * L, ly = y * L * BIRD.wing;   // the tail at the anchor, the head ahead of it
    return [B.pos[0] + lx * ca + ly * sa, B.pos[1] + lx * sa - ly * ca];
  });
}
function drawBird(g, c, t) {
  g.beginPath();
  let ok = true;
  birdPoints(t).forEach(([wx, wz], i) => {
    const s = toScreen(c, [wx, 0, wz]);
    if (s[2] < 0.3) ok = false;
    if (i) g.lineTo(s[0], s[1]); else g.moveTo(s[0], s[1]);
  });
  g.closePath();
  if (ok) g.fill();
}

// ── static finish, painted once: a fine canvas weave and a warm varnished vignette ──
let WEAVE, VIG;
function paintFinish() {
  WEAVE = mkCanvas(W, H);
  const g = WEAVE.getContext('2d'), img = g.createImageData(W, H), rnd = noiseGen(1924);
  const P = 3.4, Q = 3.1, NX = Math.ceil(W / P) + 2, NY = Math.ceil(H / Q) + 2;
  const tx = Float32Array.from({ length: NX }, () => rnd() - 0.5), ty = Float32Array.from({ length: NY }, () => rnd() - 0.5);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = x / P, v = y / Q, iu = Math.floor(u), iv = Math.floor(v);
    const over = ((iu + iv) & 1) ? Math.sin(PI * (u - iu)) : Math.sin(PI * (v - iv));   // the thread on top shows its bump
    const val = 0.6 * (over - 0.64) + 0.35 * (((iu + iv) & 1) ? tx[iu] : ty[iv]) + 0.3 * (rnd() - 0.5);
    const o = (y * W + x) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = 128 + val * 22; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  VIG = mkCanvas(W, H);
  const v = VIG.getContext('2d'), r = v.createRadialGradient(W / 2, H * 0.47, H * 0.42, W / 2, H * 0.47, H * 1.12);
  r.addColorStop(0, 'rgb(255,255,255)'); r.addColorStop(0.55, 'rgb(246,242,236)'); r.addColorStop(1, 'rgb(196,186,176)');
  v.fillStyle = r; v.fillRect(0, 0, W, H);
}

const SHADE_LAYER = mkCanvas(W, H), sctx = SHADE_LAYER.getContext('2d');
// the mask now in the GL canvas (plus the casters drawn in 2D, if asked) filled with a gradient, then laid on the frame
function layShadow(c, t, fill, op, alpha, flat2d) {
  sctx.globalCompositeOperation = 'source-over'; sctx.clearRect(0, 0, W, H);
  sctx.drawImage(glc, 0, 0);
  if (flat2d) { sctx.fillStyle = '#fff'; drawBird(sctx, c, t); if (walkOn(t)) drawWalkerShadow(sctx, c, t); }
  sctx.globalCompositeOperation = 'source-in'; sctx.fillStyle = fill; sctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = op; ctx.globalAlpha = alpha; ctx.drawImage(SHADE_LAYER, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
}
const birdOn = t => t < 6.6;
function render(t) {
  const c = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  paintWorld(c);
  glFrame(t);
  // cast shadows: multiplied onto the plain with a cool tint, then a thin glaze, both fading with distance
  glMask(t, c, false);
  layShadow(c, t, groundGradient(c, shadeAt), 'multiply', 1, birdOn(t));
  layShadow(c, t, groundGradient(c, z => [...GLAZE, 0.2 * (1 - 0.8 * aerAt(z))]), 'source-over', 1, birdOn(t));
  // the letters' contact with the ground, with the letters
  const fa = titleFace(t);
  if (fa > 0) { glMask(t, c, true); layShadow(c, t, 'rgb(118,104,120)', 'multiply', fa, false); }
  // objects
  glObjects(t, c);
  ctx.drawImage(glc, 0, 0);
  // the word, whole
  if (fa > 0) { glTitle(t, c); ctx.globalAlpha = fa; ctx.drawImage(glc, 0, 0); ctx.globalAlpha = 1; }
  // the caption, whole: dark ink on the lit plain
  const sa = sstep(ramp(t, T.subIn[0], T.subIn[1]));
  if (sa > 0) {
    const b = toScreen(c, TITLE_POS);
    ctx.font = 'italic 430 52px "Noto Serif Display"'; ctx.letterSpacing = '5px';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = `rgba(26,27,52,${sa})`;
    ctx.fillText('Paris · from 1924', b[0], b[1] + 92);
    ctx.letterSpacing = '0px';
  }
  // finish
  ctx.globalCompositeOperation = 'soft-light'; ctx.drawImage(WEAVE, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(VIG, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  const fin = 1 - sstep(ramp(t, T.fadeIn[0], T.fadeIn[1])), fout = sine(ramp(t, T.fadeOut[0], T.fadeOut[1]));
  const k = Math.max(fin, fout);
  if (k > 0) { ctx.fillStyle = `rgba(4,5,9,${k})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = ({ t }) => { render(t); return out.toDataURL('image/jpeg', 0.92).split(',')[1]; };

// sound cues for audio.py; pans come from where things are on screen (-1 left … 1 right)
const panAt = (t, p) => { const s = toScreen(camera(t), p); return s[2] > 0 ? clamp((s[0] - W / 2) / (W / 2), -1, 1) : 0; };
window.events = () => {
  const ev = [{ k: 'drone', t: 0, d: DUR }];
  const watchPos = [PED.x - 0.25, PED.top, PED.z - 0.1];
  for (let k = 0; T.tick0 + k < 4.4; k++) {
    const t = T.tick0 + k;
    ev.push({ k: 'tick', t, v: clamp(1.1 - 0.4 * Math.max(0, t - 2.4)), pan: panAt(t, watchPos) * 0.6 });
  }
  ev.push({ k: 'creak', t: T.lift[0], d: T.lift[1] - T.lift[0] });
  ev.push({ k: 'melt', t: T.sag[0], d: T.sag[1] - T.sag[0] });
  ev.push({ k: 'settle', t: T.settle });
  ev.push({ k: 'air', t: KEYS[2][2], d: KEYS[3][0] - KEYS[2][2] }, { k: 'air', t: KEYS[5][2], d: KEYS[5][0] - KEYS[5][2] });
  const eggPos = [EGG.x, 0.5, EGG.z];
  for (let k = 0; T.egg + (k + 0.5) * BIRD.flap < T.birdGo + 0.9; k++) {
    const t = T.egg + (k + 0.5) * BIRD.flap, b = birdState(t);
    ev.push({ k: 'wing', t, v: 1 - 0.12 * k, pan: panAt(t, [b.pos[0], 0, b.pos[1]]) });
  }
  ev.push({ k: 'glide', t: T.birdGo, d: 1.0, pan0: panAt(T.birdGo, eggPos), pan1: 1 });
  for (let k = 1; k < 12; k++) {
    const wt = k * 0.5 * WALKER.period;                              // a foot lands every half cycle
    const t = T.walk + (wt < 0.3 ? Math.sqrt(1.2 * wt) : wt + 0.3); // (walkTime inverted)
    if (t > 5.5) break;
    ev.push({ k: 'stride', t, v: 1, pan: panAt(t, walkerAt(t)) });
  }
  ev.push({ k: 'shadow', t: T.shadowIn[0], d: T.shadowIn[1] - T.shadowIn[0] });
  ev.push({ k: 'chime', t: T.lettersIn[0] + 0.1 });
  ev.push({ k: 'shimmer', t: T.subIn[0] });
  ev.push({ k: 'end', t: T.fadeOut[0], d: DUR - T.fadeOut[0] });
  return ev.sort((a, b) => a.t - b.t);
};

window.ready = (async () => {
  await Promise.all([['640 400px "Noto Serif Display"', TITLE.text], ['500 138px "Noto Serif Display"', 'XIVL'],
    ['italic 430 52px "Noto Serif Display"', 'Paris · from 1924']].map(([f, s]) => document.fonts.load(f, s)));
  await document.fonts.ready;
  P_OBJ = compile(VS, FS_OBJ); P_MASK = compile(VS, FS_MASK); P_DEPTH = compile(VS_DEPTH, FS_DEPTH); P_ONE = compile(VS_FULL, FS_ONE);
  { const g = new Geo(), n = [0, 0, 1]; g.quad(g.vert([-1, -1, 0], n, [0, 0], 0), g.vert([1, -1, 0], n, [0, 0], 0), g.vert([1, 1, 0], n, [0, 0], 0), g.vert([-1, 1, 0], n, [0, 0], 0)); MESH_FULL = new Mesh(...g.data()); }
  buildPedestal(); buildEgg(); buildWatch(); paintDial(); paintGlyphs(); buildTitle(); buildShadowMaps();
  placeWalker();
  buildWalker(4);
  paintFinish();
})();
</script>
