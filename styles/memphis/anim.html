<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#ffd9ea}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// 80s Memphis: "PIZZA FRIDAY!" office party invite. Terrazzo, squiggles and zigzags bounce in, a patterned
// pizza slice spins and flips, a zigzag band wipes to a bold invitation card whose details pop with overshoot.
const W = 1920, H = 1080, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DUR = 9.5, FR = "'Rubik', sans-serif", FS = "'Shrikhand', cursive";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x;
const eOutQ = x => 1 - Math.pow(1 - x, 4);
const eIO = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = (x, s = 2.6) => { const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const eElastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -9 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
function off(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const C = { ink: '#161616', cream: '#fff8ec', pink: '#ff71ce', yellow: '#ffce5c', teal: '#86ccca', purple: '#6a7bb4', neon: '#ff2e88', blue: '#2d5bff', lime: '#d7ff3c', orange: '#ff8a3d', bg1: '#ffd9ea', bg2: '#c4eedf' };
const LW = 7;

// ---------- patterns + terrazzo ----------
let PAT = {}, BGP1, BGP2, CONF_COLS;
function mkPat(w, h, draw) { const c = off(w, h), g = c.getContext('2d'); draw(g); return ctx.createPattern(c, 'repeat'); }
// terrazzo: irregular chips scattered on a base, drawn wrapped so the tile repeats without seams
function terrazzoTile(size, base, cols, n, rMin, rMax, seed) {
  const c = off(size, size), g = c.getContext('2d'), r = rng(seed);
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < n; i++) {
    const x = r() * size, y = r() * size, rad = rMin + r() * (rMax - rMin), k = 4 + Math.floor(r() * 3), rot = r() * 7, col = cols[Math.floor(r() * cols.length)];
    const pts = Array.from({ length: k }, (_, j) => { const a = rot + j / k * Math.PI * 2 + (r() - 0.5) * 0.8, rr = rad * (0.55 + r() * 0.5); return [Math.cos(a) * rr, Math.sin(a) * rr]; });
    for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) {
      g.beginPath(); pts.forEach(([px, py], j) => j ? g.lineTo(x + ox + px, y + oy + py) : g.moveTo(x + ox + px, y + oy + py)); g.closePath();
      g.fillStyle = col; g.fill();
    }
  }
  g.fillStyle = C.ink; for (let i = 0; i < n * 2; i++) { const x = r() * size, y = r() * size; g.beginPath(); g.arc(x, y, 1.5 + r() * 2.5, 0, 7); g.fill(); }
  return c;
}
function buildAssets() {
  PAT.dots = (col, dot = C.ink, r = 4.5) => mkPat(34, 34, g => { g.fillStyle = col; g.fillRect(0, 0, 34, 34); g.fillStyle = dot; g.beginPath(); g.arc(8, 8, r, 0, 7); g.arc(25, 25, r, 0, 7); g.fill(); });
  PAT.stripe = (col) => mkPat(40, 40, g => { g.fillStyle = col; g.fillRect(0, 0, 40, 40); g.strokeStyle = C.ink; g.lineWidth = 7; for (const o of [-40, 0, 40]) { g.beginPath(); g.moveTo(o, 40); g.lineTo(o + 40, 0); g.stroke(); } });
  PAT.zig = (col, line = C.ink) => mkPat(60, 36, g => { g.fillStyle = col; g.fillRect(0, 0, 60, 36); g.strokeStyle = line; g.lineWidth = 5; g.beginPath(); g.moveTo(0, 26); g.lineTo(15, 10); g.lineTo(30, 26); g.lineTo(45, 10); g.lineTo(60, 26); g.stroke(); });
  PAT.w = { dotsY: PAT.dots(C.yellow), stripeT: PAT.stripe(C.teal), zigP: PAT.zig(C.pink), dotsC: PAT.dots(C.cream), stripeY: PAT.stripe(C.yellow),
    pep: PAT.dots(C.neon, C.cream, 4), crust: PAT.zig(C.orange, C.cream) };
  const chips = [C.pink, C.teal, C.blue, C.yellow, C.purple, C.neon];
  PAT.terr = ctx.createPattern(terrazzoTile(300, C.cream, chips, 46, 7, 22, 7), 'repeat');
  PAT.terrPink = ctx.createPattern(terrazzoTile(300, C.pink, [C.cream, C.teal, C.yellow, C.blue, C.ink], 40, 6, 20, 19), 'repeat');
  PAT.cheese = ctx.createPattern(terrazzoTile(220, C.yellow, [C.cream, C.orange, C.teal, C.pink], 26, 4, 11, 31), 'repeat');
  // backgrounds with a subtle grid of dots (pre-rendered)
  const bg = (col, dot) => { const c = off(W, H), g = c.getContext('2d'); g.fillStyle = col; g.fillRect(0, 0, W, H); g.fillStyle = dot;
    for (let y = 30; y < H; y += 48) for (let x = 30 + ((y / 48) % 2) * 24; x < W; x += 48) { g.beginPath(); g.arc(x, y, 3.2, 0, 7); g.fill(); } return c; };
  BGP1 = bg(C.bg1, 'rgba(255,113,206,0.35)'); BGP2 = bg(C.bg2, 'rgba(106,123,180,0.25)');
  CONF_COLS = [C.pink, C.yellow, C.teal, C.blue, C.neon, C.purple];
}

// ---------- drawing helpers ----------
function hard(pathFn, fill, sh = C.ink, dx = 12, dy = 12, stroke = true) {
  ctx.save(); ctx.translate(dx, dy); pathFn(); ctx.fillStyle = sh; ctx.fill(); ctx.restore();
  pathFn(); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.lineWidth = LW; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function hardText(str, x, y, px, fill, fam = FR, w = 900, sh = C.ink, d = 10, sw = 9) {
  ctx.font = `${w} ${px}px ${fam}`; ctx.lineJoin = 'round'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = sh; ctx.strokeStyle = sh; ctx.lineWidth = sw; ctx.strokeText(str, x + d, y + d); ctx.fillText(str, x + d, y + d);
  ctx.strokeStyle = C.ink; ctx.strokeText(str, x, y); ctx.fillStyle = fill; ctx.fillText(str, x, y);
}
function squiggle(len, amp, n) { ctx.beginPath(); for (let i = 0; i <= 60; i++) { const u = i / 60; const x = (u - 0.5) * len, y = Math.sin(u * n * Math.PI * 2) * amp; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } }
function zigPath(len, amp, n) { ctx.beginPath(); for (let i = 0; i <= n * 2; i++) { const x = (i / (n * 2) - 0.5) * len, y = (i % 2 ? -amp : amp); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } }
function strokeCol(col, w, shDx = 8) { ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.save(); ctx.translate(shDx, shDx); ctx.strokeStyle = C.ink; ctx.lineWidth = w; ctx.stroke(); ctx.restore(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); }
function blob(r, k, wob, ph) { ctx.beginPath(); for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2, rr = r * (1 + wob * Math.sin(a * k + ph)); i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); }
const outScale = (t, k) => { if (k == null) return 1; const o = seg(t, k, k + 0.35); return o <= 0 ? 1 : o < 0.3 ? 1 + Math.sin(o / 0.3 * Math.PI) * 0.15 : 1 - eIn((o - 0.3) / 0.7); };
function confPiece(k, col, sc) {
  ctx.fillStyle = col; ctx.strokeStyle = C.ink; ctx.lineWidth = 4; ctx.beginPath();
  if (k === 0) ctx.rect(-12 * sc, -12 * sc, 24 * sc, 24 * sc); else if (k === 1) ctx.arc(0, 0, 12 * sc, 0, 7);
  else { ctx.moveTo(0, -15 * sc); ctx.lineTo(14 * sc, 11 * sc); ctx.lineTo(-14 * sc, 11 * sc); ctx.closePath(); }
  ctx.fill(); ctx.stroke();
}
function deco(d, t) {
  const p = seg(t, d.t0, d.t0 + 0.45); if (p <= 0) return; const s = eBack(p) * outScale(t, d.out); if (s <= 0.001) return;
  const hop = Math.abs(Math.sin(t * 3.2 + d.ph)) * 10, wig = Math.sin(t * 2.4 + d.ph) * 0.12;
  ctx.save(); ctx.translate(d.x, d.y - hop); ctx.rotate(d.r + wig + (1 - p) * 1.4); ctx.scale(s * d.s, s * d.s);
  switch (d.k) {
    case 'squig': squiggle(180, 18, 2.5); strokeCol(d.c, 16); break;
    case 'zig': zigPath(190, 22, 4); strokeCol(d.c, 14); break;
    case 'tri': hard(() => { ctx.beginPath(); ctx.moveTo(0, -60); ctx.lineTo(56, 44); ctx.lineTo(-56, 44); ctx.closePath(); }, d.c, C.ink, 9, 9); break;
    case 'ring': ctx.beginPath(); ctx.arc(0, 0, 52, 0, 7); ctx.save(); ctx.translate(8, 8); ctx.strokeStyle = C.ink; ctx.lineWidth = 22; ctx.stroke(); ctx.restore(); ctx.strokeStyle = d.c; ctx.lineWidth = 22; ctx.stroke(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.arc(0, 0, 63, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 41, 0, 7); ctx.stroke(); break;
    case 'half': hard(() => { ctx.beginPath(); ctx.arc(0, 20, 70, Math.PI, 0); ctx.closePath(); }, PAT.w.stripeY, C.ink, 9, 9); break;
    case 'dots': ctx.fillStyle = C.ink; for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.arc(-54 + i * 36, -54 + j * 36, 8, 0, 7); ctx.fill(); } break;
    case 'plus': hard(() => { ctx.beginPath(); ctx.rect(-14, -48, 28, 96); ctx.rect(-48, -14, 96, 28); }, d.c, C.ink, 8, 8, false); break;
    case 'pill': hard(() => { ctx.beginPath(); ctx.roundRect(-80, -26, 160, 52, 26); }, PAT.w.dotsC, C.ink, 9, 9); break;
    case 'terr': hard(() => blob(62, 3, 0.1, d.ph), PAT.terrPink, C.ink, 9, 9); break;
    case 'conf': for (let i = 0; i < 5; i++) { const a = i * 1.26 + d.ph, rr = 34 + (i % 2) * 22; ctx.save(); ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr); ctx.rotate(a * 2); confPiece(i % 3, CONF_COLS[(i + d.i) % 6], 1); ctx.restore(); } break;
  }
  ctx.restore();
}
const mkDeco = (arr, s, t0, dt, outs) => arr.map((d, i) => ({ ...d, s, i, ph: i * 1.3 + s, t0: t0 + i * dt, out: outs ? outs(i) : null }));
const DECO1 = mkDeco([
  { k: 'squig', x: 170, y: 130, c: C.teal, r: -0.2 }, { k: 'terr', x: 1110, y: 140, r: 0 }, { k: 'dots', x: 1800, y: 140, r: 0.2 },
  { k: 'ring', x: 1180, y: 960, c: C.pink, r: 0 }, { k: 'zig', x: 1730, y: 950, c: C.purple, r: -0.15 }, { k: 'half', x: 140, y: 960, c: C.yellow, r: 0.2 },
  { k: 'plus', x: 1860, y: 470, c: C.blue, r: 0.3 }, { k: 'pill', x: 470, y: 80, r: -0.12 }, { k: 'squig', x: 1560, y: 100, c: C.neon, r: 0.15 },
  { k: 'tri', x: 110, y: 560, c: C.teal, r: -0.5 }, { k: 'conf', x: 900, y: 990, r: -0.3 }, { k: 'conf', x: 1010, y: 460, r: 0.4 }
], 1, 0.12, 0.05);
const DECO2 = mkDeco([
  { k: 'zig', x: 170, y: 110, c: C.pink, r: 0.1 }, { k: 'ring', x: 1810, y: 120, c: C.yellow, r: 0 }, { k: 'dots', x: 80, y: 560, r: 0.4 },
  { k: 'tri', x: 1840, y: 700, c: C.purple, r: 0.4 }, { k: 'squig', x: 150, y: 1000, c: C.blue, r: -0.3 }, { k: 'plus', x: 1830, y: 980, c: C.neon, r: 0.2 },
  { k: 'terr', x: 90, y: 330, r: 0 }, { k: 'conf', x: 1850, y: 420, r: 0.2 }, { k: 'half', x: 700, y: 1030, c: C.yellow, r: -0.1 }, { k: 'pill', x: 1260, y: 1030, r: 0.08 }
], 0.85, 4.55, 0.045, i => [0, 1, 5].includes(i) ? null : 8.5 + i * 0.03);

// ---------- the pizza slice (local coords: crust on top, tip at +270) ----------
const PEPS = [[-92, -96, 44], [72, -118, 40], [-6, -8, 46], [98, -22, 28], [-58, 88, 32], [22, 150, 24]];
function slicePath() { ctx.beginPath(); ctx.moveTo(-200, -190); ctx.lineTo(200, -190); ctx.lineTo(0, 270); ctx.closePath(); }
function crustPath() { ctx.beginPath(); ctx.roundRect(-238, -262, 476, 96, 48); }
function drawSlice() {
  // hard ink shadow of the whole slice
  ctx.save(); ctx.translate(16, 16); ctx.fillStyle = C.ink; slicePath(); ctx.fill(); crustPath(); ctx.fill(); ctx.restore();
  slicePath(); ctx.fillStyle = PAT.cheese; ctx.fill();
  ctx.save(); slicePath(); ctx.clip();
  // melty cheese drips below the crust
  ctx.fillStyle = C.cream; ctx.beginPath(); ctx.moveTo(-220, -200);
  for (let i = 0; i <= 8; i++) { const x = -200 + i * 50, dy = [30, 58, 26, 70, 34, 50, 22, 62, 28][i]; ctx.lineTo(x, -190 + dy); }
  ctx.lineTo(220, -200); ctx.closePath(); ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
  // pepperoni with Memphis dots
  for (const [x, y, r] of PEPS) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(6, 6, r, 0, 7); ctx.fill();
    ctx.fillStyle = PAT.w.pep; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.stroke(); ctx.restore(); }
  // olives as tiny ink triangles and basil squiggles
  for (const [x, y, a] of [[40, -70, 0.3], [-120, -30, 1.2], [58, 60, 2.1], [-30, 200, 0.8]]) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(13, 10); ctx.lineTo(-13, 10); ctx.closePath(); ctx.fill(); ctx.restore(); }
  for (const [x, y, a] of [[-40, -130, -0.3], [40, 30, 0.5], [-10, 100, -0.8]]) { ctx.save(); ctx.translate(x, y); ctx.rotate(a); squiggle(64, 7, 1.5); ctx.lineCap = 'round'; ctx.strokeStyle = C.ink; ctx.lineWidth = 12; ctx.stroke(); ctx.strokeStyle = C.lime; ctx.lineWidth = 6; ctx.stroke(); ctx.restore(); }
  ctx.restore();
  slicePath(); ctx.lineWidth = LW + 1; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round'; ctx.stroke();
  crustPath(); ctx.fillStyle = PAT.w.crust; ctx.fill(); ctx.lineWidth = LW + 1; ctx.stroke();
}

// ---------- confetti ----------
const BURST = Array.from({ length: 34 }, (_, i) => { const a = -Math.PI / 2 + (i / 34 - 0.5) * 2.8 + Math.sin(i * 12.9) * 0.2, v = 650 + (i * 97 % 520);
  return { vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: i % 6, k: i % 3, rs: (i % 5 - 2) * 4 }; });
function burst(t, t0, x0, y0) {
  const dt = t - t0; if (dt <= 0 || dt > 1.6) return;
  for (const b of BURST) { const x = x0 + b.vx * dt, y = y0 + b.vy * dt + 1400 * dt * dt; if (y > H + 40) continue;
    ctx.save(); ctx.translate(x, y); ctx.rotate(b.rs * dt); ctx.globalAlpha = 1 - seg(dt, 1.2, 1.6); confPiece(b.k, CONF_COLS[b.c], 1); ctx.restore(); }
  ctx.globalAlpha = 1;
}
const RAIN = Array.from({ length: 46 }, (_, i) => { const r = rng(100 + i); return { x: r() * W, ts: 4.4 + r() * 3.9, v: 260 + r() * 220, sw: 20 + r() * 40, ph: r() * 7, k: i % 3, c: i % 6, sc: 0.7 + r() * 0.5 }; });
function rain(t) {
  for (const p of RAIN) { const dt = t - p.ts; if (dt <= 0) continue; const y = -40 + dt * p.v; if (y > H + 40) continue;
    ctx.save(); ctx.translate(p.x + Math.sin(dt * 2.2 + p.ph) * p.sw, y); ctx.rotate(dt * 2 + p.ph); ctx.scale(Math.cos(dt * 4 + p.ph), 1); confPiece(p.k, CONF_COLS[p.c], p.sc); ctx.restore(); }
}

// ---------- scene 1: terrazzo disc + spinning slice + title ----------
const SL = { x: 610, y: 560 };
function sliceTransform(t) {
  // entry: elastic scale, whirl in 2D; then an anticipation squash and a full flip around the vertical axis
  const pe = seg(t, 0.35, 1.35), s = eElastic(pe);
  const rot = -Math.PI * 3 * (1 - eOutQ(pe)) - 0.14 + Math.sin(t * 2.1) * 0.05;
  const ant = seg(t, 2.15, 2.45), fl = seg(t, 2.45, 3.25);
  const squash = Math.sin(ant * Math.PI / 2) * 0.12 * (1 - fl);
  const flip = Math.cos(eIO(fl) * Math.PI * 2);
  const land = t - 3.25, wob = land > 0 ? Math.exp(-land * 8) * Math.sin(land * 26) * 0.1 : 0;
  const lift = Math.sin(fl * Math.PI) * 60;
  return { s, rot, sx: flip * (1 + squash * 0.6) * (1 + wob), sy: (1 - squash) * (1 - wob), lift };
}
function titleWord(t, word, cx, by, px, tStart, cols, hopFrom) {
  ctx.font = `900 ${px}px ${FR}`; const kern = -6, tw = [...word].reduce((a, ch) => a + ctx.measureText(ch).width + kern, -kern); let x = cx - tw / 2;
  for (let i = 0; i < word.length; i++) {
    ctx.font = `900 ${px}px ${FR}`; const ch = word[i], w = ctx.measureText(ch).width, t0 = tStart + i * 0.07, p = seg(t, t0, t0 + 0.5);
    if (p > 0) { const y = by - (1 - eOut(Math.min(1, p * 1.4))) * 180;
      const land = t - (t0 + 0.36), sq = land > 0 ? Math.exp(-land * 10) * Math.sin(land * 30) * 0.18 : 0;
      const hop = t > hopFrom && t < 3.75 ? Math.max(0, Math.sin((t - hopFrom) * 9 - i * 0.7)) * 24 * seg(t, hopFrom, hopFrom + 0.2) : 0;
      ctx.save(); ctx.translate(x + w / 2, y - hop); ctx.scale(1 + sq, 1 - sq); ctx.rotate((i % 2 ? 1 : -1) * 0.05);
      hardText(ch, 0, 0, px, cols[i % cols.length], FR, 900, C.blue, 12, 10); ctx.restore(); }
    x += w + kern;
  }
}
function scene1(t) {
  ctx.drawImage(BGP1, 0, 0);
  DECO1.forEach(d => deco(d, t));
  // terrazzo disc behind the slice
  const dp = eElastic(seg(t, 0.15, 0.95));
  if (dp > 0) { ctx.save(); ctx.translate(SL.x, SL.y); ctx.scale(dp, dp); ctx.rotate(t * 0.15);
    hard(() => blob(345, 5, 0.035, 0.6), PAT.terr, C.neon, 20, 20);
    ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.setLineDash([6, 18]); ctx.lineCap = 'round'; blob(300, 5, 0.035, 0.6); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore(); }
  const st = sliceTransform(t);
  if (st.s > 0.001) { ctx.save(); ctx.translate(SL.x, SL.y + 10 - st.lift); ctx.rotate(st.rot); ctx.scale(st.s * st.sx * 0.95, st.s * st.sy * 0.95); drawSlice(); ctx.restore(); }
  // title
  const kp = eBack(seg(t, 0.5, 0.9));
  if (kp > 0) { ctx.save(); ctx.translate(1390, 285); ctx.rotate(-0.08); ctx.scale(kp, kp); hardText('Office party', 0, 0, 104, C.pink, FS, 400, C.ink, 8, 8); ctx.restore(); }
  titleWord(t, 'PIZZA', 1400, 530, 220, 0.62, [C.yellow, C.teal, C.neon, C.yellow, C.teal], 1.7);
  titleWord(t, 'FRIDAY!', 1400, 760, 180, 0.95, [C.neon, C.yellow, C.teal, C.neon, C.yellow, C.teal, C.pink], 1.9);
  burst(t, 1.05, SL.x, SL.y - 260);
  burst(t, 3.25, SL.x + 80, SL.y - 200);
}

// ---------- transition: triple zigzag band with a terrazzo core ----------
function zigBand(t) {
  const p = seg(t, 3.85, 4.75); if (p <= 0 || p >= 1) return;
  const cx = lerp(-1700, W + 1700, (p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2));
  ctx.save(); ctx.translate(cx, H / 2); ctx.rotate(-0.22);
  const band = (x0, x1, col) => { const amp = 34, per = 70, top = -1300, bot = 1300; ctx.beginPath();
    ctx.moveTo(x0, top); for (let y = top, k = 0; y <= bot; y += per / 2, k++) ctx.lineTo(x0 + (k % 2 ? amp : -amp), y);
    for (let y = bot, k = 0; y >= top; y -= per / 2, k++) ctx.lineTo(x1 + (k % 2 ? amp : -amp), y); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = C.ink; ctx.lineJoin = 'miter'; ctx.stroke(); };
  band(-1250, -1000, C.neon); band(-1000, 1000, PAT.terr); band(1000, 1250, C.yellow);
  ctx.save(); ctx.rotate(Math.PI / 2); ctx.translate(0, 560); squiggle(1400, 40, 5); strokeCol(C.teal, 30, 10); ctx.restore();
  ctx.save(); ctx.rotate(Math.PI / 2); ctx.translate(0, -560); zigPath(1400, 26, 12); strokeCol(C.pink, 22, 8); ctx.restore();
  ctx.restore();
}

// ---------- scene 2: the invitation card ----------
const CARD = { x: 960, y: 544, w: 1300, h: 770 };
const PILLS = [{ w: 'FRIDAY', f: () => PAT.w.dotsY, t0: 6.15 }, { w: '6 PM', f: () => PAT.w.stripeT, t0: 6.42 }, { w: 'ROOFTOP', f: () => PAT.w.zigP, t0: 6.69 }];
const TILT = [-0.06, 0.05, -0.03, 0.06, -0.05, 0, 0.04, -0.05, 0.03, -0.06, 0.05, -0.03, 0.07];
function scene2(t) {
  ctx.drawImage(BGP2, 0, 0);
  rain(t);
  DECO2.forEach(d => deco(d, t));
