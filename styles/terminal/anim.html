<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * terminal — green phosphor CRT. window.draw({t}) → JPEG base64, window.ready
 * Story: power on → boot → `brew deploy --strength=strong` → streaming logs and
 * ASCII progress bars → ERROR: milk not found (glitch) → fix → retry → success →
 * roll-up clear → ASCII coffee cup with steam → blinking cursor → CRT power-off.
 */
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function mk(w, h) { const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; return canvas; }
const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const seg = (t, start, end) => clamp((t - start) / (end - start));
const lerp = (from, to, k) => from + (to - from) * k;
const eOut = k => 1 - Math.pow(1 - k, 3);
const eIn = k => k * k * k;
// cheap deterministic noise in [0, 1): fractional part of a large scaled sine
const hash = n => { const v = Math.sin(n * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const rng = (s => () => { s = s + 0x6D2B79F5 | 0; let q = Math.imul(s ^ s >>> 15, 1 | s); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; })(17);

const MONO = '"JetBrains Mono", monospace';     // the only face on screen
const FS = 32;                                   // font size
const LH = 52;                                   // line height
const X0 = 140, Y0 = 118;                        // top-left of the text grid
let CW = 16.8, COLS = 96;                        // cell width and columns, measured from the font in setup()
const ROWS = 16;
// phosphor colours: normal, dim, bright, and the background used for inverted text
const C = {
  n: '#8ef7aa',
  d: '#3d9a5b',
  b: '#eafff0',
  bg: '#041209',
};

// ── timeline ─────────────────────────────────────────────────────────────────
// Keystroke times for typing `str` from t0: uneven human rhythm, longer after spaces.
function typeTimes(str, t0, seed) {
  const times = [];
  let at = t0;
  for (let i = 0; i < str.length; i++) {
    times.push(at);
    at += 0.017 + 0.02 * hash(i * 7.3 + seed) + (str[i] === ' ' ? 0.04 : 0);
  }
  return times;
}
const PROMPT = [['dev@kitchen', 'n'], [':~$ ', 'd']];
// three typed commands: [text, start time]
const CMDS = [['brew deploy --strength=strong', 1.02], ['brew add milk --type=oat', 4.42], ['brew deploy --retry', 5.42]];
const TT = CMDS.map(([s, t0], k) => typeTimes(s, t0, k * 11 + 1));
const ENT = TT.map(a => a[a.length - 1] + 0.14);
const E1 = ENT[0], E2 = ENT[1], E3 = ENT[2];
const ERR = E1 + 1.72;                         // milk not found
const OK = E3 + 0.96;                          // success line
const ROLL = OK + 0.30, CUP = ROLL + 0.22;     // roll-up clear → cup scene
const CAPTION = CUP + 0.42, PROMPT_END = CUP + 0.62;
const OFF = 9.35;
const BAR = 30;
// progress bar rows: [label, start, end, fill fraction at end, suffix at end]
const STEPS1 = [
  ['grind beans', E1 + 0.16, E1 + 0.58, 1, '18 g'],
  ['heat boiler', E1 + 0.62, E1 + 0.98, 1, '93 °C'],
  ['pull shot', E1 + 1.02, E1 + 1.36, 1, '36 ml'],
  ['steam milk', E1 + 1.40, E1 + 1.62, 0.3, ''],
];
const STEPS2 = [
  ['steam milk', E3 + 0.14, E3 + 0.48, 1, '65 °C'],
  ['pour & serve', E3 + 0.52, E3 + 0.86, 1, '240 ml'],
];

// line log: each entry {t, f(t) → segs, p: prompt line}; the terminal shows the last ROWS lines
const LOG = [];
const L = (t, f, p = false) => LOG.push({ t, f: typeof f === 'function' ? f : () => f, p });
const OKL = (name, info) => [['[ ', 'd'], ['OK', 'b'], [' ] ', 'd'], [name.padEnd(13), 'n'], [info, 'd']];
L(0.44, [['brewOS 3.1  ·  tty1  ·  counter-01', 'd']]);
L(0.54, OKL('boiler', '15 bar  ·  idle'));
L(0.63, OKL('bean hopper', '250 g  ·  dark roast'));
L(0.72, OKL('grinder', 'burr set 4'));
L(0.80, []);
const promptLine = k => t => { let n = 0; while (n < TT[k].length && t >= TT[k][n]) n++; return [...PROMPT, [CMDS[k][0].slice(0, n), 'b']]; };
const spin = t => '|/-\\'[Math.floor(t * 14) % 4];
function barLine([label, a, b, fill, suf], fail) {
  return t => {
    const p = seg(t, a, b), k = Math.round(fill * BAR * eOut(p));
    const segs = [['  ' + label.padEnd(14), 'n'], ['[', 'd'], ['█'.repeat(Math.max(0, k - 1)), 'n'], ['█'.repeat(Math.min(k, 1)), k < BAR * fill ? 'b' : 'n'], ['░'.repeat(BAR - k), 'd'], ['] ', 'd']];
    if (fail) segs.push(t < ERR ? [String(Math.round(fill * 100 * eOut(p))).padStart(3) + '%  ' + spin(t), 'n'] : [' 30%  stalled', 'b']);
    else if (p < 1) segs.push([String(Math.round(100 * eOut(p))).padStart(3) + '%  ' + spin(t), 'n']);
    else segs.push(['100%  ', 'n'], [suf, 'b']);
    return segs;
  };
}
L(0.96, promptLine(0), true);
L(E1 + 0.07, [['» deploying ', 'n'], ['espresso-double', 'b'], [' -> counter-01  (5 steps)', 'd']]);
STEPS1.forEach((s, i) => L(s[1], barLine(s, i === 3)));
L(ERR, [['ERROR: milk not found', 'e'], ['  step 4/5', 'd']]);
L(ERR + 0.12, [['  hint: ', 'd'], ['brew add milk --type=<oat|whole>', 'n']]);
L(ERR + 0.22, [['x deploy failed  ·  exit 1', 'd']]);
L(4.36, promptLine(1), true);
L(E2 + 0.08, OKL('milk added', 'oat  ·  1 L  ·  4 °C'));
L(5.36, promptLine(2), true);
L(E3 + 0.06, [['» resuming at step 4/5', 'n']]);
STEPS2.forEach(s => L(s[1], barLine(s)));
L(OK, [['SUCCESS', 'i'], ['  1 flat white deployed in 4.2 s', 'b']]);
L(OK + 0.1, PROMPT, true);

// ASCII cup (pure ASCII); steam above it is procedural
const CUPART = [
  "  .--------------------------.",
  "  |~~~~~~~~~~~~~~~~~~~~~~~~~~|----.",
  "  |                          |    |",
  "  |          STRONG          |    |",
  "  |                          |    |",
  "  |                          |----'",
  "   \\                        /",
  "    '----------------------'",
  "'~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'",
];
const CUPW = 35, CUP_ROW = 0.035;

// sound events (events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [{ t: 0.02, k: 'on' }];
  TT.forEach((a, k) => a.forEach((t, i) => ev.push({ t, k: 'key', v: 0.6 + 0.4 * hash(i + k * 50) })));
  ENT.forEach(t => ev.push({ t, k: 'enter' }));
  LOG.forEach(l => { if (l.t > 0.4 && !l.p) ev.push({ t: l.t, k: 'tick' }); });
  for (const s of [...STEPS1, ...STEPS2]) { const n = Math.round(s[3] * 10); for (let i = 1; i <= n; i++) ev.push({ t: s[1] + (s[2] - s[1]) * i / n, k: 'blip', v: i / n }); }
  ev.push({ t: ERR, k: 'error' }, { t: OK, k: 'success' }, { t: ROLL, k: 'roll' }, { t: CUP + 0.3, k: 'hiss', d: OFF - CUP - 0.3 });
  for (let r = 0; r < CUPART.length; r++) ev.push({ t: CUP + 0.08 + r * CUP_ROW, k: 'tick' });
  ev.push({ t: OFF, k: 'off' });
  return ev;
};

// ── display content: character cells at time t ───────────────────────────────
const screenAt = t => {
  // frame = { it: text runs { r: row, c: column, s: string, st: style }, cur: cursor cell or null }
  const frame = { it: [], cur: null };
  // adds a run and returns the column just after it (counting code points, so ° and █ take one cell)
  const put = (r, c, str, st = 'n') => { frame.it.push({ r, c, s: str, st }); return c + Array.from(str).length; };
  const putSegs = (r, c, segs) => segs.reduce((col, [s, st]) => put(r, col, s, st), c);
  if (t < 0.40) return frame;                     // screen still warming up
  if (t < CUP) {
    const vis = LOG.filter(l => t >= l.t).slice(-ROWS);
    const shift = t >= ROLL ? Math.floor(eIn(seg(t, ROLL, CUP)) * (ROWS + 1)) : 0;   // roll-up clear
    vis.forEach((l, i) => {
      const r = i - shift; if (r < 0) return;
      const c = putSegs(r, 0, l.f(t));
      if (l.p && i === vis.length - 1 && !shift) frame.cur = { r, c };
    });
    // cursor: steady while typing, blinking while idle
    if (frame.cur) { const k = CMDS.findIndex((cm, i) => t >= cm[1] && t < ENT[i]);
      frame.cur.blink = k < 0 || t - TT[k][Math.max(0, TT[k].findLastIndex(x => t >= x))] > 0.3; }
    return frame;
  }
  // cup scene
  const c0 = Math.floor((COLS - CUPW) / 2), r0 = 3;
  const rowsShown = Math.floor(seg(t, CUP + 0.08, CUP + 0.08 + CUPART.length * CUP_ROW) * CUPART.length + 0.001);
  // coffee rises inside the mug (dithered fill, bottom row first)
  const lvl = Math.floor(seg(t, CUP + 0.36, CUP + 0.8) * 4 + 0.001);
  for (let y = 0; y < lvl; y++) { const r = r0 + 5 - y;
    if (r === r0 + 3) { put(r, c0 + 3, '▒'.repeat(9), 'd'); put(r, c0 + 20, '▒'.repeat(9), 'd'); }   // keep the label clear
    else put(r, c0 + 3, '▒'.repeat(26), 'd'); }
  CUPART.forEach((row, y) => { if (y < rowsShown) put(r0 + y, c0, row, y === rowsShown - 1 && rowsShown < CUPART.length ? 'b' : (y === 1 ? 'd' : 'n')); });
  // steam: three wisps, rising and wobbling in stepped 8 fps motion
  if (rowsShown >= CUPART.length) {
    const fr = Math.floor(t * 8), a = seg(t, CUP + 0.3, CUP + 0.7);
    for (let w = 0; w < 3; w++) {
      const cx = c0 + 9 + w * 7;
      for (let y = 0; y < 3; y++) {
        const ph = fr * 0.55 + y * 1.25 + w * 2.1;
        const off = Math.round(Math.sin(ph) * 1.2);
        if (hash(fr * 3 + y * 17 + w * 31) < 0.1 + (1 - a) * 0.9) continue;
        put(r0 - 3 + y, cx + off, Math.cos(ph) > 0 ? '(' : ')', y === 0 ? 'd' : 'n');
      }
    }
  }
  if (t >= CAPTION) {
    const cap = 'order #042 is live  ·  enjoy'; const n = Math.min(cap.length, Math.floor((t - CAPTION) / 0.016));
    put(r0 + CUPART.length + 1, Math.floor((COLS - cap.length) / 2), cap.slice(0, n), 'b');
  }
  if (t >= PROMPT_END) frame.cur = { r: ROWS - 1, c: putSegs(ROWS - 1, 0, PROMPT), blink: true };
  return frame;
};

// ── drawing: character grid ──────────────────────────────────────────────────
let dith = null;                                  // colour → checkerboard pattern, made in setup()
// One character cell. Block glyphs are painted as rectangles so bars join up seamlessly.
function cell(g, ch, x, y, col) {
  if (ch === ' ') return;
  if (ch === '█') {
    g.fillStyle = col;
    g.globalAlpha *= 0.82;
    g.fillRect(x, y + 12, CW + 0.6, LH - 24);
    g.globalAlpha /= 0.82;
  } else if (ch === '░' || ch === '▒') {
    const full = ch === '▒';                      // ▒ fills the whole cell, ░ only the bar band
    g.save();
    g.fillStyle = dith[col] || col;
    if (full) g.fillRect(x, y, CW + 0.6, LH + 0.6); else g.fillRect(x, y + 12, CW + 0.6, LH - 24);
    g.restore();
  } else {
    g.fillStyle = col;
    g.fillText(ch, x, y + LH * 0.7);
  }
}
// phosphor trails only while the layout holds still (a scroll or clear would smear whole lines)
const layout = t => t >= CUP ? -1 : t >= ROLL ? -2 - Math.floor(t * 30) : Math.max(0, LOG.filter(l => t >= l.t).length - ROWS);
function paintText(g, t, alpha) {
  const { it, cur } = screenAt(t);
  g.save();
  g.globalAlpha = alpha;
  g.textBaseline = 'alphabetic';
  for (const run of it) {
    const glyphs = [...run.s], top = Y0 + run.r * LH;
    let st = run.st;
    if (st === 'e') st = (t - ERR < 0.5 && Math.floor((t - ERR) * 12) % 2 === 1) ? 'b' : 'i';   // error flashes, then stays inverted
    if (st === 'i') {                             // inverted: lit box behind dark text
      g.fillStyle = run.st === 'e' ? C.b : C.n;
      g.fillRect(X0 + run.c * CW - 4, top + 5, glyphs.length * CW + 8, LH - 10);
    }
    const ink = st === 'i' ? C.bg : C[st];
    const bold = st === 'b' || st === 'i';
    g.font = `${bold ? 700 : 400} ${FS}px ${MONO}`;
    glyphs.forEach((ch, k) => cell(g, ch, X0 + (run.c + k) * CW, top, ink));
  }
  const blinkOn = Math.floor(t * 1.9) % 2 === 0;
  if (cur && (blinkOn || !cur.blink)) { g.fillStyle = C.n; g.fillRect(X0 + cur.c * CW, Y0 + cur.r * LH + 4, CW, LH - 8); }
  g.restore();
}

// ── CRT layers ───────────────────────────────────────────────────────────────
// Working surfaces, each a [canvas, context] pair.
const surface = (w, h) => { const cnv = mk(w, h); return [cnv, cnv.getContext('2d')]; };
const [TEXT, tg] = surface(W, H);                 // text plus phosphor trails
const [TUBE, sg] = surface(W, H);                 // the composed tube image
const [GLOW_A, ga] = surface(W / 4, H / 4);       // two blurred downsamples of TEXT for bloom
const [GLOW_B, gb] = surface(W / 8, H / 8);
// Static overlays, built in setup(): glass tint, scanlines, bezel/vignette, noise tiles, power-on line and power-off dot.
let BG, SCAN, VIG, LINE, DOT;
const NOISE = [];
const stops = (grad, list) => { for (const [at, col] of list) grad.addColorStop(at, col); return grad; };
function layer(w, h, paint) { const cnv = mk(w, h); paint(cnv.getContext('2d')); return cnv; }
function setup() {
  dith = {};
  for (const key of ['n', 'd', 'b']) {
    const tile = layer(6, 6, g => { g.fillStyle = C[key]; g.fillRect(0, 0, 2, 2); g.fillRect(3, 3, 2, 2); });
    dith[C[key]] = ctx.createPattern(tile, 'repeat');
  }
  BG = layer(W, H, g => {
    g.fillStyle = stops(g.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 1150), [[0, '#07170d'], [0.6, '#041009'], [1, '#010402']]);
    g.fillRect(0, 0, W, H);
  });
  SCAN = layer(W, H, g => {
    for (let y = 0; y < H; y += 4) {
      g.fillStyle = 'rgba(0,0,0,0.30)'; g.fillRect(0, y, W, 1.5);
      g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, y + 1.5, W, 0.8);
    }
  });
  VIG = layer(W, H, g => {
    // bezel: a black frame around a rounded screen opening, edges softened by a blur
    g.save();
    g.filter = 'blur(18px)';
    g.fillStyle = '#000';
    g.beginPath(); g.rect(-120, -120, W + 240, H + 240); g.roundRect(34, 30, W - 68, H - 60, 90);
    g.fill('evenodd');
    g.restore();
    g.fillStyle = stops(g.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1180), [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.62)']]);
    g.fillRect(0, 0, W, H);
    g.fillStyle = stops(g.createRadialGradient(560, 220, 10, 560, 220, 700), [[0, 'rgba(210,255,225,0.045)'], [1, 'rgba(210,255,225,0)']]);
    g.beginPath(); g.ellipse(560, 230, 760, 330, -0.18, 0, 7); g.fill();       // reflection on the glass
  });
  for (let n = 0; n < 4; n++) {
    NOISE.push(layer(512, 512, g => {
      const img = g.createImageData(512, 512), px = img.data;
      for (let i = 0; i < px.length; i += 4) { const v = rng() * 255; px[i] = v * 0.8; px[i + 1] = v; px[i + 2] = v * 0.85; px[i + 3] = 255; }
      g.putImageData(img, 0, 0);
    }));
  }
  LINE = layer(W, 240, g => {
    g.fillStyle = stops(g.createLinearGradient(0, 0, 0, 240), [[0, 'rgba(140,255,170,0)'], [0.44, 'rgba(140,255,170,0.25)'], [0.5, 'rgba(240,255,244,1)'], [0.56, 'rgba(140,255,170,0.25)'], [1, 'rgba(140,255,170,0)']]);
    g.fillRect(0, 0, W, 240);
    g.globalCompositeOperation = 'destination-in';                               // taper both ends
    g.fillStyle = stops(g.createLinearGradient(0, 0, W, 0), [[0, 'rgba(0,0,0,0)'], [0.06, 'rgba(0,0,0,1)'], [0.94, 'rgba(0,0,0,1)'], [1, 'rgba(0,0,0,0)']]);
    g.fillRect(0, 0, W, 240);
  });
  DOT = layer(300, 300, g => {
    g.fillStyle = stops(g.createRadialGradient(150, 150, 0, 150, 150, 150), [[0, 'rgba(245,255,248,1)'], [0.08, 'rgba(200,255,215,0.9)'], [0.3, 'rgba(120,255,160,0.25)'], [1, 'rgba(120,255,160,0)']]);
    g.fillRect(0, 0, 300, 300);
  });
  ctx.font = `400 ${FS}px ${MONO}`;
  CW = ctx.measureText('M').width;
  COLS = Math.floor((W - 2 * X0) / CW);
}

// ── CRT power on/off ─────────────────────────────────────────────────────────
// Picture scale (sx, sy) and the strength of the bright centre line, the warm-up flash and the after-glow dot.
function tubeAt(t) {
  const tube = { sx: 1, sy: 1, line: 0, flash: 0, dot: 0 };
  const warmFlash = () => 0.38 * (1 - seg(t, 0.10, 0.7));
  if (t < 0.10) {                                 // a line grows out from the centre
    tube.sx = eOut(seg(t, 0, 0.10)); tube.sy = 0.004; tube.line = 1;
  } else if (t < 0.46) {                          // and opens up into the picture
    tube.sy = lerp(0.004, 1, eOut(seg(t, 0.10, 0.42))); tube.line = 1 - seg(t, 0.10, 0.26); tube.flash = warmFlash();
  } else if (t < 0.7) {
    tube.flash = warmFlash();
  }
  if (t >= OFF) {                                 // collapse to a line, then to a fading dot
    const squash = seg(t, OFF, OFF + 0.17), shrink = seg(t, OFF + 0.19, OFF + 0.36);
    tube.sy = lerp(1, 0.003, eIn(squash)); tube.flash = 0.7 * squash;
    tube.line = shrink >= 1 ? 0 : seg(t, OFF + 0.08, OFF + 0.17);
    tube.sx = 1 - eIn(shrink) * 0.998;
    tube.dot = t < OFF + 0.36 ? shrink * shrink : 1 - eOut(seg(t, OFF + 0.36, DUR - 0.15));
  }
  return tube;
}
// Additive overlay helper for flashes and glows.
function additive(g, fn) { g.globalCompositeOperation = 'lighter'; fn(); g.globalCompositeOperation = 'source-over'; }
// TEXT: the current screen over a few faded copies of the recent past (only while the layout is still)
const TRAILS = [[0.12, 0.10], [0.08, 0.17], [0.04, 0.30]];
function drawPhosphor(t) {
  tg.clearRect(0, 0, W, H);
  const now = layout(t);
  for (const [lag, a] of TRAILS) {
    const past = t - lag;
    if (past > 0.4 && layout(past) === now) paintText(tg, past, a);
  }
  paintText(tg, t, 1);
}
// blurred, shrunken copy of src into the small glow canvas g
function downsample(g, src, px) {
  const w = g.canvas.width, h = g.canvas.height;
  g.clearRect(0, 0, w, h);
  g.filter = `blur(${px}px)`;
  g.drawImage(src, 0, 0, w, h);
  g.filter = 'none';
}
// TUBE: glass, refresh band, text, bloom, grain and flicker
function drawTube(t, fi) {
  sg.globalCompositeOperation = 'source-over'; sg.globalAlpha = 1;
  sg.drawImage(BG, 0, 0);
  const bandY = ((t * 0.18) % 1) * (H + 400) - 200;                                // slow rolling refresh band
  sg.fillStyle = stops(sg.createLinearGradient(0, bandY - 160, 0, bandY + 160), [[0, 'rgba(120,255,160,0)'], [0.5, 'rgba(120,255,160,0.035)'], [1, 'rgba(120,255,160,0)']]);
  sg.fillRect(0, bandY - 160, W, 320);
  sg.drawImage(TEXT, 0, 0);
  downsample(ga, TEXT, 2);
  downsample(gb, GLOW_A, 3);
  additive(sg, () => {
    sg.globalAlpha = 0.55; sg.drawImage(GLOW_A, 0, 0, W, H);
    sg.globalAlpha = 0.45; sg.drawImage(GLOW_B, 0, 0, W, H);
    sg.globalAlpha = 0.045;
    const grain = NOISE[fi % NOISE.length];
    for (let y = 0; y < H; y += grain.height) for (let x = 0; x < W; x += grain.width) sg.drawImage(grain, x, y);
    sg.globalAlpha = 1;
  });
  sg.fillStyle = `rgba(0,0,0,${0.03 + 0.035 * hash(fi)})`;                         // flicker
  sg.fillRect(0, 0, W, H);
}
// error glitch: a few horizontal slices of the tube image shoved sideways, plus a green wash
function drawGlitch(t, fi) {
  const amt = t >= ERR && t < ERR + 0.34 ? 1 - seg(t, ERR, ERR + 0.34) : 0;
  if (amt <= 0) return;
  for (let k = 0; k < 7; k++) {
    if (hash(fi * 13 + k) < 0.3) continue;
    const y = Math.floor(hash(fi * 7 + k * 3) * H), h = 12 + Math.floor(hash(fi + k * 5) * 70);
    ctx.drawImage(TUBE, 0, y, W, h, (hash(fi * 11 + k) - 0.5) * 120 * amt, y, W, h);
  }
  additive(ctx, () => { ctx.fillStyle = `rgba(150,255,180,${0.10 * amt})`; ctx.fillRect(0, 0, W, H); });
}
function frameAt(t) {
  const fi = Math.floor(t * 30);
  drawPhosphor(t);
  drawTube(t, fi);
  // the tube image goes on screen squashed about the centre by the power on/off state
  const tube = tubeAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(tube.sx, 0, 0, tube.sy, (1 - tube.sx) * W / 2, (1 - tube.sy) * H / 2);
  ctx.drawImage(TUBE, 0, 0);
  drawGlitch(t, fi);
  if (tube.flash > 0) additive(ctx, () => { ctx.fillStyle = `rgba(150,255,180,${tube.flash})`; ctx.fillRect(0, 0, W, H); });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // unscaled extras: the bright line during power on/off and the after-glow dot
  if (tube.line > 0) additive(ctx, () => {
    const len = W * Math.max(tube.sx, 0.002);
    ctx.globalAlpha = tube.line; ctx.drawImage(LINE, W / 2 - len / 2, H / 2 - 120, len, 240); ctx.globalAlpha = 1;
  });
  if (tube.dot > 0) additive(ctx, () => { ctx.globalAlpha = tube.dot; ctx.drawImage(DOT, W / 2 - 150, H / 2 - 150); ctx.globalAlpha = 1; });
  ctx.drawImage(SCAN, 0, 0);
  ctx.drawImage(VIG, 0, 0);
}
window.draw = job => {

  const url = cv.toDataURL('image/jpeg', job.q || 0.92);
  return url.slice(url.indexOf(',') + 1);
};
