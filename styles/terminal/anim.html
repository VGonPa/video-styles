<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head>
<body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  terminal — green phosphor CRT. window.draw({t}) → JPEG base64, window.ready
//  Story: power on → boot → `brew deploy --strength=strong` → streaming logs and
//  ASCII progress bars → ERROR: milk not found (glitch) → fix → retry → success →
//  roll-up clear → ASCII coffee cup with steam → blinking cursor → CRT power-off.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const rng = (s => () => { s = s + 0x6D2B79F5 | 0; let q = Math.imul(s ^ s >>> 15, 1 | s); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; })(17);

const MONO = "'JetBrains Mono', monospace";
const FS = 32, LH = 52, X0 = 140, Y0 = 118;
let CW = 16.8, COLS = 96; const ROWS = 16;
const C = { n: '#8ef7aa', d: '#3d9a5b', b: '#eafff0', bg: '#041209' };

// ── timeline ─────────────────────────────────────────────────────────────────
function typeTimes(str, t0, seed) { const out = []; let t = t0;
  for (let i = 0; i < str.length; i++) { out.push(t); t += 0.017 + 0.02 * hash(i * 7.3 + seed) + (str[i] === ' ' ? 0.04 : 0); }
  return out; }
const PROMPT = [['dev@kitchen', 'n'], [':~$ ', 'd']];
// three typed commands: [text, start time]
const CMDS = [['brew deploy --strength=strong', 1.02], ['brew add milk --type=oat', 4.42], ['brew deploy --retry', 5.42]];
const TT = CMDS.map(([s, t0], k) => typeTimes(s, t0, k * 11 + 1));
const ENT = TT.map(a => a[a.length - 1] + 0.14);
const E1 = ENT[0], E2 = ENT[1], E3 = ENT[2];
const ERR = E1 + 1.72;                         // milk not found
const OK = E3 + 0.96;                          // success line
const ROLL = OK + 0.30, CUP = ROLL + 0.22;     // roll-up clear → cup scene
const CAPTION = CUP + 0.42, PROMPT_END = CUP + 0.62;
const OFF = 9.35;
const BAR = 30;
// progress bar rows: [label, start, end, fill fraction at end, suffix at end]
const STEPS1 = [
  ['grind beans', E1 + 0.16, E1 + 0.58, 1, '18 g'],
  ['heat boiler', E1 + 0.62, E1 + 0.98, 1, '93 °C'],
  ['pull shot', E1 + 1.02, E1 + 1.36, 1, '36 ml'],
  ['steam milk', E1 + 1.40, E1 + 1.62, 0.3, ''],
];
const STEPS2 = [
  ['steam milk', E3 + 0.14, E3 + 0.48, 1, '65 °C'],
  ['pour & serve', E3 + 0.52, E3 + 0.86, 1, '240 ml'],
];

// line log: each entry {t, f(t) → segs, p: prompt line}; the terminal shows the last ROWS lines
const LOG = [];
const L = (t, f, p = false) => LOG.push({ t, f: typeof f === 'function' ? f : () => f, p });
const OKL = (name, info) => [['[ ', 'd'], ['OK', 'b'], [' ] ', 'd'], [name.padEnd(13), 'n'], [info, 'd']];
L(0.44, [['brewOS 3.1  ·  tty1  ·  counter-01', 'd']]);
L(0.54, OKL('boiler', '15 bar  ·  idle'));
L(0.63, OKL('bean hopper', '250 g  ·  dark roast'));
L(0.72, OKL('grinder', 'burr set 4'));
L(0.80, []);
const promptLine = k => t => { let n = 0; while (n < TT[k].length && t >= TT[k][n]) n++; return [...PROMPT, [CMDS[k][0].slice(0, n), 'b']]; };
const spin = t => '|/-\\'[Math.floor(t * 14) % 4];
function barLine([label, a, b, fill, suf], fail) {
  return t => {
    const p = seg(t, a, b), k = Math.round(fill * BAR * eOut(p));
    const segs = [['  ' + label.padEnd(14), 'n'], ['[', 'd'], ['█'.repeat(Math.max(0, k - 1)), 'n'], ['█'.repeat(Math.min(k, 1)), k < BAR * fill ? 'b' : 'n'], ['░'.repeat(BAR - k), 'd'], ['] ', 'd']];
    if (fail) segs.push(t < ERR ? [String(Math.round(fill * 100 * eOut(p))).padStart(3) + '%  ' + spin(t), 'n'] : [' 30%  stalled', 'b']);
    else if (p < 1) segs.push([String(Math.round(100 * eOut(p))).padStart(3) + '%  ' + spin(t), 'n']);
    else segs.push(['100%  ', 'n'], [suf, 'b']);
    return segs;
  };
}
L(0.96, promptLine(0), true);
L(E1 + 0.07, [['» deploying ', 'n'], ['espresso-double', 'b'], [' -> counter-01  (5 steps)', 'd']]);
STEPS1.forEach((s, i) => L(s[1], barLine(s, i === 3)));
L(ERR, [['ERROR: milk not found', 'e'], ['  step 4/5', 'd']]);
L(ERR + 0.12, [['  hint: ', 'd'], ['brew add milk --type=<oat|whole>', 'n']]);
L(ERR + 0.22, [['x deploy failed  ·  exit 1', 'd']]);
L(4.36, promptLine(1), true);
L(E2 + 0.08, OKL('milk added', 'oat  ·  1 L  ·  4 °C'));
L(5.36, promptLine(2), true);
L(E3 + 0.06, [['» resuming at step 4/5', 'n']]);
STEPS2.forEach(s => L(s[1], barLine(s)));
L(OK, [['SUCCESS', 'i'], ['  1 flat white deployed in 4.2 s', 'b']]);
L(OK + 0.1, PROMPT, true);

// ASCII cup (pure ASCII); steam above it is procedural
const CUPART = [
  "  .--------------------------.",
  "  |~~~~~~~~~~~~~~~~~~~~~~~~~~|----.",
  "  |                          |    |",
  "  |          STRONG          |    |",
  "  |                          |    |",
  "  |                          |----'",
  "   \\                        /",
  "    '----------------------'",
  "'~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~'",
];
const CUPW = 35, CUP_ROW = 0.035;

// sound events (events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [{ t: 0.02, k: 'on' }];
  TT.forEach((a, k) => a.forEach((t, i) => ev.push({ t, k: 'key', v: 0.6 + 0.4 * hash(i + k * 50) })));
  ENT.forEach(t => ev.push({ t, k: 'enter' }));
  LOG.forEach(l => { if (l.t > 0.4 && !l.p) ev.push({ t: l.t, k: 'tick' }); });
  for (const s of [...STEPS1, ...STEPS2]) { const n = Math.round(s[3] * 10); for (let i = 1; i <= n; i++) ev.push({ t: s[1] + (s[2] - s[1]) * i / n, k: 'blip', v: i / n }); }
  ev.push({ t: ERR, k: 'error' }, { t: OK, k: 'success' }, { t: ROLL, k: 'roll' }, { t: CUP + 0.3, k: 'hiss', d: OFF - CUP - 0.3 });
  for (let r = 0; r < CUPART.length; r++) ev.push({ t: CUP + 0.08 + r * CUP_ROW, k: 'tick' });
  ev.push({ t: OFF, k: 'off' });
  return ev;
};

// ── display content: character cells at time t ───────────────────────────────
function build(t) {
  const it = []; let cur = null;
  const put = (r, c, str, st = 'n') => { it.push({ r, c, s: str, st }); return c + [...str].length; };
  const putSegs = (r, c, segs) => { for (const [s, st] of segs) c = put(r, c, s, st); return c; };
  if (t < 0.40) return { it, cur };
  if (t < CUP) {
    const vis = LOG.filter(l => t >= l.t).slice(-ROWS);
    const shift = t >= ROLL ? Math.floor(eIn(seg(t, ROLL, CUP)) * (ROWS + 1)) : 0;   // roll-up clear
    vis.forEach((l, i) => {
      const r = i - shift; if (r < 0) return;
      const c = putSegs(r, 0, l.f(t));
      if (l.p && i === vis.length - 1 && !shift) cur = { r, c };
    });
    // cursor: steady while typing, blinking while idle
    if (cur) { const k = CMDS.findIndex((cm, i) => t >= cm[1] && t < ENT[i]);
      cur.blink = k < 0 || t - TT[k][Math.max(0, TT[k].findLastIndex(x => t >= x))] > 0.3; }
    return { it, cur };
  }
  // cup scene
  const c0 = Math.floor((COLS - CUPW) / 2), r0 = 3;
  const rowsShown = Math.floor(seg(t, CUP + 0.08, CUP + 0.08 + CUPART.length * CUP_ROW) * CUPART.length + 0.001);
  // coffee rises inside the mug (dithered fill, bottom row first)
  const lvl = Math.floor(seg(t, CUP + 0.36, CUP + 0.8) * 4 + 0.001);
  for (let y = 0; y < lvl; y++) { const r = r0 + 5 - y;
    if (r === r0 + 3) { put(r, c0 + 3, '▒'.repeat(9), 'd'); put(r, c0 + 20, '▒'.repeat(9), 'd'); }   // keep the label clear
    else put(r, c0 + 3, '▒'.repeat(26), 'd'); }
  CUPART.forEach((row, y) => { if (y < rowsShown) put(r0 + y, c0, row, y === rowsShown - 1 && rowsShown < CUPART.length ? 'b' : (y === 1 ? 'd' : 'n')); });
  // steam: three wisps, rising and wobbling in stepped 8 fps motion
  if (rowsShown >= CUPART.length) {
    const fr = Math.floor(t * 8), a = seg(t, CUP + 0.3, CUP + 0.7);
    for (let w = 0; w < 3; w++) {
      const cx = c0 + 9 + w * 7;
      for (let y = 0; y < 3; y++) {
        const ph = fr * 0.55 + y * 1.25 + w * 2.1;
        const off = Math.round(Math.sin(ph) * 1.2);
        if (hash(fr * 3 + y * 17 + w * 31) < 0.1 + (1 - a) * 0.9) continue;
        put(r0 - 3 + y, cx + off, Math.cos(ph) > 0 ? '(' : ')', y === 0 ? 'd' : 'n');
      }
    }
  }
  if (t >= CAPTION) {
    const cap = 'order #042 is live  ·  enjoy'; const n = Math.min(cap.length, Math.floor((t - CAPTION) / 0.018));
    put(r0 + CUPART.length + 1, Math.floor((COLS - cap.length) / 2), cap.slice(0, n), 'b');
  }
  if (t >= PROMPT_END) { const c = putSegs(ROWS - 1, 0, PROMPT); cur = { r: ROWS - 1, c, blink: true }; }
  return { it, cur };
}

// ── drawing: character grid ──────────────────────────────────────────────────
let dith = null;
function cell(g, ch, x, y, col) {
  switch (ch) {
    case ' ': return;
    case '█': g.fillStyle = col; g.globalAlpha *= 0.82; g.fillRect(x, y + 12, CW + 0.6, LH - 24); g.globalAlpha /= 0.82; return;
    case '░': g.save(); g.fillStyle = dith[col] || col; g.fillRect(x, y + 12, CW + 0.6, LH - 24); g.restore(); return;
    case '▒': g.save(); g.fillStyle = dith[col] || col; g.fillRect(x, y, CW + 0.6, LH + 0.6); g.restore(); return;
    default: g.fillStyle = col; g.fillText(ch, x, y + LH * 0.7);
  }
}
// phosphor trails only while the layout holds still (a scroll or clear would smear whole lines)
const layout = t => t >= CUP ? -1 : t >= ROLL ? -2 - Math.floor(t * 30) : Math.max(0, LOG.filter(l => t >= l.t).length - ROWS);
function renderScreen(g, t, alpha) {
  const { it, cur } = build(t);
  g.globalAlpha = alpha; g.textBaseline = 'alphabetic';
  for (const o of it) {
    const chars = [...o.s]; const y = Y0 + o.r * LH;
    let st = o.st;
    if (st === 'e') st = (t - ERR < 0.5 && Math.floor((t - ERR) * 12) % 2 === 1) ? 'b' : 'i';   // error flashes, then stays inverted
    if (st === 'i') { g.fillStyle = o.st === 'e' ? C.b : C.n; g.fillRect(X0 + o.c * CW - 4, y + 5, chars.length * CW + 8, LH - 10); }
    const col = st === 'i' ? C.bg : C[st];
    g.font = `${st === 'b' || st === 'i' ? 700 : 400} ${FS}px ${MONO}`;
    chars.forEach((ch, k) => cell(g, ch, X0 + (o.c + k) * CW, y, col));
  }
  if (cur && (!cur.blink || Math.floor(t * 1.9) % 2 === 0)) { g.fillStyle = C.n; g.fillRect(X0 + cur.c * CW, Y0 + cur.r * LH + 4, CW, LH - 8); }
  g.globalAlpha = 1;
}

// ── CRT layers (generated once) ──────────────────────────────────────────────
const P = mk(W, H), pg = P.getContext('2d');
const S = mk(W, H), sg = S.getContext('2d');
const B1 = mk(480, 270), b1 = B1.getContext('2d'), B2 = mk(240, 135), b2 = B2.getContext('2d');
let BG, SCAN, VIG, NOISE = [], LINE, DOT;
function prep() {
  dith = {}; for (const k of ['n', 'd', 'b']) { const cp = mk(6, 6), g = cp.getContext('2d'); g.fillStyle = C[k]; g.fillRect(0, 0, 2, 2); g.fillRect(3, 3, 2, 2);
    dith[C[k]] = ctx.createPattern(cp, 'repeat'); }
  BG = mk(W, H); { const g = BG.getContext('2d'); const r = g.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 1150);
    r.addColorStop(0, '#07170d'); r.addColorStop(0.6, '#041009'); r.addColorStop(1, '#010402'); g.fillStyle = r; g.fillRect(0, 0, W, H); }
  SCAN = mk(W, H); { const g = SCAN.getContext('2d'); for (let y = 0; y < H; y += 4) { g.fillStyle = 'rgba(0,0,0,0.30)'; g.fillRect(0, y, W, 1.5); g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, y + 1.5, W, 0.8); } }
  VIG = mk(W, H); { const g = VIG.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'destination-out'; g.filter = 'blur(18px)'; g.beginPath(); g.roundRect(34, 30, W - 68, H - 60, 90); g.fill();
    g.filter = 'none'; g.globalCompositeOperation = 'source-over';
    const r = g.createRadialGradient(W / 2, H / 2, 380, W / 2, H / 2, 1180); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,0.62)');
    g.fillStyle = r; g.fillRect(0, 0, W, H);
    const gl = g.createRadialGradient(560, 220, 10, 560, 220, 700); gl.addColorStop(0, 'rgba(210,255,225,0.045)'); gl.addColorStop(1, 'rgba(210,255,225,0)');
    g.fillStyle = gl; g.beginPath(); g.ellipse(560, 230, 760, 330, -0.18, 0, 7); g.fill(); }
  for (let k = 0; k < 4; k++) { const n = mk(512, 512), g = n.getContext('2d'), im = g.createImageData(512, 512);
    for (let i = 0; i < im.data.length; i += 4) { const v = rng() * 255; im.data[i] = v * 0.8; im.data[i + 1] = v; im.data[i + 2] = v * 0.85; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); NOISE.push(n); }
  LINE = mk(W, 240); { const g = LINE.getContext('2d'); const v = g.createLinearGradient(0, 0, 0, 240);
    v.addColorStop(0, 'rgba(140,255,170,0)'); v.addColorStop(0.44, 'rgba(140,255,170,0.25)'); v.addColorStop(0.5, 'rgba(240,255,244,1)'); v.addColorStop(0.56, 'rgba(140,255,170,0.25)'); v.addColorStop(1, 'rgba(140,255,170,0)');
    g.fillStyle = v; g.fillRect(0, 0, W, 240);
    g.globalCompositeOperation = 'destination-in'; const hz = g.createLinearGradient(0, 0, W, 0);
    hz.addColorStop(0, 'rgba(0,0,0,0)'); hz.addColorStop(0.06, 'rgba(0,0,0,1)'); hz.addColorStop(0.94, 'rgba(0,0,0,1)'); hz.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = hz; g.fillRect(0, 0, W, 240); }
  DOT = mk(300, 300); { const g = DOT.getContext('2d'); const r = g.createRadialGradient(150, 150, 0, 150, 150, 150);
    r.addColorStop(0, 'rgba(245,255,248,1)'); r.addColorStop(0.08, 'rgba(200,255,215,0.9)'); r.addColorStop(0.3, 'rgba(120,255,160,0.25)'); r.addColorStop(1, 'rgba(120,255,160,0)');
    g.fillStyle = r; g.fillRect(0, 0, 300, 300); }
  ctx.font = `400 ${FS}px ${MONO}`; CW = ctx.measureText('M').width; COLS = Math.floor((W - 2 * X0) / CW);
}

// ── CRT power on/off ─────────────────────────────────────────────────────────
function crt(t) {
  let sx = 1, sy = 1, line = 0, flash = 0, dot = 0;
  if (t < 0.10) { sx = eOut(seg(t, 0, 0.10)); sy = 0.004; line = 1; }
  else if (t < 0.46) { const p = seg(t, 0.10, 0.42); sy = lerp(0.004, 1, eOut(p)); line = 1 - seg(t, 0.10, 0.26); flash = 0.38 * (1 - seg(t, 0.10, 0.7)); }
  else if (t < 0.7) flash = 0.38 * (1 - seg(t, 0.10, 0.7));
  if (t >= OFF) {
    const p = seg(t, OFF, OFF + 0.17); sy = lerp(1, 0.003, eIn(p)); flash = 0.7 * p; line = seg(t, OFF + 0.08, OFF + 0.17);
    const q = seg(t, OFF + 0.19, OFF + 0.36); sx = 1 - eIn(q) * 0.998; if (q >= 1) line = 0;
    dot = t < OFF + 0.36 ? q * q : 1 - eOut(seg(t, OFF + 0.36, DUR - 0.15));
  }
  return { sx, sy, line, flash, dot };
}
function render(t) {
  // phosphor: fading trace of past frames + current frame
  pg.clearRect(0, 0, W, H);
  for (const [lag, a] of [[0.12, 0.10], [0.08, 0.17], [0.04, 0.30]]) if (t - lag > 0.4 && layout(t - lag) === layout(t)) renderScreen(pg, t - lag, a);
  renderScreen(pg, t, 1);
  b1.clearRect(0, 0, 480, 270); b1.filter = 'blur(2px)'; b1.drawImage(P, 0, 0, 480, 270); b1.filter = 'none';
  b2.clearRect(0, 0, 240, 135); b2.filter = 'blur(3px)'; b2.drawImage(B1, 0, 0, 240, 135); b2.filter = 'none';
  sg.globalCompositeOperation = 'source-over'; sg.globalAlpha = 1; sg.drawImage(BG, 0, 0);
  // rolling scan band
  const ry = ((t * 0.18) % 1) * (H + 400) - 200; const rb = sg.createLinearGradient(0, ry - 160, 0, ry + 160);
  rb.addColorStop(0, 'rgba(120,255,160,0)'); rb.addColorStop(0.5, 'rgba(120,255,160,0.035)'); rb.addColorStop(1, 'rgba(120,255,160,0)');
  sg.fillStyle = rb; sg.fillRect(0, ry - 160, W, 320);
  sg.drawImage(P, 0, 0);
  sg.globalCompositeOperation = 'lighter';
  sg.globalAlpha = 0.55; sg.drawImage(B1, 0, 0, W, H); sg.globalAlpha = 0.45; sg.drawImage(B2, 0, 0, W, H);
  const f = Math.floor(t * 30); sg.globalAlpha = 0.045; const nz = NOISE[f % 4];
  for (let y = 0; y < H; y += 512) for (let x = 0; x < W; x += 512) sg.drawImage(nz, x, y);
  sg.globalAlpha = 1; sg.globalCompositeOperation = 'source-over';
  sg.fillStyle = `rgba(0,0,0,${0.03 + 0.035 * hash(f)})`; sg.fillRect(0, 0, W, H);   // flicker

  const s = crt(t);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(s.sx, s.sy); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(S, 0, 0);
  const gl = t >= ERR && t < ERR + 0.34 ? 1 - seg(t, ERR, ERR + 0.34) : 0;          // error glitch: sliced horizontal tearing
  if (gl > 0) {
    for (let k = 0; k < 7; k++) { if (hash(f * 13 + k) < 0.3) continue;
      const y = Math.floor(hash(f * 7 + k * 3) * H), hh = 12 + Math.floor(hash(f + k * 5) * 70), dx = (hash(f * 11 + k) - 0.5) * 120 * gl;
      ctx.drawImage(S, 0, y, W, hh, dx, y, W, hh); }
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(150,255,180,${0.10 * gl})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  }
  if (s.flash > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(150,255,180,${s.flash})`; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  ctx.restore();
  if (s.line > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = s.line; const lw = W * Math.max(s.sx, 0.002);
    ctx.drawImage(LINE, W / 2 - lw / 2, H / 2 - 120, lw, 240); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  if (s.dot > 0) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = s.dot; ctx.drawImage(DOT, W / 2 - 150, H / 2 - 150); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; }
  ctx.drawImage(SCAN, 0, 0); ctx.drawImage(VIG, 0, 0);
}
window.draw = function (job) { render(job.t); return cv.toDataURL('image/jpeg', job.q || 0.92).split(',')[1]; };
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`400 ${FS}px 'JetBrains Mono'`, 'abcdefghijklmnopqrstuvwxyz°·»'), document.fonts.load(`700 ${FS}px 'JetBrains Mono'`, 'abcdefghijklmnopqrstuvwxyz')])).then(prep);
</script></body></html>
