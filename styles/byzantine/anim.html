<html lang="en"><head><meta charset="utf-8">

<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── byzantine · an apse mosaic woken by lamplight ──────────────────────────────────────────────
// Darkness → a spark, and the lamp in the icon's hand catches: its flame lights a frontal face, a
// halo laid in concentric rings and an elongated raised hand, while the gold glass around it
// glitters → the camera pulls back through the apse and four smaller figures (hierarchy of scale)
// light their own lamps between palm trees, under banded clouds and a starry blue vault → a raking
// light sweeps the wall and the gold inscription flashes letter by letter → hold, the lamps last.
// The wall is one flat design rasterised as labels → distance field → tesserae set in rows that
// follow every contour (gold ground: two hugging rows, then straight courses). Gold tiles are set at
// small random tilts, so each one glints only when light, tile and eye line up: that is the shimmer.
// Everything is seeded; each frame depends only on t.
const W = 1920, H = 1080, DUR = 10, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const smoother = u => { u = clamp(u); return u * u * u * (u * (u * 6 - 15) + 10); };
const backOut = (u, s = 2.2) => { u = clamp(u); const v = u - 1; return 1 + (s + 1) * v * v * v + s * v * v; };
function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const R = rng(1177);
const gauss = () => { let u = 0; while (!u) u = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * R()); };

// ── timeline ──
const T = {
  spark: 0.32, ignite: 0.46,           // the icon's lamp
  pull: [2.35, 5.95],                  // camera pulls back through the apse
  amb: [2.1, 5.6],                     // the whole wall comes up
  side: [3.55, 3.8, 4.5, 4.72],        // inner left, inner right, outer left, outer right lamps
  sweep: [6.15, 8.55],                 // raking light across the wall
  out: [8.95, 9.7],
};

// ── palette ──
const C = {
  mortar: [74, 58, 40],
  gold: [214, 168, 70], gold2: [226, 184, 88], haloGold: [232, 192, 98], silver: [206, 204, 194],
  blue: [24, 40, 104], blueSp: [20, 32, 86], blueMid: [46, 78, 156], blueLt: [104, 136, 196],
  red: [158, 32, 30], redDk: [104, 22, 26], purple: [104, 26, 46], purpleDk: [62, 14, 30],
  white: [234, 228, 212], whiteSh: [160, 168, 178], whiteDk: [104, 112, 128],
  green: [38, 88, 54], greenLt: [96, 146, 72], greenDk: [22, 54, 36],
  flesh: [206, 160, 120], fleshSh: [150, 124, 84], fleshLt: [238, 210, 172], cheek: [204, 130, 104],
  line: [52, 30, 22], lip: [156, 50, 42], eyeW: [232, 224, 208], iris: [36, 24, 18],
  hairBr: [62, 38, 24], hairBrL: [112, 76, 46], hairGr: [150, 146, 140], hairGrL: [204, 200, 190],
  hairBk: [34, 26, 24], hairBkL: [86, 70, 62], hairAu: [116, 56, 30], hairAuL: [164, 96, 54],
  lamp: [196, 138, 56], lampDk: [92, 54, 24],
  trunk: [104, 66, 40], trunkDk: [62, 38, 24], date: [176, 44, 34],
  pearl: [240, 236, 222], outline: [44, 24, 20],
  fR: [200, 52, 24], fO: [244, 126, 34], fY: [255, 206, 84], fW: [255, 246, 214],
};

// ── regions: label id → colour, tessera size (world px), K hugging rows (99 = follow edges throughout)
const REG = [];
function reg(col, s, o = {}) {
  REG.push({ col, s, K: o.K ?? 99, gold: o.gold || 0, tilt: o.tilt ?? 0.11, emis: !!o.emis, nv: o.nv ?? 0.1 });
  return REG.length - 1;
}
const lab = id => `rgb(${id + 1},${(id * 97 + 13) & 255},${(id * 53 + 101) & 255})`;

const G_GOLD = reg(C.gold, 6.4, { K: 2, gold: 1, tilt: 0.15, nv: 0.13 });
const G_SILVER = reg(C.silver, 6.4, { gold: 1, tilt: 0.15 });
const G_SP = reg(C.blueSp, 6.0, { K: 1, nv: 0.12 });
const G_STAR = reg(C.gold2, 2.6, { gold: 1 });
const G_ARR = reg(C.red, 3.8), G_ARB = reg(C.blue, 4.2, { K: 1 }), G_ARP = reg(C.pearl, 2.5), G_ARW = reg(C.white, 2.5);
const G_ARG = reg(C.red, 2.4);
const G_GRN = reg(C.green, 4.6, { K: 1 }), G_GRL = reg(C.greenLt, 2.6), G_FLR = reg(C.red, 2.3), G_FLW = reg(C.pearl, 2.3);
const G_CR = reg(C.red, 3.3), G_CB = reg(C.blueMid, 3.3), G_CW = reg(C.white, 3.3), G_CG = reg(C.gold2, 3.3, { gold: 1 });
const G_TRK = reg(C.trunk, 3.1), G_TRD = reg(C.trunkDk, 2.3), G_FRN = reg(C.green, 3.0), G_FRL = reg(C.greenLt, 3.0), G_FRD = reg(C.greenDk, 2.2), G_DATE = reg(C.date, 2.3);
const G_BRL = reg(C.red, 3.6), G_BPB = reg(C.redDk, 3.6, { K: 1 }), G_BPP = reg(C.pearl, 2.6), G_BPG = reg(C.gold2, 2.4, { gold: 1 });
const G_INS = reg(C.blue, 4.6, { K: 2 }), G_LET = reg(C.gold2, 3.0, { gold: 1, tilt: 0.13 }), G_LOUT = reg(C.redDk, 2.5);
const G_BOT = reg(C.redDk, 5.0, { K: 1 }), G_DEN = reg(C.gold2, 2.8, { gold: 1 }), G_BWL = reg(C.white, 2.6);
const G_FL = [reg(C.fR, 8, { emis: true }), reg(C.fO, 8, { emis: true }), reg(C.fY, 8, { emis: true }), reg(C.fW, 8, { emis: true })];

function figSet(z, sch) {
  return {
    halo: reg(C.haloGold, z.halo, { gold: 1, tilt: 0.12 }), haloRim: reg(C.red, z.line * 1.15), haloW: reg(C.pearl, z.line),
    hair: reg(sch.hair, z.hair), hairL: reg(sch.hairL, z.line),
    flesh: reg(C.flesh, z.face, { nv: 0.07 }), shade: reg(C.fleshSh, z.face, { nv: 0.07 }), light: reg(C.fleshLt, z.face * 0.9, { nv: 0.05 }),
    cheek: reg(C.cheek, z.face, { nv: 0.06 }), eyeW: reg(C.eyeW, z.face * 0.8, { nv: 0.04 }), iris: reg(C.iris, z.face * 0.8, { nv: 0.04 }),
    line: reg(C.line, z.line, { nv: 0.06 }), lip: reg(C.lip, z.face * 0.85, { nv: 0.05 }),
    mantle: reg(sch.mantle, z.robe), mantleD: reg(sch.mantleD, z.line), mantleL: reg(sch.mantleL, z.line, { gold: sch.chryso ? 1 : 0 }),
    tunic: reg(sch.tunic, z.robe * 0.9), tunicD: reg(sch.tunicD, z.line), clavus: reg(sch.clavus, z.line, { gold: sch.chryso ? 1 : 0 }),
    sleeve: reg(sch.sleeve, z.robe * 0.75), cuff: reg(C.gold2, z.line, { gold: 1 }), outline: reg(C.outline, z.line, { nv: 0.05 }),
    lamp: reg(C.lamp, z.lamp, { gold: 1, tilt: 0.12 }), lampD: reg(C.lampDk, z.line), gemR: reg(C.red, z.line), gemB: reg(C.blueMid, z.line),
    shoe: reg(sch.shoe, z.lamp), collar: reg(C.gold2, z.lamp, { gold: 1 }), pearl: reg(C.pearl, z.line * 0.9),
  };
}
const FIG_C = figSet({ face: 1.9, hair: 2.8, robe: 4.0, halo: 4.4, lamp: 2.4, line: 1.9 },
  { hair: C.hairBr, hairL: C.hairBrL, mantle: C.purple, mantleD: C.purpleDk, mantleL: C.gold2, chryso: true,
    tunic: C.blue, tunicD: C.blueSp, clavus: C.gold2, sleeve: C.blue, shoe: C.red });
const sideSch = (hair, hairL) => ({ hair, hairL, mantle: C.white, mantleD: C.whiteSh, mantleL: C.whiteDk, chryso: false,
  tunic: C.white, tunicD: C.whiteSh, clavus: C.purple, sleeve: C.white, shoe: C.trunkDk });
const SZ_S = { face: 1.6, hair: 2.2, robe: 3.2, halo: 3.6, lamp: 1.9, line: 1.6 };
const FIG_S = [sideSch(C.hairGr, C.hairGrL), sideSch(C.hairBk, C.hairBkL), sideSch(C.hairAu, C.hairAuL), sideSch(C.hairBr, C.hairBrL)]
  .map(s => figSet(SZ_S, s));

// ── layout (world = the 1920×1080 frame at zoom 1) ──
const ARCH = { cx: 960, cy: 900, rx: 900, ry: 800 }, GROUND = 862, GB = 912;
const UC = 80, US = 54;
const CENTRAL = { cx: 960, top: GROUND - 8.15 * UC, u: UC };
const SIDES = [-320, 320, -560, 560].map((dx, i) => ({ cx: 960 + dx, top: GROUND - 8.15 * US, u: US, beard: i === 0 || i === 3 }));
// flame anchors (world) and heights; light centre sits 40% up the flame
const LAMPS = [
  { x: CENTRAL.cx + 0.14 * UC, y: CENTRAL.top + 2.61 * UC, h: 0.56 * UC, t: T.ignite, I: 1.35, Rr: 330, pan: 0 },
  ...SIDES.map((f, i) => ({ x: f.cx, y: f.top + 2.65 * US, h: 0.6 * US, t: T.side[i], I: 0.85, Rr: 210, pan: (f.cx - 960) / 960 })),
];
const TEXT = 'THE LAMPLIGHTERS';
const FT = { x: 200, y: H + 250, h: 200 };      // flame template, drawn below the wall in the label raster

// ── path helpers (label canvas, world or figure-local units) ──
function capsule(g, x0, y0, x1, y1, w0, w1) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1e-6, nx = -dy / L, ny = dx / L, an = Math.atan2(ny, nx);
  g.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2); g.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
  g.arc(x1, y1, w1 / 2, an, an - Math.PI, true); g.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2);
  g.arc(x0, y0, w0 / 2, an - Math.PI, an - TAU, true); g.closePath();
}
const fillR = (g, id, rule) => { g.fillStyle = lab(id); g.fill(rule || 'nonzero'); };
const strokeR = (g, id, w) => { g.strokeStyle = lab(id); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); };
function archPath(g, inset, yb) {
  g.beginPath(); g.ellipse(ARCH.cx, ARCH.cy, ARCH.rx - inset, ARCH.ry - inset, 0, Math.PI, TAU);
  g.lineTo(ARCH.cx + ARCH.rx - inset, yb); g.lineTo(ARCH.cx - ARCH.rx + inset, yb); g.closePath();
}
function along(inset, step) {                       // points every `step` along the arch curve
  const pts = [], rx = ARCH.rx - inset, ry = ARCH.ry - inset; let acc = step / 2, px = ARCH.cx - rx, py = ARCH.cy;
  for (let a = Math.PI; a <= TAU + 1e-9; a += 0.0005) {
    const x = ARCH.cx + rx * Math.cos(a), y = ARCH.cy + ry * Math.sin(a); acc += Math.hypot(x - px, y - py); px = x; py = y;
    if (acc >= step) { acc -= step; pts.push([x, y, a]); }
  }
  return pts;
}
function star(g, x, y, r, n = 8) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * 0.42 : r; g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  g.closePath();
}

// ── one frontal figure; local units: u = head height, y = 0 at the crown ──
function figure(g, F, cx, top, u, o) {
  const lw = REG[F.line].s * 1.3 / u, lwR = REG[F.haloRim].s * 1.3 / u, side = !o.central;
  g.save(); g.translate(cx, top); g.scale(u, u);
  const P = () => g.beginPath();
  // halo: a flat disc, rimmed
  P(); g.arc(0, 0.52, 0.98, 0, TAU); fillR(g, F.halo);
  P(); g.arc(0, 0.52, 0.98 - lwR / 2, 0, TAU); strokeR(g, F.haloRim, lwR);
  P(); g.arc(0, 0.52, 0.98 - lwR - lw * 0.6, 0, TAU); strokeR(g, F.haloW, lw * 0.85);
  // long hair behind the head
  P(); g.ellipse(0, 0.5, 0.45, 0.53, 0, 0, TAU);
  if (!o.beard) { g.moveTo(-0.43, 0.5); g.lineTo(-0.42, 1.12); g.quadraticCurveTo(-0.3, 1.26, 0, 1.22); g.quadraticCurveTo(0.3, 1.26, 0.42, 1.12); g.lineTo(0.43, 0.5); }
  fillR(g, F.hair);
  // tunic below the mantle hem
  P(); g.moveTo(-0.8, 6.9); g.lineTo(-0.7, 7.78); g.quadraticCurveTo(0, 7.86, 0.7, 7.78); g.lineTo(0.8, 6.9); g.closePath();
  fillR(g, F.tunic); strokeR(g, F.outline, lw);
  if (side) for (const s of [-1, 1]) { P(); g.moveTo(s * 0.26, 6.95); g.lineTo(s * 0.24, 7.8); strokeR(g, F.clavus, lw * 1.2); }
  for (const s of [-1, 1]) { P(); g.moveTo(s * 0.5, 7.15); g.quadraticCurveTo(s * 0.47, 7.5, s * 0.52, 7.76); strokeR(g, F.tunicD, lw); }
  // feet, splayed, standing on nothing but the gold
  for (const s of [-1, 1]) { P(); capsule(g, s * 0.24, 7.78, s * 0.42, 8.05, 0.17, 0.13); fillR(g, F.shoe); strokeR(g, F.outline, lw * 0.8); }
  // mantle: the column of the body
  P(); g.moveTo(-0.2, 1.22);
  g.bezierCurveTo(-0.45, 1.3, -0.85, 1.32, -1.02, 1.55); g.bezierCurveTo(-1.12, 1.75, -1.1, 2.4, -1.06, 3.2);
  g.bezierCurveTo(-1.02, 4.4, -0.98, 6.0, -0.9, 7.05); g.quadraticCurveTo(0, 7.24, 0.9, 7.05);
  g.bezierCurveTo(0.98, 6.0, 1.02, 4.4, 1.06, 3.2); g.bezierCurveTo(1.1, 2.4, 1.12, 1.75, 1.02, 1.55);
  g.bezierCurveTo(0.85, 1.32, 0.45, 1.3, 0.2, 1.22); g.quadraticCurveTo(0, 1.3, -0.2, 1.22); g.closePath();
  fillR(g, F.mantle); strokeR(g, F.outline, lw);
  if (o.central) {
    // open mantle: blue tunic panel with a gold clavus
    P(); g.moveTo(-0.17, 1.26); g.lineTo(-0.3, 7.12); g.quadraticCurveTo(0, 7.2, 0.3, 7.12); g.lineTo(0.17, 1.26); g.closePath();
    fillR(g, F.tunic); strokeR(g, F.outline, lw);
    P(); g.moveTo(0, 1.4); g.lineTo(0, 7.14); strokeR(g, F.clavus, lw * 1.5);
    // chrysography: gold highlight folds, with dark folds beside them
    for (const s of [-1, 1]) {
      const folds = [[0.52, 1.8, 0.6, 3.8, 0.55, 6.9], [0.8, 2.2, 0.86, 4.6, 0.76, 6.95], [0.38, 3.4, 0.44, 5.2, 0.4, 7.05]];
      for (const [a, b, c, d, e, f] of folds) {
        P(); g.moveTo(s * a, b); g.quadraticCurveTo(s * c, d, s * e, f); strokeR(g, F.mantleL, lw);
        P(); g.moveTo(s * (a + 0.07), b + 0.15); g.quadraticCurveTo(s * (c + 0.07), d, s * (e + 0.06), f - 0.05); strokeR(g, F.mantleD, lw);
      }
      P(); g.moveTo(s * 0.98, 1.66); g.quadraticCurveTo(s * 1.06, 2.3, s * 0.99, 2.92); strokeR(g, F.mantleL, lw);
    }
  } else {
    // a wrapped mantle: a diagonal drape and soft grey folds
    P(); g.moveTo(-0.95, 2.0); g.quadraticCurveTo(-0.1, 3.5, 0.95, 4.6); strokeR(g, F.mantleL, lw);
    P(); g.moveTo(-0.92, 2.25); g.quadraticCurveTo(-0.05, 3.75, 0.97, 4.9); strokeR(g, F.mantleD, lw);
    for (const s of [-1, 1]) {
      for (const [a, b, c, d, e, f] of [[0.55, 4.2, 0.6, 5.6, 0.55, 6.95], [0.25, 5.0, 0.3, 6.0, 0.22, 7.05], [0.82, 3.6, 0.86, 5.2, 0.78, 6.95]]) {
        P(); g.moveTo(s * a, b); g.quadraticCurveTo(s * c, d, s * e, f); strokeR(g, F.mantleD, lw);
      }
      P(); g.moveTo(s * 0.98, 1.66); g.quadraticCurveTo(s * 1.06, 2.3, s * 0.99, 2.92); strokeR(g, F.mantleD, lw);
    }
    P(); g.moveTo(-0.24, 1.3); g.quadraticCurveTo(0, 1.52, 0.24, 1.3); strokeR(g, F.mantleD, lw);
  }
  // forearm sleeves, bent at the elbow, with gold cuffs
  const sleeve = (ex, ey, wx, wy) => {
    P(); capsule(g, ex, ey, wx, wy, 0.36, 0.27); fillR(g, F.sleeve); strokeR(g, F.outline, lw);
    const k = 0.84, cx2 = lerp(ex, wx, k), cy2 = lerp(ey, wy, k);
    P(); capsule(g, cx2, cy2, wx, wy, 0.27, 0.27); fillR(g, F.cuff);
    P(); capsule(g, ex, ey, wx, wy, 0.36, 0.27); strokeR(g, F.outline, lw);
  };
  // a hand is one flesh silhouette: outline every part, fill every part, then draw the finger joins
  const hand = (parts, seps) => {
    for (const pt of parts) { P(); pt(); strokeR(g, F.line, lw * 2); }
    for (const pt of parts) { P(); pt(); fillR(g, F.flesh); }
    for (const [x0, y0, x1, y1] of seps) { P(); g.moveTo(x0, y0); g.lineTo(x1, y1); strokeR(g, F.line, lw * 0.9); }
  };
  const cap = (x0, y0, x1, y1, w0, w1) => () => capsule(g, x0, y0, x1, y1, w0, w1);
  // the lamp: a footed bowl
  const lampAt = (lx, ry) => {
    P(); g.moveTo(lx - 0.27, ry); g.quadraticCurveTo(lx, ry + 0.38, lx + 0.27, ry); g.closePath(); fillR(g, F.lamp); strokeR(g, F.lampD, lw);
    P(); g.moveTo(lx - 0.27, ry); g.lineTo(lx + 0.27, ry); strokeR(g, F.lampD, lw * 1.2);
    for (const [dx, dy, gm] of [[-0.12, 0.075, F.gemB], [0, 0.11, F.gemR], [0.12, 0.075, F.gemB]]) { P(); g.arc(lx + dx, ry + dy, 0.032, 0, TAU); fillR(g, gm); }
    P(); g.moveTo(lx - 0.05, ry + 0.17); g.lineTo(lx + 0.05, ry + 0.17); g.lineTo(lx + 0.11, ry + 0.29); g.lineTo(lx - 0.11, ry + 0.29); g.closePath();
    fillR(g, F.lamp); strokeR(g, F.lampD, lw);
  };
  if (o.central) {
    // right arm raised, palm out, long fingers; left hand carries the lamp
    sleeve(-0.92, 3.04, -0.53, 2.6);
    const FG = [[-0.608, 1.87, -0.016], [-0.548, 1.77, -0.005], [-0.488, 1.75, 0.005], [-0.43, 1.83, 0.016]];
    hand([
      () => { g.moveTo(-0.635, 2.62); g.lineTo(-0.645, 2.25); g.lineTo(-0.405, 2.25); g.lineTo(-0.41, 2.6); g.quadraticCurveTo(-0.52, 2.67, -0.635, 2.62); g.closePath(); },
      cap(-0.43, 2.52, -0.32, 2.33, 0.08, 0.064),                          // thumb, toward the body
      ...FG.map(([x, ty, dx]) => cap(x, 2.3, x + dx, ty, 0.064, 0.05)),
    ], FG.slice(1).map(([x, ty, dx], i) => { const [px, pty, pdx] = FG[i]; return [(x + px) / 2, 2.27, (x + dx + px + pdx) / 2, Math.max(ty, pty) + 0.05]; }));
    P(); g.moveTo(-0.6, 2.44); g.quadraticCurveTo(-0.53, 2.5, -0.46, 2.4); strokeR(g, F.shade, lw * 0.8);   // palm crease
    sleeve(0.94, 3.1, 0.52, 2.98);
    lampAt(0.14, 2.62);
    hand([                                                                   // fingers under the foot of the lamp, thumb up the bowl
      () => { g.moveTo(0.56, 2.9); g.lineTo(0.56, 3.1); g.quadraticCurveTo(0.45, 3.13, 0.34, 3.09); g.lineTo(0.34, 2.92); g.closePath(); },
      cap(0.4, 2.95, -0.02, 2.955, 0.07, 0.058), cap(0.4, 3.025, 0, 3.035, 0.07, 0.058), cap(0.4, 3.095, 0.05, 3.1, 0.062, 0.05),
      cap(0.4, 2.93, 0.33, 2.76, 0.07, 0.058),
    ], [[0.36, 2.99, 0.0, 2.995], [0.36, 3.062, 0.05, 3.068]]);
  } else {
    // both hands carry the lamp before the chest
    sleeve(-0.92, 3.12, -0.44, 2.98); sleeve(0.92, 3.12, 0.44, 2.98);
    lampAt(0, 2.66);
    for (const s of [-1, 1]) hand([
      () => { g.moveTo(s * 0.47, 2.9); g.lineTo(s * 0.47, 3.08); g.quadraticCurveTo(s * 0.3, 3.12, s * 0.15, 3.05); g.lineTo(s * 0.13, 2.97); g.quadraticCurveTo(s * 0.3, 2.93, s * 0.47, 2.9); g.closePath(); },
