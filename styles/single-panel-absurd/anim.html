<script>
// ── single-panel-absurd · a one-panel rural/scientific absurdist gag, loose ink with grey-green washes ──
// A tear-off desk-calendar page. The panel inks itself in with a round, slightly shaky brush-pen line,
// the grey and green washes bloom, and one small thing happens: a car slows down on the country road,
// and a cow quietly rises onto her hind legs to watch it go and add a mark to the tally on the fence.
// The caption is typed in below. The page is torn off over the top of the pad and the next day's
// panel inks itself: penguins, banded by researchers, one holds up her flipper to show the band.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2, DEG = Math.PI / 180;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eIO2 = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const backOut = (u, c = 1.7) => u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const PAPER = '#f4f1e6', INK = '#1b1c18';
const WASHC = { n: [104, 108, 102], g: [96, 128, 86], d: [44, 48, 42], s: [150, 160, 150] };
const SERIF = '"Libre Baskerville"';
// the pad and the panel on its sheet
const PADX = 400, PADW = 1120, BIND0 = 22, BIND1 = 60, SHY1 = 1044;
const PX = 500, PY = 126, PW = 920, PH = 660;
const T = {
  d1: [0.2, 1.5], w1: 1.2, car: [1.05, 3.35], rise: [2.0, 2.65], tally: [2.8, 3.05], c1: 3.25,
  flip: [5.35, 6.2],
  d2: [6.0, 7.0], w2: 6.75, flipper: 7.1, c2: 7.35, out: [9.5, 10.0],
};
const CAP1 = ['“Nine today who slowed down to say ‘moo.’ One begins', 'to wonder who is anthropomorphizing whom.”'];
const CAP2 = ['“Eleven years of study, and they still can’t tell', 'us apart without the jewelry.”'];

// ── scene authoring ──────────────────────────────────────────────────────────────────────────
// Items are drawn in the order written (painter's order); the pen also inks strokes in that order.
// S: pen stroke. FILL 'paper' knocks out what is behind (appears when the next stroke starts);
// FILL 'ink' is a solid black. WASH blooms in after the line work. XF: authoring matrix; GRP: an
// animated group whose matrix comes from the scene's groups(t).
let CUR, XF = new DOMMatrix(), GRP = null;
const newScene = () => ({ items: [] });
const S = (d, w = 1, o = {}) => { for (const p of d.split(/(?=M)/)) if (p.trim()) CUR.items.push({ k: 's', d: p, w, g: GRP, m: XF, ...o }); };
const WASH = (d, tone, delay = 0, col = 'n', rule = 'nonzero') => CUR.items.push({ k: 'w', d, tone, delay, col, rule, g: GRP, m: XF });
const FILL = (d, col = 'paper', rule = 'nonzero') => CUR.items.push({ k: 'f', d, col, rule, g: GRP, m: XF });
const at = (x, y, s = 1, mir = false) => new DOMMatrix().translate(x, y).scale(mir ? -s : s, s);
const P = (m, x, y) => { const q = m.transformPoint(new DOMPoint(x, y)); return [q.x, q.y]; };
const rotAbout = (x, y, a) => new DOMMatrix().translate(x, y).rotate(a / DEG).translate(-x, -y);
function crD(pts) {                                            // Catmull-Rom through points → cubic path
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    d += ` C ${p1[0] + (p2[0] - p0[0]) / 6} ${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6} ${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]} ${p2[1]}`;
  }
  return d;
}
function tube(pts, w0, w1) {                                   // outline of a tube along a centreline
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    const w = lerp(w0, w1, i / (pts.length - 1)) / 2;
    L.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); R.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  return { L, R };
}
// a leg: paper knock-out, two side lines, a black hoof
function leg(pts, w0, w1, hoof = true, lw = 1) {
  const { L, R } = tube(pts, w0, w1), e = pts[pts.length - 1];
  FILL('M ' + [...L, ...R.slice().reverse()].map(p => p.join(' ')).join(' L ') + ' Z');
  S(crD(L), lw); S(crD(R), lw);
  if (hoof) { const h = w1 / 2 + 1; FILL(`M ${e[0] - h} ${e[1] - 11} L ${e[0] + h} ${e[1] - 11} L ${e[0] + h + 2} ${e[1]} L ${e[0] - h - 2} ${e[1]} Z`, 'ink'); S(`M ${e[0] - h - 2} ${e[1]} L ${e[0] + h + 2} ${e[1]}`, .8); }
}
const ell = (cx, cy, rx, ry) => `M ${cx - rx} ${cy} C ${cx - rx} ${cy - ry * 1.33} ${cx + rx} ${cy - ry * 1.33} ${cx + rx} ${cy} C ${cx + rx} ${cy + ry * 1.33} ${cx - rx} ${cy + ry * 1.33} ${cx - rx} ${cy} Z`;
const tuft = (x, y, s = 1) => S(`M ${x - 7 * s} ${y} C ${x - 6 * s} ${y - 6 * s} ${x - 4 * s} ${y - 10 * s} ${x - 3 * s} ${y - 13 * s} M ${x} ${y} C ${x} ${y - 7 * s} ${x + 1 * s} ${y - 12 * s} ${x + 2 * s} ${y - 16 * s} M ${x + 6 * s} ${y} C ${x + 6 * s} ${y - 5 * s} ${x + 8 * s} ${y - 8 * s} ${x + 10 * s} ${y - 10 * s}`, .6);

const COW = { hip: [46, -104], sh: [192, -96], neck: [206, -134], tail: [22, -146] };
const COWBODY = 'M 30 -152 C 70 -160 140 -152 192 -154 C 216 -152 228 -128 224 -102 C 220 -82 206 -66 190 -63 C 150 -56 100 -59 70 -63 C 44 -63 24 -76 17 -96 C 9 -116 11 -146 30 -152 Z';
function cowHeadUp() {                                        // head raised, looking ahead

  S('M 256 -198 C 254 -210 260 -216 266 -214 C 266 -208 264 -203 264 -199', .8);   // horn

  WASH('M 280 -140 C 290 -146 304 -144 304 -132 C 304 -118 290 -113 282 -118 C 276 -124 276 -134 280 -140 Z', .42, .1, 'n');   // muzzle

}

  FILL(hd); S(hd, 1.05);
  FILL('M 240 -92 C 228 -106 214 -108 208 -102 C 214 -92 228 -88 240 -86 Z'); S('M 240 -92 C 228 -106 214 -108 208 -102 C 214 -92 228 -88 240 -86', .85);
  S('M 256 -100 C 258 -112 266 -116 270 -112 C 268 -106 266 -102 264 -98', .8);
  WASH('M 250 -26 C 262 -32 280 -30 280 -18 C 280 -4 262 -1 252 -8 C 246 -14 246 -22 250 -26 Z', .42, .1, 'n');

function cowTail() {

}
// grp: {body, fore, head, tail} group names (or null for a static cow)
function cow(m, grp, graze) {

  GRP = null;
  leg([[74, -80], [72, -44], [78, -24], [76, 0]], 22, 15);                         // far hind
  GRP = grp.fore; leg([[204, -80], [206, -40], [208, 0]], 22, 15);                  // far fore
  GRP = null;
  leg([[40, -96], [48, -54], [40, -30], [48, 0]], 32, 17);                          // near hind: thigh, hock
  GRP = grp.body;
  FILL('M 70 -66 C 70 -40 104 -40 106 -64 Z'); S('M 70 -66 C 70 -40 104 -40 106 -64', .9);   // udder
  S('M 80 -46 L 80 -38', .7); S('M 95 -46 L 96 -38', .7);
  WASH('M 70 -66 C 70 -40 104 -40 106 -64 Z', .3, .15, 'n');

  FILL(COWBODY); S(COWBODY, 1.1);
  S('M 62 -146 C 74 -120 72 -92 60 -68', .55);                                      // thigh
  S('M 176 -150 C 170 -130 172 -110 180 -92', .5);                                  // shoulder
  WASH('M 17 -96 C 24 -76 44 -63 70 -63 C 100 -59 150 -56 190 -63 C 206 -66 220 -82 224 -102 C 200 -86 150 -80 100 -84 C 60 -86 30 -90 17 -96 Z', .3, .05, 'n');
  FILL('M 92 -150 C 112 -156 134 -146 132 -124 C 128 -104 102 -106 94 -120 C 86 -132 84 -144 92 -150 Z', 'ink');
  FILL('M 28 -136 C 38 -146 56 -138 54 -120 C 50 -106 34 -110 26 -118 C 20 -124 22 -132 28 -136 Z', 'ink');
  FILL('M 158 -126 C 172 -134 188 -124 186 -108 C 182 -96 166 -98 160 -106 C 154 -112 152 -120 158 -126 Z', 'ink');

// ── the car (facing right, wheels on y = 0) ──
function car(m) {
  XF = m; GRP = 'car';
  const body = 'M 0 -12 L 0 -28 C 0 -33 4 -36 10 -36 L 30 -38 C 38 -52 48 -58 64 -58 L 88 -58 C 100 -58 106 -50 112 -38 L 124 -36 C 130 -35 133 -30 133 -26 L 133 -12 Z';

  S('M 0 -12 L 14 -12 M 42 -12 L 92 -12 M 120 -12 L 133 -12', .9, { inst: 1 });
  FILL('M 42 -40 C 48 -50 54 -53 64 -53 L 72 -53 L 72 -40 Z M 78 -53 L 88 -53 C 96 -53 100 -47 104 -40 L 78 -40 Z');
  S('M 42 -40 C 48 -50 54 -53 64 -53 L 72 -53 L 72 -40 Z M 78 -53 L 88 -53 C 96 -53 100 -47 104 -40 L 78 -40 Z', .7, { inst: 1 });
  FILL(ell(88, -45, 5, 5.5), 'ink'); FILL('M 83 -40 L 93 -40 L 93 -38 L 83 -38 Z', 'ink');   // the driver

  for (const x of [28, 106]) { FILL(ell(x, -10, 12, 12), 'ink'); FILL(ell(x, -10, 4.5, 4.5)); }
  GRP = null; XF = new DOMMatrix();
}

// ── scene 1 · the pasture ─────────────────────────────────────────────────────────────────────
const HY1 = 300, COWA = at(150, 598), COWB = at(832, 616, 1, true);
const SC1 = newScene(); CUR = SC1;
WASH(`M 0 0 L ${PW} 0 L ${PW} ${HY1} L 0 ${HY1} Z`, .2, 0, 's');
for (const [x, y, s] of [[620, 92, 1], [180, 150, .7]]) {                          // two flat clouds
  const d = `M ${x - 70 * s} ${y} C ${x - 72 * s} ${y - 14 * s} ${x - 52 * s} ${y - 22 * s} ${x - 36 * s} ${y - 14 * s} C ${x - 28 * s} ${y - 34 * s} ${x + 6 * s} ${y - 36 * s} ${x + 14 * s} ${y - 18 * s} C ${x + 30 * s} ${y - 28 * s} ${x + 60 * s} ${y - 20 * s} ${x + 62 * s} ${y} Z`;
  FILL(d); S(d, .8);
}
S(`M 0 ${HY1} C 240 ${HY1 - 1} 600 ${HY1 + 1} ${PW} ${HY1}`, 1);                 // the horizon, dead flat
for (const [x, y, s] of [[380, 120, 1], [408, 108, .8], [430, 128, .7]]) S(`M ${x - 9 * s} ${y - 3 * s} C ${x - 6 * s} ${y - 6 * s} ${x - 2 * s} ${y - 4 * s} ${x} ${y} C ${x + 2 * s} ${y - 4 * s} ${x + 6 * s} ${y - 6 * s} ${x + 9 * s} ${y - 3 * s}`, .6);
// a lone tree, far left
S('M 96 300 C 98 286 97 270 94 258 M 106 300 C 104 284 106 268 108 258', .8);
FILL('M 70 262 C 56 256 58 230 76 226 C 76 206 104 200 114 214 C 132 208 146 228 136 244 C 146 258 130 272 114 266 C 104 276 82 274 70 262 Z');
S('M 70 262 C 56 256 58 230 76 226 C 76 206 104 200 114 214 C 132 208 146 228 136 244 C 146 258 130 272 114 266 C 104 276 82 274 70 262 Z', .9);
WASH('M 70 262 C 56 256 58 230 76 226 C 76 206 104 200 114 214 C 132 208 146 228 136 244 C 146 258 130 272 114 266 C 104 276 82 274 70 262 Z', .6, .1, 'g');
// a farmhouse and a silo on the horizon, far right
FILL('M 736 300 L 736 262 L 760 244 L 784 262 L 784 300 Z M 792 300 L 792 240 C 792 228 814 228 814 240 L 814 300 Z');
S('M 736 300 L 736 262 L 760 244 L 784 262 L 784 300', .8); S('M 730 266 L 760 242 L 790 266', .8);
S('M 752 300 L 752 284 L 764 284 L 764 300', .5); S('M 768 272 L 778 272 L 778 280 L 768 280 Z', .5);
S('M 792 300 L 792 240 C 792 228 814 228 814 240 L 814 300', .8); S('M 792 252 L 814 252', .4); S('M 792 266 L 814 266', .4);
WASH('M 730 266 L 760 242 L 790 266 L 784 262 L 760 244 L 736 262 Z M 792 240 C 792 228 814 228 814 240 Z', .6, .1, 'd');
WASH('M 736 300 L 736 262 L 760 244 L 784 262 L 784 300 Z M 792 300 L 792 240 L 814 240 L 814 300 Z', .22, .15, 'n');
// the country road just behind the fence
WASH(`M 0 ${HY1} L ${PW} ${HY1} L ${PW} 316 L 0 316 Z`, .5, .05, 'g');
WASH(`M 0 316 L ${PW} 316 L ${PW} 334 L 0 334 Z`, .3, .1, 'n');
S(`M 0 316 C 300 315 620 317 ${PW} 316`, .7); S(`M 0 334 C 300 335 620 333 ${PW} 334`, .7);
car(at(0, 0, .82));
// ground
WASH(`M 0 334 L ${PW} 334 L ${PW} ${PH} L 0 ${PH} Z`, .55, .1, 'g');
WASH(`M 0 520 C 200 500 500 540 ${PW} 510 L ${PW} ${PH} L 0 ${PH} Z`, .18, .2, 'g');
// the fence: two wires, posts; the tally board on one post
S(`M 0 354 C 300 356 620 352 ${PW} 355`, .55); S(`M 0 372 C 300 374 620 370 ${PW} 373`, .55);
for (const x of [34, 154, 520, 640, 760, 880]) { const d = `M ${x - 5} 392 L ${x - 5} 344 L ${x + 5} 342 L ${x + 5} 392 Z`; FILL(d); S(d, .75); WASH(d, .4, .1, 'n'); }
const TB = { x: 316, y: 352, w: 74, h: 38 };                                        // the tally board
{ const d = `M 310 414 L 310 336 L 323 334 L 323 414 Z`; FILL(d); S(d, .8); WASH(d, .4, .1, 'n');
  const b = `M ${TB.x - 34} ${TB.y - 2} L ${TB.x + 36} ${TB.y} L ${TB.x + 35} ${TB.y + TB.h} L ${TB.x - 35} ${TB.y + TB.h - 2} Z`;
  FILL(b); S(b, .85); WASH(b, .22, .12, 'n');
  S(`M ${TB.x - 30} ${TB.y + 6} l 0 0.5 M ${TB.x + 31} ${TB.y + 7} l 0 0.5`, 1.2);  // nails
  for (let i = 0; i < 8; i++) {
    const x = TB.x - 26 + i * 6.5 + (i > 4 ? 6 : 0);
    if (i === 4) S(`M ${TB.x - 30} ${TB.y + 28} L ${TB.x - 2} ${TB.y + 10}`, .7);

  }
  S(`M ${TB.x + 26} ${TB.y + 9} L ${TB.x + 27} ${TB.y + 29}`, .75, { at: T.tally });  // no. 9
}
for (const [x, y, s] of [[60, 430, .8], [230, 420, .7], [470, 440, .8], [700, 430, .7], [860, 450, .9], [330, 470, .8], [600, 480, .9]]) tuft(x, y, s);
// shadows
WASH(ell(270, 604, 150, 14), .45, .25, 'g'); WASH(ell(690, 622, 150, 14), .45, .25, 'g');
// the listener, grazing, facing left
cow(COWB, { body: null, fore: null, head: 'headB', tail: 'tailB' }, true);
// the one who keeps count

for (const [x, y, s] of [[40, 630, 1.2], [470, 640, 1.1], [880, 646, 1.2], [120, 560, 1], [560, 600, 1]]) tuft(x, y, s);
// signature
S('M 842 646 C 840 630 846 620 852 622 C 860 624 858 636 846 636 M 862 646 C 866 636 872 634 872 640 C 872 646 864 646 866 640 M 878 646 C 884 628 888 616 886 614 C 882 626 882 640 886 646 M 892 646 C 898 628 902 616 900 614 C 896 626 896 640 900 646', .55);
SC1.groups = t => {
  const G = {};
  // the car: slows as it passes the pasture, then leaves

  if (cu > 0 && cu < 1) { const f = cu + .82 * Math.sin(TAU * cu) / TAU; G.car = new DOMMatrix().translate(lerp(-170, 960, f), 328); }
  // the rise: a small settle, then up onto the hind legs with a touch of overshoot
  const r0 = seg(t, T.rise[0], T.rise[0] + .14), r1 = seg(t, T.rise[0] + .1, T.rise[1]);
  const k = -.035 * Math.sin(Math.PI * r0) * (1 - r1) + backOut(r1, 1.2);

  const lh = P(COWA, ...COW.hip), ls = P(COWA, ...COW.sh), ln = P(COWA, ...COW.neck), lt = P(COWA, ...COW.tail);
  G.body = rotAbout(lh[0], lh[1], -78 * DEG * k);
  G.fore = G.body.multiply(rotAbout(ls[0], ls[1], (62 * k - 70 * tap) * DEG));
  const look = seg(t, T.car[0] + .6, T.car[1] - .2);
  G.head = G.body.multiply(rotAbout(ln[0], ln[1], (70 * k - 6 + 8 * eIO2(look)) * DEG));
  G.tail = G.body.multiply(rotAbout(lt[0], lt[1], 70 * k * DEG));
  // the listener chews on, tail swishing
  const lb = P(COWB, ...COW.neck), tb = P(COWB, ...COW.tail);
  G.headB = rotAbout(lb[0], lb[1], 1.6 * Math.sin(t * 7.5) * DEG);
  G.tailB = rotAbout(tb[0], tb[1], (8 * Math.sin(t * 2.6) - 4) * DEG);
  return G;
};

// ── the penguin (authored facing right, feet on y = 0, ~300 tall); flipper pivot at the shoulder ──
const PEN = { sh: [-12, -204] };
function penguin(m, flipG, detail = true) {
  XF = m; GRP = null;
