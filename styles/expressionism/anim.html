<html lang="en"><head><meta charset="utf-8">

<style>html,body{margin:0;background:#000}canvas{display:block}</style>

<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── expressionism · a village that turns into sound ─────────────────────────────────────────────
// On a primed cream canvas ink drops spatter in at the corner and a loaded brush hits the frame: a
// long kinked slash that becomes the foot of the mountains, then a steep second one. Colour floods in
// that owes nothing to nature: a yellow sky, a vermilion sun, ultramarine and violet mountains
// snapping up behind the first slash, an acid-green slope with a pink road, a crooked village
// (skewed houses, a leaning tower) and a crimson tree. For a bar the landscape bends to a 120 BPM beat:
// houses sway, peaks pump, the black lines twang, the sun throws coloured rings and a field swaps hue
// on the off-beats. Then every shape lets go of the landscape and becomes an improvisation: big
// wedges and planes, a target, whiplash lines over translucent painted colour clouds. It winds up and
// is blown outward by a yellow plate stamped with the title.
// Fills are brush plates (one per colour, tileable, precomputed) laid in under each shape's own
// transform, so the brushwork travels with the shape; outlines are tapered ribbons of bristle
// strands that only split into dry streaks where the brush runs out. A colour never blends into
// another: shapes that turn black are wiped over with ink. Canvas weave and grain are one static
// overlay. Everything is seeded; a frame depends only on t.
const W = 1920, H = 1080, DUR = 10, PI = Math.PI, TAU = 2 * PI;
const cv = document.getElementById('c'), cx = cv.getContext('2d');

const chain = (...ms) => ms.reduce(Mx.mul);

// ── polygons ──
const centroid = ps => { let x = 0, y = 0; for (const p of ps) { x += p[0]; y += p[1]; } return [x / ps.length, y / ps.length]; };

const disc = (x, y, r, seed, m = 18) => Array.from({ length: m }, (_, i) => { const a = i / m * TAU + 0.3, rr = r * (0.94 + 0.12 * hash(i, seed)); return [x + Math.cos(a) * rr, y + Math.sin(a) * rr]; });

// ── colour: the Blue Rider palette ──
const PAL = {
  ultra: '#1d3fbf', prussian: '#142a6e', cobalt: '#3d7fd9', yellow: '#f6c21c', lemon: '#f3e04a',
  vermilion: '#e2441f', crimson: '#b5163b', orange: '#f08a16', emerald: '#138a5e', acid: '#7cc242',
  violet: '#6b2a8f', pink: '#e86aa0', cream: '#f1e6cc', black: '#141414',

const INK = '#141414';

const T = {

  s1: [0.18, 0.27, 0.42],          // the bristle tip creeps in at the edge, then the whip across
  s2: [0.76, 0.90],
  sky: [0.80, 0.32], sun: [0.90, 0.42],
  mtn: [1.30, 0.46], far: [1.37, 0.46], ridge: [1.40, 1.76], facet: 1.50,
  slope: [1.55, 0.28], field: [1.61, 0.28], road: [1.64, 0.30], hatch: 1.70,
  tower: 2.05, tree: 2.30,
  swaps: [[2.80, 'sky', 'orange'], [3.80, 'slope', 'lemon']],
  morph: 4.30, clouds: 4.80, marks: [5.30, 5.80],
  windup: 6.00, title: 6.30, sub: 6.80, close: 9.20, black: 9.95,

// how hard the landscape answers each beat
const beatAmp = b => b < 2.29 ? 0 : b < 4.29 ? 1 : b < 6.29 ? 0.7 : b < 6.31 ? 0 : b < 9.19 ? 0.42 : 0.15;

const PS = 640, PLATE = {}, PAT = {};

    const s = eback((t - tl) / 0.12, 2.5), c = push2(x, y);
    polyPath(splat(c[0], c[1], r * s, 810 + i), dr);
    polyPath(disc(c[0] + r * 2.1 * Math.cos(i * 2.1), c[1] + r * 2.1 * Math.sin(i * 2.1), r * 0.22 * s, 820 + i, 7), dr);
  });
  cx.fill(dr);
}
function drawHatches(t) {
  const ink = new Path2D();
  HATCH.forEach((h, g) => {
    if (t < h.t0) return;
    const col = 1 - out3(span(t, 4.5 + g * 0.04, 4.85 + g * 0.04)); if (col <= 0) return;
    h.strokes.forEach((s, i) => {
      const p = out3(span(t, h.t0 + i * 0.025, h.t0 + i * 0.025 + 0.13));
      brush(ink, s.map(q => [h.c[0] + (q[0] - h.c[0]) * col, h.c[1] + (q[1] - h.c[1]) * col]), { w: 1, press: u => 3 + 6 * (1 - u), p, seed: 500 + g * 7 + i, dry: 0.4, step: 5, k: 3, tin: 0.08, tout: 0.45 });
    });
  });
  cx.fillStyle = INK; cx.fill(ink);
}
function drawMarks(t) {
  const push = pushK(t), ink = new Path2D(), pp = (x, y) => [C0[0] + (x - C0[0]) * push, C0[1] + (y - C0[1]) * push];
  for (const [mi, m] of MARKS.entries()) {
    if (t < m.t0) continue;
    const d = t - m.t0;
    if (m.kind === 'hatch') m.lines.forEach((l, i) => {
      const p = out3(span(d, i * 0.04, i * 0.04 + 0.14)); if (p > 0) brush(ink, l.map(q => pp(q[0], q[1])), { w: 1, press: u => 4 + 7 * Math.sin(PI * u), p, seed: 720 + i, dry: 0.5, k: 3, step: 5, tout: 0.35 });
    });
    if (m.kind === 'arc') {
      const p = out3(span(d, 0, 0.3)), c = m.sun ? sunNow(t).c : pp(...m.c);
      const ps = Array.from({ length: 25 }, (_, i) => { const a = mix(m.a0, m.a1, i / 24); return [c[0] + Math.cos(a) * m.R, c[1] + Math.sin(a) * m.R]; });
      brush(ink, ps, { w: 1, press: u => 5 + 10 * Math.sin(PI * u), p, seed: 760 + mi, dry: 0.5, k: 4, tout: 0.3 });
    }
  }
  cx.fillStyle = INK; cx.fill(ink);
}

// ── the title plate ──
const TXT = 'Expressionism', SUB = 'Germany · c. 1905–1920';
const PLATE_RUNS = [[0, 3, 26], [3, 7, 24], [7, 10, 26], [10, 14, 24]];
function buildTitle() {
  // an irregular jagged polygon: notched corner breaks on both long edges, blunt cut ends
  PLATE_PTS = [[-668, -148], [-352, -184], [-306, -142], [40, -168], [336, -198], [380, -152], [662, -150], [690, 38], [628, 178], [246, 192], [198, 150], [-236, 170], [-652, 182], [-684, 30]];
  const wg = wiggle(911); PLATE_IN = PLATE_PTS.map((_, i) => Math.max(0, 2 + 9 * wg(i * 0.9)));
  let size = 186; cx.font = `900 ${size}px "Grenze Gotisch"`;
  const w0 = cx.measureText(TXT).width; size = Math.min(210, size * 1110 / w0); cx.font = `900 ${size}px "Grenze Gotisch"`;
  const m = cx.measureText(TXT), A = m.actualBoundingBoxAscent, D = m.actualBoundingBoxDescent, x0 = -m.width / 2;
  const glyphs = [...TXT].map((ch, i) => { const a = cx.measureText(TXT.slice(0, i)).width, b = cx.measureText(TXT.slice(0, i + 1)).width; return { ch, x: x0 + a, cx: x0 + (a + b) / 2, i }; });
  const base = (A - D) / 2 + 4;
  cx.font = '600 60px "Grenze Gotisch"';
  const sm2 = cx.measureText(SUB);
  TITLE = { font: `900 ${size}px "Grenze Gotisch"`, glyphs, base, mid: base - A / 2, sub: { font: '600 60px "Grenze Gotisch"', w: sm2.width, base: (sm2.actualBoundingBoxAscent - sm2.actualBoundingBoxDescent) / 2 } };
}
function drawTitle(t) {
  if (t < T.title) return;
  const d = t - T.title, st = settle(t);
  const s = 1.18 - 0.18 * eback(d / 0.26, 2.4), rot = -0.035 + 0.007 * osc(t, 0.3, 1.8);
  const M = chain(Mx.T(C0[0], C0[1]), Mx.R(rot), Mx.S(s));
  cx.save(); cx.setTransform(...M);
  paint(polyPath(PLATE_PTS), 'cream', Mx.T(37, 11));
  paint(polyPath(inset(PLATE_PTS, PLATE_IN)), 'yellow', Mx.T(211, 97));
  const ink = new Path2D(), loop = [...PLATE_PTS, ...PLATE_PTS];
  PLATE_RUNS.forEach(([a, b, w], i) => brush(ink, runPts(loop, a, b, 16), { w, seed: 930 + i, dry: 0.5, tout: 0.14, k: 6 }));
  cx.fillStyle = INK; cx.fill(ink);
  // every letter is on from the first frame; after the slam each one ticks a degree or two on the beats
  cx.font = TITLE.font; cx.textBaseline = 'alphabetic'; cx.fillStyle = INK;
  const kb = Math.floor((t - BEAT0) / SPB + 1e-6);
  for (const g of TITLE.glyphs) {
    let a = 0;
    for (let j = Math.max(13, kb - 1); j <= kb && j < BEATS.length; j++) { const db = t - BEATS[j]; if (db >= 0) a += 0.03 * beatAmp(BEATS[j]) / 0.42 * ((g.i + j) % 2 ? 1 : -1) * (1 - Math.exp(-db / 0.025)) * Math.exp(-db / 0.3); }
    a *= st;
    cx.save(); cx.translate(g.cx, TITLE.mid); cx.rotate(a); cx.fillText(g.ch, g.x - g.cx, TITLE.base - TITLE.mid); cx.restore();
  }
  if (t >= T.sub) {                              // the subtitle pops in whole on a slanted black strip
    const ds = t - T.sub, ps = 0.72 + 0.28 * eback(ds / 0.24, 2.0);
    cx.globalAlpha = cl(ds / 0.07);
    cx.transform(...chain(Mx.T(30, 262), Mx.R(-0.025 + 0.004 * osc(t, 0.3, 1.6)), Mx.S(ps)));
    const strip = new Path2D(), half = TITLE.sub.w / 2 + 120;
    brush(strip, subdiv([[-half, 4], [half, -4]], 60), { w: 98, seed: 950, dry: 0.45, tin: 0.04, tout: 0.1, k: 6 });
    cx.fillStyle = INK; cx.fill(strip);
    cx.font = TITLE.sub.font; cx.fillStyle = PAL.cream; cx.textAlign = 'center';
    cx.fillText(SUB, 0, TITLE.sub.base);
  }
  cx.restore();
}

function frame(t) {
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
  const z = 1 + 0.025 * inOut(span(t, 2.3, 4.6));
  cx.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z));
  cx.drawImage(GROUND, 0, 0);
  for (const L of LAYERS) L(t);
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1;
  drawTitle(t);
  cx.setTransform(1, 0, 0, 1, 0, 0); cx.globalAlpha = 1;
  cx.globalCompositeOperation = 'multiply'; cx.drawImage(WEAVE, 0, 0); cx.globalCompositeOperation = 'source-over';
  const fade = Math.max(0.55 * (1 - sm(span(t, 0, 0.22))), sm(span(t, T.close + 0.05, T.black)));
  if (fade > 0) { cx.fillStyle = `rgba(0,0,0,${fade})`; cx.fillRect(0, 0, W, H); }
}

window.draw = ({ t }) => { frame(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => CUES;
window.ready = (async () => {
  await document.fonts.load('900 100px "Grenze Gotisch"'); await document.fonts.load('600 60px "Grenze Gotisch"'); await document.fonts.ready;
  build();
})();
</script>
