/* ======================================================================
 * Blob Simulation: "Do nice blobs finish last?"
 * A hawk/dove style evolution sim with soft, big-eyed blobs.
 *   - Every day, pairs of food pellets appear on a gridded tabletop world.
 *   - Each blob walks to a pair. Two Sharers split it (1 + 1). A Grabber
 *     meeting a Sharer steals most (1½ + ½). Two Grabbers fight (0 + 0).
 *     A blob alone gets both (2).
 *   - 2 food: survive and clone. 1½: survive, 50% clone. 1: survive.
 *     ½: 50% survive. 0: gone.
 * The whole run is pre-simulated from a fixed seed in window.ready; every
 * frame is then a pure function of t (seeded RNG only, no Date/Math.random).

/* ------------------------------------------------------------- palette */
const COL = {
  S: '#86c1f5', G: '#ff8d82', food: '#9ad96f', ink: '#2c3350', inkSoft: '#6b7291',
  Sdeep: '#3f8fd6', Gdeep: '#e8574b', card: '#ffffff', bg0: '#e7edf7', bg1: '#f7f0ea'

/* ------------------------------------------------------------ timeline */
const T_TITLE = 0.25, T_LEGEND = 0.75;
// generation schedule: [start, length, phase boundaries (walk out end, interact end, walk home end)]
const GEN = [[1.0, 3.6, [0.28, 0.64, 0.84]]];
{ let t = 4.6; for (const d of [0.85, 0.65, 0.52, 0.45, 0.42, 0.4, 0.38, 0.37]) { GEN.push([t, d, [0.33, 0.6, 0.85]]); t += d; } }
const SIM_END = GEN[GEN.length - 1][0] + GEN[GEN.length - 1][1];

/* --------------------------------------------------------------- world */
const HALF = 20, HOME = 18.5, FOODR = 15;
const P = 8 * HOME;                                    // perimeter of the home ring (square)
function perim(s) {                                    // arc length -> {x,z,tx,tz} (tangent)
  s = ((s % P) + P) % P; const L = 2 * HOME;
  if (s < L) return { x: -HOME + s, z: HOME, tx: 1, tz: 0 };            // front edge, left -> right
  s -= L; if (s < L) return { x: HOME, z: HOME - s, tx: 0, tz: -1 };
  s -= L; if (s < L) return { x: HOME - s, z: -HOME, tx: -1, tz: 0 };
  s -= L; return { x: -HOME, z: -HOME + s, tx: 0, tz: 1 };

  const a = Math.max(Math.abs(x), Math.abs(z)) || 1, px = x / a * HOME, pz = z / a * HOME;
  if (Math.abs(pz - HOME) < 1e-6) return px + HOME;

/* ---------------------------------------------------------- simulation */
// scripted close-up on the front edge (day 1)
const SCRIPT = [
  { c: [5.3, 12.4], who: [['S', 6.4], ['S', 4.2]], role: 'share', fates: ['live', 'live'] },
  { c: [1.6, 11.4], who: [['G', 2.6], ['S', 0.6]], role: 'steal', fates: ['repro', 'die'] },
  { c: [-2.2, 12.6], who: [['G', -1.2], ['G', -3.2]], role: 'fight', fates: ['die', 'die'] },

  ctx.save(); ctx.translate(gx + gw - 34 - dw / 2, gy + 47); ctx.scale(1 + 0.12 * tick, 1 + 0.12 * tick);
  pill(ctx, -dw / 2, -21, dw, 42, COL.ink, false); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.letterSpacing = '3px'; ctx.fillText(dtxt, 1.5, 9); ctx.letterSpacing = '0px'; ctx.restore();
  // plot area
  const px = gx + 70, py = gy + 88, pw = gw - 110, ph = gh - 150, days = GEN.length, ymax = 60;
  const X = d => px + d / days * pw, Y = v => py + ph - v / ymax * ph;
  ctx.strokeStyle = 'rgba(44,51,80,0.08)'; ctx.lineWidth = 2; ctx.font = font(20, 700); ctx.fillStyle = COL.inkSoft; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = 0; v <= ymax; v += 20) { ctx.beginPath(); ctx.moveTo(px, Y(v)); ctx.lineTo(px + pw, Y(v)); ctx.stroke(); ctx.fillText(String(v), px - 14, Y(v)); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let d = 0; d <= days; d += 2) ctx.fillText(String(d + 1), X(d), py + ph + 12);
  ctx.textAlign = 'left'; ctx.fillText('day', px + pw + 8 - 30, py + ph + 36);
  const dv = dayValue(t), C = SIM.counts;
  const val = (k, d) => { const i = Math.floor(d), f = d - i; return i >= C.length - 1 ? C[C.length - 1][k] : lerp(C[i][k], C[i + 1][k], f); };
  // equilibrium marker near the end
  const eq = sstep(T_CAP1 - 0.2, T_CAP1 + 0.4, t);
  for (const k of ['G', 'S']) {
    const col = k === 'S' ? COL.Sdeep : COL.Gdeep;
    ctx.strokeStyle = k === 'S' ? '#6fb2ee' : '#ff7a6e'; ctx.lineWidth = 7; ctx.lineJoin = ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(X(0), Y(C[0][k]));
    for (let d = 1; d <= Math.floor(dv); d++) ctx.lineTo(X(d), Y(C[d][k]));
    ctx.lineTo(X(dv), Y(val(k, dv))); ctx.stroke();
    const ex = X(dv), ey = Y(val(k, dv));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = k === 'S' ? COL.S : COL.G; ctx.beginPath(); ctx.arc(ex, ey, 7.5, 0, TAU); ctx.fill();
    ctx.font = font(24, 900); ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const other = val(k === 'S' ? 'G' : 'S', dv), cur = val(k, dv), sep = Math.abs(Y(cur) - Y(other)) < 30 ? (cur >= other ? -16 : 16) : 0;
    if (dv < days - 0.05) ctx.fillText(String(Math.round(cur)), ex + 18, ey + sep);
    else ctx.fillText(String(Math.round(cur)), ex + 18, ey + sep);
  }
  if (eq > 0) {
    const i0 = Math.max(0, days - 4), ya = Y((C[days].S + C[days].G) / 2);
    ctx.save(); ctx.globalAlpha = eq; ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.5; ctx.setLineDash([8, 9]);
    ctx.beginPath(); ctx.moveTo(X(i0) - 10, ya); ctx.lineTo(X(days) + 4, ya); ctx.stroke(); ctx.setLineDash([]);
    ctx.font = font(22, 900); ctx.fillStyle = COL.ink; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; ctx.fillText('half & half', X(i0) - 16, ya + 11);
    ctx.restore();
  }
  ctx.restore();
}
function drawCaption(ctx, t) {
  const a1 = easeOut(win(T_CAP1, T_CAP1 + 0.45, t)), a2 = backOut(win(T_CAP2, T_CAP2 + 0.4, t), 2.0);
  if (a1 <= 0) return;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const cx = W / 2, cy = 948;
  ctx.globalAlpha = a1; ctx.font = font(52, 800);
  const l1 = 'Nice blobs don’t finish last.', w1 = ctx.measureText(l1).width;
  ctx.font = font(52, 900); const l2 = 'They finish even.', w2 = ctx.measureText(l2).width;
  const tw = w1 + (28 + w2) * easeInOut(win(T_CAP2 - 0.05, T_CAP2 + 0.3, t)) + 90;
  pill(ctx, cx - tw / 2, cy - 48 + (1 - a1) * 20, tw, 96, 'rgba(255,255,255,0.95)');
  ctx.font = font(52, 800); ctx.fillStyle = COL.ink; ctx.fillText(l1, cx - tw / 2 + 45 + w1 / 2, cy + 2 + (1 - a1) * 20);
  if (a2 > 0) {
    ctx.save(); ctx.globalAlpha = clamp01(a2); ctx.translate(cx - tw / 2 + 45 + w1 + 28 + w2 / 2, cy + 2); ctx.scale(a2, a2);
    ctx.font = font(52, 900); const gr = ctx.createLinearGradient(-w2 / 2, 0, w2 / 2, 0); gr.addColorStop(0, COL.Sdeep); gr.addColorStop(0.5, '#9b76d8'); gr.addColorStop(1, COL.Gdeep);
    ctx.fillStyle = gr; ctx.fillText(l2, 0, 0); ctx.restore();
  }
  ctx.restore();
}

function compose(t) {
  octx.globalAlpha = 1; octx.drawImage(bgc, 0, 0);
  const fadeWorld = sstep(T_FADE, DUR - 0.15, t);
  octx.globalAlpha = 1 - fadeWorld * 0.92; octx.drawImage(glc, 0, 0);
  drawLabels(octx, t); drawTitle(octx, t); drawGraph(octx, t);
  octx.globalAlpha = 1;
  // opening fade from the background tone
  const fin = 1 - sstep(0, 0.45, t);
  if (fin > 0) { octx.globalAlpha = fin; octx.drawImage(bgc, 0, 0); octx.globalAlpha = 1; }
  drawCaption(octx, t);
  const fo = sstep(DUR - 0.5, DUR, t) * 0.35;
  if (fo > 0) { octx.globalAlpha = fo; octx.drawImage(bgc, 0, 0); octx.globalAlpha = 1; }
}

window.ready = (async () => {
  // pick the seed whose run ends closest to the analytic equilibrium (half Grabbers)
  let best = null;
  for (let s = 1; s <= 400; s++) {
    const r = simulate(s), f = r.counts[r.counts.length - 1], tot = f.S + f.G, fg = f.G / tot;
    const mid = r.counts[6], maxPop = Math.max(...r.gens.map((g, i) => g.agents.length + (r.gens[i + 1] ? r.gens[i + 1].agents.length : r.final.length)));
    const score = Math.abs(fg - 0.5) * 4 + Math.abs(f.S - f.G) * 0.02 + (maxPop > MAXB ? 99 : 0) + (mid.G > mid.S * 1.2 ? 0.5 : 0) + Math.abs(tot - 76) * 0.01;
    if (!best || score < best.score) best = { score, s };
  }
  SIM = simulate(best.s); SIM.seed = best.s;
  await document.fonts.load("900 80px 'Nunito'", 'Do nice blobs finish last?');
  await document.fonts.load("600 30px 'Nunito'", 'abc'); await document.fonts.load("700 30px 'Nunito'", 'abc½');
  await document.fonts.ready;
  setScene(0); renderer.render(scene, camera); renderer.getContext().finish();
})();

window.draw = ({ t }) => {
  setScene(t); renderer.render(scene, camera);
  compose(t);
  return out.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.info = () => ({ seed: SIM.seed, counts: SIM.counts, sizes: SIM.gens.map(g => g.agents.length) });

window.events = () => {
  const ev = [{ k: 'title', t: T_TITLE }];
  SIM.gens[0].agents.forEach(a => { if (a.scripted) ev.push({ k: 'spawn', t: 0.1 + a.delay * 0.4 + 0.12, x: a.fx / HALF }); });
  SIM.gens[0].pairs.forEach((p, k) => { if (p.scripted) ev.push({ k: 'food', t: 0.3 + k * 0.04 + 0.2 }); });
  ev.push({ k: 'legend', t: T_LEGEND }, { k: 'legend', t: T_LEGEND + 0.14 });
  GEN.forEach(([g0, gl, [pa, pb, pc]], g) => {
    const gen = SIM.gens[g], fast = g > 0;
    ev.push({ k: 'day', t: g0, g });
    if (!fast) {
      gen.pairs.forEach(p => { if (!p.scripted) return; const x = p.x / HALF, v0 = g0 + gl * pa, dv = gl * (pb - pa);
        if (p.role === 'share') ev.push({ k: 'nom', t: v0 + dv * 0.45, x }, { k: 'nom', t: v0 + dv * 0.47, x }, { k: 'label', t: v0 + dv * 0.12, x });
        if (p.role === 'alone') ev.push({ k: 'nom', t: v0 + dv * 0.42, x }, { k: 'nom', t: v0 + dv * 0.7, x }, { k: 'label', t: v0 + dv * 0.12, x });
        if (p.role === 'steal') ev.push({ k: 'nom', t: v0 + dv * 0.35, x }, { k: 'nib', t: v0 + dv * 0.42, x }, { k: 'swipe', t: v0 + dv * 0.5, x }, { k: 'nom', t: v0 + dv * 0.72, x }, { k: 'label', t: v0 + dv * 0.12, x });
        if (p.role === 'fight') { const b0 = v0 + dv * 0.08, bl = dv * 0.58; ev.push({ k: 'bonk', t: b0 + bl / 6, x }, { k: 'bonk', t: b0 + bl / 2, x }, { k: 'bonk', t: b0 + bl * 5 / 6, x }, { k: 'burst', t: v0 + dv * 0.45, x }, { k: 'daze', t: v0 + dv * 0.68, x }, { k: 'label', t: v0 + dv * 0.12, x }); }
      });
      gen.agents.forEach(a => { if (!a.scripted) return; const tt = g0 + gl * pc; if (a.fate === 'repro') ev.push({ k: 'split', t: tt + gl * (1 - pc) * 0.3, x: a.hx / HALF }); if (a.fate === 'die') ev.push({ k: 'deflate', t: tt + gl * (1 - pc) * 0.1, x: a.hx / HALF }); });
    } else {
      const nb = gen.agents.length, nf = gen.agents.filter(a => a.role === 'fight').length / 2, nr = gen.agents.filter(a => a.fate === 'repro').length;
      ev.push({ k: 'bustle', t: g0 + gl * pa, d: gl * (pb - pa), n: nb, f: nf }, { k: 'births', t: g0 + gl * (pc + (1 - pc) * 0.3), n: nr });
    }
  });
  ev.push({ k: 'zoom', t: T_ZOOM0 }, { k: 'cap1', t: T_CAP1 }, { k: 'cap2', t: T_CAP2 }, { k: 'end', t: T_FADE });
  return ev.sort((a, b) => a.t - b.t);
};
