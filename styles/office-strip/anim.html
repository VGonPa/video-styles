<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── office-strip · three-panel corporate satire strip, clean uniform ink + flat muted office colour ──
// "Open Plan" (original cast): a VP of Strategy announces the pivot to synergy at the whiteboard
// ("1 + 1 = 3"), a deadpan engineer asks one question, a silent beat (clock ticks, she crosses out
// "+ 1"), punchline. Then Friday's strip slides in over it: the callback.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const backOut = u => { const c = 1.7; return u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const STEP = 12, stp = t => Math.floor(t * STEP + 1e-4) / STEP;       // character animation on twos-ish (12 fps)

// ── palette: flat, muted office colour ──
const INK = '#232226', PAPER = '#f5f1e6', DESK = '#7f8b8f';
const SAGE = '#d3dac7', BEIGE = '#e6d8bd', CARPET = '#a3adb0', WOOD = '#c8ab83', WOOD_D = '#a98b64';
const B_SKIN = '#efcaa7', B_HAIR = '#c3c2bd', B_HAIR_D = '#a9a8a3', BLAZER = '#58727e', BLOUSE = '#f3eee3';
const E_SKIN = '#a8714f', E_HAIR = '#2b2320', HOODIE = '#c89b47', HOODIE_D = '#b0863a';
const BOARD = '#fbfbf6', FRAME = '#9ba4a8', MARKER = '#2f5d9a', RED = '#b43c38', CHAIR = '#56616b';
const LETTER = '"Comic Neue"', HAND = '"Kalam"';
let LWu = 4.4;                         // current ink width in local (scaled) units

// strip geometry
const CX = 60, CY = 100, CW = 1800, CH = 860, PY = 215, PH = 720, PW = 560, GUT = 30, PX0 = 90;
const PX = i => PX0 + i * (PW + GUT);

// ── timeline ──
const T = {
  card: [0.0, 0.45], p: [0.30, 2.95, 4.55],
  bA: 0.85, bB: 1.70, bC: 3.55, bD: 5.95,
  strike: [5.02, 5.47], blink: [3.35, 3.45],
  slide1: [7.35, 8.1], s2p: [7.0, 7.0], bE: 8.3, fade: [9.45, 10.0],
};

// ── drawing primitives ──
function strokeInk(lw = LWu) { ctx.lineWidth = lw; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
function fillInk(fill, lw = LWu) { ctx.fillStyle = fill; ctx.fill(); strokeInk(lw); }
function pth(pts, close) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); if (close) ctx.closePath(); }
// union of shapes with one continuous outline: ink pass (fat) then colour pass
function blob(parts, fill) {
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const pass of [0, 1]) for (const p of parts) {
    if (p.cap) { pth(p.cap); ctx.lineWidth = p.w + (pass ? 0 : 2 * LWu); ctx.strokeStyle = pass ? fill : INK; ctx.stroke(); }
    else { ctx.beginPath(); p(); if (!pass) { ctx.lineWidth = 2 * LWu; ctx.strokeStyle = INK; ctx.stroke(); } ctx.fillStyle = pass ? fill : INK; ctx.fill(); }
  }
  ctx.restore();
}
const ell = (x, y, rx, ry, r = 0) => () => ctx.ellipse(x, y, rx, ry, r, 0, TAU);
// two-bone IK: shoulder S, target T, lengths a,b; bend sign
function ik(S, Tg, a, b, bend) {
  let dx = Tg[0] - S[0], dy = Tg[1] - S[1]; let d = Math.hypot(dx, dy);
  const dm = Math.min(d, a + b - 0.5); const ang = Math.atan2(dy, dx);
  const c = clamp((a * a + dm * dm - b * b) / (2 * a * dm), -1, 1); const A = ang + bend * Math.acos(c);
  const E = [S[0] + a * Math.cos(A), S[1] + a * Math.sin(A)];
  const ea = Math.atan2(Tg[1] - E[1], Tg[0] - E[0]);
  return { E, W: [E[0] + b * Math.cos(ea), E[1] + b * Math.sin(ea)], fa: ea };
}
// a hand: palm + four fingers + thumb, fingers pointing along `ang`. side=+1/-1 puts the thumb on one side.
function hand(x, y, ang, sz, skin, o = {}) {
  const c = Math.cos(ang), s = Math.sin(ang), px = -s, py = c, side = o.side ?? 1;
  const fist = o.fist, fl = fist ? 0.18 : 0.42;
  const parts = [ell(x, y, sz * 0.48, sz * 0.40, ang)];
  const fing = [];
  for (let i = 0; i < 4; i++) {
    const off = (i - 1.5) * sz * 0.2, len = fl * sz * (i === 0 || i === 3 ? 0.82 : 1);
    const bx = x + c * sz * 0.28 + px * off, by = y + s * sz * 0.28 + py * off;
    const tx = bx + c * (sz * 0.12 + len), ty = by + s * (sz * 0.12 + len);
    fing.push([[bx, by], [tx, ty]]); parts.push({ cap: [[bx, by], [tx, ty]], w: sz * 0.19 });
  }
  const tb = [x + px * side * sz * 0.3 - c * sz * 0.05, y + py * side * sz * 0.3 - s * sz * 0.05];
  const tt = fist ? [tb[0] + c * sz * 0.34 - px * side * sz * 0.1, tb[1] + s * sz * 0.34 - py * side * sz * 0.1]
                  : [tb[0] + c * sz * 0.32 + px * side * sz * 0.22, tb[1] + s * sz * 0.32 + py * side * sz * 0.22];
  parts.push({ cap: [tb, tt], w: sz * 0.21 });
  blob(parts, skin);
  // finger seams
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = LWu * 0.6; ctx.lineCap = 'round';
  for (let i = 1; i < 4; i++) {
    const off = (i - 2) * sz * 0.2 + sz * 0.1;
    const bx = x + c * sz * 0.36 + px * off, by = y + s * sz * 0.36 + py * off;
    const e = sz * (fist ? 0.22 : 0.44);
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + c * e, by + s * e); ctx.stroke();
  }
  ctx.restore();
}
function limb(S, E, Wr, w1, w2, fill) {
  blob([{ cap: [S, E], w: w1 }, { cap: [E, Wr], w: w2 }], fill);
}

// ── characters ────────────────────────────────────────────────────────────────────────
// Engineer: seated, front view, hands folded on the table. origin = neck base.
function engineer(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(o.s, o.s); LWu = 4.4 / o.s;
  // hood behind the neck
  ctx.beginPath(); ctx.ellipse(0, -4, 88, 30, 0, 0, TAU); fillInk(HOODIE_D);
  // torso (hoodie)
  ctx.beginPath(); ctx.moveTo(-44, -8); ctx.quadraticCurveTo(-122, 2, -152, 38); ctx.quadraticCurveTo(-178, 72, -180, 170);
  ctx.lineTo(-184, 330); ctx.lineTo(184, 330); ctx.lineTo(180, 170); ctx.quadraticCurveTo(178, 72, 152, 38); ctx.quadraticCurveTo(122, 2, 44, -8); ctx.closePath(); fillInk(HOODIE);
  // neck
  ctx.beginPath(); ctx.rect(-25, -62, 50, 60); ctx.fillStyle = E_SKIN; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-25, -62); ctx.lineTo(-25, -4); ctx.moveTo(25, -62); ctx.lineTo(25, -4); strokeInk();
  // collar + drawstrings
  ctx.beginPath(); ctx.moveTo(-50, -6); ctx.quadraticCurveTo(0, 48, 50, -6); ctx.fillStyle = HOODIE; ctx.fill(); strokeInk();
  ctx.beginPath(); ctx.moveTo(-20, 26); ctx.lineTo(-25, 96); ctx.moveTo(20, 26); ctx.lineTo(27, 90); strokeInk(LWu * 0.8);
  ctx.beginPath(); ctx.arc(-25, 100, 5, 0, TAU); ctx.arc(27, 94, 5, 0, TAU); ctx.fillStyle = INK; ctx.fill();
  // pocket seam
  ctx.beginPath(); ctx.moveTo(-90, 128); ctx.lineTo(90, 128); strokeInk(LWu * 0.7);
  // ears
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 73, -124, 13, 21, 0, 0, TAU); fillInk(E_SKIN); }
  // head
  ctx.beginPath(); ctx.moveTo(-70, -128); ctx.bezierCurveTo(-72, -226, 72, -226, 70, -128); ctx.bezierCurveTo(70, -72, 44, -44, 0, -44); ctx.bezierCurveTo(-44, -44, -70, -72, -70, -128); ctx.closePath(); fillInk(E_SKIN);
  // hair: short, side-parted mop with a flat fringe
  ctx.beginPath(); ctx.moveTo(-75, -126); ctx.bezierCurveTo(-86, -192, -50, -230, 2, -228); ctx.bezierCurveTo(54, -230, 88, -196, 75, -126);
  ctx.bezierCurveTo(70, -150, 62, -166, 46, -174); ctx.bezierCurveTo(22, -160, -8, -180, -28, -168); ctx.bezierCurveTo(-48, -172, -66, -156, -75, -126); ctx.closePath(); fillInk(E_HAIR);
  // face: flat brows, half-lidded dot eyes, small nose, flat mouth
  const ex = o.eye || 0;
  ctx.beginPath(); ctx.moveTo(-42, -150); ctx.lineTo(-14, -151); ctx.moveTo(14, -151); ctx.lineTo(42, -150); strokeInk(LWu * 1.1);
  for (const sx of [-1, 1]) {
    const cx = sx * 27;
    if (o.blink) { ctx.beginPath(); ctx.moveTo(cx - 11, -127); ctx.lineTo(cx + 11, -127); strokeInk(); }
    else {
      ctx.beginPath(); ctx.arc(cx + ex, -125, 6.5, 0, TAU); ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx - 13, -130); ctx.lineTo(cx + 13, -130); strokeInk(LWu * 0.9);          // heavy lid
    }
  }
  ctx.beginPath(); ctx.moveTo(-3, -116); ctx.quadraticCurveTo(10, -98, -5, -94); strokeInk(LWu * 0.85);
  if (o.talk) { ctx.beginPath(); ctx.ellipse(0, -71, 11, 7, 0, 0, TAU); ctx.fillStyle = '#5a2c28'; ctx.fill(); strokeInk(LWu * 0.85); }
  else { ctx.beginPath(); ctx.moveTo(-15, -71); ctx.lineTo(15, -71); strokeInk(); }
  // table (in front of torso)
  ctx.beginPath(); ctx.rect(-2000, 150, 4000, 400); ctx.fillStyle = o.table || WOOD; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2000, 150); ctx.lineTo(2000, 150); strokeInk();
  // arms: elbows planted on the table, hands folded in front
  for (const sx of [-1, 1]) limb([sx * 150, 52], [sx * 168, 196], [sx * 50, 214], 64, 54, HOODIE);
  hand(26, 218, Math.PI - 0.25, 64, E_SKIN, { side: -1 });
  hand(-26, 214, 0.25, 64, E_SKIN, { side: 1 });
  ctx.restore(); LWu = 4.4;
}

// Boss (VP of Strategy): standing, front view, silver bob, rectangular glasses, shoulder pads.
// o.armL / o.armR: 'hip' | 'down' | [x,y] hand target (local units). o.face: head-turn offset, o.eye: pupil offset
function boss(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(o.s, o.s); LWu = 4.4 / o.s;
  const fd = o.face || 0, ex = o.eye || 0;
  // hair (back of bob)
  ctx.beginPath(); ctx.moveTo(-90, -118); ctx.bezierCurveTo(-100, -238, 100, -238, 90, -118); ctx.lineTo(94, -70); ctx.quadraticCurveTo(80, -56, 58, -64);
  ctx.lineTo(-58, -64); ctx.quadraticCurveTo(-80, -56, -94, -70); ctx.closePath(); fillInk(B_HAIR);
  // torso (blazer with shoulder pads)
  ctx.beginPath(); ctx.moveTo(-40, -8); ctx.quadraticCurveTo(-124, -2, -162, 28); ctx.quadraticCurveTo(-180, 48, -176, 110);
  ctx.lineTo(-166, 330); ctx.lineTo(166, 330); ctx.lineTo(176, 110); ctx.quadraticCurveTo(180, 48, 162, 28); ctx.quadraticCurveTo(124, -2, 40, -8); ctx.closePath(); fillInk(BLAZER);
  ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(0, 112); ctx.lineTo(40, -8); ctx.closePath(); fillInk(BLOUSE);
  // lapels
  ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(-74, 52); ctx.lineTo(-44, 60); ctx.lineTo(0, 118); ctx.moveTo(40, -8); ctx.lineTo(74, 52); ctx.lineTo(44, 60); ctx.lineTo(0, 118); strokeInk();
  ctx.beginPath(); ctx.moveTo(0, 118); ctx.lineTo(0, 330); strokeInk(LWu * 0.8);
  for (const by of [170, 232]) { ctx.beginPath(); ctx.arc(-12, by, 6, 0, TAU); ctx.fillStyle = INK; ctx.fill(); }
  // neck
  ctx.beginPath(); ctx.rect(-21, -64, 42, 62); ctx.fillStyle = B_SKIN; ctx.fill();
  ctx.beginPath(); ctx.moveTo(-21, -64); ctx.lineTo(-21, -6); ctx.moveTo(21, -64); ctx.lineTo(21, -6); strokeInk();
  ctx.beginPath(); ctx.moveTo(-21, -8); ctx.lineTo(0, 30); ctx.lineTo(21, -8); ctx.fillStyle = B_SKIN; ctx.fill(); strokeInk(LWu * 0.8);
  // head
  ctx.beginPath(); ctx.moveTo(-66, -130); ctx.bezierCurveTo(-68, -226, 66, -226, 66, -130); ctx.bezierCurveTo(66, -74, 40, -44, 0, -44); ctx.bezierCurveTo(-40, -44, -66, -74, -66, -130); ctx.closePath(); fillInk(B_SKIN);
  // bangs: dead-straight fringe (a severe, well-maintained bob)
  ctx.beginPath(); ctx.moveTo(-74, -104); ctx.bezierCurveTo(-90, -226, 90, -226, 74, -104); ctx.lineTo(68, -104); ctx.lineTo(64, -160); ctx.lineTo(-64, -160); ctx.lineTo(-68, -104); ctx.closePath(); fillInk(B_HAIR);
  ctx.beginPath(); ctx.moveTo(-30, -205); ctx.quadraticCurveTo(-40, -185, -40, -162); ctx.moveTo(26, -206); ctx.quadraticCurveTo(38, -186, 38, -162); strokeInk(LWu * 0.6);
  // brows + glasses + eyes
  ctx.beginPath(); ctx.moveTo(fd - 48, -146); ctx.lineTo(fd - 14, -147); ctx.moveTo(fd + 14, -147); ctx.lineTo(fd + 48, -146); strokeInk(LWu * 1.1);
  for (const sx of [-1, 1]) {
    const cx = fd + sx * 30;
    ctx.beginPath(); ctx.roundRect(cx - 22, -140, 44, 28, 6); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill(); strokeInk(LWu * 0.85);
    if (o.blink) { ctx.beginPath(); ctx.moveTo(cx - 9, -125); ctx.lineTo(cx + 9, -125); strokeInk(LWu * 0.8); }
    else {
      ctx.beginPath(); ctx.arc(cx + ex, -124, 5.5, 0, TAU); ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx - 12, -129); ctx.lineTo(cx + 12, -129); strokeInk(LWu * 0.7);
    }
  }
  ctx.beginPath(); ctx.moveTo(fd - 8, -127); ctx.lineTo(fd + 8, -127); ctx.moveTo(fd - 52, -128); ctx.lineTo(-64, -132); ctx.moveTo(fd + 52, -128); ctx.lineTo(64, -132); strokeInk(LWu * 0.8);
  ctx.beginPath(); ctx.moveTo(fd - 2, -108); ctx.quadraticCurveTo(fd + 8, -96, fd - 4, -93); strokeInk(LWu * 0.8);
  if (o.talk) { ctx.beginPath(); ctx.ellipse(fd, -72, 10, 6.5, 0, 0, TAU); ctx.fillStyle = '#6b2d2a'; ctx.fill(); strokeInk(LWu * 0.8); }
  else { ctx.beginPath(); ctx.moveTo(fd - 15, -70); ctx.quadraticCurveTo(fd, -73, fd + 15, -70); strokeInk(); }
  // arms
  const arm = (sx, pose) => {
    const S = [sx * 146, 44];
    let E, Wr, fa;
    if (pose === 'hip') { E = [sx * 200, 160]; Wr = [sx * 150, 250]; fa = Math.atan2(Wr[1] - E[1], Wr[0] - E[0]); }
    else if (pose === 'down') { E = [sx * 170, 168]; Wr = [sx * 168, 272]; fa = Math.PI / 2; }
    else if (pose.tip) {             // aim a held marker's tip at a point: solve, back off along the forearm, solve again
      let g = pose.tip, r;
      for (let k = 0; k < 3; k++) { r = ik(S, g, 128, 118, sx < 0 ? -1 : 1); g = [pose.tip[0] - Math.cos(r.fa) * 74, pose.tip[1] - Math.sin(r.fa) * 74]; }
      E = r.E; Wr = r.W; fa = r.fa;
      const d = pose.down || 0;        // blend towards the relaxed, hanging arm
      if (d > 0) { E = [lerp(E[0], sx * 170, d), lerp(E[1], 168, d)]; Wr = [lerp(Wr[0], sx * 168, d), lerp(Wr[1], 272, d)]; fa = lerp(fa, Math.PI / 2 + (fa < -Math.PI / 2 ? -TAU : 0), d); }
    }
    else { const r = ik(S, pose, 128, 118, sx < 0 ? -1 : 1); E = r.E; Wr = r.W; fa = r.fa; }
    limb(S, E, Wr, 54, 46, BLAZER);
    // cuff
    const c = Math.cos(fa), s = Math.sin(fa);
    ctx.beginPath(); ctx.moveTo(Wr[0] - s * 24 - c * 4, Wr[1] + c * 24 - s * 4); ctx.lineTo(Wr[0] + s * 24 - c * 4, Wr[1] - c * 24 - s * 4); strokeInk(LWu * 0.7);
    const H0 = [Wr[0] + c * 22, Wr[1] + s * 22];
    if (pose === 'hip') hand(H0[0], H0[1], fa + sx * 0.5, 58, B_SKIN, { fist: true, side: sx });
    else if (o.pointer && sx === o.pointer.side) {
      // grips a telescopic pointer
      const pa = o.pointer.ang, L = o.pointer.len;
      ctx.beginPath(); ctx.moveTo(H0[0], H0[1]); ctx.lineTo(H0[0] + Math.cos(pa) * L, H0[1] + Math.sin(pa) * L); strokeInk(LWu * 1.4);
      ctx.beginPath(); ctx.moveTo(H0[0], H0[1]); ctx.lineTo(H0[0] + Math.cos(pa) * L * 0.4, H0[1] + Math.sin(pa) * L * 0.4); strokeInk(LWu * 2.2);
      ctx.beginPath(); ctx.arc(H0[0] + Math.cos(pa) * L, H0[1] + Math.sin(pa) * L, 6, 0, TAU); ctx.fillStyle = RED; ctx.fill(); strokeInk(LWu * 0.6);
      hand(H0[0], H0[1], fa, 58, B_SKIN, { fist: true, side: -sx });
    } else if (o.marker && sx === o.marker) {
      const mx = H0[0] + c * 56, my = H0[1] + s * 56;
      hand(H0[0], H0[1], fa, 58, B_SKIN, { fist: true, side: -sx });
      ctx.beginPath(); ctx.moveTo(H0[0] - c * 4, H0[1] - s * 4); ctx.lineTo(mx, my); ctx.lineWidth = 15 + 2 * LWu; ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke(); ctx.lineWidth = 15; ctx.strokeStyle = '#ece9e0'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(H0[0] - c * 4, H0[1] - s * 4); ctx.lineTo(H0[0] + c * 16, H0[1] + s * 16); ctx.lineWidth = 15; ctx.strokeStyle = RED; ctx.lineCap = 'butt'; ctx.stroke();
      ctx.beginPath(); ctx.arc(mx, my, 5, 0, TAU); ctx.fillStyle = RED; ctx.fill();
    } else hand(H0[0], H0[1], fa, 58, B_SKIN, { side: -sx });
  };
  arm(-1, o.armL || 'down'); arm(1, o.armR || 'hip');
  ctx.restore(); LWu = 4.4;
}

// ── props ──
function whiteboard(x, y, w, h) {
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fillStyle = FRAME; ctx.fill(); strokeInk();
  ctx.beginPath(); ctx.rect(x + 12, y + 12, w - 24, h - 24); ctx.fillStyle = BOARD; ctx.fill(); strokeInk(3);
  ctx.beginPath(); ctx.rect(x + 20, y + h, w - 40, 14); ctx.fillStyle = FRAME; ctx.fill(); strokeInk(3);
  ctx.save(); ctx.globalAlpha = 0.07; ctx.fillStyle = '#7890a0'; ctx.beginPath(); ctx.moveTo(x + w * 0.55, y + 12); ctx.lineTo(x + w * 0.75, y + 12); ctx.lineTo(x + w * 0.35, y + h - 12); ctx.lineTo(x + w * 0.15, y + h - 12); ctx.fill(); ctx.restore();
  for (const [mx, col] of [[x + 40, MARKER], [x + 74, RED]]) { ctx.beginPath(); ctx.roundRect(mx, y + h - 2, 28, 10, 4); ctx.fillStyle = col; ctx.fill(); strokeInk(2); }
}
// "1 + 1 = 3" written in marker; strike ∈ [0,1] crosses out "+ 1"; returns glyph extents
function equation(x, y, size, strike = 0, reveal = 1) {
  ctx.font = `700 ${size}px ${HAND}`; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const parts = ['1', ' + 1', ' = 3']; const ws = parts.map(p => ctx.measureText(p).width);
  ctx.save();
  if (reveal < 1) { ctx.beginPath(); ctx.rect(x - 10, y - size, (ws[0] + ws[1] + ws[2] + 20) * reveal, size * 1.4); ctx.clip(); }
  ctx.fillStyle = MARKER; ctx.fillText(parts.join(''), x, y);
  ctx.restore();
  const s0 = x + ws[0] + ctx.measureText(' ').width - 8, s1 = x + ws[0] + ws[1] + 8;
  if (strike > 0) {
    ctx.save(); ctx.strokeStyle = RED; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const ym = y - size * 0.3, k = clamp(strike * 2), k2 = clamp(strike * 2 - 1);
    ctx.beginPath(); ctx.moveTo(s0, ym + 4); ctx.lineTo(lerp(s0, s1, k), ym - 2 * k + 4);
    if (k2 > 0) ctx.lineTo(lerp(s1, s0 + 6, k2), ym + 10 - 2 * k2);
    ctx.stroke(); ctx.restore();
  }
  return { s0, s1, w: ws[0] + ws[1] + ws[2] };
}
function wallClock(x, y, r, t) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = '#fbfaf5'; ctx.fill(); strokeInk(5);
  for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r * 0.78, y + Math.sin(a) * r * 0.78); ctx.lineTo(x + Math.cos(a) * r * 0.9, y + Math.sin(a) * r * 0.9); strokeInk(2.5); }

// ── balloons ──
function balloon(cx, top, lines, tail, pop, fsz = 33) {

}
const popAt = (t, t0) => seg(t, t0, t0 + 0.22);
const talking = (t, t0, d) => t > t0 && t < t0 + d && Math.floor(t * 8) % 2 === 0;

// ── panels (local coords 0..PW × 0..PH) ────────────────────────────────────────────────
const EQ = { x: 50, y: 432, size: 64 };
function panel1(t) {

  ctx.fillText('SYNERGY', 50, 332);

  ctx.strokeStyle = RED; ctx.beginPath(); ctx.moveTo(240, 348); ctx.lineTo(256, 338); ctx.lineTo(268, 344); ctx.lineTo(290, 306); ctx.stroke();

function panel2(t) {

function panel3(t) {

// strip two: "Friday"
function panel4(t, w) {

  chairBack(110 + 5 * 118, 440, 0.62);
  engineer({ x: 110 + 5 * 118, y: 396, s: 0.5, table: WOOD, eye: 5 * eInOut(seg(t, 8.55, 8.75)), blink: t > 9.2 && t < 9.3 });
  ctx.fillStyle = WOOD_D; ctx.fillRect(0, 590, w, 34); ctx.beginPath(); ctx.moveTo(0, 590); ctx.lineTo(w, 590); ctx.moveTo(0, 624); ctx.lineTo(w, 624); strokeInk(3);
  // caption box

}
function panel5(t) {
  ctx.fillStyle = SAGE; ctx.fillRect(0, 0, PW, PH);
  // door frame
  ctx.beginPath(); ctx.rect(300, 180, 230, 540); fillInk('#b8a283'); ctx.beginPath(); ctx.rect(318, 198, 194, 540); ctx.fillStyle = '#e9e2cf'; ctx.fill(); strokeInk(3);
  ctx.beginPath(); ctx.rect(0, 610, 300, PH - 610); ctx.fillStyle = '#c5cdb8'; ctx.fill(); ctx.beginPath(); ctx.moveTo(0, 610); ctx.lineTo(300, 610); strokeInk(3);

// ── page / strip framing ──
let GRAIN, BG;
function buildTextures() {
  const r = rng(42);
  GRAIN = mk(CW, CH); const g = GRAIN.getContext('2d'); const id = g.createImageData(CW, CH);
  for (let i = 0; i < CW * CH; i++) { const v = 236 + r() * 19; id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v - 3; id.data[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
  g.globalAlpha = 0.05; g.strokeStyle = '#6d6250'; g.lineWidth = 1;
  for (let i = 0; i < 900; i++) { const x = r() * CW, y = r() * CH, a = r() * TAU, l = 4 + r() * 14; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  BG = mk(W, H); const b = BG.getContext('2d');
  b.fillStyle = DESK; b.fillRect(0, 0, W, H);
  const bd = b.getImageData(0, 0, W, H);
  for (let i = 0; i < W * H; i++) { const n = (r() - 0.5) * 10; bd.data[i * 4] += n; bd.data[i * 4 + 1] += n; bd.data[i * 4 + 2] += n; }
  b.putImageData(bd, 0, 0);
  const vg = b.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1200); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.28)'); b.fillStyle = vg; b.fillRect(0, 0, W, H);
}
function card(title, day) {
  ctx.save(); ctx.shadowColor = 'rgba(20,24,28,0.35)'; ctx.shadowBlur = 34; ctx.shadowOffsetY = 12;
  ctx.fillStyle = PAPER; ctx.fillRect(CX, CY, CW, CH); ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(GRAIN, CX, CY); ctx.restore();
  ctx.font = `700 54px ${LETTER}`; ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(title, PX0, 186);
  const tw = ctx.measureText(title).width;
  ctx.beginPath(); ctx.roundRect(PX0 + tw + 22, 146, 36, 36, 4); ctx.fillStyle = BLAZER; ctx.fill(); strokeInk(3);
  ctx.beginPath(); ctx.moveTo(PX0 + tw + 28, 172); ctx.lineTo(PX0 + tw + 34, 164); ctx.lineTo(PX0 + tw + 42, 168); ctx.lineTo(PX0 + tw + 52, 154); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
  ctx.font = `400 28px ${LETTER}`; ctx.textAlign = 'right'; ctx.fillStyle = '#4a4a4f';
  ctx.fillText(day + '   ·   by H. Whitcombe', CX + CW - 30, 184);
}
function framePanel(x, w, t, t0, fn) {
  const u = seg(t, t0, t0 + 0.3);
  if (u < 1) { ctx.save(); ctx.globalAlpha = 1 - clamp(u * 3); ctx.fillStyle = 'rgba(120,110,90,0.07)'; ctx.fillRect(x, PY, w, PH);
    ctx.setLineDash([14, 12]); ctx.beginPath(); ctx.rect(x, PY, w, PH); ctx.strokeStyle = 'rgba(60,55,50,0.28)'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
  if (u <= 0) return;
  const sc = 0.93 + 0.07 * backOut(u);
  ctx.save(); ctx.translate(x + w / 2, PY + PH / 2); ctx.scale(sc, sc); ctx.translate(-w / 2, -PH / 2);
  ctx.globalAlpha = clamp(u * 3);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, w, PH); ctx.clip(); fn(t, w); ctx.restore();
  ctx.beginPath(); ctx.rect(0, 0, w, PH); strokeInk(5);
  ctx.restore();
}
function strip1(t) {
  card('OPEN PLAN', 'MONDAY');
  framePanel(PX(0), PW, t, T.p[0], panel1);
  framePanel(PX(1), PW, t, T.p[1], panel2);
  framePanel(PX(2), PW, t, T.p[2], panel3);
}
function strip2(t) {
  card('OPEN PLAN', 'FRIDAY');
  framePanel(PX(0), PW * 2 + GUT, t, T.s2p[0], panel4);
  framePanel(PX(2), PW, t, T.s2p[1], panel5);
}

window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(BG, 0, 0);
  const cu = eOut(seg(t, T.card[0], T.card[1]));
  // Friday's strip follows Monday's like the next strip on a page: one continuous, eased push
  const sl = eInOut(seg(t, T.slide1[0], T.slide1[1])), GAPX = 1900;
  const ant = 22 * Math.sin(Math.PI * seg(t, T.slide1[0] - 0.18, T.slide1[0] + 0.05));   // small anticipation to the right
  const over = 16 * Math.sin(Math.PI * seg(t, T.slide1[1] - 0.1, T.slide1[1] + 0.25));  // soft overshoot on landing
  const dx = -sl * GAPX + ant - over;
  if (sl < 1) { ctx.save(); ctx.translate(dx, (1 - cu) * 60); strip1(t); ctx.restore(); }
  if (sl > 0) { ctx.save(); ctx.translate(dx + GAPX, 0); strip2(t); ctx.restore(); }
  const fade = Math.max(1 - seg(t, 0, 0.3), eInOut(seg(t, T.fade[0], T.fade[1])));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#1f2326'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.events = () => {
  const ev = [{ k: 'slide', t: 0.0, d: 0.5, v: 0.6 }];
  T.p.forEach(p => ev.push({ k: 'panel', t: p }));
  for (const b of [T.bA, T.bB, T.bC, T.bD, T.bE]) ev.push({ k: 'pop', t: b });
  // pointer taps: bottoms of |sin| in panel 1
  for (let k = 1; k * (1 / 2.2) < 2.0; k++) ev.push({ k: 'tap', t: 0.7 + k / 2.2 });
  for (let s = 3; s <= 7; s++) ev.push({ k: 'tick', t: s });
  ev.push({ k: 'marker', t: T.strike[0], d: T.strike[1] - T.strike[0] });
  ev.push({ k: 'slide', t: T.slide1[0], d: 0.8, v: 1 }, { k: 'panel', t: T.slide1[1] - 0.02 });
  ev.push({ k: 'chord', t: T.fade[0] - 0.1 });
  return ev;
};
window.ready = (async () => {
  await document.fonts.load(`700 33px ${LETTER}`); await document.fonts.load(`400 28px ${LETTER}`); await document.fonts.load(`700 40px ${HAND}`);
  await document.fonts.ready; buildTextures();
})();
