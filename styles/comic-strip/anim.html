<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── comic-strip · classic four-panel daily strip, black ink on newsprint ─────────────────────
// "Potted Wisdom": a philosophical houseplant (Basil) and its owner. The title banner is inked in,
// panels are ruled one by one, balloons pop in hand-lettered caps, characters blink / shrug / turn
// (animated "on twos"). Panel 3 is the silent beat (a to-do list unrolls out of the frame), then the
// camera pushes in on the punchline panel, holds, pulls back and the strip slides off the page.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const backOut = u => { const c = 1.9; return u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const STEP = 15, stp = t => Math.floor(t * STEP + 1e-4) / STEP;       // character animation on twos
const f1 = v => v.toFixed(1);

const INK = '#171411', PAPER = '#efe8d7', PAPER_HI = '#f4eee0';
const LETTER = '"Patrick Hand SC"', TITLE = '"Caveat Brush"', SIGN = '"Caveat"';
// strip layout (world px)
const SX = 50, PW = 440, PH = 480, GUT = 20, PY = 300;
const PX = i => SX + i * (PW + GUT);

// ── timeline ──
const T = {
  title: [0.15, 0.75], byline: 0.6,
  p: [0.70, 2.70, 4.80, 6.55],                                      // panel border start times
  b: { a1: 1.15, b1: 1.80, a2: 3.00, b2: 3.62, b4: 7.55 },           // balloon pop times
  push: [6.55, 7.35], pull: [8.65, 9.15], slide: [8.8, 9.4], end: [9.2, 9.65],
};

// ── ink primitives ──────────────────────────────────────────────────────────────────────
function hashS(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296 * 100; }
function parse(d) {
  const tk = d.match(/[MLCQZ]|-?\d*\.?\d+/g), subs = []; let cur = null, i = 0, cmd = 'M', x = 0, y = 0, sx = 0, sy = 0;
  const num = () => +tk[i++];
  while (i < tk.length) {
    if (/[MLCQZ]/.test(tk[i])) cmd = tk[i++];
    if (cmd === 'M') { x = num(); y = num(); sx = x; sy = y; cur = { pts: [[x, y]], closed: false }; subs.push(cur); cmd = 'L'; }
    else if (cmd === 'L') { const nx = num(), ny = num(), n = Math.max(1, Math.ceil(Math.hypot(nx - x, ny - y) / 10)); for (let k = 1; k <= n; k++) cur.pts.push([lerp(x, nx, k / n), lerp(y, ny, k / n)]); x = nx; y = ny; }
    else if (cmd === 'C') { const a = num(), b = num(), c = num(), e = num(), g = num(), h = num(); const n = 18;
      for (let k = 1; k <= n; k++) { const u = k / n, v = 1 - u; cur.pts.push([v * v * v * x + 3 * v * v * u * a + 3 * v * u * u * c + u * u * u * g, v * v * v * y + 3 * v * v * u * b + 3 * v * u * u * e + u * u * u * h]); } x = g; y = h; }
    else if (cmd === 'Q') { const a = num(), b = num(), g = num(), h = num(); const n = 14;
      for (let k = 1; k <= n; k++) { const u = k / n, v = 1 - u; cur.pts.push([v * v * x + 2 * v * u * a + u * u * g, v * v * y + 2 * v * u * b + u * u * h]); } x = g; y = h; }
    else if (cmd === 'Z') { cur.closed = true; x = sx; y = sy; cmd = 'M'; if (i < tk.length && !/[MLCQZ]/.test(tk[i])) cmd = 'L'; }
  }
  return subs;
}
// variable-width brush stroke along a polyline (pressure wobble + tapered ends)
function inkPts(P, w, o = {}) {
  const n = P.length; if (n < 2) return;
  const closed = !!o.closed, taper = o.taper ?? !closed, sd = o.seed ?? 0, upto = o.upto ?? 1;
  const L = [0]; for (let i = 1; i < n; i++) L[i] = L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]);
  const tot = L[n - 1] || 1, lim = tot * upto; const A = [], B = [];
  for (let i = 0; i < n; i++) {
    if (L[i] > lim && i > 0) break;
    const p0 = P[i > 0 ? i - 1 : (closed ? n - 2 : 0)], p1 = P[i < n - 1 ? i + 1 : (closed ? 1 : n - 1)];
    let tx = p1[0] - p0[0], ty = p1[1] - p0[1]; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
    const u = L[i] / tot;
    let wf = 0.86 + 0.14 * Math.sin(u * 6.3 + sd) + 0.08 * Math.sin(u * 15.7 + sd * 1.7);
    if (taper) wf *= Math.pow(clamp(Math.min(u / (o.t0 ?? .2), (1 - u) / (o.t1 ?? .25)), 0.1, 1), 0.65);
    const hw = w * wf / 2; A.push([P[i][0] - ty * hw, P[i][1] + tx * hw]); B.push([P[i][0] + ty * hw, P[i][1] - tx * hw]);
  }
  if (A.length < 2) return;
  ctx.beginPath();
  if (closed && upto >= 1) {
    ctx.moveTo(A[0][0], A[0][1]); for (const p of A) ctx.lineTo(p[0], p[1]); ctx.closePath();
    ctx.moveTo(B[0][0], B[0][1]); for (const p of B) ctx.lineTo(p[0], p[1]); ctx.closePath();
    ctx.fillStyle = o.color || INK; ctx.fill('evenodd'); return;
  }

  for (let i = B.length - 1; i >= 0; i--) ctx.lineTo(B[i][0], B[i][1]); ctx.closePath();
  ctx.fillStyle = o.color || INK; ctx.fill();
  if (!taper) { for (const k of [0, A.length - 1]) { const j = Math.min(k, n - 1); ctx.beginPath(); ctx.arc(P[j][0], P[j][1], Math.hypot(A[k][0] - B[k][0], A[k][1] - B[k][1]) / 2, 0, TAU); ctx.fill(); } }
}
function ink(d, w, o = {}) { const sd = o.seed ?? hashS(d); for (const s of parse(d)) inkPts(s.pts, w, { ...o, closed: o.closed ?? s.closed, seed: sd }); }
function fillD(d, c = PAPER) { ctx.fillStyle = c; ctx.fill(new Path2D(d)); }
function shape(d, w = 4.5, c = PAPER) { fillD(d, c); ink(d, w); }
function ell(cx, cy, rx, ry) { const k = 0.5523;
  return `M ${f1(cx + rx)} ${f1(cy)} C ${f1(cx + rx)} ${f1(cy + ry * k)} ${f1(cx + rx * k)} ${f1(cy + ry)} ${f1(cx)} ${f1(cy + ry)} C ${f1(cx - rx * k)} ${f1(cy + ry)} ${f1(cx - rx)} ${f1(cy + ry * k)} ${f1(cx - rx)} ${f1(cy)} C ${f1(cx - rx)} ${f1(cy - ry * k)} ${f1(cx - rx * k)} ${f1(cy - ry)} ${f1(cx)} ${f1(cy - ry)} C ${f1(cx + rx * k)} ${f1(cy - ry)} ${f1(cx + rx)} ${f1(cy - ry * k)} ${f1(cx + rx)} ${f1(cy)} Z`; }
function dot(x, y, rx, ry = rx, c = INK) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fillStyle = c; ctx.fill(); }
function tube(d, w, lw = 4.5) { const p = new Path2D(d); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = w + lw * 2; ctx.stroke(p); ctx.strokeStyle = PAPER; ctx.lineWidth = w; ctx.stroke(p); }

// ── textures (built once) ─────────────────────────────────────────────────────────────────
const PM = 300; let PAGE, GRAIN, SPECK, TONE, TONE_C;
function buildTextures() {
  const r = rng(58);
  // newsprint page with greeked neighbouring columns
  PAGE = mk(W + 2 * PM, H + 2 * PM); const g = PAGE.getContext('2d');
  g.fillStyle = PAPER; g.fillRect(0, 0, PAGE.width, PAGE.height); g.translate(PM, PM);
  for (let i = 0; i < 34; i++) { const x = r() * (W + 2 * PM) - PM, y = r() * (H + 2 * PM) - PM, rr = 150 + r() * 420; const gr = g.createRadialGradient(x, y, 0, x, y, rr);
    const dk = r() < .5; gr.addColorStop(0, dk ? 'rgba(170,150,110,0.06)' : 'rgba(255,252,240,0.07)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(x - rr, y - rr, rr * 2, rr * 2); }
  g.lineCap = 'round';
  for (let i = 0; i < 12000; i++) { const x = r() * (W + 2 * PM) - PM, y = r() * (H + 2 * PM) - PM, a = r() * TAU, l = 3 + r() * 14;
    g.strokeStyle = r() < .5 ? `rgba(120,100,70,${0.05 + r() * .07})` : `rgba(255,255,248,${0.08 + r() * .1})`; g.lineWidth = .6 + r() * .8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + r() * 3, y + Math.sin(a) * l * .5 + r() * 3, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  const cols = 5, cw = (1820 - 4 * 34) / 5;
  const greek = (y0, y1, head) => {
    for (let c = 0; c < cols; c++) {
      const x0 = SX + c * (cw + 34); let y = y0;
      if (head && c < 3) { // a greeked headline block across the first columns
        if (c === 0) { g.fillStyle = 'rgba(40,34,28,0.13)'; for (let k = 0; k < 2; k++) { let x = SX; while (x < SX + cw * 3 - 60) { const wd = 60 + r() * 150; g.fillRect(x, y + k * 34, Math.min(wd, SX + cw * 3 - x), 20); x += wd + 22; } } }
        y += 80; }
      while (y < y1) { let x = x0; const end = x0 + cw - (r() < .12 ? r() * 120 : 0);
        g.fillStyle = 'rgba(40,34,28,0.14)';
        while (x < end - 8) { const wd = Math.min(12 + r() * 58, end - x); g.fillRect(x, y, wd, 6.5); x += wd + 7; } y += 15; }
      if (c < cols - 1) { g.fillStyle = 'rgba(40,34,28,0.12)'; g.fillRect(x0 + cw + 16, y0, 1.2, y1 - y0); }
    }
  };
  greek(34, 214, true);
  g.fillStyle = 'rgba(40,34,28,0.35)'; g.fillRect(SX, 226, 1820, 2.2); g.fillRect(SX, 232, 1820, 0.9);
  g.fillRect(SX, 862, 1820, 0.9); g.fillRect(SX, 867, 1820, 2.2);
  greek(888, 1070, false);
  // vignette
  const vg = g.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(110,90,55,0.16)'); g.fillStyle = vg; g.fillRect(-PM, -PM, W + 2 * PM, H + 2 * PM);

  // screen-space fine grain (multiply)
  GRAIN = mk(W, H); const gg = GRAIN.getContext('2d'); const id = gg.createImageData(W, H), dd = id.data;
  for (let i = 0; i < dd.length; i += 4) { const v = 236 + r() * 19; dd[i] = v; dd[i + 1] = v - 1; dd[i + 2] = v - 4; dd[i + 3] = 255; }
  gg.putImageData(id, 0, 0);
  // ink dry-brush breakup specks (lighten)
  SPECK = mk(W, H); const sg = SPECK.getContext('2d'); sg.fillStyle = '#000'; sg.fillRect(0, 0, W, H);
  for (let i = 0; i < 26000; i++) { const x = r() * W, y = r() * H, s = 0.5 + r() * r() * 1.8; sg.fillStyle = `rgba(${226 + r() * 18 | 0},${218 + r() * 16 | 0},${198 + r() * 14 | 0},${0.35 + r() * .6})`; sg.beginPath(); sg.arc(x, y, s, 0, TAU); sg.fill(); }
  // zipatone dot tone
  TONE_C = mk(10, 10); const tg = TONE_C.getContext('2d'); tg.fillStyle = INK;
  tg.beginPath(); tg.arc(2.5, 2.5, 1.55, 0, TAU); tg.arc(7.5, 7.5, 1.55, 0, TAU); tg.fill();
  TONE = ctx.createPattern(TONE_C, 'repeat');
}
function tone(d) { ctx.fillStyle = TONE; if (typeof d === 'string') ctx.fill(new Path2D(d)); else { ctx.fillRect(...d); } }

// ── lettering + balloons ──────────────────────────────────────────────────────────────
const FS = 27, LH = 30;
function measureLine(line) { ctx.font = `${FS}px ${LETTER}`; return ctx.measureText(line.replace(/\*/g, '')).width; }
function drawLine(line, cx, y) {
  ctx.font = `${FS}px ${LETTER}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const words = line.split(' '), sp = ctx.measureText(' ').width; let x = cx - measureLine(line) / 2;
  for (const wd of words) { const b = wd.startsWith('*'), s = wd.replace(/\*/g, ''); ctx.fillStyle = INK; ctx.fillText(s, x, y);
    if (b) { ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); } x += ctx.measureText(s).width + sp; }
}
function balloon(cx, cy, lines, tip, u, o = {}) {
  if (u <= 0) return;
  const tw = Math.max(...lines.map(measureLine)), bw = tw / 2 + 30, bh = lines.length * LH / 2 + 20, e = 2.6;
  const s = backOut(clamp(u)) * 1, ang0 = Math.atan2((tip[1] - cy) / bh, (tip[0] - cx) / bw), dA = o.tailW ?? 0.16;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  const pt = a => { const c = Math.cos(a), sn = Math.sin(a); return [cx + bw * Math.sign(c) * Math.pow(Math.abs(c), 2 / e), cy + bh * Math.sign(sn) * Math.pow(Math.abs(sn), 2 / e)]; };
  const P = [], N = 140; let inT = false;
  for (let k = 0; k <= N; k++) {
    const a = ang0 + dA + (TAU - 2 * dA) * k / N; P.push(pt(a));
  }
  // tail: from end of arc (ang0 - dA) curving to tip then back to start (ang0 + dA)
  const b0 = pt(ang0 - dA), b1 = pt(ang0 + dA), mid = [(b0[0] + b1[0]) / 2, (b0[1] + b1[1]) / 2];
  const bend = o.bend ?? 0.25, nx = -(tip[1] - mid[1]) * bend, ny = (tip[0] - mid[0]) * bend;
  const ctl = [(mid[0] + tip[0]) / 2 + nx, (mid[1] + tip[1]) / 2 + ny];
  for (let k = 1; k <= 10; k++) { const v = k / 10, w = 1 - v; P.push([w * w * b0[0] + 2 * w * v * ctl[0] + v * v * tip[0], w * w * b0[1] + 2 * w * v * ctl[1] + v * v * tip[1]]); }
  for (let k = 1; k <= 10; k++) { const v = k / 10, w = 1 - v; P.push([w * w * tip[0] + 2 * w * v * ctl[0] + v * v * b1[0], w * w * tip[1] + 2 * w * v * ctl[1] + v * v * b1[1]]); }
  P.push(P[0]);
  ctx.beginPath(); ctx.moveTo(P[0][0], P[0][1]); for (const p of P) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fillStyle = PAPER_HI; ctx.fill();
  inkPts(P, 4, { closed: true, seed: cx * 0.13 });
  const ta = clamp((u - 0.25) / 0.35);
  ctx.globalAlpha = ta; lines.forEach((l, i) => drawLine(l, cx, cy + (i - (lines.length - 1) / 2) * LH + 1)); ctx.globalAlpha = 1;
  ctx.restore();
}

// ── characters ────────────────────────────────────────────────────────────────────────
// Owner: origin = bottom-centre of the torso; head centre at (0,-262).
function owner(o) {
  const f = o.f ?? 0, sg = f >= 0 ? 1 : -1;
  ctx.save(); ctx.translate(o.x, o.y); ctx.rotate(o.rot || 0); ctx.scale(o.s || 1, o.s || 1);
  ctx.translate(0, o.bob || 0);
  // torso (striped sweater)
  const torso = 'M -124 60 C -122 -60 -118 -140 -72 -168 C -44 -182 44 -182 72 -168 C 118 -140 122 -60 124 60 Z';
  fillD(torso);
  ctx.save(); ctx.clip(new Path2D(torso)); ctx.fillStyle = INK;
  ctx.fillRect(-140, -128, 280, 17); ctx.fillRect(-140, -88, 280, 17); ctx.fillRect(-140, -48, 280, 17); ctx.restore();
  ink(torso, 5, { closed: false, taper: true, t0: .08, t1: .08 });
  // neck + collar
  shape('M -17 -212 L -19 -172 C -8 -166 8 -166 19 -172 L 17 -212 Z', 4);
  ink('M -36 -176 C -20 -158 20 -158 36 -176', 5);
  // arms
  if (o.arms === 'list') {
    tube('M -86 -150 C -110 -112 -86 -104 -48 -118', 34); tube('M 86 -150 C 110 -112 86 -104 48 -118', 34);
  } else {
    tube('M -88 -150 C -114 -110 -104 -70 -76 -74 C -56 -78 -38 -100 -24 -116', 34);
    tube('M 88 -150 C 112 -110 108 -72 82 -76 C 66 -80 54 -96 44 -108', 34);
    // mug (spot black) + hands + steam
    shape('M -14 -150 L -12 -100 C -12 -92 32 -92 34 -100 L 36 -150 Z', 4, INK);
    ink('M 34 -140 C 56 -140 56 -106 32 -108', 6);
    ink('M -12 -149 C -2 -144 26 -144 35 -149', 2.2, { color: PAPER, taper: true });
    shape(ell(-18, -118, 15, 18), 4.5); ink('M -8 -128 C -3 -126 0 -122 1 -118', 2.6); ink('M -8 -114 C -3 -112 0 -108 1 -104', 2.6);
    shape(ell(44, -110, 14, 15), 4.5); ink('M 34 -104 C 38 -102 42 -100 46 -100', 2.4);
    const st = o.steam ?? 0;
    for (const [sx, ph] of [[4, 0], [20, 2.1]]) {
      const a = Math.sin(st * 5 + ph) * 5, b = Math.sin(st * 5 + ph + 1.7) * 5;
      ink(`M ${sx} -160 C ${f1(sx + 9 + a)} -172 ${f1(sx - 9 + b)} -186 ${f1(sx + a * .6)} -200 C ${f1(sx + 6 + b)} -210 ${f1(sx - 4)} -218 ${f1(sx + 2 + a * .4)} -226`, 3.2, { t0: .3, t1: .4 });
    }
  }
  // head
  ctx.save(); ctx.translate(0, 9); ctx.translate(0, -262); ctx.rotate(o.tilt || 0); ctx.translate(0, 262);
  const ear = xe => { shape(`M ${xe} -276 C ${xe + 14 * Math.sign(xe)} -284 ${xe + 16 * Math.sign(xe)} -250 ${xe} -250`, 4.5); ink(`M ${xe + 4 * Math.sign(xe)} -268 C ${xe + 9 * Math.sign(xe)} -266 ${xe + 8 * Math.sign(xe)} -258 ${xe + 3 * Math.sign(xe)} -257`, 2.4); };
  if (Math.abs(f) < 0.25) { ear(-55); ear(55); } else ear(-55 * sg);
  shape(ell(0, -262, 58, 66), 5);
  // hair (spot black), shifted to the back of the head
  ctx.save(); ctx.translate(-f * 7, 0);
  fillD('M -60 -258 C -68 -300 -52 -340 -10 -344 C 22 -354 60 -338 63 -300 C 65 -286 61 -272 58 -262 C 51 -282 45 -292 34 -300 C 36 -290 31 -284 24 -281 C 16 -300 4 -305 -8 -302 C -4 -294 -8 -287 -15 -285 C -27 -300 -42 -293 -51 -279 C -55 -273 -57 -266 -60 -258 Z', INK);
  ink('M -6 -342 C -8 -358 2 -368 14 -372', 5); ink('M 10 -346 C 14 -360 26 -364 36 -362', 4.5);
  ctx.restore();
  const fx = f * 24, sp = 17 * (1 - 0.28 * Math.abs(f)), ey = -262 + (o.down ? 6 : 0);
  for (const k of [-1, 1]) {
    const ex = fx + k * sp;
    if (o.closed) ink(`M ${f1(ex - 9)} ${ey + 1} C ${f1(ex - 4)} ${ey - 6} ${f1(ex + 4)} ${ey - 6} ${f1(ex + 9)} ${ey + 1}`, 3.4);
    else if (o.blink) ink(`M ${f1(ex - 7)} ${ey} L ${f1(ex + 7)} ${ey}`, 3.4, { taper: false });
    else dot(ex, ey, 4.6, o.down ? 5 : 7.5);
    // brows: raise = skeptical (one side higher), worry = inner ends up
    const br = o.brow || 0, wr = o.worry || 0, by = -286 - br * (k === sg ? 10 : 3);
    ink(`M ${f1(ex - 9)} ${f1(by + wr * k * -4 * sg)} L ${f1(ex + 9)} ${f1(by - 2 + wr * k * 4 * sg)}`, 3.6, { taper: true });
  }
  const nx = fx + f * 14;
  ink(`M ${f1(nx - 2 * sg)} -258 C ${f1(nx + 12 * sg)} -248 ${f1(nx + 12 * sg)} -236 ${f1(nx - 2 * sg)} -234`, 4);
  const mx = fx + f * 4, my = -222;
  if (o.mouth === 'talk') shape(`M ${f1(mx - 10)} ${my - 2} C ${f1(mx - 6)} ${my + 12} ${f1(mx + 6)} ${my + 12} ${f1(mx + 10)} ${my - 2} Z`, 3, INK);
  else if (o.mouth === 'flat') ink(`M ${f1(mx - 9)} ${my + 1} C ${f1(mx - 3)} ${my - 1} ${f1(mx + 3)} ${my + 1} ${f1(mx + 9)} ${my}`, 3.6);
  else if (o.mouth === 'wave') ink(`M ${f1(mx - 11)} ${my} C ${f1(mx - 6)} ${my - 4} ${f1(mx - 2)} ${my + 4} ${f1(mx + 2)} ${my} C ${f1(mx + 5)} ${my - 3} ${f1(mx + 8)} ${my + 2} ${f1(mx + 11)} ${my}`, 3.4);
  else ink(`M ${f1(mx - 12)} ${my - 2} C ${f1(mx - 5)} ${my + 7} ${f1(mx + 5)} ${my + 7} ${f1(mx + 12)} ${my - 3}`, 3.8);
  ctx.restore(); // head tilt
  ctx.restore();
}
// list held by the owner (drawn outside the panel clip so it can unroll out of the frame)
function todoList(o) {
  ctx.save(); ctx.translate(o.x, o.y); ctx.scale(o.s || 1, o.s || 1);
  const top = -124, bot = top + o.len, curl = 22;

// Basil the plant: origin = bottom-centre of the pot.
const STEMS = [[-16, -0.78, 96, 52, 22, 0], [-7, -0.34, 138, 60, 26, 1], [3, 0.06, 156, 62, 25, 0], [10, 0.44, 128, 58, 24, 0], [17, 0.86, 92, 50, 21, 1]];

const PANELS = [panel1, panel2, panel3, panel4];
const BALLOONS = [

function camera(t) {
