S('M 330 548 L 380 548', .35); S('M 392 548 L 448 548', .35); S('M 538 548 L 672 548', .35); S('M 770 548 L 1062 548', .35);
S('M 240 690 C 420 700 700 702 900 694', .45); S('M 120 630 L 200 628', .4);

// ── pen line: sample each path, wobble it, give it a dip-pen swell ──────────────────────────────
const sp = document.getElementById('sp');
function buildScene(sc, seed) {
  const r = rng(seed); let total = 0;
  for (const s of sc.strokes) {
    sp.setAttribute('d', s.d); const L = sp.getTotalLength(), n = Math.max(2, Math.ceil(L / 2.2));
    const ph1 = r() * TAU, ph2 = r() * TAU, f1 = .02 + r() * .02, f2 = .07 + r() * .05, pr = .8 + r() * .35, amp = .55 + r() * .5;
    const pts = [];
    for (let i = 0; i <= n; i++) { const q = sp.getPointAtLength(L * i / n); pts.push([s.xf.a * s.xf.s * q.x + s.xf.e, s.xf.s * q.y + s.xf.f]); }
    const Lf = [], Rt = [];
    for (let i = 0; i <= n; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n, i + 1)];
      let dx = b[0] - a[0], dy = b[1] - a[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
      const d = L * i / n, wob = amp * (Math.sin(d * f1 + ph1) * .65 + Math.sin(d * f2 + ph2) * .35);
      const taper = Math.pow(clamp(d / 7), .5) * Math.pow(clamp((L - d) / 16), .7);
      const hw = Math.max(.35, 1.28 * s.w * pr * (0.3 + 0.7 * taper) * (0.85 + 0.2 * Math.sin(d * .045 + ph2)));
      const cx = pts[i][0] - dy * wob, cy = pts[i][1] + dx * wob;
      Lf.push([cx - dy * hw, cy + dx * hw]); Rt.push([cx + dy * hw, cy - dx * hw]);
    }
    Object.assign(s, { L, n, Lf, Rt, full: poly(Lf, Rt, n) }); total += L + 60;
  }
  let acc = 0; for (const s of sc.strokes) { s.a = acc / total; acc += s.L + 60; s.b = (acc - 60) / total; }
  for (const w of [...sc.washes, ...sc.fills]) { const p = new Path2D(); p.addPath(new Path2D(w.d), new DOMMatrix([w.xf.a * w.xf.s, 0, 0, w.xf.s, w.xf.e, w.xf.f])); w.path = p; }
}
function poly(Lf, Rt, k) {
  const p = new Path2D(); p.moveTo(Lf[0][0], Lf[0][1]);
  for (let i = 1; i <= k; i++) p.lineTo(Lf[i][0], Lf[i][1]);

}

// ── animated groups (hierarchical rotations; pivots in panel coords) ─────────────────────────────
function rotAbout(x, y, a) { return new DOMMatrix().translate(x, y).rotate(a * 180 / Math.PI).translate(-x, -y); }
function groupsFor(sc, t) {
  const G = {};
  if (sc === SC1) {
    const u = backOut(seg(t, T.brow, T.brow + .3)) - eIO2(seg(t, T.brow + 1.1, T.brow + 1.4)) * .35;
    const [bx, by] = sc.bp; G.brow = new DOMMatrix().translate(bx, by).rotate(-7 * u).translate(0, -9 * u).translate(-bx, -by);
  } else {
    const u = backOut(seg(t, T.c2 + .5, T.c2 + .75)) * (1 - eIO2(seg(t, T.c2 + 1.3, T.c2 + 1.6)));
    const [bx, by] = sc.bp; G.brow2 = new DOMMatrix().translate(bx, by).rotate(6 * u).translate(0, -4.5 * u).translate(-bx, -by);
    // the sip: two-bone IK from the shoulder to the lips, wrist tilts the glass
    const pv = sc.piv, [Sx, Sy] = pv.S, [Ex, Ey] = pv.E, [Hx, Hy] = pv.H;   // shoulder, elbow, wrist (rest pose)
    const k = eIO2(seg(t, T.sip, T.sip + .42)) * (1 - eIO2(seg(t, T.sip + .78, T.sip + 1.12)));
    const Tx = lerp(Hx, pv.T[0], k), Ty = lerp(Hy, pv.T[1], k);
    const l1 = Math.hypot(Ex - Sx, Ey - Sy), l2 = Math.hypot(Hx - Ex, Hy - Ey);
    const dx = Tx - Sx, dy = Ty - Sy, d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1, l1 + l2 - 1);
    const base = Math.atan2(dy, dx), ang = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
    const e1 = base - ang;                                              // elbow falls behind/below
    const Enx = Sx + l1 * Math.cos(e1), Eny = Sy + l1 * Math.sin(e1);
    const A = e1 - Math.atan2(Ey - Sy, Ex - Sx);
    const B = Math.atan2(Ty - Eny, Tx - Enx) - Math.atan2(Hy - Ey, Hx - Ex) - A;
    const C = -(A + B) - .5 * k;
    G.uarm = rotAbout(Sx, Sy, A);
    G.farm = G.uarm.multiply(rotAbout(Ex, Ey, B));
    G.hand = G.farm.multiply(rotAbout(Hx, Hy, C));
  }
  return G;
}

// ── textures ────────────────────────────────────────────────────────────────────────────────
function noiseCanvas(w, h, seed, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const img = x.createImageData(w, h), r = rng(seed);
  // cheap value noise: a few octaves of bilinear lattices
  const oct = [[64, .5], [24, .3], [8, .2]].map(([s, a]) => { const gw = Math.ceil(w / s) + 2, gh = Math.ceil(h / s) + 2, g = new Float32Array(gw * gh); for (let i = 0; i < g.length; i++) g[i] = r(); return { s, a, gw, g }; });
  for (let y = 0; y < h; y++) for (let X = 0; X < w; X++) {
    let v = 0;
    for (const o of oct) { const fx = X / o.s, fy = y / o.s, ix = fx | 0, iy = fy | 0, ux = fx - ix, uy = fy - iy, g = o.g, gw = o.gw;
      const a = g[iy * gw + ix], b = g[iy * gw + ix + 1], c2 = g[(iy + 1) * gw + ix], d = g[(iy + 1) * gw + ix + 1];
      v += o.a * lerp(lerp(a, b, ux), lerp(c2, d, ux), uy); }
    const px = fn(v, r()), i = (y * w + X) * 4; img.data[i] = px[0]; img.data[i + 1] = px[1]; img.data[i + 2] = px[2]; img.data[i + 3] = px[3];
  }
  x.putImageData(img, 0, 0); return c;
}
let washPat, inkPat, paperC;
function buildTextures() {
  washPat = ctx.createPattern(noiseCanvas(512, 512, 7, (v, g) => [WASH[0], WASH[1], WASH[2], 255 * clamp(.55 + (v - .5) * 1.1 + (g - .5) * .28)]), 'repeat');
  inkPat = ctx.createPattern(noiseCanvas(256, 256, 11, (v, g) => [23, 21, 19, 255 * clamp(.9 + (v - .5) * .3 + 0)]), 'repeat');
  paperC = noiseCanvas(W, H, 3, (v, g) => { const k = (v - .5) * 7 + (g - .5) * 5; return [245 + k, 240 + k, 228 + k * .9, 255]; });
  const x = paperC.getContext('2d'), r = rng(5);
  for (let i = 0; i < 900; i++) { x.strokeStyle = `rgba(120,100,80,${.03 + r() * .04})`; x.lineWidth = .6; x.beginPath(); const px = r() * W, py = r() * H, a = r() * TAU, l = 6 + r() * 16; x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .5 + r() * 4, py + Math.sin(a) * l * .5, px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); }
  const g = x.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250); g.addColorStop(0, 'rgba(90,70,40,0)'); g.addColorStop(1, 'rgba(90,70,40,.10)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
}

// ── the magazine page ───────────────────────────────────────────────────────────────────────
const pages = {};
function buildPage(num) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  x.drawImage(paperC, 0, 0);
  x.fillStyle = INK; x.textBaseline = 'alphabetic';
  x.font = `500 21px ${SERIF}`; x.letterSpacing = '5px';
  x.textAlign = 'left'; x.fillText('THE LAMPLIGHT REVIEW', 110, 40);
  x.textAlign = 'right'; x.fillText('OCTOBER 5, 2026', 1810, 40);
  x.letterSpacing = '0px'; x.fillStyle = 'rgba(23,21,19,.85)'; x.fillRect(110, 50, 1700, 1.4);
  x.font = `italic 24px ${SERIF}`; x.fillStyle = INK; x.textAlign = 'center'; x.fillText(String(num), 960, 1052);
  x.strokeStyle = 'rgba(23,21,19,.9)'; x.lineWidth = 1.6; x.strokeRect(PX + .5, PY + .5, PW, PH);
  // the gutter shadow along the spine
  const g = x.createLinearGradient(0, 0, 70, 0); g.addColorStop(0, 'rgba(60,45,25,.22)'); g.addColorStop(1, 'rgba(60,45,25,0)'); x.fillStyle = g; x.fillRect(0, 0, 70, H);
  return c;
}

// ── draw one cartoon at time t (page coords) ────────────────────────────────────────────────
function cartoon(c, sc, t, D, tw, tc, cap, sign) {
  const G = groupsFor(sc, t), base = new DOMMatrix().translate(PX, PY);
  const set = g => { const m = g && G[g] ? base.multiply(G[g]) : base; c.setTransform(m); };
  c.save(); c.beginPath(); c.rect(PX + 2, PY + 2, PW - 3, PH - 3); c.clip();
  const pu = seg(t, D[0], D[1]);
  // wash, blooming in region by region
  sc.washes.forEach((w, i) => {
    const u = seg(t, tw + w.delay + (i % 5) * .03, tw + w.delay + .38 + (i % 5) * .03); if (u <= 0) return;
    set(w.g); c.globalAlpha = w.tone * eOut(u); c.fillStyle = washPat; c.fill(w.path, w.rule);
    c.save(); c.clip(w.path, w.rule); c.globalAlpha = w.tone * eOut(u) * .35; c.strokeStyle = washPat; c.lineWidth = 5; c.stroke(w.path); c.restore();
  });
  // solid blacks, inked in once their outline is down
  sc.fills.forEach(f => { const u = seg(t, D[1] - .2, D[1] + .15); if (u <= 0) return; set(f.g); c.globalAlpha = eOut(u); c.fillStyle = f.col === INK ? inkPat : f.col; c.fill(f.path, f.rule); });
  c.globalAlpha = 1; c.fillStyle = INK;
  for (const s of sc.strokes) {
    if (pu <= s.a) continue;
    set(s.g);
    if (pu >= s.b) { c.fill(s.full); continue; }
    const u = (pu - s.a) / (s.b - s.a), k = Math.max(1, Math.floor(u * s.n));
    c.fill(poly(s.Lf, s.Rt, k));
  }
  c.setTransform(1, 0, 0, 1, 0, 0);
  // signature
  const su = seg(t, D[1] - .05, D[1] + .25);
  if (su > 0) { c.globalAlpha = su; c.font = `italic 26px ${SERIF}`; c.textAlign = 'right'; c.fillStyle = INK; c.fillText(sign, PX + PW - 26, PY + PH - 22); c.globalAlpha = 1; }
  c.restore();
  // caption, after the beat
  const cu = seg(t, tc, tc + .5);
  if (cu > 0) {
    c.globalAlpha = eOut(cu); c.font = `italic 52px ${SERIF}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = INK;
    c.fillText(cap, 960, PY + PH + 92 + 10 * (1 - eOut(cu))); c.globalAlpha = 1;
  }
}

// ── page turn: the page rotates on its spine (left edge), bending slightly, in perspective ─────
let pg1, tmp;
function pageTurn(u) {
  if (!pg1) { pg1 = document.createElement('canvas'); pg1.width = W; pg1.height = H; const x = pg1.getContext('2d'); x.drawImage(pages[47], 0, 0); cartoon(x, SC1, T.turn[0], T.d1, T.w1, T.c1, CAP1, 'Ashby');
    tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H; }
  const th = eInOut(u) * Math.PI * .5, F = 4200, N = 160, sw = W / N;
  let X = 0, Z = 0; const cols = [];
  for (let i = 0; i <= N; i++) {
    const s = F / (F + Z); cols.push({ sx: X * s, s, y0: 540 - 540 * s });
    const a = Math.min(Math.PI / 2 - .01, th + Math.sin(Math.PI * u) * .45 * Math.pow(i / N, 2));
    X += Math.cos(a) * sw; Z -= Math.sin(a) * sw;
  }
  const edge = cols[N].sx;
  // shadow cast on the next page
  const sh = Math.sin(Math.PI * Math.min(1, u * 1.1)) * (1 - seg(u, .85, 1));
  const g = ctx.createLinearGradient(Math.max(0, edge - 30), 0, edge + 300 * sh + 20, 0);
  g.addColorStop(0, `rgba(40,30,15,${.34 * sh})`); g.addColorStop(1, 'rgba(40,30,15,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (edge < 1) return;
  const x = tmp.getContext('2d'); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, W, H);
  for (let i = 0; i < N; i++) {                                         // each strip: an affine map onto its trapezoid
    const A = cols[i], B = cols[i + 1], w = B.sx - A.sx; if (w <= .02) continue;
    x.setTransform(w / sw, (B.y0 - A.y0) / sw, 0, A.s, A.sx - i * sw * (w / sw), A.y0 - i * sw * (B.y0 - A.y0) / sw);
    x.drawImage(pg1, i * sw, 0, sw + 1, H, i * sw, 0, sw + 1, H);
  }
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-atop';
  const sg = x.createLinearGradient(0, 0, edge, 0);
  for (let i = 0; i <= N; i += 4) {
    const A = cols[Math.max(0, i - 1)], B = cols[Math.min(N, i + 1)], face = ((B.sx - A.sx) / (2 * sw)) / cols[i].s;
    const gloss = Math.exp(-Math.pow((face - .55) / .12, 2)) * .10;
    sg.addColorStop(clamp(cols[i].sx / edge), `rgba(${gloss > .02 ? '255,250,235' : '30,22,12'},${gloss > .02 ? gloss : clamp((1 - face) * .5)})`);
  }
  x.fillStyle = sg; x.fillRect(0, 0, W, H);
  ctx.drawImage(tmp, 0, 0);
}

// ── frame ───────────────────────────────────────────────────────────────────────────────────
window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t < T.turn[0]) { ctx.drawImage(pages[47], 0, 0); cartoon(ctx, SC1, t, T.d1, T.w1, T.c1, CAP1, 'Ashby'); }
  else { ctx.drawImage(pages[49], 0, 0); cartoon(ctx, SC2, t, T.d2, T.w2, T.c2, CAP2, 'Ashby');
    if (t < T.turn[1]) pageTurn(seg(t, T.turn[0], T.turn[1])); }
  const fade = Math.max(1 - eOut(seg(t, 0, .3)), eIO2(seg(t, T.out[0], T.out[1])));
  if (fade > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = fade; ctx.drawImage(paperC, 0, 0); ctx.globalAlpha = 1; }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.events = () => {
  const ev = [];
  for (const [sc, D] of [[SC1, T.d1], [SC2, T.d2]]) for (const s of sc.strokes) if (s.L > 40) ev.push({ k: 'pen', t: +(D[0] + s.a * (D[1] - D[0])).toFixed(3), d: +((s.b - s.a) * (D[1] - D[0])).toFixed(3) });
  ev.push({ k: 'room', t: 0, d: 5.2 }, { k: 'party', t: 5.3, d: 4.7 });
  ev.push({ k: 'wash', t: T.w1 }, { k: 'wash', t: T.w2 });
  ev.push({ k: 'beat', t: T.c1 + .05 }, { k: 'beat', t: T.c2 + .05 });
  ev.push({ k: 'brow', t: T.brow }, { k: 'step', t: .9 }, { k: 'step', t: 1.6 });
  ev.push({ k: 'turn', t: T.turn[0] - .05, d: T.turn[1] - T.turn[0] + .1 });
  ev.push({ k: 'clink', t: T.sip + .4 }, { k: 'clink', t: T.sip + 1.05 }, { k: 'sip', t: T.sip + .5 });
  return ev;
};
window.ready = (async () => {
  await document.fonts.load(`italic 52px ${SERIF}`); await document.fonts.load(`500 21px ${SERIF}`); await document.fonts.ready;
  buildScene(SC1, 101); buildScene(SC2, 202); buildTextures(); pages[47] = buildPage(47); pages[49] = buildPage(49);
})();
</script>
