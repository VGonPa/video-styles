<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Liquid Glass: refractive glass morphing over a glowing aurora.
// A fictional product reveal ("Opaline"): a glass drop falls through the word "Introducing", two droplets
// condense and merge into it, the liquid snaps into an app-icon tile, then stretches into a frosted title
// card that pinches off a pill button. Glass is a WebGL2 shader over signed-distance shapes (smooth union →
// liquid bridges): rim refraction with chromatic dispersion, frost, Fresnel rim light, specular, soft
// shadow and caustic. The aurora, stars and the background word are drawn into a texture the glass bends.
// Type (Inter Tight) is set on top with 2D canvas. Every frame depends only on t.
const W = 1920, H = 1080, DUR = 10;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
const easeOut = u => 1 - Math.pow(1 - u, 3);
const easeIn = u => u * u * u;
const easeInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const easeOutBack = u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
// damped spring step response: 0 before t=0, settles at 1 with overshoot
function spring(t, f, z) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + z * w / wd * Math.sin(wd * t));
}
// decaying oscillation kicked at t=0
const wob = (t, f, d) => t <= 0 ? 0 : Math.exp(-t / d) * Math.sin(2 * Math.PI * f * t);

// ---------- timeline ----------
const TL = {
  introIn: 0.30, introOut: 2.50,
  creep: 0.38, release: 0.95, land: 1.42,
  cL: 1.55, cR: 1.72, pullL: 2.15, pullR: 2.33,
  antic3: 3.55, morph3: 3.78, mark: 4.08, sweep1: 4.55,
  antic4: 5.50, morph4: 5.72, title: 6.18, sub: 6.86, pill: 6.95, pillLabel: 7.42, sweep2: 8.05,
  fadeOut: 9.15,
};
const INTRO = 'Introducing', TITLE = 'Opaline', SUB = 'Light, reshaped.', PILL = 'Available now';
const F_INTRO = '300 58px "Inter Tight"', F_TITLE = '600 136px "Inter Tight"', F_SUB = '400 40px "Inter Tight"', F_PILL = '500 29px "Inter Tight"';
const L = {};   // layout measured once fonts are ready

// ---------- shaders ----------
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const COMMON = `#version 300 es
precision highp float; precision highp int;
uniform vec2 uRes;
out vec4 o;
uint hu(uint x){ x ^= x >> 16; x *= 0x7feb352du; x ^= x >> 15; x *= 0x846ca68bu; x ^= x >> 16; return x; }
float h1(int i){ return float(hu(uint(i))) * (1.0 / 4294967296.0); }
float h2(ivec2 p){ return float(hu(uint(p.x) * 73856093u ^ hu(uint(p.y) + 19349663u))) * (1.0 / 4294967296.0); }
float n1(float x){ float i = floor(x), f = x - i; float u = f * f * (3. - 2. * f); int k = int(i); return mix(h1(k), h1(k + 1), u); }
float fbm1(float x){ return 0.5 * n1(x) + 0.3 * n1(x * 2.13 + 17.) + 0.2 * n1(x * 4.71 + 41.); }
// FBO textures are stored y-up; scene coordinates pd are canvas pixels, y-down
vec4 texD(sampler2D s, vec2 pd){ return texture(s, vec2(pd.x, uRes.y - pd.y) / uRes); }
`;
const FS_BG = COMMON + `
uniform float uT, uAur;
uniform vec3 uLo[4], uHi[4];
uniform vec4 uRib[4];          // base y, slope, wave amplitude, gain
uniform sampler2D uText;
vec3 aurora(vec2 uv, float t){
  vec3 col = vec3(0.);
  for (int i = 0; i < 4; i++){
    float fi = float(i); vec4 P = uRib[i]; float x = uv.x + 3.;
    float yc = P.x + P.y * (uv.x - 0.5)
      + P.z * (0.62 * sin(x * 2.3 + fi * 1.9 + t * 0.42) + 0.28 * sin(x * 5.1 - t * 0.33 + fi * 3.1))
      + 0.05 * (n1(x * 3.1 + fi * 13.7 + t * 0.12 + 100.) - 0.5);
    float dy = uv.y - yc;
    float below = exp(-pow(max(dy, 0.) / 0.026, 2.));
    float up = dy < 0. ? exp(dy / 0.15) : 1.;
    float rays = 0.40 + 0.60 * fbm1(x * 46. + fi * 57. + t * (0.55 + 0.2 * fi) + 300.);
    float fine = 0.65 + 0.35 * n1(x * 170. + fi * 19. + t * 0.05 + 500.);
    float ray = mix(1., rays * fine, smoothstep(0.0, -0.06, dy));
    float bx = 0.30 + 0.70 * smoothstep(0.12, 0.88, n1(x * 2.2 + t * 0.18 + fi * 7. + 200.));
    vec3 c = mix(uLo[i], uHi[i], smoothstep(0.01, -0.20, dy));
    col += c * below * up * ray * bx * P.w;
  }
  return col;
}
void main(){
  vec2 pd = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 uv = pd / uRes; float t = uT;
  vec3 base = mix(vec3(0.010, 0.012, 0.042), vec3(0.022, 0.016, 0.070), uv.y);
  vec2 q = uv - vec2(0.12, 1.05); base += uLo[0] * 0.10 * exp(-dot(q, q * vec2(3., 5.)));
  q = uv - vec2(0.92, 0.0); base += uHi[1] * 0.09 * exp(-dot(q, q * vec2(3., 5.)));
  vec3 a = aurora(uv, t) * uAur;
  vec3 col = base + a;
  // stars (fixed field, slow twinkle)
  vec2 cs = pd / 21.; ivec2 ci = ivec2(floor(cs)) + ivec2(4096);
  float hs = h2(ci);
  if (hs < 0.09){
    vec2 sp = (floor(cs) + 0.2 + 0.6 * vec2(h2(ci + ivec2(7, 0)), h2(ci + ivec2(0, 7)))) * 21.;
    float b = h2(ci + ivec2(3, 3)); float sz = 0.6 + 1.0 * b * b; float dd = length(pd - sp);
    float tw = 0.75 + 0.25 * sin(t * 1.9 + hs * 700.);
    col += vec3(0.85, 0.9, 1.0) * exp(-dd * dd / (sz * sz)) * (0.25 + 0.6 * b) * tw * (1. - min(length(a) * 1.2, 0.8)) * uAur;
  }
  col = 1. - exp(-col * 1.3);
  float ta = texture(uText, uv).a;
  col = mix(col, vec3(0.96, 0.97, 1.0), ta * 0.92);
  o = vec4(col, 1.);
}`;
const FS_DOWN = COMMON + `
uniform sampler2D uSrc; uniform vec2 uOut, uTexel;
void main(){
  vec2 uv = gl_FragCoord.xy / uOut; vec2 d = uTexel;
  o = 0.25 * (texture(uSrc, uv + d * vec2(-1., -1.)) + texture(uSrc, uv + d * vec2(1., -1.))
            + texture(uSrc, uv + d * vec2(-1., 1.)) + texture(uSrc, uv + d * vec2(1., 1.)));
}`;
const FS_BLUR = COMMON + `
uniform sampler2D uSrc; uniform vec2 uOut, uDir;
void main(){
  vec2 uv = gl_FragCoord.xy / uOut;
  vec4 s = texture(uSrc, uv); float wsum = 1.;
  for (int i = 1; i <= 7; i++){
    float x = float(i); float w = exp(-x * x / (2. * 3.2 * 3.2));
    s += (texture(uSrc, uv + uDir * x) + texture(uSrc, uv - uDir * x)) * w; wsum += 2. * w;
  }
  o = s / wsum;
}`;
const FS_GLASS = COMMON + `
uniform sampler2D uBg, uBlur;
uniform vec4 uS[5]; uniform float uRr[5];
uniform float uK;
uniform vec4 uWob;               // 3-lobe amp (px), phase, 4-lobe amp, phase
uniform float uBevel, uRefr, uFrost, uDark, uDisp, uFade, uShadow, uBloom;
uniform vec3 uSweep;             // band position, width, strength
float sdRB(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
// smooth union that also blends an attribute (y = the shape's half-thickness)
vec2 smin(vec2 a, vec2 b, float k){
  float h = clamp(0.5 + 0.5 * (b.x - a.x) / k, 0., 1.);
  return vec2(mix(b.x, a.x, h) - k * h * (1. - h), mix(b.y, a.y, h));
}
vec2 sceneD(vec2 p){
  vec2 q = p - uS[0].xy;
  float d = sdRB(q, uS[0].zw, uRr[0]);
  float th = atan(q.y, q.x);
  d += uWob.x * sin(3. * th + uWob.y) + uWob.z * sin(4. * th + uWob.w);
  vec2 r = vec2(d, min(uS[0].z, uS[0].w));
  for (int i = 1; i < 5; i++){
    if (uS[i].z <= 0.) continue;
    r = smin(r, vec2(sdRB(p - uS[i].xy, uS[i].zw, uRr[i]), min(uS[i].z, uS[i].w)), uK);
  }
  return r;
}
void main(){
  vec2 pd = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 bg = texD(uBg, pd).rgb, bl = texD(uBlur, pd).rgb;
  vec3 outside = bg + bl * uBloom;
  vec2 sd = sceneD(pd); float d = sd.x;
  float B = min(uBevel, 0.92 * sd.y), refr = uRefr * B;
  // soft shadow below the glass, a thin caustic of focused light offset away from the key light
  float dsh = sceneD(pd - vec2(0., 34.)).x;
  outside *= 1. - uShadow * (1. - smoothstep(-50., 80., dsh));
  float dc = sceneD(pd - vec2(12., 24.)).x;
  outside += exp(-pow((dc + 2.) / 22., 2.)) * smoothstep(0., 30., d) * (bl * 0.9 + 0.015) * uShadow;
  vec3 col = outside;
  if (d < 2.){
    float e = 1.0;
    vec2 g = vec2(sceneD(pd + vec2(e, 0.)).x - sceneD(pd - vec2(e, 0.)).x, sceneD(pd + vec2(0., e)).x - sceneD(pd - vec2(0., e)).x);
    g /= max(length(g), 1e-4);
    float s = max(-d, 0.);
    float v = 1. - clamp(s / B, 0., 1.);
    float slope = v / sqrt(max(1. - v * v, 0.02));
    vec3 n = normalize(vec3(g * slope, 1.));
    vec3 T = refract(vec3(0., 0., -1.), n, 1. / 1.5);
    vec2 off = T.xy * refr;
    vec2 oR = off * (1. - uDisp), oB = off * (1. + uDisp);
    vec3 sharp = vec3(texD(uBg, pd + oR).r, texD(uBg, pd + off).g, texD(uBg, pd + oB).b);
    vec3 fro = vec3(texD(uBlur, pd + oR).r, texD(uBlur, pd + off).g, texD(uBlur, pd + oB).b);
    vec3 gc = mix(sharp, fro * 1.08, uFrost);
    gc = gc * 1.03 + vec3(0.014, 0.018, 0.034);
    gc = mix(gc, gc * 0.55 + vec3(0.02, 0.02, 0.05), uDark);
    float fr = pow(1. - n.z, 3.);
    vec3 env = texD(uBlur, pd + g * 80.).rgb * 1.5 + vec3(0.05, 0.06, 0.09);
    gc = mix(gc, env, clamp(fr, 0., 1.) * 0.55);
    vec3 Lk = normalize(vec3(-0.45, -0.75, 0.6));
    vec3 Hh = normalize(Lk + vec3(0., 0., 1.));
    gc += pow(max(dot(n, Hh), 0.), 60.) * 0.85;
    float rim = exp(-s / 1.4);
    float tl = max(dot(g, normalize(vec2(-0.5, -0.85))), 0.);
    float br = max(dot(g, normalize(vec2(0.5, 0.85))), 0.);
    gc += rim * (0.25 + 0.75 * tl + 0.45 * br) * 0.9;
    gc += exp(-s / 14.) * br * 0.28 * (env * 0.8 + 0.1);
    gc *= 1. - 0.18 * exp(-pow((s - 10.) / 7., 2.)) * (1. - tl);
    float sw = exp(-pow((dot(pd, normalize(vec2(1., 0.55))) - uSweep.x) / uSweep.y, 2.)) * uSweep.z;
    gc += sw * (0.6 + 0.8 * rim);
    col = mix(outside, gc, smoothstep(1., -1., d));
  }
  vec2 uv = pd / uRes - 0.5;
  col *= 1. - 0.38 * pow(length(uv * vec2(1.0, 1.2)) * 1.25, 2.4);
  col += (h2(ivec2(pd) + ivec2(9000)) - 0.5) * 0.022;
  o = vec4(col * uFade, 1.);
}`;

// ---------- GL plumbing ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const glc = document.createElement('canvas'); glc.width = W; glc.height = H;
const gl = glc.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false, premultipliedAlpha: false });
const txc = document.createElement('canvas'); txc.width = W; txc.height = H;
const tx = txc.getContext('2d');
const QW = W / 4, QH = H / 4;
let P = {}, T = {}, quad, textTex, textDirty = true, textEmpty = false;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  for (let i = 0, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}
function texture(w, h, internal) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if (internal) gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}
function target(w, h) {
  const t = texture(w, h, gl.RGBA16F), f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { t, f, w, h };
}
function initGL() {
  if (!gl) throw new Error('WebGL2 unavailable');
  if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('EXT_color_buffer_float unavailable');
  P.bg = program(FS_BG); P.down = program(FS_DOWN); P.blur = program(FS_BLUR); P.glass = program(FS_GLASS);
  T.bg = target(W, H); T.q1 = target(QW, QH); T.q2 = target(QW, QH);
  textTex = texture(W, H, null);
  quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
}
function pass(prog, out, set) {
  gl.useProgram(prog.p);
  gl.bindFramebuffer(gl.FRAMEBUFFER, out ? out.f : null);
  gl.viewport(0, 0, out ? out.w : W, out ? out.h : H);
  gl.uniform2f(prog.u.uRes, W, H);
  set(prog.u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bindTex(unit, tex, loc) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(loc, unit); }

// ---------- palette ----------
const PAL_A = {
  lo: [[0.10, 1.00, 0.70], [0.15, 0.85, 1.00], [0.10, 0.90, 0.62], [0.40, 0.32, 1.00]],
  hi: [[0.38, 0.25, 0.95], [0.55, 0.25, 0.95], [0.20, 0.35, 0.90], [0.80, 0.30, 0.90]],
};
const PAL_B = {
  lo: [[0.25, 0.68, 1.00], [1.00, 0.42, 0.68], [0.30, 0.82, 1.00], [0.90, 0.38, 0.82]],
  hi: [[0.85, 0.26, 0.85], [0.55, 0.26, 1.00], [0.60, 0.30, 1.00], [0.40, 0.30, 1.00]],
};
const RIB = [[0.60, -0.16, 0.055, 1.0], [0.40, 0.10, 0.045, 0.72], [0.80, -0.06, 0.040, 0.55], [0.22, 0.18, 0.050, 0.45]];

// ---------- choreography ----------
function bodyY(t) {
  if (t < TL.release) return lerp(-260, -70, easeOut(seg(t, TL.creep, TL.release - 0.10)));
  return lerp(-70, 540, spring(t - TL.release, 0.95, 0.6));
}
const zoom = t => 1 + 0.045 * easeInOut(seg(t, 7.7, 10.0));
const hover = t => 6 * Math.sin(2 * Math.PI * 0.55 * (t - 4.3)) * smooth(seg(t, 4.0, 4.5)) * (1 - smooth(seg(t, 5.35, 5.72)));
const velo = (f, t, e = 1 / 240) => (f(t + e) - f(t - e)) / (2 * e);
const DROPS = [
  { p: [585, 410], tc: TL.cL, tp: TL.pullL, ph: 0.0 },
  { p: [1345, 650], tc: TL.cR, tp: TL.pullR, ph: 2.1 },
];
function dropPos(D, t) {
  let x = D.p[0], y = D.p[1] + 7 * Math.sin(t * 2.1 + D.ph);
  const dx = 960 - D.p[0], dy = 540 - D.p[1], dl = Math.hypot(dx, dy), ux = dx / dl, uy = dy / dl;
  const away = easeOut(seg(t, D.tp, D.tp + 0.18)), pull = easeIn(seg(t, D.tp + 0.18, D.tp + 0.62));
  x -= ux * 26 * away; y -= uy * 26 * away;
  return [lerp(x, 960, pull), lerp(y, 540, pull), pull, ux, uy];
}
function state(t) {
  const S = [];
  for (let i = 0; i < 5; i++) S.push([-3000, -3000, 0, 0, 0]);
  // main body
  let cx = 960, cy = bodyY(t);
  const r = 150 + 17 * smooth(seg(t, 2.60, 2.86)) + 17 * smooth(seg(t, 2.78, 3.04));
  const vy = velo(bodyY, t);
  const drip = 0.12 * smooth(seg(t, 0.70, TL.release)) * (1 - smooth(seg(t, TL.release, TL.release + 0.3)));
  const st = clamp(vy / 2400, -0.35, 1) * 0.22 + drip;
  let hx = r * (1 - 0.5 * st), hy = r * (1 + st);
  const mL = wob(t - 2.70, 2.4, 0.33), mR = wob(t - 2.90, 2.4, 0.33);
  hx += 16 * mL + 12 * mR; hy -= 16 * mL + 12 * mR;
  const liquid = 1 - smooth(seg(t, 3.55, 4.1));
  let w3 = 7 * wob(t - TL.land, 2.8, 0.4) + 6 * wob(t - 2.70, 3.3, 0.35) + liquid * 2.2 * Math.sin(t * 1.7);
  let w4 = 5 * wob(t - 2.90, 3.6, 0.35) + liquid * 1.6 * Math.sin(t * 1.3 + 2);
  let rad = Math.min(hx, hy);
  if (t >= TL.antic3) {
    const a = easeInOut(seg(t, TL.antic3, TL.morph3));
    const s3 = spring(t - TL.morph3, 1.5, 0.42), k3 = wob(t - TL.morph3, 2.2, 0.3);
    const base = lerp(184, 172, a), side = lerp(base, 196, s3);
    hx = side + 10 * k3; hy = side * (1 - 0.05 * a * (1 - Math.min(s3, 1))) - 10 * k3;
    rad = lerp(base, 92, s3);
  }
  if (t >= TL.antic4) {
    const a = easeInOut(seg(t, TL.antic4, TL.morph4));
    const s4 = spring(t - TL.morph4, 1.15, 0.55), s4y = spring(t - TL.morph4 - 0.08, 1.15, 0.55);
    cx = lerp(960 + 12 * a, L.card.cx, s4);
    hx = lerp(196 - 10 * a, L.card.hx, s4);
    hy = lerp(196 + 8 * a, L.card.hy, s4y);
    cy = lerp(540, L.card.cy, s4y);
    rad = lerp(92, L.card.r, s4);
  }
  if (t >= TL.antic3) cy += hover(t);
  rad = clamp(rad, 0, Math.min(hx, hy));
  S[0] = [cx, cy, hx, hy, rad];
  const Z = zoom(t);
  // droplets that condense and get pulled in
  DROPS.forEach((D, k) => {
    if (t < D.tc) return;
    const [x, y, pull, ux, uy] = dropPos(D, t);
    let rr = 76 * spring(t - D.tc, 1.8, 0.45) * (1 - smooth(seg(pull, 0.72, 1.0)));
    if (rr <= 0.5) return;
    const str = 0.32 * Math.sin(Math.PI * clamp(pull * 1.2)) ;
    const ex = rr * (1 + str * Math.abs(ux) - 0.4 * str * Math.abs(uy)), ey = rr * (1 + str * Math.abs(uy) - 0.4 * str * Math.abs(ux));
    S[1 + k] = [x, y, ex, ey, Math.min(ex, ey)];
  });
  // pill button that pinches off the card
  if (t >= TL.pill) {
    const sp = spring(t - TL.pill, 1.25, 0.5), sx = spring(t - TL.pill - 0.12, 1.4, 0.45);
    const py = lerp(L.card.cy + L.card.hy - 58, L.pill.cy, sp);
    const v = velo(u => spring(u - TL.pill, 1.25, 0.5), t);
    const phx = lerp(96, L.pill.hx, sx), phy = L.pill.hy * (1 + clamp(v / 9, -0.2, 0.25));
    S[3] = [960, py, phx, phy, Math.min(phx, phy)];
  }
  for (const s of S) if (s[2] > 0) { s[0] = 960 + (s[0] - 960) * Z; s[1] = 540 + (s[1] - 540) * Z; s[2] *= Z; s[3] *= Z; s[4] *= Z; }
  // material
  const frost = 0.03 + 0.20 * smooth(seg(t, 3.8, 4.6)) + 0.32 * smooth(seg(t, 5.8, 6.6));
  const dark = 0.12 * smooth(seg(t, 3.8, 4.6)) + 0.16 * smooth(seg(t, 5.8, 6.6));
  const bevel = lerp(lerp(122, 92, smooth(seg(t, 3.7, 4.3))), 80, smooth(seg(t, 5.7, 6.4))) * Z;
  // light sweeps
  const dn = Math.hypot(1, 0.55), cp = (960 + 0.55 * 540) / dn;
  let sweep = [0, 1, 0];
  const u1 = seg(t, TL.sweep1, TL.sweep1 + 0.7), u2 = seg(t, TL.sweep2, TL.sweep2 + 0.95);
  if (u1 > 0 && u1 < 1) sweep = [cp - 380 + 760 * easeInOut(u1), 60, 0.34 * Math.sin(Math.PI * u1)];
  if (u2 > 0 && u2 < 1) sweep = [cp - 760 + 1520 * easeInOut(u2), 80, 0.34 * Math.sin(Math.PI * u2)];
  const fade = smooth(seg(t, 0, 0.55)) * (1 - smooth(seg(t, TL.fadeOut, 9.97)));
  const aur = 0.25 + 0.75 * smooth(seg(t, 0.1, 1.5)) + 0.15 * smooth(seg(t, 5.7, 6.6));
  return { S, w: [w3, t * 0.9, w4, -t * 0.7 + 1.3], frost, dark, bevel, refr: 0.46, sweep, fade, aur, pal: smooth(seg(t, 3.6, 6.3)) };
}

// ---------- type ----------
function prefixX(c, str) { const xs = []; for (let i = 0; i <= str.length; i++) xs.push(c.measureText(str.slice(0, i)).width); return xs; }
function layout() {
  ctx.font = F_TITLE; ctx.letterSpacing = '-3px';
  L.titleX = prefixX(ctx, TITLE); const tw = L.titleX[TITLE.length] + 3;
  ctx.font = F_SUB; ctx.letterSpacing = '0.5px'; L.subW = ctx.measureText(SUB).width;
  ctx.font = F_PILL; ctx.letterSpacing = '0.6px'; L.pillW = ctx.measureText(PILL).width;
  tx.font = F_INTRO; tx.letterSpacing = '22px'; L.introX = prefixX(tx, INTRO);
  ctx.letterSpacing = '0px'; tx.letterSpacing = '0px';
  const markW = 136, gap = 54, content = markW + gap + tw;
  L.card = { cx: 960, cy: 468, hx: content / 2 + 96, hy: 148, r: 76 };
  L.left = 960 - content / 2;
  L.markX = L.left + markW / 2; L.textX = L.left + markW + gap;
  L.pill = { cy: 726, hx: L.pillW / 2 + 50, hy: 44 };
}
function drawIntro(t) {
  const out = smooth(seg(t, TL.introOut, TL.introOut + 0.6));
  const vis = t >= TL.introIn && out < 1;
  if (!vis) { if (!textEmpty) { tx.clearRect(0, 0, W, H); textEmpty = true; textDirty = true; } return; }
  textEmpty = false; textDirty = true;
  tx.clearRect(0, 0, W, H);
  tx.font = F_INTRO; tx.fillStyle = '#fff'; tx.textBaseline = 'alphabetic';
  const n = INTRO.length, total = L.introX[n] - 22, x0 = 960 - total / 2;
  for (let i = 0; i < n; i++) {
    const u = seg(t, TL.introIn + i * 0.045, TL.introIn + i * 0.045 + 0.6);
    if (u <= 0) continue;
    const spread = (i - (n - 1) / 2) * 10 * out;
    tx.globalAlpha = easeOut(u) * (1 - out);
    tx.fillText(INTRO[i], x0 + L.introX[i] + spread, 561 + 16 * (1 - easeOut(u)) - 8 * out);
  }
  tx.globalAlpha = 1;
}
function drawMark(x, y, sc, prog, dot, alpha) {
  if (alpha <= 0 || prog <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.globalAlpha = alpha;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff';
  const gapA = 0.46, a0 = -Math.PI / 4 + gapA;
  ctx.lineWidth = 11; ctx.beginPath(); ctx.arc(0, 0, 56, a0, a0 + (2 * Math.PI - 2 * gapA) * prog); ctx.stroke();
  ctx.globalAlpha = alpha * 0.62; ctx.lineWidth = 7;
  const p2 = seg(prog, 0.35, 1);
  if (p2 > 0) { ctx.beginPath(); ctx.arc(0, 0, 30, Math.PI * 1.05, Math.PI * (1.05 + 0.42 * p2)); ctx.stroke(); }
  if (dot > 0) { ctx.globalAlpha = alpha; ctx.beginPath(); ctx.arc(56 * Math.cos(-Math.PI / 4), 56 * Math.sin(-Math.PI / 4), 16 * dot, 0, 2 * Math.PI); ctx.fill(); }
  ctx.restore();
}
function drawType(t, st) {
  const fade = st.fade, Z = zoom(t);
  ctx.save();
  ctx.translate(960, 540); ctx.scale(Z, Z); ctx.translate(-960, -540);
  ctx.shadowColor = 'rgba(16,8,48,0.38)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 2;
  // mark: drawn on the tile, then rides to the left of the card
  const s4 = spring(t - TL.morph4, 1.15, 0.55), s4y = spring(t - TL.morph4 - 0.08, 1.15, 0.55);
  const prog = easeOut(seg(t, TL.mark, TL.mark + 0.6)), dot = Math.max(0, spring(t - TL.mark - 0.42, 2.2, 0.4));
  const mx = lerp(960, L.markX, s4), my = lerp(540, L.card.cy, s4y) + hover(t), msc = lerp(1.18, 1.0, s4);
  drawMark(mx, my, msc, prog, dot, fade);
  // title letters
  ctx.font = F_TITLE; ctx.letterSpacing = '-3px'; ctx.textBaseline = 'alphabetic';
  const tg = ctx.createLinearGradient(0, L.card.cy - 80, 0, L.card.cy + 40);
  tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, '#e2e4ff'); ctx.fillStyle = tg;
  for (let i = 0; i < TITLE.length; i++) {
    const u = seg(t, TL.title + i * 0.05, TL.title + i * 0.05 + 0.55);
    if (u <= 0) continue;
    ctx.globalAlpha = easeOut(seg(u, 0, 0.6)) * fade;
    ctx.fillText(TITLE[i], L.textX + L.titleX[i], L.card.cy + 24 + 42 * (1 - easeOutBack(u)));
  }
  // subtitle
  const us = seg(t, TL.sub, TL.sub + 0.6);
  if (us > 0) {
    ctx.font = F_SUB; ctx.letterSpacing = '0.5px'; ctx.fillStyle = 'rgba(240,244,255,0.80)';
    ctx.globalAlpha = easeOut(us) * fade;
    ctx.fillText(SUB, L.textX + 4, L.card.cy + 88 + 14 * (1 - easeOut(us)));
  }
  // pill label rides with the pill
  const up = seg(t, TL.pillLabel, TL.pillLabel + 0.5);
  if (up > 0) {
    const py = lerp(L.card.cy + L.card.hy - 58, L.pill.cy, spring(t - TL.pill, 1.25, 0.5));
    ctx.font = F_PILL; ctx.letterSpacing = '0.6px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = easeOut(up) * fade;
    ctx.fillText(PILL, 960, py + 1 + 8 * (1 - easeOut(up)));
  }
  ctx.restore();
}

// ---------- frame ----------
function render(t) {
  const st = state(t);
  drawIntro(t);
  if (textDirty) {
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, txc);
    textDirty = false;
  }
  const m = st.pal, lo = [], hi = [];
  for (let i = 0; i < 4; i++) for (let c = 0; c < 3; c++) {
    lo.push(lerp(PAL_A.lo[i][c], PAL_B.lo[i][c], m)); hi.push(lerp(PAL_A.hi[i][c], PAL_B.hi[i][c], m));
  }
  const rib = [];
  RIB.forEach((r, i) => rib.push(r[0] + 0.012 * Math.sin(t * 0.3 + i * 1.7), r[1], r[2], r[3]));
  pass(P.bg, T.bg, u => {
    gl.uniform1f(u.uT, t); gl.uniform1f(u.uAur, st.aur);
    gl.uniform3fv(u.uLo, lo); gl.uniform3fv(u.uHi, hi); gl.uniform4fv(u.uRib, rib);
    bindTex(0, textTex, u.uText);
  });
  pass(P.down, T.q1, u => { gl.uniform2f(u.uOut, QW, QH); gl.uniform2f(u.uTexel, 1 / W, 1 / H); bindTex(0, T.bg.t, u.uSrc); });
  for (let k = 0; k < 2; k++) {
    pass(P.blur, T.q2, u => { gl.uniform2f(u.uOut, QW, QH); gl.uniform2f(u.uDir, 1 / QW, 0); bindTex(0, T.q1.t, u.uSrc); });
    pass(P.blur, T.q1, u => { gl.uniform2f(u.uOut, QW, QH); gl.uniform2f(u.uDir, 0, 1 / QH); bindTex(0, T.q2.t, u.uSrc); });
  }
  const sh = [], rr = [];
  st.S.forEach(s => { sh.push(s[0], s[1], s[2], s[3]); rr.push(s[4]); });
  pass(P.glass, null, u => {
    bindTex(0, T.bg.t, u.uBg); bindTex(1, T.q1.t, u.uBlur);
    gl.uniform4fv(u.uS, sh); gl.uniform1fv(u.uRr, rr); gl.uniform1f(u.uK, 80);
    gl.uniform4fv(u.uWob, st.w);
    gl.uniform1f(u.uBevel, st.bevel); gl.uniform1f(u.uRefr, st.refr); gl.uniform1f(u.uFrost, st.frost);
    gl.uniform1f(u.uDark, st.dark); gl.uniform1f(u.uDisp, 0.14); gl.uniform1f(u.uFade, st.fade);
    gl.uniform1f(u.uShadow, 0.42); gl.uniform1f(u.uBloom, 0.38); gl.uniform3fv(u.uSweep, st.sweep);
  });
  ctx.globalAlpha = 1; ctx.drawImage(glc, 0, 0);
  drawType(t, st);
}

window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };

// sound cues for audio.py
window.events = () => {
  const ev = [
    { k: 'drip', t: 0.62 }, { k: 'fall', t: TL.release }, { k: 'land', t: TL.land },
    { k: 'bead', t: TL.cL, pan: -0.45 }, { k: 'bead', t: TL.cR, pan: 0.45 },
    { k: 'merge', t: 2.68, pan: -0.3 }, { k: 'merge', t: 2.88, pan: 0.3 },
    { k: 'riser', t: TL.antic3 - 0.25, d: TL.morph3 - TL.antic3 + 0.25 }, { k: 'morph', t: TL.morph3, v: 0.8 },
    { k: 'chime', t: TL.mark }, { k: 'shimmer', t: TL.sweep1, d: 0.7 },
    { k: 'riser', t: TL.antic4 - 0.25, d: TL.morph4 - TL.antic4 + 0.25 }, { k: 'morph', t: TL.morph4, v: 1.0 },
    { k: 'pop', t: 7.23 }, { k: 'shimmer', t: TL.sweep2, d: 0.95 },
  ];
  for (let i = 0; i < INTRO.length; i++) ev.push({ k: 'tap', t: TL.introIn + i * 0.045 + 0.05, i, v: 0.4 });
  for (let i = 0; i < TITLE.length; i++) ev.push({ k: 'tap', t: TL.title + i * 0.05 + 0.08, i, v: 1.0 });
  ev.sort((a, b) => a.t - b.t);
  return { dur: DUR, chords: [[0, 'I'], [3.78, 'vi'], [5.72, 'IV'], [7.3, 'I']], fadeOut: TL.fadeOut, ev };
};

window.ready = (async () => {
  await Promise.all([F_INTRO, F_TITLE, F_SUB, F_PILL].map(f => document.fonts.load(f, 'AaOpline')));
  await document.fonts.ready;
  layout();
  initGL();
})();
</script>
