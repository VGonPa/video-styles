<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Liquid Glass</title>
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// Liquid Glass: a launch film whose reveal is the style's own name (no invented brand or tagline).
// A glass bead glides over the word "Introducing", splits into three, melts into a mode switch
// (Focus / Flow / Rest, with a lens that slides between them and recolours the aurora), then the
// switch swells into five blobs that resolve into the two-line glass lockup "Liquid / Glass".
//
// How it is drawn (WebGL2, five kinds of pass, all in linear light on half-float targets):
//   aurora  the sky: folded curtains of light with rays, haze and stars, plus the text that lies under the glass
//   glass   one glass layer over whatever is beneath it. The shape is a signed-distance field: up to six
//           ellipses or rounded boxes in two groups, each joined with a smooth minimum, cross-blended, and
//           optionally blended towards the wordmark's distance field. A spherical-cap height profile over that
//           field gives the surface normal, which bends the background lookup (with dispersion) and lights
//           the rim. Run twice: the beads / switch / wordmark, then the sliding lens on top.
//   bright, blur   bloom
//   final   tone curve, overlay text, vignette, fade, static dither
// Every value comes from stage(t), a closed-form function of time, so frames can be drawn in any order.

const W = 1920, H = 1080, FONT = "'Inter Tight'";
const CX = W / 2, CY = H / 2;
const LABELS = ['Focus', 'Flow', 'Rest'], KICKER = 'Introducing', TITLE = ['Liquid', 'Glass'];
const TITLE_BLOBS = [[0, 0, 2], [0, 2, 4], [0, 4, 6], [1, 0, 2], [1, 2, 5]];   // [line, from, to]: five blobs (the shader holds six shapes)
const BEAD_R = 150, SMALL_R = 100, GAP = 360, PILL_HW = 560, PILL_HH = 105, THUMB_HW = 172, THUMB_HH = 84;
const TITLE_PX = 310, TITLE_LEAD = 340, TITLE_CY = 466;

// Beat sheet (seconds).
const T = {
  word: 0.1, bead: 0.45, wordOut: 1.45,          // the kicker fades up, the bead glides in over it
  squeeze: 1.75, split: 2.0,                     // anticipation, then one bead becomes three
  gather: 2.8, pill: 3.0, labels: 3.2,           // the three melt into the switch, labels arrive
  thumb: 3.5, slide1: 4.15, slide2: 4.9,         // the lens pops in and slides twice
  clear: 5.55, morph: 5.88, resolve: 6.2, title: 6.7,   // the switch empties, swells into four blobs; they resolve into the wordmark
  glint: 8.05, fade: 9.3,
};

// ---------- small maths ----------
const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const mix = (a, b, k) => a + (b - a) * k;
const mix3 = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const seg = (t, a, b) => clamp((t - a) / (b - a));
const smooth = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIO = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(2 - 2 * k, 3) / 2);
// Under-damped spring released from rest at 0 towards 1: `hz` sets the pace, `zeta` (< 1) the overshoot.
function spring(tau, hz, zeta) {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * hz, wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + zeta * w / wd * Math.sin(wd * tau));
}
// The same spring's speed, per second.
function springVel(tau, hz, zeta) {
  if (tau <= 0) return 0;
  const w = 2 * Math.PI * hz, wd = w * Math.sqrt(1 - zeta * zeta);
  return Math.exp(-zeta * w * tau) * (w * w / wd) * Math.sin(wd * tau);
}

// ---------- aurora palettes (linear RGB): colour at the hem, part-way up and at the top of a curtain ----------
const PAL = {
  open:  { hem: [0.10, 1.00, 0.52], mid: [0.03, 0.72, 0.80], top: [0.50, 0.22, 1.00] },
  focus: { hem: [0.10, 0.70, 1.00], mid: [0.10, 0.40, 1.00], top: [0.30, 0.20, 0.95] },
  flow:  { hem: [0.20, 1.00, 0.42], mid: [0.02, 0.85, 0.62], top: [0.05, 0.55, 0.85] },
  rest:  { hem: [1.00, 0.32, 0.62], mid: [0.75, 0.22, 0.90], top: [0.35, 0.20, 1.00] },
  title: { hem: [0.12, 1.00, 0.60], mid: [0.10, 0.62, 1.00], top: [0.85, 0.25, 0.95] },
};
function toHsv([r, g, b]) {
  const hi = Math.max(r, g, b), lo = Math.min(r, g, b), span = hi - lo;
  const h = span === 0 ? 0 : hi === r ? ((g - b) / span + 6) % 6 : hi === g ? (b - r) / span + 2 : (r - g) / span + 4;
  return [h / 6, hi === 0 ? 0 : span / hi, hi];
}
function toRgb([h, sat, v]) {
  const f = n => { const k = (n + h * 6) % 6; return v - v * sat * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)];
}
// Colours blend through hue, with the wheel cut open at yellow: green to rose passes blue and violet, never
// grey and never amber.
function mixHue(a, b, k) {
  const p = toHsv(a), q = toHsv(b), CUT = 1 / 6, open = h => (h - CUT + 1) % 1;
  return toRgb([(mix(open(p[0]), open(q[0]), k) + CUT) % 1, mix(p[1], q[1], k), mix(p[2], q[2], k)]);
}
const blend = (a, b, k) => ({ hem: mixHue(a.hem, b.hem, k), mid: mixHue(a.mid, b.mid, k), top: mixHue(a.top, b.top, k) });

// ---------- the whole film as a function of time ----------
function stage(t) {
  // -- layer 1: bead → three beads → switch → wordmark --
  const tauIn = t - T.bead, eIn = spring(tauIn, 0.95, 0.7);
  const stIn = clamp(Math.abs(springVel(tauIn, 0.95, 0.7)) * 1150 / 3200) * 0.26;   // stretch along the glide
  const squeeze = smooth(seg(t, T.squeeze, T.split)) * (1 - smooth(seg(t, T.split, T.split + 0.18)));
  const give = easeIO(seg(t, T.split, T.split + 0.45));        // the centre bead hands volume to its neighbours
  const gather = smooth(seg(t, T.gather, T.pill));              // a small inward lean before the melt
  const grow = spring(t - T.pill, 2.2, 0.6);                    // the switch stretches out, overshoots, settles
  const ant = easeIO(seg(t, T.clear + 0.05, T.morph));          // the switch draws in before it pours
  const blobs = easeIO(seg(t, T.morph, T.morph + 0.42));        // switch → one blob per letter
  const m = easeIO(seg(t, T.resolve, T.title));                 // blobs → wordmark

  const r0 = mix(BEAD_R, SMALL_R, give) * (1 - 0.06 * gather * (1 - seg(t, T.pill, T.pill + 0.15)));
  let hw = r0 * (1 + stIn) * (1 - 0.12 * squeeze), hh = r0 * (1 - 0.5 * stIn) * (1 + 0.08 * squeeze);
  const beadBevel = Math.min(hw, hh);
  hw = mix(hw, PILL_HW, grow) - 64 * ant;
  hh = mix(hh, PILL_HH, clamp(grow)) + 15 * ant;
  const boxes = [[mix(-280, CX, eIn), CY + 70 * (1 - eIn) * (1 - eIn), hw, hh, Math.min(hw, hh), smooth(seg(t, T.pill, T.pill + 0.1))]];
  if (t >= T.split && t < T.pill + 0.45) {
    const absorb = smooth(seg(t, T.pill + 0.03, T.pill + 0.24));
    for (const [dir, delay] of [[-1, 0], [1, 0.09]]) {
      const tau = t - T.split - delay, e = spring(tau, 2.0, 0.5);
      const st = clamp(Math.abs(springVel(tau, 2.0, 0.5)) / 6) * 0.22;
      const r = SMALL_R * (1 - 0.06 * gather) * (1 - absorb);
      if (tau > 0 && r > 1) boxes.push([CX + dir * (GAP * e - 22 * gather), CY, r * (1 + st), r * (1 - 0.45 * st), beadBevel, 0]);
    }
  }
  const split = boxes.length;
  if (blobs > 0) letterBlobs.forEach((l, i) => {                   // the blobs swell one after another, left to right
    const g = mix(0.5, 1, spring(t - T.morph - 0.06 * i, 2.4, 0.5));
    boxes.push([l.cx, l.cy, l.hw * g, l.hh * g, 0, 0]);
  });
  const asPill = smooth(seg(t, T.pill, T.pill + 0.4));          // bead material → switch material
  const settle = t - T.title;
  const ring = settle > 0 ? -6 * Math.exp(-6 * settle) * Math.sin(2 * Math.PI * 2.2 * settle) * smooth(seg(settle, 0, 0.08)) : 0;
  const glintK = seg(t, T.glint, T.glint + 0.8);
  const layer1 = {
    boxes, split, blend: blobs, k: mix(78, 40, asPill), textMix: m, soft: 26 * Math.pow(1 - m, 1.3),
    inflate: 9 * Math.sin(Math.PI * m) + ring, wob: 5 * Math.sin(Math.PI * m), stencil: mix(3.2, 5.5, m),
    bevel: mix(mix(beadBevel, 38, asPill), 40, m),
    refr: mix(mix(38, 30, asPill), 40, m),
    disp: mix(mix(0.06, 0.13, asPill), 0.17, m),
    frost: mix(0, 3.3, asPill) * (1 - smooth(seg(t, T.morph - 0.1, T.resolve + 0.1))),
    tint: mix3(mix3([1, 1, 1], [0.60, 0.67, 0.86], asPill), [0.94, 0.97, 1.04], blobs),
    milk: mix(mix(0.006, 0.03, asPill), 0.035, m),
    shadow: mix(0.6, 0.85, m), spec: 1,
    glint: [mix(-640, 640, easeIO(glintK)), 85, 1.3 * Math.sin(Math.PI * glintK)],
  };

  // -- layer 2: the lens that slides along the switch --
  const pop = spring(t - T.thumb, 2.6, 0.55);
  const leave = 1 + 0.07 * Math.sin(Math.PI * seg(t, T.clear - 0.1, T.clear + 0.08)) - 1.07 * Math.pow(seg(t, T.clear + 0.04, T.clear + 0.28), 2);
  const slide = spring(t - T.slide1, 1.9, 0.68) + spring(t - T.slide2, 1.9, 0.68);
  const stS = clamp(Math.abs(springVel(t - T.slide1, 1.9, 0.68) + springVel(t - T.slide2, 1.9, 0.68)) / 6) * 0.24;
  const tx = CX - GAP + GAP * slide, sc = Math.max(0, pop * leave), present = clamp(sc);
  const layer2 = {
    boxes: t > T.thumb && sc > 0.02 ? [[tx, CY, THUMB_HW * sc * (1 + stS), THUMB_HH * sc * (1 - 0.3 * stS), THUMB_HH * sc * (1 - 0.3 * stS), 1]] : [],
    split: 1, blend: 0, k: 1, textMix: 0, soft: 0, inflate: 0, wob: 0, stencil: 3.2, bevel: 30 * Math.max(sc, 0.2), refr: 30, disp: 0.2, frost: 0,
    tint: [1.25, 1.27, 1.32], milk: 0.11, shadow: 0.6, spec: 1.15, glint: [0, 1, 0],
  };

  // -- text --
  const labels = LABELS.map((text, i) => {
    const a = easeOut(seg(t, T.labels + 0.08 * i, T.labels + 0.08 * i + 0.32)) * (1 - seg(t, T.clear, T.clear + 0.22));
    const sel = smooth(clamp(1 - Math.abs(tx - (CX + (i - 1) * GAP)) / 210)) * present;
    return { text, x: CX + (i - 1) * GAP, y: CY + 17 + 14 * (1 - a), a: a * mix(0.62, 1, sel), scale: 1 + 0.1 * sel };
  });
  const kicker = smooth(seg(t, T.word, T.word + 0.5)) * (1 - smooth(seg(t, T.wordOut, T.wordOut + 0.35)));

  // -- aurora --
  let pal = blend(PAL.open, PAL.focus, smooth(seg(t, T.thumb, T.thumb + 0.6)));
  pal = blend(pal, PAL.flow, smooth(seg(t, T.slide1 + 0.05, T.slide1 + 0.65)));
  pal = blend(pal, PAL.rest, smooth(seg(t, T.slide2 + 0.05, T.slide2 + 0.65)));
  pal = blend(pal, PAL.title, smooth(seg(t, T.morph, T.title + 0.3)));
  const swell = smooth(seg(t, T.morph + 0.2, T.title + 0.1)) * (1 - 0.7 * smooth(seg(t, T.title + 0.1, T.title + 1.3)));
  return {
    layer1, layer2, labels, kicker, pal,
    gain: 1 + 0.4 * swell, zoom: 1 + 0.007 * t,
    fade: smooth(seg(t, 0, 0.6)) * (1 - smooth(seg(t, T.fade, T.fade + 0.66))),
  };
}

// ---------- text: one canvas, one channel per role (red: switch labels, green: overlay, blue: under the glass) ----------
const mk = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const textCanvas = mk(W, H), tx2 = textCanvas.getContext('2d');
const advances = new Map();
// Draws `str` centred on cx one character at a time (advances measured on prefixes, so kerning survives).
function typeset(str, cx, y, font, track, each) {
  tx2.font = font; tx2.textAlign = 'left'; tx2.textBaseline = 'alphabetic';
  const key = font + '|' + str + '|' + track;
  if (!advances.has(key)) advances.set(key, Array.from({ length: str.length + 1 }, (_, i) => tx2.measureText(str.slice(0, i)).width + track * i));
  const adv = advances.get(key), x0 = cx - (adv[str.length] - track) / 2;
  for (let i = 0; i < str.length; i++) {
    const { a, dy } = each(i);
    if (a < 0.004 || str[i] === ' ') continue;
    tx2.globalAlpha = a; tx2.fillText(str[i], x0 + adv[i], y + dy);
  }
}
function paintText(S) {
  tx2.setTransform(1, 0, 0, 1, 0, 0); tx2.globalCompositeOperation = 'source-over'; tx2.globalAlpha = 1;
  tx2.fillStyle = '#000'; tx2.fillRect(0, 0, W, H);
  tx2.globalCompositeOperation = 'lighter';
  if (S.kicker > 0.004) {
    tx2.fillStyle = '#00f';
    typeset(KICKER, CX, CY + 23, `500 66px ${FONT}`, 1.5, () => ({ a: S.kicker, dy: 0 }));
  }
  tx2.fillStyle = '#f00'; tx2.font = `600 50px ${FONT}`; tx2.textAlign = 'center'; tx2.textBaseline = 'alphabetic';
  for (const l of S.labels) {
    if (l.a < 0.004) continue;
    tx2.globalAlpha = l.a; tx2.setTransform(l.scale, 0, 0, l.scale, l.x, l.y - 17);
    tx2.fillText(l.text, 0, 17);
  }
  tx2.setTransform(1, 0, 0, 1, 0, 0);
  tx2.globalAlpha = 1;
}

// ---------- the wordmark's signed-distance field (px, negative inside), W×H floats in canvas row order ----------
// Exact squared Euclidean distance transform (Felzenszwalb & Huttenlocher), in place.
function edt(grid, w, h) {
  const n = Math.max(w, h), f = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1), FAR = 1e20;
  const line = (start, stride, len) => {
    for (let q = 0; q < len; q++) f[q] = grid[start + q * stride];
    let k = 0; v[0] = 0; z[0] = -FAR; z[1] = FAR;
    for (let q = 1; q < len; q++) {
      let s;
      do { const r = v[k]; s = (f[q] - f[r] + q * q - r * r) / (2 * (q - r)); } while (s <= z[k] && --k > -1);
      k++; v[k] = q; z[k] = s; z[k + 1] = FAR;
    }
    k = 0;
    for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; const r = v[k]; grid[start + q * stride] = f[r] + (q - r) * (q - r); }
  };
  for (let x = 0; x < w; x++) line(x, w, h);
  for (let y = 0; y < h; y++) line(y * w, 1, w);
}
function titleField() {
  const SS = 2, Y0 = 110, ROWS = 760, w = W * SS, h = ROWS * SS, FAR = 1e20;   // a band around the word, drawn at 2×
  const c = mk(w, h), x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#000'; x.fillRect(0, 0, w, h);
  x.setTransform(SS, 0, 0, SS, 0, -Y0 * SS);
  x.fillStyle = '#fff'; x.font = `800 ${TITLE_PX}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.letterSpacing = '6px';
  // two centred lines; the ink block (first line's ascent to the second line's descent) is centred on TITLE_CY
  const boxes = TITLE.map(line => x.measureText(line));
  const blockH = boxes[0].actualBoundingBoxAscent + TITLE_LEAD + boxes[1].actualBoundingBoxDescent;
  const lines = TITLE.map((line, li) => {
    const box = boxes[li];
    const drawX = CX + (box.actualBoundingBoxLeft - box.actualBoundingBoxRight) / 2;
    const baseY = TITLE_CY - blockH / 2 + boxes[0].actualBoundingBoxAscent + li * TITLE_LEAD;
    x.fillText(line, drawX, baseY);
    return { line, box, drawX, baseY };
  });
  // one ellipse per group of letters, a little larger than its ink, for the blobs the switch swells into
  x.textAlign = 'left';
  const letters = TITLE_BLOBS.map(([li, from, to]) => {
    const { line, box, drawX, baseY } = lines[li];
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (let i = from; i < to; i++) {
      const ink = x.measureText(line[i]), left = drawX - box.width / 2 + x.measureText(line.slice(0, i)).width;
      x0 = Math.min(x0, left - ink.actualBoundingBoxLeft); x1 = Math.max(x1, left + ink.actualBoundingBoxRight);
      y0 = Math.min(y0, baseY - ink.actualBoundingBoxAscent); y1 = Math.max(y1, baseY + ink.actualBoundingBoxDescent);
    }
    return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, hw: Math.max(0.62 * (x1 - x0), 70), hh: 0.6 * (y1 - y0) };
  });
  const px = x.getImageData(0, 0, w, h).data, outer = new Float64Array(w * h), inner = new Float64Array(w * h);
  for (let i = 0; i < w * h; i++) {            // coverage-aware seeds give sub-pixel edges
    const a = px[i * 4] / 255;
    outer[i] = a >= 1 ? 0 : a <= 0 ? FAR : Math.pow(Math.max(0, 0.5 - a), 2);
    inner[i] = a >= 1 ? FAR : a <= 0 ? 0 : Math.pow(Math.max(0, a - 0.5), 2);
  }
  edt(outer, w, h); edt(inner, w, h);
  let band = new Float32Array(W * ROWS);
  for (let y = 0; y < ROWS; y++) for (let xx = 0; xx < W; xx++) {
    let s = 0;
    for (let j = 0; j < SS; j++) for (let i = 0; i < SS; i++) { const q = (y * SS + j) * w + xx * SS + i; s += Math.sqrt(outer[q]) - Math.sqrt(inner[q]); }
    band[y * W + xx] = s / (SS * SS * SS);
  }
  // a small Gaussian blur rounds the corners the way surface tension would, and smooths the gradient
  const SIGMA = 6.5, REACH = 18, KERNEL = Array.from({ length: 2 * REACH + 1 }, (_, i) => Math.exp(-((i - REACH) ** 2) / (2 * SIGMA * SIGMA)));
  const total = KERNEL.reduce((a, b) => a + b, 0);
  for (const [dx, dy] of [[1, 0], [0, 1]]) {
    const src = band; band = new Float32Array(W * ROWS);
    for (let y = 0; y < ROWS; y++) for (let xx = 0; xx < W; xx++) {
      let s = 0;
      for (let j = -REACH; j <= REACH; j++) s += KERNEL[j + REACH] * src[clamp(y + j * dy, 0, ROWS - 1) * W + clamp(xx + j * dx, 0, W - 1)];
      band[y * W + xx] = s / total;
    }
  }
  const field = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    const row = clamp(y - Y0, 0, ROWS - 1), away = Math.abs(y - Y0 - row);
    for (let xx = 0; xx < W; xx++) field[y * W + xx] = band[row * W + xx] + away;
  }
  return { field, letters };
}

// ---------- shaders ----------
const VERT = `#version 300 es
void main() { gl_Position = vec4(vec2((gl_VertexID << 1) & 2, gl_VertexID & 2) * 2. - 1., 0., 1.); }`;
const HEAD = `#version 300 es
precision highp float;
uniform vec2 uRes;
out vec4 o;
`;
const HASH = `
uint scramble(uint x) { x ^= x >> 16; x *= 0x7feb352dU; x ^= x >> 15; x *= 0x846ca68bU; x ^= x >> 16; return x; }
float h1(float i) { return float(scramble(uint(int(i)) + 0x9e3779b9U) >> 8) / 16777216.; }
float h2(vec2 i) { return float(scramble(uint(int(i.x)) * 0x27d4eb2dU + scramble(uint(int(i.y)) + 0x165667b1U)) >> 8) / 16777216.; }
float n1(float x) { float i = floor(x), f = x - i; f = f * f * (3. - 2. * f); return mix(h1(i), h1(i + 1.), f); }
float n2(vec2 p) {
  vec2 i = floor(p), f = p - i; f = f * f * (3. - 2. * f);
  return mix(mix(h2(i), h2(i + vec2(1., 0.)), f.x), mix(h2(i + vec2(0., 1.)), h2(i + vec2(1., 1.)), f.x), f.y);
}`;

const AURORA = HEAD + HASH + `
uniform float uT, uGain, uZoom, uUnder;
uniform vec3 uHem, uMid, uTop;
uniform sampler2D uTxt;
// 1-D noise that drifts in time by cross-fading between rows, so it has no lattice lines across the rays.
float n1t(float x, float t) { float i = floor(t), f = t - i; f = f * f * (3. - 2. * f); return mix(n1(x + i * 37.1), n1(x + i * 37.1 + 37.1), f); }
// One curtain: a folded hem line, brightest along the hem, with rays of uneven length rising from it.
// Returns brightness and height above the hem (in curtain heights).
vec2 curtain(vec2 q, float t, float sd, float base, float tilt, float amp, float hgt) {
  float x = q.x;
  float a1 = x * 1.7 + sd * 1.7 + t * .30, a2 = x * 3.9 - t * .46 + sd * 4.1, a3 = x * 8.3 + t * .70 + sd * 9.2;
  float yc = base + tilt * (x - .89) + amp * (.60 * sin(a1) + .28 * sin(a2) + .12 * sin(a3));
  float dy = tilt + amp * (1.02 * cos(a1) + 1.092 * cos(a2) + .996 * cos(a3));
  hgt *= 1. + 1.6 * (yc - base);                                              // the nearer (lower) part of a curtain stands taller
  float u = (yc - q.y) / hgt, up = max(u, 0.);
  float xr = x - (x - .89) * up * hgt * .22 + .012 * sin(up * 5. + x * 3. + t * .5 + sd);   // rays lean towards a point far overhead, and sway
  float reach = mix(1.5, 5.4, n1t(xr * 17. + sd * 7.3, t * .34 + sd));       // every ray climbs to its own height
  float prof = u > 0. ? exp(-u * reach) : .85 * exp(u * 34.) + .15 * exp(u * 9.);
  float fold = 1. + 1.1 * smoothstep(0., .8, abs(dy));                        // brighter where the sheet is seen edge-on

const GLASS = HEAD + `
uniform sampler2D uBg, uTxt, uSdf;
uniform vec4 uBox[6];

// that deep: fed to cap() with the same bevel, that makes a smooth lens with no pinch at the centre, whatever
// the bead's size. With dome = 0 it returns a close approximation to the true distance (for thick slabs).

float sdText(vec2 p) {

    vec2 g = slope > 1e-4 ? -grad / slope : vec2(0.);                   // outward direction on the page
    vec2 off = grad * uRefr;                                            // rays bend towards the inside of the shape
    float blurPx = uFrost > .01 ? exp2(uFrost) * .9 : 0.;

    const vec2 L2 = vec2(-.5812, -.8137);

const BRIGHT = HEAD + `
uniform sampler2D uSrc;
void main() {
  vec3 c = textureLod(uSrc, gl_FragCoord.xy / uRes, 2.).rgb;
  o = vec4(c * smoothstep(.85, 2.2, max(c.r, max(c.g, c.b))), 1.);

const BLUR = HEAD + `

const FINAL = HEAD + HASH + `
uniform sampler2D uScene, uGlowA, uGlowB, uTxt;

// ---------- WebGL plumbing ----------
const out = document.getElementById('c'), ctx = out.getContext('2d');
const glCanvas = mk(W, H);
const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, preserveDrawingBuffer: true });
if (!gl.getExtension('EXT_color_buffer_float')) console.error('half-float render targets are not available');

function program(frag) {
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, frag]]) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
    gl.attachShader(prog, sh);
  }
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i++) {
    const info = gl.getActiveUniform(prog, i), name = info.name.replace(/\[0\]$/, '');
    uniforms[name] = { at: gl.getUniformLocation(prog, name), type: info.type, size: info.size };
  }

}

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filterMin);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filterMag);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

}
// A half-float render target, optionally with a mip chain (used as cheap blur by the glass).
function target(w, h, mips) {

  gl.texStorage2D(gl.TEXTURE_2D, mips ? Math.floor(Math.log2(Math.max(w, h))) + 1 : 1, gl.RGBA16F, w, h);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

// Runs one full-frame pass of `prog` into `dst` (null: the WebGL canvas).
function pass(prog, dst, values) {
  const w = dst ? dst.w : W, h = dst ? dst.h : H;
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fbo : null);
  gl.viewport(0, 0, w, h);
  gl.useProgram(prog.prog);
  let unit = 0;
  for (const [name, value] of Object.entries({ uRes: [w, h], ...values })) {
    const u = prog.uniforms[name];
    if (!u) continue;
    if (u.type === gl.SAMPLER_2D) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, value); gl.uniform1i(u.at, unit++); }
    else if (u.type === gl.INT) gl.uniform1i(u.at, value);
    else if (u.type === gl.FLOAT) { if (u.size > 1) gl.uniform1fv(u.at, value); else gl.uniform1f(u.at, value); }

let P, RT, textTex, sdfTex, letterBlobs = [];
function setup() {
  P = { aurora: program(AURORA), glass: program(GLASS), bright: program(BRIGHT), blur: program(BLUR), final: program(FINAL) };
  RT = {
    sky: target(W, H, true), under: target(W, H, true), top: target(W, H, true),
    a1: target(W / 4, H / 4), a2: target(W / 4, H / 4), b1: target(W / 16, 68), b2: target(W / 16, 68),
  };
  textTex = texture(gl.LINEAR_MIPMAP_LINEAR);
  sdfTex = texture(gl.LINEAR);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.R16F, W, H);
  const word = titleField();
  letterBlobs = word.letters;
  gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.RED, gl.FLOAT, word.field);
  gl.bindVertexArray(gl.createVertexArray());
}
function glassValues(layer, bg, t, labelAlpha) {
  const box = new Float32Array(24), rad = new Float32Array(6), sq = new Float32Array(6);
  layer.boxes.forEach((b, i) => { box.set(b.slice(0, 4), i * 4); rad[i] = b[4]; sq[i] = b[5]; });
  return {
    uBg: bg, uTxt: textTex, uSdf: sdfTex, uBox: box, uRad: rad, uSq: sq, uCount: layer.boxes.length, uSplit: layer.split, uBlend: layer.blend, uStencil: layer.stencil, uT: t,
    uK: layer.k, uTextMix: layer.textMix, uSoft: layer.soft, uInflate: layer.inflate, uWob: layer.wob, uBevel: layer.bevel,
    uRefr: layer.refr, uDisp: layer.disp, uFrost: layer.frost, uMilk: layer.milk, uShadow: layer.shadow,
    uSpec: layer.spec, uTint: layer.tint, uGlint: layer.glint, uLabel: labelAlpha,

function render(t) {
  const S = stage(t);
  paintText(S);
  gl.bindTexture(gl.TEXTURE_2D, textTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
  gl.generateMipmap(gl.TEXTURE_2D);
  pass(P.aurora, RT.sky, { uT: t, uGain: S.gain, uZoom: S.zoom, uUnder: 1, uHem: S.pal.hem, uMid: S.pal.mid, uTop: S.pal.top, uTxt: textTex });
  pass(P.glass, RT.under, glassValues(S.layer1, RT.sky.tex, t, 1));
  let scene = RT.under;
  if (S.layer2.boxes.length) { pass(P.glass, RT.top, glassValues(S.layer2, RT.under.tex, t, 0)); scene = RT.top; }
  pass(P.bright, RT.a1, { uSrc: scene.tex });
  for (const step of [1, 2]) {
    pass(P.blur, RT.a2, { uSrc: RT.a1.tex, uDir: [step / RT.a1.w, 0] });
    pass(P.blur, RT.a1, { uSrc: RT.a2.tex, uDir: [0, step / RT.a1.h] });

  pass(P.blur, RT.b2, { uSrc: RT.a1.tex, uDir: [1 / RT.b1.w, 0] });
  pass(P.blur, RT.b1, { uSrc: RT.b2.tex, uDir: [0, 1 / RT.b1.h] });
  pass(P.final, null, { uScene: scene.tex, uGlowA: RT.a1.tex, uGlowB: RT.b1.tex, uTxt: textTex, uFade: S.fade });
  ctx.drawImage(glCanvas, 0, 0);
}

// ---------- the three entry points the pipeline calls ----------
window.ready = (async () => {
  await Promise.all([400, 500, 600, 800].map(weight => document.fonts.load(`${weight} 64px ${FONT}`, KICKER + TITLE.join('') + LABELS.join(''))));
  await document.fonts.ready;
  setup();
})();
window.draw = ({ t }) => { render(t); return out.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// Sound cues for audio.py.
window.events = () => [
  { t: 0, k: 'pad' },
  { t: T.bead + 0.1, k: 'glide', d: 0.6 },
  { t: T.bead + 0.64, k: 'land' },
  { t: T.split, k: 'split' },
  { t: T.split + 0.27, k: 'bead', i: 0 },
  { t: T.split + 0.36, k: 'bead', i: 1 },
  { t: T.pill, k: 'merge' },
  ...LABELS.map((_, i) => ({ t: T.labels + 0.08 * i, k: 'label', i })),
  { t: T.thumb, k: 'select', i: 0 },
  { t: T.slide1, k: 'slide' }, { t: T.slide1 + 0.34, k: 'select', i: 1 },
  { t: T.slide2, k: 'slide' }, { t: T.slide2 + 0.34, k: 'select', i: 2 },
  { t: T.clear, k: 'clear' },
  { t: T.morph, k: 'morph', d: T.title - T.morph },
  { t: T.title, k: 'title' },
  { t: T.glint, k: 'glint', d: 0.8 },
  { t: T.fade, k: 'fade', d: 0.66 },
];
