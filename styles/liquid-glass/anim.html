<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}#g{display:none}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="g" width="1920" height="1080"></canvas>
<script>
// ── liquid-glass · premium product reveal in refractive glass ─────────────────────────────────────
// A glass drop pops in over a slow, saturated aurora → stretches into a pill that reads "Meet Focus." →
// the pill splits like liquid into three widgets (timer ring, Focus-mode card with toggle, notification pill) →
// the toggle flips and the notification pill is pulled into the card (metaball merge) → everything gathers into
// one wide slab for the tagline "Less noise. More you." → the slab collapses into a single glowing orb → fade.
// Glass is a WebGL2 SDF shader: shapes are rounded boxes blended with a smooth union (liquid merges), the
// background is procedural (gaussian blobs + silk ribbons) so its blur is analytic (σ' = √(σ²+b²)) and refraction
// is just re-sampling it at displaced coordinates (per channel → chromatic edge). Springs drive every move.
// Typography/icons are drawn in 2D on top. The frame depends only on t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const gc = document.getElementById('g');
const gl = gc.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, premultipliedAlpha: false });
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const FONT = '"Inter Tight"';

// damped spring step response (0 → 1 with gentle overshoot)
function spring(u, f = 1.6, z = 0.62) {
  if (u <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u));
}
// keyframed state where each change is a spring superposed on the previous ones
function track(init, keys) {
  return t => {
    const out = { ...init }, tgt = { ...init };
    for (const [tk, st, f = 1.6, z = 0.62] of keys) {
      const s = spring(t - tk, f, z);
      for (const k in st) { out[k] += (st[k] - tgt[k]) * s; tgt[k] = st[k]; }
    }
    return out;
  };
}

// ── timeline ──
const T = {
  orb: 0.30, pre: 0.86, pill: 0.98, title: 1.12, sweep1: 1.55, titleOut: 2.28,
  split: 2.52, ring: 3.0, toggle: 3.72, merge: 4.25, row: 4.95,
  contentOut: 5.42, gather: 5.62, tag1: 6.05, tag2: 6.38, sweep2: 6.85, tagOut: 7.62,
  squash: 7.86, collapse: 8.04, word: 8.62, fadeA: 9.25, fadeB: 9.97
};
const CX = 960, CY = 540;
const ORB = { cx: CX, cy: CY, hw: 72, hh: 72, r: 72, a: 1 };
const HID = { cx: CX, cy: CY, hw: 0, hh: 0, r: 0, a: 1 };
const PILL = { cx: CX, cy: CY, hw: 540, hh: 122, r: 122 };
const TIMER = { cx: 560, cy: 585, hw: 205, hh: 205, r: 205 };
const CARD = { cx: 1190, cy: 650, hw: 335, hh: 165, r: 58 };
const CARD2 = { cx: 1190, cy: 620, hw: 335, hh: 205, r: 58 };
const NOTE = { cx: 1250, cy: 300, hw: 270, hh: 54, r: 54 };
const SLAB = { cx: CX, cy: CY, hw: 640, hh: 180, r: 96 };
const SQ = { cx: CX, cy: CY + 6, hw: 690, hh: 150, r: 96 };
const END = { cx: CX, cy: 500, hw: 100, hh: 100, r: 100 };
const intro = [[T.orb, ORB, 1.9, 0.45], [T.pre, { hw: 62, hh: 62, r: 62 }, 3, 0.8], [T.pill, PILL, 1.35, 0.55]];
const outro = [[T.gather, SLAB, 1.3, 0.62], [T.squash, SQ, 3, 0.8], [T.collapse, END, 1.7, 0.7], [T.fadeA, { hw: 84, hh: 84, r: 84 }, 1, 0.9]];
const shapes = [
  track(HID, [...intro, [T.split, TIMER, 1.45, 0.58], ...outro]),                                    // timer
  track(HID, [...intro, [T.split + .09, CARD, 1.45, 0.58], [T.merge + .12, CARD2, 1.5, 0.6], ...outro]),  // card
  track(HID, [...intro, [T.split + .18, NOTE, 1.45, 0.58], [T.merge, { cx: 1195, cy: 470, hw: 230, hh: 46, r: 46 }, 1.3, 0.7],
    [T.merge + .32, { cx: 1190, cy: 560, hw: 150, hh: 30, r: 30 }, 1.3, 0.8], [T.merge + .7, { a: 0 }, 2, 0.95]]),
];
// the notification pill leaves the intro once it has been absorbed
const shapeAt = t => shapes.map((f, i) => { const s = f(t); if (i === 2 && t > T.merge + 1.4) s.a = 0; return s; });
const tints = t => {
  const on = spring(t - T.toggle, 1.4, 0.8) * (1 - seg(t, T.contentOut, T.gather + .3));
  return [[0.55, 0.85, 1.0, 0.05], [0.35, 1.0, 0.75, 0.05 + 0.16 * on], [1.0, 0.55, 0.8, 0.05]];
};

// ── WebGL glass ──
const VS = `#version 300 es
in vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }`;
const FS = `#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes; uniform float uT;
uniform vec4 uS[3]; uniform vec4 uP[3]; uniform vec4 uTint[3];
uniform float uK, uFrost, uRefr, uGlow, uSweep, uSweepA, uLa, uFade, uBgIn;
const vec3 BASE0 = vec3(0.008, 0.010, 0.05), BASE1 = vec3(0.035, 0.006, 0.06);
vec3 blobCol(int i){
  if(i==0) return vec3(0.10,0.26,1.00)*1.05;
  if(i==1) return vec3(0.52,0.10,0.95)*0.95;
  if(i==2) return vec3(1.00,0.14,0.52)*0.85;
  if(i==3) return vec3(1.00,0.42,0.08)*0.75;
  if(i==4) return vec3(0.00,0.72,0.95)*0.70;
  return vec3(0.25,0.08,0.70)*0.9;
}
vec3 blob(int i, float t){ // x, y, sigma
  float fi = float(i);
  vec2 c = vec2(0.5 + 0.34*sin(t*0.23 + fi*2.1) + 0.08*sin(t*0.51 + fi*4.3), 0.5 + 0.30*cos(t*0.19 + fi*1.37) + 0.07*sin(t*0.43 + fi));
  float s = 300. + 110.*sin(fi*1.9 + 0.7);
  return vec3(c * vec2(1920., 1080.), s);
}
float ribY(int i, float x, float t){
  float fi = float(i);
  return 1080.*(0.20 + 0.19*fi) + 110.*sin(x*0.0029 + fi*1.7 + t*0.32) + 45.*sin(x*0.0067 - t*0.47 + fi*2.3);
}
vec3 bg(vec2 p, float b){
  vec3 col = mix(BASE0, BASE1, p.y/1080. + 0.2*sin(p.x*0.001));
  for(int i=0;i<6;i++){
    vec3 bl = blob(i, uT);
    float s2 = bl.z*bl.z + b*b; vec2 d = p - bl.xy;
    col += blobCol(i) * 0.78 * (bl.z*bl.z/s2) * exp(-dot(d,d)/(2.*s2)) * uBgIn;
  }
  for(int i=0;i<5;i++){
    float y = ribY(i, p.x, uT);
    float slope = (ribY(i, p.x + 4., uT) - y) / 4.;
    float dy = abs(p.y - y) / sqrt(1. + slope*slope);
    float w = 1.1 + 0.5*float(i%3);
    float e = 1.0 + b*1.2;
    float core = (w/(w + b*0.35)) * (1. - smoothstep(w, w + e, dy));
    float gw = 26. + b;
    float glow = exp(-dy*dy/(2.*gw*gw)) * (26./gw);
    vec3 rc = mix(vec3(1.0,0.85,0.95), vec3(0.75,0.9,1.0), float(i%2));
    float fade = 0.55 + 0.45*sin(p.x*0.0021 + float(i)*2.4 + uT*0.3);
    col += rc * (core*0.62 + glow*0.12) * fade * uBgIn;
  }
  return col;
}
float sdBox(vec2 p, vec2 bb, float r){ vec2 q = abs(p) - bb + r; return length(max(q, 0.)) + min(max(q.x, q.y), 0.) - r; }
float smin(float a, float b, float k){ float h = max(k - abs(a - b), 0.) / k; return min(a, b) - h*h*k*0.25; }
float shapeD(int i, vec2 p){ vec4 s = uS[i]; vec4 q = uP[i]; vec2 hb = max(s.zw, vec2(0.01)); float r = min(q.x, min(hb.x, hb.y)); return sdBox(p - s.xy, hb, r) + (1. - q.y)*3000. + (s.z < 0.5 ? 3000. : 0.); }
float scene(vec2 p){ float d = shapeD(0, p); for(int i=1;i<3;i++) d = smin(d, shapeD(i, p), uK); return d; }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uT*0.0) * 43758.5453); }
vec3 tone(vec3 c){ return 1. - exp(-c*1.25); }
void main(){
  vec2 p = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  float di[3]; float dm = 1e9;
  for(int i=0;i<3;i++){ di[i] = shapeD(i, p); dm = min(dm, di[i]); }
  float D = di[0]; for(int i=1;i<3;i++) D = smin(D, di[i], uK);
  vec3 outc = bg(p, 0.);
  // soft contact + drop shadow
  float Ds = scene(p - vec2(0., 30.));
  outc *= 1. - 0.42*exp(-max(Ds, 0.)/55.) - 0.12*exp(-max(D, 0.)/160.);
  vec3 glowC = vec3(0.50, 0.78, 1.0);
  outc += glowC * uGlow * (0.75*exp(-max(D,0.)/60.) + 0.45*exp(-max(D,0.)/240.));
  vec3 col = outc;
  if (D < 2.) {
    vec2 e = vec2(1., 0.);
    vec2 g = vec2(scene(p + e.xy) - scene(p - e.xy), scene(p + e.yx) - scene(p - e.yx));
    g = g / max(length(g), 1e-5);
    float ws = 0.; vec4 tint = vec4(0.); float bev = 0.;
    for(int i=0;i<3;i++){
      float w = exp(-(di[i] - dm)/18.) * uP[i].y * step(0.5, uS[i].z);
      ws += w; tint += uTint[i]*w; bev += w * min(uP[i].z, 0.92*min(uS[i].z, uS[i].w));
    }
    tint /= max(ws, 1e-5); bev = max(bev / max(ws, 1e-5), 8.);
    float x = clamp(-D / bev, 0., 1.);
    float edge = 1. - x;
    // circular bevel: slope grows toward the rim
    float h = sqrt(max(1. - edge*edge, 0.02));
    float slope = min(edge / h, 4.);
    float disp = uRefr * slope * 0.32 + 10.*x;
    vec2 q = p - g * disp;
    float fr = uFrost * (0.45 + 0.55*x);
    float ca = 0.10 + 0.25*edge;
    vec3 rc = vec3(bg(q + g*disp*ca, fr).r, bg(q, fr).g, bg(q - g*disp*ca, fr).b);
    vec3 c = mix(rc, tint.rgb * 0.9, tint.a);
    c = c * 1.04 + vec3(0.016, 0.018, 0.026);
    vec2 L = vec2(cos(uLa), sin(uLa));
    float ndl = dot(g, L);
    float rim = pow(edge, 2.6) * (1.25*pow(max(ndl, 0.), 1.4) + 0.55*pow(max(-ndl, 0.), 1.4));
    c += vec3(0.95, 0.97, 1.0) * rim;
    c *= 1. - 0.22*pow(edge, 1.6)*max(-ndl, 0.)*(1. - edge);
    float line = smoothstep(2.2, 0.2, abs(D + 1.3));
    c += vec3(1.) * line * (0.22 + 1.2*pow(max(ndl, 0.), 1.2) + 0.55*pow(max(-ndl, 0.), 1.2));
    // top sheen
    c += vec3(1.) * 0.05 * smoothstep(0.2, 1., -g.y) * pow(edge, 1.5);
    // light sweep
    vec2 sd = normalize(vec2(1., -0.42));
    float u = (dot(p, sd) - uSweep);
    float sw = exp(-u*u/(2.*120.*120.)) * 0.16 + exp(-u*u/(2.*26.*26.)) * 0.30;
    c += vec3(1.) * sw * uSweepA * (0.5 + 0.5*x);
    // emissive orb
    c += glowC * uGlow * (0.55 + 1.0*pow(x, 0.7)) + vec3(1.)*uGlow*0.10*pow(x, 2.);
    col = mix(outc, c, smoothstep(1., -1., D));
  }
  col = tone(col) * uFade;
  col += (hash(p) - 0.5) / 255. * 1.5;
  o = vec4(col, 1.);
}`;
let prog, U = {};
function initGL() {
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  for (const n of ['uRes', 'uT', 'uS', 'uP', 'uTint', 'uK', 'uFrost', 'uRefr', 'uGlow', 'uSweep', 'uSweepA', 'uLa', 'uFade', 'uBgIn']) U[n] = gl.getUniformLocation(prog, n);
  gl.viewport(0, 0, W, H);
}
const sweepPos = u => lerp(-300, 2300, u);   // along (1,-0.42) direction projection
function glass(t, S) {
  gl.uniform2f(U.uRes, W, H); gl.uniform1f(U.uT, t + 12.0);
  gl.uniform4fv(U.uS, S.flatMap(s => [s.cx, s.cy, s.hw, s.hh]));
  gl.uniform4fv(U.uP, S.flatMap(s => [s.r, s.a, 58, 0]));
  gl.uniform4fv(U.uTint, tints(t).flat());
  gl.uniform1f(U.uK, 1 + 89 * eOut(seg(t, T.split - .02, T.split + .2)) * (1 - eInOut(seg(t, T.gather + .5, T.gather + 1.1))));
  gl.uniform1f(U.uFrost, 7);
  gl.uniform1f(U.uRefr, 105);
  const glow = seg(t, T.collapse + .15, T.collapse + .9) * (1 - 0.35 * seg(t, T.fadeA, T.fadeB));
  gl.uniform1f(U.uGlow, 0.9 * eInOut(glow) + 0.18 * Math.max(0, 1 - Math.abs(t - T.orb - .1) / .4) * (t < T.pill ? 1 : 0));
  // two light sweeps across the glass
  let sw = 0, sa = 0;
  const s1 = seg(t, T.sweep1, T.sweep1 + .9), s2 = seg(t, T.sweep2, T.sweep2 + 1.0);
  if (s1 > 0 && s1 < 1) { sw = sweepPos(eInOut(s1)); sa = Math.sin(Math.PI * s1); }
  if (s2 > 0 && s2 < 1) { sw = sweepPos(eInOut(s2)); sa = Math.sin(Math.PI * s2); }
  gl.uniform1f(U.uSweep, sw); gl.uniform1f(U.uSweepA, sa);
  const vx = (shapes[0](t + 1 / 60).cx - shapes[0](t - 1 / 60).cx) * 30;   // light tilts with motion
  gl.uniform1f(U.uLa, -2.2 + 0.35 * Math.sin(t * 0.45) + 0.25 * seg(t, 2.4, 5.6) + clamp(vx * 0.0007, -0.5, 0.5));
  gl.uniform1f(U.uFade, 1);
  gl.uniform1f(U.uBgIn, 0.25 + 0.75 * eOut(seg(t, 0, 1.2)));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ── 2D typography & icons ──
function setFont(size, weight, tr = -0.028) { ctx.font = `${weight} ${size}px ${FONT}`; ctx.letterSpacing = `${(tr * size).toFixed(2)}px`; }
// per-letter staggered spring reveal (rise + un-blur + fade)
function letters(str, x, y, o) {
  const { size, weight = 700, align = 'center', t0, stagger = 0.035, t, alpha = 1, fill = '#fff', rise = 0.5, out = 1 } = o;
  setFont(size, weight);
  const total = ctx.measureText(str).width;
  let x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < str.length; i++) {
    const ch = str[i]; if (ch === ' ') continue;
    const px = x0 + (i ? ctx.measureText(str.slice(0, i)).width : 0);
    const u = t - t0 - i * stagger;
    if (u <= 0) continue;
    const s = spring(u, 1.7, 0.6), a = clamp(u / 0.22) * alpha * out;
    if (a <= 0.003) continue;
    const bl = (1 - clamp(u / 0.3)) * size * 0.08;
    ctx.save();
    ctx.globalAlpha = a;
    if (bl > 0.3) ctx.filter = `blur(${bl.toFixed(1)}px)`;
    ctx.translate(px, y + (1 - s) * size * rise);
    ctx.fillStyle = typeof fill === 'function' ? fill(px - x0, total) : fill;
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }
}
function text(str, x, y, size, weight, color, align = 'left', alpha = 1, tr) {
  if (alpha <= 0.003) return;
  setFont(size, weight, tr ?? (size < 32 ? -0.01 : -0.028)); ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.globalAlpha = 1;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function moon(x, y, r, col) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip();
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.arc(x + r * .55, y - r * .42, r * .82, 0, TAU); ctx.fillStyle = col; ctx.fill('evenodd'); ctx.restore();
}
function chatIcon(x, y, s, a) {
  ctx.save(); ctx.globalAlpha = a;
  const g = ctx.createLinearGradient(x - s, y - s, x + s, y + s); g.addColorStop(0, '#ff8a5c'); g.addColorStop(1, '#ff3d7f');
  rrect(x - s, y - s, 2 * s, 2 * s, s * .46); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(x, y - s * .06, s * .56, s * .44, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x - s * .34, y + s * .2); ctx.lineTo(x - s * .5, y + s * .52); ctx.lineTo(x - s * .05, y + s * .32); ctx.fill();
  ctx.restore();
}
function shadowOn(b = 18, a = .22) { ctx.shadowColor = `rgba(10,5,40,${a})`; ctx.shadowBlur = b; ctx.shadowOffsetY = b * .25; }
function shadowOff() { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; }

function overlay(t, S) {
  // ── S1: "Meet Focus." inside the pill ──
  if (t < T.split + .2) {
    const out = 1 - eOut(seg(t, T.titleOut, T.titleOut + .3));
    const lift = -40 * eInOut(seg(t, T.titleOut, T.titleOut + .3));
    ctx.save(); shadowOn(24, .25);
    if (out < 1) ctx.filter = `blur(${((1 - out) * 10).toFixed(1)}px)`;
    letters('Meet Focus.', CX, CY + 52 + lift, { size: 150, weight: 700, t0: T.title, stagger: 0.04, t, out });
    ctx.restore(); shadowOff();
  }
  // ── S2: widgets ──
  const cIn = t0 => clamp((t - t0) / 0.35) * (1 - seg(t, T.contentOut, T.contentOut + .25));
  const [A, B, C] = S;
  // timer ring
  const aT = cIn(T.split + .38);
  if (aT > 0) {
    const R = 150 * (A.hw / 205), x = A.cx, y = A.cy;
    ctx.save(); ctx.globalAlpha = aT;
    ctx.lineCap = 'round'; ctx.lineWidth = 16;
    ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.stroke();
    const pr = 0.72 * eInOut(seg(t, T.ring, T.ring + 1.3)) + 0.01;
    const a0 = -Math.PI / 2, a1 = a0 + TAU * pr;
    const gr = ctx.createConicGradient(a0, x, y); gr.addColorStop(0, '#9fd8ff'); gr.addColorStop(0.72, '#ffffff'); gr.addColorStop(1, '#9fd8ff');
    shadowOn(20, .0); ctx.shadowColor = 'rgba(160,220,255,0.8)';
    ctx.strokeStyle = gr; ctx.beginPath(); ctx.arc(x, y, R, a0, a1); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + R * Math.cos(a1), y + R * Math.sin(a1), 11, 0, TAU); ctx.fill();
    shadowOff(); ctx.restore();
    // countdown: 25:00 → 24:5x while ring fills
    const secs = 1500 - Math.max(0, Math.floor(t - T.ring - 0.6));   // ticks once per second
    const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
    ctx.save(); shadowOn(16, .2);
    ctx.font = `600 92px ${FONT}`; ctx.letterSpacing = '-3px'; ctx.fontVariantNumeric = 'tabular-nums';
    ctx.textAlign = 'center'; ctx.globalAlpha = aT; ctx.fillStyle = '#fff'; ctx.fillText(`${mm}:${ss}`, x, y + 22);
    ctx.restore(); shadowOff();
    text('DEEP WORK', x, y + 74, 21, 650, 'rgba(255,255,255,0.8)', 'center', aT, 0.14);
  }
  // Focus mode card
  const aC = cIn(T.split + .46);
  if (aC > 0) {
    const L = B.cx - B.hw, Tp = B.cy - B.hh, Rt = B.cx + B.hw;
    ctx.save(); shadowOn(16, .2);
    letters('Focus mode', L + 56, Tp + 104, { size: 58, weight: 700, align: 'left', t0: T.split + .46, stagger: 0.022, t, out: 1 - seg(t, T.contentOut, T.contentOut + .25) });
    ctx.restore(); shadowOff();
    text('Only what matters gets through.', L + 57, Tp + 150, 27, 450, 'rgba(255,255,255,0.74)', 'left', aC);
    // toggle
    const on = spring(t - T.toggle, 2.0, 0.55);
    const onC = clamp(spring(t - T.toggle, 1.6, 0.9));
    const tw = 132, th = 78, tx = Rt - 56 - tw, ty = Tp + 44;
    ctx.save(); ctx.globalAlpha = aC;
    rrect(tx, ty, tw, th, th / 2); ctx.fillStyle = 'rgba(255,255,255,0.20)'; ctx.fill();
    if (onC > 0) { ctx.globalAlpha = aC * onC; const g = ctx.createLinearGradient(tx, 0, tx + tw, 0); g.addColorStop(0, '#2fe39a'); g.addColorStop(1, '#27c7c0'); ctx.fillStyle = g; rrect(tx, ty, tw, th, th / 2); ctx.fill(); ctx.globalAlpha = aC; }
    const vel = Math.abs(spring(t - T.toggle + .02, 2.0, .55) - spring(t - T.toggle - .02, 2.0, .55)) / .04;
    const kr = 32, kw = kr + Math.min(vel * 9, 18);
    const kx = lerp(tx + 7 + kr, tx + tw - 7 - kr, on);
    shadowOn(12, .35); ctx.fillStyle = '#fff'; rrect(kx - kw, ty + th / 2 - kr, kw * 2, kr * 2, kr); ctx.fill(); shadowOff();
    ctx.restore();
    // absorbed notification row
    const aR = clamp((t - T.row) / .35) * (1 - seg(t, T.contentOut, T.contentOut + .25));
    if (aR > 0) {
      const ry = B.cy + B.hh - 78, s = spring(t - T.row, 1.7, .6);
      ctx.save(); ctx.globalAlpha = aR; ctx.translate(0, (1 - s) * 22);
      rrect(L + 40, ry - 40, B.hw * 2 - 80, 84, 42); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
      ctx.fillStyle = 'rgba(40,20,90,0.35)'; ctx.beginPath(); ctx.arc(L + 86, ry + 2, 26, 0, TAU); ctx.fill();
      moon(L + 86, ry + 2, 15, '#ffd66e');
      ctx.restore();
      text('Notifications silenced', L + 130, ry + 12, 28, 600, '#fff', 'left', aR);
      text('until 11:00', Rt - 66, ry + 12, 26, 450, 'rgba(255,255,255,0.66)', 'right', aR);
    }
  }
  // notification pill
  if (C.a > 0.5 && t < T.merge + .5) {
    const aN = clamp((t - T.split - .5) / .3) * (1 - seg(t, T.merge - .05, T.merge + .18));
    if (aN > 0) {
      const L = C.cx - C.hw;
      chatIcon(L + 56, C.cy, 26, aN);
      text('Team chat', L + 100, C.cy - 4, 26, 650, '#fff', 'left', aN);
      text('3 new messages', L + 100, C.cy + 28, 24, 450, 'rgba(255,255,255,0.72)', 'left', aN);
      text('now', C.cx + C.hw - 36, C.cy - 4, 22, 500, 'rgba(255,255,255,0.6)', 'right', aN);
    }
  }
  // ── S3: tagline on the slab ──
  if (t > T.tag1 - .1 && t < T.collapse + .4) {
    const out = 1 - eOut(seg(t, T.tagOut, T.tagOut + .3));
    const blur = (1 - out) * 12, lift = -30 * eInOut(seg(t, T.tagOut, T.tagOut + .3));
    ctx.save(); shadowOn(24, .25); if (blur > .3) ctx.filter = `blur(${blur.toFixed(1)}px)`;
    letters('Less noise.', CX, CY - 12 + lift, { size: 124, weight: 700, t0: T.tag1, stagger: 0.035, t, out });
    const grad = (px, tot) => { const g = ctx.createLinearGradient(-px, 0, tot - px, 0); g.addColorStop(0, '#ffffff'); g.addColorStop(0.5, '#d9ecff'); g.addColorStop(1, '#ffd3ec'); return g; };
    letters('More you.', CX, CY + 118 + lift, { size: 124, weight: 700, t0: T.tag2, stagger: 0.04, t, out, fill: grad });
    ctx.restore(); shadowOff();
  }
  // ── S4: wordmark under the orb ──
  if (t > T.word) {
    ctx.save();
    letters('Focus', CX, 718, { size: 64, weight: 650, t0: T.word, stagger: 0.05, t, rise: .4, alpha: 0.95 });
    ctx.restore();
    text('Available this fall', CX, 768, 26, 450, 'rgba(255,255,255,0.62)', 'center', clamp((t - T.word - .35) / .4));
  }
}

function render(t) {
  const S = shapeAt(t);
  glass(t, S);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.drawImage(gc, 0, 0);
  overlay(t, S);
  // open from black, close to black
  const fade = Math.max(1 - eOut(seg(t, 0, 0.7)), eInOut(seg(t, T.fadeA, T.fadeB)));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

window.ready = (async () => {
  await Promise.all([450, 500, 600, 650, 700].map(w => document.fonts.load(`${w} 100px ${FONT}`, 'Meet Focus. Less noise. More you. 0123456789:')));
  await document.fonts.ready;
  initGL(); render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [
    { t: T.orb, k: 'drop' }, { t: T.pill - .04, k: 'whoosh', d: .55 }, { t: T.sweep1, k: 'shimmer' },
    { t: T.titleOut, k: 'whoosh', d: .4, v: .5 }, { t: T.split, k: 'swish' },
    { t: T.split + .38, k: 'tap', f: 880 }, { t: T.split + .47, k: 'tap', f: 1175 }, { t: T.split + .56, k: 'tap', f: 1320 },
    { t: T.ring, k: 'rise', d: 1.3 }, { t: T.toggle, k: 'click' }, { t: T.toggle + .05, k: 'chime', f: 1318 },
    { t: T.merge + .1, k: 'bloop' }, { t: T.row, k: 'tap', f: 988 },
    { t: T.gather - .05, k: 'whoosh', d: .7 }, { t: T.tag1, k: 'chime', f: 1047 }, { t: T.tag2, k: 'chime', f: 1568 },
    { t: T.sweep2, k: 'shimmer' }, { t: T.tagOut, k: 'whoosh', d: .4, v: .5 },
    { t: T.collapse, k: 'suck' }, { t: T.collapse + .32, k: 'chord' }
  ];
  const tick = (t0, n, st) => { for (let i = 0; i < n; i++) ev.push({ t: t0 + i * st + 0.02, k: 'tick', v: 0.5 + 0.5 * ((i * 7) % 5) / 5 }); };
  tick(T.title, 10, 0.04); tick(T.tag1, 10, 0.035); tick(T.tag2, 8, 0.04); tick(T.word, 5, 0.05);
  return ev.sort((a, b) => a.t - b.t);
};
</script>
