<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head>
<body style="margin:0;background:#05090c"><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  hud — a cold, neon-free sci-fi interface. window.draw({t}) → JPEG base64
//  Story: the HUD boots → head-on docking reticle, the ARGO RING port drifts
//  off-axis while three warnings flash → stepped RCS corrections pull it onto
//  the crosshair, warnings resolve to green → the port turns edge-on and the
//  view becomes a side schematic → contact, four clamps lock →
//  DOCKING COMPLETE → the interface powers down to a dot.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, CX = 960, CY = 540, DUR = 9.8;
const cv = document.getElementById('c'); const mctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const LAYER = mk(W, H); const ctx = LAYER.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x, eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const ICE = [160, 208, 226], WH = '#eef6fa';
const ice = a => `rgba(${ICE[0]},${ICE[1]},${ICE[2]},${a})`, wh = a => `rgba(238,246,250,${a})`;
const amb = a => `rgba(232,172,96,${a})`, grn = a => `rgba(128,222,168,${a})`;
const DISP = "'Chakra Petch', sans-serif", MONO = "'Martian Mono', monospace";
function F(size, w, fam, ls = 0) { ctx.font = `${w} ${size}px ${fam}`; ctx.letterSpacing = ls + 'px'; }

// ── timeline ─────────────────────────────────────────────────────────────────
const T = { ring0: 0.2, pan0: 0.9, app0: 0.9, app1: 4.9, ok: 4.55, fold0: 4.9, fold1: 5.5, side0: 5.3, fin0: 5.85, contact: 6.6,
  clamp0: 6.75, done: 7.4, off0: 8.85, off1: 9.5, end: 9.8 };
const RCS = [1.5, 2.2, 2.9, 3.5, 4.0];                    // thruster pulses: each starts one correction step
const OFFK = [1, 0.74, 0.47, 0.22, -0.07, 0], ROLLK = [14, 10.5, 6.2, 2.8, 0.9, 0];
const stepped = (t, K) => { let v = K[0]; for (let i = 0; i < RCS.length; i++) v = lerp(v, K[i + 1], eOut(seg(t, RCS[i], RCS[i] + 0.55))); return v; };
const offF = t => stepped(t, OFFK), rollD = t => stepped(t, ROLLK);
const WARN = [ // status rows: warnings that resolve to green
  { lab: 'CLOSING RATE', on: 1.7, ok: 2.95 },
  { lab: 'LATERAL OFFSET', on: 1.95, ok: 4.15 },
  { lab: 'ROLL ALIGNMENT', on: 2.2, ok: 4.4 },
];
const CLAMPS = ['A', 'B', 'C', 'D'].map((n, i) => ({ n, t: T.clamp0 + i * 0.15, deg: 45 + i * 90 }));
function range(t) {
  if (t < T.fin0) return lerp(240, 12, eIO(seg(t, T.app0, T.app1))) - 2.6 * seg(t, T.app1, T.fin0);
  return lerp(9.4, 0, eOut(seg(t, T.fin0, T.contact)) * 0.35 + 0.65 * seg(t, T.fin0, T.contact) ** 1.6);
}
function rate(t) {
  if (t < 1.5) return 1.92;
  if (t < 2.95) return lerp(1.92, 0.38, eIO(seg(t, 1.5, 2.95)));
  if (t < T.contact) return lerp(0.38, 0.06, seg(t, 2.95, T.contact));
  return 0;
}
const blink = t => (Math.floor(t * 4) % 2 === 0) ? 1 : 0.35;

// sound events for audio.py
window.events = () => {
  const E = [];
  [0.2, 0.32, 0.44, 0.56, 0.68].forEach(t => E.push({ t, k: 'tick' }));
  [1.0, 1.1, 1.2, 1.3].forEach(t => E.push({ t, k: 'blip' }));
  WARN.forEach(w => { E.push({ t: w.on, k: 'warn' }); E.push({ t: w.ok, k: 'ok' }); });
  for (let t = 2.45; t < 4.4; t += 0.5) E.push({ t, k: 'beep' });
  RCS.forEach(t => E.push({ t, k: 'rcs' }));
  E.push({ t: T.ok, k: 'ping' }, { t: T.fold0, k: 'sweep' }, { t: T.side0, k: 'scan' }, { t: T.contact, k: 'thud' });
  CLAMPS.forEach(c => E.push({ t: c.t, k: 'clunk' }));
  E.push({ t: T.done, k: 'chime' }, { t: T.off0, k: 'down' });
  return E.sort((a, b) => a.t - b.t);
};

// ── helpers ──────────────────────────────────────────────────────────────────
function arcAt(x, y, r, a0, a1, lw, col) { if (a1 <= a0) return; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.stroke(); }
const arc = (r, a0, a1, lw, col) => arcAt(CX, CY, r, a0, a1, lw, col);
function line(x0, y0, x1, y1, lw, col) { ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.stroke(); }
function rect(x, y, w, h, lw, col) { ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.strokeRect(x, y, w, h); }
const GLY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function decode(str, p, t, seed = 0) {
  if (p >= 1) return str; if (p <= 0) return '';
  const n = str.length, shown = Math.ceil(n * clamp(p * 1.4)); let out = '';
  for (let i = 0; i < shown; i++) { const lock = p > 0.3 + 0.7 * i / n;
    out += lock || str[i] === ' ' ? str[i] : GLY[Math.floor(hash(i * 13 + Math.floor(t * 24) * 7 + seed) * GLY.length)]; }
  return out; }
function ringVis(t, tin, tout) { return { a: eOut(seg(t, tin, tin + 0.55)), e: eIO(seg(t, tout, tout + 0.45)) }; }
function warnTri(x, y, s, col) { if (s <= 0) return; ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.95, y + s * 0.7); ctx.lineTo(x - s * 0.95, y + s * 0.7); ctx.closePath();
  ctx.lineWidth = 1.5; ctx.strokeStyle = col; ctx.stroke(); line(x, y - s * 0.4, x, y + s * 0.2, 1.5, col); ctx.fillStyle = col; ctx.fillRect(x - 1, y + s * 0.35, 2, 2); }
function check(x, y, s, col, p = 1) { if (p <= 0) return; ctx.beginPath(); ctx.moveTo(x - s, y); const q = Math.min(1, p * 2);
  ctx.lineTo(lerp(x - s, x - s * 0.35, q), y + s * 0.6 * q);
  if (p > 0.5) ctx.lineTo(lerp(x - s * 0.35, x + s, (p - 0.5) * 2), lerp(y + s * 0.6, y - s * 0.7, (p - 0.5) * 2)); ctx.lineWidth = 2; ctx.strokeStyle = col; ctx.stroke(); }

// ── static layer: dot grid + vignette ───────────────────────────────────────
let BG;
function prep() {
  BG = mk(W, H); const g = BG.getContext('2d');
  g.fillStyle = '#05090c'; g.fillRect(0, 0, W, H);
  const r = g.createRadialGradient(CX, CY, 50, CX, CY, 1100); r.addColorStop(0, 'rgba(40,70,85,0.28)'); r.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = r; g.fillRect(0, 0, W, H);
  for (let y = 36; y < H; y += 48) for (let x = 24; x < W; x += 48) { g.fillStyle = 'rgba(160,208,226,0.07)'; g.fillRect(x - 1, y - 1, 2, 2); }
  const v = g.createRadialGradient(CX, CY, 400, CX, CY, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// ── frame UI (corners, title, timecode, status line) ─────────────────────────
function frameUI(t) {
  const pin = eBack(seg(t, 0.45, 0.95)); const off = (1 - pin) * 60, a = clamp(pin * 1.2);
  if (a <= 0) return;
  const x0 = 150 - off, y0 = 110 - off, x1 = W - 150 + off, y1 = H - 110 + off, L = 46;
  ctx.globalAlpha = a;
  for (const [x, y, sx, sy] of [[x0, y0, 1, 1], [x1, y0, -1, 1], [x0, y1, 1, -1], [x1, y1, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.lineWidth = 2; ctx.strokeStyle = ice(0.8); ctx.stroke(); }
  const pt = seg(t, 0.7, 1.2);
  F(20, 600, DISP, 5); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = wh(0.95);
  ctx.fillText(decode('DOCKING APPROACH', pt, t, 1), 196, 158);
  const w1 = ctx.measureText('DOCKING APPROACH').width;
  F(14, 300, MONO, 2); ctx.fillStyle = ice(0.7); ctx.fillText(decode('KESTREL-7 TO ARGO RING', pt, t, 2), 196 + w1 + 22, 157);
  ctx.textAlign = 'right'; F(15, 400, MONO, 2); ctx.fillStyle = ice(0.8);
  const tc = Math.max(0, t - 0.7); const fr = Math.floor((tc % 1) * 30);
  if (pt > 0) ctx.fillText(`MET 214:06:0${Math.floor(tc)}:${String(fr).padStart(2, '0')}`, W - 196, 157);
  ctx.textAlign = 'left'; F(14, 300, MONO, 3);
  const steps = [[0, 'SYSTEM INITIALIZING'], [T.app0 + 0.2, 'AUTO ALIGN · RCS ACTIVE'], [T.ok, 'ALIGNMENT NOMINAL'], [T.fin0, 'FINAL APPROACH'],
    [T.contact, 'CLAMPS ENGAGING'], [T.done, 'HARD DOCK'], [T.off0, 'POWERING DOWN']];
  const [stT, st] = steps.filter(s => s[0] <= t).pop();
  ctx.fillStyle = (t >= T.ok && t < T.fin0) || (t >= T.done && t < T.off0) ? grn(0.85) : ice(0.6);
  if (pt > 0) ctx.fillText(decode(st, seg(t, Math.max(stT, 0.8), Math.max(stT, 0.8) + 0.45), t, 3), 196, H - 146);
  for (let k = 0; k < 16; k++) { const lv = 0.5 + 0.5 * Math.sin(t * 7 + k * 0.9) * hash(k + Math.floor(t * 12)); ctx.fillStyle = ice(0.25 + 0.55 * lv);
    const h = 4 + 16 * lv; ctx.fillRect(W - 196 - (16 - k) * 7, H - 146 - h, 3, h); }
  ctx.globalAlpha = 1;
}

// ── left panel: range, rate, offset, roll, RCS ───────────────────────────────
function leftPanel(t) {
  const a = seg(t, 0.95, 1.35); if (a <= 0) return;
  const x = 196; ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const colFor = (w, t) => t < w.on ? WH : t < w.ok ? amb(0.6 + 0.4 * blink(t)) : grn(0.95);
  // range
  { const p = seg(t, 1.0, 1.4), y = 290; F(14, 300, MONO, 3); ctx.fillStyle = ice(0.8); ctx.fillText(decode('RANGE TO PORT', p, t, 11), x, y);
    F(72, 500, DISP, 0); ctx.fillStyle = WH; const txt = decode(range(t).toFixed(1), p, t, 12); ctx.fillText(txt, x - 4, y + 74);
    const vw = ctx.measureText(txt).width; F(22, 500, DISP, 1); ctx.fillStyle = ice(0.8); ctx.fillText(' m', x + vw, y + 74);
    const lw = 300, ly = y + 100, f = clamp(Math.log10(range(t) + 1) / Math.log10(251));   // log-scale range ladder
    ctx.fillStyle = ice(0.18); ctx.fillRect(x, ly, lw, 3); ctx.fillStyle = WH; ctx.fillRect(x, ly, lw * f * eOut(p), 3);
    for (let k = 0; k <= 10; k++) ctx.fillRect(x + lw * k / 10 - 0.5, ly - 6, 1, 4); }
  // closing rate
  { const w = WARN[0], y = 470, p = seg(t, 1.1, 1.5); F(14, 300, MONO, 3); ctx.fillStyle = ice(0.8); ctx.fillText(decode('CLOSING RATE', p, t, 13), x, y);
    F(40, 500, DISP, 0); ctx.fillStyle = colFor(w, t); const v = decode((rate(t) > 0.004 ? '-' : '') + rate(t).toFixed(2), p, t, 14); ctx.fillText(v, x - 2, y + 46);
    const vw = ctx.measureText(v).width; F(16, 500, DISP, 1); ctx.fillStyle = ice(0.8); ctx.fillText(' m/s', x + vw, y + 46); }
  // lateral offset
  { const w = WARN[1], y = 580, p = seg(t, 1.2, 1.6), f = offF(t); F(14, 300, MONO, 3); ctx.fillStyle = ice(0.8); ctx.fillText(decode('LATERAL OFFSET', p, t, 15), x, y);
    const sg = v => (v >= -0.005 ? '+' : '-') + Math.abs(v).toFixed(2);
    F(30, 500, DISP, 0); ctx.fillStyle = colFor(w, t); ctx.fillText(decode(`X ${sg(1.4 * f)}   Y ${sg(-0.9 * f)}`, p, t, 16), x - 1, y + 40); }
  // roll
  { const w = WARN[2], y = 680, p = seg(t, 1.3, 1.7); F(14, 300, MONO, 3); ctx.fillStyle = ice(0.8); ctx.fillText(decode('ROLL ERROR', p, t, 17), x, y);
    const r = rollD(t); F(30, 500, DISP, 0); ctx.fillStyle = colFor(w, t); ctx.fillText(decode((r >= -0.05 ? '+' : '-') + Math.abs(r).toFixed(1) + '°', p, t, 18), x - 1, y + 40); }
  // RCS thruster bars: flare at each pulse
  { const y = 800, p = seg(t, 1.35, 1.75); F(12, 300, MONO, 3); ctx.fillStyle = ice(0.7); ctx.fillText(decode('RCS', p, t, 19), x, y);
    for (let k = 0; k < 12; k++) { let lv = 0.08;
      for (const r of RCS) { const d = t - r; if (d > 0 && d < 0.5) lv = Math.max(lv, (1 - d / 0.5) * (0.4 + 0.6 * hash(k * 7 + r * 10))); }
      if (t > T.fin0 && t < T.contact) lv = Math.max(lv, 0.15 + 0.1 * hash(k + Math.floor(t * 15)));
      const bx = x + 50 + k * 20, h = 26 * lv * p + 2; ctx.fillStyle = lv > 0.12 ? wh(0.9) : ice(0.3); ctx.fillRect(bx, y - h, 12, h); } }
  ctx.restore();
}

// ── right panel: proximity radar → clamp diagram, status list ────────────────
const RX = 1572, RY = 385, RR = 118;
function rightPanel(t) {
  const a = seg(t, 0.95, 1.35); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; const x0 = 1420, x1 = W - 196;
  // radar
  const ra = 1 - eIO(seg(t, T.fold0, T.fold0 + 0.4));
  if (ra > 0) {
    ctx.globalAlpha = a * ra; const d = eOut(seg(t, 0.95, 1.5));
    F(14, 300, MONO, 3); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ice(0.8); ctx.fillText(decode('PROXIMITY', seg(t, 1.0, 1.4), t, 31), x0, 244);
    ctx.textAlign = 'right'; ctx.fillText(decode('CONTACTS 03', seg(t, 1.0, 1.4), t, 32), x1, 244);
    for (const f of [1, 0.66, 0.33]) arcAt(RX, RY, RR * f, -Math.PI / 2, -Math.PI / 2 + TAU * d, 1, ice(f === 1 ? 0.6 : 0.25));
    line(RX - RR * d, RY, RX + RR * d, RY, 1, ice(0.2)); line(RX, RY - RR * d, RX, RY + RR * d, 1, ice(0.2));
    const sw = -Math.PI / 2 + (t - 1.0) * 2.6;
    if (t > 1.0) { const g = ctx.createConicGradient(sw - 1.1, RX, RY); g.addColorStop(0, ice(0)); g.addColorStop(1.1 / TAU, ice(0.22)); g.addColorStop(1.1 / TAU + 0.001, ice(0)); g.addColorStop(1, ice(0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(RX, RY, RR, 0, TAU); ctx.fill(); line(RX, RY, RX + Math.cos(sw) * RR, RY + Math.sin(sw) * RR, 1.5, wh(0.85)); }
    const rr = clamp(range(t) / 260); // the station blip closes in with range
    const blips = [{ ang: -70, r: 0.12 + 0.8 * rr, lab: 'ARGO' }, { ang: 150, r: 0.72, lab: '' }, { ang: 35, r: 0.55, lab: '' }];
    for (const b of blips) { const ang = b.ang * D2R, bx = RX + Math.cos(ang) * RR * b.r, by = RY + Math.sin(ang) * RR * b.r;
      const since = (((sw - ang) % TAU) + TAU) % TAU, br = t > 1.0 ? 0.25 + 0.75 * Math.exp(-since * 1.3) : 0;
      ctx.fillStyle = b.lab ? wh(br) : ice(br * 0.8); ctx.fillRect(bx - 3, by - 3, 6, 6);
      if (b.lab) { F(11, 400, MONO, 1); ctx.textAlign = 'left'; ctx.fillStyle = ice(0.8 * clamp(br + 0.3)); ctx.fillText(b.lab, bx + 8, by + 4); } }
    ctx.fillStyle = WH; ctx.beginPath(); ctx.moveTo(RX, RY - 6); ctx.lineTo(RX + 5, RY + 5); ctx.lineTo(RX - 5, RY + 5); ctx.closePath(); ctx.fill();
  }
  // clamp diagram (front view of the collar, four clamps)
  const ca = eOut(seg(t, T.fold0 + 0.3, T.fold0 + 0.8));
  if (ca > 0) {
    ctx.globalAlpha = a * ca; F(14, 300, MONO, 3); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = ice(0.8);
    ctx.fillText(decode('CAPTURE CLAMPS', seg(t, T.fold0 + 0.3, T.fold0 + 0.7), t, 33), x0, 244);
    const nL = CLAMPS.filter(c => t >= c.t + 0.1).length; ctx.textAlign = 'right'; ctx.fillStyle = nL === 4 ? grn(0.95) : ice(0.8); ctx.fillText(`${nL}/4`, x1, 244);
    arcAt(RX, RY, 70, -Math.PI / 2, -Math.PI / 2 + TAU * ca, 1.5, ice(0.7)); arcAt(RX, RY, 52, 0, TAU * ca, 1, ice(0.3));
    for (const c of CLAMPS) { const ang = (c.deg - 90) * D2R, lp = eBack(seg(t, c.t, c.t + 0.22)), locked = t >= c.t + 0.1;
      const r0 = lerp(112, 78, lp); ctx.save(); ctx.translate(RX + Math.cos(ang) * r0, RY + Math.sin(ang) * r0); ctx.rotate(ang);
      ctx.fillStyle = locked ? grn(0.9) : ice(0.15); ctx.fillRect(-4, -14, 22, 28); rect(-4, -14, 22, 28, 1.5, locked ? grn(1) : ice(0.8)); ctx.restore();
      F(13, 400, MONO, 1); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = locked ? grn(1) : ice(0.7);
      ctx.fillText(c.n, RX + Math.cos(ang) * 124, RY + Math.sin(ang) * 124);
      if (t > c.t && t < c.t + 0.5) { const q = seg(t, c.t, c.t + 0.5); arcAt(RX + Math.cos(ang) * 80, RY + Math.sin(ang) * 80, 10 + 30 * eOut(q), 0, TAU, 1, grn(0.7 * (1 - q))); } }
    ctx.textBaseline = 'alphabetic';
  }
  ctx.globalAlpha = a;
  // status list
  const rows = [...WARN, { lab: 'CAPTURE LATCH' }, { lab: 'HARD SEAL' }];
  rows.forEach((r, k) => {
    const y = 590 + k * 46, p = seg(t, 1.2 + k * 0.08, 1.6 + k * 0.08); if (p <= 0) return;
    line(x0, y + 14, lerp(x0, x1, eOut(p)), y + 14, 1, ice(0.15));
    F(13, 300, MONO, 2); ctx.textAlign = 'left'; ctx.fillStyle = ice(0.8); ctx.fillText(decode(r.lab, p, t, 40 + k), x0 + 30, y);
    let s = 'NOMINAL', col = ice(0.55), mode = 'dot', t0 = 0;
    if (r.on !== undefined) { if (t >= r.ok) { s = 'OK'; col = grn(1); mode = 'ok'; t0 = r.ok; } else if (t >= r.on) { s = 'CAUTION'; col = amb(0.55 + 0.45 * blink(t)); mode = 'warn'; t0 = r.on; } }
    else if (k === 3) { if (t >= T.contact) { s = 'CAPTURED'; col = grn(1); mode = 'ok'; t0 = T.contact; } else if (t >= T.ok) { s = 'READY'; col = wh(0.9); t0 = T.ok; } else s = 'STANDBY'; }
    else { if (t >= T.done - 0.05) { s = 'CONFIRMED'; col = grn(1); mode = 'ok'; t0 = T.done - 0.05; } else s = 'STANDBY'; }
    const since = t0 ? t - t0 : 1;
    ctx.textAlign = 'right'; F(14, 400, MONO, 2); ctx.fillStyle = col; ctx.fillText(decode(s, Math.min(p, seg(since, 0, 0.3)), t, 50 + k), x1, y);
    if (mode === 'warn') warnTri(x0 + 10, y - 6, 9 * eBack(seg(since, 0, 0.25)), col);
    else if (mode === 'ok') { check(x0 + 10, y - 5, 8, col, seg(since, 0, 0.25)); if (since < 0.4) { ctx.fillStyle = grn(0.14 * (1 - since / 0.4)); ctx.fillRect(x0, y - 22, x1 - x0, 34); } }
    else { ctx.fillStyle = col; ctx.fillRect(x0 + 7, y - 9, 6, 6); }
  });
  ctx.restore();
}

// ── head-on view: reticle rings + ARGO RING docking port ─────────────────────
const R1 = 118, R3 = 292, R4 = 332, R5 = 396;
const portR = rg => 5200 / (rg + 20);
function reticle(t) {
  const tout = T.fold0 - 0.05, fade = 1 - eOut(seg(t, T.fold0 + 0.1, T.fold0 + 0.5));
  if (fade <= 0) return;
  ctx.save(); ctx.globalAlpha = fade; const rot = t * 0.1;
  { const v = ringVis(t, T.ring0, tout); arc(R1, -Math.PI / 2 + TAU * v.e, -Math.PI / 2 + TAU * v.a, 1.5, ice(0.7)); }
  { const v = ringVis(t, T.ring0 + 0.12, tout - 0.05); const n = 180;
    for (let k = 0; k < n; k++) { const f = k / n; if (v.a <= 0 || f > v.a || f < v.e) continue; const ang = -Math.PI / 2 + TAU * f + rot * 0.6;
      const L = k % 15 === 0 ? 16 : k % 5 === 0 ? 10 : 5; const c = Math.cos(ang), s = Math.sin(ang);
      line(CX + c * R3, CY + s * R3, CX + c * (R3 + L), CY + s * (R3 + L), k % 15 === 0 ? 2 : 1, ice(k % 15 === 0 ? 0.9 : 0.45)); } }
