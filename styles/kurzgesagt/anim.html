<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#0a1030}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Kurzgesagt-style thought experiment: "What if the Moon disappeared?"
// Space → the Moon dissolves → zoom to a coastline where the tides flatten → night falls, a critter lights a lantern
// → iris out to Earth, its axis wobbling and the seasons shaking → Earth alone with the question as a title card.
// window.draw({t}) → JPEG base64, window.events() → sound cues for audio.py. Duration 10 s.
const W = 1920;
const H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DUR = 10;
const TAU = Math.PI * 2;

/* ===== math ===== */
function clamp(v, lo = 0, hi = 1) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(from, to, k) { return from * (1 - k) + to * k; }
// 0→1 progress of t through the window [t0, t1]
function seg(t, t0, t1) { return clamp((t - t0) / (t1 - t0)); }
function eOut(k) { const u = 1 - k; return 1 - u * u * u; }
function eIn(k) { return k * k * k; }
function eInOut(k) { return k < 0.5 ? 4 * k * k * k : 1 - 4 * Math.pow(1 - k, 3); }
// cubic ease-out that overshoots past 1 before settling; `over` sets how far
function eBack(k, over = 1.9) { const u = k - 1; return 1 + u * u * ((over + 1) * u + over); }
const smooth = x => x * x * (3 - 2 * x);
// Lehmer / Park–Miller generator, values in (0, 1)
function rng(seed) {
  let state = seed % 2147483647;
  return function next() { state = state * 16807 % 2147483647; return state / 2147483647; };
}
function canvasOf(w, h) { return Object.assign(document.createElement('canvas'), { width: w, height: h }); }
function hexA(hex, alpha) {
  const v = parseInt(hex.slice(1), 16);
  return 'rgba(' + [(v >> 16) & 255, (v >> 8) & 255, v & 255, alpha].join(',') + ')';
}
function mix(a, b, k) { const p = parseInt(a.slice(1), 16), q = parseInt(b.slice(1), 16);
  const ch = s => Math.round(lerp((p >> s) & 255, (q >> s) & 255, k)); return `rgb(${ch(16)},${ch(8)},${ch(0)})`; }
const FT = "'Fredoka', sans-serif";

/* ===== colours ===== */
const C = {
  // deep space
  sky0: '#0a1030',
  sky1: '#1c1552',
  star: '#fff4d8',
  // Earth
  oceanD: '#145a9c', land: '#ffc94d', land2: '#5cd07a',
  moon: '#c7b3f5', moonD: '#8a6fcf', crest: '#86e8ff', navy: '#27265e', red: '#ff5a4e', gold: '#ffd36b'
};
// coast scene colours: [dusk, night]
const K = {
  skyT: ['#35308c', '#060a22'], skyM: ['#7a5cd6', '#0f1440'], skyH: ['#ff9e8a', '#1c2056'],
  mtn: ['#9377de', '#1b1b4c'], hill: ['#6a52c4', '#14133a'],
  waterT: ['#3ab4ea', '#12386c'], waterB: ['#17589f', '#081a40'],
  soil: ['#e0913f', '#34203e'], soilD: ['#b8683a', '#26172f'], sand: ['#ffc94d', '#584068'],
  grass: ['#5cd07a', '#1d4648'], grassD: ['#3aa860', '#153538'], tree: ['#46c06e', '#18403f'], trunk: ['#8a5236', '#2a1a2c'],
  hut: ['#ff7a6b', '#3a2346'], roof: ['#27265e', '#0d0c26']
};
function kc(name, night) { const [day, dark] = K[name]; return mix(day, dark, night); }

/* ===== sprites, built once in window.ready ===== */
let STARS, NEB, ATMO, GLOW, WARM, VIG;
const ATMO_R = 300; // planet radius the atmosphere sprite is drawn for
function radialSprite(w, h, inner, outer, stops) {
  const c = canvasOf(w, h), g = c.getContext('2d');
  const grad = g.createRadialGradient(w / 2, h / 2, inner, w / 2, h / 2, outer);
  for (const [at, col] of stops) grad.addColorStop(at, col);
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  return c;
}
function buildSprites() {
  const rand = rng(7);
  STARS = Array.from({ length: 320 }, () => {
    const x = rand() * W, y = rand() * H, size = 0.6 + 2.6 * rand() ** 3;
    return { x, y, size, phase: rand() * TAU, rate: 0.8 + 2.2 * rand(), near: rand() >= 0.7 };
  });
  // three soft colour clouds behind the stars
  NEB = canvasOf(W, H);
  const ng = NEB.getContext('2d');
  for (const [x, y, rad, rgb, a] of [[300, 260, 700, '196,52,150', 0.22], [1650, 180, 650, '40,190,200', 0.14], [960, 1100, 900, '120,70,220', 0.3]]) {
    const grad = ng.createRadialGradient(x, y, 0, x, y, rad);
    grad.addColorStop(0, `rgba(${rgb},${a})`); grad.addColorStop(1, `rgba(${rgb},0)`);
    ng.fillStyle = grad; ng.fillRect(0, 0, W, H);
  }
  const half = 512;
  ATMO = radialSprite(2 * half, 2 * half, ATMO_R * 0.926, ATMO_R * 1.63,
    [[0, 'rgba(99,214,255,0.55)'], [0.18, 'rgba(99,214,255,0.28)'], [0.5, 'rgba(90,140,255,0.08)'], [1, 'rgba(90,140,255,0)']]);
  GLOW = radialSprite(256, 256, 0, 128, [[0, 'rgba(255,255,255,0.9)'], [0.25, 'rgba(255,255,255,0.35)'], [1, 'rgba(255,255,255,0)']]);
  WARM = radialSprite(512, 512, 0, 256,
    [[0, 'rgba(255,214,120,0.95)'], [0.12, 'rgba(255,190,90,0.55)'], [0.45, 'rgba(255,140,70,0.16)'], [1, 'rgba(255,120,60,0)']]);
  VIG = radialSprite(W, H, 500, 1250, [[0, 'rgba(5,5,25,0)'], [1, 'rgba(5,5,25,0.55)']]);
}

/* ===== drawing primitives ===== */
// Flat shading: a dark crescent on the side away from the light (top-left) and a thin bright rim facing it.
// Each layer fills the disc minus an offset copy of itself.
function shadeCircle(x, y, r, k, dark, lite) {
  const exceptDisc = (ox, oy, rr, col) => {
    const p = new Path2D();
    p.rect(x - r - 4, y - r - 4, 2 * r + 8, 2 * r + 8);
    p.moveTo(ox + rr, oy); p.arc(ox, oy, rr, 0, TAU);
    ctx.fillStyle = col; ctx.fill(p, 'evenodd');
  };
  const disc = new Path2D(); disc.arc(x, y, r, 0, TAU);
  ctx.save(); ctx.clip(disc);
  exceptDisc(x - r * k, y - r * k, r * 1.04, dark);
  exceptDisc(x + r * 0.06, y + r * 0.06, r * 0.985, lite);
  ctx.restore();
}
function glow(x, y, size, alpha, sprite) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha;
  ctx.drawImage(sprite || GLOW, x - size, y - size, size * 2, size * 2);
  ctx.restore();
}
// four-pointed star whose edges curve in toward the centre
function sparkle(x, y, k) {
  ctx.beginPath(); ctx.moveTo(x + k, y);
  for (let i = 1; i <= 4; i++) { const a = i * Math.PI / 2; ctx.quadraticCurveTo(x, y, x + Math.cos(a) * k, y + Math.sin(a) * k); }
  ctx.fill();
}
// closed smooth outline through the midpoints of a polygon, using its corners as control points
function blobPath(pts) {
  const n = pts.length, midOf = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  ctx.beginPath();
  const start = midOf(pts[n - 1], pts[0]); ctx.moveTo(start[0], start[1]);
  pts.forEach((p, i) => { const m = midOf(p, pts[(i + 1) % n]); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); });
}

/* ===== the planet ===== */
// continents: a green landmass with a sandy core, as wobbly loops in (longitude, latitude) radians
const CONT = [];
{
  const rand = rng(4242);
  const loop = (lon, lat, size) => {
    const pts = [];
    for (let i = 0; i < 16; i++) {
      const a = TAU * i / 16, reach = size * (0.72 + 0.5 * rand());
      pts.push([lon + 1.25 * reach * Math.cos(a), lat + reach * Math.sin(a)]);
    }
    return pts;
  };
  const masses = [{ lon: 0.3, lat: 0.3, size: 0.42 }, { lon: 2.2, lat: -0.25, size: 0.48 }, { lon: 3.8, lat: 0.35, size: 0.38 },
    { lon: 5.1, lat: -0.35, size: 0.4 }, { lon: 1.2, lat: 0.72, size: 0.22 }, { lon: 4.6, lat: 0.75, size: 0.2 }];
  for (const m of masses) {
    CONT.push({ col: 'land2', pts: loop(m.lon, m.lat, m.size) });
    CONT.push({ col: 'land', pts: loop(m.lon + 0.08, m.lat + 0.06, m.size * 0.45) });
  }
}
// cloud bands: longitude, latitude, length and thickness (fractions of the radius)
const CLOUD_WHITE = 'rgba(240,250,255,0.92)';
const CLOUDS = [
  { lon: 0.7, lat: -0.45, len: 0.42, th: 0.05 }, { lon: 1.9, lat: 0.18, len: 0.34, th: 0.045 },
  { lon: 3.0, lat: -0.12, len: 0.5, th: 0.05 }, { lon: 4.3, lat: 0.42, len: 0.38, th: 0.045 },
  { lon: 5.6, lat: -0.08, len: 0.3, th: 0.04 }, { lon: 2.6, lat: 0.55, len: 0.26, th: 0.035 }];
// orthographic projection; points on the far side are pinned to the limb so shapes fold over the edge
function project(cx, cy, R, lon, lat, rot) {
  let u = Math.atan2(Math.sin(lon - rot), Math.cos(lon - rot));
  const front = Math.cos(u) > 0;
  if (!front) u = Math.sign(u) * Math.PI / 2;
  return [cx + R * Math.cos(lat) * Math.sin(u), cy - R * Math.sin(lat), front];
}
// `tilt` turns the surface only; the light and the atmosphere stay put
function drawPlanet(cx, cy, R, rot, tilt = 0) {
  const s = R / ATMO_R;
  ctx.drawImage(ATMO, cx - ATMO.width / 2 * s, cy - ATMO.height / 2 * s, ATMO.width * s, ATMO.height * s);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
  const sea = ctx.createRadialGradient(cx - 0.35 * R, cy - 0.4 * R, 0.1 * R, cx, cy, 1.1 * R);
  sea.addColorStop(0, '#2aa3e0'); sea.addColorStop(1, C.oceanD);
  ctx.fillStyle = sea; ctx.fillRect(cx - R, cy - R, 2 * R, 2 * R);
  ctx.translate(cx, cy); ctx.rotate(tilt); ctx.translate(-cx, -cy);
  for (const land of CONT) {
    const pts = land.pts.map(([lon, lat]) => project(cx, cy, R, lon, lat, rot));
    if (pts.every(p => !p[2])) continue;
    ctx.fillStyle = C[land.col]; blobPath(pts); ctx.fill();
  }
  ctx.fillStyle = CLOUD_WHITE;
  for (const cl of CLOUDS) {
    const u = cl.lon - rot * 1.3, facing = Math.cos(u);
    if (facing < 0.05) continue;
    const x = cx + R * Math.cos(cl.lat) * Math.sin(u), y = cy - R * Math.sin(cl.lat);
    const w = R * cl.len * facing * Math.cos(cl.lat), h = R * cl.th;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x - 0.15 * w, y - 1.25 * h, 0.5 * w, 0.9 * h, 0.45 * h); ctx.fill();
  }
  // polar caps
  ctx.fillStyle = 'rgba(240,250,255,0.95)';
  for (const [dy, rx, ry] of [[-0.99, 0.34, 0.1], [1.0, 0.28, 0.08]]) { ctx.beginPath(); ctx.ellipse(cx, cy + dy * R, rx * R, ry * R, 0, 0, TAU); ctx.fill(); }
  ctx.restore();
  shadeCircle(cx, cy, R, 0.26, 'rgba(12,6,58,0.5)', 'rgba(200,245,255,0.35)');
  // bright atmospheric edge on the lit side
  ctx.save();
  ctx.lineWidth = 0.018 * R; ctx.strokeStyle = 'rgba(140,230,255,0.55)';
  ctx.beginPath(); ctx.arc(cx, cy, 1.005 * R, 0.95 * Math.PI, 1.75 * Math.PI); ctx.stroke();
  ctx.restore();
}
const CRATERS = [{ dx: -0.3, dy: -0.2, r: 0.28 }, { dx: 0.35, dy: 0.25, r: 0.2 }, { dx: -0.1, dy: 0.45, r: 0.14 }];
function paintMoon(x, y, r) {
  const disc = (px, py, pr) => { ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill(); };
  ctx.fillStyle = C.moon; disc(x, y, r);
  ctx.fillStyle = C.moonD;
  for (const c of CRATERS) disc(x + c.dx * r, y + c.dy * r, c.r * r);
  shadeCircle(x, y, r, 0.28, 'rgba(25,10,70,0.45)', 'rgba(255,255,255,0.35)');
}
// dashed outline marking where the Moon used to be
function ghostMoon(x, y, r, alpha) {
  if (!(alpha > 0)) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.setLineDash([10, 12]);
  ctx.strokeStyle = 'rgba(199,179,245,0.8)';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ===== type ===== */
// Headline whose words pop in one after another (overshooting scale, rising from below)
// and shrink away from time `out` on. Centred on x. Words sit at their final positions and scale about
// their own centres; the overshoot is capped in pixels so two neighbours at peak still keep 60% of the gap, about one plain space.
function popText(str, x, y, size, t0, t, { w = 600, stag = 0.09, out = 99, col = '#fff', glow: halo = 'rgba(120,200,255,0.5)' } = {}) {
  ctx.font = `${w} ${size}px ${FT}`;
  const words = str.split(' '), gap = ctx.measureText(" ").width + 0.15 * size, reach = 0.2 * gap;
  const widths = words.map(word => ctx.measureText(word).width);
  let left = x - (widths.reduce((sum, v) => sum + v + gap, 0) - gap) / 2;
  for (let i = 0; i < words.length; i++) {
    const centre = left + widths[i] / 2;
    left += widths[i] + gap;
    const inK = seg(t, t0 + i * stag, t0 + i * stag + 0.5), outK = seg(t, out + 0.04 * i, out + 0.04 * i + 0.3);
    if (inK <= 0 || outK >= 1) continue;
    const pop = eBack(inK), grow = Math.min(Math.max(pop - 1, 0), reach / (widths[i] / 2));
    const scale = (pop > 1 ? 1 + grow : pop) * (1 - 0.4 * eIn(outK));
    ctx.save();
    ctx.translate(centre, y + 0.35 * size * (1 - eOut(inK))); ctx.scale(scale, scale);
    ctx.globalAlpha = clamp(2.5 * inK) * (1 - outK);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = halo; ctx.shadowBlur = 28; ctx.fillStyle = col;
    ctx.fillText(words[i], 0, 0);
    ctx.restore();
  }
}
const popTimes = (str, t0, st = 0.09) => str.split(' ').map((_, i) => t0 + i * st);
function kicker(str, y, tin, tout, t, col = '#c3cfff') {
  const a = seg(t, tin, tin + 0.4) * (1 - seg(t, tout, tout + 0.25)); if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `600 32px ${FT}`; ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = '6px'; ctx.fillText(str, 960, y + (1 - eOut(seg(t, tin, tin + 0.4))) * 12); ctx.restore();
}

/* ===== space ===== */
// twinkling star field; `drift` slides the two depth layers at different speeds
function drawStars(t, drift, alpha, maxY = H) {
  ctx.save(); ctx.fillStyle = C.star;
  for (const st of STARS) {
    if (st.y > maxY) continue;
    const twinkle = 0.55 + 0.45 * Math.sin(st.rate * t + st.phase);
    const x = ((st.x - drift * (st.near ? 60 : 25)) % W + W) % W, y = st.y + drift * (st.near ? 18 : 8);
    ctx.globalAlpha = alpha * twinkle * (st.near ? 1 : 0.6);
    if (st.size > 2.3) sparkle(x, y, 2.4 * st.size * twinkle);
    else { ctx.beginPath(); ctx.arc(x, y, st.size, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
function paintSpace(nebula = 1) {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, C.sky0); sky.addColorStop(1, C.sky1);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = nebula; ctx.drawImage(NEB, 0, 0); ctx.restore();
}
// point on a tilted ellipse; the third value (sin of the angle) is > 0 on the near side
function orbitPos(angle, rx, ry, tilt, cx, cy) {
  const ex = rx * Math.cos(angle), ey = ry * Math.sin(angle), ct = Math.cos(tilt), st = Math.sin(tilt);
  return [cx + ex * ct - ey * st, cy + ex * st + ey * ct, Math.sin(angle)];
}

// scene A: Earth and Moon, then the Moon dissolves into sparks
const PA = { x: 960, y: 660, r: 270 }, T_VANISH = 1.75;
const SPARKS = (() => { const r = rng(31), s = []; for (let i = 0; i < 26; i++) s.push({ a: r() * 6.283, v: 60 + r() * 170, s: 4 + r() * 9, c: r() < 0.6 ? C.moon : r() < 0.5 ? '#fff4d8' : C.crest }); return s; })();
function drawSpaceScene(t) {
  paintSpace(seg(t, 0, 1.2));
  drawStars(t, 0.15 * t, seg(t, 0.05, 0.9));
  const py = lerp(1560, PA.y, eBack(seg(t, 0.2, 1.6), 1.25)), rot = t * 0.22 + 1.2;
  // the Moon stops moving as it vanishes
  const th = -0.9 + Math.min(t, T_VANISH) * 0.42 + Math.max(0, t - T_VANISH) * 0.08;
  const mp = orbitPos(th, 600, 170, -0.16, PA.x, py - 40), mr = 64 * (0.85 + 0.15 * mp[2]);
  const vin = eBack(seg(t, 0.75, 1.25)), vk = seg(t, T_VANISH, T_VANISH + 0.35);
  const swell = 1 + 0.25 * Math.sin(Math.PI * seg(t, T_VANISH - 0.18, T_VANISH + 0.12));
  const moonR = mr * vin * swell * (1 - eIn(vk));
  const drawM = () => { if (moonR > 0.5) { paintMoon(mp[0], mp[1], moonR); if (vk > 0) { ctx.save(); ctx.globalAlpha = vk; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(mp[0], mp[1], moonR, 0, 7); ctx.fill(); ctx.restore(); } } };
  if (mp[2] < 0) drawM();
  drawPlanet(PA.x, py, PA.r, rot);
  if (mp[2] >= 0) drawM();
  // flash + sparks + empty outline where it was
  const fk = seg(t, T_VANISH + 0.2, T_VANISH + 1.1);
  if (fk > 0 && fk < 1) {
    glow(mp[0], mp[1], 150 * (0.6 + fk), (1 - fk) * 0.8);
    ctx.save();
    for (const s of SPARKS) { const d = s.v * eOut(fk), a = 1 - eIn(fk);
      ctx.globalAlpha = a; ctx.fillStyle = s.c; sparkle(mp[0] + Math.cos(s.a) * d, mp[1] + Math.sin(s.a) * d * 0.8, s.s * (1 - fk * 0.6)); }
    ctx.restore();
  }
  ghostMoon(mp[0], mp[1], mr, seg(t, T_VANISH + 0.45, T_VANISH + 0.7) * 0.9);
  popText('What if the Moon disappeared?', 960, 150, 84, 0.55, t, { out: 2.25 });
  kicker('A THOUGHT EXPERIMENT', 234, 1.05, 2.2, t);
}

// ---------- coast (scenes B and C) ----------
const TIDE0 = 780, TIDE_A = 110, TIDE_P = 1.3, T_TIDE = 2.95;
const tideAmp = t => 6 + (TIDE_A - 6) * (1 - eInOut(seg(t, 3.55, 4.95)));
const tideLevel = t => TIDE0 - tideAmp(t) * Math.sin(2 * Math.PI * (t - T_TIDE) / TIDE_P + 0.9);
function groundY(x) {
  if (x < 600) return 985 + 8 * Math.sin(x / 90);
  if (x < 1350) return lerp(985 + 8 * Math.sin(600 / 90), 640, smooth((x - 600) / 750));
  return 640 - 14 * Math.sin((x - 1350) / 160);
}
const TREES = [[1480, 1.0], [1610, 0.78], [1860, 1.1]];
const WRACK = (() => { const r = rng(55), p = []; for (let i = 0; i < 14; i++) p.push([r() * 70 - 35, r() * 10 - 5, 3 + r() * 5]); return p; })();
const CRITTER_X = t => lerp(1790, 1150, eInOut(seg(t, 5.3, 6.55)));
function sceneCoast(t) {
  const n = eInOut(seg(t, 5.0, 5.9)), L = tideLevel(t);
  // sky
  const sk = ctx.createLinearGradient(0, 0, 0, 760); sk.addColorStop(0, kc('skyT', n)); sk.addColorStop(0.62, kc('skyM', n)); sk.addColorStop(1, kc('skyH', n));
  ctx.fillStyle = sk; ctx.fillRect(0, 0, W, H);
  drawStars(t, 0, n * 0.9, 600);
  ghostMoon(360, 250, 64, 0.7 * (1 - n * 0.4));
  // far mountains, mid hills
  ctx.fillStyle = kc('mtn', n); ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 640 - 70 * Math.max(0, Math.sin(x / 210 + 0.4)) - 30 * Math.sin(x / 67)); ctx.lineTo(W, H); ctx.fill();
  ctx.fillStyle = kc('hill', n); ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 700 - 45 * Math.max(0, Math.sin(x / 150 + 2.1)) - 12 * Math.sin(x / 41)); ctx.lineTo(W, H); ctx.fill();
  // water body
  const wg = ctx.createLinearGradient(0, L, 0, H); wg.addColorStop(0, kc('waterT', n)); wg.addColorStop(1, kc('waterB', n));
  ctx.fillStyle = wg; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= 1400; x += 16) ctx.lineTo(x, L + 5 * Math.sin(x / 55 - t * 3.2) * (0.4 + tideAmp(t) / TIDE_A * 0.6));
  ctx.lineTo(1400, H); ctx.fill();
  ctx.fillStyle = hexA('#ffffff', 0.12 * (1 - n * 0.6));
  for (const [x0, dy, w] of [[80, 40, 220], [420, 90, 160], [240, 150, 260], [700, 60, 140], [560, 190, 120]]) { ctx.beginPath(); ctx.roundRect(x0, L + dy, w, 9, 5); ctx.fill(); }
  // tide gauge post
  const gx = 360;
  ctx.fillStyle = mix('#f4f0ff', '#4a4a80', n); ctx.beginPath(); ctx.roundRect(gx - 11, 600, 22, 420, 8); ctx.fill();
  for (let y = 620; y < 1000; y += 30) { ctx.fillStyle = (y / 30) % 2 ? mix('#ff5a4e', '#5a2a4a', n) : mix('#27265e', '#15143a', n); ctx.fillRect(gx - 11, y, 22, 12); }
  ctx.save(); ctx.font = `600 26px ${FT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '3px';
  ctx.globalAlpha = 1 - n * 0.3;
  for (const [y, s] of [[TIDE0 - TIDE_A, 'HIGH'], [TIDE0 + TIDE_A, 'LOW']]) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.moveTo(gx + 18, y); ctx.lineTo(gx + 70, y); ctx.stroke();
    ctx.setLineDash([]); ctx.fillStyle = '#fff'; ctx.fillText(s, gx + 80, y); }
  // live tidal range: a bracket left of the post that shrinks to a line
  const ra = tideAmp(t), bx = gx - 34;
  ctx.strokeStyle = mix('#ffd36b', '#8a7040', n); ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(bx + 12, TIDE0 - ra); ctx.lineTo(bx, TIDE0 - ra); ctx.lineTo(bx, TIDE0 + ra); ctx.lineTo(bx + 12, TIDE0 + ra); ctx.stroke();
  ctx.fillStyle = mix('#ffd36b', '#8a7040', n); ctx.beginPath(); ctx.arc(gx, L, 9, 0, 7); ctx.fill();
  ctx.restore();
  // ground: soil, sand crust, grass on top
  const surf = []; for (let x = 0; x <= W; x += 10) surf.push([x, groundY(x)]);
  ctx.fillStyle = kc('soil', n); ctx.beginPath(); ctx.moveTo(0, H); for (const [x, y] of surf) ctx.lineTo(x, y); ctx.lineTo(W, H); ctx.fill();
  ctx.fillStyle = kc('soilD', n); ctx.beginPath(); ctx.moveTo(0, H); for (const [x, y] of surf) ctx.lineTo(x, y + 70 + 10 * Math.sin(x / 70)); ctx.lineTo(W, H); ctx.fill();
  ctx.strokeStyle = kc('sand', n); ctx.lineWidth = 34; ctx.lineJoin = 'round'; ctx.beginPath(); surf.forEach(([x, y], i) => i ? ctx.lineTo(x, y + 14) : ctx.moveTo(x, y + 14)); ctx.stroke();
  ctx.fillStyle = kc('grassD', n); ctx.beginPath(); ctx.moveTo(1290, groundY(1290) + 30);
  for (let x = 1290; x <= W; x += 10) ctx.lineTo(x, groundY(x) + 30 + 6 * Math.sin(x / 23)); ctx.lineTo(W, groundY(W) - 4); for (let x = W; x >= 1290; x -= 10) ctx.lineTo(x, groundY(x) - 4); ctx.fill();
  ctx.fillStyle = kc('grass', n); ctx.beginPath(); ctx.moveTo(1290, groundY(1290) + 18);
  for (let x = 1290; x <= W; x += 10) ctx.lineTo(x, groundY(x) + 16 + 5 * Math.sin(x / 31)); for (let x = W; x >= 1290; x -= 10) ctx.lineTo(x, groundY(x) - 6); ctx.fill();
  // old high-tide line of seaweed on the sand
  const wx = 1208; ctx.fillStyle = mix('#2f7a5a', '#1a3040', n);
  for (const [dx, dy, s] of WRACK) { ctx.beginPath(); ctx.ellipse(wx + dx, groundY(wx + dx) + 6 + dy, s * 1.6, s * 0.8, 0.3, 0, 7); ctx.fill(); }
  // hut + round trees
  const hx = 1730, hy = groundY(hx);
  ctx.fillStyle = kc('hut', n); ctx.beginPath(); ctx.roundRect(hx - 60, hy - 96, 120, 100, 10); ctx.fill();
  ctx.fillStyle = kc('roof', n); ctx.beginPath(); ctx.moveTo(hx - 82, hy - 88); ctx.lineTo(hx, hy - 160); ctx.lineTo(hx + 82, hy - 88); ctx.closePath(); ctx.fill();
  ctx.fillStyle = mix('#ffe6c2', '#ffcf6a', n); ctx.beginPath(); ctx.roundRect(hx - 30, hy - 70, 26, 26, 6); ctx.fill();
  if (n > 0) glow(hx - 17, hy - 57, 70, n * 0.45, WARM);
  ctx.fillStyle = kc('roof', n); ctx.beginPath(); ctx.roundRect(hx + 12, hy - 58, 28, 58, [14, 14, 0, 0]); ctx.fill();
  for (const [x, s] of TREES) { const y = groundY(x); const sway = Math.sin(t * 1.6 + x) * 3;
    ctx.fillStyle = kc('trunk', n); ctx.beginPath(); ctx.roundRect(x - 8 * s, y - 90 * s, 16 * s, 96 * s, 6); ctx.fill();
    ctx.fillStyle = kc('tree', n); ctx.beginPath(); ctx.arc(x + sway, y - 120 * s, 52 * s, 0, 7); ctx.fill();
    shadeCircle(x + sway, y - 120 * s, 52 * s, 0.25, 'rgba(10,20,50,0.28)', 'rgba(255,255,255,0.18)'); }
  // foam where the water meets the sand
  const fxL = (() => { let lo = 600, hi = 1350; for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (groundY(m) > L) lo = m; else hi = m; } return lo; })();
  ctx.strokeStyle = hexA('#ffffff', 0.85 - n * 0.4); ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(fxL - 90, L + 2); ctx.quadraticCurveTo(fxL - 40, L - 2, fxL + 2, L + 1); ctx.stroke();
  // critter with a lantern (night)

  if (t > 5.2) lanternGlow(t, n);

  popText('The tides would flatten', 960, 140, 76, 3.15, t, { out: 5.0 });
  kicker('NO MOON TO PULL THE SEA', 220, 3.6, 5.0, t);
  popText('Nights would get much darker', 960, 140, 76, 5.3, t, { out: 99, glow: 'rgba(255,200,110,0.45)' });
  kicker('NO MOONLIGHT, EVER', 220, 5.8, 99, t, '#ffd9a0');
}
// tiny round critter walking left, lantern on a stick
function critterPose(t) {
  const x = CRITTER_X(t), walking = t < 6.55 ? seg(t, 5.3, 5.5) : 1 - seg(t, 6.55, 6.75);
  const ph = (1790 - x) / 26, y = groundY(x), slope = Math.atan2(groundY(x + 10) - groundY(x - 10), 20);
  const bob = Math.abs(Math.sin(ph)) * 6 * walking, lift = eBack(seg(t, 6.55, 7.0));
  return { x, y, ph, slope, bob, walking, lift };
}
function lanternPos(p, s) { const lx = -104 - 8 * p.lift, ly = -100 - 30 * p.lift + Math.sin(p.ph * 0.5) * 4 * p.walking;
  const c = Math.cos(p.slope * 0.6), sn = Math.sin(p.slope * 0.6); return [p.x + (lx * c - ly * sn) * s, p.y - p.bob * s + (lx * sn + ly * c) * s]; }
const CS = 1.25;
function drawCritter(t, n) {
  const p = critterPose(t), s = CS, a = seg(t, 5.2, 5.4);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.slope * 0.6); ctx.scale(s, s); ctx.translate(0, -p.bob);
  const fur = mix('#ff9d6c', '#c8765e', n * 0.6), furD = mix('#e0704f', '#8a4a44', n * 0.6), belly = mix('#ffe0c4', '#d9b49c', n * 0.6);
  // tail
  ctx.strokeStyle = furD; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(36, -30); ctx.quadraticCurveTo(70, -34, 66, -62); ctx.quadraticCurveTo(62, -80, 48, -72); ctx.stroke();
  // legs
  for (const [lx, o] of [[-20, 0], [18, Math.PI], [-6, Math.PI], [30, 0]]) {
    const sw = Math.sin(p.ph + o) * 7 * p.walking; ctx.fillStyle = o ? furD : fur;
    ctx.beginPath(); ctx.roundRect(lx - 6 + sw, -18, 12, 18, 6); ctx.fill(); }
  // body
  ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, -44, 48, 36, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, -44, 48, 36, 0, 0, 7); ctx.clip();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(-20, -26, 30, 20, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(40,10,40,0.22)'; ctx.beginPath(); ctx.rect(-60, -90, 120, 100); ctx.ellipse(-10, -54, 52, 38, 0, 0, 7, true); ctx.fill();
  ctx.restore();
  // ears
  ctx.fillStyle = furD; ctx.beginPath(); ctx.ellipse(-8, -80, 9, 15, 0.35, 0, 7); ctx.fill();
  ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(-24, -78, 10, 16, -0.25, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb8b0'; ctx.beginPath(); ctx.ellipse(-24, -77, 5, 9, -0.25, 0, 7); ctx.fill();

  ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(-29 - p.lift * 1.5, -53 - p.lift * 2.5, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-31, -56, 2, 0, 7); ctx.fill();

  ctx.restore();

  ctx.strokeStyle = C.navy; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(0, 10); ctx.stroke();
  ctx.fillStyle = C.navy; ctx.beginPath(); ctx.roundRect(-11, 8, 22, 7, 3); ctx.fill();
  ctx.fillStyle = '#fff1b8'; ctx.beginPath(); ctx.roundRect(-9, 14, 18, 24, 5); ctx.fill();

function lanternGlow(t, n) {

  glow(tx, ty + 30, 300 * (0.9 + 0.2 * p.lift), 0.55 * k, WARM);

}

// ---------- scene D/E: tilted Earth, wobbling axis, seasons ----------
const PD = { x: 960, y: 610, r: 250 };
const wobAmp = t => 22 * eInOut(seg(t, 7.45, 8.4)) * (1 - eInOut(seg(t, 8.5, 9.1)));
const tiltDeg = t => 23.5 + wobAmp(t) * Math.sin(2 * Math.PI * (t - 7.45) / 0.8);
const SEASONS = [
  { k: 'sun', x: 470, y: 440, c: '#ffcb57', t0: 7.7 }, { k: 'flower', x: 1450, y: 440, c: '#ff78ad', t0: 7.8 },
  { k: 'leaf', x: 470, y: 810, c: '#ff8a4c', t0: 7.9 }, { k: 'snow', x: 1450, y: 810, c: '#86e8ff', t0: 8.0 }];
function seasonIcon(s, t) {
  const pin = eBack(seg(t, s.t0, s.t0 + 0.45), 2.2), pout = seg(t, 8.5 + (s.t0 - 7.7) * 0.3, 8.8 + (s.t0 - 7.7) * 0.3);
  const sc = pin * (1 - eIn(pout)); if (sc <= 0.01) return;
  const shake = wobAmp(t) / 22, jr = Math.sin(t * 17 + s.x) * 0.22 * shake, jx = Math.sin(t * 11 + s.y) * 10 * shake, jy = Math.cos(t * 13 + s.x) * 8 * shake;
  ctx.save(); ctx.translate(s.x + jx, s.y + jy); ctx.rotate(jr); ctx.scale(sc, sc);
  glow(0, 0, 130, 0.22);
  ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(0, 0, 70, 0, 7); ctx.fill();
  ctx.strokeStyle = hexA(s.c, 0.9); ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, 70, 0, 7); ctx.stroke();
  ctx.fillStyle = s.c; ctx.strokeStyle = s.c; ctx.lineCap = 'round';
  if (s.k === 'sun') { ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill(); ctx.lineWidth = 7;
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283 + t * 0.8; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 32, Math.sin(a) * 32); ctx.lineTo(Math.cos(a) * 44, Math.sin(a) * 44); ctx.stroke(); } }
  if (s.k === 'flower') { for (let i = 0; i < 5; i++) { const a = i / 5 * 6.283; ctx.beginPath(); ctx.ellipse(Math.cos(a) * 20, Math.sin(a) * 20, 15, 11, a, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#ffcb57'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill(); }
  if (s.k === 'leaf') { ctx.beginPath(); ctx.moveTo(-30, 30); ctx.quadraticCurveTo(-34, -26, 32, -32); ctx.quadraticCurveTo(28, 30, -30, 30); ctx.fill();
    ctx.strokeStyle = C.navy; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-36, 36); ctx.lineTo(18, -18); ctx.stroke(); }
  if (s.k === 'snow') { ctx.lineWidth = 6;
    for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI + Math.PI / 2; const dx = Math.cos(a) * 38, dy = Math.sin(a) * 38; ctx.beginPath(); ctx.moveTo(-dx, -dy); ctx.lineTo(dx, dy); ctx.stroke();
      for (const sg of [1, -1]) { const bx = dx * 0.62 * sg, by = dy * 0.62 * sg; for (const q of [0.6, -0.6]) { ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a + q + (sg < 0 ? Math.PI : 0)) * 12, by + Math.sin(a + q + (sg < 0 ? Math.PI : 0)) * 12); ctx.stroke(); } } } }
  ctx.restore();
}
function sceneEarth(t) {
  paintSpace();
  drawStars(t, 0.15 * t, 1);
  const endK = eInOut(seg(t, 8.5, 9.4));
  const cx = PD.x, cy = lerp(PD.y, 640, endK), R = PD.r * lerp(1, 0.92, endK);
  // empty orbit where the Moon used to travel
  ctx.save(); ctx.globalAlpha = 0.8 * seg(t, 8.8, 9.3); ctx.strokeStyle = 'rgba(199,179,245,0.75)'; ctx.lineWidth = 3; ctx.setLineDash([6, 16]);
  ctx.beginPath(); ctx.ellipse(cx, cy - 20, 640, 170, -0.16, 0, 7); ctx.stroke(); ctx.restore();
  const tilt = tiltDeg(t) * Math.PI / 180;
  drawPlanet(cx, cy, R, t * 0.22 + 2.4, tilt);
  // axis, vertical reference, angle arc + live label
  const axA = seg(t, 7.35, 7.7) * (1 - seg(t, 8.5, 8.8));
  if (axA > 0) {
    const L = R * 1.42 * eOut(seg(t, 7.35, 7.75)), ux = Math.sin(tilt), uy = -Math.cos(tilt);
    ctx.save(); ctx.globalAlpha = axA; ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(195,207,255,0.35)'; ctx.lineWidth = 3; ctx.setLineDash([6, 12]);
    ctx.beginPath(); ctx.moveTo(cx, cy - R * 1.42); ctx.lineTo(cx, cy + R * 1.42); ctx.stroke();
    ctx.setLineDash([18, 14]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.shadowColor = 'rgba(134,232,255,0.8)'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(cx - ux * L, cy - uy * L); ctx.lineTo(cx + ux * L, cy + uy * L); ctx.stroke(); ctx.setLineDash([]);
    const hx = cx + ux * L, hy = cy + uy * L; ctx.fillStyle = '#fff'; ctx.beginPath();
    ctx.moveTo(hx + ux * 22, hy + uy * 22); ctx.lineTo(hx - uy * 15 - ux * 6, hy + ux * 15 - uy * 6); ctx.lineTo(hx + uy * 15 - ux * 6, hy - ux * 15 - uy * 6); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0; ctx.strokeStyle = C.gold; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(cx, cy, R * 1.22, -Math.PI / 2, -Math.PI / 2 + tilt); ctx.stroke();
    // live tilt readout, parked left of the vertical so the swinging arrow never covers it

    ctx.shadowColor = 'rgba(255,200,90,0.6)'; ctx.shadowBlur = 24; ctx.fillText(Math.round(tiltDeg(t)) + '°', cx - 40, cy - R * 1.28);
    ctx.shadowBlur = 0; ctx.font = `600 22px ${FT}`; ctx.letterSpacing = '4px'; ctx.fillStyle = '#c3cfff'; ctx.fillText('TILT', cx - 44, cy - R * 1.28 + 40);
    ctx.restore();

  kicker('SEASONS GO HAYWIRE', 196, 7.95, 8.45, t, '#ffd9a0');
  popText('What if the Moon disappeared?', 960, 160, 88, 8.7, t, { stag: 0.06 });
  kicker('EARTH, ALONE', 1000, 9.1, 99, t);
}

/* ===== timeline ===== */
function zoomAbout(px, py, z) { ctx.translate(px, py); ctx.scale(z, z); ctx.translate(-px, -py); }
function veil(color, alpha) {
  if (alpha <= 0) return;
  ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); ctx.restore();
}
function renderFrame(t) {
  ctx.resetTransform(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  // space → coast: dive into the planet, a cyan flash covers the cut

    ctx.save(); zoomAbout(1030, 600, 1 + 9 * eIn(seg(t, 2.3, 2.95)));
    drawSpaceScene(t);
    ctx.restore();
  }
  // coast → Earth: an iris closes onto the planet
  const iris = seg(t, 6.85, 7.55), irisR = lerp(1250, PD.r, eInOut(iris));
  if (t >= 6.85) sceneEarth(t);
  const coastIn = seg(t, 2.85, 3.0);
  if (coastIn > 0 && t < 7.55) {
    ctx.save();
    let alpha = eInOut(coastIn);
    if (iris > 0) {
      ctx.beginPath(); ctx.arc(PD.x, PD.y, irisR, 0, TAU); ctx.clip();
      alpha *= 1 - seg(t, 7.3, 7.55);
    }
    ctx.globalAlpha = alpha;
    zoomAbout(960, 540, 1 + 0.18 * (1 - eOut(seg(t, 2.85, 4.0))) + 0.25 * eIn(iris));
    sceneCoast(t);
    ctx.restore();
    if (iris > 0 && iris < 1) {
      ctx.save();
      ctx.lineWidth = 10; ctx.strokeStyle = hexA(C.crest, 0.8 * (1 - seg(t, 7.3, 7.55)));
      ctx.shadowBlur = 30; ctx.shadowColor = 'rgba(134,232,255,0.9)';
      ctx.beginPath(); ctx.arc(PD.x, PD.y, irisR, 0, TAU); ctx.stroke();
      ctx.restore();
    }
  }
  const flash = Math.sin(Math.PI * seg(t, 2.72, 3.25));
  if (flash > 0) veil('#8fe4ff', 0.85 * flash ** 1.5);
  ctx.drawImage(VIG, 0, 0);
  // fade up from and back down to the space colour
  veil(C.sky0, eInOut(Math.max(1 - seg(t, 0, 0.4), seg(t, 9.65, DUR))));
}

// sound cues for audio.py
window.events = function () {
  const ev = [{ t: 0.2, k: 'rise' }, { t: 1.2, k: 'land' }];
  const words = (s, t0, st) => popTimes(s, t0, st).forEach((tt, i) => ev.push({ t: tt, k: 'pop', f: 820 + (i % 3) * 90 }));
  words('What if the Moon disappeared?', 0.55);
  ev.push({ t: 0.8, k: 'blip', f: 1100 }, { t: T_VANISH - 0.12, k: 'suck' }, { t: T_VANISH + 0.18, k: 'shimmer' });
  ev.push({ t: 2.3, k: 'whoosh', d: 0.75 }, { t: 2.9, k: 'splash' });
  words('The tides would flatten', 3.15);
  // a wave swell at each high tide, shrinking with the tidal range
  const lv = t => Math.sin(2 * Math.PI * (t - T_TIDE) / TIDE_P + 0.9), dt = 1 / 30;
  for (let t = T_TIDE; t < 5.3; t += dt) if (lv(t) > 0 && lv(t) >= lv(t - dt) && lv(t) > lv(t + dt)) ev.push({ t: Math.max(T_TIDE, t - 0.3), k: 'wave', v: tideAmp(t) / TIDE_A });
  ev.push({ t: 5.0, k: 'dusk' });
  words('Nights would get much darker', 5.3);
  for (let t = 5.3; t < 6.55; t += dt) { const x0 = CRITTER_X(t), x1 = CRITTER_X(t + dt); if (Math.floor((1790 - x0) / 26 / Math.PI) !== Math.floor((1790 - x1) / 26 / Math.PI)) ev.push({ t, k: 'step' }); }
  ev.push({ t: 6.62, k: 'tinkle' }, { t: 6.85, k: 'whoosh', d: 0.7 }, { t: 7.5, k: 'land' });
  words("Earth's axis would wobble", 7.45);
  ev.push({ t: 7.5, k: 'wobble', d: 1.4 });
  for (const s of SEASONS) ev.push({ t: s.t0 + 0.05, k: 'bloop', f: 300 + (s.t0 - 7.7) * 600 });
  ev.push({ t: 8.5, k: 'suck' });
  words('What if the Moon disappeared?', 8.7, 0.06);
  ev.push({ t: 8.7, k: 'chord' });
  return ev.sort((a, b) => a.t - b.t);
};
window.draw = ({ t, q }) => {
  renderFrame(t);
  return canvas.toDataURL('image/jpeg', q || 0.92).slice('data:image/jpeg;base64,'.length);
};
window.ready = (async () => {
  await document.fonts.ready;
  const sample = "What if the Moon disappeared? Earth's 23° TILT Aa";
  await Promise.all([500, 600, 700].map(weight => document.fonts.load(`${weight} 80px 'Fredoka'`, sample)));
  buildSprites();
})();
