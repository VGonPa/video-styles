<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#fff}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── stick-webcomic · minimalist stick-figure webcomic, black ink on white ─────────────────────────
// A two-panel strip titled "BREAK-EVEN". Panel 1: a round-head stick figure presents a hand-drawn chart,
// "TIME SPENT OPTIMIZING VS. TIME SAVED", while the curves draw themselves: every time the slow "time saved"
// line is about to catch up, the "time spent" line jumps another step (edge cases, making it elegant, a config
// file) and finally shoots off the top of the chart ("OPTIMIZING IT"). A colleague asks when the lines cross.
// The camera pans to panel 2, a quiet beat panel with the dry punchline, then a mouse cursor hovers the strip
// and a title-text tooltip appears; everything fades back to white paper.
// All ink is static seeded wobble (no boil), everything is drawn on by stroke length; deterministic in t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eSm = u => u * u * (3 - 2 * u);
const eOutBack = u => { const c = 1.7; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const INK = '#161616', FONT = '"Patrick Hand"';

// ── hand-drawn line primitives ──
// static wobble: smooth seeded perpendicular offset as a function of arc length (same every frame → no boil)
function wobFn(seed, amp) { const r = rng(seed); const ph = [r() * TAU, r() * TAU, r() * TAU], fr = [1 / (90 + r() * 60), 1 / (37 + r() * 20), 1 / (210 + r() * 90)];
  return s => amp * (.5 * Math.sin(s * TAU * fr[0] + ph[0]) + .25 * Math.sin(s * TAU * fr[1] + ph[1]) + .45 * Math.sin(s * TAU * fr[2] + ph[2])); }
// resample a polyline every ~step px and offset perpendicular by the wobble; ends taper to 0 offset
function wob(pts, seed, amp = 1.6, step = 10) {
  const f = wobFn(seed, amp), out = []; let s = 0;
  const total = pts.reduce((a, p, i) => i ? a + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]) : 0, 0);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]); if (L < 1e-6) continue;
    const nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L, n = Math.max(1, Math.ceil(L / step));
    for (let k = (out.length ? 1 : 0); k <= n; k++) { const u = k / n, ss = s + u * L, taper = Math.min(1, ss / 30, (total - ss) / 30);
      const o = f(ss) * Math.max(0, taper); out.push([a[0] + (b[0] - a[0]) * u + nx * o, a[1] + (b[1] - a[1]) * u + ny * o]); }
    s += L;
  }
  return out;
}
function plen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return L; }
// stroke a polyline up to fraction u of its length; returns the pen point
function strokeP(p, u = 1, lw = 4, col = INK) {
  if (u <= 0 || p.length < 2) return null;
  const L = plen(p) * clamp(u); let acc = 0, end = p[0];
  ctx.beginPath(); ctx.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) { const d = Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]);
    if (acc + d >= L) { const v = (L - acc) / d; end = [lerp(p[i - 1][0], p[i][0], v), lerp(p[i - 1][1], p[i][1], v)]; ctx.lineTo(end[0], end[1]); break; }
    acc += d; ctx.lineTo(p[i][0], p[i][1]); end = p[i]; }
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); return end;
}
const line = (a, b, seed, u = 1, lw = 4, amp = 1.4) => strokeP(wob([a, b], seed, amp), u, lw);
function circPts(cx, cy, r, seed, a0 = -1.9) { const f = wobFn(seed, 1.3), out = [];
  for (let i = 0; i <= 44; i++) { const a = a0 + i / 42 * TAU; const rr = r + f(i * 7); out.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } return out; }
function arrowHead(tip, dir, seed, u = 1, sz = 18) { // open V arrowhead
  const a = Math.atan2(dir[1], dir[0]);
  const p1 = [tip[0] - Math.cos(a - .45) * sz, tip[1] - Math.sin(a - .45) * sz], p2 = [tip[0] - Math.cos(a + .45) * sz, tip[1] - Math.sin(a + .45) * sz];
  strokeP(wob([p1, tip, p2], seed, .6, 5), u, 4);
}

// ── hand lettering: per-glyph jitter (seeded, static) and character-by-character reveal ──
function letter(str, x, y, size, n = 1e9, opt = {}) {
  const align = opt.align || 'center', seed = opt.seed || 1, col = opt.col || INK; const r = rng(seed);
  ctx.font = `${size}px ${FONT}`; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = col;
  const sp = opt.track || 0; const ws = [...str].map(c => ctx.measureText(c).width + sp);
  const tw = ws.reduce((a, b) => a + b, 0) - sp; let cx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x;
  const chars = [...str];
  for (let i = 0; i < chars.length; i++) { const jr = (r() - .5) * .07, jy = (r() - .5) * size * .05;
    if (i < n) { const pop = clamp(n - i); ctx.save(); ctx.globalAlpha = pop; ctx.translate(cx + ws[i] / 2, y + jy); ctx.rotate(jr); ctx.fillText(chars[i], -ws[i] / 2 + sp / 2, 0); ctx.restore(); }
    cx += ws[i]; }
  return tw;
}
const CPS = 38; // lettering speed, characters per second
const nChars = (t, t0) => (t - t0) * CPS;
// a speech block: centered lines + a short tail line toward the speaker's head (xkcd convention, no balloon)
function speech(lines, cx, y0, t, t0, tail, seed, size = 44) {
  if (t < t0) return; let used = 0; const lh = size * 1.12; const n = nChars(t, t0);
  lines.forEach((s, i) => { letter(s, cx, y0 + i * lh, size, n - used, { seed: seed + i * 7 }); used += s.length + 2; });
  if (tail) { const u = eOut(seg(t, t0, t0 + .22)); line(tail[0], tail[1], seed + 99, u, 3.2, 1); }
}

// ── stick figures: round head, line torso, two-bone IK arms/legs with visible elbows & knees, nub hands ──
function ik(r, t, L1, L2, bend) {
  const dx = t[0] - r[0], dy = t[1] - r[1]; const a = Math.atan2(dy, dx);
  const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 1, L1 + L2 - 2);
  const al = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  return [[r[0] + L1 * Math.cos(a + bend * al), r[1] + L1 * Math.sin(a + bend * al)], [r[0] + d * Math.cos(a), r[1] + d * Math.sin(a)]];
}
const TORSO = 128, HEADR = 33, ARM = 60, LEG = 66;
// pose: x, gy (ground), lean (rad, + = toward facing), f (facing ±1), hx/hy head offset,
// hands (fh = front hand, bh = back hand) relative to shoulder, feet (ff, bf) relative to hip, crouch
function figGeom(p) {
  const f = p.f, hip = [p.x, p.gy - 124 + (p.crouch || 0)];
  const d = [Math.sin(p.lean) * f, -Math.cos(p.lean)];
  const neck = [hip[0] + d[0] * TORSO, hip[1] + d[1] * TORSO];
  const sh = [hip[0] + d[0] * (TORSO - 14), hip[1] + d[1] * (TORSO - 14)];
  const head = [neck[0] + d[0] * (HEADR + 5) + p.hx * f, neck[1] + d[1] * (HEADR + 5) + p.hy];
  const arm = (v, bend) => ik(sh, [sh[0] + v[0] * f, sh[1] + v[1]], ARM, ARM, bend);
  const leg = v => ik(hip, [hip[0] + v[0] * f, p.gy + (v[1] || 0)], LEG, LEG, -f);
  const [fe, fhd] = arm(p.fh, p.fhb ?? f), [be, bhd] = arm(p.bh, p.bhb ?? f);
  const [fk, ffd] = leg(p.ff), [bk, bfd] = leg(p.bf);
  return { hip, neck, sh, head, fe, fhd, be, bhd, fk, ffd, bk, bfd };
}
// reveal ∈ [0,1] draws the figure stroke by stroke (head → torso → legs → arms)
function drawFig(p, seed, reveal = 1) {
  const g = figGeom(p), lw = 5.2;
  const part = (i, n) => clamp(reveal * n - i);
  strokeP(circPts(g.head[0], g.head[1], HEADR, seed), part(0, 6), lw);
  strokeP(wob([g.neck, g.hip], seed + 1, 1.2), part(1, 6), lw);
  strokeP(wob([g.hip, g.bk, g.bfd], seed + 2, 1), part(2, 6), lw);
  strokeP(wob([g.hip, g.fk, g.ffd], seed + 3, 1), part(3, 6), lw);
  strokeP(wob([g.sh, g.be, g.bhd], seed + 4, 1), part(4, 6), lw);
  strokeP(wob([g.sh, g.fe, g.fhd], seed + 5, 1), part(5, 6), lw);
  ctx.fillStyle = INK;
  for (const [h, i] of [[g.bhd, 4], [g.fhd, 5]]) if (part(i, 6) >= 1) { ctx.beginPath(); ctx.arc(h[0], h[1], 5.5, 0, TAU); ctx.fill(); }
  return g;
}
function mixPose(a, b, u) { const r = Object.assign({}, a);
  for (const k in b) { if (Array.isArray(b[k])) r[k] = [lerp(a[k][0], b[k][0], u), lerp(a[k][1], b[k][1], u)]; else if (typeof b[k] === 'number') r[k] = lerp(a[k] ?? 0, b[k], u); else r[k] = b[k]; }
  return r; }
// keyed pose track: [[t, pose, dur, ease]], each key tweens from the previous accumulated pose
function poseAt(keys, t) { let p = keys[0][1];
  for (let i = 1; i < keys.length; i++) { const [t0, q, d = .35, e = eInOut] = keys[i]; if (t < t0) break; p = mixPose(p, Object.assign({}, p, q), e(seg(t, t0, t0 + d))); }
  return p; }

// ── layout ──
const PANEL = [[110, 150, 1810, 960], [110 + 1920, 150, 1810 + 1920, 960]];
const T = { title: .1, box: .15, figA: .45, figB: .7, axes: .95, ctitle: 1.1, A1: 1.35, c0: 1.9, c1: 4.55, B1: 3.55, A2: 4.45, sp0: 5.15, sp1: 5.55,
  pan0: 5.95, pan1: 6.7, B2: 6.75, A3: 7.65, cur0: 8.05, tip: 8.45, fade0: 9.45 };
// chart: data (weeks 0..100, hours 0..~120) → screen
const OX = 600, OY = 810, SX = 8.2, SY = 4.7;
const cx_ = w => OX + w * SX, cy_ = h => OY - h * SY;
const SPENT = [[0, 0], [.8, 5], [2.4, 16], [4, 20], [30.5, 20], [31.2, 24], [32.4, 33.5], [33.6, 36], [56.5, 36], [57.2, 40], [58.4, 49.5], [59.6, 52],
  [82.5, 52], [83.2, 56], [84.4, 63.5], [85.6, 66], [97.6, 66], [98.1, 74], [98.6, 92], [99.1, 118]];
const SAVED_K = .62;
const spentPath = wob(SPENT.map(([w, h]) => [cx_(w), cy_(h)]), 31, 1.3, 8);
const spentLen = plen(spentPath);
// progress along the spent path by arc length: reaches the last plateau's end by c1, pauses, then the spike
const SPIKE_START = plen(wob(SPENT.slice(0, 17).map(([w, h]) => [cx_(w), cy_(h)]), 31, 1.3, 8)) / spentLen;
function spentU(t) { if (t < T.c0) return 0;
  if (t < T.c1) { const u = seg(t, T.c0, T.c1); return SPIKE_START * (u * .82 + .18 * eInOut(u)); }
  if (t < T.sp0) return SPIKE_START;
  return lerp(SPIKE_START, 1, Math.pow(seg(t, T.sp0, T.sp1), 1.6)); }
function penAt(u) { let L = spentLen * u, acc = 0;
  for (let i = 1; i < spentPath.length; i++) { const a = spentPath[i - 1], b = spentPath[i], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (acc + d >= L) { const v = (L - acc) / d; return [lerp(a[0], b[0], v), lerp(a[1], b[1], v)]; } acc += d; }
  return spentPath[spentPath.length - 1]; }
const savedPath = wob([[cx_(0), cy_(0)], [cx_(99.6), cy_(99.6 * SAVED_K)]], 47, 1.5, 8);
// step annotations: [text, label x, label y, leader from, leader to, week at which it appears]
const NOTES = [
  ['TIME SPENT', 735, 690, null, null, 12],
  ['EDGE CASES', 770, 598, [822, 610], [852, 652], 32],
  ['MAKING IT ELEGANT', 968, 520, [1040, 533], [1071, 578], 58],
  ['A CONFIG FILE', 1180, 452, [1250, 465], [1283, 512], 84],
  ['TIME SAVED', 1090, 742, [1050, 712], [1022, 680], 52],
];
const SPIKE_NOTE = ['OPTIMIZING IT', 1446, 318, [1440, 306], [1420, 290]];

// ── characters ──
// Ada (presenter, faces right, holds a pointer) and Ben (colleague, faces left)
const A_BASE = { x: 330, gy: 900, lean: .03, f: 1, hx: 0, hy: 0, fh: [52, 70], bh: [-18, 104], ff: [22, 0], bf: [-20, 0], crouch: 0 };
const B_BASE = { x: 1640, gy: 900, lean: .02, f: -1, hx: 0, hy: 0, fh: [18, 104], bh: [-16, 104], ff: [20, 0], bf: [-20, 0], crouch: 0 };
const A_KEYS = [[0, A_BASE],
  [1.3, { fh: [70, 40] }, .4],                                      // lifts pointer toward chart
  [4.4, { bh: [-58, -6], bhb: -1, hy: -3, lean: .06 }, .3, eOutBack], // "Right after I optimize it." — finger up
  [5.3, { bh: [-18, 104], bhb: 1, hy: 0, lean: .03 }, .45],
  [5.95, { x: 330 + 1920 + 530, fh: [30, 100], lean: .0 }, 0.01],      // panel 2 placement (off-screen during pan)
  [7.6, { lean: -.03, hx: -3, fh: [34, 98] }, .35],
  [7.72, { hy: 2 }, .2], [7.92, { hy: 0 }, .25]];
const B_KEYS = [[0, B_BASE],
  [3.2, { fh: [18, -8], fhb: -1, lean: .04, hy: 3 }, .45],          // hand to chin, thinking
  [5.2, { lean: -.13, hx: -6, fh: [40, 70], fhb: 1, bh: [-40, 76], bhb: -1 }, .22, eOutBack], // leans back as the spike shoots up
  [5.62, { lean: -.05, hx: -2, fh: [18, 104], bh: [-16, 104] }, .5],
  [5.95, { x: 1640 + 1920 - 340, lean: .02, hx: 0 }, .01],
  [6.55, { fh: [28, 94], fhb: 1, bh: [-28, 94], bhb: -1, lean: .05 }, .35], // hands on hips
  [7.6, { lean: .0 }, .4]];
// pointer (a thin stick from Ada's front hand) aims at the pen in panel 1, droops in panel 2
function drawPointer(g, t, aim, seed, gy = 900) {
  const h = g.fhd; let tip;
  if (aim) { const d = [aim[0] - h[0], aim[1] - h[1]], L = Math.hypot(d[0], d[1]); tip = [h[0] + d[0] / L * 165, h[1] + d[1] / L * 165]; }
  else tip = [h[0] + 58, gy - 2]; // resting on the floor like a cane
  const L = Math.hypot(tip[0] - h[0], tip[1] - h[1]), dir = [(tip[0] - h[0]) / L, (tip[1] - h[1]) / L];
  line([h[0] - dir[0] * 10, h[1] - dir[1] * 10], tip, seed, 1, 3, .5);
}

// ── scene ──
const TITLE = 'BREAK-EVEN';
const TOOLTIP = 'Break-even is always one refactor away.';
function panelBox(i, u) { const [x0, y0, x1, y1] = PANEL[i];
  strokeP(wob([[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0 + 2]], 11 + i * 5, 1.8, 12), u, 4.2); }
function pointerAim(t) { if (t < T.c0) return [cx_(12), cy_(28)];
  const p = penAt(spentU(t)); return [p[0] - 4, p[1] + 18]; }
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  // comic title (fixed, above the strip)
  letter(TITLE, W / 2, 112, 62, nChars(t, T.title) * .8, { seed: 5, track: 4 });
  const camX = 1920 * eInOut(seg(t, T.pan0, T.pan1));
  ctx.save(); ctx.translate(-camX, 0);
  // clip each panel's contents to its border so the pan reads as moving along a strip
  panelBox(0, eInOut(seg(t, T.box, T.box + .6))); panelBox(1, 1);
  ctx.save(); ctx.beginPath(); ctx.rect(PANEL[0][0] + 4, PANEL[0][1] + 4, PANEL[0][2] - PANEL[0][0] - 8, PANEL[0][3] - PANEL[0][1] - 8); ctx.clip();
  drawPanel1(t); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(PANEL[1][0] + 4, PANEL[1][1] + 4, PANEL[1][2] - PANEL[1][0] - 8, PANEL[1][3] - PANEL[1][1] - 8); ctx.clip();
  drawPanel2(t); ctx.restore();
  ctx.restore();
  drawCursor(t);
  const fo = eSm(seg(t, T.fade0, DUR - .05));
  if (fo > 0) { ctx.fillStyle = `rgba(255,255,255,${fo})`; ctx.fillRect(0, 0, W, H); }
}
function drawPanel1(t) {
  if (t > T.pan1 + .1) return;
  // axes (with arrowheads) + labels
  const ua = seg(t, T.axes, T.axes + .45);
  const yTop = [OX, 318], xEnd = [1452, OY];
  const ay = strokeP(wob([[OX, OY + 6], yTop], 21, 1.2), eOut(clamp(ua * 2)), 4.2);
  const ax = strokeP(wob([[OX - 6, OY], xEnd], 22, 1.2), eOut(clamp(ua * 2 - .6)), 4.2);
  if (ua > .5) arrowHead(yTop, [0, -1], 23, clamp(ua * 2 - 1));
  if (ua >= 1) arrowHead(xEnd, [1, 0], 24, seg(t, T.axes + .45, T.axes + .6));
  ctx.save(); ctx.translate(OX - 28, 590); ctx.rotate(-Math.PI / 2); letter('HOURS', 0, 0, 34, nChars(t, T.axes + .3), { seed: 25 }); ctx.restore();
  letter('WEEKS', 1395, 856, 34, nChars(t, T.axes + .4), { seed: 26 });
  letter('TIME SPENT OPTIMIZING VS. TIME SAVED', 1010, 232, 42, nChars(t, T.ctitle) * 1.4, { seed: 27 });
  // curves
  const us = spentU(t);
  if (us > 0) {
    const pen = strokeP(spentPath, us, 4.4);
    const pw = (pen[0] - OX) / SX; // saved line advances with the pen's week
    strokeP(savedPath, clamp(pw / 99.6), 4.4);
    for (const [s, x, y, a, b, w] of NOTES) { const tn = noteTime(w); if (t < tn) continue;
      letter(s, x, y, 33, nChars(t, tn), { seed: 40 + w }); if (a) line(a, b, 60 + w, eOut(seg(t, tn, tn + .2)), 2.6, .8); }
    if (us >= 1 || t > T.sp1) { const tn = T.sp0 + .2; arrowHead(penAt(1), [.2, -1], 70, seg(t, tn, tn + .1), 20);
      letter(SPIKE_NOTE[0], SPIKE_NOTE[1], SPIKE_NOTE[2], 33, nChars(t, tn), { seed: 71, align: 'left' });
      line(SPIKE_NOTE[3], SPIKE_NOTE[4], 72, eOut(seg(t, tn, tn + .2)), 2.6, .8); }
  }
  // figures
  const pa = poseAt(A_KEYS, Math.min(t, T.pan0 - .01)), pb = poseAt(B_KEYS, Math.min(t, T.pan0 - .01));
  const ga = drawFig(pa, 100, eInOut(seg(t, T.figA, T.figA + .55)));
  if (t > T.figA + .5) drawPointer(ga, t, pointerAim(t), 120);
  drawFig(pb, 200, eInOut(seg(t, T.figB, T.figB + .55)));
  // reaction ticks by Ben's head as the spike shoots up
  const rk = seg(t, 5.22, 5.3) * (1 - seg(t, 5.75, 5.95));
  if (rk > 0) { const g = figGeom(pb); for (let i = 0; i < 3; i++) { const a = -2.2 + i * .45 + Math.PI * 1.08, r0 = HEADR + 16;
    line([g.head[0] + Math.cos(a) * r0 * -1, g.head[1] + Math.sin(a) * r0], [g.head[0] + Math.cos(a) * (r0 + 26 * rk) * -1, g.head[1] + Math.sin(a) * (r0 + 26 * rk)], 80 + i, 1, 3.2, .5); } }
  // dialogue
  const ha = figGeom(pa).head, hb = figGeom(pb).head;
  speech(['My script saves me', 'five minutes a week.'], 300, 300, t, T.A1, [[262, 368], [ha[0] - 12, ha[1] - HEADR - 18]], 300);
  speech(['Right after I', 'optimize it.'], 446, 462, t, T.A2, [[420, 522], [ha[0] + 18, ha[1] - HEADR - 14]], 320);
  speech(['So when do the', 'lines cross?'], 1636, 436, t, T.B1, [[1640, 494], [hb[0] + 4, hb[1] - HEADR - 18]], 340);
}
// week → time at which the pen passes it (for annotation timing); invert spentU numerically
const NOTE_T = {};
function noteTime(w) { if (NOTE_T[w] != null) return NOTE_T[w];
  for (let tt = T.c0; tt < T.c1 + .01; tt += 1 / 120) { const p = penAt(spentU(tt)); if ((p[0] - OX) / SX >= w) return (NOTE_T[w] = tt); } return (NOTE_T[w] = T.c1); }
function drawPanel2(t) {
  if (t < T.pan0 - .1) { // still visible entering during the pan: draw figures in their resting pose
  }
  const tt = Math.max(t, T.pan0 + .02);
  const pa = poseAt(A_KEYS, tt), pb = poseAt(B_KEYS, tt);
  const ga = drawFig(pa, 100, 1); drawPointer(ga, t, null, 121); drawFig(pb, 200, 1);
  const ha = figGeom(pa).head, hb = figGeom(pb).head;
  speech(['How long did', 'this chart take?'], hb[0] + 30, 330, t, T.B2, [[hb[0] + 18, 392], [hb[0] + 4, hb[1] - HEADR - 18]], 400);
  speech(["That's a", 'separate chart.'], ha[0] - 30, 420, t, T.A3, [[ha[0] - 18, 482], [ha[0] - 4, ha[1] - HEADR - 16]], 420);
}
// mouse cursor hovers the strip; after a browser-like delay the title text appears as a tooltip
function drawCursor(t) {
  if (t < T.cur0) return;
  const u = eOut(seg(t, T.cur0, T.tip - .05));
  const x = lerp(520, 196, u), y = lerp(1130, 596, u);
  if (t >= T.tip) { const a = eOut(seg(t, T.tip, T.tip + .12));
    ctx.save(); ctx.globalAlpha = a; ctx.font = `36px ${FONT}`; const tw = ctx.measureText(TOOLTIP).width;
    const bx = x + 6, by = y + 36, bw = tw + 32, bh = 54;
    ctx.fillStyle = 'rgba(0,0,0,.10)'; ctx.fillRect(bx + 4, by + 5, bw, bh);
    ctx.fillStyle = '#fbfbe8'; ctx.fillRect(bx, by, bw, bh); ctx.strokeStyle = '#8a8a80'; ctx.lineWidth = 1.5; ctx.strokeRect(bx + .5, by + .5, bw, bh);
    ctx.fillStyle = '#222'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(TOOLTIP, bx + 15, by + bh / 2 + 2); ctx.restore(); }
  // arrow cursor
  ctx.save(); ctx.translate(x, y); ctx.scale(1.5, 1.5);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22); ctx.lineTo(5.2, 17.2); ctx.lineTo(8.6, 25); ctx.lineTo(11.6, 23.6); ctx.lineTo(8.2, 16.2); ctx.lineTo(15, 16); ctx.closePath();
  ctx.fillStyle = '#111'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore();
}

window.ready = (async () => {
  await document.fonts.load(`44px ${FONT}`, 'Aa'); await document.fonts.ready;
  for (const [, , , , , w] of NOTES) noteTime(w);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
window.events = () => {
  const ev = [];
  const pen = (t, d, v = 1) => ev.push({ t, k: 'pen', d, v });
  pen(T.title, .35, .6); pen(T.box, .6, .8); pen(T.figA, .55); pen(T.figB, .55); pen(T.axes, .5);
  // lettering: short pen bursts per line of text
  const letters = (t0, lines) => { let n = 0; for (const s of lines) { ev.push({ t: t0 + n / CPS, k: 'write', d: s.length / CPS }); n += s.length + 2; } };
  letters(T.ctitle, ['TIME SPENT OPTIMIZING']); letters(T.A1, ['My script saves me', 'five minutes a week.']);
  letters(T.B1, ['So when do the', 'lines cross?']); letters(T.A2, ['Right after I', 'optimize it.']);
  letters(T.B2, ['How long did', 'this chart take?']); letters(T.A3, ["That's a", 'separate chart.']);
  // the curves: one long marker stroke with little "squeaks" at each step riser
  ev.push({ t: T.c0, k: 'marker', d: T.c1 - T.c0 });
  for (const w of [31, 57, 83]) ev.push({ t: noteTime(w), k: 'squeak', v: .7 });
  ev.push({ t: T.sp0, k: 'marker', d: T.sp1 - T.sp0, v: 1.3 }); ev.push({ t: T.sp0 + .05, k: 'rise' });
  ev.push({ t: T.pan0, k: 'slide', d: T.pan1 - T.pan0 });
  ev.push({ t: T.cur0, k: 'tick' }); ev.push({ t: T.tip, k: 'pop' });
  return ev;
};
