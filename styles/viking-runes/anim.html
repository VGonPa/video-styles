// ── viking-runes · Norse runestone at dusk ─────────────────────────────────────────────
// Close on a blank granite stone lit by a torch → an interlaced ribbon-serpent band chisels itself around the edge
// (chips, dust, fresh-cut grooves) and red ochre paint floods in behind the chisel → the serpent's head bites over its
// own tail → Elder Futhark runes are cut into the band one by one; each glows like an ember and hands its English letter
// to the centre panel: MAKE YOUR MARK → the camera pulls back to the whole stone on a mound above a misty fjord at dusk,
// the torch revealed beside it → light fades to the torch, then to black.

// ── timeline ──
const T = { band0: 0.4, band1: 3.45, paint0: 0.7, paint1: 3.7, head0: 3.38, head1: 3.95, bind0: 2.85, bind1: 3.8,

// ── geometry helpers ──

// ── the stone (stone space: x right, y down, ground at y≈505) ──
const STONE_CP = [[-418, 560], [-410, 300], [-394, 40], [-376, -180], [-352, -350], [-296, -455], [-190, -528], [-40, -578], [110, -598], [238, -574], [326, -498], [370, -330], [384, -70], [398, 250], [424, 560]];

// the serpent band: tail tip (bottom centre) → left side → over the top → right side → head crossing over the tail
const BAND_BODY = [[176, 282], [64, 392], [-100, 434], [-242, 405], [-312, 290], [-322, 60], [-310, -170], [-276, -345], [-196, -452], [-74, -508], [66, -518], [190, -482], [272, -398], [306, -252], [318, -20], [322, 210], [306, 330], [258, 402], [150, 342], [36, 304]];

function polyStroke(c, P, i0, i1) { c.beginPath(); c.moveTo(P[i0][0], P[i0][1]); for (let k = i0 + 1; k <= i1; k++) c.lineTo(P[k][0], P[k][1]); }

// serpent head in local frame (x forward along tangent, y across), drawn at band end
const HEAD = catmull([[0, -HW], [40, -HW - 8], [96, -50], [140, -30], [176, -12], [190, -2], [180, 6], [152, 12], [112, 30], [62, 46], [22, HW + 4], [0, HW]].map(([x, y]) => [x, -y]), false, 10);

const LAPPET = catmull([[70, -54], [40, -84], [-6, -98], [-52, -90], [-76, -64], [-68, -40], [-46, -40], [-42, -58], [-56, -63]].map(([x, y]) => [x, -y]), false, 12);
const EYE = catmull([[80, -24], [100, -38], [130, -25], [102, -15], [80, -24]].map(([x, y]) => [x, -y]), false, 8);

// ── runes (Elder Futhark), unit box x∈[0,.6], y∈[0,1] (y down) ──
const RUNE = {

  K: [[[.46, .24], [.08, .5], [.46, .76]]],
  E: [[[0, 1], [0, 0], [.3, .3], [.6, 0], [.6, 1]]],
  Y: [[[.3, .12], [.06, .36], [.3, .6]], [[.3, .4], [.54, .64], [.3, .88]]],
  O: [[[.02, .95], [.56, .34], [.3, .04], [.04, .34], [.58, .95]]],
  U: [[[0, 1], [0, 0], [.52, .34], [.52, 1]]],

let LETTERS = [];       // {ch, tx, ty, w, rune}
function buildRunes() {

  ctx.font = `700 ${FS}px ${SERIF}`;

  lines.forEach((ln, li) => { const ws = [...ln].map(ch => ctx.measureText(ch).width), gap = 12, tot = ws.reduce((a, b) => a + b, 0) + gap * (ln.length - 1);
    let x = -tot / 2 + 2; ws.forEach((w, i) => { pos.push({ ch: ln[i], tx: x + w / 2, ty: LY[li], w }); x += w + gap; }); });
  let li = 0; RUNES = [];
  { let k0 = 0, k1 = BAND.N - 1; while (!(BAND.X[k0] < -250 && BAND.Y[k0] < 150)) k0++; while (!(BAND.X[k1] > 250 && BAND.Y[k1] < 60)) k1--;

function runeSegs(ch) {          // → list of polylines in rune-local units (centred, rotated frame: x along band, y across)
  const P = RUNE[ch], w = .6 * RUNE_H; if (P === 'dots') return 'dots';

// ── precomputed textures ──
const TS = 1.7, SX0 = -440, SY0 = -610, SW = 880, SH = 1260;   // stone texture: world rect & resolution
let STONE_TEX, PAINT_PAT, BLACK_PAT, PAINT_TEX, BG, BG_BLUR, MIST, GRAIN = [], VIG, GROUND;
function buildStone() {

    const y = SY0 + py / TS;

      const h0 = hA(x, y), dx = hA(x + 2.5, y) - h0, dy = hA(x, y + 2.5) - h0;

const BW = 2112, BH = 1188, HOR = 700;
