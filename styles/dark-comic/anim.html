<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── dark-comic · mid-80s graphic novel: spotted blacks, chiaroscuro, muted dot-screen colour ──
// "The city never sleeps. Neither do I." A widescreen splash panel of a rain-soaked city: a hooded
// vigilante crouches on a ledge, only a neon rim-light betrays him until lightning turns the sky white
// and reveals his silhouette. The panel cracks and shatters into a 9-panel grid page (the same rooftop
// seen at nine distances, the lightning panel, the dripping coat, the facade going dark window by window).
// The camera pushes into the last panel: one lit window where someone is still typing. Everything
// else sinks into black; the window stays lit.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const sInOut = u => u * u * (3 - 2 * u);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hh = x => { const s = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// ── palette ──
const INK = '#0d0c10', PAPER = '#e7e0cf';
const NEON = '#ff4f8b', NEON_C = '#56d6dc', AMBER = '#e8a95a';
const CAP = '"Courier Prime"', SIGNF = '"Oswald"';

// ── timeline ──
const T = {
  capA: [0.75, 0.058], capB: [4.75, 0.07], capC: [7.75, 0.045],     // [start, seconds per char]
  crack: 3.02, shatter: 3.30, gridIn: 3.36, push: [6.05, 7.45], dark: [9.1, 9.9],
};
const CAPA = 'The city never sleeps.', CAPB = 'Neither do I.', CAPC = 'Four a.m. One light still on.';

// ── world (rooftop scene, world units) ──
const LEDGE_Y = 930, ROOF_END = 1262, FAC_X = 1392, FAC_TOP = 238, FX = 1020, FS = 1.3;
const WIN = { x0: 1510, dx: 112, y0: 322, dy: 140, w: 58, h: 84, cols: 8, rows: 8 };
const TWc = 3, TWr = 3, TWX = WIN.x0 + TWc * WIN.dx, TWY = WIN.y0 + TWr * WIN.dy;   // the lit window
const TWCX = TWX + WIN.w / 2, TWCY = TWY + WIN.h / 2;

let SHADOW = [], FLC, SKY, GRAIN, DOT, DOTPAT, FAR = [], NEAR = [], WINS = [], BOLT = [], SHARDS = [], CRACKS = [], FROZEN = null;

// flash intensity of the lightning (scene A); grid panel 4 is a permanent flash
function flashAt(t) {
  const p = (t0, a, tau) => t < t0 ? 0 : a * Math.exp(-(t - t0) / tau);
  const f = p(2.28, 0.55, 0.035) + p(2.40, 1.0, 0.16) + p(2.74, 0.35, 0.06) + p(3.0, 0.8, 0.09);
  return clamp(f);
}

// ── textures & geometry, built once ──
function build() {
  const r = rng(60);
  // painterly night sky: slate to violet, sodium haze at the horizon, brushy cloud masses
  SKY = mk(2700, 1400); let g = SKY.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 1400);
  gr.addColorStop(0, '#141925'); gr.addColorStop(0.35, '#232a3b'); gr.addColorStop(0.62, '#3a3850'); gr.addColorStop(0.80, '#5c4650'); gr.addColorStop(1, '#7a5646');
  g.fillStyle = gr; g.fillRect(0, 0, 2700, 1400);
  for (let i = 0; i < 900; i++) {
    const x = r() * 2700, y = r() * 1000, rx = 60 + r() * 260, ry = 10 + r() * 42, a = (r() - .5) * 0.25;
    const top = y < 380, cols = top ? ['20,24,36', '44,48,70', '12,14,22'] : ['70,62,86', '96,74,82', '40,42,62', '120,86,74'];
    const c = cols[Math.floor(r() * cols.length)];
    g.save(); g.translate(x, y); g.rotate(a); g.scale(1, ry / rx);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, rx); rg.addColorStop(0, `rgba(${c},${0.10 + r() * .14})`); rg.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
  }
  g.lineCap = 'round';
  for (let i = 0; i < 2600; i++) {          // dry-brush streaks
    const x = r() * 2700, y = r() * 1300, l = 20 + r() * 90;
    g.strokeStyle = r() < .5 ? `rgba(10,12,20,${0.05 + r() * .08})` : `rgba(150,130,150,${0.03 + r() * .05})`;
    g.lineWidth = 1 + r() * 4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (r() - .5) * 8); g.stroke();
  }
  // skyline: far (blue-grey) and near (darker); low block behind the figure so he reads against sky
  let x = -140;
  while (x < 1420) { const w = 60 + r() * 150; let top = 560 + r() * 250; if (x + w > 780 && x < 1330) top = 860 + r() * 40; FAR.push({ x, w, top, spire: r() < .15 }); x += w - 6; }
  x = -140;
  while (x < 1420) {
    const w = 80 + r() * 170; let top = 700 + r() * 200;
    if (x + w > 840 && x < 1320) top = 870 + r() * 30;
    NEAR.push({ x, w, top, setback: r() < .3 }); x += w + (r() < .3 ? 10 : -4);
  }
  for (const b of FAR.concat(NEAR)) { b.lit = []; const cols = Math.floor(b.w / 18), rows = Math.floor((1300 - b.top) / 26);
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) if (r() < 0.08) b.lit.push([b.x + 8 + i * 18, b.top + 12 + j * 26, r()]); }
  // facade windows: lit state, lights-out time, one flickering TV
  for (let c = 0; c < WIN.cols; c++) for (let rr = 0; rr < WIN.rows; rr++) {
    const target = c === TWc && rr === TWr;
    const lit = target || r() < 0.2;
    WINS.push({ c, r: rr, x: WIN.x0 + c * WIN.dx, y: WIN.y0 + rr * WIN.dy, lit, target, off: target ? 99 : 3.6 + r() * 3.4, tv: !target && lit && r() < 0.12, warm: r() });
  }
  // feathered brush edge of the big cast shadow on the facade
  { const A = [2240, FAC_TOP - 22], B = [FAC_X - 14, 660], n = 44; SHADOW.push([FAC_X - 14, FAC_TOP - 22], A);
    const nx = -(B[1] - A[1]), ny = B[0] - A[0], nl = Math.hypot(nx, ny);
    for (let i = 1; i < n; i++) { const u = i / n, sp = (i % 2 ? 8 + r() * 26 : -r() * 6); SHADOW.push([lerp(A[0], B[0], u) - nx / nl * sp, lerp(A[1], B[1], u) - ny / nl * sp]); }
    SHADOW.push(B); }
  FLC = mk(W, H);
  // lightning bolt (world): jagged main channel with two branches
  const bolt = (x0, y0, x1, y1, n, jit) => { const P = [[x0, y0]]; for (let i = 1; i < n; i++) { const u = i / n; P.push([lerp(x0, x1, u) + (r() - .5) * jit, lerp(y0, y1, u) + (r() - .5) * jit * .4]); } P.push([x1, y1]); return P; };
  BOLT.push(bolt(560, -20, 700, 700, 16, 90)); BOLT.push(bolt(BOLT[0][6][0], BOLT[0][6][1], 420, 480, 7, 60)); BOLT.push(bolt(BOLT[0][10][0], BOLT[0][10][1], 820, 610, 5, 50));
  // shatter: radial/ring tessellation around the impact point
  const C = [1120, 520], NA = 15, RINGS = [0, 90, 230, 430, 700, 1050, 1500, 2200];
  const ang = []; for (let i = 0; i < NA; i++) ang.push((i + (r() - .5) * .6) / NA * TAU);
  const V = RINGS.map((rad, k) => ang.map(a => { const rj = k === 0 ? 0 : rad * (1 + (r() - .5) * .22); const aj = a + (r() - .5) * .08; return [C[0] + Math.cos(aj) * rj, C[1] + Math.sin(aj) * rj]; }));
  for (let k = 0; k < RINGS.length - 1; k++) for (let i = 0; i < NA; i++) {
    const j = (i + 1) % NA, poly = k === 0 ? [V[0][0], V[1][i], V[1][j]] : [V[k][i], V[k + 1][i], V[k + 1][j], V[k][j]];
    const cx = poly.reduce((s, p) => s + p[0], 0) / poly.length, cy = poly.reduce((s, p) => s + p[1], 0) / poly.length;
    const dx = cx - C[0], dy = cy - C[1], d = Math.hypot(dx, dy) + 1;
    SHARDS.push({ poly, cx, cy, vx: dx / d * (380 + r() * 700) * (0.6 + 300 / (d + 200)), vy: dy / d * (300 + r() * 500) - 250 * r(), w: (r() - .5) * 6, z: 0.4 + r() * 1.2, delay: d / 5200 + r() * .04, tint: r() });
  }
  for (let i = 0; i < NA; i++) CRACKS.push({ k: 'ray', pts: V.map(ring => ring[i]) });
  for (let k = 1; k < 5; k++) for (let i = 0; i < NA; i++) if (r() < 0.8) CRACKS.push({ k: 'ring', ring: k, pts: [V[k][i], V[k][(i + 1) % NA]] });

  DOT = mk(24, 24); g = DOT.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 24, 24); g.fillStyle = '#8f8a94';
  for (const [a, b] of [[0, 0], [24, 0], [0, 24], [24, 24], [12, 12]]) { g.beginPath(); g.arc(a, b, 4.6, 0, TAU); g.fill(); }
  DOTPAT = ctx.createPattern(DOT, 'repeat'); DOTPAT.setTransform(new DOMMatrix().scale(0.22));
  // paper grain + ink specks (screen space)
  GRAIN = mk(W, H); g = GRAIN.getContext('2d'); const id = g.createImageData(W, H), dd = id.data;
  for (let i = 0; i < W * H; i++) { const v = 236 + r() * 19 - (r() < .003 ? 60 : 0); dd[i * 4] = v; dd[i * 4 + 1] = v - 2; dd[i * 4 + 2] = v - 6; dd[i * 4 + 3] = 255; }
  g.putImageData(id, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 5000; i++) { const x0 = r() * W, y0 = r() * H, a = r() * TAU, l = 2 + r() * 9; g.strokeStyle = `rgba(120,105,85,${0.05 + r() * .08})`; g.lineWidth = .6 + r(); g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + Math.cos(a) * l, y0 + Math.sin(a) * l); g.stroke(); }
}

// ── figure: hooded vigilante crouched on the ledge, profile facing right ──
// Built from overlapping body parts (all wound the same way, so they fill as one silhouette).
// Points are [x, y] in figure units (feet at y = 0, facing right); a third value 1 marks a sharp corner.
function shapePath(p, pts, X, Y) {
  let A = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; A += a[0] * b[1] - b[0] * a[1]; }

  const s0 = P(0)[2] ? [X(P(0)[0]), Y(P(0)[1])] : mid(P(-1), P(0));
  p.moveTo(s0[0], s0[1]);
  for (let i = P(0)[2] ? 1 : 0; i <= n; i++) {
    const c = P(i); if (i === n && P(0)[2]) { p.lineTo(X(c[0]), Y(c[1])); break; }
    if (c[2]) p.lineTo(X(c[0]), Y(c[1])); else { const m = mid(c, P(i + 1)); p.quadraticCurveTo(X(c[0]), Y(c[1]), m[0], m[1]); }
  }

}

  const parts = [
    // hood with the profile set in its opening: brow, nose, lips, chin
    [[98, -240], [104, -260], [124, -268], [146, -258], [153, -250, 1], [147, -245], [149, -238], [157, -229, 1], [151, -226], [153, -222], [150, -219], [152, -213, 1],
     [143, -206], [140, -198], [120, -204], [100, -218]],
    // coat over the torso: straight back leaning forward, shoulder line, chest
    [[2, -102, 1], [94, -226, 1], [112, -224], [138, -202], [148, -184], [144, -156], [128, -128], [60, -110], [20, -92]],
    // upper arm hanging from the shoulder to the elbow
    [[108, -214], [132, -214], [138, -176], [134, -150], [118, -138], [106, -148], [104, -180]],
    // forearm laid across the raised knee
    [[112, -158], [150, -160], [182, -158], [188, -150], [184, -140], [150, -138], [114, -136]],
    // gloved hand hanging past the knee, thumb forward
    [[176, -158], [190, -154], [197, -142], [198, -124], [196, -110, 1], [190, -108, 1], [187, -122], [184, -114, 1], [179, -115, 1], [180, -130], [176, -138], [175, -148]],
    // raised thigh: hip to knee
    [[46, -124], [110, -150], [158, -150], [176, -140], [176, -124], [160, -112], [100, -100], [56, -92]],
    // shin of the raised leg down to the ankle
    [[154, -144], [178, -134], [172, -96], [158, -20], [140, -16], [138, -40], [150, -110]],
    // boot planted on the ledge
    [[136, -30], [158, -26], [172, -16], [184, -8], [186, 0, 1], [132, 0, 1], [130, -14]],
    // folded leg: thigh down to the knee on the ledge
    [[16, -110], [58, -116], [84, -70], [104, -20], [100, -2, 1], [80, -2], [60, -40], [30, -80]],
    // folded leg: shin lying back along the ledge, toes planted
    [[102, -4, 1], [94, -18], [40, -24], [6, -26], [-8, -30], [-20, -18], [-26, 0, 1]],
    // long coat skirt from the hips, torn by the wind into three tails
    [[20, -118], [-10, -122 + wv(0, 3)], [-60, -128 + wv(1, 6)], [-112, -130 + wv(2, 10)], [-156, -136 + wv(3, 14), 1],
     [-118, -116 + wv(2.4, 10)], [-86, -110 + wv(2, 8), 1], [-126, -96 + wv(3, 12)], [-176, -94 + wv(3.6, 16), 1],
     [-128, -78 + wv(3, 12)], [-90, -72 + wv(2.4, 8), 1], [-120, -58 + wv(3.2, 12)], [-150, -48 + wv(3.8, 14), 1],
     [-96, -44 + wv(2.6, 8)], [-40, -40 + wv(1.4, 4)], [10, -46], [40, -64], [44, -96]],
  ];
  for (const pt of parts) shapePath(p, pt, X, Y);
  return [p, new Path2D()];
}

// ── world drawing ──
function drawWindow(g, w, t) {
  const on = w.lit && t < w.off;
  const flick = w.tv ? 0.55 + 0.45 * hh(Math.floor(t * 9) + w.c * 7) : 1;
  if (!on) {
    const gr = g.createLinearGradient(0, w.y, 0, w.y + WIN.h); gr.addColorStop(0, '#262b3a'); gr.addColorStop(0.5, '#0f1016'); gr.addColorStop(1, '#0a0a0e');
    g.fillStyle = gr; g.fillRect(w.x, w.y, WIN.w, WIN.h);
  } else if (!w.target) {
    g.fillStyle = w.tv ? `rgba(120,160,220,${0.55 * flick})` : (w.warm < .5 ? '#c98b48' : '#b7773f'); g.fillRect(w.x, w.y, WIN.w, WIN.h);
    g.fillStyle = 'rgba(40,20,14,0.55)'; g.fillRect(w.x, w.y + WIN.h * (0.25 + w.warm * .4), WIN.w * (0.3 + w.warm * .5), WIN.h);  // blind / furniture shadow
  }
  g.fillStyle = INK; g.fillRect(w.x - 3, w.y - 3, WIN.w + 6, 4); g.fillRect(w.x - 3, w.y + WIN.h * .48, WIN.w + 6, 4); g.fillRect(w.x + WIN.w / 2 - 1.5, w.y, 3, WIN.h);
  g.fillStyle = '#6d4b3e'; g.fillRect(w.x - 5, w.y + WIN.h, WIN.w + 10, 5);
  g.fillStyle = INK; g.fillRect(w.x - 5, w.y + WIN.h + 5, WIN.w + 10, 9);
}
function drawTarget(g, t) {
  g.save(); g.translate(TWX, TWY);
  const ww = WIN.w, wh = WIN.h, P = (pts) => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); };
  g.beginPath(); g.rect(0, 0, ww, wh); g.clip();
  // back wall lit by a desk lamp
  let gr = g.createRadialGradient(47, 52, 1, 42, 50, 62);
  gr.addColorStop(0, '#fff6cc'); gr.addColorStop(0.25, '#ffcc7a'); gr.addColorStop(0.6, '#c87034'); gr.addColorStop(1, '#4a200e');
  g.fillStyle = gr; g.fillRect(0, 0, ww, wh);

  g.fillStyle = '#5a2812'; g.fillRect(26, 11, 10, 8); g.fillStyle = '#c98748'; g.fillRect(27.2, 12.2, 7.6, 5.6); g.fillStyle = '#6a3418'; P([[27.2, 17.8], [30, 14], [32, 16], [34.8, 13.5], [34.8, 17.8]]); g.fill();
  g.fillStyle = '#2a1208'; g.fillRect(38, 24, 20, 1.6);
  for (let i = 0, x = 39; x < 57; i++) { const bw = 1.2 + hh(i * 3.3) * 1.6, bh = 6 + hh(i * 7.1) * 4; g.fillStyle = ['#3a160a', '#5c2410', '#2c1a10', '#6e3014'][i % 4]; g.fillRect(x, 24 - bh, bw, bh); x += bw + 0.35; }

  g.fillStyle = '#26100a'; g.fillRect(0, 62, ww, wh - 62); g.fillStyle = '#f0b060'; g.fillRect(24, 61.6, 34, 0.9);
  // lamp: gooseneck, tilted shade, cone of light
  g.save(); g.globalCompositeOperation = 'screen'; gr = g.createLinearGradient(50, 47, 44, 62); gr.addColorStop(0, 'rgba(255,240,190,0.55)'); gr.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = gr; P([[45.5, 48.5], [55, 46.5], [58, 62], [36, 62]]); g.fill(); g.restore();
  g.strokeStyle = '#1a0a05'; g.lineWidth = 1.1; g.beginPath(); g.moveTo(53, 61.5); g.quadraticCurveTo(55, 52, 51, 46); g.stroke();
  g.fillStyle = '#1a0a05'; g.fillRect(50.5, 60.4, 5, 1.6); P([[44, 43], [51.5, 40], [55.5, 46.5], [46, 49.5]]); g.fill();
  g.fillStyle = '#fff6d0'; P([[46, 49.5], [55.5, 46.5], [55.2, 47.3], [46.4, 50.3]]); g.fill();
  // mug with rising steam
  g.fillStyle = '#1a0a05'; g.fillRect(55, 57, 3, 4.6); g.strokeStyle = '#1a0a05'; g.lineWidth = 0.7; g.beginPath(); g.arc(55, 59.2, 1.3, Math.PI * 0.5, Math.PI * 1.5); g.stroke();
  g.strokeStyle = 'rgba(255,240,210,0.55)'; g.lineWidth = 0.6;
  for (let k = 0; k < 2; k++) { g.beginPath(); for (let i = 0; i <= 12; i++) { const v = i / 12, y = 56 - v * 13, x = 56.3 + k * 0.9 + Math.sin(v * 5 + t * 3 + k * 2) * (0.5 + v * 1.4); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  // typewriter and its sheet
  g.fillStyle = '#fff8e2'; P([[37.5, 44.5], [45.2, 44], [45.8, 53.5], [37.8, 53.8]]); g.fill();
  g.strokeStyle = 'rgba(80,50,30,0.5)'; g.lineWidth = 0.35; g.beginPath(); for (let i = 0; i < 6; i++) { const y = 46 + i * 1.2, len = i === 5 ? 3 + (t * 11 % 4) : 6.2; g.moveTo(38.6, y); g.lineTo(38.6 + len, y); } g.stroke();
  g.fillStyle = '#170905'; g.fillRect(35, 52.6, 13.6, 2.2); g.beginPath(); g.arc(35, 53.7, 1.2, 0, TAU); g.arc(48.6, 53.7, 1.2, 0, TAU); g.fill();
  P([[34.5, 55.5], [48.5, 55.5], [51, 62], [32, 62]]); g.fill();
  g.fillStyle = 'rgba(255,210,140,0.7)'; for (let i = 0; i < 7; i++) g.fillRect(35.5 + i * 2, 58.2 + (i % 2) * 0.6, 0.9, 0.5);

  const k = Math.floor(t * 11), nod = (hh(k) > .5 ? 0.45 : 0) + Math.sin(t * 1.4) * 0.3, hit = hh(k + 7) > .5 ? 0.7 : 0;

    .forEach(([x, y], i) => i ? body.lineTo(x, y) : body.moveTo(x, y)); body.closePath();

  g.lineWidth = Math.max(2, fs * 0.09); g.strokeStyle = INK; g.strokeRect(x, y, bw, bh);
  g.fillStyle = '#16120e'; g.fillText(text.slice(0, n), x + fs * 0.8, y + bh * 0.66);
  const done = n >= text.length, blink = Math.floor(t * 3) % 2 === 0;
  if (!done || (blink && t < t0 + dt * text.length + 1.2)) { const cx = x + fs * 0.8 + g.measureText(text.slice(0, n)).width + fs * 0.08; g.fillRect(cx, y + bh * 0.66 - fs * 0.72, fs * 0.5, fs * 0.84); }
  g.restore();
}

// ── pages ──
const PA = { x: 40, y: 36, w: 1840, h: 1008 };
function camA(t) { const u = eInOut(seg(t, 0, 3.4)); return { cx: lerp(1320, 1260, u), cy: lerp(700, 690, u), vw: lerp(2320, 2060, u) }; }
function pageA(g, t) {
  g.fillStyle = PAPER; g.fillRect(-200, -200, W + 400, H + 400);
  panel(g, PA.x, PA.y, PA.w, PA.h, camA(t), t, { flash: flashAt(t), rain: 1.1, seed: 11, border: 5 });
  caption(g, PA.x + 44, PA.y + 40, CAPA, T.capA[0], T.capA[1], t, 40);
}
// 3×3 grid
const GP = { w: 572, h: 300, g: 22 }; GP.x0 = (W - 3 * GP.w - 2 * GP.g) / 2; GP.y0 = (H - 3 * GP.h - 2 * GP.g) / 2;
const GRID = [
  { cx: 1210, cy: 690, vw: 2350, seed: 21 },
  { cx: 1120, cy: 760, vw: 1250, seed: 22 },
  { cx: 1080, cy: 770, vw: 640, seed: 23 },
  { cx: 1000, cy: 650, vw: 1750, seed: 24, flash: 1 },
  { cx: 1150, cy: 636, vw: 330, seed: 25, cap: true },
  { cx: 985, cy: 890, vw: 400, seed: 26, custom: puddle },
  { cx: 1360, cy: 690, vw: 1100, seed: 27 },
  { cx: 1830, cy: 700, vw: 640, seed: 28 },
  { cx: TWCX, cy: TWCY + 4, vw: 250, seed: 29, rain: 0.9, focus: true },
];
const gx = i => GP.x0 + (i % 3) * (GP.w + GP.g), gy = i => GP.y0 + Math.floor(i / 3) * (GP.h + GP.g);
function pageB(g, t) {
  g.fillStyle = PAPER; g.fillRect(-400, -400, W + 800, H + 800);
  g.fillStyle = 'rgba(20,16,14,0.7)'; g.font = `600 15px ${SIGNF}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('17', W / 2, H - GP.y0 / 2);
  GRID.forEach((p, i) => {
    const dev = eOut(seg(t, T.gridIn + i * 0.09, T.gridIn + 0.35 + i * 0.09));
    if (dev <= 0) return;
    const u = t - T.gridIn, cam = { cx: p.cx, cy: p.cy, vw: p.vw * (1 - 0.012 * u) };
    panel(g, gx(i), gy(i), GP.w, GP.h, cam, t, { flash: p.flash, focus: p.focus, seed: p.seed, dev, rain: p.rain, rscale: 0.7, custom: p.custom, dotA: i === 8 ? lerp(0.55, 0.24, clamp((camB(t).s - 1) / 2.6)) : 0.55 });
    if (p.cap) caption(g, gx(i) + 18, gy(i) + GP.h - 70, CAPB, T.capB[0], T.capB[1], t, 25);
  });
  const i = 8; caption(g, gx(i) + 44, gy(i) + 14, CAPC, T.capC[0], T.capC[1], t, 12.5);
}
function camB(t) {
  const u = eInOut(seg(t, T.push[0], T.push[1])), tx = gx(8) + GP.w / 2, ty = gy(8) + GP.h / 2;
  const s0 = 1 + 0.02 * seg(t, T.shatter, T.push[0]), s1 = 3.62 + 0.14 * seg(t, T.push[1], DUR);
  // anticipation: a tiny pull-back before the push
  const ant = Math.sin(Math.PI * seg(t, T.push[0] - 0.35, T.push[0] + 0.1)) * 0.015;
  const s = Math.exp(lerp(Math.log(s0), Math.log(s1), u)) - ant;
  const k = (s - s0) / (s1 - s0 || 1);
  return { s, fx: lerp(W / 2, tx, clamp(u * 1.0 + (k - u) * 0.6)), fy: lerp(H / 2, ty, clamp(u + (k - u) * 0.6)) };
}

function drawShatter(g, t) {
  const u = t - T.shatter;
  for (const sh of SHARDS) {
    const v = Math.max(0, u - sh.delay); if (v > 1.1) continue;
    const dx = sh.vx * v, dy = sh.vy * v + 0.5 * 2600 * v * v, rot = sh.w * v, z = 1 + sh.z * v * 1.4;
    const al = 1 - seg(v, 0.35, 0.8);
    if (al <= 0) continue;
    g.save(); g.globalAlpha = al;
    g.translate(sh.cx + dx, sh.cy + dy); g.rotate(rot); g.scale(z, z); g.translate(-sh.cx, -sh.cy);
    g.beginPath(); sh.poly.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
    g.save(); g.clip(); g.drawImage(FROZEN, 0, 0);
    g.fillStyle = `rgba(${sh.tint < .5 ? '255,255,255' : '0,0,0'},${0.08 + 0.12 * Math.min(1, v * 4)})`; g.fill(); g.restore();
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 2; g.stroke();
    g.restore();
  }
}
function drawCracks(g, t) {
  const u = eOut(seg(t, T.crack, T.shatter - 0.04));
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  for (const c of CRACKS) {
    let P = c.pts;
    if (c.k === 'ray') { const L = u * 2400; const Q = [P[0]]; let acc = 0; for (let i = 1; i < P.length; i++) { const d = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); if (acc + d > L) { const f = (L - acc) / d; Q.push([lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)]); break; } Q.push(P[i]); acc += d; } P = Q; }
    else if (u < c.ring * 0.18) continue;
    g.strokeStyle = 'rgba(0,0,0,0.6)'; g.lineWidth = 4; g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x + 1.5, y + 1.5) : g.moveTo(x + 1.5, y + 1.5)); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1.8; g.beginPath(); P.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
  }
  g.restore();
}

window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t < T.shatter) {
    // impact punch as the panel cracks
    const pu = t > T.crack ? Math.exp(-(t - T.crack) * 18) * 0.012 : 0;
    ctx.setTransform(1 + pu, 0, 0, 1 + pu, -W / 2 * pu, -H / 2 * pu);
    pageA(ctx, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (t >= T.crack) drawCracks(ctx, t);
  } else {
    const c = camB(t);
    ctx.setTransform(c.s, 0, 0, c.s, W / 2 - c.fx * c.s, H / 2 - c.fy * c.s);
    pageB(ctx, t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (t < T.shatter + 1.3) {
      if (!FROZEN) { FROZEN = mk(W, H); const fg = FROZEN.getContext('2d'); pageA(fg, T.shatter - 0.001); drawCracks(fg, T.shatter - 0.001); }
      drawShatter(ctx, t);
    }
  }
  // print finish: paper grain over everything
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(GRAIN, 0, 0); ctx.globalCompositeOperation = 'source-over';
  // the lit window blooms once we are inside the last panel
  const bl = seg(t, T.push[0] + 0.6, T.push[1] + 0.6);
  if (bl > 0) { const c = camB(t), p8 = GRID[8], sp8 = GP.w / p8.vw;
    const px = gx(8) + GP.w / 2 + (TWCX - p8.cx) * sp8, py = gy(8) + GP.h / 2 + (TWCY - p8.cy) * sp8;
    const sx = W / 2 + (px - c.fx) * c.s, sy = H / 2 + (py - c.fy) * c.s, rr = 60 * sp8 * c.s;
    const gr = ctx.createRadialGradient(sx, sy, rr * 0.2, sx, sy, rr * 1.3); gr.addColorStop(0, `rgba(255,190,110,${0.12 * bl})`); gr.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; }
  // ending: the night closes in around the lit window
  const d = eInOut(seg(t, T.dark[0], T.dark[1]));
  if (d > 0) {
    const gr = ctx.createRadialGradient(W / 2, H / 2 + 10, lerp(1000, 330, d), W / 2, H / 2 + 10, lerp(1500, 720, d));
    gr.addColorStop(0, 'rgba(5,4,6,0)'); gr.addColorStop(1, `rgba(5,4,6,${0.96 * d})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  }
  const fade = Math.max(1 - seg(t, 0, 0.45), seg(t, 9.75, 10.0) * 0.35);
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#050406'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.events = () => {
  const ev = [];
  const typ = (text, t0, dt) => { for (let i = 0; i < text.length; i++) if (text[i] !== ' ') ev.push({ k: 'key', t: t0 + i * dt }); else ev.push({ k: 'space', t: t0 + i * dt }); ev.push({ k: 'ding', t: t0 + text.length * dt + 0.08 }); };
  typ(CAPA, T.capA[0], T.capA[1]); typ(CAPB, T.capB[0], T.capB[1]); typ(CAPC, T.capC[0], T.capC[1]);
  ev.push({ k: 'thunder', t: 2.40, v: 1 }, { k: 'thunder', t: 3.0, v: 0.6 });
  ev.push({ k: 'crack', t: T.crack }, { k: 'shatter', t: T.shatter });
  GRID.forEach((p, i) => ev.push({ k: 'thump', t: T.gridIn + i * 0.09 }));
  ev.push({ k: 'push', t: T.push[0] - 0.2, d: T.push[1] - T.push[0] + 0.3 }, { k: 'end', t: T.dark[0] });
  return ev;
};
window.ready = (async () => {
  await document.fonts.load(`700 40px ${CAP}`); await document.fonts.load(`600 70px ${SIGNF}`);
  await document.fonts.ready; build();
})();
</script>
