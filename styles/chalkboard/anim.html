<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="common.js"></script>
<script>
// CHALKBOARD — Lesson 3 · Pythagoras: chalk texture, counted squares, eraser wipe, ladder word problem
const WHITE = '#f3f0e6', YEL = '#f1d35f', FONT = "'Caveat'";
const TRAY = 1004;                                // top edge of the wooden chalk tray

// ---------- static layers, all painted once ----------
// The slate: green-black gradient, mottling, ghosts of old erasing, grain, vignette, then the tray with chalk.
const board = mk(W, H);
paintSlate(board.getContext('2d'), rng(11));
function paintSlate(g, rand) {
  const slate = g.createLinearGradient(0, 0, 0, H);
  slate.addColorStop(0, '#26352e'); slate.addColorStop(1, '#1b2621');
  g.fillStyle = slate; g.fillRect(0, 0, W, H);
  for (let n = 0; n < 140; n++) {                 // light and dark mottling
    const x = rand() * W, y = rand() * H, rad = 80 + rand() * 260, light = rand() < .5;
    const spot = g.createRadialGradient(x, y, 0, x, y, rad);
    spot.addColorStop(0, light ? 'rgba(120,150,130,0.05)' : 'rgba(0,0,0,0.07)'); spot.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = spot; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  g.lineCap = 'round';
  for (let n = 0; n < 16; n++) {                  // curved eraser swipes: bundles of concentric arcs
    const cx = rand() * W, cy = rand() * (TRAY - 100), R = 160 + rand() * 380, from = rand() * 6, span = .6 + rand() * 1.1, alpha = 0.018 + rand() * 0.03;
    for (let ring = 0; ring < 26; ring++) {
      const rad = R + (ring - 13) * 3.4;
      g.strokeStyle = `rgba(225,235,225,${alpha * (0.4 + rand() * 0.9)})`; g.lineWidth = 1 + rand() * 2.4;
      g.beginPath(); g.arc(cx, cy, rad, from + rand() * .08, from + span - rand() * .1); g.stroke();
    }
  }
  for (let n = 0; n < 10; n++) {                  // straight eraser swipes: bundles of wavy lines
    const x = rand() * W, y = rand() * (TRAY - 60), len = 300 + rand() * 500, alpha = 0.015 + rand() * 0.022;
    for (let line = 0; line < 20; line++) {
      g.strokeStyle = `rgba(225,235,225,${alpha * rand()})`; g.lineWidth = 1 + rand() * 2;
      const ly = y + line * 4 + rand() * 2;
      g.beginPath(); g.moveTo(x, ly); g.bezierCurveTo(x + len * .3, ly - 8, x + len * .7, ly + 8, x + len, ly + (rand() - .5) * 6); g.stroke();
    }
  }
  const img = g.getImageData(0, 0, W, H), px = img.data;   // grain
  for (let i = 0; i < px.length; i += 4) { const n = (rand() - .5) * 9; for (let ch = 0; ch < 3; ch++) px[i + ch] += n; }
  g.putImageData(img, 0, 0);
  const vig = g.createRadialGradient(960, 480, 520, 960, 540, 1250);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = vig; g.fillRect(0, 0, W, H);
  paintTray(g, rand);
}
function paintTray(g, rand) {
  const wood = g.createLinearGradient(0, TRAY, 0, H);
  [[0, '#8a5a34'], [.12, '#6d4424'], [.55, '#58361c'], [1, '#3a2312']].forEach(([at, col]) => wood.addColorStop(at, col));
  g.fillStyle = wood; g.fillRect(0, TRAY, W, H - TRAY);
  for (let n = 0; n < 90; n++) {                  // wood grain
    g.strokeStyle = `rgba(${rand() < .5 ? '30,15,5' : '160,110,70'},${0.08 + rand() * 0.12})`; g.lineWidth = .6 + rand() * 1.4;
    const y = TRAY + 8 + rand() * (H - TRAY - 10);
    g.beginPath(); g.moveTo(0, y);
    for (let x = 0; x <= W; x += 120) g.lineTo(x, y + Math.sin(x * .004 + n) * 2.5);
    g.stroke();
  }
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillRect(0, TRAY - 3, W, 5);          // lip shadow
  g.fillStyle = 'rgba(255,220,180,0.18)'; g.fillRect(0, TRAY + 2, W, 2);    // lip highlight
  for (let n = 0; n < 1400; n++) {                // chalk powder
    g.fillStyle = `rgba(235,235,225,${rand() * 0.25})`;
    g.fillRect(rand() * W, TRAY + 6 + rand() * 18, 1 + rand() * 2, 1 + rand() * 1.5);
  }
  const stick = (x, y, len, rot, col) => {
    g.save(); g.translate(x, y); g.rotate(rot);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.roundRect(-len / 2 + 4, -6, len, 20, 9); g.fill();
    const body = g.createLinearGradient(0, -10, 0, 10);
    body.addColorStop(0, col); body.addColorStop(.6, col); body.addColorStop(1, 'rgba(120,110,90,1)');
    g.fillStyle = body; g.beginPath(); g.roundRect(-len / 2, -10, len, 20, 9); g.fill();
    g.restore();
  };
  stick(1480, TRAY + 22, 120, -0.04, '#efece2');
  stick(1622, TRAY + 24, 64, 0.08, '#efd66a');
}

// Chalk texture as an alpha mask over the chalk layer: rows vary slowly (stroke direction), random pits drop out.
const grain = mk(W, H);
{ const g = grain.getContext('2d'), img = g.createImageData(W, H), px = img.data, rand = rng(5);
  const rowLevel = new Float32Array(H);
  for (let y = 0; y < H; y++) rowLevel[y] = 0.82 + 0.18 * Math.sin(y * 0.9) * Math.sin(y * 0.13 + 2);
  for (let y = 0, i = 0; y < H; y++) {
    for (let x = 0; x < W; x++, i += 4) {
      const pit = rand();
      let alpha = rowLevel[y] * (0.72 + 0.28 * rand());
      if (pit < 0.16) alpha *= 0.15 + rand() * 0.3;
      px[i] = px[i + 1] = px[i + 2] = 255;
      px[i + 3] = Math.min(255, alpha * 255);
    }
  }
  g.putImageData(img, 0, 0); }

// Working layers: L holds the chalk, M the area wiped so far, SM the smudge left inside the wipe.
const L = mk(W, H), lc = L.getContext('2d');
const M = mk(W, H), mc = M.getContext('2d'), SM = mk(W, H), smc = SM.getContext('2d');
const ER = { w: 250, h: 92 };                     // eraser footprint
const eStamp = mk(ER.w + 40, ER.h + 40);          // its soft-edged print, stamped along the wipe path
{ const g = eStamp.getContext('2d'); g.filter = 'blur(9px)'; g.fillStyle = '#000'; g.beginPath(); g.roundRect(24, 24, ER.w - 8, ER.h - 8, 20); g.fill(); }
const streak = mk(W, H);                          // vertical drag marks the eraser leaves behind
{ const g = streak.getContext('2d'), rand = rng(9);
  for (let n = 0; n < 2600; n++) {
    const y = rand() * H, x = rand() * W, len = 60 + rand() * 420;
    g.strokeStyle = `rgba(235,240,232,${0.15 + rand() * 0.85})`; g.lineWidth = .6 + rand() * 2.2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rand() - .5) * 5, y + len); g.stroke();
  } }
// soft dust blob for the final puff
const blob = mk(96, 96);
{ const c = blob.getContext('2d'), g = c.createRadialGradient(48, 48, 0, 48, 48, 48); g.addColorStop(0, 'rgba(240,240,232,0.26)'); g.addColorStop(.45, 'rgba(240,240,232,0.1)'); g.addColorStop(1, 'rgba(240,240,232,0)'); c.fillStyle = g; c.fillRect(0, 0, 96, 96); }

// ---------- timeline of chalk marks ----------
const acts = [];
function stroke(path, t0, t1, o = {}) {
  path.jitter(o.jit ?? 1.8, acts.length * 31 + 7);
  acts.push({ kind: 'path', path, t0, t1, color: o.color || WHITE, width: o.width || 8, ease: o.ease || (u => u) });
}
function text(str, x, y, size, t0, t1, o = {}) {
  acts.push({ kind: 'text', str, x, y, size, t0, t1, color: o.color || WHITE, align: o.align || 'left', rot: o.rot || 0,
              w8: o.w8 || 700, hide: o.hide ?? 1e9 });
}
function poly(pts, t0, t1, o = {}) { const p = P().M(...pts[0]); for (const q of pts.slice(1)) p.L(...q); stroke(p, t0, t1, o); }
const add2 = (p, v, k = 1) => [p[0] + v[0] * k, p[1] + v[1] * k];
// title
text('Lesson 3 · Pythagoras', 150, 150, 100, 0.25, 0.95, { rot: -0.015 });
stroke(P().M(146, 184).S([[400, 178], [700, 174], [890, 170]], 16), 0.97, 1.12, { width: 7 });

// --- scene 1: right triangle 3-4-5 with a square on each side (U = one counted cell) ---
const U = 60, Cx = 440, Cy = 680;
const A = [Cx, Cy - 3 * U], B = [Cx + 4 * U, Cy], C = [Cx, Cy];
const E1 = [4 * U / 5, 3 * U / 5], NN = [3 * U / 5, -4 * U / 5];   // one cell along AB, one cell outward from C
poly([C, B], 1.2, 1.38);
poly([C, A], 1.4, 1.55);
poly([A, B], 1.57, 1.8);
poly([[Cx, Cy - 24], [Cx + 24, Cy - 24], [Cx + 24, Cy]], 1.82, 1.9, { width: 5 });
// the squares (three new sides each)
poly([A, [Cx - 3 * U, A[1]], [Cx - 3 * U, Cy], C], 2.12, 2.36, { width: 7 });
poly([C, [Cx, Cy + 4 * U], [B[0], Cy + 4 * U], B], 2.3, 2.56, { width: 7 });
poly([A, add2(A, NN, 5), add2(B, NN, 5), B], 2.5, 2.8, { width: 7 });
// a², b², c² sit in the squares until counting replaces them with numbers
const cC = [(A[0] + B[0] + 5 * NN[0]) / 2, (A[1] + B[1] + 5 * NN[1]) / 2];
text('a²', Cx - 1.5 * U, Cy - 1.5 * U + 26, 84, 2.38, 2.5, { align: 'center', hide: 3.95 });
text('b²', Cx + 2 * U, Cy + 2 * U + 26, 84, 2.58, 2.7, { align: 'center', hide: 4.33 });
text('c²', cC[0], cC[1] + 26, 84, 2.82, 2.94, { align: 'center', hide: 4.77 });
// formula on the right
const RX = 1420;
text('a² + b² = c²', RX, 400, 150, 2.96, 3.46, { align: 'center' });
// grid lines inside the squares
{ let t = 3.45; const g = (p, q) => { poly([p, q], t, t + 0.05, { width: 3, jit: 1 }); t += 0.028; };
  for (let k = 1; k < 3; k++) { g([Cx - k * U, A[1]], [Cx - k * U, Cy]); g([Cx - 3 * U, Cy - k * U], [Cx, Cy - k * U]); }
  for (let k = 1; k < 4; k++) { g([Cx + k * U, Cy], [Cx + k * U, Cy + 4 * U]); g([Cx, Cy + k * U], [B[0], Cy + k * U]); }
  for (let k = 1; k < 5; k++) { g(add2(A, NN, k), add2(B, NN, k)); g(add2(A, E1, k), add2(add2(A, E1, k), NN, 5)); } }
// counted cells: each cell is ticked in turn while the square's number counts up
function countSquare(n, cell, cx, cy, t0, dt) {
  const cells = []; for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) cells.push(cell(i, j));
  cells.forEach((q, k) => acts.push({ kind: 'cell', q, t0: t0 + k * dt, t1: t0 + k * dt + 0.08 }));
  acts.push({ kind: 'count', n: n * n, cx, cy, t0, dt, t1: t0 + n * n * dt });
}
const sq = (x, y) => [[x, y], [x + U, y], [x + U, y + U], [x, y + U]];
countSquare(3, (i, j) => sq(Cx - 3 * U + i * U, A[1] + j * U), Cx - 1.5 * U, Cy - 1.5 * U, 3.95, 0.04);
countSquare(4, (i, j) => sq(Cx + i * U, Cy + j * U), Cx + 2 * U, Cy + 2 * U, 4.33, 0.026);
countSquare(5, (i, j) => { const o = add2(add2(A, E1, i), NN, j); return [o, add2(o, E1), add2(add2(o, E1), NN), add2(o, NN)]; },
  cC[0], cC[1], 4.77, 0.02);
text('9 + 16 = 25', RX, 570, 130, 5.35, 5.75, { align: 'center', color: YEL });
stroke(P().M(1735, 528).L(1760, 556).L(1812, 478), 5.78, 5.9, { color: YEL, width: 8 });

// --- eraser swipe: the diagram half is wiped up and down ---
const ERASE = { t0: 6.15, t1: 6.95, in0: 5.9, out1: 7.3 };
const ePath = P().M(330, 250).S([[345, 600], [330, 945], [440, 930], [540, 600], [545, 250], [650, 260], [750, 600], [760, 945], [830, 760], [780, 480]], 26).done();

// --- scene 2: ladder against a wall (5 m ladder, foot 3 m out) ---
const S = 130, WX = 800, GY = 900, F = [WX - 3 * S, GY], T = [WX, GY - 4 * S];
poly([[220, GY], [890, GY]], 7.0, 7.15, { width: 7 });
{ let t = 7.05; for (let x = 250; x < 880; x += 45) { poly([[x, GY + 6], [x - 18, GY + 26]], t, t + 0.03, { width: 3, jit: .5 }); t += 0.006; } }
poly([[WX, GY], [WX, 330]], 7.1, 7.25, { width: 7 });
{ let t = 7.18; for (let y = 380, k = 0; y < GY; y += 52, k++) { poly([[WX + 6, y], [WX + 78, y]], t, t + 0.025, { width: 3, jit: .6 }); const bx = WX + (k % 2 ? 30 : 58); poly([[bx, y], [bx, Math.min(GY, y + 52)]], t, t + 0.02, { width: 3, jit: .6 }); t += 0.011; } }
{ const d = [(T[0] - F[0]) / (5 * S), (T[1] - F[1]) / (5 * S)], pp = [-d[1], d[0]], R = 18;
  // each rail runs from the ground line (y = GY) up to the wall (x = WX)
  const rail = off => { const o = add2(F, pp, off); return [add2(o, d, (GY - o[1]) / d[1]), add2(o, d, (WX - o[0]) / d[0])]; };
  poly(rail(-R), 7.25, 7.42, { width: 7 });
  poly(rail(R), 7.3, 7.47, { width: 7 });
  for (let k = 1; k <= 8; k++) { const m = add2(F, d, k * 5 * S / 9.2); poly([add2(m, pp, -R), add2(m, pp, R)], 7.45 + k * 0.014, 7.48 + k * 0.014, { width: 5, jit: .6 }); }
  const mid = add2(add2(F, d, 2.5 * S), pp, -62);
  text('5 m', mid[0], mid[1], 78, 7.62, 7.74, { align: 'center', rot: Math.atan2(d[1], d[0]) });
}
poly([[WX - 26, GY], [WX - 26, GY - 26], [WX, GY - 26]], 7.55, 7.62, { width: 5 });
text('3 m', (F[0] + WX) / 2, GY + 70, 76, 7.74, 7.86, { align: 'center' });
text('h = ?', 694, 704, 84, 7.86, 8.0, { align: 'center', color: YEL });
text('h² = 25 − 9', RX, 750, 116, 8.05, 8.45, { align: 'center' });
text('h = 4 m', RX, 900, 140, 8.5, 8.8, { align: 'center', color: YEL });
stroke(P().M(1215, 928).S([[1400, 922], [1560, 920], [1660, 924]], 20), 8.82, 8.98, { color: YEL, width: 8, ease: eout });
const PUFF = { t: 8.98, x: 1672, y: 922 };
for (const a of acts) if (a.kind === 'path') a.path.done();

// ---------- drawing ----------
// Label widths, needed for the write-on (call once the font is loaded).
function measureLabels() {
  for (const a of acts) {
    if (a.kind !== 'text') continue;
    ctx.font = `${a.w8} ${a.size}px ${FONT}`;
    a.w = ctx.measureText(a.str).width;
    a.xs = [0];
    for (let n = 1; n <= a.str.length; n++) a.xs.push(ctx.measureText(a.str.slice(0, n)).width);
    a.left = a.align === 'center' ? a.x - a.w / 2 : a.x;
  }
}
// Pixels of a label written by time t.
function writtenWidth(a, t) {
  const pos = seg(t, a.t0, a.t1) * a.str.length, letter = Math.min(a.str.length - 1, Math.floor(pos));
  return lerp(a.xs[letter], a.xs[letter + 1], pos - letter);
}
// Where the chalk tip is at time t (used to seed dust); label tips bob and follow the label's rotation.
function chalkTip(a, t) {
  if (a.kind !== 'text') { const q = a.path.at(a.ease(seg(t, a.t0, a.t1)) * a.path.len); return [q.x, q.y]; }
  const pos = seg(t, a.t0, a.t1) * a.str.length;
  const dx = a.left + writtenWidth(a, t) - a.x, dy = -a.size * (0.25 + 0.18 * Math.sin(pos * 3.1));
  const cos = Math.cos(a.rot), sin = Math.sin(a.rot);
  return [a.x + dx * cos - dy * sin, a.y + dx * sin + dy * cos];
}
const quadC = q => [(q[0][0] + q[2][0]) / 2, (q[0][1] + q[2][1]) / 2];

function drawLabel(c, a, t) {
  if (t >= a.hide + 0.15) return;               // labels can be wiped away again
  const shown = t >= a.t1 ? a.w + 30 : writtenWidth(a, t);
  c.globalAlpha = 1 - seg(t, a.hide, a.hide + 0.15);
  c.translate(a.x, a.y); c.rotate(a.rot); c.translate(-a.x, -a.y);
  c.beginPath(); c.rect(a.left - 30, a.y - a.size * 1.2, shown + 30, a.size * 1.7); c.clip();
  c.font = `${a.w8} ${a.size}px ${FONT}`; c.textAlign = 'left'; c.fillStyle = a.color;
  const fade = c.globalAlpha;
  c.globalAlpha = 0.07 * fade; c.lineWidth = 10; c.strokeStyle = a.color; c.lineJoin = 'round';
  c.strokeText(a.str, a.left, a.y);              // faint dust halo
  c.globalAlpha = fade;
  c.fillText(a.str, a.left, a.y); c.fillText(a.str, a.left + 0.8, a.y - 0.6);   // doubled for a chalky, uneven edge
}
function drawLine(c, a, t) {
  const drawn = a.ease(seg(t, a.t0, a.t1)) * a.path.len;
  c.strokeStyle = a.color; c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [alpha, width] of [[0.07, a.width + 12], [1, a.width]]) {   // dust halo, then the line itself
    c.globalAlpha = alpha; c.lineWidth = width;
    c.beginPath(); a.path.trace(c, 0, drawn); c.stroke();
  }
}
// quick chalk fill, inset from the grid lines, with a small pop
function drawCell(c, a, t) {
  const u = seg(t, a.t0, a.t1), [cx, cy] = quadC(a.q), k = 0.8 * (0.85 + 0.15 * eback(u));
  c.globalAlpha = 0.2 + 0.25 * (1 - u); c.fillStyle = WHITE; c.beginPath();
  a.q.forEach(([x, y], i) => { const px = cx + (x - cx) * k, py = cy + (y - cy) * k; i ? c.lineTo(px, py) : c.moveTo(px, py); }); c.closePath(); c.fill();
}
// running count while cells are ticked, then the total pops in yellow (scaled around its own centre)
function drawCount(c, a, t) {
  const done = t >= a.t1, n = done ? a.n : Math.min(a.n, Math.floor((t - a.t0) / a.dt) + 1);
  const pop = done ? eback(seg(t, a.t1, a.t1 + 0.28), 2.4) : 1, size = done ? lerp(64, 112, pop) : 64;
  c.font = `700 ${size}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = 16; c.strokeStyle = '#22302a'; c.globalAlpha = 0.85; c.strokeText(String(n), a.cx, a.cy + 4);
  c.globalAlpha = 1; c.fillStyle = done ? YEL : WHITE; c.fillText(String(n), a.cx, a.cy + 4);
}
const PAINTERS = { text: drawLabel, path: drawLine, cell: drawCell, count: drawCount };
function drawAct(c, a, t) {
  if (t < a.t0) return;
  c.save(); PAINTERS[a.kind](c, a, t); c.restore();
}

// ---------- chalk dust, generated once ----------
// `parts` are specks that fall under gravity; `puffs` are soft clouds for the final flourish.
const parts = [], puffs = [];
const speck = (t0, x, y, vx, vy, life, s, a) => ({ t0, x, y, vx, vy, life, s, a });
function buildParticles() {
  const rand = rng(21);
  for (const a of acts) {                         // shed by the chalk tip while drawing and writing
    if (a.kind !== 'path' && a.kind !== 'text') continue;
    for (let tt = a.t0; tt < a.t1; tt += 1 / 90) {
      if (rand() >= 0.55) continue;
      const [x, y] = chalkTip(a, tt);
      parts.push(speck(tt, x, y, (rand() - .5) * 40, 10 + rand() * 50, .6 + rand() * 1.1, .8 + rand() * 1.8, .35 + rand() * .45));
    }
  }
  for (const a of acts) {                         // a few from each ticked cell
    if (a.kind !== 'cell') continue;
    const [x, y] = quadC(a.q);
    for (let n = 0; n < 4; n++) parts.push(speck(a.t0, x + (rand() - .5) * 30, y + (rand() - .5) * 30, (rand() - .5) * 60, rand() * 40, .5 + rand() * .6, 1 + rand() * 1.5, .3 + rand() * .3));
  }
  for (let tt = ERASE.t0; tt < ERASE.t1; tt += 1 / 120) {   // kicked up along the eraser's path
    const q = ePath.at(eio2(seg(tt, ERASE.t0, ERASE.t1)) * ePath.len);
    for (let n = 0; n < 3; n++) parts.push(speck(tt, q.x + (rand() - .5) * ER.w, q.y + ER.h * (rand() - .5) * .8, (rand() - .5) * 70, 20 + rand() * 60, .8 + rand() * 1.6, 1 + rand() * 2.2, .18 + rand() * .3));
  }
  // final puff: soft clouds that billow and slow down, plus specks that fall
  for (let n = 0; n < 26; n++) {
    const an = -Math.PI * (0.02 + rand() * 0.7), sp = 120 + rand() * 300;
    puffs.push(speck(PUFF.t + rand() * 0.08, PUFF.x + (rand() - .5) * 20, PUFF.y + (rand() - .5) * 12, Math.cos(an) * sp, Math.sin(an) * sp, 1.0 + rand() * 0.7, 0.7 + rand() * 1.0, 0.3 + rand() * 0.35));
  }
  for (let n = 0; n < 160; n++) {
    const an = -Math.PI * rand(), sp = 60 + rand() * 320;
    parts.push(speck(PUFF.t + rand() * 0.05, PUFF.x, PUFF.y, Math.cos(an) * sp, Math.sin(an) * sp * 0.8, .6 + rand() * .9, 1 + rand() * 2.2, .4 + rand() * .5));
  }
}

// ---------- the eraser ----------
// [x, y, lift]: slides in from the left, follows ePath during the wipe, then leaves up and to the left.
function eraserPos(t) {
  if (t < ERASE.t0) {
    const u = eio2(seg(t, ERASE.in0, ERASE.t0)), start = ePath.p[0];
    return [lerp(-320, start[0], u), lerp(560, start[1], u), 1 - u];
  }
  if (t <= ERASE.t1) {
    const q = ePath.at(eio2(seg(t, ERASE.t0, ERASE.t1)) * ePath.len);
    return [q.x, q.y, 0];
  }
  const u = eio2(seg(t, ERASE.t1, ERASE.out1)), end = ePath.p[ePath.p.length - 1];
  return [lerp(end[0], -300, u), lerp(end[1], 300, u), u];
}
function drawEraser(x, y, lift) {
  const w = ER.w + 10, h = ER.h + 10, left = -w / 2, top = -h / 2;
  const block = (fill, x0, y0, bw, bh, r) => { ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x0, y0, bw, bh, r); ctx.fill(); };
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.05 + Math.sin(y * 0.01) * 0.03);
  ctx.filter = 'blur(12px)';                      // drop shadow, offset more when lifted
  block('rgba(0,0,0,0.38)', left + 16 + lift * 26, top + 22 + lift * 30, w, h, 16);
  ctx.filter = 'none';
  block('#5d605c', left, top + 14, w, h - 2, 14);  // grey felt
  ctx.fillStyle = 'rgba(235,235,226,0.5)'; ctx.fillRect(left + 8, h / 2 - 5, w - 16, 4);
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(left + 4, h / 2 - 16, w - 8, 3);
  const wood = ctx.createLinearGradient(0, top, 0, h / 2 - 8);
  wood.addColorStop(0, '#b99670'); wood.addColorStop(.45, '#9a774f'); wood.addColorStop(1, '#6c5033');
  block(wood, left, top, w, h - 18, 14);           // wooden back
  ctx.strokeStyle = 'rgba(70,40,15,0.35)'; ctx.lineWidth = 1.4;
  for (let n = 0; n < 5; n++) {                   // its grain
    const gy = top + 14 + n * 13 + (n % 2) * 3;
    ctx.globalAlpha = 0.5 + (n % 3) * 0.2;
    ctx.beginPath(); ctx.moveTo(left + 14, gy); ctx.bezierCurveTo(-60, gy + 6 - n, 30, gy - 5 + n, w / 2 - 14, gy + 1); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  block('rgba(255,240,210,0.22)', left + 6, top + 4, w - 12, 8, 4);   // bevel highlight
  ctx.restore();
}

// ---------- frame ----------
// Chalk goes to its own layer so the eraser can cut it and the grain mask can texture it.
function paintChalk(t) {
  lc.setTransform(1, 0, 0, 1, 0, 0); lc.globalCompositeOperation = 'source-over'; lc.clearRect(0, 0, W, H);
  for (const a of acts) if (a.t0 < ERASE.t0) drawAct(lc, a, t);
  if (t > ERASE.t0) {
    const reach = eio2(seg(t, ERASE.t0, ERASE.t1)) * ePath.len;
    mc.clearRect(0, 0, W, H);
    for (let s = 0; s <= reach; s += 7) { const q = ePath.at(s); mc.drawImage(eStamp, q.x - ER.w / 2 - 20, q.y - ER.h / 2 - 20); }
    lc.globalCompositeOperation = 'destination-out'; lc.globalAlpha = 0.92; lc.drawImage(M, 0, 0);      // wipe
    smc.globalCompositeOperation = 'source-over'; smc.clearRect(0, 0, W, H); smc.drawImage(M, 0, 0);
    smc.globalCompositeOperation = 'source-in'; smc.drawImage(streak, 0, 0);                            // streaks, only where wiped
    lc.globalCompositeOperation = 'source-over'; lc.globalAlpha = 0.14; lc.drawImage(SM, 0, 0);
    lc.globalAlpha = 1;
  }
  for (const a of acts) if (a.t0 >= ERASE.t0) drawAct(lc, a, t);
  lc.globalCompositeOperation = 'destination-in'; lc.drawImage(grain, 0, 0); lc.globalCompositeOperation = 'source-over';
}
function paintDust(t) {
  for (const p of parts) {
    const age = t - p.t0;
    if (age < 0 || age > p.life) continue;
    ctx.fillStyle = `rgba(240,240,230,${p.a * (1 - age / p.life)})`;
    ctx.fillRect(p.x + p.vx * age, p.y + p.vy * age + 90 * age * age, p.s, p.s);
  }
  for (const p of puffs) { const age = t - p.t0; if (age < 0 || age > p.life) continue; const k = age / p.life, dr = (1 - Math.exp(-4 * age)) / 4, sc = p.s * (0.6 + 2.2 * eout(k)) * 96;
    ctx.globalAlpha = p.a * Math.pow(1 - k, 1.4) * seg(age, 0, 0.12); ctx.drawImage(blob, p.x + p.vx * dr - sc / 2, p.y + p.vy * dr - 18 * age - sc / 2, sc, sc); }
  ctx.globalAlpha = 1;
}
function render(t) {
  paintChalk(t);
  const zoom = 1 + 0.04 * eio2(seg(t, 0, 10));    // slow push in on the centre
  ctx.setTransform(zoom, 0, 0, zoom, 960 - 960 * zoom, 540 - 540 * zoom);
  ctx.drawImage(board, 0, 0); ctx.drawImage(L, 0, 0);
  paintDust(t);
  if (t > ERASE.in0 && t < ERASE.out1) drawEraser(...eraserPos(t));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const dark = Math.max(1 - seg(t, 0, 0.3), eio2(seg(t, 9.45, 10)));   // fade in and out
  if (dark > 0) { ctx.fillStyle = `rgba(12,17,15,${dark})`; ctx.fillRect(0, 0, W, H); }
}
// sound events for audio.py (k = kind, t = seconds, d = duration)
window.events = () => {
  const ev = [];
  for (const a of acts) {
    if (a.kind === 'path') ev.push({ k: 'chalk', t: a.t0, d: Math.max(0.04, a.t1 - a.t0), v: a.width >= 7 ? 1 : 0.5 });
    else if (a.kind === 'text') ev.push({ k: 'write', t: a.t0, d: a.t1 - a.t0, n: a.str.replace(/ /g, '').length });
    else if (a.kind === 'cell') ev.push({ k: 'tap', t: a.t0 });
    else if (a.kind === 'count') ev.push({ k: 'ding', t: a.t1 });
  }
  ev.push({ k: 'thud', t: ERASE.t0 - 0.02 }, { k: 'erase', t: ERASE.t0, d: ERASE.t1 - ERASE.t0 }, { k: 'puff', t: PUFF.t });
  return ev.sort((x, y) => x.t - y.t);
};
window.ready = loadFont('Caveat', 'Caveat-700', 700)
  .then(() => document.fonts.load(`700 80px ${FONT}`, 'Lesson Pythagoras a² + b² = c² − h ?'))
  .then(() => { measureLabels(); buildParticles(); });
window.draw = ({ t }) => {
  render(t);
  const url = cv.toDataURL('image/jpeg', 0.92);
  return url.slice(url.indexOf(',') + 1);
};
</script>
