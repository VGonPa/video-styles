<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── art-deco · "The Aurora Hotel — Grand Opening, 1925" ─────────────────────────────────────────────
// A lobby wall draws itself in gold line work (seam, stepped ziggurat doorway, fluted pilasters, split sunburst,
// chevrons) → a gleam sweeps the gold → the elevator doors click and slide open, the camera pushes through the
// doorway into the invitation card: a sunburst fans open, the stepped frame unfolds from the centre, "THE AURORA"
// is revealed symmetrically, "HOTEL", the date and fan-flower ornaments bloom → gleam → pinstripe panels close
// from both sides and part again on the seal: rings draw in, the lettering ring appears, the medallion is pressed
// and flooded with gold around a cut-out monogram → final gleam, glints, fade to black.
// Gold = white mask per pass → source-in brushed-gold texture (precomputed) → gleam band → soft bloom.
// Every frame depends only on t (seeded RNG).
const W = 1920, H = 1080, DUR = 10, TAU = Math.PI * 2, PI = Math.PI;
const out = document.getElementById('c'), octx = out.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eOut5 = u => 1 - Math.pow(1 - u, 5);
const eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eSine = u => 0.5 - 0.5 * Math.cos(PI * u);
const back = (u, s = 1.6) => { const c3 = s + 1; return 1 + c3 * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const spring = (u, f = 2, z = 0.4) => { if (u <= 0) return 0; const w = TAU * f, wd = w * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u)); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const FD = 'Limelight', FP = '"Poiret One"', FM = '"Marcellus SC"', FJ = '"Josefin Sans"';
const IVORY = '#efe4c8', NAVY = '#0a1326', NAVY2 = '#0e1a33', INK = '#050912';

// ── timeline ──
const T = {
  seam: [.1, .65], zig: [.35, 1.35], inset: [.7, 1.45], pil: [.5, 1.55], med: [.85, 1.65], chev: [1.0, 1.8],
  plaque: [1.15, 1.95], gleamW: [1.8, 2.45], click: 2.3, doors: [2.48, 3.45], push: [2.95, 4.4],
  sun: [2.55, 4.2], frame: [3.3, 4.45], border: [3.7, 4.7], grand: [4.15, 4.75], title: [4.35, 5.1], flowers: [4.85, 5.9],
  rule: [5.0, 5.6], hotel: [5.1, 5.75], date: [5.45, 6.05], line2: [5.65, 6.25], gleamT: [6.1, 6.85], glintT: 6.55,
  close: [6.95, 7.4], swap: 7.45, open: [7.55, 8.05],
  rays: [7.55, 8.4], rings: [7.75, 8.35], textring: [7.95, 8.5], press: 8.55, gleamS: [8.95, 9.55], glintS: [8.75, 9.25],
  tag: [8.7, 9.2], fade: [9.4, 10.0],
};

// ── canvases ──
const M = mk(W, H), mg = M.getContext('2d');           // gold mask / colourised gold
const B = mk(480, 270), bg = B.getContext('2d');       // bloom
let GOLD, BG_WALL, BG_TITLE, GRAIN, VIG, DOORTEX;

function goldTexture() {
  const c = mk(W, H), g = c.getContext('2d'), r = rng(7);
  const lg = g.createLinearGradient(0, 0, 900, H * 1.25);
  const cyc = [['#4f340e', 0], ['#a87a28', .18], ['#e9cd7c', .36], ['#fff4cc', .47], ['#d8ad4f', .58], ['#8a6220', .78], ['#4f340e', 1]];
  const n = 7;
  for (let k = 0; k < n; k++) for (const [col, p] of cyc) lg.addColorStop(clamp((k + p) / n), col);
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  // brushed streaks
  for (let i = 0; i < 2600; i++) {
    const y = r() * H, x = r() * W, len = 60 + r() * 420, a = .03 + r() * .07;
    g.fillStyle = r() < .5 ? `rgba(255,245,210,${a})` : `rgba(40,24,0,${a})`;
    g.fillRect(x, y, len, 1 + (r() < .2));
  }
  return c;
}
function wallBg() {
  const c = mk(W, H), g = c.getContext('2d'), r = rng(3);
  const rg = g.createRadialGradient(960, 560, 80, 960, 560, 1250);
  rg.addColorStop(0, '#132143'); rg.addColorStop(.55, '#0b1429'); rg.addColorStop(1, '#04070f');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 16) { g.fillStyle = `rgba(150,170,220,${.018 + .01 * (x / 16 % 2)})`; g.fillRect(x, 0, 1, 1000); }
  // floor
  const fg = g.createLinearGradient(0, 1000, 0, H); fg.addColorStop(0, '#0a0f1e'); fg.addColorStop(1, '#020409');
  g.fillStyle = fg; g.fillRect(0, 1000, W, 80);
  return c;
}
function titleBg() {
  const c = mk(W, H), g = c.getContext('2d');
  const rg = g.createRadialGradient(960, 540, 60, 960, 540, 1150);
  rg.addColorStop(0, '#182a52'); rg.addColorStop(.5, '#0c1731'); rg.addColorStop(1, '#03060d');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  return c;
}
function doorTex() {
  const c = mk(W, H), g = c.getContext('2d');
  const lg = g.createLinearGradient(680, 0, 1240, 0);
  lg.addColorStop(0, '#0b142a'); lg.addColorStop(.5, '#16244a'); lg.addColorStop(.5, '#0c1631'); lg.addColorStop(1, '#0b142a');
  g.fillStyle = lg; g.fillRect(0, 0, W, H);
  for (let x = 680; x < 1240; x += 7) { g.fillStyle = 'rgba(160,180,230,.022)'; g.fillRect(x, 0, 1, H); }
  return c;
}
function grain() {
  const c = mk(W, H), g = c.getContext('2d'), id = g.createImageData(W, H), d = id.data, r = rng(99);
  for (let i = 0; i < d.length; i += 4) { const v = 128 + (r() - .5) * 70; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
function vignette() {
  const c = mk(W, H), g = c.getContext('2d');
  const rg = g.createRadialGradient(960, 540, 420, 960, 540, 1180);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.62)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H); return c;
}

// ── gold pass: draw white shapes into the mask, colourise, gleam, bloom ──
function goldPass(target, draw, { gleam = null, bloom = .32, shadow = true, xf = null, tint = null } = {}) {
  mg.setTransform(1, 0, 0, 1, 0, 0); mg.globalCompositeOperation = 'source-over'; mg.globalAlpha = 1; mg.clearRect(0, 0, W, H);
  mg.save(); if (xf) mg.setTransform(...xf);
  mg.fillStyle = '#fff'; mg.strokeStyle = '#fff'; mg.lineCap = 'butt'; mg.lineJoin = 'miter';
  draw(mg); mg.restore();
  mg.setTransform(1, 0, 0, 1, 0, 0); mg.globalAlpha = 1;
  mg.globalCompositeOperation = 'source-in'; mg.drawImage(GOLD, 0, 0);
  if (tint) { mg.globalCompositeOperation = 'source-atop'; mg.fillStyle = tint; mg.fillRect(0, 0, W, H); }
  if (gleam !== null && gleam > 0 && gleam < 1) {
    mg.globalCompositeOperation = 'source-atop';
    const p = lerp(-500, 2500, gleam);
    const lg = mg.createLinearGradient(p - 330, -60, p + 330, 200);
    lg.addColorStop(0, 'rgba(255,250,230,0)'); lg.addColorStop(.3, 'rgba(255,250,230,.18)'); lg.addColorStop(.47, 'rgba(255,252,238,.35)');
    lg.addColorStop(.5, 'rgba(255,255,248,.95)'); lg.addColorStop(.53, 'rgba(255,252,238,.35)'); lg.addColorStop(.7, 'rgba(255,250,230,.18)'); lg.addColorStop(1, 'rgba(255,250,230,0)');
    mg.fillStyle = lg; mg.fillRect(0, 0, W, H);
  }
  mg.globalCompositeOperation = 'source-over';
  target.save(); target.setTransform(1, 0, 0, 1, 0, 0);
  if (shadow) { target.shadowColor = 'rgba(0,0,0,.6)'; target.shadowOffsetY = 3; target.shadowOffsetX = 1; }
  target.drawImage(M, 0, 0);
  target.restore();
  if (bloom > 0) {
    bg.globalCompositeOperation = 'source-over'; bg.clearRect(0, 0, 480, 270); bg.filter = 'blur(5px)'; bg.drawImage(M, 0, 0, 480, 270); bg.filter = 'none';
    target.save(); target.setTransform(1, 0, 0, 1, 0, 0); target.globalCompositeOperation = 'lighter'; target.globalAlpha = bloom;
    target.drawImage(B, 0, 0, W, H); target.restore();
  }
}

// ── geometry helpers ──
function strokePartial(g, pts, u) {
  if (u <= 0) return;
  let L = 0; const ls = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); ls.push(l); L += l; }
  let rem = L * clamp(u);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && rem > 0; i++) {
    const l = ls[i - 1], k = Math.min(1, rem / l);
    g.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); rem -= l;
  }
  g.stroke();
}
const mirror = (pts, cx = 960) => pts.map(([x, y]) => [2 * cx - x, y]);
function strokeSym(g, half, u, cx = 960) { strokePartial(g, half, u); strokePartial(g, mirror(half, cx), u); }
// left half of a stepped (ziggurat) outline, from top centre going left and down.
// bottom: 'flat' at y=floor, or 'step' mirrored steps.
function zigHalf({ cx = 960, cy, hw, hh, sw, sh, n, d = 0, bottom = 'step', floor = 0 }) {
  const P = [], yT = k => cy - hh - k * sh, yB = k => cy + hh + k * sh, xk = k => cx - hw + k * sw;
  P.push([cx, yT(n) - d]);
  P.push([xk(n) - d, yT(n) - d]);
  for (let k = n; k >= 1; k--) { P.push([xk(k) - d, yT(k - 1) - d]); P.push([xk(k - 1) - d, yT(k - 1) - d]); }
  if (bottom === 'flat') { P.push([xk(0) - d, floor]); P.push([cx, floor]); }
  else {
    P.push([xk(0) - d, yB(0) + d]);
    for (let k = 1; k <= n; k++) { P.push([xk(k) - d, yB(k - 1) + d]); P.push([xk(k) - d, yB(k) + d]); }
    P.push([cx, yB(n) + d]);
  }
  return P;
}
function zigPath(g, spec) { const h = zigHalf(spec), m = mirror(h, spec.cx || 960).reverse(); g.beginPath(); g.moveTo(...h[0]); for (const p of h.concat(m)) g.lineTo(...p); g.closePath(); }
function sunburst(g, cx, cy, r0, r1, N, open, rot, grow = 1, wedge = .34, fan = true, a0 = -PI / 2, span = TAU) {
  const rr = lerp(r0, r1, grow);
  if (rr <= r0 + 1) return;
  for (let i = 0; i < N; i++) {
    const k = i <= N / 2 ? i : i - N;
    const a = fan ? a0 + k * (span / N) * open + rot : a0 + i * span / N + rot;
    const hw = (span / N) * wedge * open;
    g.beginPath();
    if (i % 2 === 0) {
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a - hw) * rr, cy + Math.sin(a - hw) * rr);
      g.lineTo(cx + Math.cos(a + hw) * rr, cy + Math.sin(a + hw) * rr);
      g.closePath(); g.fill();
    } else {
      g.moveTo(cx + Math.cos(a) * (r0 + 20), cy + Math.sin(a) * (r0 + 20)); g.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); g.stroke();
    }
  }
}
function arcSym(g, cx, cy, r, u, top = -PI / 2) { if (u <= 0) return; g.beginPath(); g.arc(cx, cy, r, top - PI * u, top + PI * u); g.stroke(); }
function chevron(g, cx, y, hw, h) { g.beginPath(); g.moveTo(cx - hw, y); g.lineTo(cx, y + h); g.lineTo(cx + hw, y); g.stroke(); }
function diamond(g, x, y, s) { g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * .7, y); g.lineTo(x, y + s); g.lineTo(x - s * .7, y); g.closePath(); g.fill(); }
function spacedText(g, txt, x, y, font, ls) { g.font = font; g.letterSpacing = ls + 'px'; g.textAlign = 'center'; g.fillText(txt, x + ls / 2, y); g.letterSpacing = '0px'; }
function star(g, x, y, s, a) {
  if (a <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
  const rg = g.createRadialGradient(x, y, 0, x, y, s * 1.3); rg.addColorStop(0, 'rgba(255,248,220,.9)'); rg.addColorStop(1, 'rgba(255,230,160,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(x, y, s * 1.3, 0, TAU); g.fill();
  g.fillStyle = '#fffbea';
  for (const [dx, dy, l, w] of [[1, 0, s * 2.4, s * .09], [0, 1, s * 2.4, s * .09], [.707, .707, s * 1.1, s * .06], [.707, -.707, s * 1.1, s * .06]]) {
    g.beginPath(); g.moveTo(x + dx * l, y + dy * l); g.lineTo(x - dy * w, y + dx * w); g.lineTo(x - dx * l, y - dy * l); g.lineTo(x + dy * w, y - dx * w); g.closePath(); g.fill();
  }
  g.restore();
}

// ── scene 1: lobby wall + elevator doors ──
const DOOR = { cx: 960, cy: 0, hw: 280, hh: 0, sw: 50, sh: 56, n: 3, bottom: 'flat', floor: 1000 };
const doorSpec = d => { const s = { ...DOOR, d }; s.cy = 420; return s; };   // sides top at 420, steps up to 252
const DOOR_TOP = 420 - 3 * 56;
function wallGold(g, t) {
  // wall sunburst above doorway (rays, avoiding the plaque)
  const ur = eOut(seg(t, T.zig[0] + .25, T.zig[1] + .35));
  g.lineWidth = 1.2; g.globalAlpha = .55;
  for (let i = 0; i <= 26; i++) {
    const a = -PI + .2 + i * (PI - .4) / 26; if (Math.abs(a + PI / 2) < .5) continue;
    const r0 = 240, r1 = lerp(r0, 560 + 40 * (i % 2), ur);
    g.beginPath(); g.moveTo(960 + Math.cos(a) * r0, DOOR_TOP + Math.sin(a) * r0 * .9); g.lineTo(960 + Math.cos(a) * r1, DOOR_TOP + Math.sin(a) * r1 * .9); g.stroke();
  }
  g.globalAlpha = 1;
  // keep the rays off the plaque and the doorway frame
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillRect(530, 56, 860, 120); zigPath(g, doorSpec(74)); g.fill(); g.restore();
  // ziggurat doorway frame: three staggered lines, drawn from top centre outward both ways
  [[14, 4], [30, 1.6], [42, 1.6], [60, 1]].forEach(([d, lw], i) => {
    g.lineWidth = lw; strokeSym(g, zigHalf(doorSpec(d)), eInOut(seg(t, T.zig[0] + i * .1, T.zig[1] + i * .1)));
  });
  // pilasters (fluted, grow from the floor), stepped capitals
  const up = eInOut(seg(t, ...T.pil));
  for (const px of [300, 1620]) {
    const top = lerp(1000, 250, up);
    g.lineWidth = 1.5;
    for (let k = -3; k <= 3; k++) { g.beginPath(); g.moveTo(px + k * 16, 1000); g.lineTo(px + k * 16, Math.max(top, 300)); g.stroke(); }
    const uc = seg(t, T.pil[1] - .25, T.pil[1] + .15);
    if (uc > 0) {
      g.globalAlpha = eOut(uc);
      const e = eOut(uc);
      // stepped setback crown + a small fan, stepped base
      [[70, 290, 10], [56, 274, 10], [42, 258, 10]].forEach(([hw, y, h]) => g.fillRect(px - hw * e, y, 2 * hw * e, h));
      g.lineWidth = 1.5; g.beginPath(); g.arc(px, 256, 40 * e, PI, TAU); g.stroke();
      for (let i = 1; i < 6; i++) { const a = PI + i * PI / 6; g.beginPath(); g.moveTo(px + Math.cos(a) * 12 * e, 256 + Math.sin(a) * 12 * e); g.lineTo(px + Math.cos(a) * 40 * e, 256 + Math.sin(a) * 40 * e); g.stroke(); }
      g.beginPath(); g.arc(px, 256, 10 * e, PI, TAU); g.fill();
      [[70, 976, 10], [86, 990, 10]].forEach(([hw, y, h]) => g.fillRect(px - hw * e, y, 2 * hw * e, h));
      g.globalAlpha = 1;
    }
  }
  // floor rules
  const uf = eInOut(seg(t, .3, 1.2));
  g.lineWidth = 3; g.beginPath(); g.moveTo(960 - 960 * uf, 1003); g.lineTo(960 + 960 * uf, 1003); g.stroke();
  g.lineWidth = 1; g.beginPath(); g.moveTo(960 - 960 * uf, 1016); g.lineTo(960 + 960 * uf, 1016); g.stroke();
  for (let k = 0; k < 3; k++) { g.globalAlpha = .5 - k * .12; g.beginPath(); g.moveTo(960 - 960 * uf, 1034 + k * 18); g.lineTo(960 + 960 * uf, 1034 + k * 18); g.stroke(); }
  g.globalAlpha = 1;
  // plaque frame
  const upl = eInOut(seg(t, T.plaque[0] - .2, T.plaque[1] - .2));
  g.lineWidth = 2;
  strokeSym(g, [[960, 70], [560, 70], [560, 82], [540, 82], [540, 150], [560, 150], [560, 162], [960, 162]], upl);
  g.lineWidth = 1; strokeSym(g, [[960, 78], [568, 78], [568, 90], [548, 90], [548, 142], [568, 142], [568, 154], [960, 154]], upl);
}
function doorGold(g, t) {
  // seam (the two door edges) grows from the middle out
  const us = eOut(seg(t, ...T.seam));
  g.lineWidth = 3; g.beginPath(); g.moveTo(960, 626 - 374 * us); g.lineTo(960, 626 + 374 * us); g.stroke();
  // everything on the doors is symmetric around the seam; drawn once, split by the door clips
  g.lineWidth = 2; strokeSym(g, zigHalf(doorSpec(-16)), eInOut(seg(t, ...T.inset)));
  g.lineWidth = 1; strokeSym(g, zigHalf(doorSpec(-24)), eInOut(seg(t, T.inset[0] + .1, T.inset[1] + .1)));
  // fluting inside the stepped head
  const uf = eOut(seg(t, T.inset[0] + .3, T.inset[1] + .3));
  g.lineWidth = 1;
  for (let k = 1; k <= 11; k++) for (const s of [-1, 1]) {
    const x = 960 + s * k * 18; let yTop = DOOR_TOP + 24;
    const ax = Math.abs(x - 960); if (ax > 130 - 24) yTop = 420 - 2 * 56 + 24; if (ax > 180 - 24) yTop = 420 - 56 + 24; if (ax > 230 - 24) yTop = 420 + 24;
    const y1 = 408; if (yTop >= y1) continue;
    g.beginPath(); g.moveTo(x, y1); g.lineTo(x, lerp(y1, yTop, uf)); g.stroke();
  }
  // medallion: split sunburst on the seam
  const um = seg(t, ...T.med), cy = 590;
  g.lineWidth = 2.5; arcSym(g, 960, cy, 150, eOut(um)); arcSym(g, 960, cy, 150, eOut(um), PI / 2);
  g.lineWidth = 1.2; arcSym(g, 960, cy, 138, eOut(seg(t, T.med[0] + .1, T.med[1] + .1))); arcSym(g, 960, cy, 138, eOut(seg(t, T.med[0] + .1, T.med[1] + .1)), PI / 2);
  g.lineWidth = 2; arcSym(g, 960, cy, 46, eOut(um)); arcSym(g, 960, cy, 46, eOut(um), PI / 2);
  g.lineWidth = 1.4; sunburst(g, 960, cy, 56, 128, 32, 1, PI / 32, eOut5(seg(t, T.med[0] + .2, T.med[1] + .15)), .3, false);
  // chevrons (downward), top one first
  for (let k = 0; k < 6; k++) {
    const u = eOut(seg(t, T.chev[0] + k * .08, T.chev[0] + k * .08 + .45)); if (u <= 0) continue;
    g.lineWidth = k % 2 ? 1.2 : 3; g.globalAlpha = u;
    chevron(g, 960, 790 + k * 30, 200 * u, 70 * u);
  }
  g.globalAlpha = 1;
  // kick plate lines
  const uk = eInOut(seg(t, T.chev[0] + .2, T.chev[1]));
  g.lineWidth = 1.5; for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(960 - 240 * uk, 950 + k * 12); g.lineTo(960 + 240 * uk, 950 + k * 12); g.stroke(); }
}
function renderWall(ctx, t, s, ox, oy) {
  const xf = [s, 0, 0, s, ox, oy];
  ctx.save(); ctx.setTransform(...xf);
  // wall with doorway cut out
  ctx.beginPath(); ctx.rect(-10, -10, W + 20, H + 20); zigPathInto(ctx, doorSpec(0));
  ctx.save(); ctx.clip('evenodd'); ctx.setTransform(1, 0, 0, 1, 0, 0);
  // wall bg is drawn in screen space scaled with the wall
  ctx.setTransform(...xf); ctx.drawImage(BG_WALL, 0, 0); ctx.restore();
  // doors
  const click = Math.sin(PI * seg(t, T.click, T.click + .12)) * 3;
  const od = eInOut(seg(t, ...T.doors)) * 300 + click;
  zigPath(ctx, doorSpec(0)); ctx.save(); ctx.clip();
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * od, 0); ctx.beginPath(); side < 0 ? ctx.rect(0, 0, 960, H) : ctx.rect(960, 0, W, H); ctx.clip();
    ctx.globalAlpha = eOut(seg(t, 0, .8)); ctx.drawImage(DOORTEX, 0, 0);
    ctx.restore();
  }

    { t: T.close[0], k: 'whoosh', d: .5 }, { t: T.close[1], k: 'meet' }, { t: T.open[0], k: 'whoosh', d: .55 },
    { t: T.rings[0], k: 'harp', n: 8, d: .7 }, { t: T.press - .16, k: 'rise' }, { t: T.press, k: 'stamp' },
    { t: T.glintS[0] + .12, k: 'glint' }, { t: T.gleamS[0] + .3, k: 'gleam' }, { t: T.glintS[1] + .12, k: 'glint' },
  ];
  // plinks for each chevron on the doors
  for (let k = 0; k < 6; k += 2) ev.push({ t: T.chev[0] + k * .08, k: 'tick', v: .6 });
  return ev.sort((a, b) => a.t - b.t);
};
window.T = T;
