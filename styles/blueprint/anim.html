<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #15437f; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="common.js"></script>
<script>
// BLUEPRINT — Model MP-7 mechanical pencil: front view, end view, section A–A, exploded view, parts list, title block
const LN = '232,241,255';                      // line color (rgb)
const COND = "'Barlow Condensed'", MONO = "'IBM Plex Mono'";
const evs = [];                                // sound events (read by events.mjs)

// ---------- cyanotype sheet, painted once ----------
const paper = mk(W, H);
{ const g = paper.getContext('2d'), rand = rng(4);
  const wash = g.createRadialGradient(900, 480, 100, 960, 540, 1200);
  wash.addColorStop(0, '#1f5aa6'); wash.addColorStop(1, '#123b75');
  g.fillStyle = wash; g.fillRect(0, 0, W, H);
  for (let n = 0; n < 120; n++) {                 // uneven exposure: soft light and dark blotches
    const x = rand() * W, y = rand() * H, rad = 60 + rand() * 300, light = rand() < .5;
    const blot = g.createRadialGradient(x, y, 0, x, y, rad);
    blot.addColorStop(0, light ? 'rgba(90,150,230,0.07)' : 'rgba(5,20,60,0.08)'); blot.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = blot; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const img = g.getImageData(0, 0, W, H), px = img.data;   // grain, slightly stronger in blue
  for (let i = 0; i < px.length; i += 4) { const n = (rand() - .5) * 10; px[i] += n; px[i + 1] += n; px[i + 2] += n * 1.2; }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(200,225,255,0.05)'; g.lineWidth = 1;
  for (let n = 0; n < 700; n++) {                 // paper fibres
    const x = rand() * W, y = rand() * H, ang = rand() * Math.PI, len = 5 + rand() * 20;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); g.stroke();
  } }
// L: everything drawn in ink this frame; GL: a quarter-size copy blurred for the glow
const L = mk(W, H), lc = L.getContext('2d');
const GL = mk(W / 4, H / 4), gc = GL.getContext('2d');

// ---------- Action system ----------
const acts = [];
function line(path, t0, t1, o = {}) { acts.push({ kind: 'path', path: path.done(), t0, t1, w: o.w ?? 1.5, a: o.a ?? 0.9, dash: o.dash, ease: o.ease || eio2 });
  if (t1 - t0 >= 0.15) evs.push({ k: (o.w ?? 1.5) >= 2 ? 'scribe' : 'pen', t: t0, d: t1 - t0 }); }
function txt(str, x, y, size, t0, o = {}) { const dur = o.dur ?? str.length * 0.028;
  acts.push({ kind: 'text', str, x, y, size, t0, t1: t0 + dur, font: o.font || COND, w8: o.w8 || 500, it: o.it ?? true, align: o.align || 'center', rot: o.rot || 0, a: o.a ?? 0.95, ls: o.ls ?? 1 });
  const n = str.replace(/ /g, '').length; for (let i = 0; i < n; i += 2) evs.push({ k: 'key', t: t0 + dur * i / n }); }
function arrowHead(x, y, ang, t0) { acts.push({ kind: 'arrow', x, y, ang, t0, t1: t0 + 0.18 }); evs.push({ k: 'tick', t: t0 }); }
function dot(x, y, t0, r = 4.5) { acts.push({ kind: 'dot', x, y, r, t0, t1: t0 + 0.12 }); if (r > 3) evs.push({ k: 'tick', t: t0 }); }
function hatch(clipFn, t0, t1, o = {}) { acts.push({ kind: 'hatch', clipFn, t0, t1, gap: o.gap || 11, ang: o.ang ?? Math.PI / 4, box: o.box, a: o.a ?? 0.75, cross: o.cross });
  evs.push({ k: 'hatch', t: t0, d: t1 - t0 }); }
const CEN = [26, 6, 4, 6];                     // axis line (dash-dot)
const HID = [8, 6];                            // hidden line

// Dimension: two extension lines from the part, a dimension line drawn outward from its middle with
// arrowheads at both ends, then the value. dimV measures y0..y1 at column x; dimH measures x0..x1 at row y.
function dimV(x, y0, y1, fromX, t0, label, o = {}) {
  const side = Math.sign(x - fromX) || -1, mid = (y0 + y1) / 2;
  const extend = (y, start) => line(P().M(fromX + side * 6, y).L(x + side * 12, y), start, start + 0.2, { w: 1.1, a: .8 });
  extend(y0, t0); extend(y1, t0 + 0.05);
  for (const end of [y0 + 1, y1 - 1]) line(P().M(x, mid).L(x, end), t0 + 0.2, t0 + 0.45, { w: 1.2 });
  arrowHead(x, y0, -Math.PI / 2, t0 + 0.43); arrowHead(x, y1, Math.PI / 2, t0 + 0.43);
  txt(label, x - 12, mid, o.size || 30, t0 + 0.5, { rot: -Math.PI / 2 });
}
function dimH(y, x0, x1, fromY, t0, label, o = {}) {
  const side = Math.sign(y - fromY) || -1, mid = (x0 + x1) / 2;
  const extend = (x, start) => line(P().M(x, fromY + side * 6).L(x, y + side * 12), start, start + 0.2, { w: 1.1, a: .8 });
  extend(x0, t0); extend(x1, t0 + 0.05);
  for (const end of [x0 + 1, x1 - 1]) line(P().M(mid, y).L(end, y), t0 + 0.2, t0 + 0.45, { w: 1.2 });
  arrowHead(x0, y, Math.PI, t0 + 0.43); arrowHead(x1, y, 0, t0 + 0.43);
  txt(label, mid + (o.dx || 0), y - 12, o.size || 30, t0 + 0.5);
}
// Callout: dot on the part, a kinked leader line, then the note.
function leader(x0, y0, x1, y1, x2, label, t0, align = 'left') {
  dot(x0, y0, t0);
  line(P().M(x0, y0).L(x1, y1).L(x2, y1), t0 + 0.05, t0 + 0.4, { w: 1.1 });
  const textX = align === 'left' ? x2 + 10 : x2 - 10;
  txt(label, textX, y1 + 8, 23, t0 + 0.38, { align, font: MONO, it: false, w8: 400, ls: 0.5 });
}
function polyPath(pts, close = true) { const p = P().M(...pts[0]); for (let i = 1; i < pts.length; i++) p.L(...pts[i]); if (close) p.L(...pts[0]); return p; }
function tracePoly(c, pts) { c.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) c.lineTo(...pts[i]); c.closePath(); }
const mapper = (ox, oy, k) => pts => pts.map(([x, y]) => [ox + x * k, oy + y * k]);
const rectMM = (x0, x1, r) => [[x0, -r], [x1, -r], [x1, r], [x0, r]];

// ---------- Part geometry (mm; x along the axis from the tip, y radial) ----------
const R_HEX = 4.62, R_EDGE = 2.31;             // hex barrel: across corners 9.24, visible edges at ±2.31
const SH = {
  cone: [[0, -0.6], [5, -0.6], [5, -1.2], [18, -3.9], [18, -4.0], [20, -4.0], [20, 4.0], [18, 4.0], [18, 3.9], [5, 1.2], [5, 0.6], [0, 0.6]],
  coneIn: [[0, -0.3], [5, -0.3], [14, -1.0], [18, -1.6], [20, -2.6], [20, 2.6], [18, 1.6], [14, 1.0], [5, 0.3], [0, 0.3]],
  grip: [[20, -3.8], [20.4, -4.2], [51.6, -4.2], [52, -3.8], [52, 3.8], [51.6, 4.2], [20.4, 4.2], [20, 3.8]],
  gripIn: rectMM(20, 52, 3.4),
  barrel: rectMM(52, 126, R_HEX), barrelIn: rectMM(52, 126, 3.62),
  clip: [[122, -R_HEX], [122, -6.6], [101, -6.6], [99, -6.1], [99, -5.3], [101, -4.62]],
  cap: (() => { const p = [[126, -3.4], [137, -3.4]]; for (let i = 1; i < 12; i++) { const a = -Math.PI / 2 + Math.PI * i / 12; p.push([137 + Math.cos(a) * 3, Math.sin(a) * 3.4]); } p.push([137, 3.4], [126, 3.4]); return p; })(),
  capIn: rectMM(126, 137.5, 2.7),
  clutch: [[14, -1.0], [18, -1.6], [30, -1.6], [30, 1.6], [18, 1.6], [14, 1.0]],
  ring: rectMM(16, 20, 2.2),
  tube: [[30, -2.0], [116, -2.0], [116, -2.4], [118, -2.4], [118, 2.4], [116, 2.4], [116, 2.0], [30, 2.0]],
  eraser: [[122, -2.5], [135.5, -2.5], [136.5, -1.8], [136.5, 1.8], [135.5, 2.5], [122, 2.5]],
};
function springPts(x0, len, r, n = 12) { const p = [[x0, -r]]; for (let i = 1; i <= n * 2; i++) p.push([x0 + len * i / (n * 2), i % 2 ? r : -r]); return p; }

// ===== 1) FRONT VIEW (7 px/mm) =====
const FK = 7, FOX = 185, FOY = 215, fm = mapper(FOX, FOY, FK), FXp = x => FOX + x * FK, FYp = y => FOY + y * FK;
line(P().M(FXp(-9), FOY).L(FXp(143), FOY), 0.3, 1.0, { w: 1.1, a: .6, dash: CEN });
line(polyPath(fm(SH.cone)), 0.75, 1.3, { w: 3 });
line(P().M(FXp(5), FYp(-1.2)).L(FXp(5), FYp(1.2)), 1.2, 1.3, { w: 1.4 });
line(P().M(FXp(18), FYp(-4)).L(FXp(18), FYp(4)), 1.22, 1.32, { w: 1.4 });
line(polyPath(fm(SH.grip)), 1.0, 1.6, { w: 3 });
line(polyPath(fm(SH.barrel)), 1.3, 2.05, { w: 3 });
line(polyPath(fm(SH.clip), false), 1.8, 2.15, { w: 3 });
line(polyPath(fm(SH.cap)), 1.9, 2.3, { w: 3 });
line(P().M(FXp(129), FYp(-3.4)).L(FXp(129), FYp(3.4)), 2.2, 2.3, { w: 1.4 });
[-R_EDGE, R_EDGE].forEach((y, i) => line(P().M(FXp(52), FYp(y)).L(FXp(126), FYp(y)), 1.95 + i * .05, 2.3 + i * .05, { w: 1.4 }));
line(P().M(FXp(-5), FOY).L(FXp(0), FOY), 2.25, 2.35, { w: 3.2 });                                   // 0.5 lead
hatch(c => { c.beginPath(); c.rect(FXp(23), FYp(-4.2) + 2, FXp(49) - FXp(23), FK * 8.4 - 4); c.clip(); }, 2.1, 2.6, { gap: 8, cross: true, a: .45, box: [FXp(23), FYp(-4.2), FXp(49), FYp(4.2)] });
dimH(127, FXp(-5), FXp(140), FYp(-1), 2.35, '145');
dimH(291, FXp(20), FXp(52), FYp(4.2), 2.6, '32');
dimV(FXp(-12), FYp(-4.2), FYp(4.2), FXp(20), 2.75, 'Ø 8.4', { size: 24 });
txt('FRONT VIEW', 735, 336, 34, 2.8, { w8: 600, it: false, ls: 3 });
line(P().M(735 - 104, 349).L(735 + 104, 349), 3.0, 3.2, { w: 1.6 });

// ===== 2) SHEET FRAME =====
line(polyPath([[40, 40], [1880, 40], [1880, 1040], [40, 1040]]), 3.1, 4.1, { w: 1.2, a: .7 });
line(polyPath([[62, 62], [1858, 62], [1858, 1018], [62, 1018]]), 3.2, 4.2, { w: 2.6 });
for (let i = 1; i < 8; i++) { const x = 62 + i * (1796 / 8); line(P().M(x, 40).L(x, 62), 3.7 + i * .02, 3.8 + i * .02, { w: 1.2, a: .7 }); line(P().M(x, 1018).L(x, 1040), 3.7 + i * .02, 3.8 + i * .02, { w: 1.2, a: .7 }); }
for (let i = 0; i < 8; i++) { const x = 62 + (i + .5) * (1796 / 8); txt(String(i + 1), x, 58, 17, 3.9 + i * .03, { font: MONO, it: false, w8: 500, dur: .05 }); txt(String(i + 1), x, 1036, 17, 3.9 + i * .03, { font: MONO, it: false, w8: 500, dur: .05 }); }
'ABCD'.split('').forEach((ch, i) => { const y = 62 + (i + .5) * (956 / 4); txt(ch, 51, y + 6, 17, 4.0 + i * .04, { font: MONO, it: false, w8: 500, dur: .05 }); txt(ch, 1869, y + 6, 17, 4.0 + i * .04, { font: MONO, it: false, w8: 500, dur: .05 }); });

// ===== 3) END VIEW (2:1, from the cap end) with cutting plane A–A =====
const EX = 1310, EY = 215, EK = 14;
line(P().M(EX - 90, EY).L(EX + 90, EY), 3.55, 3.9, { w: 1.1, a: .6, dash: CEN });
{ const hex = []; for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3; hex.push([EX + Math.cos(a) * R_HEX * EK, EY + Math.sin(a) * R_HEX * EK]); }
  line(polyPath(hex), 3.6, 4.2, { w: 3 }); }
line(P().A(EX, EY, 4.2 * EK, 4.2 * EK, -Math.PI / 2, Math.PI * 1.5, 90), 3.75, 4.3, { w: 1.3, dash: HID });
line(P().A(EX, EY, 3.4 * EK, 3.4 * EK, -Math.PI / 2, Math.PI * 1.5, 80), 3.85, 4.35, { w: 2.4 });
line(P().A(EX, EY, 2.2 * EK, 2.2 * EK, -Math.PI / 2, Math.PI * 1.5, 60), 3.95, 4.35, { w: 1.3 });
line(polyPath([[EX - 21, EY - R_HEX * EK + 4], [EX - 21, EY - 6.6 * EK], [EX + 21, EY - 6.6 * EK], [EX + 21, EY - R_HEX * EK + 4]], false), 4.1, 4.4, { w: 2.4 });
// cutting plane: dash-dot through the axis, heavy ends, arrows point in the viewing direction
line(P().M(EX, EY - 118).L(EX, EY + 118), 4.2, 4.55, { w: 1.1, a: .7, dash: CEN });
[[-1, EY - 124], [1, EY + 124]].forEach(([s, y], i) => { const t0 = 4.4 + i * .08;
  line(P().M(EX, y - s * 26).L(EX, y), t0, t0 + .12, { w: 4.5 });
  line(P().M(EX, y).L(EX - 46, y), t0 + .1, t0 + .26, { w: 1.6 }); arrowHead(EX - 52, y, Math.PI, t0 + .24);
  txt('A', EX - 82, y + 12, 34, t0 + .28, { w8: 600 }); });
dimH(EY + 94, EX - 4 * EK, EX + 4 * EK, EY + 60, 4.55, '8', { dx: 22, size: 26 });
txt('END VIEW  2 : 1', EX, 395, 28, 4.6, { w8: 600, it: false, ls: 2.5 });

// projection lines: front view → section
[-5, 20, 52, 126, 140].forEach((x, i) => line(P().M(FXp(x), 253).L(FXp(x), 384), 3.9 + i * .05, 4.4 + i * .05, { w: 1, a: .4, dash: [3, 5] }));

// ===== 4) SECTION A–A (7 px/mm) =====
const SOY = 440, sm = mapper(FOX, SOY, FK), SYp = y => SOY + y * FK;
line(P().M(FXp(-9), SOY).L(FXp(143), SOY), 4.3, 4.9, { w: 1.1, a: .6, dash: CEN });
const shells = [['cone', 'coneIn', 1], ['grip', 'gripIn', -1], ['barrel', 'barrelIn', 1], ['cap', 'capIn', -1]];
shells.forEach(([o, i], k) => { line(polyPath(sm(SH[o])), 4.4 + k * .18, 4.9 + k * .22, { w: 3 }); line(polyPath(sm(SH[i])), 4.6 + k * .18, 5.05 + k * .22, { w: 1.5 }); });
shells.forEach(([o, i, s], k) => { const A = sm(SH[o]), B = sm(SH[i]), xs = A.map(q => q[0]);
  hatch(c => { c.beginPath(); tracePoly(c, A); tracePoly(c, B); c.clip('evenodd'); }, 5.1 + k * .1, 5.55 + k * .1,
    { gap: 7, ang: s * Math.PI / 4, a: .7, box: [Math.min(...xs), SYp(-4.7), Math.max(...xs), SYp(4.7)] }); });
line(polyPath(sm(SH.clutch)), 4.95, 5.3, { w: 2.2 });
line(polyPath(sm(SH.ring)), 5.1, 5.35, { w: 2.2 });
[-0.5, 0.5].forEach((y, i) => line(P().M(FXp(14.5), SYp(y)).L(FXp(24), SYp(y)), 5.25 + i * .04, 5.45 + i * .04, { w: 1.2 }));   // jaw slits
line(polyPath(sm(SH.tube)), 5.05, 5.65, { w: 2.2 });
[-1.4, 1.4].forEach((y, i) => line(P().M(FXp(30), SYp(y)).L(FXp(116), SYp(y)), 5.3 + i * .05, 5.7 + i * .05, { w: 1.2, dash: HID }));
line(polyPath(sm(springPts(32, 24, 2.9)), false), 5.2, 5.7, { w: 1.8 });
for (let i = 0; i <= 24; i++) dot(FXp(32 + i), SYp(i % 2 ? 2.9 : -2.9), 5.25 + i * 0.018, 2.6);
line(polyPath(sm(SH.eraser)), 5.4, 5.7, { w: 2.2 });
hatch(c => { c.beginPath(); tracePoly(c, sm(SH.eraser)); c.clip(); }, 5.6, 5.85, { gap: 6, cross: true, a: .5, box: [FXp(122), SYp(-2.5), FXp(137), SYp(2.5)] });
line(P().M(FXp(-5), SOY).L(FXp(116), SOY), 5.5, 5.8, { w: 2.6 });                                  // lead through the clutch
leader(FXp(16.5), SYp(1.5), FXp(0), 590, FXp(6), 'CLUTCH · 3 JAWS', 5.75);
leader(FXp(44), SYp(2.9), FXp(52), 590, FXp(58), 'SPRING Ø 5.8', 5.85);
leader(FXp(90), SYp(2), FXp(97), 590, FXp(103), 'LEAD TUBE', 5.95);
leader(FXp(131), SYp(2.5), FXp(137), 590, FXp(143), 'ERASER', 6.05);
txt('SECTION A–A', 735, 530, 34, 5.6, { w8: 600, it: false, ls: 3 });
line(P().M(735 - 100, 543).L(735 + 100, 543), 5.8, 6.0, { w: 1.6 });

// ===== 5) EXPLODED VIEW (4.4 px/mm) — drawn by drawExploded() =====
const XK = 4.4, XY = 790, XAX = 855 - 70 * XK, xm = mapper(XAX, XY, XK);
const PARTS = [   // n, name, material, internal?, shapes, assembled start (mm), exploded start (px)
  { n: 1, name: 'TIP CONE', mat: 'BRASS', int: false, sh: ['cone'], lines: [[[5, -1.2], [5, 1.2]], [[18, -4], [18, 4]]], x0: 0, to: 150 },
  { n: 2, name: 'GRIP', mat: 'ALUMINUM', int: false, sh: ['grip'], knurl: true, x0: 20, to: 262 },
  { n: 3, name: 'CLUTCH', mat: 'STEEL', int: true, sh: ['clutch', 'ring'], lines: [[[14.5, -0.5], [24, -0.5]], [[14.5, 0.5], [24, 0.5]]], x0: 14, to: 424 },
  { n: 4, name: 'SPRING', mat: 'STEEL', int: true, spring: true, x0: 32, to: 506 },
  { n: 5, name: 'LEAD TUBE', mat: 'ABS', int: true, sh: ['tube'], x0: 30, to: 668 },
  { n: 6, name: 'BARREL', mat: 'ALUMINUM', int: false, sh: ['barrel', 'clip'], openClip: true, lines: [[[52, -R_EDGE], [126, -R_EDGE]], [[52, R_EDGE], [126, R_EDGE]]], x0: 52, to: 1070 },
  { n: 7, name: 'ERASER', mat: 'RUBBER', int: true, sh: ['eraser'], x0: 122, to: 1428 },
  { n: 8, name: 'CAP', mat: 'ALUMINUM', int: false, sh: ['cap'], lines: [[[129, -3.4], [129, 3.4]]], x0: 126, to: 1516 },
];
const XD0 = 6.05, XD1 = 6.55, XS0 = 6.6;       // draw assembled, then separate
PARTS.forEach((p, i) => {
  p.paths = (p.sh || []).map(s => polyPath(xm(SH[s]), !(p.openClip && s === 'clip')).done());
  (p.lines || []).forEach(l => p.paths.push(polyPath(xm(l), false).done()));
  p.sil = (p.sh || []).map(s => xm(SH[s]));
  p.off = p.to - (XAX + p.x0 * XK);
  p.ts = XS0 + Math.abs(i - 3.5) * 0.05;       // stagger from the middle outward
  evs.push({ k: 'slide', t: p.ts, d: 0.8, v: Math.min(1, Math.abs(p.off) / 400) });
});
const sepU = (p, t) => eio(seg(t, p.ts, p.ts + 0.8));
function drawExploded(c, t) {
  if (t < XD0) return;
  const dr = eio2(seg(t, XD0, XD1)), ua = eio(seg(t, XS0, XS0 + 1));
  c.save(); c.strokeStyle = `rgba(${LN},0.6)`; c.lineWidth = 1.1; c.setLineDash(CEN);
  const ax0 = lerp(XAX - 20, 118, ua), ax1 = lerp(XAX + 146 * XK, 1600, ua);
  c.beginPath(); c.moveTo(ax0, XY); c.lineTo(lerp(ax0, ax1, dr), XY); c.stroke(); c.restore();
  const stroke = (p, w) => { c.strokeStyle = `rgba(${LN},0.92)`; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round';
    for (const pa of p.paths) { c.beginPath(); pa.trace(c, 0, dr * pa.len); c.stroke(); } };
  const xhatch = (x0, x1, a) => { c.strokeStyle = `rgba(${LN},${a})`; c.lineWidth = 1; c.beginPath();
    for (let x = x0 - 40; x < x1; x += 6) { c.moveTo(x, XY - 20); c.lineTo(x + 40, XY + 20); c.moveTo(x + 40, XY - 20); c.lineTo(x, XY + 20); } c.stroke(); };
  // internal parts first
  for (const p of PARTS.filter(q => q.int)) { c.save(); c.translate(p.off * sepU(p, t), 0);
    if (p.spring) { const len = lerp(24, 30, eout(seg(t, p.ts + 0.35, p.ts + 1.0))), pa = polyPath(xm(springPts(32, len, 2.9)), false).done();
      c.strokeStyle = `rgba(${LN},0.92)`; c.lineWidth = 1.8; c.beginPath(); pa.trace(c, 0, dr * pa.len); c.stroke(); }
    else stroke(p, 2.2);
    if (p.n === 7 && dr >= 1) { c.save(); c.beginPath(); tracePoly(c, p.sil[0]); c.clip(); xhatch(XAX + 122 * XK, XAX + 137 * XK, 0.45); c.restore(); }
    c.restore(); }
  // external shells hide what is inside them
  const ext = PARTS.filter(q => !q.int);
  c.save(); c.globalCompositeOperation = 'destination-out'; c.fillStyle = '#000';
  for (const p of ext) { c.save(); c.translate(p.off * sepU(p, t), 0); c.beginPath(); p.sil.forEach(s => tracePoly(c, s)); c.fill('nonzero'); c.restore(); }
