<!doctype html>
<html><head><meta charset="utf-8"><title>Golden Age Comic</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Golden Age Comic: "THE NIGHT COURIER". A 1940s four-color comic page on yellowed pulp,
// printed as separate plates (cyan / magenta / yellow + black ink) that are slightly off-register.
const W = 1920, H = 1080, PW = 1000, PH = 1500;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const mk = (w, h) => { const q = document.createElement('canvas'); q.width = w; q.height = h; return q; };
const CL = mk(W, H), KL = mk(W, H), PL = mk(W, H), PA = mk(W, H), PB = mk(W, H);
const c = CL.getContext('2d'), k = KL.getContext('2d'), pC = PL.getContext('2d');
const INK = '#1c1511';
const COL = { Y: '#f2c63b', R: '#d33a2b', B: '#2c55a3', NAVY: '#1f316c', SKY: '#2a4893', PUR: '#5b3f84', BRN: '#9a5a2c', TAN: '#dba862',
  SKIN: '#f4c7a0', OR: '#ea8a30', DR: '#9e2a24', W: '#ffffff', LB: '#8fb8e0', GRN: '#4f8f5a' };
const LET = '"Comic Neue"', SFXF = '"Titan One"', LOGOF = '"Alfa Slab One"';

// ---------- helpers ----------
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hsh = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const eio = u => { u = cl(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const eo = u => 1 - Math.pow(1 - cl(u), 3);
const eob = (u, s = 1.9) => { u = cl(u); const c3 = s + 1; return 1 + c3 * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const popv = (t, t0, d = .3) => t < t0 ? 0 : eob((t - t0) / d);
const step = (t, fps = 12) => Math.floor(t * fps + 1e-6) / fps;   // "on twos" for drawn motion
const both = f => { f(c); f(k); };

// dot screens (Ben-Day): pattern in page units
const PAT = {};
function dots(bg, dot, r = .3, cell = 7, ang = 45) {
  const key = [bg, dot, r, cell, ang].join();
  if (PAT[key]) return PAT[key];
  const T = 40, tl = mk(T, T), g = tl.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, T, T); g.fillStyle = dot; g.beginPath(); g.arc(T / 2, T / 2, r * T, 0, 7); g.fill();
  const p = c.createPattern(tl, 'repeat'); p.setTransform(new DOMMatrix().rotateSelf(ang).scaleSelf(cell / T));
  return PAT[key] = p;
}
function jit(pts, a, seed) { return pts.map((p, i) => [p[0] + (hsh(seed + i * 3.17) - .5) * 2 * a, p[1] + (hsh(seed + i * 7.31 + 1.3) - .5) * 2 * a]); }
function P2(pts, smooth = true, closed = true) {
  const p = new Path2D(), n = pts.length;
  if (!smooth) { p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < n; i++) p.lineTo(pts[i][0], pts[i][1]); if (closed) p.closePath(); return p; }
  if (!closed) {
    p.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < n - 1; i++) p.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
    p.lineTo(pts[n - 1][0], pts[n - 1][1]); return p;
  }
  const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const m0 = m(pts[n - 1], pts[0]); p.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const q = m(pts[i], pts[(i + 1) % n]); p.quadraticCurveTo(pts[i][0], pts[i][1], q[0], q[1]); }
  p.closePath(); return p;
}
// a filled + inked shape. fill may be a color/pattern; 'K' = solid black ink area
function shp(pth, fill, lw = 4) {
  if (fill === 'K') { c.fillStyle = COL.NAVY; c.fill(pth); k.fillStyle = INK; k.fill(pth); }
  else if (fill) { c.fillStyle = fill; c.fill(pth); k.fillStyle = '#fff'; k.fill(pth); }
  if (lw) { k.lineWidth = lw; k.lineJoin = 'round'; k.lineCap = 'round'; k.strokeStyle = INK; k.stroke(pth); }
}
const S = (pts, fill, lw = 4, seed = 0, j = .8, smooth = true) => shp(P2(j ? jit(pts, j, seed) : pts, smooth), fill, lw);
// tapered brush stroke (ink only)
function brush(pts, w, seed = 0, ta = 1, tb = 1, g = k, col = INK) {
  const q = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 0; s < 6; s++) { const u = s / 6, u2 = u * u, u3 = u2 * u;
      q.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3),
              .5 * (2 * p1[1] + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3)]); }
  }
  q.push(pts[pts.length - 1]);
  const L = [], R = [], n = q.length;
  for (let i = 0; i < n; i++) {
    const a = q[Math.max(0, i - 1)], b = q[Math.min(n - 1, i + 1)]; let dx = b[0] - a[0], dy = b[1] - a[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const u = i / (n - 1); let wd = w * (.75 + .5 * hsh(seed + i * .37) * .5);
    if (ta) wd *= Math.pow(Math.min(1, u / .3), .7); if (tb) wd *= Math.pow(Math.min(1, (1 - u) / .35), .7);
    wd = Math.max(wd, w * .06);
    L.push([q[i][0] - dy * wd / 2, q[i][1] + dx * wd / 2]); R.push([q[i][0] + dy * wd / 2, q[i][1] - dx * wd / 2]);
  }
  const p = new Path2D(); p.moveTo(L[0][0], L[0][1]); for (const v of L) p.lineTo(v[0], v[1]); for (let i = n - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]); p.closePath();
  g.fillStyle = col; g.fill(p);
}
function ell(cx, cy, rx, ry, n = 24, j = 0, seed = 0, rot = 0) {
  const o = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, rr = 1 + (hsh(seed + i) - .5) * j;
    const x = Math.cos(a) * rx * rr, y = Math.sin(a) * ry * rr; o.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
  return o;
}
function withT(fn, tx, ty, rot = 0, sc = 1) { both(g => { g.save(); g.translate(tx, ty); g.rotate(rot); g.scale(sc, sc); }); fn(); both(g => g.restore()); }
function clipRect(x, y, w, h, fn) { both(g => { g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); }); fn(); both(g => g.restore()); }

// hand lettering: per-glyph jitter, slightly heavy ink
function letters(lines, cx, cy, size, seed = 0, lh = 1.13, align = 'center', font = LET, weight = 700) {
  k.save(); k.font = `${weight} ${size}px ${font}`; k.textBaseline = 'middle'; k.fillStyle = INK; k.strokeStyle = INK; k.lineWidth = size * .045; k.lineJoin = 'round';
  lines.forEach((ln, li) => {
    const y = cy + (li - (lines.length - 1) / 2) * size * lh;
    const ws = [...ln].map(ch => k.measureText(ch).width), tw = ws.reduce((a, b) => a + b, 0) + size * .03 * (ln.length - 1);
    let x = align === 'center' ? cx - tw / 2 : cx;
    [...ln].forEach((ch, i) => {
      const r = seed + li * 31 + i * 1.7;
      k.save(); k.translate(x + ws[i] / 2, y + (hsh(r) - .5) * size * .07); k.rotate((hsh(r + 9) - .5) * .07);
      const sc = 1 + (hsh(r + 4) - .5) * .06; k.scale(sc, sc); k.textAlign = 'center';
      k.fillText(ch, 0, 0); k.strokeText(ch, 0, 0); k.restore();
      x += ws[i] + size * .03;
    });
  });
  k.restore();
}
// speech balloon (paper-white), pops in with overshoot
function speech(t, t0, cx, cy, rx, ry, tx, ty, lines, size, seed = 0) {
  const s = popv(t, t0, .32); if (s <= 0) return;
  withT(() => {
    const e = P2(ell(0, 0, rx, ry, 30, .035, seed));
    const a = Math.atan2(ty - cy, tx - cx), w = .2;
    const b1 = [Math.cos(a - w) * rx * .82, Math.sin(a - w) * ry * .82], b2 = [Math.cos(a + w) * rx * .82, Math.sin(a + w) * ry * .82];
    const tip = [tx - cx, ty - cy], mid = [(b1[0] + b2[0]) / 2 * 1.35 + tip[0] * .18, (b1[1] + b2[1]) / 2 * 1.35 + tip[1] * .18];
    const tl = new Path2D(); tl.moveTo(b1[0], b1[1]); tl.quadraticCurveTo(mid[0] - 6, mid[1], tip[0], tip[1]); tl.quadraticCurveTo(mid[0] + 6, mid[1] + 4, b2[0], b2[1]); tl.closePath();
    for (const p of [e, tl]) { c.fillStyle = '#fff'; c.fill(p); k.fillStyle = '#fff'; k.fill(p); }
    k.strokeStyle = INK; k.lineWidth = 7; k.lineJoin = 'round'; k.stroke(e); k.stroke(tl);
    k.fillStyle = '#fff'; k.fill(e); k.fill(tl);
    letters(lines, 0, 0, size, seed);
  }, cx, cy, 0, s);
}
// rectangular caption box (yellow)
function caption(t, t0, x, y, w, h, lines, size, seed = 0, fill = COL.Y) {
  const u = cl((t - t0) / .22); if (u <= 0) return;
  const s = eob(u, 2.2);
  withT(() => {
    const p = P2(jit([[0, 0], [w, 0], [w, h], [0, h]], 1.2, seed), false);
    shp(p, fill, 3.6);
    letters(lines, 14, h / 2, size, seed + 5, 1.13, 'left');
  }, x, y, (1 - u) * -.05, .6 + .4 * s);
}
// chunky SFX lettering with extrusion
function sfx(t, t0, text, x, y, size, rot, face = COL.Y, ext = COL.R, depth = .09, seed = 0, font = SFXF, stag = .04, jz = .22) {
  if (t < t0) return;
  c.save(); k.save(); c.font = k.font = `400 ${size}px ${font}`;
  const ch = [...text], ws = ch.map(q => k.measureText(q).width), tw = ws.reduce((a, b) => a + b, 0) * .92;
  let px = -tw / 2;
  both(g => { g.translate(x, y); g.rotate(rot); g.textAlign = 'center'; g.textBaseline = 'middle'; });
  ch.forEach((q, i) => {
    const s = popv(t, t0 + i * stag, .26), cx = px + ws[i] * .46; px += ws[i] * .92;
    if (s <= 0) return;
    const r = seed + i * 2.3, sc = s * (1 + (hsh(r) - .5) * jz), dy = (hsh(r + 1) - .5) * size * .16 - Math.sin(i / (ch.length - 1 || 1) * Math.PI) * size * .06;
    both(g => { g.save(); g.translate(cx, dy); g.rotate((hsh(r + 2) - .5) * jz); g.scale(sc, sc); });
    const D = size * depth, N = 10;
    for (let j = N; j >= 1; j--) { const o = D * j / N; c.fillStyle = ext; c.fillText(q, o * .55, o); k.fillStyle = '#fff'; k.fillText(q, o * .55, o); }
    k.lineWidth = size * .075; k.lineJoin = 'round'; k.strokeStyle = INK; k.strokeText(q, D * .55, D);
    k.fillStyle = '#fff'; for (let j = N; j >= 1; j--) { const o = D * j / N; k.fillText(q, o * .55, o); }
    k.strokeText(q, 0, 0); k.fillText(q, 0, 0);
    c.fillStyle = face; c.fillText(q, 0, 0);
    both(g => g.restore());
  });
  c.restore(); k.restore();
}
function star(x, y, r, seed = 0) {
  const pts = []; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + hsh(seed) * .5, rr = i % 2 ? r * .32 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  S(pts, COL.Y, 1.6, seed, 0, false);
}

// ---------- scenery ----------
function skyBands(x, y, w, h, seed = 0) {
  const b = [[dots(COL.NAVY, '#101a40', .36, 8, 45), 0, .34], [dots(COL.SKY, COL.NAVY, .34, 8, 45), .34, .7], [dots(COL.SKY, COL.PUR, .3, 8, 45), .7, 1.01]];
  for (const [f, a, e] of b) { c.fillStyle = f; c.fillRect(x, y + h * a, w, h * (e - a) + 1); }
  k.fillStyle = '#fff'; k.fillRect(x, y, w, h);
}
function moon(x, y, r, seed = 0) {
  S(ell(x, y, r, r, 36, .02, seed), dots(COL.Y, '#f7e7a0', .3, 7), 3.5, seed, 0);
  for (const [cx, cy, cr] of [[-.35, -.2, .16], [.1, -.42, .1], [.25, .05, .19], [-.2, .35, .12], [.45, -.3, .07]])
    S(ell(x + cx * r, y + cy * r, cr * r, cr * r * .82, 12, .1, seed + cx * 9), dots(COL.Y, COL.OR, .38, 6), 1.8, seed, 0);
}
function buildings(x0, x1, base, hMin, hMax, seed, fill, winFill = COL.Y, lw = 3.2) {
  let x = x0; let i = 0;
  while (x < x1) {
    const w = 38 + hsh(seed + i) * 70, h = hMin + hsh(seed + i + 50) * (hMax - hMin), top = base - h;
    const kind = Math.floor(hsh(seed + i + 90) * 4);
    const pts = [[x, base], [x, top]];
    if (kind === 1) { pts.push([x + w * .2, top], [x + w * .2, top - 16], [x + w * .5, top - 40], [x + w * .8, top - 16], [x + w * .8, top]); }
    else if (kind === 2) { pts.push([x + w * .15, top], [x + w * .15, top - 18], [x + w * .45, top - 18], [x + w * .45, top - 50], [x + w * .5, top - 70], [x + w * .55, top - 50], [x + w * .55, top - 18], [x + w * .85, top - 18], [x + w * .85, top]); }
    pts.push([x + w, top], [x + w, base]);
    S(pts, fill, lw, seed + i, .6, false);
    // windows
    for (let wy = top + 12; wy < base - 12; wy += 16) for (let wx = x + 7; wx < x + w - 10; wx += 13) {
      if (hsh(seed + wx * .37 + wy * .91) > .72) { c.fillStyle = winFill; c.fillRect(wx, wy, 6, 8); k.fillStyle = '#fff'; k.fillRect(wx, wy, 6, 8); }
    }
    x += w - 2; i++;
  }
}
// the runaway delivery balloon
function airBalloon(cx, cy, r, t, seed = 0, rope = null, label = true) {
  const top = cy - r, neckY = cy + r * 1.18, prof = v => v < .62 ? Math.sin(Math.acos(1 - v / .62 * 1.0 * 1)) : 0; // placeholder
  const half = v => { // v: 0 top -> 1 neck
    if (v < .55) { const a = v / .55; return r * Math.sqrt(Math.max(0, 1 - Math.pow(1 - a, 2))); }
    const a = (v - .55) / .45; return lerp(r, r * .26, Math.pow(a, 1.25));
  };
  const hgt = neckY - top, M = 22;
  const outline = []; for (let i = 0; i <= M; i++) { const v = i / M; outline.push([cx + half(v), top + v * hgt]); }
  for (let i = M; i >= 0; i--) { const v = i / M; outline.push([cx - half(v), top + v * hgt]); }
  const env = P2(outline, true);
  // ropes to basket
  const bw = r * .5, by = neckY + r * .45, bh = r * .38;
  for (const s of [-1, 1]) { k.strokeStyle = INK; k.lineWidth = 2.4; k.beginPath(); k.moveTo(cx + s * r * .24, neckY - 2); k.lineTo(cx + s * bw * .5, by); k.stroke(); }
  // gores
  c.save(); k.save(); c.clip(env); k.clip(env);
  const G = 8;
  for (let g = 0; g < G; g++) {
    const th0 = -Math.PI / 2 + g / G * Math.PI, th1 = th0 + Math.PI / G, pts = [];
    for (let i = 0; i <= M; i++) { const v = i / M; pts.push([cx + half(v) * Math.sin(th0) * 1.02, top + v * hgt]); }
    for (let i = M; i >= 0; i--) { const v = i / M; pts.push([cx + half(v) * Math.sin(th1) * 1.02, top + v * hgt]); }
    const f = g % 2 ? COL.Y : COL.R; c.fillStyle = (g === 0 || g === G - 1) ? dots(f, g % 2 ? COL.OR : COL.DR, .34, 6) : f; c.fill(P2(pts, false));
  }
  k.fillStyle = '#fff'; k.fill(env);
  for (let g = 1; g < G; g++) { const th = -Math.PI / 2 + g / G * Math.PI, pts = []; for (let i = 0; i <= 10; i++) { const v = i / 10; pts.push([cx + half(v) * Math.sin(th), top + v * hgt]); } brush(pts, r * .028, seed + g, 1, 0); }
  // shading crescent on the right
  const sh = []; for (let i = 0; i <= M; i++) { const v = i / M; sh.push([cx + half(v) * 1.05, top + v * hgt]); } for (let i = M; i >= 0; i--) { const v = i / M; sh.push([cx + half(v) * .72, top + v * hgt]); }
  c.fillStyle = dots('rgba(0,0,0,0)', 'rgba(40,30,110,.85)', .3, 6, 45); c.fill(P2(sh));
  if (label) { // equator band
    const yb = top + hgt * .5, bh2 = r * .2; c.fillStyle = '#fff'; c.fillRect(cx - r, yb - bh2 / 2, r * 2, bh2); k.fillStyle = '#fff';
    k.strokeStyle = INK; k.lineWidth = 2.5; k.beginPath(); k.moveTo(cx - r, yb - bh2 / 2); k.quadraticCurveTo(cx, yb - bh2 / 2 + r * .06, cx + r, yb - bh2 / 2); k.moveTo(cx - r, yb + bh2 / 2); k.quadraticCurveTo(cx, yb + bh2 / 2 + r * .06, cx + r, yb + bh2 / 2); k.stroke();
    letters(['AIR PARCEL CO.'], cx, yb + r * .02, r * .135, seed + 3);
  }
  c.restore(); k.restore();
  shp(env, null, r * .04);
  // basket + parcels
  const parcels = [[-.42, -.22, .36, .3, COL.TAN], [-.02, -.34, .3, .42, COL.OR], [.3, -.18, .3, .26, COL.TAN]];
  for (const [px, py, pw, ph, f] of parcels) {
    const x = cx + px * bw * 1.3, y = by + py * r * .9;
    S([[x, y], [x + pw * r * .7, y], [x + pw * r * .7, y + ph * r], [x, y + ph * r]], f, 2.2, seed + px * 10, .5, false);
    brush([[x + pw * r * .35, y + 1], [x + pw * r * .35, y + ph * r * .6]], 2, seed, 0, 0); brush([[x + 1, y + ph * r * .3], [x + pw * r * .7 - 1, y + ph * r * .3]], 2, seed + 1, 0, 0);
  }
  const bpts = [[cx - bw * .55, by], [cx + bw * .55, by], [cx + bw * .45, by + bh], [cx - bw * .45, by + bh]];
  S(bpts, dots(COL.BRN, '#5e3014', .32, 5), 3, seed + 7, .4, false);
  for (let i = 1; i < 5; i++) { const xx = cx - bw * .55 + bw * 1.1 * i / 5; brush([[xx, by + 2], [xx - (xx - cx) * .18, by + bh - 2]], 1.8, seed + i, 0, 0); }
  brush([[cx - bw * .52, by + bh * .5], [cx + bw * .52, by + bh * .5]], 1.8, seed + 12, 0, 0);
  return [cx, by + bh];
}
// dangling tether rope (page units), frayed end
function tether(pts, t, seed = 0) {
  k.strokeStyle = INK; k.lineCap = 'round'; k.lineJoin = 'round';
  const pth = P2(pts, true, false);
  k.lineWidth = 7; k.stroke(pth); c.strokeStyle = COL.TAN; c.lineWidth = 7; c.stroke(pth);
  k.strokeStyle = '#fff'; k.lineWidth = 3; k.stroke(pth);
  const e = pts[pts.length - 1], p = pts[pts.length - 2], a = Math.atan2(e[1] - p[1], e[0] - p[0]);
  for (let i = -2; i <= 2; i++) { const b = a + i * .28; brush([[e[0], e[1]], [e[0] + Math.cos(b) * 13, e[1] + Math.sin(b) * 13]], 2.2, seed + i, 0, 1); }
}
function radioMast(bx, by, tx, ty, t, seed = 0) {
  const hw = 60;
  for (const s of [-1, 1]) brush([[bx + s * hw, by], [tx + s * 6, ty + 30]], 6, seed + s, 0, 0);
  const n = 11;
  for (let i = 0; i < n; i++) {
    const u0 = i / n, u1 = (i + 1) / n, y0 = lerp(by, ty + 30, u0), y1 = lerp(by, ty + 30, u1), w0 = lerp(hw, 6, u0), w1 = lerp(hw, 6, u1);
    brush([[bx - w0, y0], [bx + w1, y1]], 3, seed + i, 0, 0); brush([[bx + w0, y0], [bx - w1, y1]], 3, seed + i + 20, 0, 0);
    brush([[bx - w1, y1], [bx + w1, y1]], 2.6, seed + i + 40, 0, 0);
  }
  brush([[tx, ty + 32], [tx, ty - 4]], 5, seed + 80, 0, 0);
