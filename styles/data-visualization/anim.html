<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head>
<body style="margin:0;background:#f6f4ef"><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  data-visualization — editorial data journalism: protected bike lanes. window.draw({t}) → JPEG base64
//  Scene 1: line chart of daily cyclists draws itself, lane-opening marker, bracket + "×3" counter.
//  Scroll (scrollytelling) → Scene 2: street-by-street bars, with vs without lanes.
//  Scroll → Scene 3: small multiples by season. Closing: content lifts away, key takeaway holds.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eOut = x => 1 - Math.pow(1 - x, 3), eOut4 = x => 1 - Math.pow(1 - x, 4), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const PAPER = '#f6f4ef', INK = '#15130f', MUTED = '#6d685e', GRID = '#dcd7cc', ACC = '#d8402f', GREY = '#a19b8f', DARK = '#45413a';
const SERIF = "'Source Serif 4', Georgia, serif", SANS = "'Libre Franklin', sans-serif";
function F(size, w, fam, ls = 0) { ctx.font = `${w} ${size}px ${fam}`; ctx.letterSpacing = ls + 'px'; }
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const fmt = v => Math.round(v).toLocaleString('en-US');
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── data (illustrative) ─────────────────────────────────────────────────────
// average daily cyclists on one avenue, 24 months; the protected lane opens after month 8
const LINE = [760, 790, 840, 870, 900, 880, 910, 860, 830, 1050, 1280, 1420, 1500, 1690, 1840, 1980, 2120, 2210, 2290, 2380, 2330, 2440, 2520, 2560];
const OPEN = 8, BEFORE = 850, NL = LINE.length - 1;
const PX0 = 200, PX1 = 1330, PY0 = 890, PY1 = 400, YMAX = 3000;
const X = i => lerp(PX0, PX1, i / NL), Y = v => lerp(PY0, PY1, v / YMAX);
const STREETS = [
  { lab: 'Harbor Avenue', v: 2560, lane: true }, { lab: 'Mill Road', v: 2140, lane: true }, { lab: 'Linden Street', v: 1790, lane: true },
  { lab: 'Quarry Lane', v: 830, lane: false }, { lab: 'Fenwick Street', v: 690, lane: false }, { lab: 'Elm Parade', v: 540, lane: false }];
const SEASONS = [
  { lab: 'Winter', b: [420, 400, 390, 410, 430, 450, 440, 470, 480, 500, 520, 540, 560], k: 2.8 },
  { lab: 'Spring', b: [600, 640, 690, 720, 760, 800, 830, 860, 880, 900, 930, 950, 970], k: 3.0 },
  { lab: 'Summer', b: [990, 1030, 1060, 1100, 1120, 1150, 1170, 1160, 1180, 1150, 1130, 1110, 1090], k: 3.2 },
  { lab: 'Autumn', b: [1000, 960, 930, 890, 860, 820, 790, 760, 720, 690, 660, 620, 590], k: 2.9 }];
// "after" series: same seasonal shape, lifted by the season's factor, with a little seeded wobble
SEASONS.forEach((s, i) => { const r = rng(40 + i); s.a = s.b.map(v => v * s.k * (0.96 + 0.08 * r())); s.pct = Math.round((s.k - 1) * 100); });
const SMAX = 4000;

const T = { head: 0.1, grid: 0.55, line0: 0.95, line1: 2.6, note: 2.7, sc1a: 3.55, sc1b: 4.2, bars: 4.0,
  sc2a: 5.9, sc2b: 6.5, pan: 6.3, fade: 7.85, end: 8.05 };

function invIO(f) { let lo = 0, hi = 1; for (let k = 0; k < 30; k++) { const m = (lo + hi) / 2; eIO(m) < f ? lo = m : hi = m; } return lo; }
const tLine = i => T.line0 + (T.line1 - T.line0) * invIO(i / NL);   // time the drawn line reaches point i
window.events = () => {
  const E = [];
  for (let i = 0; i <= NL; i++) E.push({ t: tLine(i), k: 'dot', v: LINE[i] / YMAX });
  E.push({ t: tLine(OPEN) + 0.05, k: 'tock' });
  for (let j = 0; j < 8; j++) E.push({ t: T.note + 0.12 + 0.62 * (1 - Math.cbrt(1 - j / 7)), k: 'count', v: j / 7 });
  E.push({ t: T.note + 0.8, k: 'tock' });
  E.push({ t: T.sc1a, k: 'slide', d: T.sc1b - T.sc1a });
  STREETS.forEach((s, i) => E.push({ t: T.bars + 0.25 + i * 0.12 + 0.55, k: s.lane ? 'tick' : 'tickLo' }));
  E.push({ t: T.bars + 1.3, k: 'tock' });
  E.push({ t: T.sc2a, k: 'slide', d: T.sc2b - T.sc2a });
  SEASONS.forEach((s, i) => E.push({ t: T.pan + i * 0.12 + 0.62, k: 'dot', v: 0.45 + i * 0.08 }));
  E.push({ t: T.end + 0.1, k: 'soft' });
  E.push({ t: T.end + 0.74, k: 'tock' });
  return E;
};

// ── text helpers ────────────────────────────────────────────────────────────
// line rising out of a mask (editorial title entry)
function riseText(str, x, y, p, lineH, halo = 0) {
  if (p <= 0) return; const e = eOut4(p), yy = y + (1 - e) * lineH * 0.9;
  ctx.save(); ctx.beginPath(); ctx.rect(x - 10, y - lineH * 0.95, 1700, lineH * 1.25); ctx.clip();
  ctx.globalAlpha *= clamp(p * 2);
  if (halo) { const fs = ctx.fillStyle; ctx.strokeStyle = PAPER; ctx.lineWidth = halo; ctx.lineJoin = 'round'; ctx.strokeText(str, x, yy); ctx.fillStyle = fs; }
  ctx.fillText(str, x, yy); ctx.restore();
}
// headline with one accent phrase in red and an underline wipe under it
function headline(pre, key, post, x, y, p, up) {
  F(66, 600, SERIF, -0.8); ctx.textAlign = 'left';
  const w1 = ctx.measureText(pre).width, w2 = ctx.measureText(key).width;
  const u = eOut(up); if (u > 0) { ctx.fillStyle = ACC; ctx.fillRect(x + w1 + 2, y + 14, (w2 - 4) * u, 4); }
  ctx.fillStyle = INK; riseText(pre, x, y, p, 76);
  ctx.fillStyle = ACC; riseText(key, x + w1, y, p, 76, 7);
  ctx.fillStyle = INK; riseText(post, x + w1 + w2, y, p, 76);
}
// number with equal-width digits (does not jitter while counting)
function numText(str, x, y, align = 'left') {
  const dw = ctx.measureText('0').width; let w = 0; const parts = [...str].map(ch => { const cw = /[0-9]/.test(ch) ? dw : ctx.measureText(ch).width; w += cw; return [ch, cw]; });
  let cx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x; const al = ctx.textAlign; ctx.textAlign = 'center';
  for (const [ch, cw] of parts) { ctx.fillText(ch, cx + cw / 2, y); cx += cw; } ctx.textAlign = al; return w;
}
function source(x, y, a, str = 'Illustrative data.') { if (a <= 0) return; F(16, 400, SANS, 0.3); ctx.fillStyle = rgba(MUTED, a * 0.9); ctx.textAlign = 'left'; ctx.fillText(str, x, y); }
function kicker(str, x, y, p) { F(17, 700, SANS, 2.5); ctx.fillStyle = ACC; ctx.textAlign = 'left'; riseText(str, x, y, p, 24); }
function sub(str, x, y, p) { F(25, 400, SANS, 0); ctx.fillStyle = MUTED; ctx.textAlign = 'left'; riseText(str, x, y, p, 34); }

// ── scene 1: line chart ─────────────────────────────────────────────────────
function scene1(t) {
  ctx.textBaseline = 'alphabetic';
  kicker('CITY CYCLING', PX0, 150, seg(t, T.head, T.head + 0.55));
  headline('Build the lane and ', 'the riders come', '', PX0, 232, seg(t, T.head + 0.12, T.head + 0.8), seg(t, 0.85, 1.3));
  sub('Average cyclists per day on Harbor Avenue, by month', PX0, 292, seg(t, T.head + 0.35, T.head + 0.95));

  // grid grows bottom to top, left to right
  for (let k = 0; k <= 3; k++) { const v = k * 1000, y = Y(v), p = eOut(seg(t, T.grid + k * 0.08, T.grid + 0.55 + k * 0.08)); if (p <= 0) continue;
    ctx.fillStyle = k === 0 ? INK : GRID; ctx.fillRect(PX0, y - (k === 0 ? 1 : 0.5), (PX1 - PX0 + 40) * p, k === 0 ? 2 : 1);
    F(19, 400, SANS, 0); ctx.fillStyle = rgba(MUTED, clamp(p * 1.5)); ctx.textAlign = 'left';
    if (k > 0) ctx.fillText(k === 3 ? '3,000 riders' : fmt(v), PX0, y - 10); }
  F(19, 400, SANS, 0); ctx.textAlign = 'center';
  [[0, 'Jan'], [6, 'Jul'], [12, 'Jan'], [18, 'Jul'], [23, 'Dec']].forEach(([i, s], k) => { const p = seg(t, T.grid + 0.3 + k * 0.06, T.grid + 0.7 + k * 0.06); if (p <= 0) return;
    ctx.fillStyle = rgba(MUTED, p); ctx.fillRect(X(i) - 0.5, PY0, 1, 8 * p); ctx.fillText(s, X(i), PY0 + 36); });
  const yp = seg(t, T.grid + 0.5, T.grid + 0.9);
  if (yp > 0) { F(16, 700, SANS, 1.5); ctx.fillStyle = rgba(DARK, yp); ctx.textAlign = 'center'; ctx.fillText('YEAR 1', X(0), PY0 + 64); ctx.fillText('YEAR 2', X(12), PY0 + 64); }

  // lane-opening marker: dashed rule drops from the top when the line reaches it
  const mp = seg(t, tLine(OPEN) - 0.05, tLine(OPEN) + 0.4);
  if (mp > 0) { const x = (X(OPEN) + X(OPEN + 1)) / 2, e = eOut(mp), top = PY1 - 30;
    ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.setLineDash([5, 6]); ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, top + (PY0 - top) * e); ctx.stroke(); ctx.setLineDash([]);
    F(20, 700, SANS, 0); ctx.textAlign = 'left'; ctx.fillStyle = rgba(INK, clamp(mp * 2)); ctx.fillText('Protected lane opens', x + 12 + (1 - e) * 10, top + 16);
    F(19, 400, SANS, 0); ctx.fillStyle = rgba(MUTED, clamp(mp * 2 - 0.4)); ctx.fillText('Curb-separated, both directions', x + 12 + (1 - e) * 10, top + 42); }

  // "before" reference level
  const bp = seg(t, T.note - 0.1, T.note + 0.45);
  if (bp > 0) { const y = Y(BEFORE); ctx.strokeStyle = rgba(DARK, 0.8); ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]);
    ctx.beginPath(); ctx.moveTo(X(0), y); ctx.lineTo(lerp(X(0), X(NL), eOut(bp)), y); ctx.stroke(); ctx.setLineDash([]);
    F(19, 500, SANS, 0); ctx.fillStyle = rgba(DARK, clamp(bp * 2 - 0.8)); ctx.textAlign = 'right'; ctx.fillText('Before the lane: 850 a day', X(NL), y + 30); }

  drawLine(LINE, ACC, 5, eIO(seg(t, T.line0, T.line1)));

  // note: bracket + big "×3" counter
  const np = seg(t, T.note, T.note + 0.5);
  if (np > 0) { const x = X(NL) + 70, y0 = Y(BEFORE), y1 = Y(LINE[NL]), e = eOut(np);
    ctx.fillStyle = INK; const ym = (y0 + y1) / 2; const hh = (y0 - y1) / 2 * e;
    ctx.fillRect(x, ym - hh, 2, hh * 2); ctx.fillRect(x - 8, ym - hh, 10, 2); ctx.fillRect(x - 8, ym + hh - 2, 10, 2);
    const cp = seg(t, T.note + 0.12, T.note + 0.74), v = lerp(1, 3, eOut(cp));
    const pop = cp >= 1 ? 1 + 0.06 * Math.sin(Math.PI * seg(t, T.note + 0.74, T.note + 0.98)) : 1;
    ctx.save(); ctx.globalAlpha *= clamp(cp * 3); const tx = x + 30;
    ctx.translate(tx, ym + 22); ctx.scale(pop, pop); F(104, 800, SANS, -2); ctx.fillStyle = ACC; ctx.textAlign = 'left';
    const mw = ctx.measureText('×').width; ctx.fillText('×', 0, 0); numText(cp >= 1 ? '3' : v.toFixed(1), mw + 2, 0); ctx.restore();
    ctx.save(); ctx.globalAlpha *= clamp(cp * 2 - 0.5); F(21, 400, SANS, 0); ctx.fillStyle = MUTED; ctx.textAlign = 'left';
    ctx.fillText('riders a day, two years', tx + 4, ym + 64); ctx.fillText('after the lane opened', tx + 4, ym + 92); ctx.restore(); }
  source(PX0, 985, seg(t, 1.2, 1.7), 'Illustrative data. Monthly average of automatic counter readings.');
}
function drawLine(D, col, lw, p) {
  if (p <= 0) return;
  const pts = D.map((v, i) => [X(i), Y(v)]);
  // parametrise by x so the head moves at a steady pace across months
  const px = lerp(pts[0][0], pts[NL][0], p); let hx = pts[0][0], hy = pts[0][1], hv = D[0];
  const trace = () => { ctx.moveTo(...pts[0]);
    for (let i = 1; i < pts.length; i++) {
      if (pts[i][0] <= px + 1e-6) { ctx.lineTo(...pts[i]); hx = pts[i][0]; hy = pts[i][1]; hv = D[i]; }
      else { const f = (px - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]); hx = px; hy = lerp(pts[i - 1][1], pts[i][1], f); hv = lerp(D[i - 1], D[i], f); ctx.lineTo(hx, hy); break; } } };
  // soft area under the drawn line
  ctx.beginPath(); trace(); ctx.lineTo(hx, PY0); ctx.lineTo(pts[0][0], PY0); ctx.closePath(); ctx.fillStyle = rgba(ACC, 0.07); ctx.fill();
  ctx.beginPath(); trace(); ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  const passed = Math.floor(p * NL + 1e-6);
  for (let i = 0; i <= passed && i <= NL; i++) { const sz = i === NL || i === 0 ? 7 : 4.5;
    ctx.fillStyle = PAPER; ctx.beginPath(); ctx.arc(X(i), Y(D[i]), sz + 2, 0, 7); ctx.fill(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X(i), Y(D[i]), sz, 0, 7); ctx.fill(); }
  if (p < 1) {   // running value at the head
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(hx, hy, 9, 0, 7); ctx.fill();
    F(30, 700, SANS, 0); ctx.fillStyle = INK; ctx.textAlign = 'left'; numText(fmt(hv), hx + 14, hy - 20, 'left'); }
  else { F(24, 700, SANS, 0); ctx.fillStyle = INK; ctx.textAlign = 'right'; ctx.fillText('2,560', X(NL) - 14, Y(D[NL]) - 18);
    ctx.fillStyle = MUTED; ctx.textAlign = 'left'; F(22, 700, SANS, 0); ctx.fillText('760', X(0) + 12, Y(D[0]) + 34); }
}

// ── scene 2: street-by-street bars ─────────────────────────────────────────
function scene2(t, oy) {
  ctx.textBaseline = 'alphabetic';
  const b = T.sc1b - 0.45;
  kicker('STREET BY STREET', PX0, oy + 150, seg(t, b, b + 0.55));
  headline('Streets ', 'with protected lanes', ' carry more', PX0, oy + 232, seg(t, b + 0.1, b + 0.75), seg(t, b + 0.7, b + 1.1));
  sub('Average cyclists per day, six comparable streets', PX0, oy + 292, seg(t, b + 0.25, b + 0.85));
  const BX0 = 620, BX1 = 1560, unit = (BX1 - BX0) / 3000, top = oy + 410, gap = 80, bh = 52, split = 40;
  const rowY = i => top + i * gap + (i >= 3 ? split : 0);
  // scale
  for (let k = 0; k <= 3000; k += 1000) { const x = BX0 + k * unit, d = k / 1000 * 0.03, p = seg(t, T.bars + d, T.bars + 0.4 + d); if (p <= 0) continue;
    ctx.fillStyle = k === 0 ? INK : GRID; ctx.fillRect(x - (k === 0 ? 1 : 0.5), top - 36, k === 0 ? 2 : 1, (rowY(5) + bh + 28 - top) * eOut(p));
    F(19, 400, SANS, 0); ctx.fillStyle = rgba(MUTED, p); ctx.textAlign = 'center'; ctx.fillText(k === 3000 ? '3,000 riders' : fmt(k), x, top - 50); }
  // group labels
  [[0, 'WITH PROTECTED LANES', ACC], [3, 'PAINT ONLY OR NO LANE', DARK]].forEach(([i, s, c], k) => { const p = seg(t, T.bars + 0.1 + k * 0.36, T.bars + 0.5 + k * 0.36); if (p <= 0) return;
    F(15, 700, SANS, 2); ctx.fillStyle = rgba(c, p); ctx.textAlign = 'right'; ctx.fillText(s, BX0 - 28, rowY(i) - 12); });
  STREETS.forEach((d, i) => { const y = rowY(i); const p = seg(t, T.bars + 0.25 + i * 0.12, T.bars + 1.05 + i * 0.12); if (p <= 0) return;
    const e = eOut4(p), col = d.lane ? ACC : GREY, len = d.v * unit * e;
    ctx.textAlign = 'right'; F(27, d.lane ? 700 : 500, SANS, 0); ctx.fillStyle = rgba(d.lane ? INK : DARK, clamp(p * 2.5));
    ctx.fillText(d.lab, BX0 - 28, y + bh / 2 + 10);
    ctx.fillStyle = col; ctx.fillRect(BX0, y, len, bh);
    F(30, 800, SANS, -0.5); ctx.fillStyle = d.lane ? ACC : DARK; ctx.textAlign = 'left';
    numText(fmt(Math.round(d.v * e / 10) * 10), BX0 + len + 16, y + bh / 2 + 11); });
  // note beside the "without" group
  const np = seg(t, T.bars + 1.25, T.bars + 1.65);
  if (np > 0) { const x = BX0 + 1150 * unit + 40 + (1 - eOut(np)) * 12, y = rowY(3) + 24;
    ctx.save(); ctx.globalAlpha *= np; ctx.fillStyle = INK; ctx.fillRect(x - 20, rowY(3), 2, rowY(5) + bh - rowY(3));
    F(22, 400, SANS, 0); ctx.textAlign = 'left'; ctx.fillStyle = ACC; ctx.fillText('On average, lane streets', x, y);
    F(22, 700, SANS, 0); ctx.fillText('carry 3.1 times the riders', x, y + 30); ctx.restore(); }
  source(PX0, oy + 985, seg(t, b + 0.4, b + 0.9), 'Illustrative data. Streets matched for length and traffic volume.');
}

// ── scene 3: small multiples by season ─────────────────────────────────────
function scene3(t, oy) {
  ctx.textBaseline = 'alphabetic';
  const b = T.sc2b - 0.45;
  kicker('BY SEASON', PX0, oy + 150, seg(t, b, b + 0.55));
  headline('The gain holds ', 'in every season', '', PX0, oy + 232, seg(t, b + 0.1, b + 0.75), seg(t, b + 0.7, b + 1.1));
  sub('Cyclists per day, year before vs. year after the lane opened', PX0, oy + 292, seg(t, b + 0.25, b + 0.85));
  const pw = 350, gp = 60, ph = 300, y0 = oy + 520, base = y0 + ph;
  SEASONS.forEach((s, i) => { const x0 = PX0 + i * (pw + gp), st = T.pan + i * 0.12, p = seg(t, st, st + 0.35); if (p <= 0) return;
    const e = eOut(p), SX = j => x0 + j / 12 * pw, SY = v => base - v / SMAX * ph;
    // panel frame: baseline + faint gridlines (shared scale across panels)
    ctx.fillStyle = rgba(GRID, e); for (let g = 1; g <= 4; g++) ctx.fillRect(x0, SY(g * 1000) - 0.5, pw * e, 1);
    ctx.fillStyle = INK; ctx.fillRect(x0, base - 1, pw * e, 2);
    if (i === 0) { F(16, 400, SANS, 0); ctx.fillStyle = rgba(MUTED, e); ctx.textAlign = 'left'; ctx.fillText('4,000', x0, SY(4000) - 10); ctx.fillText('2,000', x0, SY(2000) - 8); }
    F(26, 700, SANS, 0); ctx.fillStyle = rgba(INK, e); ctx.textAlign = 'left'; ctx.fillText(s.lab, x0, y0 - 128 + (1 - e) * 10);
    // lines draw left to right, "before" slightly ahead of "after"
    const lp = eIO(seg(t, st + 0.12, st + 0.62)), la = eIO(seg(t, st + 0.2, st + 0.7));
    const path = (D, q, col, lw) => { if (q <= 0) return; const n = q * 12; ctx.beginPath(); ctx.moveTo(SX(0), SY(D[0]));
      for (let j = 1; j <= Math.floor(n); j++) ctx.lineTo(SX(j), SY(D[j]));
      const f = n - Math.floor(n); if (f > 0 && n < 12) { const j = Math.floor(n); ctx.lineTo(SX(j + f), SY(lerp(D[j], D[j + 1], f))); }
      ctx.lineWidth = lw; ctx.strokeStyle = col; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); };
    path(s.b, lp, GREY, 3); path(s.a, la, ACC, 4.5);
    if (i === 0) { const lb = seg(t, st + 0.6, st + 0.9); F(18, 700, SANS, 0); ctx.textAlign = 'right';
      ctx.fillStyle = rgba(DARK, lb); ctx.fillText('Before', SX(12), SY(s.b[12]) + 28);
      ctx.fillStyle = rgba(ACC, lb); ctx.fillText('After', SX(12), SY(s.a[12]) - 16); }
    // counting percentage with a small overshoot pop
    const cp = seg(t, st + 0.3, st + 0.8);
    if (cp > 0) { const sc = 0.6 + 0.4 * eBack(cp); ctx.save(); ctx.translate(x0, y0 - 50); ctx.scale(sc, sc); ctx.globalAlpha *= clamp(cp * 3);
      F(52, 800, SANS, -1.5); ctx.fillStyle = ACC; ctx.textAlign = 'left'; const n = Math.round(s.pct * eOut(cp)); const w = numText('+' + n, 0, 0); ctx.fillText('%', w + 2, 0); ctx.restore(); }
  });
  source(PX0, oy + 985, seg(t, b + 0.4, b + 0.9), 'Illustrative data. Daily averages by week within each season.');
}

// ── closing: key takeaway, with the opening line chart echoed as a sparkline ─────
function takeaway(t) {
  const p = seg(t, T.end, T.end + 0.5); if (p <= 0) return;
  ctx.textBaseline = 'alphabetic'; const x = PX0;
  kicker('THE TAKEAWAY', x, 400, p);
  F(92, 600, SERIF, -1.2); ctx.fillStyle = INK; ctx.textAlign = 'left';
  riseText('Protect the lane,', x, 512, seg(t, T.end + 0.05, T.end + 0.6), 104);
  const p2 = seg(t, T.end + 0.15, T.end + 0.7); const pre = 'and cycling ', w1 = ctx.measureText(pre).width, w2 = ctx.measureText('triples').width;
  const u = eOut(seg(t, T.end + 0.6, T.end + 0.9)); if (u > 0) { ctx.fillStyle = ACC; ctx.fillRect(x + w1 + 2, 640, (w2 - 2) * u, 5); }
