<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── comic book · "CAPTAIN CLARITY vs. THE RUNAWAY ROBOT" ────────────────────
// Newsprint page inks in → camera enters panel 1: a robot vacuum runs amok in the museum (VROOM! BONK!)
// → panel 2: Captain Clarity swoops over the city (WHOOSH!) → panel 3: the robot leaps, POW! on her palm,
// its eyes turn happy and it sweeps the dust away → pull back to the whole page, "THE END?" + a second robot peeks → fade.
// Colors are printed with Ben-Day dots (CMY + ink), the color pattern is slightly offset from the line (print shift).
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ── math ──
const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
const lerp = (from, to, k) => from + (to - from) * k;
const seg = (t, start, end) => clamp((t - start) / (end - start));
const eInOut = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(2 - 2 * k, 3) / 2);
const eOut = k => 1 - Math.pow(1 - k, 3);
// overshooting ease; 0 until the animation starts so callers can skip drawing
const eBack = (k, over = 2.2) => {
  if (k <= 0) return 0;
  const d = k - 1;
  return 1 + (over + 1) * Math.pow(d, 3) + over * Math.pow(d, 2);
};
// seeded generator in [0, 1): the public-domain mulberry32 algorithm
function rng(seed) {
  let state = seed;
  return () => {
    state = (state | 0) + 0x6D2B79F5 | 0;
    let z = Math.imul(state ^ state >>> 15, 1 | state);
    z = z + Math.imul(z ^ z >>> 7, 61 | z) ^ z;
    return ((z ^ z >>> 14) >>> 0) / 4294967296;
  };
}
function mk(w, h) { const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h; return canvas; }

// ── the printed page ──
const INK = '#1b1716', PAPER = '#efe2c0', CY = '#2f9fd8', MG = '#e0393e', YE = '#f5c928', CR = '#fbf6e6';
const MIS = [5, -4];                              // colour plate offset from the ink plate (page units)
const PW = 3050, PH = 2130;                       // page size
const PAN = {                                     // panel boxes [x, y, w, h]
  P1: [100, 340, 1350, 740],
  P2: [1500, 340, 1350, 740],
  P3: [100, 1130, 1900, 800],
  P4: [2050, 1130, 800, 800],
};
let PAPERC;                                       // newsprint texture, built in window.ready
const HAND = '"Patrick Hand"', BANG = 'Bangers';

// ── Ben-Day printing ──
// A screen tile is one dot in the middle plus quarter dots in the corners, so the repeat forms a diagonal grid;
// the pattern is rotated to its screen angle. Tiles are cached per colour/size/angle.
const SCREENS = {};
function pat(x, col, r, cell = 18, ang = 15) {
  const id = [col, r, cell, ang].join('|');
  if (!(id in SCREENS)) {
    const tile = mk(cell, cell), g = tile.getContext('2d');
    const disc = (cx, cy, rad) => { g.beginPath(); g.arc(cx, cy, rad, 0, Math.PI * 2); g.fill(); };
    g.fillStyle = col;
    disc(cell / 2, cell / 2, r);
    for (const [cx, cy] of [[0, 0], [cell, 0], [0, cell], [cell, cell]]) disc(cx, cy, r * 0.55);
    const screen = x.createPattern(tile, 'repeat');
    screen.setTransform(new DOMMatrix().rotateSelf(ang));
    SCREENS[id] = screen;
  }
  return SCREENS[id];
}
// Overprint on the shifted colour plate: everything multiplies onto what is already there.
function onColourPlate(x, paint) {
  x.save(); x.translate(MIS[0], MIS[1]); x.globalCompositeOperation = 'multiply';
  paint();
  x.restore();
}
function dots(x, pathFn, col, r, cell, ang) {      // dot screen inside a shape
  onColourPlate(x, () => { x.fillStyle = pat(x, col, r, cell, ang); pathFn(x); x.fill(); });
}
function flat(x, pathFn, col) {                    // solid tint inside a shape
  onColourPlate(x, () => { x.fillStyle = col; pathFn(x); x.fill(); });
}
// Dot screen whose dot radius varies across the box (rFn(px, py) gives it), on a grid rotated by `ang`.
function halftoneGrad(x, bx, by, bw, bh, col, rFn, cell = 20, ang = 0.26) {
  onColourPlate(x, () => {
    x.fillStyle = col; x.beginPath();
    const cos = Math.cos(ang), sin = Math.sin(ang), mx = bx + bw / 2, my = by + bh / 2, reach = Math.hypot(bw, bh) / 2 + cell;
    for (let v = -reach; v < reach; v += cell) {
      for (let u = -reach; u < reach; u += cell) {
        const px = mx + u * cos - v * sin, py = my + u * sin + v * cos;
        const outside = px < bx - cell || px > bx + bw + cell || py < by - cell || py > by + bh + cell;
        if (outside) continue;
        const r = rFn(px, py);
        if (r < 0.6) continue;
        x.moveTo(px + r, py); x.arc(px, py, r, 0, Math.PI * 2);
      }
    }
    x.fill();
  });
}
const rectP = (bx, by, bw, bh) => x => { x.beginPath(); x.rect(bx, by, bw, bh); };
// print colors: [dot color, dot radius, cell, screen angle, flat tint or null]
const C_SUIT = [CY, 5.6, 12, 15, 'rgba(47,159,216,0.30)'], C_RED = [MG, 5.8, 12, 75, 'rgba(224,57,62,0.45)'],
  C_GOLD = [YE, 5.8, 12, 45, 'rgba(245,201,40,0.55)'], C_SKIN = [MG, 1.9, 8, 75, 'rgba(240,160,130,0.18)'], C_HAIR = [INK, 0, 0, 0, INK];
function part(x, pathFn, c, lw = 6) { // paper-white base, offset color, then ink outline
  x.fillStyle = CR; pathFn(x); x.fill();
  if (c) { if (c[1]) dots(x, pathFn, c[0], c[1], c[2], c[3]); if (c[4]) flat(x, pathFn, c[4]); }
  pathFn(x); inkStroke(x, lw);
}

// ── geometry helpers ──
function spline(x, P, closed = true, cont = false) { // Catmull-Rom through points
  const n = P.length, g = i => closed ? P[(i + n) % n] : P[clamp(i, 0, n - 1)];
  cont ? x.lineTo(P[0][0], P[0][1]) : x.moveTo(P[0][0], P[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    x.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (closed) x.closePath();
}
const sp = P => x => { x.beginPath(); spline(x, P); };
function capsule(a, b, ra, rb) { // tapered capsule between two joints
  return x => {
    const th = Math.atan2(b[1] - a[1], b[0] - a[0]), d = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-3;
    const ph = Math.asin(clamp((ra - rb) / d, -0.95, 0.95));
    x.beginPath(); x.arc(a[0], a[1], ra, th + Math.PI / 2 - ph, th + 3 * Math.PI / 2 + ph);
    x.arc(b[0], b[1], rb, th - Math.PI / 2 + ph, th + Math.PI / 2 - ph); x.closePath();
  };
}
function tube(P, R) { // smooth tube with varying radius and round caps
  return x => {
    const n = P.length, L = [], Rt = [], ang = [];
    for (let i = 0; i < n; i++) {
      const a = P[Math.max(i - 1, 0)], b = P[Math.min(i + 1, n - 1)], th = Math.atan2(b[1] - a[1], b[0] - a[0]); ang.push(th);
      L.push([P[i][0] - Math.sin(th) * R[i], P[i][1] + Math.cos(th) * R[i]]); Rt.push([P[i][0] + Math.sin(th) * R[i], P[i][1] - Math.cos(th) * R[i]]);
    }
    x.beginPath(); spline(x, L, false);
    x.arc(P[n - 1][0], P[n - 1][1], R[n - 1], ang[n - 1] + Math.PI / 2, ang[n - 1] - Math.PI / 2, true);
    spline(x, Rt.reverse(), false, true);
    x.arc(P[0][0], P[0][1], R[0], ang[0] - Math.PI / 2, ang[0] + Math.PI / 2, true); x.closePath();
  };
}
const mix = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];

// ── drawing elements ──
// ── lettering and page furniture ──
function inkStroke(x, w = 9) {
  x.strokeStyle = INK; x.lineWidth = w; x.lineJoin = 'round'; x.lineCap = 'round';
  x.stroke();
}
// Centred lines of hand lettering around the origin (balloon interiors).
function letterLines(x, lines, size, weight = 400) {
  x.fillStyle = INK; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `${weight} ${size}px ${HAND}`;
  const mid = (lines.length - 1) / 2;
  lines.forEach((line, i) => x.fillText(line, 0, (i - mid) * size * 1.02 + 4));
}
// Speech balloon that pops in (prog 0..1). tail = [tipX, tipY, startAngle, endAngle] relative to the centre.
function balloon(x, cx, cy, rw, rh, tail, lines, size, prog, opt = {}) {
  const pop = eBack(prog, 2.4);
  if (pop <= 0) return;
  x.save(); x.translate(cx, cy); x.scale(pop, pop);
  const rim = (ang, k) => [Math.cos(ang) * rw * k, Math.sin(ang) * rh * k];
  const outline = () => {
    x.beginPath(); x.ellipse(0, 0, rw, rh, 0, 0, Math.PI * 2);
    if (!tail) return;
    const [tx, ty, from, to] = tail;
    x.moveTo(...rim(from, 0.98)); x.quadraticCurveTo(tx * 0.45, ty * 0.6, tx, ty); x.lineTo(...rim(to, 0.98));
  };
  x.fillStyle = CR; outline(); x.fill();
  outline(); inkStroke(x, 8);
  x.fillStyle = CR; x.beginPath(); x.ellipse(0, 0, rw - 5, rh - 5, 0, 0, Math.PI * 2); x.fill();   // cover the line where the tail joins
  letterLines(x, lines, size, opt.w ?? 400);
  x.restore();
}
function zapBalloon(x, cx, cy, rw, rh, tail, lines, size, prog) { // electric (robot) balloon: zigzag edge + lightning tail
  const s = eBack(prog, 2.4); if (s <= 0) return;
  x.save(); x.translate(cx, cy); x.scale(s, s);
  const edge = k => { const P = []; for (let i = 0; i < 30; i++) { const a = i / 30 * Math.PI * 2, r = (i % 2 ? 0.9 : 1.05) * k; P.push([Math.cos(a) * rw * r, Math.sin(a) * rh * r]); } return P; };
  const [tx, ty] = tail, ta = Math.atan2(ty / rh, tx / rw), nx = -Math.sin(ta), ny = Math.cos(ta);
  const b0 = [Math.cos(ta - 0.3) * rw * 0.9, Math.sin(ta - 0.3) * rh * 0.9], b1 = [Math.cos(ta + 0.3) * rw * 0.9, Math.sin(ta + 0.3) * rh * 0.9];
  const m = mix(b0, [tx, ty], 0.5), m2 = mix(b1, [tx, ty], 0.5);
  const path = () => {
    x.beginPath(); edge(1).forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath();
    x.moveTo(b0[0], b0[1]); x.lineTo(m[0] - nx * 22, m[1] - ny * 22); x.lineTo(m[0] + nx * 10, m[1] + ny * 10); x.lineTo(tx, ty);
    x.lineTo(m2[0] + nx * 26, m2[1] + ny * 26); x.lineTo(b1[0], b1[1]); x.closePath();
  };
  x.fillStyle = CR; path(); x.fill(); path(); inkStroke(x, 7);
  x.fillStyle = CR; x.beginPath(); edge(0.93).forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.closePath(); x.fill();
  letterLines(x, lines, size);
  x.restore();
}
// Yellow caption box that unrolls downward; width fits the text unless `w` is given.
function caption(x, bx, by, text, size, prog, w) {
  if (prog <= 0) return;
  x.save();
  x.font = `400 ${size}px ${HAND}`;
  const boxW = w ?? x.measureText(text).width + 60, boxH = size + 36, box = rectP(0, 0, boxW, boxH);
  x.translate(bx, by); x.scale(1, eOut(prog));
  x.fillStyle = CR; x.fillRect(0, 0, boxW, boxH);
  dots(x, box, YE, 8.5, 16, 45);
  flat(x, box, 'rgba(245,201,40,0.35)');
  box(x); inkStroke(x, 7);
  x.fillStyle = INK; x.textBaseline = 'middle'; x.fillText(text, 30, boxH / 2 + 3);
  x.restore();
}
// Speed lines: n thin ink wedges radiating from (cx, cy), starting r0..r0+90 out, clipped to the panel.
function actionLines(x, cx, cy, r0, n, seed, bx, by, bw, bh) {
  const rand = rng(seed);
  const at = (ang, dist) => [cx + Math.cos(ang) * dist, cy + Math.sin(ang) * dist];
  x.save();
  x.beginPath(); x.rect(bx, by, bw, bh); x.clip();
  x.fillStyle = INK;
  for (let i = 0; i < n; i++) {
    const ang = i / n * Math.PI * 2 + rand() * 0.05, half = 0.008 + rand() * 0.012, start = r0 + rand() * 90;
    x.beginPath(); x.moveTo(...at(ang, start)); x.lineTo(...at(ang - half, 2600)); x.lineTo(...at(ang + half, 2600));
    x.closePath(); x.fill();
  }
  x.restore();
}
// Jagged explosion outline with n spikes (wider than tall), as a path ready to fill or stroke.
function burstPath(x, cx, cy, R, n, seed, jit = 0) {
  const rand = rng(seed), corners = n * 2;
  x.beginPath();
  for (let i = 0; i < corners; i++) {
    const ang = i / corners * Math.PI * 2 + (rand() - 0.5) * 0.12;
    const radius = (i % 2 ? R * (0.62 + rand() * 0.08) : R * (0.95 + rand() * 0.2)) + jit * (rand() - 0.5);
    const px = cx + Math.cos(ang) * radius * 1.25, py = cy + Math.sin(ang) * radius;
    if (i) x.lineTo(px, py); else x.moveTo(px, py);
  }
  x.closePath();
}
// Sound-effect lettering: letters pop in one after another, each tilted, outlined and with a stacked block shadow.
function sfx(x, text, cx, cy, size, rot, prog, fill, shadow = INK) {
  if (prog <= 0) return;
  x.save();
  x.translate(cx, cy); x.rotate(rot);
  x.font = `400 ${size}px ${BANG}`; x.textBaseline = 'middle'; x.letterSpacing = `${size * 0.04}px`;
  const letters = [...text], total = x.measureText(text).width, stagger = 0.18;
  let before = '';
  letters.forEach((ch, i) => {
    const offset = x.measureText(before).width;
    before += ch;
    const u = clamp(prog * (1 + (letters.length - 1) * stagger) - i * stagger);
    if (u <= 0) return;
    const pop = eBack(u, 2.6), cw = x.measureText(ch).width, odd = i % 2 === 1;
    x.save();
    x.translate(-total / 2 + offset + cw / 2, (odd ? -1 : 1) * size * 0.04);
    x.scale(pop, pop); x.rotate(odd ? 0.06 : -0.05);
    x.lineJoin = 'round';
    for (let depth = 10; depth >= 1; depth -= 1.5) { x.fillStyle = shadow; x.fillText(ch, -cw / 2 + depth, depth); }
    x.strokeStyle = INK; x.lineWidth = size * 0.1; x.strokeText(ch, -cw / 2, 0);
    x.fillStyle = fill; x.fillText(ch, -cw / 2, 0);
    x.restore();
  });
  x.restore();
}
// Panel border inked clockwise from the top-left corner; prog 0..1 is how much of the perimeter is done.
function panelFrame(x, [bx, by, bw, bh], prog) {
  if (prog <= 0) return false;
  const target = 2 * (bw + bh) * eOut(prog);
  let done = 0, [px, py] = [bx, by];
  x.save();
  x.beginPath(); x.moveTo(px, py);
  for (const [qx, qy] of [[bx + bw, by], [bx + bw, by + bh], [bx, by + bh], [bx, by]]) {
    const side = Math.hypot(qx - px, qy - py);
    if (done + side > target) { const f = (target - done) / side; x.lineTo(px + (qx - px) * f, py + (qy - py) * f); break; }
    x.lineTo(qx, qy); done += side; px = qx; py = qy;
  }
  inkStroke(x, 10);
  x.restore();
  return true;
}
function star(x, cx, cy, s, rot, col = YE) {
  if (s <= 0) return;
  x.save(); x.translate(cx, cy); x.rotate(rot); x.beginPath();
  for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4, r = j % 2 ? s * 0.3 : s; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  x.closePath(); x.fillStyle = col; x.fill(); inkStroke(x, 4); x.restore();
}

// ── Captain Clarity: jointed figure in profile, facing right ──
// head outlines in head-radius units, facing +x
const FACE = [[-0.2, -0.98], [0.45, -0.86], [0.8, -0.47], [0.9, -0.12], [0.94, 0.08], [1.13, 0.33], [0.94, 0.43], [0.98, 0.56], [0.9, 0.64], [0.95, 0.73], [0.8, 0.94], [0.42, 1.02], [0.02, 0.88], [-0.55, 0.55], [-0.92, 0.0], [-0.76, -0.66]];
const HAIR = [[0.8, -0.5], [0.5, -0.6], [0.12, -0.46], [-0.18, -0.12], [-0.3, 0.38], [-0.58, 0.8], [-0.97, 0.62], [-1.1, 0.0], [-0.97, -0.62], [-0.5, -1.05], [0.15, -1.12], [0.62, -0.94]];
const MASK = [[0.24, -0.34], [0.6, -0.42], [0.93, -0.32], [0.97, -0.06], [0.62, 0.03], [0.28, 0.0]];
function head(x, c, R, rot, tail) {
  // no ctx.scale here: the print offset and dot size must stay in page units
  x.save(); x.translate(c[0], c[1]); x.rotate(rot);
  const S = P => P.map(([a, b]) => [a * R, b * R]), E = (ex, ey, rx, ry, a) => xx => { xx.beginPath(); xx.ellipse(ex * R, ey * R, rx * R, ry * R, a, 0, Math.PI * 2); };
  part(x, tube(S(tail), [0.26, 0.3, 0.27, 0.18, 0.05].map(v => v * R)), C_HAIR, 5); // ponytail
  part(x, sp(S(FACE)), C_SKIN, 6);
  part(x, E(-0.02, 0.3, 0.14, 0.21, 0.2), C_SKIN, 4.5); // ear
  part(x, sp(S(HAIR)), C_HAIR, 6);
  x.save(); x.beginPath(); spline(x, S(HAIR)); x.clip(); x.strokeStyle = CY; x.lineWidth = 0.09 * R; x.lineCap = 'round'; // blue-black hair shine
  [[-0.7, -0.5, -0.1, -0.85, 0.35, -0.78], [-0.85, 0.05, -0.55, -0.35, -0.2, -0.45]].forEach(q => { x.beginPath(); x.moveTo(q[0] * R, q[1] * R); x.quadraticCurveTo(q[2] * R, q[3] * R, q[4] * R, q[5] * R); x.stroke(); });
  x.restore();
  part(x, E(-0.84, -0.3, 0.13, 0.2, 0.3), C_GOLD, 4); // hair tie
  part(x, sp(S(MASK)), C_RED, 5);
  x.fillStyle = CR; x.beginPath(); spline(x, S([[0.5, -0.17], [0.68, -0.26], [0.84, -0.17], [0.68, -0.1]])); x.fill(); inkStroke(x, 3.5);
  x.fillStyle = INK; x.beginPath(); x.arc(0.74 * R, -0.17 * R, 0.065 * R, 0, Math.PI * 2); x.fill();
  x.beginPath(); x.moveTo(0.45 * R, -0.5 * R); x.quadraticCurveTo(0.7 * R, -0.62 * R, 0.9 * R, -0.5 * R); inkStroke(x, 5); // brow
  x.beginPath(); x.moveTo(0.76 * R, 0.64 * R); x.lineTo(0.9 * R, 0.63 * R); x.strokeStyle = MG; x.lineWidth = 6; x.stroke(); // mouth
  x.beginPath(); x.moveTo(0.72 * R, 0.645 * R); x.lineTo(0.88 * R, 0.645 * R); inkStroke(x, 2.5);
  x.restore();
}
function glove(x, w, ang, s, open) { // gloved hand at wrist w, fingers pointing along ang
  x.save(); x.translate(w[0], w[1]); x.rotate(ang); x.scale(s, s);
  part(x, x => { x.beginPath(); x.moveTo(-30, -13); x.lineTo(2, -19); x.lineTo(2, 19); x.lineTo(-30, 13); x.closePath(); }, C_GOLD, 5); // cuff
  if (open) {
    const F = [[-12, 30, -0.08], [-4, 35, -0.02], [4.5, 33, 0.04], [12.5, 27, 0.1]];
    F.forEach(([y, l, a]) => part(x, capsule([26, y], [26 + Math.cos(a) * l, y + Math.sin(a) * l], 5.2, 4.4), C_GOLD, 4.5));
    part(x, x => { x.beginPath(); x.roundRect(-2, -17, 34, 34, 9); }, C_GOLD, 5);
    part(x, capsule([10, -14], [28, -34], 6, 4.8), C_GOLD, 4.5); // thumb
  } else {
    part(x, x => { x.beginPath(); x.roundRect(-2, -18, 38, 36, 12); }, C_GOLD, 5);
    x.beginPath(); [-6, 5].forEach(y => { x.moveTo(22, y); x.lineTo(35, y); }); inkStroke(x, 3.5);
    part(x, capsule([4, -16], [22, -12], 6.5, 5.5), C_GOLD, 4); // thumb over fingers
  }
  x.restore();
}
function boot(x, knee, ank, toe) {
  const m = mix(knee, ank, 0.45), th = Math.atan2(ank[1] - knee[1], ank[0] - knee[0]);
  part(x, capsule(m, ank, 20, 14), C_RED, 6);
  part(x, capsule(ank, toe, 14.5, 10), C_RED, 6);
  x.beginPath(); x.moveTo(m[0] - Math.sin(th) * 21, m[1] + Math.cos(th) * 21); x.lineTo(m[0] + Math.sin(th) * 21, m[1] - Math.cos(th) * 21); inkStroke(x, 6);
}
function arm(x, S, E, Wr, hang, open) {
  part(x, tube([S, E, Wr], [17.5, 13.5, 10.5]), C_SUIT, 6);
  glove(x, Wr, hang, 1, open);
}
function hero(x, P) {
  // P: joints in local units (head radius 36). Order: cape, back arm, back leg, torso, front leg, neck, head, front arm.
  part(x, sp(P.cape), C_RED, 6);

  const push = k > 0 ? -10 * Math.exp(-k * 8) * Math.cos(k * 25) : 0;
  x.save(); x.translate(bx + 330 + push, gy); x.scale(1.06, 1.06); hero(x, standPose(lt, seg(lt, 5.4, 5.7))); x.restore();
  // robot: charges, leaps, POW, bounces back, calms, sweeps
  let rx, ry, tilt = 0, sq = 1, lift = false;
  const Xc = bx + 1060, Xi = bx + 700, Yi = by + 330, Xl = bx + 930;
  if (lt < 5.62) { const u = seg(lt, 5.3, 5.62); rx = lerp(bx + bw + 240, Xc, u); ry = gy; tilt = 0.05; }
  else if (lt < T0) { const u = seg(lt, 5.62, T0); rx = lerp(Xc, Xi, u); ry = lerp(gy, Yi, u) - Math.sin(u * Math.PI) * 60; tilt = -0.5 * u; lift = true; sq = 1 + 0.12 * u; }
  else if (lt < 6.2) { const u = seg(lt, T0, 6.2); rx = lerp(Xi, Xl, u); ry = lerp(Yi, gy, u * u) - Math.sin(u * Math.PI) * 50; tilt = lerp(-0.5, 0.25, u) + Math.sin(u * 14) * 0.1; sq = 1 - 0.25 * Math.exp(-u * 6); lift = true; }
  else { const u = seg(lt, 6.2, 6.45); rx = sw > 0 ? rxSweep : Xl; ry = gy; sq = 1 - 0.25 * Math.exp(-u * 5) * Math.cos(u * 18); tilt = sw > 0 ? Math.sin(lt * 12) * 0.03 : 0.25 * Math.exp(-u * 5) * Math.cos(u * 14); }
  const mood = seg(lt, 6.3, 6.42);
  if (lift) dots(x, xx => { xx.beginPath(); xx.ellipse(rx, gy + 4, 110, 32, 0, 0, Math.PI * 2); }, INK, 3.4, 12, 45);
  robot(x, rx, ry, 0.8, { mood, tilt, squash: sq, brush: lt * (sw > 0 && sw < 1 ? 28 : 6), ant: mood < 1 ? Math.sin(lt * 26) * 0.6 : Math.sin(lt * 6) * 0.3, noShadow: lift });
  // dizzy stars after landing
  if (lt > 6.1 && lt < 6.45) for (let i = 0; i < 3; i++) { const a = lt * 9 + i * 2.1; star(x, rx + Math.cos(a) * 90, gy - 205 + Math.sin(a) * 20, 18, a); }
  sfx(x, 'POW!', cx + 10, cy + 14, 210, -0.08, seg(lt, T0 + 0.03, T0 + 0.4), YE);
  caption(x, bx + 1180, by + 34, 'ONE GENTLE "POW!" LATER...', 46, seg(lt, 6.3, 6.55));
  balloon(x, bx + 1620, by + 390, 210, 86, [-150, 150, 2.0, 2.45], ['BEEP BOOP!', 'ALL CLEAN!'], 50, seg(lt, 7.0, 7.3));
  x.restore();
}
function panel4(x, t) {
  const [bx, by, bw, bh] = PAN.P4;
  x.save(); x.beginPath(); x.rect(bx, by, bw, bh); x.clip();
  x.fillStyle = CR; x.fillRect(bx, by, bw, bh);
  dots(x, rectP(bx, by, bw, bh), MG, 7.6, 18, 75);
  actionLines(x, bx + bw / 2, by + 330, 240, 40, 31, bx, by, bw, bh);
  sfx(x, 'THE', bx + bw / 2, by + 220, 190, -0.05, seg(t, 8.0, 8.3), YE);
  sfx(x, 'END?', bx + bw / 2 + 10, by + 420, 220, -0.05, seg(t, 8.12, 8.45), YE);
  // ...a second robot peeks in from the bottom edge
  const u = seg(t, 8.45, 8.75), blink = t > 8.9 && Math.abs(Math.sin((t - 8.8) * 5)) < 0.12;
  if (u > 0) robot(x, bx + 600, by + bh + 150 - 200 * eBack(u, 1.8), 0.95, { mood: blink ? 0.5 : 0, tilt: -0.12, ant: Math.sin(t * 8) * 0.4, noShadow: true });
  x.restore();
}
// Title strip across the top of the page.
function masthead(x, t) {
  sfx(x, 'CAPTAIN CLARITY', 800, 180, 180, -0.02, seg(t, 0.15, 0.6), MG);
  x.save();
  x.globalAlpha = seg(t, 0.4, 0.7);
  sfx(x, 'VS. THE RUNAWAY ROBOT!', 1860, 196, 84, -0.02, 1, CY);
  x.fillStyle = INK; x.font = `400 44px ${HAND}`; x.textBaseline = 'middle'; x.textAlign = 'right';
  x.fillText('ISSUE No. 16 · 10¢', 2850, 205);
  for (const [y, w] of [[290, 5], [302, 2]]) { x.beginPath(); x.moveTo(100, y); x.lineTo(2850, y); inkStroke(x, w); }   // double rule
  x.restore();
}
// Panels fade in one after another, each followed by its border being inked: [box, painter, start time].
const PANEL_ORDER = [['P1', panel1, 0.3], ['P2', panel2, 0.4], ['P3', panel3, 0.5], ['P4', panel4, 0.6]];
function drawPage(x, t) {
  x.save();
  x.shadowColor = 'rgba(0,0,0,0.55)'; x.shadowBlur = 60; x.shadowOffsetY = 20;   // page lifted off the desk
  x.fillStyle = PAPER; x.fillRect(0, 0, PW, PH);
  x.restore();
  x.drawImage(PAPERC, 0, 0, PW, PH);
  masthead(x, t);
  for (const [box, paint, start] of PANEL_ORDER) {
    const u = seg(t, start, start + 0.45);
    if (u <= 0) continue;
    x.save(); x.globalAlpha = clamp(u * 2.5); paint(x, t); x.restore();
    panelFrame(x, PAN[box], u);
  }
  x.save();                                       // newsprint texture over the ink, which also knocks it back a little
  x.globalCompositeOperation = 'multiply'; x.globalAlpha = 0.55; x.drawImage(PAPERC, 0, 0, PW, PH);
  x.restore();
}

// ── camera ──
// Keyframes [time, [page x, page y, zoom]]. Even-numbered intervals are holds (linear drift),
// odd ones are moves (eased); zoom is interpolated in log space so it feels even.
const FULL = [1475, 1030, 0.52];
const KEYS = [
  // holds stay still (static newsprint dots compress far better); only the closing hold drifts
  [0, FULL], [0.95, FULL], [1.4, [775, 710, 1.32]], [3.1, [775, 710, 1.32]], [3.55, [2175, 710, 1.32]], [5.0, [2175, 710, 1.32]],
  [5.45, [1050, 1530, 0.99]], [7.65, [1050, 1530, 0.99]], [8.2, [1475, 1030, 0.53]], [10, [1475, 1030, 0.545]]
];
function cam(t) {
  const i = KEYS.findIndex(([start], k) => k < KEYS.length - 1 && t >= start && t <= KEYS[k + 1][0]);
  if (i < 0) return KEYS[KEYS.length - 1][1];
  const [start, from] = KEYS[i], [end, to] = KEYS[i + 1];
  const k = (t - start) / (end - start), u = i % 2 === 0 ? k : eInOut(k);
  return [lerp(from[0], to[0], u), lerp(from[1], to[1], u), Math.exp(lerp(Math.log(from[2]), Math.log(to[2]), u))];
}
function renderAt(t, alpha) {
  const [cx, cy, z] = cam(t);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
  drawPage(ctx, t);
  ctx.restore();
}
// Screen-space speed of the camera over the last 1/60 s (pan in pixels plus a zoom term).
function camSpeed(t) {
  const now = cam(t), prev = cam(t - 1 / 60);
  return Math.hypot((now[0] - prev[0]) * now[2], (now[1] - prev[1]) * now[2]) + Math.abs(Math.log(now[2] / prev[2])) * 2000;
}
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#2e2622'; ctx.fillRect(0, 0, W, H);   // desk
  if (camSpeed(t) > 8) for (let j = 0; j < 3; j++) renderAt(t - j / 90, 1 / (j + 1));   // fast moves: three blended sub-frames
  else renderAt(t, 1);
  const out = seg(t, 9.5, 9.97);                  // ends on black ink
  if (out > 0) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = `rgba(20,16,14,${eInOut(out)})`; ctx.fillRect(0, 0, W, H); }
}

// Newsprint at half resolution: warm noise with faint banding, scattered fibres, darker towards the edges.
function buildPaper() {
  const w = PW / 2 | 0, h = PH / 2 | 0, sheet = mk(w, h), g = sheet.getContext('2d'), rand = rng(9);
  const img = g.createImageData(w, h), px = img.data;
  for (let row = 0, i = 0; row < h; row++) {
    for (let col = 0; col < w; col++, i += 4) {
      const n = (rand() - 0.5) * 16 + Math.sin(col * 0.05 + row * 0.002) * 2;
      px[i] = 239 + n; px[i + 1] = 226 + n; px[i + 2] = 192 + n * 1.2; px[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(150,120,70,0.10)'; g.lineWidth = 1;
  for (let n = 0; n < 900; n++) {
    const fx = rand() * w, fy = rand() * h, len = 6 + rand() * 20, ang = rand() * 6.28;
    g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + Math.cos(ang) * len, fy + Math.sin(ang) * len); g.stroke();
  }
  const edge = g.createRadialGradient(w / 2, h / 2, h * 0.3, w / 2, h / 2, w * 0.75);
  edge.addColorStop(0, 'rgba(255,250,235,0)'); edge.addColorStop(1, 'rgba(170,130,70,0.28)');
  g.fillStyle = edge; g.fillRect(0, 0, w, h);
  return sheet;
}

const GLYPHS = 'CAPTAIN CLARITY VS. THE RUNAWAY ROBOT! ISSUE No. 16 · 10¢ MEANWHILE, AT CITY MUSEUM... BZZT! BEEP! DUST DETECTED! VROOOM! BONK! WHOOSH! POW! "';
window.ready = Promise.all([BANG, HAND].map(fam => document.fonts.load(`400 100px ${fam}`, GLYPHS)))
  .then(() => document.fonts.ready)
  .then(() => { PAPERC = buildPaper(); return true; });
window.draw = ({ t }) => {
  render(t);
  const url = cv.toDataURL('image/jpeg', 0.92);
  return url.slice(url.indexOf(',') + 1);
};
window.events = () => [
  ...[0.3, 0.4, 0.5, 0.6].map(t => ({ t, k: 'paper' })),
  { t: 1.35, k: 'vroom' }, { t: 1.95, k: 'bonk' }, { t: 2.25, k: 'beep' },
  { t: 3.45, k: 'whoosh' }, { t: 4.05, k: 'boing' },
  { t: 5.3, k: 'vroom2' }, { t: 5.85, k: 'pow' }, { t: 6.2, k: 'bonk' }, { t: 6.32, k: 'boop' },
  { t: 6.5, k: 'sweep' }, { t: 6.9, k: 'sparkle' }, { t: 7.2, k: 'sparkle' }, { t: 7.0, k: 'boing' },
  { t: 8.0, k: 'ding' }, { t: 8.5, k: 'beepq' }
];
</script>
