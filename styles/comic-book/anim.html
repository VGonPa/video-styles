<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="fonts.css" rel="stylesheet">
<style>body { margin: 0; background: #000 } canvas { display: block }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Comic book: "CAPTAIN CLARITY vs. THE RUNAWAY ROBOT".
// A newsprint page inks itself in, the camera dives into each panel in turn:
//   1. a robot vacuum tears through the museum and bumps a vase (VROOOM! BONK!)
//   2. Captain Clarity flies over the city (WHOOSH!)
//   3. the robot leaps at her, POW! on her open palm, it calms down and sweeps up the dust
//   4. back out to the full page: "THE END?" while a second robot peeks in, then fade to black.
// Colour is printed as Ben-Day dot screens on a plate that sits slightly off register from the black line.
const FRAME = { w: 1920, h: 1080 };
const cv = document.getElementById('c');
cv.width = FRAME.w; cv.height = FRAME.h;
const pen = cv.getContext('2d');
const TAU = Math.PI * 2;

// ── numbers ──
const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const mixN = (a, b, u) => a + (b - a) * u;
const mixP = (p, q, u) => [mixN(p[0], q[0], u), mixN(p[1], q[1], u)];
const span = (t, t0, t1) => clamp01((t - t0) / (t1 - t0));
const easeOut = u => 1 - (1 - u) ** 3;
const easeInOut = u => (u < 0.5 ? 4 * u ** 3 : 1 - (2 - 2 * u) ** 3 / 2);
// overshoot ease; returns 0 before the start so callers can skip drawing
const backOut = (u, s = 2.2) => (u <= 0 ? 0 : 1 + (s + 1) * (u - 1) ** 3 + s * (u - 1) ** 2);
// mulberry32 (public domain), written out here; returns a generator of floats in [0, 1)
function seeded(seed) {
  let a = seed | 0;
  return function next() {
    a = (a + 0x6D2B79F5) | 0;
    let q = Math.imul(a ^ (a >>> 15), a | 1);
    q ^= q + Math.imul(q ^ (q >>> 7), q | 61);
    return ((q ^ (q >>> 14)) >>> 0) / 2 ** 32;
  };
}
const sheet = (w, h) => Object.assign(document.createElement('canvas'), { width: w, height: h });

// ── the printed page ──
const INK = '#1b1716', PAPER = '#efe2c0', CREAM = '#fbf6e6', DESK = '#2e2622';
const CYAN = '#2f9fd8', MAGENTA = '#e0393e', YELLOW = '#f5c928';
const SHIFT = [5, -4];                            // colour plate offset from the black plate, page units
const PAGE = { w: 3050, h: 2130 };
const BOX = {
  P1: { x: 100, y: 340, w: 1350, h: 740 },
  P2: { x: 1500, y: 340, w: 1350, h: 740 },
  P3: { x: 100, y: 1130, w: 1900, h: 800 },
  P4: { x: 2050, y: 1130, w: 800, h: 800 },
};
const FONT_HAND = '"Patrick Hand"', FONT_BANG = 'Bangers';
let NEWSPRINT = null;                             // paper texture, made in window.ready

// ── dot screens ──
// One tile = a centre dot plus quarter dots at the corners, so the repeat is a diagonal grid; the
// pattern is turned to the screen angle. Patterns are cached by their parameters.
const tileCache = new Map();
function screen(col, r, cell = 18, ang = 15) {
  const key = `${col}/${r}/${cell}/${ang}`;
  let pattern = tileCache.get(key);
  if (!pattern) {
    const tile = sheet(cell, cell), tg = tile.getContext('2d');
    tg.fillStyle = col;
    const spots = [[cell / 2, cell / 2, r], [0, 0, r * 0.55], [cell, 0, r * 0.55], [0, cell, r * 0.55], [cell, cell, r * 0.55]];
    for (const [sx, sy, sr] of spots) { tg.beginPath(); tg.arc(sx, sy, sr, 0, TAU); tg.fill(); }
    pattern = pen.createPattern(tile, 'repeat');
    pattern.setTransform(new DOMMatrix().rotateSelf(ang));
    tileCache.set(key, pattern);
  }
  return pattern;
}
// Anything printed on the colour plate: shifted off register and multiplied onto what is below.
function overprint(job) {
  pen.save();
  pen.globalCompositeOperation = 'multiply';
  pen.translate(SHIFT[0], SHIFT[1]);
  job();
  pen.restore();
}
const screenFill = (shape, col, r, cell, ang) => overprint(() => { pen.fillStyle = screen(col, r, cell, ang); shape(); pen.fill(); });
const tintFill = (shape, col) => overprint(() => { pen.fillStyle = col; shape(); pen.fill(); });
// Screen with a dot size that changes over an area: radiusAt(px, py) per dot, grid turned by `ang` radians.
function gradedScreen(area, col, radiusAt, cell, ang) {
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const ox = area.x + area.w / 2, oy = area.y + area.h / 2, n = Math.ceil(Math.hypot(area.w, area.h) / 2 / cell) + 1;
  overprint(() => {
    pen.fillStyle = col;
    pen.beginPath();
    for (let j = -n; j <= n; j++) {
      for (let i = -n; i <= n; i++) {
        const px = ox + (i * ux - j * uy) * cell, py = oy + (i * uy + j * ux) * cell;
        if (px < area.x - cell || py < area.y - cell || px > area.x + area.w + cell || py > area.y + area.h + cell) continue;
        const rad = radiusAt(px, py);
        if (rad >= 0.6) { pen.moveTo(px + rad, py); pen.ellipse(px, py, rad, rad, 0, 0, TAU); }
      }
    }
    pen.fill();
  });
}
const rectShape = (rx, ry, rw, rh) => () => { pen.beginPath(); pen.rect(rx, ry, rw, rh); };
const areaShape = a => rectShape(a.x, a.y, a.w, a.h);

// Print specs: dot screen (colour, radius, cell, angle) plus an optional flat tint under the dots.
const ink = (dot, r, cell, ang, tint = null) => ({ dot, r, cell, ang, tint });
const SUIT = ink(CYAN, 5.6, 12, 15, 'rgba(47,159,216,0.30)');
const RED = ink(MAGENTA, 5.8, 12, 75, 'rgba(224,57,62,0.45)');
const GOLD = ink(YELLOW, 5.8, 12, 45, 'rgba(245,201,40,0.55)');
const SKIN = ink(MAGENTA, 1.9, 8, 75, 'rgba(240,160,130,0.18)');
const SOLID = ink(INK, 0, 0, 0, INK);
function outline(w = 9) {
  pen.lineJoin = 'round'; pen.lineCap = 'round';
  pen.strokeStyle = INK; pen.lineWidth = w;
  pen.stroke();
}
// Cream base, colour plate, then the black line on top.
function printShape(shape, spec, lw = 6) {
  pen.fillStyle = CREAM; shape(); pen.fill();
  if (spec && spec.r) screenFill(shape, spec.dot, spec.r, spec.cell, spec.ang);
  if (spec && spec.tint) tintFill(shape, spec.tint);
  shape(); outline(lw);
}

// ── curves ──
// Catmull-Rom curve through pts as cubic Béziers; `joined` continues the current subpath.
function smooth(pts, closed = true, joined = false) {
  const n = pts.length;
  const at = i => (closed ? pts[((i % n) + n) % n] : pts[Math.max(0, Math.min(n - 1, i))]);
  if (joined) pen.lineTo(pts[0][0], pts[0][1]); else pen.moveTo(pts[0][0], pts[0][1]);
  const count = closed ? n : n - 1;
  for (let i = 0; i < count; i++) {
    const a = at(i - 1), b = at(i), c = at(i + 1), d = at(i + 2);
    pen.bezierCurveTo(b[0] + (c[0] - a[0]) / 6, b[1] + (c[1] - a[1]) / 6, c[0] - (d[0] - b[0]) / 6, c[1] - (d[1] - b[1]) / 6, c[0], c[1]);
  }
  if (closed) pen.closePath();
}
const blob = pts => () => { pen.beginPath(); smooth(pts); };
// Limb segment between two joints with different end radii.
function capsule(a, b, ra, rb) {
  return () => {
    const dir = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1e-3;
    const tilt = Math.asin(Math.max(-0.95, Math.min(0.95, (ra - rb) / len))), q = Math.PI / 2;
    pen.beginPath();
    pen.arc(a[0], a[1], ra, dir + q - tilt, dir + 3 * q + tilt);
    pen.arc(b[0], b[1], rb, dir - q + tilt, dir + q - tilt);
    pen.closePath();
  };
}
// Smooth tube along a spine with a radius per point and round ends.
function tube(spine, radii) {
  return () => {
    const n = spine.length, left = [], right = [], dirs = [];
    spine.forEach((p, i) => {
      const prev = spine[Math.max(0, i - 1)], next = spine[Math.min(n - 1, i + 1)];
      const d = Math.atan2(next[1] - prev[1], next[0] - prev[0]), nx = -Math.sin(d) * radii[i], ny = Math.cos(d) * radii[i];
      dirs.push(d); left.push([p[0] + nx, p[1] + ny]); right.unshift([p[0] - nx, p[1] - ny]);
    });
    const q = Math.PI / 2, head = spine[n - 1], foot = spine[0];
    pen.beginPath(); smooth(left, false);
    pen.arc(head[0], head[1], radii[n - 1], dirs[n - 1] + q, dirs[n - 1] - q, true);
    smooth(right, false, true);
    pen.arc(foot[0], foot[1], radii[0], dirs[0] - q, dirs[0] + q, true);
    pen.closePath();
  };
}

// ── lettering and page furniture ──
function handLines(lines, size) {
  pen.fillStyle = INK; pen.textAlign = 'center'; pen.textBaseline = 'middle';
  pen.font = `400 ${size}px ${FONT_HAND}`;
  const first = -(lines.length - 1) / 2;
  lines.forEach((line, i) => pen.fillText(line, 0, (first + i) * size * 1.02 + 4));
}
// Oval speech balloon that pops in. tail = [tipX, tipY, rim angle 1, rim angle 2], relative to the centre.
function speech(b, prog) {
  const s = backOut(prog, 2.4);
  if (s <= 0) return;
  const { rx, ry, tail } = b;
  const shape = () => {
    pen.beginPath(); pen.ellipse(0, 0, rx, ry, 0, 0, TAU);
    if (!tail) return;
    const [tipX, tipY, a0, a1] = tail;
    pen.moveTo(Math.cos(a0) * rx * 0.98, Math.sin(a0) * ry * 0.98);
    pen.quadraticCurveTo(tipX * 0.45, tipY * 0.6, tipX, tipY);
    pen.lineTo(Math.cos(a1) * rx * 0.98, Math.sin(a1) * ry * 0.98);
  };
  pen.save(); pen.translate(b.at[0], b.at[1]); pen.scale(s, s);
  pen.fillStyle = CREAM; shape(); pen.fill(); shape(); outline(8);
  // paint over the seam where the tail meets the oval
  pen.fillStyle = CREAM; pen.beginPath(); pen.ellipse(0, 0, rx - 5, ry - 5, 0, 0, TAU); pen.fill();
  handLines(b.lines, b.size);
  pen.restore();
}
// The robot's balloon: zigzag rim and a lightning-bolt tail pointing at [tipX, tipY].
function robotSpeech(b, prog) {
  const s = backOut(prog, 2.4);
  if (s <= 0) return;
  const { rx, ry } = b, tip = b.tail;
  const ring = k => Array.from({ length: 30 }, (_, i) => {
    const a = i * TAU / 30, f = (i % 2 ? 0.9 : 1.05) * k;
    return [Math.cos(a) * rx * f, Math.sin(a) * ry * f];
  });
  const poly = pts => pts.forEach(([px, py], i) => (i ? pen.lineTo(px, py) : pen.moveTo(px, py)));
  const aim = Math.atan2(tip[1] / ry, tip[0] / rx), nx = -Math.sin(aim), ny = Math.cos(aim);
  const rim = da => [Math.cos(aim + da) * rx * 0.9, Math.sin(aim + da) * ry * 0.9];
  const l = rim(-0.3), r = rim(0.3), ml = mixP(l, tip, 0.5), mr = mixP(r, tip, 0.5);
  const bolt = [l, [ml[0] - nx * 22, ml[1] - ny * 22], [ml[0] + nx * 10, ml[1] + ny * 10], tip, [mr[0] + nx * 26, mr[1] + ny * 26], r];
  const shape = () => { pen.beginPath(); poly(ring(1)); pen.closePath(); poly(bolt); pen.closePath(); };
  pen.save(); pen.translate(b.at[0], b.at[1]); pen.scale(s, s);
  pen.fillStyle = CREAM; shape(); pen.fill(); shape(); outline(7);
  pen.fillStyle = CREAM; pen.beginPath(); poly(ring(0.93)); pen.closePath(); pen.fill();
  handLines(b.lines, b.size);
  pen.restore();
}
// Yellow narration box, sized to its text, unrolling downwards.
function captionBox(at, text, size, prog) {
  if (!(prog > 0)) return;
  pen.save();
  pen.font = `400 ${size}px ${FONT_HAND}`;
  const w = pen.measureText(text).width + 60, h = size + 36, shape = rectShape(0, 0, w, h);
  pen.translate(at[0], at[1]); pen.scale(1, easeOut(prog));
  pen.fillStyle = CREAM; pen.fillRect(0, 0, w, h);
  screenFill(shape, YELLOW, 8.5, 16, 45);
  tintFill(shape, 'rgba(245,201,40,0.35)');
  shape(); outline(7);
  pen.fillStyle = INK; pen.textAlign = 'left'; pen.textBaseline = 'middle';
  pen.fillText(text, 30, h / 2 + 3);
  pen.restore();
}
// Radiating ink wedges around a centre, each starting a little way past r0 (the panel clip trims them).
function speedBurst([cx, cy], r0, count, seed) {
  const rnd = seeded(seed), far = 2600;
  const ray = (a, d) => [cx + Math.cos(a) * d, cy + Math.sin(a) * d];
  pen.fillStyle = INK;
  for (let n = 0; n < count; n++) {
    const a = n * TAU / count + rnd() * 0.05, half = 0.008 + rnd() * 0.012, near = r0 + rnd() * 90;
    pen.beginPath();
    for (const [px, py] of [ray(a, near), ray(a - half, far), ray(a + half, far)]) pen.lineTo(px, py);
    pen.fill();
  }
}
// Spiky explosion outline around the origin, stretched sideways.
function starburst(R, spikes, seed, jitter = 0) {
  const rnd = seeded(seed), corners = spikes * 2;
  pen.beginPath();
  for (let i = 0; i < corners; i++) {
    const a = i * TAU / corners + (rnd() - 0.5) * 0.12;
    const d = R * (i % 2 ? 0.62 + rnd() * 0.08 : 0.95 + rnd() * 0.2) + jitter * (rnd() - 0.5);
    pen.lineTo(Math.cos(a) * d * 1.25, Math.sin(a) * d);
  }
  pen.closePath();
}
// Sound effect: letters pop in one by one, rocked alternately, with an outline and a stepped drop shadow.
function boom(text, [cx, cy], size, rot, prog, fill, shadow = INK) {
  if (!(prog > 0)) return;
  const chars = Array.from(text), lag = 0.18, run = 1 + (chars.length - 1) * lag;
  pen.save();
  pen.translate(cx, cy); pen.rotate(rot);
  pen.font = `400 ${size}px ${FONT_BANG}`; pen.letterSpacing = `${size * 0.04}px`;
  pen.textAlign = 'left'; pen.textBaseline = 'middle';
  const width = pen.measureText(text).width;
  for (const [i, ch] of chars.entries()) {
    const local = clamp01(prog * run - i * lag);
    if (!(local > 0)) continue;
    const left = pen.measureText(chars.slice(0, i).join('')).width, cw = pen.measureText(ch).width;
    const odd = i % 2 === 1, s = backOut(local, 2.6);
    pen.save();
    pen.translate(left + cw / 2 - width / 2, size * (odd ? -0.04 : 0.04));
    pen.scale(s, s); pen.rotate(odd ? 0.06 : -0.05);
    pen.fillStyle = shadow;
    for (let d = 10; d >= 1; d -= 1.5) pen.fillText(ch, d - cw / 2, d);
    pen.lineJoin = 'round'; pen.lineWidth = size * 0.1; pen.strokeStyle = INK;
    pen.strokeText(ch, -cw / 2, 0);
    pen.fillStyle = fill;
    pen.fillText(ch, -cw / 2, 0);
    pen.restore();
  }
  pen.restore();
}
// Panel border inked clockwise from its top-left corner; prog is the share of the perimeter drawn.
function inkBorder(b, prog) {
  if (!(prog > 0)) return;
  const corners = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h], [b.x, b.y]];
  let left = 2 * (b.w + b.h) * easeOut(prog);
  pen.save();
  pen.beginPath(); pen.moveTo(b.x, b.y);
  for (let i = 1; i < corners.length && left > 0; i++) {
    const [ax, ay] = corners[i - 1], [bx, by] = corners[i], len = Math.hypot(bx - ax, by - ay), f = Math.min(1, left / len);
    pen.lineTo(ax + (bx - ax) * f, ay + (by - ay) * f);
    left -= len;
  }
  outline(10);
  pen.restore();
}
function sparkle(cx, cy, size, spin, col = YELLOW) {
  if (size <= 0) return;
  pen.save(); pen.translate(cx, cy); pen.rotate(spin);
  pen.beginPath();
  for (let j = 0; j < 8; j++) {
    const a = j * Math.PI / 4, d = j % 2 ? size * 0.3 : size;
    pen.lineTo(Math.cos(a) * d, Math.sin(a) * d);
  }
  pen.closePath(); pen.fillStyle = col; pen.fill(); outline(4);
  pen.restore();
}

// ── Captain Clarity, a jointed figure in profile facing right ──
// head shapes in head-radius units, facing +x
const FACE = [[-0.2, -0.98], [0.45, -0.86], [0.8, -0.47], [0.9, -0.12], [0.94, 0.08], [1.13, 0.33], [0.94, 0.43], [0.98, 0.56], [0.9, 0.64], [0.95, 0.73], [0.8, 0.94], [0.42, 1.02], [0.02, 0.88], [-0.55, 0.55], [-0.92, 0.0], [-0.76, -0.66]];
const HAIR = [[0.8, -0.5], [0.5, -0.6], [0.12, -0.46], [-0.18, -0.12], [-0.3, 0.38], [-0.58, 0.8], [-0.97, 0.62], [-1.1, 0.0], [-0.97, -0.62], [-0.5, -1.05], [0.15, -1.12], [0.62, -0.94]];
const MASK = [[0.24, -0.34], [0.6, -0.42], [0.93, -0.32], [0.97, -0.06], [0.62, 0.03], [0.28, 0.0]];
const EYE_WHITE = [[0.5, -0.17], [0.68, -0.26], [0.84, -0.17], [0.68, -0.1]];
const SHINE = [[-0.7, -0.5, -0.1, -0.85, 0.35, -0.78], [-0.85, 0.05, -0.55, -0.35, -0.2, -0.45]];   // quadratic strokes
const PONYTAIL_R = [0.26, 0.3, 0.27, 0.18, 0.05];
function heroHead([hx, hy], R, rot, tail) {
  // scaled by hand rather than with pen.scale, so the plate shift and dot size stay in page units
  const sc = pts => pts.map(([u, v]) => [u * R, v * R]);
  const oval = (u, v, ru, rv, a) => () => { pen.beginPath(); pen.ellipse(u * R, v * R, ru * R, rv * R, a, 0, TAU); };
  pen.save(); pen.translate(hx, hy); pen.rotate(rot);
  printShape(tube(sc(tail), PONYTAIL_R.map(f => f * R)), SOLID, 5);
  printShape(blob(sc(FACE)), SKIN, 6);
  printShape(oval(-0.02, 0.3, 0.14, 0.21, 0.2), SKIN, 4.5);              // ear
  const hair = blob(sc(HAIR));
  printShape(hair, SOLID, 6);
  pen.save(); hair(); pen.clip();                                        // blue highlights in the black hair
  pen.strokeStyle = CYAN; pen.lineWidth = 0.09 * R; pen.lineCap = 'round';
  for (const [a, b, c, d, e, f] of SHINE) { pen.beginPath(); pen.moveTo(a * R, b * R); pen.quadraticCurveTo(c * R, d * R, e * R, f * R); pen.stroke(); }
  pen.restore();
  printShape(oval(-0.84, -0.3, 0.13, 0.2, 0.3), GOLD, 4);                // hair tie
  printShape(blob(sc(MASK)), RED, 5);
  pen.fillStyle = CREAM; blob(sc(EYE_WHITE))(); pen.fill(); outline(3.5);
  pen.fillStyle = INK; pen.beginPath(); pen.arc(0.74 * R, -0.17 * R, 0.065 * R, 0, TAU); pen.fill();
  pen.beginPath(); pen.moveTo(0.45 * R, -0.5 * R); pen.quadraticCurveTo(0.7 * R, -0.62 * R, 0.9 * R, -0.5 * R); outline(5);   // brow
  pen.beginPath(); pen.moveTo(0.76 * R, 0.64 * R); pen.lineTo(0.9 * R, 0.63 * R);
  pen.strokeStyle = MAGENTA; pen.lineWidth = 6; pen.stroke();                                                                   // lips
  pen.beginPath(); pen.moveTo(0.72 * R, 0.645 * R); pen.lineTo(0.88 * R, 0.645 * R); outline(2.5);
  pen.restore();
}
const FINGERS = [[-12, 30, -0.08], [-4, 35, -0.02], [4.5, 33, 0.04], [12.5, 27, 0.1]];   // [base y, length, angle]
function glove(wrist, ang, open) {
  pen.save(); pen.translate(wrist[0], wrist[1]); pen.rotate(ang);
  printShape(() => { pen.beginPath(); pen.moveTo(-30, -13); pen.lineTo(2, -19); pen.lineTo(2, 19); pen.lineTo(-30, 13); pen.closePath(); }, GOLD, 5);   // cuff
  if (open) {
    for (const [y, len, a] of FINGERS) printShape(capsule([26, y], [26 + Math.cos(a) * len, y + Math.sin(a) * len], 5.2, 4.4), GOLD, 4.5);
    printShape(() => { pen.beginPath(); pen.roundRect(-2, -17, 34, 34, 9); }, GOLD, 5);
    printShape(capsule([10, -14], [28, -34], 6, 4.8), GOLD, 4.5);         // thumb
  } else {
    printShape(() => { pen.beginPath(); pen.roundRect(-2, -18, 38, 36, 12); }, GOLD, 5);
    pen.beginPath(); pen.moveTo(22, -6); pen.lineTo(35, -6); pen.moveTo(22, 5); pen.lineTo(35, 5); outline(3.5);
    printShape(capsule([4, -16], [22, -12], 6.5, 5.5), GOLD, 4);          // thumb folded over the fist
  }
  pen.restore();
}
function leg(hip, knee, ankle, toe) {
  printShape(tube([hip, knee, ankle], [28, 18.5, 12.5]), SUIT, 6);
  const top = mixP(knee, ankle, 0.45), d = Math.atan2(ankle[1] - knee[1], ankle[0] - knee[0]);
  printShape(capsule(top, ankle, 20, 14), RED, 6);
  printShape(capsule(ankle, toe, 14.5, 10), RED, 6);
  const ox = Math.sin(d) * 21, oy = Math.cos(d) * 21;
  pen.beginPath(); pen.moveTo(top[0] - ox, top[1] + oy); pen.lineTo(top[0] + ox, top[1] - oy); outline(6);   // boot top
}
function arm(shoulder, elbow, wrist, handAng, open) {
  printShape(tube([shoulder, elbow, wrist], [17.5, 13.5, 10.5]), SUIT, 6);
  glove(wrist, handAng, open);
}
// Draw order: cape, far arm, far leg, torso + belt, near leg, neck, head, near arm. Head radius 40.
function hero(p) {
  printShape(blob(p.cape), RED, 6);
  arm(p.S2, p.E2, p.W2, p.h2, false);
  leg(p.H2, p.K2, p.A2, p.T2);
  const torso = tube(p.torso, p.torsoR);
  printShape(torso, SUIT, 6);
  pen.save(); torso(); pen.clip();

  const mood = span(lt, 6.3, 6.42);
  if (airborne) screenFill(() => { pen.beginPath(); pen.ellipse(rx, groundY + 4, 110, 32, 0, 0, TAU); }, INK, 3.4, 12, 45);
  robot(rx, ry, 0.8, {
    mood, tilt, squash, shadow: !airborne,
    brush: lt * (sweep > 0 && sweep < 1 ? 28 : 6),
    antenna: mood < 1 ? 0.6 * Math.sin(lt * 26) : 0.3 * Math.sin(lt * 6),
  });
  if (lt > 6.1 && lt < 6.45) {                                                  // dizzy stars
    for (let i = 0; i < 3; i++) { const a = lt * 9 + i * 2.1; sparkle(rx + 90 * Math.cos(a), groundY - 205 + 20 * Math.sin(a), 18, a); }
  }
  boom('POW!', [ex + 10, ey + 14], 210, -0.08, span(lt, HIT + 0.03, HIT + 0.4), YELLOW);
  captionBox([ox + 1180, oy + 34], 'ONE GENTLE "POW!" LATER...', 46, span(lt, 6.3, 6.55));
  speech({ at: [ox + 1620, oy + 390], rx: 210, ry: 86, tail: [-150, 150, 2.0, 2.45], lines: ['BEEP BOOP!', 'ALL CLEAN!'], size: 50 }, span(lt, 7.0, 7.3));
}
// 4 · "THE END?" with a second robot rising into view from the bottom edge.
function finaleScene(t) {
  const { x: ox, y: oy, w: pw, h: ph } = BOX.P4, mid = ox + pw / 2;
  speedBurst([mid, oy + 330], 240, 40, 31);
  boom('THE', [mid, oy + 220], 190, -0.05, span(t, 8.0, 8.3), YELLOW);
  boom('END?', [mid + 10, oy + 420], 220, -0.05, span(t, 8.12, 8.45), YELLOW);
  const peek = span(t, 8.45, 8.75), blink = t > 8.9 && Math.abs(Math.sin((t - 8.8) * 5)) < 0.12;
  if (peek > 0) robot(ox + 600, oy + ph + 150 - 200 * backOut(peek, 1.8), 0.95, { mood: blink ? 0.5 : 0, tilt: -0.12, antenna: 0.4 * Math.sin(t * 8), shadow: false });
}
// Each panel fades in on its own paper and base screens, then its border is inked. screens: screenFill args.
const PANELS = [
  { box: BOX.P1, start: 0.3, screens: [[YELLOW, 7, 18, 45], [MAGENTA, 2.2, 18, 75]], paint: museumScene },
  { box: BOX.P2, start: 0.4, screens: [[CYAN, 6.5, 18, 15]], paint: cityScene },
  { box: BOX.P3, start: 0.5, screens: [[CYAN, 6, 18, 15]], paint: showdownScene },
  { box: BOX.P4, start: 0.6, screens: [[MAGENTA, 7.6, 18, 75]], paint: finaleScene },
];
function paintPanel(p, t) {
  const fill = areaShape(p.box);
  pen.save();
  fill(); pen.clip();
  pen.fillStyle = CREAM; fill(); pen.fill();
  for (const s of p.screens) screenFill(fill, ...s);
  p.paint(t);
  pen.restore();
}
function titleBlock(t) {
  boom('CAPTAIN CLARITY', [800, 180], 180, -0.02, span(t, 0.15, 0.6), MAGENTA);
  pen.save();
  pen.globalAlpha *= span(t, 0.4, 0.7);
  boom('VS. THE RUNAWAY ROBOT!', [1860, 196], 84, -0.02, 1, CYAN);
  pen.fillStyle = INK; pen.font = `400 44px ${FONT_HAND}`; pen.textAlign = 'right'; pen.textBaseline = 'middle';
  pen.fillText('ISSUE No. 16 · 10¢', 2850, 205);
  pen.beginPath(); pen.moveTo(100, 290); pen.lineTo(2850, 290); outline(5);   // double rule
  pen.beginPath(); pen.moveTo(100, 302); pen.lineTo(2850, 302); outline(2);
  pen.restore();
}
function page(t) {
  pen.save();                                                                   // sheet lifted off the desk
  pen.shadowColor = 'rgba(0,0,0,0.55)'; pen.shadowBlur = 60; pen.shadowOffsetY = 20;
  pen.fillStyle = PAPER; pen.fillRect(0, 0, PAGE.w, PAGE.h);
  pen.restore();
  pen.drawImage(NEWSPRINT, 0, 0, PAGE.w, PAGE.h);
  titleBlock(t);
  for (const p of PANELS) {
    const u = span(t, p.start, p.start + 0.45);
    if (u <= 0) continue;
    pen.save(); pen.globalAlpha *= clamp01(u * 2.5); paintPanel(p, t); pen.restore();
    inkBorder(p.box, u);
  }
  pen.save();                                                                   // paper texture multiplied over the ink
  pen.globalCompositeOperation = 'multiply'; pen.globalAlpha *= 0.55;
  pen.drawImage(NEWSPRINT, 0, 0, PAGE.w, PAGE.h);
  pen.restore();
}

// ── camera ──
// Stops in page coordinates (x, y, zoom). A stop marked `ease` is reached with an eased move, the others
// with a linear drift (only the final one actually moves). Zoom is blended in log space.
const WIDE = { x: 1475, y: 1030, z: 0.52 };
const MUSEUM = { x: 775, y: 710, z: 1.32 }, CITY = { x: 2175, y: 710, z: 1.32 }, SHOWDOWN = { x: 1050, y: 1530, z: 0.99 };
const STOPS = [
  { t: 0, v: WIDE }, { t: 0.95, v: WIDE },
  { t: 1.4, v: MUSEUM, ease: true }, { t: 3.1, v: MUSEUM },
  { t: 3.55, v: CITY, ease: true }, { t: 5.0, v: CITY },
  { t: 5.45, v: SHOWDOWN, ease: true }, { t: 7.65, v: SHOWDOWN },
  { t: 8.2, v: { x: 1475, y: 1030, z: 0.53 }, ease: true }, { t: 10, v: { x: 1475, y: 1030, z: 0.545 } },
];
function camera(t) {
  let i = 1;
  while (i < STOPS.length - 1 && t > STOPS[i].t) i++;
  const a = STOPS[i - 1], b = STOPS[i];
  let u = clamp01((t - a.t) / (b.t - a.t));
  if (b.ease) u = easeInOut(u);
  return { x: mixN(a.v.x, b.v.x, u), y: mixN(a.v.y, b.v.y, u), z: Math.exp(mixN(Math.log(a.v.z), Math.log(b.v.z), u)) };
}
// Every frame is a single sharp exposure: the halftone screens turn to mush under multi-exposure blur.
function compose(t) {
  const cam = camera(t);
  pen.setTransform(1, 0, 0, 1, 0, 0);
  pen.fillStyle = DESK; pen.fillRect(0, 0, FRAME.w, FRAME.h);
  pen.save();
  pen.setTransform(cam.z, 0, 0, cam.z, FRAME.w / 2 - cam.x * cam.z, FRAME.h / 2 - cam.y * cam.z);
  page(t);
  pen.restore();
  const dark = span(t, 9.5, 9.97);                                              // fade out to black ink
  if (dark > 0) { pen.fillStyle = `rgba(20,16,14,${easeInOut(dark)})`; pen.fillRect(0, 0, FRAME.w, FRAME.h); }
}

// Newsprint texture at half page size: warm per-pixel noise with a faint wave, stray fibres, darker edges.
function newsprint() {
  const w = Math.floor(PAGE.w / 2), h = Math.floor(PAGE.h / 2), out = sheet(w, h), g = out.getContext('2d'), rnd = seeded(9);
  const img = g.createImageData(w, h), d = img.data;
  let o = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++, o += 4) {
      const grain = (rnd() - 0.5) * 16 + 2 * Math.sin(0.05 * x + 0.002 * y);
      d[o] = 239 + grain; d[o + 1] = 226 + grain; d[o + 2] = 192 + 1.2 * grain; d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.lineWidth = 1; g.strokeStyle = 'rgba(150,120,70,0.10)';
  for (let n = 0; n < 900; n++) {
    const sx = rnd() * w, sy = rnd() * h, len = 6 + rnd() * 20, a = rnd() * TAU;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + len * Math.cos(a), sy + len * Math.sin(a)); g.stroke();
  }
  const vignette = g.createRadialGradient(w / 2, h / 2, 0.3 * h, w / 2, h / 2, 0.75 * w);
  vignette.addColorStop(0, 'rgba(255,250,235,0)');
  vignette.addColorStop(1, 'rgba(170,130,70,0.28)');
  g.fillStyle = vignette; g.fillRect(0, 0, w, h);
  return out;
}

const TEXT_SAMPLE = 'CAPTAIN CLARITY VS. THE RUNAWAY ROBOT! ISSUE No. 16 · 10¢ MEANWHILE, AT CITY MUSEUM... BZZT! BEEP! DUST DETECTED! VROOOM! BONK! WHOOSH! POW! ONE GENTLE LATER BOOP ALL CLEAN NOT ON MY WATCH END? "';
async function prepare() {
  const loads = [FONT_BANG, FONT_HAND].map(f => document.fonts.load(`400 100px ${f}`, TEXT_SAMPLE));
  await Promise.all([...loads, document.fonts.ready]);
  NEWSPRINT = newsprint();
  return true;
}
window.ready = prepare();
window.draw = ({ t }) => {
  compose(t);
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
// sound cues for audio.py: [time, kind]
const CUES = [
  [0.3, 'paper'], [0.4, 'paper'], [0.5, 'paper'], [0.6, 'paper'],
  [1.35, 'vroom'], [1.95, 'bonk'], [2.25, 'beep'],
  [3.45, 'whoosh'], [4.05, 'boing'],
  [5.3, 'vroom2'], [5.85, 'pow'], [6.2, 'bonk'], [6.32, 'boop'],
  [6.5, 'sweep'], [6.9, 'sparkle'], [7.2, 'sparkle'], [7.0, 'boing'],
  [8.0, 'ding'], [8.5, 'beepq'],
];
window.events = () => CUES.map(([t, k]) => ({ t, k }));
</script>
