<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* ======================================================================
 * Feature-Animation 3D: "A Little Detour".
 * A red rubber dot wakes up on a bone studio sweep, chases a runaway gold
 * star up a staircase of toy pucks that pops out of the floor, and night
 * falls on the set: a moon is lowered in, the stars light up, and the
 * gold star floats up to take its place in the sky.
 *
 * Look: physically based soft plastic (MeshPhysical: clearcoat, sheen,
 * a little subsurface rim glow), glossy cartoon eyes with lids, a three-
 * point studio rig (VSM soft key spot, cool fill, bright rim) plus a PMREM
 * softbox environment for the catchlights, blob contact shadows on a
 * seamless cyclorama.
 * Pipeline per frame:
 *   1. scene -> HDR target (half float, MSAA 4x, depth texture)
 *   2. half-res pre-pass: colour + signed circle of confusion (thin lens)
 *   3. half-res bokeh gather (golden-angle spiral, scatter-as-gather)
 *   4. bloom: bright pass + two blurred mip levels
 *   5. composite: sharp/bokeh blend, bloom, ACES fit, sRGB, vignette,
 *      fine film grain (refreshed every 4 frames), fades
 *   6. 2D overlay: the title card
 * Deterministic: every frame is a pure function of t (seeded RNG only).
 * ====================================================================== */
const W = 1920, H = 1080, DUR = 10, PI = Math.PI, TAU = 2 * PI;
const clamp01 = x => Math.min(1, Math.max(0, x)), lerp = (a, b, u) => a + (b - a) * u;
const sstep = (a, b, x) => { const u = clamp01((x - a) / (b - a)); return u * u * (3 - 2 * u); };
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = x => Math.pow(clamp01(x), 3);
const easeInOut = x => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// damped oscillation that starts at 0 (a wobble), and a spring that settles 0 -> 1 with overshoot
const wobble = (tl, k, w) => tl <= 0 ? 0 : Math.exp(-k * tl) * Math.sin(w * tl);
const springTo = (tl, k, w) => tl <= 0 ? 0 : 1 - Math.exp(-k * tl) * Math.cos(w * tl);
// keyframe track [[t, v], ...]: smoothstep between neighbours, v is a number or an array
function track(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const [t0, a] = keys[i - 1], [t1, b] = keys[i], u = sstep(t0, t1, t);
    return Array.isArray(a) ? a.map((x, k) => lerp(x, b[k], u)) : lerp(a, b, u);
  }
  return keys[keys.length - 1][1];
}
// C1 Hermite spline through timed keys (finite-difference tangents, still at both ends)
function spline(keys, t) {
  const n = keys.length;
  if (t <= keys[0][0]) return keys[0][1].slice();
  if (t >= keys[n - 1][0]) return keys[n - 1][1].slice();
  let i = 0; while (t > keys[i + 1][0]) i++;
  const [t0, p0] = keys[i], [t1, p1] = keys[i + 1], h = t1 - t0, u = (t - t0) / h;
  const tan = j => (j === 0 || j === n - 1) ? p0.map(() => 0)
    : keys[j][1].map((_, k) => (keys[j + 1][1][k] - keys[j - 1][1][k]) / (keys[j + 1][0] - keys[j - 1][0]));
  const m0 = tan(i), m1 = tan(i + 1), u2 = u * u, u3 = u2 * u;
  return p0.map((_, k) => (2 * u3 - 3 * u2 + 1) * p0[k] + (u3 - 2 * u2 + u) * h * m0[k] + (3 * u2 - 2 * u3) * p1[k] + (u3 - u2) * h * m1[k]);
}
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

/* --------------------------------------------------------------- timeline */
const WAKE = 0.6;                       // the dot opens its eyes
const DROP = 2.0, STAR_HIT = 2.4;       // a gold star falls in and hits the floor
const POPS = [2.4, 2.66, 3.06];         // the puck stacks pop out of the floor
const HOPS = [                          // the dot's hops: takeoff, landing, from/to stack (-1 = floor), extra apex
  { t0: 2.44, t1: 2.66, a: -1, b: -1, apex: 0.2 },   // startled
  { t0: 3.6, t1: 4.08, a: -1, b: 0, apex: 0.75 },
  { t0: 4.52, t1: 5.02, a: 0, b: 1, apex: 0.7 },
  { t0: 5.46, t1: 6.0, a: 1, b: 2, apex: 0.78 },
];
const BLINKS = [1.95, 4.3, 7.05];
const DUSK = 4.25, NIGHT = 6.5;          // the set goes from daylight to night
const MOON_IN = 5.2;                     // the moon is lowered in
const STARS_ON = 5.35;                   // sky stars light up, left to right
const RISE = 5.3, PARK = 7.3;            // the gold star floats up to the sky
const HAPPY = 7.75;                      // eyes close, content: back to sleep under the moon
const TITLE = 8.15, OUT = 9.3;

/* ------------------------------------------------------------ set layout */
const R = 0.5;                                        // dot radius
const DISC_H = 0.5;
const STACKS = [                                      // toy puck stacks, bottom disc first
  { x: 1.65, z: -0.35, cols: ['#f1bf4c'] },
  { x: 2.95, z: -0.75, cols: ['#78c8b4', '#ef8a6f'] },
  { x: 4.25, z: -1.15, cols: ['#8db0e8', '#b79be0', '#f1bf4c'] },
];
STACKS.forEach(s => { s.h = s.cols.length * DISC_H; });
const SKY_SPOT = [6.25, 4.15, -4.2];                  // where the gold star ends up
const MOON_POS = [7.6, 4.75, -4.9];

/* ------------------------------------------------------------- renderer */
const glc = document.createElement('canvas'); glc.width = W; glc.height = H;
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;   // the composite pass tone maps and encodes itself
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
const out = document.getElementById('c'), octx = out.getContext('2d');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W / H, 0.5, 80);

/* ------------------------------------------------ studio environment */
{
  const env = new THREE.Scene();
  env.add(new THREE.Mesh(new THREE.SphereGeometry(40, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide,
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }',
    fragmentShader: `varying vec3 vD; void main(){ float y = normalize(vD).y;
      vec3 c = mix(vec3(0.34, 0.3, 0.26), vec3(0.62, 0.58, 0.54), smoothstep(-0.3, 0.8, y));
      gl_FragColor = vec4(c, 1.); }` })));
  const card = (x, y, z, w, h, I, col) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(I), side: THREE.DoubleSide }));
    m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m); };
  card(-16, 18, 22, 16, 11, 7, '#fff4e4');    // key softbox, high camera-left
  card(22, 6, 14, 6, 14, 1.6, '#e2ebff');     // fill strip, camera-right
  card(4, 16, -24, 22, 5, 4, '#fff1e2');      // rim strip behind
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env, 0.02).texture;
}

/* ------------------------------------------------------------- lights */
const hemi = new THREE.HemisphereLight('#fff8ee', '#d9c6a6', 0.5); scene.add(hemi);
const key = new THREE.SpotLight('#fff0da', 3.2, 0, 0.62, 1, 0);
key.position.set(-5.5, 8.5, 7.5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.camera.near = 4; key.shadow.camera.far = 30;
key.shadow.radius = 9; key.shadow.blurSamples = 16; key.shadow.bias = -0.0006;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight('#dbe5ff', 0.55); fill.position.set(8, 3, 6); scene.add(fill);
const rim = new THREE.DirectionalLight('#fff3e6', 2.6); rim.position.set(2.5, 6, -8); scene.add(rim, rim.target);
const starLight = new THREE.PointLight('#ffc45e', 0, 7, 2); scene.add(starLight);

/* ---------------------------------------------------------- cyclorama */
const cycMat = new THREE.MeshStandardMaterial({ color: '#e7dcc8', roughness: 0.94, metalness: 0 });
{
  const prof = [];                                    // (y, z): floor -> cove -> wall
  for (let z = 40; z > -3; z -= 0.5) prof.push([0, z]);
  const RC = 3;
  for (let k = 0; k <= 24; k++) { const a = k / 24 * PI / 2; prof.push([RC - Math.cos(a) * RC, -3 - Math.sin(a) * RC]); }
  for (let y = RC + 0.5; y <= 30; y += 0.5) prof.push([y, -3 - RC]);
  const P = [], I = [];
  prof.forEach(([y, z]) => P.push(-30, y, z, 45, y, z));
  for (let i = 0; i < prof.length - 1; i++) { const a = i * 2; I.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setIndex(I); g.computeVertexNormals();
  const cyc = new THREE.Mesh(g, cycMat); cyc.receiveShadow = true; scene.add(cyc);
}

/* ---------------------------------------------------------- materials */
const pbr = [];                                       // every lit material, for the night env dimming
function plastic(col, o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: col, roughness: o.rough ?? 0.4, metalness: 0,
    clearcoat: o.cc ?? 0.5, clearcoatRoughness: o.ccr ?? 0.16, sheen: o.sheen ?? 0.35, sheenRoughness: 0.5,
    sheenColor: new THREE.Color(o.sheenCol ?? '#ffffff'), emissive: o.emissive ?? '#000000', emissiveIntensity: 0,
    side: o.side ?? THREE.FrontSide });
  m.userData.env = o.env ?? 1;
  if (o.sss) {           // light scattered under the rubber skin glows at grazing angles
    m.userData.uSss = { value: o.sss };
    m.onBeforeCompile = sh => {
      sh.uniforms.uSss = m.userData.uSss;
      sh.fragmentShader = 'uniform float uSss;\n' + sh.fragmentShader.replace('#include <opaque_fragment>', `
        { float nv = clamp(dot(normalize(normal), normalize(vViewPosition)), 0., 1.);
          outgoingLight += diffuseColor.rgb * uSss * (0.25 + pow(1. - nv, 2.5)); }
        #include <opaque_fragment>`);
    };
  }
  pbr.push(m); return m;
}
const MAT = {
  body: plastic('#d9252c', { rough: 0.36, cc: 0.65, ccr: 0.14, sheen: 0.45, sheenCol: '#ff9a8a', sss: 0.12 }),
  lid: plastic('#d9252c', { rough: 0.36, cc: 0.65, ccr: 0.14, sheen: 0.45, sheenCol: '#ff9a8a', sss: 0.12, side: THREE.DoubleSide }),
  sclera: plastic('#f6f1e8', { rough: 0.32, cc: 1, ccr: 0.03, sheen: 0, sss: 0.05 }),
  iris: plastic('#4a2a1a', { rough: 0.3, cc: 1, ccr: 0.02, sheen: 0 }),
  pupil: plastic('#070606', { rough: 0.25, cc: 1, ccr: 0.02, sheen: 0 }),
  brow: plastic('#3a0c0d', { rough: 0.5, cc: 0.3, sheen: 0.2 }),
  lash: plastic('#2a0909', { rough: 0.45, cc: 0.3, sheen: 0 }),
  star: plastic('#ffc634', { rough: 0.32, cc: 0.9, ccr: 0.08, sheen: 0.3, emissive: '#ffb02a', sss: 0.1 }),
  moon: plastic('#fff0c8', { rough: 0.62, cc: 0.2, sheen: 0.4, emissive: '#ffe2a2', env: 0.6 }),
};

/* ------------------------------------------------ contact blob shadows */
const blobTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
  g.addColorStop(0, 'rgba(46,30,20,0.78)'); g.addColorStop(0.3, 'rgba(46,30,20,0.42)'); g.addColorStop(1, 'rgba(46,30,20,0)');
  x.fillStyle = g; x.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
const blobGeo = new THREE.PlaneGeometry(1, 1).rotateX(-PI / 2);
function mkBlob() { const b = new THREE.Mesh(blobGeo, new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false,
    polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
  b.renderOrder = 1; scene.add(b); return b; }
function setBlob(b, x, ground, z, size, lift, vis) {  // lift = height of the object's underside above its ground
  const k = 1 / (1 + 2.2 * Math.max(0, lift)), s = size * (1 + 0.9 * Math.max(0, lift));
  b.position.set(x, ground + 0.004, z); b.scale.set(s, 1, s * 0.9); b.material.opacity = vis * k; b.visible = vis > 0.001;
}

/* ------------------------------------------------------------ the dot */
// a capsule bent into an arch (y -= bend x^2), wrapped onto a sphere (z -= wrap x^2), tapered at the ends
// (a lathe with a finely divided straight section: the core capsule has none, so it would not bend)
function arch(rad, len, bend, wrap) {
  const pts = [];
  for (let k = 0; k <= 8; k++) { const a = -PI / 2 + k / 8 * PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * rad, -len / 2 + Math.sin(a) * rad)); }
  for (let k = 1; k < 24; k++) pts.push(new THREE.Vector2(rad, -len / 2 + k / 24 * len));
  for (let k = 0; k <= 8; k++) { const a = k / 8 * PI / 2; pts.push(new THREE.Vector2(Math.cos(a) * rad, len / 2 + Math.sin(a) * rad)); }
  const g = new THREE.LatheGeometry(pts, 24).rotateZ(PI / 2), P = g.attributes.position, half = len / 2 + rad;
  for (let i = 0; i < P.count; i++) { const x = P.getX(i), u = Math.min(1, Math.abs(x) / half), k = 1 - 0.45 * u * u;
    P.setXYZ(i, x, P.getY(i) * k - bend * x * x, P.getZ(i) * k * 0.62 - wrap * x * x); }
  g.computeVertexNormals(); return g;
}
const EYE_R = 0.165, EYE_SPREAD = 0.4, EYE_UP = 0.2, EYE_IN = 0.43;
const dot = {};
{
  dot.root = new THREE.Group(); scene.add(dot.root);            // contact point + facing (yaw)
  dot.squash = new THREE.Group(); dot.root.add(dot.squash);     // squash & stretch about the contact point
  dot.pivot = new THREE.Group(); dot.pivot.position.y = R; dot.pivot.rotation.order = 'YXZ'; dot.squash.add(dot.pivot);
  const body = new THREE.Mesh(new THREE.SphereGeometry(R, 128, 96), MAT.body); body.castShadow = true; body.receiveShadow = true;
  dot.pivot.add(body);
  const scleraGeo = new THREE.SphereGeometry(EYE_R, 64, 48);
  const cap = (r, ang) => new THREE.SphereGeometry(r, 64, 16, 0, TAU, 0, ang).rotateX(PI / 2);
  const irisGeo = cap(EYE_R * 1.004, 0.66), pupilGeo = cap(EYE_R * 1.008, 0.38);
  const upperGeo = new THREE.SphereGeometry(EYE_R * 1.075, 64, 24, 0, TAU, 0, PI / 2);
  const lowerGeo = new THREE.SphereGeometry(EYE_R * 1.06, 64, 24, 0, TAU, PI / 2, PI / 2);
  const glintGeo = new THREE.SphereGeometry(1, 20, 12), glintMat = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ffffff').multiplyScalar(2.4) });
  dot.glint = glintMat;
  const lashGeo = arch(0.017, 0.19, 3.2, 2.6).translate(0, 0, EYE_R * 1.075 + 0.004);
  dot.eyes = [-1, 1].map(side => {
    const base = new THREE.Group(); base.rotation.set(-EYE_UP, side * EYE_SPREAD, 0, 'YXZ');
    base.position.set(side * Math.sin(EYE_SPREAD) * Math.cos(EYE_UP), Math.sin(EYE_UP), Math.cos(EYE_SPREAD) * Math.cos(EYE_UP)).multiplyScalar(EYE_IN);
    const ball = new THREE.Group(); ball.rotation.order = 'YXZ'; base.add(ball);
    const sc = new THREE.Mesh(scleraGeo, MAT.sclera); sc.castShadow = true; ball.add(sc);
    ball.add(new THREE.Mesh(irisGeo, MAT.iris), new THREE.Mesh(pupilGeo, MAT.pupil));
    const upper = new THREE.Mesh(upperGeo, MAT.lid), lower = new THREE.Mesh(lowerGeo, MAT.lid);
    upper.castShadow = true; base.add(upper, lower);
    const lash = new THREE.Mesh(lashGeo, MAT.lash); lash.position.set(0, 0.012, 0); base.add(lash);
    for (const [x, y, r] of [[-0.36, 0.4, 0.024], [0.3, -0.24, 0.011]]) {
      const n = V3(x, y, 1).normalize(), c = new THREE.Mesh(glintGeo, glintMat);
      c.position.copy(n).multiplyScalar(EYE_R * 1.012); c.quaternion.setFromUnitVectors(V3(0, 0, 1), n); c.scale.set(r, r * 0.8, r * 0.3); base.add(c);
    }
    dot.pivot.add(base);
    return { base, ball, upper, lower, lash, side };
  });
  const browGeo = arch(0.036, 0.16, 4.2, 1.6);
  dot.brows = [-1, 1].map(side => {
    const p = new THREE.Group(); p.rotation.order = 'YXZ';
    const m = new THREE.Mesh(browGeo, MAT.brow); m.position.z = R + 0.004; p.add(m); dot.pivot.add(p);
    return { p, m, side };
  });
  dot.blob = mkBlob();
}

/* -------------------------------------------------- toy puck stacks */
function puckGeo(r, h, b) {                            // a disc with rounded edges (lathe profile)
  const pts = [new THREE.Vector2(0, 0)];
  for (let k = 0; k <= 10; k++) { const a = -PI / 2 + k / 10 * PI / 2; pts.push(new THREE.Vector2(r - b + Math.cos(a) * b, b + Math.sin(a) * b)); }
  for (let k = 0; k <= 10; k++) { const a = k / 10 * PI / 2; pts.push(new THREE.Vector2(r - b + Math.cos(a) * b, h - b + Math.sin(a) * b)); }
  pts.push(new THREE.Vector2(0, h));
  return new THREE.LatheGeometry(pts, 96);
}
STACKS.forEach((s, i) => {
  s.g = new THREE.Group(); s.g.position.set(s.x, 0, s.z); scene.add(s.g);
  s.discs = s.cols.map((c, j) => {
    const m = new THREE.Mesh(puckGeo(0.6 - 0.025 * j, DISC_H, 0.13), plastic(c, { rough: 0.5, cc: 0.25, ccr: 0.3, sheen: 0.6, sss: 0.08 }));
    m.position.y = j * DISC_H; m.rotation.y = i * 1.3 + j * 0.7; m.castShadow = m.receiveShadow = true; s.g.add(m); return m;
  });
  s.blob = mkBlob();
});
// stack pop-in (stagger, overshoot) and a rubbery give when the dot lands on top
function stackScale(i, t) {
  const tl = t - POPS[i], sy = springTo(tl, 6.5, 15);
  let give = 0; HOPS.forEach(h => { if (h.b === i) give += 0.07 * wobble(t - h.t1, 7, 20); });
  return { sy: Math.max(0.001, sy - give), sxz: 1 + 0.22 * wobble(tl, 6, 15) * -1 + 0.6 * give, vis: tl > 0 };
}
const groundAt = (i, t) => i < 0 ? 0 : STACKS[i].h * stackScale(i, t).sy;
const spotXZ = i => i < 0 ? [0, 0] : [STACKS[i].x, STACKS[i].z];

/* --------------------------------------------------------- star shapes */
function starGeo(r1, r2, depth, bevel) {               // a fat five-point star, corners rounded by quadratic joins
  const v = []; for (let k = 0; k < 10; k++) { const a = PI / 2 + k * PI / 5, r = k % 2 ? r2 : r1; v.push([Math.cos(a) * r, Math.sin(a) * r]); }
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  const sh = new THREE.Shape(), m0 = mid(v[9], v[0]); sh.moveTo(m0[0], m0[1]);
  for (let k = 0; k < 10; k++) { const c = v[k], m = mid(c, v[(k + 1) % 10]); sh.quadraticCurveTo(c[0], c[1], m[0], m[1]); }
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 8, curveSegments: 16 });
  g.center(); g.computeVertexNormals(); return g;
}
const STAR_R1 = 0.24, STAR_LIFT = STAR_R1 * 0.62;     // centre height when it stands on its two lower points
const star = { g: new THREE.Group(), inner: new THREE.Group() };
{
  const m = new THREE.Mesh(starGeo(STAR_R1, STAR_R1 * 0.56, 0.05, 0.06), MAT.star); m.castShadow = true;
  star.mesh = m; star.inner.add(m); star.g.add(star.inner); scene.add(star.g); star.blob = mkBlob();
}

/* ------------------------------------------------------ moon and sky */
function crescentGeo(Ro, ri, dx, dy) {                 // outer disc minus an offset disc, puffed by a deep bevel
  const d = Math.hypot(dx, dy), a = (Ro * Ro - ri * ri + d * d) / (2 * d), h = Math.sqrt(Ro * Ro - a * a);
  const ux = dx / d, uy = dy / d, bx = a * ux, by = a * uy;
  const p1 = [bx - h * uy, by + h * ux], p2 = [bx + h * uy, by - h * ux];
  const pts = [];
  const sweep = (cx, cy, r, a0, a1, through, n) => {     // arc from a0 to a1 passing through angle `through`
    let s = ((a1 - a0) % TAU + TAU) % TAU; const th = ((through - a0) % TAU + TAU) % TAU; if (th > s) s -= TAU;
    for (let k = 0; k <= n; k++) { const q = a0 + s * k / n; pts.push(new THREE.Vector2(cx + Math.cos(q) * r, cy + Math.sin(q) * r)); }
  };
  const away = Math.atan2(-dy, -dx);
  sweep(0, 0, Ro, Math.atan2(p1[1], p1[0]), Math.atan2(p2[1], p2[0]), away, 72);
  sweep(dx, dy, ri, Math.atan2(p2[1] - dy, p2[0] - dx), Math.atan2(p1[1] - dy, p1[0] - dx), away, 60);
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: 0.08, bevelEnabled: true, bevelThickness: 0.12, bevelSize: 0.09, bevelSegments: 10, curveSegments: 24 });
  g.center(); g.computeVertexNormals(); return g;
}
const moon = new THREE.Mesh(crescentGeo(0.95, 0.82, 0.42, 0.2), MAT.moon);
moon.rotation.set(0, -0.25, -0.35); scene.add(moon);
// small glowing sky stars on the back wall (instanced), and a few hanging toy stars
const SKY = [];

  float hash(vec2 p){ vec3 q = fract(vec3(p.xyx) * 0.1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
  void main(){
    vec3 sharp = texture2D(tColor, vUv).rgb;
    float c = abs(coc(texture2D(tDepth, vUv).x));
    vec4 bk = texture2D(tDof, vUv);
    vec3 col = mix(sharp, bk.rgb, smoothstep(0.35, 1.25, max(c, bk.a)));
    col += uBloom * (0.6 * texture2D(tB1, vUv).rgb + 0.4 * texture2D(tB2, vUv).rgb);
    col = srgb(aces(col * uExpo / 0.6));
    vec2 q = (vUv - 0.5) * vec2(1., 0.62);
    col *= 1. - uVig * pow(clamp(length(q) * 1.45, 0., 1.), 2.6);
    float l = dot(col, vec3(0.299, 0.587, 0.114));
    float gr = hash(gl_FragCoord.xy + uSeed * vec2(37.1, 17.3)) + hash(gl_FragCoord.xy * 1.31 + uSeed * vec2(11.7, 71.9)) - 1.;
    col += gr * uGrain * (0.45 + 2.2 * l * (1. - l));
    col = mix(col, uFadeCol, uFade);
    gl_FragColor = vec4(col, 1.);
  }`, { tColor: { value: rtScene.texture }, tDepth: { value: rtScene.depthTexture }, tDof: { value: rtDof.texture },
    tB1: { value: rtB1.texture }, tB2: { value: rtB2.texture }, uBloom: { value: 0.3 }, uExpo: { value: 1 }, uGrain: { value: 0.028 },
    uSeed: { value: 0 }, uFade: { value: 0 }, uVig: { value: 0.3 }, uFadeCol: { value: new THREE.Vector3() }, ...lensU() });

const BONE = new THREE.Color('#e7dcc8'), NAVY = new THREE.Color('#0b1024');
function renderFrame(t) {
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  const n = sstep(DUSK, NIGHT, t);
  for (const m of [matPre, matComp]) {
    m.uniforms.uFocus.value = state.focus;
    m.uniforms.uAper.value = 27;
  }
  pass(matPre, rtPre); pass(matDof, rtDof);
  matBright.uniforms.uThresh.value = lerp(1.1, 0.75, n); pass(matBright, rtB1);
  const blur = (src, dst, dx, dy) => { matBlur.uniforms.tSrc.value = src.texture; matBlur.uniforms.uDir.value.set(dx / src.width, dy / src.height); pass(matBlur, dst); };
  blur(rtB1, rtB1b, 1, 0); blur(rtB1b, rtB1, 0, 1);
  matCopy.uniforms.tSrc.value = rtB1.texture; pass(matCopy, rtB2);
  blur(rtB2, rtB2b, 1, 0); blur(rtB2b, rtB2, 0, 1);
  const U = matComp.uniforms;
  U.uBloom.value = lerp(0.28, 0.6, n); U.uExpo.value = lerp(1.0, 1.08, n); U.uSeed.value = Math.floor(t * 7.5 + 1e-6) % 997;
  const fin = 1 - sstep(0, 0.4, t), fout = sstep(OUT, DUR - 0.05, t);
  if (fin > 0) { U.uFade.value = fin; U.uFadeCol.value.set(0.93, 0.89, 0.82); }
  else { U.uFade.value = fout; U.uFadeCol.value.set(0.04, 0.05, 0.1); }
  pass(matComp, null);
}

/* ------------------------------------------------------ 2D overlay */
const TITLE_TXT = 'A Little Detour';
function overlay(t) {
  const a = sstep(TITLE, TITLE + 0.6, t) * (1 - sstep(OUT + 0.15, DUR - 0.1, t));
  if (a <= 0) return;
  const u = easeOut((t - TITLE) / 0.9);
  octx.save();
  octx.globalAlpha = a; octx.textAlign = 'center'; octx.textBaseline = 'alphabetic';
  octx.font = "500 96px 'Fraunces'"; octx.letterSpacing = '1px';
  octx.filter = `blur(${(1 - u) * 6}px)`;
  octx.shadowColor = 'rgba(255,214,140,0.55)'; octx.shadowBlur = 28;
  octx.fillStyle = '#fff3dc';
  octx.fillText(TITLE_TXT, 1430, 872 + 18 * (1 - u));
  octx.restore();
}

window.ready = (async () => {
  await document.fonts.load("500 96px 'Fraunces'", TITLE_TXT);
  await document.fonts.ready;
  for (const tt of [0, 2.5, 5.5, 8]) { setScene(tt); renderer.compile(scene, camera); renderFrame(tt); }
})();

window.draw = ({ t }) => {
  setScene(t); renderFrame(t);
  octx.drawImage(glc, 0, 0); overlay(t);
  return out.toDataURL('image/jpeg', 0.92).split(',')[1];
};

window.events = () => [
  { k: 'wake', t: WAKE },
  { k: 'glance', t: 0.98, pan: -0.5 }, { k: 'glance', t: 1.32, pan: 0.5 }, { k: 'glance', t: 1.68, pan: 0 },
  ...BLINKS.map(t => ({ k: 'blink', t })),
  { k: 'fall', t: DROP },
  { k: 'ting', t: STAR_HIT, i: 0 }, { k: 'ting', t: 2.8, i: 1 }, { k: 'ting', t: 3.2, i: 2 }, { k: 'tap', t: 3.36 }, { k: 'tap', t: 3.46 },
  ...POPS.map((t, i) => ({ k: 'pop', t, i })),
  ...HOPS.map((h, i) => ({ k: 'hop', t: h.t0, i })), ...HOPS.map((h, i) => ({ k: 'land', t: h.t1, i })),
  { k: 'dusk', t: DUSK },
  { k: 'moon', t: MOON_IN },
  ...SKY.filter((s, i) => i % 6 === 0).map(s => ({ k: 'twinkle', t: s.on, pan: (s.x - 6) / 6.5 })),
  ...TOYS.map(T => ({ k: 'toy', t: T.on, pan: (T.m.position.x - 6) / 6 })),
  { k: 'rise', t: RISE }, { k: 'park', t: PARK },
  { k: 'happy', t: HAPPY }, { k: 'title', t: TITLE }, { k: 'out', t: OUT },
];
