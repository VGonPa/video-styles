<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * Pencil Sketch: a 10 s graphite sketchbook clip, "Designing a treehouse".
 *
 * The camera starts close on the page margin, where three quick thumbnails get drawn and the
 * third one is circled. It then pulls back while that idea is developed into a finished drawing:
 * faint construction lines, dark contours drawn twice, hatching with a stump smudge, a rope
 * ladder, a small flag that flutters, handwritten notes and a dimension line. The clip ends with
 * the page corner lifting and a fade to dark.
 *
 * Every stroke wobbles ("boils") at 12 fps. Graphite is drawn on its own layer, masked by the
 * paper's tooth and multiplied onto the paper, so it only catches on the raised fibres.
 * window.draw({ t }) returns the frame at time t (seconds) as base64 JPEG.
 */
const SW = 1920, SH = 1080;
const screen = document.getElementById('c').getContext('2d');
const SCRIPT_FONT = "'Caveat', cursive";

// ── small maths ──────────────────────────────────────────────────────────────
function clamp(v, lo = 0, hi = 1) { return v < lo ? lo : v > hi ? hi : v; }
function mix(p, q, k) { return p * (1 - k) + q * k; }
function span(t, from, to) { return clamp((t - from) / (to - from)); }
function outCubic(k) { const q = 1 - clamp(k); return 1 - q * q * q; }
function inOutCubic(k) {
  k = clamp(k);
  if (k < 0.5) return 4 * k * k * k;
  const q = 2 - 2 * k;
  return 1 - (q * q * q) / 2;
}
function cosEase(k) { return (1 - Math.cos(clamp(k) * Math.PI)) / 2; }

// seeded generator (mulberry32 family) and a stateless 3-integer hash in [0, 1)
function seeded(seed) {
  let a = (seed * 2654435761) >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let z = Math.imul(a ^ (a >>> 15), a | 1);
    z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function noise3(i, j, k) {
  let h = Math.imul(i | 0, 0x27d4eb2d) ^ Math.imul(j | 0, 0x165667b1) ^ Math.imul(k | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function surface(w = SW, h = SH) {
  const el = document.createElement('canvas');
  el.width = w; el.height = h;
  return el;
}

// ── paper, tooth and the page below ──────────────────────────────────────────
const paperLayer = surface(), toothLayer = surface(), nextPage = surface();

function makePaper() {
  // large soft mottling: random greys on a tiny grid, upscaled with smoothing
  const cols = 120, rows = 68, tiny = surface(cols, rows), tctx = tiny.getContext('2d');
  const cells = tctx.createImageData(cols, rows), pick = seeded(41);
  for (let p = 0; p < cols * rows; p++) {
    const g = 128 + (pick() - 0.5) * 56;
    cells.data.set([g, g, g, 255], p * 4);
  }
  tctx.putImageData(cells, 0, 0);
  const blotch = surface(), bctx = blotch.getContext('2d');
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(tiny, 0, 0, SW, SH);
  const mottle = bctx.getImageData(0, 0, SW, SH).data;

  // warm off-white plus fine grain
  const pctx = paperLayer.getContext('2d'), img = pctx.createImageData(SW, SH), px = img.data;
  const grain = seeded(97);
  for (let p = 0, o = 0; p < SW * SH; p++, o += 4) {
    const dv = (grain() - 0.5) * 13 + (mottle[o] - 128) * 0.11;
    px[o] = 238 + dv; px[o + 1] = 235 + dv; px[o + 2] = 227 + dv * 0.88; px[o + 3] = 255;
  }
  pctx.putImageData(img, 0, 0);
  // binding shadow along the left edge and a soft darkening toward the corners
  const spine = pctx.createLinearGradient(0, 0, 150, 0);
  spine.addColorStop(0, 'rgba(58, 52, 42, 0.22)');
  spine.addColorStop(1, 'rgba(58, 52, 42, 0)');
  pctx.fillStyle = spine; pctx.fillRect(0, 0, 150, SH);
  const corners = pctx.createRadialGradient(SW / 2 + 30, SH / 2, 380, SW / 2, SH / 2, 1180);
  corners.addColorStop(0, 'rgba(48, 38, 28, 0)');
  corners.addColorStop(1, 'rgba(48, 38, 28, 0.16)');
  pctx.fillStyle = corners; pctx.fillRect(0, 0, SW, SH);

  // tooth: how much graphite each pixel can hold (raised diagonal fibres hold more)
  const kctx = toothLayer.getContext('2d'), mask = kctx.createImageData(SW, SH), mk = mask.data;
  const tooth = seeded(213);
  for (let y = 0, o = 0; y < SH; y++) {
    for (let x = 0; x < SW; x++, o += 4) {
      const fibre = 0.5 + 0.5 * Math.sin(0.88 * x + 0.37 * y);
      const hold = 0.43 + tooth() * (0.47 + 0.11 * fibre) + (mottle[o] - 128) / 420;
      mk[o + 3] = 255 * clamp(hold);
    }
  }
  kctx.putImageData(mask, 0, 0);

  // the blank page revealed under the lifting corner
  const nctx = nextPage.getContext('2d');
  nctx.drawImage(paperLayer, 0, 0);
  nctx.fillStyle = 'rgba(68, 58, 44, 0.06)'; nctx.fillRect(0, 0, SW, SH);
}

// ── strokes ──────────────────────────────────────────────────────────────────
// A stroke is a point list revealed from start to end between t0 and t0 + dur.
const strokes = [];
const notes = [];
const STEP = 7;     // px between resampled points

function addStroke(pts, t0, dur, w, a, o = {}) {
  const s = {
    id: strokes.length, pts, t0, dur, w, a,
    boil: o.boil === undefined ? 1.1 : o.boil,
    clip: o.clip || null,
    ease: o.ease || cosEase,
    dyn: o.dyn || null,
    snd: o.snd === undefined ? 1 : o.snd,
  };
  strokes.push(s);
  return s;
}
function nextRand(salt) { return seeded(strokes.length * 101 + salt); }

// straight line, bowed a little sideways, starting and ending slightly past its endpoints
function ln(x0, y0, x1, y1, t0, dur, w, a, o = {}) {
  const r = nextRand(3);
  const len = Math.hypot(x1 - x0, y1 - y0) || 1, dx = (x1 - x0) / len, dy = (y1 - y0) / len;
  const run = o.over === undefined ? 10 : o.over;
  const bend = (o.bow === undefined ? 4 : o.bow) * (2 * r() - 1);
  const sx = x0 - dx * run * r(), sy = y0 - dy * run * r();
  const ex = x1 + dx * run * r(), ey = y1 + dy * run * r();
  const steps = Math.max(4, Math.round(len / STEP)), pts = [];
  for (let i = 0; i <= steps; i++) {
    const k = i / steps, side = 4 * k * (1 - k) * bend;    // parabola: zero at the ends, peak mid-way
    pts.push([mix(sx, ex, k) - dy * side, mix(sy, ey, k) + dx * side]);
  }
  return addStroke(pts, t0, dur, w, a, o);
}

// elliptical arc with a slow radial wobble
function arc(cx, cy, rx, ry, from, to, t0, dur, w, a, o = {}) {
  const r = nextRand(5), amp = (o.wob === undefined ? 2 : o.wob) / Math.max(rx, ry);
  const steps = Math.max(8, Math.round(Math.abs(to - from) * Math.max(rx, ry) / STEP));
  const phase = r() * 6.3, pts = [];
  for (let i = 0; i <= steps; i++) {
    const k = i / steps, ang = mix(from, to, k), wob = 1 + amp * Math.sin(5 * k + phase);
    pts.push([cx + rx * wob * Math.cos(ang), cy + ry * wob * Math.sin(ang)]);
  }
  return addStroke(pts, t0, dur, w, a, o);
}

// corner-to-corner path, each leg resampled
function poly(P, t0, dur, w, a, o = {}) {
  const pts = [];
  P.slice(1).forEach(([bx, by], i) => {
    const [ax, ay] = P[i], steps = Math.max(2, Math.round(Math.hypot(bx - ax, by - ay) / STEP));
    for (let j = 0; j < steps; j++) pts.push([mix(ax, bx, j / steps), mix(ay, by, j / steps)]);
  });
  pts.push(P[P.length - 1]);
  return addStroke(pts, t0, dur, w, a, o);
}

// smooth curve through every given point (uniform Catmull-Rom, ends duplicated)
function curve(P, t0, dur, w, a, o = {}) {
  const at = i => P[clamp(i, 0, P.length - 1)], pts = [];
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
    const steps = Math.max(3, Math.round(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / STEP));
    for (let j = 0; j < steps; j++) {
      const k = j / steps, k2 = k * k, k3 = k2 * k;
      const c0 = -0.5 * k3 + k2 - 0.5 * k, c1 = 1.5 * k3 - 2.5 * k2 + 1;
      const c2 = -1.5 * k3 + 2 * k2 + 0.5 * k, c3 = 0.5 * k3 - 0.5 * k2;
      pts.push([0, 1].map(d => c0 * p0[d] + c1 * p1[d] + c2 * p2[d] + c3 * p3[d]));
    }
  }
  pts.push(P[P.length - 1]);
  return addStroke(pts, t0, dur, w, a, o);
}

// margin arrow: a quadratic bend from (x0, y0) to (x1, y1), then two quick strokes for the head
function arrow(x0, y0, qx, qy, x1, y1, t0, dur, w, a) {
  const pts = [];
  for (let i = 0; i <= 30; i++) {
    const k = i / 30, m = 1 - k;
    pts.push([m * m * x0 + 2 * m * k * qx + k * k * x1, m * m * y0 + 2 * m * k * qy + k * k * y1]);
  }
  addStroke(pts, t0, dur, w, a);
  const back = Math.atan2(qy - y1, qx - x1);
  [-0.45, 0.45].forEach((spread, i) => {
    const hx = x1 + 22 * Math.cos(back + spread), hy = y1 + 22 * Math.sin(back + spread);
    ln(x1, y1, hx, hy, t0 + dur + 0.06 * i, 0.08, w, a, { over: 0, bow: 1 });
  });
}

// hatching: parallel strokes laid one after another across a box, each clipped to a shape
function hatchFill(clip, x0, y0, x1, y1, ang, gap, t0, t1, w, a, o = {}) {
  const r = nextRand(9), ux = Math.cos(ang), uy = Math.sin(ang);
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, reach = Math.hypot(x1 - x0, y1 - y0) / 2 + 10;
  const offsets = [];
  for (let d = -reach; d <= reach; d += gap * (0.8 + 0.4 * r())) offsets.push(d);
  offsets.forEach((d, i) => {
    const cx = mx - uy * d, cy = my + ux * d, half = reach * (0.85 + 0.3 * r());
    const tilt0 = 6 * (r() - 0.5), tilt1 = 6 * (r() - 0.5);
    ln(cx - ux * half, cy - uy * half + tilt0, cx + ux * half, cy + uy * half + tilt1,
      mix(t0, t1, i / offsets.length), 0.1 + 0.05 * r(), w * (0.8 + 0.4 * r()), a * (0.75 + 0.35 * r()),
      { clip, bow: 3, over: 0, boil: o.boil === undefined ? 0.7 : o.boil, snd: 0.5 });
  });
}

// clip builders (page coordinates)
function tracePath(c, P) { c.moveTo(P[0][0], P[0][1]); for (let i = 1; i < P.length; i++) c.lineTo(P[i][0], P[i][1]); c.closePath(); }
const clipPoly = P => c => { c.beginPath(); tracePath(c, P); c.clip(); };
const clipRect = (x, y, w, h) => c => { c.beginPath(); c.rect(x, y, w, h); c.clip(); };

// ── sketchbook margin: three thumbnails ──────────────────────────────────────
const TH = [{ x: 150, y: 215 }, { x: 150, y: 460 }, { x: 150, y: 705 }], TW = 320, THH = 210;
const note = (txt, x, y, size, t0, t1, rot = 0, a = 0.92) => notes.push({ txt, x, y, size, t0, t1, rot, a });

function buildThumbs() {
  note('Treehouse — ideas', 150, 158, 76, 0.3, 1.0, -0.02);
  { const pts = []; for (let i = 0; i <= 30; i++) { const u = i / 30; pts.push([mix(148, 640, u), 176 + Math.sin(u * 3) * 4 - u * 8]); } addStroke(pts, 1.0, 0.25, 2.4, 0.6); }
  const light = { w: 1.3, a: 0.38 }, k = { w: 2.3, a: 0.82 };
  const frame = (T, t0) => {
    const c = [[T.x, T.y], [T.x + TW, T.y], [T.x + TW, T.y + THH], [T.x, T.y + THH]];
    [0, 0.08, 0.14, 0.22].forEach((dt, i) => ln(...c[i], ...c[(i + 1) % 4], t0 + dt, i % 2 ? 0.1 : 0.12, light.w, light.a, { over: 8 }));
  };
  const box = (T, t0, n) => { frame(T, t0); note(String(n), T.x + 14, T.y + 38, 40, t0 + 0.1, t0 + 0.25, 0, 0.7); };
  // 1 · a box on stilts
  { const T = TH[0], L = (x, y) => [T.x + x, T.y + y], t = 0.55; box(T, t, 1);
    ln(...L(40, 190), ...L(290, 190), t + 0.2, 0.15, 1.6, 0.5, { over: 6 });
    arc(...L(170, 72), 78, 56, Math.PI * 0.85, Math.PI * 2.2, t + 0.28, 0.3, 2, 0.6, { wob: 6 });
    ln(...L(165, 190), ...L(165, 120), t + 0.3, 0.1, k.w, k.a); ln(...L(180, 190), ...L(180, 120), t + 0.33, 0.1, k.w, k.a);
    poly([L(118, 150), L(118, 108), L(228, 108), L(228, 150), L(118, 150)], t + 0.42, 0.22, k.w, k.a);
    poly([L(108, 110), L(173, 70), L(238, 110)], t + 0.6, 0.15, k.w, k.a);
    ln(...L(128, 150), ...L(128, 190), t + 0.72, 0.06, k.w, k.a, { over: 3 }); ln(...L(218, 150), ...L(218, 190), t + 0.76, 0.06, k.w, k.a, { over: 3 });
    note('?', T.x + 262, T.y + 72, 50, t + 0.82, t + 0.92, 0.1, 0.75); }
  // 2 · a round pod hanging from a branch
  { const T = TH[1], L = (x, y) => [T.x + x, T.y + y], t = 1.25; box(T, t, 2);
    ln(...L(62, 196), ...L(62, 40), t + 0.2, 0.12, k.w, k.a, { over: 4 }); ln(...L(76, 196), ...L(76, 52), t + 0.22, 0.12, k.w, k.a, { over: 4 });
    curve([L(70, 50), L(150, 38), L(230, 44), L(290, 60)], t + 0.3, 0.18, k.w, k.a);
    ln(...L(190, 44), ...L(190, 72), t + 0.45, 0.06, 1.8, 0.7, { over: 2 });
    arc(...L(190, 118), 50, 46, 0, Math.PI * 2.05, t + 0.5, 0.22, k.w, k.a, { wob: 3 });
    arc(...L(190, 112), 13, 13, 0, Math.PI * 2, t + 0.66, 0.08, 1.8, 0.75);
    ln(...L(30, 196), ...L(300, 196), t + 0.7, 0.12, 1.6, 0.5, { over: 6 }); }
  // 3 · a little house on a deck (the keeper)
  { const T = TH[2], L = (x, y) => [T.x + x, T.y + y], t = 1.95; box(T, t, 3);
    ln(...L(30, 196), ...L(300, 196), t + 0.2, 0.12, 1.6, 0.5, { over: 6 });
    arc(...L(165, 62), 110, 48, Math.PI * 0.92, Math.PI * 2.08, t + 0.26, 0.26, 2, 0.6, { wob: 6 });
    ln(...L(152, 196), ...L(155, 122), t + 0.3, 0.08, k.w, k.a, { over: 3 }); ln(...L(178, 196), ...L(175, 122), t + 0.32, 0.08, k.w, k.a, { over: 3 });
    poly([L(88, 118), L(245, 118), L(245, 126), L(88, 126), L(88, 118)], t + 0.4, 0.12, k.w, k.a);
    poly([L(118, 118), L(118, 78), L(212, 78), L(212, 118)], t + 0.5, 0.14, k.w, k.a);
    poly([L(106, 80), L(165, 44), L(224, 80)], t + 0.62, 0.12, k.w, k.a);
    ln(...L(165, 44), ...L(165, 22), t + 0.72, 0.05, 1.8, 0.8, { over: 1 }); poly([L(165, 22), L(188, 28), L(165, 34)], t + 0.76, 0.05, 1.8, 0.8);
    ln(...L(96, 126), ...L(96, 192), t + 0.78, 0.06, 1.6, 0.7, { over: 2 }); ln(...L(110, 126), ...L(110, 192), t + 0.8, 0.06, 1.6, 0.7, { over: 2 });
    for (let i = 0; i < 4; i++) ln(...L(96, 140 + i * 15), ...L(110, 140 + i * 15), t + 0.84 + i * 0.015, 0.03, 1.4, 0.7, { over: 1, bow: 1, snd: 0.3 }); }
  // pick: a loose double loop around #3, "this one!" and an arrow toward the big drawing
  { const T = TH[2], cx = T.x + TW / 2, cy = T.y + THH / 2, pts = [];
    for (let i = 0; i <= 120; i++) { const u = i / 120, ang = -2.4 + u * Math.PI * 3.7, grow = 1 + 0.035 * Math.sin(u * 9) + u * 0.03;
      pts.push([cx + Math.cos(ang) * 205 * grow, cy + Math.sin(ang) * 138 * grow]); }
    addStroke(pts, 2.86, 0.42, 3, 0.85, { ease: inOutCubic });
    note('this one!', 520, 812, 64, 3.2, 3.6, -0.06);
    arrow(640, 832, 740, 856, 850, 760, 3.6, 0.24, 2.4, 0.8); }
}

// ── the developed drawing ────────────────────────────────────────────────────
const CX = 1080, GY = 960, DY = 600, HX0 = 960, HX1 = 1200, HY = 410, PK = 300;
const TRUNK = [[1004, 962], [1026, 900], [1036, 800], [1042, 700], [1046, 600], [1116, 600], [1122, 700], [1130, 800], [1142, 900], [1164, 962]];
const HOUSE = [[938, HY], [CX, PK], [1222, HY], [HX1, HY], [HX1, DY + 26], [HX0, DY + 26], [HX0, HY]];
const DECK = { x0: 880, x1: 1262, y: DY, th: 26 };
const LAD = [888, 928];
const CAN = { x: 1080, y: 322, rx: 360, ry: 220 };
const canPts = [];
for (let i = 0; i <= 150; i++) {
  const ang = Math.PI * (0.58 + 1.84 * i / 150), lobe = 0.98 + 0.075 * Math.abs(Math.sin(5.5 * (ang - Math.PI / 2)));
  canPts.push([CAN.x + CAN.rx * lobe * Math.cos(ang), CAN.y + CAN.ry * lobe * Math.sin(ang)]);
}
// canopy and branches sit behind the house: clip them to everything outside its silhouette and the flag
const outsideHouse = c => { c.beginPath(); c.rect(0, 0, SW, SH); tracePath(c, HOUSE); c.rect(1072, 190, 70, 112); c.clip('evenodd'); };
const inCanopy = c => { c.beginPath(); tracePath(c, canPts); c.clip(); outsideHouse(c); };

function buildMain() {
  const g = { w: 1.4, a: 0.3 };
  // 1) construction lines (2H: light, fast, overshooting)
  ln(CX, 150, CX, 990, 3.3, 0.45, g.w, g.a, { over: 0 });
  ln(620, GY, 1540, GY, 3.4, 0.4, g.w, g.a, { over: 20 });
  ln(760, DY, 1400, DY, 3.5, 0.35, g.w, g.a, { over: 20 });
  ln(860, HY, 1300, HY, 3.58, 0.3, g.w, g.a * 0.9, { over: 20 });
  ln(HX0, 370, HX0, 650, 3.66, 0.22, g.w, g.a); ln(HX1, 370, HX1, 650, 3.7, 0.22, g.w, g.a);
  ln(900, 450, 1115, 272, 3.76, 0.22, g.w, g.a * 0.8, { over: 0 }); ln(1045, 272, 1260, 450, 3.8, 0.22, g.w, g.a * 0.8, { over: 0 });
  arc(CAN.x, CAN.y, CAN.rx, CAN.ry, 0, Math.PI * 2, 3.86, 0.5, g.w, g.a * 0.6, { wob: 4 });
  ln(1040, 600, 1022, 965, 4.0, 0.22, g.w, g.a); ln(1122, 600, 1146, 965, 4.04, 0.22, g.w, g.a);
  ln(908, 560, 908, 950, 4.1, 0.25, g.w, g.a * 0.8);
  ln(1420, GY, 1420, DY, 4.12, 0.2, g.w, g.a * 0.7, { over: 30 });
  // 2) contours (HB–2B, dark)
  const k = { w: 3.0, a: 0.92 };
  const trunkPass = (t0, off) => {
    curve([[964 + off, 968], [1004, 958], [1026 + off, 900], [1036, 800], [1042 + off, 700], [1046, 626]], t0, 0.3, k.w, k.a);
    curve([[1206 - off, 968], [1164, 958], [1142 - off, 900], [1130, 800], [1122 - off, 700], [1116, 626]], t0 + 0.1, 0.3, k.w, k.a);
    curve([[1030, 930], [1040, 950], [1048, 968]], t0 + 0.3, 0.1, k.w * 0.8, k.a * 0.8); curve([[1128, 928], [1120, 952], [1124, 968]], t0 + 0.34, 0.1, k.w * 0.8, k.a * 0.8);
  };
  trunkPass(4.25, 0);
  // deck
  ln(DECK.x0, DY, DECK.x1, DY, 4.55, 0.22, k.w, k.a, { over: 6 });
  ln(DECK.x0, DY + DECK.th, DECK.x1, DY + DECK.th, 4.62, 0.22, k.w, k.a, { over: 6 });
  ln(DECK.x0, DY, DECK.x0, DY + DECK.th, 4.7, 0.05, k.w, k.a, { over: 2 }); ln(DECK.x1, DY, DECK.x1, DY + DECK.th, 4.74, 0.05, k.w, k.a, { over: 2 });
  for (let x = DECK.x0 + 34; x < DECK.x1 - 10; x += 36) ln(x, DY + 3, x, DY + DECK.th - 3, 4.78 + (x - DECK.x0) / 3000, 0.04, 1.4, 0.55, { over: 1, bow: 1, snd: 0.3 });
  // house + roof
  const housePass = (t0, o, w, a) => {
    ln(HX0 + o, DY, HX0 + o, HY, t0, 0.16, w, a, { over: 4 }); ln(HX1 + o, DY, HX1 + o, HY, t0 + 0.06, 0.16, w, a, { over: 4 });
    poly([[938 + o, HY + o], [CX + o, PK], [1222 + o, HY - o]], t0 + 0.16, 0.3, w, a);

  const body = clipPoly([[HX0, HY + 14], [HX1, HY + 14], [HX1, DY], [HX0, DY]]);
  const doorPath = c => { c.moveTo(985, DY); c.lineTo(985, 518); c.arc(1015, 518, 30, Math.PI, 0); c.lineTo(1045, DY); c.closePath(); };
  const wallNoOpen = c => { body(c); c.beginPath(); c.rect(0, 0, SW, SH); doorPath(c); c.moveTo(1176, 482); c.arc(1142, 482, 34, 0, Math.PI * 2, true); c.clip('evenodd'); };
  for (let y = HY + 34, i = 0; y < DY; y += 21, i++) ln(HX0 + 2, y, HX1 - 2, y + 1, 6.7 + i * 0.03, 0.1, 1.3, 0.42, { clip: wallNoOpen, over: 0, bow: 2, snd: 0.4 });
  const trunkRight = x => c => { clipPoly(TRUNK)(c); clipRect(x, 0, 200, SH)(c); };
  hatchFill(trunkRight(1086), 1086, 626, 1164, 962, -1.1, 7, 6.8, 7.15, 1.7, 0.72);
  hatchFill(trunkRight(1108), 1108, 626, 1164, 962, 0.35, 6, 7.0, 7.25, 1.6, 0.65);
  for (let i = 0; i < 6; i++) { const x = 1050 + i * 12, P = []; for (let j = 0; j <= 6; j++) P.push([x + Math.sin(j * 1.7 + i) * 4, 650 + j * 48 + (i % 2) * 20]); curve(P, 6.75 + i * 0.04, 0.12, 1.3, 0.45, { clip: clipPoly(TRUNK), snd: 0.4 }); }

// ── rendering ────────────────────────────────────────────────────────────────
const graphite = surface(), gctx = graphite.getContext('2d');   // black marks, alpha = darkness
const tinted = surface(), tctx = tinted.getContext('2d');
const page = surface(), pg = page.getContext('2d');             // paper + graphite, in screen space

// visible part of a stroke at time t, with this boil frame's drift and ripple applied
function strokeOutline(s, t, frame) {
  const shown = s.ease(span(t, s.t0, s.t0 + s.dur));
  if (shown <= 0) return null;
  const src = s.dyn ? s.dyn(t) : s.pts, end = shown * (src.length - 1), whole = Math.floor(end);
  const driftX = s.boil * (2 * noise3(s.id, frame, 11) - 1), driftY = s.boil * (2 * noise3(s.id, frame, 23) - 1);
  const phase = 6.283 * noise3(s.id, frame, 37);
  const moved = i => {
    const ripple = 0.6 * s.boil * Math.sin(0.35 * i + phase);
    return [src[i][0] + driftX + ripple, src[i][1] + driftY - ripple / 2];
  };
  const out = [];
  for (let i = 0; i <= whole; i++) out.push(moved(i));
  if (whole < src.length - 1 && end > whole) {
    const a = out[whole], b = moved(whole + 1), f = end - whole;
    out.push([mix(a[0], b[0], f), mix(a[1], b[1], f)]);
  }
  return out;
}
function strokePolyline(c, pts) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.stroke();
}
function paintStroke(c, s, t, frame) {
  const pts = strokeOutline(s, t, frame);
  if (!pts) return;
  c.save();
  if (s.clip) s.clip(c);
  c.lineWidth = s.w; c.globalAlpha = 0.75 * s.a;
  strokePolyline(c, pts);
  // the hand presses harder mid-stroke: a thinner second pass over the middle 70 %
  const from = Math.floor(0.15 * pts.length), to = Math.ceil(0.85 * pts.length);
  if (to - from > 1) { c.lineWidth = 0.55 * s.w; c.globalAlpha = 0.45 * s.a; strokePolyline(c, pts.slice(from, to)); }
  c.restore();
}
// handwriting: the text is uncovered left to right, then gone over once more, slightly offset
function paintNote(c, n, t, frame) {
  const k = span(t, n.t0, n.t1);
  if (k <= 0) return;
  c.save();
  c.font = `700 ${n.size}px ${SCRIPT_FONT}`;
  const width = c.measureText(n.txt).width;
  c.translate(n.x + 1.6 * (noise3(n.x, frame, 41) - 0.5), n.y + 1.6 * (noise3(n.y, frame, 53) - 0.5));
  c.rotate(n.rot);
  c.beginPath(); c.rect(-10, -n.size, inOutCubic(k) * (width + 20), 1.5 * n.size); c.clip();
  c.fillStyle = '#000';
  c.globalAlpha = n.a; c.fillText(n.txt, 0, 0);
  c.globalAlpha = 0.38 * n.a; c.fillText(n.txt, 1.5, -1);
  c.restore();
}
// blending stump: soft tone rubbed into the shaded side of the trunk, under the deck and on the ground
function paintSmudge(c, t) {
  const k = inOutCubic(span(t, 7.0, 7.8));
  if (k <= 0) return;
  c.save();
  clipPoly(TRUNK)(c);
  c.globalAlpha = 0.4 * k;
  const side = c.createLinearGradient(1050, 0, 1140, 0);
  [[0, 0], [0.5, 0.35], [1, 0.85]].forEach(([at, v]) => side.addColorStop(at, `rgba(0, 0, 0, ${v})`));
  c.fillStyle = side; c.fillRect(1020, 600, 130, 370);
  const under = c.createLinearGradient(0, DY + DECK.th, 0, DY + 110);
  under.addColorStop(0, 'rgba(0, 0, 0, 0.7)'); under.addColorStop(1, 'rgba(0, 0, 0, 0)');
  c.fillStyle = under; c.fillRect(1020, DY + DECK.th, 130, 90);
  c.restore();
  c.save();
  c.globalAlpha = 0.55 * k; c.filter = 'blur(12px)'; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(1240, GY + 20, 210, 16, 0, 0, Math.PI * 2); c.fill();
  c.restore();
}

// camera: close on the thumbnail column following the pencil down, then a pull-back and a slow lean-in
function camera(t) {
  const out = inOutCubic(span(t, 3.2, 4.35));
  const followY = mix(mix(300, 560, inOutCubic(span(t, 1.05, 1.5))), 800, inOutCubic(span(t, 1.75, 2.25)));
  const zoom = mix(2, 1, out) * (1 + 0.025 * cosEase(span(t, 4.35, 8.9)));
  const halfW = SW / (2 * zoom), halfH = SH / (2 * zoom);
  const fx = clamp(mix(0, SW / 2, out), halfW, SW - halfW), fy = clamp(mix(followY, SH / 2, out), halfH, SH - halfH);
  return { zoom, dx: SW / 2 - fx * zoom, dy: SH / 2 - fy * zoom };
}

function composePage(t, frame) {
  const cam = camera(t);
  const toView = c => c.setTransform(cam.zoom, 0, 0, cam.zoom, cam.dx, cam.dy);
  // graphite marks, then keep only what the tooth holds
  gctx.setTransform(1, 0, 0, 1, 0, 0);
  gctx.clearRect(0, 0, SW, SH);
  toView(gctx);
  gctx.strokeStyle = '#000'; gctx.lineCap = 'round'; gctx.lineJoin = 'round';
  for (const s of strokes) paintStroke(gctx, s, t, frame);
  for (const n of notes) paintNote(gctx, n, t, frame);
  paintSmudge(gctx, t);
  gctx.globalCompositeOperation = 'destination-in';
  gctx.drawImage(toothLayer, 0, 0);
  gctx.globalCompositeOperation = 'source-over';
  // paper under the same camera, then the marks coloured cool dark grey and multiplied in
  toView(pg);
  pg.drawImage(paperLayer, 0, 0);
  pg.setTransform(1, 0, 0, 1, 0, 0);
  tctx.globalCompositeOperation = 'copy';
  tctx.drawImage(graphite, 0, 0);
  tctx.globalCompositeOperation = 'source-in';
  tctx.fillStyle = '#1d1e24'; tctx.fillRect(0, 0, SW, SH);
  pg.globalCompositeOperation = 'multiply';
  pg.drawImage(tinted, 0, 0);
  pg.globalCompositeOperation = 'source-over';
}

// page turn: a fold line moves in from the bottom-right corner. Beyond it the next page shows;
// the folded flap is the cut-off corner mirrored across the fold, showing the paper's back.
function liftCorner(k, t) {
  const tilt = Math.atan2(1, 1.25) + 0.05 * Math.sin(2.2 * t);
  const nx = Math.cos(tilt), ny = Math.sin(tilt);               // fold normal, toward the corner
  const reach = 40 + 460 * k, px = SW - nx * reach, py = SH - ny * reach;
  const halfPlane = (c, dir) => {                               // dir +1: corner side, -1: page side
    const far = 4000, ax = -ny * far, ay = nx * far, bx = dir * nx * far, by = dir * ny * far;
    c.beginPath(); c.moveTo(px + ax, py + ay); c.lineTo(px - ax, py - ay);
    c.lineTo(px - ax + bx, py - ay + by); c.lineTo(px + ax + bx, py + ay + by); c.closePath();
  };
  const c = screen;
  // revealed page, shaded next to the fold
  c.save(); halfPlane(c, 1); c.clip();
  c.drawImage(nextPage, 0, 0);
  const crease = c.createLinearGradient(px, py, px + 140 * nx, py + 140 * ny);
  crease.addColorStop(0, 'rgba(30, 25, 20, 0.32)'); crease.addColorStop(1, 'rgba(30, 25, 20, 0)');
  c.fillStyle = crease; c.fillRect(0, 0, SW, SH);
  c.restore();
  // remaining page with the flap on top of it
  c.save(); halfPlane(c, -1); c.clip();
  c.drawImage(page, 0, 0);
  const rxx = 1 - 2 * nx * nx, rxy = -2 * nx * ny, ryy = 1 - 2 * ny * ny;   // reflection matrix
  c.save();
  c.transform(rxx, rxy, rxy, ryy, px - (rxx * px + rxy * py), py - (rxy * px + ryy * py));
  c.beginPath(); c.rect(0, 0, SW, SH); c.clip();
  halfPlane(c, 1);
  c.shadowColor = 'rgba(20, 15, 10, 0.42)'; c.shadowBlur = 36;
  c.fillStyle = '#e5e1d7'; c.fill();
  c.shadowColor = 'rgba(0, 0, 0, 0)';
  c.clip();
  c.globalAlpha = 0.06; c.drawImage(page, 0, 0); c.globalAlpha = 1;     // drawing faintly through the sheet
  c.setTransform(1, 0, 0, 1, 0, 0);
  const sheen = c.createLinearGradient(px, py, px - 220 * nx, py - 220 * ny);
  sheen.addColorStop(0, 'rgba(255, 255, 255, 0)');
  sheen.addColorStop(0.3, 'rgba(255, 255, 255, 0.3)');
  sheen.addColorStop(1, 'rgba(120, 110, 95, 0.14)');
  c.fillStyle = sheen; c.fillRect(0, 0, SW, SH);
  c.restore();
  c.restore();
}

function frameAt(t) {
  composePage(t, Math.floor(12 * t));     // lines re-wobble 12 times a second
  screen.setTransform(1, 0, 0, 1, 0, 0);
  const lift = inOutCubic(span(t, 8.9, 9.75));
  if (lift > 0) liftCorner(lift, t); else screen.drawImage(page, 0, 0);
  const shown = Math.min(outCubic(span(t, 0, 0.45)), 1 - inOutCubic(span(t, 9.55, 10)));
  if (shown < 1) {
    screen.fillStyle = `rgba(22, 21, 24, ${(1 - shown) * (t < 1 ? 0.9 : 1)})`;
    screen.fillRect(0, 0, SW, SH);
  }
}

// sound cues for audio.py: k kind, t start (s), d duration (s), v weight, p stereo pan
window.events = () => {
  const panOf = x => Number(((x / SW - 0.5) * 0.7).toFixed(2));
  const r3 = v => Number(v.toFixed(3));
  const cues = strokes.map(s => {
    const P = s.dyn ? s.dyn(s.t0) : s.pts, meanX = P.reduce((sum, q) => sum + q[0], 0) / P.length;
    return { k: 'scr', t: r3(s.t0), d: r3(s.dur), v: r3(s.snd * Math.min(1, (s.w * s.a) / 2.6)), p: panOf(meanX) };
  });
  notes.forEach(n => cues.push({ k: 'write', t: n.t0, d: r3(n.t1 - n.t0), v: r3(n.size / 64), p: panOf(n.x + 0.2 * n.size * n.txt.length) }));
  cues.push({ k: 'lift', t: 8.9, d: 0.85 });
  return cues.sort((p, q) => p.t - q.t);
};
window.draw = ({ t, q }) => {
  frameAt(t);
  return screen.canvas.toDataURL('image/jpeg', q || 0.92).split(',')[1];
};
window.ready = document.fonts.load(`700 92px ${SCRIPT_FONT}`, 'Treehouse — ideas this one! tiny flag cedar planks rope ladder 2 m 123?')
  .then(() => document.fonts.ready)
  .then(() => { makePaper(); buildThumbs(); buildMain(); frameAt(0); });
