<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── greek-pottery · Greek black-figure amphora ────────────────────────────────────────────────
// A neck amphora turns in a museum spotlight. Its bands (palmette chain, tongues, meander, rays) spin and lock
// like a combination dial; the body frieze shows four runners in profile, black silhouettes with incised detail and
// added red, while horses gallop the other way in the lower band and the meander "track" runs beneath the runners.
// The vase then unrolls into a flat frieze (a cylinder-to-plane rollout), the camera follows the leader past the
// turning post (an owl watches from the capital), he wins, and a laurel grows around the painted title.
// Rendering: every band is painted into one wrap-around texture (u = angle around the vase, v = height); each frame
// the frieze and horse rows are redrawn, then a per-pixel sampler projects the texture onto the surface of
// revolution (with a blend towards the flat rollout) and shades it (clay satin, glossy glaze highlights).
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const sstep = u => u * u * (3 - 2 * u);
const eBack = u => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

// ── palette ──
const CLAY = '#d27a41', INC = '#dc8a55', GLAZE = '#16100c', RED = '#8e3321', WHITE = '#eadcc0';

// ── texture space ──
const S = 2;                       // texels per unit
const TW = 2080, R0 = TW / TAU;    // u-units around the vase; R0 = design radius of the frieze
const VH = 960;                    // vase height in units
const TWt = TW * S, THt = VH * S;
const VASE_TOP = 60;               // screen y of the lip at zoom 1

// vase profile r(y)
const PROF = [[0, 124], [10, 131], [40, 127], [47, 103], [70, 96], [130, 94], [200, 104], [240, 140], [265, 190], [300, 250], [345, 300], [420, 330], [500, 327], [590, 302], [680, 258], [760, 200], [830, 142], [868, 110], [890, 100], [903, 112], [930, 156], [948, 166], [960, 166]];
function monotone(P) {
  const n = P.length, xs = P.map(p => p[0]), ys = P.map(p => p[1]), d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));

  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) { if (d[i] === 0) { m[i] = m[i + 1] = 0; continue; } const a = m[i] / d[i], b = m[i + 1] / d[i]; const s = a * a + b * b; if (s > 9) { const tt = 3 / Math.sqrt(s); m[i] = tt * a * d[i]; m[i + 1] = tt * b * d[i]; } }

    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1]; };
}
const rOf = monotone(PROF);
// pattern bands: id, y0, y1, design radius Rb (the band is painted in arc units, stretched by R0/Rb into u)
const BANDS = [[1, 52, 222, 100], [2, 252, 336, 250], [3, 346, 640, R0], [4, 640, 700, 285], [5, 712, 812, 215], [6, 822, 878, 135]];
const Rrow = new Float32Array(THt), dRrow = new Float32Array(THt), RFrow = new Float32Array(THt), BIDrow = new Uint8Array(THt);

  if (!id) { let pa = null, pb = null; for (const b of BANDS) { if (b[2] <= y) pa = b; if (b[1] > y && !pb) pb = b; }

// ── canvases ──
function mk(w, h, rf = false) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d', { willReadFrequently: rf })]; }
const FZ0 = 346, FZ1 = 640, HS0 = 712, HS1 = 812;
const [fzC, fz] = mk(TWt, (FZ1 - FZ0) * S, true);
const [hsC, hs] = mk(TWt, (HS1 - HS0) * S, true);
const [vaseC, vctx] = mk(W, H);
const vaseImg = vctx.createImageData(W, H), out32 = new Uint32Array(vaseImg.data.buffer);
let tex, tex32, noiseF;
const [bgC, bg] = mk(W, H);
const grains = [];

// ── drawing helpers ──
function path(g, P, closed = true) { // Catmull-Rom through points; a 3rd value of 0 makes a sharp corner
  const n = P.length; g.moveTo(P[0][0], P[0][1]);

}
const BASE = [1, 0, 0, 1, 0, 0];
// a black-figure "part": clay incision halo, then glaze fill (incision separates overlapping silhouettes)
function part(g, build, inc = 1.3) {
  g.beginPath(); build(); g.save(); g.setTransform(...BASE); g.lineJoin = 'round';
  g.lineWidth = inc * 2 * S; g.strokeStyle = INC; g.stroke(); g.fillStyle = GLAZE; g.fill(); g.restore();
}
function incise(g, fn, w = 1.1, col = INC) { g.beginPath(); fn(); g.save(); g.setTransform(...BASE); g.lineCap = 'round'; g.lineWidth = w * S; g.strokeStyle = col; g.stroke(); g.restore(); }

// ── palmette / lotus ornaments ──

    g.beginPath(); g.moveTo(x + Math.cos(a) * h * .12, y + Math.sin(a) * h * .12);
    g.quadraticCurveTo(x + Math.cos(a) * len * .7 + px * w, y + Math.sin(a) * len * .7 + py * w, tx, ty);
    g.quadraticCurveTo(x + Math.cos(a) * len * .7 - px * w, y + Math.sin(a) * len * .7 - py * w, x + Math.cos(a) * h * .12, y + Math.sin(a) * h * .12);

function lotus(g, x, y, h) {

function spiralTendril(g, x0, y0, x1, y1, r, sgn) {
  g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2, y1 + 12, x1, y1);
  const cx = x1, cy = y1 - r;
  for (let a = 0; a <= TAU * 1.15; a += .1) { const rr = r * (1 - a / (TAU * 1.35)), an = Math.PI / 2 - sgn * a; g.lineTo(cx + rr * Math.cos(an), cy + rr * Math.sin(an)); }

}

// ── static bands (painted once) ──
function paintStatic(g) {
  g.setTransform(S, 0, 0, S, 0, 0);
  g.fillStyle = CLAY; g.fillRect(0, 0, TW, VH);
  g.fillStyle = GLAZE;
  for (const [a, b] of [[0, 46], [52, 58], [216, 252], [336, 346], [643, 647], [693, 697], [700, 712], [812, 822], [878, 905], [909, 960]]) g.fillRect(0, a, TW, b - a);
  // neck: palmette–lotus chain (arc units, Rb 100)
  band(g, 100, (gg, L) => { const N = 6, P = L / N;
    for (let i = -1; i <= N; i++) { const x = i * P;
      palmette(gg, x, 198, 98, 9, 2.3); lotus(gg, x + P / 2, 198, 74);
      gg.beginPath(); gg.moveTo(x + 8, 200); gg.bezierCurveTo(x + P * .2, 214, x + P * .3, 214, x + P / 2 - 7, 200); gg.moveTo(x + P / 2 + 7, 200); gg.bezierCurveTo(x + P * .7, 214, x + P * .8, 214, x + P - 8, 200);
      gg.strokeStyle = GLAZE; gg.lineWidth = 3; gg.stroke(); } });
  // shoulder: tongues, alternating glaze and added red
  band(g, 250, (gg, L) => { const N = 88, P = L / N;
    for (let i = 0; i <= N; i++) { const x = i * P + 1.4, w = P - 2.8; gg.beginPath(); gg.moveTo(x, 252); gg.lineTo(x, 312); gg.arc(x + w / 2, 312, w / 2, Math.PI, 0, true); gg.lineTo(x + w, 252); gg.closePath();
      gg.fillStyle = i % 2 ? RED : GLAZE; gg.fill(); } });
  // meander (key) band, Rb 285
  band(g, 285, (gg, L) => { const N = 41, P = L / N; gg.strokeStyle = GLAZE; gg.lineWidth = 5.2; gg.lineJoin = 'miter'; gg.lineCap = 'butt';
    for (let i = -1; i <= N; i++) { const x = i * P, s = P / 44; gg.beginPath();
      gg.moveTo(x, 688); gg.lineTo(x + P, 688);
      gg.moveTo(x + 3 * s, 688); gg.lineTo(x + 3 * s, 653); gg.lineTo(x + 38 * s, 653); gg.lineTo(x + 38 * s, 680); gg.lineTo(x + 15 * s, 680); gg.lineTo(x + 15 * s, 664); gg.lineTo(x + 27 * s, 664); gg.lineTo(x + 27 * s, 671);
      gg.stroke(); } });

  band(g, 135, (gg, L) => { const N = 30, P = L / N;
    for (let i = -1; i <= N; i++) { const x = i * P; gg.beginPath(); gg.moveTo(x + P * .08, 878); gg.quadraticCurveTo(x + P * .42, 850, x + P / 2, 826); gg.quadraticCurveTo(x + P * .58, 850, x + P * .92, 878); gg.closePath(); gg.fillStyle = GLAZE; gg.fill(); } });

// paint a band in arc units: the context is stretched by R0/Rb so that it wraps exactly once
function band(g, Rb, fn) { const L = TAU * Rb; g.save(); g.setTransform(S * R0 / Rb, 0, 0, S, 0, 0); fn(g, L); g.restore(); }

// ── noise (periodic in u) ──
function buildNoise() {
  const r = rng(77); const mkLat = (cu, cv_) => { const a = new Float32Array(cu * cv_); for (let i = 0; i < a.length; i++) a[i] = r(); return a; };
  const layers = [[52, 30, .2], [208, 120, .17], [832, 240, .12]];

  for (let j = 0; j < THt; j++) {
    for (let li = 0; li < layers.length; li++) {
      const [cu, cvv, amp] = layers[li], L = lats[li], fy = j / THt * (cvv - 1), y0 = fy | 0, ty = sstep(fy - y0);
      for (let i = 0; i < TWt; i++) { const fx = i / TWt * cu, x0 = fx | 0, tx = sstep(fx - x0), x1 = (x0 + 1) % cu;

function writeTex(data, row0, rows) { // copy canvas pixels into the texture, modulated by the firing mottle
  const base = row0 * TWt;

    tex[q] = data[s] * f; tex[q + 1] = data[s + 1] * f; tex[q + 2] = data[s + 2] * f; tex[q + 3] = 255; }
}

// ── figures ──
const GY = 628; // frieze ground line
function legPose(psi, v) {
  const th = lerp(0.08 + 0.62 * Math.sin(psi), 0, v);
  const kf = lerp(0.22 + 1.35 * Math.pow(Math.max(0, Math.cos(psi + 0.35)), 1.3), 0.04, v);
  const pf = lerp(0.18 + 0.5 * Math.max(0, Math.cos(psi + 0.35)), 0.02, v);
  return { th, sa: th - kf, pf };
}
function runnerGeom(phase, v, lean) {
  const phi = TAU * phase, legs = [], arms = [];
  for (const [side, off] of [['near', 0], ['far', Math.PI]]) {
    const L = legPose(phi + off, v); if (v > 0) L.th += (side === 'near' ? .13 : -.1) * v, L.sa += (side === 'near' ? .1 : -.1) * v;
    const knee = [Math.sin(L.th) * 64, Math.cos(L.th) * 64], d = [Math.sin(L.sa), Math.cos(L.sa)];
    const ankle = [knee[0] + d[0] * 58, knee[1] + d[1] * 58], perp = [d[1], -d[0]];
    const f = [perp[0] * Math.cos(L.pf) + d[0] * Math.sin(L.pf), perp[1] * Math.cos(L.pf) + d[1] * Math.sin(L.pf)];
    const heel = [ankle[0] - perp[0] * 5 + d[0] * 4, ankle[1] - perp[1] * 5 + d[1] * 4], toe = [ankle[0] + f[0] * 24 + d[0] * 3, ankle[1] + f[1] * 24 + d[1] * 3];

  const hd = (x, y) => { const c = Math.cos(headA), s = Math.sin(headA); return [hc[0] + x * c - y * s, hc[1] + x * s + y * c]; };
  const TORSO = [[9, 5], [13, -16], [11, -33], [17, -48], [20, -60], [15, -73], [7, -80], [-5, -85], [-14, -79], [-17, -64], [-12, -45], [-10, -31], [-13, -17], [-20, -4], [-16, 8], [-4, 13]];

        let p = 0;

            const nh = Math.max(0, nx * Hx + ny * Hy + nz * Hz); let n8 = nh * nh; n8 *= n8; n8 *= n8; let n64 = n8 * n8; n64 *= n64; n64 *= n64;

}

// handles: straps in planes through the axis, projected; drawn behind or in front of the body
const HANDLES = [60, 60 + TW / 2];
function handlePts(st, uh) {
  const th = TAU * (uh - st.uc) / TW, s = Math.sin(th), c = Math.cos(th), z = st.zoom;
  const P = [[rOf(112) - 4, 112], [rOf(112) + 70, 86], [248, 150], [rOf(292) - 6, 292]];
  const pts = []; for (let i = 0; i <= 40; i++) { const u = i / 40, m = 1 - u;
    const d = m * m * m * P[0][0] + 3 * m * m * u * P[1][0] + 3 * m * u * u * P[2][0] + u * u * u * P[3][0];
    const y = m * m * m * P[0][1] + 3 * m * m * u * P[1][1] + 3 * m * u * u * P[2][1] + u * u * u * P[3][1];
    pts.push([960 + d * s * z, (y - st.camY) * z + 540]); }
  return { pts, s, c };
}
function drawHandle(st, uh, front) {
  const { pts, s, c } = handlePts(st, uh); if ((c > 0) !== front || st.handleA <= 0) return;
  const z = st.zoom; ctx.save(); ctx.globalAlpha = st.handleA; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const line = (w, col, dx = 0) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0] + dx, p[1]) : ctx.moveTo(p[0] + dx, p[1])); ctx.lineWidth = w; ctx.strokeStyle = col; ctx.stroke(); };
  const w = (15 + 13 * Math.abs(c)) * z;
  line(w, '#0e0a08'); line(w * .45, 'rgba(120,100,90,0.10)', -w * .18); line(w * .12, `rgba(255,236,214,${.18 + .2 * Math.max(0, -s)})`, -w * .26);
  ctx.restore();
}

// ── background ──
function paintBackground() {
  const g = bg; const gr = g.createRadialGradient(960, 470, 60, 960, 520, 1150);
  gr.addColorStop(0, '#4a3326'); gr.addColorStop(.35, '#2c1d15'); gr.addColorStop(1, '#0c0806'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const r = rng(5), id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - .5) * 7; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  // plinth top
  const pl = g.createLinearGradient(0, 1016, 0, 1080); pl.addColorStop(0, '#3a291e'); pl.addColorStop(.06, '#23170f'); pl.addColorStop(1, '#120c08');
  g.fillStyle = pl; g.fillRect(0, 1016, W, 64);
  for (let i = 0; i < 3; i++) { const [c, gx] = mk(W / 2, H / 2); const im = gx.createImageData(W / 2, H / 2); const rr = rng(100 + i);
    for (let p = 0; p < im.data.length; p += 4) { const v = 128 + (rr() - .5) * 90; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; }
    gx.putImageData(im, 0, 0); grains.push(c); }
}

// ── frame ──
let lastText = [];
window.draw = ({ t }) => {
  T = t; const st = state(t), offs = bandOffsets(t);
  lastText = paintFrieze(t); writeTex(fz.getImageData(0, 0, fzC.width, fzC.height).data, FZ0 * S, fzC.height);
  paintHorses(t); writeTex(hs.getImageData(0, 0, hsC.width, hsC.height).data, HS0 * S, hsC.height);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const z = st.zoom; ctx.save(); ctx.translate(960, 540); ctx.scale(z, z); ctx.translate(-960, -540 - (st.camY - 480)); ctx.drawImage(bgC, 0, 0); ctx.restore();
  // contact shadow under the foot
  { const fy = (VH - st.camY) * z + 540, a = 1 - seg(st.k, 0, .3); if (a > 0) { ctx.save(); ctx.globalAlpha = a; const sg = ctx.createRadialGradient(960, fy, 10, 960, fy, 300 * z); sg.addColorStop(0, 'rgba(0,0,0,.75)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.setTransform(1, 0, 0, .12, 0, fy * .88); ctx.fillStyle = sg; ctx.fillRect(0, fy - 400 * z, W, 800 * z); ctx.restore(); } }
  for (const uh of HANDLES) drawHandle(st, uh, false);
  renderVase(st, offs); ctx.drawImage(vaseC, 0, 0);
  for (const uh of HANDLES) drawHandle(st, uh, true);
  // grain (refreshed 12×/s), vignette, fades
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .1; ctx.imageSmoothingEnabled = true; ctx.drawImage(grains[Math.floor(t * 12) % 3], 0, 0, W, H); ctx.restore();
  const vg = ctx.createRadialGradient(960, 540, 420, 960, 540, 1180); vg.addColorStop(0, 'rgba(10,6,4,0)'); vg.addColorStop(1, `rgba(10,6,4,${lerp(.55, .42, sstep(st.k))})`); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - eOut(seg(t, 0, .9)), eInOut(seg(t, 9.3, 10)));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};

window.events = () => {
  const ev = [];
  [.15, .35, .55, .75].forEach((t0, i) => { ev.push({ t: t0, k: 'spin', d: .7, v: 1 - i * .1 }); ev.push({ t: t0 + 1.25 * .62, k: 'lock', v: 1 - i * .12 }); });
  for (let i = 0; i < 2; i++) { const R = RUNNERS[i]; let prev = null;
    for (let t = 0; t < T_STOP; t += .002) { const ph = R.ph + RUN_F * dist(t), c = Math.floor(ph * 2 + .5); if (prev !== null && c !== prev) ev.push({ t, k: 'step', v: i === 0 ? 1 : .6, p: i === 0 ? .1 : -.25 }); prev = c; } }
  for (let t = 0.4; t < 6.6; t += 1 / 2.1 / 3) ev.push({ t, k: 'hoof', v: .35 });
  ev.push({ t: 4.95, k: 'whoosh', d: 2.0 });
  ev.push({ t: 6.35, k: 'hoot' });
  ev.push({ t: 7.3, k: 'wreath' });
  ev.push({ t: 7.72, k: 'grow', d: 1.3 });

  const saved = T; T = 99; const times = paintFrieze(9.5); T = saved;
  for (const bt of times) ev.push({ t: bt, k: 'brush' });
  ev.push({ t: 8.45, k: 'chord' });
  return ev.sort((a, b) => a.t - b.t);
};

window.ready = (async () => {
  await document.fonts.load('700 44px Cinzel'); await document.fonts.load('600 13px Cinzel'); await document.fonts.ready;
  const [sc, sg] = mk(TWt, THt, true); paintStatic(sg);
  tex = new Uint8ClampedArray(TWt * THt * 4); tex32 = new Uint32Array(tex.buffer);
  buildNoise(); writeTex(sg.getImageData(0, 0, TWt, THt).data, 0, THt);
  sc.width = 1;
  paintBackground();
})();
</script>
