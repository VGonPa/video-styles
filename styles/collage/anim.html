<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── collage · flat editorial mixed-media scrapbook ──────────────────────────────────────
// Cream sheet: a typewriter label, then ransom-note cutout letters slap on one by one — MADE / BY / HAND —
// taped down; halftone-printed cutouts (scissors, flower, coffee cup, cassette) pile up with crayon doodles.
// The sheet rips in two and reveals a cobalt spread: "in a world of PERFECT PIXELS" (the pixels are the only
// crisp, jitter-free thing in the film) — a red crayon crosses them out, a halftone megaphone lands, and a
// taped note card says "keep it human." A kraft sheet slides up to cover the page and the film fades out.
// All paper moves at 12 steps/s with per-step jitter (stop-motion); pieces slap on with overshoot and settle.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3), eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const deg = d => d * Math.PI / 180;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const STEP = 12;                                           // paper moves on a 12 fps stop-motion clock
const six = t => Math.floor(t * STEP + 1e-4), stp = t => six(t) / STEP;

const RED = '#d9442e', BLUE = '#2150a8', MUST = '#e5a82e', CREAM = '#f1e7d2', INK = '#1c1815', KRAFT = '#b98d5b', CORE = '#fbf8ef', NEWS = '#e8e2d4';
const fnt = (font, size) => { const m = font.match(/^(.*?)("[^"]+")$/); return `${m[1]}${size}px ${m[2]}`; };
const F = { abril: '"Abril Fatface"', anton: '"Anton"', alfa: '"Alfa Slab One"', arch: '"Archivo Black"', play: '"Playfair Display"', brush: '"Caveat Brush"', mono: '"Courier Prime"' };

// ── textures ──
let NOISE, NOISEPAT, CRAYPAT, BG1, BG2, KRAFTBG, GRAIN = [], VIG, DOOD;
function buildNoise() {
  const n = mk(512, 512), x = n.getContext('2d'), d = x.createImageData(512, 512), r = rng(3);
  for (let i = 0; i < d.data.length; i += 4) { const v = 222 + r() * 33; d.data[i] = v; d.data[i + 1] = v - 2; d.data[i + 2] = v - 6; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0);
  for (let i = 0; i < 300; i++) { x.strokeStyle = `rgba(${r() < .5 ? '120,95,60' : '255,255,250'},${.12 + r() * .2})`; x.lineWidth = .6 + r() * .6;
    const a = r() * 512, b = r() * 512, th = r() * TAU, l = 6 + r() * 18; x.beginPath(); x.moveTo(a, b); x.quadraticCurveTo(a + Math.cos(th + 1) * l * .5, b + Math.sin(th + 1) * l * .5, a + Math.cos(th) * l, b + Math.sin(th) * l); x.stroke(); }
  NOISE = n; NOISEPAT = ctx.createPattern(n, 'repeat');
  const c = mk(128, 128), y = c.getContext('2d'), e = y.createImageData(128, 128);
  for (let i = 0; i < e.data.length; i += 4) { const v = r(); e.data[i + 3] = v < .22 ? 255 : v < .35 ? 120 : 0; }
  y.putImageData(e, 0, 0); CRAYPAT = ctx.createPattern(c, 'repeat');
}
// multiply paper grain over a sprite while keeping its alpha
function texturize(c, amt = 1, seed = 1) {
  const x = c.getContext('2d'), keep = mk(c.width, c.height); keep.getContext('2d').drawImage(c, 0, 0);
  const r = rng(seed); x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'multiply'; x.globalAlpha = amt; x.translate(-r() * 512, -r() * 512);
  x.fillStyle = NOISEPAT; x.fillRect(0, 0, c.width + 512, c.height + 512); x.restore();
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'destination-in'; x.drawImage(keep, 0, 0); x.restore();
}
function paperBG(color, seed, mott = .07) {
  const c = mk(W, H), x = c.getContext('2d'), r = rng(seed); x.fillStyle = color; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 40; i++) { const bx = r() * W, by = r() * H, br = 150 + r() * 420, g = x.createRadialGradient(bx, by, 0, bx, by, br);
    const col = r() < .5 ? '90,60,30' : '255,250,235'; g.addColorStop(0, `rgba(${col},${mott * r()})`); g.addColorStop(1, `rgba(${col},0)`); x.fillStyle = g; x.fillRect(0, 0, W, H); }
  x.globalCompositeOperation = 'multiply'; x.fillStyle = NOISEPAT; x.fillRect(0, 0, W, H); x.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 900; i++) { x.strokeStyle = `rgba(${r() < .6 ? '255,252,240' : '70,45,20'},${.05 + r() * .09})`; x.lineWidth = .7;
    const a = r() * W, b = r() * H, th = r() * TAU, l = 5 + r() * 22; x.beginPath(); x.moveTo(a, b); x.quadraticCurveTo(a + Math.cos(th + .8) * l * .5, b + Math.sin(th + .8) * l * .5, a + Math.cos(th) * l, b + Math.sin(th) * l); x.stroke(); }
  return c;
}
function buildGrain() {
  const r = rng(77);
  for (let k = 0; k < 6; k++) { const g = mk(960, 540), x = g.getContext('2d'), d = x.createImageData(960, 540);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() - .5) * 70; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    x.putImageData(d, 0, 0); GRAIN.push(g); }
  VIG = mk(W, H); const v = VIG.getContext('2d'), g = v.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, '#fff'); g.addColorStop(1, '#d6c8ad'); v.fillStyle = g; v.fillRect(0, 0, W, H);
  DOOD = mk(W, H);
}

// ── paper pieces: scissor-cut or torn (white core + fibres) ──
const NRM = [[0, -1], [1, 0], [0, 1], [-1, 0]];
function tornOutline(w, h, torn, r, cornerJ = 5) {
  const cj = () => (r() - .5) * cornerJ, C = [[cj(), cj()], [w + cj(), cj()], [w + cj(), h + cj()], [cj(), h + cj()]];
  const outer = [], inner = [], fib = [];
  for (let e = 0; e < 4; e++) {
    const [ax, ay] = C[e], [bx, by] = C[(e + 1) % 4], L = Math.hypot(bx - ax, by - ay), n = Math.max(2, Math.ceil(L / 5)), [nx, ny] = NRM[e];
    let off = 0, ins = 3;
    for (let i = 0; i < n; i++) {
      const u = i / n, px = lerp(ax, bx, u), py = lerp(ay, by, u);
      if (torn[e]) { off = off * .72 + (r() - .5) * 6 + (r() < .04 ? (r() - .5) * 12 : 0); ins = clamp(ins * .78 + r() * 2.4 + (r() < .08 ? r() * 5 : 0), 1.2, 11); }
      else { off = 0; ins = 0; }
      const ox = px + nx * off, oy = py + ny * off; outer.push([ox, oy]); inner.push([ox - nx * ins, oy - ny * ins]);
      if (torn[e] && r() < .55) fib.push([ox, oy, nx, ny]);
    }
  }
  return { outer, inner, fib };
}
const polyPath = pts => { const p = new Path2D(); pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); p.closePath(); return p; };
function paperPiece({ w, h, color, torn = [0, 0, 0, 0], seed = 1, content, core = CORE, tex = 1 }) {
  const P = 26, c = mk(w + 2 * P, h + 2 * P), x = c.getContext('2d'), r = rng(seed); x.translate(P, P);
  if (torn === 'all') torn = [1, 1, 1, 1];
  const o = tornOutline(w, h, torn, r);
  x.fillStyle = core; x.fill(polyPath(o.outer));
  x.strokeStyle = 'rgba(255,254,248,.9)'; x.lineWidth = .9;
  for (const [a, b, nx, ny] of o.fib) { const l = 1.5 + r() * 5, tj = (r() - .5) * 4; x.beginPath(); x.moveTo(a - nx, b - ny); x.lineTo(a + nx * l - ny * tj, b + ny * l + nx * tj); x.stroke(); }
  x.save(); x.clip(polyPath(o.inner)); x.fillStyle = color; x.fillRect(-10, -10, w + 20, h + 20); if (content) content(x, w, h, r); x.restore();
  texturize(c, tex, seed);
  return { c, w, h, P };
}
// cut-around shape (glyph / halftone print) with a white scissor-cut border
function borderAround(src, border, paper = CORE, seed = 1) {
  const P = border + 16, c = mk(src.width + 2 * P, src.height + 2 * P), x = c.getContext('2d');
  const m = mk(src.width, src.height), mx = m.getContext('2d'); mx.drawImage(src, 0, 0); mx.globalCompositeOperation = 'source-in'; mx.fillStyle = paper; mx.fillRect(0, 0, m.width, m.height);
  const r = rng(seed), k = 18; // slightly polygonal border = scissor facets
  for (let a = 0; a < k; a++) { const th = a / k * TAU + r() * .2; for (const rr of [border, border * .6, border * .3]) x.drawImage(m, P + Math.cos(th) * rr, P + Math.sin(th) * rr); }
  return { c, x, P };
}
function glyphPiece({ ch, font, size, color, seed = 1, border = 12 }) {
  const t = mk(10, 10).getContext('2d'); t.font = fnt(font, size); const m = t.measureText(ch);
  const gw = Math.ceil(m.actualBoundingBoxLeft + m.actualBoundingBoxRight) + 8, gh = Math.ceil(m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) + 8;
  const g = mk(gw, gh), gx = g.getContext('2d'); gx.font = fnt(font, size); gx.fillStyle = color; gx.fillText(ch, m.actualBoundingBoxLeft + 4, m.actualBoundingBoxAscent + 4);
  const { c, x, P } = borderAround(g, border, CORE, seed); x.drawImage(g, P, P); texturize(c, 1, seed);
  return { c, w: gw, h: gh, P };
}
function letterPiece({ ch, font, size, fg, bg, torn, seed, pad = 20, news = false, stripes = false }) {
  const t = mk(10, 10).getContext('2d'); t.font = fnt(font, size); const m = t.measureText(ch);
  const gw = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gh = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const r0 = rng(seed + 5), w = Math.round(gw + pad * 2 + r0() * 14), h = Math.round(gh + pad * 2 + r0() * 14);
  return paperPiece({ w, h, color: bg, torn, seed, content: (x, w, h) => {
    if (news) { x.fillStyle = 'rgba(40,30,20,.13)'; for (let yy = 4; yy < h; yy += 7) for (let xx = (yy / 7 % 2) * 3.5; xx < w; xx += 7) { x.beginPath(); x.arc(xx, yy, 1.6, 0, TAU); x.fill(); } }
    if (stripes) { x.fillStyle = 'rgba(255,255,255,.14)'; for (let xx = -h; xx < w; xx += 22) { x.beginPath(); x.moveTo(xx, 0); x.lineTo(xx + 10, 0); x.lineTo(xx + 10 + h * .5, h); x.lineTo(xx + h * .5, h); x.fill(); } }
    x.font = fnt(font, size); x.fillStyle = fg; x.fillText(ch, (w - gw) / 2 + m.actualBoundingBoxLeft, (h - gh) / 2 + m.actualBoundingBoxAscent);
  } });
}
function stripPiece(txt, { size = 40, color = CORE, fg = INK, seed = 1, torn = [0, 1, 0, 1], font = `700 ${40}px ${F.mono}` } = {}) {
  const t = mk(10, 10).getContext('2d'); t.font = font; t.letterSpacing = '2px'; const tw = t.measureText(txt).width;
  return paperPiece({ w: Math.round(tw + 44), h: Math.round(size * 1.55), color, torn, seed, content: (x, w, h) => {
    x.font = font; x.letterSpacing = '2px'; x.fillStyle = fg; x.textBaseline = 'middle'; x.fillText(txt, 22, h / 2 + 2);
    x.globalAlpha = .18; x.fillText(txt, 23.2, h / 2 + 2.6); x.globalAlpha = 1; } });   // uneven typewriter ink
}
function makeTape(len, seed) {
  const h = 44, P = 6, c = mk(len + 2 * P, h + 2 * P), x = c.getContext('2d'), r = rng(seed); x.translate(P, P);
  const pts = []; const zz = (x0, dir) => { const out = []; for (let y = 0; y <= h; y += 4) out.push([x0 + dir * (r() * 5), y]); return out; };
  pts.push(...zz(0, 1)); const right = zz(len, -1).reverse(); const p = new Path2D();
  p.moveTo(pts[0][0], 0); p.lineTo(right[right.length - 1][0], 0); right.reverse().forEach(([a, b]) => p.lineTo(a, b));
  p.lineTo(pts[pts.length - 1][0], h); pts.slice().reverse().forEach(([a, b]) => p.lineTo(a, b)); p.closePath();
  x.save(); x.clip(p); x.fillStyle = 'rgba(234,221,184,0.74)'; x.fillRect(-5, -5, len + 10, h + 10);
  for (let i = 0; i < 14; i++) { x.fillStyle = `rgba(${r() < .5 ? '255,250,230' : '150,125,80'},${.05 + r() * .07})`; x.fillRect(0, r() * h, len, .8 + r() * 2.5); }
  for (let i = 0; i < 5; i++) { x.strokeStyle = 'rgba(255,250,235,.25)'; x.lineWidth = 1; const a = r() * len; x.beginPath(); x.moveTo(a, 0); x.lineTo(a + (r() - .5) * 30, h); x.stroke(); }
  x.fillStyle = 'rgba(140,110,60,.12)'; x.fillRect(0, 0, len, 2); x.fillRect(0, h - 2, len, 2); x.restore();
  return { c, w: len, h, P };
}
// ── halftone "printed photo" cutouts: grayscale vector render → rotated dot screen + misregistered spot colour ──
function halftone({ w, h, draw, spot = null, spotOff = [5, 4], sp = 9, ang = 45, border = 13, seed = 1 }) {
  const tone = mk(w, h), tx = tone.getContext('2d'); draw(tx);
  const d = tx.getImageData(0, 0, w, h).data;
  const { c, x, P } = borderAround(tone, border, CORE, seed);
  if (spot) { const s = mk(w, h), sx = s.getContext('2d'); sx.drawImage(tone, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = spot; sx.fillRect(0, 0, w, h);
    x.globalAlpha = .92; x.drawImage(s, P + spotOff[0], P + spotOff[1]); x.globalAlpha = 1; }
  const ca = Math.cos(deg(ang)), sa = Math.sin(deg(ang)), R = Math.hypot(w, h) / 2 + sp;
  x.fillStyle = INK; x.beginPath();
  for (let gv = -R; gv < R; gv += sp) for (let gu = -R; gu < R; gu += sp) {
    const px = w / 2 + gu * ca - gv * sa, py = h / 2 + gu * sa + gv * ca; if (px < 0 || py < 0 || px >= w || py >= h) continue;
    const i = ((py | 0) * w + (px | 0)) * 4; if (d[i + 3] < 110) continue;
    const dark = 1 - (d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11) / 255; if (dark < .05) continue;
    const rr = sp * .64 * Math.sqrt(dark); x.moveTo(P + px + rr, P + py); x.arc(P + px, P + py, rr, 0, TAU);
  }
  x.fill(); texturize(c, .8, seed);
  return { c, w, h, P };
}
const lg = (x, x0, y0, x1, y1, stops) => { const g = x.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const rg = (x, cx, cy, r0, r1, stops) => { const g = x.createRadialGradient(cx, cy, r0, cx, cy, r1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; };
const OBJ = {
  scissors: x => {
    x.lineCap = 'round';
    const blade = (pts, flip) => { x.fillStyle = lg(x, 300, 110 + flip * 60, 300, 190 - flip * 60, [[0, '#f4f4f4'], [.35, '#b8b8b8'], [.6, '#6a6a6a'], [1, '#d0d0d0']]); x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.fill(); };
    blade([[240, 132], [300, 166], [552, 214], [548, 206], [322, 128]], 1);
    x.strokeStyle = lg(x, 150, 0, 300, 0, [[0, '#2a2a2a'], [1, '#777']]); x.lineWidth = 30;
    x.beginPath(); x.moveTo(170, 188); x.lineTo(300, 150); x.stroke(); x.beginPath(); x.moveTo(170, 112); x.lineTo(300, 150); x.stroke();
    blade([[240, 168], [300, 134], [552, 86], [548, 94], [322, 172]], -1);
    for (const cy of [92, 208]) { x.strokeStyle = rg(x, 112, cy - 12, 10, 90, [[0, '#8a8a8a'], [1, '#1d1d1d']]); x.lineWidth = 30; x.beginPath(); x.ellipse(112, cy, 76, 56, 0, 0, TAU); x.stroke();
      x.strokeStyle = 'rgba(255,255,255,.5)'; x.lineWidth = 6; x.beginPath(); x.ellipse(112, cy, 76, 56, 0, 3.6, 4.6); x.stroke(); }
    x.fillStyle = rg(x, 296, 146, 2, 16, [[0, '#fff'], [1, '#555']]); x.beginPath(); x.arc(300, 150, 14, 0, TAU); x.fill();
  },
  flower: x => {
    x.lineCap = 'round'; x.strokeStyle = lg(x, 140, 0, 160, 0, [[0, '#333'], [.5, '#8a8a8a'], [1, '#3a3a3a']]); x.lineWidth = 16;
    x.beginPath(); x.moveTo(150, 470); x.bezierCurveTo(140, 390, 168, 300, 150, 190); x.stroke();
    for (const [lx, ly, a, s] of [[196, 360, -.55, 1], [108, 300, .6, -1]]) { x.save(); x.translate(lx, ly); x.rotate(a); x.fillStyle = lg(x, 0, -26, 0, 26, [[0, '#cfcfcf'], [.5, '#666'], [1, '#2b2b2b']]);
      x.beginPath(); x.moveTo(-s * 52, 0); x.quadraticCurveTo(0, -30, s * 52, 0); x.quadraticCurveTo(0, 30, -s * 52, 0); x.fill(); x.restore(); }
    for (let i = 0; i < 14; i++) { x.save(); x.translate(150, 150); x.rotate(i / 14 * TAU); x.fillStyle = rg(x, 0, -40, 4, 90, [[0, '#ffffff'], [.6, '#e2e2e2'], [1, '#8f8f8f']]);
      x.beginPath(); x.ellipse(0, -78, 25, 62, 0, 0, TAU); x.fill(); x.strokeStyle = 'rgba(0,0,0,.25)'; x.lineWidth = 2; x.stroke(); x.restore(); }
    x.fillStyle = rg(x, 138, 138, 4, 48, [[0, '#6b6b6b'], [1, '#101010']]); x.beginPath(); x.arc(150, 150, 44, 0, TAU); x.fill();
  },
  cup: x => {
    x.fillStyle = rg(x, 200, 290, 20, 200, [[0, '#f6f6f6'], [.7, '#bdbdbd'], [1, '#6a6a6a']]); x.beginPath(); x.ellipse(200, 300, 190, 50, 0, 0, TAU); x.fill();
    x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 3; x.beginPath(); x.ellipse(200, 296, 120, 26, 0, 0, TAU); x.stroke();
    x.strokeStyle = lg(x, 330, 140, 390, 240, [[0, '#999'], [1, '#2e2e2e']]); x.lineWidth = 22; x.beginPath(); x.ellipse(336, 190, 44, 52, 0, -1.4, 1.5); x.stroke();
    x.fillStyle = lg(x, 70, 0, 330, 0, [[0, '#5a5a5a'], [.25, '#f7f7f7'], [.45, '#e6e6e6'], [.85, '#8a8a8a'], [1, '#3a3a3a']]);
    x.beginPath(); x.moveTo(70, 110); x.lineTo(330, 110); x.bezierCurveTo(328, 200, 310, 280, 250, 292); x.lineTo(150, 292); x.bezierCurveTo(90, 280, 72, 200, 70, 110); x.fill();
    x.fillStyle = '#e8e8e8'; x.beginPath(); x.ellipse(200, 110, 130, 30, 0, 0, TAU); x.fill();
    x.fillStyle = rg(x, 170, 108, 5, 120, [[0, '#6b6b6b'], [1, '#161616']]); x.beginPath(); x.ellipse(200, 113, 116, 22, 0, 0, TAU); x.fill();
  },
  cassette: x => {
    const rr = (a, b, w, h, r) => { x.beginPath(); x.roundRect(a, b, w, h, r); };
    x.fillStyle = lg(x, 0, 0, 0, 280, [[0, '#9a9a9a'], [1, '#474747']]); rr(4, 4, 432, 272, 20); x.fill();
    x.fillStyle = '#f2f2f2'; rr(34, 26, 372, 158, 8); x.fill();
    x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 2.5; for (const y of [48, 64]) { x.beginPath(); x.moveTo(52, y); x.lineTo(388, y); x.stroke(); }
    x.fillStyle = '#232323'; rr(118, 88, 204, 72, 30); x.fill();
    for (const cx of [168, 272]) { x.fillStyle = rg(x, cx - 6, 118, 2, 30, [[0, '#fff'], [1, '#8a8a8a']]); x.beginPath(); x.arc(cx, 124, 26, 0, TAU); x.fill();
      x.fillStyle = '#222'; for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; x.fillRect(cx + Math.cos(a) * 11 - 3, 124 + Math.sin(a) * 11 - 3, 6, 6); } }
    x.fillStyle = lg(x, 0, 200, 0, 272, [[0, '#7a7a7a'], [1, '#3a3a3a']]); x.beginPath(); x.moveTo(96, 204); x.lineTo(344, 204); x.lineTo(324, 272); x.lineTo(116, 272); x.fill();
    x.fillStyle = '#1a1a1a'; for (const cx of [150, 290]) { x.beginPath(); x.arc(cx, 240, 9, 0, TAU); x.fill(); }
    x.fillStyle = '#ddd'; for (const [a, b] of [[20, 20], [420, 20], [20, 260], [420, 260], [220, 236]]) { x.beginPath(); x.arc(a, b, 6, 0, TAU); x.fill(); }
  },
  megaphone: x => {

// ── stop-motion placement: slap on (overshoot, settle) + per-step jitter ──

// ── doodles: marker / crayon strokes that draw on, boil per step, waxy gaps ──
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }

  if (u <= 0) return;

  const r = rng(seed * 31 + six(t)), d = DOOD.getContext('2d'); d.setTransform(1, 0, 0, 1, 0, 0); d.clearRect(0, 0, W, H);
  d.setTransform(x.getTransform()); d.lineCap = 'round'; d.lineJoin = 'round'; d.strokeStyle = color;
  const jx = (r() - .5) * 2, jy = (r() - .5) * 2;

    for (const [pw, oa] of crayon ? [[w, 1], [w * .55, .8]] : [[w, 1]]) {
      d.lineWidth = pw; d.globalAlpha = oa; d.beginPath(); let L = left; d.moveTo(pts[0][0] + jx, pts[0][1] + jy);

const wobble = (pts, amp, seed) => { const r = rng(seed); return pts.map(([a, b]) => [a + (r() - .5) * amp, b + (r() - .5) * amp]); };

function drawTearHalf(x, top, dx, dy, rot, pivY) {
  const outline = TEARL.map(([a, b, d1, d2]) => [a, b + (top ? d1 : -d2)]), face = TEARL.map(([a, b]) => [a, b]);
  const ends = top ? [[W + 80, -H], [-80, -H]] : [[W + 80, 2 * H], [-80, 2 * H]];
  x.save(); x.translate(W / 2 + dx, pivY + dy); x.rotate(rot); x.translate(-W / 2, -pivY);
  const core = polyPath([...outline, ...ends]);
  x.save(); x.shadowColor = 'rgba(30,18,6,.45)'; x.shadowBlur = 22; x.shadowOffsetX = 8; x.shadowOffsetY = 14; x.fillStyle = CORE; x.fill(core); x.restore();
  x.strokeStyle = 'rgba(255,254,248,.95)'; x.lineWidth = 1; x.beginPath();
  TEARL.forEach(([a, b, d1, d2, q], i) => { if (i % 2) return; const yy = b + (top ? d1 : -d2), l = 1 + q * 6; x.moveTo(a, yy); x.lineTo(a + (q - .5) * 5, yy + (top ? l : -l)); }); x.stroke();
  x.save(); x.clip(polyPath([...face, ...ends])); x.drawImage(S1C, 0, 0); x.restore();
  x.restore();
}
function render(t) {
  const x = ctx; x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  const ts = stp(t);
  if (t < T.split) {
    const s = S1C.getContext('2d'); s.setTransform(1, 0, 0, 1, 0, 0); scene1(s, t); x.drawImage(S1C, 0, 0);
    if (t >= T.tear) {   // the rip runs across the sheet: a white torn fringe opens left → right
      const u = eInOut(seg(ts, T.tear, T.split - 1 / STEP)), xm = -60 + u * (W + 120);
      x.save(); x.beginPath(); x.rect(-100, 0, xm + 100, H); x.clip();
      x.fillStyle = 'rgba(30,18,6,.55)'; x.beginPath(); TEARL.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); TEARL.slice().reverse().forEach(([a, b]) => x.lineTo(a, b + 2)); x.fill();
      x.fillStyle = CORE; x.beginPath(); TEARL.forEach(([a, b, d1], i) => i ? x.lineTo(a, b - d1 * .7) : x.moveTo(a, b - d1 * .7)); TEARL.slice().reverse().forEach(([a, b, d1, d2]) => x.lineTo(a, b + d2 * .7)); x.fill();
      x.restore();
      if (u > 0 && u < 1) { const i = clamp(Math.floor((xm + 60) / 7), 0, TEARL.length - 1); const [a, b] = TEARL[i];   // hand-less "pull": a lifted corner flap
        x.save(); x.translate(a, b); x.rotate(deg(-18)); x.fillStyle = CORE; x.shadowColor = 'rgba(0,0,0,.3)'; x.shadowBlur = 10; x.shadowOffsetY = 6; x.beginPath(); x.moveTo(-40, 0); x.lineTo(10, -6); x.lineTo(-6, 18); x.fill(); x.restore(); }
    }
  } else {
    scene2(x, t);
    if (t < T.splitEnd) { const u = seg(ts, T.split, T.splitEnd), e = u < .12 ? -u * .25 : Math.pow((u - .12) / .88, 2);
      drawTearHalf(x, true, -60 * e, -820 * e, deg(-8 * e), 0); drawTearHalf(x, false, 80 * e, 860 * e, deg(6 * e), H); }
  }
  // kraft cover sheet slides up (stepped)
  if (t >= T.cover) { const u = eOut(seg(ts, T.cover, T.coverEnd)), k = six(t) - six(T.cover), r = rng(500 + six(t));
    const y = lerp(H + 60, -40, u) + (u < 1 ? (r() - .5) * 3 : 0);
    x.save(); x.translate(-60 + (r() - .5) * 2, y); x.rotate(deg((1 - u) * 3 + (r() - .5) * .3));
    x.shadowColor = 'rgba(30,18,6,.5)'; x.shadowBlur = 28; x.shadowOffsetY = -10; x.drawImage(COVER.c, -COVER.P, -COVER.P); x.restore();
    if (t >= T.coverEnd - .15) { const a = seg(stp(t), T.coverEnd - .05, T.coverEnd + .2); x.save(); x.globalAlpha = a; x.translate(W / 2, H / 2 + 40); x.rotate(deg(-3)); x.fillStyle = RED; x.font = `150px ${F.brush}`; x.textAlign = 'center'; x.fillText('made by hand.', 0, 0); x.restore(); }
  }
  // finish: vignette, stepped grain, fades
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'multiply'; x.drawImage(VIG, 0, 0);
  x.globalCompositeOperation = 'overlay'; x.globalAlpha = .2; x.drawImage(GRAIN[six(t) % 6], 0, 0, W, H); x.globalAlpha = 1;
  x.globalCompositeOperation = 'source-over';
  const fade = Math.max(1 - seg(t, 0, .35), seg(t, T.fadeA, T.fadeB));
  if (fade > 0) { x.fillStyle = `rgba(20,14,9,${fade})`; x.fillRect(0, 0, W, H); }
}

window.ready = (async () => {
  await Promise.all([`250px ${F.abril}`, `250px ${F.anton}`, `250px ${F.alfa}`, `250px ${F.arch}`, `italic 900 250px ${F.play}`, `100px ${F.brush}`, `700 40px ${F.mono}`]
    .map(f => document.fonts.load(f, 'MADEBYHANDPERFECTPIXELS inaworldofkeepithuman.NOTE TO SELF: 01-')));
  await document.fonts.ready;
  buildNoise(); buildGrain(); BG1 = paperBG(CREAM, 1, .08); BG2 = paperBG(BLUE, 2, .12); build();
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const hit = t0 => (six(t0) + 2) / STEP, ev = [];
  const all = [...S1, ...S2.filter(i => i.t >= 0), CARD];
  for (const it of all) { ev.push({ t: hit(it.t), k: 'slap', v: it.pc.w > 400 ? 1 : .75 });
    if (it.tapes) for (const tp of it.tapes) ev.push({ t: (six(it.t) + (tp[4] ?? 2)) / STEP, k: 'tape' });
    if (it.staple) ev.push({ t: hit(it.t) + .02, k: 'staple' }); if (it.clip) ev.push({ t: (six(it.t) + 1) / STEP, k: 'clip' }); }
  ev.push({ t: hit(T.card + 3 / STEP), k: 'slap', v: .5 });
  ev.push({ t: T.scissors - .25, k: 'snip' }, { t: T.scissors - .1, k: 'snip' });
  for (const [a, d, kind] of [[T.underline, .34, 'crayon'], [T.arrow, .3, 'marker'], [T.steam, .38, 'marker'], [T.stars, .3, 'crayon'], [T.strike, .36, 'crayon'], [T.shout, .24, 'marker'], [T.note, .3, 'marker'], [T.cardLine, .33, 'crayon']]) ev.push({ t: a, k: kind, d });
  ev.push({ t: T.tear, k: 'rip', d: T.split - T.tear + .1 }, { t: T.split, k: 'whoosh', d: .6 });
  for (let i = 0; i < PIX.length; i += 4) ev.push({ t: PIX[i].t, k: 'blip', f: 880 + (i % 12) * 60 });
  ev.push({ t: T.cover, k: 'slide', d: T.coverEnd - T.cover }, { t: T.coverEnd, k: 'chord' });
  return ev.sort((a, b) => a.t - b.t);
};
