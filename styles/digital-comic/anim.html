<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── digital-comic · early-2000s digitally coloured comic: airbrushed gloss, rim lights, flares, glow FX ──
// "VOLTA" switches on the new power grid of Neo-Meridian. A widescreen comic page: the dark city at
// 11:59 PM, a helmet close-up whose visor powers on ("LEAVE IT TO ME."), a hologram reading GRID OFFLINE,
// then VOLTA descends through a storm, gathering lightning in a raised fist until the energy breaks the
// panel border. White-out into a full-bleed splash: the hero lands, KRA-THOOM!, a shockwave rolls out,
// power surges race along the plaza into the skyline and the city lights up. He rises; an anamorphic
// flare wipes to a glossy chrome title card: VOLTA / THE CITY IS ON.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const sInOut = u => u * u * (3 - 2 * u);
const back = (u, s = 1.9) => { u = clamp(u); const c3 = s + 1; return 1 + c3 * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hh = x => { const s = Math.sin(x * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const L2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];

// ── palette & type ──
const INK = '#05060c';
const CYAN = '#5ff4ff', ELEC = '#b8fbff', GOLD = '#ffc83a';
const SFXF = 'Bangers', LOGOF = 'Orbitron', CAPF = '"Exo 2"', BALF = '"Comic Neue"';

// ── timeline ──
const T = {
  capA: 0.35, capB: 0.85, toP2: [1.45, 1.85], visor: 2.0, balloon: 2.2, toP3: [2.9, 3.3],
  charge: 3.3, brk: 3.72, pushIn: [3.55, 4.2], white: 4.2, splash: 4.24, impact: 4.52,
  surge: 4.72, cityOn: [5.05, 6.35], capS: 5.55, rise: [6.0, 6.85], beam: 6.2,
  wipe: [6.8, 7.3], title: 7.12, slam: 7.2, glint: [7.95, 8.55], tag: 8.05, sub: 8.55, end: [9.35, 10.0],
};

// ── page layout (world units) ──
const PAGE = { w: 1920, h: 1820 };
const P1 = { x: 60, y: 60, w: 1800, h: 560 }, P2a = { x: 60, y: 650, w: 885, h: 440 }, P2b = { x: 975, y: 650, w: 885, h: 440 }, P3 = { x: 60, y: 1120, w: 1800, h: 640 };
const HERO3 = { x: 1180, y: 612, s: 1.04 };               // hero in panel 3 (local)

let SKY, CITYD, CITYL, CITYLB, NOISE, SFX, LOGO, HEXP, CLOUDS3, SHARDS = [], DEBRIS = [], CITYB = [], VIGN;

// ════════════════════════════ textures, built once ════════════════════════════
function buildSky() {
  SKY = mk(2000, 1100); const g = SKY.getContext('2d');
  let gr = g.createLinearGradient(0, 0, 0, 1100);
  gr.addColorStop(0, '#030616'); gr.addColorStop(0.35, '#0b1540'); gr.addColorStop(0.62, '#23205a'); gr.addColorStop(0.8, '#512a6c'); gr.addColorStop(0.93, '#a2477a'); gr.addColorStop(1, '#e0757a');
  g.fillStyle = gr; g.fillRect(0, 0, 2000, 1100);
  const r = rng(7);
  for (let i = 0; i < 260; i++) { const x = r() * 2000, y = r() * 600, a = r() * 0.6 * (1 - y / 700); g.fillStyle = `rgba(220,235,255,${a})`; g.fillRect(x, y, r() < .1 ? 2.4 : 1.4, r() < .1 ? 2.4 : 1.4); }
  // airbrushed cloud banks
  for (let i = 0; i < 70; i++) {
    const x = r() * 2000, y = 380 + r() * 520, rx = 160 + r() * 380, ry = 26 + r() * 50;
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    const cg = g.createRadialGradient(0, 0, 0, 0, 0, rx); const warm = y > 700;
    cg.addColorStop(0, warm ? 'rgba(255,140,150,0.16)' : 'rgba(120,120,200,0.12)'); cg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = cg; g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
  }
}
function buildCity() {
  const CW = 2600, CH = 720; CITYD = mk(CW, CH); CITYL = mk(CW, CH);
  const d = CITYD.getContext('2d'), l = CITYL.getContext('2d'); const r = rng(61);
  const B = [];
  const layers = [{ n: 46, hmin: 120, hmax: 330, wmin: 60, wmax: 140, k: 0 }, { n: 34, hmin: 170, hmax: 470, wmin: 80, wmax: 170, k: 1 }, { n: 22, hmin: 90, hmax: 300, wmin: 110, wmax: 220, k: 2 }];
  for (const Ly of layers) for (let i = 0; i < Ly.n; i++) {
    const w = lerp(Ly.wmin, Ly.wmax, r()), x = r() * (CW + 200) - 100; if (Math.abs(x + w / 2 - 1300) < 170 && Ly.k > 0) continue;
    B.push({ x, w, h: lerp(Ly.hmin, Ly.hmax, Math.pow(r(), 1.3)) * (1 - 0.35 * Math.abs(x - 1300) / 1500), k: Ly.k, top: Math.floor(r() * 4), seed: r() * 1000 });
  }
  B.push({ x: 1240, w: 120, h: 660, k: 1.5, top: 9, seed: 5 });   // the Grid Spire
  B.sort((a, b) => a.k - b.k);
  CITYB = B;
  for (const b of B) { drawBuilding(d, b, CH, false); drawBuilding(l, b, CH, true); }
  // lit bloom
  CITYLB = mk(CW / 2, CH / 2); const bg = CITYLB.getContext('2d'); bg.filter = 'blur(10px)'; bg.drawImage(CITYL, 0, 0, CW / 2, CH / 2);
  l.globalCompositeOperation = 'lighter'; l.globalAlpha = 0.4; l.drawImage(CITYLB, 0, 0, CW, CH); l.globalAlpha = 1; l.globalCompositeOperation = 'source-over';
}
function bldPath(g, b, CH) {
  const x = b.x, w = b.w, y = CH - b.h;
  g.beginPath();
  if (b.top === 9) {            // spire: tapering tower with a needle
    g.moveTo(x, CH); g.lineTo(x + 18, y + 120); g.lineTo(x + 40, y + 40); g.lineTo(x + w / 2 - 4, y); g.lineTo(x + w / 2 + 4, y); g.lineTo(x + w - 40, y + 40); g.lineTo(x + w - 18, y + 120); g.lineTo(x + w, CH);
  } else if (b.top === 1) { g.moveTo(x, CH); g.lineTo(x, y + 30); g.lineTo(x + w, y); g.lineTo(x + w, CH); }
  else if (b.top === 2) { g.moveTo(x, CH); g.lineTo(x, y + 40); g.lineTo(x + w * 0.2, y + 40); g.lineTo(x + w * 0.2, y); g.lineTo(x + w * 0.8, y); g.lineTo(x + w * 0.8, y + 40); g.lineTo(x + w, y + 40); g.lineTo(x + w, CH); }
  else if (b.top === 3) { g.moveTo(x, CH); g.lineTo(x, y + 20); g.quadraticCurveTo(x + w / 2, y - 20, x + w, y + 20); g.lineTo(x + w, CH); }
  else { g.moveTo(x, CH); g.lineTo(x, y); g.lineTo(x + w, y); g.lineTo(x + w, CH); }
  g.closePath();
}
function drawBuilding(g, b, CH, lit) {
  const r = rng(b.seed * 97 | 0), x = b.x, w = b.w, y = CH - b.h;
  const haze = b.k === 0 ? 0.55 : b.k === 1 ? 0.25 : b.k === 1.5 ? 0.15 : 0;
  // body: glass gradient, lit edge on the right
  const gr = g.createLinearGradient(x, 0, x + w, 0);
  if (lit) { gr.addColorStop(0, '#081028'); gr.addColorStop(0.7, '#0f1f48'); gr.addColorStop(0.94, '#23477e'); gr.addColorStop(1, '#6fd8ff'); }
  else { gr.addColorStop(0, '#05081a'); gr.addColorStop(0.75, '#0a1030'); gr.addColorStop(0.95, '#18204c'); gr.addColorStop(1, '#3a3b78'); }
  bldPath(g, b, CH); g.fillStyle = gr; g.fill();
  g.strokeStyle = INK; g.lineWidth = 2; g.stroke();
  g.save(); bldPath(g, b, CH); g.clip();
  // vertical gloss band (digital glass)
  const gb = g.createLinearGradient(x + w * 0.15, 0, x + w * 0.45, 0); gb.addColorStop(0, 'rgba(255,255,255,0)'); gb.addColorStop(0.5, lit ? 'rgba(160,220,255,0.12)' : 'rgba(140,150,255,0.05)'); gb.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gb; g.fillRect(x, y - 50, w, b.h + 50);
  // windows
  const ww = b.k === 2 ? 9 : 6, wh = b.k === 2 ? 13 : 9, sx = ww + (b.k === 2 ? 7 : 5), sy = wh + (b.k === 2 ? 9 : 7);
  for (let yy = y + 26; yy < CH - 10; yy += sy) for (let xx = x + 8; xx < x + w - 8 - ww; xx += sx) {
    const q = r();
    if (lit) { if (q < 0.58) { const c = r() < 0.8 ? `rgba(255,${220 + r() * 30 | 0},${160 + r() * 60 | 0},${0.65 + r() * 0.35})` : `rgba(140,240,255,${0.7 + r() * 0.3})`; g.fillStyle = c; g.fillRect(xx, yy, ww, wh); } }
    else if (q < 0.04) { g.fillStyle = 'rgba(255,200,140,0.35)'; g.fillRect(xx, yy, ww, wh); }
    else { g.fillStyle = 'rgba(70,80,140,0.18)'; g.fillRect(xx, yy, ww, wh); }
  }
  if (b.top === 9) {   // spire rings
    for (let i = 0; i < 6; i++) { const yy = y + 120 + i * 88; g.fillStyle = lit ? 'rgba(120,250,255,0.95)' : 'rgba(60,70,120,0.6)'; g.fillRect(x, yy, w, 6); }
  }
  if (haze) { g.fillStyle = `rgba(${lit ? '40,60,130' : '30,28,80'},${haze})`; g.fillRect(x, y - 50, w, b.h + 50); }
  g.restore();
  // hi-tech light strips and crowns in the lit version
  if (lit) {
    g.save(); g.globalCompositeOperation = 'lighter';
    g.strokeStyle = b.k === 0 ? 'rgba(90,200,255,0.35)' : 'rgba(110,240,255,0.9)'; g.lineWidth = b.k === 2 ? 3 : 2;
    g.beginPath(); g.moveTo(x + w - 1, CH); g.lineTo(x + w - 1, y + (b.top === 1 ? 2 : 20)); g.stroke();
    if (b.top === 9) { g.strokeStyle = 'rgba(200,255,255,1)'; g.lineWidth = 3; bldPath(g, b, CH); g.stroke(); }
    else { g.strokeStyle = r() < 0.5 ? 'rgba(255,190,90,0.8)' : 'rgba(120,240,255,0.8)'; g.beginPath(); g.moveTo(x + 2, y + (b.top === 1 ? 30 : b.top === 2 ? 40 : 20) + 4); g.lineTo(x + w - 2, y + (b.top === 1 ? 0 : b.top === 2 ? 40 : 20) + 4); g.stroke(); }
    g.restore();
  }
  // antenna
  if (b.k >= 1 && b.top !== 9 && hh(b.seed) < 0.35) { g.strokeStyle = INK; g.lineWidth = 3; g.beginPath(); g.moveTo(x + w * 0.6, y + (b.top === 3 ? -8 : 0)); g.lineTo(x + w * 0.6, y - 50); g.stroke(); b.ant = [x + w * 0.6, y - 50]; }
}
function buildNoise() {
  NOISE = mk(W, H); const g = NOISE.getContext('2d'); const im = g.createImageData(W, H); const r = rng(3);
  for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (r() - 0.5) * 34; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
  VIGN = mk(W, H); const v = VIGN.getContext('2d'); const vg = v.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1250); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,8,0.55)'); v.fillStyle = vg; v.fillRect(0, 0, W, H);
}
function buildHex() {
  HEXP = mk(W, H); const g = HEXP.getContext('2d'); const R = 34, dx = R * Math.sqrt(3), dy = R * 1.5;
  g.strokeStyle = 'rgba(120,220,255,0.10)'; g.lineWidth = 1.5;
  for (let j = -1; j < H / dy + 1; j++) for (let i = -1; i < W / dx + 1; i++) {
    const cx = i * dx + (j & 1) * dx / 2, cy = j * dy; g.beginPath();
    for (let k = 0; k < 6; k++) { const a = Math.PI / 6 + k * Math.PI / 3; g.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a)); } g.closePath(); g.stroke();
  }
}
function buildClouds3() {   // storm clouds for panel 3 (lit from above by the charge)
  CLOUDS3 = mk(1800, 640); const g = CLOUDS3.getContext('2d'); const r = rng(33);
  const gr = g.createLinearGradient(0, 0, 0, 640); gr.addColorStop(0, '#0a0826'); gr.addColorStop(0.55, '#1a1648'); gr.addColorStop(1, '#3a2460'); g.fillStyle = gr; g.fillRect(0, 0, 1800, 640);
  for (let i = 0; i < 150; i++) {
    const x = r() * 1800, y = r() * 460, rx = 90 + r() * 260, ry = rx * (0.35 + r() * 0.25);
    g.save(); g.translate(x, y); g.scale(1, ry / rx);
    const cg = g.createRadialGradient(-rx * 0.2, -rx * 0.35, rx * 0.1, 0, 0, rx);
    const lum = 0.35 + 0.65 * (1 - y / 460);
    cg.addColorStop(0, `rgba(${120 * lum + 40 | 0},${110 * lum + 50 | 0},${200 * lum + 40 | 0},0.55)`); cg.addColorStop(0.6, `rgba(40,34,100,0.35)`); cg.addColorStop(1, 'rgba(10,8,40,0)');
    g.fillStyle = cg; g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
  }
}
// beveled, extruded, glossy lettering (SFX and the logo), prebuilt
function bevelText(str, font, size, stops, ext, glow, opt = {}) {
  const tmp = mk(10, 10).getContext('2d'); tmp.font = `${font}`; const tw = tmp.measureText(str).width;
  const pad = 90, cw = Math.ceil(tw + pad * 2 + ext.d * Math.abs(ext.dx)), ch = Math.ceil(size * 1.35 + pad * 2 + ext.d * ext.dy);
  const c = mk(cw, ch), g = c.getContext('2d'); const x = pad + tw / 2, y = pad + size * 0.62;
  const setF = q => { q.font = font; q.textAlign = 'center'; q.textBaseline = 'middle'; q.lineJoin = 'round'; if (opt.ls) q.letterSpacing = opt.ls; };
  setF(g);
  // glow + block outline
  g.save(); g.shadowColor = glow; g.shadowBlur = 50; g.strokeStyle = INK; g.fillStyle = INK; g.lineWidth = opt.ow || 16;
  for (let i = ext.d; i >= 0; i -= 2) { g.strokeText(str, x + ext.dx * i, y + ext.dy * i); }
  g.restore();
  g.strokeStyle = INK; g.lineWidth = opt.ow || 16; for (let i = ext.d; i >= 0; i--) g.strokeText(str, x + ext.dx * i, y + ext.dy * i);
  // extrusion
  for (let i = ext.d; i >= 1; i--) { const u = i / ext.d; g.fillStyle = ext.col(u); g.fillText(str, x + ext.dx * i, y + ext.dy * i); }
  // face on its own layer: gradient + gloss + bevel rims
  const f = mk(cw, ch), fg = f.getContext('2d'); setF(fg);
  const gr = fg.createLinearGradient(0, y - size * 0.55, 0, y + size * 0.5); stops.forEach(([p, c]) => gr.addColorStop(p, c));
  fg.fillStyle = gr; fg.fillText(str, x, y);
  fg.globalCompositeOperation = 'source-atop';
  const hl = mk(cw, ch), hg = hl.getContext('2d'); setF(hg); hg.fillStyle = '#fff'; hg.fillText(str, x, y); hg.globalCompositeOperation = 'destination-out'; hg.fillText(str, x + 5, y + 6);
  fg.globalAlpha = 0.85; fg.drawImage(hl, 0, 0);
  const sh = mk(cw, ch), sg = sh.getContext('2d'); setF(sg); sg.fillStyle = '#000'; sg.fillText(str, x, y); sg.globalCompositeOperation = 'destination-out'; sg.fillText(str, x - 5, y - 6);
  fg.globalAlpha = 0.45; fg.drawImage(sh, 0, 0); fg.globalAlpha = 1;
  if (opt.gloss) { const gg = fg.createLinearGradient(0, y - size * 0.5, 0, y); gg.addColorStop(0, 'rgba(255,255,255,0.55)'); gg.addColorStop(1, 'rgba(255,255,255,0.05)');
    fg.fillStyle = gg; fg.beginPath(); fg.moveTo(0, 0); fg.lineTo(cw, 0); fg.lineTo(cw, y - size * 0.1); fg.quadraticCurveTo(cw / 2, y + size * 0.08, 0, y - size * 0.1); fg.closePath(); fg.fill(); }
  g.drawImage(f, 0, 0);
  g.strokeStyle = 'rgba(0,0,0,0.9)'; g.lineWidth = 2.5; g.strokeText(str, x, y);
  return { c, ox: x, oy: y };
}
function buildType() {
  SFX = bevelText('KRA-THOOM!', `205px ${SFXF}`, 205,
    [[0, '#fffbd0'], [0.3, '#ffe23a'], [0.62, '#ff8a00'], [1, '#d4200a']],
    { d: 20, dx: 0.7, dy: 1.0, col: u => `rgb(${lerp(140, 40, u) | 0},${lerp(24, 4, u) | 0},${lerp(10, 2, u) | 0})` }, 'rgba(255,120,20,0.9)', { gloss: true, ow: 18, ls: '6px' });
  LOGO = bevelText('VOLTA', `900 250px ${LOGOF}`, 250,
    [[0, '#ffffff'], [0.3, '#c6ddf5'], [0.47, '#48679c'], [0.5, '#15254a'], [0.6, '#3d78c4'], [0.84, '#e9f8ff'], [1, '#8fb6e2']],
    { d: 22, dx: 0.35, dy: 1.0, col: u => `rgb(${lerp(28, 6, u) | 0},${lerp(52, 10, u) | 0},${lerp(110, 30, u) | 0})` }, 'rgba(80,230,255,0.95)', { gloss: false, ow: 14, ls: '14px' });
}
function buildShards() {
  const r = rng(19);
  for (let i = 0; i < 26; i++) SHARDS.push({ x: (r() - 0.5) * 300, len: 14 + r() * 40, vx: (r() - 0.5) * 900, vy: -300 - r() * 700, rot: (r() - 0.5) * 18, side: r() < 0.5 });
  for (let i = 0; i < 56; i++) { const a = -Math.PI * (0.05 + 0.9 * r()); const sp = 500 + r() * 1300; const n = 5 + (r() * 3 | 0), pts = [];
    for (let k = 0; k < n; k++) { const aa = k / n * TAU, rr = (0.6 + r() * 0.4); pts.push([Math.cos(aa) * rr, Math.sin(aa) * rr]); }
    DEBRIS.push({ vx: Math.cos(a) * sp * (0.6 + r() * 0.8), vy: Math.sin(a) * sp * 0.8, s: 6 + Math.pow(r(), 2) * 34, rot: (r() - 0.5) * 20, pts, spark: r() < 0.35 }); }
}

// ════════════════════════════ FX helpers ════════════════════════════
function glow(g, x, y, r, col, a = 1) {
  if (a <= 0 || r <= 0) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.25, `rgba(${col},${a * 0.45})`); gr.addColorStop(1, `rgba(${col},0)`);
  g.save(); g.globalCompositeOperation = 'lighter'; g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); g.restore();
}
function jag(x1, y1, x2, y2, seed, disp, depth = 6) {
  const r = rng(seed); let P = [[x1, y1], [x2, y2]];
  for (let d = 0; d < depth; d++) { const Q = [P[0]]; for (let i = 1; i < P.length; i++) { const a = P[i - 1], b = P[i]; const nx = -(b[1] - a[1]), ny = b[0] - a[0]; const k = (r() - 0.5) * disp; Q.push([(a[0] + b[0]) / 2 + nx * k, (a[1] + b[1]) / 2 + ny * k], b); } P = Q; disp *= 0.62; }
  return P;
}
function bolt(g, P, w = 1, a = 1, col = '110,210,255') {
  if (a <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round'; g.lineCap = 'round';
  const path = new Path2D(); P.forEach(([x, y], i) => i ? path.lineTo(x, y) : path.moveTo(x, y));
  g.strokeStyle = `rgba(${col},${0.16 * a})`; g.lineWidth = 22 * w; g.stroke(path);
  g.strokeStyle = `rgba(${col},${0.5 * a})`; g.lineWidth = 8 * w; g.stroke(path);
  g.strokeStyle = `rgba(235,255,255,${a})`; g.lineWidth = 2.6 * w; g.stroke(path);
  g.restore();
}
function flare(g, x, y, s, a, streak = 1, ghosts = true) {
  if (a <= 0) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  glow(g, x, y, 260 * s, '120,200,255', 0.55 * a); glow(g, x, y, 70 * s, '255,255,255', 0.9 * a);
  // anamorphic streak
  g.save(); g.translate(x, y); g.scale(1, 0.018 * (1 + 0.6 * (1 - streak)));
  const sg = g.createRadialGradient(0, 0, 0, 0, 0, 1300 * s * streak); sg.addColorStop(0, `rgba(200,240,255,${0.9 * a})`); sg.addColorStop(0.3, `rgba(90,170,255,${0.4 * a})`); sg.addColorStop(1, 'rgba(40,80,255,0)');
  g.fillStyle = sg; g.beginPath(); g.arc(0, 0, 1300 * s * streak, 0, TAU); g.fill(); g.restore();

    g.save(); g.globalCompositeOperation = 'lighter'; g.strokeStyle = `rgba(170,240,255,${0.9 * (1 - u)})`; g.lineWidth = 26 * (1 - u) + 4; g.beginPath(); g.ellipse(IX, IY, R, R * EY, 0, 0, TAU); g.stroke();
    g.strokeStyle = `rgba(255,255,255,${0.9 * (1 - u)})`; g.lineWidth = 5; g.stroke(); g.restore();
    const u2 = clamp(ti / 0.7), R2 = eOut(u2) * 1100; g.save(); g.globalCompositeOperation = 'lighter'; const ag = g.createRadialGradient(IX, IY - 140, R2 * 0.8, IX, IY - 140, R2); ag.addColorStop(0, 'rgba(160,220,255,0)'); ag.addColorStop(0.8, `rgba(160,220,255,${0.22 * (1 - u2)})`); ag.addColorStop(1, 'rgba(160,220,255,0)'); g.fillStyle = ag; g.fillRect(-100, -100, W + 200, H + 200); g.restore();
    // airbrushed dust
    const du = clamp(ti / 1.8); for (let k = 0; k < 14; k++) { const a = Math.PI + k / 13 * Math.PI; const rr = 80 + eOut(du) * (300 + 200 * hh(k)); const x = IX + Math.cos(a) * rr * 1.6, y = IY + Math.sin(a) * rr * 0.35 - 20;
      const dg = g.createRadialGradient(x, y, 0, x, y, 130 + 100 * du); dg.addColorStop(0, `rgba(120,130,190,${0.28 * (1 - du)})`); dg.addColorStop(1, 'rgba(120,130,190,0)'); g.fillStyle = dg; g.fillRect(x - 240, y - 240, 480, 480); }
  }
  // the hero
  heroSplash(g, t);
  if (ti > 0) {
    // debris chunks thrown out, rim-lit
    for (const d of DEBRIS) { const u = ti; const x = IX + d.vx * u * 0.8, y = IY + d.vy * u + 1300 * u * u; if (y > H + 100) continue;
      g.save(); g.translate(x, y); g.rotate(d.rot * u);
      if (d.spark) { g.globalCompositeOperation = 'lighter'; g.strokeStyle = `rgba(255,220,140,${clamp(1 - u)})`; g.lineWidth = 3; g.beginPath(); g.moveTo(0, 0); g.lineTo(-d.vx * 0.03, -(d.vy + 2600 * u) * 0.03); g.stroke(); }
      else { const p = poly(d.pts.map(([a, b]) => [a * d.s, b * d.s])); g.fillStyle = INK; g.lineWidth = 5; g.strokeStyle = INK; g.stroke(p); const dg = g.createLinearGradient(-d.s, -d.s, d.s, d.s); dg.addColorStop(0, '#8fe8ff'); dg.addColorStop(0.25, '#2b3150'); dg.addColorStop(1, '#0b0d18'); g.fillStyle = dg; g.fill(p); }
      g.restore(); }
  }
  g.restore();
  // frame line
  g.strokeStyle = '#dfe6f2'; g.lineWidth = 3.5; g.strokeRect(F.x - 5, F.y - 5, F.w + 10, F.h + 10);
  // impact flare (breaks the frame)
  if (ti > 0) flare(g, IX + sx, IY + sy, 1.3, Math.exp(-ti * 1.8), 1 + ti);
  // SFX: pops with overshoot and breaks out of the frame
  const su = seg(t, T.impact + 0.03, T.impact + 0.33);
  if (su > 0) { const k = back(su, 2.6) * (1 + 0.02 * Math.sin(t * 40) * Math.exp(-(t - T.impact) * 3)); const out = eInOut(seg(t, T.rise[0] - 0.15, T.rise[0] + 0.4));
    g.save(); g.translate(1240 + sx * 0.5, 235 + sy * 0.5); g.rotate(-0.11); g.scale(k * (1 + out * 0.3), k * (1 + out * 0.3)); g.globalAlpha = 1 - out; g.drawImage(SFX.c, -SFX.ox, -SFX.oy); g.restore(); }
  captionBox(g, ['12:00 AM.', 'NEO-MERIDIAN GOES LIVE.'], 80, 740, 40, seg(t, T.capS, T.capS + 0.6));
}
function heroSplash(g, t) {
  const S = { L: [-0.62, -0.78], rim: '#c8fbff', rim2: '#48b8f0' };
  const lit = seg(t, T.cityOn[0], T.cityOn[1]);
  if (t < T.impact) {   // the dive: a streak of light with the hero inside it
    const u = seg(t, T.splash, T.impact); const y = lerp(80, LY, Math.pow(u, 1.5));
    g.save(); g.globalCompositeOperation = 'lighter'; const sg = g.createLinearGradient(0, y - 1100, 0, y - 150); sg.addColorStop(0, 'rgba(120,220,255,0)'); sg.addColorStop(1, 'rgba(200,250,255,0.8)'); g.fillStyle = sg; g.fillRect(LX - 90, y - 1100, 180, 950); g.restore();
    drawFigure(g, POSE.hover, { x: LX, y, s: FS, S, glow: 1, visor: 1 });
    return;
  }
  const ti = t - T.impact;
  const sq = Math.exp(-ti * 7) * Math.sin(ti * 18) * 0.06;   // landing squash settle
  const ru = eInOut(seg(t, T.rise[0], T.rise[1]));
  const P = lerpPose(POSE.land, POSE.stand, ru);
  g.save(); g.translate(LX, LY); g.scale(1 + sq * 0.5, 1 - sq); g.translate(-LX, -LY);
  // contact shadow + glossy floor reflection glow
  const cg = g.createRadialGradient(LX, LY + 4, 10, LX, LY + 4, 260); cg.addColorStop(0, 'rgba(0,0,0,0.7)'); cg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = cg; g.save(); g.translate(0, LY); g.scale(1, 0.18); g.fillRect(LX - 300, -300, 600, 600); g.restore();
  drawFigure(g, P, { x: LX, y: LY, s: FS, S, glow: 0.6 + 0.4 * Math.max(Math.exp(-ti * 2), lit * (0.6 + 0.4 * Math.sin(t * 6))), visor: 1 });
  g.restore();
}

// ════════════════════════════ title card ════════════════════════════
function titleCard(g, t) {
  const u = t - T.title;
  g.setTransform(1, 0, 0, 1, 0, 0);
  const bg = g.createRadialGradient(W / 2, H * 0.45, 50, W / 2, H * 0.5, 1200); bg.addColorStop(0, '#1d4fb8'); bg.addColorStop(0.4, '#0b1f5c'); bg.addColorStop(1, '#030716'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // rotating light rays
  g.save(); g.translate(W / 2, H * 0.44); g.rotate(u * 0.05); g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 18; k++) { g.rotate(TAU / 18); const rg = g.createLinearGradient(0, 0, 1300, 0); rg.addColorStop(0, 'rgba(120,200,255,0.16)'); rg.addColorStop(1, 'rgba(120,200,255,0)'); g.fillStyle = rg; g.beginPath(); g.moveTo(0, 0); g.lineTo(1300, -70); g.lineTo(1300, 70); g.closePath(); g.fill(); }
  g.restore();
  g.globalAlpha = 0.8; g.drawImage(HEXP, 0, 0); g.globalAlpha = 1;
  // lit skyline at the bottom
  const cs = 0.62, cx0 = W / 2 - 1300 * cs + 520 - u * 12; g.globalAlpha = 0.9; g.drawImage(CITYL, cx0, H - 720 * cs + 150, 2600 * cs, 720 * cs); g.globalAlpha = 1;
  const fg = g.createLinearGradient(0, H - 260, 0, H); fg.addColorStop(0, 'rgba(3,7,22,0)'); fg.addColorStop(1, 'rgba(3,7,22,0.85)'); g.fillStyle = fg; g.fillRect(0, H - 260, W, 260);
  // drifting sparks
  g.save(); g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 60; i++) { const x = hh(i) * W + Math.sin(u + i) * 20, y = ((hh(i + 50) * H - u * (40 + 60 * hh(i + 9))) % H + H) % H; g.fillStyle = `rgba(160,240,255,${0.3 + 0.5 * hh(i + 3)})`; g.beginPath(); g.arc(x, y, 1 + 2.5 * hh(i + 7), 0, TAU); g.fill(); } g.restore();
  // logo slam with overshoot
  const lu = seg(t, T.slam, T.slam + 0.45); const k = lu < 1 ? lerp(1.7, 1, back(lu, 1.6)) : 1; const drift = 1 + (t - T.slam) * 0.012;
  const LX0 = W / 2, LY0 = H * 0.42;
  g.save(); g.translate(LX0, LY0); g.scale(k * drift, k * drift); g.globalAlpha = clamp(lu * 4);
  g.drawImage(LOGO.c, -LOGO.ox, -LOGO.oy);
  // glint sweep across the chrome
  const gu = seg(t, T.glint[0], T.glint[1]);
  if (gu > 0 && gu < 1) { const tmp = GL.getContext('2d'); tmp.setTransform(1, 0, 0, 1, 0, 0); tmp.clearRect(0, 0, GL.width, GL.height); tmp.globalCompositeOperation = 'source-over'; tmp.drawImage(LOGO.c, 0, 0);
    tmp.globalCompositeOperation = 'source-atop'; const gx = lerp(-300, LOGO.c.width + 300, gu); const gg = tmp.createLinearGradient(gx - 120, 0, gx + 120, 0); gg.addColorStop(0, 'rgba(255,255,255,0)'); gg.addColorStop(0.5, 'rgba(255,255,255,0.9)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
    tmp.fillStyle = gg; tmp.save(); tmp.translate(gx, LOGO.c.height / 2); tmp.transform(1, 0, -0.5, 1, 0, 0); tmp.translate(-gx, -LOGO.c.height / 2); tmp.fillRect(gx - 120, 0, 240, LOGO.c.height); tmp.restore();
    g.globalCompositeOperation = 'lighter'; g.drawImage(GL, -LOGO.ox, -LOGO.oy); g.globalCompositeOperation = 'source-over'; }
  g.restore();
  if (gu > 0 && gu < 1) flare(g, LX0 - 480 + gu * 960, LY0 - 70, 0.55, Math.sin(gu * Math.PI) * 0.9, 1);
  // landing flash of the slam
  const fl = t > T.slam + 0.3 ? Math.exp(-(t - T.slam - 0.3) * 5) : 0; if (fl > 0.01) flare(g, LX0 + 250, LY0 - 90, 0.9, fl, 1.2);
  // tagline: letters stagger in, cyan underline grows
  const tag = 'THE CITY IS ON.'; g.save(); g.font = `italic 800 76px ${CAPF}`; g.textBaseline = 'alphabetic'; g.letterSpacing = '6px';
  const tw = g.measureText(tag).width; let x = W / 2 - tw / 2; const y = H * 0.42 + 205;
  for (let i = 0; i < tag.length; i++) { const cu = seg(t, T.tag + i * 0.03, T.tag + i * 0.03 + 0.3); const ch = tag[i]; const cw = g.measureText(ch).width;
    if (cu > 0) { g.save(); g.globalAlpha = clamp(cu * 2); g.translate(x, y + (1 - back(cu, 2)) * 40); g.fillStyle = INK; g.fillText(ch, 4, 5); const tg = g.createLinearGradient(0, -60, 0, 5); tg.addColorStop(0, '#ffffff'); tg.addColorStop(0.55, '#bff6ff'); tg.addColorStop(1, '#4fc8ff'); g.fillStyle = tg; g.fillText(ch, 0, 0); g.restore(); }
    x += cw; }
  g.restore();
  const bu = eOut(seg(t, T.tag + 0.35, T.tag + 0.9)); if (bu > 0) { g.save(); g.globalCompositeOperation = 'lighter'; const bw = 620 * bu; const lg = g.createLinearGradient(W / 2 - bw, 0, W / 2 + bw, 0); lg.addColorStop(0, 'rgba(90,230,255,0)'); lg.addColorStop(0.5, 'rgba(210,255,255,1)'); lg.addColorStop(1, 'rgba(90,230,255,0)'); g.fillStyle = lg; g.fillRect(W / 2 - bw, y + 26, 2 * bw, 4); g.restore(); }
  const su = seg(t, T.sub, T.sub + 0.5); if (su > 0) { g.save(); g.globalAlpha = su; g.font = `900 26px ${LOGOF}`; g.letterSpacing = '10px'; g.textAlign = 'center'; g.fillStyle = 'rgba(170,225,255,0.95)'; g.fillText('NEO-MERIDIAN POWER GRID  ·  NOW ONLINE', W / 2 + 5, y + 92); g.restore(); }
}
let GL;

// ════════════════════════════ frame ════════════════════════════
window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (t < T.splash) pageA(ctx, t);
  else if (t < T.title) splash(ctx, t);
  else titleCard(ctx, t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // white-out from the charge into the splash
  const w1 = t < T.white ? Math.pow(seg(t, T.white - 0.2, T.white), 2) : Math.exp(-(t - T.white) * 14);
  const w2 = t > T.impact ? Math.exp(-(t - T.impact) * 9) : 0;
  const wf = clamp(Math.max(w1, w2)); if (wf > 0.004) { ctx.fillStyle = `rgba(235,250,255,${wf})`; ctx.fillRect(0, 0, W, H); }
  // anamorphic flare wipe into the title card
  const wu = seg(t, T.wipe[0], T.wipe[1]);
  if (wu > 0 && wu < 1) { const pk = Math.sin(wu * Math.PI); ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(W / 2, H * 0.5); ctx.scale(1, 0.02 + 0.9 * Math.pow(pk, 3));
    const g2 = ctx.createRadialGradient(0, 0, 0, 0, 0, 1400); g2.addColorStop(0, `rgba(230,250,255,${pk})`); g2.addColorStop(0.35, `rgba(120,200,255,${0.8 * pk})`); g2.addColorStop(1, 'rgba(40,90,255,0)'); ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(0, 0, 1400, 0, TAU); ctx.fill(); ctx.restore();
    ctx.fillStyle = `rgba(230,248,255,${Math.pow(pk, 4) * 0.95})`; ctx.fillRect(0, 0, W, H); }
  // digital finish: fine noise (kills gradient banding) + vignette
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16; ctx.drawImage(NOISE, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(VIGN, 0, 0);
  const fade = Math.max(1 - seg(t, 0, 0.4), eInOut(seg(t, T.end[0], T.end[1])));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#02030a'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
window.events = () => {
  const ev = [];
  ev.push({ k: 'drone', t: 0 });
  ev.push({ k: 'swoosh', t: T.capA, v: 0.5 }, { k: 'swoosh', t: T.capB, v: 0.4 });
  ev.push({ k: 'whoosh', t: T.toP2[0], d: 0.45 }, { k: 'whoosh', t: T.toP3[0], d: 0.45 });
  ev.push({ k: 'visor', t: T.visor }, { k: 'pop', t: T.balloon });
  for (let i = 0; i < 3; i++) ev.push({ k: 'beep', t: 1.55 + i, v: i === 0 ? 0.6 : 1 });
  ev.push({ k: 'charge', t: T.charge, d: T.white - T.charge });
  for (let i = 0; i < 16; i++) ev.push({ k: 'zap', t: T.charge + 0.05 + i * (T.white - T.charge) / 16 + 0.02 * hh(i), v: 0.4 + 0.6 * i / 16 });
  ev.push({ k: 'crack', t: T.brk });
  ev.push({ k: 'dive', t: T.splash }, { k: 'boom', t: T.impact });
  for (let i = 0; i < 12; i++) ev.push({ k: 'debris', t: T.impact + 0.25 + i * 0.07 + 0.05 * hh(i + 3) });
  for (let i = 0; i < 6; i++) ev.push({ k: 'zap', t: T.surge + i * 0.12, v: 0.7 });
  ev.push({ k: 'powerup', t: T.cityOn[0] - 0.2, d: T.cityOn[1] - T.cityOn[0] + 0.6 }, { k: 'beam', t: T.beam });
  ev.push({ k: 'servo', t: T.rise[0], d: T.rise[1] - T.rise[0] });
  ev.push({ k: 'flarewipe', t: T.wipe[0], d: T.wipe[1] - T.wipe[0] }, { k: 'slam', t: T.slam + 0.3 }, { k: 'shimmer', t: T.glint[0] });
  for (let i = 0; i < 'THE CITY IS ON.'.length; i++) if ('THE CITY IS ON.'[i] !== ' ') ev.push({ k: 'tick', t: T.tag + i * 0.03 + 0.08 });
  ev.push({ k: 'chord', t: T.slam + 0.3 });
  return ev;
};
window.ready = (async () => {
  await Promise.all([document.fonts.load(`400 100px ${SFXF}`), document.fonts.load(`900 100px ${LOGOF}`), document.fonts.load(`italic 800 40px ${CAPF}`), document.fonts.load(`700 40px ${BALF}`)]);
  await document.fonts.ready;
  buildSky(); buildCity(); buildNoise(); buildHex(); buildClouds3(); buildType(); buildShards();
  GL = mk(LOGO.c.width, LOGO.c.height);
})();
