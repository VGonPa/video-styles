<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── clear-line · Franco-Belgian ligne claire ────────────────────────────────────────────────
// "The Runaway Kite": Juno, a young reporter, and Pepper, her dachshund, chase a kite that broke
// loose over the old harbour town of Port Meridian. One uniform ink line everywhere, flat colours,
// no hatching, no gradients; simple cartoon characters on detailed architecture. The camera reads
// the album page: a long tracking pan along the quay, a sweep down to a map inset, a pan across the
// lane (the scooter drives straight through the gutter into the next panel), the catch at the
// lighthouse, then a pull-back that reveals the whole page and its title.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));

const eIO2 = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const backOut = u => { const c = 1.7; return u >= 1 ? 1 : 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ── palette (flat, bright, printed) ──
const INK = '#1d1a20', PAPER = '#f7f1e2', DESK = '#2e5a5e', DESK_SH = '#23474a';
const SKY = '#a8d8ee', CLOUD = '#ffffff', SEA = '#3f90c2', SEA_LT = '#79b9dc', SEA_FAR = '#5aa4cf';
const FAC = ['#eab04c', '#dc6a4f', '#f3e0b5', '#8cc0a9', '#eca0a0', '#a3c8e4', '#d3ad72', '#f0cf7a', '#c9d98f'];
const ROOF = ['#b5523a', '#c9643f', '#6f8399', '#a24a3c'];
const SHUT = ['#2f7f6f', '#3a68a8', '#b8483a', '#5c8a3a', null, null];
const AWN = [['#d8392b', '#fff6e6'], ['#2f7f6f', '#fff6e6'], ['#3a68a8', '#fff6e6'], ['#e9a52e', '#fff6e6']];
const GLASS = '#c3e3f0', FRAME = '#fffaf0', STONE = '#cfc6b0', ROAD = '#d9ccaf', WALK = '#ebe0c6';
const SKIN = '#f7d0aa', HAIR = '#6a3320', COAT = '#2c8c86', SCARF = '#f5c332', PANTS = '#2d3f6c', BOOT = '#6b3f22';
const SCOOT = '#e0413a', SCOOT_DK = '#a92c28', TIRE = '#34343c', HUB = '#cdd1d8', SEAT = '#5b3a26';
const DOG = '#c4692c', DOG_EAR = '#8a4119', BASKET = '#cf9f5c';
const KITE_A = '#e3362b', KITE_B = '#f8cf3d', KITE_T = '#3b6fb8';
const LETTER = '"Patrick Hand"', TITLE = '"Lilita One"';
const LW = 3.3;                         // the one line weight (world px)
let LS = 1;                             // local drawing scale → keeps the line uniform

// ── page layout (world px) ──
const PAGE = { x: 0, y: 0, w: 3400, h: 2440 };
const P1 = [100, 300, 3200, 1000], P2 = [100, 1360, 960, 960], P3 = [1120, 1360, 960, 960], P4 = [2140, 1360, 1160, 960];

// ── drawing primitives ──
function st(p, fill, lw) { if (fill) { ctx.fillStyle = fill; ctx.fill(p); } if (lw !== 0) { ctx.lineWidth = (lw || LW) / LS; ctx.strokeStyle = INK; ctx.stroke(p); } }
function R(x, y, w, h) { const p = new Path2D(); p.rect(x, y, w, h); return p; }
function RR(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }
function E(x, y, rx, ry = rx, rot = 0) { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, TAU); return p; }
function PL(pts, close = true) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); if (close) p.closePath(); return p; }
function L(x0, y0, x1, y1, lw) { const p = new Path2D(); p.moveTo(x0, y0); p.lineTo(x1, y1); st(p, null, lw); }
function D(d) { return new Path2D(d); }
// limb: an outlined tube (uniform outline around a flat colour)
function tube(pts, w, col) { const p = PL(pts, false); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = w + 2 * LW / LS; ctx.stroke(p); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(p); }
function text(s, x, y, size, font = LETTER, align = 'center', col = INK) { ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y); }

// ── architecture ─────────────────────────────────────────────────────────────────────────
const SIGNS = ['BAKERY', 'BOOKS', 'CAFE MIRA', 'FRESH FISH', 'MAPS & PRINTS', 'HOTEL SOLEIL', 'TEA ROOM', 'CHANDLERY', 'BICYCLES', 'NEWS', 'FLOWERS', 'PHARMACY'];
function makeHouses(x0, x1, base, k, seed) {
  const r = rng(seed), out = []; let x = x0, i = 0;
  const pick = a => a[Math.floor(r() * a.length)];
  while (x < x1) {
    const w = (175 + r() * 110) * k, floors = 3 + (r() < .45 ? 1 : 0), fh = (92 + r() * 16) * k, gf = 128 * k;
    out.push({ x, w, base, k, floors, fh, gf, h: gf + floors * fh, type: ['step', 'gable', 'cornice', 'gable', 'mansard', 'cornice', 'step'][Math.floor(r() * 7)],
      col: FAC[(i * 4 + Math.floor(r() * 3)) % FAC.length], roof: pick(ROOF), shut: pick(SHUT), shop: r() < .75, awn: AWN[Math.floor(r() * 4)],
      sign: SIGNS[(seed + i * 5) % SIGNS.length], cols: w > 225 * k ? 3 : 2, box: r() < .55, chim: r() < .65, door: pick(['#3a68a8', '#2f7f6f', '#8a3b2c', '#5b3a26']), fl: r() });
    x += w + (r() < .25 ? 0 : 0); i++;
  }
  return out;
}
function windowAt(cx, top, ww, wh, hs, t) {
  const k = hs.k;
  if (hs.shut) { st(R(cx - ww / 2 - ww * .42, top, ww * .42, wh), hs.shut); st(R(cx + ww / 2, top, ww * .42, wh), hs.shut); }
  st(R(cx - ww / 2, top, ww, wh), FRAME);
  st(R(cx - ww / 2 + 5 * k, top + 5 * k, ww - 10 * k, wh - 10 * k), GLASS);
  L(cx, top + 5 * k, cx, top + wh - 5 * k); L(cx - ww / 2 + 5 * k, top + wh * .42, cx + ww / 2 - 5 * k, top + wh * .42);
  st(R(cx - ww / 2 - 4 * k, top + wh, ww + 8 * k, 6 * k), '#efe6d0');
}
function flowerBox(cx, y, ww, k) {
  st(R(cx - ww / 2, y, ww, 12 * k), '#9a5a34');
  for (let j = 0; j < 4; j++) { const fx = cx - ww / 2 + ww * (j + .5) / 4; st(E(fx, y - 3 * k, 6 * k, 5 * k), j % 2 ? '#e3362b' : '#f58aa0'); }
  st(E(cx - ww / 2 + ww * .3, y - 9 * k, 6 * k, 4 * k, .5), '#5f9a44', 0); st(E(cx + ww * .22, y - 9 * k, 6 * k, 4 * k, -.5), '#5f9a44', 0);
}
function drawHouse(hs, t) {
  const { x, w, base, k, gf, fh, floors, h } = hs, top = base - h;
  // roofline / gable (behind or part of the facade)
  if (hs.chim) st(R(x + w * .68, top - 70 * k, 26 * k, 70 * k + 8), '#b7735a');
  if (hs.type === 'cornice') { st(PL([[x + 10 * k, top], [x + 26 * k, top - 40 * k], [x + w - 26 * k, top - 40 * k], [x + w - 10 * k, top]]), hs.roof); }
  if (hs.type === 'mansard') {
    st(PL([[x + 4 * k, top], [x + 26 * k, top - 78 * k], [x + w - 26 * k, top - 78 * k], [x + w - 4 * k, top]]), hs.roof);
    for (let j = 0; j < 2; j++) { const dx = x + w * (.3 + .4 * j); st(PL([[dx - 20 * k, top - 8 * k], [dx - 20 * k, top - 52 * k], [dx, top - 70 * k], [dx + 20 * k, top - 52 * k], [dx + 20 * k, top - 8 * k]]), FRAME);
      st(R(dx - 12 * k, top - 48 * k, 24 * k, 34 * k), GLASS); }
  }
  let facade;
  if (hs.type === 'gable') facade = PL([[x, base], [x, top], [x + w / 2, top - w * .42], [x + w, top], [x + w, base]]);
  else if (hs.type === 'step') { const s = w / 7, sh = 34 * k, pts = [[x, base], [x, top]];
    for (let j = 0; j < 3; j++) { pts.push([x + s * j, top - sh * (j + 1)]); pts.push([x + s * (j + 1), top - sh * (j + 1)]); }
    pts.push([x + s * 3, top - sh * 4]); pts.push([x + s * 4, top - sh * 4]);
    for (let j = 2; j >= 0; j--) { pts.push([x + w - s * (j + 1), top - sh * (j + 1)]); pts.push([x + w - s * j, top - sh * (j + 1)]); }
    pts.push([x + w, top]); pts.push([x + w, base]); facade = PL(pts); }
  else facade = R(x, top, w, h);
  st(facade, hs.col);
  if (hs.type === 'cornice') st(R(x - 4 * k, top - 4 * k, w + 8 * k, 16 * k), '#efe6d0');
  if (hs.type === 'gable') { st(E(x + w / 2, top - w * .17, 18 * k, 18 * k), GLASS); L(x + w / 2 - 18 * k, top - w * .17, x + w / 2 + 18 * k, top - w * .17); }
  if (hs.type === 'step') st(RR(x + w / 2 - 16 * k, top - 88 * k, 32 * k, 50 * k, [16 * k, 16 * k, 0, 0]), GLASS);

  st(R(x, base - gf - 8 * k, w, 10 * k), '#efe6d0');
  // upper windows
  const ww = Math.min(44 * k, w / (hs.cols * 2.4)), wh = fh * .62;
  for (let f = 0; f < floors; f++) {
    const y0 = base - gf - fh * (f + 1) + fh * .2;
    for (let c = 0; c < hs.cols; c++) {

    st(R(sx, base - gf + 38 * k, sw, gf - 50 * k), GLASS); L(sx + sw / 2, base - gf + 38 * k, sx + sw / 2, base - 12 * k);
    st(R(sx - 4 * k, base - 14 * k, sw + 8 * k, 14 * k), '#efe6d0');
    const dx = x + w * .72, dw = w * .2; st(R(dx, base - gf + 34 * k, dw, gf - 34 * k), hs.door); st(R(dx + dw * .2, base - gf + 46 * k, dw * .6, gf * .3), GLASS);
    // sign board + awning
    const bw = w * .86, bx = x + w * .07, by = base - gf - 4 * k;
    st(R(bx, by, bw, 34 * k), '#fbf3dc');
    ctx.save(); ctx.font = `${24 * k}px ${TITLE}`; const tw = ctx.measureText(hs.sign).width; const fs = Math.min(24 * k, 24 * k * (bw - 14 * k) / tw); ctx.restore();
    text(hs.sign, bx + bw / 2, by + 18 * k, fs, TITLE, 'center', INK);
    const ay = by + 34 * k, ah = 44 * k, n = Math.max(4, Math.round(sw / (26 * k)));
    const flap = Math.sin(t * 3.1 + hs.fl * 6) * 1.5 * k;
    for (let j = 0; j < n; j++) { const a = sx - 8 * k + (sw + 16 * k) * j / n, b = sx - 8 * k + (sw + 16 * k) * (j + 1) / n;
      st(PL([[a, ay], [b, ay], [b + 6 * k, ay + ah + flap], [a + 6 * k, ay + ah + flap]]), hs.awn[j % 2]); }
    const pS = new Path2D(); pS.moveTo(sx - 2 * k, ay + ah + flap);
    for (let j = 0; j < n; j++) { const a = sx - 2 * k + (sw + 16 * k) * j / n, b = sx - 2 * k + (sw + 16 * k) * (j + 1) / n; pS.arc((a + b) / 2, ay + ah + flap, (b - a) / 2, 0, Math.PI, false); }
    ctx.save(); st(pS, hs.awn[0], 0); ctx.restore();
    for (let j = 0; j < n; j++) { const a = sx - 2 * k + (sw + 16 * k) * j / n, b = sx - 2 * k + (sw + 16 * k) * (j + 1) / n; const pa = new Path2D(); pa.arc((a + b) / 2, ay + ah + flap, (b - a) / 2, 0, Math.PI, false); st(pa, hs.awn[j % 2]); }
  } else {

    st(RR(dx, base - gf + 20 * k, dw, gf - 20 * k, [dw / 2, dw / 2, 0, 0]), hs.door); st(E(dx + dw * .78, base - gf * .45, 3.5 * k), '#f5c332');
    for (const s of [-1, 1]) windowAt(x + w / 2 + s * w * .32, base - gf + 34 * k, ww, gf * .5, hs, t);

}
function lamp(x, base, k) {
  st(R(x - 5 * k, base - 280 * k, 10 * k, 280 * k), '#2f4f4f'); st(R(x - 12 * k, base - 20 * k, 24 * k, 20 * k), '#2f4f4f');
  st(PL([[x - 18 * k, base - 290 * k], [x + 18 * k, base - 290 * k], [x + 12 * k, base - 330 * k], [x - 12 * k, base - 330 * k]]), '#fff1a8');
  st(PL([[x - 24 * k, base - 330 * k], [x + 24 * k, base - 330 * k], [x, base - 350 * k]]), '#2f4f4f');
}
function bollard(x, base, k) { st(RR(x - 13 * k, base - 36 * k, 26 * k, 36 * k, [10 * k, 10 * k, 0, 0]), '#3b3f48'); st(R(x - 17 * k, base - 30 * k, 34 * k, 6 * k), '#3b3f48'); }
function cloud(x, y, k) { const p = new Path2D(); p.moveTo(x - 110 * k, y);
  p.arc(x - 70 * k, y, 40 * k, Math.PI, Math.PI * 1.65); p.arc(x - 10 * k, y - 20 * k, 55 * k, Math.PI * 1.15, Math.PI * 1.9); p.arc(x + 60 * k, y - 4 * k, 44 * k, Math.PI * 1.3, 0); p.lineTo(x + 104 * k, y); p.closePath(); st(p, CLOUD); }
function gull(x, y, k, ph) { const f = Math.sin(ph); const p = new Path2D();
  p.moveTo(x - 30 * k, y - 10 * k * f); p.quadraticCurveTo(x - 14 * k, y - 18 * k * f - 6 * k, x, y); p.quadraticCurveTo(x + 14 * k, y - 18 * k * f - 6 * k, x + 30 * k, y - 10 * k * f); st(p, null, 3.4); }

  ctx.save(); ctx.translate(x, wl + bob); ctx.rotate(bob * .004);
  if (sail) { L(0, -30 * k, 0, -330 * k); L(0, -330 * k, 90 * k, -40 * k, 2.2); L(0, -330 * k, -100 * k, -40 * k, 2.2); st(R(-8 * k, -80 * k, 70 * k, 8 * k), '#8a5a3a'); }
  st(PL([[-60 * k, -48 * k], [30 * k, -48 * k], [30 * k, -86 * k], [-40 * k, -86 * k]]), '#fff6e6');
  st(R(-26 * k, -78 * k, 16 * k, 16 * k), GLASS); st(R(0, -78 * k, 16 * k, 16 * k), GLASS);
  const hull = D(`M ${-120 * k} ${-50 * k} L ${110 * k} ${-50 * k} Q ${130 * k} ${-50 * k} ${140 * k} ${-64 * k} L ${118 * k} 0 L ${-100 * k} 0 Q ${-116 * k} ${-20 * k} ${-120 * k} ${-50 * k} Z`);

}
function waves(x0, x1, y, t, k, n = 6) { for (let i = 0; i < n; i++) { const r = rng(900 + i); const wx = x0 + (x1 - x0) * r() + Math.sin(t * .9 + i) * 10 * k, wy = y + r() * 60 * k;
  const p = new Path2D(); p.moveTo(wx - 22 * k, wy); p.quadraticCurveTo(wx - 11 * k, wy - 7 * k, wx, wy); p.quadraticCurveTo(wx + 11 * k, wy - 7 * k, wx + 22 * k, wy); ctx.strokeStyle = '#eaf6fb'; ctx.lineWidth = 3.2; ctx.stroke(p); } }

  const pts = []; const n = 14;
  for (let i = 0; i <= n; i++) { const u = i / n; pts.push([lerp(x0, x1, u), lerp(y0, y1, u) + sag * 4 * u * (1 - u)]); }
  st(PL(pts, false), null, 2.4);

// ── characters ────────────────────────────────────────────────────────────────────────────
// Juno (bob haircut, teal coat, yellow scarf) on a red scooter with Pepper (a red dachshund) in the basket.
function rider(x, gy, k, o) {
  const t = o.t, dist = o.dist || 0, reach = o.reach || 0, talk = o.talk || 0, bark = o.bark || 0, moving = o.moving ?? 1;

  for (const wx of [-68, 74]) { st(E(wx, -24, 24), TIRE); st(E(wx, -24, 11), HUB); const a = -dist / (24 * k);
    for (let j = 0; j < 3; j++) { const b = a + j * TAU / 3; ctx.beginPath(); ctx.arc(wx + Math.cos(b) * 6, -24 + Math.sin(b) * 6, 1.8, 0, TAU); ctx.fillStyle = INK; ctx.fill(); } }
  const bob = Math.sin(t * 23) * 1.3 * moving;
  ctx.translate(0, bob);
  tube([[62, -156], [74, -26]], 7, '#8d939c');                                     // fork
  st(D('M -106 -46 C -108 -84 -82 -108 -42 -108 L -10 -108 C 4 -108 10 -96 8 -82 L 4 -58 L 46 -58 L 46 -46 L -28 -46 C -44 -46 -54 -40 -62 -48 C -76 -56 -94 -54 -106 -46 Z'), SCOOT);
  L(-96, -60, -36, -60, 2.6);
  st(RR(-94, -122, 70, 18, 9), SEAT);
  // Juno
  const scarfW = Math.sin(t * 12) * 6, scarfW2 = Math.sin(t * 12 + 1.4) * 7;
  st(D(`M -30 -206 Q -60 ${-214 + scarfW} -92 ${-206 + scarfW2} L -94 ${-192 + scarfW2} Q -60 ${-198 + scarfW} -32 -194 Z`), SCARF);
  tube([[-50, -122], [6, -132], [16, -70]], 25, PANTS);                             // leg
  st(D('M 4 -78 L 24 -78 C 34 -76 40 -66 40 -58 L 4 -58 Z'), BOOT);
  let hdR = null;
  if (reach > 0) { const el = [lerp(-20, -4, reach), lerp(-176, -262, reach)]; hdR = [lerp(10, 34, reach), lerp(-176, -330, reach)];
    tube([[-32, -192], el, hdR], 16, '#237571'); st(E(hdR[0], hdR[1], 9, 8), SKIN); }
  st(D('M -72 -112 C -76 -150 -64 -194 -44 -206 L -20 -204 C -10 -188 -10 -150 -16 -122 L -22 -112 Z'), COAT); // torso
  const flap = Math.sin(t * 16) * 5 * moving;
  st(D(`M -76 -112 L -20 -112 L -26 -96 L ${-84 + flap} ${-92 - flap * .4} Z`), COAT);
  st(R(-38, -150, 14, 5), '#1f6a66', 0);
  // head
  st(E(-26, -212, 8, 10), SKIN, 0); st(E(-20, -238, 25, 27), SKIN);
  st(E(5, -232, 5.5, 5), SKIN);                                                       // nose
  st(D('M 4 -252 C 4 -272 -20 -280 -38 -272 C -54 -264 -58 -244 -54 -224 C -52 -214 -46 -208 -38 -206 L -34 -216 C -38 -226 -38 -236 -32 -244 C -24 -250 -8 -246 4 -252 Z'), HAIR);
  st(E(-33, -232, 5.5, 7.5), SKIN);                                                   // ear
  const blink = (t % 2.6) > 2.48; if (blink) L(-9, -240, -1, -240, 2.6); else st(E(-4, -241, 3.2, 4.2), INK, 0);
  L(-10, -251, 1, -252, 2.6);                                                        // brow
  if (talk > 0) { const m = 2.5 + 3 * Math.abs(Math.sin(t * 17)) * talk; st(E(-3, -220, 3.8, m * .8), '#6b1f1f', 2.2); }
  else { const p = new Path2D(); p.moveTo(-6, -221); p.quadraticCurveTo(-1, -218, 3, -222); st(p, null, 2.6); }
  // front of scooter
  st(D('M 36 -58 L 52 -60 C 62 -96 64 -132 60 -166 L 48 -166 C 48 -130 44 -94 30 -58 Z'), SCOOT);    // leg shield
  st(D('M 50 -34 C 54 -62 96 -62 102 -34 L 92 -34 C 88 -50 62 -50 60 -34 Z'), SCOOT);                 // fender

  st(R(lx - 78, 1486, 156, 16), '#2f4f4f'); for (let i = 0; i < 7; i++) L(lx - 70 + i * 23.3, 1452, lx - 70 + i * 23.3, 1486, 2.6); L(lx - 74, 1452, lx + 74, 1452, 2.6);
  st(R(lx - 44, 1400, 88, 86), '#f8e27a'); L(lx - 14, 1400, lx - 14, 1486, 2.6); L(lx + 16, 1400, lx + 16, 1486, 2.6);
  st(D(`M ${lx - 54} 1400 Q ${lx} 1340 ${lx + 54} 1400 Z`), '#e3362b');
  // pier deck
  st(R(x, 2150, w, 20), '#c79a62'); st(R(x, 2170, w, 200), '#a9784a');
  for (let i = 0; i < 16; i++) L(x + 40 + i * 76, 2170, x + 40 + i * 76, 2320, 2.4);
  for (let i = 0; i < 9; i++) { const px = x + 60 + i * 140; st(R(px - 8, 2080, 16, 72), '#8a5a3a'); }
  const rp = new Path2D(); rp.moveTo(x, 2100); for (let i = 0; i < 9; i++) { const px = x + 60 + i * 140; rp.quadraticCurveTo(px - 70, 2118, px, 2092); } st(rp, null, 3);
  for (let i = 0; i < 2; i++) { const gx = 2500 + i * 220 + Math.sin(t * .8 + i) * 40, gy = 1560 + i * 70 + Math.sin(t * 1.9 + i * 2) * 10; gull(gx, gy, 1.1, t * 10 + i * 3); }

}
// the scooter run across panels 3→4, drawn in one clip so it can cross the gutter
function run34(t) {
  if (t < 5.4) return;
  ctx.save(); ctx.beginPath(); ctx.rect(P3[0], P3[1], P4[0] + P4[2] - P3[0], P3[3]); ctx.clip();
  const sx = sx34(t), stopT = 7.62, moving = t < 7.0 ? 1 : clamp(1 - (t - 7.0) / 0.62);
  const brake = Math.sin(Math.PI * seg(t, 7.35, 7.95)) * (t < 7.95 ? 1 : 0), settle = t > 7.95 ? Math.sin((t - 7.95) * 14) * Math.exp(-(t - 7.95) * 6) : 0;
  const tilt = 0.045 * brake + 0.012 * settle;
  const reach = eOut(seg(t, 7.6, 7.92)), catchT = 7.95;
  const bark = t > 8.1 && t < 8.55 ? Math.abs(Math.sin((t - 8.1) * 15)) : 0, talk = t > 7.98 && t < 8.6 ? 1 : 0;
  if (t > 7.0 && t < 8.1) { const du = seg(t, 7.0, 8.1); ctx.globalAlpha = 1 - du; for (let j = 0; j < 3; j++) { const px = sx - 60 - j * 50 - du * 80; st(E(px, 2218 - j * 8 - du * 20, 20 + du * 26 + j * 4, 12 + du * 12), '#efe6d0', 2.6); } ctx.globalAlpha = 1; }
  const hand = rider(sx, 2240, 1.5, { t, dist: sx, moving, tilt, reach, bark, talk });
  // kite: flies in above the lane, dips over the pier, the dangling string is caught
  const kIn = eOut(seg(t, 5.5, 6.3));
  let kx, ky;
  if (t < 7.0) { kx = sx + 460 + Math.sin(t * 2.1) * 30; ky = 1540 - 420 * (1 - kIn) + Math.sin(t * 3) * 24; }
  else { const u = eIO2(seg(t, 7.0, 7.9)); const a0x = 2140 + 460 + Math.sin(7 * 2.1) * 30, a0y = 1540 + Math.sin(21) * 24;
    kx = lerp(a0x, hand[0] + 150, u) + Math.sin(t * 2.3) * 12 * (1 - u); ky = lerp(a0y, 1600, u) + Math.sin(t * 3) * 20 * (1 - u); }
  if (t < catchT) kite(kx, ky, 1.1, -0.3 + Math.sin(t * 2.6) * .16, t, true);
  else { const tug = Math.sin((t - catchT) * 5) * 14; kx = hand[0] + 160 + Math.sin(t * 2) * 16; ky = hand[1] - 250 + tug;
    const sp = new Path2D(); sp.moveTo(hand[0], hand[1]); sp.quadraticCurveTo(lerp(hand[0], kx, .5) + 20, lerp(hand[1], ky, .5) + 40, kx - 4, ky - 12); st(sp, null, 2.6);
    kite(kx, ky, 1.1, -0.1 + Math.sin(t * 2.6) * .1, t, false); st(E(hand[0], hand[1], 13, 12), SKIN); }
  ctx.restore();
  ctx.save(); clipRect(P4);
  balloon(2330, 1590, ['GOT YOU!'], [clamp(sx - 40, 2250, 2500), 1810], seg(t, 7.98, 8.25), 44);
  balloon(2800, 1830, ['WOOF!'], [sx + 175, 1985], seg(t, 8.1, 8.3), 34);
  caption(P4[0] + 22, P4[1] + 22, ['...AND A SCOOP FOR THE', 'MORNING EDITION.'], seg(t, 8.1, 8.4));
  ctx.restore();
}

// ── page ──
function page(t) {
  st(R(PAGE.x + 28, PAGE.y + 34, PAGE.w, PAGE.h), DESK_SH, 0);
  st(R(PAGE.x, PAGE.y, PAGE.w, PAGE.h), PAPER, 0);

  ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.strokeText('THE RUNAWAY KITE', 1700, 125); ctx.fillStyle = '#e0413a'; ctx.fillText('THE RUNAWAY KITE', 1700, 125);
  ctx.restore();
  text('A JUNO & PEPPER ADVENTURE', 1700, 222, 42, LETTER);
  L(1080, 222, 1350, 222, 3); L(2050, 222, 2320, 222, 3);
  text('- 12 -', 1700, 2388, 40, LETTER);
}

// ── camera ──
const CAM = [
  { t: 0.0, fx: 1020, fy: 800, s: 1.0 }, { t: 0.4, fx: 1020, fy: 800, s: 1.0 },
  { t: 3.2, fx: 2380, fy: 800, s: 1.0 },
  { t: 4.05, fx: 780, fy: 1840, s: 1.0, dip: 0.24 }, { t: 5.5, fx: 780, fy: 1840, s: 1.0 },
  { t: 6.1, fx: 1600, fy: 1840, s: 1.0, dip: 0.03 }, { t: 6.6, fx: 1600, fy: 1840, s: 1.0 },
  { t: 7.35, fx: 2720, fy: 1840, s: 1.0, dip: 0.03 }, { t: 8.6, fx: 2700, fy: 1830, s: 1.04 },
  { t: 9.35, fx: 1700, fy: 1225, s: 0.418 }, { t: 10.0, fx: 1700, fy: 1225, s: 0.412 },
];
function camera(t) {
  let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1].t) i++;
  const a = CAM[i], b = CAM[i + 1], u = seg(t, a.t, b.t), e = i === 1 ? eIO2(u) : eInOut(u);
  const s = Math.exp(lerp(Math.log(a.s), Math.log(b.s), e)) * (1 - (b.dip || 0) * Math.sin(Math.PI * u));
  return { fx: lerp(a.fx, b.fx, e), fy: lerp(a.fy, b.fy, e), s };
}

window.draw = ({ t }) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = DESK; ctx.fillRect(0, 0, W, H);
  const c = camera(t);
  ctx.setTransform(c.s, 0, 0, c.s, 960 - c.fx * c.s, 540 - c.fy * c.s);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; LS = 1;
  page(t);
  panel1(t); border(P1); kite1(t);
  panel2(t); border(P2);
  panel3(t); panel4(t); border(P3); border(P4);
  run34(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const fade = Math.max(1 - seg(t, 0, 0.35), seg(t, 9.62, 10.0));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
