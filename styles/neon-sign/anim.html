<script>
// ── neon-sign · real bent-glass neon on a wet night street ─────────────────────────────────────
// Dark brick wall, unlit glass tubes with electrodes, clips and painted-out jumps → the script "Good Ideas" draws on
// like a pen stroke (close-up, camera tracks the hot tip) → pull back while the block letters SERVED HERE strike up one
// by one (the R is faulty and stutters) → an amber arrow powers on and chases toward a door → OPEN LATE flickers on in
// the door glass → power cut: everything dies with an afterglow, the faulty R gets one last blink → fade to black.
// Light: tubes drawn once into a half-res light buffer → 3 blurred bloom levels; the wide levels are multiplied by the
// brick albedo (light spill with texture); the lit frame is mirrored into the wet pavement with ripples and vertical smear.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2, BS = 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');

const HORIZON = 850, REFL_K = 3.2;
const COL = {

  cyan:  { body: '30,215,255',  glow: '0,190,255',  core: '226,253,255' },
  amber: { body: '255,160,30',  glow: '255,135,10', core: '255,242,210' },
  red:   { body: '255,40,30',   glow: '255,25,15',  core: '255,222,214' },

// ── geometry: Hershey centerlines → smoothed, resampled tube paths ─────────────────────────────
function chaikin(p, it) {

// place a glyph set: centre x, top y, scale → tubes
function place(key, cx, top, sc, color, w, group, smooth) {

const SERVED = place('served', 780, 430, 4.3, 'cyan', 8.5, 'served', 2);

// door-sign border: rounded rectangle tube

// chasing arrow: a curved shaft cut into dashes + an arrow head
const ARROW = [];
{ const P = t => { const a = [1195, 596], b = [1370, 590], c = [1405, 712], d = [1512, 712]; const u = 1 - t;
    return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * d[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * d[1]]; };

const GOOD_LEN = GOOD.reduce((a, s) => a + s.len, 0);

// ── timing / brightness model ──────────────────────────────────────────────────────────────────

// the faulty R: dropouts with buzzy sub-flicker
const FAULT_IX = 2;   // index of the R in "SERVED HERE"

    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.3, `rgba(8,6,5,${.08 + r() * .1})`); g.addColorStop(1, 'rgba(0,0,0,0)'); a.fillStyle = g; a.fillRect(x, y0, 3 + r() * 10, l); }

  a.fillStyle = '#29302c'; a.fillRect(1540, 304, 280, HORIZON - 304);
  a.strokeStyle = '#1c2220'; a.lineWidth = 4; a.strokeRect(1556, 660, 248, 160);
  a.fillStyle = '#0b0d10'; a.fillRect(1558, 344, 244, 262);
  a.strokeStyle = '#3a423e'; a.lineWidth = 8; a.strokeRect(1554, 340, 252, 270);
  a.fillStyle = '#8a8478'; a.beginPath(); a.roundRect(1782, 640, 12, 60, 5); a.fill();
  a.fillStyle = '#4a4540'; a.fillRect(1510, HORIZON - 14, 340, 14);

    p.fillStyle = '#fff'; p.beginPath(); for (let i = 0; i <= 40; i++) { const an = i / 40 * TAU, q = 1 + .18 * Math.sin(an * 3 + k) + .1 * Math.sin(an * 7 + k * 2);
      p.lineTo(x + Math.cos(an) * rx * q, y + Math.sin(an) * ry * q * (1 + (y - HORIZON) / 300)); } p.fill(); }
  // grain tiles (static set, cycled at 12 fps)
  for (let k = 0; k < 4; k++) { const c = mk(W / 2, H / 2), x = c.getContext('2d'), im = x.createImageData(W / 2, H / 2), q = im.data; let s2 = 1234 + k * 999;
    for (let i = 0; i < q.length; i += 4) { s2 = (s2 * 1664525 + 1013904223) >>> 0; const v = s2 >>> 24; q[i] = q[i + 1] = q[i + 2] = v; q[i + 3] = 255; }
    x.putImageData(im, 0, 0); grain.push(c); }
}

// ── camera ────────────────────────────────────────────────────────────────────────────────────
function penX(t) {                     // x of the script's hot tip at time t
  const L = seg(t, T_PEN0, T_PEN1), d = (eInOut(L) * .15 + L * .85) * GOOD_LEN; let acc = 0;
  for (const s of GOOD) { if (acc + s.len >= d) { const i = Math.max(0, s.cum.findIndex(c => c >= d - acc)); return s.pts[i][0]; } acc += s.len; }
  return GB.x1;
}
function camera(t) {
  let px = 0; for (let i = 0; i < 8; i++) px += penX(t - .5 + i * .06); px /= 8;          // smoothed follow of the pen tip
  const close = { s: 2.2, cx: px + 90, cy: 290 };
  const wide = { s: lerp(1.0, 1.06, eInOut(seg(t, 5.0, 9.8))), cx: lerp(960, 985, eInOut(seg(t, 5.0, 9.8))), cy: lerp(540, 548, seg(t, 5, 9.8)) };
  const u = eInOut(seg(t, 3.1, 4.7));
  const s = 1 / lerp(1 / close.s, 1 / wide.s, u);         // interpolate in 1/scale so the pull-back feels linear
  let cx = lerp(close.cx, wide.cx, u), cy = lerp(close.cy, wide.cy, u);
  cx = clamp(cx, 960 / s, W - 960 / s); cy = clamp(cy, 540 / s, H - 540 / s);
  return { s, cx, cy };
}

// ── per-frame canvases ────────────────────────────────────────────────────────────────────────
const LB = mk(960, 540), GA = mk(480, 270), GB2 = mk(240, 135), GC = mk(120, 68), SP = mk(W, H), RF = mk(960, 270), RF2 = mk(960, 270), RS = mk(960, 45), PM = mk(960, 270);
const lb = LB.getContext('2d'), ga = GA.getContext('2d'), gb = GB2.getContext('2d'), gc = GC.getContext('2d'), sp = SP.getContext('2d'),
  rf = RF.getContext('2d'), rf2 = RF2.getContext('2d'), rs = RS.getContext('2d'), pm = PM.getContext('2d');

function strokeTube(c, tb, frac, width, style) {
  let n = tb.pts.length; if (frac < 1) { const L = frac * tb.len; n = tb.cum.findIndex(v => v > L); if (n < 0) n = tb.pts.length; }
  if (n < 2) return null; c.strokeStyle = style; c.lineWidth = width; wpath(c, tb.pts, n);
  if (frac < 1) { const L = frac * tb.len, i = n - 1, d = tb.cum[i] - tb.cum[i - 1] || 1, u = clamp((L - tb.cum[i - 1]) / d); c.lineTo(lerp(tb.pts[i - 1][0], tb.pts[i][0], u), lerp(tb.pts[i - 1][1], tb.pts[i][1], u)); }
  c.stroke(); return frac < 1 ? tb.pts[n - 1] : null;
}

function render(t) {
  const cam = camera(t), S = cam.s, tx = 960 - cam.cx * S, ty = 540 - cam.cy * S;
  const states = tubes.map(tb => tubeState(tb, t));
  let tip = null;
  // 1 · base wall
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(S / BS, 0, 0, S / BS, tx, ty); ctx.drawImage(bg, 0, 0);
  // 2 · light buffer (half res)
  lb.setTransform(1, 0, 0, 1, 0, 0); lb.fillStyle = '#000'; lb.fillRect(0, 0, 960, 540);
  lb.setTransform(S / 2, 0, 0, S / 2, tx / 2, ty / 2); lb.lineCap = 'round'; lb.lineJoin = 'round'; lb.globalCompositeOperation = 'lighter';
  tubes.forEach((tb, i) => { const [b, f] = states[i]; if (b <= .01 || f <= 0) return;
    const p = strokeTube(lb, tb, f, tb.w * 1.9, `rgba(${COL[tb.color].glow},${clamp(b * .9)})`); if (p && t < T_PEN1) tip = p; });
  if (tip) { lb.fillStyle = 'rgba(255,200,235,.9)'; lb.beginPath(); lb.arc(tip[0], tip[1], 14, 0, TAU); lb.fill(); }
  lb.globalCompositeOperation = 'source-over';
  // 3 · bloom pyramid
  ga.filter = 'blur(3px)'; ga.drawImage(LB, 0, 0, 480, 270); ga.filter = 'none';
  gb.filter = 'blur(5px)'; gb.drawImage(LB, 0, 0, 240, 135); gb.filter = 'none';
  gc.filter = 'blur(7px)'; gc.drawImage(GB2, 0, 0, 120, 68); gc.filter = 'none';
  // 4 · spill on the brick: wide glow × albedo
  sp.setTransform(1, 0, 0, 1, 0, 0); sp.globalCompositeOperation = 'source-over'; sp.fillStyle = '#000'; sp.fillRect(0, 0, W, H);
  sp.globalCompositeOperation = 'lighter'; sp.globalAlpha = 1; sp.drawImage(GC, 0, 0, W, H); sp.drawImage(GC, 0, 0, W, H); sp.drawImage(GC, 0, 0, W, H);
  sp.globalAlpha = .9; sp.drawImage(GB2, 0, 0, W, H); sp.globalAlpha = 1;
  sp.globalCompositeOperation = 'multiply'; sp.setTransform(S / BS, 0, 0, S / BS, tx, ty); sp.drawImage(albedo, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(SP, 0, 0); ctx.drawImage(SP, 0, 0);
  // 5 · bloom over everything
  ctx.globalAlpha = .55; ctx.drawImage(GB2, 0, 0, W, H); ctx.globalAlpha = .85; ctx.drawImage(GA, 0, 0, W, H); ctx.globalAlpha = 1;
  // 6 · lit glass at full res: coloured body, then a hot pale core
  ctx.globalCompositeOperation = 'source-over'; ctx.setTransform(S, 0, 0, S, tx, ty); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  tubes.forEach((tb, i) => { const [b, f] = states[i]; if (b <= .01 || f <= 0) return;
    strokeTube(ctx, tb, f, tb.w * 1.05, `rgba(${COL[tb.color].body},${clamp(b * .95)})`); });
  ctx.globalCompositeOperation = 'lighter';
  tubes.forEach((tb, i) => { const [b, f] = states[i]; if (b <= .01 || f <= 0) return;
    strokeTube(ctx, tb, f, tb.w * .3, `rgba(${COL[tb.color].core},${clamp(b * .7)})`);
    if (b > 1) strokeTube(ctx, tb, f, tb.w * .9, `rgba(255,255,255,${clamp((b - 1) * 1.5)})`); });
  if (tip) { const g = ctx.createRadialGradient(tip[0], tip[1], 0, tip[0], tip[1], 26); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,190,230,.8)'); g.addColorStop(1, 'rgba(255,60,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(tip[0], tip[1], 26, 0, TAU); ctx.fill(); }
  // 7 · wet pavement reflection (mirror about the wall base)
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over';
  const yh = HORIZON * S + ty, hR = H - yh;
  if (hR > 2) {
    const h2 = Math.ceil(hR / 2);
    rf.setTransform(1, 0, 0, 1, 0, 0); rf.clearRect(0, 0, 960, 270);
    const k = REFL_K, src = Math.min(yh, hR * k);         // the mirror is compressed (a low camera over wet asphalt foreshortens it)
    rf.setTransform(.5, 0, 0, -.5, 0, 0); rf.drawImage(cv, 0, yh - src, W, src, 0, -src / k, W, src / k);   // flipped copy of the lit wall above
    rf2.setTransform(1, 0, 0, 1, 0, 0); rf2.clearRect(0, 0, 960, 270);
    for (let y = 0; y < h2; y += 2) { const dx = Math.sin(y * .31 + t * 5.1) * (1.5 + y * .06) + Math.sin(y * .083 - t * 2.3) * (1 + y * .05) + Math.sin(y * 1.7 + t * 9) * .8;
      rf2.drawImage(RF, 0, y, 960, 2, dx, y, 960, 2); }
    // puddle mask in screen space
    pm.setTransform(1, 0, 0, 1, 0, 0); pm.clearRect(0, 0, 960, 270); pm.setTransform(S, 0, 0, S, tx / 2, (ty - yh) / 2); pm.drawImage(puddle, 0, 0);
    // rough asphalt: vertical smear (squash then stretch) and soft blur
    rs.setTransform(1, 0, 0, 1, 0, 0); rs.clearRect(0, 0, 960, 45); rs.filter = 'blur(2.5px)'; rs.drawImage(RF2, 0, 0, 960, h2, 0, 0, 960, Math.max(4, h2 / 8)); rs.filter = 'none';
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = .9; ctx.drawImage(RS, 0, 0, 960, Math.max(4, h2 / 8), 0, yh, W, hR);
    // puddles: sharper mirror
    rf.setTransform(1, 0, 0, 1, 0, 0); rf.clearRect(0, 0, 960, 270); rf.filter = 'blur(1.2px)'; rf.drawImage(RF2, 0, 0); rf.filter = 'none';
    rf.globalCompositeOperation = 'destination-in'; rf.drawImage(PM, 0, 0); rf.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = .85; ctx.drawImage(RF, 0, 0, 960, h2, 0, yh, W, h2 * 2);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // darken with distance from the wall (fresnel-ish)
    const g = ctx.createLinearGradient(0, yh, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)'); ctx.fillStyle = g; ctx.fillRect(0, yh, W, hR);
  }
  // 8 · drizzle lit by the signs, rings on the puddles
  let lit = 0, tot = 0; tubes.forEach((tb, i) => { lit += states[i][0] * states[i][1] * tb.len; tot += tb.len; }); lit = clamp(lit / tot * 1.4);
  const rainA = .06 + .16 * lit;
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round'; ctx.lineWidth = 1.3;
  for (let i = 0; i < 260; i++) { const sp2 = 1500 + hash(i * 3.7) * 700, ln = 26 + hash(i * 5.1) * 40, x0 = hash(i * 1.3) * (W + 200) - 100;
    const y = ((hash(i * 2.9) * (H + 200) + t * sp2) % (H + 200)) - 100, x = x0 - (y + 100) * .08, a = rainA * (.4 + .6 * hash(i * 7.7));
    const warm = x < 1450 ? '255,150,215' : '255,170,120';
    ctx.strokeStyle = `rgba(${y < 650 && x > 150 && x < 1550 ? warm : '170,190,230'},${a})`;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - ln * .08, y + ln); ctx.stroke(); }
  if (hR > 2) for (let i = 0; i < 14; i++) { const per = .9 + hash(i * 9.1) * .8, ph = ((t + hash(i * 4.4) * per) % per) / per, age = ph;
    const wx = 100 + hash(i * 6.6 + Math.floor((t + hash(i * 4.4) * per) / per) * 1.7) * 1720, wy = HORIZON + 40 + hash(i * 8.2 + Math.floor((t + hash(i * 4.4) * per) / per)) * 180;
    const X = wx * S + tx, Y = wy * S + ty; if (Y < yh + 4 || Y > H) continue;
    ctx.strokeStyle = `rgba(200,190,230,${(1 - age) * .14 * (.3 + lit)})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(X, Y, 4 + age * 38 * S, (1.2 + age * 7) * S, 0, 0, TAU); ctx.stroke(); }
  ctx.globalCompositeOperation = 'source-over';
  // 9 · lens: vignette, grain, fades
  const v = ctx.createRadialGradient(960, 520, 350, 960, 540, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)'); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay'; ctx.drawImage(grain[Math.floor(t * 12) % 4], 0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const fade = Math.max(1 - seg(t, 0, .7), seg(t, 9.0, 9.8));
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// events for the sound design: strikes, the pen hiss, chase ticks, faulty crackles, cut, last blink, hum level
window.events = () => {
  const ev = [];
  ev.push({ k: 'pen', t: T_PEN0, d: T_PEN1 - T_PEN0 });
  for (let c = 0; c < 11; c++) if (c !== 4) ev.push({ k: 'strike', t: T_SERVED + c * .1 + (c === FAULT_IX ? .45 : 0), v: .8 });
  ev.push({ k: 'strike', t: T_ARROW, v: 1 });
  for (let k = 0; ; k++) { const t = T_ARROW + .45 + k / 9; if (t >= T_CUT) break; ev.push({ k: 'tick', t, v: ((k % 12) >= 8) ? 1 : .6 }); }
  ev.push({ k: 'strike', t: T_DOOR, v: .9 }); for (let c = 0; c < 4; c++) ev.push({ k: 'strike', t: T_DOOR + .3 + c * .06, v: .5 }), ev.push({ k: 'strike', t: T_DOOR + .62 + c * .06, v: .5 });
  for (const [a, b] of FAULTS) ev.push({ k: 'crackle', t: a, d: b - a });
  ev.push({ k: 'cut', t: T_CUT }); ev.push({ k: 'crackle', t: T_CUT + .5, d: .28 });
  const hum = []; for (let i = 0; i < 300; i++) { const t = i / 30; let s = 0; tubes.forEach(tb => { const [b, f] = tubeState(tb, t); s += b * f * tb.len; }); hum.push(+(s / 6000).toFixed(3)); }
  return { ev, hum };
};
window.ready = (async () => { buildTextures(); })();
</script></body></html>
