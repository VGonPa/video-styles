<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// Cubism: one acoustic guitar, built as a small 3D model in code and painted in flat tonal bands.
// A charcoal drawing of it goes down on a primed ochre canvas and fills with flat planes; then thin
// charcoal cut lines snap across the picture one after another and every new facet swings to its own
// viewpoint, so the round sound hole, the thin side and the neck are seen from different angles at
// once while the guitar stays in register. Passage and short hatching model the planes, three
// scissor-cut papers are pasted on (faux-bois, grey-blue paper, newsprint marks) and drawn over, the
// title is stippled through a stencil with a brush, and the picture settles and fades out.
// Every shape is generated in window.ready from seeded numbers; frames depend only on t.
const W = 1920, H = 1080, DUR = 9.6;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });

/* ------------------------------------------------------------ numbers */

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sstep = (a, b, v) => { const x = clamp((v - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };

/* ------------------------------------------------------------ palette */
const HEX = {
  ochre: '#b8913f', lochre: '#d2b06a', umber: '#6b4f2e', sienna: '#8a5a34',
  wgrey: '#8c877b', cgrey: '#5f625f', char: '#26231f',
  gblue: '#6e7f8d', dblue: '#45525e', white: '#e4d9bf',
  wood1: '#a07440', wood2: '#7a5530', wood0: '#c39a5c', news: '#d9d2bf', ink: '#8f8a7e',
};
const C = {};
for (const k in HEX) C[k] = [1, 3, 5].map(i => parseInt(HEX[k].slice(i, i + 2), 16));

const GROUND = mix(C.ochre, C.wgrey, 0.45);

// Each surface is painted from a ramp of four tones (shadow → light); a facet's tint mixes the ochre,
// grey and grey-blue versions of the same ramp.
const RAMP = {
  top: [[C.umber, mix(C.ochre, C.umber, 0.45), C.ochre, C.lochre],
        [C.cgrey, mix(C.wgrey, C.cgrey, 0.4), C.wgrey, mix(C.wgrey, C.white, 0.5)],
        [C.dblue, mix(C.gblue, C.dblue, 0.4), C.gblue, mix(C.gblue, C.white, 0.42)]],
  side: [[mix(C.char, C.umber, 0.55), C.umber, C.sienna, mix(C.sienna, C.ochre, 0.55)],
         [mix(C.char, C.cgrey, 0.5), C.cgrey, mix(C.cgrey, C.wgrey, 0.5), C.wgrey],
         [mix(C.char, C.dblue, 0.5), C.dblue, mix(C.dblue, C.gblue, 0.5), C.gblue]],
  board: [[C.char, mix(C.char, C.umber, 0.4), mix(C.char, C.umber, 0.7), C.umber],
          [C.char, mix(C.char, C.cgrey, 0.45), mix(C.char, C.cgrey, 0.75), C.cgrey],
          [C.char, mix(C.char, C.dblue, 0.45), mix(C.char, C.dblue, 0.75), C.dblue]],
  bridge: [[C.char, mix(C.char, C.umber, 0.5), C.umber, C.sienna]],
  bone: [[C.wgrey, mix(C.wgrey, C.white, 0.5), C.white, C.white]],
  rosette: [[C.umber, mix(C.umber, C.wgrey, 0.5), C.wgrey, mix(C.wgrey, C.white, 0.4)]],
  hole: [[mix(C.char, [0, 0, 0], 0.3), mix(C.char, [0, 0, 0], 0.3), C.char, C.char]],

RAMP.neck = RAMP.side; RAMP.head = RAMP.side;
function tone(mat, band, tint, key = 0) {
  const R = RAMP[mat];

  if (R.length === 1) return R[0][band];

  return c;
}

/* ------------------------------------------------------------ the guitar (local units: x across the body, y along the neck, z out of the top) */
const ZF = 0.2, ZB = -0.2, PY = 0.2, Y0 = -1.23, Y1 = 0.85;
const TILT = -0.5236, SC = 262, PIV = [820, 630], CAMD = 9;
function halfWidth(y) {                         // two bouts joined by a softened waist
  const lo = 0.4624 - (y + 0.55) ** 2, up = 0.2209 - (y - 0.38) ** 2;
  return Math.max(lo > 0 ? Math.sqrt(lo) : 0, up > 0 ? Math.sqrt(up) : 0) + 0.07 * Math.exp(-(((y - 0.045) / 0.12) ** 2));
}
const OUT = [];                                 // body outline, counter-clockwise
{
  const n = 44;
  for (let k = 0; k <= n; k++) { const y = Y0 + (Y1 - Y0) * (1 - Math.cos(Math.PI * k / n)) / 2; OUT.push([halfWidth(y), y]); }
  for (let k = n - 1; k >= 1; k--) OUT.push([-OUT[k][0], OUT[k][1]]);
}
const SIDEN = OUT.map((p, i) => {
  const q = OUT[(i + 1) % OUT.length], dx = q[0] - p[0], dy = q[1] - p[1], l = Math.hypot(dx, dy) || 1;
  return [dy / l, -dx / l, 0];

const sub3 = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];

    const a = pts[i], b = pts[(i + 1) % pts.length];

  }

  const d = sub3(c, centre), sg = d[0] * nx + d[1] * ny + d[2] * nz < 0 ? -1 : 1;
  return [sg * nx / l, sg * ny / l, sg * nz / l];
}
const PARTS = [];                               // faces of the neck, head, bridge and fittings
function hexa(corner, mats, grp, line) {        // corner(xi, yi, zi) → point; mats: front (z+) and the rest
  const P = [];
  for (let i = 0; i < 8; i++) P.push(corner(i & 1, (i >> 1) & 1, (i >> 2) & 1));
  const centre = P.reduce((s, p) => [s[0] + p[0] / 8, s[1] + p[1] / 8, s[2] + p[2] / 8], [0, 0, 0]);
  for (const [idx, front] of [[[4, 5, 7, 6], 1], [[0, 2, 3, 1], 0], [[0, 4, 6, 2], 0], [[1, 3, 7, 5], 0], [[0, 1, 5, 4], 0], [[2, 6, 7, 3], 0]]) {
    const pts = idx.map(i => P[i]);

  }
}
function flat(pts, n, mat, grp) { PARTS.push({ pts, n, mat, grp, line: 0 }); }
const HEAD_A = 0.21, NUT = 2.25, HEADL = 0.56;
const headPt = (x, u, z) => [x, NUT + u * Math.cos(HEAD_A), z - u * Math.sin(HEAD_A)];
{
  hexa((xi, yi, zi) => { const w = yi ? 0.088 : 0.105; return [xi ? w : -w, yi ? NUT : 0.8, zi ? 0.24 : 0.0]; }, ['board', 'neck'], 'neck', 2.2);
  hexa((xi, yi, zi) => [xi ? 0.106 : -0.106, yi ? 0.82 : 0.42, zi ? 0.24 : 0.2], ['board', 'board'], 'neck', 1.6);
  hexa((xi, yi, zi) => { const w = yi ? 0.136 : 0.118; return headPt(xi ? w : -w, yi ? HEADL : 0, zi ? 0.215 : 0.145); }, ['head', 'head'], 'head', 2.2);
  hexa((xi, yi, zi) => [xi ? 0.27 : -0.27, yi ? -0.565 : -0.665, zi ? 0.245 : 0.2], ['bridge', 'bridge'], 'bridge', 1.6);

const disc = (cx, cy, r, z, n) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(2 * Math.PI * i / n), cy + r * Math.sin(2 * Math.PI * i / n), z]);
const ROSETTE = disc(0, 0.18, 0.245, ZF + 0.002, 40), HOLE = disc(0, 0.18, 0.185, ZF + 0.004, 40);
const STRINGS = Array.from({ length: 6 }, (_, i) => [[-0.105 + 0.042 * i, -0.592, 0.263], [-0.062 + 0.0248 * i, NUT, 0.259]]);

// tonal bands across the top: straight boundaries in the guitar's own frame, so they turn with it
const TOPBANDS = [-0.62, -0.08, 0.42];

/* ------------------------------------------------------------ charcoal */

// tapered where it starts and stops. `frac` draws only the first part (a line being drawn on);

const CHAR = rgba(C.char, 0.9);

/* ------------------------------------------------------------ drawing the guitar from one viewpoint */

        while (x < end) { const l = 6 + R() * 26; if (x + l > end) break; g.fillRect(x, y, l, 4); x += l + 4 + R() * 3; }
      }
      pc.base = rgba(C.news);
    }
    if (pc.kind === 'sheet') {                  // unbleached paper for the title: just its fibre
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const v = (wob2(x / 50, y / 50, 6) - 0.5) * 7 + (hash2(x * 571 + y, 12) - 0.5) * 5;
        const o = (y * w + x) * 4; D[o] = C.white[0] + v; D[o + 1] = C.white[1] + v; D[o + 2] = C.white[2] + v - 1; D[o + 3] = 255;
      }
      g.putImageData(img, 0, 0); pc.base = rgba(C.white);
    }
    pc.tex = cvs;
    // the moment it first touches down (for the thump)
    let x = 0.3; while (x < 1 && backC(x) < 1) x += 0.002;
    pc.land = pc.t0 + pc.d * x;
  }
}
function piecePath(pc, st) {
  const P = new Path2D(), ca = Math.cos(st.rot), sa = Math.sin(st.rot);
  const pts = pc.poly.map(([x, y]) => { const dx = x - pc.c[0], dy = y - pc.c[1]; return [pc.c[0] + st.ox + dx * ca - dy * sa, pc.c[1] + st.oy + dx * sa + dy * ca]; });
  polyPath(P, pts);
  return P;
}
function drawPiece(pc, t, camS) {
  const st = pieceState(pc, t); if (!st) return;
  const P = piecePath(pc, st);
  ctx.save();
  ctx.shadowColor = 'rgba(30,22,12,0.4)'; ctx.shadowBlur = (8 + 30 * st.lift) * camS;
  ctx.shadowOffsetX = (5 + 26 * st.lift) * camS; ctx.shadowOffsetY = (7 + 32 * st.lift) * camS;
  ctx.fillStyle = pc.base; ctx.fill(P);
  ctx.restore();
  ctx.save(); ctx.clip(P);
  ctx.translate(pc.c[0] + st.ox, pc.c[1] + st.oy); ctx.rotate(st.rot); ctx.translate(-pc.c[0], -pc.c[1]);
  ctx.drawImage(pc.tex, pc.bb[0], pc.bb[1]);
  ctx.restore();
  ctx.save(); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(244,236,214,0.6)'; ctx.stroke(P);
  ctx.translate(1.2, 1.6); ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(40,30,18,0.35)'; ctx.stroke(P); ctx.restore();
}

/* ------------------------------------------------------------ the stencil title */
// Paint dabbed through a stencil with a stiff brush: thousands of small stipple dabs inside the
// letters (the stencil's own bridges included), clipped by a slightly dry-brushed letter mask. Each
// dab has a threshold from one shared noise field, so every letter fills in at the same rate; the dabs
// are grouped by threshold into layers, painted once in ready.
const TITLE = { text: 'CUBISM', cx: 1488, cy: 804, ang: -0.07, size: 143, w: 760, h: 240, spacing: 10, dab: 4.0, step: 4.0, seed: 61 };
const SUBT = { text: 'PARIS · 1907–1914', cx: 1488, cy: 908, ang: -0.07, size: 50, w: 640, h: 92, spacing: 7, dab: 1.7, step: 2.2, seed: 62 };
const TL = { title: [6.86, 7.28], sub: [7.08, 7.42], fade: [8.95, 9.6] };
const NLAYER = 24;
function buildStencil(S) {
  const mask = newCanvas(S.w, S.h), m = mask.getContext('2d');
  m.font = `700 ${S.size}px "Stardos Stencil"`; m.letterSpacing = S.spacing + 'px';
  let size = S.size;
  while (m.measureText(S.text).width > S.w - 40) { size -= 2; m.font = `700 ${size}px "Stardos Stencil"`; }
  m.textAlign = 'center'; m.textBaseline = 'middle'; m.fillStyle = '#000';
  m.fillText(S.text, S.w / 2, S.h / 2);
  const A = m.getImageData(0, 0, S.w, S.h).data;
  // the dry-brushed edge: the letter alpha thresholded against a fine noise, so the rim breaks up a little
  const em = m.createImageData(S.w, S.h), E = em.data;
  for (let y = 0; y < S.h; y++) for (let x = 0; x < S.w; x++) {
    const o = (y * S.w + x) * 4, a = A[o + 3] / 255;
    const th = 0.5 + 0.38 * (wob2(x / 2.2, y / 2.2, S.seed) - 0.5) + 0.25 * (hash2(x * 7 + y * 1031, S.seed) - 0.5);
    E[o + 3] = a >= 0.98 ? 255 : 255 * sstep(th - 0.08, th + 0.08, a);
  }
  m.clearRect(0, 0, S.w, S.h); m.putImageData(em, 0, 0);
  const R = seeded(S.seed);
  const layers = Array.from({ length: NLAYER }, () => newCanvas(S.w, S.h));
  const lg = layers.map(c => c.getContext('2d'));
  for (let y = 0; y < S.h; y += S.step) for (let x = 0; x < S.w; x += S.step) {
    const px = x + R() * S.step, py = y + R() * S.step;
    const xi = Math.min(S.w - 1, Math.round(px)), yi = Math.min(S.h - 1, Math.round(py));
    let near = 0;
    for (const [ox, oy] of [[0, 0], [5, 0], [-5, 0], [0, 5], [0, -5]]) { const xx = clamp(xi + ox, 0, S.w - 1), yy = clamp(yi + oy, 0, S.h - 1); near = Math.max(near, A[(yy * S.w + xx) * 4 + 3]); }
    if (near < 20) continue;
    // one shared field: fine noise plus a little texture smaller than a stroke, never larger than a letter
    const th = clamp(0.8 * R() + 0.2 * wob2(px / 9, py / 9, S.seed + 1), 0, 0.9999);
    const g = lg[Math.floor(th * NLAYER)];
    const tone = R(), col = tone < 0.15 ? mix(C.char, C.umber, 0.35) : C.char;
    g.fillStyle = rgba(col, 0.74 + 0.22 * R());
    g.beginPath(); g.ellipse(px, py, S.dab * (0.75 + 0.5 * R()), S.dab * (0.55 + 0.4 * R()), R() * 3.14, 0, 6.283); g.fill();
    for (let b = 0; b < 3; b++) {                // bristle specks around the dab
      const a = R() * 6.283, r = S.dab * (0.8 + 0.9 * R());
      g.beginPath(); g.arc(px + Math.cos(a) * r, py + Math.sin(a) * r, S.dab * (0.18 + 0.22 * R()), 0, 6.283); g.fill();
    }
  }
  for (const g of lg) { g.globalCompositeOperation = 'destination-in'; g.drawImage(mask, 0, 0); g.globalCompositeOperation = 'source-over'; }
  S.layers = layers;
}
function drawStencil(S, p) {
  if (p <= 0) return;
  ctx.save(); ctx.translate(S.cx, S.cy); ctx.rotate(S.ang);
  const f = p * NLAYER;
  for (let k = 0; k < NLAYER; k++) {
    const a = clamp(f - k, 0, 1);
    if (a <= 0) break;
    ctx.globalAlpha = a; ctx.drawImage(S.layers[k], -S.w / 2, -S.h / 2);
  }
  ctx.restore();
}

/* ------------------------------------------------------------ canvas weave (screen space, static) */
let WEAVE = null;
function buildWeave() {
  WEAVE = newCanvas(W, H);
  const g = WEAVE.getContext('2d'), img = g.createImageData(W, H), D = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ph = ((Math.floor(x / 5) + Math.floor(y / 5)) & 1);
    const thr = ph ? 0.5 + 0.5 * Math.sin(2 * Math.PI * y / 5 + 0.8 * Math.sin(x / 23)) : 0.5 + 0.5 * Math.sin(2 * Math.PI * x / 5 + 0.8 * Math.sin(y / 29));
    const nx = x / W - 0.5, ny = y / H - 0.5, vig = 1 - 0.22 * (nx * nx + ny * ny) * 2.2;
    const v = 255 * vig * (0.955 + 0.03 * thr + 0.015 * (wob2(x / 60, y / 60, 8) - 0.5));
    const o = (y * W + x) * 4; D[o] = v; D[o + 1] = v * 0.995; D[o + 2] = v * 0.985; D[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}

/* ------------------------------------------------------------ one frame */
const CAMC = [980, 500];
const camScale = t => 1 + 0.045 * ease3((t - 1.4) / 3.4);
function drawLeaf(n, t, mode) {
  const s = state(n, t), v = driftView(n, s.view, t);
  ctx.save(); ctx.clip(n.path);
  if (mode !== 'lines') { ctx.fillStyle = rgba(s.bg); ctx.fill(n.path); }
  if (n.guitar || !n.parent) {
    const first = !n.parent, an = n.anchor || SOUNDHOLE;
    ctx.save();
    ctx.translate(an[0] + v.dx, an[1] + v.dy); ctx.rotate(v.rot); ctx.scale(v.sc, v.sc); ctx.translate(-an[0], -an[1]);
    drawGuitar(ctx, v, s.tint, {
      fill: first ? prog(FILLS, t) : FULL, line: first ? prog(SKETCH, t) : LINES,
      fills: mode !== 'lines', seed: n.id * 13, key: Math.round(s.key),
    });
    ctx.restore();
  }
  if (mode !== 'lines' && n.parent) {
    // passage: darker toward one edge, lighter toward the other; crossfades from the parent's
    const k = sstep(n.birth, n.birth + 0.45, t);
    const grad = (m, a) => passage(m, a, n.path);
    // the gradient endpoints are the polygon's extent along the passage direction (projected through the origin)
    if (n.parent.parent && k < 1) grad(n.parent, (1 - k) * sstep(n.parent.birth, n.parent.birth + 0.45, n.birth));
    grad(n, k);
    hatchFill(n, sstep(n.birth + LOCK, n.birth + LOCK + 0.5, t));
  }
  ctx.restore();
}
function drawCuts(t) {
  const P = new Path2D();
  for (const c of CUTS) {
    if (!c.shown) continue;
    const f = (t - (c.birth - SNAP)) / SNAP;
    if (f <= 0) continue;
    ribbon(P, [c.p0, c.p1], false, c.w, c.seed, Math.min(1, f), c.gaps, 1.1);
  }
  ctx.fillStyle = CHAR; ctx.fill(P);
}
function render(t) {
  STAMP = t;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = rgba(GROUND); ctx.fillRect(0, 0, W, H);
  const s = camScale(t);
  ctx.setTransform(s, 0, 0, s, CAMC[0] * (1 - s), CAMC[1] * (1 - s));
  const leaves = leavesAt(t);
  for (const n of leaves) drawLeaf(n, t, 'full');
  for (const sh of SHARDS) drawShard(sh, t, 'full');
  drawCuts(t);
  // the papers, then the drawing carried on over them
  for (const pc of PIECES) {
    drawPiece(pc, t, s);
    if (pc.kind === 'sheet') continue;            // the title's sheet stays calm: nothing drawn over it
    const a = sstep(pc.land + 0.05, pc.land + 0.4, t);
    if (a <= 0) continue;
    const st = pieceState(pc, t), P = piecePath(pc, st);
    ctx.save(); ctx.clip(P); ctx.globalAlpha = a;
    for (const n of leaves) if (n.guitar) drawLeaf(n, t, 'lines');
    for (const sh of SHARDS) drawShard(sh, t, 'lines');
    drawCuts(t);
    ctx.restore();
  }
  drawStencil(TITLE, ease3(lin(TL.title[0], TL.title[1], t)));
  drawStencil(SUBT, ease3(lin(TL.sub[0], TL.sub[1], t)));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(WEAVE, 0, 0); ctx.globalCompositeOperation = 'source-over';
  const fade = sstep(TL.fade[0], TL.fade[1] - 0.02, t);
  if (fade > 0) { ctx.fillStyle = `rgba(8,7,6,${fade})`; ctx.fillRect(0, 0, W, H); }
}

window.draw = function ({ t }) { render(t); const url = cv.toDataURL('image/jpeg', 0.92); return url.slice(url.indexOf(',') + 1); };

window.events = function () {
  const r3 = v => Math.round(v * 1000) / 1000, pan = x => r3(clamp((x - W / 2) / (W / 2), -1, 1)), ev = [];
  const sx = { top: 700, side: 760, hole: 820, neck: 990, head: 1130, bridge: 690 };
  for (const [k, [a, b]] of Object.entries(SKETCH)) ev.push({ k: 'scratch', t: a, d: r3(b - a), p: pan(sx[k]), v: k === 'top' || k === 'side' ? 1 : 0.6 });
  for (const [k, [a, b]] of Object.entries(FILLS)) ev.push({ k: 'fill', t: a, d: r3(b - a), p: pan(sx[k] || 800) });
  SHARDS.forEach((sh, i) => {
    ev.push({ k: 'cut', t: r3(sh.birth - SNAP), d: SNAP, p: pan(sh.anchor[0]), v: 0.9 });
    ev.push({ k: 'lock', t: sh.lock, i: 98 + i, p: pan(sh.anchor[0]), g: 1 });
  });
  for (const c of CUTS) {
    if (c.shown) ev.push({ k: 'cut', t: r3(c.birth - SNAP), d: SNAP, p: pan(c.mid[0]), v: r3(Math.min(1, Math.hypot(c.p1[0] - c.p0[0], c.p1[1] - c.p0[1]) / 700)) });
    ev.push({ k: 'lock', t: r3(c.lock), i: c.idx, p: pan(c.mid[0]), g: c.node.guitar > 0 ? 1 : 0 });
  }
  for (const pc of PIECES) {
    const p = pan(pc.c[0]);
    ev.push({ k: 'snip', t: r3(pc.t0 - 0.36), p }, { k: 'snip', t: r3(pc.t0 - 0.2), p });
    ev.push({ k: 'slide', t: r3(pc.t0), d: r3(pc.land - pc.t0), p: pan(pc.c[0] + pc.from[0] * 0.4), p1: p });
    ev.push({ k: 'land', t: r3(pc.land), p, kind: pc.kind });
    if (pc.kind !== 'sheet') ev.push({ k: 'scratch', t: r3(pc.land + 0.08), d: 0.32, p, v: 0.45 });
  }
  ev.push({ k: 'dabs', t: TL.title[0], d: r3(TL.title[1] - TL.title[0]), p: pan(TITLE.cx), v: 1 });
  ev.push({ k: 'dabs', t: TL.sub[0], d: r3(TL.sub[1] - TL.sub[0]), p: pan(SUBT.cx), v: 0.5 });
  ev.push({ k: 'strum', t: TL.sub[1] });
  ev.push({ k: 'fade', t: TL.fade[0], d: r3(TL.fade[1] - TL.fade[0]) });
  return ev.sort((a, b) => a.t - b.t);
};

window.ready = (async () => {
  await document.fonts.load(`700 ${TITLE.size}px "Stardos Stencil"`);
  await document.fonts.ready;
  buildGrain();
  buildFacets();
  buildPieces();
  buildStencil(TITLE); buildStencil(SUBT);
  buildWeave();
})();
</script>
