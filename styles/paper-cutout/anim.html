<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #000; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* Paper Cutout · "A Fox's Winter Night" (10 s)
   Card layers of a winter valley rise into place at dusk. A paper fox held together with brass
   split pins trots across the snow while the sun sinks; a navy night card is pulled across the
   sky, the moon climbs, stars are lowered on threads and cut-paper snow begins to fall. The fox
   settles under the tall pine, the cabin windows glow one by one, and a title card comes down on
   strings. window.draw({ t }) returns the frame as base64 JPEG. */

const SW = 1920, SH = 1080;
const view = document.getElementById('c');
const out = view.getContext('2d');
const SERIF = "'Fraunces', Georgia, serif";
const TAU = Math.PI * 2;

// ── numbers ──────────────────────────────────────────────────────────────────
const unit = v => (v < 0 ? 0 : v > 1 ? 1 : v);
const mix = (p, q, k) => p * (1 - k) + q * k;
const span = (t, t0, t1) => unit((t - t0) / (t1 - t0));
const outCubic = v => { const u = 1 - unit(v); return 1 - u * u * u; };
const inOutCubic = v => { v = unit(v); return v < 0.5 ? 4 * v * v * v : 1 - 4 * (1 - v) ** 3; };
const backOut = (v, over = 1.7) => { const u = unit(v) - 1; return 1 + u * u * ((over + 1) * u + over); };

// mulberry32: small seeded generator, so every frame is reproducible
function seeded(n) {
  let a = n | 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let z = Math.imul(a ^ (a >>> 15), 1 | a);
    z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function surface(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  return cv;
}

// ── colour ───────────────────────────────────────────────────────────────────
const rgbOf = s => [1, 3, 5].map(i => parseInt(s.substr(i, 2), 16));
const css = a => 'rgb(' + a.map(v => Math.round(Math.max(0, Math.min(255, v)))).join(',') + ')';
const tint = (s, k) => css(rgbOf(s).map(v => v * k));
const blendHex = (s1, s2, k) => { const p = rgbOf(s1), q = rgbOf(s2); return css(p.map((v, i) => mix(v, q[i], k))); };

// ── paper grain: value-noise mottling, per-pixel tooth and short fibres ──────
const GRAIN = (() => {
  const N = 512, cv = surface(N, N), c = cv.getContext('2d'), rnd = seeded(1207);
  const cells = 16, lattice = Array.from({ length: cells * cells }, () => rnd() - 0.5);
  const node = (i, j) => lattice[(j % cells) * cells + (i % cells)];
  const smooth = f => f * f * (3 - 2 * f);
  const img = c.createImageData(N, N), px = img.data;
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const gx = x / N * cells, gy = y / N * cells, i = Math.floor(gx), j = Math.floor(gy);
      const u = smooth(gx - i), v = smooth(gy - j);
      const blot = mix(mix(node(i, j), node(i + 1, j), u), mix(node(i, j + 1), node(i + 1, j + 1), u), v);
      const n = blot * 0.6 + (rnd() - 0.5) * 0.9, o = (y * N + x) * 4;
      px[o] = px[o + 1] = px[o + 2] = n > 0 ? 255 : 0;
      px[o + 3] = Math.min(255, Math.abs(n) * 18);
    }
  }
  c.putImageData(img, 0, 0);
  c.lineCap = 'round'; // fibres
  for (let k = 0; k < 1400; k++) {
    const x = rnd() * N, y = rnd() * N, ang = rnd() * Math.PI, len = 4 + rnd() * 10, pale = rnd() > 0.5;
    c.strokeStyle = pale ? `rgba(255,255,255,${0.04 + rnd() * 0.05})` : `rgba(40,30,20,${0.03 + rnd() * 0.04})`;
    c.lineWidth = 0.4 + rnd() * 0.7;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len + (rnd() - 0.5) * 2);
    c.stroke();
  }
  return cv;
})();
const grainCache = new WeakMap();
function grainOn(c) {
  if (!grainCache.has(c)) grainCache.set(c, c.createPattern(GRAIN, 'repeat'));
  return grainCache.get(c);
}

// ── cut paper ────────────────────────────────────────────────────────────────
// Every shape is a Path2D. A cut piece is its colour, a paler lip where the upper-left cut edge
// catches the light, and the grain on top. Pieces glued onto other paper cast a small soft shadow.
const LIP_SHIFT = new DOMMatrix().translate(1.8, 2.4);
function cutShape(c, shape, colour, lipGain = 1.18) {
  c.save();
  c.clip(shape);
  c.fillStyle = colour;
  c.fill(shape);
  const lip = new Path2D();
  lip.rect(-5000, -5000, 10000, 10000);
  lip.addPath(shape, LIP_SHIFT);
  c.fillStyle = tint(colour, lipGain);
  c.fill(lip, 'evenodd');
  c.fillStyle = grainOn(c);
  c.fillRect(-5000, -5000, 10000, 10000);
  c.restore();
}
function gluedShadow(c, shape, dx, dy, blur = 6, alpha = 0.35) {
  c.save();
  c.shadowColor = `rgba(16,10,18,${alpha})`;
  c.shadowBlur = blur; c.shadowOffsetX = dx; c.shadowOffsetY = dy;
  c.fillStyle = '#16101a';
  c.fill(shape);
  c.restore();
}

// A sheet is one card of the diorama baked to a bitmap, plus its blurred silhouette that is
// drawn offset underneath as the shadow it throws on the card behind.
function bakeSheet({ w, h, ax, ay, parts, blur, after }) {
  const img = surface(w, h), c = img.getContext('2d');
  c.translate(ax, ay);
  for (const p of parts) {
    if (p.glue) gluedShadow(c, p.shape, p.glue[0], p.glue[1]);
    cutShape(c, p.shape, p.fill, p.lip);
  }
  if (after) after(c);
  const dark = surface(w, h), d = dark.getContext('2d');
  d.drawImage(img, 0, 0);
  d.globalCompositeOperation = 'source-in';
  d.fillStyle = '#0d0a14';
  d.fillRect(0, 0, w, h);
  const shade = surface(w, h), s = shade.getContext('2d');
  s.filter = `blur(${blur}px)`;
  s.drawImage(dark, 0, 0);
  return { img, shade, ax, ay };
}
// draw a sheet with its anchor at (x, y); o.cast = [dx, dy, alpha] adds the drop shadow
function place(sheet, x, y, o = {}) {
  const sx = o.sx ?? 1, sy = o.sy ?? 1, alpha = o.alpha ?? 1;
  out.save();
  out.translate(x, y);
  if (o.turn) out.rotate(o.turn);
  out.scale(sx, sy);
  if (o.cast && o.cast[2] > 0) {
    out.globalAlpha = o.cast[2] * alpha;
    out.drawImage(sheet.shade, o.cast[0] / sx - sheet.ax, o.cast[1] / sy - sheet.ay);
  }
  out.globalAlpha = alpha;
  out.drawImage(sheet.img, -sheet.ax, -sheet.ay);
  out.restore();
}

// ── shape helpers ────────────────────────────────────────────────────────────
function poly(pts) {
  const p = new Path2D();
  pts.forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y)));
  p.closePath();
  return p;
}
function box(x, y, w, h) { const p = new Path2D(); p.rect(x, y, w, h); return p; }
function disc(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return p; }
// region under the curve y = f(x) between x0 and x1, closed down to yBottom
function ridge(f, x0, x1, yBottom, dx = 12) {
  const p = new Path2D();
  p.moveTo(x0, yBottom);
  for (let x = x0; x < x1; x += dx) p.lineTo(x, f(x));
  p.lineTo(x1, f(x1));
  p.lineTo(x1, yBottom);
  p.closePath();
  return p;
}
// n-pointed star, alternating outer and inner radius
function starPts(cx, cy, n, rOut, rIn) {
  const pts = [];
  for (let k = 0; k < n * 2; k++) {
    const a = -Math.PI / 2 + k * Math.PI / n, r = k & 1 ? rIn : rOut;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  return pts;
}
// six-armed cut snowflake: a thin star with a small diamond barb on each arm
function flakeShape(cx, cy, R) {
  const p = poly(starPts(cx, cy, 6, R, R * 0.34));
  for (let k = 0; k < 6; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 3, ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = ux;
    const mx = cx + ux * R * 0.6, my = cy + uy * R * 0.6, half = R * 0.22;
    p.addPath(poly([[mx - ux * half * 0.6, my - uy * half * 0.6], [mx + vx * half, my + vy * half],
      [mx + ux * half * 0.9, my + uy * half * 0.9], [mx - vx * half, my - vy * half]]));
  }
  return p;
}
// a soft-edged paper zigzag between two x positions (used for snow caps)
function teeth(xFrom, xTo, yHi, yLo, count) {
  const pts = [];
  for (let k = 1; k < count * 2; k++) pts.push([mix(xFrom, xTo, k / (count * 2)), k & 1 ? yLo : yHi]);
  return pts;
}

// ── palette ──────────────────────────────────────────────────────────────────
const SNOWPAPER = '#f3efe6', BARK = '#4a3530';
const FUR = '#d9642a', SOCK = '#3b2620', BIB = '#f6ecdc';

// snowy pine: trunk, three green tiers and a zigzag snow cap glued on each tier
function pine(x, base, s, green) {
  const parts = [{ shape: box(x - 8 * s, base - 64 * s, 16 * s, 66 * s), fill: BARK }];
  for (let tier = 0; tier < 3; tier++) {
    const apex = base - 104 * s - tier * 46 * s, foot = apex + 86 * s, w = (64 - 15 * tier) * s;
    const body = new Path2D();
    body.moveTo(x, apex);
    body.quadraticCurveTo(x + 0.3 * w, apex + 46 * s, x + w, foot);
    body.quadraticCurveTo(x, foot - 10 * s, x - w, foot);
    body.quadraticCurveTo(x - 0.3 * w, apex + 46 * s, x, apex);
    body.closePath();
    parts.push({ shape: body, fill: green, glue: tier ? [3, 5] : null });
    const cap = new Path2D(), cw = 0.62 * w;
    cap.moveTo(x, apex);
    cap.quadraticCurveTo(x + 0.22 * w, apex + 34 * s, x + cw, apex + 60 * s);
    for (const [px, py] of teeth(x + cw, x - cw, apex + 52 * s, apex + 63 * s, 3)) cap.lineTo(px, py);
    cap.lineTo(x - cw, apex + 60 * s);
    cap.quadraticCurveTo(x - 0.22 * w, apex + 34 * s, x, apex);
    cap.closePath();
    parts.push({ shape: cap, fill: SNOWPAPER, glue: [2, 4] });
  }
  return parts;
}

// ── scene layout ─────────────────────────────────────────────────────────────
const PADX = 160, PADY = 60, SHEET_W = SW + 2 * PADX, SHEET_H = SH + 360, FLOOR = SH + 280;
const hillTop = x => 668 + 26 * Math.sin(x / 300) + 7 * Math.sin(x / 110 + 1);
const forestTop = x => 800 + 14 * Math.sin(x / 340 + 0.5);
const bankTop = x => 958 + 22 * Math.sin(x / 380 + 2.2) + 0.00005 * (x - 960) ** 2;
const CABIN = { x: 640, y: hillTop(640) + 22 };
const WINDOWS = [{ at: 6.35, dx: -33, dy: -48 }, { at: 6.7, dx: 35, dy: -48 }, { at: 6.95, dx: 0, dy: -95 }];
const TALL_PINE = 1345, FOX_STOP = 1290, FOX_GROUND = 915, FOX_SCALE = 0.88, FOX_START = -330;
const ART = {};

function buildMountains() {
  const peaks = [[120, 470, 260], [430, 405, 250], [760, 455, 230], [1080, 395, 260], [1420, 445, 240], [1720, 385, 260], [2000, 450, 220]];
  const top = x => peaks.reduce((best, [px, py, w]) => {
    const slope = (660 - py) / w;
    return Math.min(best, py + slope * (Math.hypot(x - px, 26) - 26));
  }, 660);
  const parts = [{ shape: ridge(top, -PADX, SW + PADX, FLOOR, 4), fill: '#8583bb' }];
  for (const [px, py] of peaks) {
    const edge = [];
    for (let x = px - 60; x <= px + 60; x += 6) edge.push([x, top(x) - 2]);
    parts.push({ shape: poly([...edge, ...teeth(px + 60, px - 60, py + 58, py + 82, 3)]), fill: SNOWPAPER, glue: [3, 4] });
  }
  return bakeSheet({ w: SHEET_W, h: SHEET_H, ax: PADX, ay: PADY, parts, blur: 14 });
}

function buildHill() {
  const { x: cx, y: cy } = CABIN, rnd = seeded(533);
  const parts = [{ shape: ridge(hillTop, -PADX, SW + PADX, FLOOR), fill: '#d4d9ea' }];
  const spots = [[260, 0.55], [330, 0.42], [880, 0.5], [940, 0.62], [1010, 0.44], [1560, 0.5], [1640, 0.38], [1810, 0.56]];
  for (const [px, s] of spots) parts.push(...pine(px, hillTop(px) + 10, s, rnd() < 0.5 ? '#3d6560' : '#35605a'));
  const rel = pts => poly(pts.map(([x, y]) => [cx + x, cy + y]));
  parts.push({ shape: box(cx + 26, cy - 132, 18, 44), fill: '#6b4a42' });
  parts.push({ shape: box(cx - 62, cy - 80, 124, 82), fill: '#a8553a', glue: [4, 5] });
  parts.push({ shape: rel([[-82, -72], [0, -132], [82, -72]]), fill: '#5b3a38', glue: [4, 5] });
  parts.push({ shape: rel([[-92, -66], [0, -140], [92, -66], [76, -71], [64, -61], [49, -78], [30, -72], [0, -116],
    [-30, -74], [-47, -80], [-63, -62], [-77, -70]]), fill: SNOWPAPER, glue: [3, 5] });
  const puff = new Path2D();
  puff.moveTo(cx + 24, cy - 134);
  puff.quadraticCurveTo(cx + 35, cy - 147, cx + 46, cy - 134);
  puff.closePath();
  parts.push({ shape: puff, fill: SNOWPAPER });
  parts.push({ shape: box(cx - 10, cy - 46, 22, 48), fill: '#4a2d27', glue: [2, 3] });
  // window holes are cut right through the card, so the lamp light placed behind shows through
  const after = c => {
    const holes = new Path2D();
    holes.rect(cx - 46, cy - 60, 26, 24);
    holes.rect(cx + 22, cy - 60, 26, 24);
    holes.addPath(disc(cx, cy - 95, 9));
    c.save();
    c.globalCompositeOperation = 'destination-out';
    c.fill(holes);
    c.restore();
    c.fillStyle = '#3b2622';
    for (const wx of [cx - 46, cx + 22]) {
      c.fillRect(wx + 12, cy - 60, 3, 24);
      c.fillRect(wx, cy - 49.5, 26, 3);
    }
  };
  return bakeSheet({ w: SHEET_W, h: SHEET_H, ax: PADX, ay: PADY, parts, blur: 14, after });
}

function buildForest() {
  const rnd = seeded(2121), parts = [{ shape: ridge(forestTop, -PADX, SW + PADX, FLOOR), fill: '#e6e9f2' }];
  for (let k = 0; k < 17; k++) {
    const x = -80 + 128 * k + 50 * rnd(), s = 0.78 + 0.55 * rnd(), green = rnd() < 0.5 ? '#24504a' : '#2c5d52';
    if (Math.abs(x - TALL_PINE) >= 170) parts.push(...pine(x, forestTop(x) + 8, s, green));
  }
  parts.push(...pine(TALL_PINE, forestTop(TALL_PINE) + 16, 2.2, '#214a44'));
  return bakeSheet({ w: SHEET_W, h: SHEET_H, ax: PADX, ay: PADY, parts, blur: 12 });
}

function buildBank() {
  const rnd = seeded(919), parts = [];
  for (const tx of [330, 700, 1000, 1830]) {
    const s = 0.8 + 0.4 * rnd(), y = bankTop(tx) + 4;
    // a bare twig: a stem with two side branches, cut as one outline
    const twig = [[-3, 0], [-2, -62], [-16, -88], [-12, -90], [1, -70], [4, -104], [8, -103], [5, -60],
      [20, -80], [23, -77], [5, -40], [4, 0]];
    parts.push({ shape: poly(twig.map(([x, yy]) => [tx + x * s, y + yy * s])), fill: '#6a4a3e' });
  }
  const bank = new Path2D();
  bank.moveTo(-PADX, FLOOR);
  bank.lineTo(-PADX, bankTop(-PADX));
  for (let x = -PADX; x < SW + PADX; x += 40) bank.quadraticCurveTo(x + 20, bankTop(x) - 22, x + 40, bankTop(x + 40));
  bank.lineTo(SW + PADX, FLOOR);
  bank.closePath();
  parts.push({ shape: bank, fill: '#f4f1ea' });
  return bakeSheet({ w: SHEET_W, h: SHEET_H, ax: PADX, ay: PADY, parts, blur: 16 });
}

function buildWings() {
  // big foreground pines cut off by the frame, like the wings of a toy theatre
  const strip = ridge(x => 1046 + 10 * Math.sin(x / 150), -PADX, SW + PADX, FLOOR);
  const parts = [...pine(110, 1190, 4.3, '#173631'), ...pine(SW + 90, 1200, 3.9, '#1b3d37'), { shape: strip, fill: '#e9e6e0' }];
  return bakeSheet({ w: SHEET_W, h: SHEET_H, ax: PADX, ay: PADY, parts, blur: 18 });
}

// a wavy-topped paper band from y0 down to the bottom of a w-wide card
function bandShape(w, y0, period, amp, wobble) {
  const p = new Path2D();
  p.moveTo(0, SH);
  p.lineTo(0, y0);
  for (let x = 0; x < w; x += period) p.quadraticCurveTo(x + period / 2, y0 - amp - wobble(x), x + period, y0);
  p.lineTo(w, SH);
  p.closePath();
  return p;
}
function layBand(c, shape, colour, shadow) {
  c.save();
  c.shadowColor = `rgba(20,10,20,${shadow})`;
  c.shadowBlur = 16; c.shadowOffsetX = 3; c.shadowOffsetY = 5;
  c.fillStyle = colour;
  c.fill(shape);
  c.restore();
  cutShape(c, shape, colour, 1.06);
}
function buildDusk() {
  const cv = surface(SW, SH), c = cv.getContext('2d');
  const bands = [['#6f67a6', -10], ['#a476a4', 210], ['#dc8f8e', 340], ['#f2b48c', 440], ['#f8d3a4', 520]];
  for (const [colour, y0] of bands) layBand(c, bandShape(SW, y0, 80, 14, x => 9 * Math.sin(x * 0.0077 + y0)), colour, 0.3);
  return cv;
}
function buildNight() {
  const w = SW + 40, cv = surface(w, SH), c = cv.getContext('2d');
  cutShape(c, box(0, 0, w, SH), '#26306c', 1);
  layBand(c, bandShape(w, 470, 60, 16, x => 10 * Math.sin(x / 90)), '#34428a', 0.45);
  c.fillStyle = 'rgba(255,255,255,0.13)';   // the leading cut edge of the card catches the light
  c.fillRect(0, 0, 4, SH);
  return cv;
}

function buildSkyPieces() {
  const crescent = new Path2D();
  crescent.arc(0, 0, 88, -1.15, 2.05);
  crescent.arc(-24, -12, 73, 2.05, -1.15, true);
  crescent.closePath();
  ART.moon = bakeSheet({ w: 400, h: 400, ax: 200, ay: 200, blur: 10,
    parts: [{ shape: disc(0, 0, 88), fill: '#f3e5c2' }, { shape: crescent, fill: '#e6d4ab', glue: [2, 3] }] });
  // sun: sixteen curled flame petals behind a round disc
  const flame = new Path2D(), step = TAU / 16;
  flame.moveTo(110, 0);
  for (let k = 0; k < 16; k++) {
    const a = k * step;
    flame.quadraticCurveTo(158 * Math.cos(a + 0.35 * step), 158 * Math.sin(a + 0.35 * step), 140 * Math.cos(a + 0.6 * step), 140 * Math.sin(a + 0.6 * step));
    flame.quadraticCurveTo(118 * Math.cos(a + 0.75 * step), 118 * Math.sin(a + 0.75 * step), 110 * Math.cos(a + step), 110 * Math.sin(a + step));
  }
  flame.closePath();
  ART.sun = bakeSheet({ w: 440, h: 440, ax: 220, ay: 220, blur: 10,
    parts: [{ shape: flame, fill: '#e9713f' }, { shape: disc(0, 0, 98), fill: '#f5a24a', glue: [4, 5] }] });
  ART.star = bakeSheet({ w: 140, h: 140, ax: 70, ay: 70, blur: 5, parts: [{ shape: STAR_SHAPE, fill: '#f6d98a' }] });
  ART.dot = bakeSheet({ w: 60, h: 60, ax: 30, ay: 30, blur: 3, parts: [{ shape: disc(0, 0, 12), fill: '#fbf8f1', lip: 1.05 }] });
  ART.flake = bakeSheet({ w: 100, h: 100, ax: 50, ay: 50, blur: 4, parts: [{ shape: flakeShape(0, 0, 26), fill: '#fbf8f1', lip: 1.05 }] });
}
const STAR_SHAPE = poly(starPts(0, 0, 5, 44, 19));

function build() {
  ART.dusk = buildDusk();
  ART.night = buildNight();
  buildSkyPieces();
  ART.cards = [
    { sheet: buildMountains(), depth: 1 },
    { sheet: buildHill(), depth: 2 },
    { sheet: buildForest(), depth: 3, fox: true },
    { sheet: buildBank(), depth: 4 },
    { sheet: buildWings(), depth: 5 },
  ];
  buildTitle();
}

// ── snowfall: seeded paper flakes in three depth bands ───────────────────────
// band 0 falls behind the forest, band 1 just in front of the fox, band 2 in front of everything
const SNOW_START = 2.3;
const SNOWFALL = [];
{
  const rnd = seeded(4242);
  const bands = [{ n: 70, lo: 0.45, hi: 0.75, v: 55, cut: 0 }, { n: 55, lo: 0.7, hi: 1.1, v: 85, cut: 0.12 }, { n: 16, lo: 0.9, hi: 1.4, v: 150, cut: 0.65 }];
  bands.forEach((b, depth) => {
    for (let k = 0; k < b.n; k++) {
      SNOWFALL.push({
        depth, x: -100 + rnd() * (SW + 200), start: -40 - rnd() * 1150, speed: b.v * (0.8 + 0.45 * rnd()),
        size: mix(b.lo, b.hi, rnd()), phase: rnd() * TAU, drift: 18 + 30 * rnd(), rate: 0.6 + 0.8 * rnd(),
        flip: 1 + 2.2 * rnd(), cut: rnd() < b.cut,
      });
    }
  });
}
function snowfall(t, depth, sun) {
  if (t < SNOW_START) return;
  const fallen = t - SNOW_START, gap = 1.2 + 1.4 * depth;
  for (const f of SNOWFALL) {
    if (f.depth !== depth) continue;
    const travelled = f.start + f.speed * fallen;
    if (travelled < -40) continue;
    const y = ((travelled + 40) % (SH + 100)) - 40;
    const x = f.x + f.drift * Math.sin(f.rate * t + f.phase);
    const k = f.size * (f.cut ? 0.8 : 1), face = Math.abs(Math.cos(f.flip * t + f.phase));

// ── title card ───────────────────────────────────────────────────────────────
const TITLE = { at: 7.2, restY: 285, words: [] };

function tornRect(w, h, seed, rough) {

    { words: ['Winter', 'Night'], font: `900 124px ${SERIF}`, spacing: '-1px', gap: 48, y: 88, colour: '#2b2d5c' },
  ];
  const widths = lines.map(line => {
    out.font = line.font;
    out.letterSpacing = line.spacing;
    const each = line.words.map(word => out.measureText(word).width);
    return { each, total: each.reduce((s, v) => s + v, 0) + line.gap * (each.length - 1) };
  });

    let x = -widths[i].total / 2;
    line.words.forEach((word, k) => {
      const w = widths[i].each[k];
      TITLE.words.push({ text: word, x: x + w / 2, y: line.y, font: line.font, spacing: line.spacing, colour: line.colour });

    { shape: flakeShape(-small / 2 - 48, -64, 17), fill: '#8e9fc9', glue: [2, 3] },
    { shape: flakeShape(small / 2 + 48, -64, 17), fill: '#8e9fc9', glue: [2, 3] },

function paintTitle(t, sun) {
  const p = span(t, TITLE.at, TITLE.at + 0.75);

  const y = TITLE.restY - 560 * (1 - backOut(p, 1.6));
  const settle = (1 - span(t, TITLE.at + 0.5, 8.45)) ** 2;

  out.translate(0, y + 20);

  out.lineWidth = 1.8;
  for (const hx of hooks) {

    out.rotate((1 - outCubic(q)) * (i % 2 ? 0.12 : -0.1));
    out.scale(s, s);
    out.font = word.font;
    out.letterSpacing = word.spacing;
    out.textAlign = 'center';
    out.textBaseline = 'alphabetic';
    out.shadowColor = 'rgba(20,12,30,0.45)';

    out.fillText(word.text, 0, 0);
    out.shadowColor = 'transparent';
    out.strokeStyle = 'rgba(255,255,255,0.18)';
    out.lineWidth = 1.5;
    out.strokeText(word.text, 0, 0);
    out.restore();

const SMOKE_FROM = 7.05;
function chimneySmoke(t, x, y, sun) {

const HANGING = [[150, 290, 0.95, 0.2], [320, 140, 0.75, 1.3], [1790, 330, 0.9, 0.7], [1880, 150, 0.65, 2.1]];

      WINDOWS.forEach((win, j) => {
        out.fillStyle = blendHex('#2a2436', '#ffcf73', lampLevel(t, j));
        out.fillRect(CABIN.x + dx + win.dx - 18, CABIN.y + dy + win.dy - 16, 36, 32);
      });
    }
    out.drawImage(card.sheet.img, dx - PADX, dy - PADY);
    if (card.depth === 2) {
      chimneySmoke(t, CABIN.x + dx + 35, CABIN.y + dy - 142, sun);
      snowfall(t, 0, sun);
    }
    if (card.fox) {                                        // the fox walks between the forest and the near bank
      pawPrints(pose, dx, dy);
      paintFox(pose);
      const fx = pose.x - 0.66 * cam, fy = FOX_GROUND + dy;
      out.save();
      out.globalAlpha = 0.28;
      out.filter = 'blur(8px)';
      out.fillStyle = '#1a1830';
      out.beginPath();
      out.ellipse(fx + 2 * sun[0], fy + 4, mix(120, 150, pose.lie), 12, 0, 0, TAU);
      out.fill();
      out.restore();
      out.save();
      out.shadowColor = 'rgba(13,10,20,0.5)';
      out.shadowBlur = 12;
      out.shadowOffsetX = 2.2 * sun[0];
      out.shadowOffsetY = 2.2 * sun[1];
      out.drawImage(FOX.cv, fx - FOX.ox, fy - FOX.oy);
      out.restore();
      snowfall(t, 1, sun);
    }
  });
  snowfall(t, 2, sun);

  // one light over all the paper: warm dusk turning to cool moonlight, with a soft vignette
  out.save();
  out.globalCompositeOperation = 'multiply';
  out.fillStyle = blendHex('#fff1e2', '#aab4e2', nightfall);
  out.fillRect(0, 0, SW, SH);
  const edge = out.createRadialGradient(960, 440, 260, 960, 540, 1250);
  edge.addColorStop(0, '#ffffff');
  edge.addColorStop(1, blendHex('#c9a98e', '#8e86a8', nightfall));
  out.fillStyle = edge;
  out.fillRect(0, 0, SW, SH);
  out.restore();
  // lamp glow spilling from the windows is a light source, so it is screened on top
  const glow = (lampLevel(t, 0) + lampLevel(t, 1) + 0.6 * lampLevel(t, 2)) / 2.6;
  if (glow > 0) {
    const gx = CABIN.x - 0.44 * cam, gy = CABIN.y + riseOffset(1, t) - 55;
    const halo = out.createRadialGradient(gx, gy, 6, gx, gy, 190);
    halo.addColorStop(0, `rgba(255,186,90,${0.5 * glow})`);
    halo.addColorStop(1, 'rgba(255,150,60,0)');
    out.save();
    out.globalCompositeOperation = 'screen';
    out.fillStyle = halo;
    out.fillRect(gx - 200, gy - 195, 400, 400);
    out.restore();
  }
  paintTitle(t, sun);
  // fade up from the dark and dim softly at the end, once the title has held
  const shown = Math.min(outCubic(span(t, 0, 0.6)), 1 - inOutCubic(span(t, 9.35, 10)));
  if (shown < 1) {
    out.fillStyle = `rgba(12,10,20,${1 - shown})`;
    out.fillRect(0, 0, SW, SH);
  }
}

// ── sound cues for events.mjs → audio.py ─────────────────────────────────────
window.events = () => {
  const cues = [];
  ART.cards.forEach((card, i) => {
    cues.push({ t: riseStart(i), k: 'slide', v: 1 - 0.08 * i });
    cues.push({ t: riseStart(i) + 0.5, k: 'tap', v: 1 - 0.1 * i, f: 150 - 12 * i });
  });
  // trotting: a crunch each time the fox covers half a stride
  let lastStep = null;
  for (let t = TROT_FROM; t < TROT_TO; t += 1 / 300) {
    const pose = foxAt(t), n = Math.floor(pose.dist / 75);
    if (lastStep !== null && n !== lastStep && pose.x > -120) cues.push({ t, k: 'step', v: unit(pose.amp + 0.2) });
    lastStep = n;
  }
  cues.push({ t: 3.0, k: 'tab', d: 1.2 }, { t: 4.18, k: 'tap', v: 0.8, f: 110 }, { t: 3.95, k: 'moon', d: 1.7 });
  const chimes = [1568, 1319, 1760, 2093];
  HANGING.forEach((_, i) => cues.push({ t: STARS_FROM + 0.14 * i + 0.45, k: 'star', f: chimes[i] }));
  cues.push({ t: 5.35, k: 'sniff' }, { t: 5.8, k: 'rustle', d: 0.8 }, { t: 6.1, k: 'rustle', d: 0.7 });
  const bells = [784, 988, 1175];
  WINDOWS.forEach((win, i) => cues.push({ t: win.at, k: 'light', f: bells[i] }));
  cues.push({ t: TITLE.at, k: 'whoosh', d: 0.7 }, { t: TITLE.at + 0.62, k: 'tap', v: 1, f: 120 });
  TITLE.words.forEach((_, i) => cues.push({ t: TITLE.at + 0.7 + 0.16 * i, k: 'pop', f: 300 + 40 * i }));
  cues.push({ t: TITLE.at + 1.3, k: 'chord' });
  return cues.sort((p, q) => p.t - q.t);
};

window.draw = ({ t, q }) => {
  paint(t);
  return view.toDataURL('image/jpeg', q || 0.92).split(',')[1];
};
window.ready = (async () => {
  await Promise.all([
    document.fonts.load(`900 124px ${SERIF}`, 'Winter Night'),
    document.fonts.load(`700 58px ${SERIF}`, 'A Fox’s'),
  ]);
  await document.fonts.ready;
  build();
  paint(0);
})();
</script>
