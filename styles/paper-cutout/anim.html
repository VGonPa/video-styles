<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"></head>
<body style="margin:0;background:#000"><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  PAPER CUTOUT — "A Fox's Winter Night", 10 s. window.draw({t}) → JPEG base64
//  Cardboard layers of a snowy forest slide up at dusk; a jointed paper fox trots in between the layers,
//  the sun sets, paper snow starts falling, the night card slides over the dusk like a pull tab, the moon
//  rises and threaded stars drop. The fox curls up under a big pine, the far cabin lights up, and a
//  paper title card drops in on threads.
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, DUR = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = x => 1 - Math.pow(1 - clamp(x), 3);
const eIn = x => Math.pow(clamp(x), 3);
const eInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eBack = (x, s = 1.7) => { x = clamp(x); const c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixHex = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; };
const shade = (h, k) => { const A = hex(h); return `rgb(${A.map(v => Math.round(clamp(v * k, 0, 255))).join(',')})`; };
const FONT = "'Fraunces', Georgia, serif";

// ── paper fibre texture (once) ───────────────────────────────────────────────
const TEX = mk(768, 768);
{
  const c = TEX.getContext('2d'), r = rng(7);
  for (let i = 0; i < 300; i++) {             // soft blotches
    const x = r() * 768, y = r() * 768, rad = 8 + r() * 40, dark = r() < .5;
    const g = c.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, dark ? 'rgba(0,0,0,0.012)' : 'rgba(255,255,255,0.008)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  c.lineCap = 'round';
  for (let i = 0; i < 2200; i++) {            // fibres
    const x = r() * 768, y = r() * 768, a = r() * Math.PI * 2, l = 3 + r() * 9, dark = r() < .5;
    c.strokeStyle = dark ? `rgba(0,0,0,${0.03 + r() * .05})` : `rgba(255,255,255,${0.035 + r() * .05})`;
    c.lineWidth = .5 + r() * .6; c.beginPath(); c.moveTo(x, y);
    c.quadraticCurveTo(x + Math.cos(a + .6) * l * .5, y + Math.sin(a + .6) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); c.stroke();
  }
  for (let i = 0; i < 5000; i++) { c.fillStyle = r() < .5 ? 'rgba(0,0,0,0.035)' : 'rgba(255,255,255,0.05)'; c.fillRect(r() * 768, r() * 768, 1.2, 1.2); }
}
const patOf = c => c.__pat || (c.__pat = c.createPattern(TEX, 'repeat'));

// ── a piece of paper: shape + texture + lit cut edge; its shadow is separate ─
const PADX = 160, PADT = 60, LW = W + PADX * 2, LH = H + 360;
function paperPiece(c, path, color, rimK = 1.18) {
  // lit lip of the cut edge: highlight first, then the main colour shifted 2px → thin highlight on the outer edge only
  c.save(); path(c); c.fillStyle = shade(color, rimK); c.fill(); c.clip();
  c.save(); c.translate(1.8, 2.4); path(c); c.fillStyle = color; c.fill(); c.restore();
  c.fillStyle = patOf(c); c.fillRect(-4000, -4000, 8000, 8000);
  c.restore();
}
function makeLayer(pieces, blur, ox = PADX, oy = PADT, lw = LW, lh = LH, post) {   // pieces: [{path, color, inner?}]
  const cvL = mk(lw, lh), c = cvL.getContext('2d'); c.translate(ox, oy);
  for (const p of pieces) {
    if (p.inner) {                           // piece glued on top of another: small inner shadow
      const s = mk(lw, lh), sc = s.getContext('2d'); sc.translate(ox, oy); p.path(sc); sc.fillStyle = '#000'; sc.fill();
      c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = .35; c.filter = 'blur(3px)'; c.drawImage(s, p.inner[0], p.inner[1]); c.restore();
    }
    paperPiece(c, p.path, p.color, p.rim);
  }
  if (post) post(c);
  const sh = mk(lw, lh), shc = sh.getContext('2d');
  shc.filter = `blur(${blur}px)`; shc.drawImage(cvL, 0, 0); shc.filter = 'none';
  shc.globalCompositeOperation = 'source-in'; shc.fillStyle = '#0d0a14'; shc.fillRect(0, 0, lw, lh);
  return { cv: cvL, sh, ox, oy };
}
function drawPiece(Lr, x, y, sdx, sdy, sAlpha, opts = {}) {
  const { sx = 1, sy = 1, rot = 0, alpha = 1 } = opts;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy);
  if (sAlpha > 0) { ctx.save(); ctx.globalAlpha = sAlpha * alpha; ctx.drawImage(Lr.sh, -Lr.ox + sdx / sx, -Lr.oy + sdy / sy); ctx.restore(); }
  ctx.globalAlpha = alpha; ctx.drawImage(Lr.cv, -Lr.ox, -Lr.oy);
  ctx.restore();
}

// ── scene geometry ───────────────────────────────────────────────────────────
const L = {};
const SNOW = '#f3efe6';
const hillY = x => 668 + Math.sin(x / 300) * 26 + Math.sin(x / 110 + 1) * 7;
const CAB = { x: 640, y: hillY(640) + 22 };
const gy = x => 800 + Math.sin(x / 340 + .5) * 14;
const BIGTREE = 1345, FOX_END = 1290, FOX_Y = 915, FOX_S = .88;
function smoothRidge(c, f, x0, x1, bottom, step = 12) { c.beginPath(); c.moveTo(x0, bottom); for (let x = x0; x <= x1; x += step) c.lineTo(x, f(x)); c.lineTo(x1, f(x1)); c.lineTo(x1, bottom); c.closePath(); }
function star5(c, x, y, R, r, rot = -Math.PI / 2) { c.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5, rr = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } c.closePath(); }
function flake6(c, x, y, R) {                 // six-armed cut snowflake
  c.beginPath();
  for (let i = 0; i < 12; i++) { const a = -Math.PI / 2 + i * Math.PI / 6, rr = i % 2 ? R * .34 : R; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath();
  for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3, px = x + Math.cos(a) * R * .62, py = y + Math.sin(a) * R * .62;
    c.moveTo(px + Math.cos(a + 1.1) * R * .3, py + Math.sin(a + 1.1) * R * .3); c.lineTo(px, py); c.lineTo(px + Math.cos(a - 1.1) * R * .3, py + Math.sin(a - 1.1) * R * .3); c.lineTo(px + Math.cos(a) * R * .1, py + Math.sin(a) * R * .1); c.closePath(); }
}
// snowy pine: tiers of green with a cut snow cap glued on each tier
function pinePieces(x, y, s, col) {
  const out = [];
  out.push({ path: c => { c.beginPath(); c.rect(x - 8 * s, y - 64 * s, 16 * s, 66 * s); }, color: '#4a3530' });
  for (let k = 0; k < 3; k++) {
    const ty = y - 58 * s - k * 46 * s, w = (64 - k * 15) * s;
    out.push({ path: c => { c.beginPath(); c.moveTo(x - w, ty + 40 * s); c.quadraticCurveTo(x - w * .3, ty, x, ty - 46 * s); c.quadraticCurveTo(x + w * .3, ty, x + w, ty + 40 * s);
      c.quadraticCurveTo(x, ty + 30 * s, x - w, ty + 40 * s); c.closePath(); }, color: col, inner: k ? [3, 5] : null });
    out.push({ path: c => { c.beginPath(); c.moveTo(x - w * .62, ty + 14 * s); c.quadraticCurveTo(x - w * .22, ty - 12 * s, x, ty - 46 * s); c.quadraticCurveTo(x + w * .22, ty - 12 * s, x + w * .62, ty + 14 * s);
      c.lineTo(x + w * .42, ty + 8 * s); c.lineTo(x + w * .26, ty + 18 * s); c.lineTo(x + w * .06, ty + 6 * s); c.lineTo(x - w * .14, ty + 17 * s); c.lineTo(x - w * .34, ty + 7 * s); c.lineTo(x - w * .5, ty + 16 * s); c.closePath(); }, color: SNOW, inner: [2, 4] });
  }
  return out;
}
function buildScene() {
  const BOT = H + 280;
  // 1: far mountains + snow caps
  const peaks = [[120, 470, 260], [430, 405, 250], [760, 455, 230], [1080, 395, 260], [1420, 445, 240], [1720, 385, 260], [2000, 450, 220]];
  const mf = x => { let m = 660; for (const [px, py, w] of peaks) { const k = (660 - py) / w, r = 26; m = Math.min(m, py + (Math.sqrt((x - px) ** 2 + r * r) - r) * k); } return m; };
  const snow = peaks.map(([x, y]) => c => { c.beginPath(); c.moveTo(x - 66, y + 80); c.quadraticCurveTo(x - 20, y - 2, x, y - 2); c.quadraticCurveTo(x + 20, y - 2, x + 66, y + 80);
    c.lineTo(x + 44, y + 68); c.lineTo(x + 24, y + 88); c.lineTo(x + 2, y + 66); c.lineTo(x - 18, y + 90); c.lineTo(x - 40, y + 68); c.closePath(); });
  L.mtn = makeLayer([{ path: c => smoothRidge(c, mf, -PADX, W + PADX, BOT, 4), color: '#8583bb' }, ...snow.map(p => ({ path: p, color: SNOW, inner: [3, 4] }))], 14);
  // 2: snowy hill with the far cabin (window holes: the lamp light behind shows through)
  const hx = CAB.x, hy = CAB.y, hr = rng(33), hill = [];
  hill.push({ path: c => smoothRidge(c, hillY, -PADX, W + PADX, BOT), color: '#d4d9ea' });
  for (const [px, s] of [[260, .55], [330, .42], [880, .5], [940, .62], [1010, .44], [1560, .5], [1640, .38], [1810, .56]]) hill.push(...pinePieces(px, hillY(px) + 10, s, hr() < .5 ? '#3d6560' : '#35605a'));
  hill.push({ path: c => { c.beginPath(); c.rect(hx + 26, hy - 132, 18, 44); }, color: '#6b4a42' });                       // chimney
  hill.push({ path: c => { c.beginPath(); c.rect(hx - 62, hy - 80, 124, 82); }, color: '#a8553a', inner: [4, 5] });          // log wall
  hill.push({ path: c => { c.beginPath(); c.moveTo(hx - 82, hy - 72); c.lineTo(hx, hy - 132); c.lineTo(hx + 82, hy - 72); c.closePath(); }, color: '#5b3a38', inner: [4, 5] });
  hill.push({ path: c => { c.beginPath(); c.moveTo(hx - 92, hy - 66); c.lineTo(hx, hy - 140); c.lineTo(hx + 92, hy - 66); c.lineTo(hx + 74, hy - 70); c.lineTo(hx + 66, hy - 60); c.lineTo(hx + 50, hy - 78);
    c.lineTo(hx + 30, hy - 72); c.lineTo(hx, hy - 116); c.lineTo(hx - 30, hy - 74); c.lineTo(hx - 48, hy - 80); c.lineTo(hx - 64, hy - 62); c.lineTo(hx - 76, hy - 71); c.closePath(); }, color: SNOW, inner: [3, 5] });
  hill.push({ path: c => { c.beginPath(); c.moveTo(hx + 24, hy - 134); c.quadraticCurveTo(hx + 35, hy - 146, hx + 46, hy - 134); c.closePath(); }, color: SNOW });
  hill.push({ path: c => { c.beginPath(); c.rect(hx - 10, hy - 46, 22, 48); }, color: '#4a2d27', inner: [2, 3] });           // door
  L.hill = makeLayer(hill, 14, PADX, PADT, LW, LH, c => {
    c.save(); c.globalCompositeOperation = 'destination-out'; c.beginPath();
    c.rect(hx - 46, hy - 60, 26, 24); c.rect(hx + 22, hy - 60, 26, 24); c.arc(hx, hy - 95, 9, 0, Math.PI * 2); c.fill(); c.restore();
    c.fillStyle = '#3b2622';                                                                   // mullions
    c.fillRect(hx - 34, hy - 60, 3, 24); c.fillRect(hx - 46, hy - 49.5, 26, 3); c.fillRect(hx + 34, hy - 60, 3, 24); c.fillRect(hx + 22, hy - 49.5, 26, 3);
  });
  // 3: forest band with the big pine the fox sleeps under
  const r = rng(21), trees = [];
  for (let i = 0; i < 17; i++) {
    const x = -80 + i * 128 + r() * 50; if (Math.abs(x - BIGTREE) < 170) continue;
    trees.push(...pinePieces(x, gy(x) + 8, .78 + r() * .55, r() < .5 ? '#24504a' : '#2c5d52'));
  }
  trees.push(...pinePieces(BIGTREE, gy(BIGTREE) + 16, 2.2, '#214a44'));
  L.tree = makeLayer([{ path: c => smoothRidge(c, gy, -PADX, W + PADX, BOT), color: '#e6e9f2' }, ...trees], 12);
  // 4: near snowbank with a scalloped cut edge
  const nh = x => 958 + Math.sin(x / 380 + 2.2) * 22 + (x - 960) * (x - 960) * 0.00005;
  const r3 = rng(9), twigs = [];
  for (const tx of [330, 700, 1000, 1830]) { const ty = nh(tx) + 4, s = .8 + r3() * .4;
    twigs.push({ path: c => { c.beginPath(); c.moveTo(tx - 3 * s, ty); c.lineTo(tx - 2 * s, ty - 62 * s); c.lineTo(tx - 16 * s, ty - 88 * s); c.lineTo(tx - 12 * s, ty - 90 * s); c.lineTo(tx + 1 * s, ty - 70 * s);
      c.lineTo(tx + 4 * s, ty - 104 * s); c.lineTo(tx + 8 * s, ty - 103 * s); c.lineTo(tx + 5 * s, ty - 60 * s); c.lineTo(tx + 20 * s, ty - 80 * s); c.lineTo(tx + 23 * s, ty - 77 * s); c.lineTo(tx + 5 * s, ty - 40 * s); c.lineTo(tx + 4 * s, ty); c.closePath(); }, color: '#6a4a3e' }); }
  L.near = makeLayer([...twigs, { path: c => { c.beginPath(); c.moveTo(-PADX, H + 280); let x = -PADX; c.lineTo(x, nh(x));
    while (x < W + PADX) { const y = nh(x), nx = x + 40; c.quadraticCurveTo(x + 20, y - 22, nx, nh(nx)); x = nx; } c.lineTo(W + PADX, H + 280); c.closePath(); }, color: '#f4f1ea' }], 16);
  // 5: front frame — big foreground pines cropped by the frame, like theatre wings
  L.front = makeLayer([...pinePieces(110, 1190, 4.3, '#173631'), ...pinePieces(W + 90, 1200, 3.9, '#1b3d37'),
    { path: c => smoothRidge(c, x => 1046 + Math.sin(x / 150) * 10, -PADX, W + PADX, H + 280), color: '#e9e6e0' }], 18);
  // sky cards: dusk (deckled paper bands) and the night card that slides over it
  L.dusk = mk(W, H); { const c = L.dusk.getContext('2d');
    const bands = [['#6f67a6', -10], ['#a476a4', 210], ['#dc8f8e', 340], ['#f2b48c', 440], ['#f8d3a4', 520]];
    for (const [col, y0] of bands) {
      const s = mk(W, H), sc = s.getContext('2d'); sc.beginPath(); sc.moveTo(0, H); sc.lineTo(0, y0);
      for (let x = 0; x <= W; x += 80) sc.quadraticCurveTo(x + 40, y0 - 16 + Math.sin(x / 130 + y0) * 10, x + 80, y0);
      sc.lineTo(W, H); sc.closePath(); sc.fillStyle = col; sc.fill(); sc.globalCompositeOperation = 'source-atop'; sc.fillStyle = patOf(sc); sc.fillRect(0, 0, W, H);
      c.save(); c.filter = 'blur(7px)'; c.globalAlpha = .28; c.globalCompositeOperation = 'source-atop'; c.drawImage(s, 4, 6); c.restore(); c.drawImage(s, 0, 0);
    } }
  L.night = mk(W + 40, H); { const c = L.night.getContext('2d');
    c.fillStyle = '#26306c'; c.fillRect(0, 0, W + 40, H); c.fillStyle = patOf(c); c.fillRect(0, 0, W + 40, H);
    const s = mk(W + 40, H), sc = s.getContext('2d'); sc.beginPath(); sc.moveTo(0, H); sc.lineTo(0, 470);
    for (let x = 0; x <= W + 40; x += 60) sc.quadraticCurveTo(x + 30, 450 + Math.sin(x / 90) * 10, x + 60, 470); sc.lineTo(W + 40, H); sc.closePath();
    sc.fillStyle = '#34428a'; sc.fill(); sc.globalCompositeOperation = 'source-atop'; sc.fillStyle = patOf(sc); sc.fillRect(0, 0, W + 40, H);
    c.save(); c.filter = 'blur(6px)'; c.globalAlpha = .45; c.globalCompositeOperation = 'source-atop'; c.drawImage(s, -3, 6); c.restore(); c.drawImage(s, 0, 0);
    c.fillStyle = 'rgba(255,255,255,0.13)'; c.fillRect(0, 0, 4, H); }  // left cut edge catches the light
  // moon, sun, stars, flakes
  L.moon = makeLayer([{ path: c => { c.beginPath(); c.arc(0, 0, 88, 0, Math.PI * 2); }, color: '#f3e5c2' },
    { path: c => { c.beginPath(); c.arc(0, 0, 88, -1.2, 2.0); c.arc(-26, -10, 74, 2.0, -1.2, true); c.closePath(); }, color: '#e6d4ab', inner: [2, 3] }], 10, 200, 200, 400, 400);
  L.sun = makeLayer([{ path: c => { c.beginPath(); for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, b = (i + .5) / 16 * Math.PI * 2;
      c.lineTo(Math.cos(a) * 112, Math.sin(a) * 112); c.quadraticCurveTo(Math.cos(a + .2) * 152, Math.sin(a + .2) * 152, Math.cos(b) * 142, Math.sin(b) * 142); c.quadraticCurveTo(Math.cos(b + .1) * 124, Math.sin(b + .1) * 124, Math.cos(b + Math.PI / 16) * 112, Math.sin(b + Math.PI / 16) * 112); } c.closePath(); }, color: '#e9713f' },
    { path: c => { c.beginPath(); c.arc(0, 0, 98, 0, Math.PI * 2); }, color: '#f5a24a', inner: [4, 5] }], 10, 220, 220, 440, 440);
  L.star = makeLayer([{ path: c => star5(c, 0, 0, 44, 19), color: '#f6d98a' }], 5, 70, 70, 140, 140);
  L.disc = makeLayer([{ path: c => { c.beginPath(); c.arc(0, 0, 12, 0, Math.PI * 2); }, color: '#fbf8f1', rim: 1.05 }], 3, 30, 30, 60, 60);
  L.flake = makeLayer([{ path: c => flake6(c, 0, 0, 26), color: '#fbf8f1', rim: 1.05 }], 4, 50, 50, 100, 100);
  buildCard();
}

// ── snowfall: seeded paper flakes at three depths (behind the trees, in front of the fox, in front of everything)
const FLAKES = []; { const r = rng(77);
  const spec = [[70, .45, .75, 55, 0], [55, .7, 1.1, 85, 0], [16, .9, 1.4, 150, .65]];
  spec.forEach(([n, s0, s1, v, pStar], g) => { for (let i = 0; i < n; i++) FLAKES.push({ g, x: r() * (W + 200) - 100, y0: -40 - r() * 1150, v: v * (.8 + r() * .45),
    s: s0 + r() * (s1 - s0), ph: r() * 6.28, sw: 18 + r() * 30, wf: .6 + r() * .8, spin: 1 + r() * 2.2, star: r() < pStar || (g === 1 && r() < .12) }); });
}
const SNOW_T0 = 2.3;
function drawFlakes(t, g, light) {
  if (t < SNOW_T0) return;
  for (const f of FLAKES) {
    if (f.g !== g) continue;
    let y = f.y0 + f.v * (t - SNOW_T0); if (y < -40) continue;
    y = (y + 40) % (H + 100) - 40;
    const x = f.x + Math.sin(t * f.wf + f.ph) * f.sw, flip = Math.cos(t * f.spin + f.ph);
    const k = f.s * (f.star ? .8 : 1), dd = 1.2 + g * 1.4;
    drawPiece(f.star ? L.flake : L.disc, x, y, light[0] * dd, light[1] * dd, .4, { sx: k * (.25 + .75 * Math.abs(flip)), sy: k, rot: t * .6 * (f.ph > 3 ? 1 : -1) });
  }
}

// ── the fox: a jointed paper puppet (split pins at hips, shoulders, neck and tail) ─
const FC = mk(760, 340), fctx = FC.getContext('2d'), FOX_OX = 400, FOX_OY = 290;
const FOXC = '#d9642a', FOXD = '#3b2620', CREAM = '#f6ecdc';
function capsule(c, x1, y1, w1, x2, y2, w2) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  c.beginPath(); c.arc(x1, y1, w1 / 2, a + Math.PI / 2, a - Math.PI / 2); c.arc(x2, y2, w2 / 2, a - Math.PI / 2, a + Math.PI / 2); c.closePath();
}
const piece = (c, path, col, rim) => { c.save(); c.shadowColor = 'rgba(20,10,10,0.35)'; c.shadowBlur = 4; c.shadowOffsetX = 1.5; c.shadowOffsetY = 2.5; path(c); c.fillStyle = col; c.fill(); c.restore(); paperPiece(c, path, col, rim); };
function pin(c, x, y) { c.save(); c.beginPath(); c.arc(x, y, 3.6, 0, Math.PI * 2); c.fillStyle = '#b88f3e'; c.fill(); c.beginPath(); c.arc(x - 1, y - 1, 1.5, 0, Math.PI * 2); c.fillStyle = '#f3dc9a'; c.fill(); c.restore(); }
// leg from joint (x,y): upper/lower angles measured from straight down, + = forward
function leg(c, x, y, a1, l1, w1, a2, l2, far) {
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1, px = kx + Math.sin(a2) * l2, py = ky + Math.cos(a2) * l2;
  const col = far ? shade(FOXC, .7) : FOXC, sock = far ? shade(FOXD, .8) : FOXD;
  piece(c, cc => capsule(cc, kx, ky, 15, px, py, 12), sock);
  piece(c, cc => { cc.beginPath(); cc.ellipse(px + 7, py - 3, 12, 6.5, 0, 0, Math.PI * 2); }, sock);
  piece(c, cc => capsule(cc, x, y, w1, kx, ky, 15), col);
  if (!far) pin(c, x, y + 4);
}
function spinePts(pts, n) {                   // Catmull-Rom through the tail joints
  const out = [];

// ── title card cut from paper (built once) ───────────────────────────────────
const CARD = { words: [] };

function buildCard() {

  ctx.font = `700 58px ${FONT}`; ctx.letterSpacing = '5px';

// ── timeline ─────────────────────────────────────────────────────────────────
const LAYERS = ['mtn', 'hill', 'tree', 'near', 'front'];
const DEPTH = { mtn: 1, hill: 2, tree: 3, near: 4, front: 5 };
const LIN = i => .15 + i * .16;                       // layer slide-in start
const STARS = [[150, 290, .95, .2], [320, 140, .75, 1.3], [1790, 330, .9, .7], [1880, 150, .65, 2.1]];
const STAR_T = 4.35;
const camAt = t => lerp(-40, 140, eInOut(seg(t, 1.0, 6.6)));
const WIN = [[6.35, -33, -48], [6.7, 35, -48], [6.95, 0, -95]];   // window light-on times, offsets from the cabin
const winOn = (t, i) => { const t0 = WIN[i][0]; let v = seg(t, t0, t0 + .08); if (i === 0 && t > t0 + .1 && t < t0 + .17) v = .25; return v; };

function renderFrame(t) {
  const night = eInOut(seg(t, 3.0, 4.3));
  // light: low sun on the left → shadows fall right; moon high on the right → shadows fall down-left
  const la = lerp(Math.PI * .12, Math.PI * .7, eInOut(seg(t, 3.0, 4.6)));
  const light = [Math.cos(la) * 7, Math.sin(la) * 7 + 1.5];
  const cam = camAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(L.dusk, 0, 0);
  const sunY = lerp(430, 760, eInOut(seg(t, 1.3, 3.6)));
  if (t < 4.3) drawPiece(L.sun, 330 - cam * .15, sunY, light[0] * 1.6, light[1] * 1.6, .35, { rot: t * .1 });
  // night card slides in from the right like a pull tab
  const nx = lerp(W + 80, 0, eInOut(seg(t, 3.0, 4.2)));
  if (nx < W + 60) {
    ctx.save(); ctx.filter = 'blur(14px)'; ctx.globalAlpha = .5; ctx.fillStyle = '#1a0f10'; ctx.fillRect(nx - 40, -20, 30, H + 40); ctx.restore();
    ctx.drawImage(L.night, nx, 0);

  if (mUp > 0) drawPiece(L.moon, 1650 - cam * .15, my, light[0] * 1.8, light[1] * 1.8, .45);
  // threaded stars drop once it is night
  STARS.forEach(([x, len, sc, ph], i) => {
    const t0 = STAR_T + i * .14; if (t < t0) return; const drop = eBack(seg(t, t0, t0 + .7), 2.6);

    ctx.save(); ctx.strokeStyle = 'rgba(245,236,214,0.75)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(px, -10); ctx.lineTo(ex, ey); ctx.stroke(); ctx.restore();

    drawPiece(L.star, ex, ey + 40 * sc, light[0] * 2, light[1] * 2, .5, { sx: sc * (Math.abs(spin) * .85 + .15), sy: sc, rot: -sw });
    if (spin < 0) { ctx.save(); ctx.globalAlpha = .35 * -spin; ctx.fillStyle = '#5a4020'; star5(ctx, ex, ey + 40 * sc, 44 * sc * Math.abs(spin), 19 * sc * Math.abs(spin)); ctx.fill(); ctx.restore(); }
  });

    const d = DEPTH[k], y = layerY(i, t), x = -cam * (d * .22);

    const gapK = d === 1 ? 1.6 : 1.1;
    ctx.save(); ctx.globalAlpha = .55; ctx.drawImage(L[k].sh, x - PADX + light[0] * gapK * 1.5, y - PADT + light[1] * gapK * 1.5); ctx.restore();

      const hx = CAB.x + x, hy = CAB.y + y;
      WIN.forEach((wn, j) => { const on = winOn(t, j), wx = hx + wn[1], wy = hy + wn[2];
        ctx.fillStyle = on > 0 ? mixHex('#2a2436', '#ffcf73', on) : '#2a2436'; ctx.fillRect(wx - 18, wy - 16, 36, 32); });
    }
    ctx.drawImage(L[k].cv, x - PADX, y - PADT);

      ctx.beginPath(); ctx.ellipse(fx + light[0] * 2, fy + 4, lerp(120, 150, fp.lie), 12, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

}

// ── sound events (read by events.mjs → audio.py) ─────────────────────────────
window.events = function () {
  const ev = [];

  // footsteps in the snow: trot → two feet land together, twice per stride
  let prev = null;
