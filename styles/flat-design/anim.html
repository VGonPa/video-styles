<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── flat-design · "Rocketwren" — a 2013-era flat-design app promo ─────────────────────────────────────────────
// Wet-asphalt landing page: four circle badges (cloud, lock, chat, chart) pop in with long shadows, a thin
// Lato headline types in. The turquoise chart badge grows into a circle wipe → a flat landscape (layered
// hills, two-tone mountains, a phone standing like a tower). A rocket climbs out of the phone, smoke puffs,
// the camera follows it up while the sky steps turquoise → navy; stars, a moon and a ringed planet pop in.
// Three colour panels slide across → clouds-white end card: a circle morphs into the app icon, the name,
// a ribbon, a pill button that gets clicked, a ticking user counter → settle → fade to clouds white.
// Every object casts a 45° long shadow: the swept convex hull of each primitive, as one union path,
// filled with a black-alpha ramp so it tints whatever surface it falls on and fades out.
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eIO = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eBack = (u, s = 1.9) => u >= 1 ? 1 : 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
const eBackIn = (u, s = 1.7) => (s + 1) * u * u * u - s * u * u;
const pop = (t, t0, d = .42, s = 1.9) => t <= t0 ? 0 : eBack(seg(t, t0, t0 + d), s);
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let q = Math.imul(seed ^ seed >>> 15, 1 | seed); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// "flat UI colours"
const C = {
  turq: '#1abc9c', sea: '#16a085', emerald: '#2ecc71', neph: '#27ae60', peter: '#3498db', belize: '#2980b9',
  ameth: '#9b59b6', wist: '#8e44ad', asph: '#34495e', mid: '#2c3e50', sun: '#f1c40f', orange: '#f39c12',
  carrot: '#e67e22', pump: '#d35400', aliz: '#e74c3c', pome: '#c0392b', clouds: '#ecf0f1', silver: '#bdc3c7',
  concrete: '#95a5a6', asb: '#7f8c8d', white: '#ffffff'
};
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function ramp(stops, v) {
  if (v <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
    const u = (v - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]), A = hex(stops[i - 1][1]), B = hex(stops[i][1]);
    return `rgb(${A.map((a, k) => Math.round(lerp(a, B[k], u))).join(',')})`;
  }
  return stops[stops.length - 1][1];
}

// ── geometry: every shape is a list of convex polygons ──
const nSeg = r => Math.max(16, Math.ceil(Math.PI * Math.sqrt(Math.max(r, 1) / .22)));
function circ(cx, cy, r, n) { n = n || nSeg(r); const p = []; for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; }
function arcPts(cx, cy, r, a0, a1, n) { const p = []; for (let i = 0; i <= n; i++) { const a = lerp(a0, a1, i / n); p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return p; }
function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2)); const n = Math.max(3, Math.ceil(nSeg(r) / 4));
  if (r < .01) return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
  return [...arcPts(x + w - r, y + r, r, -Math.PI / 2, 0, n), ...arcPts(x + w - r, y + h - r, r, 0, Math.PI / 2, n),
          ...arcPts(x + r, y + h - r, r, Math.PI / 2, Math.PI, n), ...arcPts(x + r, y + r, r, Math.PI, Math.PI * 1.5, n)];
}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function annulus(cx, cy, r0, r1, a0, a1, k) {
  const out = [];
  for (let i = 0; i < k; i++) {
    const b0 = lerp(a0, a1, i / k), b1 = lerp(a0, a1, (i + 1) / k) + .002;
    out.push([[cx + Math.cos(b0) * r1, cy + Math.sin(b0) * r1], [cx + Math.cos(b1) * r1, cy + Math.sin(b1) * r1],
              [cx + Math.cos(b1) * r0, cy + Math.sin(b1) * r0], [cx + Math.cos(b0) * r0, cy + Math.sin(b0) * r0]]);
  }
  return out;
}
// affine [a,b,c,d,e,f]: scale (sx,sy) → rotate → translate
const Mx = (tx, ty, s = 1, rot = 0, sx = 1, sy = 1) => { const co = Math.cos(rot), si = Math.sin(rot); return [co * s * sx, si * s * sx, -si * s * sy, co * s * sy, tx, ty]; };
const ap = (m, q) => q.map(([x, y]) => [m[0] * x + m[2] * y + m[4], m[1] * x + m[3] * y + m[5]]);
const area = q => { let a = 0; for (let i = 0, n = q.length; i < n; i++) { const p0 = q[i], p1 = q[(i + 1) % n]; a += p0[0] * p1[1] - p1[0] * p0[1]; } return a / 2; };
const pos = q => area(q) < 0 ? q.slice().reverse() : q;
const neg = q => area(q) > 0 ? q.slice().reverse() : q;
function pathOf(polys) {
  const p = new Path2D();
  for (const q of polys) { if (q.length < 3) continue; p.moveTo(q[0][0], q[0][1]); for (let i = 1; i < q.length; i++) p.lineTo(q[i][0], q[i][1]); p.closePath(); }
  return p;
}
function fillPolys(polys, col) { X.fillStyle = col; X.fill(pathOf(polys.map(pos))); }
function hull(P) {
  const p = P.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
  up.pop(); lo.pop(); return lo.concat(up);
}
// the long shadow: union of each convex primitive swept 45° down-right, black alpha ramp that fades out over L.
// The sweep runs past the point where the ramp reaches zero so the swept outline (the "end cap") never shows;
// while a shadow is still growing (L < Lfull) the end cap is allowed to show, so it reads as sweeping out.
function shadow(polys, L, a = .2, fade = .25, Lfull = L) {
  if (L < .5 || a <= 0 || !polys.length) return;
  let s0 = 1e9, s1 = -1e9;
  for (const q of polys) for (const [x, y] of q) { s0 = Math.min(s0, x + y); s1 = Math.max(s1, x + y); }
  const Ls = L + (s1 - s0) / 2 * clamp(L / Lfull) + 2;
  const hs = polys.map(q => hull(q.concat(q.map(([x, y]) => [x + Ls, y + Ls]))));
  const e = s1 + 2 * L, g = X.createLinearGradient(s0 / 2, s0 / 2, e / 2, e / 2);
  const f0 = clamp((s1 - s0 + fade * 2 * L) / (e - s0), 0, .999);
  g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(f0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  X.fillStyle = g; X.fill(pathOf(hs));
}
function clipY(q, yc) {
  const out = [];
  for (let i = 0; i < q.length; i++) {
    const a = q[i], b = q[(i + 1) % q.length], ia = a[1] <= yc, ib = b[1] <= yc;
    if (ia) out.push(a);
    if (ia !== ib) { const u = (yc - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0] - a[0]) * u, yc]); }
  }
  return out;
}
function clipPolys(polys) { X.clip(pathOf(polys.map(pos))); }

// ── glyphs (local units: badge radius = 1). body = convex parts, holes = cut-outs ──
const G = {
  cloud: () => ({ body: [circ(-.27, .07, .2), circ(.03, -.09, .28), circ(.3, .09, .18), rrect(-.47, .05, .94, .26, .13)] }),
  lock: () => {
    const dy = -.08;
    const body = [rrect(-.34, -.02 + dy, .68, .5, .08), rect(-.27, -.06 + dy, .1, .1), rect(.17, -.06 + dy, .1, .1),
                  ...annulus(0, -.04 + dy, .17, .27, Math.PI, TAU, 12)];
    const kh = [...arcPts(0, .15 + dy, .075, Math.PI / 2 + .5, Math.PI * 2.5 - .5, 18), [.05, .33 + dy], [-.05, .33 + dy]];
    return { body, holes: [kh] };
  },
  chat: () => ({ body: [rrect(-.46, -.36, .92, .56, .15), [[-.25, .12], [-.03, .12], [-.31, .41]]],
                 holes: [circ(-.22, -.08, .065), circ(0, -.08, .065), circ(.22, -.08, .065)] }),
  chart: g => {
    const hs = [.34, .56, .8], body = [];
    for (let k = 0; k < 3; k++) { const h = hs[k] * (g ? g[k] : 1); if (h > .01) body.push(rect(-.4 + k * .29, .38 - h, .22, h)); }
    return { body };
  },
};
// rocket (local: body base at y = 0, nose tip at y = -1)
function rocketBody() {
  const r = [];
  for (let i = 0; i <= 14; i++) { const v = i / 14, y = -1 + v * .52; r.push([.19 * (1 - Math.pow(1 - v, 2)), y]); }
  r.push([.185, -.32], [.165, -.13]);
  return r.concat(r.slice().reverse().map(([x, y]) => [-x, y]));
}
const RB = rocketBody();
const finL = [[-.15, -.43], [-.32, -.22], [-.35, .03], [-.155, -.13]], finR = finL.map(([x, y]) => [-x, y]);
const nozzle = [[-.1, -.14], [.1, -.14], [.135, 0], [-.135, 0]];
const flameO = fl => [[-.125, .0], [.125, .0], [.1, .12 * fl], [0, .5 * fl], [-.1, .12 * fl]];
const flameI = fl => [[-.07, .0], [.07, .0], [.055, .08 * fl], [0, .3 * fl], [-.055, .08 * fl]];
G.rocket = () => {
  const sh = q => q.map(([x, y]) => [x, y + .5]);   // centre the rocket (nose -1 … flame +.5) on the badge
  return { body: [RB, finL, finR, nozzle, flameO(1.05).map(([x, y]) => [x, y + .06])].map(sh), holes: [sh(circ(0, -.56, .085))] };
};

// a badge: shape (circle → rounded square via corner), its long shadow on the page, a white glyph with its own
// long shadow clipped inside the badge
function badge(o) {
  const R = o.R * o.s; if (R < .5) return;
  const bp = ap(Mx(o.cx, o.cy, 1, o.rot || 0, o.sx || 1, o.sy || 1), rrect(-R, -R, 2 * R, 2 * R, R * (o.corner ?? 1)));
  shadow([bp], o.bL || 0, o.bA ?? .2, o.bF ?? .25, o.bLf || o.bL || 0);
  fillPolys([bp], o.col);
  if ((o.gs || 0) > .01) {
    const g = G[o.glyph](o.gArg), m = Mx(o.cx, o.cy, o.R * o.s * o.gs, o.grot || 0);
    const body = g.body.map(q => pos(ap(m, q))), holes = (g.holes || []).map(q => neg(ap(m, q)));
    X.save(); X.clip(pathOf([pos(bp)]));
    shadow(body, o.gL || 0, o.gA ?? .2, 1.2);
    X.globalAlpha = o.gAlpha ?? 1; X.fillStyle = o.gcol || C.white; X.fill(pathOf(body.concat(holes))); X.globalAlpha = 1;
    X.restore();
  }
}
function txt(s, x, y, font, col, align = 'center', ls = 0, alpha = 1) {
  if (alpha <= 0) return;
  X.font = font; X.fillStyle = col; X.textAlign = align; X.textBaseline = 'alphabetic'; X.letterSpacing = ls + 'px';
  X.globalAlpha = alpha; X.fillText(s, x, y); X.globalAlpha = 1; X.letterSpacing = '0px';
}

// ── timeline (120 bpm grid: a beat is 0.5 s) ──
const T = {
  b0: .2, bStep: .25, out0: 1.98, type0: 1.12, type1: 1.9, ant0: 2.0, wipe0: 2.2, wipe1: 2.78,
  sun: 2.38, mtn: 2.4, hill: 2.55, front: 2.7, phone: 2.88, trees: 3.06, tiles: 3.24,
  rk0: 3.5, rk1: 3.84, launch: 4.05, cam0: 4.1, cam1: 6.1, star0: 4.95, star1: 5.95, moon: 5.68, planet: 5.58,
  exit0: 6.02, exit1: 6.5, pan0: 6.47, panStep: .1, panDur: .44,
  icon: 7.04, morph0: 7.34, morph1: 7.74, glyph: 7.48, name: 7.72, rib: 7.9, btn: 8.0, cnt0: 8.06, cnt1: 8.78,
  cur0: 8.1, cur1: 8.46, click: 8.52, chord: 8.95, fade0: 9.05, fade1: 9.42
};
const CAMY = 2000;

// ── scene A: the feature row ──
const BAD = [
  { col: C.peter, glyph: 'cloud', label: 'SYNC', n: 72 }, { col: C.aliz, glyph: 'lock', label: 'SECURE', n: 76 },
  { col: C.sun, glyph: 'chat', label: 'CHAT', n: 79 }, { col: C.turq, glyph: 'chart', label: 'INSIGHTS', n: 84 }
];
const BX = i => 960 + (i - 1.5) * 330, BY = 590, BR = 118;
const HEAD = 'Everything in one place', HEADF = '300 92px Lato';
let HEADX = 0;
function chartGrow(t, t0) { return [0, 1, 2].map(k => eBack(seg(t, t0 + .14 + k * .07, t0 + .5 + k * .07), 2.2)); }

function sceneA(t, hideChart) {
  X.fillStyle = C.asph; X.fillRect(0, 0, W, H);
  // headline (typed, thin Lato), with a short sunflower rule
  const hOut = eIn(seg(t, T.out0 + .04, T.out0 + .24));
  const nC = Math.floor(HEAD.length * seg(t, T.type0, T.type1) + 1e-6);
  if (nC > 0 && hOut < 1) {
    X.save(); X.translate(0, -40 * hOut);
    txt(HEAD.slice(0, nC), HEADX, 318, HEADF, C.clouds, 'left', 0, 1 - hOut);
    X.font = HEADF; const cw = X.measureText(HEAD.slice(0, nC)).width;
    const blink = t < T.type1 + .05 || Math.floor((t - T.type1) * 3.2) % 2 === 1;
    if (blink && t < T.out0) { X.fillStyle = C.sun; X.fillRect(HEADX + cw + 8, 246, 4, 86); }
    const ru = eBack(seg(t, T.type1 - .05, T.type1 + .3), 1.4) * (1 - hOut);
    if (ru > 0) { X.fillStyle = C.sun; X.fillRect(960 - 40 * ru, 362, 80 * ru, 6); }
    X.restore();
  }
  for (let i = 0; i < 4; i++) {
    const t0 = T.b0 + i * T.bStep, b = BAD[i];
    if (i === 3 && hideChart) continue;
    let s = pop(t, t0, .42, 2.1);
    if (i < 3) s *= 1 - clamp(eBackIn(seg(t, T.out0 + (2 - i) * .05, T.out0 + .2 + (2 - i) * .05), 2.2), 0, 1);
    else s *= 1 - .12 * Math.sin(Math.PI * seg(t, T.ant0, T.wipe0));          // anticipation squash before the wipe
    const gs = pop(t, t0 + .1, .4, 2.2) * .92;
    const gL = 2.4 * BR * eOut(seg(t, t0 + .28, t0 + .78));
    const bL = 330 * eOut(seg(t, t0 + .22, t0 + .8));
    badge({ cx: BX(i), cy: BY, R: BR, s, col: b.col, glyph: b.glyph, gArg: i === 3 ? chartGrow(t, t0) : null, gs, gL, gA: .22, bL, bLf: 330, bA: .22 });
    const lu = eOut(seg(t, t0 + .3, t0 + .62)), lo = i < 3 ? seg(t, T.out0, T.out0 + .15) : seg(t, T.ant0, T.ant0 + .15);
    txt(b.label, BX(i), 814 + 24 * (1 - lu), '700 28px Lato', C.silver, 'center', 6, lu * (1 - lo));
  }
}

// ── the landscape (world y; the camera moves the world down by camY) ──
const eIO2 = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const camY = t => CAMY * eIO2(seg(t, T.cam0, T.cam1));
const camV = t => { const u = seg(t, T.cam0, T.cam1); if (u <= 0 || u >= 1) return 0; return CAMY / (T.cam1 - T.cam0) * (u < .5 ? 4 * u : 2 * (-2 * u + 2)); };
const PHX = 960, PHB = 880, PHW = 270, PHH = 500, PHT = PHB - PHH;
const RK = 262;                     // rocket length in px
function rocketScreenY(t) {         // screen y of the rocket's base
  if (t < T.rk0) return PHT + RK;
  if (t < T.launch) return PHT + RK * (1 - eBack(seg(t, T.rk0, T.rk1), 1.6));
  let y = PHT - 95 * Math.pow(seg(t, T.launch, 4.36), 2);
  y = lerp(y, 556, eIO(seg(t, 4.36, 5.3)));
  y = lerp(y, 536, seg(t, 5.3, T.exit0));
  return y - 1100 * eIn(seg(t, T.exit0, T.exit1));
}
const MTN = [{ x: 230, p: 520, w: 330 }, { x: 640, p: 610, w: 270 }, { x: 1330, p: 470, w: 360 }, { x: 1740, p: 590, w: 290 }];
const MB = 920;
const TREES = [
  { x: 210, k: 'pine', s: 1.0, h: 0 }, { x: 330, k: 'round', s: .95, h: 0 }, { x: 470, k: 'pine', s: .8, h: 0 },
  { x: 1450, k: 'round', s: 1.0, h: 1 }, { x: 1590, k: 'pine', s: 1.1, h: 1 }, { x: 1730, k: 'round', s: .8, h: 1 }
];
const HILLS = [{ cx: 380, cy: 1190, r: 470, col: C.emerald }, { cx: 1580, cy: 1160, r: 440, col: C.emerald }];
const surf = (hl, x) => hl.cy - Math.sqrt(Math.max(0, hl.r * hl.r - (x - hl.cx) * (x - hl.cx)));
// clouds: x, world y, width, parallax, enter side & time (0 = already placed up in the sky)
const CLOUDS = [
  { x: 420, y: 250, w: 230, p: .8, side: -1, t0: 2.86, v: 14 }, { x: 1180, y: 160, w: 170, p: .78, side: 1, t0: 2.98, v: -10 },
  { x: 760, y: 420, w: 140, p: .9, side: -1, t0: 3.08, v: 20 }, { x: 1600, y: 410, w: 200, p: .86, side: 1, t0: 3.16, v: -16 },
  { x: 300, y: -200, w: 260, p: 1.1, v: 25 }, { x: 1500, y: -380, w: 230, p: 1.15, v: -20 }, { x: 640, y: -560, w: 190, p: 1.2, v: 18 },
  { x: 1300, y: -720, w: 280, p: 1.3, v: -24 }, { x: 420, y: -880, w: 210, p: 1.35, v: 30 }
];
const STARS = (() => {
  const r = rng(141), s = [];
  for (let i = 0; i < 46; i++) {
    const big = r() < .32, x = 60 + r() * 1800;
    s.push({ x, y: -1400 + r() * 1080, big, r: big ? 12 + r() * 9 : 2.5 + r() * 3.5, col: big ? (r() < .5 ? C.sun : C.clouds) : C.clouds, t0: 0, rot: r() * .5 });
  }
  const ord = s.map((_, i) => i).sort((a, b) => (s[b].y - s[b].x * .3) - (s[a].y - s[a].x * .3));
  ord.forEach((k, j) => { s[k].t0 = lerp(T.star0, T.star1, j / (s.length - 1)) + (rng(k)() - .5) * .2; });
  return s;
})();
function star4(x, y, r, rot) {   // a 4-point star as two thin rhombi (both convex)
  const a = [[0, -r], [r * .3, 0], [0, r], [-r * .3, 0]], b = [[-r, 0], [0, -r * .3], [r, 0], [0, r * .3]];
  return [ap(Mx(x, y, 1, rot), a), ap(Mx(x, y, 1, rot), b)];
}
function cloudPolys(x, y, w) {
  const h = w * .3;
  return [rrect(x - w / 2, y - h / 2, w, h, h / 2), circ(x - w * .12, y - h * .45, h * .62), circ(x + w * .17, y - h * .3, h * .45)];
}
function treePolys(tr, x, y, s) {
  if (tr.k === 'pine') {
    const h = 150 * s, w = 84 * s;
    return { trunk: [rect(x - 7 * s, y - 26 * s, 14 * s, 30 * s)], crown: [[[x, y - h], [x + w / 2, y - 22 * s], [x - w / 2, y - 22 * s]]] };
  }
  const r = 44 * s;
  return { trunk: [rect(x - 7 * s, y - 70 * s, 14 * s, 74 * s)], crown: [circ(x, y - 70 * s - r * .7, r)] };
}

function rocketState(t, cy) {
  const ys = rocketScreenY(t);
  if (t < T.rk0 || ys < -500) return null;
  const sq = Math.sin(Math.PI * seg(t, T.rk1, T.launch)), st = .06 * Math.sin(Math.PI * seg(t, T.launch, T.launch + .4));
  const sx = 1 + .07 * sq - .04 * st, sy = 1 - .1 * sq + st;
  const rot = .025 * Math.sin(t * 4.2) * seg(t, 4.4, 4.9);
  const m = Mx(PHX, ys, RK, rot, sx, sy), P = q => ap(m, q);
  const clip = t < T.launch + .05, yc = PHT + cy;
  let sil = [P(RB), P(finL), P(finR), P(nozzle)];
  if (clip) sil = sil.map(q => clipY(q, yc)).filter(q => q.length >= 3);
  return { P, sil, clip, yc };
}
function landscape(t) {
  const cy = camY(t);
  X.fillStyle = ramp([[0, C.turq], [650, C.peter], [1250, C.asph], [1800, C.mid]], cy); X.fillRect(0, 0, W, H);
  // stars, moon, planet (far parallax)
  for (const s of STARS) {
    const k = pop(t, s.t0, .32, 2.4); if (k <= 0) continue;
    const y = s.y + cy * .7; if (y < -40 || y > H + 40) continue;
    if (s.big) { const P = star4(s.x, y, s.r * k, s.rot); shadow(P, 34 * k, .2); fillPolys(P, s.col); }
    else { X.globalAlpha = .85; fillPolys([circ(s.x, y, s.r * k, 16)], s.col); X.globalAlpha = 1; }
  }
  {
    const k = pop(t, T.moon, .42, 2), y = -1340 + cy * .8;
    if (k > 0 && y > -120) {
      const P = [circ(330, y, 62 * k)]; shadow(P, 190, .2); fillPolys(P, C.clouds);
      X.save(); clipPolys(P); fillPolys([circ(305, y - 18, 15 * k), circ(352, y + 14, 10 * k), circ(318, y + 26, 7 * k)], C.silver); X.restore();
    }
  }
  {
    const k = pop(t, T.planet, .46, 2), y = -1370 + cy * .85, x = 1500;
    if (k > 0 && y > -260) {
      const R = 118 * k, rot = -.32, ring = (a0, a1) => {
        const outer = [], inner = []; for (let i = 0; i <= 40; i++) { const a = lerp(a0, a1, i / 40); outer.push([Math.cos(a) * 225 * k, Math.sin(a) * 50 * k]); inner.push([Math.cos(a) * 172 * k, Math.sin(a) * 30 * k]); }
        return ap(Mx(x, y, 1, rot), outer.concat(inner.reverse()));
      };
      const pl = circ(x, y, R), ringHull = ap(Mx(x, y, 1, rot), circ(0, 0, 1, 48).map(([u, v]) => [u * 225 * k, v * 50 * k]));
      shadow([pl, ringHull], 260, .22);
      X.fillStyle = C.orange; X.fill(pathOf([ring(Math.PI, TAU)]));        // back half of the ring
      fillPolys([pl], C.ameth);
      X.save(); clipPolys([pl]);
      fillPolys([ap(Mx(x, y, 1, rot), rect(-R, -R * .28, 2 * R, R * .22))], C.wist);   // a flat band
      fillPolys([circ(x - 44 * k, y - 50 * k, 18 * k), circ(x + 50 * k, y + 52 * k, 13 * k), circ(x - 62 * k, y + 40 * k, 9 * k)], C.wist);
      X.restore();
      X.fillStyle = C.sun; X.fill(pathOf([ring(0, Math.PI)]));                // front half of the ring
    }
  }
  // sun
  {
    const k = pop(t, T.sun, .44, 2.2), y = 205 + cy * .92;
    if (k > 0 && y < H + 100) { const P = [circ(1590, y, 76 * k)]; shadow(P, 230 * eOut(seg(t, T.sun + .2, T.sun + .7)), .14, .25, 230); fillPolys(P, C.sun); }
  }
  // everything that flies casts its long shadow on the sky only (drawn here, behind clouds, hills and the phone),
  // so clouds and smoke never pick up each other's shadows
  const RS = rocketState(t, cy);
  if (RS) shadow(RS.sil, 300 * seg(t, T.rk0 + .1, T.rk1 + .1), .2, .3, 300);
  const CL = [];
  for (const c of CLOUDS) {
    let x = c.x + c.v * (t - 2.8);
    if (c.side) { const u = eOut(seg(t, c.t0, c.t0 + .7)); if (u <= 0) continue; x = lerp(c.side < 0 ? -300 : W + 300, x, u); }
    const y = c.y + cy * c.p; if (y < -150 || y > H + 150) continue;
    CL.push({ P: cloudPolys(x, y, c.w), w: c.w, back: !!c.side });
  }
  for (const c of CL) shadow(c.P, c.w * .5, .14);
  const trail = [];
  for (let i = 0; i < 12; i++) {
    const t0 = T.launch + .04 + i * .065; if (t <= t0) continue;
    const by = rocketScreenY(t0) - camY(t0) + 18, sw = rng(i * 7 + 3)() - .5;
    const rr = (24 + i * 2.5) * eBack(seg(t, t0, t0 + .25), 1.8) * (1 - eIn(seg(t, t0 + .35, t0 + .8)));
    if (rr > .5) trail.push(circ(PHX + sw * 60 + sw * 80 * seg(t, t0, t0 + .8), by + cy + 40 * seg(t, t0, t0 + .8), rr));
  }
  if (trail.length) shadow(trail, 60, .14);
  // mountains (two-tone, snow caps), parallax .8
  MTN.forEach((m, i) => {
    const r = eBack(seg(t, T.mtn + i * .06, T.mtn + i * .06 + .48), 1.5); if (r <= 0) return;
    const dy = 620 * (1 - r) + cy * .8, h = MB - m.p, P = m.p + dy, B = MB + dy;
    fillPolys([[[m.x - m.w, B], [m.x, P], [m.x, B]]], C.peter);
    fillPolys([[[m.x, P], [m.x + m.w, B], [m.x, B]]], C.belize);
    const f = .26, cx = m.x, yb = P + h * f;
    fillPolys([[[cx, P], [cx, yb + 14], [cx - m.w * f * .45, yb - 10], [cx - m.w * f, yb]]], C.clouds);
    fillPolys([[[cx, P], [cx + m.w * f, yb], [cx + m.w * f * .5, yb - 12], [cx, yb + 14]]], C.silver);
  });
  // back clouds (low ones, slide in); their shadows were cast on the sky above
  CL.filter(c => c.back).forEach(c => fillPolys(c.P, C.clouds));
  // green-sea hill, emerald hills, trees, front hill
  {
    const r = eBack(seg(t, T.hill - .06, T.hill + .42), 1.5);
    if (r > 0) fillPolys([circ(960, 1380 + 500 * (1 - r) + cy * .85, 600)], C.sea);
  }
  HILLS.forEach((hl, i) => {
    const r = eBack(seg(t, T.hill + i * .07, T.hill + i * .07 + .46), 1.6); if (r <= 0) return;
    fillPolys([circ(hl.cx, hl.cy + 520 * (1 - r) + cy * .9, hl.r)], hl.col);
  });
  TREES.forEach((tr, i) => {
    const hl = HILLS[tr.h], k = pop(t, T.trees + i * .06, .38, 2.2); if (k <= 0) return;
    const x = tr.x, y = surf(hl, x) + 10 + cy * .9;
    const tp = treePolys(tr, x, y, tr.s), m = Mx(x, y, 1, 0, 1, k), mm = q => ap(m, q.map(([u, v]) => [u - x, v - y]));
    const all = [...tp.trunk.map(mm), ...tp.crown.map(mm)];
    shadow(all, 120 * eOut(seg(t, T.trees + i * .06 + .2, T.trees + i * .06 + .6)), .16);
    fillPolys(tp.trunk.map(mm), C.asph); fillPolys(tp.crown.map(mm), i % 2 ? C.sea : C.neph);
  });
  {
    const r = eBack(seg(t, T.front, T.front + .46), 1.5);
    if (r > 0) fillPolys([circ(960, 2010 + 520 * (1 - r) + cy, 1140)], C.neph);
  }
  // the phone, standing on the front hill like a tower
  {
    const k = pop(t, T.phone, .46, 1.8);
    if (k > 0) {
      const oy = cy, b = PHB + oy, m = Mx(PHX, b, 1, 0, 1, k);
      const loc = q => ap(m, q.map(([u, v]) => [u - PHX, v - PHB]));
      const body = loc(rrect(PHX - PHW / 2, PHT, PHW, PHH, 38));
      shadow([body], 430 * eOut(seg(t, T.phone + .25, T.phone + .75)), .17, .15);
      fillPolys([body], C.asph);
      const scr = loc(rect(PHX - PHW / 2 + 18, PHT + 62, PHW - 36, PHH - 136));
      fillPolys([scr], C.clouds);
      fillPolys([loc(rrect(PHX - 34, PHT + 28, 68, 10, 5))], C.mid);
      fillPolys([loc(circ(PHX, PHB - 37, 21))], C.mid);
      // app tiles on the screen, each with a tiny long shadow
      X.save(); clipPolys([scr]);
      const cols = [C.turq, C.aliz, C.sun, C.peter, C.ameth, C.carrot, C.emerald, C.asph, C.pome, C.belize, C.orange, C.sea];
      for (let j = 0; j < 12; j++) {
        const kk = pop(t, T.tiles + j * .03, .3, 2.2); if (kk <= 0) continue;
        const cx = PHX - 72 + (j % 3) * 72, cyy = PHT + 112 + Math.floor(j / 3) * 78;
        const tile = loc(ap(Mx(cx, cyy, kk), rrect(-25, -25, 50, 50, 12)));
        shadow([tile], 34, .12, .2); fillPolys([tile], cols[j]);
      }
      X.restore();
    }
  }
  // smoke puffs at lift-off (the trailing exhaust puffs were built with the sky shadows above)
  const puffs = [];
  for (let i = 0; i < 10; i++) {
    const t0 = 3.88 + i * .022, u = seg(t, t0, t0 + .5); if (t <= t0) continue;
    const dir = i % 2 ? 1 : -1, rr = (28 + (i % 5) * 7) * eBack(seg(t, t0, t0 + .28), 2) * (1 - eIn(seg(t, t0 + .5, t0 + 1.0)));
    if (rr > .5) puffs.push(circ(PHX + dir * (34 + (40 + i * 13) * eOut(u)), PHT - 10 + 16 * (i % 3) - 14 * eOut(u) + cy, rr));
  }
  if (puffs.length) { shadow(puffs, 60, .14); fillPolys(puffs, C.clouds); }   // the launch puffs shade the phone
  if (trail.length) fillPolys(trail, C.clouds);
  // the rocket
  if (RS) {
    {
      const P = RS.P;
      X.save();
      if (RS.clip) { X.beginPath(); X.rect(0, -2000, W, RS.yc + 2000); X.clip(); }
      const fk = eBack(seg(t, 3.9, 4.12), 2), fl = fk * (1 + .1 * Math.sin(t * 47) + .07 * Math.sin(t * 83 + 1)) * (1 + .25 * seg(t, T.launch, 4.4));
      if (fk > 0) { fillPolys([P(flameO(fl))], C.carrot); fillPolys([P(flameI(fl))], C.sun); }
      fillPolys([P(finL), P(finR)], C.aliz);
      fillPolys([P(nozzle)], C.asph);
      fillPolys([P(RB)], C.clouds);
      X.save(); clipPolys([P(RB)]);
      fillPolys([P(rect(-.3, -1.05, .6, .3))], C.aliz);       // nose cone
      fillPolys([P(rect(-.3, -.27, .6, .05))], C.aliz);       // band
      X.restore();
      fillPolys([P(rrect(-.032, -.36, .064, .38, .032))], C.pome);   // front fin
      fillPolys([P(circ(0, -.56, .1, 40))], C.asph);
      fillPolys([P(circ(0, -.56, .068, 40))], C.peter);
      X.restore();
    }
  }
  // the near clouds that fly past during the climb
  CL.filter(c => !c.back).forEach(c => fillPolys(c.P, C.clouds));
  // speed lines while the camera is moving
  const v = camV(t) / 1700;
  if (v > .05) {
    const r = rng(77);
    for (let i = 0; i < 16; i++) {
      const x = 80 + r() * 1760, ph = r(), len = 90 + r() * 140; if (Math.abs(x - 960) < 140) continue;
      const y = ((ph * 1500 + cy * 1.7) % 1500) - 250;
      X.globalAlpha = .35 * clamp(v); fillPolys([rrect(x - 3, y, 6, len, 3)], C.white); X.globalAlpha = 1;
    }
  }
}

// ── transition: three colour panels slide across ──
function panels(t) {
  [C.aliz, C.sun, C.clouds].forEach((col, k) => {
    const u = eOut(seg(t, T.pan0 + k * T.panStep, T.pan0 + k * T.panStep + T.panDur)); if (u <= 0) return;
    X.fillStyle = col; X.fillRect(W * (1 - u), 0, W * u + 2, H);
  });
}

// ── end card ──
const ICX = 960, ICY = 372, ICR = 150;
function ribbon(cx, cy, w, h, u, text) {
  if (u <= 0) return;
  const hw = w / 2 * u, tail = 70, fold = 22, drop = 16;
  // tails (behind, darker), with the V notch, and the fold triangles
  for (const s of [-1, 1]) {
    const x0 = cx + s * (hw - 10), x1 = cx + s * (hw + tail * u);
    fillPolys([[[x0, cy - h / 2 + drop], [x1, cy - h / 2 + drop], [x1 - s * 26 * u, cy + drop], [x1, cy + h / 2 + drop], [x0, cy + h / 2 + drop]]], C.pome);
    fillPolys([[[cx + s * hw, cy + h / 2], [cx + s * (hw - fold), cy + h / 2], [cx + s * hw, cy + h / 2 + drop]]], '#962d22');
  }
  fillPolys([rect(cx - hw, cy - h / 2, 2 * hw, h)], C.aliz);
  X.save(); X.beginPath(); X.rect(cx - hw, cy - h / 2, 2 * hw, h); X.clip();
  txt(text, cx, cy + 12, '900 32px Lato', C.white, 'center', 6, clamp(u * 1.4 - .3));
  X.restore();
}
function endCard(t) {
  X.fillStyle = C.clouds; X.fillRect(0, 0, W, H);
  const s0 = pop(t, T.icon, .36, 2.2), mu = seg(t, T.morph0, T.morph1), m = eBack(mu, 1.6);
  const corner = lerp(1, .42, m), rot = -Math.PI / 2 * (1 - m), sq = Math.sin(Math.PI * mu);
  const gs = pop(t, T.glyph, .42, 2.2);
  badge({ cx: ICX, cy: ICY, R: ICR, s: s0, sx: 1 + .07 * sq, sy: 1 - .07 * sq, col: C.peter, corner, rot,
          glyph: 'rocket', gs: .84 * gs, grot: Math.PI / 4, gL: 2.6 * ICR * eOut(seg(t, T.glyph + .22, T.glyph + .7)), gA: .2,
          bL: 330 * eOut(seg(t, T.morph1 - .12, T.morph1 + .4)), bLf: 330, bA: .12, bF: .2 });
  ribbon(ICX, ICY + ICR - 8, 420, 64, eBack(seg(t, T.rib, T.rib + .34), 1.5), 'NEW');
  // name
  {
    const u = eOut(seg(t, T.name, T.name + .36));
    X.save(); X.beginPath(); X.rect(0, 560, W, 160); X.clip();
    txt('Rocketwren', ICX, 682 + 90 * (1 - u), '900 104px Lato', C.asph, 'center', -1, u > 0 ? 1 : 0);   // ≈ ribbon width; no descenders, so optically centred between ribbon and tagline
    X.restore();
    const v = eOut(seg(t, T.name + .14, T.name + .5));
    txt('Your ideas, ready for liftoff', ICX, 752 + 16 * (1 - v), '300 40px Lato', C.asb, 'center', 0, v);
  }
  // pill button (+ click)
  {
    const k = pop(t, T.btn, .4, 2.2);
    if (k > 0) {
      const press = Math.sin(Math.PI * seg(t, T.click, T.click + .2)), sc = k * (1 - .06 * press);
      const bw = 380 * sc, bh = 96 * sc, by = 860;
      const pill = rrect(ICX - bw / 2, by - bh / 2, bw, bh, bh / 2);
      shadow([pill], 90 * eOut(seg(t, T.btn + .2, T.btn + .55)), .1, .2);
      fillPolys([pill], press > .05 ? ramp([[0, C.emerald], [1, C.neph]], press) : C.emerald);
      const ru = seg(t, T.click, T.click + .5);
      if (ru > 0 && ru < 1) {
        X.save(); clipPolys([pill]); X.globalAlpha = .35 * (1 - ru);
        fillPolys([circ(ICX + 128, by + 12, 30 + 300 * eOut(ru))], C.white); X.globalAlpha = 1; X.restore();
      }
      X.save(); X.translate(ICX, by); X.scale(sc, sc);
      txt('Get started', 0, 13, '700 38px Lato', C.white, 'center', 1, clamp(k * 2 - 1));
      X.restore();
    }
  }
  // ticking counter
  {
    const u = seg(t, T.cnt0, T.cnt1), a = eOut(seg(t, T.cnt0, T.cnt0 + .25));
    const n = Math.round(128400 * eOut(u) / 10) * 10;
    txt(`Join ${n.toLocaleString('en-US')} happy users`, ICX, 968, '400 30px Lato', C.concrete, 'center', 1, a);
  }
  // cursor
  {
    const u = eOut(seg(t, T.cur0, T.cur1)); if (u > 0) {
      const x = lerp(1560, ICX + 128, u), y = lerp(1140, 872, u), pr = 1 - .12 * Math.sin(Math.PI * seg(t, T.click, T.click + .18));
      const a = [[0, 0], [0, 50], [12, 39], [21, 58], [31, 54], [22, 35], [37, 35]];
      const P = ap(Mx(x, y, 1.25 * pr), a);
      const parts = [ap(Mx(x, y, 1.25 * pr), [[0, 0], [0, 50], [37, 35]]), ap(Mx(x, y, 1.25 * pr), [[12, 39], [21, 58], [31, 54], [22, 35]])];
      shadow(parts, 70, .12); fillPolys([P], C.asph);
    }
  }
}

function render(t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
  const panEnd = T.pan0 + 2 * T.panStep + T.panDur;
  if (t < T.wipe0) sceneA(t, false);
  else if (t < T.wipe1) {
    sceneA(t, true);
    const u = seg(t, T.wipe0, T.wipe1), R = lerp(BR * .88, 1700, Math.pow(u, 2.1));
    const P = [circ(BX(3), BY, R)];
    shadow(P, 330, .22);
    X.save(); clipPolys(P); landscape(t); X.restore();
    // the chart glyph rides the wipe and fades
    const gA = 1 - seg(t, T.wipe0, T.wipe0 + .2);
    if (gA > 0) badge({ cx: BX(3), cy: BY, R: R / .92, s: 1, col: 'rgba(0,0,0,0)', glyph: 'chart', gs: .92, gAlpha: gA, gL: 0 });
  } else if (t < panEnd) { landscape(t); panels(t); }
  else endCard(t);
  const fade = eIO(seg(t, T.fade0, T.fade1));
  if (fade > 0) { X.globalAlpha = fade; X.fillStyle = C.clouds; X.fillRect(0, 0, W, H); X.globalAlpha = 1; }
}

window.ready = (async () => {
  await Promise.all(['300 92px Lato', '400 30px Lato', '700 30px Lato', '900 104px Lato'].map(f => document.fonts.load(f, HEAD + ' RocketwrenGetJoin0123456789,')));
  await document.fonts.ready;
  X.font = HEADF; HEADX = 960 - X.measureText(HEAD).width / 2;
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [];
  BAD.forEach((b, i) => ev.push({ t: T.b0 + i * T.bStep + .05, k: 'pop', n: b.n }));
  for (let c = 0; c < HEAD.length; c++) if (HEAD[c] !== ' ') ev.push({ t: T.type0 + (c + 1) / HEAD.length * (T.type1 - T.type0) - .01, k: 'tick', v: .6 });
  [0, 1, 2].forEach(i => ev.push({ t: T.out0 + (2 - i) * .05 + .08, k: 'blip', n: [67, 64, 60][i] }));
  ev.push({ t: T.wipe0 - .04, k: 'whoosh', d: .75 });
  ev.push({ t: T.mtn + .2, k: 'thud', n: 43 }, { t: T.hill + .22, k: 'thud', n: 48 }, { t: T.front + .2, k: 'thud', n: 52 });
  ev.push({ t: T.sun + .1, k: 'pop', n: 79, v: .6 }, { t: T.phone + .12, k: 'pop', n: 67 });
  TREES.forEach((_, i) => ev.push({ t: T.trees + i * .06 + .06, k: 'blip', n: [72, 76, 79, 84, 79, 76][i], v: .5 }));
  ev.push({ t: T.rk0 + .04, k: 'rise', d: .32 }, { t: 3.88, k: 'puff' }, { t: T.launch, k: 'launch' }, { t: T.launch, k: 'rumble', d: T.exit1 - T.launch + .2 });
  STARS.filter(s => s.big).forEach((s, i) => ev.push({ t: s.t0 + .02, k: 'twinkle', n: [84, 88, 91, 96, 91, 88][i % 6] }));
  ev.push({ t: T.moon + .05, k: 'pop', n: 72, v: .6 }, { t: T.planet + .05, k: 'pop', n: 64, v: .8 });
  ev.push({ t: T.exit0 + .1, k: 'zoom' });
  [0, 1, 2].forEach(k => ev.push({ t: T.pan0 + k * T.panStep, k: 'swoosh', v: 1 - k * .2 }));
  ev.push({ t: T.icon + .04, k: 'pop', n: 72 }, { t: T.morph0, k: 'swish' }, { t: T.glyph + .05, k: 'pop', n: 79 });
  ev.push({ t: T.rib + .05, k: 'blip', n: 84, v: .7 }, { t: T.name, k: 'slide' }, { t: T.btn + .05, k: 'pop', n: 76 });
  for (let i = 0; i < 9; i++) ev.push({ t: T.cnt0 + .08 + i * .075 * (1 + i * .12), k: 'tick', v: .35 });
  ev.push({ t: T.click, k: 'click' }, { t: T.chord, k: 'chord' });
  return ev.sort((a, b) => a.t - b.t);
};
</script>
