<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── corporate-memphis · "Work better, together." — the 2017–2021 flat-vector human illustration, animated ─────
// People are the subject: tiny heads, long rubbery limbs, oversized hands and feet, flat non-naturalistic skin
// (lilac, cobalt, coral), solid hair, no faces, no outlines, no gradients, no grain. Scale play with giant objects,
// organic blobs and big flat leaves on off-white. Figures are a small rig (head, neck, torso, two-segment limbs
// drawn as one smooth curve through the elbow/knee, hands with a thumb, shoes) driven by keyed poses; distal joints
// lag their parents (follow-through), arms and legs can be FK or IK (planted feet never slide, held objects lead
// the hands and noodle arms stretch to reach them).
//
// Beat sheet
// 0.00–0.55  off-white; blobs bloom, three giant puzzle pieces pop in, leaves sway in from the corners
// 0.12–0.95  A (lilac skin) drops in, squash-lands, rebounds, looks up at the empty slot, hand to chin
// 0.42–1.45  B (cobalt skin) surfs in on a giant pencil with the last piece overhead; brakes, pitches, settles
// 1.55–2.05  B's noodle arm stretches across the frame to hand the piece over; A reaches back and takes it
// 2.05–3.00  A dips (anticipation), rises on tiptoe and stretches to slot the piece in; click, the puzzle locks
// 3.00–3.50  both cheer (hop, arms up); a chat bubble pops out of A with typing dots
// 3.50–4.05  the bubble inflates to fill the frame (scene change: cobalt ring wipe)
// 3.95–4.50  a giant laptop's lid swings open lifting A, who sits on it; C (coral) lounges on the keyboard;
//            B waits on a giant checkbox; tasks tick on the screen
// 4.75–5.75  B crouches, leaps over C (who ducks) and high-fives A at the top of the arc
// 5.75–6.30  B drops onto the keyboard with a squash; A's arm recoils; a heart and a thumbs-up float up
// 7.20–8.70  camera eases back; the invented product's wordmark pops and the tagline types in
// 8.70–9.50  hold with idle sway, a last wave, fade to off-white
const W = 1920, H = 1080, TAU = Math.PI * 2, PI = Math.PI;
const cv = document.getElementById('c'), X = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  lin: u => u,
  io: u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2,
  io2: u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2,
  o: u => 1 - Math.pow(1 - u, 3),
  o2: u => 1 - (1 - u) * (1 - u),
  o4: u => 1 - Math.pow(1 - u, 4),
  i: u => u * u * u,
  i2: u => u * u,
  back: u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
  spr: u => u >= 1 ? 1 : 1 - Math.exp(-6 * u) * (Math.cos(11 * u) + 6 / 11 * Math.sin(11 * u)),
  wob: u => u >= 1 ? 1 : 1 - Math.exp(-5 * u) * (Math.cos(16 * u) + 5 / 16 * Math.sin(16 * u)),
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const V = {
  add: (a, b, k = 1) => [a[0] + b[0] * k, a[1] + b[1] * k],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1]],
  len: a => Math.hypot(a[0], a[1]),
  nrm: a => { const l = Math.hypot(a[0], a[1]) || 1; return [a[0] / l, a[1] / l]; },
  perp: a => [-a[1], a[0]],
  mix: (a, b, u) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u],
  rot: (a, r) => [a[0] * Math.cos(r) - a[1] * Math.sin(r), a[0] * Math.sin(r) + a[1] * Math.cos(r)],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1],
};
const dirv = a => [Math.sin(a), Math.cos(a)];          // 0 = down, +π/2 = forward (+x), π = up

const FONT = 'Manrope';
const P = {
  bg: '#F8F4EC', ink: '#1E2453', navy: '#1E2453', navyL: '#2E3675',
  coral: '#FF6F5E', coralD: '#E2513F', coralL: '#FFDDD3',
  lilac: '#A98BF2', lilacD: '#8C6CE0', lilacL: '#E8E1FB',
  cobalt: '#3F5DE2', cobaltD: '#2F47C0',
  mustard: '#F7B538', mustardD: '#DE9A1C', mustardL: '#FDEBC3', mustardH: '#FFCB62',
  mint: '#4ECFA3', mintD: '#2FB386', mintL: '#D3F2E5',
  pink: '#FF9FB4', leaf: '#1C7C64', leaf2: '#3DB98C', leafRib: '#2A9475',
  white: '#FFFFFF', cream: '#FFFDF7', shade: 'rgba(30,36,83,0.07)',
  lapBase: '#D4CDF5', lapKey: '#BDB2EE', lapFace: '#B4A8EA', ui: '#ECE7FC', uiBar: '#D5CDF5',
};

// ── keyframes ────────────────────────────────────────────────────────────────────────────────────────────────
function K(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const a = keys[i - 1], b = keys[i], u = E[b[2] || 'io']((t - a[0]) / (b[0] - a[0]));
    return Array.isArray(a[1]) ? a[1].map((v, j) => lerp(v, b[1][j], u)) : lerp(a[1], b[1], u);
  }
  return keys[keys.length - 1][1];
}
// distal joints run late: forearms, shins, hands, feet and the head trail their parents (follow-through)
const LAG = { a2n: .05, a2f: .05, hn: .09, hf: .09, l2n: .035, l2f: .035, neck: .07, bend: .04, fn: .05, ff: .05 };
function prep(base, keys) { let prev = Object.assign({}, base); return keys.map(k => { prev = Object.assign({}, prev, k[1]); return [k[0], prev, k[2]]; }); }
function PK(t, keys) {
  const out = {}, last = keys[keys.length - 1][1];
  for (const f in last) {
    if (typeof last[f] !== 'number') { let v = keys[0][1][f]; for (const k of keys) if (k[0] <= t) v = k[1][f]; out[f] = v; continue; }
    const tf = t - (LAG[f] || 0); let v = last[f];
    if (tf <= keys[0][0]) v = keys[0][1][f];
    else for (let i = 1; i < keys.length; i++) if (tf < keys[i][0]) {
      const a = keys[i - 1], b = keys[i]; v = lerp(a[1][f], b[1][f], E[b[2] || 'io']((tf - a[0]) / (b[0] - a[0]))); break;
    }
    out[f] = v;
  }
  return out;
}
const vel = (f, t, h = .02) => (f(t + h) - f(t - h)) / (2 * h);

// ── the rig ──────────────────────────────────────────────────────────────────────────────────────────────────
const BODY = { r: 21, neckL: 26, neckW: 15, torso: 152, chestW: 52, hipW: 43, upper: 104, fore: 100, armW0: 28, armW1: 18,
  thigh: 142, shin: 140, legW0: 54, legW1: 30, hand: 56, foot: 82 };
const SOLE = .33;                                        // ankle → sole bottom, in foot lengths
const FIGS = {
  A: Object.assign({}, BODY, { skin: '#A98BF2', skinD: '#9172E2', hair: P.navy, hairStyle: 'bob', top: P.mustard, topD: P.mustardD,
    bot: P.navy, botD: '#323A7C', shoe: P.coral, shoeD: P.coralD, sole: P.white, sleeve: .86, pants: 1 }),
  B: Object.assign({}, BODY, { skin: '#3F5DE2', skinD: '#3049C4', hair: P.navy, hairStyle: 'curly', top: P.coral, topD: P.coralD,
    bot: P.mint, botD: P.mintD, shoe: P.navy, shoeD: '#323A7C', sole: P.white, sleeve: .4, pants: .84, chestW: 54 }),
  C: Object.assign({}, BODY, { skin: '#FF8E7A', skinD: '#EE7764', hair: P.navy, hairStyle: 'bun', top: P.cobalt, topD: P.cobaltD,
    bot: P.mustard, botD: P.mustardD, shoe: P.white, shoeD: '#E4DEF6', sole: P.lilac, sleeve: .87, pants: .86 }),
};
const BASE = { x: 0, y: 0, s: 1, dir: 1, oy: 0, lean: .03, bend: 0, neck: .05, look: 1, sq: 0,
  a1n: .15, a2n: .3, a1f: -.1, a2f: .3, l1n: .1, l2n: -.1, l1f: -.1, l2f: -.1, fn: 0, ff: 0, hn: 0, hf: 0,
  awn: 0, awf: 0, lwn: 1, lwf: 1, toe: 0 };

function chainFK(R, a1, a2, L1, L2) { const Ej = V.add(R, dirv(a1), L1); return [Ej, V.add(Ej, dirv(a1 + a2), L2), 1]; }
// two-bone IK with a pole; past full reach the limb stretches like a noodle (and keeps a slight sag)
function chainIK(R, T, L1, L2, pole) {
  const d = V.sub(T, R), D = Math.max(1e-3, V.len(d)), L = L1 + L2, u = [d[0] / D, d[1] / D];
  let pp = V.perp(u); if (V.dot(pp, pole) < 0) pp = [-pp[0], -pp[1]];
  const sag = L1 * .13 * clamp((D / L - .86) / .14);
  if (D < L) {
    const ca = clamp((L1 * L1 + D * D - L2 * L2) / (2 * L1 * D), -1, 1), sa = Math.sqrt(1 - ca * ca);
    return [V.add(V.add(R, u, L1 * ca), pp, L1 * sa + sag), T, 1];
  }
  return [V.add(V.add(R, u, D * L1 / L), pp, sag), T, D / L];
}
const qp = (P0, C, P2, s) => { const m = 1 - s; return [m * m * P0[0] + 2 * m * s * C[0] + s * s * P2[0], m * m * P0[1] + 2 * m * s * C[1] + s * s * P2[1]]; };
const qd = (P0, C, P2, s) => [2 * (1 - s) * (C[0] - P0[0]) + 2 * s * (P2[0] - C[0]), 2 * (1 - s) * (C[1] - P0[1]) + 2 * s * (P2[1] - C[1])];
const ctrlThrough = (P0, P1, P2) => [2 * P1[0] - (P0[0] + P2[0]) / 2, 2 * P1[1] - (P0[1] + P2[1]) / 2];
function dot(p, r, col) { X.beginPath(); X.arc(p[0], p[1], Math.max(.1, r), 0, TAU); X.fillStyle = col; X.fill(); }
function capsule(a, b, w, col) { X.beginPath(); X.moveTo(a[0], a[1]); X.lineTo(b[0] + 1e-3, b[1]); X.lineWidth = w; X.lineCap = 'round'; X.strokeStyle = col; X.stroke(); }
// a limb: one smooth quadratic through the joint, tapering from w0 to w1 (s0..s1 draws a part of it: sleeves, trousers)
function tube(P0, C, P2, w0, w1, col, s0 = 0, s1 = 1, cap0 = true, cap1 = true, flare = 0) {
  const N = 26, A = [], B = [];
  for (let i = 0; i <= N; i++) {
    const s = s0 + (s1 - s0) * i / N, p = qp(P0, C, P2, s); let d = qd(P0, C, P2, s); if (V.len(d) < 1e-6) d = V.sub(P2, P0);
    const n = V.nrm(V.perp(d)), w = (w0 + (w1 - w0) * s) / 2 + flare * Math.pow(i / N, 3);
    A.push([p[0] + n[0] * w, p[1] + n[1] * w]); B.push([p[0] - n[0] * w, p[1] - n[1] * w]);
  }
  X.beginPath(); X.moveTo(A[0][0], A[0][1]);
  for (let i = 1; i <= N; i++) X.lineTo(A[i][0], A[i][1]);
  for (let i = N; i >= 0; i--) X.lineTo(B[i][0], B[i][1]);
  X.closePath(); X.fillStyle = col; X.fill();
  if (cap0) dot(qp(P0, C, P2, s0), (w0 + (w1 - w0) * s0) / 2, col);
  if (cap1) dot(qp(P0, C, P2, s1), (w0 + (w1 - w0) * s1) / 2 + flare, col);
}
// oversized mitten hands with a clear thumb (local +x runs out of the wrist, the thumb sits on −y)
function hand(Wr, d, h, pose, col, th) {
  X.save(); X.translate(Wr[0], Wr[1]); X.rotate(Math.atan2(d[1], d[0])); X.scale(1, th);
  X.fillStyle = col;
  const el = (x, y, rx, ry, r = 0) => { X.beginPath(); X.ellipse(x * h, y * h, rx * h, ry * h, r, 0, TAU); X.fill(); };
  const cp = (x0, y0, x1, y1, w) => capsule([x0 * h, y0 * h], [x1 * h, y1 * h], w * h, col);
  cp(-.08, 0, .12, 0, .3);
  if (pose === 'open') {
    el(.33, .01, .31, .28);
    for (let i = 0; i < 4; i++) { const a = -.34 + i * .23, bx = .46, by = -.15 + i * .105; cp(bx, by, bx + Math.cos(a) * (.4 - Math.abs(i - 1.3) * .04), by + Math.sin(a) * .4, .13); }
    cp(.2, -.18, .38, -.5, .145);
  } else if (pose === 'hold') { el(.3, .02, .3, .27); cp(.42, -.2, .56, -.08, .14); cp(.18, -.2, .42, -.24, .145); }
  else if (pose === 'thumb') {
    const a = Math.atan2(d[1], d[0]), up = [-Math.sin(a), -th * Math.cos(a)];
    X.beginPath(); X.roundRect(-.02 * h, -.32 * h, .66 * h, .64 * h, .24 * h); X.fill();
    cp(.3 + up[0] * .25, up[1] * .25, .3 + up[0] * .66, up[1] * .66, .23);
  }
  else { el(.42, .02, .45, .26, .04); cp(.15, -.14, .4, -.43, .16); }
  X.restore();
}
function thumbSide(d) { const s1 = -(-d[0]) + .5 * d[1], s2 = -(d[0]) - .5 * d[1]; return s1 >= s2 ? 1 : -1; }
// chunky sneaker, ankle at origin, toe toward +x
function shoe(A, ang, f, col, sole) {
  X.save(); X.translate(A[0], A[1]); X.rotate(ang);
  X.beginPath(); X.moveTo(-.18 * f, -.18 * f);
  X.quadraticCurveTo(-.31 * f, -.14 * f, -.31 * f, .1 * f);
  X.lineTo(-.31 * f, .25 * f); X.lineTo(.76 * f, .25 * f);
  X.quadraticCurveTo(.9 * f, .25 * f, .88 * f, .12 * f);
  X.quadraticCurveTo(.84 * f, -.04 * f, .52 * f, -.07 * f);
  X.quadraticCurveTo(.26 * f, -.1 * f, .16 * f, -.21 * f);
  X.closePath(); X.fillStyle = col; X.fill();
  X.beginPath(); X.moveTo(-.33 * f, .19 * f); X.lineTo(.9 * f, .19 * f); X.lineTo(.9 * f, .25 * f);
  X.quadraticCurveTo(.9 * f, SOLE * f, .8 * f, SOLE * f); X.lineTo(-.26 * f, SOLE * f); X.quadraticCurveTo(-.33 * f, SOLE * f, -.33 * f, .26 * f);
  X.closePath(); X.fillStyle = sole; X.fill();
  X.restore();
}
function hair(style, r) {
  X.beginPath();
  if (style === 'bob') {
    X.moveTo(.64 * r, -.6 * r);
    X.bezierCurveTo(.5 * r, -1.32 * r, -1.1 * r, -1.36 * r, -1.2 * r, -.3 * r);
    X.lineTo(-1.24 * r, .98 * r); X.quadraticCurveTo(-1.22 * r, 1.12 * r, -1.04 * r, 1.12 * r);
    X.lineTo(-.3 * r, 1.12 * r); X.lineTo(-.24 * r, .08 * r);
    X.quadraticCurveTo(-.02 * r, -.5 * r, .64 * r, -.6 * r); X.fill();
  } else if (style === 'bun') {
    X.moveTo(.72 * r, -.5 * r);
    X.bezierCurveTo(.55 * r, -1.25 * r, -1.02 * r, -1.28 * r, -1.08 * r, -.1 * r);
    X.quadraticCurveTo(-1.06 * r, .42 * r, -.62 * r, .46 * r); X.lineTo(-.34 * r, .22 * r);
    X.quadraticCurveTo(-.05 * r, -.42 * r, .72 * r, -.5 * r); X.fill();
    X.beginPath(); X.arc(-.62 * r, -1.08 * r, .5 * r, 0, TAU); X.fill();
  } else if (style === 'curly') {
    X.moveTo(.66 * r, -.52 * r); X.bezierCurveTo(.5 * r, -1.1 * r, -.9 * r, -1.2 * r, -1.0 * r, -.1 * r);
    X.quadraticCurveTo(-.9 * r, .4 * r, -.5 * r, .35 * r); X.quadraticCurveTo(-.1 * r, -.35 * r, .66 * r, -.52 * r); X.fill();
    for (const [x, y, rr] of [[.42, -.78, .34], [.02, -1.02, .4], [-.46, -1.0, .42], [-.88, -.66, .4], [-1.06, -.2, .36], [-.86, .22, .3], [.7, -.5, .22]]) {
      X.beginPath(); X.arc(x * r, y * r, rr * r, 0, TAU); X.fill();
    }
  }
}
// One figure. p: pose (hip at p.x,p.y in world; local frame faces +x, mirrored by p.dir). ik: world targets for
// an/af (hands), ln/lf (ankles), mixed in by p.awn/p.awf/p.lwn/p.lwf. Draws the body now and returns a function
// that draws the near arm, so held objects can sit between the body and the hand that grips them.
function figure(F, p, ik = {}, opt = {}) {
  const s = p.s, d = p.dir;
  const toL = q => [(q[0] - p.x) / (d * s), (q[1] - p.y - p.oy) / s];
  const H0 = [0, 0], u = [Math.sin(p.lean), -Math.cos(p.lean)], n = [Math.cos(p.lean), Math.sin(p.lean)];
  const N = V.add(H0, u, F.torso);
  const Sn = V.add(V.add(N, u, -17), n, 3), Sf = V.add(V.add(N, u, -19), n, -10);
  const Jn = V.add(V.add(H0, n, 8), u, -6), Jf = V.add(V.add(H0, n, -8), u, -8);
  const armPole = opt.poleN || [-.25, 1], armPoleF = opt.poleF || [-.25, 1], legPole = [1, -.15];
  function chain(R, a1, a2, L1, L2, tgt, w, pole) {
    const fk = chainFK(R, a1, a2, L1, L2);
    if (!tgt || w <= 0) return fk;
    const kk = chainIK(R, toL(tgt), L1, L2, pole);
    return [V.mix(fk[0], kk[0], w), V.mix(fk[1], kk[1], w), lerp(1, kk[2], w)];
  }
  const armN = chain(Sn, p.a1n, p.a2n, F.upper, F.fore, ik.an, p.awn, armPole);
  const armF = chain(Sf, p.a1f, p.a2f, F.upper, F.fore, ik.af, p.awf, armPoleF);
  const legN = chain(Jn, p.l1n, p.l2n, F.thigh, F.shin, ik.ln, p.lwn, legPole);
  const legF = chain(Jf, p.l1f, p.l2f, F.thigh, F.shin, ik.lf, p.lwf, legPole);
  const xf = () => {
    X.translate(p.x, p.y + p.oy); X.scale(d * s, s);
    if (p.sq) { const py = opt.sqY ?? (F.thigh + F.shin); X.translate(0, py); X.scale(1 + p.sq * .7, 1 - p.sq); X.translate(0, -py); }
  };
  function drawArm(S, ch, near, hp, hr) {
    const [Ej, Wr, k] = ch, C = ctrlThrough(S, Ej, Wr), th = 1 / Math.sqrt(Math.max(1, k));
    const skin = near ? F.skin : F.skinD, top = near ? F.top : F.topD;
    const dW = V.nrm(qd(S, C, Wr, 1)), hd = V.rot(dW, hr);
    if (near && opt.prop) { X.save(); X.translate(Wr[0], Wr[1]); X.rotate(Math.atan2(hd[1], hd[0])); opt.prop(F.hand); X.restore(); }
    tube(S, C, Wr, F.armW0 * th, F.armW1 * th, skin);
    tube(S, C, Wr, F.armW0 * th + 5, (lerp(F.armW0, F.armW1, F.sleeve) * th) + 6, top, 0, F.sleeve, true, false, 1.5);
    hand(Wr, hd, F.hand, hp || 'mitt', skin, thumbSide(hd));
  }
  function drawLeg(J, ch, near, fa, lw) {
    const [Kj, A, k] = ch, C = ctrlThrough(J, Kj, A), th = 1 / Math.sqrt(Math.max(1, k)), dA = qd(J, C, A, 1);
    let sh = Math.atan2(dA[1], dA[0]) - PI / 2; if (sh < -PI) sh += TAU; fa += (1 - lw) * sh * .8;
    tube(J, C, A, F.legW0 * th * .8, F.legW1 * th * .62, near ? F.skin : F.skinD);
    tube(J, C, A, F.legW0 * th, F.legW1 * th + 4, near ? F.bot : F.botD, 0, F.pants, true, F.pants >= 1, 2);
    shoe(A, fa, F.foot, near ? F.shoe : F.shoeD, F.sole);
  }
  X.save(); xf();
  drawArm(Sf, armF, false, p.hpf, p.hf);
  drawLeg(Jf, legF, false, p.ff, p.lwf);
  drawLeg(Jn, legN, true, p.fn, p.lwn);
  dot(V.add(H0, u, -5), F.hipW * .98, F.bot);                                   // seat of the trousers
  // neck + head (the head trails the torso; look < 0 turns the profile back)
  const hv = V.nrm(V.add(V.rot(u, p.neck), [0, 0])), Hc = V.add(V.add(N, hv, F.neckL + F.r * .78), n, 2);
  tube(V.add(V.add(N, u, -10), n, 3), V.mix(V.add(N, n, 3), Hc, .5), Hc, F.neckW, F.neckW * .9, F.skin);
  // torso: a big rounded sweater slab
  { const hw = F.hipW, cw = F.chestW, Hb = V.add(H0, n, -hw), Hf = V.add(H0, n, hw * .96);
