<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── lofi-anime · "Late night, one more page" ──────────────────────────────────────────────
// A 90s cel-anime background painting of a cozy desk by a rainy window. Dusk: rain begins, droplets
// bead and run down the glass → the desk lamp clicks on (flicker) → steam curls from the mug → a lit
// train crosses the city → lightning flash turns the sky to night, city windows switch on one by one →
// the cat tucks its head down and curls its tail → "goodnight." → slow fade while the rain keeps falling.
// Painted layers are built once offscreen (gradients, cel shapes, brush noise); per frame we only move
// cheap layers: parallax push-in, rain, drops, steam, train, lights, cat, then bloom/grain/VHS finish.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const sstep = u => u * u * (3 - 2 * u);
const bump = (t, a, b) => Math.sin(Math.PI * seg(t, a, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w = W, h = H) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, u) => { a = typeof a === 'string' ? hx(a) : a; b = typeof b === 'string' ? hx(b) : b; return [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)]; };
const mulc = (a, b) => { a = hx(a); b = hx(b); return [a[0] * b[0] / 255, a[1] * b[1] / 255, a[2] * b[2] / 255]; };

// ── timeline ──
const T = { rain0: .15, cap1: .55, cap1out: 3.0, lamp: 1.85, train0: 3.2, train1: 6.6, bolt: 5.0, night0: 5.08, night1: 6.9,
  curl0: 6.9, curl1: 8.0, cap2: 8.15, fadeA: 8.75, fadeB: 9.95 };
const ANX = 900, ANY = 600;                 // push-in anchor (between window and desk)
const zoom = t => 1 + 0.085 * eInOut(seg(t, 0, DUR));
const lampL = t => {
  if (t < T.lamp) return 0;
  const d = t - T.lamp;
  const base = d < .07 ? 1 : d < .15 ? .22 : d < .2 ? .95 : d < .26 ? .55 : 1;
  return base * (.975 + .025 * Math.sin(t * 37.3) * Math.sin(t * 11.9));
};
const nightN = t => sstep(seg(t, T.night0, T.night1));
const flash = t => { const a = Math.exp(-Math.max(0, t - T.bolt) * 14) * (t >= T.bolt ? 1 : 0), b = Math.exp(-Math.max(0, t - T.bolt - .17) * 9) * (t >= T.bolt + .17 ? .8 : 0); return clamp(a + b); };
const rainR = t => .25 + .75 * sstep(seg(t, T.rain0, 2.2));

// ── geometry (room coordinates) ──
const WIN = { x0: 230, y0: 58, x1: 1490, y1: 722 }, FT = 30, MX = 860, MW = 28;
const PANES = [[WIN.x0 + FT, WIN.y0 + FT, MX - MW / 2, WIN.y1 - FT], [MX + MW / 2, WIN.y0 + FT, WIN.x1 - FT, WIN.y1 - FT]];
const DESK_Y = 772, SILL_Y = 712;
const LAMP = { bx: 1452, by: 968, j1: [1492, 720], j2: [1368, 548], mouth: [1262, 648], pool: [1150, 915] };
const MUG = { x: 1128, y: 842, w: 96, h: 104 };
const CAT = { x: 600, y: 838 };

// ── painting helpers ──
function blob(c, x, y, rx, ry, col, a, rot = 0) {
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(rx, ry);
  const g = c.createRadialGradient(0, 0, 0, 0, 0, 1); g.addColorStop(0, css(col, a)); g.addColorStop(1, css(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, 1, 0, TAU); c.fill(); c.restore();
}
function vgrad(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); for (const [o, col] of stops) g.addColorStop(o, typeof col === 'string' ? col : css(col)); return g; }
// painterly texture: short translucent strokes inside the current clip
function brushTex(c, x, y, w, h, n, cols, a0, a1, len, wid, ang, seed) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const px = x + r() * w, py = y + r() * h, l = len * (.5 + r()), th = ang + (r() - .5) * .5;
    c.strokeStyle = css(hx(cols[(r() * cols.length) | 0]), a0 + r() * (a1 - a0)); c.lineWidth = wid * (.5 + r()); c.lineCap = 'round';
    c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(px + Math.cos(th) * l * .5 + (r() - .5) * 4, py + Math.sin(th) * l * .5 + (r() - .5) * 4, px + Math.cos(th) * l, py + Math.sin(th) * l); c.stroke();
  }
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function withClip(c, pathFn, fn) { c.save(); pathFn(); c.clip(); fn(); c.restore(); }
// cloud bank: union of puffs, vertical gradient (lit top / dark belly), soft
function cloudBank(c, cx, cy, w, h, top, bot, seed, blur = 2, rim = null, rimA = .5) {
  const r = rng(seed), puffs = [];
  const n = 6 + (r() * 6 | 0);
  for (let i = 0; i < n; i++) { const u = clamp(i / (n - 1) + (r() - .5) * .12); const pr = h * (.25 + .8 * Math.pow(Math.sin(Math.PI * u), .7) * (.35 + .65 * r())); puffs.push([cx - w / 2 + u * w, cy - pr * .45 + (r() - .5) * 14, pr]); }
  for (let i = 0; i < 4; i++) { const u = .1 + r() * .8, pr = h * (.2 + .25 * r()); puffs.push([cx - w / 2 + u * w, cy - h * .15 + r() * 10, pr]); }
  const path = () => { c.beginPath(); for (const [x, y, pr] of puffs) { c.moveTo(x + pr, y); c.arc(x, y, pr, 0, TAU); } c.rect(cx - w / 2 - 10, cy - 2, w + 20, h * .35); };
  c.save(); c.filter = `blur(${blur}px)`;
  if (rim) { c.fillStyle = css(rim, rimA); path(); c.fill(); c.translate(2, 5); }
  c.fillStyle = vgrad(c, 0, cy - h * 1.1, 0, cy + h * .4, [[0, css(top)], [1, css(bot)]]); path(); c.fill();
  c.restore();
}

// ── sky ──
function paintSky(night) {
  const c = mk(), x = c.getContext('2d');
  x.fillStyle = night
    ? vgrad(x, 0, 0, 0, 720, [[0, '#060920'], [.35, '#0f1740'], [.66, '#1f2a60'], [.86, '#3a3a78'], [1, '#6a4a86']])
    : vgrad(x, 0, 0, 0, 720, [[0, '#262a5e'], [.26, '#4b4282'], [.5, '#935f96'], [.68, '#dc7c88'], [.84, '#f4a678'], [1, '#f9c98e']]);
  x.fillRect(0, 0, W, H);
  if (night) { blob(x, 1250, 170, 260, 260, hx('#8fa6e0'), .35); blob(x, 1250, 170, 70, 70, hx('#e8eeff'), .9); blob(x, 800, 700, 1100, 260, hx('#8a5a9a'), .35); }
  else { blob(x, 1130, 620, 700, 260, hx('#ffd49a'), .6); blob(x, 1130, 600, 220, 120, hx('#fff0c4'), .7); }
  // brush-texture the gradient so it reads painted, not digital
  brushTex(x, 0, 0, W, 740, 2600, night ? ['#0c1336', '#1b2556', '#2a3470'] : ['#5a4a8a', '#b86e90', '#f09a7c', '#3a3470'], .03, .08, 90, 14, 0, night ? 71 : 17);
  const r = rng(night ? 5 : 3);
  const banks = night
    ? [[520, 150, 900, 90, '#1a2150', '#0b1030', '#5d6aa8'], [1320, 250, 820, 80, '#1c2352', '#0c1234', '#9fb0e8'], [700, 380, 1000, 70, '#27306a', '#141b44', '#6070b0'], [1250, 470, 760, 60, '#3a3776', '#1d2255', '#8a6aa8']]
    : [[520, 140, 900, 95, '#4c4588', '#2d2b62', '#f2a2a8'], [1300, 240, 820, 85, '#6d5594', '#3f3a78', '#ffc3a6'], [640, 360, 1000, 70, '#b06d94', '#6f4f8c', '#ffd0a0'], [1280, 460, 760, 55, '#e08a8e', '#a1628e', '#ffe0a8']];
  for (const [cx, cy, w, h, top, bot, rim] of banks) {
    cloudBank(x, cx, cy, w, h, hx(top), hx(bot), (cx * 7 + cy) | 0, 3, hx(rim), night ? .3 : .5);
    for (let k = 0; k < 3; k++) cloudBank(x, cx + (r() - .5) * w * .8, cy + h * .35 + r() * 20, w * (.25 + r() * .3), h * .5, hx(bot), hx(top), (cx + k * 91) | 0, 2);
  }
  return c;
}

// ── city layers (painted for dusk and for night) ──
const FAR_WINS = [], NEAR_WINS = [];
let FAR_BLD = [], NEAR_BLD = [];
function planCity() {
  const r = rng(42);
  for (let x = 150; x < 1620;) { const w = 50 + r() * 90, top = 430 + r() * 120 - (r() < .15 ? 110 : 0); FAR_BLD.push([x, top, w]); x += w - 6 + r() * 8; }
  for (let x = 140; x < 1640;) { const w = 110 + r() * 170, top = 628 + r() * 50; NEAR_BLD.push([x, top, w]); x += w + 4 + r() * 20; }
  for (const [bx, top, w] of FAR_BLD) for (let yy = top + 12; yy < 700; yy += 15) for (let xx = bx + 7; xx < bx + w - 8; xx += 12) if (r() < .5) {
    const dusk = r() < .22, lit = dusk ? 0 : r() < .72 ? T.night0 + .25 + r() * 2.4 : 99;
    FAR_WINS.push([xx, yy, 5, 7, lit, r() < .82 ? 0 : 1, r()]);
  }
  for (const [bx, top, w] of NEAR_BLD) for (let yy = top + 16; yy < 720; yy += 22) for (let xx = bx + 10; xx < bx + w - 14; xx += 18) if (r() < .45) {
    const dusk = r() < .3, lit = dusk ? 0 : r() < .8 ? T.night0 + .15 + r() * 2.2 : 99;
    NEAR_WINS.push([xx, yy, 9, 12, lit, r() < .75 ? 0 : 1, r()]);
  }
}
function paintFar(night) {
  const c = mk(), x = c.getContext('2d'), col = hx(night ? '#1b2150' : '#735a8a'), haze = hx(night ? '#33346e' : '#b77a92');
  for (const [bx, top, w] of FAR_BLD) {
    x.fillStyle = vgrad(x, 0, top, 0, 700, [[0, css(col)], [1, css(haze)]]); x.fillRect(bx, top, w, 760 - top);
    x.fillStyle = css(mixc(col, night ? '#3a4280' : '#9a7aa8', .5), .55); x.fillRect(bx, top, 5, 760 - top);     // lit edge
    if (w > 110) { x.fillRect(bx + w * .4, top - 40, 3, 40); }
  }
  x.globalCompositeOperation = 'source-atop'; brushTex(x, 0, 380, W, 400, 900, night ? ['#252a60', '#141a40'] : ['#8a6a98', '#5f4a7a'], .05, .12, 40, 6, Math.PI / 2, 9);
  return c;
}
function paintMid(night) {           // elevated railway viaduct
  const c = mk(), x = c.getContext('2d'), col = hx(night ? '#141838' : '#553f6a'), lite = hx(night ? '#2c3570' : '#9a6f94');
  x.fillStyle = css(col); x.fillRect(0, 602, W, 16);
  x.fillStyle = css(lite); x.fillRect(0, 600, W, 3);
  for (let px = 40; px < W; px += 150) { x.fillStyle = css(col); x.fillRect(px, 616, 16, 120); x.fillStyle = css(lite, .5); x.fillRect(px, 616, 3, 120); }
  x.strokeStyle = css(col, .9); x.lineWidth = 2; for (let px = 0; px < W; px += 30) { x.beginPath(); x.moveTo(px, 600); x.lineTo(px, 588); x.stroke(); }
  x.beginPath(); x.moveTo(0, 588); x.lineTo(W, 588); x.stroke();
  return c;
}
function paintNear(night) {
  const c = mk(), x = c.getContext('2d'), col = hx(night ? '#0d1029' : '#3b2c4e'), edge = hx(night ? '#2a3068' : '#8a5a78');
  for (const [bx, top, w] of NEAR_BLD) {
    x.fillStyle = css(col); x.fillRect(bx, top, w, 800 - top);
    x.fillStyle = css(edge, .7); x.fillRect(bx, top, w, 3); x.fillRect(bx, top, 4, 800 - top);
  }
  const r = rng(77);
  for (const [bx, top, w] of NEAR_BLD) {       // rooftop clutter: water tanks, AC units, antennas
    const k = r();
    x.fillStyle = css(col);
    if (k < .35) { x.fillRect(bx + w * .3, top - 34, 36, 28); x.beginPath(); x.moveTo(bx + w * .3 - 4, top - 34); x.lineTo(bx + w * .3 + 18, top - 50); x.lineTo(bx + w * .3 + 40, top - 34); x.fill(); x.fillRect(bx + w * .3 + 4, top - 8, 3, 8); x.fillRect(bx + w * .3 + 29, top - 8, 3, 8); }
    else if (k < .7) { x.fillRect(bx + w * .6, top - 16, 30, 16); x.fillRect(bx + w * .2, top - 12, 22, 12); }
    else { x.fillRect(bx + w * .5, top - 60, 3, 60); x.fillRect(bx + w * .5 - 12, top - 48, 27, 2); }
  }
  return c;
}
// ── train sprite: dark cars with warm windows, glow built in ──
function paintTrain() {
  const cars = 7, cw = 158, c = mk(cars * (cw + 8) + 80, 90), x = c.getContext('2d');
  const body = () => { x.beginPath(); x.moveTo(30, 62); x.lineTo(30, 30); x.quadraticCurveTo(30, 16, 50, 16); for (let i = 0; i < cars; i++) { x.lineTo(40 + i * (cw + 8) + cw, 16); } x.lineTo(40 + cars * (cw + 8), 62); x.closePath(); };
  const wins = mk(c.width, c.height), wx = wins.getContext('2d');
  for (let i = 0; i < cars; i++) { const x0 = 40 + i * (cw + 8); for (let k = 0; k < 7; k++) { wx.fillStyle = k % 3 === 1 ? '#fff2c8' : '#ffd88a'; wx.fillRect(x0 + 12 + k * 20, 28, 13, 16); } }
  x.fillStyle = '#1a1830'; for (let i = 0; i < cars; i++) { const x0 = 40 + i * (cw + 8); rrect(x, x0, 18, cw, 44, 5); x.fill(); x.fillStyle = '#26243e'; x.fillRect(x0, 50, cw, 4); x.fillStyle = '#1a1830'; }
  x.fillStyle = '#1a1830'; x.beginPath(); x.moveTo(40, 18); x.quadraticCurveTo(18, 22, 16, 60); x.lineTo(44, 62); x.fill();
  x.save(); x.filter = 'blur(7px)'; x.globalAlpha = .9; x.drawImage(wins, 0, 0); x.restore();
  x.drawImage(wins, 0, 0);
  x.fillStyle = '#fff7da'; x.beginPath(); x.arc(22, 46, 4, 0, TAU); x.fill();
  return c;
}
let TRAIN;
// ── room: painted once in neutral "white light", window panes cut out ──
function paintRoom() {
  const c = mk(), x = c.getContext('2d');
  // wall
  x.fillStyle = vgrad(x, 0, 0, 0, H, [[0, '#e7d6d6'], [1, '#d6c1c6']]); x.fillRect(0, 0, W, H);
  withClip(x, () => { x.beginPath(); x.rect(0, 0, W, DESK_Y); }, () => brushTex(x, 0, 0, W, DESK_Y, 1800, ['#f2e4e0', '#cdb6bf', '#e0cccc'], .05, .14, 60, 10, Math.PI / 2 + .1, 21));
  // window frame (white painted wood, cel shadow on inner edges)
  x.fillStyle = '#f1ebe4'; x.fillRect(WIN.x0, WIN.y0, WIN.x1 - WIN.x0, WIN.y1 - WIN.y0);
  x.fillStyle = '#c9bec2'; for (const [a, b, cc, d] of PANES) { x.fillRect(a - 7, b - 7, cc - a + 14, 7); x.fillRect(a - 7, b, 7, d - b); }   // inner bevel shade
  x.fillStyle = '#8f8090'; for (const [a, b, cc, d] of PANES) { x.fillRect(a - 2, b - 2, cc - a + 4, d - b + 4); }
  x.fillStyle = '#ffffff'; x.fillRect(WIN.x0, WIN.y0, WIN.x1 - WIN.x0, 4); x.fillRect(MX - 2, WIN.y0 + FT, 4, WIN.y1 - WIN.y0 - 2 * FT);
  x.globalCompositeOperation = 'destination-out'; for (const [a, b, cc, d] of PANES) x.fillRect(a, b, cc - a, d - b); x.globalCompositeOperation = 'source-over';
  // latch on mullion
  x.fillStyle = '#b8aab2'; rrect(x, MX - 9, 420, 18, 40, 4); x.fill(); x.fillStyle = '#e8e0e0'; x.fillRect(MX - 5, 426, 4, 28);
  // curtain rod + curtains
  x.fillStyle = '#6b5a52'; x.fillRect(120, 30, 1520, 10); x.beginPath(); x.arc(120, 35, 11, 0, TAU); x.arc(1640, 35, 11, 0, TAU); x.fill();
  const curtain = (x0, x1, flip, seed) => {
    const r = rng(seed); const folds = 7;
    x.save(); x.beginPath(); x.moveTo(x0, 36); x.lineTo(x1, 36);
    x.bezierCurveTo(x1 + (flip ? -10 : 10), 300, x1 + (flip ? 20 : -20), 560, x1 + (flip ? -8 : 8), 745); x.lineTo(x0, 745); x.closePath(); x.clip();
    x.fillStyle = '#a3b9c9'; x.fillRect(x0 - 40, 0, x1 - x0 + 80, 800);
    for (let i = 0; i < folds; i++) { const fx = lerp(x0, x1, (i + .3 + r() * .4) / folds); x.fillStyle = css(hx('#7f94ab'), .7); x.beginPath(); x.moveTo(fx, 36); x.bezierCurveTo(fx + 6, 300, fx - 6, 560, fx + 4, 745); x.lineTo(fx + 12 + r() * 8, 745); x.bezierCurveTo(fx + 14, 560, fx + 20, 300, fx + 9, 36); x.fill();
      x.fillStyle = css(hx('#cfdde6'), .8); x.fillRect(fx - 10, 36, 4, 710); }
    brushTex(x, x0, 36, x1 - x0, 710, 260, ['#8ea3b8', '#bccbd8'], .06, .15, 50, 5, Math.PI / 2, seed + 1);
    x.restore();
  };
  curtain(1466, 1590, false, 31); curtain(110, 250, true, 37);
  // sill
  x.fillStyle = '#efe6dd'; x.fillRect(190, SILL_Y, 1340, 16); x.fillStyle = '#c7b8b5'; x.fillRect(180, SILL_Y + 16, 1360, 28); x.fillStyle = '#a8989a'; x.fillRect(180, SILL_Y + 44, 1360, 5);
  // bookshelf
  x.fillStyle = '#9a6a4a'; x.fillRect(1600, 0, 320, DESK_Y); x.fillStyle = '#6e4a36'; x.fillRect(1600, 0, 14, DESK_Y);
  const r = rng(55), bcols = ['#d9785f', '#e6c27a', '#7fa29a', '#8f7fb5', '#cf9aa8', '#5f7fa8', '#efe0c8', '#b86a5a', '#6f9a7a'];
  for (const sy of [190, 420, 650]) {
    x.fillStyle = '#b8835c'; x.fillRect(1614, sy, 306, 16); x.fillStyle = '#5e3e2c'; x.fillRect(1614, sy + 16, 306, 8);
    let bx = 1622;
    while (bx < 1900) {
      const bw = 18 + r() * 22, bh = 120 + r() * 70, col = bcols[(r() * bcols.length) | 0];
      if (r() < .12 && bx < 1800) { // leaning book
        x.save(); x.translate(bx, sy); x.rotate(.28); x.fillStyle = col; x.fillRect(0, -bh, bw, bh); x.fillStyle = css(mulc(col, '#b0a0a8')); x.fillRect(bw * .7, -bh, bw * .3, bh); x.restore(); bx += bw + 40; continue;
      }
      x.fillStyle = col; x.fillRect(bx, sy - bh, bw, bh);
      x.fillStyle = css(mulc(col, '#b0a0a8')); x.fillRect(bx + bw * .72, sy - bh, bw * .28, bh);
      x.fillStyle = css(hx('#fff4e0'), .55); x.fillRect(bx + 3, sy - bh + 14, bw - 8, 3); x.fillRect(bx + 3, sy - 22, bw - 8, 3);
      bx += bw + 2;
    }
  }
  // small plant on top shelf
  x.fillStyle = '#d6875f'; x.beginPath(); x.moveTo(1830, 190); x.lineTo(1840, 140); x.lineTo(1900, 140); x.lineTo(1890, 190); x.fill();
  // desk
  x.fillStyle = vgrad(x, 0, DESK_Y, 0, H, [[0, '#b98458'], [.25, '#cc9463'], [1, '#d9a06c']]); x.fillRect(0, DESK_Y, W, H - DESK_Y);
  x.fillStyle = '#8a5a3e'; x.fillRect(0, DESK_Y, W, 6);
  withClip(x, () => { x.beginPath(); x.rect(0, DESK_Y + 6, W, H); }, () => { brushTex(x, 0, DESK_Y, W, H - DESK_Y, 900, ['#b0764c', '#e0ab78', '#a86e46'], .08, .2, 220, 3, 0, 61); });
  // plant on the sill (in front of the glass)
  paintPlant(x);
  // stack of books by the window
  const stack = [[940, 792, 190, 26, '#6f8fb3'], [950, 766, 172, 26, '#e0b36a'], [930, 742, 200, 24, '#c8645a']];
  for (const [bx, by, bw, bh, col] of stack) { x.fillStyle = col; rrect(x, bx, by, bw, bh, 4); x.fill(); x.fillStyle = '#f5ecdc'; x.fillRect(bx + bw - 10, by + 4, 8, bh - 8); x.fillStyle = css(mulc(col, '#a898a8')); x.fillRect(bx, by + bh - 7, bw, 7); }
  x.fillStyle = css(hx('#5a4040'), .25); x.fillRect(935, 818, 196, 8);
  // open notebook with pencil
  paintNotebook(x);
  // cassette player + headphones
  paintCassette(x);
  // mug
  paintMug(x);
  // lamp (base, arm, shade exterior)
  paintLamp(x);
  return c;
}
function leaf(x, px, py, len, ang, wid, base, shade, hi) {

// ── the cat: ginger tabby in profile, facing the window; head up → tucked, tail wraps round ──

window.ready = (async () => {
