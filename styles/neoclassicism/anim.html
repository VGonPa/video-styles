<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── neoclassicism · a portico, a relief and a Doric frieze ─────────────────────────────────────
// Shot 1, the portico: an oxblood stage wall and a stone floor fade up; a gilt rule runs out from the
// centre, a three-step stylobate settles, six Ionic columns spring up in pairs from the centre out and
// drop home, the entablature lands on them, the pediment rises from the cornice on both sides and a
// gilt laurel grows leaf by leaf in the tympanum while NEOCLASSICISM is cut into the frieze letter by
// letter, left to right, under the caption "Europe · c. 1760–1830". After a hold the camera pushes into
// the frieze and the portico fades out against the bare wall, which carries over into
// shot 2, the relief: a marble panel on an oxblood ground where two draped figures in profile face an
// altar. They begin as flat contour drawing, fill with marble and rise out of the plane under a raking
// light, then lift a gilt wreath together (dip, rise, overshoot, settle), and sink back to line into
// shot 3, the principles: a Doric frieze, line first, whose three metopes receive their emblems (lamp
// in the middle first, then scales and wreath together) above carved labels, a hold and a fade to dark.
// Everything is mirror-symmetric about x = 960 and the camera only zooms along that axis. Relief is
// built from vector paths each frame: a cast shadow to the lower right, a lit inner edge upper-left, a
// shaded inner edge lower-right and a crisp umber contour. Textures are precomputed once and static.
// Seeded random numbers only; every frame depends on t alone.
'use strict';
const W = 1920, H = 1080, CX = W / 2, DUR = 9.6, TAU = Math.PI * 2;
const cv = document.getElementById('c'), main = cv.getContext('2d');

// ── palette (nothing outside it) ──
const P = {

  marble: '#efe9dd', mShade: '#d8cfbf', mDeep: '#a89c88', vein: '#c9c0b0', vein2: '#b5ab9a',
  stone: '#b9ad98', joint: '#8a7e6c',

// ── timeline (seconds) ──
const T = {

  steps: [0.32, 0.44, 0.56], stepFall: 0.26,
  cols: [0.74, 0.92, 1.1], colRise: 0.34, colFall: 0.2,
  ent: 1.52, entFall: 0.38,
  ped: 1.92, pedRise: 0.24, pedSettle: 0.12,
  letters: 2.2, letterStep: 0.038, letterRamp: 0.07,
  ribbon: [2.27, 2.45], leaves: 2.33, leafStep: 0.035,
  caption: [2.33, 2.68],

  push: [3.27, 4.07], out1: [3.89, 4.07],

  s2: 4.07, lines: [4.07, 4.19], bandsIn: [4.07, 4.42], fill: [4.45, 4.65],
  rise: [4.62, 5.2], rake: [4.6, 5.5],
  dip: [5.3, 5.47], lift: [5.47, 6.2],
  sink: [6.42, 6.56], unfill: [6.54, 6.66], unline: [6.66, 6.79], bandsOut: [6.44, 6.72], pull: [6.4, 6.8],

  s3: 6.74, lines3: [6.74, 6.88], fill3: [6.92, 7.1],
  head: [7.0, 7.4], emC: 7.18, emO: 7.56, labC: 7.36, labO: 7.74,

// ── paths ──
// Catmull-Rom through points; a truthy third element makes that point a sharp corner.

const bbOf = pts => { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const q of pts) { a = Math.min(a, q[0]); b = Math.min(b, q[1]); c = Math.max(c, q[0]); d = Math.max(d, q[1]); } return [a, b, c, d]; };

const SP = (pts, closed = true) => piece(spline(pts, closed), bbOf(pts));
const PL = pts => { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts.slice(1)) p.lineTo(q[0], q[1]); p.closePath(); return piece(p, bbOf(pts)); };

const line = (pts, smoothIt = true) => {

  const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (const q of pts.slice(1)) p.lineTo(q[0], q[1]); return p;
};

const flipPts = (pts, cx) => pts.map(q => [2 * cx - q[0], q[1], q[2]]);

// ── relief rendering ──
// g is the context being drawn (the frame, a layer or a precomputed texture); Z is how many device
// pixels one world unit covers there, so shadow offsets and blurs keep their size under zoom.
// INK_ONLY draws pure contour (each fill erases the lines under it, on a transparent layer).
// RAKE is the low raking light of shot 2: I its strength, x its device-space position.
let g = main, Z = 1, INK_ONLY = false;
const RAKE = { I: 0, x: 0 };
let MARBLE, STONE, PLASTER;
function giltGrad(b) {

const GOLD = { fill: giltGrad, hi: GHI, lo: GLO, hiA: 0.8, loA: 0.8 };
// d: how far the shape stands proud of its ground (0 = flat contour drawing, 1 = full relief)
// s: extra local scale under the current transform (keeps contour widths in world units)
function relief(pc, o = {}) {

// contour-only line: the umber cut with a light lip on its lower-right wall, so it reads as incised

// an incised line: the dark cut, and the light lip of its lower-right wall

// ── textures (tileable value noise, built once) ──
function noiseTile(size, cells, octaves, rnd) {

    const L = new Float32Array(cells * cells); for (let i = 0; i < L.length; i++) L[i] = rnd();
    const k = cells / size;

// an oxblood wall: plaster over a radial light, as a world-positioned layer

  gr.addColorStop(0, P.oxLit); gr.addColorStop(0.45, '#6c231c'); gr.addColorStop(0.8, P.ox); gr.addColorStop(1, '#4a1512');

// ── camera: zoom about the central axis only ──
function setCam(z, cy) { g.setTransform(z, 0, 0, z, CX - CX * z, H / 2 - cy * z); Z = z; }

// ── laurel ──
const LEAF = (() => { const p = new Path2D(); p.moveTo(0, 0); p.quadraticCurveTo(0.38, -0.29, 1, 0); p.quadraticCurveTo(0.38, 0.29, 0, 0); p.closePath(); return piece(p, [0, -0.15, 1, 0.15]); })();

let LEAF_GOLD;

// A wreath of two branches rising from a bottom tie. grow(j) scales station j (0 = bottom) from 0 to 1;

function buildArch() {

function buildEmblems() {

function drawScales(o) {

function flamePath(t, h) {

  p.moveTo(0, -10); p.bezierCurveTo(-16 * h, -14, -15 * h, (top - 10) * 0.55, sway, top);
  p.bezierCurveTo(15 * h, (top - 10) * 0.55, 16 * h, -14, 0, -10); p.closePath();

}

function drawEmblem(i, t) {
