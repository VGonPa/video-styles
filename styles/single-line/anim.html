<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: #f3eee4; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="./common.js"></script>
<script>
// SINGLE LINE — "Good morning.": one unbroken line of ink draws a coffee cup, its steam becomes a bird,
// the bird flies into a window, the window becomes a sunrise over the city, and the line writes "good morning."
const [PAPER, INK, ACC] = ['#f3eee4', '#1e1c19', '#c4502f'];   // paper, ink, nib accent
const HY = 742, X0 = -80, X1 = 2000;   // ground line; the line enters and leaves off-canvas
// every scene is five segments with fixed point counts, so each part morphs into its counterpart
const CNT = [360, 760, 560, 620, 300];
const N = CNT.reduce((a, b) => a + b, 0);
// --- warm drawing paper, painted once: centre lift, grain, curled fibres ---
const sheet = mk(W, H);
{ const g = sheet.getContext('2d'), rand = rng(7);
  g.fillStyle = PAPER; g.fillRect(0, 0, W, H);
  const lift = g.createRadialGradient(960, 520, 500, 960, 540, 1300);
  lift.addColorStop(0, 'rgba(255,252,245,0.22)'); lift.addColorStop(1, 'rgba(120,100,70,0.13)');
  g.fillStyle = lift; g.fillRect(0, 0, W, H);
  const img = g.getImageData(0, 0, W, H), px = img.data;
  for (let i = 0; i < px.length; i += 4) { const n = (rand() - .5) * 10; for (let ch = 0; ch < 3; ch++) px[i + ch] += n; }
  g.putImageData(img, 0, 0);
  g.strokeStyle = 'rgba(110,90,60,0.05)'; g.lineWidth = 1;
  for (let n = 0; n < 900; n++) {
    const x = rand() * W, y = rand() * H, ang = rand() * Math.PI, len = 6 + rand() * 22;
    const dx = Math.cos(ang), dy = Math.sin(ang);
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + dx * len * .5 + (rand() - .5) * 6, y + dy * len * .5 + (rand() - .5) * 6, x + dx * len, y + dy * len);
    g.stroke();
  } }

// --- helpers ---
const lead = (xa, xb) => P().M(xa, HY).L(xb, HY);
function poly(pts) { const p = P().M(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.L(pts[i][0], pts[i][1]); return p; }
// seagull glyph drawn from its body out to each wingtip and back (the return retraces, so it stays one clean stroke); flap f in [-1,1]
function wing(bx, by, s, f, dir) {
  const tip = [bx + dir * 132 * s, by + (2 + 36 * f) * s];
  return [[bx + dir * 18 * s, by - 14 * s], [bx + dir * 64 * s, by - (40 + 4 * f) * s], [bx + dir * 110 * s, by - (20 - 26 * f) * s], [tip[0] - dir * 1, tip[1] - 1], tip];
}
function birdPts(bx, by, s, f) {
  const c = [bx, by + 16 * s], L = wing(bx, by, s, f, -1), R = wing(bx, by, s, f, 1);
  return [c, ...L, ...L.slice(0, -1).reverse(), c, ...R, ...R.slice(0, -1).reverse(), c];
}

// --- Scene 1 / 2: cup (left + right halves stay), middle segment is steam or bird ---
function cupL() { return P().M(700, HY).S([[745, HY - 2], [772, HY - 14], [805, HY - 24], [856, HY - 30], [838, 660], [826, 560], [822, 482], [838, 463], [900, 455], [960, 452]], 14); }
function cupR() { return P().M(1004, 450).S([[1045, 455], [1084, 463], [1097, 482], [1096, 505], [1136, 498], [1170, 528], [1168, 578], [1134, 606], [1088, 604], [1080, 645], [1070, 690], [1062, HY - 30], [1116, HY - 24], [1150, HY - 14], [1176, HY - 2], [1210, HY]], 14); }
function steam(t) {
  const base = [[944, 410], [970, 362], [938, 314], [962, 266], [944, 226], [962, 196], [990, 204], [1004, 236], [1024, 278], [1000, 322], [1028, 366], [1004, 410], [1004, 450]];
  const pts = base.map(([x, y], i) => [x + Math.sin(t * 2.6 + y * 0.022 + i * .4) * 12 * (452 - y) / 240, y]);
  pts[pts.length - 1] = [1004, 450];
  return P().M(960, 452).S(pts, 14);
}
function birdSeg(t, bx, by, s) {
  const f = Math.sin(t * 8.5);
  return P().M(960, 452).S([[950, 405], [972, 355], [960, 305], [bx - 30, by + 60], ...birdPts(bx, by, s, f), [bx + 26, by + 64], [1052, 330], [1026, 392], [1004, 450]], 14);
}

// --- Scene 3: window (bird perched in the upper right pane) ---
function winL() { return P().M(700, HY).S([[735, HY - 6], [754, 700], [760, 644]], 14).L(760, 640).L(1160, 640).L(1160, 300).L(760, 300).L(760, 640).L(760, 470).L(1160, 470).L(960, 470).jitter(1.0, 31); }
function winF(t) {
  // the bird hovers in the upper right pane at the end of a looping flight trail; the trail is retraced back to the mullions
  const f = Math.sin(t * 8.5) * .6, s = 0.55, bx = 1078, by = 372 + Math.sin(t * 2.2) * 4;
  const trail = [[984, 458], [1012, 446], [1026, 424], [1010, 408], [996, 422], [1014, 440], [bx - 22, by + 40]];
  return P().M(960, 470).S([...trail, ...birdPts(bx, by, s, f), ...trail.slice(0, -1).reverse(), [962, 468]], 12);
}
function winR() { return P().M(962, 468).L(960, 300).L(960, 640).L(1160, 640).S([[1186, 690], [1204, HY - 6], [1240, HY]], 14).jitter(1.0, 37); }

// --- Scene 4: skyline with a sun loop that rises between the roofs ---
const ROOF = 600;
function skyL() { return poly([[560, HY], [560, 560], [620, 560], [620, 610], [668, 610], [668, 450], [700, 418], [732, 450], [732, 530], [800, 530], [800, ROOF], [936, ROOF]]).jitter(2, 41); }
// sun: a loop tied to the roofline, ringed with rays drawn out and back; it lifts a little as it rises
const SUNR = 80;
const sunY = t => lerp(ROOF - SUNR - 12, ROOF - SUNR - 120, eio(seg(t, 6.0, 7.9)));
function sunF(t) {
  const r = SUNR, sy = sunY(t), neck = sy + r + 8, ray = r + 30 * eout(seg(t, 5.9, 7.2)) + 6;
  const p = P().M(936, ROOF).S([[948, ROOF - 3], [951, lerp(ROOF - 4, neck, 0.5)], [953, neck]], 10);
  const a0 = Math.PI / 2 + 0.3, a1 = Math.PI * 2.5 - 0.3;
  for (let k = 0; k <= 88; k++) {
    const a = lerp(a0, a1, k / 88); p.p.push([960 + Math.cos(a) * r, sy + Math.sin(a) * r]);
    if (k % 8 === 4 && k > 4 && k < 84) { const e = [960 + Math.cos(a) * ray, sy + Math.sin(a) * ray], b = [960 + Math.cos(a) * (r + 12), sy + Math.sin(a) * (r + 12)];
      p.L(b[0], b[1], 3).L(e[0], e[1], 6).L(b[0], b[1], 6).L(960 + Math.cos(a) * r, sy + Math.sin(a) * r, 3); }
  }
  p.S([[967, neck], [969, lerp(ROOF - 4, neck, 0.5)], [972, ROOF - 3], [984, ROOF]], 10);
  return p;
}
function skyR() { return poly([[984, ROOF], [1060, ROOF], [1060, 500], [1110, 500], [1110, 402], [1172, 402], [1172, 560], [1232, 560], [1232, 470], [1290, 470], [1290, 620], [1340, 620], [1340, HY]]).jitter(2, 43); }

// --- Scene 5: "good morning." in one cursive line ---
const BOWL = [[0.68, 0.82], [0.45, 0.97], [0.18, 0.86], [0.05, 0.5], [0.15, 0.1], [0.4, 0.0], [0.62, 0.18], [0.7, 0.5]];
const OCORE = [[0.55, 0.96], [0.28, 0.92], [0.1, 0.6], [0.14, 0.18], [0.4, 0.0], [0.66, 0.15], [0.74, 0.52], [0.62, 0.88], [0.53, 0.96], [0.74, 0.86], [0.95, 0.82]];
const GL = {
  g: { w: 1.0, p: [...BOWL, [0.72, 0.95], [0.7, 0.3], [0.66, -0.4], [0.5, -0.85], [0.28, -0.9], [0.2, -0.6], [0.4, -0.3], [0.7, -0.08], [1.0, 0.15]] },
  oL: { w: 0.95, p: [[0.2, 0.72], [0.42, 0.98], ...OCORE] },
  oH: { w: 0.95, p: OCORE },
  d: { w: 1.15, p: [...BOWL, [0.78, 1.3], [0.9, 1.85], [0.82, 2.02], [0.7, 1.85], [0.72, 1.2], [0.72, 0.35], [0.8, 0.03], [0.98, 0.05], [1.15, 0.25]] },
  sp: { w: 0.85, p: [[0.3, -0.1], [0.62, -0.08], [0.85, 0.05]] },
  m: { w: 1.0, p: [[0.05, 0.92], [0.06, 0.02], [0.1, 0.7], [0.24, 0.97], [0.38, 0.75], [0.4, 0.02], [0.44, 0.7], [0.58, 0.97], [0.72, 0.75], [0.74, 0.12], [0.84, 0.0], [0.98, 0.2]] },
  r: { w: 0.68, p: [[0.14, 1.04], [0.2, 0.86], [0.38, 0.9], [0.36, 0.45], [0.37, 0.02], [0.52, 0.0], [0.68, 0.18]] },
  n: { w: 0.7, p: [[0.08, 0.92], [0.09, 0.02], [0.13, 0.7], [0.28, 0.97], [0.42, 0.75], [0.44, 0.12], [0.54, 0.0], [0.7, 0.2]] },
  i: { w: 0.38, p: [[0.1, 0.9], [0.1, 1.2], [0.18, 1.36], [0.1, 1.46], [0.02, 1.36], [0.1, 1.22], [0.11, 0.9], [0.12, 0.1], [0.22, 0.0], [0.38, 0.18]] },
  dot: { w: 0.4, p: [[0.12, 0.02], [0.2, 0.0], [0.26, 0.07], [0.2, 0.14], [0.14, 0.07], [0.2, 0.0], [0.4, 0.02]] },
};
const WS = 88, WB = 640, SHEAR = 0.16;
function wordPts(keys, ox) {
  const out = []; let x = ox;
  for (const k of keys) { const g = GL[k]; for (const [u, v] of g.p) out.push([x + (u + v * SHEAR) * WS, WB - v * WS]); x += g.w * WS; }
  return { pts: out, x };
}
const WORD = (() => {
  const w0 = 520, a = wordPts(['g', 'oL', 'oH', 'd', 'sp'], w0), b = wordPts(['m', 'oL', 'r', 'n'], a.x), c = wordPts(['i', 'n', 'g', 'dot'], b.x);
  return { a: a.pts, b: b.pts, c: c.pts, end: c.x, x0: w0 };
})();
function wordL() { return P().M(430, HY).S([[462, HY - 6], [488, 690], [500, 600], [520, 548], [556, 540], ...WORD.a], 12); }
function wordF() { const s = WORD.a[WORD.a.length - 1]; return P().M(s[0], s[1]).S(WORD.b, 12); }
function wordR() { const s = WORD.b[WORD.b.length - 1]; return P().M(s[0], s[1]).S([...WORD.c, [WORD.end + 40, 660], [WORD.end + 90, HY - 6], [WORD.end + 140, HY]], 12); }

// --- scene assembly: [lead-in, left, middle, right, lead-out] ---
function build(segs) { const r = new Path(); segs.forEach((s, i) => { r.p.push(...s.resample(CNT[i]).p); }); return r.done(); }
const SC = [
  t => build([lead(X0, 700), cupL(), steam(t), cupR(), lead(1210, X1)]),
  t => build([lead(X0, 700), cupL(), birdSeg(t, 1085, 212 + Math.sin(t * 2.2) * 8, 1), cupR(), lead(1210, X1)]),
  t => build([lead(X0, 700), winL(), winF(t), winR(), lead(1240, X1)]),
  t => build([lead(X0, 560), skyL(), sunF(t), skyR(), lead(1340, X1)]),
  t => build([lead(X0, 430), wordL(), wordF(), wordR(), lead(WORD.end + 140, X1)]),
];
const WORDSC = SC[4](0);
const WI0 = (() => { let i = 0; while (WORDSC.p[i][0] < WORD.x0 - 4) i++; return i; })();                          // first ink of "g"
const WI1 = (() => { let i = N - 1; while (WORDSC.p[i][0] > WORD.end - 0.1 * WS) i--; return i; })();              // just past the period

// Pen pressure: line width wanders along the line as a mix of slow sine waves (one value per point).
const WID = new Float32Array(N);
for (let i = 0; i < N; i++) {
  const u = i / N;
  WID[i] = 5.6 + 1.2 * Math.sin(u * 37.0) * Math.sin(u * 11.3 + 1) + 0.6 * Math.sin(u * 91);
}

// Ink the line between fractional indices `from` and `to` as short Path2D runs of 6 points,
// each run stroked at the pressure width found at its first point.
function inkRange(pts, from, to) {
  const lo = Math.max(0, Math.floor(from)), hi = Math.ceil(to) - 1;
  Object.assign(ctx, { lineCap: 'round', lineJoin: 'round', strokeStyle: INK });
  for (let s = lo; s < to - 1; s += 6) {
    const run = new Path2D();
    run.moveTo(pts[s][0], pts[s][1]);
    for (let j = s + 1, e = Math.min(hi, s + 6); j <= e; j++) run.lineTo(pts[j][0], pts[j][1]);
    ctx.lineWidth = WID[s];
    ctx.stroke(run);
  }
}
// Point-wise blend from scene A to scene B at progress tau; with lag > 0 the head of the line leads the tail.
function morph(A, B, tau, lag = 0.55) {
  const mixed = new Array(N);
  for (let i = 0; i < N; i++) {
    const k = eio(clamp(tau * (1 + lag) - lag * (i / N))), a = A.p[i], b = B.p[i];
    mixed[i] = [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
  }
  return mixed;
}
// index at a fraction of the total arc length (so the pen moves at a steady speed)
function idxAt(path, u) { const s = u * path.len; let lo = 0, hi = N - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (path.cum[m] < s) lo = m; else hi = m; } return lo + (s - path.cum[lo]) / ((path.cum[hi] - path.cum[lo]) || 1); }
// accent dot (the pen nib)
function dot(x, y, r, a = 1) {
  ctx.save();
  ctx.globalAlpha = a; ctx.fillStyle = ACC;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.restore();
}

// timeline
const TL = { in0: 0.3, in1: 2.5, m: [[2.8, 3.9], [4.3, 5.35], [5.6, 6.6], [7.4, 8.5]], out0: 8.75, out1: 9.7, end: 10 };

// The visible line at time t: its points, the inked range [i0, i1], and where to put the nib dots.
function lineAt(t) {
  const view = { pts: null, i0: 0, i1: N, head: null, tail: null };
  if (t < TL.m[0][0]) {                           // first drawing: the pen travels along the cup at steady speed
    const path = SC[0](t), u = eio2(seg(t, TL.in0, TL.in1));
    view.pts = path.p;
    view.i1 = u >= 1 ? N : idxAt(path, u) + 1;
    if (u > 0 && u < 1) view.head = view.pts[Math.min(N - 1, Math.floor(view.i1))];
    if (u <= 0) view.i1 = 0;
  } else {
    const k = TL.m.findIndex(([, end]) => t < end);   // current or next morph
    if (k < 0) view.pts = WORDSC.p;
    else if (t < TL.m[k][0]) view.pts = SC[k](t).p;
    else view.pts = morph(SC[k](t), SC[k + 1](t), seg(t, TL.m[k][0], TL.m[k][1]));
  }
  if (t >= TL.out0) {                             // the line retracts from both ends onto the words
    const u = eio(seg(t, TL.out0, TL.out1));
    view.i0 = u * WI0; view.i1 = N - 1 - u * (N - 1 - WI1);
    if (u < 1) { view.tail = view.pts[Math.floor(view.i0)]; view.head = view.pts[Math.ceil(view.i1)]; }
  }
  return view;
}
const CAPTION = 'one line, a new day.', CAPTION_FONT = "italic 500 40px 'Cormorant Garamond'";
// the closing caption fades in under the words and settles upward by 10 px
function caption(t) {
  const alpha = seg(t, 8.9, 9.4);
  if (alpha <= 0) return;
  const rise = 10 * (1 - eout(seg(t, 8.9, 9.5)));
  ctx.save();
  Object.assign(ctx, { globalAlpha: alpha, fillStyle: INK, font: CAPTION_FONT, textAlign: 'center', letterSpacing: '2px' });
  ctx.fillText(CAPTION, 960, 860 + rise);
  ctx.restore();
}
function paint(t) {
  ctx.resetTransform();
  ctx.drawImage(sheet, 0, 0);
  // soft sunrise warmth behind the sun loop
  const glow = seg(t, 5.9, 7.2) * (1 - seg(t, 7.5, 8.4));
  if (glow > 0) { const sy = sunY(t);
    const g = ctx.createRadialGradient(960, sy, 40, 960, sy, 420); g.addColorStop(0, `rgba(232,150,90,${0.2 * glow})`); g.addColorStop(1, 'rgba(232,150,90,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  // slow push-in about the frame centre across the whole clip
  const zoom = 1 + 0.025 * eio(clamp(t / TL.end));
  ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  const view = lineAt(t), nib = q => dot(q[0], q[1], 7.5);
  if (view.i1 - view.i0 > 1) inkRange(view.pts, view.i0, view.i1);
  if (view.head) nib(view.head);
  if (view.tail && view.i0 > 1) nib(view.tail);
  caption(t);
  // the last 0.4 s wash back toward blank paper
  ctx.resetTransform();
  const wash = seg(t, 9.6, TL.end);
  if (wash > 0) { ctx.save(); ctx.globalAlpha = 0.35 * wash; ctx.drawImage(sheet, 0, 0); ctx.restore(); }
}
// sound cues for audio.py
window.events = () => [
  { t: TL.in0, k: 'pen', d: TL.in1 - TL.in0 },
  { t: 2.6, k: 'steam' },
  ...TL.m.map(([a, b]) => ({ t: a, k: 'whoosh', d: b - a })),
  { t: 3.7, k: 'chirp' }, { t: 4.05, k: 'chirp', v: 0.7 }, { t: 5.2, k: 'chirp', v: 0.5 },
  { t: 6.1, k: 'sun' },
  { t: 8.35, k: 'chord' },
  { t: TL.out0, k: 'retract', d: TL.out1 - TL.out0 },
];
window.ready = loadFont('Cormorant Garamond', 'CormorantGaramond-500', 500, 'italic').then(() => document.fonts.load(CAPTION_FONT, CAPTION));
window.draw = ({ t }) => {
  paint(t);
  return cv.toDataURL('image/jpeg', 0.92).split(',')[1];
};
</script>
</body>
</html>
