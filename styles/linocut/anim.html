<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Linocut</title>
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #111; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Linocut, 10 s: "LET THE FOREST GROW WILD".
 *
 * A two-block relief print (black key block + red block) pulled on cream paper.
 *   Sheet A: the red sun is stamped, then the black ground; a sapling branches out into a full tree,
 *            pines are pressed in around it, a stag walks out of the trees and lifts its head, birds rise.
 *   Then a brayer rolls black ink across the sheet and the sheet peels away, revealing
 *   Sheet B: the poster. Words land one by one, a flock appears, the edition is pencilled in the margin,
 *            and finally the corner of the sheet lifts off the (mirrored) block.
 * Everything that moves is held on a 12 fps grid; the ink grain switches between four pre-built
 * masks eight times a second, which makes the print "boil" a little like a flipbook of pulls.
 * window.draw({t}) returns a JPEG (base64) of the frame at time t; nothing depends on wall time. */

const SW = 1920, SH = 1080, MID = SW / 2;
const screen = document.getElementById('c').getContext('2d');

// ── small maths ─────────────────────────────────────────────────────────────
const box = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
const mix = (p, q, k) => p * (1 - k) + q * k;
const ramp = (t, from, to) => box((t - from) / (to - from));
const easeIO = k => { const m = 2 * box(k); return m < 1 ? m * m * m / 2 : 1 - (2 - m) ** 3 / 2; };
const easeOut = k => 1 - (1 - box(k)) ** 3;
function seeded(n) {   // mulberry32
  let a = Math.imul(n | 0, 0x9E3779B1) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let z = Math.imul(a ^ (a >>> 15), a | 1);
    z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function sheet(w = SW, h = SH) { const el = document.createElement('canvas'); el.width = w; el.height = h; return el; }

// ── look ────────────────────────────────────────────────────────────────────
const TYPE = "'Alfa Slab One', serif";
const PAL = { paper: '#efe5cf', black: '#15120f', red: '#c7331f', fade: '16,13,11' };
const BLK = { x: 86, y: 70, w: SW - 2 * 86, h: SH - 2 * 70 };   // where the block meets the paper

// timeline (seconds)
const T = {
  sun: .35, ground: .7, grow0: 1.0, grow1: 2.25, reds: 2.2, pines: [2.35, 2.5, 2.65, 2.8, 2.95],
  walk0: 3.05, walk1: 3.95, head: 4.05, birds: 3.75,
  roll0: 4.75, roll1: 5.5, peel0: 5.5, peel1: 6.05,
  words: [6.2, 6.55, 6.95, 7.25], flock: 7.5, pencil0: 7.6, pencil1: 8.0,
  lift0: 8.9, lift1: 9.8, fade0: 9.35,
};

// ── textures, built once ────────────────────────────────────────────────────
// A lattice of random values, stretched bilinearly over the whole frame (one value per pixel, 0..1).
function softNoise(rand, cols, rows) {
  const stride = cols + 1, lat = new Float32Array(stride * (rows + 1));
  for (let i = 0; i < lat.length; i++) lat[i] = rand();
  const out = new Float32Array(SW * SH), kx = cols / SW, ky = rows / SH;
  for (let y = 0, o = 0; y < SH; y++) {
    const fy = (y + .5) * ky, iy = Math.min(rows - 1, fy | 0), wy = fy - iy, up = iy * stride, dn = up + stride;
    for (let x = 0; x < SW; x++, o++) {
      const fx = (x + .5) * kx, ix = Math.min(cols - 1, fx | 0), wx = fx - ix;
      const a = lat[up + ix] + (lat[up + ix + 1] - lat[up + ix]) * wx;
      const b = lat[dn + ix] + (lat[dn + ix + 1] - lat[dn + ix]) * wx;
      out[o] = a + (b - a) * wy;
    }
  }
  return out;
}

const PAPER_CV = sheet();
function makePaper() {
  const g = PAPER_CV.getContext('2d');
  g.fillStyle = PAL.paper; g.fillRect(0, 0, SW, SH);
  const img = g.getImageData(0, 0, SW, SH), px = img.data, rand = seeded(905);
  const broad = softNoise(rand, 80, 45), fibre = softNoise(rand, 400, 225);
  for (let p = 0; p < broad.length; p++) {
    const v = (broad[p] - .5) * 15 + (fibre[p] - .5) * 13 + (rand() - .5) * 10, o = p << 2;
    px[o] += v; px[o + 1] += v * .95; px[o + 2] += v * .85;
  }
  g.putImageData(img, 0, 0);
  // plate mark: the pressure of the block leaves a lit edge, a shaded edge and a faint tint
  g.lineWidth = 3;
  for (const [off, col] of [[2, 'rgba(255,255,255,.55)'], [-1, 'rgba(90,70,40,.28)']]) { g.strokeStyle = col; g.strokeRect(BLK.x + off, BLK.y + off, BLK.w, BLK.h); }
  g.fillStyle = 'rgba(120,95,60,.05)'; g.fillRect(BLK.x, BLK.y, BLK.w, BLK.h);
}

// Ink coverage masks (alpha only): uneven density, starved patches, and specks where the paper tooth
// stayed dry. Four variants, cycled to make the ink boil.
const INK_MASKS = [];
function makeInkMask(variant) {
  const rand = seeded(431 + variant * 29), el = sheet(), g = el.getContext('2d');
  const img = g.createImageData(SW, SH), px = img.data;
  const density = softNoise(rand, 48, 27), starve = softNoise(rand, 140, 80), tooth = softNoise(rand, 960, 540);
  for (let p = 0; p < density.length; p++) {
    let a = .9 + density[p] * .14;
    const dry = (starve[p] - .855) / .118;
    if (dry > 0) a *= 1 - Math.min(1, dry) * .55;
    if (tooth[p] > .886 || rand() < .006) a *= rand() * .35;
    px[(p << 2) + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  return el;
}

// ── cutting tools (all add sub-paths to whatever path/context `p` is) ───────
// a V-gouge mark: two quadratic arcs meeting in points at both ends; `w` is its widest width
function sliver(p, ax, ay, bx, by, w) {
  const dx = bx - ax, dy = by - ay, k = w / (Math.hypot(dx, dy) || 1), cx = (ax + bx) / 2, cy = (ay + by) / 2;
  p.moveTo(ax, ay);
  p.quadraticCurveTo(cx - dy * k, cy + dx * k, bx, by);
  p.quadraticCurveTo(cx + dy * k, cy - dx * k, ax, ay);
}
// a polygon with a knife-cut edge: every side subdivided, each point nudged along the side's normal
function hewn(p, verts, amp, seed, step = 34) {
  const rand = seeded(seed); let started = false;
  verts.forEach((a, i) => {
    const b = verts[(i + 1) % verts.length], ex = b[0] - a[0], ey = b[1] - a[1], len = Math.hypot(ex, ey) || 1, n = Math.ceil(len / step) || 1;
    for (let k = 0; k < n; k++) {
      const off = (rand() - .5) * amp, x = a[0] + ex * k / n - ey / len * off, y = a[1] + ey * k / n + ex / len * off;
      if (started) p.lineTo(x, y); else { p.moveTo(x, y); started = true; }
    }
  });
  p.closePath();
}
function raggedDisc(p, x, y, R, amp, seed, n = 90) {
  const rand = seeded(seed);
  for (let i = 0; i < n; i += 1) {
    const a = 2 * Math.PI * i / n, r = R + (rand() - .5) * amp;
    if (i) p.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); else p.moveTo(x + r, y);
  }
  p.closePath();
}
// a filled band along a polyline; half(u) gives the half-width at fraction u of the way along
function ribbon(p, pts, half) {
  const last = pts.length - 1, edge = [];

    const [x0, y0] = pts[Math.max(0, i - 1)], [x1, y1] = pts[Math.min(last, i + 1)], d = Math.hypot(x1 - x0, y1 - y0) || 1, w = half(i / last);
    const nx = (y0 - y1) / d * w, ny = (x1 - x0) / d * w;
    edge.push([pts[i][0] + nx, pts[i][1] + ny, pts[i][0] - nx, pts[i][1] - ny]);
  }
  p.moveTo(edge[0][0], edge[0][1]);
  for (let i = 1; i <= last; i++) p.lineTo(edge[i][0], edge[i][1]);
  for (let i = last; i >= 0; i--) p.lineTo(edge[i][2], edge[i][3]);
  p.closePath();
}
const limb = (p, pts, w0, w1) => ribbon(p, pts, u => mix(w0, w1, u) / 2);           // branches, legs, antlers
const groove = (p, pts, w) => ribbon(p, pts, u => Math.sin(u * Math.PI) * w / 2);    // curved gouge, pointed ends
function ringGroove(p, x, y, R, a0, a1, w) {
  const pts = [];
  for (let i = 0; i <= 12; i++) { const a = mix(a0, a1, i / 12); pts.push([x + R * Math.cos(a), y + R * Math.sin(a)]); }
  groove(p, pts, w);
}
function cutAway(g, cuts) {   // remove lino: whatever `cuts` traces is erased from the layer
  g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); cuts(g); g.fill(); g.restore();
}
function splinters(g, seed, count, place) {   // uncleared slivers left standing in the open areas
  const rand = seeded(seed);
  g.beginPath();
  for (let n = 0; n < count; n++) {
    const [x, y] = place(rand), dir = rand() * Math.PI, len = 10 + rand() * 30;
    sliver(g, x, y, x + len * Math.cos(dir), y + len * Math.sin(dir), 1.4 + rand() * 2.2);
  }
  g.fill();
}

// ── the press: stamps land on the 12 fps grid with a little kick ────────────
const held = t => Math.floor(t * 12 + 1e-6) / 12;
const KICK = [{ s: 1.07, jx: 3, jy: -2 }, { s: .985, jx: -2, jy: 1 }], REST = { s: 1, jx: 0, jy: 0 };
function impact(tq, t0) { return tq < t0 - 1e-6 ? null : KICK[Math.round((tq - t0) * 12)] || REST; }
function pressed(g, hit, ax, ay, paint) {   // scale about (ax, ay) and nudge, then paint
  g.save(); g.transform(hit.s, 0, 0, hit.s, ax + hit.jx - ax * hit.s, ay + hit.jy - ay * hit.s); paint(g); g.restore();
}
const BLACK_CV = sheet(), RED_CV = sheet(), SCRATCH_CV = sheet();
const kb = BLACK_CV.getContext('2d'), kr = RED_CV.getContext('2d'), ks = SCRATCH_CV.getContext('2d');
function onScratch(paint) {
  ks.setTransform(1, 0, 0, 1, 0, 0); ks.globalCompositeOperation = 'source-over'; ks.clearRect(0, 0, SW, SH); ks.fillStyle = '#000';
  paint(ks);
  ks.globalCompositeOperation = 'source-over';
}

// ── motifs ──────────────────────────────────────────────────────────────────
function sun(g, x, y, R, seed) {   // red disc cut with broken concentric rings
  g.beginPath(); raggedDisc(g, x, y, R, 5, seed); g.fill();
  cutAway(g, p => {
    const rand = seeded(seed + 1);
    for (let ring = 1; ring * 34 < R - 18; ring++) {
      const rr = ring * 34 + 6, w = 5 + ring * .5;
      let a = rand() * 2 * Math.PI; const stop = a + 2 * Math.PI - .3;
      while (a < stop) { const arc = .35 + rand() * .9; ringGroove(p, x, y, rr, a, Math.min(stop, a + arc), w); a += arc + .08 + rand() * .25; }
    }
  });
}
const hillA = x => 858 + 16 * Math.sin(.0042 * x + 1.2) - 22 * Math.exp(-(((x - MID) / 260) ** 2));
function ground(g, hill, seed, rows) {   // black earth; gouges follow the line of the hill
  const pts = [[BLK.x - 10, SH]];
  for (let x = BLK.x - 10; x <= BLK.x + BLK.w + 10; x += 24) pts.push([x, hill(x)]);
  pts.push([BLK.x + BLK.w + 10, SH]);
  g.beginPath(); hewn(g, pts, 4, seed, 24); g.fill();
  cutAway(g, p => {
    const rand = seeded(seed + 3);
    for (let row = 0; row < rows; row++) {
      for (let x = BLK.x + rand() * 80; x < BLK.x + BLK.w; x += 90 + rand() * 150) {
        const len = 50 + rand() * 140, depth = (22 + row * 19 + (rand() - .5) * 6) * (1 + row * .08);
        if (rand() < .25) continue;
        const line = [];
        for (let i = 0; i <= 6; i++) { const xx = x + len * i / 6; line.push([xx, hill(xx) + depth]); }
        groove(p, line, 3.4 - row * .25 + rand());
      }
    }
  });
}
function pine(g, x, base, h, seed, cuts = true) {   // stacked tiers with zig-zag hems, gouged shadow side
  const rand = seeded(seed), tiers = h > 160 ? 4 : 3, top = base - h, span = h * .5;
  const tier = k => ({ y0: top + h * .78 * (k / tiers) * .92, y1: top + h * .78 * ((k + 1) / tiers), w: span * (.42 + .58 * (k + 1) / tiers) });
  g.beginPath(); g.rect(x - h * .025, base - h * .22, h * .05, h * .24); g.fill();
  g.beginPath();
  for (let k = 0; k < tiers; k++) {
    const { y0, y1, w } = tier(k), hem = y1 + h * .02, teeth = 5 + k, pts = [[x, y0 - (k ? 0 : 6)], [x + w / 2, hem]];
    for (let i = 1; i < teeth; i++) pts.push([x + w / 2 - w * i / teeth, hem - (i % 2 ? 7 + rand() * 8 : 0)]);
    pts.push([x - w / 2, hem]);
    hewn(g, pts, 3, seed + k, 22);
  }
  g.fill();
  if (!cuts) return;
  cutAway(g, p => {
    for (let k = 0; k < tiers; k++) {
      const { y0, y1, w } = tier(k), n = 2 + k;
      for (let i = 1; i <= n; i++) {
        const yy = mix(y0 + 14, y1 - 6, i / (n + 1)), reach = (yy - y0) / (y1 - y0) * w / 2;
        sliver(p, x + 6, yy - 10, x + reach * (.55 + rand() * .3), yy + 4, 2 + rand() * 1.4);
      }
    }
  });
}

// the growing tree: a fixed branching skeleton, each branch drawn in over its own slice of growth time
const BRANCHES = [];
(function grow() {
  const rand = seeded(42), DUR = .2;
  const sprout = (x, y, a, len, w, depth, start) => {
    BRANCHES.push({ x, y, a, len, w, depth, start, dur: DUR });
    if (depth === 5) return;
    const tx = x + len * Math.cos(a), ty = y + len * Math.sin(a), kids = depth === 0 || rand() >= .45 ? 3 : 2;
    for (let i = 0; i < kids; i++) {
      let na = a + (i - (kids - 1) / 2) * (.52 + rand() * .22) + (rand() - .5) * .18;
      na = box(na, -Math.PI + .42 + depth * .02, -.42 - depth * .02);
      if (depth >= 3) na = mix(na, -Math.PI / 2, .12);
      const shrink = depth >= 2 ? .6 + rand() * .08 : .7 + rand() * .1;
      sprout(tx, ty, na, len * shrink, w * .62, depth + 1, start + DUR * .9);
    }
  };
  sprout(MID, 842, -Math.PI / 2, 215, 36, 0, 0);
})();
const TREE_DONE = BRANCHES.reduce((m, b) => Math.max(m, b.start + b.dur), 0);
function tree(g, growth) {
  g.beginPath();
  for (const b of BRANCHES) {
    const f = box((growth - b.start) / b.dur); if (f === 0) continue;
    const ex = b.x + b.len * f * Math.cos(b.a), ey = b.y + b.len * f * Math.sin(b.a);
    limb(g, [[b.x, b.y], [(b.x + ex) / 2 + 3 * Math.sin(3 * b.a), (b.y + ey) / 2], [ex, ey]], b.w, b.w * mix(1, .62, f));
    g.moveTo(b.x + b.w / 2, b.y); g.arc(b.x, b.y, b.w / 2, 0, 2 * Math.PI);
  }
  g.fill();
  g.beginPath();   // leaf sprays pop at the tips once a twig is complete (small, overshoot, settle)
  for (const b of BRANCHES) {
    if (b.depth < 3) continue;
    const step = Math.floor((growth - b.start - b.dur) / .06); if (step < 0) continue;
    const rand = seeded(Math.round(b.x * 7 + b.y * 13)), sc = [.6, 1.12][step] || 1;
    const ex = b.x + b.len * Math.cos(b.a), ey = b.y + b.len * Math.sin(b.a);
    for (let i = 0; i < 6; i++) { const a = b.a + (i - 2.5) * .58 + (rand() - .5) * .3, l = (24 + rand() * 16) * sc; sliver(g, ex, ey, ex + l * Math.cos(a), ey + l * Math.sin(a), 8 * sc); }
    const mx = b.x + b.len * .55 * Math.cos(b.a), my = b.y + b.len * .55 * Math.sin(b.a);
    for (let i = 0; i < 4; i++) { const a = b.a + (i & 1 ? 1 : -1) * (1.1 + rand() * .5), l = (20 + rand() * 12) * sc; sliver(g, mx, my, mx + l * Math.cos(a), my + l * Math.sin(a), 7 * sc); }
  }
  g.fill();
  if (growth >= TREE_DONE) cutAway(g, p => {   // bark grooves on the trunk
    const rand = seeded(8);
    for (let i = 0; i < 7; i++) { const x = MID - 4 + i * 2.6 + rand() * 3, y0 = 830 - rand() * 30, y1 = 660 + rand() * 40; groove(p, [[x, y0], [x + 3, (y0 + y1) / 2], [x + 1, y1]], 2.4); }
  });
}

// stag in profile, facing left; origin is the ground under its body
const turn = ([x, y], a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
// [hip, thigh vector, shank vector, gait phase, hind leg?, standing angle] — diagonal pairs move together
const LEGS = [
  [[-48, -112], [2, 50], [0, 62], Math.PI, false, .1], [[62, -118], [12, 52], [-8, 64], 0, true, -.08],
  [[-40, -112], [2, 50], [0, 62], 0, false, -.06], [[70, -118], [12, 52], [-8, 64], Math.PI, true, .07],
];
function stagShapes(phase, walking, headA) {
  const out = [], part = draw => { const p = new Path2D(); draw(p); out.push(p); };
  const bob = walking ? -4 * Math.abs(Math.sin(phase)) : 0;
  for (const [hip, thigh, shank, off, hind, rest] of LEGS) {
    const swing = walking ? Math.sin(phase + off) : 0, lift = walking ? Math.max(0, Math.cos(phase + off)) : 0;
    const a1 = walking ? swing * .36 : rest, a2 = a1 - lift * (hind ? -.35 : .55);

    p.moveTo(-58, -146 + bob);
    p.bezierCurveTo(-20, -164 + bob, 40, -166 + bob, 80, -154 + bob); p.bezierCurveTo(104, -146 + bob, 106, -108 + bob, 84, -94 + bob);
    p.bezierCurveTo(40, -84 + bob, -20, -86 + bob, -58, -94 + bob); p.bezierCurveTo(-88, -104 + bob, -90, -136 + bob, -58, -146 + bob);
    p.closePath();

  // neck and head pivot about the base of the neck
  const pivot = [-52, -138 + bob], R = ([x, y]) => { const v = turn([x - pivot[0], y + bob - pivot[1]], headA); return [pivot[0] + v[0], pivot[1] + v[1]]; };
  const outline = (p, pts) => { pts.map(R).forEach(([x, y], i) => (i ? p.lineTo(x, y) : p.moveTo(x, y))); p.closePath(); };
  part(p => outline(p, [[-78, -126], [-20, -152], [-64, -222], [-108, -230], [-106, -190]]));
  part(p => outline(p, [[-84, -236], [-98, -250], [-118, -248], [-136, -232], [-156, -214], [-156, -204], [-140, -200], [-108, -208], [-82, -218]]));
  part(p => { const [ax, ay] = R([-96, -244]), [bx, by] = R([-66, -262]); sliver(p, ax, ay, bx, by, 8); });   // ear
  for (const [dx, sc] of [[0, 1], [14, .86]]) {   // antlers, near and far: beam plus three tines
    const at = (x, y) => R([-104 + dx + (x + 104) * sc, -246 + (y + 246) * sc]);
    part(p => limb(p, [at(-104, -246), at(-100, -276), at(-86, -306), at(-64, -326)], 8, 3.5));
    part(p => limb(p, [at(-101, -272), at(-120, -290), at(-126, -310)], 6, 2.5));
    part(p => limb(p, [at(-92, -298), at(-100, -322), at(-98, -340)], 5.5, 2.5));
    part(p => limb(p, [at(-80, -312), at(-78, -336)], 5, 2));

}
function stag(g, x, y, s, phase, walking, headA) {   // a clean cut margin first, so it reads over other black
  const shapes = stagShapes(phase, walking, headA);
  g.save(); g.translate(x, y); g.scale(s, s);
  g.save(); g.globalCompositeOperation = 'destination-out'; g.lineWidth = 16; g.lineJoin = 'round'; for (const p of shapes) g.stroke(p); g.restore();
  for (const p of shapes) g.fill(p);
  cutAway(g, p => { for (let i = 0; i < 5; i++) { const yy = -132 + 8 * i; groove(p, [[-10 + 6 * i, yy], [30, yy - 3], [66 - 4 * i, yy + 2]], 3); } });   // flank
  g.restore();
}
const WING = [{ tip: -20, mid: -5 }, { tip: -3, mid: 0 }, { tip: 13, mid: 3 }];   // up, level, down
const FLAP = [0, 1, 2, 1];
function bird(p, x, y, s, pose) {
  const { tip, mid } = WING[pose], P = (dx, dy) => [x + dx * s, y + dy * s];
  p.moveTo(...P(-30, tip));
  p.quadraticCurveTo(...P(-14, mid - 6), ...P(0, 2)); p.quadraticCurveTo(...P(14, mid - 6), ...P(30, tip));
  p.quadraticCurveTo(...P(14, mid + 2), ...P(2, 9)); p.lineTo(...P(-2, 9)); p.quadraticCurveTo(...P(-14, mid + 2), ...P(-30, tip));
  p.closePath();
}
function carvedWord(g, hit, text, x, y, size, spacing, seed) {   // block letters with V-gouge marks in the face
  onScratch(s => {
    s.font = `400 ${size}px ${TYPE}`; s.textAlign = 'center'; s.textBaseline = 'alphabetic'; s.letterSpacing = spacing;
    s.fillText(text, x, y);
    const tw = s.measureText(text).width; s.letterSpacing = '0px';
    const rand = seeded(seed), k = size / 212;
    s.globalCompositeOperation = 'destination-out'; s.beginPath();
    for (let i = 0; i < 8; i++) { const yy = y - (16 + 11 * i) * k, x0 = x + tw * (.02 + rand() * .34), len = (70 + rand() * 150) * k; sliver(s, x0, yy + 3 * k, x0 + len, yy - 5 * k, (1.6 + rand() * 1.4) * k); }
    for (let i = 0; i < 5; i++) { const yy = y - (140 - 10 * i) * k, x0 = x - tw * (.46 - rand() * .3); sliver(s, x0, yy, x0 + (50 + rand() * 70) * k, yy - 3 * k, 1.4 * k); }
    s.fill();
  });
  pressed(g, hit, x, y - size * .35, d => d.drawImage(SCRATCH_CV, 0, 0));
}

// ── sheet A: the forest ─────────────────────────────────────────────────────
const RED_PINES = [[170, 300], [380, 340], [590, 280], [800, 250], [1130, 260], [1340, 320], [1600, 360], [1810, 300]];
const PINES = [[690, 430], [480, 500], [1520, 470], [270, 400], [1730, 520]].map(([x, h], i) => ({ x, h, t0: T.pines[i] }));
const BIRDS = [];
for (let i = 0; i < 7; i++) {
  const rand = seeded(300 + i);
  BIRDS.push({ x: 860 + rand() * 200, y: 330 + rand() * 110, vx: (i & 1 ? 1 : -1) * (40 + rand() * 170), vy: -(250 + rand() * 140), t0: T.birds + .07 * i, ph: i });
}
function forestPrint(tq) {
  let hit;
  if ((hit = impact(tq, T.sun))) pressed(kr, hit, MID, 460, g => sun(g, MID, 460, 270, 11));
  if ((hit = impact(tq, T.reds))) pressed(kr, hit, MID, 700, g => RED_PINES.forEach(([x, h], i) => pine(g, x, hillA(x) - 24, h, 60 + i)));
  if ((hit = impact(tq, T.ground))) pressed(kb, hit, MID, 950, g => {
    ground(g, hillA, 21, 7);
    splinters(g, 3, 30, r => [BLK.x + 30 + r() * (BLK.w - 60), BLK.y + 20 + r() * 200]);
  });
  if (tq >= T.grow0) tree(kb, ramp(tq, T.grow0, T.grow1) * (TREE_DONE + .2));
  for (const p of PINES) if ((hit = impact(tq, p.t0))) pressed(kb, hit, p.x, hillA(p.x) - p.h / 2, g => pine(g, p.x, hillA(p.x) + 6, p.h, p.x));
  if (tq >= T.walk0) {   // the stag walks out of the right-hand trees, stops, raises its head
    const u = ramp(tq, T.walk0, T.walk1), x = mix(1640, 1290, u);
    stag(kb, x, hillA(x) + 2, 1, (tq - T.walk0) * 2 * Math.PI * 2.3, u < 1, .2 * easeOut(ramp(tq, T.head, T.head + .25)));
  }
  kb.beginPath();
  for (const b of BIRDS) {
    if (tq < b.t0) continue;
    const d = tq - b.t0;
    bird(kb, b.x + b.vx * d, b.y + b.vy * d - 60 * d * d, 1.35 + .5 * d, FLAP[(Math.round(tq * 12) + b.ph) % 4]);
  }
  kb.fill();
}

// ── sheet B: the poster ─────────────────────────────────────────────────────
const hillB = x => 918 + 10 * Math.sin(.006 * x + .5) - 14 * Math.exp(-(((x - 1420) / 180) ** 2));
const POSTER_PINES = [];
for (let x = 130, rand = seeded(77); x < 1800; x += 64 + rand() * 50) POSTER_PINES.push([x, Math.abs(x - MID) < 200 ? 50 + rand() * 34 : 90 + rand() * 80]);
const FLOCK = [[1640, 190, .7], [1710, 140, .55], [1770, 200, .6], [1590, 125, .48], [1740, 250, .45]];
const ROW3 = { grow: 300, wild: 300 };   // offsets from centre for the "GROW  WILD" line
function layoutRow3() {
  ks.font = `400 190px ${TYPE}`; ks.letterSpacing = '6px';
  const a = ks.measureText('GROW').width, b = ks.measureText('WILD').width, total = a + 70 + b;
  ks.letterSpacing = '0px';
  ROW3.grow = (total - a) / 2; ROW3.wild = (total - b) / 2;
}
function rule(g, x0, x1, y, seed) { hewn(g, [[x0, y], [x1, y], [x1, y + 14], [x0, y + 14]], 3, seed); }
function posterPrint(tq) {
  sun(kr, MID, 930, 175, 31);
  POSTER_PINES.forEach(([x, h], i) => pine(kb, x, hillB(x) + 6, h, 200 + i, h > 120));
  ground(kb, hillB, 41, 4);
  stag(kb, 1420, hillB(1420) + 2, .6, 0, false, .2);
  splinters(kb, 8, 24, r => [r() < .5 ? BLK.x + 20 + r() * 150 : BLK.x + BLK.w - 170 + r() * 150, BLK.y + 30 + r() * 560]);
  const [w0, w1, w2, w3] = T.words;
  let hit;
  if ((hit = impact(tq, w0))) pressed(kr, hit, MID, 200, g => {
    carvedWord(g, REST, 'LET THE', MID, 214, 112, '18px', 51);
    g.beginPath(); rule(g, MID - 560, MID - 330, 164, 5); rule(g, MID + 330, MID + 560, 164, 6); g.fill();
  });
  if ((hit = impact(tq, w1))) carvedWord(kb, hit, 'FOREST', MID, 478, 290, '10px', 52);
  if ((hit = impact(tq, w2))) carvedWord(kb, hit, 'GROW', MID - ROW3.grow, 700, 190, '6px', 53);
  if ((hit = impact(tq, w3))) carvedWord(kr, hit === REST ? hit : { ...hit, s: hit.s + .04 }, 'WILD', MID + ROW3.wild, 700, 190, '6px', 54);
  if ((hit = impact(tq, T.flock))) pressed(kb, hit, 1600, 220, g => { g.beginPath(); FLOCK.forEach(([x, y, s], i) => bird(g, x, y, 1.5 * s, FLAP[i % 4])); g.fill(); });
}
function pencilMarks(g, t) {   // edition number and title in graphite under the plate mark
  const u = ramp(t, T.pencil0, T.pencil1); if (u === 0) return;
  const y = BLK.y + BLK.h + 42, left = BLK.x + 8, right = BLK.x + BLK.w - 8;
  g.save();
  g.beginPath(); g.rect(0, y - 40, left + 150 * box(3 * u), 60); g.rect(right - 420 * box(1.4 * u - .4), y - 40, 420, 60); g.clip();
  g.font = `400 26px ${TYPE}`; g.textBaseline = 'alphabetic'; g.fillStyle = 'rgba(70,64,58,.62)';
  g.textAlign = 'left'; g.fillText('7 / 50', left, y);
  g.textAlign = 'right'; g.fillText('Let the forest grow wild', right, y);
  g.restore();
}

// ── pulling a print ─────────────────────────────────────────────────────────
// tint a cut layer with ink colour through a grain mask and lay it on the sheet (multiply)
function inkUp(dest, layer, colour, maskNo, ox, oy) {
  const g = layer.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(INK_MASKS[maskNo], maskNo & 1 ? -7 : 0, 0, SW + 7, SH);
  g.globalCompositeOperation = 'source-atop'; g.fillStyle = colour; g.fillRect(0, 0, SW, SH);
  g.globalCompositeOperation = 'source-over';
  dest.save(); dest.globalCompositeOperation = 'multiply'; dest.drawImage(layer, ox, oy); dest.restore();
}
function pull(dest, design, tq, grain) {
  for (const g of [kb, kr]) {
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, SW, SH);
    g.save(); g.beginPath(); g.rect(BLK.x, BLK.y, BLK.w, BLK.h); g.clip(); g.fillStyle = '#000';
  }
  design(tq);
  kb.restore(); kr.restore();
  dest.drawImage(PAPER_CV, 0, 0);
  inkUp(dest, RED_CV, PAL.red, grain, 4, -3);            // the red block sits a touch off register
  inkUp(dest, BLACK_CV, PAL.black, (grain + 1) % 4, 0, 0);
}
const SHEET_A = sheet(), SHEET_B = sheet(), ga = SHEET_A.getContext('2d'), gb = SHEET_B.getContext('2d');

// faint lighter bands the roller leaves in fresh ink
const STREAKS = (() => {
  const rand = seeded(3), out = [];
  for (let i = 0; i < 26; i++) out.push({ y: BLK.y + rand() * BLK.h, h: 2 + rand() * 7, x: BLK.x + rand() * BLK.w * .6, w: 200 + rand() * 900, a: .05 + rand() * .1 });
  return out;
})();
function inkCoat(g, edge, grain) {   // black ink behind the brayer: wavy leading edge, roller streaks
  onScratch(s => {
    s.save();
    s.beginPath(); s.rect(BLK.x - 6, BLK.y - 6, BLK.w + 12, BLK.h + 12); s.clip();
    const wob = seeded(7);
    s.beginPath(); s.moveTo(0, 0);
    for (let y = 0; y <= SH; y += 18) s.lineTo(edge + 10 * Math.sin(.045 * y) + (wob() - .5) * 8, y);
    s.lineTo(0, SH); s.closePath(); s.fill(); s.clip();
    s.globalCompositeOperation = 'destination-out';
    for (const k of STREAKS) {
      const lg = s.createLinearGradient(k.x, 0, k.x + k.w, 0), on = `rgba(0,0,0,${k.a})`;
      lg.addColorStop(0, 'rgba(0,0,0,0)'); lg.addColorStop(.3, on); lg.addColorStop(.7, on); lg.addColorStop(1, 'rgba(0,0,0,0)');
      s.fillStyle = lg; s.fillRect(k.x, k.y, k.w, k.h);
    }
    s.restore();
    s.globalCompositeOperation = 'destination-in'; s.drawImage(INK_MASKS[grain], 0, 0);
    s.globalCompositeOperation = 'source-atop'; s.fillStyle = PAL.black; s.fillRect(0, 0, SW, SH);
  });
  g.save(); g.globalCompositeOperation = 'multiply';
  g.drawImage(SCRATCH_CV, 0, 0); g.drawImage(SCRATCH_CV, 0, 0);   // two passes so the coat is dense
  g.restore();
}
function brayer(g, x) {   // seen from above: inked rubber roller, steel frame, wooden handle trailing left
  const top = BLK.y - 34, bot = BLK.y + BLK.h + 34, rw = 64, hx = x - 470, cx = x + rw / 2;
  g.save();
  g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 30; g.shadowOffsetX = 14; g.shadowOffsetY = 10;
  g.strokeStyle = '#8d8a84'; g.lineWidth = 12; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(cx, top - 12); g.lineTo(cx, top - 26); g.lineTo(hx + 40, SH / 2 - 16);
  g.moveTo(cx, bot + 12); g.lineTo(cx, bot + 26); g.lineTo(hx + 40, SH / 2 + 16);
  g.stroke();
  const wood = g.createLinearGradient(0, 514, 0, 566);
  wood.addColorStop(0, '#b98a57'); wood.addColorStop(.5, '#8a5f36'); wood.addColorStop(1, '#5b3c20');
  g.fillStyle = wood; g.beginPath(); g.roundRect(hx - 330, 516, 380, 48, 22); g.fill();
  const rubber = g.createLinearGradient(x, 0, x + rw, 0);
  rubber.addColorStop(0, '#0d0b0a'); rubber.addColorStop(.28, '#3a3531'); rubber.addColorStop(.42, '#1a1715'); rubber.addColorStop(1, '#070606');
  g.fillStyle = rubber; g.beginPath(); g.roundRect(x, top - 12, rw, bot - top + 24, 14); g.fill();
  g.shadowColor = 'transparent';
  g.fillStyle = '#6c6963'; g.fillRect(cx - 9, top - 22, 18, 12); g.fillRect(cx - 9, bot + 10, 18, 12);
  g.restore();
}

// Turn a sheet back along a straight crease through (px, py) at angle `ang`.
// `flat` is what is still lying down (kept on the side the normal points to); `under` shows where
// it has lifted; the flap is the mirror image of the lifted part, showing the paper's back.
function crease(under, flat, px, py, ang, backTint) {
  const dx = Math.cos(ang), dy = Math.sin(ang), nx = dy, ny = -dx, far = 4000;
  const c2 = Math.cos(2 * ang), s2 = Math.sin(2 * ang);
  screen.drawImage(under, 0, 0);
  screen.save();
  screen.beginPath();
  screen.moveTo(px - dx * far, py - dy * far); screen.lineTo(px + dx * far, py + dy * far);
  screen.lineTo(px + (dx + nx) * far, py + (dy + ny) * far); screen.lineTo(px + (nx - dx) * far, py + (ny - dy) * far);
  screen.closePath(); screen.clip();
  screen.drawImage(flat, 0, 0);
  screen.save();   // the flap: everything reflected across the crease
  screen.translate(px, py); screen.transform(c2, s2, s2, -c2, 0, 0); screen.translate(-px, -py);
  screen.beginPath(); screen.rect(0, 0, SW, SH);
  screen.shadowColor = 'rgba(0,0,0,.5)'; screen.shadowBlur = 50; screen.fillStyle = '#e2d7bf'; screen.fill();
  screen.shadowColor = 'transparent'; screen.clip();
  screen.drawImage(PAPER_CV, 0, 0); screen.fillStyle = backTint; screen.fillRect(0, 0, SW, SH);
  screen.restore();
  const curl = screen.createLinearGradient(px, py, px + nx * 160, py + ny * 160);
  curl.addColorStop(0, 'rgba(255,255,255,0)'); curl.addColorStop(.3, 'rgba(255,255,255,.3)'); curl.addColorStop(1, 'rgba(60,40,20,.12)');
  screen.fillStyle = curl; screen.fillRect(0, 0, SW, SH);
  screen.restore();
}

// what is under sheet B: dark worktable and the inked block, a mirror image of the print
const BLOCK_CV = sheet(), gk = BLOCK_CV.getContext('2d');
let blockGrain = -1;
function paintBlock() {
  gk.setTransform(1, 0, 0, 1, 0, 0); gk.globalCompositeOperation = 'source-over';
  gk.fillStyle = '#2b221c'; gk.fillRect(0, 0, SW, SH);
  gk.save();
  gk.beginPath(); gk.rect(BLK.x, BLK.y, BLK.w, BLK.h); gk.clip();
  gk.setTransform(-1, 0, 0, 1, SW, 0); gk.drawImage(SHEET_B, 0, 0); gk.setTransform(1, 0, 0, 1, 0, 0);
  gk.globalCompositeOperation = 'multiply'; gk.fillStyle = '#76634f'; gk.fillRect(0, 0, SW, SH);
  gk.globalCompositeOperation = 'source-over';
  const sheen = gk.createLinearGradient(0, 0, SW, SH);
  sheen.addColorStop(0, 'rgba(255,255,255,.08)'); sheen.addColorStop(1, 'rgba(0,0,0,.22)');
  gk.fillStyle = sheen; gk.fillRect(0, 0, SW, SH);
  gk.restore();
  gk.strokeStyle = 'rgba(0,0,0,.5)'; gk.lineWidth = 6; gk.strokeRect(BLK.x - 3, BLK.y - 3, BLK.w + 6, BLK.h + 6);
}

// ── one frame ───────────────────────────────────────────────────────────────
function frame(t) {
  const tq = held(t), grain = Math.floor(t * 8) % 4;
  screen.setTransform(1, 0, 0, 1, 0, 0); screen.globalCompositeOperation = 'source-over'; screen.globalAlpha = 1;
  const roll = easeIO(ramp(t, T.roll0, T.roll1)), peel = easeIO(ramp(t, T.peel0, T.peel1)), lift = easeIO(ramp(t, T.lift0, T.lift1));
  if (t < T.peel0) {                       // sheet A, then the brayer inks over it
    pull(screen, forestPrint, Math.min(tq, T.roll0), grain);
    if (roll > 0) { const bx = mix(BLK.x - 80, SW + 540, roll); inkCoat(screen, bx, grain); brayer(screen, bx); }
  } else if (peel < 1) {                   // inked sheet A peels up and away from sheet B
    pull(ga, forestPrint, T.roll0, grain); inkCoat(ga, SW + 80, grain);
    pull(gb, posterPrint, tq, grain); pencilMarks(gb, t);
    crease(SHEET_B, SHEET_A, MID, mix(SH + 240, -380, peel), .1, 'rgba(90,70,40,.1)');
  } else {
    pull(gb, posterPrint, tq, grain); pencilMarks(gb, t);
    if (lift === 0) screen.drawImage(SHEET_B, 0, 0);
    else {                                 // bottom-right corner lifts off the block
      if (blockGrain !== grain) { paintBlock(); blockGrain = grain; }
      const d = 820 * lift;
      crease(BLOCK_CV, SHEET_B, SW - .78 * d, SH - .62 * d, .12 - Math.PI / 4, 'rgba(90,70,40,.12)');
    }
  }
  const shown = Math.min(easeOut(ramp(t, 0, .3)), 1 - easeIO(ramp(t, T.fade0, 10)));
  if (shown < 1) { screen.fillStyle = `rgba(${PAL.fade},${1 - shown})`; screen.fillRect(0, 0, SW, SH); }
}

// ── sound cues (events.mjs → events.json → audio.py) ────────────────────────
window.events = () => {
  const cues = [], thump = (t, v = 1, f = 100) => cues.push({ k: 'thump', t, v, f });
  thump(T.sun, .9, 90); thump(T.ground, .9, 80); thump(T.reds, .8, 110);
  for (let t = T.grow0; t < T.grow1; t += 1 / 12) cues.push({ k: 'creak', t, v: .5 + .5 * ramp(t, T.grow0, T.grow1) });
  cues.push({ k: 'rustle', t: T.grow1 - .1, d: .5 });
  T.pines.forEach((t, i) => thump(t, .8, 95 + 8 * i));
  for (let t = T.walk0; t < T.walk1; t += .23) cues.push({ k: 'hoof', t });
  for (const b of BIRDS) cues.push({ k: 'flutter', t: b.t0, d: .7 });
  cues.push({ k: 'roll', t: T.roll0, d: T.roll1 - T.roll0 });
  cues.push({ k: 'peel', t: T.peel0, d: T.peel1 - T.peel0 });
  T.words.forEach((t, i) => thump(t, i === 1 ? 1.15 : 1, [110, 80, 95, 88][i]));
  thump(T.flock, .55, 150);
  cues.push({ k: 'pencil', t: T.pencil0, d: T.pencil1 - T.pencil0 });
  cues.push({ k: 'tone', t: T.words[3] + .05 });
  cues.push({ k: 'peel', t: T.lift0, d: T.lift1 - T.lift0, v: .6 });
  return cues;
};

window.ready = (async () => {
  await document.fonts.load(`400 200px ${TYPE}`, 'LET THE FOREST GROW WILD 7/50 Let the forest grow wild');
  await document.fonts.ready;
  makePaper();
  for (let v = 0; v < 4; v++) INK_MASKS.push(makeInkMask(v));
  layoutRow3();
  frame(0);
})();
window.draw = ({ t, q = 0.92 }) => {
  frame(t);
  return screen.canvas.toDataURL('image/jpeg', q).split(',')[1];
};
</script>
</body>
