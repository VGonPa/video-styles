<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ukiyo-e</title>
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #14151c; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* Ukiyo-e, 10 s: two woodblock prints from an invented series, "The Floating World".
 *
 *   Print one, "The Wave": the sheet is printed in four impressions (key block, pale wash, blues, red).
 *     A sailboat rides the swell under a red sun; the foreground swell draws back, rears up into a
 *     clawed wave, hangs, then falls across the sheet.
 *   The falling wave is the scene change: everything behind its back is already
 *   Print two, "The Calm": a snow-capped mountain, cranes over the sun, a quiet sea. The title is set
 *     a line at a time and the publisher's seal is stamped; the sheet then fades back to bare washi.
 *
 * Like a real print the picture is built from separate blocks: colour is painted on one canvas and
 * the key lines on another, and the two are laid on the paper slightly out of register. Paper fibres
 * and ink grain are made once and stay still. Every frame depends on t alone. */
'use strict';
const W = 1920, H = 1080;
const FX = 44, FY = 44, FR = W - 44, FB = H - 44;            // the printed image inside the sheet margin
const TAU = Math.PI * 2, RAD = Math.PI / 180;
const TITLE = '"Zen Antique"', CAPS = '"Cormorant SC"';

const T = {
  key: .10, pale: .34, blue: .58, red: .82,                  // the four impressions of the first print
  dip0: 1.7, dip1: 2.15, rise0: 2.1, rise1: 3.4,             // the swell draws back, then rears up
  lunge0: 3.7, lunge1: 4.9,                                  // the wave falls across the sheet
  the: 5.5, world: 6.2, sub: 7.05, seal: 7.8,                // title lines, then the seal
  fade0: 9.4, end: 10,
};

// ── small maths ──────────────────────────────────────────────────────────────
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const smooth = k => k * k * (3 - 2 * k);
const easeOut = k => 1 - (1 - k) ** 3;
const back = (k, s = 1.7) => 1 + (s + 1) * (k - 1) ** 3 + s * (k - 1) ** 2;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let v = Math.imul(a ^ (a >>> 15), 1 | a);
    v = (v + Math.imul(v ^ (v >>> 7), 61 | v)) ^ v;
    return ((v ^ (v >>> 14)) >>> 0) / 4294967296;
  };
}

// ── canvases: colour blocks (C), key block (K), and the sheet they are printed on ──
const X = document.getElementById('c').getContext('2d');
const sheet = () => Object.assign(document.createElement('canvas'), { width: W, height: H });
const CV = sheet(), KV = sheet(), C = CV.getContext('2d'), K = KV.getContext('2d');
const both = f => { f(C); f(K); };
let PAPER, GRAIN;

function makePaper() {
  const c = sheet(), g = c.getContext('2d'), im = g.createImageData(W, H), d = im.data, r = rng(7);
  const field = (gw, gh) => {
    const v = new Float32Array(gw * gh).map(() => r());
    return (x, y) => {
      const fx = x / W * (gw - 1), fy = y / H * (gh - 1), ix = Math.min(gw - 2, fx | 0), iy = Math.min(gh - 2, fy | 0);
      const ux = fx - ix, uy = fy - iy, i = iy * gw + ix;
      return lerp(lerp(v[i], v[i + 1], ux), lerp(v[i + gw], v[i + gw + 1], ux), uy) - .5;
    };
  };
  const cloud = field(30, 18), mottle = field(150, 86);
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
    const v = 1 + .05 * cloud(x, y) + .035 * mottle(x, y) + .03 * (r() - .5);
    d[i] = 244 * v; d[i + 1] = 234 * v; d[i + 2] = 213 * v; d[i + 3] = 255;
  }
  g.putImageData(im, 0, 0);
  for (let i = 0; i < 2400; i++) {                           // kozo fibres, pale and dark
    const x = r() * W, y = r() * H, len = 12 + 80 * r() * r(), a = r() * Math.PI, bend = (r() - .5) * len * .5;
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    g.strokeStyle = r() < .45 ? `rgba(255,252,240,${.22 + .3 * r()})` : `rgba(140,112,70,${.06 + .13 * r()})`;
    g.lineWidth = .6 + 1.2 * r();
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo((x + ex) / 2 - Math.sin(a) * bend, (y + ey) / 2 + Math.cos(a) * bend, ex, ey); g.stroke();
  }
  const tone = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, W * .62);
  tone.addColorStop(0, 'rgba(120,88,40,0)'); tone.addColorStop(1, 'rgba(120,88,40,.2)');
  g.fillStyle = tone; g.fillRect(0, 0, W, H);
  return c;
}

// Screened over the print: lightens ink only, so bare paper stays bare. Speckle is paper tooth,
// the long streaks are the grain of the block showing through thin ink.
function makeGrain() {
  const c = sheet(), g = c.getContext('2d'), r = rng(41);
  const s = Object.assign(document.createElement('canvas'), { width: W / 2, height: H / 2 }), sg = s.getContext('2d');
  const im = sg.createImageData(W / 2, H / 2), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const a = r(), v = a > .978 ? 40 + 80 * r() : a > .6 ? 20 * r() : 5 * r();
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  sg.putImageData(im, 0, 0);
  g.drawImage(s, 0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 170; i++) {
    const y0 = r() * H, amp = 5 + 20 * r(), lam = 520 + 900 * r(), ph = r() * TAU, tilt = (r() - .5) * .03;
    g.strokeStyle = `rgba(255,255,255,${.018 + .034 * r()})`; g.lineWidth = 1 + 5 * r();
    g.beginPath();
    for (let x = -24; x <= W + 24; x += 24) {
      const y = y0 + amp * Math.sin(x / lam * TAU + ph) + x * tilt;
      if (x < 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  return c;
}

// ── inks. Each belongs to one impression; before that block is printed it reads as bare paper ──
const KEY = 'rgb(27,29,46)';
const INKS = {
  sumi: [27, 29, 46, 'key'],
  deep: [21, 47, 98, 'blue'], prus: [30, 66, 126, 'blue'], blue: [54, 98, 158, 'blue'],
  mid: [100, 142, 190, 'blue'], lite: [154, 186, 213, 'blue'], pale: [203, 219, 227, 'blue'],
  pink: [238, 158, 130, 'pale'], peach: [246, 210, 180, 'pale'], ochre: [229, 186, 100, 'pale'],
  wood: [184, 130, 78, 'pale'], bark: [124, 82, 52, 'pale'],
  red: [198, 54, 40, 'red'],
};
let stage = { key: 1, pale: 1, blue: 1, red: 1 };
function ink(name, alpha = 1) {
  const v = INKS[name], s = stage[v[3]];
  const r = Math.round(lerp(255, v[0], s)), g = Math.round(lerp(255, v[1], s)), b = Math.round(lerp(255, v[2], s));
  return alpha >= 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${alpha})`;
}

// ── drawing primitives ───────────────────────────────────────────────────────
const bz = (a, b, c, d, u) => {
  const v = 1 - u, k0 = v * v * v, k1 = 3 * v * v * u, k2 = 3 * v * u * u, k3 = u * u * u;
  return [k0 * a[0] + k1 * b[0] + k2 * c[0] + k3 * d[0], k0 * a[1] + k1 * b[1] + k2 * c[1] + k3 * d[1]];
};
const quad = (a, c, b, u) => { const v = 1 - u; return [v * v * a[0] + 2 * v * u * c[0] + u * u * b[0], v * v * a[1] + 2 * v * u * c[1] + u * u * b[1]]; };
const mixP = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
function curve(out, a, b, c, d, n) { for (let i = out.length ? 1 : 0; i <= n; i++) out.push(bz(a, b, c, d, i / n)); return out; }
function pathOf(pts, close) {
  const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]);
  if (close) p.closePath();
  return p;
}
function measure(pts) { const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1])); return cum; }
function along(pts, cum, s) {
  let i = 1; while (i < pts.length - 1 && cum[i] < s) i++;
  const a = pts[i - 1], b = pts[i], seg = cum[i] - cum[i - 1] || 1, u = clamp((s - cum[i - 1]) / seg);
  return { p: mixP(a, b, u), t: [(b[0] - a[0]) / seg, (b[1] - a[1]) / seg] };
}
function cutK(p) { K.globalCompositeOperation = 'destination-out'; K.fillStyle = '#000'; K.fill(p); K.globalCompositeOperation = 'source-over'; }
function lineK(p, w) { K.strokeStyle = KEY; K.lineWidth = w; K.lineJoin = K.lineCap = 'round'; K.stroke(p); }
// An opaque printed shape: colour on the colour block, hides the key lines behind it, optional outline.
function solid(p, fill, w = 0) { C.fillStyle = fill; C.fill(p); cutK(p); if (w) lineK(p, w); }
// A carved line that swells in the middle and thins toward its ends.
function brush(pts, w, t0 = .2, t1 = .2) {
  const cum = measure(pts), total = cum[cum.length - 1] || 1, L = [], Rr = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const m = Math.hypot(tx, ty) || 1; tx /= m; ty /= m;
    const s = cum[i] / total, k = Math.min(1, t0 ? s / t0 : 1, t1 ? (1 - s) / t1 : 1), hw = w * .5 * (.2 + .8 * Math.sqrt(k));
    L.push([pts[i][0] - ty * hw, pts[i][1] + tx * hw]); Rr.push([pts[i][0] + ty * hw, pts[i][1] - tx * hw]);
  }
  K.fillStyle = KEY; K.fill(pathOf(L.concat(Rr.reverse()), true));
}
// Foam fingers: a row of hooked claws standing off a path, each leaning the way the path runs.
function claws(pts, o) {
  const cum = measure(pts), L = cum[cum.length - 1] / o.n, out = [];
  for (let k = 0; k < o.n; k++) {
    const A = along(pts, cum, k * L).p, B = along(pts, cum, (k + 1) * L).p, m = along(pts, cum, (k + .5) * L);
    const tx = m.t[0], ty = m.t[1], nx = -ty * o.side, ny = tx * o.side;
    const h = o.h((k + .5) / o.n) * (.78 + .44 * hash(o.seed * 13.7 + k * 5.1)), fw = o.hook * h;
    const tip = [m.p[0] + nx * h + tx * fw, m.p[1] + ny * h + ty * fw];
    const c1 = [A[0] + nx * h * .95 + tx * L * .2, A[1] + ny * h * .95 + ty * L * .2];
    const c2 = [m.p[0] + nx * h * .3 + tx * (fw * .8 + L * .12), m.p[1] + ny * h * .3 + ty * (fw * .8 + L * .12)];
    for (let i = k ? 1 : 0; i <= 6; i++) out.push(quad(A, c1, tip, i / 6));
    for (let i = 1; i <= 6; i++) out.push(quad(tip, c2, B, i / 6));
  }
  return out;
}

// Froth: a run of round bumps standing off a path.
function scallops(pts, n, hf, side) {
  const cum = measure(pts), L = cum[cum.length - 1] / n, out = [];
  for (let k = 0; k < n; k++) {
    const A = along(pts, cum, k * L).p, B = along(pts, cum, (k + 1) * L).p, m = along(pts, cum, (k + .5) * L), hgt = hf((k + .5) / n, k) * 2 * side;
    const c = [m.p[0] - m.t[1] * hgt, m.p[1] + m.t[0] * hgt];
    for (let i = k ? 1 : 0; i <= 6; i++) out.push(quad(A, c, B, i / 6));
  }
  return out;
}

// ── sky, sun, mist ───────────────────────────────────────────────────────────
function sky(horizon) {
  let g = C.createLinearGradient(0, horizon - 310, 0, horizon);                  // warm wash rising off the horizon
  g.addColorStop(0, ink('pink', 0)); g.addColorStop(.7, ink('pink', .5)); g.addColorStop(1, ink('pink', .82));
  C.fillStyle = g; C.fillRect(FX, horizon - 310, FR - FX, 310);
  g = C.createLinearGradient(0, FY, 0, FY + 215);                                // bokashi: blue wiped along the top of the block
  g.addColorStop(0, ink('prus', .9)); g.addColorStop(.3, ink('blue', .58)); g.addColorStop(1, ink('blue', 0));
  C.fillStyle = g; C.fillRect(FX, FY, FR - FX, 215);
}
function disc(x, y, r, fill) { const p = new Path2D(); p.arc(x, y, r, 0, TAU); solid(p, fill); }
function mist(x, y, w, h) {                                                      // stepped bands of unprinted paper
  const p = new Path2D();
  p.roundRect(x, y, w, h, h / 2);
  p.roundRect(x + w * .2, y - h * .74, w * .46, h, h / 2);
  p.roundRect(x + w * .42, y + h * .74, w * .54, h, h / 2);
  solid(p, '#fff');
}

// ── the sea: rows of cusped swells leaning the way they travel ───────────────
function swellLine(y0, amp, lam, shift, seed, xa = FX - 70, xb = FR + 70) {
  const pts = [], peaks = [];
  for (let k = Math.floor((xa - shift) / lam + 1e-6); ; k++) {
    const xs = k * lam + shift; if (xs > xb) break;
    const a = amp * (.55 + .9 * hash(k * 7.3 + seed)), lean = .6 + .12 * hash(k * 3.1 + seed + 5), px = xs + lean * lam, py = y0 - a;
    curve(pts, [xs, y0], [xs + .3 * lam, y0 + .05 * a], [xs + (lean - .15) * lam, y0 - .3 * a], [px, py], 12);
    peaks.push({ x: px, y: py, a, k, i: pts.length - 1 });
    curve(pts, [px, py], [px + .04 * lam, y0 - .45 * a], [lerp(px, xs + lam, .5), y0 + .05 * a], [xs + lam, y0], 10);
  }
  return { pts, peaks, y0 };
}
function yAt(pts, x) {
  let i = 1; while (i < pts.length - 1 && pts[i][0] < x) i++;
  const a = pts[i - 1], b = pts[i];
  return lerp(a[1], b[1], clamp((x - a[0]) / ((b[0] - a[0]) || 1)));
}
function foamCap(line, pk, lw) {
  const pts = line.pts, a = pk.a; let i0 = pk.i, i1 = pk.i;
  while (i0 > 0 && pts[i0][1] < pk.y + a * .52) i0--;
  while (i1 < pts.length - 1 && pts[i1][1] < pk.y + a * .44) i1++;
  const under = []; for (let i = 0; i <= 14; i++) under.push(quad(pts[i0], [pk.x + a * .22, pk.y + a * .8], pts[i1], i / 14));
  const cl = claws(under, { n: Math.max(3, Math.round(a / 12)), h: f => a * .3 * (.55 + .7 * f), hook: .7, side: 1, seed: pk.k });
  C.fillStyle = '#fff'; C.fill(pathOf(pts.slice(i0, i1 + 1).concat(cl.slice().reverse()), true));
  lineK(pathOf(cl), lw);
}
// Light striations under the crest line and foam caps on the taller crests.
function dress(line, o) {
  for (const s of o.stripes || []) {
    const lead = i => (o.taper ? smooth(ramp(i, 0, o.taper)) : 1);
    const up = line.pts.map(([x, y], i) => [x, line.y0 + s.d - s.f * (line.y0 - y) * lead(i)]);
    const dn = line.pts.map(([x, y], i) => [x, line.y0 + s.d + (s.w - s.f * .6 * (line.y0 - y)) * lead(i)]).reverse();
    C.fillStyle = ink(s.col); C.fill(pathOf(up.concat(dn), true));
  }
  if (o.foam) for (const pk of line.peaks) if (pk.a > o.foam) foamCap(line, pk, o.lw * .8);
  lineK(pathOf(line.pts), o.lw);
}
function row(line, o) {
  const p = line.pts, body = pathOf(p.concat([[p[p.length - 1][0], FB + 90], [p[0][0], FB + 90]]), true);
  solid(body, ink(o.col));
  dress(line, o);
}

// ── the great wave ───────────────────────────────────────────────────────────
// A hollow of radius R round the eye (kx, ky). The face follows the hollow from the trough (a = 0°),
// up its left side and over the top (a = 180°) to the lip at aEnd; the back runs outside it, T thick
// at the shoulder and thinning to nothing at the lip, and falls away to the left as a long slope.
function waveGeo(p) {
  const aJ = Math.min(112, p.aEnd - 34), aS = 6, n1 = 36, n2 = 64;
  const pol = (r, a) => { const f = (-90 - a) * RAD; return [p.kx + r * Math.cos(f), p.ky - r * Math.sin(f)]; };
  const rf = a => p.R * (a <= 180 ? 1 : 1 - .34 * (a - 180) / 90);
  const th = a => p.T * Math.pow(clamp((p.aEnd - a) / (p.aEnd - aJ)), .8);
  const J = pol(rf(aJ) + th(aJ), aJ), J2 = pol(rf(aJ + 1.5) + th(aJ + 1.5), aJ + 1.5);
  let dx = J2[0] - J[0], dy = J2[1] - J[1]; const dm = Math.hypot(dx, dy); dx /= dm; dy /= dm;
  const BL = [p.blx, p.bly], d = Math.hypot(J[0] - BL[0], J[1] - BL[1]);
  const P1 = [BL[0] + d * .5, BL[1] - d * .02], P2 = [J[0] - dx * d * .42, J[1] - dy * d * .42];
  const F = [], B = [], A = [];
  for (let i = 0; i <= n1; i++) { const u = i / n1; A.push(lerp(aS, aJ, u)); F.push(pol(p.R, A[i])); B.push(bz(BL, P1, P2, J, u)); }
  for (let i = 1; i <= n2; i++) { const a = lerp(aJ, p.aEnd, i / n2); A.push(a); F.push(pol(rf(a), a)); B.push(pol(rf(a) + th(a), a)); }
  return { F, B, A, aJ, pol, rf, th, trough: pol(p.R, 0) };
}
function heroPose(t) {
  const dip = smooth(ramp(t, T.dip0, T.dip1)) * (1 - smooth(ramp(t, T.rise0 + .1, T.rise0 + .55)));
  const up = ramp(t, T.rise0, T.rise1);
  let g = .12 + .015 * Math.sin(t * 2.1) - .09 * dip;
  if (up > 0) g = lerp(g, 1, back(Math.pow(up, 1.7), 1.3));
  const l = ramp(t, T.lunge0, T.lunge1), e = Math.pow(l, 2.2), gc = clamp(g);
  const sea = 904 + 5 * Math.sin(t * 1.3);
  const p = { g, e, s: 1 + 1.6 * e };
  p.R = lerp(26, 262, Math.pow(Math.max(g, 0), 1.15)) * (1 + 1.6 * e);
  p.T = lerp(92, 232, g) * (1 + 2.2 * e);
  p.aEnd = lerp(158, 252, smooth(gc)) + 40 * Math.max(0, g - 1) + 16 * e;
  p.kx = 452 + 18 * t - 64 * dip + 4300 * e;
  const trough = sea + 18 * gc + 30 * dip + 820 * e;
  p.ky = trough - p.R;
  p.blx = p.kx - p.R - 3 * p.T; p.bly = sea + 820 * e;
  p.claw = .45 + .55 * ramp(g, .2, .9);
  p.geo = waveGeo(p);
  return p;
}
function drawHero(h, t) {
  const g = h.geo, s = h.s, N = g.F.length;
  const x0 = g.trough[0] + h.R * .25;
  const right = swellLine(g.trough[1], 52 * s, 560 * s, x0, 11, x0, FR + 140);
  const top = [[Math.min(FX - 90, h.blx - 10), h.bly]].concat(g.B, g.F.slice().reverse(), [g.trough], right.pts);
  solid(pathOf(top.concat([[FR + 150, FB + 90], [FX - 90, FB + 90]]), true), ink('deep'));
  if (right.pts.length) dress(right, { lw: 3.2 * s, foam: 30 * s, taper: 9, stripes: [{ d: 18 * s, w: 4 * s, f: .78, col: 'mid' }, { d: 46 * s, w: 5 * s, f: .5, col: 'blue' }] });
  // striations sweeping up the back and round the curl
  const band = (kc, hw, qa, qb, col) => {
    const up = [], dn = [];
    for (let i = 0; i < N; i++) {
      const q = i / (N - 1); if (q < qa || q > qb) continue;
      const w = hw * Math.pow(Math.sin(Math.PI * (q - qa) / (qb - qa)), .7);
      up.push(mixP(g.F[i], g.B[i], kc + w)); dn.push(mixP(g.F[i], g.B[i], kc - w));
    }
    C.fillStyle = ink(col); C.fill(pathOf(up.concat(dn.reverse()), true));
  };
  band(.82, .035, .04, .93, 'blue'); band(.62, .045, .09, .97, 'lite'); band(.42, .04, .15, .93, 'mid'); band(.23, .036, .2, .88, 'lite'); band(.07, .028, .12, .7, 'mid');
  // foam: a frothy white band along the lip, its edge breaking into hooked fingers that reach into the hollow
  const aF0 = Math.max(g.aJ + 6, h.aEnd - 122), fa = [], fb = [], nf = 60;
  for (let i = 0; i <= nf; i++) {
    const f = i / nf, a = lerp(aF0, h.aEnd, f);
    fa.push(g.pol(g.rf(a), a)); fb.push(g.pol(g.rf(a) + g.th(a) * .46 * Math.pow(f, .6), a));
  }

  [[1.15, 69], [1.5, 70], [1.85, 69], [2.2, 67]].forEach(([t, n]) => ev.push({ k: 'koto', t, n, v: .8 }));
  for (let t = T.rise0 + .35, i = 0; t < T.rise1 + .1; t += lerp(.2, .085, ramp(t, T.rise0, T.rise1)), i++) ev.push({ k: 'koto', t, n: i % 2 ? 75 : 74, v: .35 + .5 * ramp(t, T.rise0, T.rise1) });
  ev.push({ k: 'swell', t: T.dip0, d: T.lunge0 + .35 - T.dip0 });
  ev.push({ k: 'crash', t: T.lunge0 + .3 });
  ev.push({ k: 'calm', t: T.lunge0 + .8, d: T.end - T.lunge0 - .8 });
  ev.push({ k: 'flute', t: T.lunge1 - .25, d: 2.6, n: 74 }, { k: 'flute', t: T.sub + .1, d: 2.1, n: 69 });
  ev.push({ k: 'koto', t: T.the, n: 62, v: .8 }, { k: 'koto', t: T.the + .27, n: 67, v: .6 });
  [62, 67, 69, 70, 74].forEach((n, i) => ev.push({ k: 'koto', t: T.world + i * .1, n, v: .75 + .05 * i }));
  ev.push({ k: 'koto', t: T.sub + .1, n: 57, v: .6 });
  ev.push({ k: 'stamp', t: T.seal + .13 });
  [50, 57, 62].forEach((n, i) => ev.push({ k: 'koto', t: T.seal + .75 + i * .05, n, v: .7 }));
  return ev;
};

window.ready = (async () => {
  const words = 'THE FLOATING WORLD WAVE CALM A STORY IN WOODBLOCK PRINTS';
  await Promise.all([document.fonts.load(`400 100px ${TITLE}`, words), document.fonts.load(`700 100px ${CAPS}`, words), document.fonts.load(`600 100px ${CAPS}`, words)]);
  await document.fonts.ready;
  PAPER = makePaper(); GRAIN = makeGrain();
  LAY = {
    the: layout('THE FLOATING', `400 SIZE ${TITLE}`, 7),
    world: layout('WORLD', `400 SIZE ${TITLE}`, 16),
    sub: layout('A STORY IN WOODBLOCK PRINTS', `700 SIZE ${CAPS}`, 5.5),
  };
  frame(0);
})();
window.draw = ({ t }) => {
  frame(t);
  return X.canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
};
