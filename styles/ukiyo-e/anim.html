<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ukiyo-e</title>
<link href="fonts.css" rel="stylesheet">
<style>html, body { margin: 0; background: #eee2c7; overflow: hidden } canvas { display: block }</style>
</head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// Ukiyo-e: a woodblock print is pulled block by block (key lines, then sky, sea, red and earth
// plates), the tall wave rises and breaks, its spray turns into plovers, a second print is rubbed
// in behind the flock (dusk, snowy peak), its cartouche is printed and the artist's seal stamped.
// Every frame is a pure function of t; all randomness is seeded and textures are made once.

const W = 1920, H = 1080;
const view = document.getElementById('c');
const main = view.getContext('2d');
const FRAME = { x: 56, y: 50, w: 1808, h: 980 };            // the printed image area
const PAPER_RGB = [238, 226, 199];
const INK = {
  sumi: '#241e1a', prussian: '#22527f', indigo: '#1c2f52', pale: '#a3c0d2', mid: '#6d97ba',
  beni: '#c9452f', pink: '#eab4a1', straw: '#eed88f', earth: '#a1805a', bark: '#6b4b35',
  pine: '#3f5d48', moss: '#728856', slate: '#7186a1', sealRed: '#b22a1e',
};

// ---- small maths --------------------------------------------------------------------------
const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
const span = (t, a, b) => clamp((t - a) / (b - a));
const mix = (a, b, u) => a + (b - a) * u;
const smooth = u => u * u * (3 - 2 * u);
const inOut = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(2 - 2 * u, 3) / 2);
const outC = u => 1 - Math.pow(1 - u, 3);
const inC = u => u * u * u;
const outBack = u => { const k = 1.9, v = u - 1; return 1 + (k + 1) * v * v * v + k * v * v; };
const TAU = Math.PI * 2;

// xorshift32 stream, seeded per use so frames never depend on draw order
function seeded(seed) {
  let s = (seed * 2654435761) >>> 0 || 7;
  return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}
function lattice(ix, iy, k) {
  let h = Math.imul(ix | 0, 0x27d4eb2d) ^ Math.imul(iy | 0, 0x165667b1) ^ Math.imul(k, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b); h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, k) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = lattice(ix, iy, k), b = lattice(ix + 1, iy, k), c = lattice(ix, iy + 1, k), d = lattice(ix + 1, iy + 1, k);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
const sheet = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

// Catmull-Rom through control points -> dense polyline
function through(P, per = 10) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[Math.max(0, i - 1)], b = P[i], c = P[i + 1], d = P[Math.min(P.length - 1, i + 2)];
    for (let k = 0; k < per; k++) {
      const u = k / per, u2 = u * u, u3 = u2 * u;
      const f = (p0, p1, p2, p3) => 0.5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (3 * p1 - p0 - 3 * p2 + p3) * u3);
      out.push([f(a[0], b[0], c[0], d[0]), f(a[1], b[1], c[1], d[1])]);
    }
  }
  out.push(P[P.length - 1].slice());
  return out;
}
function trace(g, pts, dx = 0, dy = 0, from = 0, to = pts.length - 1) {
  g.moveTo(pts[from][0] + dx, pts[from][1] + dy);
  for (let i = from + 1; i <= to; i++) g.lineTo(pts[i][0] + dx, pts[i][1] + dy);
}
// evenly spaced samples (with outward normals) along a stretch of polyline
function alongArc(pts, from, to, n) {
  const seg = [0];
  for (let i = from + 1; i <= to; i++) seg.push(seg[seg.length - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = seg[seg.length - 1], res = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const want = total * k / (n - 1);
    while (j < seg.length - 2 && seg[j + 1] < want) j++;
    const u = seg[j + 1] > seg[j] ? (want - seg[j]) / (seg[j + 1] - seg[j]) : 0;
    const p = pts[from + j], q = pts[from + j + 1];
    const tx = q[0] - p[0], ty = q[1] - p[1], len = Math.hypot(tx, ty) || 1;
    res.push({ x: mix(p[0], q[0], u), y: mix(p[1], q[1], u), nx: ty / len, ny: -tx / len, q: k / (n - 1) });
  }
  return res;
}

// ---- textures, made once in window.ready -----------------------------------------------------
let PAPER, GRAIN, EDGE, SEAL, SEAL_SHADOW;
const inkC = sheet(W, H), inkG = inkC.getContext('2d');
const keyC = sheet(W, H), keyG = keyC.getContext('2d');
const maskC = sheet(W, H), maskG = maskC.getContext('2d');
const twoC = sheet(W, H), twoG = twoC.getContext('2d');

function cloudField(cw, ch, scale, k) {
  const f = new Float32Array(cw * ch);
  for (let j = 0; j < ch; j++) for (let i = 0; i < cw; i++) {
    const x = i / scale, y = j / scale;
    f[j * cw + i] = vnoise(x, y, k) * 0.58 + vnoise(x * 2.1, y * 2.1, k + 1) * 0.28 + vnoise(x * 4.7, y * 4.7, k + 2) * 0.14;
  }
  return f;
}
function sampleField(f, cw, ch, x, y) {
  const i0 = Math.min(cw - 2, x | 0), j0 = Math.min(ch - 2, y | 0), tx = x - i0, ty = y - j0;
  const a = f[j0 * cw + i0], b = f[j0 * cw + i0 + 1], c = f[(j0 + 1) * cw + i0], d = f[(j0 + 1) * cw + i0 + 1];
  const top = a + (b - a) * tx;
  return top + (c + (d - c) * tx - top) * ty;
}

function makePaper() {
  const c = sheet(W, H), g = c.getContext('2d'), R = seeded(11);
  const img = g.createImageData(W, H), px = img.data;
  const cw = 242, ch = 137, field = cloudField(cw, ch, 10, 3);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const m = sampleField(field, cw, ch, x / 8, y / 8);
    const n = (R() - 0.5) * 8 + (m - 0.5) * 18;
    const o = (y * W + x) * 4;
    px[o] = PAPER_RGB[0] + n; px[o + 1] = PAPER_RGB[1] + n * 0.95; px[o + 2] = PAPER_RGB[2] + n * 0.82; px[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  // kozo fibres: long pale strands and a few darker ones
  for (let i = 0; i < 2800; i++) {
    const x = R() * W, y = R() * H, len = 10 + R() * 52, a = R() * TAU, bend = (R() - 0.5) * 1.1;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + bend) * len * 0.5, y + Math.sin(a + bend) * len * 0.5, x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.strokeStyle = R() < 0.62 ? `rgba(255,251,238,${0.2 + R() * 0.28})` : `rgba(122,96,62,${0.05 + R() * 0.08})`;
    g.lineWidth = 0.5 + R() * 1.2; g.stroke();
  }
  for (let i = 0; i < 180; i++) {
    g.fillStyle = `rgba(92,70,44,${0.07 + R() * 0.12})`;
    g.beginPath(); g.ellipse(R() * W, R() * H, 0.6 + R() * 1.7, 0.4 + R() * 0.8, R() * 3, 0, TAU); g.fill();
  }
  const age = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 1.08);
  age.addColorStop(0, 'rgba(0,0,0,0)'); age.addColorStop(1, 'rgba(126,92,48,0.17)');
  g.fillStyle = age; g.fillRect(0, 0, W, H);
  return c;
}

// ink unevenness: wood grain streaks + baren mottling, used 'source-atop' on the ink layer
function makeGrain() {
  const c = sheet(W, H), g = c.getContext('2d'), R = seeded(23);
  const img = g.createImageData(W, H), px = img.data;
  const cw = 322, ch = 182, warp = cloudField(cw, ch, 40, 31), mot = cloudField(cw, ch, 7, 37);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const wv = sampleField(warp, cw, ch, x / 6, y / 6), mv = sampleField(mot, cw, ch, x / 6, y / 6);
    // long, nearly level grain lines of the cherry block, gently bowed
    const streak = Math.pow(Math.max(0, Math.sin((y + wv * 26 + Math.sin(x / 310) * 5) * 0.21)), 14);
    const blot = clamp((mv - 0.6) * 2.2);
    const a = streak * 0.075 + blot * 0.09 + R() * 0.03;
    const o = (y * W + x) * 4;
    px[o] = 250; px[o + 1] = 246; px[o + 2] = 232; px[o + 3] = a * 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}

// the rubbed edge of a fresh impression: opaque on the left, mottled, clear on the right
function makeEdge() {
  const w = 520, c = sheet(w, H), g = c.getContext('2d');
  const img = g.createImageData(w, H), px = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < w; x++) {
    const ramp = (0.5 - x / w) * 2.6;
    // streaky like a baren pass: stretched along the stroke, soft at the front
    const n = (vnoise(x / 60, y / 9, 41) * 0.55 + vnoise(x / 22, y / 3.5, 43) * 0.3 + vnoise(x / 120, y / 40, 47) * 0.15 - 0.5) * 1.5;
    const o = (y * w + x) * 4;
    px[o] = px[o + 1] = px[o + 2] = 0; px[o + 3] = clamp(ramp + n + 0.05) * 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}

// the artist's seal: vermilion square, an abstract sun-over-waves mark carved out (no lettering), worn edges
function makeSeal() {
  const s = 136, c = sheet(s, s), g = c.getContext('2d'), R = seeded(77);
  g.fillStyle = INK.sealRed;
  g.beginPath();
  const pts = [];
  for (let i = 0; i < 48; i++) {
    const side = Math.floor(i / 12), u = (i % 12) / 12, j = (R() - 0.5) * 3.2;
    const p = [[8 + u * 120, 8 + j], [128 + j, 8 + u * 120], [128 - u * 120, 128 + j], [8 + j, 128 - u * 120]][side];
    pts.push(p);
  }
  trace(g, pts); g.closePath(); g.fill();
  g.globalCompositeOperation = 'destination-out';
  g.lineWidth = 5; g.strokeRect(19, 19, 98, 98);
  g.beginPath(); g.arc(46, 46, 13, 0, TAU); g.fill();                    // the sun, upper left
  g.lineWidth = 5.5; g.lineCap = 'round';
  [70, 88, 106].forEach((y, k) => {                                     // three swells of sea under it
    g.beginPath();
    for (let x = 30; x <= 106; x += 2) g.lineTo(x, y + 5 * Math.sin((x - 30) / 76 * 2 * TAU + k * 1.6));
    g.stroke();
  });
  g.lineCap = 'butt';
  for (let i = 0; i < 340; i++) {
    g.globalAlpha = 0.25 + R() * 0.6;
    g.beginPath(); g.arc(R() * s, R() * s, 0.4 + R() * R() * 2.6, 0, TAU); g.fill();
  }
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  return c;
}
function makeSealShadow() {
  const c = sheet(260, 260), g = c.getContext('2d');
  g.filter = 'blur(7px)'; g.fillStyle = 'rgba(40,24,14,1)'; g.fillRect(62, 62, 136, 136); g.filter = 'none';
  return c;
}

const patterns = new Map();
function paperInk(g) {
  let p = patterns.get(g);
  if (!p) { p = g.createPattern(PAPER, 'no-repeat'); patterns.set(g, p); }
  return p;
}

// ---- plates: each colour block lands with a small drop and its own registration ------------
const SETTLED = { a: 1, dy: 0 };
function landing(t, t0) {
  if (t0 === undefined) return SETTLED;
  const u = span(t, t0, t0 + 0.26);
  if (u <= 0) return null;
  return { a: clamp(u * 2.6), dy: -22 * (1 - outBack(u)) };
}
function plate(g, st, reg, draw) {
  if (!st) return;
  g.save(); g.globalAlpha = st.a; g.translate(reg[0], reg[1] + st.dy); draw(g); g.restore();
}
function inkOpen() {
  const g = inkG;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  g.clearRect(0, 0, W, H);
  g.save(); g.beginPath(); g.rect(FRAME.x, FRAME.y, FRAME.w, FRAME.h); g.clip();
  return g;
}
function inkClose(g) {
  inkG.restore();
  inkG.globalCompositeOperation = 'source-atop'; inkG.drawImage(GRAIN, 0, 0);
  inkG.globalCompositeOperation = 'source-over';
  g.save(); g.globalCompositeOperation = 'multiply'; g.drawImage(inkC, 0, 0); g.restore();
}
function clipFrame(g) { g.beginPath(); g.rect(FRAME.x, FRAME.y, FRAME.w, FRAME.h); g.clip(); }

// mist bands (kasumi): erased from the ink, tinted along the lower edge
function mistPath(g, m, t) {
  const x = m.x + m.v * t;
  g.beginPath();
  g.roundRect(x, m.y, m.w, m.h, m.h / 2);
  g.roundRect(x + m.w * 0.2, m.y + m.h * 0.6, m.w * 0.55, m.h * 0.84, m.h * 0.42);
}
function eraseMist(g, list, t) {
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000';
  list.forEach(m => { mistPath(g, m, t); g.fill(); });
  g.restore();
}
function tintMist(g, list, t, color) {
  list.forEach(m => {
    const gr = g.createLinearGradient(0, m.y, 0, m.y + m.h * 1.45);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.3, 'rgba(0,0,0,0)'); gr.addColorStop(1, color);
    mistPath(g, m, t); g.fillStyle = gr; g.fill();
    g.globalAlpha *= 0.28; g.fillStyle = color; g.fill(); g.globalAlpha /= 0.28;
  });
}

// ---- shared print furniture ------------------------------------------------------------------
// cartouche text is factual only: the style's own name and its period. Print one's cartouche is wiped away
// right to left, so every left-anchored prefix must stay harmless (no "JAPAN": it would pass through "JAP").
const SERIES = 'EDO PERIOD', TITLE = ['Ukiyo-e'], DATES = '17th–19th c.';
function cartoucheInk(g, b) {
  g.fillStyle = INK.straw; g.fillRect(b.x, b.y, b.w, b.h);
}
function cartoucheBand(g, b) {
  g.fillStyle = INK.beni; g.fillRect(b.x, b.y, b.w, 54);
}
function cartoucheKey(g, b, lines, num, t, t0) {
  g.strokeStyle = INK.sumi; g.lineWidth = 3.4; g.strokeRect(b.x, b.y, b.w, b.h);
  g.lineWidth = 1.4; g.strokeRect(b.x + 8, b.y + 8, b.w - 16, b.h - 16);
  g.beginPath(); g.moveTo(b.x, b.y + 54); g.lineTo(b.x + b.w, b.y + 54); g.lineWidth = 2.4; g.stroke();
  g.fillStyle = INK.sumi; g.textBaseline = 'alphabetic';
  g.font = "400 60px 'Zen Antique'";
  let n = 0;
  lines.forEach((line, li) => {
    const wd = g.measureText(line).width, y = b.y + 54 + 72 + li * 66 + (2 - lines.length) * 33;   // a single line sits centred
    let x = b.x + (b.w - wd) / 2;
    for (const ch of line) {
      const cw = g.measureText(ch).width;
      const u = t0 === undefined ? 1 : span(t, t0 + n * 0.045, t0 + n * 0.045 + 0.16);
      if (u > 0) { g.globalAlpha = u; g.fillText(ch, x, y - 9 * (1 - outC(u))); }
      x += cw; n++;
    }
  });
  g.globalAlpha = 1;
  const u = t0 === undefined ? 1 : span(t, t0 + n * 0.045, t0 + n * 0.045 + 0.2);
  g.globalAlpha = u; g.font = "600 22px 'Cormorant SC'"; g.textAlign = 'right';
  g.fillText(num, b.x + b.w - 22, b.y + b.h - 18); g.textAlign = 'left'; g.globalAlpha = 1;
}
function cartoucheLetters(g, b) {
  g.font = "700 21px 'Cormorant SC'"; g.letterSpacing = '1.5px'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = paperInk(g); g.fillText(SERIES, b.x + b.w / 2 + 1, b.y + 28, b.w - 40);
  g.letterSpacing = '0px'; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
}
function border(g) {
  g.strokeStyle = INK.sumi; g.lineWidth = 2.6; g.strokeRect(FRAME.x, FRAME.y, FRAME.w, FRAME.h);
}
// outlined paper blobs: stroke all, then fill all, so only the outer edge of the union stays inked
function blobs(g, list, lw, tint) {
  if (!list.length) return;
  g.beginPath();
  list.forEach(c => { g.moveTo(c.x + c.r, c.y); g.arc(c.x, c.y, c.r, 0, TAU); });
  g.strokeStyle = INK.sumi; g.lineWidth = lw; g.stroke();
  g.fillStyle = paperInk(g); g.fill();
  if (tint) { g.fillStyle = tint; g.fill(); }
}

// ---- scene 1: the tall wave at dawn ----------------------------------------------------------
const POSE = {
  A: [[80, 936], [520, 852], [700, 818], [830, 784], [930, 752], [1030, 734], [1118, 738], [1182, 754], [1178, 770], [1150, 773], [1150, 790], [1190, 820], [1290, 850], [1700, 936]],
  B: [[70, 936], [460, 862], [630, 836], [760, 806], [860, 782], [960, 770], [1040, 772], [1098, 786], [1094, 800], [1068, 802], [1070, 816], [1110, 838], [1220, 862], [1690, 936]],
  C: [[80, 936], [500, 822], [700, 672], [840, 502], [960, 362], [1090, 286], [1232, 292], [1330, 362], [1300, 414], [1222, 394], [1170, 472], [1206, 642], [1330, 800], [1720, 936]],
  C2: [[80, 936], [500, 818], [700, 658], [846, 482], [972, 338], [1102, 264], [1252, 270], [1362, 346], [1332, 406], [1242, 386], [1182, 466], [1212, 640], [1336, 800], [1724, 936]],
  D: [[90, 936], [520, 832], [720, 704], [862, 566], [992, 456], [1122, 404], [1282, 424], [1420, 542], [1402, 602], [1322, 562], [1252, 582], [1272, 690], [1390, 812], [1740, 936]],
  E: [[100, 936], [560, 864], [760, 842], [900, 826], [1020, 812], [1150, 804], [1280, 808], [1380, 826], [1376, 838], [1352, 840], [1352, 850], [1390, 866], [1480, 880], [1760, 936]],
};
const blend = (P, Q, u) => P.map((p, i) => [mix(p[0], Q[i][0], u), mix(p[1], Q[i][1], u)]);
function waveAt(t) {
  let P;
  if (t < 1.7) P = POSE.A;
  else if (t < 2.2) P = blend(POSE.A, POSE.B, inOut(span(t, 1.7, 2.2)));
  else if (t < 3.6) P = blend(POSE.B, POSE.C2, inOut(span(t, 2.2, 3.6)));
  else if (t < 3.95) P = blend(POSE.C2, POSE.C, smooth(span(t, 3.6, 3.95)));
  else if (t < 4.35) P = blend(POSE.C, POSE.D, inC(span(t, 3.95, 4.35)));
  else if (t < 5.1) P = blend(POSE.D, POSE.E, outC(span(t, 4.35, 5.1)));
  else P = POSE.E;
  const heave = Math.sin(t * 2.3) * 5;
  P = P.map(([x, y], i) => [x + Math.sin(t * 1.6 + i * 0.6) * 2, y < 860 ? y + heave : y]);
  const tall = inOut(span(t, 2.2, 3.6)) * (1 - outC(span(t, 4.35, 5.1)));
  return { pts: through(P, 10), tall };
}
function bodyPath(g, d) {
  g.beginPath(); trace(g, d);
  g.lineTo(d[d.length - 1][0], 1100); g.lineTo(d[0][0], 1100); g.closePath();
}
function waveInk(g, wv) {
  const d = wv.pts, sc = mix(0.5, 1, wv.tall);
  g.save(); bodyPath(g, d); g.clip();
  g.fillStyle = INK.prussian; g.fillRect(0, 0, W, H);
  let gr = g.createLinearGradient(0, 690, 0, 900);
  gr.addColorStop(0, 'rgba(28,47,82,0)'); gr.addColorStop(1, 'rgba(28,47,82,0.92)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const f = d[112];
  gr = g.createRadialGradient(f[0] + 24, f[1] - 18, 8, f[0] + 24, f[1] - 18, 200 * sc);
  gr.addColorStop(0, 'rgba(126,170,202,0.95)'); gr.addColorStop(1, 'rgba(126,170,202,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let k = 1; k <= 12; k++) {
    g.beginPath(); trace(g, d, k * 12 * sc, k * 19 * sc, 0, 76);
    g.strokeStyle = `rgba(183,207,224,${0.95 - k * 0.055})`; g.lineWidth = Math.max(1.4, 5.4 - k * 0.34); g.stroke();
  }
  g.restore();
}
function waveKey(g, wv) {
  const d = wv.pts, sc = mix(0.5, 1, wv.tall);
  g.save(); bodyPath(g, d); g.clip();

  gi.beginPath(); trace(gi, SHORE_D, 0, -9); gi.lineWidth = 26; gi.stroke(); gi.restore();
  gi.beginPath(); trace(gi, SHORE_D); gi.lineTo(1300, 1100); gi.lineTo(0, 1100); gi.closePath();
  gr = gi.createLinearGradient(0, 860, 0, 1040);
  gr.addColorStop(0, 'rgba(222,196,140,0.9)'); gr.addColorStop(1, 'rgba(176,140,92,0.95)');
  gi.fillStyle = gr; gi.fill();
  gi.save(); gi.clip();
  gi.beginPath(); trace(gi, SHORE_D, 0, 10); gi.strokeStyle = 'rgba(150,122,86,0.45)'; gi.lineWidth = 22; gi.stroke();
  gi.fillStyle = 'rgba(96,74,50,0.5)';
  GRIT.forEach(([x, y, r]) => { gi.beginPath(); gi.arc(x, y, r, 0, TAU); gi.fill(); });
  gi.restore();
  tintMist(gi, MIST2, t, 'rgba(234,180,161,0.95)');
  const cart = landing(t, 6.62);
  plate(gi, cart, [-1, -2], p => cartoucheInk(p, BOX2));
  plate(gi, cart, [3, 1], p => cartoucheBand(p, BOX2));
  inkClose(g);

  // key block
  g.save(); clipFrame(g);
  g.strokeStyle = INK.sumi; g.lineJoin = 'round'; g.lineCap = 'round';
  g.save();
  // keep the key lines out of every mist band: one even-odd clip per rounded piece, so the clips
  // intersect into "outside the union" (a single even-odd path let lines through where two pieces overlap)
  MIST2.forEach(m => {
    const x = m.x + m.v * t;
    [[x, m.y, m.w, m.h, m.h / 2], [x + m.w * 0.2, m.y + m.h * 0.6, m.w * 0.55, m.h * 0.84, m.h * 0.42]].forEach(([rx, ry, rw, rh, rr]) => {
      g.beginPath(); g.rect(0, 0, W, H); g.roundRect(rx, ry, rw, rh, rr); g.clip('evenodd');
    });
  });
  g.beginPath(); trace(g, PEAK_D, 0, 0, 1, PEAK_D.length - 2); g.lineWidth = 3.6; g.stroke();
  g.save(); peakPath(g); g.clip();
  g.beginPath(); trace(g, SNOW, 0, 0, 2, SNOW.length - 2); g.lineWidth = 2; g.stroke();
  g.lineWidth = 1.5; g.beginPath();
  [[702, 300, 690, 420], [742, 296, 758, 425], [668, 312, 650, 400], [790, 306, 828, 428], [620, 345, 600, 410], [860, 350, 900, 420]]
    .forEach(([a, b, c, d]) => { g.moveTo(a, b); g.quadraticCurveTo((a + c) / 2 + 6, (b + d) / 2, c, d); });
  g.stroke();
  g.restore();
  g.restore();
  g.save(); g.beginPath(); g.rect(FRAME.x, 646, FRAME.w, 400); trace(g, SHORE_D); g.lineTo(1300, 1100); g.lineTo(0, 1100); g.closePath(); g.clip('evenodd');
  const spanX = FRAME.w + 400;
  RIPPLES.forEach(r => {
    const x = FRAME.x - 200 + (((r.x - FRAME.x + 200 + r.v * t) % spanX) + spanX) % spanX;
    g.beginPath(); g.moveTo(x, r.y); g.lineTo(x + r.len, r.y); g.lineWidth = r.w; g.globalAlpha = r.a; g.stroke();
  });
  g.globalAlpha = 1; g.restore();
  // the near shore: surf line and the wavelets just off it
  g.beginPath(); trace(g, SHORE_D); g.lineWidth = 2.4; g.stroke();
  g.beginPath();
  for (let i = 2; i < SHORE_D.length - 2; i += 3) {
    const p = SHORE_D[i], q = SHORE_D[i + 1], ph = Math.sin(t * 1.8 + i * 0.7) * 3;
    g.moveTo(p[0] - 10, p[1] - 15 + ph); g.quadraticCurveTo((p[0] + q[0]) / 2, p[1] - 24 + ph, q[0] + 10, q[1] - 15 + ph);
  }
  g.lineWidth = 1.6; g.stroke();
  BOATS.forEach(b => {
    const p = boatShape(b, t), s = p.s;
    g.beginPath(); g.moveTo(p.x - 30 * s, p.y); g.lineTo(p.x + 30 * s, p.y); g.lineTo(p.x + 20 * s, p.y + 9 * s); g.lineTo(p.x - 22 * s, p.y + 9 * s); g.closePath();
    g.lineWidth = 1.8; g.stroke();
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x, p.y - 52 * s); g.stroke();
    g.beginPath(); g.rect(p.x - 18 * s, p.y - 48 * s, 36 * s, 40 * s);
    g.fillStyle = paperInk(g); g.fill(); g.lineWidth = 1.8; g.stroke();
    g.beginPath(); for (let k = 1; k < 4; k++) { g.moveTo(p.x - 18 * s, p.y - 48 * s + k * 10 * s); g.lineTo(p.x + 18 * s, p.y - 48 * s + k * 10 * s); }
    g.lineWidth = 1; g.stroke();
  });
  if (cart) {
    g.save(); g.globalAlpha = cart.a; g.translate(0, cart.dy);
    cartoucheLetters(g, BOX2);
    g.restore();
    g.save(); g.translate(0, cart.dy); g.globalAlpha = cart.a;
    cartoucheKey(g, BOX2, TITLE, DATES, t, 6.86);
    g.restore();
  }
  g.restore();
  border(g);
  // the seal comes down, lands with a press and stays
  const near = span(t, 7.5, 7.93);
  if (near > 0 && t < 7.93) {
    const k = mix(1.3, 1.0, inC(near));
    g.save(); g.globalAlpha = 0.26 * smooth(near);
    g.translate(SEAL_AT.x + 68 + 8 * (1 - near), SEAL_AT.y + 68 + 12 * (1 - near)); g.scale(k, k);
    g.drawImage(SEAL_SHADOW, -130, -130); g.restore();
  }
  if (t >= 7.93) {
    const u = span(t, 7.93, 8.13), k = 1 + 0.08 * (1 - outC(u));
    g.save(); g.globalCompositeOperation = 'multiply'; g.globalAlpha = clamp(span(t, 7.93, 7.97) * 0.7 + 0.3);
    g.translate(SEAL_AT.x + 68, SEAL_AT.y + 68); g.scale(k, k); g.drawImage(SEAL, -68, -68); g.restore();
  }
}

// ---- the plovers ----------------------------------------------------------------------------
const FLOCK = [[4.4, 1390, 440], [4.85, 1545, 265], [5.3, 1480, 165], [5.8, 1180, 165], [6.4, 880, 190], [7.2, 590, 218], [8.2, 420, 252], [10.2, 320, 278]];
// a loose skein, leaders to the left (the flock flies left once it has turned)
const SKEIN = [[-250, -60], [-190, -20], [-140, -75], [-80, -30], [-30, -90], [20, -40], [70, 10], [120, -60], [170, -10], [230, 30], [280, -30]];
const BIRDS = [];
function initBirds() {
  const R = seeded(91);
  for (let i = 0; i < 11; i++) BIRDS.push({
    tb: 4.3 + i * 0.05,
    p0: [1220 + (i % 4) * 96 + R() * 30, 300 + Math.floor(i / 4) * 88 + (i % 4) * 26 + R() * 30],
    v0: [-70 + (i % 4) * 75 + R() * 40, -280 - R() * 160],
    off: [SKEIN[i][0] + (R() - 0.5) * 12, SKEIN[i][1] + (R() - 0.5) * 12],
    ph: R() * TAU, rate: 2.5 + R() * 0.7, size: 0.88 + R() * 0.28,
  });
}
function flockAt(t) {
  const F = FLOCK;
  if (t <= F[0][0]) return [F[0][1], F[0][2]];
  let k = 0;
  while (k < F.length - 2 && t > F[k + 1][0]) k++;
  const u = clamp((t - F[k][0]) / (F[k + 1][0] - F[k][0]));
  const a = F[Math.max(0, k - 1)], b = F[k], c = F[k + 1], d = F[Math.min(F.length - 1, k + 2)];
  const u2 = u * u, u3 = u2 * u;
  const f = (p0, p1, p2, p3) => 0.5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (3 * p1 - p0 - 3 * p2 + p3) * u3);
  return [f(a[1], b[1], c[1], d[1]), f(a[2], b[2], c[2], d[2])];
}
const depth = t => mix(1, 0.7, inOut(span(t, 6.0, 8.4))) * mix(1, 0.94, span(t, 8.4, 10));
function birdAt(b, t) {
  const age = Math.max(0, t - b.tb), w = smooth(span(t, b.tb, b.tb + 1.0));
  const lx = b.p0[0] + b.v0[0] * age, ly = b.p0[1] + b.v0[1] * age + 150 * age * age;
  const F = flockAt(t), P = depth(t);
  const fx = F[0] + b.off[0] * P, fy = F[1] + b.off[1] * P + Math.sin(t * 2.1 + b.ph) * 9 * P;
  return [mix(lx, fx, w), mix(ly, fy, w)];
}
function plover(g, x, y, s, facing, tilt, flap) {
  const m = new DOMMatrix().translate(x, y).scale(facing * s, s).rotate(tilt * 180 / Math.PI);
  const lw = Math.max(1.2, 2.7 * s);
  const build = fn => { g.save(); g.setTransform(m); g.beginPath(); fn(); g.restore(); };
  const wing = (f, dx, dy) => () => {
    const tipX = -32 - 6 * Math.abs(f) + dx, tipY = -2 - 46 * f + dy;
    g.moveTo(9 + dx, -7 + dy);
    g.quadraticCurveTo(-4 + dx, -12 - 34 * f + dy, tipX, tipY);
    g.quadraticCurveTo(-13 + dx, -3 - 16 * f + dy, -11 + dx, -1 + dy);
    g.closePath();
  };
  g.lineJoin = 'round'; g.lineCap = 'round';
  build(wing(flap * 0.85, 5, -3));
  g.fillStyle = paperInk(g); g.fill(); g.fillStyle = 'rgba(60,74,96,0.28)'; g.fill();
  g.strokeStyle = INK.sumi; g.lineWidth = lw; g.stroke();
  build(() => {
    g.ellipse(0, 0, 24, 12.5, 0, 0, TAU);
    g.moveTo(31, -9); g.arc(21, -9, 10, 0, TAU);
    g.moveTo(-18, -4); g.lineTo(-36, -9); g.lineTo(-33, 3); g.lineTo(-18, 6); g.closePath();
  });
  g.fillStyle = paperInk(g); g.fill(); g.lineWidth = lw; g.stroke();
  // erase the inner seams so the body reads as one shape
  build(() => { g.ellipse(0, 0, 22, 10.8, 0, 0, TAU); g.moveTo(29.5, -9); g.arc(21, -9, 8.5, 0, TAU); });
  g.fillStyle = paperInk(g); g.fill();
  build(() => { g.moveTo(-10, 5); g.quadraticCurveTo(4, 10, 16, 4); });
  g.strokeStyle = 'rgba(36,30,26,0.55)'; g.lineWidth = Math.max(0.8, 1.3 * s); g.stroke();
  build(() => { g.moveTo(30, -11); g.lineTo(41, -7.5); g.lineTo(30, -5.5); g.closePath(); });
  g.fillStyle = INK.sumi; g.fill();
  build(() => { g.moveTo(26.2, -11); g.arc(24.5, -11, 1.9, 0, TAU); });
  g.fill();
  build(wing(flap, 0, 0));
  g.fillStyle = paperInk(g); g.fill();
  g.save(); g.clip();
  build(() => { const tx = -32 - 6 * Math.abs(flap), ty = -2 - 46 * flap; g.moveTo(tx + 18, ty); g.arc(tx, ty, 18, 0, TAU); });
  g.fillStyle = 'rgba(52,66,90,0.85)'; g.fill(); g.restore();
  build(wing(flap, 0, 0));
  g.strokeStyle = INK.sumi; g.lineWidth = lw; g.stroke();
}
function drawBirds(g, t) {
  const list = [];
  for (const b of BIRDS) {
    if (t < b.tb) continue;
    const p = birdAt(b, t), a = birdAt(b, t - 0.025), c = birdAt(b, t + 0.025);
    list.push({ b, p, vx: (c[0] - a[0]) / 0.05, vy: (c[1] - a[1]) / 0.05 });
  }
  list.sort((u, v) => u.b.size - v.b.size);
  // the last of the spray swells into each bird
  const pops = list.filter(o => t - o.b.tb < 0.2).map(o => ({ x: o.p[0], y: o.p[1], r: 13 * (1 - (t - o.b.tb) / 0.2) }));
  blobs(g, pops, 3.2, 'rgba(150,186,210,0.45)');
  for (const o of list) {
    const born = outBack(span(t, o.b.tb, o.b.tb + 0.28));
    const s = o.b.size * depth(t) * born;
    if (s < 0.05) continue;
    let facing = clamp(o.vx / 170, -1, 1);
    if (Math.abs(facing) < 0.55) facing = facing < 0 ? -0.55 : 0.55;
    const tilt = clamp(Math.atan2(o.vy, Math.abs(o.vx)), -0.25, 0.25);
    // quicker beats just after take-off (phase integrated so it never runs backwards), then a glide
    const age = Math.min(1.2, t - o.b.tb), boost = 0.45 * (age - age * age / 2.4);
    const beat = Math.sin(TAU * o.b.rate * (t + boost) + o.b.ph), amp = mix(1, 0.45, smooth(span(t, 6.2, 7.6)));
    plover(g, o.p[0], o.p[1], s, facing, tilt, beat * amp + 0.15 * (1 - amp));
  }
}

// ---- the film -------------------------------------------------------------------------------
function render(t) {
  const g = main;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  if (t < 5.06) scene1(g, t);
  else if (t >= 6.02) scene2(g, t);
  else {
    // a fresh sheet is rubbed in from the right, behind the flock
    scene1(g, t);
    twoG.setTransform(1, 0, 0, 1, 0, 0); twoG.globalCompositeOperation = 'source-over'; twoG.globalAlpha = 1;
    scene2(twoG, t);
    wipeMask(mix(W + 260, -260, inOut(span(t, 5.06, 6.02))), false);
    maskG.globalCompositeOperation = 'source-in'; maskG.drawImage(twoC, 0, 0); maskG.globalCompositeOperation = 'source-over';
    g.drawImage(maskC, 0, 0);
  }
  if (t >= 4.3) { g.save(); clipFrame(g); drawBirds(g, t); g.restore(); }
  const out = inOut(span(t, 9.2, 9.97));
  if (out > 0) { g.globalAlpha = out; g.drawImage(PAPER, 0, 0); g.globalAlpha = 1; }
}

window.events = () => {
  const cues = [], cue = (t, k, o = {}) => cues.push({ t: +t.toFixed(3), k, ...o });
  cue(0, 'sea', { d: 10, v: 0.5 });
  cue(0.1, 'rub', { d: 0.7, v: 0.55 });
  cue(0.12, 'tok', { f: 150, v: 0.55 });
  [0.86, 1.02, 1.18, 1.34, 1.5].forEach((t, i) => {
    cue(t + 0.05, 'tok', { f: 190 + i * 24, v: 0.42 });
    cue(t + 0.06, 'koto', { n: [0, 3, 5, 7, 12][i], v: 0.5 });
  });
  cue(1.72, 'swell', { d: 2.5, v: 0.75 });
  [2.3, 2.55, 2.8, 3.02, 3.22, 3.4, 3.56].forEach((t, i) => cue(t, 'koto', { n: [0, 1, 5, 7, 8, 12, 13][i], v: 0.32 + i * 0.03 }));
  cue(4.12, 'crash', { v: 0.95 });
  cue(4.28, 'taiko', { f: 62, v: 0.95 });
  cue(4.1, 'hiss', { d: 1.3, v: 0.55 });
  BIRDS.forEach((b, i) => cue(b.tb + 0.06, 'peep', { f: 2500 + (i % 4) * 260, v: 0.2 }));
  [4.95, 5.25].forEach((t, i) => cue(t, 'peep', { f: 2900 - i * 300, v: 0.12 }));
  cue(5.04, 'rub', { d: 1.0, v: 0.5 });
  [6.1, 6.42, 6.74, 7.16, 7.5].forEach((t, i) => cue(t, 'koto', { n: [12, 8, 7, 5, 3][i], v: 0.42 }));
  cue(6.66, 'tok', { f: 240, v: 0.38 });
  for (let i = 0; i < TITLE.join('').length; i++) cue(6.88 + i * 0.045, 'tick', { f: 1900 + (i % 3) * 180, v: 0.06 });
  cue(7.93, 'stamp', { v: 0.85 });
  cue(7.96, 'rin', { f: 880, v: 0.4 });
  cue(8.6, 'koto', { n: 0, v: 0.38 });
  cue(8.95, 'koto', { n: 7, v: 0.3 });
  return cues;
};
window.draw = ({ t }) => {
  render(t);
  return view.toDataURL('image/jpeg', 0.92).replace(/^data:image\/jpeg;base64,/, '');
};
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([
    ["400 60px 'Zen Antique'", TITLE.join(' ')],
    ["700 22px 'Cormorant SC'", SERIES],
    ["600 22px 'Cormorant SC'", DATES],
  ].map(([spec, txt]) => document.fonts.load(spec, txt)));
  PAPER = makePaper(); GRAIN = makeGrain(); EDGE = makeEdge(); SEAL = makeSeal(); SEAL_SHADOW = makeSealShadow();
  initSpray(); initBirds(); initRipples(); initGrit();
})();
</script>
