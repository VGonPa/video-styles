<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── retro-70s · "SUNDAY KITCHEN" TV cooking show titles ─────────
// Scene 1: TV turns on → zoom-lens pull-back from the pot → rainbow stripes flow in →
//          vegetables drop onto the counter and bounce to the beat → "SUNDAY KITCHEN" jumps in letter by letter
//          → one by one the vegetables hop into the pot (splash)
// Transition: crash zoom into the soup, then four-colour stripe rings iris open onto scene 2
// Scene 2: a lemon cake drops onto its stand, lemon slices land on the beat, "Tonight: Lemon Cake" zooms in with echo trails
// Out : hold, then a soft fade to dark. Channel ident in the top-right corner throughout.
const [W, H] = [1920, 1080];
const DUR = 10, BEAT = 0.5;
const out = document.getElementById('c');
const ctx = out.getContext('2d');

// warm 70s palette
const C = {
  cream: '#F3E3C3', cream2: '#E9D2A8',
  brown: '#3A2216', brown2: '#6E3B1F',
  rust: '#C2501F', orange: '#E8862B', mustard: '#EDB53A',
  olive: '#7D7B2E', tomato: '#D4452A', lemon: '#F7D55C',
};
// the four-colour stripe motif, light to dark
const STRIPES = ['mustard', 'orange', 'rust', 'brown2'].map(k => C[k]);

// ── maths ──
const clamp = (v, lo = 0, hi = 1) => v < lo ? lo : v > hi ? hi : v;
const lerp = (p, q, k) => p * (1 - k) + q * k;
const seg = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const eOut3 = k => { const m = 1 - k; return 1 - m * m * m; };
const eIn3 = k => k ** 3;
const eInOut = k => k < 0.5 ? 4 * k ** 3 : 1 - 4 * (1 - k) ** 3;
const eBack = (k, s = 1.9) => { const m = k - 1; return 1 + m * m * (m * (s + 1) + s); };
// seeded xorshift32; returns floats in [0, 1)
function rng(seed) {
  let s = (Math.imul(seed + 1, 2654435761) ^ 0x5bd1e995) >>> 0 || 1;
  const next = () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  for (let n = 0; n < 4; n++) next();
  return next;
}
function surface(w, h) {
  const el = document.createElement('canvas');
  Object.assign(el, { width: w, height: h });
  return el;
}

// ── precomputed layers ──
const scene = surface(W, H), sx = scene.getContext('2d');
let GRAIN = [], SCAN, TUBE;

function noiseTile(seed) {
  const w = 960, h = 540, el = surface(w, h), g = el.getContext('2d');
  const img = g.createImageData(w, h), px = new Uint32Array(img.data.buffer), rand = rng(seed);
  for (let n = 0; n < px.length; n++) {
    const v = Math.round(clamp(128 + 184 * (rand() - rand()), 0, 255));
    px[n] = 0xff000000 | v << 16 | v << 8 | v;
  }
  g.putImageData(img, 0, 0);
  return el;
}
function scanlines() {
  const cell = surface(1, 4), cg = cell.getContext('2d');
  cg.fillStyle = '#fff'; cg.fillRect(0, 0, 1, 4);
  cg.fillStyle = 'rgba(40,20,10,0.16)'; cg.fillRect(0, 2, 1, 2);
  const el = surface(W, H), g = el.getContext('2d');
  g.fillStyle = g.createPattern(cell, 'repeat');
  g.fillRect(0, 0, W, H);
  return el;
}
function roundedRect(g, x0, y0, w, h, r) {
  const x1 = x0 + w, y1 = y0 + h;
  g.moveTo(x0 + r, y0);
  g.arcTo(x1, y0, x1, y1, r); g.arcTo(x1, y1, x0, y1, r);
  g.arcTo(x0, y1, x0, y0, r); g.arcTo(x0, y0, x1, y0, r);
  g.closePath();
}
// vignette, the dark bezel round the curved tube face, and a faint glare on the glass
function tubeMask() {
  const el = surface(W, H), g = el.getContext('2d');
  const shade = g.createRadialGradient(W / 2, H / 2, 0.35 * H, W / 2, H / 2, 1.05 * H);
  shade.addColorStop(0, 'rgba(20,8,0,0)');
  shade.addColorStop(1, 'rgba(20,8,0,0.62)');
  g.fillStyle = shade; g.fillRect(0, 0, W, H);
  g.beginPath(); g.rect(0, 0, W, H); roundedRect(g, 18, 14, W - 36, H - 28, 70);
  g.fillStyle = '#0b0604'; g.fill('evenodd');
  const glare = g.createLinearGradient(0, 0, 0, H / 2);
  glare.addColorStop(0, 'rgba(255,240,210,0.06)');
  glare.addColorStop(1, 'rgba(255,240,210,0)');
  g.fillStyle = glare; g.fillRect(0, 0, W, H / 2);
  return el;
}

// sunburst: 14 cream wedges, each 1/28 of a turn wide
function rays(x, cx, cy, spin, alpha) {
  const wedge = Math.PI / 14, reach = 2400;
  x.save(); x.globalAlpha = alpha; x.fillStyle = C.cream2; x.beginPath();
  for (let n = 0; n < 14; n++) {
    const a = spin + 2 * n * wedge;
    x.moveTo(cx, cy);
    x.lineTo(cx + reach * Math.cos(a), cy + reach * Math.sin(a));
    x.lineTo(cx + reach * Math.cos(a + wedge), cy + reach * Math.sin(a + wedge));
    x.closePath();
  }
  x.fill(); x.restore();
}

// ── type ──
// Chunky serif title with a three-step offset shadow. spec.at(i) gives letter i its entrance
// progress 0..1: each letter rises, rocks upright and overshoots its size around its own centre.
function poppedTitle(x, text, cx, baseY, size, spec) {
  const track = spec.track || 0, depth = spec.depth ?? size * 0.035, edge = size * 0.055;
  const shadows = [C.brown2, C.rust, C.orange];   // nearest first
  x.save();
  x.font = `900 ${size}px Fraunces`;
  x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.lineJoin = 'round'; x.lineWidth = 2 * edge;
  const glyphs = Array.from(text, ch => ({ ch, w: x.measureText(ch).width }));
  const span = glyphs.reduce((sum, g) => sum + g.w, 0) + track * (glyphs.length - 1);
  let pen = cx - span / 2;
  glyphs.forEach((g, i) => {
    const left = pen;
    pen += g.w + track;
    const k = clamp(spec.at(i));
    if (k <= 0 || g.ch === ' ') return;
    const grow = eBack(k, 2.0), rise = 0.45 * size * (1 - eOut3(k));
    const ox = -g.w / 2, oy = 0.35 * size;
    x.save();
    x.globalAlpha *= Math.min(1, 3 * k);
    x.translate(left + g.w / 2, baseY - oy + rise);
    x.rotate((i % 2 ? 0.25 : -0.25) * (1 - k));
    x.scale(grow, grow);
    for (let d = shadows.length; d > 0; d--) {
      x.fillStyle = x.strokeStyle = shadows[d - 1];
      x.strokeText(g.ch, ox + d * depth, oy + d * depth);
      x.fillText(g.ch, ox + d * depth, oy + d * depth);
    }
    x.strokeStyle = C.brown; x.strokeText(g.ch, ox, oy);
    x.fillStyle = C.cream; x.fillText(g.ch, ox, oy);
    x.restore();
  });
  x.restore();
}
// per-letter progress: letter i starts `step` seconds after letter i-1 and takes `dur`
const stagger = (t, t0, step, dur) => i => seg(t, t0 + step * i, t0 + step * i + dur);

// four-point twinkle with small diagonal points
function twinkle(x, px, py, r, alpha) {
  if (alpha <= 0) return;
  x.save(); x.globalAlpha = alpha; x.translate(px, py);
  x.beginPath();
  for (let n = 0; n < 8; n++) {
    const len = n & 1 ? 0.28 * r : r, ang = n * Math.PI / 4;
    x.lineTo(len * Math.cos(ang), len * Math.sin(ang));
  }
  x.closePath();
  x.lineWidth = 5; x.strokeStyle = C.brown; x.stroke();
  x.fillStyle = C.cream; x.fill();
  x.restore();
}
// each entry [x, y, radius, start]: pops in with overshoot, then pulses gently
function twinkles(x, t, list, wobble, rate) {
  for (const [px, py, r, t0] of list) {
    const k = seg(t, t0, t0 + 0.35);
    twinkle(x, px, py, r * eBack(k) * (1 + wobble * Math.sin(rate * (t - t0))), Math.min(1, 2 * k));
  }
}

// ── rainbow ribbon: four stripes run in along the counter from the right and turn up the left side ──
const BEND = { x: 470, y: 735, r: 250 };
const LANES = [-69, -23, 23, 69];
function lanePath(x, r) {
  x.beginPath();
  x.moveTo(2060, BEND.y + r);
  x.arc(BEND.x, BEND.y, r, Math.PI / 2, Math.PI);
  x.lineTo(BEND.x - r, -160);
}
const laneLength = r => (2060 - BEND.x) + r * Math.PI / 2 + (BEND.y + 160);
function rainbow(x, t, start) {
  LANES.forEach((off, i) => {
    const t0 = start + 0.09 * i, grow = eInOut(seg(t, t0, t0 + 1.1));
    if (grow <= 0) return;
    const r = BEND.r + off, len = laneLength(r);
    x.save();
    x.lineWidth = 47; x.lineCap = 'butt'; x.lineJoin = 'round'; x.strokeStyle = STRIPES[i];
    x.setLineDash([grow * len, 2 * len]);
    lanePath(x, r); x.stroke();
    x.restore();
  });
}

// ── vegetables (origin = bottom centre, on the ground) ──
function outline(x, w = 6) { x.strokeStyle = C.brown; x.lineWidth = w; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke(); }
function leaf(x, ax, ay, ang, len, wid) {
  x.save(); x.translate(ax, ay); x.rotate(ang);
  x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(wid, -len * 0.5, 0, -len); x.quadraticCurveTo(-wid, -len * 0.5, 0, 0);
  x.fillStyle = C.olive; x.fill(); outline(x, 5); x.restore();
}
function tomato(x) {
  x.beginPath(); x.ellipse(0, -60, 70, 60, 0, 0, Math.PI * 2); x.fillStyle = C.tomato; x.fill(); outline(x);
  x.fillStyle = 'rgba(243,227,195,0.75)'; x.beginPath(); x.ellipse(-30, -86, 16, 9, -0.5, 0, Math.PI * 2); x.fill();
  for (let i = 0; i < 5; i++) leaf(x, 0, -116, -1.2 + i * 0.6, 34, 11);
  x.beginPath(); x.moveTo(0, -118); x.quadraticCurveTo(4, -136, 12, -142); outline(x, 7);
}
function carrot(x) {
  for (let i = 0; i < 3; i++) leaf(x, 0, -176, -0.45 + i * 0.45, 78 - Math.abs(i - 1) * 14, 17);
  x.beginPath(); x.moveTo(-40, -172); x.quadraticCurveTo(-30, -60, 0, 0); x.quadraticCurveTo(30, -60, 40, -172);
  x.quadraticCurveTo(0, -192, -40, -172); x.closePath(); x.fillStyle = C.orange; x.fill(); outline(x);
  [[-26, -140, 16], [8, -108, 18], [-14, -72, 12], [10, -44, 10]].forEach(([a, b, l]) => { x.beginPath(); x.moveTo(a, b); x.lineTo(a + l, b + 3); outline(x, 5); });
}
function mushroom(x) {
  x.beginPath(); x.moveTo(-28, -84); x.quadraticCurveTo(-36, -8, -30, 0); x.lineTo(30, 0); x.quadraticCurveTo(36, -8, 28, -84); x.closePath();
  x.fillStyle = C.cream; x.fill(); outline(x);
  x.beginPath(); x.moveTo(-84, -80); x.bezierCurveTo(-84, -176, 84, -176, 84, -80); x.quadraticCurveTo(0, -62, -84, -80); x.closePath();
  x.fillStyle = C.brown2; x.fill(); outline(x);
  x.fillStyle = C.cream; [[-40, -118, 12], [10, -140, 14], [46, -104, 10], [-6, -100, 8]].forEach(([a, b, r]) => { x.beginPath(); x.arc(a, b, r, 0, Math.PI * 2); x.fill(); });
}
function onion(x) {
  leaf(x, 0, -170, 0.15, 60, 12);
  x.beginPath(); x.moveTo(0, -178); x.bezierCurveTo(24, -140, 76, -118, 70, -62); x.bezierCurveTo(66, -12, 30, 0, 0, 0);
  x.bezierCurveTo(-30, 0, -66, -12, -70, -62); x.bezierCurveTo(-76, -118, -24, -140, 0, -178); x.closePath();
  x.fillStyle = C.mustard; x.fill(); outline(x);
  x.beginPath(); x.moveTo(-6, -160); x.bezierCurveTo(-44, -120, -44, -30, -14, -6); outline(x, 4);
  x.beginPath(); x.moveTo(6, -160); x.bezierCurveTo(40, -120, 40, -30, 14, -6); outline(x, 4);
  for (let i = -1; i <= 1; i++) { x.beginPath(); x.moveTo(i * 8, 0); x.lineTo(i * 14, 12); outline(x, 4); }
}
const VEG = [
  { f: tomato, x: 520, land: 1.0, jump: 3.0, tilt: -0.06 },
  { f: carrot, x: 680, land: 1.25, jump: 3.25, tilt: 0.05 },
  { f: mushroom, x: 1370, land: 1.5, jump: 3.5, tilt: -0.04 },
  { f: onion, x: 1540, land: 1.75, jump: 3.75, tilt: 0.06 },
];
const GROUND = 910, POT = { x: 1020, rim: 740, bot: 910, rx: 225, ry: 40 }, JUMP_D = 0.45;
function vegPose(v, t) {
  // returns {x, y, sx, sy, rot, inPot} or null when not on screen
  if (t < v.land - 0.4) return null;
  if (t < v.land) { const u = seg(t, v.land - 0.4, v.land); return { x: v.x, y: GROUND - 900 * (1 - u * u), sx: 0.92, sy: 1.1, rot: v.tilt * 3 * (1 - u) }; }
  if (t >= v.jump) {
    const u = seg(t, v.jump, v.jump + JUMP_D);
    if (u >= 1) return null;
    const tx = POT.x + (v.x < POT.x ? -50 : 50), ty = POT.rim + 150;
    const dir = v.x < POT.x ? 1 : -1;
    const sq = clamp(1 - u / 0.12);
    const js = lerp(1, 0.72, u); return { x: lerp(v.x, tx, u), y: lerp(GROUND, ty, u * u) - 215 * 4 * u * (1 - u), sx: js * (1 + 0.1 * sq - 0.08 * (1 - sq)), sy: js * (1 - 0.1 * sq + 0.1 * (1 - sq)), rot: dir * u * 1.6, inPot: u > 0.5 };
  }
  // bounce on its own beat grid (contacts at land + n*BEAT)
  const p = ((t - v.land) / BEAT) % 1, h = 4 * p * (1 - p);
  const sq = clamp(1 - Math.min(p, 1 - p) / 0.13);
  const first = clamp(1 - (t - v.land) / 0.3);          // bigger squash on the first landing
  const k = 0.16 * sq + 0.14 * first;
  return { x: v.x, y: GROUND - 120 * h, sx: 1 + k, sy: 1 - k + 0.07 * h, rot: v.tilt * Math.sin(Math.PI * 2 * p) };
}
function drawVeg(x, v, P) {
  x.save(); x.translate(P.x, P.y); x.rotate(P.rot); x.scale(P.sx, P.sy); v.f(x); x.restore();
}
function vegShadow(x, v, P) {
  if (!P || P.inPot || P.x !== v.x) return;
  const h = clamp((GROUND - P.y) / 300);
  x.fillStyle = `rgba(58,34,22,${0.28 * (1 - h)})`;
  x.beginPath(); x.ellipse(v.x, GROUND + 4, 70 * (1 - h * 0.5), 12 * (1 - h * 0.5), 0, 0, Math.PI * 2); x.fill();
}

// ── the pot ──
function potBodyPath(x) {
  const { x: cx, rim, bot, rx, ry } = POT;
  x.beginPath(); x.moveTo(cx + rx, rim);
  x.lineTo(cx + rx - 12, bot - 60); x.quadraticCurveTo(cx + rx - 18, bot, cx + rx - 80, bot);
  x.lineTo(cx - rx + 80, bot); x.quadraticCurveTo(cx - rx + 18, bot, cx - rx + 12, bot - 60);
  x.lineTo(cx - rx, rim); x.ellipse(cx, rim, rx, ry, 0, Math.PI, 0, true); x.closePath();
}
function potBack(x, t) {
  const { x: cx, rim, bot, rx, ry } = POT;
  x.fillStyle = 'rgba(58,34,22,0.3)'; x.beginPath(); x.ellipse(cx + 14, bot + 6, rx + 10, 16, 0, 0, Math.PI * 2); x.fill();
  [-1, 1].forEach(s => {
    x.beginPath(); x.roundRect(cx + s * (rx + 30) - 36, rim + 36, 72, 34, 17);
    x.fillStyle = C.brown2; x.fill(); outline(x);
  });
  // inner wall + soup
  x.beginPath(); x.ellipse(cx, rim, rx, ry, 0, 0, Math.PI * 2); x.fillStyle = C.brown2; x.fill();
  x.beginPath(); x.ellipse(cx, rim + 10, rx - 20, ry - 12, 0, 0, Math.PI * 2); x.fillStyle = C.rust; x.fill();
  const r = rng(5);
  for (let i = 0; i < 7; i++) {
    const bx = cx + (r() - 0.5) * 300, by = rim + 10 + (r() - 0.5) * 30, ph = (t * 1.6 + r()) % 1;
    x.fillStyle = C.orange; x.globalAlpha = 1 - ph; x.beginPath(); x.arc(bx, by, 5 + 11 * ph, 0, Math.PI * 2); x.fill();
  }
  x.globalAlpha = 1;
  x.beginPath(); x.ellipse(cx, rim, rx, ry, 0, Math.PI, 0); outline(x, 7);
}
function potFront(x) {
  const { x: cx, rim, bot, rx } = POT;
  potBodyPath(x); x.fillStyle = C.orange; x.fill();
  x.save(); potBodyPath(x); x.clip();
  // enamel stripes: the four-colour motif wrapped around the pot
  const bands = [[C.cream, 22], [C.mustard, 16], [C.rust, 16], [C.brown2, 16]];
  let y = rim + 58;
  bands.forEach(([c, h]) => { x.fillStyle = c; x.beginPath(); x.ellipse(cx, y, rx + 10, 38, 0, 0, Math.PI); x.ellipse(cx, y + h, rx + 10, 38, 0, Math.PI, 0, true); x.fill(); y += h; });
  x.fillStyle = 'rgba(243,227,195,0.35)'; x.beginPath(); x.roundRect(cx - rx + 34, rim + 50, 26, bot - rim - 100, 13); x.fill();
  x.fillStyle = 'rgba(58,34,22,0.18)'; x.beginPath(); x.rect(cx + rx - 60, rim, 60, bot - rim); x.fill();
  x.restore();
  potBodyPath(x); outline(x, 7);
}
function steam(x, t, amt, puff) {
  const { x: cx, rim } = POT;
  x.save(); x.lineCap = 'round';
  [-90, 0, 90].forEach((dx, i) => {
    const ph = t * 0.9 + i * 0.33;
    x.globalAlpha = clamp(amt * (0.55 + 0.25 * Math.sin(t * 2.3 + i * 2)));
    x.beginPath();
    for (let k = 0; k <= 18; k++) {
      const yy = rim - 50 - k * (8 + 3 * puff), sw = Math.sin(k * 0.45 - ph * 5) * (14 + k * 0.9 + 20 * puff);
      k ? x.lineTo(cx + dx * (1 + puff * 0.6) + sw, yy) : x.moveTo(cx + dx + sw, yy);
    }
    x.strokeStyle = C.brown2; x.lineWidth = 24 + 10 * puff; x.stroke();
    x.strokeStyle = '#FFF6E6'; x.lineWidth = 13 + 10 * puff; x.stroke();
  });
  x.restore();
}
function splash(x, t) {
  const a0 = x.globalAlpha; if (a0 <= 0) return;
  VEG.forEach((v, i) => {
    const u = seg(t, v.jump + JUMP_D * 0.55, v.jump + JUMP_D * 0.55 + 0.45);
    if (u <= 0 || u >= 1) return;
    const r = rng(40 + i);
    for (let k = 0; k < 9; k++) {
      const a = -Math.PI * (0.12 + 0.76 * r()), sp = 180 + 200 * r();
      const px = POT.x + (v.x < POT.x ? -50 : 50) + Math.cos(a) * sp * u, py = POT.rim + 5 + Math.sin(a) * sp * u + 420 * u * u;
      x.fillStyle = k % 3 ? C.rust : C.cream; x.globalAlpha = a0 * (1 - u * u);
      x.beginPath(); x.arc(px, py, 13 * (1 - u * 0.5), 0, Math.PI * 2); x.fill(); outline(x, 3);
    }
  });
  x.globalAlpha = a0;
}

// ── scene 1: the kitchen ──
const ZOOM_IN = 4.3, S2 = 4.62;
function flood(x, colour) {
  x.resetTransform();
  x.fillStyle = colour;
  x.fillRect(0, 0, W, H);
}
// zoom lens: pulls back from the pot at the start, crash-zooms into the soup at the end
function kitchenCamera(t) {
  const pull = seg(t, 0.25, 1.5), crash = seg(t, ZOOM_IN, S2 + 0.2);
  const settle = 1 + 0.75 * (1 - eOut3(pull)) + 0.025 * Math.sin(Math.PI * pull) * (1 - pull);
  const zoom = settle * Math.exp(3.75 * eIn3(crash));
  const fx = POT.x, fy = lerp(800, POT.rim + 10, clamp(3 * crash));
  const centre = eInOut(clamp(1.6 * crash));
  return [zoom, lerp(fx, W / 2, centre) - fx * zoom, lerp(fy, 0.55 * H, centre) - fy * zoom];
}
function kitchenScene(x, t) {
  flood(x, C.cream);
  const [zoom, dx, dy] = kitchenCamera(t);
  x.setTransform(zoom, 0, 0, zoom, dx, dy);
  rays(x, POT.x, 760, 0.06 * t, 0.9);
  rainbow(x, t, 0.55);

  const poses = VEG.map(v => vegPose(v, t));
  VEG.forEach((v, i) => vegShadow(x, v, poses[i]));
  const plopAt = VEG[VEG.length - 1].jump + 0.55 * JUMP_D;
  const puff = Math.exp(-(((t - plopAt - 0.25) / 0.25) ** 2));   // steam burst after the last plop
  const calm = 1 - seg(t, ZOOM_IN - 0.05, ZOOM_IN + 0.12);       // steam and splashes clear for the zoom
  steam(x, t, 0.8 * calm, puff);
  potBack(x, t);
  poses.forEach((p, i) => p && p.inPot && drawVeg(x, VEG[i], p));
  potFront(x);
  poses.forEach((p, i) => p && !p.inPot && drawVeg(x, VEG[i], p));
  x.save(); x.globalAlpha = calm; splash(x, t); x.restore();

  poppedTitle(x, 'SUNDAY', 1040, 200, 135, { at: stagger(t, 1.45, 0.07, 0.5), depth: 7, track: 8 });
  poppedTitle(x, 'KITCHEN', 1040, 378, 185, { at: stagger(t, 1.85, 0.07, 0.5), depth: 9, track: 10 });
  const sub = eOut3(seg(t, 2.75, 3.35));
  if (sub > 0) {
    x.save();
    x.globalAlpha = sub;
    x.font = '400 46px Monoton'; x.letterSpacing = `${lerp(34, 12, sub)}px`;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = C.rust;
    x.fillText('EVERY SUNDAY AT SIX', 1040, 446);
    x.restore();
  }
  twinkles(x, t, [[380, 170, 34, 2.55], [1560, 330, 28, 2.8], [700, 110, 22, 3.05]], 0.12, 7);
  x.resetTransform();
}

// ── scene 2: tonight's recipe ──
const CAKE = { x: 960, top: 640, bot: 900, rx: 250 };
function lemonSlice(x, r) {
  x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.fillStyle = C.lemon; x.fill(); outline(x, 5);
  x.beginPath(); x.arc(0, 0, r * 0.8, 0, Math.PI * 2); x.fillStyle = C.cream; x.fill();
  x.fillStyle = C.lemon;
  for (let i = 0; i < 8; i++) { const a0 = i * Math.PI / 4 + 0.07, a1 = a0 + Math.PI / 4 - 0.14; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, r * 0.72, a0, a1); x.closePath(); x.fill(); }
  x.beginPath(); x.arc(0, 0, r * 0.1, 0, Math.PI * 2); x.fillStyle = C.cream; x.fill();
}
function leafSprig(x, px, py, k) {
  if (k <= 0) return;
  const s = eBack(k);
  x.save(); x.translate(px, py); x.scale(s, s);
  leaf(x, 0, 0, -0.5, 58, 16);
  leaf(x, 0, 0, 0.35, 48, 14);
  x.restore();
}
function cake(x, t) {
  const { x: cx, top, bot, rx } = CAKE, ry = 46;
  // stand
  x.beginPath(); x.moveTo(cx - 60, bot + 14); x.lineTo(cx - 34, bot + 90); x.lineTo(cx - 90, bot + 104); x.lineTo(cx + 90, bot + 104); x.lineTo(cx + 34, bot + 90); x.lineTo(cx + 60, bot + 14); x.closePath();
  x.fillStyle = C.brown2; x.fill(); outline(x);
  x.beginPath(); x.ellipse(cx, bot + 8, rx + 60, 26, 0, 0, Math.PI * 2); x.fillStyle = C.cream2; x.fill(); outline(x);
  // drop + squash
  const dropU = seg(t, 4.95, 5.3), land = t - 5.3;
  if (dropU <= 0) return;
  const y0 = lerp(-900, 0, dropU * dropU);
  const sq = land > 0 ? Math.exp(-land * 7) * Math.cos(land * 26) * 0.14 : -0.05 * dropU;
  x.save(); x.translate(cx, bot + y0); x.scale(1 + sq, 1 - sq); x.translate(-cx, -bot);
  // body: sponge + filling
  const side = (y1, y2, c) => { x.beginPath(); x.moveTo(cx - rx, y1); x.lineTo(cx - rx, y2); x.ellipse(cx, y2, rx, ry, 0, Math.PI, 0, true); x.lineTo(cx + rx, y1); x.ellipse(cx, y1, rx, ry, 0, 0, Math.PI, false); x.closePath(); x.fillStyle = c; x.fill(); };
  side(top, bot, C.mustard);
  side(top + 118, top + 146, C.cream);
  x.save(); side(top, bot, 'rgba(0,0,0,0)'); x.clip();
  x.fillStyle = 'rgba(58,34,22,0.16)'; x.fillRect(cx + rx - 70, top - ry, 70, bot - top + ry * 2 + 4); x.restore();
  x.beginPath(); x.moveTo(cx - rx, top); x.lineTo(cx - rx, bot); x.ellipse(cx, bot, rx, ry, 0, Math.PI, 0, true); x.lineTo(cx + rx, top); outline(x, 7);
  // frosting top with drips
  x.beginPath(); x.moveTo(cx - rx - 6, top);
  const drips = [0.05, 0.16, 0.3, 0.42, 0.57, 0.7, 0.83, 0.95];
  for (let k = 0; k <= 40; k++) {
    const u = k / 40, a = Math.PI - u * Math.PI, ex = cx + Math.cos(a) * (rx + 6), ey = top + Math.sin(a) * (ry + 4);
    let d = 0; drips.forEach((q, j) => { d += (28 + (j % 3) * 22) * Math.exp(-Math.pow((u - q) / 0.035, 2)); });
    x.lineTo(ex, ey + 18 + d);
  }
  x.lineTo(cx + rx + 6, top); x.ellipse(cx, top, rx + 6, ry + 4, 0, 0, Math.PI, true); x.closePath();
  x.fillStyle = C.cream; x.fill(); outline(x, 6);
  // lemon slices land on the beat
  [[-110, 6, 5.5], [0, -10, 5.75], [110, 6, 6.0]].forEach(([dx, dy, t0], j) => {
    const u = seg(t, t0 - 0.3, t0); if (u <= 0) return;
    const l = t - t0, s = l > 0 ? 1 + Math.exp(-l * 9) * Math.sin(l * 30) * 0.18 : 1;
    x.save(); x.translate(cx + dx, top + dy - 700 * (1 - u * u)); x.scale(s, s * 0.5); x.rotate(j * 0.4 + (1 - u) * 3);
    lemonSlice(x, 62); x.restore();
  });
  leafSprig(x, cx + 170, top - 26, seg(t, 6.2, 6.5));
  x.restore();
}
// The title arrives through the zoom lens: three stripe-coloured outline ghosts shrink onto it
// from about three times its size, then the solid title lands with a small overshoot.
function lensTitle(x, text, cx, baseY, size, k) {
  if (k <= 0) return;
  const pivotY = baseY - 0.35 * size;
  const aroundPivot = s => { x.translate(cx, pivotY); x.scale(s, s); x.translate(-cx, -pivotY); };
  const ghosts = [C.brown2, C.rust, C.orange];
  x.save();
  x.font = `900 ${size}px Fraunces`; x.letterSpacing = '4px';
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.lineJoin = 'round'; x.lineWidth = 0.1 * size;
  for (let g = ghosts.length; g >= 1; g--) {
    const kg = clamp(1.3 * k - 0.1 * g);
    if (kg <= 0 || kg >= 1) continue;
    x.save();
    aroundPivot(lerp(3 - 0.35 * g, 1, eOut3(kg)));
    x.globalAlpha = 0.85 * (1 - kg);
    x.strokeStyle = ghosts[g - 1];
    x.strokeText(text, cx, baseY);
    x.restore();
  }
  x.restore();
  const main = clamp(1.3 * k);
  x.save();
  x.globalAlpha = Math.min(1, 3 * main);
  aroundPivot(1 + 1.2 * (1 - eBack(main, 1.5)));
  poppedTitle(x, text, cx, baseY, size, { at: () => 1, depth: 9, track: 4 });
  x.restore();
}
function cakeScene(x, t) {
  flood(x, C.mustard);
  const z = 1 + 0.05 * eInOut(seg(t, S2, DUR));   // slow push-in, centred a little below the middle
  x.setTransform(z, 0, 0, z, 960 * (1 - z), 600 * (1 - z));
  rays(x, 960, 640, -0.08 * t, 0.4);
  // striped tablecloth along the bottom
  [C.cream, C.orange, C.rust, C.brown2].forEach((col, i) => {
    x.fillStyle = col;
    x.fillRect(-100, 948 + 36 * i, W + 200, 37);
  });
  x.fillStyle = 'rgba(58,34,22,0.3)';
  x.beginPath(); x.ellipse(CAKE.x + 12, CAKE.bot + 106, 150, 14, 0, 0, 2 * Math.PI); x.fill();
  cake(x, t);

  const drop = seg(t, 5.55, 6.0);
  if (drop > 0) {
    const label = 'Tonight:';
    x.save();
    x.translate(960, lerp(-100, 150, eBack(drop, 1.6)));
    x.font = '400 96px Shrikhand'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.lineJoin = 'round'; x.lineWidth = 12;
    x.fillStyle = x.strokeStyle = C.rust;
    x.strokeText(label, 7, 7); x.fillText(label, 7, 7);
    x.strokeStyle = C.brown; x.strokeText(label, 0, 0);
    x.fillStyle = C.cream; x.fillText(label, 0, 0);
    x.restore();
  }
  lensTitle(x, 'Lemon Cake', 960, 420, 190, seg(t, 6.0, 6.75));
  twinkles(x, t, [[300, 300, 36, 6.7], [1620, 420, 30, 6.85], [1450, 150, 22, 7.0], [470, 610, 24, 7.1]], 0.14, 6);
  x.resetTransform();
}

// ── transition: four-colour stripe rings iris open from the soup ──
function iris(x, t) {
  const u = eInOut(seg(t, S2 - 0.05, S2 + 0.55));
  const R0 = lerp(0, 1500, u), cx = W / 2, cy = H * 0.55;
  [C.brown2, C.rust, C.orange, C.mustard].forEach((c, i) => {
    const r = R0 - i * 85; if (r <= 0) return;
    x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  });
  const r = R0 - 4 * 85;
  if (r > 0) { x.save(); x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.clip(); cakeScene(x, t); x.restore(); }
}

// ── channel ident (corner bug) ──
function ident(x, t) {
  const u = seg(t, 0.8, 1.2); if (u <= 0) return;
  const s = eBack(u, 2.2), cx = 1700, cy = 132;
  x.save(); x.translate(cx, cy); x.scale(s, s); x.globalAlpha = 0.92;
  x.beginPath(); x.roundRect(-140, -60, 280, 120, 40); x.fillStyle = C.brown; x.fill();
  x.save(); x.beginPath(); x.roundRect(-134, -54, 268, 108, 34); x.clip();
  x.fillStyle = C.cream; x.fillRect(-140, -60, 280, 120);
  STRIPES.forEach((c, i) => { x.fillStyle = c; x.fillRect(-140, 2 + i * 14, 154, 14); });
  x.restore();
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.lineJoin = 'round';
  x.font = '700 21px Fredoka'; x.fillStyle = C.brown; x.letterSpacing = '3px'; x.fillText('CHANNEL', -58, -16);
  x.letterSpacing = '0px'; x.font = '900 100px Fraunces';
  x.fillStyle = C.rust; x.fillText('7', 78 + 5, 36 + 5);
  x.strokeStyle = C.brown; x.lineWidth = 8; x.strokeText('7', 78, 36); x.fillStyle = C.cream; x.fillText('7', 78, 36);
  x.restore();
}

// ── final picture: old-TV treatment over the scene ──
const SPLIT = [['#f00', -1, 0], ['#0f0', 0, 0], ['#00f', 1, 1]];   // channel mask, x shift sign, y shift
const planes = SPLIT.map(() => surface(W, H));
// run paint() on the output with a blend mode and opacity, then restore normal drawing
function blend(mode, alpha, paint) {
  Object.assign(ctx, { globalCompositeOperation: mode, globalAlpha: alpha });
  paint();
  Object.assign(ctx, { globalCompositeOperation: 'source-over', globalAlpha: 1 });
}
function wash(colour) {
  ctx.fillStyle = colour;
  ctx.fillRect(0, 0, W, H);
}
const SLIPS = [[0.62, 0.1], [S2 + 0.02, 0.12], [7.9, 0.08]];       // tracking glitches [start, length]

function paintScene(t) {
  const phase = t < S2 - 0.05 ? 'kitchen' : t < S2 + 0.6 ? 'iris' : 'cake';
  if (phase !== 'cake') kitchenScene(sx, t);
  if (phase === 'iris') iris(sx, t);
  if (phase === 'cake') cakeScene(sx, t);
  sx.resetTransform();
  ident(sx, t);
}
// a few horizontal bands slip sideways for a few frames
function trackingSlip(t) {
  if (!SLIPS.some(([a, len]) => t >= a && t < a + len)) return false;
  const rand = rng(7 * Math.floor(30 * t) + 3);
  for (let n = 0; n < 3; n++) {
    const top = H * rand(), tall = 20 + 90 * rand(), slide = 70 * (rand() - 0.5);
    sx.drawImage(scene, 0, top, W, tall, slide, top, W, tall);
  }
  return true;
}
// split the scene into R, G and B and add them back slightly misregistered
function misregister(px) {
  planes.forEach((plane, i) => {
    const g = plane.getContext('2d');
    g.globalCompositeOperation = 'copy'; g.fillStyle = SPLIT[i][0]; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'multiply'; g.drawImage(scene, 0, 0);
  });
  blend('copy', 1, () => wash('#000'));
  blend('lighter', 1, () => planes.forEach((plane, i) => ctx.drawImage(plane, SPLIT[i][1] * px, SPLIT[i][2])));
}
// the picture opens from a thin bright line as the set warms up
function switchOn(t) {
  const wide = eOut3(seg(t, 0, 0.2)), tall = eOut3(seg(t, 0.18, 0.55)), glow = 1 - seg(t, 0.2, 0.6);
  const w = Math.max(6, W * wide), h = Math.max(3, H * tall), x0 = (W - w) / 2, y0 = (H - h) / 2;
  const hold = planes[0].getContext('2d');
  hold.globalCompositeOperation = 'copy'; hold.drawImage(out, 0, 0);
  wash('#060302');
  ctx.drawImage(planes[0], x0, y0, w, h);
  blend('lighter', 0.7 * glow, () => { ctx.fillStyle = '#fff4e0'; ctx.fillRect(x0, y0, w, h); });
}
function compose(t) {
  paintScene(t);
  const glitching = trackingSlip(t);
  misregister(glitching ? 9 : 3);
  blend('multiply', 1, () => ctx.drawImage(SCAN, 0, 0));
  // grain refreshes at 15 fps; the same random stream also drives a faint flicker
  const tick = Math.floor(15 * t), rand = rng(13 * tick + 1);
  const tile = GRAIN[tick % GRAIN.length], gx = -60 * rand(), gy = -60 * rand();
  blend('overlay', 0.2, () => ctx.drawImage(tile, gx, gy, 2 * W + 120, 2 * H + 120));
  blend('soft-light', 1, () => wash('rgba(200,120,50,0.25)'));   // warm cast
  wash(`rgba(255,235,200,${0.025 + 0.02 * rand()})`);
  if (t < 0.6) switchOn(t);
  ctx.drawImage(TUBE, 0, 0);
  const dark = eInOut(seg(t, 9.12, 9.96));   // soft fade to black at the end
  if (dark > 0) wash(`rgba(11,6,4,${dark})`);
}

const FACES = ['900 100px Fraunces', '400 100px Shrikhand', '400 100px Monoton', '700 30px Fredoka'];
async function prepare() {
  const sample = 'SUNDAY KITCHEN EVERY AT SIX Tonight: Lemon Cake CHANNEL 7';
  for (const face of FACES) await document.fonts.load(face, sample);
  return document.fonts.ready.then(() => {
    SCAN = scanlines();
    TUBE = tubeMask();
    GRAIN = [0, 1, 2, 3, 4, 5].map(n => noiseTile(101 * n + 7));
    return true;
  });
}
window.ready = prepare();
window.draw = ({ t }) => {
  compose(t);
  const url = out.toDataURL('image/jpeg', 0.92);
  return url.slice(url.indexOf(',') + 1);
};
// sound cues: TV on, ident, vegetable landings and bounces, hops and plops, letter pops,
// zoom whoosh, iris, cake thump, lemon dings, title chime, fade
function soundCues() {
  const cue = (t, k, v) => v === undefined ? { t, k } : { t, k, v };
  const list = [cue(0.02, 'on'), cue(0.8, 'ident'), cue(ZOOM_IN, 'whoosh'), cue(S2 - 0.05, 'iris'),
    cue(5.3, 'thump'), cue(6.0, 'chime'), cue(9.12, 'fade')];
  VEG.forEach((veg, n) => {
    list.push(cue(veg.land, 'land', n));
    for (let b = veg.land + BEAT; b < veg.jump - 0.01; b += BEAT) list.push(cue(b, 'bounce', n));
    list.push(cue(veg.jump, 'hop', n), cue(veg.jump + JUMP_D * 0.55, 'plop', n));
  });
  for (let n = 0; n < 6; n++) list.push(cue(1.5 + n * 0.07, 'pop', n));
  for (let n = 0; n < 7; n++) list.push(cue(1.9 + n * 0.07, 'pop', n + 3));
  [5.5, 5.75, 6.0].forEach((when, n) => list.push(cue(when, 'ding', n)));
  return list;
}
window.events = soundCues;
</script>
