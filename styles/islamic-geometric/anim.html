<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── islamic-geometric · a star-and-polygon tile panel built with compass and straightedge ──────────
// A compass swings one circle on bare plaster → diameters, two squares (the eight-point star) and the
// octagon → the square-octagon lattice spreads across the wall → star-and-polygon lines ink in from
// every edge midpoint (polygons-in-contact construction) → the tiles glaze in, cobalt, turquoise,
// white and ochre, set in white grout → the camera pulls back: the field is the panel of a pointed arch
// with banded voussoirs and a framed border → a ring is scribed at the centre and the eight-fold rosette
// turns into a ten-fold one → a raking light passes over the glaze → fade out.
// Purely geometric: no script or religious text. Everything is seeded; each frame depends only on t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sstep = u => { u = clamp(u); return u * u * (3 - 2 * u); };
const smoother = u => { u = clamp(u); return u * u * u * (u * (u * 6 - 15) + 10); };
const eOut = u => 1 - Math.pow(1 - clamp(u), 3);
const eIn = u => Math.pow(clamp(u), 3);
const backOut = (u, k = 1.7) => { u = clamp(u) - 1; return 1 + u * u * ((k + 1) * u + k); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rgb = (c, a = 1) => `rgba(${c.map(v => Math.round(clamp(v, 0, 255))).join(',')},${a})`;
const mix = (a, b, u) => a.map((v, i) => v + (b[i] - v) * u);

// ── world layout (world units ≈ final screen pixels; P = centre of the panel) ──
const PER = 110;                                   // lattice period of the square-octagon tiling
const ARCH = { a: 240, c: 96, ys: -120, bot: 360, band: 40 };
ARCH.r = ARCH.a + ARCH.c;
const ALF = { x: 306, top: -505, bot: 360, w: 28 };
const RM = 150;                                    // medallion radius

// ── polygons-in-contact (Hankin) construction ──
function regPoly(cx, cy, n, R, rot) { const v = []; for (let k = 0; k < n; k++) { const a = rot + k * TAU / n; v.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]); } return v; }
function ccw(v) { let s = 0; for (let i = 0; i < v.length; i++) { const a = v[i], b = v[(i + 1) % v.length]; s += a[0] * b[1] - b[0] * a[1]; } return s > 0 ? v : v.slice().reverse(); }
function rayX(p, d, q, e) {   // p + s d = q + u e
  const den = d[0] * e[1] - d[1] * e[0]; if (Math.abs(den) < 1e-9) return null;
  const s = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / den, u = ((q[0] - p[0]) * d[1] - (q[1] - p[1]) * d[0]) / den;
  if (s <= 0 || u <= 0) return null; return [p[0] + s * d[0], p[1] + s * d[1]];
}
function hankin(v, th, out, tag) {
  v = ccw(v); const n = v.length, M = [], A = [], B = [], Xs = [];
  for (let k = 0; k < n; k++) {
    const a = v[k], b = v[(k + 1) % n], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const d = [(b[0] - a[0]) / L, (b[1] - a[1]) / L], nn = [-d[1], d[0]];
    M.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
    A.push([Math.cos(th) * d[0] + Math.sin(th) * nn[0], Math.cos(th) * d[1] + Math.sin(th) * nn[1]]);
    B.push([-Math.cos(th) * d[0] + Math.sin(th) * nn[0], -Math.cos(th) * d[1] + Math.sin(th) * nn[1]]);
  }
  for (let k = 0; k < n; k++) {
    const k1 = (k + 1) % n, X = rayX(M[k], A[k], M[k1], B[k1]); if (!X) continue;
    out.push({ a: M[k], b: X, tag }, { a: M[k1], b: X, tag }); Xs.push(X);
  }
  return Xs;
}
function rosette(v, th, out, tag) {   // star + an inner polygon through its concave corners + a second, smaller star
  const X = hankin(v, th, out, tag);
  for (let k = 0; k < X.length; k++) out.push({ a: X[k], b: X[(k + 1) % X.length], tag: tag + 'i' });
  hankin(X, th, out, tag + 'c');
}
// planar arrangement → faces
function faces(segs) {
  const key = p => Math.round(p[0] * 50) + ',' + Math.round(p[1] * 50);
  const id = new Map(), pts = [];
  const node = p => { const k = key(p); let i = id.get(k); if (i === undefined) { i = pts.length; id.set(k, i); pts.push(p); } return i; };
  const G = 24, grid = new Map(), ts = segs.map(() => [0, 1]);
  segs.forEach((s, i) => {
    const x0 = Math.floor(Math.min(s.a[0], s.b[0]) / G), x1 = Math.floor(Math.max(s.a[0], s.b[0]) / G);
    const y0 = Math.floor(Math.min(s.a[1], s.b[1]) / G), y1 = Math.floor(Math.max(s.a[1], s.b[1]) / G);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) { const k = x + ',' + y; if (!grid.has(k)) grid.set(k, []); grid.get(k).push(i); }
  });
  const done = new Set();
  for (const list of grid.values()) for (let m = 0; m < list.length; m++) for (let n = m + 1; n < list.length; n++) {
    const i = list[m], j = list[n], pk = i * 100000 + j; if (done.has(pk)) continue; done.add(pk);
    const p = segs[i].a, r = [segs[i].b[0] - p[0], segs[i].b[1] - p[1]], q = segs[j].a, e = [segs[j].b[0] - q[0], segs[j].b[1] - q[1]];
    const den = r[0] * e[1] - r[1] * e[0]; if (Math.abs(den) < 1e-9) continue;
    const s = ((q[0] - p[0]) * e[1] - (q[1] - p[1]) * e[0]) / den, u = ((q[0] - p[0]) * r[1] - (q[1] - p[1]) * r[0]) / den;
    const eps = 1e-6; if (s < -eps || s > 1 + eps || u < -eps || u > 1 + eps) continue;
    ts[i].push(clamp(s)); ts[j].push(clamp(u));
  }
  const adj = new Map(), edges = [];
  const link = (a, b) => { if (a === b) return; if (!adj.has(a)) adj.set(a, new Set()); if (!adj.has(b)) adj.set(b, new Set()); if (!adj.get(a).has(b)) { adj.get(a).add(b); adj.get(b).add(a); edges.push([a, b]); } };
  segs.forEach((s, i) => {
    const T = ts[i].sort((x, y) => x - y); let prev = null;
    for (const u of T) { const n = node([lerp(s.a[0], s.b[0], u), lerp(s.a[1], s.b[1], u)]); if (prev !== null) link(prev, n); prev = n; }
  });
  const nb = new Map();
  for (const [a, set] of adj) nb.set(a, [...set].sort((x, y) => Math.atan2(pts[x][1] - pts[a][1], pts[x][0] - pts[a][0]) - Math.atan2(pts[y][1] - pts[a][1], pts[y][0] - pts[a][0])));
  const seen = new Set(), out = [], NN = pts.length + 1;
  for (const [a0, b0] of edges) for (const [u0, v0] of [[a0, b0], [b0, a0]]) {
    if (seen.has(u0 * NN + v0)) continue;
    const poly = []; let u = u0, v = v0, guard = 0;
    while (guard++ < 400) {
      seen.add(u * NN + v); poly.push(u);
      const L = nb.get(v), i = L.indexOf(u), w = L[(i - 1 + L.length) % L.length];
      u = v; v = w; if (u === u0 && v === v0) break;
    }
    let ar = 0; for (let i = 0; i < poly.length; i++) { const p = pts[poly[i]], q = pts[poly[(i + 1) % poly.length]]; ar += p[0] * q[1] - q[0] * p[1]; }
    out.push({ v: poly.map(i => pts[i]), area: ar / 2 });
  }
  return { faces: out, edges: edges.map(([a, b]) => [pts[a], pts[b]]) };
}
</script>
<script>
// ── build the 8-fold field ──
const TH8 = 67.5 * Math.PI / 180;
const EO = PER / (1 + Math.SQRT2), RO = PER / 2 / Math.cos(Math.PI / 8);
const segs8 = [], polys8 = [];
for (let i = -4; i <= 4; i++) for (let j = -6; j <= 5; j++) {
  const o = regPoly(i * PER, j * PER, 8, RO, Math.PI / 8); polys8.push(o); rosette(o, TH8, segs8, 'o');
  const s = regPoly((i + .5) * PER, (j + .5) * PER, 4, EO / Math.SQRT2, 0); polys8.push(s); hankin(s, TH8, segs8, 's');
}
const F8 = faces(segs8);
// ── build the 10-fold medallion: a decagon ringed by ten pentagons ──
const TH10 = 72 * Math.PI / 180;
const D10 = (RM - 4) / 3.0777, RD = D10 / (2 * Math.sin(Math.PI / 10));
const dec = regPoly(0, 0, 10, RD, -Math.PI / 2), segs10 = [], polys10 = [dec];
rosette(dec, TH10, segs10, 'd');
for (let k = 0; k < 10; k++) {
  const A = dec[k], B = dec[(k + 1) % 10], p = [B, A];          // pentagon grown outward on edge A-B
  let dir = [A[0] - B[0], A[1] - B[1]];
  const turn = TAU / 5 * Math.sign((B[0] - A[0]) * (0 - A[1]) - (B[1] - A[1]) * (0 - A[0]) || 1);
  for (let m = 2; m < 5; m++) { const c = Math.cos(turn), sn = Math.sin(turn); dir = [dir[0] * c - dir[1] * sn, dir[0] * sn + dir[1] * c]; const q = p[m - 1]; p.push([q[0] + dir[0], q[1] + dir[1]]); }
  polys10.push(p); hankin(p, TH10, segs10, 'p');
}
const F10 = faces(segs10);
</script>
