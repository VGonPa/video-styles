<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── frutiger-aero · "Connect. Share. Smile." — a fictional 2006-era messenger launch ──────────────────────────
// Scene A (nature): bright sky, drifting clouds, sun + lens flare, aurora ribbons, glossy green hills and leaves,
// rising soap bubbles. Three glossy gel icons (chat, share, smile) drop in with jelly squash, their words stagger in,
// a sunbeam sweeps across them, then each icon squashes and pops into spray.
// Transition: a big glass droplet falls, splashes (crown of droplets) and its ripple ring wipes open scene B.
// Scene B (launch): aqua studio with Vista-style swooshes and a glossy reflective floor. A white glossy handheld
// surfaces from the floor, the "Bubblio" wordmark bounces in letter by letter, three chat bubbles pop on the device
// in sync with "Connect. / Share. / Smile.", a gel pill button and a "beta!" starburst bounce in, the button is
// pressed (bubbles burst out), a sunbeam sweeps across, and the frame blooms out to white.
// Textures (sky, clouds, hills, leaves, icons, device, bubble sprite) are rendered once; the frame depends only on t.
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eBack = (u, s = 1.8) => { u = clamp(u); return 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2); };
const SANS = '"Open Sans"', ROUND = '"Nunito"';
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function spring(u, f = 1.6, z = 0.5) {
  if (u <= 0) return 0;
  const w = TAU * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u));
}
// jelly wobble: positive right after impact (wide & short), decaying
const jel = (u, amp = .24, f = 3.4, d = 5.5) => u <= 0 ? 0 : amp * Math.exp(-d * u) * Math.sin(TAU * f * u + 0.35);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function lg(g, x0, y0, x1, y1, stops) { const q = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => q.addColorStop(o, c)); return q; }
function rg(g, x, y, r0, r1, stops, x1 = x, y1 = y) { const q = g.createRadialGradient(x, y, r0, x1, y1, r1); stops.forEach(([o, c]) => q.addColorStop(o, c)); return q; }

// ── timeline ──
const T = {
  icon: [0.62, 0.9, 1.18], word: [0.98, 1.26, 1.54], sweepA: 2.05, iconPop: [3.0, 3.1, 3.2],
  dropStart: 3.2, impact: 3.62, wipeEnd: 4.55,
  device: 3.9, logo: 4.75, line: [5.4, 5.85, 6.3], button: 6.85, beta: 7.2, press: 7.7,
  sweepB: 8.05, chord: 8.3, fadeA: 9.15, fadeB: 9.97
};
const ICX = [600, 960, 1320], ICY = 440, IS = 236;         // scene A icon row
const IMP = { x: 960, y: 610 };                               // droplet impact / ripple centre

// ── precomputed textures ──
let SKY, CLOUDS = [], HILLS, LEAF, ICONS = [], BUB, BGB, DEVICE, LETTERS = [], MINI;
const PAL = [
  { a: '#c9f1ff', b: '#3db7f7', c: '#0a62c9', rim: '#0a4f9e', glow: '#8ff0ff' },   // blue  · Connect
  { a: '#e2ffb0', b: '#63cf23', c: '#1f850c', rim: '#1a6a0a', glow: '#d4ff7a' },   // green · Share
  { a: '#fff0a8', b: '#ffac24', c: '#e26206', rim: '#b44d05', glow: '#ffe07a' },   // orange· Smile
];
function gel(g, x, y, w, h, r, p, opt = {}) {
  // glossy skeuomorphic tile: saturated body, inner bottom glow, strong top highlight, dark rim
  g.save();
  rr(g, x, y, w, h, r); g.fillStyle = lg(g, 0, y, 0, y + h, [[0, p.a], [0.5, p.b], [1, p.c]]); g.fill();
  g.save(); rr(g, x, y, w, h, r); g.clip();
  g.fillStyle = rg(g, x + w / 2, y + h * 1.05, 0, h * .65, [[0, p.glow], [1, 'rgba(255,255,255,0)']]); g.globalAlpha = .75; g.fillRect(x, y, w, h); g.globalAlpha = 1;
  if (opt.glyph) opt.glyph(g);
  const hi = opt.hi ?? 0.5;
  rr(g, x + w * .06, y + h * .035, w * .88, h * hi, Math.min(r * .9, h * hi / 2));
  g.fillStyle = lg(g, 0, y, 0, y + h * hi, [[0, 'rgba(255,255,255,0.95)'], [0.55, 'rgba(255,255,255,0.45)'], [1, 'rgba(255,255,255,0.08)']]); g.fill();
  g.restore();
  rr(g, x + 1.5, y + 1.5, w - 3, h - 3, r); g.lineWidth = 3; g.strokeStyle = p.rim; g.globalAlpha = .7; g.stroke();
  rr(g, x + 5, y + 5, w - 10, h - 10, r - 4); g.lineWidth = 2; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.globalAlpha = 1; g.stroke();
  g.restore();
}
function glyphShadow(g, on) { if (on) { g.shadowColor = 'rgba(0,40,90,0.35)'; g.shadowBlur = 10; g.shadowOffsetY = 4; } else { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; } }
function drawChat(g, cx, cy, s) {
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(cx - s * .1, cy - s * .08, s * .34, s * .26, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(cx - s * .3, cy + s * .06); g.lineTo(cx - s * .38, cy + s * .26); g.lineTo(cx - s * .14, cy + s * .14); g.fill();
  g.globalAlpha = .8; g.beginPath(); g.ellipse(cx + s * .16, cy + s * .14, s * .25, s * .19, 0, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(cx + s * .3, cy + s * .24); g.lineTo(cx + s * .38, cy + s * .38); g.lineTo(cx + s * .18, cy + s * .3); g.fill(); g.globalAlpha = 1;
}
function drawShare(g, cx, cy, s, col = '#fff') {
  const P = [[cx - s * .22, cy + s * .02], [cx + s * .22, cy - s * .22], [cx + s * .22, cy + s * .26]];
  g.strokeStyle = col; g.lineWidth = s * .075; g.lineCap = 'round';
  g.beginPath(); g.moveTo(...P[1]); g.lineTo(...P[0]); g.lineTo(...P[2]); g.stroke();
  g.fillStyle = col; P.forEach(([x, y]) => { g.beginPath(); g.arc(x, y, s * .12, 0, TAU); g.fill(); });
}
function drawSmile(g, cx, cy, s, col = '#fff', bg = null) {
  g.fillStyle = col; g.beginPath(); g.arc(cx, cy, s * .34, 0, TAU); g.fill();
  g.fillStyle = bg || '#e87a0c'; g.strokeStyle = bg || '#e87a0c';
  g.beginPath(); g.ellipse(cx - s * .11, cy - s * .08, s * .04, s * .065, 0, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(cx + s * .11, cy - s * .08, s * .04, s * .065, 0, 0, TAU); g.fill();
  g.lineWidth = s * .055; g.lineCap = 'round'; g.beginPath(); g.arc(cx, cy + s * .02, s * .19, .18 * Math.PI, .82 * Math.PI); g.stroke();
}
const GLYPH = [drawChat, (g, cx, cy, s) => drawShare(g, cx, cy, s), (g, cx, cy, s) => drawSmile(g, cx, cy, s, '#fff', '#ef7f0e')];

function buildSky() {
  SKY = mk(W, H); const g = SKY.getContext('2d');
  g.fillStyle = lg(g, 0, 0, 0, H, [[0, '#0661cf'], [0.38, '#2aa3f2'], [0.66, '#8fdcff'], [0.86, '#d9f6ff'], [1, '#f2fdff']]); g.fillRect(0, 0, W, H);
  g.fillStyle = rg(g, 1560, 150, 0, 760, [[0, 'rgba(255,255,255,0.9)'], [0.12, 'rgba(255,255,240,0.55)'], [0.4, 'rgba(210,245,255,0.18)'], [1, 'rgba(255,255,255,0)']]); g.fillRect(0, 0, W, H);
  // cloud sprites
  const rnd = mulberry(7);
  for (let k = 0; k < 4; k++) {
    const c = mk(900, 460), q = c.getContext('2d'); q.translate(70, 110);
    q.filter = 'blur(14px)';
    const n = 9 + k;
    for (let i = 0; i < n; i++) {
      const u = i / (n - 1), x = 110 + u * 540 + (rnd() - .5) * 40, r = 60 + Math.sin(u * Math.PI) * 70 + rnd() * 30, y = 230 - r * .6 - Math.sin(u * Math.PI) * 30;
      q.fillStyle = rg(q, x, y - r * .3, 0, r * 1.1, [[0, '#ffffff'], [0.7, '#f4fbff'], [1, '#d6ecfa']]);
      q.beginPath(); q.arc(x, y, r, 0, TAU); q.fill();
    }
    q.fillStyle = 'rgba(190,220,240,0.45)'; q.beginPath(); q.ellipse(380, 245, 280, 26, 0, 0, TAU); q.fill();
    q.filter = 'none';
    CLOUDS.push(c);
  }
}
function crest(x, k) { // hill silhouette heights
  return k === 0 ? 770 - 60 * Math.sin(x / 520 + .6) - 28 * Math.sin(x / 190 + 1.3)
    : 850 - 70 * Math.sin(x / 640 + 2.2) - 22 * Math.sin(x / 230 + .2);
}
function buildHills() {
  HILLS = mk(W + 200, H); const g = HILLS.getContext('2d'); const off = 100;
  const rnd = mulberry(31);
  [[0, ['#b9f07a', '#62c227', '#2e8c10']], [1, ['#9fe64a', '#46b014', '#1c6e08']]].forEach(([k, cs]) => {
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 200; x += 8) g.lineTo(x, crest(x - off, k));
    g.lineTo(W + 200, H); g.closePath();
    g.fillStyle = lg(g, 0, 700 + k * 80, 0, H, [[0, cs[0]], [0.25, cs[1]], [1, cs[2]]]); g.fill();
    // glossy crest highlight
    g.save(); g.clip();
    g.filter = 'blur(10px)'; g.lineWidth = 34; g.strokeStyle = 'rgba(255,255,230,0.5)';
    g.beginPath(); for (let x = 0; x <= W + 200; x += 8) { const y = crest(x - off, k) + 14; x ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
    g.filter = 'none';
    g.restore();
    // grass blades along the crest
    for (let i = 0; i < (k ? 520 : 260); i++) {
      const x = rnd() * (W + 200), y = crest(x - off, k) + rnd() * 10 + 4, h = 14 + rnd() * (k ? 34 : 18), lean = (rnd() - .5) * 14;
      g.fillStyle = rnd() < .5 ? (k ? '#2f9612' : '#56b322') : (k ? '#8ee23c' : '#a8ec66');
      g.beginPath(); g.moveTo(x - 3, y); g.quadraticCurveTo(x + lean * .3, y - h * .6, x + lean, y - h); g.quadraticCurveTo(x + lean * .2 + 1, y - h * .5, x + 3, y); g.fill();
    }
  });
  // dew droplets on the front hill
  for (let i = 0; i < 26; i++) {
    const x = 60 + rnd() * (W + 80), y = crest(x - off, 1) + 30 + rnd() * 160, r = 4 + rnd() * 7;
    g.fillStyle = rg(g, x - r * .3, y - r * .3, 0, r, [[0, 'rgba(255,255,255,0.95)'], [0.5, 'rgba(210,255,190,0.5)'], [1, 'rgba(40,120,20,0.25)']]);
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
}
function buildLeaf() {
  LEAF = mk(520, 260); const g = LEAF.getContext('2d');
  g.beginPath(); g.moveTo(10, 130); g.bezierCurveTo(120, 10, 380, 0, 510, 120); g.bezierCurveTo(380, 250, 120, 250, 10, 130); g.closePath();
  g.fillStyle = lg(g, 0, 20, 0, 240, [[0, '#c8ff7a'], [0.45, '#5fcf1e'], [1, '#1f7a08']]); g.fill();
  g.save(); g.clip();
  g.fillStyle = lg(g, 0, 20, 0, 130, [[0, 'rgba(255,255,255,0.8)'], [1, 'rgba(255,255,255,0)']]);
  g.beginPath(); g.moveTo(40, 120); g.bezierCurveTo(140, 30, 360, 22, 480, 112); g.bezierCurveTo(360, 80, 140, 90, 40, 120); g.fill();
  g.strokeStyle = 'rgba(230,255,190,0.8)'; g.lineWidth = 5; g.beginPath(); g.moveTo(10, 130); g.quadraticCurveTo(260, 118, 505, 121); g.stroke();
  g.lineWidth = 2.5; for (let i = 1; i < 8; i++) { const x = 40 + i * 58; g.beginPath(); g.moveTo(x, 126); g.quadraticCurveTo(x + 30, 100, x + 60, 62 + i * 2); g.moveTo(x, 128); g.quadraticCurveTo(x + 30, 156, x + 60, 196 - i * 2); g.stroke(); }
  g.restore();
  g.strokeStyle = 'rgba(20,90,5,0.6)'; g.lineWidth = 3; g.beginPath(); g.moveTo(10, 130); g.bezierCurveTo(120, 10, 380, 0, 510, 120); g.bezierCurveTo(380, 250, 120, 250, 10, 130); g.stroke();
}
function buildIcons() {
  for (let i = 0; i < 3; i++) {
    const c = mk(360, 360), g = c.getContext('2d'), o = 50, s = 260;
    gel(g, o, o, s, s, 62, PAL[i], { glyph: q => { glyphShadow(q, 1); GLYPH[i](q, o + s / 2, o + s / 2 + 8, s * .95); glyphShadow(q, 0); }, hi: .48 });
    ICONS.push(c);
  }
}
function buildBubble() {
  BUB = mk(256, 256); const g = BUB.getContext('2d'), c = 128, r = 120;
  g.fillStyle = rg(g, c, c, r * .55, r, [[0, 'rgba(255,255,255,0.02)'], [0.75, 'rgba(200,245,255,0.18)'], [0.93, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)']]);
  g.beginPath(); g.arc(c, c, r, 0, TAU); g.fill();
  // iridescent rim tints
  g.globalCompositeOperation = 'lighter';
  [['rgba(255,120,220,0.22)', -2.3], ['rgba(120,255,200,0.2)', .6], ['rgba(255,240,120,0.18)', 1.8]].forEach(([col, a]) => {
    g.strokeStyle = col; g.lineWidth = 7; g.beginPath(); g.arc(c, c, r - 7, a, a + 1.4); g.stroke();
  });
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = rg(g, c - 44, c - 50, 0, 40, [[0, 'rgba(255,255,255,0.95)'], [1, 'rgba(255,255,255,0)']]);
  g.beginPath(); g.ellipse(c - 40, c - 48, 38, 24, -.7, 0, TAU); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.7)'; g.beginPath(); g.arc(c + 50, c + 56, 9, 0, TAU); g.fill();
}
function buildSceneB() {
  BGB = mk(W, H); const g = BGB.getContext('2d');
  g.fillStyle = lg(g, 0, 0, 0, 860, [[0, '#0453b8'], [0.45, '#1b94e6'], [0.85, '#7fd6ff'], [1, '#c8f2ff']]); g.fillRect(0, 0, W, 860);
  g.fillStyle = rg(g, 1380, 470, 0, 760, [[0, 'rgba(255,255,255,0.75)'], [0.3, 'rgba(200,245,255,0.35)'], [1, 'rgba(255,255,255,0)']]); g.fillRect(0, 0, W, 860);
  g.fillStyle = rg(g, 260, 60, 0, 700, [[0, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)']]); g.fillRect(0, 0, W, 860);
  // bokeh
  const rnd = mulberry(99);
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 36; i++) {
    const x = rnd() * W, y = 60 + rnd() * 700, r = 14 + rnd() * 60;
    g.fillStyle = rg(g, x, y, 0, r, [[0, 'rgba(200,245,255,0.10)'], [0.8, 'rgba(200,245,255,0.07)'], [1, 'rgba(200,245,255,0)']]);
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  // floor
  g.fillStyle = lg(g, 0, 860, 0, H, [[0, '#e9fbff'], [0.12, '#bdeeff'], [1, '#5cc2f0']]); g.fillRect(0, 860, W, H - 860);
  g.fillStyle = lg(g, 0, 852, 0, 872, [[0, 'rgba(255,255,255,0)'], [0.5, 'rgba(255,255,255,0.9)'], [1, 'rgba(255,255,255,0)']]); g.fillRect(0, 852, W, 20);
}
const DW = 420, DH = 690, DPAD = 90;
function buildDevice() {
  DEVICE = mk(DW + DPAD * 2, DH + DPAD * 2); const g = DEVICE.getContext('2d'), x = DPAD, y = DPAD;
  rr(g, x, y, DW, DH, 78);
  g.fillStyle = lg(g, x, 0, x + DW, 0, [[0, '#dfe9f2'], [0.18, '#ffffff'], [0.7, '#f3f8fc'], [1, '#bccbd9']]); g.fill();
  g.save(); rr(g, x, y, DW, DH, 78); g.clip();
  g.fillStyle = lg(g, 0, y, 0, y + DH, [[0, 'rgba(255,255,255,0.6)'], [0.5, 'rgba(255,255,255,0)'], [1, 'rgba(120,160,200,0.25)']]); g.fillRect(x, y, DW, DH);
  g.restore();
  rr(g, x + 2, y + 2, DW - 4, DH - 4, 76); g.lineWidth = 5; g.strokeStyle = lg(g, 0, y, 0, y + DH, [[0, '#9fdcff'], [0.5, '#4aa9e8'], [1, '#8ad0ff']]); g.stroke();
  // speaker slot
  rr(g, x + DW / 2 - 50, y + 34, 100, 12, 6); g.fillStyle = lg(g, 0, y + 34, 0, y + 46, [[0, '#8ea3b5'], [1, '#d7e3ee']]); g.fill();
  // screen bezel
  rr(g, x + 30, y + 70, DW - 60, 480, 26); g.fillStyle = '#11202e'; g.fill();
  // home button orb
  const hx = x + DW / 2, hy = y + 620, hr = 44;
  g.fillStyle = rg(g, hx, hy + 12, 4, hr, [[0, '#9ff4ff'], [0.55, '#1aa6ec'], [1, '#0659b3']]); g.beginPath(); g.arc(hx, hy, hr, 0, TAU); g.fill();
  g.lineWidth = 3; g.strokeStyle = '#0a5aa8'; g.stroke();
  g.fillStyle = lg(g, 0, hy - hr, 0, hy, [[0, 'rgba(255,255,255,0.95)'], [1, 'rgba(255,255,255,0.1)']]); g.beginPath(); g.ellipse(hx, hy - hr * .45, hr * .72, hr * .42, 0, 0, TAU); g.fill();
  drawSmile(g, hx, hy + 4, 34, 'rgba(255,255,255,0.9)', '#1b8fd8');
}
function buildLetters() {
  const word = 'Bubblio', fs = 170;
  const m = mk(10, 10).getContext('2d'); m.font = `900 ${fs}px ${ROUND}`;
  let x = 0;
  for (const ch of word) {
    const w = m.measureText(ch).width, c = mk(Math.ceil(w) + 60, fs * 1.5), g = c.getContext('2d');
    g.font = `900 ${fs}px ${ROUND}`; g.textBaseline = 'alphabetic';
    const by = fs * 1.12;
    g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = '#0a4fa8'; g.strokeText(ch, 30, by);
    g.fillStyle = lg(g, 0, by - fs * .75, 0, by, [[0, '#ffffff'], [0.5, '#c6f3ff'], [0.52, '#5fd0ff'], [1, '#1b8fe8']]); g.fillText(ch, 30, by);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(0, by - fs * .78, c.width, fs * .3);
    g.globalCompositeOperation = 'source-over';
    LETTERS.push({ c, x, w, by });
    x += w - 4;
  }
  LETTERS.total = x;
}
function buildMini() { // tiny photo for the "Share" chat bubble
  MINI = mk(180, 110); const g = MINI.getContext('2d');
  g.fillStyle = lg(g, 0, 0, 0, 110, [[0, '#1b86e8'], [0.6, '#9fe3ff'], [1, '#e8fbff']]); g.fillRect(0, 0, 180, 110);
  g.fillStyle = rg(g, 140, 26, 0, 40, [[0, 'rgba(255,255,230,1)'], [0.4, 'rgba(255,250,200,0.6)'], [1, 'rgba(255,255,255,0)']]); g.fillRect(0, 0, 180, 110);
  g.fillStyle = '#fff'; [[40, 32, 16], [58, 28, 20], [76, 34, 14]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); });
  g.fillStyle = lg(g, 0, 70, 0, 110, [[0, '#9fe64a'], [1, '#2c8a0e']]); g.beginPath(); g.moveTo(0, 110); g.lineTo(0, 80); g.quadraticCurveTo(70, 56, 180, 84); g.lineTo(180, 110); g.fill();
}

// ── bubbles (rising, some pop) ──
function makeBubbles(seed, n) {
  const rnd = mulberry(seed), a = [];
  for (let i = 0; i < n; i++) {
    const r = 10 + Math.pow(rnd(), 2.2) * 62, sp = 70 + rnd() * 90 + (60 - r) * 1.2;
    const t0 = -8 + rnd() * 18, x0 = rnd() * W, life = 1.8 + rnd() * 7;
    a.push({ r, sp, t0, x0, life, ph: rnd() * TAU, wob: 10 + rnd() * 22, pop: rnd() < .55 });
  }
  return a;
