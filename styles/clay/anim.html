<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>clay</title>
<link rel="stylesheet" href="fonts.css">
<style>html, body { margin: 0; background: #000; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* CLAY stop-motion: "The tiny gardener" (10 s). window.draw({t}) returns a base64 JPEG.
 * A plasticine gardener on a warm tabletop presses a seed into a terracotta pot, waters it and
 * steps back. The sprout grows in replacement steps into a big sunflower that bends to face them,
 * both bow, and clay letters bounce onto the table. Motion is held on 12 fps steps; fingerprint
 * texture and a 1-2 px jitter change with each step, and the studio lamp flickers slightly. */
const W = 1920, H = 1080;
const FLOOR = 800;     // y of the table edge everything stands on
const cv = document.querySelector('#c');
const ctx = cv.getContext('2d');

// numeric helpers
const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (from, to, u) => from * (1 - u) + to * u;
const seg = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const eOut = x => { const u = clamp(x); return u * (2 - u); };                       // quadratic ease-out
const eInOut = x => { const u = clamp(x); return u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u); };
const eBack = (x, s = 1.8) => { const u = clamp(x) - 1; return 1 + u * u * ((s + 1) * u + s); };   // overshoot
// seeded randomness: mulberry32 stream and a stateless 2D integer hash, both in [0, 1)
function rng(seed) {
  let a = (seed * 0x9e3779b1) | 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let z = Math.imul(a ^ (a >>> 15), a | 1);
    z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
    return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(i, j) {
  let z = Math.imul(i | 0, 0x27d4eb2d) ^ Math.imul((j | 0) + 0x165667b1, 0x85ebca6b);
  z = Math.imul(z ^ (z >>> 15), 0xc2b2ae35);
  return ((z ^ (z >>> 13)) >>> 0) / 4294967296;
}
function mk(w = W, h = H) {
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(Math.max(w, 1));
  canvas.height = Math.ceil(Math.max(h, 1));
  return canvas;
}

const FONT = '"Fredoka", sans-serif';
const CLAY = { teal: '#2f8e88', cream: '#f2e2c2', char: '#35302f', red: '#d6452f', mustard: '#e7a83a',
  skin: '#e9ad88', hair: '#6a3f2a', straw: '#e9c46f', tin: '#6f9fb8', pot: '#c4643a', potRim: '#cf7147',
  stem: '#5f9a3c', leaf: '#6aa845', petal: '#f3b933', petalB: '#de8f25', disc: '#6b3f22', drop: '#8fd0e6' };

/* ---- the set (painted once): seamless studio sweep, warm lamp pool, paper-fine grain ---- */
const BG = mk();
const PRINT = mk(512, 512);   // tileable fingerprint / tool-mark layer shared by every clay piece
let FPAT;              // CanvasPattern of PRINT, created in ready

function paintSweep() {
  const b = BG.getContext('2d');
  const sweep = b.createLinearGradient(0, 0, 0, H);
  [[0, '#cfae90'], [.5, '#ecd5b6'], [.6, '#e9c9a2'], [.7, '#dfb487'], [1, '#cf9f72']].forEach(([at, col]) => sweep.addColorStop(at, col));
  b.fillStyle = sweep;
  b.fillRect(0, 0, W, H);
  const pool = b.createRadialGradient(900, 520, 80, 940, 600, 1100);
  pool.addColorStop(0, 'rgba(255,236,200,0.55)');
  pool.addColorStop(.5, 'rgba(255,220,170,0.12)');
  pool.addColorStop(1, 'rgba(60,30,10,0.45)');
  b.fillStyle = pool;
  b.fillRect(0, 0, W, H);
  // monochrome grain, a little coarser on the table top than on the backdrop
  const img = b.getImageData(0, 0, W, H), px = img.data;
  for (let y = 0; y < H; y++) {
    const amp = y > 700 ? 9 : 5;
    for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4, n = (hash(x, y + 7919) - .5) * amp;
      px[o] += n; px[o + 1] += n; px[o + 2] += n;
    }
  }
  b.putImageData(img, 0, 0);
}

// draws a mark nine times (offset by the tile size) so the texture wraps without seams
function wrapped(f, size, paint) {
  for (const ox of [-size, 0, size]) for (const oy of [-size, 0, size]) { f.save(); f.translate(ox, oy); paint(f); f.restore(); }
}
function paintFingerprints() {
  const f = PRINT.getContext('2d'), S = 512, r = rng(41);
  f.lineCap = 'round';
  // whorls: broken concentric loops of ridge + highlight, like a thumb pressed into the clay
  for (let w = 0; w < 8; w++) {
    const cx = r() * S, cy = r() * S, tilt = r() * Math.PI, squash = .55 + r() * .3, rings = 20;
    const arcs = [];
    for (let i = 0; i < rings; i++) {
      const rad = 6 + i * 3.2, start = r() * Math.PI * 2;
      arcs.push([rad, start, start + 2 + r() * 3]);
    }
    wrapped(f, S, g => {
      g.translate(cx, cy); g.rotate(tilt); g.scale(1, squash);
      for (const [rad, a0, a1] of arcs) {
        g.lineWidth = 1.1;
        g.strokeStyle = 'rgba(0,0,0,0.12)';
        g.beginPath(); g.ellipse(0, 0, rad, rad, 0, a0, a1); g.stroke();
        g.strokeStyle = 'rgba(255,255,255,0.11)';
        g.beginPath(); g.ellipse(0, -1.2, rad, rad, 0, a0, a1); g.stroke();
      }
    });
  }
  // small dents (dark pit with a lit upper-left lip)
  for (let i = 0; i < 260; i++) {
    const x = r() * S, y = r() * S, rad = 1 + r() * 3.5;
    wrapped(f, S, g => {
      g.fillStyle = 'rgba(0,0,0,0.10)';
      g.beginPath(); g.ellipse(x, y, rad, rad, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.12)';
      g.beginPath(); g.ellipse(x - .8, y - .8, rad * .7, rad * .7, 0, 0, Math.PI * 2); g.fill();
    });
  }
  // modelling-tool scratches
  f.lineWidth = 1.5;
  f.strokeStyle = 'rgba(0,0,0,0.07)';
  for (let i = 0; i < 40; i++) {
    const x = r() * S, y = r() * S, ang = r() * Math.PI * 2, len = 10 + r() * 30;
    wrapped(f, S, g => { g.beginPath(); g.moveTo(x, y); g.lineTo(x + len * Math.cos(ang), y + len * Math.sin(ang)); g.stroke(); });
  }
}

/* ---- plasticine shading ----
 * sculpt() paints a silhouette into its own canvas and shades it like a lump of clay lit by a lamp:
 * soft occlusion and a bright lip pushed in from opposite edges, a glossy hotspot, the fingerprint
 * layer and a warm bounce from the table. Returns { O: shaded piece, M: silhouette, pad }.
 * Options: k (scale of the shading), lit/rim (light strengths), spec/sx/sy/sr/sa (hotspot),
 * tex (texture opacity), tx/ty/trot (texture placement). */
function edgeTint(dst, sil, tint, dx, dy, soft) {
  // tint the part of the silhouette that the silhouette itself does not cover once shifted by (dx, dy)
  const layer = mk(sil.width, sil.height), l = layer.getContext('2d');
  l.fillStyle = tint;
  l.fillRect(0, 0, layer.width, layer.height);
  l.globalCompositeOperation = 'destination-out';
  l.filter = `blur(${soft / 2}px)`;
  l.drawImage(sil, dx, dy);
  dst.drawImage(layer, 0, 0);
}
function clay(drawMask, bw, bh, color, o = {}) {
  const k = o.k ?? 1, pad = Math.round(20 + k * 40);
  const M = mk(bw + 2 * pad, bh + 2 * pad), O = mk(M.width, M.height);
  const m = M.getContext('2d');
  m.translate(pad, pad);
  drawMask(m);

  const c = O.getContext('2d');
  c.fillStyle = color;
  c.fillRect(0, 0, O.width, O.height);
  c.globalCompositeOperation = 'destination-in';
  c.drawImage(M, 0, 0);
  c.globalCompositeOperation = 'source-atop';   // shading stays inside the silhouette
  const shades = [
    ['rgba(40,15,5,0.62)', 10, 16, 26],
    ['rgba(40,15,5,0.35)', 3, 5, 6],
    [`rgba(255,244,225,${o.lit ?? .55})`, -7, -10, 18],
    [`rgba(255,246,232,${o.rim ?? .35})`, -2, -3, 3.5],
  ];
  for (const [tint, dx, dy, soft] of shades) edgeTint(c, M, tint, dx * k, dy * k, soft * k);

  if (o.spec ?? true) {
    const hx = pad + (o.sx ?? .3) * bw, hy = pad + (o.sy ?? .26) * bh;
    const hr = (o.sr ?? .22) * Math.min(bw, bh), a = o.sa ?? .3;
    const glint = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
    glint.addColorStop(0, `rgba(255,250,240,${a})`);
    glint.addColorStop(.35, `rgba(255,250,240,${a / 3})`);
    glint.addColorStop(1, 'rgba(255,250,240,0)');
    c.fillStyle = glint;
    c.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);
  }

  c.save();
  c.globalAlpha = o.tex ?? 1;
  c.translate(o.tx || 0, o.ty || 0);
  c.rotate(o.trot || 0);
  c.fillStyle = FPAT;
  const span = 2 * (O.width + O.height);
  c.fillRect(-span, -span, span * 2, span * 2);
  c.restore();

  const bounce = c.createLinearGradient(0, pad + .7 * bh, 0, pad + bh);
  bounce.addColorStop(0, 'rgba(255,200,150,0)');
  bounce.addColorStop(1, 'rgba(255,190,140,0.12)');
  c.fillStyle = bounce;
  c.fillRect(0, pad + .7 * bh, O.width, O.height);
  return { O, M, pad };
}
// stamp a sculpted piece at (x, y) with its soft cast shadow (the silhouette, blurred and offset)
function place(piece, x, y, o = {}) {
  const alpha = o.alpha ?? 1, ox = x - piece.pad, oy = y - piece.pad;
  ctx.save();
  if (o.shadow ?? true) {
    const off = o.so || [22, 6];
    ctx.globalAlpha = alpha * (o.sa ?? .26);
    ctx.filter = `blur(${o.sb ?? 14}px)`;
    ctx.drawImage(piece.M, ox + off[0], oy + off[1]);
    ctx.filter = 'none';
  }
  ctx.globalAlpha = alpha;
  ctx.drawImage(piece.O, ox, oy);
  ctx.restore();
}
// dark blurred oval where something rests on the table
function contact(x, y, w, a = .45) {
  if (!(a > 0 && w > 0)) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#2a1508';
  ctx.filter = 'blur(9px)';
  ctx.beginPath();
  ctx.ellipse(x + 6, y + 2, w / 2, Math.max(w * .07, 4), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
// one clay piece drawn in world coordinates: fn(c) paints the mask; bb = [x0,y0,x1,y1] world box that contains it
let STEP = 0;
function part(fn, bb, color, seed, o = {}) {
  const bx = Math.floor(bb[0]), by = Math.floor(bb[1]), bw = Math.ceil(bb[2] - bb[0]), bh = Math.ceil(bb[3] - bb[1]);
  const k = o.k ?? clamp(Math.min(bw, bh) / 180, .3, 1.3);
  const cl = clay(m => { m.translate(-bx, -by); m.fillStyle = '#000'; m.strokeStyle = '#000'; m.lineCap = 'round'; m.lineJoin = 'round'; fn(m); }, bw, bh, color,
    { k, tx: hash(seed, STEP) * 7, ty: hash(seed + 3, STEP) * 7, trot: seed * .7, sx: o.spx, sy: o.spy, sr: o.spr, sa: o.sa, spec: o.spec, tex: o.tex, lit: o.lit, rim: o.rim });
  const js = o.js ?? seed, jx = (hash(js + 11, STEP) - .5) * 1.8, jy = (hash(js + 13, STEP) - .5) * 1.1;
  place(cl, bx + jx, by + jy, { shadow: o.shadow, sb: o.sb, sa: o.shA, so: o.so });
}
const box = (pts, m) => { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0 - m, y0 - m, x1 + m, y1 + m]; };
function capsule(c, a, b, ra, rb) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  c.beginPath(); c.moveTo(a[0] + nx * ra, a[1] + ny * ra); c.lineTo(b[0] + nx * rb, b[1] + ny * rb); c.lineTo(b[0] - nx * rb, b[1] - ny * rb); c.lineTo(a[0] - nx * ra, a[1] - ny * ra); c.closePath(); c.fill();
  c.beginPath(); c.arc(a[0], a[1], ra, 0, 7); c.fill(); c.beginPath(); c.arc(b[0], b[1], rb, 0, 7); c.fill();
}
// carved line into the clay: light lip below, dark groove on top (path must start with beginPath)
function carve(path, w = 3, a = .45) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.translate(1, 1.4); ctx.strokeStyle = 'rgba(255,238,215,0.35)'; ctx.lineWidth = w; path(ctx); ctx.stroke();
  ctx.translate(-1, -1.4); ctx.strokeStyle = `rgba(35,14,4,${a})`; ctx.lineWidth = w; path(ctx); ctx.stroke(); ctx.restore();
}
function bead(x, y, r, col = '#241a16') {       // glossy clay eye / button
  ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,240,0.85)'; ctx.beginPath(); ctx.arc(x - r * .35, y - r * .38, r * .3, 0, 7); ctx.fill(); ctx.restore();
}
const rot = ([x, y], a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
const add = (p, q, s = 1) => [p[0] + q[0] * s, p[1] + q[1] * s];
const dir = a => [Math.cos(a), Math.sin(a)];
// two-bone IK; pick() scores the two elbow solutions
function ik(a, b, l1, l2, pick) {
  const dx = b[0] - a[0], dy = b[1] - a[1], th = Math.atan2(dy, dx), d = clamp(Math.hypot(dx, dy), Math.abs(l1 - l2) + 1, l1 + l2 - .5);
  const al = Math.acos(clamp((l1 * l1 + d * d - l2 * l2) / (2 * l1 * d), -1, 1));
  const e1 = [a[0] + l1 * Math.cos(th + al), a[1] + l1 * Math.sin(th + al)], e2 = [a[0] + l1 * Math.cos(th - al), a[1] + l1 * Math.sin(th - al)];
  return [pick(e1) >= pick(e2) ? e1 : e2, [a[0] + d * Math.cos(th), a[1] + d * Math.sin(th)]];
}
// keyframe track: [[t, value, ease?], ...]; value = number or array
function tr(t, keys, ease = eInOut) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const [t0, a] = keys[i - 1], [t1, b, e] = keys[i], u = (e || ease)(seg(t, t0, t1));
    return Array.isArray(a) ? a.map((x, j) => lerp(x, b[j], u)) : lerp(a, b, u);
  }
  return keys[keys.length - 1][1];
}

// ── timeline ──────────────────────────────────────────────────────────────────────
const POUR = [2.72, 3.4];
const TR = {
  hx: [[0, 850], [4.05, 850], [4.35, 815], [4.65, 772], [4.95, 712], [5.25, 655], [7.45, 655], [7.75, 648], [8.05, 648], [8.35, 655]],
  hy: [[0, 590], [.7, 585], [.82, 592], [1.2, 618], [1.9, 618], [2.05, 612], [3.45, 612], [3.75, 596], [4.05, 594], [4.2, 588], [4.35, 596], [4.5, 588], [4.65, 596], [4.8, 588], [4.95, 596], [5.1, 588], [5.25, 594],
    [6.2, 594], [6.28, 604], [6.38, 566], [6.48, 598], [6.58, 592], [7.45, 592], [7.75, 606], [8.05, 606], [8.35, 592]],
  lean: [[0, .04], [.7, -.07], [1.2, .5], [1.9, .5], [2.05, .3], [2.45, .15], [3.45, .15], [3.75, .08], [4.05, .04], [5.25, .02], [5.6, -.1], [6.2, -.12], [6.38, -.04], [6.6, -.06], [7.3, 0], [7.45, -.06],
    [7.75, .85], [8.05, .85], [8.3, -.08], [8.45, 0]],
  head: [[0, .28], [.7, .18], [1.2, .32], [2.05, .2], [2.45, .12], [3.45, .14], [3.75, .15], [5.25, .28], [5.45, .1], [5.8, -.28], [6.2, -.38], [6.4, -.3], [7.0, -.14], [7.45, -.12], [7.75, .3], [8.05, .3], [8.35, -.05], [8.5, 0]],
  fF: [[0, [885, 778]], [4.35, [885, 778]], [4.5, [845, 754]], [4.65, [800, 778]], [4.95, [800, 778]], [5.1, [745, 754]], [5.25, [690, 778]]],
  fB: [[0, [818, 778]], [4.05, [818, 778]], [4.2, [775, 754]], [4.35, [730, 778]], [4.65, [730, 778]], [4.8, [675, 754]], [4.95, [620, 778]]],
  hF: [[0, [930, 500]], [.7, [918, 478]], [1.2, [1022, 620]], [1.35, [1026, 634]], [1.48, [1020, 608]], [1.6, [1026, 632]], [1.72, [1020, 608]], [1.84, [1026, 632]], [2.05, [990, 590]],
    [3.75, [905, 662]], [4.35, [870, 665]], [4.65, [830, 662]], [4.95, [768, 665]], [5.25, [705, 665]], [6.22, [705, 648]], [6.38, [712, 444]], [6.6, [716, 452]], [7.0, [700, 662]], [7.45, [700, 662]],
    [7.75, [724, 598]], [8.05, [724, 598]], [8.35, [700, 662]], [8.6, [742, 404]]],
  hB: [[0, [820, 634]], [2.1, [820, 636]], [2.28, [905, 575]], [2.45, [1005, 500]], [3.45, [1005, 500]], [3.6, [915, 520]], [3.75, [820, 636]], [4.35, [785, 636]], [4.65, [745, 634]], [4.95, [680, 636]], [5.25, [625, 636]],
    [7.45, [625, 636]], [7.75, [695, 652]], [8.05, [695, 652]], [8.35, [625, 636]]],
  can: [[0, 0], [2.45, 0], [2.68, .62], [3.38, .62], [3.58, 0]],

// sunflower growth: stem fraction held between replacement steps (true stop-motion)
const GROW = [[3.8, .06], [4.05, .13], [4.3, .22], [4.55, .34], [4.8, .46], [5.05, .58], [5.3, .7], [5.5, .82], [5.7, 1]];
const growAt = t => { let g = 0; for (const [t0, v] of GROW) if (t >= t0) g = v; return g; };
const LEAVES = [   // u on stem, side (+1 right), size, appear, full
  [.07, 1, .5, 4.05, 4.3], [.07, -1, .5, 4.05, 4.3], [.3, 1, 1, 4.55, 5.05], [.5, -1, 1.05, 4.8, 5.3], [.68, 1, .9, 5.3, 5.7]];
const PETALS = 14, PETAL_T = i => 5.86 + i * .034;
const BEND = [6.55, 7.3], NOD = [7.8, 8.35];
const TITLE = [['The', CLAY.char], ['tiny', CLAY.char], ['gardener.', '#4f8a34']], TSZ = 124, TBASE = 986, T_IN = 7.85, T_STAG = .025;
const B0 = [1040, 634];
function drops() {  // water drops: [t0, dx, dur]
  const r = rng(31), out = [];
  for (let s = POUR[0]; s < POUR[1]; s += 1 / 12) for (let j = 0; j < 3; j++) out.push([s + r() * .04, (r() - .5) * 36, .2 + r() * .07]);
  return out;
}
const DROPS = drops();

// ── gardener rig (profile facing right) ────────────────────────────────────────────
function pose(tq) {
  const P = {}; for (const k in TR) P[k] = tr(tq, TR[k]);
  P.sup = Math.min(seg(tq, 2.15, 2.45), 1 - seg(tq, 3.45, 3.7));     // front hand supports the can
  P.lift = 14 * Math.sin(seg(tq, 8.7, 9.25) * Math.PI);                   // tips the hat at the end
  if (tq > 8.6) P.hF = [742, 404 - P.lift];
  return P;
}
const canFrame = (grip, r) => p => add(grip, rot(p, r));
function rigArms(P) {
  const hip = [P.hx, P.hy], up = [Math.sin(P.lean), -Math.cos(P.lean)], fw = [Math.cos(P.lean), Math.sin(P.lean)];
  const tl = (x, y) => add(add(hip, fw, x), up, -y);

  const [eB, wB] = ik(SB, P.hB, 86, 80, elbow), dB = Math.atan2(wB[1] - eB[1], wB[0] - eB[0]), gripB = add(wB, dir(dB), 12), canGrip = add(gripB, [0, 2]);

}
function drawCan(grip, r, seed) {
  const T = canFrame(grip, r);
  const pts = [[-48, 18], [48, 18], [48, 108], [-48, 108], [112, 10], [0, -8]].map(T);
  part(c => {

    contact(L.x + L.w / 2, TBASE + 6, L.w * .95 * sc, .32 * sc * (1 - upv));
    const bx = L.x + L.w / 2, by = TBASE;      // scale around each letter's own bottom centre
    ctx.save(); ctx.translate(bx, by - upv * 80); ctx.scale(sx, sy); ctx.translate(-bx, -by);
    place(cl, L.x + (hash(L.i + 5, STEP) - .5) * 2, TBASE - TSZ * .8 + (hash(L.i + 9, STEP) - .5) * 1.5, { sb: 10, sa: .2, so: [10, 5] });
    ctx.restore();
  }
}

// ── frame ─────────────────────────────────────────────────────────────────────────
// ── frame ─────────────────────────────────────────────────────────────────────────
function resetContext() {
  ctx.resetTransform();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none';
}
// studio lamp: fades up at the start and out at the end, with a small per-step flicker
function lampPass(t, step) {
  const on = Math.min(eOut(seg(t, 0, .35)), 1 - eInOut(seg(t, 9.45, 10)));
  const level = on * (1 + .03 * (hash(3, step) - .5));
  if (level < 1) {
    ctx.fillStyle = `rgba(20,10,4,${clamp(1 - level)})`;
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = `rgba(255,240,215,${clamp(2 * (level - 1))})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  const corners = ctx.createRadialGradient(W / 2, H / 2, 600, W / 2, H / 2, 1250);
  corners.addColorStop(0, 'rgba(0,0,0,0)');
  corners.addColorStop(1, 'rgba(30,12,2,0.35)');
  ctx.fillStyle = corners;
  ctx.fillRect(0, 0, W, H);
}
function renderFrame(time) {
  STEP = Math.floor(12 * time);
  const tq = STEP / 12;      // every animated value is sampled on the 12 fps step
  resetContext();
  // stop-motion camera: starts close on the gardener and pulls back while the flower grows
  const zoom = 1 + .25 * (1 - eInOut(seg(tq, 4.1, 6))), pivotX = 880, pivotY = 640;
  ctx.setTransform(zoom, 0, 0, zoom, pivotX - pivotX * zoom, pivotY - pivotY * zoom);
  ctx.drawImage(BG, 0, 0, W, H);
  pot(tq);
  sunflower(tq);
  const rig = gardener(tq);
  if (tq >= POUR[0] && tq < POUR[1] + .4) water(tq, canFrame(rig.canGrip, .62)([108, 14]));
  title(tq);
  resetContext();
  lampPass(time, STEP);
}


// sound cues for audio.py
window.events = () => {
  const e = [{ t: .05, k: 'lamp' }, { t: .72, k: 'squish', f: 260, v: .5 }, { t: 1.42, k: 'plop', f: 380 }, { t: 1.6, k: 'pat' }, { t: 1.84, k: 'pat' },
    { t: 2.2, k: 'clink' }, { t: POUR[0], k: 'pour', d: POUR[1] - POUR[0] + .2 }, { t: 3.6, k: 'clink', v: .6 }];
  for (const tt of [4.35, 4.65, 4.95, 5.25]) e.push({ t: tt, k: 'step' });
  GROW.forEach(([t0], i) => e.push({ t: t0, k: 'squish', f: 180 + i * 30, v: .7 }));
  e.push({ t: 5.7, k: 'plop', f: 560, v: .7 });
  for (let i = 0; i < PETALS; i++) e.push({ t: PETAL_T(i), k: 'pop', f: 420 + (i % 7) * 60, v: .45 });
  e.push({ t: 6.28, k: 'boing' }, { t: 6.55, k: 'stretch', d: .8 }, { t: 7.62, k: 'squish', f: 160, v: .8 }, { t: 7.95, k: 'squish', f: 220, v: .6 });
  LAYOUT.forEach(L => e.push({ t: T_IN + L.i * T_STAG + .2, k: 'pop', f: 330 + (L.i % 5) * 55, v: .38 }));
  e.push({ t: 8.7, k: 'chime' });
  return e;
};
window.draw = ({ t, q }) => {
  renderFrame(t);
  return cv.toDataURL('image/jpeg', q || 0.92).slice('data:image/jpeg;base64,'.length);
};
window.ready = (async () => {
  await document.fonts.load(`700 124px ${FONT}`, 'The tiny gardener.');
  await document.fonts.ready;
  paintSweep();
  paintFingerprints();
  FPAT = ctx.createPattern(PRINT, 'repeat');
  LAYOUT = titleLayout();
  renderFrame(0);
})();
</script>
