// ─────────────────────────────────────────────────────────────────────────────
//  CLAY stop-motion — "The tiny gardener", 10 s. window.draw({t}) → JPEG base64

// ── set: endless background + table + warm light pool (once) ───────────────────────
const BG = mk(), FP = mk(512, 512);

let FPAT = null;

// ── clay renderer: mask → inner shadow + inner light + glare + fingerprint texture ─────

// ── gardener rig (profile facing right) ────────────────────────────────────────────
