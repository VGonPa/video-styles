<script>
// WHITEBOARD — "How do bees make honey?": marker draws each step, camera trails the long arrow, zoom out to the summary board
const INK = '#18181b', RED = '#d4352a', AMBER = '#e9a21f', BOARD = '#f6f6f3';
const FONT = "'Kalam'";
const BX = 1760, BY = 420;                        // world offset of second panel
const A_C = [960, 540], B_C = [BX + 860, BY + 600];
const SUM = { c: [0, 0], s: 1 };                  // summary framing, fitted to the drawings in measureLabels

// ---------- board surface: painted once at half resolution, scaled up under the camera ----------
const WB = { x0: -700, y0: -700, w: 5400, h: 3600, k: 0.5 };
const board = paintBoard(mk(WB.w * WB.k, WB.h * WB.k), rng(3));
function paintBoard(cnv, rand) {
  const g = cnv.getContext('2d'), w = cnv.width, h = cnv.height;
  const cover = fill => { g.fillStyle = fill; g.fillRect(0, 0, w, h); };
  cover(BOARD);
  for (let band = 0; band < 5; band++) {          // diagonal glare from the room lights
    const x = rand() * w, glare = g.createLinearGradient(x - 500, 0, x + 500, h * .4);
    glare.addColorStop(0, 'rgba(255,255,255,0)'); glare.addColorStop(.5, 'rgba(255,255,255,0.55)'); glare.addColorStop(1, 'rgba(255,255,255,0)');
    cover(glare);
  }
  const shade = g.createLinearGradient(0, 0, 0, h);   // slightly darker toward the tray
  shade.addColorStop(0, 'rgba(0,0,0,0)'); shade.addColorStop(1, 'rgba(90,95,100,0.06)');
  cover(shade);
  g.filter = 'blur(2px)'; g.lineCap = 'round';
  for (let n = 0; n < 40; n++) {                  // faint scribbles left by earlier erasing
    let x = rand() * w, y = rand() * h;
    g.strokeStyle = `rgba(60,70,80,${0.018 + rand() * 0.03})`; g.lineWidth = 2 + rand() * 3;
    g.beginPath(); g.moveTo(x, y);
    for (let step = 0; step < 14; step++) { x += 10 + rand() * 22; y += (rand() - .5) * 26; g.lineTo(x, y); }
    g.stroke();
  }
  for (let n = 0; n < 16; n++) {                  // wiped smears
    const x = rand() * w, y = rand() * h;
    g.fillStyle = `rgba(80,90,100,${0.008 + rand() * 0.01})`;
    g.beginPath(); g.ellipse(x, y, 60 + rand() * 140, 16 + rand() * 30, (rand() - .5) * .6, 0, 7); g.fill();
  }
  g.filter = 'none';
  const img = g.getImageData(0, 0, w, h), px = img.data;   // fine grey grain
  for (let i = 0; i < px.length; i += 4) { const n = (rand() - .5) * 4; for (let ch = 0; ch < 3; ch++) px[i + ch] += n; }
  g.putImageData(img, 0, 0);
  return cnv;
}

// ---------- the marker: sprite and soft shadow, both drawn tip-at-pivot ----------
const MK = { L: 440, D: 58, ang: 0.62 };          // barrel length, diameter, tilt (pointing down-right)
const PIV = [120, 120];
const mSprite = mk(700, 700), mShadow = mk(700, 700);
function paintMarker(g) {
  const D = MK.D, half = D / 2;
  // a lit cylinder section from x0 to x1: vertical gradient through the given colours
  const barrel = (x0, x1, colours) => {
    const grad = g.createLinearGradient(0, -half, 0, half);
    colours.forEach((col, i) => grad.addColorStop(i / (colours.length - 1), col));
    g.fillStyle = grad; g.fillRect(x0, -half, x1 - x0, D);
  };
  g.save(); g.translate(PIV[0], PIV[1]); g.rotate(MK.ang);
  g.fillStyle = '#111';                           // felt nib
  g.beginPath(); g.moveTo(0, -4); g.lineTo(24, -9); g.lineTo(24, 9); g.lineTo(0, 4); g.closePath(); g.fill();
  const nose = g.createLinearGradient(0, -26, 0, 26);
  nose.addColorStop(0, '#5a5a5e'); nose.addColorStop(.35, '#2c2c30'); nose.addColorStop(1, '#0d0d10');
  g.fillStyle = nose;
  g.beginPath(); g.moveTo(22, -11);
  g.bezierCurveTo(48, -14, 60, -half, 78, -half); g.lineTo(78, half); g.bezierCurveTo(60, half, 48, 14, 22, 11);
  g.closePath(); g.fill();
  g.save();
  g.beginPath(); g.roundRect(76, -half, MK.L - 76, D, [4, 18, 18, 4]); g.clip();
  barrel(76, MK.L, ['#d9d9d6', '#ffffff', '#f1f1ee', '#c9c9c5', '#9d9d99']);      // white body
  barrel(96, 112, ['#555', '#2a2a2d', '#1a1a1d', '#0b0b0d', '#050506']);          // ink-colour ring
  barrel(170, 330, ['#3b3b40', '#1d1d21', '#141417', '#0c0c0e', '#060607']);      // blank label
  g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(170, -half + 9, 160, 4);
  barrel(MK.L - 36, MK.L, ['#4a4a4f', '#232327', '#18181b', '#0e0e10', '#060607']); // end cap
  g.restore();
  g.restore();
}
paintMarker(mSprite.getContext('2d'));
{ const g = mShadow.getContext('2d');           // blurred, tinted silhouette of the sprite
  g.filter = 'blur(10px)'; g.globalAlpha = 0.28; g.drawImage(mSprite, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = '#2b3036'; g.fillRect(0, 0, 700, 700); }

// ---------- timeline: every stroke and label the marker draws, with its time window ----------
const acts = [];
function stroke(path, t0, t1, o = {}) {
  path.jitter(o.jit ?? 1.6, acts.length * 17 + 5);
  const act = { kind: 'path', path, t0, t1, color: o.color || INK, width: o.width || 7, clip: o.clip, dash: o.dash,
                ease: o.ease || (u => u), flap: o.flap, drift: o.drift };
  acts.push(act);
  return act;
}
function text(str, x, y, size, t0, t1, o = {}) {
  acts.push({ kind: 'text', str, x, y, size, t0, t1, color: o.color || INK, align: o.align || 'center', rot: o.rot || 0 });
}
const ell = (cx, cy, rx, ry, a0, a1, rot = 0, n = 48) => Array.from({ length: n + 1 }, (_, i) => { const a = lerp(a0, a1, i / n), x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });
const poly = pts => { const p = P().M(...pts[0]); for (let i = 1; i < pts.length; i++) p.L(...pts[i]); return p; };
const clipOf = pts => { const c = new Path2D(); c.moveTo(...pts[0]); pts.slice(1).forEach(q => c.lineTo(...q)); c.closePath(); return c; };
// zig-zag marker fill (back-and-forth rows) inside a box; drawn through a clip
function hatch(x0, y0, x1, y1, step) { const p = P().M(x0, y0); let y = y0, k = 0; while (y < y1) { const yn = Math.min(y1, y + step); p.L(k % 2 ? x0 : x1, yn); y = yn; k++; } return p; }
// flat-top hexagon corner points
const hexPts = (cx, cy, r, a0 = 0) => Array.from({ length: 7 }, (_, i) => { const a = a0 + i * Math.PI / 3; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; });
// point `len` away from (x, y) in direction `ang`
const toward = (x, y, ang, len) => [x + Math.cos(ang) * len, y + Math.sin(ang) * len];
// gently bowed arrow: the shaft first, then a two-barb head in the last 0.06 s
function arrow(x0, y0, x1, y1, t0, t1, bend = -24, o = {}) {
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 + bend, barb = o.head || 30;
  stroke(P().M(x0, y0).Q(cx, cy, x1, y1, 30), t0, t1 - 0.06, o);
  const ang = Math.atan2(y1 - (cy + y1) / 2, x1 - (cx + x1) / 2);
  stroke(P().M(...toward(x1, y1, ang + 2.55, barb)).L(x1, y1).L(...toward(x1, y1, ang - 2.55, barb)), t1 - 0.06, t1, o);
}
// A bee: body with stripes, head, antennae, stinger, legs, two flapping wings. flip=-1 faces left.
const BEES = [];
function bee(cx, cy, s, flip, t0, dur, o = {}) {
  const m = ([x, y]) => [cx + flip * x * s, cy + y * s], M = pts => pts.map(m);
  const T = f => t0 + f * dur, w = k => k * Math.max(0.8, s);
  BEES.push({ t0, cx, cy });
  stroke(poly(M(ell(0, 0, 90, 58, Math.PI + 0.1, Math.PI * 3 + 0.3))), T(0), T(0.22), { width: w(7) });
  [-34, 2, 38].forEach((x, i) => { const hy = 58 * Math.sqrt(1 - (x / 90) ** 2) - 7;
    stroke(P().M(...m([x + 7, -hy])).S(M([[x - 2, 0], [x + 7, hy]]), 12), T(0.24 + i * 0.07), T(0.29 + i * 0.07), { width: w(15), jit: 0.6 }); });
  stroke(poly(M(ell(114, -8, 38, 38, -Math.PI * 0.6, Math.PI * 1.45))), T(0.46), T(0.58), { width: w(7) });
  stroke(P().M(...m([124, -16])).L(...m([126, -15])), T(0.59), T(0.6), { width: w(12), jit: 0 });
  stroke(poly(M(ell(114, -4, 20, 18, 0.35, 1.35, 0, 12))), T(0.6), T(0.63), { width: w(5), jit: 0.3 });
  stroke(P().M(...m([100, -42])).S(M([[92, -80], [72, -104], [62, -98]]), 14), T(0.64), T(0.69), { width: w(5) });
  stroke(P().M(...m([124, -44])).S(M([[134, -84], [154, -102], [164, -94]]), 14), T(0.69), T(0.74), { width: w(5) });
  stroke(P().M(...m([-88, -12])).L(...m([-122, 1])).L(...m([-88, 14])), T(0.75), T(0.79), { width: w(6) });
  [[-34, 54, -48, 84], [0, 58, -8, 90], [34, 54, 40, 86]].forEach(([a, b, c2, d], i) => stroke(P().M(...m([a, b])).L(...m([c2, d])), T(0.8 + i * 0.025), T(0.82 + i * 0.025), { width: w(5) }));
  const piv = m([-4, -52]);
  stroke(poly(M(ell(-34, -112, 34, 60, Math.PI * 0.5, Math.PI * 2.5, -0.4))), T(0.88), T(0.94), { width: w(6), flap: { p: piv, ph: 0, sgn: -flip } });
  stroke(poly(M(ell(14, -116, 36, 64, Math.PI * 0.5, Math.PI * 2.5, 0.3))), T(0.94), T(1), { width: w(6), flap: { p: piv, ph: 0.6, sgn: flip } });
  if (o.drop) { const d = m([6, 128]);   // nectar drop carried under the bee
    const dp = [[d[0], d[1] - 30 * s], ...ell(d[0], d[1], 17 * s, 17 * s, -Math.PI * 0.18, Math.PI * 1.18, 0, 20), [d[0], d[1] - 30 * s]];
    stroke(poly(dp), T(1) + 0.02, T(1) + 0.08, { color: RED, width: 6, jit: 0.4 });
    stroke(hatch(d[0] - 18 * s, d[1] - 22 * s, d[0] + 18 * s, d[1] + 18 * s, 5), T(1) + 0.08, T(1) + 0.14, { color: RED, width: 6, jit: 0.2, clip: clipOf(dp) }); }
}

// Panel A — title
text('How do bees make honey?', 960, 205, 96, 0.3, 1.1, { rot: -0.012 });
// 1 flower
{ const cx = 330, cy = 450;
  stroke(P().M(cx - 2, cy + 36).S([[cx + 4, cy + 150], [cx - 6, cy + 250], [cx + 2, cy + 330]], 16), 1.14, 1.24);
  stroke(P().M(cx + 2, cy + 250).S([[cx + 44, cy + 196], [cx + 96, cy + 186], [cx + 70, cy + 230], [cx + 2, cy + 252]], 14), 1.25, 1.32);
  for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + i * Math.PI / 3, pt = (rr, da) => [cx + Math.cos(a + da) * rr, cy + Math.sin(a + da) * rr];
    stroke(P().M(...pt(34, -0.42)).S([pt(80, -0.5), pt(112, -0.16), pt(114, 0.14), pt(80, 0.5), pt(34, 0.42)], 12), 1.33 + i * 0.055, 1.38 + i * 0.055, { width: 6 }); }
  const cp = ell(cx, cy, 32, 32, -Math.PI / 2, Math.PI * 1.55);
  stroke(poly(cp), 1.66, 1.74);
  stroke(hatch(cx - 30, cy - 30, cx + 30, cy + 30, 7), 1.75, 1.83, { color: RED, width: 8, jit: 0.3, clip: clipOf(cp) });
  text('flower', cx, 850, 70, 1.86, 2.02); }
// dashed red flight path: flower → bee
stroke(P().M(470, 420).S([[540, 350], [620, 380], [612, 452], [556, 446], [566, 380], [650, 346], [735, 400]], 18), 2.06, 2.36, { color: RED, width: 5, dash: [16, 14], jit: 0.8 });
// 2 bee sipping nectar
bee(900, 470, 0.95, 1, 2.4, 0.62, { drop: true });
text('sips nectar', 920, 850, 70, 3.2, 3.44);
arrow(1150, 480, 1300, 480, 3.48, 3.64);
// 3 the hive: honeycomb of 7 cells
const HIVE = { cx: 1570, cy: 470, r: 60 };
{ const { cx, cy, r } = HIVE, d = Math.sqrt(3) * r;
  const cells = [[0, 0], ...[0, 1, 2, 3, 4, 5].map(k => { const a = -Math.PI / 2 + Math.PI / 6 + k * Math.PI / 3; return [Math.cos(a) * d, Math.sin(a) * d]; })];
  cells.forEach(([dx, dy], i) => stroke(poly(hexPts(cx + dx, cy + dy, r - 3)), 3.68 + i * 0.065, 3.73 + i * 0.065, { width: 6, jit: 0.9 }));
  [0, 2, 5, 6].forEach((k, j) => { const [dx, dy] = cells[k], hp = hexPts(cx + dx, cy + dy, r - 14);
    stroke(hatch(cx + dx - r, cy + dy - r, cx + dx + r, cy + dy + r, 8), 4.15 + j * 0.035, 4.19 + j * 0.035, { color: AMBER, width: 10, jit: 0.3, clip: clipOf(hp) }); });
  text('hive', cx, 850, 70, 4.32, 4.44); }
// long arrow connecting panels (camera follows tip)
const CONN = { t0: 4.5, t1: 5.4 };
{ const p = P().M(1790, 610).S([[1832, 712], [1888, 818], [BX + 186, BY + 508], [BX + 250, BY + 580]], 24);
  stroke(p, CONN.t0, CONN.t1 - 0.08, { ease: eio2, jit: 2 });
  const e = p.p[p.p.length - 1], q = p.p[p.p.length - 8], a = Math.atan2(e[1] - q[1], e[0] - q[0]);
  stroke(P().M(e[0] + Math.cos(a + 2.55) * 34, e[1] + Math.sin(a + 2.55) * 34).L(...e).L(e[0] + Math.cos(a - 2.55) * 34, e[1] + Math.sin(a - 2.55) * 34), CONN.t1 - 0.08, CONN.t1); }
// Panel B — 4 bees fan the water out of the nectar
{ const r = 90, C = [[380, 700], [515, 622], [650, 700]].map(([x, y]) => [BX + x, BY + y]);
  C.forEach(([x, y], i) => stroke(poly(hexPts(x, y, r)), 5.46 + i * 0.1, 5.55 + i * 0.1, { width: 7, jit: 1 }));
  C.forEach(([x, y], i) => { const hp = hexPts(x, y, r - 14);
    stroke(hatch(x - r, y + 6, x + r, y + r, 9), 5.77 + i * 0.05, 5.82 + i * 0.05, { color: AMBER, width: 11, jit: 0.3, clip: clipOf(hp) }); });
  bee(BX + 800, BY + 420, 0.78, -1, 5.95, 0.6);
  // red fan lines blowing from the wings toward the comb
  [[0, 0], [30, 36], [8, 72]].forEach(([dx, dy], i) => stroke(P().M(BX + 668 - dx, BY + 292 + dy).Q(BX + 620 - dx, BY + 272 + dy, BX + 582 - dx, BY + 310 + dy, 16), 6.58 + i * 0.05, 6.62 + i * 0.05, { color: RED, width: 6, jit: 0.5 }));
  // water vapour rising off the comb
  [[425, 0], [490, 0.9], [555, 1.8]].forEach(([x, ph], i) => { const p = P().M(BX + x, BY + 520);
    p.S(Array.from({ length: 5 }, (_, k) => [BX + x + (k % 2 ? 14 : -14) - k * 4, BY + 520 - (k + 1) * 30]), 12);
    stroke(p, 6.76 + i * 0.06, 6.82 + i * 0.06, { width: 5, jit: 0.4, drift: ph }); });
  text('fan off water', BX + 515, BY + 900, 66, 6.96, 7.22); }
arrow(BX + 820, BY + 700, BX + 1000, BY + 700, 7.26, 7.42);
// 5 a jar of honey
{ const J = BX + 1300, Y = BY;
  stroke(poly([[J - 104, Y + 392], [J + 100, Y + 388], [J + 104, Y + 444], [J - 102, Y + 446], [J - 104, Y + 392]]), 7.46, 7.56, { width: 7 });
  const body = P().M(J - 86, Y + 452).S([[J - 110, Y + 500], [J - 120, Y + 560], [J - 120, Y + 758], [J - 96, Y + 806], [J, Y + 814], [J + 96, Y + 806], [J + 120, Y + 758], [J + 120, Y + 560], [J + 110, Y + 500], [J + 86, Y + 452]], 14);
  const bp = body.p.map(q => q.slice());
  stroke(body, 7.57, 7.74);
  stroke(hatch(J - 124, Y + 566, J + 124, Y + 812, 10), 7.76, 7.92, { color: AMBER, width: 12, jit: 0.3, clip: clipOf(bp) });
  stroke(P().M(J - 116, Y + 562).S([[J - 60, Y + 552], [J, Y + 566], [J + 60, Y + 554], [J + 116, Y + 562]], 12), 7.93, 7.99, { width: 5 });
  stroke(P().M(J - 86, Y + 610).S([[J - 90, Y + 660], [J - 88, Y + 720]], 8), 8.0, 8.03, { width: 6, color: BOARD, jit: 0.3 });
  stroke(P().M(J + 62, Y + 446).S([[J + 66, Y + 470], [J + 60, Y + 492], [J + 68, Y + 500]], 10), 8.04, 8.08, { color: AMBER, width: 12, jit: 0.2 });
  text('honey!', J, Y + 935, 116, 8.1, 8.32, { rot: -0.015 });
  stroke(P().M(J - 150, Y + 968).S([[J - 50, Y + 960], [J + 60, Y + 956], [J + 150, Y + 962]], 20), 8.35, 8.46, { color: RED, width: 10, ease: eout });
  stroke(P().M(J - 110, Y + 994).S([[J - 20, Y + 988], [J + 70, Y + 986], [J + 126, Y + 990]], 20), 8.48, 8.56, { color: RED, width: 8, ease: eout }); }


for (const a of acts) if (a.kind === 'path') a.path.done();
acts.sort((a, b) => a.t0 - b.t0);

// Label widths (needs the font): full width, width of every prefix for the write-on, left edge.
function measureLabels() {
  for (const a of acts) {
    if (a.kind !== 'text') continue;
    ctx.font = `700 ${a.size}px ${FONT}`;
    a.w = ctx.measureText(a.str).width;
    a.xs = [0];
    for (let n = 1; n <= a.str.length; n++) a.xs.push(ctx.measureText(a.str.slice(0, n)).width);
    a.left = a.align === 'center' ? a.x - a.w / 2 : a.x;
  }
  // summary framing: fit every drawing and label with a margin
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  for (const a of acts) if (a.kind === 'text') { add(a.left, a.y - a.size * 0.8); add(a.left + a.w, a.y + a.size * 0.25); } else a.path.p.forEach(q => add(...q));
  SUM.c = [(x0 + x1) / 2, (y0 + y1) / 2]; SUM.s = Math.min(1720 / (x1 - x0), 940 / (y1 - y0));
}

// Write-on of a label at time t: how many pixels are revealed, and where the nib is (it bobs per letter).
function writing(a, t) {
  const pos = seg(t, a.t0, a.t1) * a.str.length;
  const letter = Math.min(a.str.length - 1, Math.floor(pos)), within = pos - letter;
  const shown = lerp(a.xs[letter], a.xs[letter + 1], within);
  const nibY = a.y - a.size * (0.28 + 0.2 * Math.sin(within * Math.PI * 3 + letter));
  return { shown, nib: [a.left + shown, nibY] };
}
const midline = a => a.y - a.size * .3;
const firstPoint = a => (a.kind === 'text' ? [a.left, midline(a)] : a.path.p[0]);
const lastPoint = a => (a.kind === 'text' ? [a.left + a.w, midline(a)] : a.path.p[a.path.p.length - 1]);
function nibOn(a, t) {
  if (a.kind === 'text') return writing(a, t).nib;
  const q = a.path.at(a.ease(seg(t, a.t0, a.t1)) * a.path.len);
  return [q.x, q.y];
}
const mix2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];

// Where the marker is and how far it is lifted off the board: on an act while it draws,
// gliding (and hopping, for longer gaps) between acts, then leaving the frame after the last one.
const ENTER = [1500, 1300], EXIT = [BX + 1900, BY + 1500], PEN_OUT = 0.4;
function markerAt(t) {
  let before = null;
  for (const a of acts) {
    if (t >= a.t0 && t <= a.t1) return { p: nibOn(a, t), lift: 0 };
    if (t < a.t0) {
      const from = before ? lastPoint(before) : ENTER, leave = before ? before.t1 : 0;
      const u = eio2(seg(t, leave, a.t0));
      return { p: mix2(from, firstPoint(a), u), lift: Math.sin(u * Math.PI) * Math.min(1, (a.t0 - leave) * 6) };
    }
    before = a;
  }
  const u = eio2(seg(t, before.t1, before.t1 + PEN_OUT));
  return { p: mix2(lastPoint(before), EXIT, u), lift: u, gone: u >= 1 };
}

// Camera centre and zoom: slow push on panel A, glide along the long arrow to panel B, then pull back to the summary.
const Z0 = 8.6, Z1 = 9.3;
function camAt(t) {
  if (t < CONN.t0) return { c: A_C, s: 1 + 0.02 * seg(t, 0, CONN.t0) };
  const glide = eio(seg(t, CONN.t0 - 0.05, CONN.t1 + 0.05));
  if (t < CONN.t1) return { c: mix2(A_C, B_C, glide), s: lerp(1.02, 1, glide) };
  if (t < Z0) return { c: mix2(A_C, B_C, glide), s: 1 + 0.02 * seg(t, CONN.t1, Z0) };
  const out = eio(seg(t, Z0, Z1));
  return { c: mix2(B_C, SUM.c, out), s: lerp(1.02, SUM.s, out) * (1 - 0.012 * seg(t, Z1, 10)) };
}

function drawLabel(a, t) {
  const shown = t >= a.t1 ? a.w + 20 : writing(a, t).shown;
  ctx.translate(a.x, a.y); ctx.rotate(a.rot); ctx.translate(-a.x, -a.y);
  ctx.beginPath(); ctx.rect(a.left - 20, a.y - a.size * 1.3, shown + 20, a.size * 1.8); ctx.clip();
  ctx.font = `700 ${a.size}px ${FONT}`; ctx.fillStyle = a.color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(a.str, a.left, a.y);
}
function drawStroke(a, t) {
  if (a.clip) ctx.clip(a.clip);
  if (a.flap && t > a.t1) {        // wings beat once drawn
    const k = seg(t, a.t1, a.t1 + 0.25), ang = a.flap.sgn * 0.2 * k * Math.sin((t - a.t1) * 2 * Math.PI * 7 + a.flap.ph);
    ctx.translate(...a.flap.p); ctx.rotate(ang); ctx.translate(-a.flap.p[0], -a.flap.p[1]);
  }
  if (a.drift !== undefined && t > a.t1) {   // vapour keeps rising and wavering
    const k = t - a.t1; ctx.translate(Math.sin(k * 3 + a.drift) * 5, -Math.min(20, k * 14));
  }
  const drawn = a.ease(seg(t, a.t0, a.t1)) * a.path.len;
  ctx.strokeStyle = a.color; ctx.lineWidth = a.width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (a.dash) ctx.setLineDash(a.dash);
  ctx.beginPath(); a.path.trace(ctx, 0, drawn); ctx.stroke();
}
function drawMarker(m) {
  const sc = 1 + m.lift * 0.05;
  const stamp = (img, x, y) => { ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.drawImage(img, -PIV[0], -PIV[1]); ctx.restore(); };
  stamp(mShadow, m.p[0] + 14 + m.lift * 26, m.p[1] + 20 + m.lift * 34);   // shadow falls further as the pen lifts
  stamp(mSprite, m.p[0], m.p[1]);
}

function render(t) {
  const cam = camAt(t);
  ctx.setTransform(cam.s, 0, 0, cam.s, 960 - cam.c[0] * cam.s, 540 - cam.c[1] * cam.s);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(board, WB.x0, WB.y0, WB.w, WB.h);
  for (const a of acts) {
    if (t < a.t0) continue;
    ctx.save();
    if (a.kind === 'text') drawLabel(a, t); else drawStroke(a, t);
    ctx.restore();
  }
  const m = markerAt(t);
  if (!m.gone) drawMarker(m);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const falloff = ctx.createRadialGradient(960, 420, 400, 960, 540, 1250);   // light falls off toward the corners
  falloff.addColorStop(0, 'rgba(255,255,255,0)'); falloff.addColorStop(1, 'rgba(70,80,90,0.10)');
  ctx.fillStyle = falloff; ctx.fillRect(0, 0, W, H);
  const fo = seg(t, 9.62, 10); if (fo > 0) { ctx.fillStyle = `rgba(246,246,243,${eio2(fo)})`; ctx.fillRect(0, 0, W, H); }
}
// sound cues for audio.py
window.events = () => {
  const ev = [];
  for (const a of acts) ev.push({ t: a.t0, k: a.kind === 'text' ? 'write' : 'marker', d: +(a.t1 - a.t0).toFixed(3), n: a.kind === 'text' ? a.str.replace(/ /g, '').length : 0 });
  BEES.forEach(b => ev.push({ t: b.t0, k: 'buzz', pan: b.cx < BX ? -0.3 : 0.3 }));
  ev.push({ t: CONN.t0, k: 'whoosh', d: CONN.t1 - CONN.t0 + 0.2 }, { t: Z0, k: 'whoosh', d: Z1 - Z0 + 0.2 }, { t: Z1 - 0.1, k: 'chord' });
  return ev.sort((a, b) => a.t - b.t);
};
window.ready = loadFont('Kalam', 'Kalam-700', 700).then(() => document.fonts.load(`700 80px ${FONT}`, 'How do bees make honey?')).then(measureLabels);
window.draw = ({ t }) => {
  render(t);
  const url = cv.toDataURL('image/jpeg', 0.92);
  return url.slice(url.indexOf(',') + 1);
};
</script>
</body>
