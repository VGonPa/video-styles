// ── Point-and-Click Adventure · "The Damp Anchor" ─────────────────────────────────────────
// Early-90s painted-pixel adventure game. Everything is drawn on a 320×200 virtual screen and

// Backgrounds are "painted" as continuous values on colour ramps, then ordered-dithered (4×4

// Harbour tavern at dusk (iris in) → CUT → tavern interior: parrot exchange, damp map, the fish

const cv = document.getElementById('c'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;

const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, f) => a + (b - a) * f;
const eio = x => x < 0.5 ? 2 * x * x : 1 - 2 * (1 - x) * (1 - x);

const RN = Object.keys(RAMPS), RID = {}; RN.forEach((k, i) => RID[k] = i);

// ── painter: per-pixel (ramp, value) buffer → ordered dither ──
const MK = mk(VW, VH), M = MK.getContext('2d', { willReadFrequently: true });
class Paint {

const COL = { hero: '#fcfcf4', parrot: '#7ce860', label: '#f8d470', sign: '#fcd670' };

    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([u, v]) => { const xx = X + u, yy = y + v; return xx >= 0 && yy >= 0 && xx < 26 && yy < 22 && a[(yy * 26 + xx) * 4 + 3]; }); if (nb) { o[i] = 16; o[i + 1] = 8; o[i + 2] = 10; o[i + 3] = 255; } }
  x.putImageData(new ImageData(o, 26, 22), 0, 0); return c;
}
