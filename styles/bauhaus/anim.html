<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  html, body { margin: 0; background: #eee8dc; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Bauhaus poster: a circle, a square and a triangle land on the grid and assemble into a desk lamp.
// The switch clicks, a black block drops in over the right half, the beam splits into a triangle
// composition and coloured type bars finish the poster "LIGHT & FORM — Workshop Exhibition 1926".
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const FAMILY = "'Archivo', sans-serif";

// ---------- small maths ----------
const box = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
const mix = (p, q, u) => p * (1 - u) + q * u;
const span = (t, t0, t1) => box((t - t0) / (t1 - t0));
const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
const along = (p, q, u) => [mix(p[0], q[0], u), mix(p[1], q[1], u)];
const turn = (dx, dy, a) => [dx * Math.cos(a) - dy * Math.sin(a), dx * Math.sin(a) + dy * Math.cos(a)];
const Ease = {
  out: u => (u < 1 ? 1 - 2 ** (-10 * u) : 1),
  in: u => (u > 0 ? 2 ** (10 * (u - 1)) : 0),
  both: u => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? 2 ** (20 * u - 11) : 1 - 2 ** (9 - 20 * u)),
  settle: u => { const v = u - 1; return 1 + v * v * (1.9 * v + 0.9); }, // small overshoot, then rest
};

// ---------- palette ----------
const C = { paper: '#eee8dc', red: '#d02020', blue: '#1040c0', yellow: '#f0c020', black: '#121212', unlit: '#d6cdbb' };
const rgb = hex => [0, 1, 2].map(k => parseInt(hex.substr(1 + 2 * k, 2), 16));
function blend(a, b, u) {
  const p = rgb(a), q = rgb(b);
  return 'rgb(' + p.map((v, k) => Math.round(mix(v, q[k], u))).join(',') + ')';
}

// ---------- drawing primitives ----------
function layer(w, h) { return Object.assign(document.createElement('canvas'), { width: w, height: h }); }
function setType(weight, size, { stretch = 'normal', track = 0 } = {}) {
  ctx.font = weight + ' ' + size + 'px ' + FAMILY;
  ctx.fontStretch = stretch;
  ctx.letterSpacing = track + 'px';
}
function poly(pts, colour) {
  ctx.fillStyle = colour;
  ctx.beginPath();
  for (const [x, y] of pts) ctx.lineTo(x, y);
  ctx.closePath();
  ctx.fill();
}
function disc(x, y, r, colour) {
  if (!(r > 0)) return;
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.fill();
}
function rod(p, q, width, colour) {
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.lineCap = 'butt';
  ctx.beginPath();
  ctx.moveTo(p[0], p[1]);
  ctx.lineTo(q[0], q[1]);
  ctx.stroke();
}
// equilateral triangle around its centroid; angle 0 = apex up. Corners: apex, right, left.
function triangle(cx, cy, side, angle) {
  const R = side / Math.sqrt(3);
  return [0, 1, 2].map(k => {
    const a = angle - Math.PI / 2 + k * 2 * Math.PI / 3;
    return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  });
}
// two-tone triangle: the right half takes the second colour
function twoTone(cx, cy, side, angle, face, half) {
  const [apex, right, left] = triangle(cx, cy, side, angle);
  poly([apex, right, left], face);
  poly([apex, right, mid(right, left)], half);
}

// letters rise one by one out of a mask sitting on the baseline; returns the set width
function riseText(t, text, x, baseline, size, o) {
  setType(o.weight || 900, size, o);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, baseline - 0.95 * size, W, 1.2 * size);
  ctx.clip();
  ctx.fillStyle = o.colour;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  let pen = x;
  [...text].forEach((ch, i) => {
    const t0 = o.start + i * o.stagger, k = Ease.out(span(t, t0, t0 + 0.55));
    if (k > 0) ctx.fillText(ch, pen, baseline + 1.1 * size * (1 - k));
    pen += ctx.measureText(ch).width + (o.track || 0);
  });
  ctx.restore();
  return pen - x;
}

// print grain: a fixed speckle of faint black and white pixels, made once
let grain = null;
function makeGrain() {
  const cnv = layer(W, H), g = cnv.getContext('2d'), img = g.createImageData(W, H), px = img.data;
  let s = 0x2f6b1d3 | 0;
  for (let p = 0; p < px.length; p += 4) {
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    const r = (s >>> 0) / 4294967296 - 0.5;
    px[p] = px[p + 1] = px[p + 2] = r < 0 ? 0 : 255;
    px[p + 3] = Math.abs(r) * 34;
  }
  g.putImageData(img, 0, 0);
  return cnv;
}

// ---------- 12-column grid ----------
const MARGIN = 96, NCOL = 12, GAP = 24, COLW = (W - 2 * MARGIN - (NCOL - 1) * GAP) / NCOL;
const col = i => MARGIN + i * (COLW + GAP);
const FLOOR = 900, PANEL_X = col(6) - GAP / 2;
const GRID_V = [], GRID_H = [MARGIN, 360, 560, H - MARGIN].map((y, k) => ({ y, t0: 0.15 + 0.05 * k }));
for (let i = 0; i <= NCOL; i++) {
  const t0 = 0.05 + 0.025 * i;
  GRID_V.push({ x: i < NCOL ? col(i) : W - MARGIN, t0 });
  if (i > 0 && i < NCOL) GRID_V.push({ x: col(i) - GAP, t0 });
}
function drawGrid(t, colour) {
  ctx.save();
  ctx.strokeStyle = colour;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (const { x, t0 } of GRID_V) {
    const len = H * Ease.out(span(t, t0, t0 + 0.6));
    if (len > 0) { ctx.moveTo(x, 0); ctx.lineTo(x, len); }
  }
  for (const { y, t0 } of GRID_H) {
    const len = W * Ease.out(span(t, t0, t0 + 0.65));
    if (len > 0) { ctx.moveTo(0, y); ctx.lineTo(len, y); }
  }
  ctx.stroke();
  ctx.restore();
}

// ---------- lamp geometry ----------
// starting shapes on the floor
const SQUARE = { x: 1400, size: 180 }, CIRCLE = { x: 1100, r: 90 }, TRI = { x: 1700, side: 210 };
// assembled lamp: base slab, pivot, elbow, head
const BASE = { x: 1690, w: 300, h: 60 };
const PIVOT = [1650, FLOOR - BASE.h], ELBOW = [1540, 575], HEAD = [1330, 395];
const SWITCH = { x: BASE.x + 92, y: FLOOR - BASE.h, r: 17 };
const SHADE_SIDE = 230, SHADE_TILT = 0.1, SHADE_H = SHADE_SIDE * Math.sqrt(3) / 2;
const fromHead = (dx, dy) => { const [u, v] = turn(dx, dy, SHADE_TILT); return [HEAD[0] + u, HEAD[1] + v]; };
const SHADE_C = fromHead(0, SHADE_H * 2 / 3);
const BULB = { at: fromHead(0, SHADE_H + 6), r: 40 };
// the beam runs from the shade mouth down to the floor, as if cast from a point just above the shade
const MOUTH_L = fromHead(-SHADE_SIDE / 2, SHADE_H), MOUTH_R = fromHead(SHADE_SIDE / 2, SHADE_H);
const SOURCE = fromHead(0, -0.2 * SHADE_H);
const toFloor = p => { const k = (FLOOR - SOURCE[1]) / (p[1] - SOURCE[1]); return [SOURCE[0] + (p[0] - SOURCE[0]) * k, FLOOR]; };
const BEAM_L = toFloor(MOUTH_L), BEAM_R = toFloor(MOUTH_R);
const LIGHT_ON = 3.8;

// square: tumbles in from above, wobbles on landing, then flattens into the base; its red dot becomes the switch
function drawBase(t) {
  const fall = span(t, 1.0, 1.65), morph = Ease.both(span(t, 2.3, 2.85));
  if (fall <= 0) return;
  const since = t - 1.65, wobble = since > 0 ? 8 * Math.exp(-14 * since) * Math.sin(40 * since) : 0;
  const w = mix(SQUARE.size, BASE.w, morph), h = mix(SQUARE.size, BASE.h, morph), cx = mix(SQUARE.x, BASE.x, morph);
  const cy = mix(mix(-300, FLOOR - SQUARE.size / 2, fall * fall) - wobble, FLOOR - h / 2, morph);
  const spin = (1 - fall) * Math.PI / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(spin);
  ctx.fillStyle = C.blue;
  ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.restore();

  const inset = 0.28 * SQUARE.size, r0 = 0.15 * SQUARE.size;
  if (morph <= 0) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(spin);
    disc(inset - SQUARE.size / 2, inset - SQUARE.size / 2, r0, C.red);
    ctx.restore();
    return;
  }
  const press = Ease.out(span(t, 3.66, 3.74)) - 0.6 * Ease.out(span(t, 3.8, 3.95));
  ctx.save();
  if (morph > 0.6) { ctx.beginPath(); ctx.rect(0, 0, W, SWITCH.y + 1); ctx.clip(); } // switch sinks into the slab
  disc(mix(cx - w / 2 + inset, SWITCH.x, morph), mix(cy - h / 2 + inset, SWITCH.y + 9 * press, morph), mix(r0, SWITCH.r, morph), C.red);
  ctx.restore();
}

function drawArms(t, line) {
  const lower = Ease.out(span(t, 2.7, 3.0)), upper = Ease.out(span(t, 2.95, 3.25));
  if (lower > 0) rod(PIVOT, along(PIVOT, ELBOW, lower), 22, line);
  if (upper > 0) rod(ELBOW, along(ELBOW, HEAD, upper), 22, line);
  disc(PIVOT[0], PIVOT[1], 22 * Ease.settle(span(t, 2.62, 2.8)), line);
  disc(ELBOW[0], ELBOW[1], 20 * Ease.settle(span(t, 2.92, 3.1)), line);
  if (t > 2.92) disc(ELBOW[0], ELBOW[1], 7 * Ease.settle(span(t, 2.98, 3.14)), C.red);
}

// circle: rolls in from the right, then hops up into the shade as the bulb
function drawBulb(t) {
  const roll = span(t, 0.75, 1.7), lift = Ease.both(span(t, 2.95, 3.5));
  if (roll <= 0) return;
  const rx = mix(W + 220, CIRCLE.x, Ease.settle(roll)), ry = FLOOR - CIRCLE.r;
  const x = mix(rx, BULB.at[0], lift), y = mix(ry, BULB.at[1], lift) - 170 * Math.sin(Math.PI * lift);
  const r = mix(CIRCLE.r, BULB.r, lift);
  disc(x, y, r, t >= LIGHT_ON ? C.yellow : blend(C.yellow, C.unlit, lift));
  if (lift < 1) { // a black quarter shows the roll, fading while it flies
    const a = (rx - CIRCLE.x) / CIRCLE.r - 0.75 * Math.PI;
    ctx.globalAlpha = 1 - lift;
    ctx.fillStyle = C.black;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.arc(x, y, r, a, a + Math.PI / 2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// triangle: rises out of the floor, then flips a full turn up onto the head as the shade
function drawShade(t, half) {
  const rise = Ease.out(span(t, 1.3, 1.95)), fly = Ease.both(span(t, 2.55, 3.3));
  if (rise <= 0) return;
  const h0 = TRI.side * Math.sqrt(3) / 2;
  const x = mix(TRI.x, SHADE_C[0], fly);
  const y = mix(FLOOR - h0 / 3 + 1.05 * h0 * (1 - rise), SHADE_C[1], fly) - 120 * Math.sin(Math.PI * fly);
  ctx.save();
  if (fly <= 0) { ctx.beginPath(); ctx.rect(0, 0, W, FLOOR); ctx.clip(); }
  twoTone(x, y, mix(TRI.side, SHADE_SIDE, fly), mix(0, SHADE_TILT + 2 * Math.PI, fly), C.red, half);
  ctx.restore();
}

// the whole lamp; inverted = drawn inside the black block, where line work turns paper-coloured
function drawLamp(t, inverted) {
  const line = inverted ? C.paper : C.black;
  drawBase(t);
  drawArms(t, line);
  drawBulb(t);
  drawShade(t, line);
  disc(HEAD[0], HEAD[1], 18 * Ease.settle(span(t, 3.22, 3.4)), line);
}

// ---------- beam and the triangle composition it turns into ----------
const SLICE_COLOURS = [C.yellow, C.paper, C.yellow, C.red], SLICE_DROP = [0, 30, 0, 60];
const SATELLITES = [
  { x: 1105, y: 470, side: 120, angle: Math.PI, face: C.yellow, half: C.paper, t0: 5.55 },
  { x: 1760, y: 690, side: 90, angle: Math.PI / 6, face: C.red, half: C.black, t0: 5.7 }];
function drawBeam(t) {
  const open = span(t, 4.2, 4.62);
  if (open <= 0) return;
  const reach = Ease.settle(open), split = Ease.both(span(t, 5.0, 5.6));
  const hub = mid(MOUTH_L, MOUTH_R), n = SLICE_COLOURS.length;
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, FLOOR);
  ctx.clip();
  if (split <= 0) {
    poly([MOUTH_L, along(MOUTH_L, BEAM_L, reach), along(MOUTH_R, BEAM_R, reach), MOUTH_R], C.yellow);
  } else {
    // the beam cuts into slices that fan out around the mouth and change colour one after another
    for (let j = 0; j < n; j++) {
      const fan = (j - (n - 1) / 2) * 0.045 * split, sink = split * SLICE_DROP[j];
      const corners = [along(MOUTH_L, MOUTH_R, j / n), along(BEAM_L, BEAM_R, j / n), along(BEAM_L, BEAM_R, (j + 1) / n), along(MOUTH_L, MOUTH_R, (j + 1) / n)];
      corners[1][1] += sink;
      corners[2][1] += sink;
      const pts = corners.map(([px, py]) => { const [u, v] = turn(px - hub[0], py - hub[1], fan); return [hub[0] + u, hub[1] + v]; });
      poly(pts, t >= 5.25 + 0.12 * j ? SLICE_COLOURS[j] : C.yellow);
    }
  }
  // a blue half-disc of light rises out of the floor with a small black triangle inside it
  const poolX = (BEAM_L[0] + BEAM_R[0]) / 2 + 20;
  const pool = Ease.out(span(t, 5.45, 6.0));
  if (pool > 0) {
    ctx.fillStyle = C.blue;
    ctx.beginPath();
    ctx.arc(poolX, FLOOR + 150 * (1 - pool), 118, Math.PI, 2 * Math.PI);
    ctx.fill();
  }
  const pip = Ease.out(span(t, 5.7, 6.15));
  if (pip > 0) poly(triangle(poolX, FLOOR - 34 + 110 * (1 - pip), 80, 0), C.black);
  ctx.restore();
  for (const s of SATELLITES) {
    const q = span(t, s.t0, s.t0 + 0.45);
    if (q > 0) twoTone(s.x, s.y, s.side * Ease.settle(q), s.angle - 1.2 * (1 - Ease.out(q)), s.face, s.half);
  }
}

// the black block: three double-column strips slide down from the top, one after another
function blockClip(t) {
  ctx.beginPath();
  let open = false;
  for (let i = 0; i < 3; i++) {
    const k = Ease.both(span(t, LIGHT_ON + 0.07 * i, LIGHT_ON + 0.4 + 0.07 * i));
    if (k <= 0) continue;
    open = true;
    const x0 = col(6 + 2 * i) - GAP / 2, x1 = i === 2 ? W : col(8 + 2 * i) - GAP / 2 + 1;
    ctx.rect(x0, 0, x1 - x0, H * k);
  }
  return open;
}

// ---------- type bars on the left ----------
const BARS = [
  { y: 612, h: 78, w: 820, col: C.red, txt: 'WORKSHOP EXHIBITION', tc: C.paper, px: 44, t0: 6.0 },
  { y: 706, h: 58, w: 640, col: C.yellow, txt: '12 MAY — 30 JUNE', tc: C.black, px: 34, t0: 6.15 },
  { y: 780, h: 58, w: 740, col: C.blue, txt: 'METAL WORKSHOP · HALL 3', tc: C.paper, px: 34, t0: 6.3 }];
function drawBars(t) {
  for (const b of BARS) {
    const k = span(t, b.t0, b.t0 + 0.5);
    if (k <= 0) continue;
    const len = Math.max(0, b.w * Ease.settle(k));
    ctx.fillStyle = b.col;
    ctx.fillRect(MARGIN, b.y, len, b.h);
    ctx.save();
    ctx.beginPath();
    ctx.rect(MARGIN, b.y, len, b.h);
    ctx.clip();
    riseText(t, b.txt, MARGIN + 24, b.y + b.h / 2 + 0.36 * b.px, b.px,
      { weight: 800, stretch: 'expanded', track: 2, start: b.t0 + 0.18, stagger: 0.016, colour: b.tc });
    ctx.restore();
  }
}

function caption(text, x, y, align, colour, alpha) {
  setType(700, alpha === undefined ? 24 : 22, { track: 3 });
  ctx.fillStyle = colour;
  ctx.textAlign = align;
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

const LABELS = [[CIRCLE.x, '01', 'CIRCLE'], [SQUARE.x, '02', 'SQUARE'], [TRI.x, '03', 'TRIANGLE']];
function drawLabels(t) { // shape names under the floor line; they drop away as the lamp assembles
  LABELS.forEach(([x, num, name], i) => {
    const t0 = 1.75 + 0.1 * i;
    if (t < t0) return;
    const away = Ease.in(span(t, 2.25 + 0.05 * i, 2.5 + 0.05 * i));
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, FLOOR + 10, W, 90);
    ctx.clip();
    ctx.translate(0, 90 * away);
    caption(num + ' — ' + name, x, FLOOR + 56, 'center', C.black, span(t, t0, t0 + 0.2));
    ctx.restore();
  });
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.paper;
  ctx.fillRect(0, 0, W, H);
  drawGrid(t, 'rgba(18,18,18,0.11)');

  // kicker, headline and floor rule
  setType(700, 24, { track: 3 });
  ctx.fillStyle = C.black;
  ctx.globalAlpha = span(t, 1.2, 1.5);
  ctx.fillText('EXHIBITION POSTER — NO. 3', MARGIN, 150);
  ctx.globalAlpha = 1;
  ctx.fillStyle = C.red;
  ctx.fillRect(MARGIN, 165, 120 * Ease.out(span(t, 1.3, 1.7)), 10);
  const head = { stretch: 'expanded', track: -6, stagger: 0.05, colour: C.black };
  riseText(t, 'LIGHT', MARGIN - 6, 340, 164, { ...head, start: 0.35 });
  riseText(t, '& FORM', MARGIN - 6, 516, 164, { ...head, start: 0.6 });
  ctx.fillStyle = C.black;
  ctx.fillRect(MARGIN, FLOOR, (W - 2 * MARGIN) * Ease.out(span(t, 0.45, 1.1)), 8);

  drawLabels(t);
  drawBars(t);
  drawLamp(t, false);

  // switch on: inside the black block the lamp inverts and lights up
  ctx.save();
  if (blockClip(t)) {
    ctx.clip();
    ctx.fillStyle = C.black;
    ctx.fillRect(0, 0, W, H);
    drawGrid(9, 'rgba(238,232,220,0.07)');
    ctx.fillStyle = C.paper;
    ctx.fillRect(PANEL_X, FLOOR, W - MARGIN - PANEL_X, 8);
    drawBeam(t);
    drawLamp(t, true);
    setType(900, 190, { track: -6 });
    const yearW = ctx.measureText('1926').width + 6;
    riseText(t, '1926', W - MARGIN - yearW, 262, 190, { track: -6, start: 6.55, stagger: 0.06, colour: C.yellow });
    caption('OPEN DAILY 10 — 18', W - MARGIN, 312, 'right', C.paper, span(t, 6.95, 7.2));
  }
  ctx.restore();

  // a yellow ring flashes out of the bulb at switch-on
  const flash = span(t, LIGHT_ON, LIGHT_ON + 0.5);
  if (flash > 0 && flash < 1) {
    ctx.strokeStyle = C.yellow;
    ctx.lineWidth = 14 * (1 - flash);
    ctx.beginPath();
    ctx.arc(BULB.at[0], BULB.at[1], BULB.r + 190 * Ease.out(flash), 0, 2 * Math.PI);
    ctx.stroke();
  }

  ctx.globalAlpha = 0.55;
  ctx.drawImage(grain, 0, 0);
  // fade up from paper and back to paper at the end
  ctx.globalAlpha = Math.max(1 - span(t, 0, 0.25), Ease.both(span(t, 9.2, 9.6)));
  if (ctx.globalAlpha > 0) { ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H); }
  ctx.globalAlpha = 1;
}

// sound events for audio.py (k = kind, t = seconds)
window.events = () => {
  const ev = [], E = (t, k, o = {}) => ev.push({ t: +t.toFixed(3), k, ...o });
  for (let i = 0; i <= 12; i++) E(0.1 + i * 0.04, 'tick', { f: 2000, v: 0.04 });
  'LIGHT'.split('').forEach((_, i) => E(0.4 + i * 0.05, 'clack', { f: 1300 + i * 30, v: 0.11 }));
  '& FORM'.split('').forEach((_, i) => E(0.65 + i * 0.05, 'clack', { f: 1200 + i * 30, v: 0.1 }));
  E(0.8, 'roll', { d: 0.9 }); E(1.62, 'bloop', { f: 260, v: 0.35 });
  E(1.65, 'thud', { f: 120, v: 0.55 }); E(1.75, 'thud', { f: 150, v: 0.15 });
  E(1.55, 'pop', { f: 700, v: 0.3 });
  [1.75, 1.85, 1.95].forEach(t => E(t, 'tick', { f: 2600, v: 0.08 }));
  E(2.3, 'bloopdn', { f: 600, v: 0.25 }); E(2.8, 'clack', { f: 900, v: 0.25 });
  E(2.62, 'pop', { f: 1000, v: 0.28 }); E(2.92, 'pop', { f: 1150, v: 0.28 }); E(3.22, 'pop', { f: 1300, v: 0.28 });
  E(2.7, 'tick', { f: 3000, v: 0.08 }); E(2.95, 'tick', { f: 3200, v: 0.08 });
  E(3.3, 'clack', { f: 1100, v: 0.3 }); E(3.48, 'blip', { f: 1500, v: 0.18 });
  E(3.7, 'click', { v: 0.5 });
  E(3.8, 'on', { v: 0.6 }); [3.8, 3.87, 3.94].forEach((t, i) => E(t + 0.33, 'thud', { f: 95 + i * 12, v: 0.4 }));
  E(4.2, 'chime', { f: 659, v: 0.28 });
  for (let j = 0; j < 4; j++) E(5.25 + j * 0.12, 'tick', { f: 1800 + j * 250, v: 0.14 });
