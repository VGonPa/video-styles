<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#eee8dc}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Bauhaus poster: circle, square and triangle on the grid assemble into a desk lamp; the switch clicks,
// a black block drops in, the light cone splits into a triangle composition and type bars finish the
// poster "LIGHT & FORM — Workshop Exhibition 1926".
const W = 1920, H = 1080, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DUR = 9.6, FF = "'Archivo', sans-serif";
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eExpoOut = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eExpoIn = x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10);
const eExpoInOut = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eBackS = x => { const s = 0.9, c = s + 1; return 1 + c * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); }; // restrained overshoot
function off(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const K = { paper: '#eee8dc', red: '#d02020', blue: '#1040c0', yellow: '#f0c020', ink: '#121212', bulbOff: '#d6cdbb' };
function font(w, px, stretch = 'normal', ls = 0) { ctx.font = `${w} ${px}px ${FF}`; ctx.fontStretch = stretch; ctx.letterSpacing = ls + 'px'; }
function mixHex(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }

let GRAIN;
function buildGrain() {
  GRAIN = off(W, H); const g = GRAIN.getContext('2d'); const id = g.createImageData(W, H); let s = 12345;
  for (let i = 0; i < id.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s / 2147483647; const n = v < 0.5 ? 0 : 255;
    id.data[i] = id.data[i + 1] = id.data[i + 2] = n; id.data[i + 3] = Math.abs(v - 0.5) * 34; }
  g.putImageData(id, 0, 0);
}

// ---------- grid ----------
const M = 96, COLS = 12, GUT = 24, CW = (W - 2 * M - (COLS - 1) * GUT) / COLS;
const colX = i => M + i * (CW + GUT);
const FLOOR = 900, PANEL_X = colX(6) - GUT / 2, HEAD_PX = 164;
function grid(t, col) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  for (let i = 0; i <= COLS; i++) { const p = eExpoOut(seg(t, 0.05 + i * 0.025, 0.65 + i * 0.025)); if (p <= 0) continue;
    for (const x of i < COLS ? [colX(i)] : [W - M]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H * p); ctx.stroke(); }
    if (i > 0 && i < COLS) { const x = colX(i) - GUT; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H * p); ctx.stroke(); } }
  [M, 360, 560, H - M].forEach((y, k) => { const p = eExpoOut(seg(t, 0.15 + k * 0.05, 0.8 + k * 0.05));
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W * p, y); ctx.stroke(); });
  ctx.restore();
}
function maskedLetters(str, x, y, px, stretch, t0, t, col, stag = 0.035, ls = 0, w8 = 900) {
  font(w8, px, stretch, ls); let cx = x;
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - px * 0.95, W, px * 1.2); ctx.clip();
  ctx.fillStyle = col; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  for (let i = 0; i < str.length; i++) { const ch = str[i], w = ctx.measureText(ch).width;
    const p = eExpoOut(seg(t, t0 + i * stag, t0 + i * stag + 0.55)); if (p > 0) ctx.fillText(ch, cx, y + (1 - p) * px * 1.1); cx += w + ls; }
  ctx.restore(); return cx - x;
}
function triPath(x, cyC, side, rot) { // equilateral, rotation about centroid; returns the three vertices
  const h = side * Math.sqrt(3) / 2, c = Math.cos(rot), s = Math.sin(rot);
  return [[0, -h * 2 / 3], [side / 2, h / 3], [-side / 2, h / 3]].map(([u, v]) => [x + u * c - v * s, cyC + u * s + v * c]);
}
function fillPoly(pts, col) { ctx.fillStyle = col; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }
function triShape(x, cyC, side, rot, col, shade) {
  const [a, b, c] = triPath(x, cyC, side, rot); fillPoly([a, b, c], col);
  fillPoly([a, b, [(b[0] + c[0]) / 2, (b[1] + c[1]) / 2]], shade);
}

// ---------- lamp geometry ----------
const SQ0 = { x: 1400, a: 180 }, CI0 = { x: 1100, r: 90 }, TR0 = { x: 1700, side: 210 };
const BASE = { x: 1690, w: 300, h: 60 };
const P0 = [1650, FLOOR - BASE.h], EL = [1540, 575], HD = [1330, 395];
const SHADE = { side: 230, tilt: 0.1 };
const SH_H = SHADE.side * Math.sqrt(3) / 2;
const rotV = (u, v, r) => [u * Math.cos(r) - v * Math.sin(r), u * Math.sin(r) + v * Math.cos(r)];
const shadeCentroid = (() => { const d = rotV(0, SH_H * 2 / 3, SHADE.tilt); return [HD[0] + d[0], HD[1] + d[1]]; })();
const BULB = (() => { const d = rotV(0, SH_H + 6, SHADE.tilt); return { x: HD[0] + d[0], y: HD[1] + d[1], r: 40 }; })();
const SWITCH = { x: BASE.x + 92, y: FLOOR - BASE.h, r: 17 };
// light cone: rays from a virtual apex above the shade through the mouth corners, drawn from the mouth down to the floor
const CONE = (() => { const A = (() => { const d = rotV(0, -SH_H * 0.2, SHADE.tilt); return [HD[0] + d[0], HD[1] + d[1]]; })();
  const corners = [rotV(-SHADE.side / 2, SH_H, SHADE.tilt), rotV(SHADE.side / 2, SH_H, SHADE.tilt)].map(d => [HD[0] + d[0], HD[1] + d[1]]);
  const floor = corners.map(c => { const s = (FLOOR - A[1]) / (c[1] - A[1]); return [A[0] + (c[0] - A[0]) * s, FLOOR]; });
  return { ML: corners[0], MR: corners[1], L: floor[0], R: floor[1] }; })();

function bar(a, b, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'butt'; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function dot(x, y, r, col) { if (r <= 0) return; ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

// the lamp + its source shapes. inv = drawn inside the black block (line work turns paper)
function lamp(t, inv) {
  const LINE = inv ? K.paper : K.ink, SHADOW = inv ? K.paper : K.ink;
  const on = t >= 3.8;
  // --- square → base ---
  const sp = seg(t, 1.0, 1.65), mB = eExpoInOut(seg(t, 2.3, 2.85));
  if (sp > 0) {
    const land = t - 1.65, bounce = land > 0 ? Math.exp(-land * 14) * Math.sin(land * 40) * 8 : 0;
    const w = lerp(SQ0.a, BASE.w, mB), h = lerp(SQ0.a, BASE.h, mB), cx = lerp(SQ0.x, BASE.x, mB);
    const cy = lerp(-300, FLOOR - SQ0.a / 2, sp * sp) * (1 - mB) + (FLOOR - h / 2) * mB - bounce * (1 - mB);
    const rot = (1 - sp) * Math.PI / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.fillStyle = K.blue; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.restore();
    // the red dot becomes the switch; pressed at 3.72
    const press = eExpoOut(seg(t, 3.66, 3.74)) - eExpoOut(seg(t, 3.8, 3.95)) * 0.6;
    const dx = lerp(cx - w / 2 + SQ0.a * 0.28, SWITCH.x, mB), dy = lerp(cy - h / 2 + SQ0.a * 0.28, SWITCH.y + press * 9, mB);
    if (mB <= 0) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); dot(-SQ0.a / 2 + SQ0.a * 0.28, -SQ0.a / 2 + SQ0.a * 0.28, SQ0.a * 0.15, K.red); ctx.restore(); }
    else { ctx.save(); if (mB > 0.6) { ctx.beginPath(); ctx.rect(0, 0, W, FLOOR - BASE.h + 1); ctx.clip(); } dot(dx, dy, lerp(SQ0.a * 0.15, SWITCH.r, mB), K.red); ctx.restore(); }
  }
  // --- arms + hinges ---
  const a1 = eExpoOut(seg(t, 2.7, 3.0)), a2 = eExpoOut(seg(t, 2.95, 3.25));
  if (a1 > 0) bar(P0, [lerp(P0[0], EL[0], a1), lerp(P0[1], EL[1], a1)], 22, LINE);
  if (a2 > 0) bar(EL, [lerp(EL[0], HD[0], a2), lerp(EL[1], HD[1], a2)], 22, LINE);
  dot(P0[0], P0[1], 22 * eBackS(seg(t, 2.62, 2.8)), LINE);
  dot(EL[0], EL[1], 20 * eBackS(seg(t, 2.92, 3.1)), LINE);
  if (seg(t, 2.92, 3.1) > 0) dot(EL[0], EL[1], 7 * eBackS(seg(t, 2.98, 3.14)), K.red);
  // --- circle → bulb (drawn under the shade) ---
  const cp = seg(t, 0.75, 1.7), mC = eExpoInOut(seg(t, 2.95, 3.5));
  if (cp > 0) {
    const rx = lerp(W + 220, CI0.x, eBackS(cp)), ry = FLOOR - CI0.r;
    const x = lerp(rx, BULB.x, mC), y = lerp(ry, BULB.y, mC) - Math.sin(Math.PI * mC) * 170, r = lerp(CI0.r, BULB.r, mC);
    const col = on ? K.yellow : mixHex(K.yellow, K.bulbOff, mC);
    dot(x, y, r, col);
    if (mC < 1) { const rot = (rx - CI0.x) / CI0.r - Math.PI * 0.75; ctx.globalAlpha = 1 - mC; ctx.fillStyle = K.ink;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, rot, rot + Math.PI / 2); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
  }
  // --- triangle → shade ---
  const tp = eExpoOut(seg(t, 1.3, 1.95)), mT = eExpoInOut(seg(t, 2.55, 3.3));
  if (tp > 0) {
    const h0 = TR0.side * Math.sqrt(3) / 2;
    const x = lerp(TR0.x, shadeCentroid[0], mT), y = lerp(FLOOR - h0 / 3 + (1 - tp) * h0 * 1.05, shadeCentroid[1], mT) - Math.sin(Math.PI * mT) * 120;
    const side = lerp(TR0.side, SHADE.side, mT), rot = lerp(0, SHADE.tilt + Math.PI * 2, mT);
    ctx.save(); if (mT <= 0) { ctx.beginPath(); ctx.rect(0, 0, W, FLOOR); ctx.clip(); }
    triShape(x, y, side, rot, K.red, SHADOW); ctx.restore();
  }
  dot(HD[0], HD[1], 18 * eBackS(seg(t, 3.22, 3.4)), LINE);
}

// light cone and the triangle composition it becomes
function cone(t) {
  const g = seg(t, 4.2, 4.62); if (g <= 0) return;
  const k = eBackS(g), { ML, MR, L, R } = CONE;
  const split = eExpoInOut(seg(t, 5.0, 5.6)), N = 4, cols = [K.yellow, K.paper, K.yellow, K.red];
  const mc = [(ML[0] + MR[0]) / 2, (ML[1] + MR[1]) / 2];
  const at = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
  const grow = (m, f) => [m[0] + (f[0] - m[0]) * k, m[1] + (f[1] - m[1]) * k];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, FLOOR); ctx.clip();
  if (split <= 0) fillPoly([ML, grow(ML, L), grow(MR, R), MR], K.yellow);
  else for (let j = 0; j < N; j++) { // the beam splits into four slices that fan apart and step to new colours
    const m0 = at(ML, MR, j / N), m1 = at(ML, MR, (j + 1) / N), f0 = at(L, R, j / N), f1 = at(L, R, (j + 1) / N);
    const fan = (j - (N - 1) / 2) * 0.045 * split, drop = split * [0, 30, 0, 60][j];
    const pts = [m0, [f0[0], f0[1] + drop], [f1[0], f1[1] + drop], m1].map(([x, y]) => { const r = rotV(x - mc[0], y - mc[1], fan); return [mc[0] + r[0], mc[1] + r[1]]; });
    fillPoly(pts, t >= 5.25 + j * 0.12 ? cols[j] : K.yellow);
  }
  // blue half-disc of light pooling on the floor, small ink triangle in the pool
  const pool = eExpoOut(seg(t, 5.45, 6.0)), pc = lerp(L[0], R[0], 0.5);
  if (pool > 0) { ctx.fillStyle = K.blue; ctx.beginPath(); ctx.arc(pc + 20, FLOOR + (1 - pool) * 150, 118, Math.PI, 0); ctx.fill(); }
  const it = eExpoOut(seg(t, 5.7, 6.15));
  if (it > 0) triShape(pc + 20, FLOOR - 34 + (1 - it) * 110, 80, 0, K.ink, K.ink);
  ctx.restore();
  // satellite triangles complete the composition
  [[1105, 470, 120, Math.PI, K.yellow, K.paper, 5.55], [1760, 690, 90, Math.PI / 6, K.red, K.ink, 5.7]].forEach(([x, y, sd, r, c1, c2, t0]) => {
    const q = seg(t, t0, t0 + 0.45); if (q > 0) triShape(x, y, sd * eBackS(q), r + (1 - eExpoOut(q)) * -1.2, c1, c2); });
}

function panelClip(t) { // three double-column strips drop in from the top, staggered
  ctx.beginPath(); let any = false;
  for (let i = 0; i < 3; i++) { const p = eExpoInOut(seg(t, 3.8 + i * 0.07, 4.2 + i * 0.07)); if (p <= 0) continue; any = true;
    const x0 = i === 0 ? PANEL_X : colX(6 + 2 * i) - GUT / 2, x1 = i === 2 ? W : colX(8 + 2 * i) - GUT / 2;
    ctx.rect(x0, 0, x1 - x0 + (i < 2 ? 1 : 0), H * p); }
  return any;
}

// ---------- typographic bars (left) ----------
const BARS = [
  { y: 612, h: 78, w: 820, col: K.red, txt: 'WORKSHOP EXHIBITION', tc: K.paper, px: 44, t0: 6.0 },
  { y: 706, h: 58, w: 640, col: K.yellow, txt: '12 MAY — 30 JUNE', tc: K.ink, px: 34, t0: 6.15 },
  { y: 780, h: 58, w: 740, col: K.blue, txt: 'METAL WORKSHOP · HALL 3', tc: K.paper, px: 34, t0: 6.3 }];
function bars(t) {
  for (const b of BARS) {
    const p = seg(t, b.t0, b.t0 + 0.5); if (p <= 0) continue;
    const w = b.w * eBackS(p); ctx.fillStyle = b.col; ctx.fillRect(M, b.y, w, b.h);
    ctx.save(); ctx.beginPath(); ctx.rect(M, b.y, Math.max(0, w), b.h); ctx.clip();
    maskedLetters(b.txt, M + 24, b.y + b.h / 2 + b.px * 0.36, b.px, 'expanded', b.t0 + 0.18, t, b.tc, 0.016, 2, 800);
    ctx.restore();
  }
}

function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = K.paper; ctx.fillRect(0, 0, W, H); grid(t, 'rgba(18,18,18,0.11)');
  // headline + caption
  font(700, 24, 'normal', 3); ctx.fillStyle = K.ink; ctx.textAlign = 'left'; ctx.globalAlpha = seg(t, 1.2, 1.5);
  ctx.fillText('EXHIBITION POSTER — NO. 3', M, 150); ctx.globalAlpha = 1;
  ctx.fillStyle = K.red; ctx.fillRect(M, 165, 120 * eExpoOut(seg(t, 1.3, 1.7)), 10);
  maskedLetters('LIGHT', M - 6, 340, HEAD_PX, 'expanded', 0.35, t, K.ink, 0.05, -6);
  maskedLetters('& FORM', M - 6, 516, HEAD_PX, 'expanded', 0.6, t, K.ink, 0.05, -6);
  // baseline rule
  const bl = eExpoOut(seg(t, 0.45, 1.1)); ctx.fillStyle = K.ink; ctx.fillRect(M, FLOOR, (W - 2 * M) * bl, 8);
  // shape labels (scene 1), leave on assembly
  [[CI0.x, '01', 'CIRCLE'], [SQ0.x, '02', 'SQUARE'], [TR0.x, '03', 'TRIANGLE']].forEach(([x, n, w], i) => {
    const t0 = 1.75 + i * 0.1, out = eExpoIn(seg(t, 2.25 + i * 0.05, 2.5 + i * 0.05)); if (t < t0) return;
    ctx.save(); ctx.beginPath(); ctx.rect(0, FLOOR + 10, W, 90); ctx.clip(); ctx.translate(0, out * 90);
    font(700, 22, 'normal', 3); ctx.fillStyle = K.ink; ctx.textAlign = 'center'; ctx.globalAlpha = seg(t, t0, t0 + 0.2);
    ctx.fillText(n + ' — ' + w, x, FLOOR + 56); ctx.globalAlpha = 1; ctx.textAlign = 'left'; ctx.restore(); });
  bars(t);
  lamp(t, false);
  // switch on: the black block drops in over the right half; inside it the lamp inverts and lights up
  ctx.save();
  if (panelClip(t)) { ctx.clip(); ctx.fillStyle = K.ink; ctx.fillRect(0, 0, W, H);
    grid(9, 'rgba(238,232,220,0.07)'); ctx.fillStyle = K.paper; ctx.fillRect(PANEL_X, FLOOR, W - M - PANEL_X, 8);
    cone(t); lamp(t, true);
    font(900, 190, 'normal', -6); const yw = ctx.measureText('1926').width + 6; maskedLetters('1926', W - M - yw, 262, 190, 'normal', 6.55, t, K.yellow, 0.06, -6);
    font(700, 22, 'normal', 3); ctx.fillStyle = K.paper; ctx.textAlign = 'right'; ctx.globalAlpha = seg(t, 6.95, 7.2);
    ctx.fillText('OPEN DAILY 10 — 18', W - M, 312); ctx.globalAlpha = 1; ctx.textAlign = 'left'; }
  ctx.restore();
  // bulb flash ring at switch-on
  const fl = seg(t, 3.8, 4.3);
  if (fl > 0 && fl < 1) { ctx.strokeStyle = K.yellow; ctx.lineWidth = 14 * (1 - fl); ctx.beginPath(); ctx.arc(BULB.x, BULB.y, BULB.r + eExpoOut(fl) * 190, 0, 7); ctx.stroke(); }
  // print grain over everything
  ctx.globalAlpha = 0.55; ctx.drawImage(GRAIN, 0, 0); ctx.globalAlpha = 1;
  const fade = Math.max(1 - seg(t, 0, 0.25), eExpoInOut(seg(t, 9.2, 9.6)));
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = K.paper; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// sound events for audio.py (k = kind, t = seconds)
window.events = () => {
  const ev = [], E = (t, k, o = {}) => ev.push({ t: +t.toFixed(3), k, ...o });
  for (let i = 0; i <= 12; i++) E(0.1 + i * 0.04, 'tick', { f: 2000, v: 0.04 });
  'LIGHT'.split('').forEach((_, i) => E(0.4 + i * 0.05, 'clack', { f: 1300 + i * 30, v: 0.11 }));
  '& FORM'.split('').forEach((_, i) => E(0.65 + i * 0.05, 'clack', { f: 1200 + i * 30, v: 0.1 }));
  E(0.8, 'roll', { d: 0.9 }); E(1.62, 'bloop', { f: 260, v: 0.35 });
  E(1.65, 'thud', { f: 120, v: 0.55 }); E(1.75, 'thud', { f: 150, v: 0.15 });
  E(1.55, 'pop', { f: 700, v: 0.3 });
  [1.75, 1.85, 1.95].forEach(t => E(t, 'tick', { f: 2600, v: 0.08 }));
  E(2.3, 'bloopdn', { f: 600, v: 0.25 }); E(2.8, 'clack', { f: 900, v: 0.25 });
  E(2.62, 'pop', { f: 1000, v: 0.28 }); E(2.92, 'pop', { f: 1150, v: 0.28 }); E(3.22, 'pop', { f: 1300, v: 0.28 });
  E(2.7, 'tick', { f: 3000, v: 0.08 }); E(2.95, 'tick', { f: 3200, v: 0.08 });
  E(3.3, 'clack', { f: 1100, v: 0.3 }); E(3.48, 'blip', { f: 1500, v: 0.18 });
  E(3.7, 'click', { v: 0.5 });
  E(3.8, 'on', { v: 0.6 }); [3.8, 3.87, 3.94].forEach((t, i) => E(t + 0.33, 'thud', { f: 95 + i * 12, v: 0.4 }));
  E(4.2, 'chime', { f: 659, v: 0.28 });
  for (let j = 0; j < 4; j++) E(5.25 + j * 0.12, 'tick', { f: 1800 + j * 250, v: 0.14 });
  E(5.0, 'swish', { d: 0.6, v: 0.2 }); E(5.45, 'bloop', { f: 200, v: 0.3 }); E(5.7, 'pop', { f: 900, v: 0.25 }); E(5.55, 'pop', { f: 1200, v: 0.22 }); E(5.72, 'pop', { f: 1400, v: 0.2 });
  BARS.forEach(b => { E(b.t0, 'swish', { d: 0.35, v: 0.22 }); E(b.t0 + 0.32, 'clack', { f: 1000, v: 0.2 });
    for (let i = 0; i < b.txt.length; i += 2) E(b.t0 + 0.18 + i * 0.016, 'tick', { f: 2200, v: 0.035 }); });
  '1926'.split('').forEach((_, i) => E(6.6 + i * 0.06, 'clack', { f: 1500 + i * 60, v: 0.14 }));
  E(7.35, 'chord', { v: 0.3 });
  return ev;
};
window.draw = function (job) { frame(job.t); return cv.toDataURL('image/jpeg', job.q || 0.92).split(',')[1]; };
window.ready = document.fonts.ready.then(() => Promise.all([
  document.fonts.load(`900 100px 'Archivo'`, 'LIGHT & FORM 1926'),
  document.fonts.load(`800 30px 'Archivo'`, 'WORKSHOP EXHIBITION 12 MAY — 30 JUNE METAL · HALL 3'),
  document.fonts.load(`700 30px 'Archivo'`, 'EXHIBITION POSTER — NO. 3 01 02 03 CIRCLE SQUARE TRIANGLE OPEN DAILY 10 18')])).then(buildGrain);
</script></body></html>
