<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#0b0d11}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── terminal-dashboard · a multi-panel TUI on one character grid ──────────────────────────────────
// Everything below the title bar is a 106 x 32 cell buffer that is rewritten every frame and then painted:
// letters with Fira Code (exactly one fillText per cell, so no ligature ever forms), and every box-drawing,
// block, shade, braille, arrow and status glyph drawn per cell with rects and paths, the way terminal
// emulators do, so borders and bars join without seams. Nothing moves smoothly: bars step in eighths,
// counters jump, log lines arrive whole and scroll by whole rows, panels appear and vanish whole.
const W = 1920, H = 1080, FPS = 30, DUR = 10.4;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const at = (t, x) => t >= x - 1e-6;
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3);
function hash(a, b = 0) {
  let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1);
  h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; h = Math.imul(h, 0x297a2d39); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

// ── palette ──────────────────────────────────────────────────────────────────────────────────────
const C = {
  field: '#0b0d11', border: '#454f5c', text: '#c8cfd8', dim: '#66707d', cdim: '#7d8794',
  run: '#56c2d6', pass: '#7fd48c', reroute: '#e3b153', stop: '#ee6f68', focus: '#e6ebf0',
  chip: '#1c222b', bar: '#12161c', barLine: '#1f252e', dots: '#3a414b',
};

// ── the grid ─────────────────────────────────────────────────────────────────────────────────────
// Fira Code's advance is exactly 0.6 em, so 30 px type gives an integer 18 px cell; rows are 32 px.
const CW = 18, CH = 32, COLS = 106, ROWS = 32, TITLE_H = 40;
const GX = Math.floor((W - COLS * CW) / 2), GY = TITLE_H + Math.floor((H - TITLE_H - ROWS * CH) / 2);
const FONT = '"Fira Code"';
let FS = 30, BASE = 25;                 // font px and baseline offset inside a cell, measured in window.ready
const N = COLS * ROWS;
const cellCh = new Array(N), cellFg = new Array(N), cellBg = new Array(N), cellWt = new Uint8Array(N);
// cellPix marks block cells that fill the whole cell (block letters, the cost view's bars) so vertically
// adjacent cells meet; other bar blocks sit on the text's cap band, so bars on neighbouring rows stay apart.
const cellPix = new Uint8Array(N);

function wipe() { cellCh.fill(' '); cellFg.fill(C.text); cellBg.fill(null); cellWt.fill(0); cellPix.fill(0); }
// Write a string at (col,row); characters outside the grid are dropped. Returns the column after it.
function put(col, row, s, fg = C.text, bold = 0, bg, pix = 0) {
  for (const ch of s) {
    if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
      const i = row * COLS + col;
      cellCh[i] = ch; cellFg[i] = fg; cellWt[i] = bold; cellPix[i] = pix;
      if (bg !== undefined) cellBg[i] = bg;
    }
    col++;
  }
  return col;
}
// A run of parts: [text, fg, bold, pix].
function line(col, row, parts, bg) {
  for (const [s, fg, b, p] of parts) col = put(col, row, s, fg, b, bg, p);
  return col;
}
const len = s => [...s].length;
const width = parts => parts.reduce((n, [s]) => n + len(s), 0);
const pad = (s, n) => s + ' '.repeat(Math.max(0, n - len(s)));
const lpad = (s, n) => ' '.repeat(Math.max(0, n - len(s))) + s;

// ── procedural glyphs ────────────────────────────────────────────────────────────────────────────
// Light lines are 2 px wide through the cell centre (x+8..9, y+15..16), so a run of cells is one line.
const LX = 8, LY = 15, MX = LX + 1, MY = LY + 1;
const U = 1, R = 2, D = 4, L = 8;
const LIGHT = { '─': R | L, '│': U | D, '├': U | D | R, '┤': U | D | L, '┬': L | R | D, '┴': L | R | U, '┼': 15 };
const ROUND = { '╭': R | D, '╮': L | D, '╰': U | R, '╯': U | L };
// Double lines: two 2 px strokes 3 px either side of the same centre.
const DOUBLE = { '═': R | L, '║': U | D, '╔': R | D, '╗': L | D, '╚': U | R, '╝': U | L };
const EIGHTH = { '▏': 1, '▎': 2, '▍': 3, '▌': 4, '▋': 5, '▊': 6, '▉': 7, '█': 8 };
const BAR_Y = 6, BAR_H = 20;
const BRAILLE_DOTS = [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [0, 3], [1, 3]];
// Characters the font draws: printable ASCII plus the four extras verified in the latin subset.
const FONT_CHARS = new Set([...Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)), '·', '×', '—', '−']);
const shades = new Map();
function shade(fg) {
  if (!shades.has(fg)) {
    const c = document.createElement('canvas'); c.width = c.height = 4;
    const p = c.getContext('2d'); p.fillStyle = fg; p.fillRect(0, 0, 2, 2);
    shades.set(fg, g.createPattern(c, 'repeat'));
  }
  return shades.get(fg);
}
function stroke(pts, lw = 2) {
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.lineWidth = lw; g.stroke();
}
function drawLight(x, y, m) {
  if (m & L) g.fillRect(x, y + LY, LX + 2, 2);
  if (m & R) g.fillRect(x + LX, y + LY, CW - LX, 2);
  if (m & U) g.fillRect(x + LX, y, 2, LY + 2);
  if (m & D) g.fillRect(x + LX, y + LY, 2, CH - LY);
}
function drawRound(x, y, m) {
  const cx = x + MX, cy = y + MY, r = 8, sx = m & R ? 1 : -1, sy = m & D ? 1 : -1;
  g.beginPath(); g.moveTo(m & R ? x + CW : x, cy); g.lineTo(cx + sx * r, cy);
  g.arcTo(cx, cy, cx, cy + sy * r, r); g.lineTo(cx, m & D ? y + CH : y);
  g.lineWidth = 2; g.lineCap = 'butt'; g.stroke();
}
function drawDouble(x, y, m) {
  const a = x + LX - 3, b = x + LX + 3, p = y + LY - 3, q = y + LY + 3;   // outer/inner columns and rows
  if (m === (R | L)) { g.fillRect(x, p, CW, 2); g.fillRect(x, q, CW, 2); return; }
  if (m === (U | D)) { g.fillRect(a, y, 2, CH); g.fillRect(b, y, 2, CH); return; }
  // corners: the outer stroke turns on the far lines, the inner one on the near lines
  const right = m & R, down = m & D;
  const vo = right ? a : b, vi = right ? b : a, ho = down ? p : q, hi = down ? q : p;
  const hx = (v, w) => right ? [v, x + CW - v] : [x, v + 2 - x];
  const vy = (h) => down ? [h, y + CH - h] : [y, h + 2 - y];
  let [x0, w0] = hx(vo), [y0, h0] = vy(ho);
  g.fillRect(x0, ho, w0, 2); g.fillRect(vo, y0, 2, h0);
  [x0, w0] = hx(vi); [y0, h0] = vy(hi);
  g.fillRect(x0, hi, w0, 2); g.fillRect(vi, y0, 2, h0);
}
// Symbols sit on the text's optical centre (y+17), a pixel under the box lines' centre.
const SYM = {
  '▀': (x, y) => g.fillRect(x, y, CW, CH / 2),
  '▄': (x, y) => g.fillRect(x, y + CH / 2, CW, CH / 2),
  '▕': (x, y) => g.fillRect(x + CW - 2, y + BAR_Y, 2, BAR_H),
  '░': (x, y, fg, pix) => { g.fillStyle = shade(fg); pix ? g.fillRect(x, y, CW, CH) : g.fillRect(x, y + BAR_Y, CW, BAR_H); },
  '→': (x, y) => { g.fillRect(x + 2, y + 16, 14, 2); stroke([[x + 10.5, y + 11.5], [x + 16, y + 17], [x + 10.5, y + 22.5]]); },
  '←': (x, y) => { g.fillRect(x + 2, y + 16, 14, 2); stroke([[x + 7.5, y + 11.5], [x + 2, y + 17], [x + 7.5, y + 22.5]]); },
  '↻': (x, y) => {
    const cx = x + MX, cy = y + 17.5, r = 6, a0 = -Math.PI / 2 + 0.5, a1 = -Math.PI / 2 + 2 * Math.PI - 0.45;
    g.beginPath(); g.arc(cx, cy, r, a0, a1); g.lineWidth = 2; g.stroke();
    const ex = cx + r * Math.cos(a1), ey = cy + r * Math.sin(a1), tx = -Math.sin(a1), ty = Math.cos(a1);
    g.beginPath(); g.moveTo(ex + tx * 5, ey + ty * 5);
    g.lineTo(ex - tx * 1.5 - ty * 4, ey - ty * 1.5 + tx * 4); g.lineTo(ex - tx * 1.5 + ty * 4, ey - ty * 1.5 - tx * 4);
    g.closePath(); g.fill();
  },
  '●': (x, y) => { g.beginPath(); g.arc(x + MX, y + 17, 6.5, 0, 2 * Math.PI); g.fill(); },
  '○': (x, y) => { g.beginPath(); g.arc(x + MX, y + 17, 6, 0, 2 * Math.PI); g.lineWidth = 2; g.stroke(); },
  '■': (x, y) => g.fillRect(x + 3, y + 11, 12, 12),
  '▸': (x, y) => { g.beginPath(); g.moveTo(x + 6, y + 11.5); g.lineTo(x + 14, y + 17); g.lineTo(x + 6, y + 22.5); g.closePath(); g.fill(); },
  '✓': (x, y) => stroke([[x + 3, y + 17.5], [x + 7.5, y + 22.5], [x + 15, y + 10.5]], 2.5),
  '✗': (x, y) => { stroke([[x + 4, y + 11], [x + 14, y + 23]], 2.5); stroke([[x + 14, y + 11], [x + 4, y + 23]], 2.5); },
};
function drawCell(ch, x, y, fg, bold, pix) {
  g.fillStyle = fg; g.strokeStyle = fg;
  if (LIGHT[ch]) return drawLight(x, y, LIGHT[ch]);
  if (ROUND[ch]) return drawRound(x, y, ROUND[ch]);
  if (DOUBLE[ch]) return drawDouble(x, y, DOUBLE[ch]);
  if (EIGHTH[ch]) return pix ? g.fillRect(x, y, Math.round(CW * EIGHTH[ch] / 8), CH) : g.fillRect(x, y + BAR_Y, Math.round(CW * EIGHTH[ch] / 8), BAR_H);
  if (SYM[ch]) return SYM[ch](x, y, fg, pix);
  const cp = ch.codePointAt(0);
  if (cp >= 0x2800 && cp <= 0x28ff) {
    BRAILLE_DOTS.forEach(([dc, dr], k) => {
      if ((cp - 0x2800) & (1 << k)) { g.beginPath(); g.arc(x + 5 + dc * 8, y + 6.5 + dr * 6.5, 2.6, 0, 2 * Math.PI); g.fill(); }
    });
    return;
  }
  if (!FONT_CHARS.has(ch)) throw new Error(`no glyph for U+${cp.toString(16).toUpperCase()} "${ch}"`);
  g.font = `${bold ? 600 : 400} ${FS}px ${FONT}`;
  g.fillText(ch, x, y + BASE);
}

// Paint the buffer: cell backgrounds (merged into runs), then one glyph per cell.
function paint() {
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const bg = cellBg[r * COLS + c];
      if (!bg) { c++; continue; }
      let e = c + 1; while (e < COLS && cellBg[r * COLS + e] === bg) e++;
      g.fillStyle = bg; g.fillRect(GX + c * CW, GY + r * CH, (e - c) * CW, CH);
      c = e;
    }
  }
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  for (let i = 0; i < N; i++) {
    const ch = cellCh[i];
    if (ch === ' ') continue;
    drawCell(ch, GX + (i % COLS) * CW, GY + Math.floor(i / COLS) * CH, cellFg[i], cellWt[i], cellPix[i]);
  }
}

// ── window chrome: the title bar (outside the grid) ──────────────────────────────────────────────
function titleBar(title) {
  g.fillStyle = C.bar; g.fillRect(0, 0, W, TITLE_H);
  g.fillStyle = C.barLine; g.fillRect(0, TITLE_H - 1, W, 1);
  g.fillStyle = C.dots;
  for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(26 + k * 22, TITLE_H / 2, 6, 0, 2 * Math.PI); g.fill(); }
  // title text: one glyph per 12 px step (20 px type), centred
  g.font = `400 20px ${FONT}`; g.fillStyle = C.dim; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const chars = [...title], x0 = Math.round(W / 2 - chars.length * 6);
  chars.forEach((ch, i) => {
    if (!FONT_CHARS.has(ch)) throw new Error(`no glyph for "${ch}"`);
    if (ch !== ' ') g.fillText(ch, x0 + i * 12, 27);
  });
}

// ── block letters: an original 5 x 7 pixel font, two pixel rows per text row (▀ ▄ █) ──────────────
const PIX = {
  A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
  B: ['11110', '10001', '10001', '11110', '10001', '10001', '11110'],
  D: ['11100', '10010', '10001', '10001', '10001', '10010', '11100'],
  E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
  H: ['10001', '10001', '10001', '11111', '10001', '10001', '10001'],
  I: ['01110', '00100', '00100', '00100', '00100', '00100', '01110'],
  L: ['10000', '10000', '10000', '10000', '10000', '10000', '11111'],
  M: ['10001', '11011', '10101', '10101', '10001', '10001', '10001'],
  N: ['10001', '10001', '11001', '10101', '10011', '10001', '10001'],
  O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'],
  R: ['11110', '10001', '10001', '11110', '10100', '10010', '10001'],
  S: ['01111', '10000', '10000', '01110', '00001', '00001', '11110'],
  T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
  0: ['01110', '10001', '10011', '10101', '11001', '10001', '01110'],
  1: ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
  2: ['01110', '10001', '00001', '00010', '00100', '01000', '11111'],
  3: ['01110', '10001', '00001', '00110', '00001', '10001', '01110'],
  4: ['00010', '00110', '01010', '10010', '11111', '00010', '00010'],
  5: ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
  6: ['00110', '01000', '10000', '11110', '10001', '10001', '01110'],
  7: ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
  8: ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
  9: ['01110', '10001', '10001', '01111', '00001', '00010', '01100'],
  '$': ['00100', '01111', '10100', '01110', '00101', '11110', '00100'],
  '.': ['00000', '00000', '00000', '00000', '00000', '01100', '01100'],
  '%': ['11000', '11001', '00010', '00100', '01000', '10011', '00011'],
  '−': ['00000', '00000', '00000', '11111', '00000', '00000', '00000'],
  '×': ['00000', '10001', '01010', '00100', '01010', '10001', '00000'],
  ' ': ['00000', '00000', '00000', '00000', '00000', '00000', '00000'],
};
const on = (ch, r, k) => r < 7 && PIX[ch][r][k] === '1';
const bigWidth = (s, scale = 1) => len(s) * (5 + 1) * scale - scale;
// 1x: each glyph is 5 cols x 4 rows of half blocks. 2x: each font pixel is 2 cols x 1 row of full blocks.
function big(col, row, s, fg, scale = 1) {
  for (const ch of s) {
    if (!PIX[ch]) throw new Error(`no block glyph for "${ch}"`);
    for (let k = 0; k < 5; k++) {
      if (scale === 1) {
        for (let tr = 0; tr < 4; tr++) {
          const top = on(ch, 2 * tr, k), bot = on(ch, 2 * tr + 1, k);
          if (top || bot) put(col + k, row + tr, top && bot ? '█' : top ? '▀' : '▄', fg, 0, undefined, 1);
        }
      } else {
        for (let r = 0; r < 7; r++) if (on(ch, r, k)) put(col + 2 * k, row + r, '██', fg, 0, undefined, 1);
      }
    }
    col += 6 * scale;
  }
}

// ── panels ───────────────────────────────────────────────────────────────────────────────────────
// Rounded light border with the title set into the top edge: ╭─ title ──────╮. Content goes through
// text(), which places it on an inner row and throws if it would not fit inside the border and padding.
function panel(p, color = C.border) {
  const { c, r, w, h, title } = p;
  put(c, r, '╭' + '─'.repeat(w - 2) + '╮', color);
  for (let y = r + 1; y < r + h - 1; y++) { put(c, y, '│', color); put(c + w - 1, y, '│', color); }
  put(c, r + h - 1, '╰' + '─'.repeat(w - 2) + '╯', color);
  put(c + 2, r, ' ' + title + ' ', C.text, 1);
}
function focusPanel(p) {
  const { c, r, w, h, title } = p;
  put(c, r, '╔' + '═'.repeat(w - 2) + '╗', C.focus);
  for (let y = r + 1; y < r + h - 1; y++) { put(c, y, '║', C.focus); put(c + w - 1, y, '║', C.focus); }
  put(c, r + h - 1, '╚' + '═'.repeat(w - 2) + '╝', C.focus);
  put(c + 2, r, ' ' + title + ' ', C.focus, 1);
}
const inner = p => p.w - 4;
function text(p, row, parts, align = 'left', bg) {
  const n = width(parts), room = inner(p);
  if (n > room) throw new Error(`"${parts.map(q => q[0]).join('')}" (${n}) overflows ${p.title} (${room})`);
  if (row < 0 || row > p.h - 3) throw new Error(`row ${row} outside ${p.title}`);
  const col = align === 'right' ? p.c + 2 + room - n : align === 'center' ? p.c + 2 + Math.floor((room - n) / 2) : p.c + 2;
  line(col, p.r + 1 + row, parts, bg);
}
// Absolute placement inside a panel, with the same overflow check.
function place(p, col, row, parts) {
  if (col < p.c + 2 || col + width(parts) > p.c + p.w - 2) throw new Error(`"${parts.map(q => q[0]).join('')}" overflows ${p.title}`);
  line(col, row, parts);
}
// Fill the inside of a panel with blank cells on a solid background (dialogs).
function clearInside(p, bg) {
  for (let y = p.r; y < p.r + p.h; y++) put(p.c, y, ' '.repeat(p.w), C.text, 0, bg);
}
// A bar of `cells` (float) filled cells in eighth steps over a dim shaded track `n` cells long, as parts.
const PARTIAL = ['', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
function barParts(cells, n, fg, track = C.dim, pix = 0) {
  const q = Math.round(clamp(cells, 0, n) * 8), full = Math.floor(q / 8), rem = q % 8;
  const used = full + (rem ? 1 : 0);
  const parts = [['█'.repeat(full) + PARTIAL[rem], fg, 0, pix]];
  if (track && used < n) parts.push(['░'.repeat(n - used), track, 0, pix]);
  else if (used < n) parts.push([' '.repeat(n - used), fg]);
  return parts;
}
const gauge = (cells, n, fg) => [['▕', C.dim], ...barParts(cells, n, fg), ['▏', C.dim]];
function effortParts(level) {
  const k = { low: 1, med: 2, high: 3 }[level] || 0;
  return [['█'.repeat(k), C.text], ['░'.repeat(3 - k), C.dim], [' ' + (level || '—'), level ? C.text : C.dim]];
}

// ── header strip, bottom bar, cursor ─────────────────────────────────────────────────────────────
function strip(row, bg) { for (let c = 0; c < COLS; c++) cellBg[row * COLS + c] = bg; }
// Key/flag chips, right-aligned so the last one ends at column `right`. A pressed chip shows inverse.
function chips(row, right, list, pressed) {
  const total = list.reduce((n, s) => n + len(s) + 2, 0) + (list.length - 1);
  const first = right - total + 1;
  let col = first;
  for (const s of list) {
    const hit = s === pressed;
    col = put(col, row, ` ${s} `, hit ? C.field : C.cdim, hit ? 1 : 0, hit ? C.focus : C.chip) + 1;
  }
  return first;
}
// The block cursor is not a glyph: a filled cell painted over the buffer.
let cursor = null;
function paintCursor() {
  if (!cursor) return;
  g.fillStyle = cursor.fg; g.fillRect(GX + cursor.col * CW, GY + cursor.row * CH + 2, CW, CH - 4);
}

// ── the typed command ────────────────────────────────────────────────────────────────────────────
// Key times with seeded jitter, scaled to fill T_TYPE exactly; the command grows by whole characters.
const PROMPT = '~/bench', CMD = './route --task refactor --effort auto';
const T_TYPE = [0.45, 1.45], T_ENTER = 1.5;
const KEY_T = (() => {
  const gaps = [...CMD].map((ch, i) => (0.65 + 0.7 * hash(i, 77)) * (ch === ' ' ? 1.3 : 1));
  const sum = gaps.reduce((a, b) => a + b, 0) - gaps[0];
  let acc = 0;
  return gaps.map((d, i) => { if (i) acc += d; return T_TYPE[0] + (T_TYPE[1] - T_TYPE[0]) * acc / sum; });
})();
const typed = t => KEY_T.filter(k => at(t, k)).length;

// ── the run (seconds of film time) ───────────────────────────────────────────────────────────────
// On Enter each panel's contents print whole in turn and the run plays out until it completes at 5.66;
// at 5.92 [c] is pressed and the cost view shows the settled result from 6.00; at 8.03 [o] returns to
// the finished overview; a dialog prints at 8.40 and holds until the fade.
const PRINT = { planner: 1.53, router: 1.60, workers: 1.67, log: 1.74, cost: 1.81 };
const T_KEY_C = 5.92, T_COST = 6.0, T_KEY_O = 8.03, T_BACK = 8.1, T_DIALOG = 8.4, T_FADE = [9.8, 10.4];
const BAR_ALL = [6.05, 6.60], BAR_ROUTED = [6.65, 7.05], T_SAVING = 7.10, T_CAPTION = 7.17, T_DONE = 5.66;
const TASK = { t01: 'parse config', t02: 'write tests', t03: 'fix lint', t04: 'update docs', t05: 'refactor auth',
  t06: 'migrate schema', t07: 'bump deps', t08: 'review diff', t09: 'summarize logs' };
// Routing decisions: time, task, target, gauge values (complexity, context, risk), kind.

// ── live state, all derived from t ───────────────────────────────────────────────────────────────

window.draw = ({ t }) => { frame(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
</script>
