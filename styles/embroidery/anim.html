<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ── embroidery · hand embroidery & cross-stitch in a wooden hoop ───────────────────────
// Close-up on a slack linen hoop → the tension screw turns and the cloth snaps taut → a needle stitches a flower:
// stem stitch, fishbone leaves, satin petals, French-knot centre and seed clusters → the hoop is lifted away and an
// aida hoop is set down → a heart and "Made with patience." are cross-stitched cell by cell (half-cross row, then
// the return legs), a backstitch wave underlines it → the camera pulls back to reveal both hoops on a work table.
// Everything is procedural and depends only on t (seeded hashes, no Math.random).
const W = 1920, H = 1080, DUR = 10.0, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eInOut = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const eOut = u => 1 - Math.pow(1 - u, 3);
const eIn = u => u * u * u;
const eBack = u => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };

const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

  const a = hash2(i, j, s), b = hash2(i + 1, j, s), c = hash2(i, j + 1, s), d = hash2(i + 1, j + 1, s);
  return lerp(lerp(a, b, sx), lerp(c, d, sx), sy); }

const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgbS = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixC = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const shadeC = (c, f) => f >= 0 ? mixC(c, [255, 250, 240], f) : mixC(c, [20, 10, 8], -f);
// thread colour triplet: body, dark core/edge, sheen highlight
const TC = h => { const c = typeof h === 'string' ? hex(h) : h; return { b: rgbS(c), d: rgbS(shadeC(c, -.42)), l: rgbS(shadeC(c, .5)), t: rgbS(shadeC(c, -.28), .55) }; };

// ── world layout ────────────────────────────────────────────────────────────────────────
const PX = 2.4;                       // texture px per world unit (hoops)
const R_IN = 200, R_OUT = 226;        // fabric window radius, outer ring radius
const FS = 600;                       // fabric square size (world)
const CELL = 6.5;                     // aida / cross-stitch cell
const T = { fadeIn: .5, tautA: .1, tautB: .85, needleIn: .5, stem: .82, leaf1: 1.32, leaf2: 1.8, petals: 2.28, knots: 3.88, seeds: 4.12, needleOut: 4.42,
  swapA: 4.55, swapB: 5.6, heart: 5.66, text: 5.92, wave: 7.32, zoom: 7.55, zoomEnd: 9.05, fade: 9.3 };
const A_END = { x: -650, y: 70, r: deg(-11) };  // where the flower hoop is set down on the table
const B_START = { x: 1050, y: -60, r: deg(9) };

// ── linen / aida textures (pixel-level weave) ──────────────────────────────────────────
function fabricTex(kind) {
  const N = Math.round(FS * PX), c = mk(N, N), x = c.getContext('2d'), img = x.createImageData(N, N), D = img.data;
  const base = kind === 'linen' ? [214, 199, 170] : [241, 235, 221], gap = kind === 'linen' ? [118, 98, 72] : [150, 136, 112];
  const pp = 2.1 * PX, hs = FS / 2 - 18;

    let val, tone;

      const thW = .5 + .42 * vn(i * 1.7 + .5, v / 6, 11), thH = .5 + .42 * vn(j * 1.7 + .5, u / 6, 12);
      const a = Math.abs(fu - .5) * 2 / thW, b = Math.abs(fv - .5) * 2 / thH, over = (i + j) & 1;
      let wa = a < 1 ? Math.sqrt(1 - a * a) : 0, we = b < 1 ? Math.sqrt(1 - b * b) : 0;
      wa *= over ? 1 - .45 * (fv - .5) * (fv - .5) * 4 : .5; we *= over ? .5 : 1 - .45 * (fu - .5) * (fu - .5) * 4;
      val = Math.max(wa, we); tone = (wa > we ? .9 + .18 * hash2(i, 0, 3) : .9 + .18 * hash2(j, 0, 4));
    } else {
      const gx = wx / CELL, gy = wy / CELL, fx = gx - Math.floor(gx), fy = gy - Math.floor(gy);
      const dx = Math.min(fx, 1 - fx), dy = Math.min(fy, 1 - fy), dh = Math.hypot(dx, dy);
      const sx = fx * 4, sy = fy * 4, si = Math.floor(sx), sj = Math.floor(sy), ov = (si + sj) & 1;
      const pa = Math.abs(sx - si - .5) * 2, pb = Math.abs(sy - sj - .5) * 2;

      sh *= 1 - .38 * Math.exp(-(r - R_OUT) / 7) * (.6 + .4 * Math.max(0, (wx + wy) / (r + 1e-3)));
    } else if (r < R_IN + 2) {
      const lit = (-wx - wy) / (r * 1.414 + 1e-3);           // top-left of the window sits under the ring's shadow
      sh *= 1 - .3 * smooth(clamp((r - (R_IN - 20)) / 20)) * (.35 + .65 * Math.max(0, lit));
    }
    sh *= 1.03 - .08 * ((wx + wy) / FS + .5);              // key light from the top-left
    col = col.map(q => q * sh);
    // frayed, slightly wavy square edge
    const ed = Math.max(Math.abs(wx + 3 * Math.sin(wy / 37)), Math.abs(wy + 3 * Math.sin(wx / 41)));
    let al = clamp((hs - ed) * PX * .7);
    if (ed > hs - 1 && ed < hs + 8) { const side = Math.abs(wx) > Math.abs(wy), cu = (side ? py : px) / pp, ci = Math.floor(cu), on = Math.abs(cu - ci - .5) < .3;
      const hq = hash2(ci, side ? 1 : 2, 5), ln = hq < .5 ? 0 : .5 + 7 * Math.pow(hash2(ci, 3, 6), 3) + 2 * vn(ci * .3, 0, 8); if (on && ed - hs < ln) al = Math.max(al, .95); }
    const o = (py * N + px) * 4; D[o] = col[0]; D[o + 1] = col[1]; D[o + 2] = col[2]; D[o + 3] = al * 255;
  }
  x.putImageData(img, 0, 0); return c;
}

// ── wooden hoop ring with brass clasp ─────────────────────────────────────────────────
function ringTex(seed) {
  const M = R_OUT + 34, N = Math.round(M * 2 * PX), c = mk(N, N), x = c.getContext('2d'), r = rng(seed);
  x.translate(N / 2, N / 2); x.scale(PX, PX);
  const annulus = (r0, r1) => { x.beginPath(); x.arc(0, 0, r1, 0, TAU); x.arc(0, 0, r0, 0, TAU, true); };
  // inner ring (visible lip) then outer ring
  for (const [r0, r1, tint] of [[R_IN - 1, R_IN + 7, 1.06], [R_IN + 7, R_OUT, 1]]) {
    x.save(); annulus(r0, r1); x.clip();
    const g = x.createRadialGradient(0, 0, r0, 0, 0, r1);
    g.addColorStop(0, `rgb(${150 * tint},${104 * tint},${62 * tint})`); g.addColorStop(.45, `rgb(${214 * tint},${168 * tint},${112 * tint})`);
    g.addColorStop(.7, `rgb(${201 * tint},${153 * tint},${99 * tint})`); g.addColorStop(1, `rgb(${132 * tint},${88 * tint},${52 * tint})`);
    x.fillStyle = g; x.fillRect(-M, -M, 2 * M, 2 * M);
    for (let k = 0; k < 90; k++) {            // wood grain arcs
      const rr = lerp(r0, r1, r()), a0 = r() * TAU, len = .3 + r() * 1.6;
      x.strokeStyle = `rgba(${90 + r() * 30},${52 + r() * 20},${24},${.12 + r() * .22})`; x.lineWidth = .25 + r() * .7;
      x.beginPath(); x.arc(0, 0, rr, a0, a0 + len); x.stroke();
    }
    const lg = x.createLinearGradient(-M, -M, M, M);
    lg.addColorStop(0, 'rgba(255,240,215,.34)'); lg.addColorStop(.5, 'rgba(255,240,215,0)'); lg.addColorStop(1, 'rgba(40,20,5,.34)');
    x.fillStyle = lg; x.fillRect(-M, -M, 2 * M, 2 * M);
    x.restore();
    x.strokeStyle = 'rgba(70,40,18,.55)'; x.lineWidth = .7; x.beginPath(); x.arc(0, 0, r1, 0, TAU); x.stroke();
  }
  x.strokeStyle = 'rgba(255,235,200,.35)'; x.lineWidth = .5; x.beginPath(); x.arc(0, 0, R_OUT - 5, deg(185), deg(265)); x.stroke();

  const lug = (x0) => {
    const g = x.createLinearGradient(x0, 0, x0 + 8, 0); g.addColorStop(0, '#8a6a2c'); g.addColorStop(.35, '#e6c878'); g.addColorStop(1, '#7a5a20');

    x.fillStyle = g; x.beginPath(); x.roundRect(x0, -R_OUT - 22, 8, 30, 2); x.fill();

  x.fillStyle = rg; x.fillRect(-19, -R_OUT - 16, 38, 8);
  x.strokeStyle = 'rgba(40,40,40,.5)'; x.lineWidth = .35; for (let k = -18; k < 19; k += 1.6) { x.beginPath(); x.moveTo(k, -R_OUT - 16); x.lineTo(k + 1, -R_OUT - 8); x.stroke(); }

}
function shadowTex() {
  const M = FS / 2 + 60, N = Math.round(M * 2 * 1.2), c = mk(N, N), x = c.getContext('2d');
  x.translate(N / 2, N / 2); x.scale(1.2, 1.2); x.filter = 'blur(18px)';
  x.fillStyle = 'rgba(25,12,4,.55)'; x.fillRect(-FS / 2 + 16, -FS / 2 + 16, FS - 32, FS - 32);
  x.filter = 'blur(7px)'; x.fillStyle = 'rgba(25,12,4,.5)'; x.beginPath(); x.arc(0, 0, R_OUT + 4, 0, TAU); x.fill();

}
function wrinkleTex() {

  x.translate(N / 2, N / 2); x.scale(PX, PX); x.beginPath(); x.arc(0, 0, R_IN, 0, TAU); x.clip();

// ── work table with props (baked once) ──────────────────────────────────────────────────
const TB = { x0: -1400, y0: -780, w: 2500, h: 1560, px: 1.45 };
function tableTex() {
  const NW = Math.round(TB.w * TB.px), NH = Math.round(TB.h * TB.px), c = mk(NW, NH), x = c.getContext('2d'), img = x.createImageData(NW, NH), D = img.data;
  const PL = 250;
  for (let py = 0; py < NH; py++) { const wy = py / TB.px + TB.y0, pk = Math.floor((wy + 900) / PL), fy = ((wy + 900) % PL) / PL;
    for (let px = 0; px < NW; px++) {
      const wx = px / TB.px + TB.x0 + pk * 613;
      const g = fbm(wx / 260, wy / 11 + pk * 17, 40 + pk), g2 = vn(wx / 30, wy / 2.2 + pk * 9, 50);
      const rings = Math.sin((wy / 6.5 + g * 9 + wx / 900) * 1.0) * .5 + .5;
      let v = .78 + .16 * g + .1 * rings * g2 - .05 * g2;
      const seam = Math.min(fy, 1 - fy) * PL; if (seam < 3) v *= .45 + .55 * seam / 3; else if (seam < 9) v *= .93 + .07 * (seam - 3) / 6;
      v *= .92 + .12 * hash2(pk, 0, 61); const n = (hash2(px, py, 62) - .5) * 7, o = (py * NW + px) * 4;
      D[o] = 132 * v + n; D[o + 1] = 90 * v + n; D[o + 2] = 56 * v + n; D[o + 3] = 255; } }

  // spool lying on its side
  const spool = (cx, cy, rot, col, len = 150, dia = 64) => shadow(sh => {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    const C = hex(col);
    if (sh) { x.fillStyle = '#000'; x.fillRect(-len / 2 - 8, -dia / 2 - 7, len + 16, dia + 14); x.restore(); return; }
    const g = x.createLinearGradient(0, -dia / 2, 0, dia / 2);
    g.addColorStop(0, rgbS(shadeC(C, -.35))); g.addColorStop(.28, rgbS(shadeC(C, .28))); g.addColorStop(.55, rgbS(C)); g.addColorStop(1, rgbS(shadeC(C, -.5)));
    x.fillStyle = g; x.fillRect(-len / 2 + 6, -dia / 2, len - 12, dia);
    x.strokeStyle = rgbS(shadeC(C, -.3), .5); x.lineWidth = .7;
    for (let k = -len / 2 + 7; k < len / 2 - 6; k += 2.2) { x.beginPath(); x.moveTo(k, -dia / 2); x.lineTo(k + 1.4, dia / 2); x.stroke(); }
    for (const e of [-1, 1]) { const fx = e * (len / 2 - 3), wg = x.createLinearGradient(0, -dia / 2 - 7, 0, dia / 2 + 7);
      wg.addColorStop(0, '#7b5230'); wg.addColorStop(.3, '#d8aa74'); wg.addColorStop(1, '#6a4524');
      x.fillStyle = wg; x.beginPath(); x.roundRect(fx - 7, -dia / 2 - 7, 14, dia + 14, 4); x.fill(); x.strokeStyle = 'rgba(60,35,15,.6)'; x.lineWidth = .8; x.stroke(); }
    // loose end of thread
    x.strokeStyle = rgbS(C); x.lineWidth = 1.6; x.beginPath(); x.moveTo(len / 2 - 22, dia / 2 - 2); x.bezierCurveTo(len / 2 + 10, dia / 2 + 40, len / 2 - 60, dia / 2 + 70, len / 2 - 10, dia / 2 + 110); x.stroke();
    x.restore(); }, 9, 13, 9, .5);
  // skein of floss with a blank paper band
  const skein = (cx, cy, rot, col) => shadow(sh => {
    x.save(); x.translate(cx, cy); x.rotate(rot); const C = hex(col), r = rng(91);
    if (sh) { x.strokeStyle = '#000'; x.lineWidth = 16; x.beginPath(); x.ellipse(-120, 0, 30, 12, 0, 0, TAU); x.ellipse(120, 0, 30, 12, 0, 0, TAU); x.moveTo(-100, 0); x.lineTo(100, 0); x.stroke(); x.restore(); return; }
    for (const e of [-1, 1]) for (let k = 0; k < 16; k++) { x.strokeStyle = rgbS(shadeC(C, (r() - .55) * .5), .9); x.lineWidth = 1.2 + r() * .6;
      x.beginPath(); x.ellipse(e * 122, 0, 26 + r() * 5, 9 + r() * 3, (r() - .5) * .2, 0, TAU); x.stroke(); }
    for (let k = 0; k < 44; k++) { const o = (r() - .5) * 14, ph = r() * TAU;
      x.strokeStyle = rgbS(shadeC(C, (r() - .55) * .6), .95); x.lineWidth = 1.2 + r() * .8; x.beginPath();
      for (let q = 0; q <= 40; q++) { const xx = -100 + q * 5, yy = o * (.55 + .45 * Math.cos(xx / 30 + ph)); q ? x.lineTo(xx, yy) : x.moveTo(xx, yy); } x.stroke(); }
    const bg = x.createLinearGradient(0, -13, 0, 13); bg.addColorStop(0, '#e9dcc0'); bg.addColorStop(.5, '#f7eedc'); bg.addColorStop(1, '#c9b794');
    x.fillStyle = bg; x.beginPath(); x.roundRect(-26, -13, 52, 26, 2); x.fill();
    x.fillStyle = rgbS(C, .85); x.fillRect(-26, -3, 52, 6);
    x.restore(); }, 8, 12, 8, .45);

    const metal = g => { g.addColorStop(0, '#6f6a60'); g.addColorStop(.45, '#f1ece0'); g.addColorStop(1, '#5a554b'); return g; };
    const blade = (s) => { x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(70, s * 10, 150, s * 2.5); x.lineTo(152, 0); x.quadraticCurveTo(80, s * 1, 0, -s * 5); x.closePath(); };
    const ring = (s) => { x.beginPath(); x.ellipse(-44, s * 20, 24, 17, s * .35, 0, TAU); x.ellipse(-44, s * 20, 15, 9.5, s * .35, 0, TAU, true); };

      x.beginPath(); x.moveTo(0, s * 4); x.lineTo(-24, s * 14); x.lineTo(-20, s * 6); x.closePath(); x.fill(); }
    if (!sh) { x.strokeStyle = 'rgba(50,45,40,.6)'; x.lineWidth = .8; for (const s of [-1, 1]) { blade(s); x.stroke(); ring(s); x.stroke(); }
      const sg = x.createRadialGradient(-1, -1, 0, 0, 0, 5); sg.addColorStop(0, '#fff'); sg.addColorStop(1, '#6d675c'); x.fillStyle = sg; x.beginPath(); x.arc(0, 0, 4.5, 0, TAU); x.fill(); }
    x.restore(); }, 7, 11, 6, .5);
  spool(470, -300, deg(-8), '#b8455a'); spool(575, -150, deg(14), '#6f8f4e', 140, 58); spool(420, 30, deg(-24), '#2f4476', 130, 56);
  skein(520, 240, deg(-18), '#d9a33a'); scissors(400, 400, deg(-150));

  for (const [cx, cy, col] of [[330, 190, '#b8455a'], [-230, 330, '#6f8f4e'], [250, -390, '#2f4476'], [-300, -300, '#d9a33a']]) {
    x.strokeStyle = 'rgba(30,15,5,.3)'; x.lineWidth = 2.4; const pts = []; let px = cx, py = cy, a = lr() * TAU;

// ── stitch geometry ────────────────────────────────────────────────────────────────────
const SA = [], SB = [];               // stitch lists (hoop-local coords), each sorted by t0
const addS = (L, o) => { L.push(o); return o; };
function schedule(list, t0, t1, overlap = 2.2) {   // spread a group of stitches over [t0,t1]
  const n = list.length, step = (t1 - t0) / n;
  list.forEach((s, i) => { s.t0 = t0 + i * step; s.d = Math.max(step * overlap, .045); });
}

    pre: x => { const w = 1 - eBack(taut); if (Math.abs(w) > .01) { x.globalAlpha = clamp(Math.abs(w) * 1.4); const s = 1 + .04 * w; x.drawImage(WRINKLE, -R_IN * s, -R_IN * s, 2 * R_IN * s, 2 * R_IN * s); x.globalAlpha = 1; } },
    post: x => { screwKnob(x, t); if (t < T.swapA + .2) needle(x, SA, t, T.needleIn, T.needleOut, null); } });
  if (visible(hB)) drawHoop(x, FAB_B, RING_B, hB, SB, t, {
    post: x => { screwKnob(x, 0); if (t > T.heart - .35) needle(x, SB, t, T.heart - .35, 0, { t0: T.wave + .62, x: 176, y: 70 }); } });
  // grade: warm window light, vignette, grain, fades
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'soft-light'; x.drawImage(VIGN, 0, 0); x.globalCompositeOperation = 'source-over';
  x.globalAlpha = .5; x.drawImage(VIGN, 0, 0); x.globalAlpha = 1;
  x.globalCompositeOperation = 'overlay'; x.globalAlpha = .16; x.drawImage(GRAIN[Math.floor(t * 30) % 6], 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  const fade = Math.max(1 - eOut(seg(t, 0, T.fadeIn)), eInOut(seg(t, T.fade, DUR - .05)) * .96);
  if (fade > 0) { x.fillStyle = `rgba(22,14,8,${fade})`; x.fillRect(0, 0, W, H); }
}
function buildGrade() {
  VIGN = mk(W, H); const v = VIGN.getContext('2d');
  const g = v.createRadialGradient(W * .38, H * .32, 80, W * .5, H * .5, W * .72);
  g.addColorStop(0, 'rgba(255,236,200,.22)'); g.addColorStop(.55, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(20,10,4,.55)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
  for (let k = 0; k < 6; k++) { const c = mk(W / 2, H / 2), gx = c.getContext('2d'), im = gx.createImageData(W / 2, H / 2), D = im.data, r = rng(500 + k);
    for (let i = 0; i < D.length; i += 4) { const q = 128 + (r() - .5) * 90; D[i] = D[i + 1] = D[i + 2] = q; D[i + 3] = 255; }
    gx.putImageData(im, 0, 0); const f = mk(W, H); f.getContext('2d').drawImage(c, 0, 0, W, H); GRAIN.push(f); }
}

window.ready = (async () => {
  buildA(); buildB();
  FAB_A = fabricTex('linen'); FAB_B = fabricTex('aida'); RING_A = ringTex(3); RING_B = ringTex(8);
  SHADOW = shadowTex(); WRINKLE = wrinkleTex(); TABLE = tableTex(); buildGrade();
  render(0);
})();
window.draw = ({ t }) => { render(t); return cv.toDataURL('image/jpeg', 0.92).split(',')[1]; };
// audio cue list (read by events.mjs → events.json → audio.py)
window.events = () => {
  const ev = [];
  for (let k = 0; k < 14; k++) ev.push({ t: T.tautA + eOut(k / 14) * (T.tautB - T.tautA) * .9, k: 'click' });
  ev.push({ t: T.tautB - .12, k: 'snap' });
  const stitchEv = (L, g) => { for (const s of L) ev.push(s.kind === 'k' ? { t: s.t0 + s.d * .4, k: 'knot' } : { t: s.t0, k: 'pull', d: s.d, v: g * Math.min(1, Math.hypot(s.x1 - s.x0, s.y1 - s.y0) / 30 + .35) }); };
  stitchEv(SA, 1); stitchEv(SB, .8);
  ev.push({ t: T.swapA, k: 'lift' }, { t: T.swapA + .3, k: 'whoosh', d: .9 }, { t: T.swapB - .12, k: 'knock' });
  ev.push({ t: T.zoom, k: 'whoosh', d: 1.5 }, { t: T.zoomEnd - .25, k: 'chord' });
  return ev.sort((a, b) => a.t - b.t);
};
